        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Web archives and the Wayback Machine for research&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-web_archives.jpg\" alt=\"Веб-архивы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Alanarce, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Archived_Website.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-web_archives.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;Wayback Machine, сохранение и сравнение страниц.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-web_archives.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Веб-мұрағаттар — веб-беттердің көшірмелерін ұзақ мерзімді сақтауды және оларға қолжетімділікті қамтамасыз ететін ақпараттық жүйелер. Мұндай жүйелердің негізгі міндеті «цифрлық қараңғы ғасыр» және «өлі» сілтемелер мәселесіне қарсы тұру болып табылады. Бұл саладағы ең ірі құрал — 2001 жылы іске қосылған Wayback Machine, ол 2026 жылға қарай 1 триллионнан астам веб-бетті сақтап үлгерді.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-web_archives.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Веб-сайттарды мұрағаттау — ақпараттың сақталуын қамтамасыз ету үшін контентті жинау және көшірмелеу процесі. Оның негізінде белгілі бір уақыт сәтіндегі беттің статикалық көшірмелерін (snapshots) жасау принципі жатыр. Веб-мұрағаттар деректер қоймасы ретінде жұмыс істейді және желілік нысандардың күйін тіркейді.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-web_archives.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;Мұрағаттау процесі үш кезеңнен тұрады: аралау (crawling), индекстеу және сақтау. Арнайы робот-бағдарламалар веб-беттерге кіріп, олардың кодын және медиа файлдарын көшіреді, содан кейін уақыт белгісімен деректер базасына сақтайды.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-web_archives.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі құрал — Wayback Machine. OSINT мамандары үшін жұмыс әдісі ресми құжаттардағы, тізілімдердегі немесе жаңалықтар ленталарындағы өзгерістерді анықтау үшін беттердің тарихи нұсқаларын іздеуді қамтиды.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-web_archives.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Веб-мұрағаттар фактілерді тексеруде және ашық деректерді талдауда таптырмас құрал. Мысалы, «Шенеуніктер ғылыми зерттеулерді жою үшін есептерден сөздерді қалай өшіреді» мақаласында 2025 жылы NIH өтінімдерінен DEI туралы ескертпелер алынып тасталғаны сипатталған. Мұрағаттарды пайдалану зерттеушілерге осы құжаттардың түпнұсқаларын табуға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/proc-web_archives.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Веб-мұрағаттар деректердің 100% толықтығына кепілдік бермейді. Динамикалық контент, құпия сөзбен қорғалған бөлімдер және интерактивті элементтер көбінесе дұрыс сақталмайды. Сондай-ақ, сайт иесі robots.txt хаттамасы арқылы индекстеуге тыйым салуы мүмкін.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Веб-архивы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%92%D0%B5%D0%B1-%D1%81%D0%B0%D0%B9%D1%82%5D%20--%3E%7C%D0%BE%D0%B1%D1%85%D0%BE%D0%B4%7C%20B%5B%D0%A0%D0%BE%D0%B1%D0%BE%D1%82-%D1%81%D0%BA%D0%B0%D0%BD%D0%B5%D1%80%5D%0A%20%20B%20--%3E%7C%D0%BA%D0%BE%D0%BF%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%7C%20C%5B%D0%92%D0%B5%D0%B1-%D0%B0%D1%80%D1%85%D0%B8%D0%B2%5D%0A%20%20C%20--%3E%7C%D0%B8%D0%BD%D0%B4%D0%B5%D0%BA%D1%81%D0%B0%D1%86%D0%B8%D1%8F%7C%20D%5B%D0%91%D0%B0%D0%B7%D0%B0%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D1%85%5D%0A%20%20D%20--%3E%7C%D0%B7%D0%B0%D0%BF%D1%80%D0%BE%D1%81%7C%20E%5B%D0%9F%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%5D%0A%20%20E%20--%3E%7C%D0%BF%D1%80%D0%BE%D1%81%D0%BC%D0%BE%D1%82%D1%80%7C%20F%5B%D0%A1%D0%BD%D0%B8%D0%BC%D0%BE%D0%BA%20%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B8%D1%86%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-web_archives.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-data.html\"&gt;Ашық деректер&lt;/a&gt; — Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-legal_data.html\"&gt;Суды и законы&lt;/a&gt; — Открытые решения, законодательные базы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-web_archives.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Шенеуніктер есептен сөздерді алып тастап, ғылыми зерттеулерді қалай «жоқ қылады»&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-web_archives.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D1%80%D1%85%D0%B8%D0%B2%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5_%D0%B2%D0%B5%D0%B1-%D1%81%D0%B0%D0%B9%D1%82%D0%BE%D0%B2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Архивирование веб-сайтов — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Archived_Website.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Alanarce, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fmed.2023.1266429\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Social prescribing outcomes: a mapping review of the evidence from 13 countries to identify key common outcomes&lt;/a&gt; — шолу, Front Med (Lausanne) 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.healthpol.2011.05.010\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pharmacy assisted patient self care of minor ailments: a chronological review of UK health policy documents and key events 1997-2010&lt;/a&gt; — шолу, Health Policy 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-11-455\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Next generation tools for genomic data generation, distribution, and visualization&lt;/a&gt; — шолу, BMC Bioinformatics 2010&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Wayback Machine, сохранение и сравнение страниц."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Веб-архивы","description":"Wayback Machine, сохранение и сравнение страниц.","vcsPath":"concepts/proc-web_archives.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-web_archives.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-web_archives.html#sholu","level":2},{"title":"Теория","href":"concepts/proc-web_archives.html#teoriya","level":2},{"title":"Бұл қалай жұмыс істейді","href":"concepts/proc-web_archives.html#bul-khalaj-zhumys-istejdi","level":2},{"title":"Әдістер мен құралдар","href":"concepts/proc-web_archives.html#aedister-men-khuraldar","level":2},{"title":"Қайда қолданылады","href":"concepts/proc-web_archives.html#khajda-kholdanylady","level":2},{"title":"Шектеулер мен қауіптер","href":"concepts/proc-web_archives.html#shekteuler-men-khauipter","level":2},{"title":"Байланысты ұғымдар","href":"concepts/proc-web_archives.html#bajlanysty-ughymdar","level":2},{"title":"Қай жерде кездеседі","href":"concepts/proc-web_archives.html#khaj-zherde-kezdesedi","level":2},{"title":"Дереккөздер","href":"concepts
