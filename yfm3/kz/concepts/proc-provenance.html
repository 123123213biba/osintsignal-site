        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Content provenance with C2PA credentials and watermarks&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-provenance.jpg\" alt=\"Происхождение и водяные знаки\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет: Military Intelligence Division of the United States Department of War during World War II, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:ONI_JAN_1_Uniforms_and_Insignia_Page_004_German_Army_WW2_Field_gray_uniforms_officers_and_men._Field_caps,_national_emblem,_steel_helmet,_decals,_equipment,_tornister,_infantry_rifleman._June_1943_Field_recognition._US_public_doc._No_co.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"anykhtama\"&gt;&lt;a href=\"concepts/proc-provenance.html#anykhtama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтама&lt;/span&gt;&lt;/a&gt;Анықтама&lt;/h2&gt;\n&lt;p&gt;C2PA, цифровые подписи контента.&lt;/p&gt;\n&lt;h2 id=\"sholu\"&gt;&lt;a href=\"concepts/proc-provenance.html#sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу&lt;/span&gt;&lt;/a&gt;Шолу&lt;/h2&gt;\n&lt;p&gt;Контенттің шығу тегі (content provenance) — бұл цифрлық медиа файлдың жасалу және өзгертілу тарихын тіркеу процесі, ол оның түпнұсқалығын анықтауға мүмкіндік береді. Синтетикалық медиа тараған заманда су белгілері мен криптографиялық қолтаңбалар сурет немесе видеоның жарияланғаннан кейін өзгертілмегенін растау үшін негізгі құралға айналуда.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-provenance.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Контенттің шығу тегі криптография мен метадеректер принциптеріне негізделген. Цифрлық қолтаңба — бұл файлды оның авторымен немесе жасалған құрылғысымен байланыстыратын математикалық механизм. Осы контекстегі су белгісі — бұл деректер құрылымына енгізілген, көшіру немесе сығу кезінде сақталатын көрінбейтін немесе көрінетін маркер.&lt;/p&gt;\n&lt;h2 id=\"bul-khalaj-zhumys-istejdi\"&gt;&lt;a href=\"concepts/proc-provenance.html#bul-khalaj-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қалай жұмыс істейді&lt;/span&gt;&lt;/a&gt;Бұл қалай жұмыс істейді&lt;/h2&gt;\n&lt;p&gt;C2PA жүйесі файлға бекітілген қорғалған манифест жасайды. Манифест метадеректерді қамтиды: файлды кім жасады, қашан және қандай жабдық қолданылды. Егер файл өңделсе, бағдарламалық қамтамасыз ету манифестке жаңа жазба қосып, өзгерістер тарихын сақтайды.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"concepts/proc-provenance.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі әдіс — файл метадеректеріне криптографиялық хештерді енгізу. Тексеру құралдары қолтаңбаның түпнұсқа контентке сәйкестігін растау үшін ашық кілттерді пайдаланады. InfoAgent фреймворкі инфографика элементтерін тексерілетін деректермен байланыстырып, ашықтықты қамтамасыз етеді.&lt;/p&gt;\n&lt;h2 id=\"khajda-kholdanylady\"&gt;&lt;a href=\"concepts/proc-provenance.html#khajda-kholdanylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда қолданылады&lt;/span&gt;&lt;/a&gt;Қайда қолданылады&lt;/h2&gt;\n&lt;p&gt;Шығу тегін тексеру технологиялары журналистикада дезинформациямен күресуде және автоматтандырылған деректерді талдау жүйелерінде қолданылады. Мысалы, «Нейрожелілерді галлюцинациясыз дәл инфографика жасауға қалай мәжбүрлеу керек» мақаласында әрбір элемент бастапқы деректер жиынтығымен байланысқан визуализацияларды жасау принциптері қарастырылады.&lt;/p&gt;\n&lt;h2 id=\"shekteuler-men-khauipter\"&gt;&lt;a href=\"concepts/proc-provenance.html#shekteuler-men-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен қауіптер&lt;/span&gt;&lt;/a&gt;Шектеулер мен қауіптер&lt;/h2&gt;\n&lt;p&gt;Негізгі шектеу — стандартты тізбектің барлық қатысушылары: камерадан бастап жариялау платформасына дейін қолдау қажеттілігі. Егер файл метадеректерді өшіретін қызмет арқылы өтсе, сенім тізбегі үзіледі.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Сызба: Происхождение и водяные знаки&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A6%D0%B8%D1%84%D1%80%D0%BB%D1%8B%D2%9B%20%D0%BA%D0%BE%D0%BD%D1%82%D0%B5%D0%BD%D1%82%5D%20--%3E%20B%5B%D0%9A%D1%80%D0%B8%D0%BF%D1%82%D0%BE%D0%B3%D1%80%D0%B0%D1%84%D0%B8%D1%8F%D0%BB%D1%8B%D2%9B%20%D2%9B%D0%BE%D0%BB%D1%82%D0%B0%D2%A3%D0%B1%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%9C%D0%B0%D0%BD%D0%B8%D1%84%D0%B5%D1%81%D1%82%5D%0A%20%20C%20--%3E%20D%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%5D%0A%20%20D%20--%3E%20E%5B%D0%A2%D0%B5%D0%BA%D1%81%D0%B5%D1%80%D1%83%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%A2%D2%AF%D0%BF%D0%BD%D2%B1%D1%81%D2%9B%D0%B0%D0%BB%D1%8B%D2%9B%D1%82%D1%8B%20%D1%80%D0%B0%D1%81%D1%82%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bajlanysty-ughymdar\"&gt;&lt;a href=\"concepts/proc-provenance.html#bajlanysty-ughymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты ұғымдар&lt;/span&gt;&lt;/a&gt;Байланысты ұғымдар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Фактілер мен медианы тексеру&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-image_forensics.html\"&gt;Криминалистика изображений&lt;/a&gt; — Следы монтажа, метаданные, сжатие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic.html\"&gt;Синтетические медиа&lt;/a&gt; — Детекция сгенерированных изображений, голоса и видео.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khaj-zherde-kezdesedi\"&gt;&lt;a href=\"concepts/proc-provenance.html#khaj-zherde-kezdesedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде кездеседі&lt;/span&gt;&lt;/a&gt;Қай жерде кездеседі&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html\"&gt;IdeaLens: жасанды интеллект идеяларын адам ойынан ажырату&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html\"&gt;Жасанды интеллект көмегімен қатесіз инфографика жасау жолы&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Анықтамалықта: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"concepts/proc-provenance.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A3%D0%BD%D0%B8%D1%84%D0%BE%D1%80%D0%BC%D0%B0_%D1%81%D1%83%D1%85%D0%BE%D0%BF%D1%83%D1%82%D0%BD%D1%8B%D1%85_%D0%B2%D0%BE%D0%B9%D1%81%D0%BA_%D0%92%D0%B5%D1%80%D0%BC%D0%B0%D1%85%D1%82%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Униформа сухопутных войск Вермахта — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:ONI_JAN_1_Uniforms_and_Insignia_Page_004_German_Army_WW2_Field_gray_uniforms_officers_and_men._Field_caps,_national_emblem,_steel_helmet,_decals,_equipment,_tornister,_infantry_rifleman._June_1943_Field_recognition._US_public_doc._No_co.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Military Intelligence Division of the United States Department of War during World War II, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/bmj.b2700\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate healthcare interventions: explanation and elaboration&lt;/a&gt; — шолу, BMJ 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pmed.1000100\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate health care interventions: explanation and elaboration&lt;/a&gt; — шолу, PLoS Med 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrn3241\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The origin of extracellular fields and currents--EEG, ECoG, LFP and spikes&lt;/a&gt; — шолу, Nat Rev Neurosci 2012&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"C2PA, цифровые подписи контента."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Происхождение и водяные знаки","description":"C2PA, цифровые подписи контента.","vcsPath":"concepts/proc-provenance.md"},"headings":[{"title":"Анықтама","href":"concepts/proc-provenance.html#anykhtama","level":2},{"title":"Шолу","href":"concepts/proc-provenance
