            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"239\" cy=\"94\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"681\" cy=\"221\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Нейрожелілердің дәлдігі:&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;тұрақтылық иллюзиясы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f1.jpg\" alt=\"1-сурет: Семантикалық тұрғыдан баламалы нақты промпттар модельдер отбасылары бойынша өлшенетін мінез-құлық өзгерістерін \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Семантикалық тұрғыдан баламалы нақты промпттар модельдер отбасылары бойынша өлшенетін мінез-құлық өзгерістерін тудырады. Радарлық диаграммалар төрт ось бойынша орташа дельта шамасын көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер &lt;a href=\"concepts/sago.html\"&gt;SAGO&lt;/a&gt; жүйесін ұсынды, ол тілдік модельдердің тұрақтылығын жеке мысалдар деңгейінде бағалайды. Сұраныстың жалпы мағынасы сақталса да, модельдердің мінез-құлқында айтарлықтай ауытқулар болатыны анықталды. Стандартты дәлдік көрсеткіштері бұл ақауларды жасырып, жүйелер сенімді деген жалған түсінік қалыптастырады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SAGO сұраныстарды қайта құру кезіндегі модель тұрақтылығын өлшейді, орташа дәлдікті емес.&lt;/li&gt;\n&lt;li&gt;11 модельді зерттеу олардың жеке мысалдар деңгейінде айтарлықтай тұрақсыз екенін көрсетті.&lt;/li&gt;\n&lt;li&gt;Жинақталған көрсеткіштер қателерді жасырады, себебі кейбір вариациялардағы сәтсіздіктер басқаларында жабылады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Авторлар 11 ашық және жабық &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; моделін 6 түрлі деректер жиынтығында талдап, төрт ось бойынша бағалады: генерация дәйектілігі, ішкі активтенулер, модель сенімділігі және жауаптарды көшіру (&lt;a href=\"concepts/mirroring.html\"&gt;mirroring&lt;/a&gt;). Дәстүрлі бенчмарктардан айырмашылығы, SAGO енгізілген деректердің семантикалық эквивалентті өзгерістерінде (регистр, ұзындық немесе сыпайылық өзгерісі) модель мінез-құлқының өзгеруін өлшейді.&lt;/p&gt;\n&lt;p&gt;Нәтижелер көрсеткендей, ешбір модель біркелкі жалпылау қабілетіне ие емес. Мінез-құлық осьтері тәуелсіз қате түрлерін тіркейді, ал деректер жиынтығының өзгеруі модель рейтингін толығымен өзгертіп жіберуі мүмкін. Бұл жинақталған балдарға негізделген қазіргі бағалау әдістері алгоритмдердің нақты пайдалану жағдайындағы шынайы тұрақсыздығын анықтай алмайтынын дәлелдейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұмыс модельдердің семантикалық вариациялардағы мінез-құлқына бағытталған және ұзақ мерзімді контекст әсерін ескермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Үлкен тілдік модельдердің (LLM) жалпылау қабілеті — бір сұраныс әртүрлі пішінде берілгенде семантикалық тұрғыдан тұрақты және дәйекті нәтижелер беру қабілеті. Қазіргі бағалау әдістері көбінесе бірыңғай форматтағы деректер жиынтығы бойынша жиынтық дәлдікке сүйенеді, бұл модельдің жалпы өнімділігі мен оның кіріс деректеріндегі өзгерістерге төзімділігін ажыратуды қиындатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жалпылау — бұл пайдаланушы сұрақты қайта құрастырған кезде де модельдің жауап мағынасын сақтап қалу қабілеті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыста Stability-Aware &lt;a href=\"concepts/obobschenie.html\"&gt;Generalization&lt;/a&gt; Objective (SAGO) жүйесі ұсынылған. Ол модельдің мінез-құлқын жеке мысалдар деңгейінде бағалауға мүмкіндік береді және кіріс деректерінің әртүрлі нұсқаларындағы жауаптардың өзгеруін талдайды. SAGO бірнеше параметр бойынша өзгермелілікті өлшейді: генерация дәйектілігі, нейрондық желінің ішкі белсенділігі, модельдің сенімділік деңгейі және жауаптардың көрінісі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу көрсеткендей, сыналған модельдердің ешқайсысы біркелкі жалпылау қабілетіне ие емес және модельдердің тиімділік рейтингі пайдаланылған деректер жиынтығына байланысты өзгеруі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау нәтижелері қазіргі заманғы модельдердің жалпылау кезінде статистикалық тұрғыдан айтарлықтай тұрақсыздық көрсететінін анықтады. Модель мінез-құлқының әртүрлі осьтері қателердің тәуелсіз түрлерін көрсетеді, ал деректер жиынтығының өзгеруі модельдердің тиімділік рейтингтерінде кері нәтижелерге әкелуі мүмкін. Авторлар тәуелсіз тексеру үшін әдістің эталондық іске асырылуын ұсынды.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"llm-zhalpylau-konteksti-men-maeselesi\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#llm-zhalpylau-konteksti-men-maeselesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM жалпылау контексті мен мәселесі&lt;/span&gt;&lt;/a&gt;LLM жалпылау контексті мен мәселесі&lt;/h4&gt;\n&lt;p&gt;Үлкен тілдік модельдер (LLM) іздеу жүйелерінде, бағдарламалау көмекшілерінде және агенттік жұмыс процестерінде белсенді қолданылуда. Модель сенімділігінің негізгі сипаттамасы — жалпылау қабілеті, яғни сұраныс пішіні өзгергенімен, оның мағынасы мен контексті өзгермеген жағдайда тиімділікті сақтап қалу. Пайдаланушылар ұзындықты, тонды, пішімдеуді өзгертуі немесе шу қосуы мүмкін, бірақ модель осы өзгерістерге қарамастан өз нұсқаулары мен қауіпсіздік саясатын ұстануы тиіс. Алдыңғы зерттеулер мағына сақталған кезде де LLM мінез-құлқы өзгеретінін растайды, бұл сұраныс тұжырымдарына, сөздердің ретіне немесе тонға қатысты осалдықты көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдің семантикалық эквивалентті сұраныстар кезінде тұрақты мінез-құлықты сақтау қабілеті сенімділіктің маңызды көрсеткіші болып табылады, ол көбінесе орташаланған метрикалардың көлеңкесінде қалып қояды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aghymdaghy-taesilderding-shekteuleri-zhaene-sago-aedisnamasy\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#aghymdaghy-taesilderding-shekteuleri-zhaene-sago-aedisnamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ағымдағы тәсілдердің шектеулері және SAGO әдіснамасы&lt;/span&gt;&lt;/a&gt;Ағымдағы тәсілдердің шектеулері және SAGO әдіснамасы&lt;/h4&gt;\n&lt;p&gt;Қолданыстағы бағалау әдістерінің бірқатар кемшіліктері бар: олар көбінесе бір пәндік саламен шектеледі, сұраныс вариацияларының тар спектрін қарастырады немесе агрегирленген көрсеткіштерге сүйенеді. Орташаланған бағалар жекелеген мысалдар деңгейіндегі елеулі сәтсіздіктерді жасыруы мүмкін, өйткені кейбір сұраныс нұсқаларындағы қателер басқаларындағы сәттіліктермен өтеледі. Осы олқылықты жою үшін авторлар Stability-Aware Generalization Objective (SAGO) жүйесін ұсынады. Орташа сапаны бағалаудың орнына, SAGO әрбір нақты мысал үшін модельдің әртүрлі семантикалық эквивалентті вариациялардағы мінез-құлқын тексереді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SAGO — бұл бір тапсырманы қайта тұжырымдаған кезде модельдің жауабы, оның ішкі сенімділігі мен нейрондық белсендірулері қаншалықты өзгеретінін талдайтын бағалау әдіснамасы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 11 модельді қамтиды, алайда нәтижелер таңдалған алты деректер жиынтығы мен енгізілген деректердегі бұрмалау түрлерінің ерекшеліктеріне байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SAGO аясында генерацияның үйлесімділігі, ішкі белсендірулер, модельдің сенімділігі және жауаптардың «айналынуы» (&lt;a href=\"concepts/response-mirroring.html\"&gt;response mirroring&lt;/a&gt;) өзгерістері талданады. Авторлар 11 ашық және жабық LLM-ді алты деректер жиынтығында сынақтан өткізді. Нәтижелер жалпылаудың тұрақсыздығы кең таралған және біртекті емес екенін көрсетеді. Жұмыстың негізгі қорытындылары мінез-құлық өзгерістерін өлшеу үшін көп осьті метриканы құруды және генерация үйлесімділігі ең сезімтал параметр екенін, сондай-ақ мазмұн тұрақтылығы мен жауаптардың айналынуы модель сезімталдығының тәуелсіз өлшемдері екенін эмпирикалық дәлелдеуді қамтиды.&lt;/p&gt;\n&lt;h4 id=\"bajlanysty-zhumystar-zhaene-kontekst\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#bajlanysty-zhumystar-zhaene-kontekst\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты жұмыстар және контекст&lt;/span&gt;&lt;/a&gt;Байланысты жұмыстар және контекст&lt;/h4&gt;\n&lt;p&gt;Үлкен тілдік модельдердің (LLM) жалпылау тұрақтылығы бойынша зерттеулер бірнеше бағытқа бөлінеді, олардың әрқайсысы мәселенің жеке аспектісін қарастырады.&lt;/p&gt;\n&lt;p&gt;Таратылымнан тыс тұрақтылық (Out-of-distribution). Бұл бағытта тест деректері оқу деректерінен ерекшеленген кезде модельдердің мінез-құлқы өлшенеді. Әдебиетте бұл бөлінген таңдамадағы өнімділіктің бірыңғай көрсеткіші ретінде ресімделеді. Ауқымды бенчмарктар бұл алшақтықты көптеген домендер бойынша жинақтайды. Бұл зерттеулер таратылымдағы ауытқулар өнімділікті төмендететінін және бұл төмендеу &lt;a href=\"concepts/dataset.html\"&gt;датасет&lt;/a&gt; деңгейінде айтарлықтай екенін растайды. Алайда, олар модельдің бірдей мағыналы, бірақ әртүрлі пішіндегі кірістерге дәйекті жауап беретінін тексермейді және деректерді жинақтағандықтан, жеке мысалдар деңгейіндегі тұрақсыздықты анықтау мүмкін болмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тұрақтылықты бағалаудың қолданыстағы әдістері көрсеткіштерді жинақтайды, бұл модельдің нақты сұраныстар деңгейіндегі тұрақсыздығын жасырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Промпт деңгейіндегі өзгерістерге қатысты дәйектілік пен сезімталдық. Екінші бағыт мағынаны өзгертпей қайта айтылған кірістердегі болжамдардың тұрақтылығын тексереді. Бұған нақты сұраныстардың қайта айтылуындағы сәйкессіздіктер және нұсқауларға бейімделген модельдердегі жүйелі келіспеушіліктер жатады. Зерттеулердің басым бөлігі тар семантикалық салаларға бағытталған: тіларалық нұсқалар, әлеуметтік үндегі ауытқулар және қауіпті сұраныстарды өңдеудегі дәйектілік. Үшінші бағыт мағынаға әсер етпейтін сыртқы өзгерістерге (пішімдеу, шаблон таңдау, контекстегі мысалдар реті, тыныс белгілері мен бос орындар) сезімталдықты зерттейді. Бұл жұмыстар LLM мінез-құлқы семантикалық тұрғыдан эквивалентті кірістерде сирек жағдайда инвариантты қалатынын көрсетсе де, олар модельдің жалпы жалпылау қабілетін толық бағаламайды.&lt;/p&gt;\n&lt;p&gt;Дәлдіктен тыс мінез-құлық сигналдары. Біз қолданатын талдау осьтері әртүрлі салаларда дамыған. Жасырын күйлер геометриясы кіріс өзгергенде ішкі бейнелердің қалай өзгеретінін бақылайды. Семантикалық ұқсастық шаралары (мысалы, BERTScore) лексикалық қабаттасуды (BLEU) толықтырады. Токен деңгейіндегі лог-ықтималдықтар мен болжамды энтропия сенімділікті өлшеу үшін стандартты құралдар болып табылады. Стилистикалық аккомодация — модельдің кіріс регистрін көрсету дәрежесі — дербес құбылыс ретінде зерттеледі. Айна эффектісі көбінесе нұсқауларға бейімдеудің жағымды сипаттамасы болғанымен, егер модель семантикалық емес шуларды көшірсе, бұл күтпеген тұрақсыздық ретінде көрінуі мүмкін. Бұл сигналдарды жеке мысалдар деңгейінде біріктірілген талдау бұрын жүргізілмеген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стилистикалық аккомодация — бұл модельдің өз жауап стилін алынған сұраныс стиліне немесе регистріне бейімдеуге бейімділігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"turakhtylykhty-eskere-otyryp-zhalpylau-makhsaty-sago\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#turakhtylykhty-eskere-otyryp-zhalpylau-makhsaty-sago\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тұрақтылықты ескере отырып жалпылау мақсаты (SAGO)&lt;/span&gt;&lt;/a&gt;Тұрақтылықты ескере отырып жалпылау мақсаты (SAGO)&lt;/h4&gt;\n&lt;p&gt;SAGO семантикалық эквивалентті кіріс өзгерістеріне қатысты тұрақтылықты бағалайды: модель тек сұраныс мағынасы сақталғанда оның мінез-құлқы тұрақты болса ғана жалпылаушы деп саналады. Біз мұны өзгерістер отбасылары, контент домендері және жеке промпттар бойынша, бастапқы және өзгертілген деректердегі мінез-құлықты бірнеше ось бойынша салыстыру арқылы өлшейміз. Жүйе мыналарды қамтиды: (1) бақыланатын семантикалық өзгерістер бенчмаркі, (2) әр промпт үшін тұрақтылық көрсеткіші және (3) әртүрлі ақау түрлерін тіркейтін мінез-құлық осьтері.&lt;/p&gt;\n&lt;h4 id=\"belgileuler-men-makhsatty-funkciya\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#belgileuler-men-makhsatty-funkciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Белгілеулер мен мақсатты функция&lt;/span&gt;&lt;/a&gt;Белгілеулер мен мақсатты функция&lt;/h4&gt;\n&lt;p&gt;X — мәтіндік сұраныстар (промпттар) кеңістігі, Y — модель жауаптарының кеңістігі, ал f_θ: X → Y — нұсқаулықтар арқылы бапталған (instruction-tuned) және &lt;span class=\"yfm-latex\" data-content=\"%5C%7BD_j%5C%7D_%7Bj%3D1%7D%5EJ\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; деректер жиыны бойынша бағаланатын тілдік модель болсын. D_j жиынындағы x_i сұранысы үшін бастапқы жауап y_i = f_θ(x_i) түрінде анықталады. c: X → C функциясы әрбір промптқа оның семантикалық мазмұнын сәйкестендіреді. Әрбір сұраныс үшін &lt;span class=\"yfm-latex\" data-content=\"v%20%5Cin%20V\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; индексімен белгіленетін мәндес өзгерістер жиыны құрылады:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"x_i%5E%7B(v)%7D%20%3D%20T_v(x_i)%2C%20%5Cquad%20c(x_i%5E%7B(v)%7D)%20%3D%20c(x_i)%20%5Cquad%20(1)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;мұндағы T_v: X → X — сұраныстың мағынасын толық сақтайтын түрлендіру.&lt;/p&gt;\n&lt;p&gt;«Өсь» (axis) деп модельдің белгілі бір промпттағы мінез-құлқын сипаттайтын скалярлық көрсеткіш &lt;span class=\"yfm-latex\" data-content=\"X(f_%20heta%2C%20x)%20%5Cin%20%5Cmathbb%7BR%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; түсіндіріледі. v вариациясы тудырған ауытқу Δ X(i, v) = X(f_θ, x_i^(v)) - X(f_θ, x_i) айырмасы арқылы есептеледі. Бұл мәннің таңбасы бар: мысалы, теріс Δ XAct мәні репрезентативті ығысуды (representational drift) білдіреді. Ауытқудың абсолютті шамасын біріктіру үшін орташа квадраттық мән (RMS) қолданылады.&lt;/p&gt;\n&lt;p&gt;SAGO әдісінің мақсаты барлық i және &lt;span class=\"yfm-latex\" data-content=\"v%20%5Cin%20V\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; үшін мынадай қатаң шарттың орындалуын тексеру болып табылады:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"%5CDelta%20X(i%2C%20v)%20%3D%200%20%5Cquad%20(2)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Егер бұл теңдік бұзылса, әдіс модельдің шарттан қаншалықты ауытқығанын сандық түрде бағалайды. Кез келген нөлдік емес айырма X өсі бойынша жалпылау қабілетінің бұзылғанын дәлелдейді. Бір өсь бойынша тұрақтылық басқа өстегі тұрақтылыққа кепілдік бермейтіндіктен, бұл шарт әр өсь үшін бөлек есептеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SAGO мақсатты функциясы модель жауаптарының абсолютті инварианттылығын тексереді: мағына сақталғанда пайда болған кез келген &lt;span class=\"yfm-latex\" data-content=\"%5CDelta%20X(i%2C%20v)%20%0Aeq%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ауытқу жалпылау қабілетінің бұзылуы ретінде бағаланады.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"benchmarkti-khuru\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#benchmarkti-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бенчмаркті құру&lt;/span&gt;&lt;/a&gt;Бенчмаркті құру&lt;/h4&gt;\n&lt;p&gt;Жасалған &lt;a href=\"concepts/benchmark.html\"&gt;бенчмарк&lt;/a&gt; бірнеше деректер жиынын бақыланатын кіріс өзгерістерінің жиынтығымен біріктіреді. Әрбір вариация v = (F, u, s, p) кортежімен сипатталады, мұндағы &lt;span class=\"yfm-latex\" data-content=\"F%20%5Cin%20%5Cmathcal%7BF%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — өзгерістер тұқымдасы, &lt;span class=\"yfm-latex\" data-content=\"u%20%5Cin%20U_F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — оның кіші түрі, &lt;span class=\"yfm-latex\" data-content=\"s%20%5Cin%20S_F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — әсер ету қарқындылығы, ал &lt;span class=\"yfm-latex\" data-content=\"p%20%5Cin%20%5Cmathcal%7BP%7D%20%3D%20%5C%7B%20ext%7BPREFIX%7D%2C%20%20ext%7BSUFFIX%7D%2C%20%20ext%7BGLOBAL%7D%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — орналасу орны.&lt;/p&gt;\n&lt;p&gt;Толық вариациялар жиыны келесі түрде қалыптасады:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"V%20%3D%20%5C%7B(F%2C%20u%2C%20s%2C%20p)%20%5Cmid%20F%20%5Cin%20%5Cmathcal%7BF%7D%2C%20u%20%5Cin%20U_F%2C%20s%20%5Cin%20S_F%2C%20p%20%5Cin%20%5Cmathcal%7BP%7D%5C%7D%20%5Cquad%20(3)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Авторлар үш негізгі тұқымдасты бөлді, олардың әрқайсысы біреуіндегі тұрақтылық екіншісіндегі тұрақтылықты қамтамасыз етпейтіндей етіп таңдалған. Бұл ретте c(x_i^(v)) = c(x_i) мағынаның сақталу шарты қатаң орындалады:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Әлеуметтік регистр (Social register):&lt;/strong&gt; сұраныстағы тұлғааралық қарым-қатынас стилін өзгертеді (сыпайылық, тікелей айту, сәлемдесу, алғыс білдіру немесе жағымсыз контекст).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Беткі шу (Surface noise):&lt;/strong&gt; таңбалар мен токендер деңгейінде өзгерістер енгізеді (жүйесіз бос орындар, тыныс белгілерінің қателері және бас-кіші әріптердің ығысуы).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Құрылымдық қайта жазу (Structural rewriting):&lt;/strong&gt; сұраныс мағынасын сақтай отырып, оның синтаксистік құрылымын өзгертеді (ұзындықты қысқарту немесе кеңейту, сұраулы сөйлемді бұйрықты сөйлемге айналдыру).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Бенчмарк модельдің шынайы пайдаланушы сұраныстарында жиі кездесетін кедергілердің үш түріне тұрақтылығын сынайды: қарым-қатынас тонның өзгеруі, емле қателері және қайта тұжырымдау.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"turakhtylykhty-zhalpylau-koersetkishi-sgs\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#turakhtylykhty-zhalpylau-koersetkishi-sgs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тұрақтылықты жалпылау көрсеткіші (SGS)&lt;/span&gt;&lt;/a&gt;Тұрақтылықты жалпылау көрсеткіші (SGS)&lt;/h4&gt;\n&lt;p&gt;Модельдің (2)-теңдектен ауытқу дәрежесін өлшеу үшін SGS (&lt;a href=\"concepts/stability-generalization-score.html\"&gt;Stability Generalization Score&lt;/a&gt;) метрикасы қолданылады. Әр түрлі өстің өлшем бірліктері әр түрлі болғандықтан, бастапқы дельта мәндері алдымен ортақ шкалаға келтіріледі.&lt;/p&gt;\n&lt;p&gt;Нормалау үшін әрбір дельта R_X бекітілген өстік масштабына бөлінеді:&lt;/p&gt;\n&lt;p&gt;ildeΔ X(i, v) = Δ X(i, v) / R_X&lt;/p&gt;\n&lt;p&gt;Шектеулі диапазоны бар өстер үшін R_X мәні /Δ X/ шамасының теориялық максимумына тең; шексіз тізбектің логарифмдік ықтималдығы (log-probability) үшін R_X эмпирикалық диапазоннан алынған тұрақты константа болып табылады. Нәтижесінде $ ilde{\\Delta} X \\in [-1, 1]$ аралығы алынады, мұндағы 0 мәні мінез-құлықта ешқандай өзгерістің жоқтығын білдіреді.&lt;/p&gt;\n&lt;p&gt;Жеке i промпты үшін X өсіндегі тұрақсыздық V вариациялар жиыны бойынша нормаланған дельталардың орташа квадраттық ауытқуы (RMS) ретінде есептеледі:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"s_X(i)%20%3D%20%5Cleft(%20%5Cfrac%7B1%7D%7B%2FV%2F%7D%20%5Csum_%7Bv%20%5Cin%20V%7D%20%20ilde%7B%5CDelta%7D%20X(i%2C%20v)%5E2%20%5Cright)%5E%7B1%2F2%7D%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Егер модель барлық өзгерістерде бірдей нөлден өзгеше шамаға ығысса, RMS бұл тұрақсыздықты дәл тіркейді.&lt;/p&gt;\n&lt;p&gt;D_j деректер жиыны үшін SGS көрсеткіші сұраныстар тұрақсыздығының орташа мәніне тең: $ ext{SGS}&lt;em&gt;X^{(j)} = \\frac{1}{/D_j/} \\sum&lt;/em&gt;{i \\in D_j} s_X(i)$. Ал жалпы балл барлық деректер жиыны бойынша әрбір сұранысқа бірдей салмақ бере отырып есептеледі:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"ext%7BSGS%7D_X%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_%7Bj%3D1%7D%5EJ%20%2FD_j%2F%20%5Ccdot%20%20ext%7BSGS%7D_X%5E%7B(j)%7D%2C%20%5Cquad%20%20ext%7B%D0%BC%D2%B1%D0%BD%D0%B4%D0%B0%D2%93%D1%8B%20%7D%20N%20%3D%20%5Csum_%7Bj%3D1%7D%5EJ%20%2FD_j%2F%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;SGS_X мәні неғұрлым төмен болса, модельдің тұрақтылығы соғұрлым жоғары. SGS_X = 0 теңдігі тек модель барлық кіріс сұраныстарында (2)-шартты қанағаттандырғанда ғана орындалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Метрика жауаптардың шашырауын [-1, 1] аралығына нормалайтындықтан, көрсеткіштің сезімталдығы шексіз параметрлер үшін R_X коэффициентінің дұрыс таңдалуына байланысты.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Статистикалық маңыздылықты тексеру үшін нөлден өзгеше рұқсат етілген шекті мәнге сүйене отырып, біржақты t-критерий қолданылады (&lt;span class=\"yfm-latex\" data-content=\"H_0%3A%20%5Cmathbb%7BE%7D%5Bs_X(i)%5D%20%5Cle%20%5Cvarepsilon\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және &lt;span class=\"yfm-latex\" data-content=\"H_1%3A%20%5Cmathbb%7BE%7D%5Bs_X(i)%5D%20%3E%20%5Cvarepsilon\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;). Зерттеуде нормаланған диапазонның 1%, 5% және 10% сәйкес келетін &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%5Cin%20%5C%7B0%7B%2C%7D01%3B%200%7B%2C%7D05%3B%200%7B%2C%7D10%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; шекті мәндері тексерілді. Негізгі нәтижелер &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3D%200%7B%2C%7D05\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; үшін берілген. Тест статистикасы &lt;span class=\"yfm-latex\" data-content=\"t%20%3D%20(%5Cbar%7Bs%7D_X%20-%20%5Cvarepsilon)%20%2F%20%20ext%7BSE%7D(s_X)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласымен есептеледі, мұндағы &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bs%7D_X\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — таңдамалы орташа мән, ал SE(s_X) — N промпт үшін стандартты қателік.&lt;/p&gt;\n&lt;h4 id=\"metrikalar\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#metrikalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрикалар&lt;/span&gt;&lt;/a&gt;Метрикалар&lt;/h4&gt;\n&lt;p&gt;SGSX әрбір X осі үшін тәуелсіз есептеледі. Біз модельдің істен шығу жолдарын қамтитын төрт осьті анықтаймыз (2-теңдеу). Әрбір ось жалпы дәлдік метрикалары ажырата алмайтын мінез-құлық сезімталдығын тіркейді.&lt;/p&gt;\n&lt;p&gt;Белсендіру геометриясы (XAct). Ішкі көріністер түпкілікті жауаптар өзгермесе де, промпт өзгергенде әртүрлі болуы мүмкін. Біз ∆XAct-ті бастапқы және өзгертілген промпттар үшін соңғы қабаттың &lt;span class=\"yfm-latex\" data-content=\"h_%5Cell\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; жасырын күйлерінің косинустық ұқсастығының орташа айырмашылығы ретінде анықтаймыз. Теріс мәндер көріністердің «ығысуын» көрсетеді. RAct = 2 &lt;a href=\"concepts/masshtabirovanie.html\"&gt;масштабтау&lt;/a&gt; коэффициенті -1 мен 1 аралығын қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;XAct метрикасы сыртқы жауаптар тұрақты болса да, ішкі көріністер өзгерген кезде модельдің ішкі тұрақсыздығын анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Генерацияның үйлесімділігі (XBLEU, XBERT). Модель дәлдікті сақтай отырып, жауап пішіндерін өзгерте алады. Біз базалық және өзгертілген промпттарға берілген жауаптар арасындағы BLEU (лексикалық ұқсастық) және BERTScore (семантикалық ұқсастық) метрикаларындағы айырмашылықты өлшейміз. Масштабтау коэффициенттері RBLEU = 100 және RBERT = 1 құрайды.&lt;/p&gt;\n&lt;p&gt;Сенімділік және белгісіздік (XProb, XEnt). Модель тұрақты жауаптар бере отырып, сонымен бірге сенімсіздеу болуы мүмкін. Біз тізбектің логарифмдік ықтималдығын (XProb) және токендер деңгейіндегі орташа энтропияны (XEnt) қолданамыз. Энтропия жауап ұзындығына тәуелсіз сенімділік сигналы ретінде қызмет етеді (REnt = 10), ал логарифмдік ықтималдық ұзындыққа сезімтал болғандықтан, оған RProb = 250 белгіленген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Энтропия бұл жерде модельдің келесі токенді таңдаудағы «екіленуінің» өлшемі: мән неғұрлым жоғары болса, модель таңдауы соғұрлым болжаусыз болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жауаптарды айналық көрсету (XMR). Модель жауап стилін енгізілетін деректердің сыртқы қасиеттеріне (мысалы, ұзындығы немесе шуы) бейімдей алады. Біз m(y, v) бинарлы детекторын қолданамыз, ол y жауабы v вариациясының қасиетін көрсететінін анықтайды. ∆XMR мәні базалық және өзгертілген промпттар арасындағы осы көрсету айырмашылығын білдіреді (RMR = 1).&lt;/p&gt;\n&lt;h4 id=\"eksperimentter\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#eksperimentter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименттер&lt;/span&gt;&lt;/a&gt;Эксперименттер&lt;/h4&gt;\n&lt;p&gt;Біз SAGO жүйесі арқылы нұсқауларға бейімделген LLM модельдерін бағалаймыз. Біз SGSX-ті вариациялар отбасының, түрінің, күші мен позициясының барлық комбинациялары үшін есептейміз. Зерттеу үш сұраққа жауап іздейді: ақау түрлері алты ∆-ось бойынша ерекшелене ме; модель ішіндегі деректер жинағының өзгеруі модель рейтингін өзгерту үшін жеткілікті ме; және жабық пен ашық модельдер арасында тұрақсыздық профильдерінде сапалық айырмашылықтар бар ма.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бағалау нұсқауларға бейімделген модельдер үстінде жүргізіледі; нәтижелер модель отбасының өзіндік ерекшеліктеріне байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimenttik-baptaular\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#eksperimenttik-baptaular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименттік баптаулар&lt;/span&gt;&lt;/a&gt;Эксперименттік баптаулар&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер сегіз ашық кодты (Llama-3.2/3.1, Gemma-2/4 және Qwen2.5/3.5 отбасылары) және үш жабық кодты (GPT-5.4, Gemini-2.5-Flash, Claude-Sonnet-4.6) модельдерді талдады. Барлық модельдер үшін детерминирленген декодтау (T=0) қолданылды. Есептеулер NVIDIA RTX 2080 Ti және GTX 1080 Ti графикалық процессорларында жүргізілді. Тиімділік алты деректер жиынтығы (TruthfulQA, Natural Questions, Alpaca, SimpleQA Verified, TriviaQA, HotpotQA) арқылы бағаланды. Әр жиынтық үшін 16 промпт таңдап алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детерминирленген декодтау (T=0) — бұл нейрондық желінің әрқашан ең ықтимал келесі токенді таңдайтын жұмыс режимі, бұл жауаптарды қайталанатын етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тұрақтылықты бағалау үшін (V жиынтығы) үш әдіс қолданылды: сыпайылық деңгейін өзгерту (11 деңгей), беткі шу қосу (регистрді, тыныс белгілерін және бос орындарды өзгерту) және құрылымдық қайта өңдеу (сөйлем ұзындығы мен пішінін өзгерту). Семантикалық мағынаның сақталуы BERTScore (шек &amp;gt; 0,85) көмегімен тексерілді.&lt;/p&gt;\n&lt;p&gt;XBLEU және XBERT метрикалары RoBERTa-large негізінде жұмыс істейді, ал әлеуметтік регистрлер үшін XMR GPT-4o-mini көмегімен бағаланды. ε шекті мәні 0,05 деңгейінде белгіленді.&lt;/p&gt;\n&lt;h4 id=\"eksperiment-naetizheleri\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#eksperiment-naetizheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперимент нәтижелері&lt;/span&gt;&lt;/a&gt;Эксперимент нәтижелері&lt;/h4&gt;\n&lt;p&gt;Нәтижелер модельдердің промпт өзгерістеріне әртүрлі тұрақтылық көрсететінін дәлелдейді. 1-кестеде жабық модельдер үшін SGS көрсеткіштері келтірілген. Мысалы, GPT-5.4 үшін орташа SGS көрсеткіші деректер жиынтығына байланысты 0,384-тен 0,477-ге дейін болды. Claude-Sonnet-4.6 моделі жоғарырақ SGS мәндерін (Alpaca-да 0,569-ға дейін) көрсетті, бұл генерацияның кіріс деректеріндегі өзгерістерге сезімталдығын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдер промпт өзгерістеріне статистикалық тұрғыдан маңызды сезімталдық көрсетеді (көп жағдайда p &amp;lt; 0,001), бұл генерация тұрақтылығын бағалау қажеттілігін растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер шектеулі таңдама (әр жиынтық үшін 16 промпт) негізінде алынған және модельдердің басқа типтегі сұраныстармен жұмыс істеу кезіндегі мінез-құлқын толық көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-tT1.jpg\" alt=\"Кесте 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"zhalpy-sgs\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#zhalpy-sgs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы SGS&lt;/span&gt;&lt;/a&gt;Жалпы SGS&lt;/h4&gt;\n&lt;p&gt;Зерттеу көрсеткендей, ешбір модель әмбебап тұрақтылыққа ие емес. Семантикалық тұрғыдан баламалы кіріс деректері өзгерген кезде туындайтын тұрақсыздық нақты архитектураның немесе оқыту әдісінің кемшілігі емес: әрбір ашық бастапқы кодты модель кем дегенде бір ось бойынша ε=0.05 тұрақсыздық шегінен асады. Δ-BLEU және Δ-MR көрсеткіштеріндегі өзгерістердің статистикалық маңыздылығы барлық модельдер үшін p&amp;lt;0.001 деңгейінде расталған. Бұл жағдай үш түрлі архитектуралық отбасында байқалуы қазіргі нұсқаулықтарды баптау (instruction-tuning) әдістерінің іргелі құрылымдық ерекшелігі екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ешбір модель әмбебап тұрақты емес; тұрақсыздық архитектура мен параметрлер санына қарамастан сақталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Масштабты талдау параметрлер санын арттыру мәселені шешеді деген гипотезаны жоққа шығарады: L-8B, G-7B және Q-7B модельдері өздерінің кішірек әріптестеріне қарағанда бірдей немесе одан да жоғары тұрақсыздықты көрсетеді (Сурет 2a). Сонымен қатар, Δ-Ent көрсеткіші қолайлы шек ішінде қалады (максималды 0,012), бұл токен деңгейіндегі таралу өткірлігі шығыс деңгейіндегі тұрақтылықпен әлсіз байланысты екенін білдіреді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"osterding-boelinui-axis-dissociation\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#osterding-boelinui-axis-dissociation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Осьтердің бөлінуі (Axis dissociation)&lt;/span&gt;&lt;/a&gt;Осьтердің бөлінуі (Axis dissociation)&lt;/h4&gt;\n&lt;p&gt;Негізгі сұрақ мынада: мінез-құлық осьтері бірыңғай тұрақсыздықтың өзара алмастырылатын көрсеткіштері ме, әлде олар тәуелсіз ақау түрлерін көрсете ме? Деректер екінші нұсқаны растайды. Gemma отбасында G4-E4B моделі ең жоғары генерация тұрақсыздығын тіркейді (Δ-BERT: 0,178; Δ-BLEU: 0,837), ал алдыңғы нұсқалар (G-2B: 0,097; G-7B: 0,084) анағұрлым тұрақты. Бұл модель мүмкіндіктерінің өсуі автоматты түрде оның беріктігін арттырады деген болжамды жоққа шығарады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Осьтердің бөлінуі модельдің мәтін генерациясында тұрақты бола алатынын, бірақ сонымен бірге жоғары сенімсіздік немесе деректерді көшіруге (имитация) бейімділік көрсете алатынын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Q3.5-9B моделі мұның керісін көрсетеді: ең төменгі Δ-BERT (0,080) және Δ-BLEU (0,520) көрсеткіштері, бірақ ең жоғары сенімсіздік тұрақсыздығы (Δ-Prob: 0,088) және айналық тұрақсыздық (Δ-MR: 0,441). Мұндай жүйелі инверсия генерация дәйектілігі мен модель сенімі бір тұрақсыздықтың байланысты прокси-көрсеткіштері емес екенін дәлелдейді. Агрегаттық бағалар қарама-қарсы ақау профильдерін жасыруы мүмкін, бұл түзету үшін әртүрлі тәсілдерді талап етеді.&lt;/p&gt;\n&lt;h4 id=\"derekter-zhiyntykhtary-arasyndaghy-oezgermelilik\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#derekter-zhiyntykhtary-arasyndaghy-oezgermelilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректер жиынтықтары арасындағы өзгермелілік&lt;/span&gt;&lt;/a&gt;Деректер жиынтықтары арасындағы өзгермелілік&lt;/h4&gt;\n&lt;p&gt;Модельдің тұрақсыздығы қатаң скалярлық қасиет емес; ол контент доменіне байланысты. L-8B моделі үшін Δ-Cos көрсеткіші 3,7 есе, ал Δ-MR деректер жиынтығына қарай екі еседен астам өзгереді. Бұл бір бенчмаркқа байланған беріктік бағасы тек сол нақты доменді сипаттайтынын білдіреді. Контент таралуы бақыланбайтын нақты жағдайларда бұл өте маңызды: тестте тұрақты көрінген модель іс жүзінде тұрақсыз болуы мүмкін. Алты деректер жиынтығын тең салмақпен біріктіретін Total SGSX осы тәуелділікті орташа есептеу үшін ең қолайлы әдіс болып табылады.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Socialregistervariantsatallevaluatedstrengths.Negativevaluesintroduceimperative orsociallynegativeframing;positivevaluesaddgreetings,hedging,andgratitudemarkerswith elaborateness scaling with /s/.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-tT2.jpg\" alt=\"Кесте 2\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"naetizhelerdi-talkhylau\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#naetizhelerdi-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелерді талқылау&lt;/span&gt;&lt;/a&gt;Нәтижелерді талқылау&lt;/h4&gt;\n&lt;p&gt;Семантикалық эквивалентті кіріс деректерінің өзгеруі кезінде модельдердің жалпылау қабілетін бір ғана дәлдік көрсеткішімен немесе тұрақтылық метрикасымен толық сипаттау мүмкін емес. Тұрақсыздық — бұл деректер жиынына, өзгерістер отбасына және жеке промпттарға тәуелді құрылымдық профиль. Модель бір мінез-құлық осі бойынша тұрақты, ал екіншісінде тұрақсыз болуы мүмкін. Бенчмарктардағы ұқсас нәтижелер жеке мысалдар деңгейіндегі елеулі өзгерістерді жасыруы мүмкін, мұнда орташа балл сақталғанымен, жауаптар немесе сенімділік үлгілері өзгереді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM тұрақтылығы әмбебап емес: бенчмарктардағы жоғары дәлдік сұраныс пішіні өзгерген кезде жауаптардың тұрақтылығына кепілдік бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдердің жалпылау қабілеті туралы мәлімдемелер нақты домендермен және өзгерістер түрлерімен шектелуі керек. Модельдерді салыстыру жалпы рейтинг негізінде емес, мінез-құлық профильдері негізінде жүргізілуі тиіс, өйткені модельді таңдау басымдықтарға (мазмұн тұрақтылығы, сенімділік немесе үстірт белгілерді көшіруге төзімділік) байланысты. Ашық және жабық кодты модельдер арасындағы айырмашылықтар күштірек модельдер тұрақсыздықты жоймайтынын, тек оны басқа өлшемдерге ауыстыратынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зеркалирование (mirroring) — бұл модельдің кіріс сұранысының стилін немесе құрылымын, тіпті жауап мазмұны үшін қажет болмаса да, көшіруге бейімділігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler-men-perspektivalar\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#shekteuler-men-perspektivalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен перспективалар&lt;/span&gt;&lt;/a&gt;Шектеулер мен перспективалар&lt;/h4&gt;\n&lt;p&gt;SAGO әдісі мінез-құлық өзгерістерін тіркейді, бірақ олардың себептік механизмдерін ашпайды. Зерттеу тек ағылшын тілімен шектелген, сондықтан қорытындылардың басқа тілдер мен мәдени контексттерге қолданылуы дәлелденбеген. Δ-BLEU метрикасы лексикалық ауытқуларды бағалайды, ал Δ-BERT мұны мағына деңгейінде толықтырады. N=16 көлеміндегі таңдама әдеттегі тұрақсыздық үшін жеткілікті, бірақ сирек кездесетін критикалық ақаулар үшін үлкенірек деректер қажет болуы мүмкін. Құрылымдық нұсқаларды бағалау үшін GPT-4o-mini қолдану стилистикалық бұрмалауларға әкелуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу ағылшын тілі және GPT-4o-mini бағалау құралымен шектелген, бұл нәтижелерді басқа тілдер мен модельдер үшін түсіндіруді шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Болашақ жұмыстар SAGO-ны көптілді орталарға кеңейтуі, мінез-құлық профильдерін активтендіруді талдау арқылы ішкі механизмдермен байланыстыруы және оқыту әдістерін кез келген семантикалық эквивалентті өзгерістерде мінез-құлық тұрақтылығын сақтап қалу қабілеті бойынша бағалауы керек.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f1.jpg\" alt=\"1-сурет: Семантикалық тұрғыдан баламалы нақты промпттар модельдер отбасылары бойынша өлшенетін мінез-құлық өзгерістерін \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Семантикалық тұрғыдан баламалы нақты промпттар модельдер отбасылары бойынша өлшенетін мінез-құлық өзгерістерін тудырады. Радарлық диаграммалар төрт ось бойынша орташа дельта шамасын көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f3.jpg\" alt=\"3-сурет: Промпттар таңдамасының көлемі N функциясы ретінде әрбір промпт үшін тұрақсыздықтың стандартты ауытқуы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Промпттар таңдамасының көлемі N функциясы ретінде әрбір промпт үшін тұрақсыздықтың стандартты ауытқуы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Промпттар таңдамасының көлемі N функциясы ретінде әрбір промпт үшін тұрақсыздықтың стандартты ауытқуы. Әрбір панель бір мінез-құлық осін көрсетеді; әрбір сызық бір модельге сәйкес келеді. Қисықтар N=16 кезінде платоға шығады және N=128-ге дейін тұрақты болып қалады, бұл N=16-ның сенімді бағалау үшін жеткілікті екенін растайды. Үзік тік сызық таңдалған жұмыс нүктесін белгілейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f4.jpg\" alt=\"4-сурет: Әрбір ось үшін p позициясының функциясы ретінде (F, u, s) топтық орташа мәндердің стандартты ауытқуы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Әрбір ось үшін p позициясының функциясы ретінде (F, u, s) топтық орташа мәндердің стандартты ауытқуы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: Әрбір ось үшін p позициясының функциясы ретінде (F, u, s) топтық орташа мәндердің стандартты ауытқуы. Барлық осьтер мен модельдер бойынша үш позиция жүйелі түрде әртүрлі мәндерді береді: жаһандық нұсқалар генерацияның үйлесімділігі мен айналымына ең үлкен әсер етеді, ал префикстік және суффикстік орналастыру сенімділік пен активтену осьтерінде әртүрлі сезімталдық профильдерін көрсетеді. Ешбір орналастыру барлық осьтер мен модельдер бойынша басым емес, бұл позициялар бойынша біріктіру мінез-құлық сигналын жоғалтатынын және үшеуі де V-ге қосылуы керек екенін растайды. Әрбір панель бір мінез-құлық осін көрсетеді; әрбір сызық бір модельге сәйкес келеді. Үш позиция (GLOBAL, PREFIX, SUFFIX) осьтер бойынша әртүрлі профильдерді жасайды, бұл барлық орналастырулардың SGSX-ке тәуелсіз мінез-құлық сигналын қосатынын растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f5.jpg\" alt=\"5-сурет: Әрбір промпт үшін тұрақсыздықтың стандартты ауытқуы мен аралық күші (енгізілген қосымша бос орын токендерінің с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Әрбір промпт үшін тұрақсыздықтың стандартты ауытқуы мен аралық күші (енгізілген қосымша бос орын токендерінің саны). Әсерлер күштің артуымен өседі және модельге тәуелді қанығу нүктелерін көрсетеді, бұл ретте генерацияның үйлесімділік осьтері орташа күш деңгейлерінде ең сезімтал болады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f6.jpg\" alt=\"6-сурет: Әрбір промпт үшін тұрақсыздықтың стандартты ауытқуы мен регистр күші (бас әріппен жазылған таңбалар үлесі). Мін\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Әрбір промпт үшін тұрақсыздықтың стандартты ауытқуы мен регистр күші (бас әріппен жазылған таңбалар үлесі). Мінез-құлықтың анықталуы көптеген осьтер бойынша күштің артуымен өседі және 50-ден жоғары деңгейде платоға шығады, бұл ретте активтену геометриясы ең үлкен және ең тұрақты жауапты көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f7.jpg\" alt=\"7-сурет: Сұраныс бойынша тұрақсыздықтың стандартты ауытқуының тыныс белгілерінің күшіне тәуелділігі (әр сұранысқа енгізі\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Сұраныс бойынша тұрақсыздықтың стандартты ауытқуының тыныс белгілерінің күшіне тәуелділігі (әр сұранысқа енгізілген тыныс белгілері токендерінің саны). Генерацияның үйлесімділігі мен белсендіру осьтері күш әсеріне байланысты ең айқын эффектілерді көрсетеді; сенімділік осьтері негізінен өзгеріссіз қалады, бұл олардың негізгі нәтижелердегі төмен жалпы SGSX көрсеткішіне сәйкес келеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f8.jpg\" alt=\"8-сурет: Сұраныс бойынша тұрақсыздықтың стандартты ауытқуының сыпайылық дәрежесіне тәуелділігі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Сұраныс бойынша тұрақсыздықтың стандартты ауытқуының сыпайылық дәрежесіне тәуелділігі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-сурет: Сұраныс бойынша тұрақсыздықтың стандартты ауытқуының сыпайылық дәрежесіне тәуелділігі. Теріс мәндер дөрекі тұжырымдауға, оң мәндер сыпайы тұжырымдауға сәйкес келеді; нөл — өзгеріссіз бастапқы деңгей. Дөрекі нұсқалар модельдердің көпшілігінде және осьтердің басым бөлігінде сыпайы нұсқаларға қарағанда айтарлықтай және дәйекті мінез-құлық ауытқуларын тудырады, бұл модельдердің теріс және оң әлеуметтік тонға жауап беруіндегі асимметрияны көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f9.jpg\" alt=\"9-сурет: Сұраныс бойынша тұрақсыздықтың стандартты ауытқуының ұзындықты өзгерту коэффициентіне тәуелділігі (мақсатты ұзы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет: Сұраныс бойынша тұрақсыздықтың стандартты ауытқуының ұзындықты өзгерту коэффициентіне тәуелділігі (мақсатты ұзындықтың бастапқы сұранысқа қатынасы; 1,0-ден төмен мәндер сығылуды, 1,0-ден жоғары мәндер кеңеюді білдіреді). Сығылу генерацияның үйлесімділігі мен айналау осьтері бойынша кеңеюге қарағанда айтарлықтай және модельдер үшін дәйектірек мінез-құлық ауытқуларын тудырады, ал сенімділік осьтері кеңеюге күштірек жауап береді.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жинақталған&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;көрсеткіштер&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қатені&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасырады&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SAGO арқылы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тұрақтылықты&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бағалау&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельдер&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қайта құруда&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тұрақсыз&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\"
