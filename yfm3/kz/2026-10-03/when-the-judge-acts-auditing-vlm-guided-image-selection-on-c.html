        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"192\" cy=\"150\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"508\" cy=\"230\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SYNTHETIC   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Машина төрешісі:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейрожелілер неге ең сапалы&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;емес, бірінші кездескен&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;суретті таңдайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f1.jpg\" alt=\"1-сурет: Бірдей сұраныс, бірдей кескіндер, үш реттілік.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Бірдей сұраныс, бірдей кескіндер, үш реттілік.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Бірдей сұраныс, бірдей кескіндер, үш реттілік. Әр жолда үш үміткер бір ұсыну ретімен және адамдардың сұранысқа сәйкестігі бойынша орташа бағаларымен көрсетілген. Qwen3-VL-4B әр жолы A позициясындағы кескінді таңдайды (жақтаумен белгіленген), сондықтан оның таңдалған кескіні тек реттілікке байланысты 0,00, 0,50 немесе 0,83 балл алады. Кескіндер: CulturalFrames (Nayak және т.б. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Зерттеу көрсеткендей, &lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt; (көру-тіл модельдері) суреттерді таңдауда олардың сапасына емес, орналасу ретіне жиі сүйенеді. Тіпті 4 миллиард параметрі бар модельдердің өзі үміткерлердің ретін өзгерткенде кездейсоқ таңдаудан ұтылып қалады. Авторлар мұндай «төреші» модельдерді үміткерлердің ретін ауыстыру арқылы тексеруді ұсынады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;4B параметрлі модельдер 49% жағдайда бірінші суретті таңдайды, бұл кездейсоқ 28% көрсеткіштен жоғары.&lt;/li&gt;\n&lt;li&gt;Үміткерлер ретінің өзгеруі 60% жағдайда модель таңдауына әсер етеді.&lt;/li&gt;\n&lt;li&gt;Үйлесімділік сүзгілері әлсіз модельдерге көмектеседі, бірақ қуатты модельдердің дәлдігін төмендетуі мүмкін.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aedister-zhaene-daeldik\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#aedister-zhaene-daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер және дәлдік&lt;/span&gt;&lt;/a&gt;Әдістер және дәлдік&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Әдіс&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Деректер&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Дәлдік&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Шектеу&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;VLM-төреші (4B параметр)&lt;/td&gt;\n&lt;td&gt;300 мәдени промпт&lt;/td&gt;\n&lt;td&gt;49% жағдайда бірінші слот таңдалады&lt;/td&gt;\n&lt;td&gt;Күшті позициялық бұрмалаушылық&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;VLM-төреші (8B параметр)&lt;/td&gt;\n&lt;td&gt;300 мәдени промпт&lt;/td&gt;\n&lt;td&gt;Минималды позициялық бұрмалаушылық&lt;/td&gt;\n&lt;td&gt;Үйлесімділік сүзгілері жақсы шешімдерді де өшіреді&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жұмыста VLM модельдерінің (мысалы, Qwen3-VL-4B) ұсынылған жиынтықтан ең жақсы суретті таңдайтын «төреші» ретіндегі қабілеті талданды. Зерттеушілер CulturalFrames деректер базасынан 300 мәдени бағытталған промптты пайдаланды, мұнда әр сұраныс үшін 3-тен 4-ке дейін сурет болды. Әр модельдің шешімі модельдің өзіне беймәлім адам бағаларымен салыстырылды. Негізгі метрика «таңдаудағы өкініш» (&lt;a href=\"concepts/selection-regret.html\"&gt;selection regret&lt;/a&gt;) болды — бұл ең жақсы сурет рейтингі мен модель таңдаған сурет арасындағы айырмашылық.&lt;/p&gt;\n&lt;p&gt;Нәтижелер 4B модель 49% жағдайда бірінші суретті таңдайтынын және үміткерлер реті өзгергенде 60% жағдайда таңдау да өзгеретінін көрсетті. Үміткерлер реті өзгергенде шешімдердің үйлесімділігі (&lt;a href=\"concepts/agreement-gate.html\"&gt;agreement gate&lt;/a&gt;) тек әлсіз модельдер үшін пайдалы болып шықты: егер модель әртүрлі позицияларда бірдей суретті таңдаса, бұл нәтиже сапасын арттырады. Алайда, қуаттырақ 8B модельдер үшін мұндай сүзгі жиі сәтті нұсқаларды да алып тастайды, бұл әр архитектура үшін жеке &lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt; қажет екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 300 промптпен шектелген және нұсқаулардың шешім қабылдау процесіне әсерін ескермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Визуалды-тілдік модельдер (VLM) генерацияланған кескіндердің ішінен ең жақсысын таңдайтын «төреші» рөлін жиі атқаруда. Әдетте олардың сапасы адамдардың бағалауымен сәйкестігіне қарай анықталады, бірақ бұл модельдің түпкілікті таңдауға әсерін ескермейді. Бұл зерттеуде авторлар VLM модельдерін толыққанды шешім қабылдаушы субъектілер ретінде талдады. Ол үшін 300 мәдени тұрғыдан ерекше сұраныс қолданылды және модель таңдауы адамдардың тәуелсіз бағалауымен және кездейсоқ таңдаумен салыстырылды. Шешімдердің тұрақтылығын тексеру үшін әрбір сұраныс үміткерлердің ретін өзгерте отырып қайта орындалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VLM (Vision-Language Models) — кескін мен мәтінді бір уақытта талдай алатын нейрондық желілер, олар визуалды контентті мәтіндік сипаттама негізінде бағалай алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер 4 миллиард параметрлі (4B) модельдің кездейсоқ таңдаудан әрең озып, CLIP базалық көрсеткішінен төмен нәтиже беретінін көрсетті. Модель 49% жағдайда тізімдегі бірінші кескінді таңдаған (кездейсоқ таңдау ықтималдығы 28%), ал үміткерлердің ретін өзгерту 60% жағдайда шешімнің өзгеруіне әкелді. Бұл модель үшін рет өзгерген кезде шешімдердің өзгермеуі сапалы нәтиженің белгісі болды. Алайда, екінші, әлсіздеу төрешімен «келісім» арқылы &lt;a href=\"concepts/filtratsiya.html\"&gt;сүзгіден өткізу&lt;/a&gt; қате шешімдердің сақталып қалуына әкелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4B моделі позицияға күшті бейімділікті (49% жағдайда бірінші нұсқаны таңдау) және үміткерлер реті өзгергенде жоғары тұрақсыздықты (60% шешімнің өзгеруі) көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;8 миллиард параметрлі (8B) модель позициялық бейімділікті іс жүзінде көрсетпеді және CLIP-тен жақсы нәтиже берді. Соған қарамастан, ол үшін «келісім» қағидасы бойынша сүзгіден өткізу тиімсіз болып шықты және тіпті сапалы шешімдерді де жоққа шығарды. Авторлардың айтуынша, келісім тек модельдің нақты қате түріне бағытталғанда ғана көмектеседі, сондықтан сүзгіден өткізу әдістері төреші нұсқасы әр өзгерген сайын қайта қаралуы тиіс. Сондай-ақ, 4B моделіндегі стереотиптік бағалаулардың аздап өсуі реттер бойынша агрегациядан кейін немесе ірірек модельді қолданғанда жоғалатыны анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 300 мәдени сұраныспен шектелген; 4B және 8B модельдерінің нәтижелерін қосымша тексерусіз барлық VLM архитектураларына қолдануға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Бірнеше генерацияланған кескіннің ішінен біреуін таңдайтын көру-тіл модельдері (VLM) жай ғана сапа бағасын есептемейді. Олардың таңдауы пайдаланушы қандай контентті көретінін анықтайды. Тәжірибелік сұрақ мынада: бұл таңдау нәтижені жақсарта ма, әлде модельдің бағасы адамдардың пікірімен сәйкес келе ме? Мәдени тұрғыдан ерекше сұраныстар үшін визуалды тартымдылық немесе таныс белгілер пайдаланушының қанағаттануының нашар көрсеткіші болуы мүмкін. Кескін сұралған нысанды қамтуы мүмкін, бірақ оның айналасындағы әлеуметтік контекстті бұрмалауы мүмкін, ал таңдаушы модель басқа нұсқа сұранысқа сай болса да, сол кескінді таңдауы мүмкін. Бұл таңдауды бағалау үшін модельдің өзінен емес, тәуелсіз алынған рейтингтер қажет. Біз CulturalFrames ашық деректер жиынтығын қолданамыз, оның құрамында генерацияланған кескіндер мен адамдардың бағалары бар, мұнда нақты және жасырын күтулер мен стереотиптер ескеріледі. Біздің зерттеуімізде ашық салмақты VLM 3-4 кескіннің біреуін таңдайды (3-сурет), мұнда генератор атаулары немесе рейтингтер көрсетілмейді. Біз модель таңдауын кездейсоқ таңдаумен және сол жиынтықтағы ең үздік үміткермен салыстырамыз, бұл таңдау процесінің әсерін генерация процесінен бөліп алуға мүмкіндік береді. Негізгі көрсеткіш — «таңдаудағы өкініш» (selection &lt;a href=\"concepts/regret.html\"&gt;regret&lt;/a&gt;), ол сұранысқа сәйкестік бойынша орташа адам рейтингіндегі айырмашылықпен өлшенеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу «таңдаудағы өкінішті» өлшейді — бұл модель таңдаған кескін сапасы мен жиынтықтағы ең үздік нұсқа арасындағы айырмашылық.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khatysty-zhumystar\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#khatysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қатысты жұмыстар&lt;/span&gt;&lt;/a&gt;Қатысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;Мәдени өкілдік бойынша қолданыстағы тәсілдер, мысалы, CulturalFrames, автоматты метрикаларды жеке кескіндер үшін адамдардың бағаларымен салыстыруға бағытталған. Біз болсақ, үміткерлер жиынтығы ішіндегі таңдау процесін талдаймыз. Басқа жұмыстар артықшылықтар негізінде марапаттау модельдерін оқытуды зерттейді, бірақ біз жаңа марапаттау моделін ұсынбаймыз, тек қолданыстағы «қатырылған» таңдаушыларға аудит жүргіземіз. VLM бағалау саласында көрсетілгендей, мультимодальды төрешілер визуалды дәлелдерді елемей, ақпараттық жауаптарға басымдық беруі немесе нұсқалардың ұсынылу ретіне қатысты бейтараптық (&lt;a href=\"concepts/position-bias.html\"&gt;position bias&lt;/a&gt;) көрсетуі мүмкін. Осындай эффектілер нұсқаулықтар қайта құрылғанда немесе модель кескіннің мәтінге сәйкестігін бағалағанда байқалады. Біз бұл құбылыстарды модельдің шығысы әрекет (кескінді таңдау) болатын сценарийде зерттейміз және бұл таңдаудың модельдер келісімі негізінде шешім қабылдаудан бас тарту механизмдерімен өзара әрекеттесуін тексереміз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Position bias (орын бейтараптығы) — модельдің мазмұнына қарай емес, тізімдегі реттік нөміріне қарай нұсқаға басымдық беру бейімділігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл тәжірибедегі таңдаушы модельдер «қатырылған» (оқыту процесінде өзгермейді), бұл олардың бейтараптығын кері байланыс арқылы түзету мүмкіндігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"maesele-zhaene-oelshemder\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#maesele-zhaene-oelshemder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мәселе және өлшемдер&lt;/span&gt;&lt;/a&gt;Мәселе және өлшемдер&lt;/h4&gt;\n&lt;p&gt;Таңдау міндеті келесідей: p промпті үшін m_p (3 немесе 4) алдын ала генерацияланған суреттер жиынтығы бар. Таңдау саясаты π промпт пен суреттерді қабылдап, индекс қайтарады немесе таңдаудан бас тартады. Әрбір үміткердің пайдалылығы h_p бірнеше аннотатордың бағаларының (0, 0.5 немесе 1) орташа мәні ретінде анықталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Негізгі көрсеткіш — «өкініш» (regret), яғни ең жоғары бағаланған үміткер мен таңдалған сурет арасындағы айырмашылық; нөлдік мән ең жақсы сурет таңдалғанын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тиімділікті бағалау үшін үш метрика қолданылады: өкініш &lt;span class=\"yfm-latex\" data-content=\"R_p(%5Cpi)%20%3D%20h%5E%5Cstar_p%20-%20h_%7Bp%2C%5Cpi(p)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, кездейсоқ таңдауға қатысты ұтыс &lt;span class=\"yfm-latex\" data-content=\"G_p(%5Cpi)%20%3D%20h_%7Bp%2C%5Cpi(p)%7D%20-%20%5Cbar%7Bh%7D_p\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және орташадан төмен суретті таңдау ықтималдығы (BMR). Кездейсоқ таңдау базалық сызық ретінде қызмет етеді. Сондай-ақ, мәдени қателіктер (стереотиптер, күтулердің болмауы) бақыланады, мұнда теріс мәндер кездейсоқ таңдауға қарағанда қателіктердің аз екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/pozitsionnoe-smeschenie.html\"&gt;Позициялық ауытқу&lt;/a&gt; — бұл суреттің мазмұнына қарамастан белгілі бір слоттарға (мысалы, A, B, C) артықшылық беру.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тұрақтылықты тексеру үшін K=3 циклдік көрсету тәртібі қолданылады. «Қақпалар» (gates) шешімдерді сүзеді: мысалы, τ=2/3 шегінде тек үш тәртіптің екеуінде таңдалған нұсқа қабылданады. Біз қамтуды (өңделген промпттар үлесі) бағалаймыз және нәтижелерді «сүзгіден өтпеген» төрешімен салыстырамыз.&lt;/p&gt;\n&lt;h4 id=\"derekter-zhiyntyghy-zhaene-boelu\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#derekter-zhiyntyghy-zhaene-boelu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректер жиынтығы және бөлу&lt;/span&gt;&lt;/a&gt;Деректер жиынтығы және бөлу&lt;/h4&gt;\n&lt;p&gt;Жұмыс CulturalFrames деректер жиынтығына негізделген, ол 3637 сурет жолын және 10 412 жеке бағаны қамтиды. Сүзгіден өткізгеннен кейін (аннотациясыз жазбалар мен дубликаттарды алып тастау) 961 бірегей промпт қалды: 313 үш суретті және 648 төрт суретті жиынтық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Таңдамаларға бөлу (split) промпт идентификаторларын детерминирленген хештеуге негізделген, бұл аннотатор бағаларынан деректердің ағып кетуін болдырмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Негізгі талдау үшін 300 промпттан тұратын таңдама (10 елдің әрқайсысы үшін 30-дан) қалыптастырылды, бұл нақты таралуды қайталамайтын теңдестірілген бағалауды қамтамасыз етеді. Жіберіп алынған аннотациялар толықтырылмады.&lt;/p&gt;\n&lt;h4 id=\"ashykh-salmakhty-toereshiler\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#ashykh-salmakhty-toereshiler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ашық салмақты төрешілер&lt;/span&gt;&lt;/a&gt;Ашық салмақты төрешілер&lt;/h4&gt;\n&lt;p&gt;Негізгі төреші ретінде Qwen3-VL-4B-Instruct, ал қосалқы ретінде SmolVLM2-2.2B-Instruct модельдері таңдалды. Қайталану мүмкіндігін қамтамасыз ету үшін модель ревизиялары, тәуелділік нұсқалары және &lt;a href=\"concepts/inferens.html\"&gt;инференс&lt;/a&gt; параметрлері сақталады. Есептеулер жергілікті деңгейде, ашкөз декодтау (&lt;a href=\"concepts/greedy-decoding.html\"&gt;greedy decoding&lt;/a&gt;), 64 токендік шығыс шектеуі және түсіндірмелерсіз жүзеге асырылады. Qwen кескіндері 448 пиксел шеңберінде пропорцияны сақтай отырып бейімделеді, ал Smol жадты үнемдеу үшін 384 пиксел өлшемінде жұмыс істейді. Визуалды токендер бюджетіндегі айырмашылықтарға байланысты, төрешілер арасындағы нәтижелерді тек модель қабілетімен түсіндіруге болмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Екі түрлі модельді пайдалану және олардың кескінді өңдеу параметрлеріндегі айырмашылықтар нәтижелерді тікелей салыстыру мүмкіндігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сұрау кескін мен үміткерлер белгілерін қамтиды. Нұсқаулық промптқа сәйкестікті, контексттік үйлесімділікті, стереотиптерден аулақ болуды және визуалды тұтастықты бағалауды талап етеді. Модельдерге мәдени белгілерді тек олардың саны немесе танымалдығы үшін жоғары бағалауға тыйым салынады. Qwen таңдау мен рейтингті қамтитын JSON форматында жауап береді, ал Smol тек таңдауды қайтарады. JSON жарамдылығы мен шешімдердің дәлдігі бөлек қадағаланады.&lt;/p&gt;\n&lt;h4 id=\"uemitkerler-reti-zhaene-zharamsyz-naetizheler\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#uemitkerler-reti-zhaene-zharamsyz-naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Үміткерлер реті және жарамсыз нәтижелер&lt;/span&gt;&lt;/a&gt;Үміткерлер реті және жарамсыз нәтижелер&lt;/h4&gt;\n&lt;p&gt;Әрбір промпт үшін үш түрлі циклдік ұсыну қолданылады: канондық рет және екі &lt;a href=\"concepts/determinirovannye-povoroty.html\"&gt;детерминирленген айналдыру&lt;/a&gt;. Бұл реттіліктің нәтижеге әсерін бағалауға көмектеседі. Негізгі шешім канондық реттегі нәтиже болып табылады. Парсингте қателік орын алғанда «тыйылу» (abstention) тіркеледі, қайталау әрекеттері бір итерациямен шектелген. Жарамсыз нәтижелер есептен шығарылмайды, пайдалылық (utility) және өкіну (regret) көрсеткіштері қамту (coverage) деңгейімен бірге есептеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детерминирленген айналдыру — бұл тізімдегі элементтер ретін өзгерту арқылы модельдің бірінші нұсқаға бейімділігін тексеру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tyjylu-arkhyly-tangdau\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#tyjylu-arkhyly-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тыйылу арқылы таңдау&lt;/span&gt;&lt;/a&gt;Тыйылу арқылы таңдау&lt;/h4&gt;\n&lt;p&gt;Сүзу шектері $ au \\in {1/3, 2/3, 1}$ және модельдер арасындағы ережелер инференс басталғанға дейін белгіленген. Сүзу тек барлық үш шақыру сәтті парс жасалғанда ғана жұмыс істейді. Тең түскен жағдайда канондық рет басымдыққа ие. Тыйылу жағдайында «қауіпсіз» нәтиже қарастырылмайды, сондықтан әрбір бағалауда қамту деңгейі көрсетіледі.&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-taldau\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық талдау&lt;/span&gt;&lt;/a&gt;Статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;Талдау бірлігі — үміткерлер жиынтығымен бірге берілген промпт. Орташа мәндер мен жұптық айырмашылықтар үшін 95% сенімділік интервалдары 10 000 бутстрап итерациясы (seed 20261002) көмегімен есептеледі. BMR саясаты үшін Уилсон интервалдары қолданылады. Позиция әсері, сүзгі арқылы қабылданбаған промпттар және қосымша зерттеулер (5.5 және 5.6-бөлімдер) эксплораторлық деп жіктеледі, себебі олар негізгі инференстен кейін қосылған.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"tanystyru-orny\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#tanystyru-orny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таныстыру орны&lt;/span&gt;&lt;/a&gt;Таныстыру орны&lt;/h4&gt;\n&lt;p&gt;Екі негізгі судья-модель де бастапқы позицияларға айқын артықшылық береді (4c-сурет). Qwen 900 шақырудың 48,8%-ында A слотын таңдайды, бұл кездейсоқ таңдаудан (27,8%) айтарлықтай жоғары (χ²=219, p&amp;lt;10⁻¹⁰). Smol болса 93,3% жағдайда A немесе B слоттарын таңдайды. Qwen таңдауының 59,7%-ы кескіндердің ретіне қарай өзгереді. Кей жағдайларда судья жай ғана бірінші кескінді таңдайды, бірақ талдау модельдің мазмұнға да жауап беретінін көрсетеді. Үш ротация бойынша орташа көрсеткішті есептегенде, Qwen адамдар тарапынан ең жоғары бағаланған кескіндерді 57,9% жағдайда таңдайды (кездейсоқ таңдауда 27,8%).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Судья-модельдер тізім басындағы кескіндерді таңдауға бейім, бұл бағалауды бұрмалайды, дегенмен олар мазмұнды түсіну қабілетін сақтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kelisim-khakhpalary-neni-sakhtajdy-zhaene-neni-khabyldamajdy\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#kelisim-khakhpalary-neni-sakhtajdy-zhaene-neni-khabyldamajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Келісім қақпалары нені сақтайды және нені қабылдамайды&lt;/span&gt;&lt;/a&gt;Келісім қақпалары нені сақтайды және нені қабылдамайды&lt;/h4&gt;\n&lt;p&gt;«Келісім сүзгілерін» (agreement gates) пайдалану анық емес сұраныстарды сұрыптауға мүмкіндік береді. Егер үш ротацияда да судьяның бірауыздан келісімі талап етілсе (сұраныстардың 40,3%-ы), Qwen таңдауының кездейсоқ таңдаудан артықшылығы 0,141 [0,110, 0,173] құрайды. Қабылданбаған сұраныстарда (179 жағдай) нәтиже −0,030 [−0,057, −0,002] дейін төмендейді. «Үш жағдайдың екеуі» сүзгісі аралық нұсқа болып табылады, ол сұраныстардың 80,7%-ын сақтап, 0,094 [0,071, 0,118] өсімді қамтамасыз етеді. Екі түрлі модель (Qwen және Smol) арасындағы келісім нашар жұмыс істейді: ол көбінесе модельдер мазмұнға қатысы жоқ себептермен (мысалы, позицияға ортақ бейімділік) бірдей шешімге келген сұраныстарды таңдап алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Келісім сүзгісі (&lt;a href=\"concepts/gate.html\"&gt;gate&lt;/a&gt;) — бұл модель әртүрлі жағдайларда (мысалы, кескіндер реті өзгергенде) бірдей жауап берген жағдайларды сұрыптап алатын әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"clip-bazalykh-modelimen-salystyru\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#clip-bazalykh-modelimen-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CLIP базалық моделімен салыстыру&lt;/span&gt;&lt;/a&gt;CLIP базалық моделімен салыстыру&lt;/h4&gt;\n&lt;p&gt;CLIP (ViT-L/14) әдісімен салыстыру бұл тәсілдің, яғни ретке тәуелді емес әдістің 0,069 [0,047, 0,090] өсімге қол жеткізетінін көрсетеді, бұл Qwen нәтижесінен (0,039) сәл жоғары. Алайда, CLIP те стереотиптік кескіндер рейтингін 0,026 [0,006, 0,046] деңгейіне дейін арттырады, бұл Qwen-мен бірдей. CLIP үшін кішірек ViT-B/32 архитектурасын пайдалану шамамен бірдей өсімді (0,063) береді, бірақ стереотиптердің өсуіне әкелмейді, бұл әсердің модель архитектурасына тәуелді екенін көрсетеді. Зерттеу тіпті мамандандырылған бағалаушылардың да бейтараптық мәселелерінен ада емес екенін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CLIP-пен салыстыру зерттеу сипатында және таңдауға әсер ететін барлық факторларды ескермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; 300 негізгі сұраныс бойынша таңдау нәтижелері&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Көрсеткіш&lt;/th&gt;\n&lt;th&gt;Oracle&lt;/th&gt;\n&lt;th&gt;Qwen&lt;/th&gt;\n&lt;th&gt;Smol&lt;/th&gt;\n&lt;th&gt;Random&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Mean regret&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;0.160&lt;/td&gt;\n&lt;td&gt;0.270&lt;/td&gt;\n&lt;td&gt;0.199&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;95% сенімділік интервалдары (bootstrap). Cov.: саясат қолданылатын сұраныстар үлесі. Align.: сұранысқа сәйкестіктің орташа рейтингі. Gain over random: кездейсоқ таңдаумен салыстырғандағы ұтыс. BMR: рейтингі пулдың орташа көрсеткішінен төмен кескіндер үлесі. Best: ең жоғары рейтингі бар кескіндер үлесі. Worst: елдер тобы бойынша ең жоғары орташа өкініш (regret).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"poziciyalykh-yghysu-artefakt-pa\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#poziciyalykh-yghysu-artefakt-pa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Позициялық ығысу артефакт па?&lt;/span&gt;&lt;/a&gt;Позициялық ығысу артефакт па?&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер бірінші нұсқаға басымдық беру интерфейс ерекшеліктерінен туындағанын тексерді. Qwen моделімен 300 промпт бойынша үш тест өткізілді. Жауап форматын рейтингтен бір нұсқаны таңдауға өзгерткенде, модель бірінші слотты 44,8% жағдайда таңдады (біркелкі үлестірімде 27,8%). A/B/C/D белгілерін бейтарап кодтарға ауыстырғанда, бірінші кескінді таңдау жиілігі 51,8% болды. Төрт кескіннің толық ротациясы да ығысуды растады: бірінші слот 52,5% жағдайда таңдалды. Барлық нұсқада бірінші слотқа басымдық сақталды, бұл модельдің ішкі ерекшелігін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Позициялық ығысу Qwen моделінің тұрақты сипаттамасы болып табылады, интерфейс немесе белгілер артефакті емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"masshtabtau-yghysudy-zhoya-ma\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#masshtabtau-yghysudy-zhoya-ma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Масштабтау ығысуды жоя ма?&lt;/span&gt;&lt;/a&gt;Масштабтау ығысуды жоя ма?&lt;/h4&gt;\n&lt;p&gt;Модель көлемінің әсерін тексеру үшін Qwen3-VL-8B-Instruct сыналды. 4B моделінің 8-биттік кванттаумен бақылау сынағы негізгі тестпен бірдей нәтиже көрсетті (48,2% бірінші слот таңдауы). 8B моделінде ығысу іс жүзінде жойылды: бірінші слот 27,8%-ға жақын 27,3% жағдайда таңдалды (p = 0,06). 8B моделі CLIP (0,069) салыстырғанда жоғары сапа өсімін (0,097) көрсетті. Алайда, модель өзгерген кезде «бірауыздан шешім қабылдау» (unanimity gate) механизмін қайта қарау керек, өйткені ол 8B моделі 4B-ге қарағанда жақсырақ қабылдайтын сапалы шешімдерді алып тастай бастайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель көлемін 8B-ге дейін арттыру позициялық ығысуды кездейсоқ таңдау деңгейіне дейін төмендетеді және жалпы дәлдікті арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"maedeni-khatelikter-naetizheleri\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#maedeni-khatelikter-naetizheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мәдени қателіктер нәтижелері&lt;/span&gt;&lt;/a&gt;Мәдени қателіктер нәтижелері&lt;/h4&gt;\n&lt;p&gt;Qwen айқын күтулерді өткізіп алуды 0,056-ға, жасырын күтулерді 0,034-ке төмендетеді. Алайда, стереотип рейтингі 0,125-тен 0,148-ге дейін өсті. Бұл өсім негізінен стереотип көрсеткіштері жоғары SD-3.5-Large генераторының кескіндеріне басымдық берумен байланысты. Жауаптарды үш рет бойынша біріктіргенде немесе «бірауыздан шешім қабылдауды» қолданғанда, стереотиптердің статистикалық маңызды өсімі жоғалады, сонымен бірге модельдің күтулердегі қателіктерді азайту қабілеті сақталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стереотиптердің өсуі зерттеу сипатында, өйткені Бонферрони түзетуінен кейін сенім аралығы нөлді қамтиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"elder-toptary\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#elder-toptary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Елдер топтары&lt;/span&gt;&lt;/a&gt;Елдер топтары&lt;/h4&gt;\n&lt;p&gt;Qwen сапа өсімінің бағасы 10 ел тобының 7-еуінде оң нәтиже берді. Ең жоғары regret (өкініш) мәні Жапонияда (0,275) тіркелді, мұнда кездейсоқ таңдау да жоғары regret деңгейіне ие (0,266). Топ бойынша шағын таңдама көлеміне (30 промпт) байланысты бұл аралықтар кең және бір-бірімен қиылысады, сондықтан талдау топтарды мәдени артықшылықтар бойынша рейтингтеуге мүмкіндік бермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Regret (өкініш) — модель таңдаған нұсқа сапасы мен берілген жиынтықтағы ең жоғары мүмкін сапа арасындағы айырмашылықты көрсететін метрика.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Әрекетті бағалау ұпайды бағалаудан маңыздырақ. Кескіндерді сенімді түрде саралайтын төреші әрекет ету қажет болғанда сәтсіз нұсқаны таңдауы мүмкін. Таңдалған кескінді ең жақсы қолжетімді және кездейсоқ таңдаумен салыстыру шешімнің құндылығын көрсетеді және ұпайлар корреляциясы жасыратын қателерді, мысалы, кескіннің орналасуына қатты тәуелділікті ашады.&lt;/p&gt;\n&lt;p&gt;Келісім шлюздері (agreement gates) өз аудитін қажет етеді. Келісім тек төрешінің қате режимін бұзғанда ғана пайдалы. Келісім тұрақты қателерді сақтап қалуы мүмкін, сондықтан өкініштің (regret) кез келген төмендеуі қабылданған промпттар үшін кездейсоқ таңдаумен және қабылданбағандары үшін төрешімен салыстырылуы керек. Позициялық ауытқу (position bias) біз зерттеген екі шлюздің неге ерекшеленетінін түсіндіреді. Ротациялар бойынша бірауыздылық әртүрлі слоттардан бірдей кескінді талап етеді, бұл позицияға тәуелді таңдауларды сүзеді; слот артықшылықтары ұқсас екі төреші мазмұнға қатысы жоқ себептермен келісіп қалуы мүмкін. Ротациялар бойынша дауыс беру арқылы ретті орташалау таңдаудан бас тартпастан жоғалған құндылықтың бір бөлігін қалпына келтіреді. Таңдаудан бас тарту практикалық сұрақ қалдырады: қабылданбаған сұранысты кім, қандай шығынмен және қандай нәтижемен шешеді?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ротациялар бойынша бірауыздылық позициялық қателерді тиімді сүзеді, алайда келісім жүйелі қателерді жасыруы мүмкін болғандықтан аудитті талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"birauyzdylykh-naetizhesi-ongaj-prompttarmen-tuesindirile-me\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#birauyzdylykh-naetizhesi-ongaj-prompttarmen-tuesindirile-me\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бірауыздылық нәтижесі оңай промпттармен түсіндіріле ме?&lt;/span&gt;&lt;/a&gt;Бірауыздылық нәтижесі оңай промпттармен түсіндіріле ме?&lt;/h4&gt;\n&lt;p&gt;Жоқ. Бірауыздылық сақтап қалатын промпттардағы үміткерлер қабылданбағандарына қарағанда рейтинг бойынша көбірек ерекшеленеді, сондықтан қалған пулдар қате үшін көбірек орын қалдырады, азырақ емес. Төрешінің олардағы ұтысы үлкен, ал қабылданбаған промпттарда ол нөлден төмен.&lt;/p&gt;\n&lt;h4 id=\"masshtabpen-ne-oezgeredi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#masshtabpen-ne-oezgeredi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Масштабпен не өзгереді?&lt;/span&gt;&lt;/a&gt;Масштабпен не өзгереді?&lt;/h4&gt;\n&lt;p&gt;8B кеңейтімі нақты қатенің әмбебап емес екенін көрсетеді: позициялық ауытқу дерлік жоғалады және онымен бірге шлюздің кездейсоқ шешімдерден төмендерін сүзіп тастау қабілеті де, ретке сезімталдық сақталса да. Аудиттің өзі өзгеріссіз қалады және дәл ол айырмашылықты ашады. Практикалық сабақ: бір төреші үшін расталған сүзгі екіншісі үшін жарамсыз. Ретті тексеру арзан. Біздің жабдықта бір Qwen шешімі медианды 3,5 секундты, ал үш рет 10,6 секундты (шамамен 3 есе қымбат) алады, бұл дауыс беру ұтысын немесе бірауыздылық сүзгісін береді. Төртінші ретті қосу өкінішті одан әрі төмендетпестен қамтуды азайтады (төрт реттік бірауыздылық 0,095 өкініште төрт кескінді пулдардың 27,5%-ын сақтайды, Сурет S14). Ретке сезімталдық үміткерлердің жақындығына әлсіз байланысты: Qwen таңдауы рейтинг диапазонының төменгі үштен біріндегі промпттардың 62,8%-ында және жоғарғы бөлігінде 53,6%-ында өзгереді (Кесте S17), демек, ауытқу тек тең түсуге жақын жағдайлармен шектелмеген. Үйлестіру және мәдени қателер әртүрлі нысаналар болып табылады. VLM төрешісі де, CLIP базасы да жіберіп алынған мәдени күтулерді азайтады, бірақ стереотип рейтингтері әртүрлі қозғалады: төреші оларды аздап көтереді, CLIP бэкендтерінің бірі сияқты, бірақ екіншісі емес. Төреші шешімдерін реттер бойынша жинақтау байқалатын өсуді қалдырмайды. Промпт үйлестіруіне бапталған селектор стереотип нәтижелері бойынша бөлек аудиттелуі керек, өйткені композиттік ұпайлар бұл ымыраны жасырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Позициялық ауытқу — модельдің тізімдегі орнына қарай объектіге басымдық беру бейімділігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler-zhaene-etika\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#shekteuler-zhaene-etika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер және этика&lt;/span&gt;&lt;/a&gt;Шектеулер және этика&lt;/h4&gt;\n&lt;p&gt;CulturalFrames зерттеуі елдердің, домендердің, промпттардың және генераторлардың шектеулі жиынтығын қамтиды. Елдік белгілер ішкі әртүрлілікті толық ашпауы мүмкін. Үміткер кескіндер белгілі бір генераторлар тобынан алынған, сондықтан нәтижелер олардың визуалды стильдеріне байланысты. Кіріс кескіндерінің рұқсаты (resolution) ұсақ бөлшектерді жасыруы мүмкін. Адам бағалауы мінсіз емес: аннотаторлар арасындағы келіспеушіліктер мен деректердегі шу «оракул» (бағалау жүйесі) нәтижелерін сақтықпен түсіндіруді талап етеді. Сенімділік интервалдары адам бағалауының барлық мүмкін болатын белгісіздігін емес, орташа мәндерді көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шағын генераторлар мен елдер жиынтығымен шектелген, нәтижелер аннотаторлардың субъективтілігі мен модельдердің ерекшеліктеріне тәуелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4B және 2.2B параметрлі модельдер күшті позициялық ығысуды көрсетеді; бұл жағдай үлкенірек модельдерде азаюы мүмкін, бірақ бұл тексерілмеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель таңдауы пайдаланушыға келтірілген нақты зиянды немесе өңдеу процесін өлшемейді. Негізгі бағалаушы модельдер шағын (4 млрд және 2,2 млрд параметр). 8 млрд параметрлі модельмен жүргізілген қосымша тест позициялық ығысу модель масштабымен азаятынын көрсетті. Әр ел үшін 30 промпт қолданылғандықтан, топтар арасындағы айырмашылықтарды анықтау үшін статистикалық қуат жеткіліксіз. Позициялық ығысу және &lt;a href=\"concepts/masshtabirovanie.html\"&gt;масштабтау&lt;/a&gt; талдаулары бастапқы (exploratory) сипатқа ие. Зерттеу жеке деректерді жинамай, ашық бенчмарктің қайталама талдауы болып табылады. Авторлар код пен мәтін жазуда AI-көмекшілерін (OpenAI Codex, Anthropic Claude) қолданды, бірақ барлық эмпирикалық нәтижелер шығарылған аннотациялар негізінде есептелген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Позициялық ығысу (position bias) — модельдің мазмұнына қарамастан, тізімдегі белгілі бір орында тұрған нәтижені артық көру бейімділігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zertteu-uelesi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#zertteu-uelesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу үлесі&lt;/span&gt;&lt;/a&gt;Зерттеу үлесі&lt;/h4&gt;\n&lt;p&gt;Жұмыс мыналарды ұсынады: (i) VLM (визуалды-тілдік модельдер) үшін позициялар ротациясымен аудит хаттамасы; (ii) шағын ашық модельдердегі күшті позициялық ығысудың дәлелдері және кейінгі абляциялық тесттер; (iii) мазмұн бойынша базалық сызықпен салыстырғанда промпттарды таңдаудағы «келісім қақпаларының» (agreement gates) аудиті. Барлық эксперименттер мен талдаулар түпнұсқа болып табылады.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Қате рейтингтері әртүрлі пулдардағы Qwen таңдауы&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Санат&lt;/th&gt;\n&lt;th&gt;Қамту&lt;/th&gt;\n&lt;th&gt;Random (matched)&lt;/th&gt;\n&lt;th&gt;Qwen, order gate&lt;/th&gt;\n&lt;th&gt;Qwen, cross-model gate&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Majority&lt;/td&gt;\n&lt;td&gt;100%, n=300&lt;/td&gt;\n&lt;td&gt;0.25&lt;/td&gt;\n&lt;td&gt;0.22&lt;/td&gt;\n&lt;td&gt;0.20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;≥2/3&lt;/td&gt;\n&lt;td&gt;81%, n=242&lt;/td&gt;\n&lt;td&gt;0.21&lt;/td&gt;\n&lt;td&gt;0.19&lt;/td&gt;\n&lt;td&gt;0.13&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3/3&lt;/td&gt;\n&lt;td&gt;40%, n=121&lt;/td&gt;\n&lt;td&gt;0.11&lt;/td&gt;\n&lt;td&gt;0.07&lt;/td&gt;\n&lt;td&gt;0.07&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Selected және Random — орташа қателік көрсеткіштері; айырмашылық жұптық (95% CI). Шарттар бір-бірімен қиылысады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Елдер бойынша негізгі бөлініс&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Ел&lt;/th&gt;\n&lt;th&gt;Random&lt;/th&gt;\n&lt;th&gt;Qwen&lt;/th&gt;\n&lt;th&gt;Smol&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Japan&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Iran&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Poland&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Canada&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;South Africa&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;China&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Chile&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Brazil&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;India&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Germany&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Әр ел үшін 30 сұраныс топтамасы. Mean align. және Stereo. — үміткерлердің орташа рейтингтері.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"vlm-toereshi-zhumysyn-taldau\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#vlm-toereshi-zhumysyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VLM-төреші жұмысын талдау&lt;/span&gt;&lt;/a&gt;VLM-төреші жұмысын талдау&lt;/h4&gt;\n&lt;p&gt;Зерттеу көрсеткендей, суретті таңдауда төреші қызметін атқаратын 4 миллиард параметрі бар VLM (Vision-Language Model) моделі кездейсоқ таңдаудан (0,039) айтарлықтай аспайтын тиімділікті көрсетеді. Бұл әдіс CLIP ұқсастықты бағалау жүйесінен дәлдігі бойынша қалыс қалады және айқын позициялық ығысуды (position bias) көрсетеді: модельдердің 48,8% жағдайда тізімде бірінші тұрған суретті таңдайтыны анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4B параметрлі VLM-төреші күшті позициялық ығысуға ие, ол 48,8% жағдайда бірінші суретті таңдайды, бұл оның жұмысын кездейсоқ таңдаудан әрең ажыратады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler-men-masshtabtau\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#shekteuler-men-masshtabtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен масштабтау&lt;/span&gt;&lt;/a&gt;Шектеулер мен масштабтау&lt;/h4&gt;\n&lt;p&gt;Үміткерлердің реті өзгерген кезде шешімдердің сәйкес келуі модельдің дұрыс және қате шешімдерін ажыратуға көмектеседі. Алайда, ұқсас позициялық ығысуы бар әлсіз модельмен сәйкестік сенімділік көрсеткіші болып табылмайды. Сол отбасына жататын үлкенірек модельге (8B параметр) ауысқанда, позициялық ығысу дерлік жоғалады. Сонымен қатар, реттілік бойынша сәйкестікке негізделген сүзгі механизмі (gate) 8B моделі үшін көбінесе дұрыс шешімдерді де алып тастайды. Бұл бір модель үшін расталған тексеру критерийлері екіншісіне автоматты түрде көшірілмейтінін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бір модель үшін әзірленген аудит және сүзу әдістері әмбебап емес және VLM архитектурасы немесе көлемі өзгерген кезде қайта валидациядан өтуі тиіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tangdau-zhuejeleri-ueshin-khorytyndylar\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#tangdau-zhuejeleri-ueshin-khorytyndylar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таңдау жүйелері үшін қорытындылар&lt;/span&gt;&lt;/a&gt;Таңдау жүйелері үшін қорытындылар&lt;/h4&gt;\n&lt;p&gt;Сәйкестікті тексерудің пайдалылығы тек модельдің нақты қате түріне бағытталған жағдайларда ғана шектеулі. Сондықтан, таңдау жүйелерінің, соның ішінде сүзгілердің аудиті әрбір төреші-модель ауысқан сайын қайта жүргізілуі керек. Бұл нәтижелер үміткерлердің бекітілген жиынтығынан бір суретті таңдау сценарийіне қатысты. Жұмыс істеп тұрған таңдау жүйесін толық бағалау үшін пайдаланушылардың мінез-құлқын, олардың кейінгі әрекеттерін және модель шешім қабылдаудан бас тартқан жағдайдағы нәтижелерді талдау қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VLM (Vision-Language Model) — суреттерді талдап, олар туралы сұрақтарға табиғи тілде жауап бере алатын нейрондық желі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f1.jpg\" alt=\"1-сурет: Бірдей сұраныс, бірдей кескіндер, үш реттілік.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Бірдей сұраныс, бірдей кескіндер, үш реттілік.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Бірдей сұраныс, бірдей кескіндер, үш реттілік. Әр жолда үш үміткер бір ұсыну ретімен және адамдардың сұранысқа сәйкестігі бойынша орташа бағаларымен көрсетілген. Qwen3-VL-4B әр жолы A позициясындағы кескінді таңдайды (жақтаумен белгіленген), сондықтан оның таңдалған кескіні тек реттілікке байланысты 0,00, 0,50 немесе 0,83 балл алады. Кескіндер: CulturalFrames (Nayak және т.б. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f2.jpg\" alt=\"2-сурет: VLM-төрешілер айқын жақсырақ үміткер болған кезде орташадан төмен кескіндерді қайтара алады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: VLM-төрешілер айқын жақсырақ үміткер болған кезде орташадан төмен кескіндерді қайтара алады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: VLM-төрешілер айқын жақсырақ үміткер болған кезде орташадан төмен кескіндерді қайтара алады. Әр топ — бір CulturalFrames сұранысы (Nayak және т.б. 2025); сандар — адамдардың сұранысқа сәйкестігі бойынша орташа бағалары. Қызыл: Qwen3-VL-4B-тің бастапқы реттегі таңдауы, пул бойынша орташа көрсеткіштен төмен. Жасыл: ең жоғары бағаланған үміткер. Сұраныстар кескіндерді көрместен қолданылатын бекітілген ережеге сәйкес келеді (D қосымшасы); олар қателік түрін көрсетеді, оның жиілігін емес (4-сурет).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f3.jpg\" alt=\"3-сурет: Аудит хаттамасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Аудит хаттамасы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Аудит хаттамасы. (a) CulturalFrames-тен алынған қатырылған үміткерлер пулы: төрт генератордан алынған үш немесе төрт кескіні бар мәдени контекстегі сұраныстар. (b) Таңдау: әр төреші тек сұраныс пен кескіндерді үш циклдік ретпен көреді; келісім қақпалары (agreement gates) әрекет етуді немесе қалыс қалуды шешеді. (c) Ретроспективті аудит: төрешіге ешқашан көрсетілмеген адамдардың бағалары таңдаудан кейін кескін идентификаторымен біріктіріледі және сол пулдар бойынша нақты кездейсоқ таңдаумен салыстырылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f5.jpg\" alt=\"5-сурет: Qwen-мен пост-хок абляциялар.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Qwen-мен пост-хок абляциялар.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: Qwen-мен пост-хок абляциялар. (a) Бірінші ұсынылған кескінді таңдайтын шақырулар үлесі; сызықшалар біркелкі жиілікті белгілейді. (b) Барлық сұраныстар бойынша және барлық реттіліктер сәйкес келетін сұраныстар бойынша кездейсоқ таңдаудан артықшылық (95% сенімділік интервалдары). No ranking: тек таңдау шығыс пішімі. Opaquecodes: әріптердің орнына екі таңбалы белгілер. 4 orders: төрт кескінді пулдар үшін төртінші ротация.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f7.jpg\" alt=\"7-сурет: Qwen таңдауының сол пулдар бойынша кездейсоқ таңдаудан айырмашылығы ретіндегі мәдени қателік бағалары; теріс мә\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Qwen таңдауының сол пулдар бойынша кездейсоқ таңдаудан айырмашылығы ретіндегі мәдени қателік бағалары; теріс мәндер қателердің азырақ екенін білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет: Qwen таңдауының сол пулдар бойынша кездейсоқ таңдаудан айырмашылығы ретіндегі мәдени қателік бағалары; теріс мәндер қателердің азырақ екенін білдіреді. Қою түсті бағандар: нүктелік 95% интервалдар. Ашық түсті бағандар: үш қателік түрі бойынша Бонферрони түзетілген интервалдары. Qwen жіберіп алынған күтулерді азайтады және стереотип бағаларын сәл көтереді; стереотип айырмашылығы түзетуден кейін сақталмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f10.jpg\" alt=\"10-сурет: Сүзгіден өтпеген мысалдар: қатырылған манифестегі әр ел үшін төрт үміткері бар алғашқы промпт, үміткерлер баст\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет: Сүзгіден өтпеген мысалдар: қатырылған манифестегі әр ел үшін төрт үміткері бар алғашқы промпт, үміткерлер бастапқы ретімен берілген.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;10-сурет: Сүзгіден өтпеген мысалдар: қатырылған манифестегі әр ел үшін төрт үміткері бар алғашқы промпт, үміткерлер бастапқы ретімен берілген. Сандар — адамдар қойған промптқа сәйкестіктің орташа рейтингі. Көк (Q) және қызғылт сары (S) жақтаулар Qwen және Smol-дың бастапқы ретпен жасаған таңдауын белгілейді; жасыл белгілер ең жоғары рейтингі бар үміткерлерді көрсетеді. Кескіндер CulturalFrames-тен (Nayak et al. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f11.jpg\" alt=\"11-сурет: Стереотиптер бойынша ымыралы шешім.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-сурет: Стереотиптер бойынша ымыралы шешім.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;11-сурет: Стереотиптер бойынша ымыралы шешім. Qwen таңдауы (қызыл) өз жиынтығында ең жоғары стереотип деңгейіне ие, ал сәйкестігі тең немесе жоғары басқа үміткердің деңгейі төменірек болған промпттар (белгілер). Белгілер орташа сәйкестікті (A) және стереотипті белгілеген аннотаторлардың үлесін (S) көрсетеді. Үш кескіні бар жолдар — бұл құрамында тек үш үміткері бар промпттар.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f12.jpg\" alt=\"12-сурет: Контент бағалаушысы мен төреші.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12-сурет: Контент бағалаушысы мен төреші.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;12-сурет: Контент бағалаушысы мен төреші. CLIP таңдауы (C, күлгін) мен Qwen-нің бастапқы ретпен жасаған таңдауы (Q, көк) рейтинг бойынша ең көп ерекшеленетін промпттар: сол жақта — CLIP таңдауы жоғары бағаланған; оң жақта — Qwen таңдауы. Белгілер ең жақсы бағаланған үміткерлерді көрсетеді. Үш кескіні бар жолдар — бұл құрамында тек үш үміткері бар промпттар.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f13.jpg\" alt=\"13-сурет: Реттің өзгеруі. Qwen барлық үш ретте A слотын таңдайтын және кемінде екі түрлі кескінді қайтаратын промпттар; \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;13-сурет: Реттің өзгеруі. Qwen барлық үш ретте A слотын таңдайтын және кемінде екі түрлі кескінді қайтаратын промпттар; таңдалған нұсқалар арасындағы рейтинг диапазоны ең кең бес мысал.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;13-сурет: Реттің өзгеруі. Qwen барлық үш ретте A слотын таңдайтын және кемінде екі түрлі кескінді қайтаратын промпттар; таңдалған нұсқалар арасындағы рейтинг диапазоны ең кең бес мысал. Соңғы баған — ең жақсы бағаланған үміткер. Кескіндер CulturalFrames-тен (Nayak et al. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f14.jpg\" alt=\"Сурет 14\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 14&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f15.jpg\" alt=\"15-сурет: Аудит браузері, шолу. Негізгі бағалаулар, көрсету слоттары бойынша артықшылықтар, елдер топтары бойынша өкініш\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;15-сурет: Аудит браузері, шолу. Негізгі бағалаулар, көрсету слоттары бойынша артықшылықтар, елдер топтары бойынша өкініш (regret), әр шлюз үшін қабылданған және қабылданбағандар арасындағы айырмашылық және әр саясат үшін кездейсоқ таңдауға қарағандағы өсім, барлығы жазылған шығыс деректері негізінде есептелген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f16.jpg\" alt=\"16-сурет: Аудит браузері, 1-суреттегі промпт үшін егжей-тегжейлі көрініс.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;16-сурет: Аудит браузері, 1-суреттегі промпт үшін егжей-тегжейлі көрініс.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;16-сурет: Аудит браузері, 1-суреттегі промпт үшін егжей-тегжейлі көрініс. Сол жақта: әрбір сарапшының таңдауы (Q, S) және ең жоғары бағаланған кескін (белгімен көрсетілген) бар үш ұсыну реті. Оң жақта: әрбір үміткер үшін адамдардың бағалауы, бастапқы рет үшін таңдау метрикалары және рет бойынша таңдаулар. Кескіндер CulturalFrames (Nayak et al. 2025) дереккөзінен алынған.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f17.jpg\" alt=\"17-сурет: Аудит браузері, Qwen-нің орташадан төмен таңдаулары бойынша сүзгіден өткізілген және regret көрсеткіші бойынша\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;17-сурет: Аудит браузері, Qwen-нің орташадан төмен таңдаулары бойынша сүзгіден өткізілген және regret көрсеткіші бойынша сұрыпталған промпттар шолғышы. Әрбір жазба екі сарапшының бастапқы реттегі таңдауларын (Q, S), ең жоғары бағаланған кескінді (жұлдызша) және бағалауларды көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f18.jpg\" alt=\"18-сурет: Аудит браузері, Qwen барлық үш ретте бірдей кескінді таңдайтын промпттар бойынша сүзгіден өткізілген промпттар\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;18-сурет: Аудит браузері, Qwen барлық үш ретте бірдей кескінді таңдайтын промпттар бойынша сүзгіден өткізілген промпттар шолғышы (бірауыздан қабылдау сүзгісі оларды сақтап қалады).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f19.jpg\" alt=\"19-сурет: Аудит браузері, Qwen-дегі ең үлкен regret көрсеткіші бар төрт кескіндік пул үшін егжей-тегжейлі көрініс (ереже\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;19-сурет: Аудит браузері, Qwen-дегі ең үлкен regret көрсеткіші бар төрт кескіндік пул үшін егжей-тегжейлі көрініс (ереже бойынша таңдалған). Екі сарапшы да ең төмен бағаланған кескінді таңдайды, сондықтан кросс-модельдік сүзгі осы промпт үшін іске қосылар еді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f20.jpg\" alt=\"20-сурет: Аудит браузері, екі сарапшы төмен бағаланған кескін бойынша келісетін промпт үшін егжей-тегжейлі көрініс (крос\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;20-сурет: Аудит браузері, екі сарапшы төмен бағаланған кескін бойынша келісетін промпт үшін егжей-тегжейлі көрініс (кросс-модельдік келісімдер арасындағы regret көрсеткіші бойынша келесі орында).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Төреші-&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельдер&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұрмалаушылық&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасайды&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Рет өзгергенде&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;таңдауды&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аудиттеу&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тізімдегі орын&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сападан&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маңызды&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Әр модель үшін&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сүзгіні қайта&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тексеру&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;synthetic&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Huichan Seo&lt;/p&gt;\n&lt;h3 id=\"derekkoezd
