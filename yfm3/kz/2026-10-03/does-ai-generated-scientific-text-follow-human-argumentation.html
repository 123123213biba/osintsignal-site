        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"111\" cy=\"167\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"629\" cy=\"190\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SYNTHETIC   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жасанды интеллект жазған&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ғылыми мақалалар неге&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;бірдей?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Авторлар лингвистика бойынша нақты ғылыми мақалалар мен төрт жетекші &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; жазған мәтіндердегі аргументация құрылымын салыстырды. Жасанды интеллект қатаң шаблондарды ұстанатыны, ал адамдардың еркін әрекет ететіні белгілі болды. Тіпті &lt;a href=\"concepts/model-cars.html\"&gt;CARS моделі&lt;/a&gt; бойынша тікелей нұсқаулар нейрожелі жауаптарын одан сайын біркелкі етеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ЖИ мәтіндері тар және біркелкі аргументация шаблондарына ие.&lt;/li&gt;\n&lt;li&gt;Сарапшылар ЖИ мәтінін 90% жағдайда құрылымы бойынша ажыратады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/create-a-research-space.html\"&gt;CARS&lt;/a&gt; нұсқаулары ЖИ жауаптарын одан сайын қатаң етеді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aedister-zhaene-daeldik\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#aedister-zhaene-daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер және дәлдік&lt;/span&gt;&lt;/a&gt;Әдістер және дәлдік&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Әдіс&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Деректер&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Дәлдік&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Шектеу&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Автоматты CARS классификаторы&lt;/td&gt;\n&lt;td&gt;76 лингвистикалық мақала&lt;/td&gt;\n&lt;td&gt;Адам дәлдігінің 92%&lt;/td&gt;\n&lt;td&gt;Басқа салаларда тексерілмеген&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сарапшылардың соқыр тесті&lt;/td&gt;\n&lt;td&gt;Жасалған мәтіндер бағаланды&lt;/td&gt;\n&lt;td&gt;90% анықтау деңгейі&lt;/td&gt;\n&lt;td&gt;Сарапшы бағасының субъективтілігі&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу мақала кіріспесін үш риторикалық &lt;a href=\"concepts/step.html\"&gt;қадам&lt;/a&gt; арқылы сипаттайтын CARS (Create-a-Research-Space) моделіне негізделген: аумақты белгілеу, бос орынды анықтау және сол орынды иелену. Ғалымдар 76 түпнұсқа мақаланы және GPT-5.5, Claude Opus 4.8, Gemma-4-31B-it және Qwen3.5-27B модельдері жасаған 608 балама мәтінді талдады. Мәтінді сегменттерге бөліп, риторикалық қадамдарды адам белгілеуіне қатысты 92% дәлдікпен анықтайтын автоматтандырылған классификатор қолданылды.&lt;/p&gt;\n&lt;p&gt;Нәтижелер адамдардың аргументтердің әртүрлі тізбегін қолданатынын көрсетеді. Жасанды интеллект болса, қатаң бірізділікке бейім, ал оған CARS құрылымын үйретуге тырысу бұл қатаңдықты одан әрі күшейтеді. Соқыр тестте сарапшылар 90% жағдайда мәтіннің авторлығын дәл аргументация құрылымының болжамдылығы арқылы анықтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек 76 лингвистикалық мақаламен шектелген, бұл басқа ғылыми салаларға сәйкес келмеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Үлкен тілдік модельдер (LLM) мәтін жазуға көмектесуден зерттеу процесіне тікелей қатысуға көшуде. Бұл жасанды интеллект (ЖИ) жасаған ғылыми мәтіндердің адам жазған мәтіндерден қандай айырмашылығы бар екенін түсінуді талап етеді. Алдыңғы зерттеулер негізінен лексикалық және стильдік белгілерге назар аударды, бірақ оларды қарапайым қайта жазу (paraphrasing) арқылы жоюға болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу ЖИ мәтіндерінің адам мәтіндерінен лексикамен емес, аргументация құрылымының қатаңдығымен ерекшеленетінін көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар риторикалық құрылымға, яғни мәтіннің өз дәлелдерін негіздейтін аргументативті қадамдар тізбегіне назар аударды. Теориялық негіз ретінде Джон Суэйлстің CARS (Create a Research Space) моделі қолданылды. Зерттеушілер лингвистика бойынша жарияланған ғылыми мақалалардың адам жазған кіріспе бөлімдерін сол мақалалар үшін LLM жасаған баламаларымен салыстырды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CARS моделі — бұл ғылыми мақаланың кіріспе бөлімін құрудың стандартты сызбасы, ол зерттеу саласын белгілеу, бос орынды (ниша) құру және сол орынды иелену сияқты кезеңдерді қамтиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау адам жазған мәтіндердің риторикалық қадамдарды таңдауда және олардың реттілігінде икемдірек екенін көрсетті. Генеративті модельдер жасаған мәтіндер біркелкі және болжамды болып шықты. Модельдерге CARS ережелерін нақты көрсетіп беру олардың құрылымын одан да қатаң ете түсті, бұл ғылыми баяндаудың табиғилығын төмендетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек лингвистика саласындағы мақалалардың кіріспе бөлімдерін талдаумен шектелген; нәтижелер басқа ғылыми бағыттар үшін өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Үлкен тілдік модельдер (LLM) ғылыми процестің барлық кезеңдерінде: гипотезаларды ұсынудан бастап әдебиеттерді талдауға, толық зерттеу циклдарын жүргізуге және қорытынды мақалаларды жазуға дейін белсенді қатысуда. Жасанды интеллекттің ғылыми жазудағы рөлі артқан сайын, модельдердің аргументтерін қалай құратынын, өз жұмысын алдыңғы зерттеулермен қалай байланыстыратынын және олардың мұны адамдар сияқты жасайтынын түсіну маңызды. Мәтіндерді салыстырудың бұрынғы әдістері лексикалық статистикаға, стилистикалық іздерге және синтаксистік өрнектерге сүйенген. Алайда, мұндай көрсеткіштер модельдің мәтінді қалай құратыны туралы аз ақпарат береді, сонымен қатар заманауи модельдер адам стилін имитациялауда жетіліп келеді, ал қарапайым қайталаулар беткі іздерді жояды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу ғылыми мәтіндердің риторикалық құрылымын талдауға бағытталған, өйткені беткі талдау әдістері заманауи LLM-дерге қарсы тиімсіз болып барады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар риторикалық құрылымды — мәтін ішіндегі дәйекті коммуникативті функцияларды орындайтын аргументативті қадамдар тізбегін талдауды ұсынады. Зерттеу нысаны ретінде ғылыми мақалаларға кіріспелер (RAI) таңдалды, өйткені олар шектеулі кеңістікте тығыз аргументацияны талап етеді. CARS (Create-A-Research-Space) моделі қолданылады, ол кіріспені үш қадам арқылы сипаттайды: зерттеу аумағын белгілеу (Move 1), білімдегі олқылықты анықтау (Move 2) және бұл олқылықты ағымдағы зерттеумен толтыру (Move 3). Әрбір қадам кішірек бөліктерден тұрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CARS моделі — ғылыми кіріспелердің құрылымын талдаудың стандартты лингвистикалық тәсілі, мұнда автор кезең-кезеңімен жалпы контекстен нақты зерттеу міндетіне ауысады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу үш сұрақты қояды: жасанды интеллект аннотаторы CARS қадамдарын сенімді анықтай ала ма (RQ1); адамдар мен жасанды интеллект жазған кіріспелер құрылымы жағынан қалай ерекшеленеді (RQ2); және CARS моделі бойынша нақты нұсқаулар LLM жасаған мәтіндердің құрылымына қалай әсер етеді (RQ3)? Бұған жауап беру үшін авторлар мәтінді сегменттерге бөлетін және оларды классификациялайтын автоматты аннотатор жасады. Құрал екі сарапшы арқылы тексерілді және адам белгілеген дәлдіктің 92%-ына жетті. Жасалған мәтіндерді талдау үшін сарапшылар белгілеген 76 лингвистикалық мақала пайдаланылды. Төрт LLM (екі коммерциялық және екі ашық салмақты) әр кіріспенің екі нұсқасын жазды: негізгі промптпен және CARS анықтамалары қосылған күйде, бұл 608 жасалған мәтінді берді. Нәтижелер көрсеткендей, жасанды интеллект мәтіндері адам мәтіндеріне қарағанда тар және біркелкі қадамдар тізбегін ұстанады, ал оқырмандар 90% жағдайда дәл осы құрылымға сүйене отырып, адам мен жасанды интеллект мәтіндерін ажырата алады.&lt;/p&gt;\n&lt;h4 id=\"bajlanysty-zhumystar\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#bajlanysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты жұмыстар&lt;/span&gt;&lt;/a&gt;Байланысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;Екі бағыттағы жұмыстар осы зерттеуге қатысты: машина жазған ғылыми мәтіндерді жасау және анықтау, сондай-ақ олардың риторикалық құрылымын талдау.&lt;/p&gt;\n&lt;h4 id=\"ghylymi-aedebiettegi-llm-zhaene-olardy-anykhtau-aedisteri\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#ghylymi-aedebiettegi-llm-zhaene-olardy-anykhtau-aedisteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ғылыми әдебиеттегі LLM және оларды анықтау әдістері&lt;/span&gt;&lt;/a&gt;Ғылыми әдебиеттегі LLM және оларды анықтау әдістері&lt;/h4&gt;\n&lt;p&gt;Үлкен тілдік модельдер (LLM) бүгінде ғылыми мәтіндерді жасауда белсенді қатысады: тақырыптар негізінде аннотациялар жазудан бастап, толық мақалаларды және эксперименттерді жоспарлау мен есеп жазуды біріктіретін автоматтандырылған жүйелерге дейін. Жасанды интеллект көмегімен жасалған немесе өңделген мәтіндердің үлесі ғылыми жарияланымдарда артып келеді. Машина жасаған мәтіндерді анықтаудың қазіргі әдістері негізінен беткі белгілерге сүйенеді: токендердің ықтималдығы, ықтималдық таралуының қисықтығы, декодтау артефактілері және цифрлық су белгілері. Алайда, бұл сигналдар осал: адамдарды ең жақсы алдайтын мәтіндер автоматты детекторлар үшін ең қиын болып табылады. Жеткілікті қуатты модельдерді қолданғанда, детекторлардың дәлдігі кездейсоқ болжау деңгейіне жақындайды. Сондықтан біз мәтіннің риторикалық құрылымын талдауды ұсынамыз — бұл тереңірек және тұрақты белгі, біз көрсеткендей, адамдар кіріспе бөлімінің авторлығын бағалауда дәл осыған сүйенеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Беткі белгілерге негізделген детекторлардың тиімділігі модельдер жетілген сайын төмендеп келеді, бұл терең риторикалық құрылымды талдауға көшуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ritorikalykh-khurylymdy-taldau\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#ritorikalykh-khurylymdy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Риторикалық құрылымды талдау&lt;/span&gt;&lt;/a&gt;Риторикалық құрылымды талдау&lt;/h4&gt;\n&lt;p&gt;Жанрлық талдау ғылыми мақаланың кіріспе бөлімін риторикалық қадамдар тізбегі ретінде қарастырады. Дж. Суэйлстің CARS (Create a Research Space) моделі бұл салада стандарт болып табылады: автор алдымен зерттеу саласын белгілейді, содан кейін ондағы бос орынды (ниша) бөліп көрсетеді және ақырында оны толтырады. Бұл құрылымды автоматты түрде анықтаудың ұзақ тарихы бар, оның ішінде «аргументативті аймақтарға бөлу» әдістері және академиялық жазуды үйрету үшін қолданбалы лингвистика аясында әзірленген классификаторлар бар. Соңғы зерттеулерде сарапшылық белгілеу процесті автоматтандыру үшін трансформер модельдерімен біріктірілуде. Біздің алдыңғы зерттеулерден айырмашылығымыз — біз аннотацияға емес, кіріспеге назар аударамыз, бір модельдің орнына бірнеше модельді салыстырамыз және мәтіндерді келтірілген әдебиеттер негізінде генерациялаймыз, бұл ғалым жұмыс істейтін контекстті моделдейді. Сарапшылық белгілеу көп уақытты қажет ететіндіктен, біз автоматты аннотатор әзірледік, ол бүкіл кіріспе бөлімін сегменттерге бөлуді және классификациялауды жүзеге асырады әрі сарапшы-адамдардың бағаларымен салыстыру арқылы валидациядан өтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Риторикалық қадамдар — бұл мәтіннің белгілі бір міндетті орындайтын функционалды бөліктері, мысалы, өзектілікті негіздеу немесе ғылыми мәселені тұжырымдау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Зерттеу LLM жазған ғылыми кіріспелерді (RAI) адамдар жазған түпнұсқалармен Swales-тің CARS моделіне негізделген автоматты аннотатор арқылы салыстырды. Жасанды интеллект мәтіндері адамдікіне қарағанда қатаң құрылымдалғаны және тар ауқымдағы жүйелілікке бағынатыны анықталды. CARS анықтамаларын модельдерге беру бұл алшақтықты одан әрі күшейтеді. CARS моделінен хабардар оқырман жасанды интеллект мәтінін 90% дәлдікпен ажырата алады, әсіресе модель CARS нұсқауларымен бағытталған болса. Риторикалық құрылым мәтін қайта жазылса да сақталатын машиналық авторлықтың тұрақты белгісі болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасанды интеллект кіріспелерінің риторикалық құрылымы болжамды және қатаң шектелген, бұл машиналық мәтінді 90% дәлдікпен анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h4&gt;\n&lt;p&gt;Кіріс контекстінің дәлдігі. Модельдер тек дәйексөз келтірілген жұмыстардың библиографиялық метадеректері мен аннотацияларын алды, ал адам авторлар толық мәтіндермен жұмыс істеді. Сондай-ақ, әдебиеттер тізімі алдын ала белгіленген, бұл жасанды интеллектіні автордың толық білім ауқымынан емес, таңдаулы бөлігінен пайдалануға мәжбүр етеді.&lt;/p&gt;\n&lt;p&gt;Корпус ауқымы және пән саласы. Зерттеу қолданбалы лингвистика бойынша 76 мақаламен шектелген. Автоматты аннотаторды қолдану талдауды кеңейтуге көмектесті, алайда PDF-тен алынған мәтіндер қолмен сапа бақылауы жүргізілгеніне қарамастан, шу (қателіктер) сақтайды. Кеңірек және әртүрлі корпустарда зерттеулер жүргізу қажет.&lt;/p&gt;\n&lt;p&gt;CARS моделінің жалпылануы. CARS моделі әмбебап емес: қадамдар құрылымы пәнаралық және тіпті бір пән ішінде де өзгереді. Біздің нәтижелеріміз лингвистикалық кіріспелердің канондық құрылымын емес, адам мен жасанды интеллект арасындағы алшақтықты көрсетеді, бұл басқа салаларда әртүрлі көрінуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер бір пән саласымен және терең логикалық аргументтерді ескермейтін CARS моделімен шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Аргументацияны талдау тереңдігі. CARS моделі мәтін функцияларын белгілейді, бірақ аргументтердің ішкі логикалық құрылымын (тезистер, дәлелдер, негіздемелер) талдамайды. Бұл тек алғашқы қадам; келешек жұмыстарда машина жазған мәтін сапасын бағалау үшін неғұрлым егжей-тегжейлі жүйелерді қолдануға болады.&lt;/p&gt;\n&lt;p&gt;Аннотатор және дәлдік шегі. LLM негізіндегі аннотатор екі адам белгілеген 32 кіріспе (әрқайсысына 16-дан) негізінде тексерілген. Барлық мәтіндердің екі жақты белгіленбеуі «адами дәлдік шегін» бағалауды шектейді.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"korpus-zhaene-saraptamalykh-belgileu\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#korpus-zhaene-saraptamalykh-belgileu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Корпус және сараптамалық белгілеу&lt;/span&gt;&lt;/a&gt;Корпус және сараптамалық белгілеу&lt;/h4&gt;\n&lt;p&gt;Зерттеу қолданбалы лингвистика бойынша 80 ғылыми мақаладан тұратын корпусқа негізделген, олар төрт квартиль (Q1–Q4) журналдарынан тең мөлшерде таңдап алынды. Материалдардың қолжетімділігін тексеру барысында төрт мақала ақылы кіру (paywall) себебінен алынып тасталды және нәтижесінде 76 жұмыс қалды. Эталондық белгілеу (gold labels) ретінде Асади (2025) нұсқаулығына сәйкес дайындалған сараптамалық деректер пайдаланылды. Аннотациялау сызбасы 4-кестеде көрсетілген үш «қадамды» (moves) және он кезеңді қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Қадамдар» (moves) лингвистикада мәтіннің белгілі бір коммуникативтік міндетті орындайтын функционалдық блоктары болып табылады, мысалы, өзектілікті негіздеу немесе білімдегі олқылықты сипаттау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kirispe-boelimderin-generaciyalau\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#kirispe-boelimderin-generaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе бөлімдерін генерациялау&lt;/span&gt;&lt;/a&gt;Кіріспе бөлімдерін генерациялау&lt;/h4&gt;\n&lt;p&gt;Контекст және алдын ала өңдеу. Адам мен жасанды интеллект жазған мәтіндерді дұрыс салыстыру үшін авторлар мақала авторына қолжетімді ақпараттық контексті қалпына келтірді: тақырып, жұмыс мазмұны және барлық сілтеме жасалған дереккөздердің метадеректері (соның ішінде аннотациялар). PDF-файлдардан бұл деректерді алу үшін мәтінге айналдыру және қолмен түзетуді қамтитын алдын ала өңдеу конвейері қолданылды. Мәтін көлемінің нәтижеге әсерін болдырмау үшін генерацияланатын кіріспелердің ұзындығы түпнұсқа мәтіндердің көлемімен шектелді.&lt;/p&gt;\n&lt;p&gt;Модельдер. Экспериментте төрт жүйе пайдаланылды: коммерциялық GPT-5.5 және ClaudeOpus4.8, сондай-ақ ашық салмақты Gemma-4-31B-it және Qwen3.5-27B модельдері. Жергілікті модельдерді қолдану жарияланбаған идеяларды үшінші тарап API-лері арқылы беруден аулақ болғысы келетін зерттеушілер үшін маңызды. Мәтінде модельдер ChatGPT, Claude, Gemma және Qwen деп аталады.&lt;/p&gt;\n&lt;p&gt;Генерация параметрлері. RQ3 зерттеу сұрағына жауап беру үшін әрбір модель кіріспелерді екі режимде жасады. Негізгі режимде модельге қосымша нұсқаусыз кіріспе жазу бойынша тікелей тапсырма берілді. «CARS-guided» режимінде промпт Суэйлз бойынша қадамдар мен кезеңдердің анықтамаларын, сондай-ақ алдымен қадамдар тізбегінің ішкі жоспарын жасап, кейін оны мәтінде жүзеге асыру талабын қамтыды. Барлығы 608 кіріспе нұсқасы генерацияланды (4 модель × 2 режим × 76 мақала).&lt;/p&gt;\n&lt;h4 id=\"cars-annotaciyasy\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#cars-annotaciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CARS аннотациясы&lt;/span&gt;&lt;/a&gt;CARS аннотациясы&lt;/h4&gt;\n&lt;p&gt;Адамдар мен жасанды интеллект жазған кіріспе мәтіндердің риторикалық құрылымын салыстыру үшін CARS моделі қолданылды. Қолмен белгілеу көлемі үлкен болғандықтан, авторлар LLM негізінде автоматты аннотатор жасады. Жүйе кіріспені сегменттерге бөледі және әрқайсысына он қадамның бірін тағайындайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CARS (Create a Research Space) — ғылыми мақалалардың кіріспе бөлімін талдауға арналған лингвистикалық модель, ол зерттеудің өзектілігін негіздейтін «жүрістер» (moves) мен «қадамдарды» (steps) бөліп көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/segmentatsiya.html\"&gt;Сегментация&lt;/a&gt; және классификация. Авторлар әртүрлі тәсілдерді сынап көрді: шекаралар бойынша бөлу және әр сөйлемді жеке классификациялау. Бірінші әдіс сегменттеуді жеткіліксіз орындады (орташа 6,6-ға қарсы 9,6), екіншісі шамадан тыс сегменттеді (10,5-ке қарсы 9,2). Сегменттеу мен классификацияны бірге орындау шекараларды анықтау дәлдігін арттырды (F1 0,50-ден 0,71-ге дейін), сондықтан модельге бүкіл мәтінді беріп, реттілікпен белгілеу стратегиясы таңдалды.&lt;/p&gt;\n&lt;p&gt;Prompting стратегиясы. Промпт аннотация нұсқаулығын және үш түрлі деңгейдегі (3, 9 және 18 сегмент) мысалдарды қамтиды. «Chain-of-thought» әдісі қолданылды: модель алдымен «жүрісті», сосын «қадамды» анықтайды және шешімін бір сөйлеммен негіздейді. ChatGPT, Claude және Gemini 3.1 Pro салыстырылғанда, ChatGPT ең жоғары дәлдікті (0,773) көрсетті.&lt;/p&gt;\n&lt;p&gt;Аннотаторды валидациялау. AI нәтижелері 32 кіріспе мәтіні бойынша екі маман-адамның нәтижелерімен салыстырылды. Сегмент шекаралары үшін F1, WindowDiff, Pk және классификация үшін F1 метрикалары қолданылды.&lt;/p&gt;\n&lt;h4 id=\"annotator-tiimdiligi\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#annotator-tiimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аннотатор тиімділігі&lt;/span&gt;&lt;/a&gt;Аннотатор тиімділігі&lt;/h4&gt;\n&lt;p&gt;Автоматты аннотатор адам дәлдігінің 92%-ына жетті (F1 0,694-ке қарсы 0,752). Құрылымдық талдауда AI көрсеткіштері адамдікіне дерлік теңесті: «жүріс» дәлдігі 0,901-ге қарсы 0,911, сегмент шекараларының F1-і 0,725-ке қарсы 0,756 болды. Модель қателері негізінен мамандардың пікірі әртүрлі болатын жерлерге сәйкес келгендіктен, адам мен AI мәтіндерін салыстыруда субъективтілікті жою үшін бұл құрал барлық талдаулар үшін бірыңғай аннотатор ретінде қабылданды.&lt;/p&gt;\n&lt;h4 id=\"zhalpy-taralu-zhaene-rettilik\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#zhalpy-taralu-zhaene-rettilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы таралу және реттілік&lt;/span&gt;&lt;/a&gt;Жалпы таралу және реттілік&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер генерацияланған кіріспе бөлімдерінің түпнұсқа ғылыми мақалаларға тән «қадамдар» (move) мен «бөлімшелер» (step) таралуын қаншалықты қайталайтынын, сондай-ақ олардың осы элементтерді қалай реттейтінін талдады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Қадамдар» мен «бөлімшелер» — бұл ғылыми мақала құрылымының лингвистикалық ұғымдары: «қадам» ірі риторикалық мақсатты (мысалы, өзектілікті негіздеу), ал «бөлімше» оған жетудің нақты әдісін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қадамдар мен бөлімшелердің таралуы. 1-кестеде сегменттердің үш негізгі қадам және он бөлімше бойынша таралуы берілген. Түпнұсқа мәтіндерде адам авторлар сегменттерді былайша бөледі: 59,5% — аумақты құру (Move 1), 16,0% — тауашаны құру (Move 2) және 24,5% — тауашаны иелену (Move 3). Генерацияланған модельдер баланстың Move 1-ден Move 2-ге қарай ауытқуын көрсетеді. Move 1 үлесі сегіз деректер жиынтығының бесеуінде адам көрсеткішінен төмендеп, 46,8%-ға дейін жетеді. Бөлімшелер деңгейінде адамдар үшін таралу қатты ығысқан: алдыңғы зерттеулерге шолу (26,5%), маңыздылықты негіздеу (18,5%), тақырыпты жалпылау (14,5%) және мақсатты сипаттау (13,0%) барлық сегменттердің төрттен үшіне жуығын құрайды. Модельдер ұқсас реттілікті сақтайды, мұнда әдебиеттерге шолу ең жиі кездесетін бөлімше болып қала береді. Төрт модель үшін бағыттаушы нұсқауларды (CARS-guided) қолдану Move 1 үлесінің азаюына және Move 2 мен Move 3 үлесінің артуына әкеледі, бұл үш жағдайда таралуды адам эталонынан одан әрі алыстатады.&lt;/p&gt;\n&lt;h4 id=\"boelimshelerdi-retteu-zhaene-tangdau\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#boelimshelerdi-retteu-zhaene-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бөлімшелерді реттеу және таңдау&lt;/span&gt;&lt;/a&gt;Бөлімшелерді реттеу және таңдау&lt;/h4&gt;\n&lt;p&gt;2-кесте кіріспе бөлімдерінде бөлімшелердің қалай реттелетінін көрсетеді. Бөлімшелер тізбегі өте әртүрлі болғандықтан, авторлар 76 түпнұсқа мәтінді сегіз генерацияланған жиынтықпен (төрт модель, екі промпт нұсқасы) салыстырады. Деректер модельдердің түпнұсқа мақалаларға қарағанда Move 2-ні артық пайдалануға бейім екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"move-3-nishany-ielenu\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#move-3-nishany-ielenu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Move 3: Нишаны иелену&lt;/span&gt;&lt;/a&gt;Move 3: Нишаны иелену&lt;/h4&gt;\n&lt;p&gt;Кіріспе құрылымын талдау авторлар мен нейрожелілердің ортақ артықшылықтары бар екенін, бірақ икемділікте айырмашылықтары барын көрсетті. Ең жиі кездесетін бастапқы қадам — тақырыптың орталықтығын растау. Сонымен қатар, 11-қадам (қарсы аргумент келтіру) адам жазған мәтіндерде де, генерацияланған мәтіндерде де іс жүзінде кездеспейді (тек 4 сегментте), сондықтан ол талдаудан алынып тасталды. Тікелей сынның орнына авторлар білімдегі олқылықты көрсетуді жөн көреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қадам (step) — бұл CARS (Create a Research Space) моделіне сәйкес кіріс бөлігінің функционалдық элементі, мысалы, «зерттеудің маңыздылығын негіздеу» немесе «зерттеудегі олқылықты көрсету».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Адам жазған мәтіндер әртүрлілігімен ерекшеленеді: авторлар 46% жағдайда орталықтықты растаудан бастайды, ал 32% жағдайда бірден әдебиеттерге шолу жасайды. Нейрожелілер орталықтықты 58–84% жағдайда таңдайды. Адамдар жазған кіріспелерде тұтас бөлімдерді өткізіп жіберу жиі кездеседі (28% жағдайда), ал модельдер үш негізгі қадамды (Move 1, 2, 3) қамтуға тырысады және 6,1–7,4 қадамды пайдаланады, ал адамдар орта есеппен 5,3 қадамды қолданады.&lt;/p&gt;\n&lt;p&gt;Циклділік (бұрын өткен бөлімге қайта оралу) адам мәтіндерінің 66%-ында байқалады (бір мәтінге орта есеппен 2,4 қайта оралу). ChatGPT, Claude және Gemma модельдері ұқсас көрсеткіштерді (67–74%) көрсетеді, ал Qwen жоғары циклділікті (87–95%) көрсетеді. Нұсқауларды (CARS-guidance) пайдалану модельдердің құрылымын біркелкі етеді, циклділікті адам деңгейінен төмен түсіреді және қолданылатын қадамдар санын арттырады.&lt;/p&gt;\n&lt;h4 id=\"khozghalys-khurylymdaryn-grafiktik-taldau\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#khozghalys-khurylymdaryn-grafiktik-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қозғалыс құрылымдарын графиктік талдау&lt;/span&gt;&lt;/a&gt;Қозғалыс құрылымдарын графиктік талдау&lt;/h4&gt;\n&lt;p&gt;Құрылымдық ұқсастықты бағалау үшін әрбір кіріспе түйіндері CARS кластары болып табылатын тізбекті граф ретінде ұсынылды. Салыстыру редакциялық ұқсастық (edit similarity) және «қапшықтар» ұқсастығы (bag similarity) көрсеткіштері арқылы жүзеге асырылды.&lt;/p&gt;\n&lt;h4 id=\"modelderding-tuepnuskhalargha-ukhsastyghy\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#modelderding-tuepnuskhalargha-ukhsastyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельдердің түпнұсқаларға ұқсастығы&lt;/span&gt;&lt;/a&gt;Модельдердің түпнұсқаларға ұқсастығы&lt;/h4&gt;\n&lt;p&gt;Өзіндік ұқсастықты талдау (3-кесте) түпнұсқа мәтіндердің ең әртүрлі екенін көрсетті: олардың өзіндік ұқсастық көрсеткіші 0,33-ті құрайды, ал модельдерде бұл көрсеткіш 0,37-ден 0,46-ға дейін өзгереді. Түпнұсқалар 36 түрлі кіріспе құрылымын жүзеге асырады, ал модельдер 8-ден 35-ке дейін. CARS нұсқауларын пайдалану модельдердің әртүрлілігін азайтып, олардың мәтіндерін болжамды және бір-біріне ұқсас етеді.&lt;/p&gt;\n&lt;h4 id=\"zhuptastyrylghan-kirispe-boelimderdi-mukhiyat-taldau\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#zhuptastyrylghan-kirispe-boelimderdi-mukhiyat-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жұптастырылған кіріспе бөлімдерді мұқият талдау&lt;/span&gt;&lt;/a&gt;Жұптастырылған кіріспе бөлімдерді мұқият талдау&lt;/h4&gt;\n&lt;p&gt;Генерацияланған мәтіндер мен авторлық мәтіндер арасындағы сапалық айырмашылықты түсіну үшін CARS (Create a Research Space) моделі бойынша сарапшы бес ғылыми мақаланы «мұқият оқу» (close reading) әдісімен талдады. Әр мақала үштік ретінде қарастырылды: түпнұсқа, Claude (базалық) нұсқасы және CARS негізіндегі промпт арқылы жасалған нұсқа. Барлық мәтіндер функционалдық қадамдар (moves) бойынша белгіленді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Мұқият оқу» әдісі тек сандық көрсеткіштермен анықтау мүмкін емес мәтін құрылымындағы нәзік тұстарды анықтау үшін терең сапалық талдауды білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;Генерацияланған кіріспелер қатаңырақ құрылымға ие. Біріншіден, бұл толықтыққа қатысты: барлық 10 генерацияланған мәтін CARS моделінің үш қадамын да қамтиды, ал адам-авторлар кейде екінші қадамды (нишаны белгілеу) түсіріп қалдырады. Екіншіден, бұл реттілікке қатысты: модельдер «1–2–3-қадам» канондық тізбегін қатаң сақтайды. Модельдердегі қадамдар арасындағы қайта оралудың 89%-ында 2-қадамнан 1-қадамға өту байқалады, ал адам-авторларда бұл көрсеткіш 57%-ды құрайды. 608 генерацияланған кіріспелердің ешқайсысы 3-қадамнан басталмайды, ал адамдар жұмыс мақсатынан немесе әдебиеттер шолуынан бастауы мүмкін.&lt;/p&gt;\n&lt;p&gt;CARS моделін білетін авторлар «канондық» кіріспелерді жазбайды. Свейлс моделіне сілтеме жасаған авторлардың төрт мақаласын талдау оларда ортақ құрылымның жоқтығын көрсетті. Кіріспеге теориялық базаны білу емес, журнал квартилі әсер етеді.&lt;/p&gt;\n&lt;h4 id=\"okhyrman-tuepnuskha-men-generaciyalanghan-maetindi-khalaj-azhyratady\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#okhyrman-tuepnuskha-men-generaciyalanghan-maetindi-khalaj-azhyratady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оқырман түпнұсқа мен генерацияланған мәтінді қалай ажыратады?&lt;/span&gt;&lt;/a&gt;Оқырман түпнұсқа мен генерацияланған мәтінді қалай ажыратады?&lt;/h4&gt;\n&lt;p&gt;Жобаға қатыспаған зерттеуші соқыр тест өткізді: ол CARS қағидаларына сүйене отырып, 60 түпнұсқа және 60 генерацияланған кіріспені жіктеуі керек болды. Оқырман 120 мәтіннің 108-ін (90%) дұрыс анықтады. 120 жағдайдың 118-інде критерий жазу стилі емес, дәл аргументация құрылымы болды. Оқырман қадамдар тізбегін және олардың өзара байланысын талдады.&lt;/p&gt;\n&lt;h4 id=\"cars-prompt-arkhyly-zhazylghan-kirispelerdi-anykhtau-ongajyrakh\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#cars-prompt-arkhyly-zhazylghan-kirispelerdi-anykhtau-ongajyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CARS-промпт арқылы жазылған кіріспелерді анықтау оңайырақ&lt;/span&gt;&lt;/a&gt;CARS-промпт арқылы жазылған кіріспелерді анықтау оңайырақ&lt;/h4&gt;\n&lt;p&gt;Генерацияланған 60 мәтіннің жартысы базалық, жартысы CARS-бағытталған промпт арқылы жасалған. Оқырман CARS-промпт арқылы жасалған барлық 30 мәтінді және базалық промпттағы 24-ін қатесіз анықтады. Бұл модельді CARS арқылы «бағыттау» әрекеті құрылымды біркелкі және қатаң ететінін, бұл өз кезегінде машиналық мәтінді анықтауды жеңілдететінін растайды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f2.jpg\" alt=\"2-сурет: Біздің фреймворктың шолуы. Корпустағы 76 мақаланың әрқайсысынан біз мазмұнды және түпнұсқа кіріспеде келтірілге\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Біздің фреймворктың шолуы. Корпустағы 76 мақаланың әрқайсысынан біз мазмұнды және түпнұсқа кіріспеде келтірілген жұмыстарды құрастырамыз.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: Біздің фреймворктың шолуы. Корпустағы 76 мақаланың әрқайсысынан біз мазмұнды және түпнұсқа кіріспеде келтірілген жұмыстарды құрастырамыз. Төрт LLM әр мақаланың кіріспесін базалық және CARS басқаратын сұраныс бойынша жазады, бұл 608 генерацияланған кіріспені береді. Содан кейін автоматты аннотатор барлық түпнұсқа және генерацияланған кіріспелерді CARS қадамдары мен жүрістерімен белгілейді. Бұл белгілер түпнұсқа және генерацияланған кіріспелерді салыстыруға және қолмен талдауға негіз болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f3.jpg\" alt=\"3-сурет: Адамның анықтауын зерттеуде (§5.2) қолданылған аннотация интерфейсі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Адамның анықтауын зерттеуде (§5.2) қолданылған аннотация интерфейсі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Адамның анықтауын зерттеуде (§5.2) қолданылған аннотация интерфейсі. Бір кіріспе көрсетілген, оның автоматты CARS жүрістерінің аннотациялары (белгіленген күйде) түсті бөлектеу түрінде, шығу тегі туралы бес балдық сұрақ пен шешім негіздемесі бойынша міндетті сұрақтың үстінде орналасқан. Жоғарғы жағындағы түстер кілті тек экрандағы мәтінде кездесетін жүрістерді ғана көрсетеді. Сарапшы айналдыру арқылы бүкіл кіріспені көреді; мұнда мәтін экранның төменгі жағында қиылған.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ЖИ мен адам&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрылымының&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;айырмашылығы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CARS моделі&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бойынша 608&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мәтін талдауы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ЖИ біркелкі&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жазады&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Риторикалық&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрылым ЖИ-ді&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әшкерелейді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;synthetic&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&l
