        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"249\" cy=\"72\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"591\" cy=\"271\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · COORDINATION   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Әлеуметтік желідегі таңдау:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;алгоритмдер ме, әлде таныс&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;орта ма?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f1.jpg\" alt=\"1-сурет. Жоғарыда: назар аудару жолының ұзындығы бойынша жіктелген талданған өзара әрекеттесулер (107,8 млн бақыланатын,\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Жоғарыда: назар аудару жолының ұзындығы бойынша жіктелген талданған өзара әрекеттесулер (107,8 млн бақыланатын, 21,2 млн ретрансляцияланатын, 31,7 млн екі қадамдық жергілікті, 12,5 млн қашықтағы). Төменде: бақылаудың екі қадамы шеңберіндегі өзара әрекеттесу үлесі (яғни, бақыланатын және екі қадамдық жергілікті деңгейлер, ретрансляцияны қоспағанда) күтілетін нөлдік дәрежеге қатысты.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Әлеуметтік желі қолданушылары көбіне алгоритмдерді кінәлайды, бірақ желінің құрылымы да маңызды рөл атқарады. Bluesky платформасындағы 173 миллион өзара әрекеттесуді талдау нәтижесінде қолданушылардың өздерінің «әлеуметтік көпіршіктері» ішінде қалатыны анықталды. Тіпті қарапайым хронологиялық лентада да адамдар өз жазылымдарының шеңберінен шығуға құлықсыз.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Өзара әрекеттесудің 74,5%-ы қолданушының бұрыннан бар жазылымдары арқылы жүзеге асады.&lt;/li&gt;\n&lt;li&gt;Назардың 80,6%-ы екі &lt;a href=\"concepts/step.html\"&gt;қадам&lt;/a&gt; қашықтықта шоғырланған, бұл кездейсоқ модельден 3,6 есе жоғары.&lt;/li&gt;\n&lt;li&gt;Желіден тыс контентпен әрекеттесу жаңа жазылымға айналу ықтималдығы 3 есе төмен.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер 2023 жылдың ақпаны мен қыркүйегі аралығында 1,1 миллион Bluesky қолданушысының 173 миллион өзара әрекеттесуін (лайктар, репосттар, жауаптар) зерттеді. Негізгі өлшем ретінде «назар жолының ұзындығы» — қолданушы мен контент авторы арасындағы жазылымдар графындағы қашықтық алынды. Нәтижелер көрсеткендей, барлық өзара әрекеттесудің 74,5%-ы қолданушы бұрыннан жазылған аккаунттарға немесе солар арқылы таратылған контентке тиесілі.&lt;/p&gt;\n&lt;p&gt;Жазылымдар графындағы қашықтық бойынша есептегенде, өзара әрекеттесудің 80,6%-ы екі «қадам» (follow-hops) шеңберінде орын алады. Бұл кездейсоқ таралуды болжайтын нөлдік модель (expected-degree null) көрсеткен 22,4%-дан әлдеқайда жоғары. Зерттеу сонымен қатар қолданушылар өз желілерінен тыс контентті көрсе де, оны жаңа жазылымға айналдыру ықтималдығы өте төмен екенін анықтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек нақты әрекеттерді (лайк, репост) талдайды, пассивті контент тұтынуды (көру, оқу) ескермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Жекелендірілген әлеуметтік желілер қолданушының лентасын қалыптастыру үшін көбінесе жазылу графтарын пайдаланады. Алайда, қолданушы жазылмаған авторлардың контентіне қаншалықты назар аударылатыны әлі де толық зерттелмеген. Бұл зерттеу Bluesky орталықсыздандырылған платформасына арналған, мұнда лента әдепкі бойынша кері хронологиялық тәртіппен құрылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/graf-podpisok.html\"&gt;Жазылу графы&lt;/a&gt; — бұл қолданушылар арасындағы байланыстарды көрсететін деректер құрылымы, ал «назар аудару жолы» контенттің қолданушыға қанша делдал арқылы жететінін анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар 2023 жылдың ақпаны мен қыркүйегі аралығында жиналған 173 миллион өзара әрекеттесуді (лайктар, репосттар, жауаптар және дәйексөздер) талдады. Өзара әрекеттесулер жол ұзындығына қарай жіктелді: тікелей жазылу, жазылу арқылы таратылған контент, граф бойынша екі «секіріс» (hops) қашықтығындағы немесе одан тыс контент.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өзара әрекеттесулердің 74,5%-ы қолданушы бұрыннан жазылған аккаунттарға тиесілі, ал 80,6%-ы екі «секіріс» қашықтығында орналасқан, бұл нөлдік модель бойынша күтілген 22,4%-дан айтарлықтай жоғары.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу көрсеткендей, қолданушылардың шағын тобы барлық «зерттеу» белсенділігінің (жазылулар желісінен тыс өзара әрекеттесулер) 75%-ын құрайды. Уақыт өте келе жаңа контентті зерттеуге деген бейімділік төмендейді, бірақ бұл үрдістің артында үш түрлі мінез-құлық түрі жасырылған. Екі «секіріс» қашықтығынан тыс жерден келген контент жаңа жазылуларға үш есе сирек айналады. Бұл сыртқы контент көлемінің үлкен болуына қарамастан, оның әлеуметтік желідегі жақындықпен шектелгенін және жаңа байланыстардың қалыптасуына әкелу ықтималдығының төмен екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл бақылау зерттеуі Bluesky платформасындағы корреляцияларды сипаттайды; нәтижелер желі алгоритмдері мен аудиторияның мінез-құлқына байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Көптеген ірі әлеуметтік платформалар контентті рейтингтік алгоритмдер арқылы басқарады, олардың жұмыс істеу принципі сыртқы бақылаушылар үшін ішінара жабық. Бұл пайдаланушы назарын қалыптастыратын екі күшті ажыратуды қиындатады: пайдаланушының өзі құрған әлеуметтік орта және ұсыныс жүйелері ұсынатын контент. Bluesky платформасы бұл айырмашылықты зерттеу үшін бірегей ортаны ұсынады. Ол ашық AT Protocol негізінде құрылған және әдепкі бойынша «Following» таспасын пайдаланады, онда жазбалар кері хронологиялық тәртіпте көрсетіледі. Басқа ұсыныс механизмдері бар болса да, олар ерікті және зерттеулер оларды пайдалану деңгейі шектеулі екенін көрсетеді. Сондықтан, Bluesky жазылулар графигі пайдаланушы назары өзі құрған әлеуметтік ортадан қаншалықты тысқары шығатынын талдау үшін негіз болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу көрсеткендей, пайдаланушы өзара әрекеттесулерінің 74,5%-ы олар бұрыннан жазылған аккаунттарға немесе олар арқылы жасалған репосттарға тиесілі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жұмыста назар ұғымы мінез-құлық іздері: лайктар, репосттар, жауаптар және дәйексөздер арқылы анықталады. Авторлар сұрақ қояды: назардың қанша бөлігі жазылулар желісі ішінде қалады және қаншасы одан тысқары шығады? Бұл маңызды, өйткені әлеуметтік байланыстар селективті. &lt;a href=\"concepts/gomofiliya.html\"&gt;Гомофилия&lt;/a&gt; (ұқсас адамдармен бірігу бейімділігі) жазылулар графигі бастапқыда кездейсоқ емес екенін білдіреді. Зерттеушілер үш сұрақты талдайды: жазылулар графигінен тысқары қанша назар шығады (RQ1), бұл ізденіс пайдаланушылар арасында қалай бөлінген (RQ2) және сыртқы назар жаңа әлеуметтік байланыстарға айнала ма (RQ3).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гомофилия — адамдардың өздеріне ұқсас адамдармен байланыс орнатуға бейімділігі, бұл ақпараттық кластерлерді құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1,1 миллион пайдаланушының 173 миллион өзара әрекеттесуін қамтитын деректер жинағын пайдалана отырып, авторлар өзара әрекеттесулердің 80,6%-ы пайдаланушының екі сатылы жазылулар шеңберінде орын алатынын анықтады. Сыртқы контентті зерттеу көлемі айтарлықтай болғанымен, ол пайдаланушылар арасында біркелкі емес: белсенді азшылық сыртқы белсенділіктің негізгі бөлігін жасайды. Сонымен қатар, екі сатылы шеңберден тыс өзара әрекеттесулер жергілікті әрекеттерге қарағанда үш есе сирек жаңа жазылуларға айналады.&lt;/p&gt;\n&lt;h4 id=\"bajlanysty-zhumystar\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#bajlanysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты жұмыстар&lt;/span&gt;&lt;/a&gt;Байланысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;Онлайн назар тек платформа дизайнымен ғана емес, пайдаланушылардың жеке қалауларымен де қалыптасады. Гомофилия және растау бейімділігі адамдарды өз сенімдеріне сәйкес контентті іздеуге мәжбүр етеді. Алдыңғы жұмыстар мұны қауымдастықтар деңгейінде зерттесе, бұл зерттеу құрылымдық қашықтыққа — назардың пайдаланушының өз жазылулар графигінен қаншалықты алыстайтынына назар аударады. Авторлар «ізденіс» (сыртқы аккаунттармен өзара әрекеттесу) және «&lt;a href=\"concepts/conversion.html\"&gt;конверсия&lt;/a&gt;» (мұны жазылуға айналдыру) ұғымдарын ажыратып көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек Bluesky платформасының деректеріне негізделген, сондықтан нәтижелерді басқа әлеуметтік желілерге толық көшіру шектеулі болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"rq1-nazar-audaru-zhazylular-grafynan-tyskhary-khanshalykhty-shyghady\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rq1-nazar-audaru-zhazylular-grafynan-tyskhary-khanshalykhty-shyghady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ1: Назар аудару жазылулар графынан тысқары қаншалықты шығады?&lt;/span&gt;&lt;/a&gt;RQ1: Назар аудару жазылулар графынан тысқары қаншалықты шығады?&lt;/h4&gt;\n&lt;p&gt;Кемінде бір талданған өзара әрекеттесуі бар 1,1 миллион пайдаланушының 575 мыңы зерттелетін жұптарды құрайды. 173 миллион өзара әрекеттесуді назар аудару жолының ұзындығы бойынша талдау мынаны көрсетті: 62,3% пайдаланушы жазылған авторларға, 12,2% жазылған аккаунт арқылы ретрансляцияланған (репост), 18,3% жазылу графы бойынша екі қадам қашықтықтағы авторларға, 7,2% екі қадамнан асып кетеді. Осылайша, өзара әрекеттесулердің 74,5% пайдаланушы тікелей жазылған аккаунттар арқылы өтеді. Егер ретрансляцияларды алып тастап, тек жазылу графы бойынша қашықтықты есептесек, өзара әрекеттесулердің 80,6% екі қадам қашықтықтағы авторларға жетеді (62,3% — бір қадам, 18,3% — екі қадам). Бұл төменгі шек, өйткені ретрансляциялардың бір бөлігі де екі қадам ішінде болуы мүмкін. Нөлдік модельмен (пайдаланушылардың кіріс және шығыс байланыстарын сақтай отырып, күтілетін таралу) салыстыру кездейсоқ жағдайларда өзара әрекеттесулердің тек 22,4% екі қадам ішінде болатынын көрсетеді — 58,4 пайыздық тармақтық алшақтық әртүрлі когорталар үшін тұрақты қалуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өзара әрекеттесулердің 80,6% жазылу графы бойынша екі қадам қашықтықтағы авторларға бағытталған, бұл кездейсоқ таралудан (22,4%) айтарлықтай жоғары.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rq2-zertteushilik-nazar-khalaj-taralady-zhaene-ol-uakhyt-oete-kele-oezgere-me\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rq2-zertteushilik-nazar-khalaj-taralady-zhaene-ol-uakhyt-oete-kele-oezgere-me\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ2: Зерттеушілік назар қалай таралады және ол уақыт өте келе өзгере ме?&lt;/span&gt;&lt;/a&gt;RQ2: Зерттеушілік назар қалай таралады және ол уақыт өте келе өзгере ме?&lt;/h4&gt;\n&lt;p&gt;Жазылулар мен өзара әрекеттесулерде ең белсенді пайдаланушылар көбінесе өз назарын «жақын шеңбермен» шектейді. Зерттеушілік сипаттағы өзара әрекеттесулердің үлесі белсенділік көлемі бойынша бірінші децильден оныншы децильге дейін 20,1%-дан 74,3%-ға дейін, ал жазылулар саны бойынша 3,3%-дан 80,4%-ға дейін өседі. Кемінде 10 зерттеу оқиғасы бар 246 мың пайдаланушы үшін авторлар мінез-құлықтың 4 кластерін бөліп көрсетті. Көпшілігі (53,3%) — «тар қамту, сирек оқиғалар, төмен жиілік». Басқа кластерлер бір белгімен ерекшеленеді: «кең қамту» (22,7% пайдаланушы, орташа 293,9 автор), «қайталанатын байланыстар» (5,2% пайдаланушы, әр авторға 5,2 рет бару) және «жоғары зерттеу жиілігі» (18,8% пайдаланушы, қызметінің 66,7% зерттеу). Кең қамту әрқашан жоғары жиілікпен байланысты емес: ең кең қамтитын кластер контентті орташа жиілікте (29,7%) зерттейді және авторларға сирек оралады. «Кең, бірақ сирек» кластері барлық зерттеу оқиғаларының 74,4%-ын құрайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/klasterizatsiya.html\"&gt;Кластерлеу&lt;/a&gt; — пайдаланушыларды стандартталған белгілер негізінде ұқсас мінез-құлық үлгілері бойынша топтастыру үшін қолданылатын машиналық оқыту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Динамиканы талдау зерттеушілік назардың жалпы үлесі 7 уақыт бірлігі ішінде 24,3%-дан 21,0%-ға дейін төмендейтінін көрсетеді, бірақ бұл орташа мән біртекті еместікті жасырады. Үш топ бөлінген: «төмендеуші» (34,6% пайдаланушы, 38,1%-дан 20,7%-ға дейін төмендеу), «өсуші» (35,0%, 16,3%-дан 25,0%-ға дейін өсу) және «транзиттік» (30,4%, өсу және кейінгі төмендеу). Пайдаланушылардың үштен бірі жалпы тенденцияға қарама-қарсы бағытты көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау деректеріне негізделген; анықталған заңдылықтар себеп-салдарлық байланыстарды емес, корреляцияларды сипаттайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rq3-shyghys-nazar-zhanga-bajlanystargha-ajnala-ma\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rq3-shyghys-nazar-zhanga-bajlanystargha-ajnala-ma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ3: «Шығыс» назар жаңа байланыстарға айнала ма?&lt;/span&gt;&lt;/a&gt;RQ3: «Шығыс» назар жаңа байланыстарға айнала ма?&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер 22 миллион өзара әрекеттесу жұбын талдап, жазылу графигінен тыс контактілердің жаңа байланыстардың қалыптасуына әкелетінін анықтады. 30 күн ішінде жазылуға айналу деңгейі 8,4% құрады, бұл жағдайлардың 90%-дан астамы бірінші аптада орын алады. Конверсия ықтималдығы авторға дейінгі «қашықтыққа» байланысты: егер бірінші контакт жазылу графигіндегі екі «секіріс» (&lt;a href=\"concepts/two-hop.html\"&gt;two-hop&lt;/a&gt;) шегінде болса, конверсия 11,9%-ды, ал бұл шекарадан тыс жерде небәрі 3,3%-ды құрайды (1-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Екі «секіріс» шегінен тыс контактінің жазылуға айналу ықтималдығы жергілікті өзара әрекеттесулерге қарағанда 3,6 есе төмен (3,3% және 11,9%).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл алшақтық цензураланған деректер мен пайдаланушы деңгейіндегі жеті ковариатаға түзетулер енгізгеннен кейін де сақталады. Түзетілген модельде (2-кесте) «алыс» контакт үшін &lt;a href=\"concepts/or.html\"&gt;мүмкіндіктер қатынасы&lt;/a&gt; (OR) жергілікті контактіге қатысты 0,351 (95% CI 0,335–0,368) құрайды. Қызығы, пайдаланушының жоғары белсенділігі (log total interaction volume) конверсия ықтималдығын төмендетеді (OR 0,600), ал көптеген шығыс байланыстардың болуы (log out-degree) оны арттырады (OR 1,234).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мүмкіндіктер қатынасы (OR) — бір топтағы оқиғаның ықтималдығы екіншісіне қарағанда қаншалықты жоғары немесе төмен екенін көрсететін көрсеткіш.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"talkhylau-zhaene-khorytyndy\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#talkhylau-zhaene-khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау және қорытынды&lt;/span&gt;&lt;/a&gt;Талқылау және қорытынды&lt;/h4&gt;\n&lt;p&gt;Нәтижелер Bluesky пайдаланушыларының назары қолданыстағы әлеуметтік желіге тығыз байланғанын көрсетеді. Өзара әрекеттесулердің 25%-ы жазылу графигінен тыс шыққанымен, олардың 80,6%-ы екі «секіріс» шегінде қалады, ал тағы 12,2%-ы бақыланатын аккаунттар жасаған репосттарға тиесілі. Бұл кездейсоқ бөлінудегі күтілетін 22,4%-дан айтарлықтай жоғары, бұл желідегі жақындықтың өзара әрекеттесудің негізгі факторы екенін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында: ол корреляцияларды тіркейді, бірақ желілік қашықтық пен жаңа байланыстардың қалыптасуы арасындағы себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жұмыс «қамту ретіндегі зерттеу» мен «құрылымдық өзгеріс ретіндегі зерттеу» арасындағы айырмашылықты атап өтеді. Пайдаланушылар өз шеңберінен тыс аккаунттармен жиі әрекеттессе де, мұндай контактілер желінің кеңеюіне сирек әкеледі. Жұмыстың шектеулеріне контенттің нақты көрсетілуі туралы деректердің орнына жасалған әрекеттер туралы деректерді пайдалану және платформаның дамуының алғашқы кезеңін талдау жатады, бұл алгоритмдік ұсынымдардың қазіргі динамикасын көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"senimdilik,-validaciya-zhaene-model-specifikaciyalary\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#senimdilik,-validaciya-zhaene-model-specifikaciyalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сенімділік, валидация және модель спецификациялары&lt;/span&gt;&lt;/a&gt;Сенімділік, валидация және модель спецификациялары&lt;/h4&gt;\n&lt;p&gt;Байланыстардың маңыздылығын бағалау үшін Чунг-Лу моделі қолданылды: (u, a) жұбының байланысу ықтималдығы kout(u)kin(a)/M ретінде анықталады, мұндағы M — өзара әрекеттесулердің жалпы саны. Нөлдік гипотеза өзара әрекеттесулердің уақыт белгілерін ескереді. Салыстырылатын шама — екі «секіріс» шегіндегі өзара әрекеттесулер үлесі (граф байланыстары). Үш уақыттық когорта бойынша тексеру тұрақтылықты көрсетті: екі «секіріс» шегіндегі үлес 82,0%, 78,8% және 80,3% құрады (күтілетін 28,2%, 32,5% және 28,0% қарсы), сәйкесінше 6,20 млн, 1,63 млн және 1,69 млн өзара әрекеттесу үлгілері негізінде.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Екі «секіріс» шегіндегі бақыланған өзара әрекеттесулер үлесі кездейсоқ күтілімдерден айтарлықтай жоғары (82%-ға дейін, ~30%-ға қарсы), бұл байланыстардың кездейсоқ еместігін растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klasterleu-aedisteri\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#klasterleu-aedisteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кластерлеу әдістері&lt;/span&gt;&lt;/a&gt;Кластерлеу әдістері&lt;/h4&gt;\n&lt;p&gt;Кластерлеу K-means әдісі арқылы жүзеге асырылды (K=2–10). Тұрақтылықты тексеру үшін GMM және үлгіні екіге бөлу (ARI) әдістері қолданылды. Құрылымдық белгілер зерттеу қарқынын, кеңістікті және оқиғалар қарқындылығын қамтиды. Траектория белгілері пайдаланушылардың сегіз апталық белсенділік көрсеткіштеріне негізделген. Тренд пішіні бойынша кластерлеуде векторлар өзгерістер пішінін көрсету үшін қалыпқа келтірілді (z-score).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;K-means әдісі деректерді K кластерге топтастырады, ал силуэт коэффициенті оңтайлы топтар санын анықтауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Құрылымдық кластерлеу (K=4) 0,376 силуэт шыңын және жоғары қайталану мүмкіндігін (ARI 0,984) көрсетті. Тренд пішінін кластерлеу (K=3) алгоритмдер арасында тұрақтырақ деп табылды (ARI 0,509).&lt;/p&gt;\n&lt;h4 id=\"konversiya-modelining-specifikaciyasy\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#konversiya-modelining-specifikaciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конверсия моделінің спецификациясы&lt;/span&gt;&lt;/a&gt;Конверсия моделінің спецификациясы&lt;/h4&gt;\n&lt;p&gt;30 күндік конверсияны (авторға жазылу) бағалау үшін логистикалық модель қолданылды. Ковариаталар деректердің ағып кетуіне жол бермеу үшін бірінші байланыс (t₀) уақытына дейін есептелді. Модель бірінші оқиға түрін, қашықтықты (жергілікті немесе алыс) және жеті пайдаланушы сипаттамасын (өзара әрекеттесу көлемі, кіріс/шығыс дәрежелері, өтілі, зерттеу қарқыны, назар аудару концентрациясы, жергілікті үлес) қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель пайдаланушылар бойынша кластерлеуді ескереді, бірақ әртүрлі пайдаланушылар жазылатын авторларды ескермейді, бұл бағалау дәлдігіне әсер етуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sezimtaldykh\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#sezimtaldykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сезімталдық&lt;/span&gt;&lt;/a&gt;Сезімталдық&lt;/h4&gt;\n&lt;p&gt;Авторлар қашықтық эффектісі артефакт деген гипотезаны тексерді. Автор сипаттамаларын қосу мүмкіндіктер қатынасын 0,351-ден 0,289-ға өзгертті, бұл құрылымдық жақындық автор сипаттамаларына тәуелді емес екенін растайды. 15 кіші жиындағы талдау мүмкіндіктер қатынасының тұрақтылығын (0,331–0,380) көрсетті. t₀-ден кейінгі оқиғалар тізбегін талдау жергілікті үлес (1,682) конверсия эффектісін толық түсіндірмейтінін, яғни жергілікті және алыс байланыстар әртүрлі траекториялар бойынша дамитынын көрсетті.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"derekterdi-zhinau\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#derekterdi-zhinau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді жинау&lt;/span&gt;&lt;/a&gt;Деректерді жинау&lt;/h4&gt;\n&lt;p&gt;Зерттеуге арналған деректер Bluesky API арқылы жиналды. Пайдаланушылар туралы ақпарат &lt;a href=\"concepts/personal-data-server.html\"&gt;PDS&lt;/a&gt; (Personal Data Servers) серверлерінде сақталады, олар пайдаланушының платформадағы барлық әрекет тарихын қамтиды. Шамамен 5 миллион пайдаланушыдан тұратын бастапқы таңдамадан 2025 жылғы қаңтардағы жағдай бойынша барлық қолжетімді әрекет жазбалары алынды. Деректер жиынтығына жазылулар, «лайктар», жазбалар, репосттар және бұғаттаулар кіреді. Есептеу тиімділігін қамтамасыз ету үшін талдау платформаның алғашқы 8 айымен (2023 жылғы ақпаннан қыркүйекке дейін) шектелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PDS (Personal Data Server) — бұл пайдаланушының жеке деректерін сақтайтын орталықтандырылмаған сервер, оған ашық хаттама арқылы қол жеткізуге болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nazar-audaru-zhaene-zhol-uzyndyghy\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#nazar-audaru-zhaene-zhol-uzyndyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Назар аудару және жол ұзындығы&lt;/span&gt;&lt;/a&gt;Назар аудару және жол ұзындығы&lt;/h4&gt;\n&lt;p&gt;Назар аудару бақыланатын өзара әрекеттесу ретінде операцияланады. Талдаудың негізгі бірлігі — «пайдаланушы — автор» (du,a) жұбы, мұнда әрекеттің төрт түрі (лайктар, репосттар, жауаптар, дәйексөздер) ескеріледі. Өзара әрекеттесу назар аударудың жеткілікті дәлелі болып табылады, алайда оның болмауы назар аударылмады дегенді білдірмейді, себебі реакциясыз қаралған контент деректерде із қалдырмайды. Сондықтан барлық көрсеткіштер нақты назар аудару деңгейінің төменгі шегі болып табылады.&lt;/p&gt;\n&lt;p&gt;Өзара әрекеттесулер төрт деңгейге бөлінеді: желі ішілік (пайдаланушы авторға жазылған немесе өзі автор) және желіден тыс. Желіден тыс әрекеттесулер «ретрансляция арқылы» (егер контентті пайдаланушы жазылған аккаунт репост жасаса) және «зерттеушілік» түрлерге бөлінеді. Зерттеушілік әрекеттесулер өз кезегінде «екі қадамды жергілікті» (жазылу жолы u → i → a бар болса) және «дистанттық» түрлерге бөлінеді.&lt;/p&gt;\n&lt;h4 id=\"klasterleu\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#klasterleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кластерлеу&lt;/span&gt;&lt;/a&gt;Кластерлеу&lt;/h4&gt;\n&lt;p&gt;Пайдаланушылардың зерттеушілік мінез-құлқы екі кластерлеу әдісімен талданады. Біріншісі, пайдаланушыларды зерттеу құрамы (жиілік, қамту ауқымы, қайталанған контактілер) бойынша топтастырады. Екіншісі, сегіз апталық зерттеу қарқындылығының траекторияларын (z-балл арқылы қалыпқа келтірілген) кластерлейді, бұл мінез-құлықтың платформадағы алғашқы кезеңде өсіп келе жатқан, кемитін немесе уақытша екенін анықтауға көмектеседі.&lt;/p&gt;\n&lt;h4 id=\"konversiyany-taldau\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#konversiyany-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конверсияны талдау&lt;/span&gt;&lt;/a&gt;Конверсияны талдау&lt;/h4&gt;\n&lt;p&gt;Пайдаланушының t₀ уақытынан кейінгі алғашқы жазылуы мақсатты нәтиже ретінде қарастырылады. 7, 15 және 30 күн ішінде конверсияға ұшыраған жұптардың үлесі бірінші контакт түріне (жергілікті немесе дистанттық) қарай есептеледі. Сондай-ақ, 30 күндік конверсияны бағалау үшін жұп деңгейіндегі логистикалық регрессиялар қолданылады, бұл контакт түрі мен конверсия арасындағы ассоциацияны анықтауға мүмкіндік береді, бірақ тікелей себеп-салдарлық байланысты талап етпейді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f1.jpg\" alt=\"1-сурет. Жоғарыда: назар аудару жолының ұзындығы бойынша жіктелген талданған өзара әрекеттесулер (107,8 млн бақыланатын,\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Жоғарыда: назар аудару жолының ұзындығы бойынша жіктелген талданған өзара әрекеттесулер (107,8 млн бақыланатын, 21,2 млн ретрансляцияланатын, 31,7 млн екі қадамдық жергілікті, 12,5 млн қашықтағы). Төменде: бақылаудың екі қадамы шеңберіндегі өзара әрекеттесу үлесі (яғни, бақыланатын және екі қадамдық жергілікті деңгейлер, ретрансляцияны қоспағанда) күтілетін нөлдік дәрежеге қатысты.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f2.jpg\" alt=\"2-сурет. Құрам кластерлері (K=4): кластер бойынша белгілердің таралуы (зерттеу деңгейі, ені, қайталану жиілігі) және әрб\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Құрам кластерлері (K=4): кластер бойынша белгілердің таралуы (зерттеу деңгейі, ені, қайталану жиілігі) және әрбір кластердің пайдаланушылар үлесі мен зерттелген оқиғалар үлесіне қатынасы. Кластерлердің реті барлық панельдерде бірдей.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f3.jpg\" alt=\"3-сурет. Апталық зерттеу деңгейі траекториясының кластерлері (K=3): қызметтің алғашқы сегіз аптасындағы кластер бойынша \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. Апталық зерттеу деңгейі траекториясының кластерлері (K=3): қызметтің алғашқы сегіз аптасындағы кластер бойынша орташа траектория, жақшада пайдаланушылардың үлесі көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Назар жазылым&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шеңберінен&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қаншалықты&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алыстайды&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Bluesky-дағы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;173 млн&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әрекетті&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдау&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Назардың 80%-ы&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;екі қадаммен&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шектелген&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Әлеуметтік&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрылым&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алгоритмдерден&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маңызды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;coordination&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Andrea Failla, Veronica Mesina, Giulio Rossetti&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;
