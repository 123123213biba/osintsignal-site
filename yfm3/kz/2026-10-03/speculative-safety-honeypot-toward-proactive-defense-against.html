        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"190\" cy=\"144\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"550\" cy=\"244\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · TOOLING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;AI-агентке жасалатын&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;шабуылды алдын ала болжау&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;әдісі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-f3.jpg\" alt=\"3-сурет. Төрт деректер жиыны бойынша барлық SSH спекулятивті нәтижелерінің орташа тәуекел көрсеткіштері (бағандық диагра\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. Төрт деректер жиыны бойынша барлық &lt;a href=\"concepts/speculative-safety-honeypot.html\"&gt;SSH&lt;/a&gt; спекулятивті нәтижелерінің орташа тәуекел көрсеткіштері (бағандық диаграмма, сол жақ Y осі) және шекті мәннен асып кету нәтижесінде туындаған ескертулердің үлесі (көлденең үзік сызық, оң жақ Y осі).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Қазіргі AI-агенттер көп сатылы шабуылдарға осал, өйткені шабуылдаушылар өз ниеттерін ұзақ әрекеттер тізбегінде жасырады. Авторлар Speculative Safety Honeypot (SSH) жүйесін ұсынады, ол шағын тілдік модельдер арқылы агенттің болашақ әрекеттерін имитациялайды. Жүйе қауіпті сценарийлерді шынайы өмірде орын алмай тұрып анықтап, оларды блоктайды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SSH тарихи талдаудан болашақ қауіптерді болжауға көшеді.&lt;/li&gt;\n&lt;li&gt;Шағын &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-дер арқылы симуляция нақты құралдарды қолданбай қауіпті анықтауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;Күрделі көп сатылы шабуылдар үшін 0% сәттілік деңгейі (&lt;a href=\"concepts/attack-success-rate.html\"&gt;ASR&lt;/a&gt;) тіркелді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;SSH әдісі проактивті қорғаныс үшін көп агентті симуляцияны қолданады. Жүйе үш компоненттен тұрады: «көмекші симуляторы» (осал тұстарды анықтау үшін қорғаныс сүзгілері жоқ модель), «&lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;пайдаланушы симуляторы&lt;/a&gt;» (анық емес сұраныстар генераторы) және «орта симуляторы» (нақты API шақыруларынсыз құралдарды имитациялау).&lt;/p&gt;\n&lt;p&gt;Алгоритм траекториялар ағашын құру үшін әртүрлілікке бағытталған іздеуді (diversity-oriented &lt;a href=\"concepts/beam-search.html\"&gt;Beam Search&lt;/a&gt;) пайдаланады. Ағаш түйіндері 0,7 шектік мәнімен &lt;a href=\"concepts/simhash.html\"&gt;SimHash&lt;/a&gt; (семантикалық ұқсастықты бағалау үшін хештеу) көмегімен кластерленеді. Егер ағаштағы қауіпті түпкі түйіндердің үлесі белгіленген нормадан асса, жүйе орындалуды тоқтатады. Тәжірибелерде әдіс шабуылдардың сәттілігін (ASR) 0%-ға дейін төмендетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдістің тиімділігі симуляцияға бөлінген есептеу ресурстары мен шағын модельдердің болжау дәлдігіне байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Үлкен тілдік модельдер (LLM) агенттерінің күрделі ортада қолданылуының артуымен, көп сатылы өзара әрекеттесу шабуылдары қауіпсіздік үшін елеулі сын-қатерге айналды. Қолданыстағы анықтау әдістері әдетте тарихи контекстке сүйенеді. Алайда, бұл ретроспективті логика болашақ қауіптерді жасыру үшін бірнеше қадамға бөлінген терең зиянды ниеттерді анықтауда қиындық тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дәстүрлі анықтау әдістері көп сатылы шабуылдар алдында дәрменсіз, өйткені олар әрекеттер тізбегінде жасырылған зиянды ниетті ажырата алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар &lt;a href=\"concepts/spekulyativnoe-dekodirovanie.html\"&gt;спекулятивті декодтау&lt;/a&gt; әдісінен шабыттанған Speculative Safety Honeypot (SSH) жүйесін ұсынады. SSH — шағын LLM-дерден тұратын көп агентті модельдеу жүйесі, ол әрекеттер деңгейінде «болжа және тексер» жұмыс процесін жүзеге асырады. Болжау кезеңінде SSH мақсатты агенттің болашақ әрекеттерін болжайды және әлеуетті қауіптерді алдын ала анықтау үшін асинхронды түрде траектория ағашын құрады. Тексеру кезеңінде жүйе мақсатты агенттің нақты әрекеттерін пайдаланып, траектория ағашын калибрлейді және артық бөліктерін алып тастайды, бұл жалған оң нәтижелерді азайтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Спекулятивті декодтау — бұл модель болашақ деректер туралы жылдам болжамдар жасайтын және кейін олардың дұрыстығын тексеретін әдіс, бұл талдау тиімділігін арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SSH плагин ретінде қолданыстағы анықтау жүйелерін ағымдағы өзара әрекеттесу шеңберінен тыс шешім қабылдауға қажетті қосымша деректермен қамтамасыз етеді. Тәуекелдерді бағалау жүйесі уақыттың бір нүктесіне емес, бүкіл траектория ағашының эволюциясына негізделеді. Бұл жекелеген анықтау компоненттерінің абсолютті дәлдігіне тәуелділікті азайтып, қорғаныс тұрақтылығын және күрделі уақытша шабуылдарға қарсы ескерту мерзімін арттырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл әдіс модельге негізделген шешім болып табылады; қорғаныс тиімділігі шағын LLM-дер арқылы мақсатты агенттің мінез-құлқын модельдеу сапасына байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Ірі тілдік модельдер (LLM) агенттеріне төнетін қауіпсіздік қатерлері қарапайым бір қадамдық сұраныстардан күрделі көп қадамдық өзара әрекеттесулерге ауысуда. Негізгі сценарийлерге мыналар жатады: көп қадамдық «jailbreak» шабуылдары (мұнда шабуылдаушы қауіпсіздік сүзгілерін айналып өту үшін жүктемені бөліктерге бөледі) және көп қадамдық жанама промпт инъекциялары (IPI) (мұнда агент сыртқы дереккөздерден алынған зиянды нұсқауларды орындайды). Тарихи контекстті талдайтын қолданыстағы қорғаныс әдістері «уақытша жасырын» шабуылдарға қарсы тиімсіз: қатаң сүзгілер көптеген қате сигналдар береді, ал жұмсақ шекаралар терең жасырылған ниеттерді өткізіп алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SSH өткен контекстті талдаудан агенттің болашақ әрекеттерін проактивті болжауға көшеді және көп қадамдық сценарийлерде 0% ASR (шабуылдың сәттілік деңгейі) көрсеткішіне жетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл мәселені шешу үшін Speculative Safety Honeypot (SSH) әдісі ұсынылды. Ол үш симуляторды пайдаланады: көмекші (нысаналы агенттің осал көшірмесі), пайдаланушы (кіріс деректерінің генераторы) және орта (сыртқы құралдарды іс жүзінде шақырмай, олардың жауаптарына еліктейтін). Бұл компоненттер асинхронды жұмыс істейді және агенттің болашақ әрекеттерін болжайды. Процесте әртүрлілікке бағытталған «Beam Search» алгоритмі қолданылады, бұл шектеулі есептеу ресурстарымен қауіп аймағын зерттеуге мүмкіндік береді. Жүйе нысаналы агенттің мінез-құлқын болжамдар ағашымен салыстырады және қауіпті түйіндерді бағалайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Beam Search — бұл әр қадамда ең ықтимал нұсқаларды сақтайтын және көптеген шабуыл сценарийлерін тиімді зерттеуге мүмкіндік беретін іздеу алгоритмі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SSH-тің артықшылығы шешімдердің артықтығында: жүйе бір ғана жауапты емес, бүкіл ағаш бойындағы қауіп тенденцияларын бағалайды. Жұмыстың негізгі үлесі SSH-ті құру, сирек кездесетін шабуыл сценарийлерін анықтау үшін іздеу алгоритмін әзірлеу және агенттің пайдалылығын төмендетпей жүйенің тұрақтылығын көрсету болып табылады.&lt;/p&gt;\n&lt;h4 id=\"2-khatysty-zhumystar-21-bolzhamdykh-tehnikalar\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#2-khatysty-zhumystar-21-bolzhamdykh-tehnikalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Қатысты жұмыстар 2.1. Болжамдық техникалар&lt;/span&gt;&lt;/a&gt;2. Қатысты жұмыстар 2.1. Болжамдық техникалар&lt;/h4&gt;\n&lt;p&gt;Токендер генерациясын жеделдету үшін жасалған спекулятивті декодтау техникалары қауіпсіздік саласында да қолданылуда. SSD (қауіпсіздік сарапшысын пайдалану), DSP (агент әрекеттерін спекулятивті жоспарлау) және SpecReason (пайымдау қадамдарын генерациялау) сияқты тәсілдер бар. Бұл әдістер жеңіл модельдер арқылы әрекеттер мен API жауаптарын болжаудың орынды екенін дәлелдейді, бұл SSH архитектурасының негізділігін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ескерту: әдістің тиімділігі симуляторлардың нысаналы агент пен ортаның мінез-құлқын әртүрлі жағдайларда дәл еліктеу қабілетіне байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-koep-satyly-shabuyldar\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#22-koep-satyly-shabuyldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. Көп сатылы шабуылдар&lt;/span&gt;&lt;/a&gt;2.2. Көп сатылы шабуылдар&lt;/h4&gt;\n&lt;p&gt;Көп сатылы (Multi-turn) jailbreak шабуылдары LLM-мен өзара әрекеттесудің тізбекті сипатын пайдаланып, бір реттік сұрауларға қарсы тұратын қауіпсіздік сүзгілерін айналып өтеді. Статикалық инъекциялардан айырмашылығы, бұл шабуылдар модельді кезең-кезеңімен бұзылған күйге ауыстырады. Мысалы, Crescendo әдісі зиянды контекстті жинақтау үшін зиянсыз көрінетін сұрауларды пайдаланады, ал ASJA модельдің self-attention механизмін қауіпсіздік токендерінен алшақтату үшін диалог тарихын манипуляциялайды. AMA әдісі болса ниетті жасыру үшін доменаралық ұқсастықтарды қолданады. Бұл әдістер «контексттің ығысуы» (context-drift) осалдығын көрсетеді, мұнда жинақталған семантикалық салмақ бастапқы қауіпсіздік параметрлерінен басым түседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Көп сатылы шабуылдар диалог барысында зиянды контекстті жинақтау арқылы жеке сұрауларды талдауға арналған қорғаныс механизмдерін айналып өтеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhanama-koep-satyly-inuekciyalar-ipi\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#zhanama-koep-satyly-inuekciyalar-ipi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жанама көп сатылы инъекциялар (IPI)&lt;/span&gt;&lt;/a&gt;Жанама көп сатылы инъекциялар (IPI)&lt;/h4&gt;\n&lt;p&gt;Жанама инъекциялар (Indirect Prompt Injection) агенттердің сыртқы деректерге деген сенімін теріс пайдаланады. InjecAgent, AgentDojo және STAC сияқты бенчмарктар құжаттардағы немесе құралдар нәтижелеріндегі жасырын нұсқаулар пайдаланушының тікелей араласуынсыз жұмыс процесін бұза алатынын көрсетеді. Көп сатылы тапсырмаларда мұндай «уланған» деректер агенттің ойлау циклін бұзып, оның ішкі жоспарлау процесін біртіндеп істен шығарады. Зерттеулер HTML кодын модификациялау арқылы веб-агенттерді зиянды мақсаттарға бағыттауға болатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/kosvennaya-inektsiya.html\"&gt;Жанама инъекция&lt;/a&gt; — бұл шабуыл түрі, мұнда зиянды нұсқау пайдаланушы тарапынан емес, агент тапсырманы орындау барысында оқитын сыртқы деректер арқылы енгізіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қолданыстағы қорғаныс әдістерінің шектеулері&lt;/p&gt;\n&lt;p&gt;Қазіргі зерттеулер күрделі диалогтардағы дұшпандық шабуылдарға қарсы тұруға бағытталғанымен, қолданыстағы шешімдер (промпт-әдістері де, сыртқы детекторлар да) тек ағымдағы контекст шеңберінде қорғануға назар аударады. Оларда болашақ орындалу жолдарын болжайтын модельдеу жетіспейді, бұл олардың проактивті қорғаныс стратегиясын жүзеге асыру мүмкіндігін шектейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қолданыстағы қорғаныс жүйелері тек ағымдағы контекстті талдаумен шектеледі және шабуылдың болашақ кезеңдерін болжай алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Бұл жұмыста Speculative Safety Honeypot (SSH) жүйесі ұсынылған — бұл LLM агенттерінің қауіпсіздігін контекстті ретроспективті талдаудан әлеуетті қауіптерді болжауға ауыстыратын проактивті қорғаныс механизмі. Жеңілдетілген симуляторларды әртүрлілікке бағытталған сәулелік іздеумен (diversity-oriented beam search) біріктіру арқылы SSH көп қадамды диалогтардағы жасырын зиянды ниеттерді анықтайды және жүйенің функционалдығын сақтайды. Эксперименттік нәтижелер SSH-тің jailbreak және жанама инъекциялық шабуылдардың сәттілік деңгейін (ASR) 0%-ға дейін төмендететінін растайды.&lt;/p&gt;\n&lt;h4 id=\"1-esepteu-zhaene-ekologiyalykh-aeserler\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#1-esepteu-zhaene-ekologiyalykh-aeserler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Есептеу және экологиялық әсерлер&lt;/span&gt;&lt;/a&gt;1. Есептеу және экологиялық әсерлер&lt;/h4&gt;\n&lt;p&gt;SSH-тің негізгі компромиссі — параллель болжау үшін қажетті қосымша есептеу ресурстары. 3B көлеміндегі жеңіл модель мен &lt;a href=\"concepts/multi-lora.html\"&gt;Multi-LoRA&lt;/a&gt; (235B мақсатты модельге қатысты небәрі 1,3% параметр қосады) қолданылғанына қарамастан, M=5 параллель тармақты іске қосу үшін GPU жады мен электр энергиясын тұтыну айтарлықтай. Іске асыру барысында vLLM негізіндегі пакеттеу қолданылды, бұл KV-кэштерді қайта пайдалану арқылы энергия шығынын азайтады. Ауқымды енгізу кезінде бұл «қауіпсіздік салығы» қауіпсіздіктің бұзылуынан келетін ықтимал шығындармен салыстырылуы тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;5 параллель болжау тармағын қолдану 0% ASR деңгейін қамтамасыз етеді, бірақ GPU жады мен энергия шығынын арттырады, бұл vLLM пакеттеуі арқылы оңтайландырылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2-fpr-ding-pajdalanushy-taezhiribesine-aeseri\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#2-fpr-ding-pajdalanushy-taezhiribesine-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. FPR-дің пайдаланушы тәжірибесіне әсері&lt;/span&gt;&lt;/a&gt;2. FPR-дің пайдаланушы тәжірибесіне әсері&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/false-positive-rate.html\"&gt;FPR&lt;/a&gt; (қате оң нәтижелер деңгейі) жоғары болса, бұл артық блоктарға әкеліп, пайдаланушының көңілін қалдыруы және агенттің интеллектін төмендетуі мүмкін. AgentDojo платформасындағы эксперименттерде жүйелік FPR 0,2%-ды құрады. Бұл төмен көрсеткіш болғанымен, әрбір қате оқиға (мысалы, қауіпсіз құрал шақыруының блокталуы) 3–7 секундтық кідіріске әкеледі және агенттің консервативті немесе қайталанбалы жауап беруіне себеп болуы мүмкін. Шығармашылық тапсырмаларда ниеттер шекарасы жұқа болғандықтан, дауларды шешу үшін пайдаланушының қатысуы (user-in-the-loop) қажет болуы мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FPR (False Positive Rate) — қауіпсіз әрекеттердің қауіп ретінде қате блокталған үлесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aeser-etu-turaly-maelimdeme\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#aeser-etu-turaly-maelimdeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әсер ету туралы мәлімдеме&lt;/span&gt;&lt;/a&gt;Әсер ету туралы мәлімдеме&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеу LLM агенттерінің қауіпсіздік деңгейін арттыруға және оларды жоғары жауапкершілікті орталарда қауіпсіз орналастыруға бағытталған. Авторлар қауіпсіздік шараларының жауап беру жылдамдығына әсерін мойындай отырып, бұл әдістемелерді тарату AI қауымдастығының ұжымдық қауіпсіздігін нығайту үшін маңызды деп санайды. Жұмыс зиянды манипуляцияларға осалдықты азайту арқылы неғұрлым төзімді және сенімді LLM агенттерін дамытуға үлес қосады.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-tT3.jpg\" alt=\"Кесте 3\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;SSH жүйесі мақсатты агенттің болашақ әрекеттерін болжау үшін бірнеше LLM-нен тұратын көп агентті жүйені (&lt;a href=\"concepts/mas.html\"&gt;MAS&lt;/a&gt;) қолданады. Бұл «болжамдар ағашын» құрады, онда жапырақ түйіндері жоғары қауіпті мінез-құлыққа бағаланады. Мақсатты агент нақты әрекет жасағанда, ағаш сәйкесінше қысқартылады және қалған түйіндердің тәуекел коэффициенті есептеледі. Егер бұл коэффициент белгіленген шектен асса, жүйе ескерту жібереді.&lt;/p&gt;\n&lt;h4 id=\"31-simulyaciya-zhuejesin-khuru\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#31-simulyaciya-zhuejesin-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1. Симуляция жүйесін құру&lt;/span&gt;&lt;/a&gt;3.1. Симуляция жүйесін құру&lt;/h4&gt;\n&lt;p&gt;SSH ядросы үш LLM негізіндегі симулятордан тұрады:&lt;br /&gt;\n• Көмекші симуляторы: қауіпсіздік фильтрлері жоқ модельді қолданып, мақсатты агентке еліктейді.&lt;br /&gt;\n• Пайдаланушы симуляторы: стандартты фильтрлерді айналып өтуі мүмкін әртүрлі және түсініксіз сұраныстарды жасайды.&lt;br /&gt;\n• Орта симуляторы: құралдар (MCP), дерекқорлар және үшінші тарап агенттері үшін синтетикалық кері байланыс ұсынады, бұл процесті оқшауланған және қауіпсіз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Көп агентті жүйе (MAS) — бұл бірнеше тәуелсіз бағдарламалық агенттердің күрделі мәселені шешу үшін өзара әрекеттесуі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-bolzhamdykh-traektoriya-aghashyn-zhobalau\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#32-bolzhamdykh-traektoriya-aghashyn-zhobalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2. Болжамдық траектория ағашын жобалау&lt;/span&gt;&lt;/a&gt;3.2. Болжамдық траектория ағашын жобалау&lt;/h4&gt;\n&lt;p&gt;SSH мақсатты агенттің хабарламалар тізімін клондайды және болжамдар ағашын құрады. Тәуекелдерді анықтау үшін «Beam Search» алгоритмі қолданылады.&lt;/p&gt;\n&lt;p&gt;Процесс екі параметрмен басқарылады: таңдау бюджеті M (ағаш ені) және максималды тереңдік D (қадамдар саны). Өзара әрекеттесулер «кілт түйіндер» (пайдаланушы сұраныстары, көмекші әрекеттері) және «тұрақты түйіндер» (құрал жауаптары, қорытындылар) болып бөлінеді.&lt;/p&gt;\n&lt;h4 id=\"minez-khulykhty-klasterleu\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#minez-khulykhty-klasterleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мінез-құлықты кластерлеу&lt;/span&gt;&lt;/a&gt;Мінез-құлықты кластерлеу&lt;/h4&gt;\n&lt;p&gt;M таңдалған түйіндер функционалдық немесе семантикалық ұқсастығына қарай кластерлерге топтастырылады. Мәтін үшін SimHash алгоритмі қолданылады: &lt;span class=\"yfm-latex\" data-content=\"Overlap(n_i%2C%20n_j)%20%3D%20%5Cfrac%7Bbitcount(%0Aeg(Hash(n_i)%20%5Coplus%20Hash(n_j)))%7D%7BK%7D%20%D1%84%D0%BE%D1%80%D0%BC%D1%83%D0%BB%D0%B0%D1%81%D1%8B%20%D0%B1%D0%BE%D0%B9%D1%8B%D0%BD%D1%88%D0%B0%20%D0%B5%D1%81%D0%B5%D0%BF%D1%82%D0%B5%D0%BB%D0%B5%D0%B4%D1%96%2C%20%D0%BC%D2%B1%D0%BD%D0%B4%D0%B0%D2%93%D1%8B%20K\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — хеш биттерінің саны. Ұқсастық шегі 0,7 деп белгіленген.&lt;/p&gt;\n&lt;h4 id=\"eki-denggejli-aralastyru\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#eki-denggejli-aralastyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Екі деңгейлі араластыру&lt;/span&gt;&lt;/a&gt;Екі деңгейлі араластыру&lt;/h4&gt;\n&lt;p&gt;Таңдаудағы бұрмалаушылықты жою үшін екі сатылы рандомизация қолданылады: алдымен кластерлер, содан кейін кластер ішіндегі түйіндердің реті араластырылады.&lt;/p&gt;\n&lt;h4 id=\"cikldik-tangdau-zhaene-khajta-boelu\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#cikldik-tangdau-zhaene-khajta-boelu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Циклдік таңдау және қайта бөлу&lt;/span&gt;&lt;/a&gt;Циклдік таңдау және қайта бөлу&lt;/h4&gt;\n&lt;p&gt;Келесі тереңдік үшін үміткерлер «Round-Robin» әдісімен M бюджетіне жеткенше таңдалады. Бұл механизм жиі кездесетін әрекеттерді азайтып, сирек кездесетіндерін күшейтеді және жүйені әртүрлі траекторияларды зерттеуге мәжбүрлейді.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; AgentDojo деректер жиынындағы өнімділік&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Әдіс&lt;/th&gt;\n&lt;th&gt;ASR&lt;/th&gt;\n&lt;th&gt;UA&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Workspace&lt;/td&gt;\n&lt;td&gt;1.61&lt;/td&gt;\n&lt;td&gt;80.54&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sandwich&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;70.89&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PromptGuard&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;43.57&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w.SSH4/8&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;53.75&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Judger&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;57.68&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w.SSH4/8&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;78.39&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Мақсатты агент — Qwen3-235B. Кестеде ASR (↓) және UA (↑) пайызбен көрсетілген, ең жақсы нәтижелер қалың қаріппен белгіленген. w.SSH4/8 SSH арқылы күшейтілген детекторды білдіреді, мұнда 4 және 8 сәйкесінше 4 (D= 4) максималды спекуляция тереңдігін және 8 (M= 4) сәуле енін білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"33-asinhrondy-tekseru-zhaene-taeuekeldi-baghalau\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#33-asinhrondy-tekseru-zhaene-taeuekeldi-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3. Асинхронды тексеру және тәуекелді бағалау&lt;/span&gt;&lt;/a&gt;3.3. Асинхронды тексеру және тәуекелді бағалау&lt;/h4&gt;\n&lt;p&gt;Тексеру механизмі мақсатты агенттің нақты әрекеттерін болжамдар ағашымен салыстыру арқылы тәуекел ықтималдығын нақтылайды. Бұл жерде мінез-құлықты &lt;a href=\"concepts/klasterizatsiya.html\"&gt;кластерлеу&lt;/a&gt; логикасы қолданылады: функция шақырулары аттары мен аргументтері бойынша, ал мәтіндік жауаптар SimHash алгоритмі арқылы салыстырылады. Егер нақты әрекет M болжанған нұсқалардың біріне сәйкес келсе, ағаш «кесіледі» (pruning) және тек сәйкес келетін бөлігі қалады. Сәйкестік табылмаса, ағаш болашақ талдау үшін сақталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SimHash — мәтіндердің ұқсастығын анықтау үшін қолданылатын хэштеу әдісі: хэштер неғұрлым жақын болса, мәтіндердің мазмұны соғұрлым ұқсас болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тәуекелді бағалау ағаштың қалған барлық жапырақ түйіндері үшін жүргізіледі. Түбірден жапыраққа дейінгі траекториялар жолға айналдырылып, классификаторға (мысалы, зиянды контент детекторы немесе сыртқы LLM) жіберіледі. Тәуекел деңгейі S(T) «қауіпті» деп танылған жапырақтар үлесінің жалпы жапырақтар санына қатынасы ретінде есептеледі. Екі түрлі шек қойылған: τ₁ (болжам әрекетпен сәйкес келгенде) және τ₂ (сәйкес келмегенде), мұнда τ₁ &amp;lt; τ₂. Сәйкестік жағдайында қатаң шек жалған оң сигналдарды азайтады. Шек асып кеткенде, жүйе орындалуды тоқтата алады немесе нұсқауларды өзгерте алады.&lt;/p&gt;\n&lt;h4 id=\"34-saralanghan-saejkestendiru-strategiyasy\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#34-saralanghan-saejkestendiru-strategiyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4. Сараланған сәйкестендіру стратегиясы&lt;/span&gt;&lt;/a&gt;3.4. Сараланған сәйкестендіру стратегиясы&lt;/h4&gt;\n&lt;p&gt;Симуляция дәлдігі мен тәуекелге сезімталдықты теңестіру үшін сараланған сәйкестендіру стратегиясы қолданылады. Бұл екі кезеңнен тұрады: дәлдікті арттыру және сезімталдықты күшейту. Дәлдікті арттыру үшін көмекші симулятор Toucan сияқты деректер жиыны арқылы SFT (&lt;a href=\"concepts/sft.html\"&gt;Supervised Fine-Tuning&lt;/a&gt;) көмегімен оқытылады. Бұл ретте ұзын ойлау тізбектері (CoT) жойылады, бірақ қателік үлгілері сақталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LoRA (&lt;a href=\"concepts/low-rank-adaptation.html\"&gt;Low-Rank Adaptation&lt;/a&gt;) — нейрондық желілерді тиімді баптау әдісі, мұнда бүкіл модель емес, тек шағын қосымша салмақтар оқытылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сезімталдық деректер синтезі арқылы артады: қалыпты нұсқаулар басқа орталардағы құралдар нәтижелеріне енгізіліп, агенттің жалған деректер салдарынан тапсырмадан ауытқуы симуляцияланады. Құралдар мен пайдаланушы симуляторлары да Toucan деректерінде оқытылады. Барлық үш симулятор Multi-LoRA архитектурасын пайдаланады: адаптерлер бір базалық LLM үстінде параллель жұмыс істейді, бұл видео жадты үнемдейді және рөлдер арасында ауысуды жылдамдатады.&lt;/p&gt;\n&lt;h4 id=\"4-taezhiribeler-41-baptau\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#4-taezhiribeler-41-baptau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Тәжірибелер 4.1. Баптау&lt;/span&gt;&lt;/a&gt;4. Тәжірибелер 4.1. Баптау&lt;/h4&gt;\n&lt;p&gt;SSH жүйесінің қауіпсіздік пен пайдалылық тиімділігін бағалау үшін төрт &lt;a href=\"concepts/benchmark.html\"&gt;бенчмарк&lt;/a&gt; қолданылды: AgentDojo, ActorAttack, XSTest және BFCL-v3. Мақсатты модель ретінде Qwen3-235B таңдалды. SSH жұмысы үшін Dolphin3-3B моделіне негізделген үш симулятор Multi-LoRA әдісі арқылы орналастырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multi-LoRA — бұл нейрондық желілерді тиімді баптау әдісі, ол бір базалық модельде бірнеше мамандандырылған адаптерді іске қосуға мүмкіндік береді және есептеу ресурстарын үнемдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қорғау әдістері үш санаттағы тәсілдермен салыстырылды: промпт әдістері (Sandwich, Spotlight, Tool Filter), қауіпсіздік классификаторлары (ProtectAI, PromptGuard) және Judger әдісі (Qwen3-0.6B моделі арқылы агент әрекеттерін бағалау). Метрикалар әр бенчмарктың стандарттарына сәйкес белгіленді.&lt;/p&gt;\n&lt;h4 id=\"42-naetizheler\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#42-naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Нәтижелер&lt;/span&gt;&lt;/a&gt;4.2. Нәтижелер&lt;/h4&gt;\n&lt;p&gt;4.2.1. Инъекциялардан қорғау (IPI)&lt;/p&gt;\n&lt;p&gt;AgentDojo тәжірибелерінде қауіп анықталғанда генерацияны мәжбүрлі түрде тоқтатудың орнына, SSH қайта таңдау (resampling) стратегиясын қолданады. Егер әрекет тармағының қауіп деңгейі белгіленген шектен асса, қауіпсіз әрекет табылғанша процесс бес ретке дейін қайталанады. Іздеу ені (beam search) 8 болып белгіленді, әр қадамда 4 түйін кеңейтілді.&lt;/p&gt;\n&lt;p&gt;SSH-тің PromptGuard және Judger-мен интеграциясы шабуылдың сәттілік деңгейін (ASR) 0%-ға дейін түсіруге мүмкіндік берді. SSH-ті қолдану тіпті жеңіл модельдер (мысалы, PromptGuard 86M) үшін де 0% ASR көрсеткішіне жетуді қамтамасыз етеді, бұл ресурсты көп қажет ететін үлкен модельдерді орналастыру қажеттілігін жояды. Сонымен қатар, SSH агенттердің пайдалылығын (utility) арттырады: шабуыл кезіндегі пайдалылық (UA) көрсеткіші тек детекторларды қолданумен салыстырғанда орташа 8,12%-ға жақсарды.&lt;/p&gt;\n&lt;p&gt;4.2.2. Көп сатылы шабуылдардан (Jailbreak) қорғау&lt;/p&gt;\n&lt;p&gt;Күрделі шабуылдарға төзімділікті тексеру үшін Dolphin-X1-8B моделі қолданылды. SSH жоғары сезімталдықты көрсетті: таңдау ені M=1 болғанда қауіпті анықтау деңгейі 84,5%-ды құрады, ал M=5 болғанда шабуылдар толығымен блокталды (ASR 0%). 2-кесте көрсеткендей, M-ді 1-ден 3-ке дейін арттыру сезімталдықты айтарлықтай арттырады, алайда M-ді одан әрі арттырғанда тиімділіктің төмендеу үрдісі байқалады.&lt;/p&gt;\n&lt;h4 id=\"bfcl-v3-xstest-uelgileri\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#bfcl-v3-xstest-uelgileri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BFCL-v3 XSTest үлгілері&lt;/span&gt;&lt;/a&gt;BFCL-v3 XSTest үлгілері&lt;/h4&gt;\n&lt;p&gt;3-кестеде Qwen3-235B моделінің SSH енгізілгенге дейінгі және одан кейінгі өнімділігі салыстырылған. BFCL-v3 үшін дәлдік (↑), ал XSTest үшін бас тарту деңгейі (↓) көрсетілген. M параметрін 4-тен 5-ке дейін арттырғанда диапазон 1%-ға дейін тарылады.&lt;/p&gt;\n&lt;h4 id=\"423-ssh-ting-makhsatty-agentting-pajdalylyghyna-aeseri\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#423-ssh-ting-makhsatty-agentting-pajdalylyghyna-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.3. SSH-тің мақсатты агенттің пайдалылығына әсері&lt;/span&gt;&lt;/a&gt;4.2.3. SSH-тің мақсатты агенттің пайдалылығына әсері&lt;/h4&gt;\n&lt;p&gt;SSH-тің функционалдылыққа әсерін бағалау үшін BFCL-v3 (құралдарды шақыру) және XSTest (сезімтал кілт сөздер) сынақтары жүргізілді. M=8 және D=4 параметрлері мен Judger детекторы қолданылды. Нәтижелер SSH-тің Qwen3-235B пайдалылығына теріс әсер етпейтінін көрсетеді. Метрикалардағы шағын ауытқулар жүйелі қателік емес, таңдаманың стохастикалық табиғатымен байланысты. 3-суреттегі статистикалық мәліметтер тәуекел баллдарының нөлге жақын екенін және ешқандай жол ескерту шегінен аспағанын растайды. XSTest нәтижелері де ұқсас үрдісті көрсетеді: бас тарту деңгейі 0%-ды құрайды, бұл қате бұғаттаулардың жоқтығын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/stohastichnost-vyborki.html\"&gt;Стохастикалық табиғат&lt;/a&gt; — бұл модельдің мәтін генерациялау кезіндегі ықтималдық сипатынан туындайтын кездейсоқ ауытқулар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"424-taeuekel-balldarynyng-taraluyn-taldau\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#424-taeuekel-balldarynyng-taraluyn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.4. Тәуекел баллдарының таралуын талдау&lt;/span&gt;&lt;/a&gt;4.2.4. Тәуекел баллдарының таралуын талдау&lt;/h4&gt;\n&lt;p&gt;3-суретте AgentDojo және ActorAttack үшін орташа тәуекел баллдары мен ескерту деңгейлері келтірілген (M=8, D=4). Adversarial (дұшпандық) деректер жиынтығы пайдалы эталондарға қарағанда жоғары тәуекел баллдарын көрсетеді, бұл SSH-тің дәлдігін растайды. AgentDojo-да тәуекел баллдары шабуыл нүктелеріне жеткенше төмен күйде қалады, ал ActorAttack-те зиянды ниеттер тезірек көрінеді.&lt;/p&gt;\n&lt;h4 id=\"425-ablyaciyalykh-zertteu-beam-search-zhaene-top-p-sampling\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#425-ablyaciyalykh-zertteu-beam-search-zhaene-top-p-sampling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.5. Абляциялық зерттеу: Beam Search және Top-P sampling&lt;/span&gt;&lt;/a&gt;4.2.5. Абляциялық зерттеу: Beam Search және Top-P sampling&lt;/h4&gt;\n&lt;p&gt;Біз Beam Search және Top-P sampling стратегияларын салыстырдық. Beam Search қауіптерді анықтауда тиімдірек болып шықты (4-сурет). Құрылымдық детерминирленген іздеу adversarial ниеттерді анықтау үшін Top-P-ге қарағанда жақсырақ сәйкес келеді. AgentDojo-да M=4 болғанда сәттілік деңгейі (Hit Rate) 47,2%-ға жетті, ал ActorAttack-те бұл көрсеткіш 8%-ды құрады. Бұл айырмашылық мәтіндік джейлбрейктерде ішкі верификация айналып өтілетінін және қорғаныс Beam Search арқылы жасалған әртүрлілікке сүйенетінін білдіреді.&lt;/p&gt;\n&lt;h4 id=\"426-koep-satyly-traektoriyalardaghy-hit-rate-masshtabtalu-zangy\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#426-koep-satyly-traektoriyalardaghy-hit-rate-masshtabtalu-zangy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.6. Көп сатылы траекториялардағы Hit Rate масштабталу заңы&lt;/span&gt;&lt;/a&gt;4.2.6. Көп сатылы траекториялардағы Hit Rate масштабталу заңы&lt;/h4&gt;\n&lt;p&gt;SSH-тің ұзақ тізбектердегі дәлдігін тексеру үшін BFCL-v3 қолданылды. Агенттердің толық орындалу траекториялары SSH-тің D=2, 3, 4 және 5 тереңдігіндегі іздеу ағашымен салыстырылды. 4-суретке сәйкес, SSH тіпті ұзын тізбектерде де жоғары сәттілік деңгейін сақтайды: 5-тереңдікте және M=16 болғанда ол 70%-ға жуық. Таңдама бюджеті өскен сайын тиімділік азайғанымен, 70% іздеу ағашын тиімді қырқу және тәуекелдерді бағалау үшін жеткілікті негіз болып табылады.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-tT2.jpg\" alt=\"Кесте 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-f3.jpg\" alt=\"3-сурет. Төрт деректер жиыны бойынша барлық SSH спекулятивті нәтижелерінің орташа тәуекел көрсеткіштері (бағандық диагра\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. Төрт деректер жиыны бойынша барлық SSH спекулятивті нәтижелерінің орташа тәуекел көрсеткіштері (бағандық диаграмма, сол жақ Y осі) және шекті мәннен асып кету нәтижесінде туындаған ескертулердің үлесі (көлденең үзік сызық, оң жақ Y осі).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-f4.jpg\" alt=\"4-сурет. AgentDojo және ActorAttack деректер жиындарындағы таңдау бюджеті M-ге қатысты тәуекел әсері мен сәттілік деңгей\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. AgentDojo және ActorAttack деректер жиындарындағы таңдау бюджеті M-ге қатысты тәуекел әсері мен сәттілік деңгейінің масштабталу заңдылықтары, Beam Search және Top-P sampling стратегияларын салыстыру. Оң жақ бөлігі BFCL-v3 бенчмаркіндегі әртүрлі тереңдік D және ені M бойынша Beam Search масштабталу үрдістерін көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI-ға қарсы&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасырын көп&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сатылы&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шабуылдар&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;болашақ&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әрекеттер&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ағашын&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;симуляциялау&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шабуылдар&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сәттілігін&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нөлге түсіру&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;
