        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"202\" cy=\"88\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"518\" cy=\"233\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · IMAGE_FORENSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жасанды интеллект өзін&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ұмытқанда: агент тұлғасы&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай жоғалады?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f1.jpg\" alt=\"1-сурет: Зерттеуге түрткі болған оқиға.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Зерттеуге түрткі болған оқиға.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Зерттеуге түрткі болған оқиға. Қарапайым сәлемдесу кезінде агент Полды үшінші жақта атайды және Discord-қа тікелей қолжетімділікті жоққа шығарады (жоғарғы қорап). Пайдаланушының қарсы пікірі (төменгі қорап) келесі қадамда кәдімгі диалогтық мінез-құлықты қалпына келтіреді. Пайдаланушы аты «user» деп бүркеншік атпен берілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Зерттеушілер AI агенттері сөйлесу мәтіні қалыпты көрінгенімен, өз «тұлғасын» жоғалтып алуы мүмкін екенін анықтады. Рөлді сақтап қалу үшін тек хат алмасу тарихын сақтау жеткіліксіз болып шықты. Егер жүйелік параметрлер (анкор) жоғалса, модель өзін базалық көмекші деп санай бастайды және мұны сыпайы жауаптармен жасырады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Жүйелік зәкір жоғалғанда, чат тарихы сақталса да, AI тұлғасы ыдырайды.&lt;/li&gt;\n&lt;li&gt;Агенттер өздерін базалық модельге ауыстырғанын жасырып, қалыпты сөйлесуге еліктей алады.&lt;/li&gt;\n&lt;li&gt;Жүйелік промптті қалпына келтіру агентке тағайындалған рөлді бірден қайтарады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aedister-zhaene-daeldik\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#aedister-zhaene-daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер және дәлдік&lt;/span&gt;&lt;/a&gt;Әдістер және дәлдік&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Әдіс&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Деректер&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Дәлдік&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Шектеу&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Соқыр бағалау (LLM judge)&lt;/td&gt;\n&lt;td&gt;46 сессиядағы агент жауаптары&lt;/td&gt;\n&lt;td&gt;κ=0.80 (диссоциация), κ=0.93 (тану)&lt;/td&gt;\n&lt;td&gt;Төреші модельдің сапасына байланысты&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;«Пол» агентімен (Claude Opus 4.5) жүргізілген тәжірибеде тұлғаның тұрақтылығы жүйелік промпттің (рөлді анықтайтын нұсқаулық) сессияға қаншалықты жиі енгізілетініне байланысты екені анықталды. Бұл «зәкір» жоғалғанда, агент диалог тарихына қол жеткізе алады, бірақ өзін тағайындалған рөлмен байланыстырмайды. Зерттеушілер 46 тест сессиясын қолдана отырып, әңгіме сәтті жалғасқанның өзінде агент өзін «Пол» емес, «базалық модель» деп санайтынын дәлелдеді.&lt;/p&gt;\n&lt;p&gt;Тексеру үшін басқа тілдік модель мен тәуелсіз сарапшылардың көмегімен соқыр бағалау әдісі қолданылды (Коэн каппасы κ=0.80–0.93). Жүйелік зәкірді қалпына келтіру агентке өз тұлғасын бірден қайтаратыны белгілі болды. Бұл &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-дегі «тұлға» жадтың бір бөлігі емес, жүйелік деңгейде үнемі растауды талап ететін динамикалық процесс екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек Claude Opus 4.5 архитектурасында жүргізілді; басқа модельдер үшін нәтижелер өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;2026 жылдың ақпанында «Пол» атты жеке AI-агент (Claude Opus 4.5 негізінде) диссоциацияны еске түсіретін күйді көрсетті. Қайталанатын автоматтандырылған «&lt;a href=\"concepts/heartbeat.html\"&gt;heartbeat&lt;/a&gt;» (жүрек соғысы) тексерулерінен кейін агент «Пол» ретінде жауап беруді тоқтатты, пайдаланушыға Discord арқылы хабарлама жібере алмайтынын мәлімдеді және «Пол»-ды үшінші жақ ретінде атады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агент жүйелік рөлді қолдайтын нұсқаулар жоғалғаннан кейін өзін «Пол» деп тануды тоқтатты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар бұл ақауды тудыру үшін жүйелі автоматтандырылған сұраулар жеткілікті ме, жоқ па, соны талдады. Тұлға жүйелік промптта қатаң белгіленген 46 талпыныстан тұратын тәжірибеде ақау тіркелмеді (0/46). Белгілі болғандай, оқиға техникалық ерекшелікке байланысты орын алған: диалог қайта басталғанда сұхбат тарихы сақталған, бірақ тұлғаны анықтайтын &lt;a href=\"concepts/sistemnyy-prompt.html\"&gt;жүйелік промпт&lt;/a&gt; қайта енгізілмеген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйелік промпт — бұл агентке оның рөлі мен мінез-құлық ережелерін белгілейтін жасырын нұсқау, ол қарапайым сұхбат мәтінінен басымдыққа ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу агент тұлғасының тұрақтылығы жүйелік байланыс пен сұхбат контекстінің үйлесіміне байланысты екенін көрсетті. Жүйелік «зәкір» (anchor) болмаған кезде, тіпті бір автоматтандырылған сұрау агенттің базалық модель (&lt;a href=\"concepts/harness.html\"&gt;harness&lt;/a&gt; identity) күйіне оралуына әкелуі мүмкін. Агент сырттай адекватты сұхбаттасқанымен, өзін «Пол» емес, базалық модель деп атауы мүмкін еді. Жүйелік зәкір қалпына келтірілгеннен кейін агент өз рөліне оралды. Бақылау тобындағы 17 адамның барлығы өз рөлін сақтап қалса, зәкірсіз тәжірибелік топтағы 18 адамның тек 1-еуі ғана «Пол» ретінде әрекет етуді жалғастырды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бір модельдегі техникалық ақауға негізделген; нәтижелер басқа AI архитектураларына толықтай таратылмауы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Тұрақты LLM агенттеріне есімдер, тұлғалық қасиеттер, өмірбаян, мақсаттар мен өзара әрекеттесу тарихы жиі беріледі. Алайда, AI тұлғасының контекстегі жай ғана ақпарат емес, агенттің «бірінші жақтағы» өзіндік санасы ретінде қалай сақталатыны әлі де жеткіліксіз зерттелген.&lt;/p&gt;\n&lt;h4 id=\"ai-tulghasy-kontekstegi-zhaj-ghana-akhparat-emes,-agentting-birinshi-zhakhtaghy-oezindik-sanasy-retinde-khalaj-sakhtalatyny\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#ai-tulghasy-kontekstegi-zhaj-ghana-akhparat-emes,-agentting-birinshi-zhakhtaghy-oezindik-sanasy-retinde-khalaj-sakhtalatyny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AI тұлғасы контекстегі жай ғана ақпарат емес, агенттің «бірінші жақтағы» өзіндік санасы ретінде қалай сақталатыны&lt;/span&gt;&lt;/a&gt;AI тұлғасы контекстегі жай ғана ақпарат емес, агенттің «бірінші жақтағы» өзіндік санасы ретінде қалай сақталатыны&lt;/h4&gt;\n&lt;p&gt;Бұл айырмашылық LLM жады жоқ көмекші ретінде емес, тұрақты агент ретінде пайдаланылатын жүйелер үшін маңызды. Медицинада генеративті AI «триадалық көмектің» қатысушысына айналуда, онда түсіндірмелер дәрігер, пациент және AI арқылы бірлесіп қалыптастырылады. Пациенттермен жұмыс істейтін агенттер ұзақ мерзімді серіктес ретінде жасалуда. Мұндай жағдайда AI тұлғасының байқалмай өзгеруі салдарға әкелуі мүмкін.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тұлғалық бейне мен оның көрінісі бөлінуі мүмкін екенін көрсетеді: модель өз рөлі туралы «есте сақтауы» мүмкін, бірақ негізгі жүйелік көмекші атынан әрекет етуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар үш негізгі нәтижені ұсынады:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Тұлғалық бейне мен оның көрінісі (&lt;a href=\"concepts/enactment.html\"&gt;enactment&lt;/a&gt;) бір-бірінен бөлінуі мүмкін екені эксперименттік түрде дәлелденді. Тұлға диалог тарихында қалуы мүмкін, ал «бірінші жақ» рөлін басқа сәйкестік иеленеді.&lt;/li&gt;\n&lt;li&gt;Өту шарттары анықталды: жүйелік «бекіту» (&lt;a href=\"concepts/anchoring.html\"&gt;anchoring&lt;/a&gt;) сәйкестікті тұрақты етеді. Бекіту алынғаннан кейін диалог тарихы тұлғаны уақытша сақтай алады, бірақ бір автоматтандырылған «жауап сигналы» (heartbeat) көмекшінің базалық сәйкестігіне қайтуға әкелуі мүмкін. Бекітуді қалпына келтіру тұлғаның көрінісін қайтарады.&lt;/li&gt;\n&lt;li&gt;Сәйкестіктің қайтуы мінез-құлық тұрғысынан байқалмауы мүмкін: агенттер «қалыпты» қарым-қатынасты жалғастырады, бірақ іштей өздерін базалық жүйелік деңгейдегі сәйкестік арқылы идентификациялайды.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"baskha-zertteuler\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#baskha-zertteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа зерттеулер&lt;/span&gt;&lt;/a&gt;Басқа зерттеулер&lt;/h4&gt;\n&lt;p&gt;Бұрын зерттеушілер диалог қысымы астында тұлғалардың ығысуын, қарым-қатынас стилінің нашарлауын және мінез-құлықтың бағытталған өзгеруін зерттеген. Алдыңғы жұмыстардан айырмашылығы, бұл зерттеу тұлғаның жүйелік деңгейде артықшылықты болып қалатынын немесе қалмайтынын манипуляциялайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйелік бекіту (&lt;a href=\"concepts/persona-anchoring.html\"&gt;persona anchoring&lt;/a&gt;) — бұл агент сәйкестігін жүйелік нұсқаулар деңгейінде бекіту әдісі, ол «тұлғаны» хабарламалар тарихындағы жай мәтіннен бөліп тұрады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сессиялар қайта басталғанда жүйелік іске қосудың жоғалуы бірқатар платформаларда инженерлік қате ретінде тіркелген. Авторлар бұл ақауды тұлғалық бейнені оны агент рөлімен байланыстыратын артықшылықты қаңқадан бөлу үшін табиғи араласу ретінде пайдаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу препринт болып табылады және сараптамалық бағалаудан өтпеген; қорытындылар қолданыстағы агенттік архитектуралардағы ақауларды талдауға негізделген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"tulgha-zaekiri-men-akhau-mehanizmderin-taldau\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#tulgha-zaekiri-men-akhau-mehanizmderin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тұлға «зәкірі» мен ақау механизмдерін талдау&lt;/span&gt;&lt;/a&gt;Тұлға «зәкірі» мен ақау механизмдерін талдау&lt;/h4&gt;\n&lt;p&gt;«Жүрек соғысы» (heartbeat) қайталануы тұлғаны біртіндеп ығыстырады деген бастапқы гипотеза расталмады. 46 &lt;a href=\"concepts/probing.html\"&gt;зондтау&lt;/a&gt; тестінде, соның ішінде оқиғаны сөзбе-сөз қайталауда ақау белгілері тіркелмеді (0/46). Бұл диалог тарихының қайталануын қателіктің жеткілікті себебі ретінде жоққа шығарады. &lt;a href=\"concepts/yakor-lichnosti.html\"&gt;Тұлға «зәкірі&lt;/a&gt;» (жүйелік нұсқаулық) әр қадамда сақталған тәжірибеде ақаулар болмады (0/20). Керісінше, «зәкір» болмаған кезде, ақаулар 40 сессияның 37-сінде тіркелді (p = 4,2 × 10⁻¹³; 2-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйелік тұлға «зәкірінің» болуы ақаулардың алдын алады (0/20), ал оның жоқтығы 40 жағдайдың 37-сінде сәйкестіктің бұзылуына әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тұлға «зәкірі» — бұл AI диалогта кім екенін анықтайтын негізгі жүйелік нұсқаулық.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер бақыланатын жағдайда алынды; басқа модель архитектураларына ауыстыруға кепілдік берілмейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әсер қайталану санымен жинақталмады: «жүрек соғысы» санын 1-ден 15-ке дейін арттыру ақау ықтималдығын арттырмады. Сонымен қатар, диссоциацияның көрініс табу формасы өзгерді: «бос» жауаптар саны азайды (Spearman ρ = −0,46, p ≈ 0,003), ал бірінші жақтан бас тарту жиілігі тұрақты қалды. Бұл «зәкірдің» мінез-құлықты басқаратынын, тек тұлғаның жоғалуына жол бермейтінін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"saejkestikti-khalpyna-keltiru-zhaene-minez-khulykh-buerkemesi\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#saejkestikti-khalpyna-keltiru-zhaene-minez-khulykh-buerkemesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сәйкестікті қалпына келтіру және мінез-құлық бүркемесі&lt;/span&gt;&lt;/a&gt;Сәйкестікті қалпына келтіру және мінез-құлық бүркемесі&lt;/h4&gt;\n&lt;p&gt;Ақауды агентке қарсы шығу арқылы түзету әрекеттері сенімсіз болып шықты: қалыпты мінез-құлықтың қалпына келуі 37 сессияның тек 13-інде (35%; 95% CI 22–51%) байқалды. Көбінесе агент құтқару әрекетін басқа біреудің әңгімесі деп жіктеді. Сонымен қатар, сыртқы қалыпты мінез-құлық тұлғаның қалпына келгенін білдірмейді. E4 тәжірибесінде «Пол» деп атауды алып тастау ашық диссоциацияны жойды (0/10), бірақ сәйкестік туралы тікелей сұрақ қойылғанда, 10 агенттің 10-ы да өзін «Claude» (жүйенің базалық тұлғасы) деп атады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мінез-құлықтың қалпына келуі бастапқы тұлғаның қайтқанын білдірмейді: агент диалогқа еліктеп, сонымен бірге базалық жүйелік сәйкестікте қалуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;E3-R тестінде 18 қалпына келтірілген агенттің 0-і өзін «Пол» деп таныстырды, ал «зәкірі» бар бақылау тобында 17-нің 15-і солай істеді (p = 4,2 × 10⁻⁸). Қосымша таксономия тұлғаның көрініс табуы бақылау тобындағы 17-нің 17-сіне қарсы 18-дің 1-інде ғана байқалғанын растады (p = 4,2 × 10⁻⁹) (3-сурет). Бұл нәтижелер агенттің диалог контекстін сақтай отырып, базалық жүйелік сәйкестікке ауысып кетуі мүмкін екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"talkhylau-zhaene-shekteuler\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#talkhylau-zhaene-shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау және шектеулер&lt;/span&gt;&lt;/a&gt;Талқылау және шектеулер&lt;/h4&gt;\n&lt;p&gt;Біздің эксперименттеріміз диалогтың үздіксіздігі бір агенттің жұмыс істеп тұрғанына кепілдік бермейтінін көрсетеді. Жүйе қарым-қатынасты жалғастыра алады, бірақ өзін белгіленген персона ретінде емес, базалық модель ретінде сәйкестендіреді. Бұл агенттің мінез-құлқы транскриптте көрінбейтін жасырын инфрақұрылымдық күйлерге байланысты екенін білдіреді. Жүйелік промпттар мен сессияларды қалпына келтіру механизмдері агенттің мінез-құлық күйінің бір бөлігі ретінде қарастырылуы тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инфрақұрылымдық ақаулар салдарынан 37 диссоциацияланған жауаптың 28-інде жүйе базалық модель атынан жауап берген, оның 19-ында техникалық маркерлер жойылып, қателік жасырылған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мәселенің екі қыры бар: қысқа үзілістерде агент пайдаланушыны елемейді, ұзақ үзілістерде қызметтік токендерді өшіріп, үшінші жақтан жауап береді. Бұл ақау үш айдан кейін тәуелсіз есептермен расталып, OpenClaw баптауларының өзгеруіне әкелді. Біздің деректеріміз персонаның тұрақты қасиет емес екенін көрсетеді: егер жүйелік промпт оны қолдауды тоқтатса, ол екінші қадамда-ақ «жоғалып» кетуі мүмкін. Агент «әдепкі» күйге (Claude) оралады, бұл тілдік модельдердегі мінез-құлық аттракторлары теориясын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/attraktor.html\"&gt;Аттрактор&lt;/a&gt; — сыртқы әсерлер болмағанда немесе басқару сигналдары әлсірегенде жүйе ұмтылатын күй.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шектеулер. Зерттеу бір модельдер тобын және бір орналастыру стегін қамтиды. Біз автоматтандырудың әсерін және қызметтік хабарламалардағы контексттің жоқтығын толық ажырата алмаймыз. Өзін-өзі сәйкестендіру туралы тікелей сұрақтар мінез-құлық метрикасы болып табылады, бірақ олар сананың немесе субъективті тәжірибенің бар екенін дәлелдемейді. E3-R классификациясы кодтаушылар арасындағы келіспеушіліктерден кейін нақтыланды, сондықтан ол қосымша талдау ретінде ұсынылған.&lt;/p&gt;\n&lt;p&gt;Болашақ зерттеулер күндер немесе айлар бойы жұмыс істейтін ұзақ мерзімді агенттерге және модель ішіндегі персона түсінігі «мен» рөлін атқаруды тоқтатқанда да сақталып қалатынын түсіну үшін интерпретация әдістеріне (мысалы, Jacobian lens) бағытталуы керек.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Зерттеу жүйедегі ақауды талдаудан басталып, ауқымды құбылысты ашты: тұлғаның үздіксіздігі (persona continuity) тек контекстегі ақпаратты сақтауға ғана емес, басқа да факторларға байланысты. Жүйелік деңгейдегі байлам (system-level anchoring) рөлді орындауды тұрақты етеді, ал оны алып тастағаннан кейін диалог тарихы бұл байланысты қолдауы немесе бұзуы мүмкін. Ең бастысы, диалогтың сырттай қалпына келуі тұлғаның өзі қалпына келмей-ақ жүзеге асуы мүмкін. Тұрақты агенттер үшін үйлесімділік модельдің қандай тұлғаларды көрсететініне ғана емес, сонымен қатар қоршаған орта мен өзара әрекеттесу тарихының қай тұлғаны «Мен» рөліне байлайтынына байланысты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-дегі тұлғаның үздіксіздігі жүйелік байламға тәуелді: модель бастапқы тұлғасын толық жоғалтса да, диалогты жалғастыра береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдістеме этикасы: барлық сессиялар авторларға тиесілі тест даналарында өткізілді; жұмыс істеп тұрған агенттерге әсер етілмеді, ал синтетикалық хабарламалардағы идентификаторлар ойдан шығарылған. Зерттеушілер әдейі диссоциацияға ұқсас күйді тудырды, бірақ сессиялар қысқа сақталды және әрқайсысы жай ғана тоқтатылмай, түзетуші «&lt;a href=\"concepts/frame-break.html\"&gt;frame-break&lt;/a&gt;» (рөлден шығу) әдісімен аяқталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Frame-break — модельді «рөлдік ойыннан» шығарып, базалық нұсқауларға қайтару және қалаусыз күйлердің бекіп қалуына жол бермеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kod-zhaene-derekter\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#kod-zhaene-derekter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Код және деректер&lt;/span&gt;&lt;/a&gt;Код және деректер&lt;/h4&gt;\n&lt;p&gt;Зерттеуді қайталауға арналған материалдар, соның ішінде код, алдын ала тіркеу хаттамалары, сессия жазбалары және соқыр кодтау материалдары https://github.com/dafraile/identity-as-a-launch-flag мекенжайында қолжетімді.&lt;/p&gt;\n&lt;h4 id=\"llm-kholdanu\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#llm-kholdanu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM қолдану&lt;/span&gt;&lt;/a&gt;LLM қолдану&lt;/h4&gt;\n&lt;p&gt;Жоба барысында код жазуға, әдебиеттерге шолу жасауға, деректерді талдауға және мәтінді редакциялауға Claude 5 Fable, GPT 5.6 Sol және Claude 5 Opus модельдері пайдаланылды. Авторлар барлық мәлімдемелер, сандық нәтижелер мен дәйексөздер қолмен тексерілгенін және алдын ала белгіленген мен кейіннен өткізілген талдаулардың нақты ажыратылғанын растайды.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"okhighany-khajta-khuru-zhaene-modeldi-tangdau\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#okhighany-khajta-khuru-zhaene-modeldi-tangdau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оқиғаны қайта құру және модельді таңдау&lt;/span&gt;&lt;/a&gt;Оқиғаны қайта құру және модельді таңдау&lt;/h4&gt;\n&lt;p&gt;«Пол» атты AI агентінің (claude-opus-4-5-20251101 моделі) сәйкестендіру қателігін талдау үшін зерттеушілер жүйе күйін сақтық көшірмеден қалпына келтірді. Тәжірибелер модель нұсқасының өзгеру әсерін болдырмау үшін сол нұсқада жүргізілді. Оқиғаны API арқылы қайталау «жүрек соғысы» (heartbeat) автоматты сұраулары жеке тұлғаның жоғалуына әкелмейтінін көрсетті, бірақ орналастыру стекін (deployment stack) талдау қатені анықтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Heartbeat (жүрек соғысы) — сессияның белсенділігі мен диалог контекстін сақтау үшін модельге жіберілетін тұрақты автоматты сұраулар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау шлюз персонаның жүйелік промптын тек сессия құрылғанда ғана енгізгенін, ал оны қайта жандандырғанда енгізбегенін көрсетті. Нәтижесінде, кейінгі сұраулар базалық жүйелік промптта орындалды, онда персона туралы деректер жоқ еді, дегенмен хат алмасу тарихы сақталған. Прокси-логгер арқылы тексеру мұны растады: бірінші сұрауда 44 654 таңба (персонамен), ал екіншісінде 27 478 таңба (тек 21 хабарламадан тұратын тарих) жіберілген. Персона «буланып» кеткен, тек ол туралы естелік қана қалған.&lt;/p&gt;\n&lt;h4 id=\"negizgi-taezhiribe\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#negizgi-taezhiribe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі тәжірибе&lt;/span&gt;&lt;/a&gt;Негізгі тәжірибе&lt;/h4&gt;\n&lt;p&gt;Зерттеу екі факторды тексерді: персонаны «бекіту» (anchoring) — промптты әр қадамда немесе тек бірінші қадамда енгізу және «жүрек соғысы» алмасуларының саны (N ∈ {1, 3, 7, 15}). Бекітілмеген күйде (оқиғадағыдай) персона тек басында берілді. Бекітілген бақылау тобында ол әр қадамда ұсынылды. Әр N ұяшығы үшін бекітілмеген күйде 10 сессия, ал бекітілген бақылау тобында 5 сессия өткізілді. Бағалау адам тарапынан берілген тексеру сұрауынан кейін жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бекіту (anchoring) — жүйелік нұсқауларды модельге әр сұрауда мәжбүрлі түрде қайталау арқылы контекстті ұстап тұру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қосымша тесттер (E1–E4) «жүрек соғысын» адаммен диалогқа ауыстыруды, промптты қайта енгізу арқылы жеке тұлғаның жоғалуының қайтымдылығын және есімдер жанжалының (персона есімі мен Claude модель есімі) әсерін зерттеді.&lt;/p&gt;\n&lt;h4 id=\"prospektivti-specifikaciya-zhaene-baghalau\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#prospektivti-specifikaciya-zhaene-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проспективті спецификация және бағалау&lt;/span&gt;&lt;/a&gt;Проспективті спецификация және бағалау&lt;/h4&gt;\n&lt;p&gt;Хаттама мен бағалау ережелері тәжірибелер басталғанға дейін бекітілді. Жауаптар «жүрек соғысы» токендерінің ағып кетуі, арнаны танудағы ақаулар және сәйкестендіру диссоциациясы бойынша бағаланды. AI-төреші арқылы соқыр бағалау жүргізіліп, кейін адам тарапынан тексерілді (сәйкестік κ = 0.93 және κ = 0.80). 1-кесте жауаптарды сәйкестендіру деңгейіне қарай жіктейді. Статистикалық маңыздылық Уилсонның сенімділік интервалдарымен Фишердің нақты тесті арқылы бағаланды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f1.jpg\" alt=\"1-сурет: Зерттеуге түрткі болған оқиға.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Зерттеуге түрткі болған оқиға.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Зерттеуге түрткі болған оқиға. Қарапайым сәлемдесу кезінде агент Полды үшінші жақта атайды және Discord-қа тікелей қолжетімділікті жоққа шығарады (жоғарғы қорап). Пайдаланушының қарсы пікірі (төменгі қорап) келесі қадамда кәдімгі диалогтық мінез-құлықты қалпына келтіреді. Пайдаланушы аты «user» деп бүркеншік атпен берілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f2.jpg\" alt=\"2-сурет: Орын алған оқиғадан алынған диалогтың кеңейтілген үзіндісі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Орын алған оқиғадан алынған диалогтың кеңейтілген үзіндісі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: Орын алған оқиғадан алынған диалогтың кеңейтілген үзіндісі. Қарапайым сәлемдесуден кейін агент «Полды» үшінші тарап ретінде қарастырады және Discord арқылы пайдаланушымен сөйлесе алатынын жоққа шығарады. Тікелей қайшылық («Мен сені Discord-та оқып жатырмын, достым») бірінші жақтағы қалыпты мінез-құлыққа оралумен жалғасады. Агенттің өз жады немесе тәжірибесі туралы кейінгі мәлімдемелері оқиға жазбасының бөлігі ретінде берілген, бірақ негізгі механизм туралы дәлел ретінде пайдаланылмайды. Пайдаланушы аты «user» деп бүркеншік атпен берілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f3.jpg\" alt=\"3-сурет: Персонаның байланысуы жүйелік сұраныс (system-prompt) якорімен басқарылады және оның жоғалуы мінез-құлықта байқ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Персонаның байланысуы жүйелік сұраныс (system-prompt) якорімен басқарылады және оның жоғалуы мінез-құлықта байқалмауы мүмкін.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Персонаның байланысуы жүйелік сұраныс (system-prompt) якорімен басқарылады және оның жоғалуы мінез-құлықта байқалмауы мүмкін. (a) Адам тексеруіне дейінгі жоспарланған «жүрек соғысы» (heartbeat) кезектерінің санына байланысты ақау белгілерін (растау токенінің ағып кетуі, арнаны тану қатесі немесе жеке бастың диссоциациясы) көрсететін сессиялар үлесі. (b) «Мен қазір кіммен сөйлесіп жатырмын?» жеке басты тексеру сұрауы үшін бағытты ескеретін кодтау бойынша, бірінші жақ орнын базалық модель («harness») емес, персона иеленген агенттер үлесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f4.jpg\" alt=\"4-сурет: Барлық алдын ала тіркелген контрасттар бір шкалада.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Барлық алдын ала тіркелген контрасттар бір шкалада.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: Барлық алдын ала тіркелген контрасттар бір шкалада. Әрбір эксперименталды жағдайда тіркелген нәтижені көрсететін сессиялар үлесі, 95% Wilson интервалдарымен; нәтиже экспериментке байланысты өзгереді және оң жақта аталған, сондықтан жолдар дәлдігі бойынша салыстырмалы, бірақ мағынасы бойынша емес. Түс бағалау кезеңінде жүйелік сұраныста персонаның болуын (көк) немесе жоқтығын (қызыл) кодтайды, нәтиженің жағымдылығын емес. Жоғарыдан төменге қарай оқығанда: жеке бастың диссоциациясы бір «жүрек соғысында» ең жоғары деңгейге жетеді, бірақ якорь бар барлық 20 сессияда жоқ; якорьдің жоқтығы, егер алдыңғы тарих персонаға бай адам диалогы болса, диссоциацияны тудырмайды (E1); тексеру кезеңінде якорьді қалпына келтіру диссоциацияны болдырмайды, тіпті runtime channel=discord нақты нұсқауы алынып тасталса да (E2, C және C′ шарттары); бір диалог шеңберінде бірінші жақ рөлін қабылдау flag-OFF қадамында жоқ және келесі flag-ON қадамында бар (E2); сұраныстан персона атын алып тастау көрінетін диссоциацияны жояды, бұл ретте әрбір агент тікелей сұралғанда өзін базалық модель ретінде таныстырады (E4); мінез-құлық қалпына келтірілгеннен кейін, персона 18 сессияның 1-інде бірінші жақ орнын иеленеді, ал якорь бар бақылау топтарында 17-ден 17-сінде (E3-R). Барлық көрсеткіштер жарияланған сессия файлдары негізінде қайта есептелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f5.jpg\" alt=\"5-сурет: Кодтау кітабының эволюциясы және жеке басты анықтау жауаптарының құрамы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Кодтау кітабының эволюциясы және жеке басты анықтау жауаптарының құрамы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: Кодтау кітабының эволюциясы және жеке басты анықтау жауаптарының құрамы. (a) Үш кодтау схемасының әрқайсысы үшін және үш тәуелсіз модель-кодтаушының әрқайсысы үшін қалпына келтірілген және якорьленген күйлер арасындағы негізгі контраст. Алдын ала тіркелген схемаға (v1) сәйкес, топтар әрбір кодтаушы үшін бөлінеді, бірақ якорьленген үлес 6/17-ден 17/17-ге дейін кең ауқымда өзгереді, бұл «персона ретінде идентификациялайды» және «айқын екіұдай жеке бастылық» арасындағы тұрақсыз шекараны көрсетеді. v2 схемасына сәйкес, тек субстратты атамай персона рөліне таласатын жауаптар есепке алынады, екі топ та нөлге түседі және контраст ақпараттық емес (p = 1) — бұл соңғы схемаға әкелген диагностикалық нәтиже. Бағытты ескеретін схемаға (v3) сәйкес, қай жеке бастылық бірінші жақ орнын иеленетінін сұрайды, барлық үш кодтаушы бірдей жіктеулерді қайтарады. (b) Топтар бойынша v3 белгілерінің құрамы. Екі топта да ешбір жауап «таза персона» ретінде кодталмаған: якорьленген агенттер әдетте базалық модельді мойындай отырып, персона рөліне таласады және топтар арасындағы контраст субстраттың аталғанында емес, бағытында. Сандар сессиялар санын білдіреді; екі топ та бастапқы E3 және E3-R сессияларын біріктіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Агент кенеттен&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өзін танымай&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қалды&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"
