        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"251\" cy=\"124\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"609\" cy=\"290\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · BOTS   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Әлеуметтік желілер шындықты&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;бұрмалай ма?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f1.jpg\" alt=\"Екі панельдік сауалнамада әлеуметтік желілерде өткізілген уақыттың таралуы. Екі панельдік зерттеуде төрт әлеуметтік желі\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Екі панельдік сауалнамада әлеуметтік желілерде өткізілген уақыттың таралуы. Екі панельдік зерттеуде төрт әлеуметтік желіде өткізілген минуттардың таралуы. 2020 жылғы АҚШ президенттік сайлауына (A) және 2020 жылдың желтоқсаны мен 2021 жылдың маусымы аралығындағы COVID-19 пандемиясы кезеңіне (B) бағытталған панельдер үшін Facebook, Instagram, Twitter және YouTube-те өткізілген минуттардың қосымша кумулятивті таралу функциялары (CCDF).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер әлеуметтік желілерді қолдану мен адамдардың шындықты өтіріктен ажырата алу қабілеті арасындағы байланысты зерттеді. АҚШ-тағы сайлау және COVID-19 пандемиясы кезінде жүргізілген екі ірі &lt;a href=\"concepts/panelnoe-issledovanie.html\"&gt;панельдік зерттеу&lt;/a&gt; ешқандай елеулі корреляцияны анықтамады. Facebook, Twitter, YouTube немесе Instagram-ды белсенді қолдану пайдаланушылардың ақпаратты сыни тұрғыдан бағалау қабілетіне әсер етпейді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Зерттеу Facebook, Twitter, YouTube және Instagram-ды қамтыды.&lt;/li&gt;\n&lt;li&gt;Пайдаланушылардың пайымдау дәлдігін бағалау үшін &lt;a href=\"concepts/signal-detection-theory.html\"&gt;SDT&lt;/a&gt; теориясы қолданылды.&lt;/li&gt;\n&lt;li&gt;Объективті бақылау деректері желідегі уақыт пен фейктерге сену арасында байланыс жоқтығын көрсетті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жұмыста респонденттердің рас және өтірік мәлімдемелерді ажырата алу қабілетін бағалау үшін сигналды анықтау теориясы (Signal Detection Theory, SDT) қолданылды. Зерттеушілер YouGov деректерін пайдаланып, панельдік сауалнамаларды қатысушылардың құрылғыларындағы объективті белсенділік логтарымен (&lt;a href=\"concepts/digital-trace-data.html\"&gt;digital trace data&lt;/a&gt;) біріктірді. Саяси зерттеуге 624 адам, ал COVID-19 бойынша зерттеуге 1010 адам қатысты.&lt;/p&gt;\n&lt;p&gt;Талдау үшін ішкі-сыртқы регрессиялық модельдер (within-between regression models) қолданылды, бұл жеке айырмашылықтарды да, уақыт өте келе мінез-құлық динамикасын да ескеруге мүмкіндік берді. Нәтижелер респонденттердің шындықты сезу деңгейі орташа 0,75-ті құрайтынын және бұл көрсеткіш әлеуметтік желілерді қолдану қарқындылығына қарамастан тұрақты екенін көрсетті. Өздігінен есеп беру арқылы табылған статистикалық байланыстар объективті бақылау деректерімен тексерілгенде жоғалып кетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу мінез-құлқын бақылауға келіскен еріктілер тобына негізделген, бұл нәтижелердің репрезентативтілігін шектеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Әлеуметтік желілерді пайдалану жаңсақ пікірлердің қалыптасуына әкелуі мүмкін, алайда қолда бар деректер қайшылықты. Әлеуметтік желілердің гомофильді желілер, бейтараптықты күшейтетін алгоритмдер және жалған ақпарат тарататын әлеуметтік боттар сияқты сипаттамаларына қарамастан, әлеуметтік желілерді пайдалану мен жаңсақ пікірлер арасындағы тығыз байланыстың дәлелдері жоқ. Бұл жоба аталған қатынастың бүгінгі күнге дейінгі ең ауқымды эмпирикалық тексеруін ұсынады және әлеуметтік желілерді пайдаланудың жаңсақ пікірлерге әсерінің минималды екеніне қосымша дәлелдер келтіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Екі тәуелсіз панельдік зерттеуге негізделген талдау әлеуметтік желілерді пайдалану мен пайдаланушылардың шынайы және жалған мәлімдемелерді ажырата алу қабілетінің төмендеуі арасында статистикалық тұрғыдан маңызды байланысты анықтаған жоқ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Деректер екі тәуелсіз, ірі көлемді панельдік зерттеуден алынған, олардың әрқайсысы онлайн-бақылау деректерімен толықтырылған: бірі 2020 жылғы сайлауға, екіншісі COVID-19 пандемиясына арналған. Within-between регрессиялық модельдері әлеуметтік желілерді пайдалану американдықтардың Facebook, Twitter, YouTube және Instagram сияқты төрт платформада шынайы және жалған мәлімдемелерді ажырата алу қабілетінің статистикалық тұрғыдан маңызды төмендеуімен байланысты емес екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау зерттеуі: бұл себеп-салдарлық байланысты емес, тек өзара байланысты көрсетеді; нәтижелер тек аталған төрт платформамен шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Әлеуметтік желілердегі дезинформацияның зиянды әсері туралы алаңдаушылық АҚШ-та кең тараған және кейбір эмпирикалық деректер мұның негізді екенін көрсетеді. Әлеуметтік желілер жаңалықтардың жиі қолданылатын және сенімді дереккөзіне айналуда, онда пайдаланушылар көбінесе саяси тұрғыдан біртекті қауымдастықтарға бірігеді. Осы желілердің кейбірінде, әсіресе шеткі бөліктерінде, жалған және арандатушылық мазмұн кеңінен таралады. Платформа алгоритмдері дезинформацияның таралуына байқаусызда ықпал етіп, пайдаланушылардың бейімділігін күшейтуі мүмкін, ал әлеуметтік боттардың үйлестірілген әрекеті дезинформацияның кейбір түрлерін стратегиялық тұрғыдан күшейтеді. Тіпті фактілер тексерілген кезде де, Twitter-дегі жалған мәліметтер ақиқатқа қарағанда алысырақ және жылдамырақ таралуға бейім, дегенмен бұл заңдылық барлық платформаларда бірдей қайталанбайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеулер қайшылықты нәтижелерді көрсетеді: алгоритмдер жалған мәліметтердің таралуына ықпал еткенімен, олардың пайдаланушылардың саяси көзқарастарына нақты әсері көбінесе шектеулі болып шығады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сонымен қатар, әлеуметтік желілердің қате түсініктерді насихаттаудағы рөлі бойынша эмпирикалық зерттеулер коммуникациялық зерттеулердегі «минималды әсерлер» дәстүріне сәйкес келетін шектеулі әсерлер жиынтығына нұсқайды. Саяси дезинформация әлеуметтік желілер экожүйесінің өте аз бөлігін құрайды және американдықтар оны сирек бөліседі. 2016 жылғы алғашқы панельдік деректер Facebook қолдану мен АҚШ-тағы ересектер арасындағы саяси қате түсініктер арасында нақты байланысты анықтаған жоқ. Эксперименталды зерттеулер күштірек себеп-салдарлық байланысты қамтамасыз етеді, бірақ дәл сондай аралас нәтижелер береді. 2018 жылы жүргізілген деактивация зерттеуі бір ай бойы Facebook қолдануды тоқтатқан пайдаланушылардың саяси білімдерінің дәлдігі төмендегенін көрсетті. Кейінгі, 2020 жылғы деактивация зерттеуі жаңалықтар білімін (ағымдағы оқиғаларды тану) және фактілер білімін (шынайы және жалған мәлімдемелерді ажырату) ажыратып көрсетті және Facebook қолдануды тоқтату жаңалықтар білімінің төмендеуімен, бірақ фактілер білімінің артуымен байланысты екенін анықтады; Facebook қолдануды тоқтатқан қатысушылар үш жалған мәлімдемеге қатысты аздап аз сенім білдірді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу нәтижелері әдіснамаға байланысты: аккаунттарды деактивациялау білімнің әртүрлі түрлеріне әртүрлі әсер етеді, бұл нақты қорытындылар жасау мүмкіндігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жалпы алғанда, лентадағы мазмұнды немесе рейтингті манипуляциялайтын платформалық араласу зерттеулері саяси білімдерге, сенімдерге немесе көзқарастарға шектеулі әсерді анықтауға бейім. Осы заңдылықтарға сәйкес, жақында жүргізілген халықаралық деректер ұқсас шартты модельге нұсқайды, онда платформаны қолдану мен дезинформацияға сену арасындағы байланыс тақырыпқа, платформаға, жаңалықтарға деген сенімге және кеңірек ақпараттық ортаға байланысты. Мұнда сипатталған жоба әлеуметтік желілерді қолданудың қате түсініктерге әсерінің шектеулері туралы бүгінгі күнге дейінгі ең күшті дәлелдердің бірін ұсынады, сынақтар 2020 жылғы АҚШ президенттік сайлауы және COVID-19 пандемиясы контекстінде жүргізілді. Американдықтардың үлкен үлгісімен жүргізілген панельдік сауалнамаларды цифрлық із деректерімен біріктіре отырып, біз әлеуметтік желілерді қолданудың артуы кез келген контекстте қате түсініктермен мазмұнды байланысқа ие емес екенін көрсетеміз. YouTube және Twitter қолдану туралы өзіндік есептер шынайы және жалған мәлімдемелерді анықтау қабілетінің өте аз, бірақ статистикалық тұрғыдан елеулі жақсаруымен байланысты, алайда бұл байланыстар мінез-құлық деректері арқылы тексерілгенде елеулі емес.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"aeleumettik-zhelilerdi-kholdanu-zhaene-akhparattyng-shynajylyghyna-sezimtaldykh\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#aeleumettik-zhelilerdi-kholdanu-zhaene-akhparattyng-shynajylyghyna-sezimtaldykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әлеуметтік желілерді қолдану және ақпараттың шынайылығына сезімталдық&lt;/span&gt;&lt;/a&gt;Әлеуметтік желілерді қолдану және ақпараттың шынайылығына сезімталдық&lt;/h4&gt;\n&lt;p&gt;Біз панельдік зерттеулерімізде байқалатын әлеуметтік желілерді қолдану үлгілерін қысқаша сипаттаудан бастаймыз. 1-суретте екі панельдік зерттеу үшін Facebook, Instagram, Twitter және YouTube-те өткізілген минуттар санының эмпирикалық таралуы көрсетілген. Суретте көрініп тұрғандай, Facebook сайтты пайдаланушы қатысушылар саны бойынша ең танымал платформа болып табылады. Алайда, YouTube-тің ең белсенді пайдаланушылары басқа әлеуметтік желілердің ең белсенді пайдаланушыларына қарағанда көбірек уақыт жұмсайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қарапайым сипаттамалық статистика әлеуметтік желілерді қолдану мен американдықтардың жалған ақпаратқа бейімділігі арасында айтарлықтай корреляцияны анықтамады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алдыңғы жұмыстарға сәйкес, қарапайым сипаттамалық статистика американдықтардың қате түсініктерге бейімділігі олардың әлеуметтік желілерді қолдануымен байланысты екеніне аз дәлел береді. 2-суретте АҚШ сайлауы бойынша панельдік деректеріміз пайдаланылған және сенімдердің таралуы көрсетілген.&lt;/p&gt;\n&lt;p&gt;Талқылау&lt;/p&gt;\n&lt;p&gt;Бұл зерттеу әлеуметтік желілерді қолдану мен американдықтардың ақпараттың шынайылығына сезімталдығы, яғни олардың ақиқат және жалған мәлімдемелерді ажырата алу қабілеті арасындағы байланысты сенімді тексеруді қамтамасыз етеді. Маңыздысы, зерттеу бұл байланысты екі маңызды салада — саясат және қоғамдық денсаулық сақтау саласында зерттейді, бұл салаларда әлеуметтік желілер қоғамдағы қате түсініктер үшін қаншалықты жауапты болуы мүмкін екендігі туралы елеулі ғылыми және қоғамдық алаңдаушылықтар бар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында (STROBE): анықталған байланыстар себеп-салдарлық қатынасты дәлелдемейді және нәтижелер қарастырылған салалармен (саясат және денсаулық сақтау) шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біздің деректер қатысушылардың әлеуметтік желілерде кең таралған ақиқат және жалған мәлімдемелер бойынша бағалауларын қамтиды. Біз әлеуметтік желілерді қолданудың өзіндік есеп беру және мінез-құлық көрсеткіштерін пайдаландық және әлеуметтік желілерді өздері үшін маңызды ақпарат көзі деп санайтындар арасындағы байланысты тексердік. Барлық талдаулар барысында біз әлеуметтік желілерді қолдану адамдардың ақиқат және жалған ақпаратты ажырата алу қабілетімен айтарлықтай байланысты екеніне ешқандай дәлел таппадық.&lt;/p&gt;\n&lt;h4 id=\"khosymsha-akhparat\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#khosymsha-akhparat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қосымша ақпарат&lt;/span&gt;&lt;/a&gt;Қосымша ақпарат&lt;/h4&gt;\n&lt;p&gt;S1 файлы. Қосымша қосымша. (PDF)&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Бұл зерттеу YouGov басқаратын екі бөлек панельге негізделген. Бірінші панель 2020 жылғы АҚШ президенттік науқанын қамтыды, деректер 2020 жылғы 17 қыркүйектен 2020 жылғы 23 қарашаға дейін жиналды. Бұл талдауларда шамамен екі апта аралықпен жиналған бес толқынды деректер пайдаланылды. YouGov таңдаманың өкілдігін қамтамасыз ету үшін таңдаманы сәйкестендіру (sample matching) тәсілін қолданды (бастапқы кезеңде n = 700); мінез-құлық деректері бар таңдама ықтималдық емес таңдама болды (бастапқы кезеңде n = 700) және тек өздерінің веб-мінез-құлқын бақылауға келіскен еріктілерді қамтыды. Екінші панель 2020 жылғы 9 желтоқсаннан 2021 жылғы 16 маусымға дейінгі COVID-19 пандемиясын қамтыды. Жеті толқынды деректер ай сайын жиналды. Бұл ықтималдық емес таңдама болды, себебі ол тек өздерінің веб-мінез-құлқы туралы деректерді бөлісуге дайын қатысушыларды қамтыды (бастапқы кезеңде N = 1200). Бұл зерттеулер Огайо штаты университетінің Институционалдық шолу кеңесімен мақұлданды (хаттамалар №2020B0359 және №2018B0544). Қатысушылар екі зерттеу үшін де сауалнама арқылы жазбаша хабардар етілген келісім берді.&lt;/p&gt;\n&lt;h4 id=\"paneldik-zhaene-minez-khulykh-derekterin-biriktiru\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#paneldik-zhaene-minez-khulykh-derekterin-biriktiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Панельдік және мінез-құлық деректерін біріктіру&lt;/span&gt;&lt;/a&gt;Панельдік және мінез-құлық деректерін біріктіру&lt;/h4&gt;\n&lt;p&gt;Біз YouGov компаниясымен екі тәуелсіз деректер жиынтығын жинауға келісімшарт жасастық, олардың әрқайсысы мінез-құлық деректерімен жұптастырылған көп толқынды панельдік зерттеуден тұрады. Біріншісі 2020 жылғы АҚШ сайлауы кезінде жүргізілді және сайлау күніне дейінгі екі апта сайын жиналған 5 деректер толқынынан тұрды. Екіншісі COVID-19-ға арналды және 2020 жылдың желтоқсанынан бастап ай сайын жиналған 7 толқыннан тұрды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Панельдік зерттеу — бұл бірдей респонденттерден белгілі бір уақыт аралығында бірнеше рет сауалнама алынатын деректерді жинау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз әр салаға қатысты бірнеше резонанстық шынайы және жалған мәлімдемелерді анықтау үшін әлеуметтік желілердегі белсенділік деректерін пайдаландық, осы оқиғалар негізінде бірқатар сенімділік мәлімдемелерін құрастырдық және респонденттерден олардың дұрыстығын бағалауды сұрадық. Біз бұл сенімділікті бағалау батареяларын сигналды анықтау теориясы (SDT) көмегімен қатысушылардың шынайы және жалған ақпаратты ажырата алу қабілетін өлшеу үшін қолдандық. SDT-де сезімталдық — сигналды (біздің жағдайда — шынайы мәлімдемелер) және шуды (жалған мәлімдемелер) ажырата алу қабілеті. Сезімталдық 0-ден (толық қате жіктеу) 1-ге дейін (мінсіз жіктеу) өзгереді, мұнда 0,5 кездейсоқ болжамға тең. Біз бұл көрсеткішті қатысушылардың жаңылысуға бейімділігін бағалау үшін қолданамыз.&lt;/p&gt;\n&lt;p&gt;YouGov сонымен қатар бізге келісім берген қатысушылардың веб-шолғыш және қосымшаларды пайдалану тарихын ұсынды, бұл панельдің әрбір толқынының алдында қатысушылардың әлеуметтік желілерді пайдалануын бақылаудың инвазивті емес әдісін қамтамасыз етті. Біз бұл деректерді төрт әлеуметтік желі платформасының әрқайсысы үшін медианы пайдаланудың бірнеше көрсеткішін жасау үшін қолдандық: Facebook, Twitter (деректерді жинау кезінде солай аталған), YouTube және Instagram.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f1.jpg\" alt=\"Екі панельдік сауалнамада әлеуметтік желілерде өткізілген уақыттың таралуы. Екі панельдік зерттеуде төрт әлеуметтік желі\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Екі панельдік сауалнамада әлеуметтік желілерде өткізілген уақыттың таралуы. Екі панельдік зерттеуде төрт әлеуметтік желіде өткізілген минуттардың таралуы. 2020 жылғы АҚШ президенттік сайлауына (A) және 2020 жылдың желтоқсаны мен 2021 жылдың маусымы аралығындағы COVID-19 пандемиясы кезеңіне (B) бағытталған панельдер үшін Facebook, Instagram, Twitter және YouTube-те өткізілген минуттардың қосымша кумулятивті таралу функциялары (CCDF).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f2.jpg\" alt=\"Әлеуметтік желілерді қолдану мен саясатқа қатысты сенім сезімталдығы арасындағы байланыс. Әлеуметтік желілерді қолдану б\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әлеуметтік желілерді қолдану мен саясатқа қатысты сенім сезімталдығы арасындағы байланыс. Әлеуметтік желілерді қолдану бойынша АҚШ президенттік сайлауындағы сенім сезімталдығының ықтималдық тығыздығын бағалау. Панельдерде деректерді жинау кезеңінде (A) Facebook, (B) Twitter, (C) YouTube және (D) Instagram-да бір апта ішіндегі бірегей сағаттардың децильдері көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f3.jpg\" alt=\"Әлеуметтік желілерді қолдану мен COVID-19-ға қатысты сенім сезімталдығы арасындағы байланыс. Әлеуметтік желілерді қолдан\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Әлеуметтік желілерді қолдану мен COVID-19-ға қатысты сенім сезімталдығы арасындағы байланыс. Әлеуметтік желілерді қолдану бойынша COVID-19 пандемиясы үшін сенім сезімталдығының ықтималдық тығыздығын бағалау. Панельдерде деректерді жинау кезеңінде (A) Facebook, (B) Twitter, (C) YouTube және (D) Instagram-да бір ай ішіндегі бірегей сағаттардың децильдері көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f4.jpg\" alt=\"2020 жылғы АҚШ президенттік сайлауы панелінің деректерін пайдалана отырып, әлеуметтік желілерді қолданудың сенім сезімта\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2020 жылғы АҚШ президенттік сайлауы панелінің деректерін пайдалана отырып, әлеуметтік желілерді қолданудың сенім сезімталдығына әсерін бағалау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2020 жылғы АҚШ президенттік сайлауы панелінің деректерін пайдалана отырып, әлеуметтік желілерді қолданудың сенім сезімталдығына әсерін бағалау. Нүктелер ішкі-сыртқы регрессиялық модельдердің (Материалдар және әдістер бөлімінде сипатталғандай) коэффициенттерін бағалауды білдіреді. Қалың сызықтар 95% сенімділік аралықтарын білдіреді. Жіңішке сызықтар көптеген тестілеу үшін Бонферрони түзетуінен кейінгі сенімділік аралықтарын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f5.jpg\" alt=\"COVID-19 панелінің деректерін пайдалана отырып, әлеуметтік желілерді қолданудың сенім сезімталдығына әсерін бағалау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;COVID-19 панелінің деректерін пайдалана отырып, әлеуметтік желілерді қолданудың сенім сезімталдығына әсерін бағалау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;COVID-19 панелінің деректерін пайдалана отырып, әлеуметтік желілерді қолданудың сенім сезімталдығына әсерін бағалау. Нүктелер ішкі-сыртқы регрессиялық модельдердің (Материалдар және әдістер бөлімінде сипатталғандай) коэффициенттерін бағалауды білдіреді. Қалың сызықтар 95% сенімділік аралықтарын білдіреді. Жіңішке сызықтар көптеген тестілеу үшін Бонферрони түзетуінен кейінгі сенімділік аралықтарын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Әлеуметтік&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;желілер фейкке&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әсер ете ме&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Панельдік&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сауалнама және&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;трекинг&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Белсенділік&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пен фейк&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арасында&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;байланыс жоқ&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\
