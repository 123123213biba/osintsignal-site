        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"156\" cy=\"76\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"644\" cy=\"262\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Сіздің AI-агентіңіз неге&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;«ақылды» болып көрінеді:&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;бенчмарк тұзағы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер құралдарды пайдалану (&lt;a href=\"concepts/tool-use.html\"&gt;tool-use&lt;/a&gt;) тиімділігін бағалайтын танымал метрикалардың жалған оң нәтижелер беретінін анықтады. Тек функция шақыру форматына еліктейтін модельдер тапсырманы орындай алмаса да жоғары балл алады. Авторлар AI дағдыларын тексеру үшін «диагностикалық саты» деп аталатын қатаң тексерулер жиынтығын ұсынады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Кілт сөздерге негізделген бенчмарктар форматқа еліктеуді функцияның шынайы орындалуымен шатастырады.&lt;/li&gt;\n&lt;li&gt;Диагностикалық саты қайталауды тексеру, бірінші токенді &lt;a href=\"concepts/probing.html\"&gt;зондтау&lt;/a&gt; және &lt;a href=\"concepts/embedding.html\"&gt;эмбеддинг&lt;/a&gt; дрейфін талдауды қамтиды.&lt;/li&gt;\n&lt;li&gt;Модель дағдыларын түзетуде деректер сапасы есептеу ресурстарының көлемінен маңыздырақ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жұмыста VectraYX-600M және VectraYX-1B модельдері салыстырылады. Архитектуралары бірдей және тест ұпайлары ұқсас (B4 ~0.66) болғанымен, 600M моделі құралдарды шынымен шақырған, ал 1B тек ұқсас мәтін генерациялаған. Тексеру 1B моделінің &amp;lt;|tool_call|&amp;gt; токенін генерациялау ықтималдығы 10⁻⁴–10⁻⁵ деңгейінде екенін көрсетті, бұл дағдының жоқтығын білдіреді.&lt;/p&gt;\n&lt;p&gt;Мәселені шешу үшін әртүрлі деректер корпусы мен жоғары оқыту жылдамдығын пайдаланып мақсатты &lt;a href=\"concepts/sft.html\"&gt;SFT&lt;/a&gt; (fine-tuning) қолданылды. Бұл небәрі 3.3 GPU сағатын алды, бұл алдыңғы әрекеттерден 1000 есе тиімді. Салмақтарды талдау желінің негізгі токендердің эмбеддингтерін өзгертпей-ақ, сұраныстарды дұрыс бағыттауды үйренгенін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бір архитектурамен және нақты fine-tuning сценарийімен шектелген; артық шақыруларды басу нәтижелері қосымша тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Кілт сөздерді іздеуге негізделген стандартты бенчмарктар кіші модельдерге іс жүзінде жоқ қабілеттерді қате телиді. Авторлар мұны VectraYX-600M (661,6 млн параметр, 65% код және техникалық мәтін) және VectraYX-1B (1,109 млрд параметр, арнайы SFT кезеңімен) жұбының мысалында көрсетті. Екі модель де жұмсақ метрикалар бойынша бірдей дерлік нәтиже (B4: 0,660 және 0,650) көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оқыту деректерін сөзбе-сөз қайталау тесті 600M моделі 6 мысалдың 6-уында дұрыс шақыру жасайтынын, ал 1B моделі барлық сынақтарда сәтсіздікке ұшырайтынын көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бірінші токенді тексеру 1B моделінде &amp;lt;/tool_call/&amp;gt; токені үшін априорлық ықтималдықтың (10⁻⁴–10⁻⁵) жоқтығын анықтады; бұл веб-деректермен жұмыс кезеңінде бұрынғы жадтың өшіп кеткенін білдіреді. Мақсатты SFT (2202 &lt;a href=\"concepts/step.html\"&gt;қадам&lt;/a&gt;, ~3,3 GPU-сағат) көмегімен 1B моделі қалпына келтірілді. Нәтижесінде, 269 жолдық корпуста дұрыс шақырулар үлесі 0,100-ден 0,959-ға дейін көтерілді. Жаңа деректерде түзетілген 1B моделі 0,536 нәтижесін көрсетті (600M үшін 0,428, p=0,004).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — бұл модельді нақты тапсырмаларға, мысалы, сыртқы құралдарды шақыруға бейімдеу үшін арнайы белгіленген деректермен қайта оқыту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Embedding-drift тексеруі bf16 кестесінің 97,7%-ы өзгеріссіз қалғанын, яғни өзгерістер желінің ішкі бөлігінде болғанын көрсетті. Екі модель де артық белсенділікке бейім: құралдарды қажет етпейтін сұраныстарда олар 91% (600M) және 83% (1B) жағдайда қате шақырулар жасайды. Авторлар бұл диагностикалық әдістерді кіші модельдердің мүмкіндіктерін растау үшін міндетті сүзгі ретінде қолдануды ұсынады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M моделі бойынша нәтижелер оқыту процесінің 64%-ында тоқтатылған күйде алынған, бұл толық емес тәжірибені білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"khuraldardy-engizu-zhaene-metrikalardyng-saejkessizdigi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#khuraldardy-engizu-zhaene-metrikalardyng-saejkessizdigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құралдарды енгізу және метрикалардың сәйкессіздігі&lt;/span&gt;&lt;/a&gt;Құралдарды енгізу және метрикалардың сәйкессіздігі&lt;/h4&gt;\n&lt;p&gt;Тілдік модельдің MCP (Model Context Protocol) серверлерімен өзара әрекеттесу үшін құрылымдалған JSON-сұрауларын жасау қабілеті шағын офлайн модельдерді киберқауіпсіздік бойынша толыққанды көмекшілерге айналдырады. VectraYX модельдер сериясы (42 млн-нан 1,1 млрд параметрге дейін) llama.cpp арқылы оқшауланған (air-gapped) орталарда жұмыс істеуге арналған. Бұл жұмыста біз автоматтандырылған тесттер мен модельдердің нақты өнімділігі арасындағы сыни алшақтықты зерттейміз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Автоматты тесттер 600M және 1B модельдері үшін дерлік бірдей нәтижелерді (0,660 және 0,650) көрсетті, алайда іс жүзінде 1B моделі 600M-нен айырмашылығы, JSON-құрылымдарын жасай алмады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екі модельді салыстыру: VectraYX-600M (661,6 млн параметр) және VectraYX-1B (1,109 млрд параметр) парадоксты жағдайды көрсетті: декодер архитектурасы мен 32 мыңдық токенизатор бірдей болғанымен, олардың &lt;a href=\"concepts/benchmark.html\"&gt;бенчмарк&lt;/a&gt; көрсеткіштері дерлік тең (B4 = 0,660 және 0,650). Дегенмен, сапалық тестілеу кезінде 600M моделі дұрыс bash_exec командаларын жасай алды, ал 1B моделі JSON пішімін мүлдем қалыптастырмай, тек үзік-үзік мәтін шығарды.&lt;/p&gt;\n&lt;h4 id=\"oelsheu-aedisteri-zhaene-validaciya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#oelsheu-aedisteri-zhaene-validaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өлшеу әдістері және валидация&lt;/span&gt;&lt;/a&gt;Өлшеу әдістері және валидация&lt;/h4&gt;\n&lt;p&gt;Диагностика үшін біз сөзбе-сөз қайталауды тексеру әдісін (§5.3) қолдандық. Біз SFT оқу корпусынан MCP құралдары сипатталған жүйелік преамбулалары бар мысалдарды пайдаландық. Модельге промпттың жартысы берілді және одан оқу деректерін жай ғана көшірмей (жаттап алуды болдырмау үшін), логикалық тұрғыдан дұрыс JSON-сұрауын жасау талап етілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сөзбе-сөз қайталауды тексеру әдісі модельдің құрылымды шынымен түсінуін жаттап алған жауаптарынан ажыратып алуға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер кесілді: 600M моделі 6 талпыныстың 6-уында да сәтті өтті, ал 1B моделі 4 талпыныстың 0-інде өтті. Белгілі болғандай, автоматтандырылған бенчмарк 1B моделіне құралдарды мәтінде атап өткені үшін ұпай берген, ал іс жүзінде оларды шақырмаған. Бұл бағалау валидациясындағы қателік, мұнда метрика жалған оң (false positive) нәтижелерге бейім екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"diagnostika-zhaene-tuezetu\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#diagnostika-zhaene-tuezetu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диагностика және түзету&lt;/span&gt;&lt;/a&gt;Диагностика және түзету&lt;/h4&gt;\n&lt;p&gt;Бастапқы талдау (бірінші токенді зондтау) 1 млрд параметрлі (1B) модельдің априорлық ықтималдықтың жоқтығынан құралды шақыра алмағанын көрсетті: қажетті позицияда модель &amp;lt;/tool_call/&amp;gt; токеніне өте төмен ықтималдық (10⁻⁴–10⁻⁵) берген, ал 600M моделі оны дұрыс генерациялаған. Бұл жай ғана декодтау қатесі емес, модельдің форматты толық елемеуі еді, дегенмен 6 млрд токендік арнайы SFT оқыту кезеңі өткізілген болатын.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1B моделін түзету үшін деректер көлемін арттыру емес, стратегияны өзгерту қажет болды: әртүрлі деректер қоспасы мен жоғары оқыту жылдамдығымен (LR) мақсатты оқыту 2202 қадамда сәтті нәтиже берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Түзету үшін жаңа әдістеме әзірленді: деректер жиынтығын әртараптандыру (OASST диалогтары, құралдар корпусы, логикалық тізбектер), эмбеддингтерді мұздатудан шығару және LR-ді 5 есе арттыру. Оқыту 2202 қадамға және бір GPU-да шамамен 3,3 сағатқа созылды. Нәтижесінде модель құралдар шақыруын 0,996–0,998 ықтималдықпен қайталай бастады. 8 жаңа промптта модель 7 жағдайда құралдарды қатесіз таңдады және 8-ші жағдайда шақырудан бас тартты. Тиімділік 238 промптта расталды: 1B моделі белгісіз нысандарда 0,536 дәлдік көрсетті (600M моделінде 0,428).&lt;/p&gt;\n&lt;h4 id=\"oezgeristerdi-lokalizaciyalau\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#oezgeristerdi-lokalizaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өзгерістерді локализациялау&lt;/span&gt;&lt;/a&gt;Өзгерістерді локализациялау&lt;/h4&gt;\n&lt;p&gt;Эмбеддингтер дрейфін тексеру &amp;lt;/tool_call/&amp;gt; токенінің векторы іс жүзінде өзгермегенін көрсетті (косинустық ұқсастық 0,999996). Бұл «өлі эмбеддингтер» гипотезасын жоққа шығарады: токеннің мағынасы басынан дұрыс болған, түзету желіні қажетті контексте осы токенге бағыттауға үйретуден тұрған. Өлшеулер эмбеддингтер кестесінің 97,7%-ы өзгеріссіз қалғанын көрсетті, себебі Adam оптимизаторының қадамдары bf16 дәлдігінен кішірек болған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/dreyf-embeddingov.html\"&gt;Эмбеддингтер дрейфі&lt;/a&gt;» — бұл модельдегі сөздерді немесе токендерді білдіретін сандық векторлардың өзгеруі. Дрейфтің болмауы модель токеннің мағынасын қайта оқымағанын, тек оны пайдалану логикасын өзгерткенін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tezis\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tezis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тезис&lt;/span&gt;&lt;/a&gt;Тезис&lt;/h4&gt;\n&lt;p&gt;Табыстың негізгі факторы — оқыту жиынтығының құрамы (bootstrap composition). Негізінен код (65%) негізінде оқытылған 600M моделі құрылымдық шығыс қабілетін «әдепкі» бойынша иеленген. Веб-деректерде оқытылған 1B моделі бұл қабілетті жоғалтқан және оны тек мақсатты араласу арқылы ғана қалпына келтіру мүмкін болды. Бұл деректер құрамы қабілеттің «тегін» (автоматты түрде пайда болуы) немесе күрделі инженерлік жұмысты талап ететінін анықтайтынын дәлелдейді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"zhumsakh-test-modelder-oezara-almastyrylatyn-siyakhty\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#zhumsakh-test-modelder-oezara-almastyrylatyn-siyakhty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жұмсақ тест: модельдер өзара алмастырылатын сияқты&lt;/span&gt;&lt;/a&gt;Жұмсақ тест: модельдер өзара алмастырылатын сияқты&lt;/h4&gt;\n&lt;p&gt;«Жұмсақ» тест аясында (4-кесте) 600M моделі 154K қадамында 6 сынақтан 6-уын сәтті өткізді. 1B моделі phase-3 (20K қадам) және phase-4b (SFT, 400 қадам) кезеңдерінде құралды шақыру токенін генерациялау ықтималдығы өте төмен (10⁻⁴–10⁻⁵) екенін көрсетіп, тесттерден өте алмады. Алайда, «жөндеуден» кейін (2202-қадам) 1B моделі 0.996–0.998 дәлдікпен 4 сынақтан 4-уінде толық сәйкестікті көрсетті. Қабілеттерді бағалау үшін §6.5 және §6.8-де сипатталған 238 промпттан тұратын кеңейтілген батарея (n=269) қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M моделі тұрақты жұмыс істейді, ал 1B моделі түзетуге дейін оқытылғанына қарамастан, құралдарды шақыруға қабілетсіз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tuezetuge-dejingi-khatang-diagnostika-modelder-khiylyspajdy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tuezetuge-dejingi-khatang-diagnostika-modelder-khiylyspajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түзетуге дейінгі қатаң диагностика: модельдер қиылыспайды&lt;/span&gt;&lt;/a&gt;Түзетуге дейінгі қатаң диагностика: модельдер қиылыспайды&lt;/h4&gt;\n&lt;p&gt;Қатаң тестте 600M моделі синтаксистік тұрғыдан дұрыс JSON-нысандарын генерациялайды. Ол оқу үлгілерін жай ғана көшірмейді, контекстке қарай командаларды бейімдейді (мысалы, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkgcow1r\"&gt;tail&lt;/code&gt; немесе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-da7ledsh\"&gt;grep&lt;/code&gt; параметрлерін өзгертеді). Бұл модель жауаптарды жаттап алмай, өзара әрекеттесу логикасын меңгергенін дәлелдейді.&lt;/p&gt;\n&lt;p&gt;Керісінше, 1B моделі түзетуге дейін құралды шақыру блогын мүлдем ашпайды. Оның орнына ол байланыссыз мәтін генерациялайды. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m5r07hcs\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; токенінің пайда болу ықтималдығы 10⁻⁴–10⁻⁵ құрайды, бұл 6 миллиард токенде арнайы оқытылғанына қарамастан, формат туралы «априорлық білімнің» мүлдем жоқтығын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/apriornoe-znanie.html\"&gt;Априорлық білім&lt;/a&gt; — бұл модельдің нақты контекстті көргенге дейін белгілі бір деректер құрылымын генерациялауға деген «бейімділігі».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Токен генерациялау ықтималдығының төмендігі модельдің құралды шақыруға тіпті «талпынбайтынын», жай ғана қарапайым чат стилінде мәтінді жалғастыратынын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"diagnostikagha-negizdelgen-1b-modelin-zhoendeu\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#diagnostikagha-negizdelgen-1b-modelin-zhoendeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диагностикаға негізделген 1B моделін жөндеу&lt;/span&gt;&lt;/a&gt;Диагностикаға негізделген 1B моделін жөндеу&lt;/h4&gt;\n&lt;p&gt;Диагностика мәселенің шулы емес, априорлық білімнің жоқтығында екенін көрсетті. Сондықтан, тар контексте қайта оқыту тиімсіз. Желі ортасындағы салмақтарды өзгерту үшін әртүрлі контексттер мен жеткілікті оқыту жылдамдығы қажет. 5-кестеде жөндеудің үш әрекеті (A, B, C) жинақталған.&lt;/p&gt;\n&lt;p&gt;B әрекеті тест ортасындағы қателіктер (жүйелік преамбуланың жоқтығы және арнайы белгілерді өшіру) салдарынан жарамсыз деп танылды, сондықтан оның «0/8» нәтижелері есепке алынбайды. C әрекеті бастапқы &lt;a href=\"concepts/chekpoint.html\"&gt;чекпоинт&lt;/a&gt; жоғалғаннан кейін қайта өткізілді: CPU-да жаңа модельдің сол патологияға ие екені расталды (шақыру ықтималдығы 2 \times 10⁻⁷–2 \times 10⁻³), бұл жөндеу тиімділігін дұрыс бағалауға мүмкіндік берді.&lt;/p&gt;\n&lt;h4 id=\"khajta-khalpyna-keltirilgen-modelding-naetizheleri-men-diagnostikasy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#khajta-khalpyna-keltirilgen-modelding-naetizheleri-men-diagnostikasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайта қалпына келтірілген модельдің нәтижелері мен диагностикасы&lt;/span&gt;&lt;/a&gt;Қайта қалпына келтірілген модельдің нәтижелері мен диагностикасы&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде біз 1B моделінің қайта қалпына келтірілген нұсқасы үшін қатаң диагностикалық көрсеткіштерді ұсынамыз. Негізгі назар «C рецептіне» аударылған, ол жай ғана деректерді жаттап алудан тыс жалпылау қабілетін көрсетті. Тексеру үшін біз оқу корпусында жоқ сегіз жаңа промптты қолдандық, олардың жетеуі бес құралдың бірін таңдауды талап етті. Қайта қалпына келтірілген модель талап етілген барлық жағдайда дұрыс құрал шақыруларын қалыптастырды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«C рецепті» бойынша қайта қалпына келтірілген модель жаңа промпттар жиынтығында 100% (8/8) дәлдік көрсетіп, жай ғана жаттау емес, жалпылау қабілетін растады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5-кестеде әртүрлі оқыту конфигурациялары бойынша салыстырмалы деректер келтірілген. А нұсқасы (3-фаза, ~6 млрд токен) тест жиынтығында нөлдік нәтиже көрсетті. B нұсқасы (тар қайта баптау, 486 қадам) &lt;a href=\"concepts/loss.html\"&gt;жоғалту функциясы&lt;/a&gt; 0,05–0,4-ке дейін түскеніне қарамастан, токендерді өңдеудегі қателіктерге байланысты валидациядан өте алмады. «C рецепті» (2202 қадам, бір GPU-да ~3,3 сағат) оқу үлгілерін мінсіз қайталауды (4/4) Pfirst = 0,996–0,998 бірінші токен ықтималдығымен қамтамасыз етті. Тарихи іске қосу (C*) дәл осындай нәтижелерді көрсетті, бұл әдістеменің сенімділігін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/p-first.html\"&gt;P-first&lt;/a&gt; (бірінші токен ықтималдығы) — модельдің жауапты қалыптастырудағы сенімділік деңгейі; 1-ге жақын мәндер жоғары детерминизмді білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Құралдарды шақыру бойынша нақты мысалдар (мысалы, CVE-2024-3094 іздеу немесе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gaa6x9xb\"&gt;df -h&lt;/code&gt; және &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9cni89nf\"&gt;ps aux&lt;/code&gt; пәрмендерін орындау) модельдің 2801 үлгіден тұратын оқу корпусында кездеспеген нысандарды дұрыс ажырата алатынын көрсетеді. Соған қарамастан, модель дағдылардың ерекшелігін көрсетеді: фишинг туралы жалпы сұрақ қойылғанда, ол құралды шақырудан дұрыс тыйылды, бірақ мазмұнды мәтіндік жауап бере алмады, бұл жалпы нұсқауларды орындаудағы мәселелердің сақталғанын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«C рецептінің» табысы кешенді нәтиже болып табылады; қолда бар деректер корпус әртүрлілігінің, оқыту жылдамдығының немесе бастапқы нүктенің үлесін жеке бөліп көрсетуге мүмкіндік бермейді, алайда деректер көлемінің өзі шешуші фактор емес екені дәлелденген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tuezetudi-okhshaulau-oekildik-emes,-marshruttau\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tuezetudi-okhshaulau-oekildik-emes,-marshruttau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түзетуді оқшаулау: өкілдік емес, маршруттау&lt;/span&gt;&lt;/a&gt;Түзетуді оқшаулау: өкілдік емес, маршруттау&lt;/h4&gt;\n&lt;p&gt;1B моделінің істен шығуы мен эмбеддингтерді «мұздатудан шығару» сәттілігі &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7a06kyhv\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; токенінің дұрыс емес өкілдігімен байланысты деген гипотеза расталмады. Бұл архитектурада кіріс және шығыс эмбеддингтері байланысқан (tie_embeddings=true), яғни эмбеддингтер матрицасы бір уақытта декодтау матрицасы (unembedding matrix) қызметін де атқарады. Эмбеддингтердің ығысуын (drift) тексеру нәтижесінде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zghwsx3q\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; (ID 8) жолы іс жүзінде өзгермегені анықталды: косинустық ұқсастық 0,99999583, ал норманың өзгеруі небәрі +1,5×10⁻⁴% құрады. Бұл көрсеткіш 20 кездейсоқ токеннің орташа өзгеруінен де төмен.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-37uh3t0c\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; токенінің эмбеддингі іс жүзінде өзгерген жоқ, бұл оны оқыту арқылы «түзету» қажет деген гипотезаны жоққа шығарады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эмбеддингтер кестесін (32 768 × 2048) талдау 67,1 млн элементтің 97,7%-ы бит бойынша бірдей екенін көрсетті. Жаңартулардың «сиректігі» &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rv788pw9\"&gt;bf16&lt;/code&gt; сақтау форматымен байланысты. Adam оқыту қадамы (LR = 1×10⁻⁵) сақтау дәлдігі шегінен (ulp) кіші болғандықтан, егер өзгерістер өте кіші мәндер аймағына (үлестірім құйрығы) түспесе, олар жуықтау кезінде алынып тасталады. Демек, эмбеддингтер градиенттердің жоқтығынан емес, сақтау форматының дәлдік шектеулеріне байланысты өзгермеген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;bf16 (bfloat16) форматы 8 биттік мантиссаны пайдаланады, бұл оқыту кезінде салмақ өзгерістерін жазу дәлдігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Оң бақылаумен» (20–21-қабаттардағы назар проекциялары) салыстыру желінің басқаша оқығанын көрсетті. Эмбеддингтердегі максималды абсолютті ығысулар (5,98×10⁻³) назар қабаттарындағы өзгерістермен (3,40–4,31×10⁻³) салыстырмалы болғанымен, косинустық қашықтық және өзгерген элементтер үлесі (2,3%-ға қарсы 6–15%) бойынша назар қабаттары айтарлықтай көбірек өзгерген. Қорытынды: 1B моделіндегі мәселе токеннің дұрыс өкілдігінің жоқтығында емес, жасырын күйлерді осы өкілдікке бағыттайтын тиімді маршруттау саясатының жоқтығында еді. Түзету желіні қажетті контексттерде деректерді бар «дұрыс» векторға бағыттауға үйретті.&lt;/p&gt;\n&lt;h4 id=\"ablyaciya-taldauy-zhaene-embeddingter-dinamikasy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#ablyaciya-taldauy-zhaene-embeddingter-dinamikasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абляция талдауы және эмбеддингтер динамикасы&lt;/span&gt;&lt;/a&gt;Абляция талдауы және эмбеддингтер динамикасы&lt;/h4&gt;\n&lt;p&gt;Авторлар C рецептінде эмбеддингтерді жібіту (unfreezing) қажеттілігі туралы гипотезаны тексерді. Экспериментті мәжбүрлі түрде қатырумен қайта өткізудің орнына, зерттеушілер алдын ала оқытылған модель салмақтарын талдады. Анықталғандай, номиналды түрде «жібітілген» деп саналған эмбеддингтер іс жүзінде статикалық күйде қалған: 2202 қадамнан кейін кесте мәндерінің 97,7%-ы бит деңгейінде бірдей болып шықты. Фробениус нормасының салыстырмалы өзгеруі небәрі 4 × 10⁻⁷-ді құрады, ал әр қадамдағы жаңартулар салмақтар сақталатын дәлдіктен бір есе төмен болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;C рецептіндегі эмбеддингтер іс жүзінде жаңартылмаған, бұл олардың берілген параметрлер кезінде оқыту процесіндегі пассивті рөлін дәлелдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл бақылау «жібітілген» және «қатырылған» эмбеддингтердің бұл жағдайда бірдей эксперимент екендігі туралы болжамды растайды. Компонент өзгерістерге қатыспағандықтан, оның C рецептінің сәттілігіне қосқан үлесі жоққа шығарылады. Бұл эмбеддингтер ұсынылымының модель жұмысы үшін өте маңыздылығы туралы гипотезаға қарсы күшті дәлел болып табылады. Алайда, авторлар жалпылаудан сақтандырады: оқытудың жоғары қарқынында (learning rate) жаңартулар дөңгелектеу қателігінен шығып, fp32 оптимизатор күйінде жинақталуы мүмкін еді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/norma-frobeniusa.html\"&gt;Фробениус нормасы&lt;/a&gt; — бұл матрицаның «көлемін» өлшеу тәсілі, ол оқыту процесінде модель салмақтарының қаншалықты өзгергенін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер тек ағымдағы рецептпен шектелген; басқа баптауларда немесе ұзағырақ оқытуда эмбеддингтердің мінез-құлқы өзгеруі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhaene-ol-oeshirilgende\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#zhaene-ol-oeshirilgende\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Және ол өшірілгенде&lt;/span&gt;&lt;/a&gt;Және ол өшірілгенде&lt;/h4&gt;\n&lt;p&gt;Соңғы нүктелерді салыстырудың орнына, біз 600M (15 нүкте, 1K–154K қадамдар) және 1B (10 фаза-3 бақылау нүктелері және фаза-2 таңдамасы) модельдерінің оқу динамикасын бақыладық. Бағалау үшін &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mpz2jluy\"&gt;tool_sft_mini_v1.jsonl&lt;/code&gt; файлынан алты мысал қолданылды. Біз екі зондтау әдісін қолдандық: Plit (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nf6tv5ep\"&gt;&amp;lt;/assistant/&amp;gt;&lt;/code&gt;-тан кейін бірден &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1wx7cqpq\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; токенінің ықтималдығы) және &lt;a href=\"concepts/pskip.html\"&gt;Pskip&lt;/a&gt; (төрт бос орынға дейінгі таңбаларды өткізіп жібергеннен кейінгі сол токеннің ықтималдығы). 600M моделі жиі жаңа жол таңбасын қосатындықтан, бұл екі көрсеткіштің айырмашылығы маңызды. 6-кестеде 600M үшін деректер берілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M моделі контекстке қарамастан, құралдарды шақыруға бейім: тіпті құралдарды пайдалануға тыйым салынған мысалдарда да шақыру ықтималдығы жоғары болып қалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pskip — бұл модельдің құралды шақыру ықтималдығын бағалауға арналған метрика, ол зондтау дәлдігін бұзуы мүмкін кездейсоқ бос орындар мен жол ауыстыруларды ескермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M бойынша қорытындылар бір ғана тыйым салатын мысалға негізделген, бұл зерттеудің шектеуі болып табылады, алайда 15 бақылау нүктесіндегі нәтижелердің тұрақтылығы контекстік селективтіліктің жоқтығын растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;600M моделі 30K қадамға жеткенде Pskip &amp;gt; 0.999 қанығу деңгейіне жетті. Алайда, ол шақыруларды тоқтатуды үйренбеді: жүйе «құралды шақырма» деп нұсқау берген мысалда да модель барлық 15 бақылау нүктесінде шақыруды жүзеге асырды. Бұл 600M «шартсыз базалық жиілікті» қолданатынын, саналы таңдау жасамайтынын көрсетеді. 1B моделі (7-кесте) үшін жағдай басқаша: біз дағдының белсенді «өшірілу» процесін бақылаймыз. 2-фазаның 36K қадамында Pskip 0.432 болды, бірақ 2000 қадамнан кейін ол 3.0 × 10⁻³-ке дейін түсті, ал 48K қадамға жеткенде 5.9 × 10⁻⁷ минималды деңгейіне жетті және бұл деңгей фаза аяқталғанға дейін сақталды.&lt;/p&gt;\n&lt;h4 id=\"2-fazadaghy-ykhtimaldykh-basymdykhtyng-toemendeui\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#2-fazadaghy-ykhtimaldykh-basymdykhtyng-toemendeui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2-фазадағы ықтималдық басымдықтың төмендеуі&lt;/span&gt;&lt;/a&gt;2-фазадағы ықтималдық басымдықтың төмендеуі&lt;/h4&gt;\n&lt;p&gt;1B моделін оқыту барысында ықтималдық басымдықтың (probe) 12 000 қадам ішінде (шамамен 3,1 млрд токен) 5,9 ретке төмендеуі байқалады. Бұл процесс 2-фазаның бірінші блогында орын алады, мұнда деректер құрамы 90% ағылшын/испан тілдері мен Уикипедиядан, ал 5% кодтан тұрады. Авторлар 38K, 40K, 44K және 48K бақылау нүктелерін тексеріп, бұл құлдыраудың кездейсоқ емес, монотонды сипатта екенін растады. Генерация қабілеті (құралдарды шақыру) ықтималдық массасынан тезірек жоғалады: 38K қадамында модель триггер токенде 3 × 10⁻³ мәнін сақтағанымен, 5 талпыныстың 0-інде дұрыс шақыру жасайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Генерация қабілеті ықтималдық массасы таусылғанға дейін 10 000 қадам бұрын жоғалады, бұл зондтаумен қатар қатаң генерация тексеруін жүргізу қажеттілігін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;36K қадамындағы көрсеткіш жалпылау қабілетінің бұзылуы емес, 1-фазадан жаттап қалған деректердің «шайылып кетуі» болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"3-faza-uezilis-zhaene-khalpyna-kelmeu\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#3-faza-uezilis-zhaene-khalpyna-kelmeu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3-фаза: үзіліс және қалпына келмеу&lt;/span&gt;&lt;/a&gt;3-фаза: үзіліс және қалпына келмеу&lt;/h4&gt;\n&lt;p&gt;3-фазада &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7BP%7D_%7Bskip%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; динамикасы монотонды емес: көрсеткіш 4K қадамындағы 3,7 × 10⁻³ мәнінен 6K қадамында 1,4 × 10⁻² шыңына жетеді, содан кейін 10K қадамына дейін 24 есе төмендейді. Бұл «үзіліс» &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8qbydudv\"&gt;tool_sft&lt;/code&gt; үлесінің 0,20-дан 0,16-ға дейін азайтылуымен байланысты. 10K қадамынан кейін қоспа қалпына келтірілгенімен, модельдің құрылымдық басымдығы қалпына келмеді және 3-фазаны 8,8 × 10⁻⁵ деңгейінде аяқтады. Генерация мүлдем қайтып оралмады (0/5 сәтті шақыру).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/kontekstnaya-chuvstvitelnost.html\"&gt;Контексттік сезімталдық&lt;/a&gt; — модельдің қоршаған мәтінге қарап құралды қолдану немесе қолданбау керектігін ажырата алу қабілеті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"harness-pen-probe-arasyndaghy-dissociaciya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#harness-pen-probe-arasyndaghy-dissociaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Harness пен probe арасындағы диссоциация&lt;/span&gt;&lt;/a&gt;Harness пен probe арасындағы диссоциация&lt;/h4&gt;\n&lt;p&gt;Алты бақылау нүктесі B4 метрикасы мен зонд арасындағы қайшылықты көрсетеді. 14K қадамында B4 тарихи максимумға (0,085) жетсе, зонд өзінің ең төменгі мәнін (5,7 × 10⁻⁵) көрсетті. 2000 қадамнан кейін B4 минимумына түсті, ал зонд 4,6 есе өсті. Бұл B4 метрикасының модельдің құралдарды қолдану қабілетін дұрыс өлшемейтінін білдіреді, өйткені ол модель іс жүзінде дұрыс шақыру жасай алмайтын жағдайда да жоғары баға бере алады.&lt;/p&gt;\n&lt;h4 id=\"aldyn-ala-tirkelgen-gipoteza-bojynsha-khorytyndy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#aldyn-ala-tirkelgen-gipoteza-bojynsha-khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алдын ала тіркелген гипотеза бойынша қорытынды&lt;/span&gt;&lt;/a&gt;Алдын ала тіркелген гипотеза бойынша қорытынды&lt;/h4&gt;\n&lt;p&gt;1B моделінің құрылымдық перплексиясы 2-фаза (веб-деректер негізінде оқыту) барысында тоқырауға ұшырайтыны немесе нашарлайтыны және 3-фазада қалпына келмейтіні туралы алдын ала гипотеза толығымен расталды. 2-фазаның әсері күтілгеннен де күштірек болды: тоқыраудың орнына, ең көп прозалық блоктарда бұрыннан бар білімдер алты ретке дейін жойылды. 3-фаза ештеңені қалпына келтірмеді: байқалған ерте өсу қабілеттердің дамуы емес, базалық ықтималдықтың нәтижесі болып табылады. Оқу бағдарламасы аясындағы жалғыз айқын өзгеріс тиімділіктің төмендеуіне бағытталған. Нәтижесінде, тіпті құралдарды пайдалану бойынша ең жақсы көрсеткіші бар кезеңде де, априорлық ықтималдық 3-фазадағы ең жоғары шыңынан екі рет төмен күйінде қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гипотеза расталды: 2-фазадағы оқыту априорлық білімдердің 6 ретке деградациясына әкелді, ал 3-фаза бұл регрессті өтей алмады, көрсеткіштер ең жоғары мәндерден төмен күйінде қалды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;600M моделіне келетін болсақ, SFT деректері жинақталған сайын P(&amp;lt;/tool_call/&amp;gt;) құрал шақыру ықтималдығының өсуі туралы гипотеза тек соңғы нүктеде ғана ресми түрде расталды. Талдау көрсеткендей, өсу бірінші мұрағатталған бақылау нүктесіне дейін орын алған, сондықтан біз жаңа қабілеттердің пайда болуын емес, қанығу эффектісін бақылап отырмыз.&lt;/p&gt;\n&lt;p&gt;Оқыту динамикасы бойынша деректер 1-кестеде келтірілген. B4 бағаны 3-фазаның бақылау нүктелерінің көрсеткіштерін көрсетеді. Бұл кестедегі B4 мәндері бағалау әдістеріндегі (&lt;a href=\"concepts/harness.html\"&gt;harness&lt;/a&gt;) айырмашылықтарға байланысты 3-кестедегі мәндерден шамамен 8 есе ерекшеленеді. Біз бұл деректерді тек серия ішіндегі ішкі салыстыру үшін қолданамыз, сапаның абсолютті көрсеткіші ретінде емес.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/perpleksiya.html\"&gt;Перплексия&lt;/a&gt; — модельдің келесі токенді қаншалықты дәл болжай алатынын бағалайтын метрика; мән неғұрлым төмен болса, модель өз болжамдарында соғұрлым «сенімді» болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhanga-nysandar-men-registrler-zhaghdajynda-zhalpylau\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#zhanga-nysandar-men-registrler-zhaghdajynda-zhalpylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жаңа нысандар мен регистрлер жағдайында жалпылау&lt;/span&gt;&lt;/a&gt;Жаңа нысандар мен регистрлер жағдайында жалпылау&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде шағын таңдамалардағы (n=6 және n=8) алдын ала бағалауларды алмастыратын ауқымды тестілеу нәтижелері берілген. Зерттеу үш бақылау нүктесінде жүргізілді: 600M моделі (154K қадам), түзетуге дейінгі 1B моделі және түзетілгеннен кейінгі 1B моделі (§6.5 сәйкес). Соңғы екеуі «ата-ана» жұбын құрайды, бұл жұпталған статистикалық тестті қолдануға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Түзетілген 1B моделі оқу деректерін жоғары дәлдікпен қайталайды (0.988), сонымен қатар жаңа нысандарда білімді сәтті жалпылайды және деректерді алу тапсырмаларында 600M моделінен басым түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Корпустың 269 дубликаттан тазартылған жолдарында 3-деңгейлі диагностиканы қайталау кезінде 600M моделі 0.926 жағдайда дұрыс шақыруды қалыптастырады, түзетуге дейінгі 1B моделі — 0.100, ал түзетілген 1B — 0.959 жағдайда. Түзетілген 1B моделі оқу деректерін сөзбе-сөз қайталауға бейім (0.988), ал 600M контекстік тұрғыдан орынды, бірақ жаңа аргументтерді жасайды. Жалпылау қабілетін бағалау үшін корпуста жоқ нысандармен (жаңа IP-мекенжайлар, CVE-2025-* идентификаторлары, кездейсоқ хештер, ойдан шығарылған домендер) 238 промпт жиынтығы жасалды. Бағалау бес өлшем бойынша жүргізілді: шақыру туралы шешім, синтаксистік дұрыстық, құралды таңдау, аргументтер құрылымы және нысанның сәйкестігі (8-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Макнемар тесттері бірдей деректерде екі модельді салыстыру үшін қолданылады, бұл қай модельдің нақты тапсырмаларды жақсырақ орындайтынын анықтауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;8-кестеге сәйкес, түзетілген 1B моделі тесттердің 0.536 бөлігін, ал 600M 0.428 бөлігін сәтті аяқтайды (p=0.0039). 600M құралдарды таңдауда (0.776 қарсы 0.717) және аргументтерді құрылымдауда (0.855 қарсы 0.819) жақсырақ болғанымен, түзетілген 1B бұрын көрілмеген нысандарды алуда айтарлықтай тиімдірек (0.667 қарсы 0.560).&lt;/p&gt;\n&lt;h4 id=\"takhyryptardy-taldau-zhaene-modelderding-turakhtylyghy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#takhyryptardy-taldau-zhaene-modelderding-turakhtylyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптарды талдау және модельдердің тұрақтылығы&lt;/span&gt;&lt;/a&gt;Тақырыптарды талдау және модельдердің тұрақтылығы&lt;/h4&gt;\n&lt;p&gt;VectraYX-600M және түзетілген 1B (repaired 1B) модельдерінің сұраныс түріне қарай құралдарды шақыру қабілеті сыналды. 9-кестеде шаблон топтары бойынша нәтижелер берілген. Жалпы дәлдік көрсеткіштері жақын: nvd_get_cve үшін екі модель де жоғары нәтиже көрсетеді, ал nvd_search үшін ең төменгі деңгейде. Түзетілген 1B моделі bash_exec және terse_control тапсырмаларында 600M-нен екі есе жоғары нәтиже береді. Алайда, таңдама көлемінің аздығына (n ≈ 28) байланысты бұл айырмашылықтардың сенімділік аралықтары кең, сондықтан бір модель екіншісінен тұрақты түрде басым деп айтуға болмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Түзетілген 1B моделі таңдауда дәлірек: пәрменді таңдауда қателік болған жағдайда, ол 48,4% жағдайда дұрыс пәрменді таңдайды, ал 600M моделі 76,7% «&lt;a href=\"concepts/soft-miss.html\"&gt;жұмсақ қателік»&lt;/a&gt; (soft miss) көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;nvd_search бойынша талдау модельдердің сұраныс кілтін бөліп алатынын, бірақ көп сөзді іздеу терминдерін жоғалтатынын көрсетеді (мысалы, GitLab CVE сұранысында тек «GitLab» шығады). Қатаң салыстыруда бұл қате болып саналады, бірақ критерийлер жұмсартылғанда (ішінара сәйкестік) дәлдік 600M үшін 0,321-ге, ал 1B үшін 0,357-ге дейін көтеріледі. Бұл модельдердің зат есімдерді бөліп алуға қабілетті екенін, бірақ еркін мәтіндік фрагменттерді толық алуда қиналатынын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Жұмсақ қателік» (soft miss) — бұл модель құралды шақыру қажеттілігін дұрыс анықтағанымен, пәрмен параметрлерінде немесе синтаксисінде қате жіберген жағдай.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Регистрдің (стильдің) әсерін зерттеу 600M моделінің стильге өте сезімтал екенін көрсетті: сөйлесу стилінен техникалық стильге (terse_control) ауысқанда дәлдік 0,505-тен 0,200-ге дейін төмендейді. Түзетілген 1B болса тұрақты күйде қалады (0,532 → 0,500). Тіл факторына келетін болсақ, ағылшын тілінің испан тілінен басымдығы (600M үшін 0,957-ге қарсы 0,580) деректер жиынтығы құрылымындағы теңгерімсіздіктің нәтижесі болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бастапқы 1B моделінің «басу» (suppression) көрсеткіштері жалған: модель құралдарды іс жүзінде шақырмаған, бұл шақыру болмаған ось бойынша жоғары балл бергенімен, іс жүзінде функцияның жұмыс істемейтінін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"okhytu-receptining-ablyaciyasy-korpus-pen-okhytu-zhyldamdyghynyng-faktorlykh-taldauy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#okhytu-receptining-ablyaciyasy-korpus-pen-okhytu-zhyldamdyghynyng-faktorlykh-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оқыту рецептінің абляциясы: корпус пен оқыту жылдамдығының факторлық талдауы&lt;/span&gt;&lt;/a&gt;Оқыту рецептінің абляциясы: корпус пен оқыту жылдамдығының факторлық талдауы&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде авторлар «C рецептінің» екі негізгі компонентін — оқу корпусының әртүрлілігі мен оқыту жылдамдығын (LR) бөліп көрсетеді, бұрын тексерілген «жылы» іске қосу мен эмбеддингтер кестесін алып тастайды. Тәжірибе 32 өлшемді батч пен 2202 қадамнан тұратын бес жүгіруді қамтиды. Факторлардың араласып кетпеуі үшін қадамдар шегі қатаң белгіленген, бұл тар және әртүрлі корпустар үшін оптимизатор итерацияларын теңестіреді. Тар корпус 12 801 мысалдан (tool-SFT және 10 мың кибер-пайымдау мысалдары), ал әртүрлі корпус қосымша 23 502 OpenAssistant мысалынан тұрады. Екі LR мәні қолданылады: жоғары (1 × 10⁻⁵) және төмен (2 × 10⁻⁶).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Факторлық талдау 2202 қадамда барлық модельдер LR немесе деректер құрамындағы өзгерістерге қарамастан, оқу корпусын толығымен жаттап алуға жақындайтынын көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Техникалық іске асыру негізгі C рецептінен ерекшеленеді: жабдық шектеулеріне байланысты (bf16 қолдамайтын Turing T4) оқыту fp32 мастер-салмақтары, 8-биттік AdamW және градиенттік чекпоинтингпен fp16 форматында жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/8-bitnyy-optimizator.html\"&gt;8-биттік оптимизатор&lt;/a&gt; — жадты үнемдеуге мүмкіндік беретін, бірақ толық bf16 форматымен салыстырғанда есептеу дәлдігіне әсер етуі мүмкін оптимизатор күйін сығу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл бөлімнің нәтижелерін мақаланың негізгі деректерімен тікелей салыстыруға болмайды, себебі есептеу дәлдігі (mantissa) мен оқыту режимінде айырмашылықтар бар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сөзбе-сөз қайталау хаттамасында (n=269) барлық бес модель «төбеге» (1.000) жақын нәтижелерді көрсетті, бұл белгіленген оқыту көлемінде модельдердің деректерді жаттауға жақындағанын растайды. Жалпылау қабілетін бағалау үшін 238 промпт жиынтығы қолданылады, мұнда салыстыру McNemar тесті мен жұпталған &lt;a href=\"concepts/butstrep.html\"&gt;бутстреп&lt;/a&gt; арқылы жүзеге асырылады.&lt;/p&gt;\n&lt;h4 id=\"faktorlykh-taldau-naetizheleri\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#faktorlykh-taldau-naetizheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Факторлық талдау нәтижелері&lt;/span&gt;&lt;/a&gt;Факторлық талдау нәтижелері&lt;/h4&gt;\n&lt;p&gt;Зерттеу алты негізгі көрсеткіш бойынша 36 статистикалық салыстыруды қамтыды (10-кесте). Жалған оң нәтижелерді бақылау үшін q=0,05 деңгейінде Бенджамини–Хохберг түзетуі қолданылды. Барлық тесттердің ішінен тек төртеуі ғана маңызды деп табылды: оқытудың төмен жылдамдығында (LR) корпус құрамының басу (suppression), артық іске қосылу (over-triggering) және құралдардың дұрыстығына (tool correctness) әсері, сондай-ақ тар корпустағы құралдардың дұрыстығына корпустың әсері. Әртүрлі кездейсоқ бастапқы сандарды (seeds) пайдаланып жүргізілген салыстыру агрегацияланған көрсеткіштердің айтарлықтай өзгермелілікті жасыра алатынын көрсетті: «әртүрлі» корпус пен жоғары LR-і бар екі модель бірдей орташа нәтижеге (0,6024) ие болғанымен, 6 жеке тапсырма бойынша айырмашылықтар болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Негізгі қорытынды: оқытудың жоғары жылдамдығында корпус құрамы нәтижеге әсер етпейді, ал «әртүрлі» корпустың басу кезіндегі болжамды артықшылығы қайта іске қосу кезінде расталмады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"korpus-pen-okhytu-zhyldamdyghynyng-aeseri\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#korpus-pen-okhytu-zhyldamdyghynyng-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Корпус пен оқыту жылдамдығының әсері&lt;/span&gt;&lt;/a&gt;Корпус пен оқыту жылдамдығының әсері&lt;/h4&gt;\n&lt;p&gt;Төмен LR (2×10⁻⁶) кезінде тар корпустан әртүрлі корпусқа ауысу көрсеткіштерді айтарлықтай жақсартады: басу 0,375-тен 0,583-ке дейін (p=6×10⁻⁵) өседі, ал артық іске қосылу 0,625-тен 0,403-ке дейін (p=3×10⁻⁵) төмендейді. Құралдардың дұрыстығы да өседі (0,685 → 0,759, p=0,004). Алайда, жоғары LR (1×10⁻⁵) кезінде корпустар арасындағы айырмашылықтар жоғалады: барлық осьтер бойынша көрсеткіштер статистикалық тұрғыдан ажыратылмайды (p &amp;gt; 0,42). Тар корпуста LR-ді арттыру құралдардың дұрыстығын айтарлықтай жақсартады (+0,098, p=4×10⁻⁴), ал әртүрлі корпуста LR әсері тұрақсыз және бастапқы санға байланысты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс: «Факторлық талдау» мұнда қорытынды дәлдікке тәуелсіз және бірлескен әсерді бағалау үшін екі айнымалыны (корпус және оқыту жылдамдығы) жүйелі түрде өзгертуді білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khajtalanu-muemkindigin-tekseru\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#khajtalanu-muemkindigin-tekseru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайталану мүмкіндігін тексеру&lt;/span&gt;&lt;/a&gt;Қайталану мүмкіндігін тексеру&lt;/h4&gt;\n&lt;p&gt;Ішінара репликация (оқытудың 40%-ында, 880-қадам) бір ұяшық ішіндегі (тар корпус/төмен LR) әртүрлі seed-пен іске қосулар арасындағы өзгермелілік корпус ауысуының әсеріне тең екенін көрсетті. Атап айтқанда, тар корпус үшін екінші seed әртүрлі корпуспен бірдей басу көрсеткіштерін көрсетті, бұл басудағы «әртүрліліктің» артықшылығы туралы гипотезаны жоққа шығарады. Соған қарамастан, әртүрлі корпустың құралдардың дұрыстығындағы артықшылығы тар корпустың екі seed-імен салыстырғанда расталды. Нәтижесінде, тар корпус пен төмен LR-і бар модель ең әлсізі болып шықты, бірақ бұл сәтсіздік емес, бұл әртүрлі корпус пен жоғары LR конфигурациясының оңтайлы таңдау екенін растайды.&lt;/p&gt;\n&lt;h4 id=\"600m-modelin-sft-men-baptau-zhaene-distillyaciyany-tekseru\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#600m-modelin-sft-men-baptau-zhaene-distillyaciyany-tekseru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;600M моделін SFT-мен баптау және дистилляцияны тексеру&lt;/span&gt;&lt;/a&gt;600M моделін SFT-мен баптау және дистилляцияны тексеру&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер 600 миллион параметрлі (600M) модель үшін арнайы SFT (Supervised Fine-Tuning) процесі құралдарды шақыру қажеттілігін анықтауға көмектесе ме, әлде үлкенірек модельден (GLM-5.3) алынған дистилденген деректер тиімділікті арттыра ма, деген сұрақтарды зерттеді. Тәжірибе 154K бақылау нүктесінде, 1200 қадам, 1.5 × 10⁻⁵ оқыту жылдамдығы, 2048 токен ұзындығы және 32 тиімді батч көлемімен бір L4 GPU-да өткізілді. Негізгі модель 17 801 жазбада, ал дистилденген нұсқасы қосымша 4443 NVD CVE және Sigma ережелеріне негізделген жазбаларда оқытылды. Бағалау 238 промпт жиынтығында жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дистилденген деректерді қосу статистикалық тұрғыдан маңызды әсер етпеді: топтар арасындағы айырмашылық [-0.036, +0.036] сенім аралығымен 0,00-ді құрады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кесте нәтижелері көрсеткендей, SFT-дің екі нұсқасы да сәтті шақырулар үлесін (0,548-ге қарсы 0,428) және нысандарды алу дәлдігін (0,71-ге қарсы 0,56) арттырды. Алайда, SFT модельді қашан шақыру жасауға болмайтынын үйретпеді. Бастапқы 600M моделі шақырусыз жағдайлардың 35,4 пайызында дұрыс тоқтап қалса, SFT-ден кейін бұл көрсеткіш нөлге жуықтады. Модель шақыру талап етілмейтін 72 жағдайдың 70-інде құралды шақырды. Бұл әрбір жауап шақыруды қамтитын корпуста оқыту модельді артық белсенділікке итермелейтінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бағалау деректердің аз көлемімен және бір кездейсоқ тұқым (seed) арқылы жүргізілді, бұл кішігірім әсерлерді анықтауды қиындатады, бірақ дистилляцияның үлкен оң әсері жоқ екенін растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"intervenciya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#intervenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интервенция&lt;/span&gt;&lt;/a&gt;Интервенция&lt;/h4&gt;\n&lt;p&gt;Зерттеу нәтижелері төрт негізгі сценарийді қамтиды: (a) 600 млн параметрлі модель, кодтың небәрі 0,1%-ында оқытылса да, құралдарды шақыру үшін дұрыс JSON пішімін генерациялай алады; (b) 1,1 млрд параметрлі, веб-деректерге негізделген және 6 млрд токенді SFT (мұғаліммен оқыту) кезеңінен өткен модель араласусыз бұл қабілетті көрсетпейді; (c) диагностикаға негізделген қайта оқыту әдісі 1,1 млрд параметрлі модельге бір GPU көмегімен 2202 қадамда құралдармен жұмыс істеуді үйретеді; (d) факторлық талдау барлық оқыту конфигурациялары шақыру пішімін орнататынын, олар тек қажетсіз шығысты басу қабілетімен ғана ерекшеленетінін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оқыту деректерінің құрамы модельдің «қораптан шыққан» күйінде құрылымдық шығыспен жұмыс істейтінін немесе күрделі инженерлік түзетуді талап ететінін анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тек кодқа бағытталған деректер ғана құрылымдық шығысқа кепілдік береді деген бастапқы гипотеза (c) нәтижесімен жоққа шығарылды. Енді біз мәселе принципті мүмкіндікте емес, дағдыны белсендіру күрделілігінде деп есептейміз. SFT токендерінің көлемі табысты болжамайды: табысты (c) әдісінен 1000 есе көп ресурс жұмсаған мамандандырылған (b) кезеңі күтілген нәтижені бермеді. (c) әдісінің табысы деректер көлемінде емес, олардың құрылымында: кең ауқымды қоспаларға қарағанда диалогтық пішімдердің басымдығында.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — модельді нақты міндеттерге бейімдеу үшін «сұрақ-жауап» үлгілері негізінде қайта оқыту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Факторлық талдау (d) жоғары оқыту қарқынында (learning rate) контекст әртүрлілігі (сұхбат, логика, құралдар) міндетті емес екенін көрсетті. Төмен қарқында әртүрлі деректер қателерді жақсырақ басты, бірақ бірдей параметрлермен өткізілген іске қосулар арасындағы айырмашылық әртүрлі деректер түрлері арасындағы айырмашылықпен салыстырмалы болды, бұл әртүрліліктің әсері туралы сұрақты ашық қалдырады.&lt;/p&gt;\n&lt;h4 id=\"nege-kodkha-baj-aldyn-ala-okhytu-aedepki-kuejdi-ornatady\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#nege-kodkha-baj-aldyn-ala-okhytu-aedepki-kuejdi-ornatady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Неге кодқа бай алдын ала оқыту әдепкі күйді орнатады?&lt;/span&gt;&lt;/a&gt;Неге кодқа бай алдын ала оқыту әдепкі күйді орнатады?&lt;/h4&gt;\n&lt;p&gt;Механистикалық талдау кодта оқытылған модельдердің артықшылығы үш фактормен түсіндірілетінін көрсетеді. Біріншіден, токендер жиілігі: кодта форматтау белгілері (фигуралық жақшалар, тырнақшалар, қос нүкте) үнемі кездеседі, ал қарапайым мәтінде олар сирек. Код үлесі 65% болатын модель бұл токендерге жоғары базалық ықтималдық береді, ал «прозалық» модель оларды генерациялау кезінде үлкен логарифмдік ықтималдық тапшылығына тап болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кодта оқыту ықтималдықтың «базалық мөлшерлемесін» жасайды: модель құрылымдық элементтерді (JSON, YAML) кез келген мәтіннің табиғи жалғасы деп санайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екіншіден, код модельді қатаң синтаксистік шектеулерге үйретеді. Қарапайым мәтіннен айырмашылығы, код жақшалардың тепе-теңдігін және тырнақшалардың жұптығын талап етеді. Оқу жиынтығындағы миллиардтаған мысалдар бұл ережелерді бекітеді, бұл модельге жаңа контексттерде де құрылымдық деректерді сәтті генерациялауға мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Үшіншіден, мәселе жасырын күйлерді бағыттауда (routing). Эмбеддингтерді талдау (§6.6) 1B моделіндегі &amp;lt;/tool_call/&amp;gt; векторы дұрыс болғанын, бірақ модель жасырын күйлерді оған бағыттай алмағанын көрсетеді. Түзету (қайта оқыту) қажет болғанда іске қосылатын маршруттау механизмін жасады. Жаңа промпттар бойынша тесттерде түзетілген 1B моделі 166 жағдайдың 71,7%-ында дұрыс құралды таңдайды және 66,7%-ында аргументтерді бөліп алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M моделі толыққанды маршруттау механизміне ие емес: ол жай ғана функция шақыруларын «артық өндіреді», өйткені оларды кез келген диалогтың ықтимал жалғасы деп санайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Функция шақыруы жоқ 72 промпт бойынша талдау (§6.8) 600M моделі бейтарап тақырыптарда 64,6% жағдайда, ал сұрақта жай ғана техникалық термин (мысалы, CVE) аталса, 91,3% жағдайда қате шақыруды бастайтынын растады. 600M моделі үшін арнайы SFT (қайта оқыту) (§6.10) шақыруларды өшіру үшін «&lt;a href=\"concepts/gate.html\"&gt;қақпа»&lt;/a&gt; (gate) жасамайды, тек шақырулардың дәлдігін арттырады, сонымен бірге бейтарап сұрауларға жауаптарды толығымен басады.&lt;/p&gt;\n&lt;h4 id=\"1b-modeli-ueshin-f1-zhaene-f2-koersetkishterin-uejlestiru\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#1b-modeli-ueshin-f1-zhaene-f2-koersetkishterin-uejlestiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1B моделі үшін F1 және F2 көрсеткіштерін үйлестіру&lt;/span&gt;&lt;/a&gt;1B моделі үшін F1 және F2 көрсеткіштерін үйлестіру&lt;/h4&gt;\n&lt;p&gt;§6.7 және §6.8 нәтижелері арасындағы қайшылық өлшенетін шамалардың айырмашылығымен түсіндіріледі. F1 метрикасы (no-call және call ықтималдықтарының қатынасы) салыстырмалы болып табылады және үлестірім ішінде бағаланады: ықтималдықтар нөлге жақын болғанда, модель 10³–10⁴ қатынасын көрсетеді, бұл генерация процесін емес, контекст архитектурасын сипаттайды. F2 метрикасы (артық іске қосылу жиілігі) абсолютті болып табылады және үлестірімнен тыс бағаланады: ол құралдарды шақыруды үйренген модельдің жаңа, бұрын көрмеген деректерде қаншалықты қателесетінін көрсетеді. Түзетілген 1B моделі дұрыс бапталған «қақпа» (gate) механизміне ие, бірақ оның қамту аясы шектеулі: ол жаңа деректер пішіндеріне ауыспайды. Соған қарамастан, 1B қате шақыруларды басуда 600M-нен басым түседі (таза prompt-тар үшін 0,604-ке қарсы 0,354 және near-miss үшін 0,174-ке қарсы 0,087), бұл 1B-де маршруттау механизмі ішінара болса да жұмыс істейтінін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Түзетілген 1B моделі «қақпа» құрылымына ие, бірақ жаңа деректер үшін жеткілікті қамтуы жоқ, соған қарамастан ол 600M-нен дәлірек жұмыс істейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Қақпа» (gate) — бұл модель архитектурасындағы механизм, ол пайдаланушы сұранысына жауап ретінде сыртқы құралды шақыру керек пе, жоқ па, соны анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sft-bajlanystyru-zhaene-khuru\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#sft-bajlanystyru-zhaene-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SFT: байланыстыру және құру&lt;/span&gt;&lt;/a&gt;SFT: байланыстыру және құру&lt;/h4&gt;\n&lt;p&gt;600M және 1B модельдері арасындағы оқыту шығындарының айырмашылығы іргелі болып табылады. 600M үшін SFT (Supervised Fine-Tuning) процесі қолда бар базалық қабілетті (кілт-мәні пішімінде шығару) триггер токенмен «байланыстырудан» тұрды, бұл шамамен 10⁷ токенді талап етті. 1B үшін алдын ала оқытуда болмаған маршруттау механизмін «құру» керек болды. Бұған тек көмекші режимдегі әртүрлі контексттер мен жоғары оқыту жылдамдығын (LR) пайдаланып, 10⁷ токен жұмсау арқылы қол жеткізілді. Негізгі шығын токендер санында емес, диагностикада: қатені дәл локализацияламай тұрып, 1B моделін қабілетсіз деп санауға болатын еді.&lt;/p&gt;\n&lt;h4 id=\"registrdi-zhalpylau\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#registrdi-zhalpylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Регистрді жалпылау&lt;/span&gt;&lt;/a&gt;Регистрді жалпылау&lt;/h4&gt;\n&lt;p&gt;Нәтижелер синтаксистік регистрдің (жақша ішіндегі құрылымдалған шығыс және еркін мәтін) модельдің мінез-құлқында басым болатынын растайды. Кейінгі баптаулар тек қате түріне бағытталған болса ғана бұл мінез-құлықты өзгерте алады. Кіші модельдер үшін практикалық ереже: не оқу жиынтығын қажетті стильде қалыптастыру, не осы мақалада сипатталған диагностика және түзету циклі үшін бюджет бөлу керек.&lt;/p&gt;\n&lt;h4 id=\"taezhiribelik-usynymdar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#taezhiribelik-usynymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тәжірибелік ұсынымдар&lt;/span&gt;&lt;/a&gt;Тәжірибелік ұсынымдар&lt;/h4&gt;\n&lt;p&gt;Бюджеті шектеулі жағдайда 1 млрд параметрден аз модельдерді әзірлейтін командалар үшін мынадай қадамдар ұсынылады: (i) код пен құрылымдалған мәтін үлесін тек бенчмарк көрсеткіші емес, архитектураның іргелі параметрі ретінде қарастыру; (ii) оқыту кезінде P(&amp;lt;/tool_call/&amp;gt;) бірінші токенінің ықтималдығын телеметрия ретінде тіркеу. Бұл ресурсты аз қажет етеді, бірақ 38К қадам (шамамен 40 млрд токен) кезеңінде ақауды ерте анықтауға мүмкіндік береді. Литералды және бос орындардан тазартылған нұсқаларды тіркеу маңызды, өйткені олардың мәндері 13 ретке дейін өзгешеленуі мүмкін; (iii) құралдарды пайдалану бенчмарктары үшін қатаң құрылымдық тексеруді енгізу, себебі қарапайым кілт сөздер жиі қате нәтиже береді; (iv) SFT (оқыту) сәтсіз болғанда, қабілетке жету мүмкін емес деп қорытынды жасамау керек: A және C рецепттері 6 млрд токендегі сәтсіздіктің 107 млрд токендегі сәттілікпен қатар жүруі мүмкін екенін көрсетті; (v) оқу корпусындағы бағалауды жаңа промпттармен жалпылау тесттерімен толықтыру, бұл жаттап алу мен шынайы үйренуді ажыратуға көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қатаң құрылымдық тексерулер мен бірінші токен ықтималдығын мониторингтеу оқыту процесіндегі критикалық қателерді ерте анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;(iii) тармағы мақала үстінде жұмыс істеу барысында расталды. L5 бақылау нүктесін тексеру кезінде ресми бағалау құралы 0/8 нәтиже көрсетті, ал қатаң диагностика 8/8 нәтиже берді. Себебі токенизатор кітапханасы арнайы токендерді автоматты түрде өшіріп тастаған еді. Декодтау логикасын бір жолмен түзету нәтижені 8/8-ге қалпына келтірді. Дәл осындай қателер GGUF-экспортер мен агенттер циклдарында да анықталды. Бұл қателер модельдің қабілетсіздігі туралы қате тұжырымдарға алып келді. Біз мұны өз тезисіміздің растауы ретінде келтіреміз: бағалау құралдарындағы жасырын қателер модельдегі мәселелер ретінде көрінуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"usynylatyn-kelesi-eksperimentter\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#usynylatyn-kelesi-eksperimentter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұсынылатын келесі эксперименттер&lt;/span&gt;&lt;/a&gt;Ұсынылатын келесі эксперименттер&lt;/h4&gt;\n&lt;p&gt;Эксперименттер құнына қарай реттелген: F1 және F2 тек CPU талап етеді, F3 бір шағын GPU, ал F4 алдын ала оқыту үшін үлкен есептеу қуаттарын қажет етеді.&lt;/p&gt;\n&lt;h4 id=\"f1-arhivtelgen-chekpointtardaghy-traektoriyalykh-zondtar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f1-arhivtelgen-chekpointtardaghy-traektoriyalykh-zondtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F1: Архивтелген чекпоинттардағы траекториялық зондтар&lt;/span&gt;&lt;/a&gt;F1: Архивтелген чекпоинттардағы траекториялық зондтар&lt;/h4&gt;\n&lt;p&gt;Біз 600M моделіндегі P(&amp;lt;/tool_call/&amp;gt;) ықтималдығы SFT деректерінің жинақталуымен артады, ал 1B моделінде екінші фазада тоқтап қалады немесе нашарлайды деген болжамды тексердік. 15 600M және 23 1B чекпоинттарын талдау 1B-нің екінші фазасы бұрынғы дағдыларды жойып жібергенін растады. 600M моделі алғашқы чекпоинттың өзінде-ақ қанығуға жетті. 600M-нің әдепкі мінез-құлқы гейт емес, шартсыз базалық мөлшерлеме екені, ал 1B-нің үшінші фазасында зонд пен B4 қарама-қарсы бағытта қозғалатыны анықталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1B моделінің екінші оқыту фазасы дағдыны қалыптастырмады, керісінше, бар дағдыны жойды, ал 600M ерте кезеңде-ақ шегіне жетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"f2-masshtabtau-diagnostikasy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f2-masshtabtau-diagnostikasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F2: Масштабтау диагностикасы&lt;/span&gt;&lt;/a&gt;F2: Масштабтау диагностикасы&lt;/h4&gt;\n&lt;p&gt;Біз қайталау тесттерін n=6-дан толық корпусқа дейін, ал жалпылау тесттерін n=8-ден жүздеген промптқа дейін кеңейттік. Жиынтық таңдама n=269 (сөзбе-сөз) және n=238 (тест батареясы) болды. Түзетілген 1B моделі жаңа нысандар бойынша 600M-нен асып түсті (p=0.0039), бірақ 600M форматқа сезімтал болып шықты және өз корпусының стилінде 30 пункт жоғалтты. Екі модель де «near-miss» промпттарда шақыруларды баса алмады (0.087 және 0.174).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/near-miss-prompty.html\"&gt;Near-miss» промпттар&lt;/a&gt; — бұл мақсатты сұраныстарға өте жақын, бірақ кішігірім ауытқулары бар, модельдің қателерге төзімділігін тексеретін сұраныстар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"f3-tuezetu-receptin-ablyaciyalau\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f3-tuezetu-receptin-ablyaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F3: Түзету рецептін абляциялау&lt;/span&gt;&lt;/a&gt;F3: Түзету рецептін абляциялау&lt;/h4&gt;\n&lt;p&gt;Корреляциядан себеп-салдарлық байланысқа өту үшін біз 2×2 факторлы тәжірибе өткіздік (корпус: тар/әртүрлі × LR: 2×10⁻⁶/1×10⁻⁵), 4 тармақты 2202 қадам бойы іске қостық. F2 тесттер жиынтығы қолданылды. Жоғары LR кезінде корпус әртүрлілігі айтарлықтай әсер етпейтіні, ал төмен LR кезінде әртүрлі корпус құралдарды шақыру дәлдігі бойынша тар корпустан басым екені анықталды. T4 үдеткіштері (bf16 орнына fp16) салдарынан нәтижелерді сақтықпен түсіндіру керек, өйткені әртүрлі сидтермен (seeds) іске қосудағы өзгергіштік өлшенетін эффектілермен салыстырмалы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жабдық шектеулері (T4, fp16) және кездейсоқ бастапқы мәндерге (seed) жоғары сезімталдық салдарынан қорытындылардың бір бөлігі қатаң дәлел емес, бақылау сипатында.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"f4-bekitilgen-masshtabtaghy-kompoziciya-ablyaciyasy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f4-bekitilgen-masshtabtaghy-kompoziciya-ablyaciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F4: Бекітілген масштабтағы композиция абляциясы&lt;/span&gt;&lt;/a&gt;F4: Бекітілген масштабтағы композиция абляциясы&lt;/h4&gt;\n&lt;p&gt;Код үлесі әртүрлі (10%, 35%, 65%) 2–3 шағын модельді (130–260M) оқыту ұсынылады. F1 зондтары мен F2 диагностикасы арқылы код үлесі мен құралдарды шақыру арасындағы себеп-салдарлық байланысты анықтау көзделген.&lt;/p&gt;\n&lt;h4 id=\"shekteuler\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста біз зерттеу шектеулерін ашық жариялаймыз, өйткені олардың кейбіреулері біз жасағаннан гөрі күштірек мәлімдемелер үшін кедергі болуы мүмкін еді.&lt;/p&gt;\n&lt;p&gt;L1: 600M моделі жоспарланған кестенің 64%-ында тоқтатылды. Оқыту 240 000 қадамның 154 000-ында (шамамен 15,7 млрд токеннің 10 млрд-ы) тоқтады және оны қалпына келтіру мүмкін емес, өйткені бұлтты инфрақұрылым жойылды. Модель косинустық жұмсарту (cosine anneal) фазасынан өтпеді және жоғары learning rate деңгейінде тоқтады, бұл оның сапасын төмендетеді. 600M үшін барлық көрсеткіштер аяқталмаған артефактіні көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M моделі «мұздатылған» және толық оқытылмаған күйде, бұл консервативті ығысуды тудырады: тіпті осы күйде де ол эмердженттік қасиеттерді көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;L2: Модель диалог жүргізу қабілетіне ие емес. Nano және Base нұсқаларынан айырмашылығы, 600M SFT (Supervised Fine-Tuning) кезеңінен өтпеген. Ол тікелей сұрақтарға (мысалы, Перу астанасы немесе қарапайым есептеулер туралы) жауап бермейді, дегенмен испан тілінде еркін сөйлей алады. Біз толыққанды көмекші жасауды талап етпейміз; біздің тұжырымдарымыз тек құрылымдық құрал шақыруларын (tool-call) генерациялауға қатысты.&lt;/p&gt;\n&lt;p&gt;L3: Модельдерді салыстыру қатаң бақыланатын эксперимент емес. Параметрлер саны (1,68 есе), деректер көлемі (10 млрд және 65 млрд токен) және оқыту архитектурасындағы айырмашылықтар аралас факторларды тудырады. Алайда, бұл факторлардың барлығы 600M моделін 1B моделімен салыстырғанда қолайсыз жағдайға қояды. Сондықтан, деректер құрамының әсері туралы гипотеза негізгі болып қала береді, дегенмен ол қосымша абляцияны (F4) талап етеді.&lt;/p&gt;\n&lt;p&gt;L4: Диагностика шағын таңдамалар (n) негізінде жүргізілді. Сөзбе-сөз қайталауды тексеру 6 мысалды, ал жалпылау тесті 8 жаңа промптты қамтыды. Біз тек сапалық қорытынды жасаймыз: егер қабілет бір конфигурацияда барлық әрекеттерде, ал екіншісінде ешқашан көрінбесе, бұл категориялық айырмашылықты білдіреді. Басу (suppression) шарты 15 бақылау нүктесінің әрқайсысы үшін n=1 жағдайында тексерілді. Бұл 600M моделінде қатаң «гейт» (сүзгі) жоқтығын растағанымен, ішінара немесе контекстке тәуелді механизмдерді жоққа шығармайды. Кейінгі кеңейтілген тесттер (n=269 және n=238) біздің тұжырымдарымызды растады, бірақ преамбула күшінің әсері әлі зерттелмеген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бастапқы тесттердегі шағын таңдама көлемі статистикалық маңыздылықты шектейді, бірақ модельдердің сапалық айырмашылықтары тесттер кеңейтілгенде де тұрақты болып қала береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"l5-receptin-nakhtylau-zhaene-faktorlar-taldauy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#l5-receptin-nakhtylau-zhaene-faktorlar-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;L5 рецептін нақтылау және факторлар талдауы&lt;/span&gt;&lt;/a&gt;L5 рецептін нақтылау және факторлар талдауы&lt;/h4&gt;\n&lt;p&gt;L5 рецепті бастапқыда төрт өзгерісті қамтитын кешенді тәсіл болды: корпус әртүрлілігі, оқыту жылдамдығын (LR) бес есе арттыру, эмбеддингтерді ашу және «жылы старт» нүктесін өзгерту. Кейінгі талдау екі факторды алып тастауға мүмкіндік берді. Старт нүктесі алынып тасталды, өйткені әртүрлі ата-аналық модельдерден басталған қайта іске қосулар бірдей нәтиже берді (§6.5). Эмбеддингтерді ашу да артық деп танылды, себебі тікелей өлшеулер оқыту барысында кестенің сандық инерттілігін көрсетті (§6.6). Алайда, бұл алып тастаулардың шектеулері бар: «ата-аналық» модельдер ортақ эмбеддинг кестесіне ие болды, ал bf16 форматындағы инерттілік fp32 оптимизаторында өзгерістердің жинақталмауына кепілдік бермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;F3 факторлық талдауы корпус әртүрлілігі мен оқыту жылдамдығының әсерін бөлуге мүмкіндік берді, бірақ нәтижелер есептеу ортасы мен репликацияның толық еместігімен шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tekseru-shekteuleri-men-aedisnamasy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tekseru-shekteuleri-men-aedisnamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тексеру шектеулері мен әдіснамасы&lt;/span&gt;&lt;/a&gt;Тексеру шектеулері мен әдіснамасы&lt;/h4&gt;\n&lt;p&gt;§6.9-да сипатталған F3 факторлық талдауы үш маңызды шектеуге тап болды. Біріншіден, сандық режим өзгерді: негізгі деректер A10G-да bf16 форматында алынса, F3-тің бес тармағы T4-те fp16 және 8-биттік оптимизатор көмегімен орындалды. Бұл F3 нәтижелерін жұмыстың қалған бөлігімен салыстыруға келмейтінін білдіреді. Екіншіден, толық емес репликация: төрт ұяшықтың тек «әртүрлі корпус/жоғары LR» нұсқасы ғана аяғына дейін жеткізілді. Төмен LR ұяшықтарының репликациясы 2202 қадамның 880-қадамында тоқтатылды. Осы кезеңдегі салыстыру басу гипотезасының (Finding 1) біржақты расталмайтынын көрсетті: екінші тар тұқым (seed) 0.569 нәтижесін көрсетті (әртүрлі корпус үшін 0.556), бұл қорытындының тұрақтылығына күмән келтіреді. Үшіншіден, статистикалық маңыздылық: өткізілген 36 тесттің тек төртеуі ғана q=0.05 деңгейіндегі Бенджамини-Хохберг түзетуінен өтті, олардың екеуі бірдей мінез-құлықты сипаттайды, бұл дәлелдік базаны әлсіретеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/popravka-bendzhamini-hohberga.html\"&gt;Бенджамини-Хохберг түзетуі&lt;/a&gt; — көптеген салыстырулар жүргізген кезде қате оң нәтижелерді бақылауға және кездейсоқ корреляцияларды жоюға арналған статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"talkhylau-zhaene-shekteuler\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#talkhylau-zhaene-shekteuler\" class=\"yfm-anchor\" aria-hidde
