n=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау және шектеулер&lt;/span&gt;&lt;/a&gt;Талқылау және шектеулер&lt;/h4&gt;\n&lt;p&gt;Біздің тұжырымдарымыз мыналармен шектеледі: жоғары оқыту жылдамдығында (learning rate) корпус айырмашылығы байқалмайды; төмен жылдамдықта «әртүрлі» таңдау құралдардың дұрыстығы бойынша «тар» таңдаудан басым түседі. Алайда, бұл басымдық жеке іске қосулар (seeds) арасындағы өзгермелілікке байланысты болуы мүмкін. «Тар» таңдау және төмен жылдамдықтағы модель барлық көрсеткіштер бойынша ең әлсіз нәтиже көрсетті. Біз факторлық талдау доминантты ингредиентті анықтады деп мәлімдемейміз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Негізгі қорытынды: төмен жылдамдықта «әртүрлі» таңдау тиімдірек, бірақ нәтижелер кездейсоқ өзгермелілікке бейім.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Механистикалық түсіндірме схемалық талдау емес, жою арқылы локализациялауға негізделген. «Маршрутизация, өкілдік емес» гипотезасы рецепт өзгергенде назар салмақтарының (attention weights) өзгергенін, ал мақсатты жолдың өзгермегенін көрсетеді. Бұл кіріс деректерінің өкілдігі гипотезасын жоққа шығарады. Жолдың қозғалмауы bf16 &lt;a href=\"concepts/quantization.html\"&gt;кванттау&lt;/a&gt; шегіне байланысты екенін атап өткен жөн — жаңартулар сақтау дәлдігінен төмен болған, бұл нәтижені оқыту шешімі емес, техникалық артефакт етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кванттау (quantization) — модель салмақтарын сақтау кезінде дәлдікті төмендету, бұл тым кішкентай өзгерістердің жойылып кетуіне әкелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aedisnamalykh-shekteuler-zhaene-derekter-daeldigi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#aedisnamalykh-shekteuler-zhaene-derekter-daeldigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдіснамалық шектеулер және деректер дәлдігі&lt;/span&gt;&lt;/a&gt;Әдіснамалық шектеулер және деректер дәлдігі&lt;/h4&gt;\n&lt;p&gt;Барлық көрсеткіштер бір реттік іске қосу (single-seed) негізінде алынған. GGUF/Ollama экспорт жолы NoPE архитектуралары үшін тәуекелдер тудырады. Деректер құрамы (65/34/0.7/0.1) нақты &lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt; емес, сараптамалық бағалау болып табылады. 1B моделінің оқыту траекториясында «соқыр дақтар» бар: 1-фаза мұрағаттарының болмауына байланысты біз оқыту шыңын бақылай алмаймыз, ал 36K кезеңіндегі деректер жалпылау емес, жаттап алу (контаминация) белгілерін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ескерту: деректер құрамы мен бастапқы оқыту кезеңдері жуықталған бағалау болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз скоринг жүйесіндегі қатені анықтап, түзеттік: бастапқы алгоритм кез келген бос емес мәнді дұрыс деп санаған, бұл нәтижелерді жасанды түрде көтерген. Сондай-ақ, 72 промпттың 18-і дубликат екені анықталды, бұл тиімді таңдау көлемін 53-ке дейін азайтады. «Жұмсақ жіберіп алу» (soft miss) метрикасы тек &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0ce6fte\"&gt;bash_exec&lt;/code&gt; үшін қолданылады, сондықтан 9-кестедегі салыстырмалы қиындық деңгейлері әмбебап емес.&lt;/p&gt;\n&lt;h4 id=\"1b-modelin-khalpyna-keltiru-zhaene-verifikaciyalau\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#1b-modelin-khalpyna-keltiru-zhaene-verifikaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1B моделін қалпына келтіру және верификациялау&lt;/span&gt;&lt;/a&gt;1B моделін қалпына келтіру және верификациялау&lt;/h4&gt;\n&lt;p&gt;1B моделінің түпнұсқалық бақылау нүктелері (checkpoint) және оның «ата-ана» моделі бұлтты инфрақұрылымның жабылуына және есептік жазбалардың мерзімі аяқталуына байланысты жоғалды. Нәтижелерді қайта қалпына келтіру үшін авторлар дәл сол корпус, оқыту қадамы мен жылдамдығын пайдалана отырып, қайта іске қосу (репродукция) процесін жүзеге асырды. «Ата-ана» ретінде мақсатты патологияны көрсететін функционалды аналог таңдалды. 4 және 5-кестелердегі тарихи деректер тек анықтамалық сипатқа ие.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қалпына келтірілген 1B моделі репродукция болып табылады, себебі түпнұсқа салмақтар жоғалған, алайда ол патологияның дәл сол сипаттамаларын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау барысында төрт маңызды аспект анықталды:&lt;/p&gt;\n&lt;p&gt;а) Орынбасар модель 3-фазамен бит-бай-бит сәйкес емес. Ішкі жазбалардағы мәлімдемелерге қарамастан, 201 тіл моделінің тензорын салыстыру айырмашылықтарды көрсетті. Максималды абсолютті айырмашылық 7.8 × 10⁻³ құрады, ал әр тензордың косинустық ұқсастығы 0.999966-дан төмен емес. Бұл өзгерістер (біркелкі, барлық жерде кездесетін кішігірім ауытқулар) оқыту процесінен емес, деректерді экспорттау немесе түрлендіру кезіндегі қателіктерден хабар береді.&lt;/p&gt;\n&lt;p&gt;б) Түпнұсқа бақылау нүктесін іздеу сәтсіз аяқталды. Табылған үміткер төмен өнімділікті (тек 1/6 дұрыс жауап) көрсетті және қадамдар саны (2002-ге қарсы 2202) сәйкес келмеді.&lt;/p&gt;\n&lt;p&gt;в) Норманы өлшеу функцияларындағы қателік. Бұрын үміткер эмбеддинг кестесінің нормасы (630.13-ке қарсы 635.2) себебінен алынып тасталған еді. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yoek8s7e\"&gt;torch.norm&lt;/code&gt; және &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zevioom2\"&gt;torch.linalg.vector_norm&lt;/code&gt; функциялары 32,768 × 2048 өлшемді тензорларда 0.8% қателік беретіні, ал тікелей &lt;span class=\"yfm-latex\" data-content=\"%5Csqrt%7B%5Csum%20w%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; есептеу 635.1627 мәнін беретіні анықталды. Бұл зерттеудегі төртінші аспаптық артефакт.&lt;/p&gt;\n&lt;p&gt;г) Шығу тегіндегі белгісіздік. Логтар сақталмағандықтан, тарихи желінің қайта қалпына келтірілгенінен өзгеше болғанын 100% жоққа шығару мүмкін емес, дегенмен 4, 5-кестелер мен §6.6-дағы көрсеткіштердің сәйкес келуі бұны екіталай етеді.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;h4 id=\"zertteu-khorytyndylary-zhaene-modelderdi-diagnostikalau\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#zertteu-khorytyndylary-zhaene-modelderdi-diagnostikalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу қорытындылары және модельдерді диагностикалау&lt;/span&gt;&lt;/a&gt;Зерттеу қорытындылары және модельдерді диагностикалау&lt;/h4&gt;\n&lt;p&gt;Біз архитектурасы ұқсас екі кіші тілдік модельде (VectraYX-600M және VectraYX-1B) аномалияларды диагностикалау және түзету процесін жүргіздік. 661,6 миллион параметрлі 600M моделі кодқа бағытталған, ал 1,109 миллиард параметрлі 1B моделі көп сатылы веб-деректер негізінде оқытылған. Бастапқы «жұмсақ» бағалау екі модель де бірдей нәтиже көрсеткенін байқатты, бірақ қатаң диагностика 600M моделі 6-дан 6 жағдайда дұрыс JSON форматын шығарғанын, ал 1B моделі 0 жағдайда сәтсіз болғанын анықтады. 1B моделіндегі жоғары балл жалған оң (false positive) нәтиже екені белгілі болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Диагностика көмегімен 1B моделін арнайы рецептпен (әртүрлі корпус, 5× оқыту жылдамдығы, ≈3,3 GPU-сағат) түзетіп, 8-ден 8 жағдайда сәтті нәтижеге қол жеткіздік, бұл ретте эмбеддингтер 97,7% өзгеріссіз қалды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — модельді сыртқы құралдарды шақыру сияқты нақты тапсырмаларды орындауға үйрету үшін белгіленген деректермен қосымша оқыту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер шағын таңдамамен (n) шектелген және бастапқы жөндеу артефакті жоғалғандықтан, біз оның қайта қалпына келтірілген нұсқасын ұсынамыз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metodologiya-zhaene-tuzhyrymdar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#metodologiya-zhaene-tuzhyrymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методология және тұжырымдар&lt;/span&gt;&lt;/a&gt;Методология және тұжырымдар&lt;/h4&gt;\n&lt;p&gt;Біз қайта жаңғыртуды тексеру, бірінші токенді зондтау және эмбеддингтердің ығысуын талдауды қамтитын диагностикалық құралдарды әзірледік. Бұл ақаулықты триггер токендерінде емес, маршруттау механизмдерінде екенін анықтауға көмектесті. Біздің деректеріміз SFT токендерінің көлемі сәттілікті анықтайды деген гипотезаны жоққа шығарады: 10⁷ токенді рецепт 6 миллиард токенді кезеңнен тиімдірек болды. Тәжірибелік қорытынды: мақсатты шығыс пішімін оқыту жиынтығына қосыңыз және шақыруларды тексеру үшін қатаң бағалаушыларды қолданыңыз.&lt;/p&gt;\n&lt;h4 id=\"artefaktilerding-kholzhetimdiligi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#artefaktilerding-kholzhetimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Артефактілердің қолжетімділігі&lt;/span&gt;&lt;/a&gt;Артефактілердің қолжетімділігі&lt;/h4&gt;\n&lt;p&gt;VectraYX-600M-нің барлық бақылау нүктелері және 1B моделін жөндеудің қайта қалпына келтірілген кезеңдері (соның ішінде факториалды эксперименттің бес тармағы) HuggingFace-тегі jsantillana репозиторийлерінде көпшілікке қолжетімді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тесттеріндегі&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жалған&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нәтижелер&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8
