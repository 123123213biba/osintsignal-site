        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"246\" cy=\"78\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"574\" cy=\"258\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Сүйекпен жоспарлау:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейрожелілерді әртүрлі жауап&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;беруге қалай мәжбүрлеуге&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;болады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/gacha-decoding.html\"&gt;Gacha Decoding&lt;/a&gt; әдісі контент генерациясын токендер ықтималдығынан нұсқаулықтарды орындау деңгейіне ауыстырады. Модельдің ішкі энтропиясына сенудің орнына, жүйе идеяларды таңдау үшін сыртқы кездейсоқтықты пайдаланады. Бұл бірсарындылыққа бейім модельдерден де сапалы әрі әртүрлі жауаптар алуға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Әдіс модельдің токен энтропиясына емес, идеяларды таңдау үшін сыртқы кездейсоқтыққа сүйенеді.&lt;/li&gt;\n&lt;li&gt;Жауаптардың әртүрлілігі модель қуатымен бірге өседі, бұл сапа мен әртүрлілік арасындағы қайшылықты жояды.&lt;/li&gt;\n&lt;li&gt;Тиімділігі чат, шығармашылық жазу, кескін жоспарлау және ақуыз дизайны салаларында дәлелденген.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Дәстүрлі тілдік модельдер көбінесе жауаптардың «тарылуы» мәселесіне тап болады, мұнда модель сапасы артқан сайын шығармашылық төмендейді. Gacha Decoding әдісі бұл мәселені генерация процесін кезеңдерге бөлу арқылы шешеді: семантикалық осьтерді жоспарлау, нұсқаларды санамалау және сыртқы кездейсоқ сандар генераторы (&lt;a href=\"concepts/random-number-generator.html\"&gt;RNG&lt;/a&gt;) көмегімен біреуін таңдау. Бұл процесті «идеялар кеңістігіндегі» авторегрессиялық процесске айналдырады, мұнда әрбір шешім алдыңғыларына тәуелді болады.&lt;/p&gt;\n&lt;p&gt;Зерттеу көрсеткендей, бұл тәсіл &lt;a href=\"concepts/vendi-score.html\"&gt;Vendi Score&lt;/a&gt; метрикасы бойынша қолданыстағы әдістерден 2,4 есе асып түседі. Сапалы нәтижеге жету үшін қажетті таңдаулар саны 11 есе қысқарады. Әдіс кез келген модельдің үстіне қосымша қабат ретінде жұмыс істейді және оның нұсқаулықтарды орындау қабілетін пайдаланып, соңғы мәтінге айналатын әртүрлі жоспарларды қалыптастырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс жоспарлау және нұсқаларды санамалау үшін модельге қосымша сұраныстарды талап етеді, бұл генерация уақытын арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Біз Gacha Decoding әдісін ұсынамыз — бұл модельдің жұмыс істеу кезіндегі (inference-time) әдіс, ол тілдік модельдерден (LM) әртүрлі жауаптар алуға мүмкіндік береді және модельдің қуаты артқан сайын масштабталады. Әдіс ашық домендерде: күнделікті сұхбаттар, шығармашылық жазу, кескіндерді генерациялауды жоспарлау және ақуыздар дизайнында жоғары тиімділік көрсетті. Gacha Decoding сапаны сақтай отырып, әртүрлілік бойынша қолданыстағы тәсілдерден озып түседі (Vendi көрсеткіші бойынша ең жақсы балама тәсілден 2.4 есеге дейін жақсырақ) және 11 есе аз таңдамалармен сапалы модалар санына жетеді. Негізгі идея — әртүрлілікті нұсқауларды орындау (&lt;a href=\"concepts/instruction-following.html\"&gt;instruction-following&lt;/a&gt;) міндеті ретінде қайта қарастыру: токендер энтропиясына сүйенудің орнына, біз модельдің нұсқауларды орындау қабілетін сыртқы кездейсоқ сандар генераторымен (RNG) біріктіреміз. Бұл «сүйектермен жоспарлау» тәсілі әртүрлілік пен модель қабілеті арасындағы қайшылықты жояды. Негізгі LM нұсқауларды орындауда жақсарған сайын, Gacha Decoding көмегімен әртүрлілік токендер энтропиясы төмендесе де, тұрақты түрде артады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding жауаптар әртүрлілігін 2.4 есе арттырады және қажетті таңдамалар санын 11 есе қысқартады, генерация процесін нұсқауларды орындау міндетіне айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-суретте әдістің &lt;a href=\"concepts/verbalized-sampling.html\"&gt;Verbalized Sampling&lt;/a&gt; тәсілімен салыстырғандағы жұмысы көрсетілген. Gacha Decoding бірегей мәтіндік промпттарды қалыптастыру үшін сыртқы кездейсоқ параметрлерді пайдаланады, бұл модельге әлдеқайда әртүрлі визуалды концепцияларды жасауға мүмкіндік береді. Модельдің ішкі ықтималдық белгісіздігіне сүйенетін стандартты әдістерден айырмашылығы, Gacha Decoding процесті сыртқы нұсқаулар арқылы белсенді басқарады, бұл InfinityChat деректер жиынындағы нәтижелермен расталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vendi Score — генерациялар әртүрлілігін бағалау үшін қолданылатын метрика, мұнда жоғары мәндер бірегей және сапалы жауаптар спектрінің кеңдігін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"til-modelderindegi-aertuerlilik-maeselesi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#til-modelderindegi-aertuerlilik-maeselesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тіл модельдеріндегі әртүрлілік мәселесі&lt;/span&gt;&lt;/a&gt;Тіл модельдеріндегі әртүрлілік мәселесі&lt;/h4&gt;\n&lt;p&gt;Қазіргі тіл модельдері (LM) шығармашылық және зерттеу тапсырмалары үшін жиі қолданылады, алайда оларда адамға тән әртүрлілік пен жаңашылдық жетіспейді. Тіпті ашық сұраныстардың өзінде модельдер шектеулі типтік жауаптарға бейім келеді. Бұл пайдаланушылар үшін тиімділікті төмендетеді, синтетикалық деректерді жақсарту мүмкіндіктерін шектейді және ұзақ мерзімді перспективада ойлаудың біркелкіленуіне әкеп соғады. Бұрын зерттеушілер бұл мәселені токендердің таралу энтропиясын өзгерту (іріктеу параметрлерін өзгерту, арнайы шығын функцияларын қолдану немесе оқу деректерін таңдау) арқылы шешуге тырысқан. Алайда, бұл тәсіл қайшылық тудырады: модель сапасын арттыру әдістері көбінесе энтропияны төмендетеді, нәтижесінде модель қабілеті өскен сайын әртүрлілік төмендейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторлар сапа мен әртүрлілік арасындағы қайшылық іргелі емес екенін дәлелдеп, әртүрлілікті токен энтропиясы емес, нұсқауларды орындау (instruction following, IF) мәселесі ретінде қарастыруды ұсынады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gacha-decoding-aedisi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-decoding-aedisi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha Decoding әдісі&lt;/span&gt;&lt;/a&gt;Gacha Decoding әдісі&lt;/h4&gt;\n&lt;p&gt;Авторлар Gacha Decoding әдісін ұсынады — бұл модельдің нұсқауларды орындау қабілетін сыртқы кездейсоқ сандар генераторымен (RNG) біріктіретін &lt;a href=\"concepts/inferens.html\"&gt;инференс&lt;/a&gt; әдісі. Әр токенді таңдауда кездейсоқтыққа сенудің орнына, модель «сүйектермен жоспарлайды» (2-суретті қараңыз). Кез келген тапсырма үшін модель алдымен семантикалық шешімдер тізбегін (мысалы, әңгімедегі кейіпкерлер немесе ортаны) анықтайды, содан кейін сыртқы RNG көмегімен өзі ұсынған нұсқалардың бірін таңдайды. Әрбір шешім алдыңғыларына байланысты, бұл өзгермеліліктің комбинаторлық түрде жинақталуына мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding — бұл модель үстіндегі жеңіл қабықша, ол авторегрессивті генерацияны токендер деңгейінен идеялар деңгейіне ауыстырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шығармашылық жазу, кескін жасауды жоспарлау және ақуыз дизайны бойынша өткізілген тәжірибелерде Gacha Decoding бұрынғы әдістерден басым түсіп, Vendi-score метрикасы бойынша 2,4 есеге дейін әртүрліліктің өсуін қамтамасыз етті (1A-сурет). Ең бастысы, Gacha Decoding әртүрлілігі модель қуатымен бірге өседі, тіпті стандартты әдістер төмендеу көрсеткен жағдайдың өзінде (1B-сурет). Әдіс тіпті детерминирленген ашкөз декодтау (&lt;a href=\"concepts/greedy-decoding.html\"&gt;greedy decoding&lt;/a&gt;) жағдайында да тиімді жұмыс істейді.&lt;/p&gt;\n&lt;h4 id=\"sholu-gacha-decoding-degenimiz-ne\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#sholu-gacha-decoding-degenimiz-ne\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу: Gacha Decoding дегеніміз не?&lt;/span&gt;&lt;/a&gt;Шолу: Gacha Decoding дегеніміз не?&lt;/h4&gt;\n&lt;p&gt;Біз тілдік модельдерден (LM) әртүрлі генерацияларды алуға мүмкіндік беретін Gacha Decoding әдісін ұсынамыз. Негізгі идея — модельдің логикалық пайымдауын кездейсоқтықпен толықтыру. Процесс екі кезеңнен тұрады: модель нәтижеге әсер ететін шешімдер тізбегін анықтайды, содан кейін әрбір шешім ықтимал нұсқаларды санамалау және сыртқы кездейсоқ сандар генераторы (RNG) арқылы таңдау жолымен жүзеге асырылады. Мысалы, ит туралы әңгіме жазғанда, модель алдымен оқиға орнын (мысалы, заманауи қала немесе тарихи Жапония) «сүйек лақтыру» арқылы таңдайды. Кейінгі шешімдер, мысалы, иттің рөлі немесе баяндау көзқарасы, осы таңдауға байланысты болады, бұл сюжеттің қалыптасуы барысында әртүрліліктің жинақталуына мүмкіндік береді. Gacha Decoding әртүрлілік көзін токендердің энтропиясынан нұсқауларды орындауға ауыстырады. Іс жүзінде бұл идеялар кеңістігіндегі рандомизацияланған авторегрессиялық процесс, оны қолданыстағы модельдің үстіне агенттік қабат ретінде орнатуға болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding токендердің ықтималдық үлестіріміне сүйенбей, сыртқы кездейсоқ таңдаулар арқылы шешім қабылдау жолымен генерация әртүрлілігін қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nuskhaulardy-oryndau-zhaene-zhosparlau-arkhyly-aertuerlilik\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#nuskhaulardy-oryndau-zhaene-zhosparlau-arkhyly-aertuerlilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нұсқауларды орындау және жоспарлау арқылы әртүрлілік&lt;/span&gt;&lt;/a&gt;Нұсқауларды орындау және жоспарлау арқылы әртүрлілік&lt;/h4&gt;\n&lt;p&gt;Біз әдістің жұмысын қамтамасыз ететін үш негізгі дизайн элементін бөліп көрсетеміз: семантикалық идеялар кеңістігінде жұмыс істеу, нұсқаларды санамалау және таңдау кезеңдерін бөлу, сондай-ақ процестің авторегрессиялық сипаты. 1-алгоритмде көрсетілгендей, процесс екі фазаға бөлінеді. Бірінші фазада модель жауапты қалыптастыратын T семантикалық шешім осьтерін белгілейді, бұл ретте олардың нақты мәндері әзірге анықталмайды. Екінші фазада, t=1 мен T аралығындағы әрбір &lt;a href=\"concepts/step.html\"&gt;қадам&lt;/a&gt; үшін модель ағымдағы a_t осі үшін промптке және бұрын қабылданған z&amp;lt;t шешімдерге негізделе отырып, C_t жиынындағы қисынды және семантикалық жағынан ерекшеленетін нұсқаларды санамалайды. Содан кейін сыртқы RNG көмегімен C_t жиынынан z_t нұсқасы бірдей ықтималдықпен таңдап алынады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Семантикалық идеялар кеңістігі — бұл модель жеке сөздермен немесе токендермен емес, түсініктермен (мысалы, «оқиға орны» немесе «кейіпкер мінезі») жұмыс істейтін абстракция деңгейі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ideyalar-kengistiginde-zhumys-isteu\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#ideyalar-kengistiginde-zhumys-isteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идеялар кеңістігінде жұмыс істеу&lt;/span&gt;&lt;/a&gt;Идеялар кеңістігінде жұмыс істеу&lt;/h4&gt;\n&lt;p&gt;Жауапты қалыптастыру процесі үш кезеңнен тұрады: шешімдерді түпкілікті жоспарға біріктіру, сыртқы кездейсоқ сандар генераторы (КСГ) арқылы біреуін таңдау және таңдалған жоспар негізінде y мәтінін генерациялау. Түпкілікті жауаптың ықтималдығы &lt;span class=\"yfm-latex\" data-content=\"p(y%2F%20x)%20%3D%20%5Cprod_%7Bt%3D1%7D%5E%7BT%7D%20p_%20heta(y_t%2F%20x%2C%20y_%7B%3Ct%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласымен анықталады. Токендерді стандартты таңдау әдісі шектеулі, себебі ол модельдің энтропиясына тәуелді және семантикалық әртүрлілікті толық қамтымайды. Авторлар z латентті айнымалысын (идея немесе жоспар) енгізіп, жоғары деңгейлі семантика мен беткі іске асыруды &lt;span class=\"yfm-latex\" data-content=\"p(y%2F%20x)%20%3D%20%5Cint%20p_%20heta(y%2F%20z%2C%20x)%20q(z%2F%20x)%20dz\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласы арқылы ажыратады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding әдісі әртүрлілікті токендер деңгейінен семантикалық жоспарлар деңгейіне ауыстырады және таңдау үшін сыртқы кездейсоқтықты пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдің өзі z жоспарын тікелей генерациялайтын әдістерден айырмашылығы, Gacha Decoding модельден C түрлі нұсқалар жиынтығын тізіп шығуды сұрайды және таңдауды сыртқы КСГ-ға жүктейді. Бұл модельдің нұсқауларды орындау (IF) қабілетін тиімді пайдалануға мүмкіндік береді. Контекст терезесінің шектеулерін айналып өту үшін авторлар идеяларды авторегрессиялық таңдауды қолданады: &lt;span class=\"yfm-latex\" data-content=\"q(z%2F%20x)%20%3D%20%5Cprod_%7Bt%3D1%7D%5E%7BT%7D%20q(z_t%2F%20x%2C%20z_%7B%3Ct%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Бұл әрбір келесі таңдау алдыңғысына тәуелді болатын комбинаторлық траекторияларды құруға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторегрессиялық таңдау — бұл шешімдерді кезең-кезеңімен қабылдау процесі, мұнда әрбір қадам алдыңғы нәтижелерге негізделеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimenttik-khondyrghy\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#eksperimenttik-khondyrghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименттік қондырғы&lt;/span&gt;&lt;/a&gt;Эксперименттік қондырғы&lt;/h4&gt;\n&lt;p&gt;Gacha Decoding тиімділігі үш салада сыналады: чат-боттар, шығармашылық жазу және кескіндерді генерациялауға арналған промпттарды қайта жазу, сонымен қатар ақуыздар дизайны бойынша пилоттық зерттеу. Әрбір x_i промпты үшін N жауап жиынтығы жасалады. Сапа «сапа бойынша сүзгіден өткен» әртүрлілік көрсеткіші арқылы бағаланады: тек сапасы стандартты тікелей таңдаудағы орташа көрсеткіштің 95%-ынан жоғары жауаптар есепке алынады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әртүрлілік көрсеткіші сапасы төмен жауаптар есебінен жасанды түрде өсіп кетпеуі үшін сапа бойынша нормаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modelder,-bazalykh-zheliler-zhaene-aldyngghy-taesilder\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#modelder,-bazalykh-zheliler-zhaene-aldyngghy-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельдер, базалық желілер және алдыңғы тәсілдер&lt;/span&gt;&lt;/a&gt;Модельдер, базалық желілер және алдыңғы тәсілдер&lt;/h4&gt;\n&lt;p&gt;GachaDecoding тиімділігін бағалау үшін біз генерацияны әртараптандырудың бірқатар әдістерін салыстырдық. Біріншісі — стандартты және жоғары (1.5) температурадағы тікелей таңдау (Direct sampling). Екіншісі — «тізімдік промптинг» (List prompting), мұнда модельге бір генерацияда k әртүрлі жауап беру тапсырылады; алдыңғы жауаптар контексте қалатындықтан, модель қайталанудан сақтанады. Сондай-ақ, біз «вербализацияланған таңдау» (Verbalized Sampling) әдісін қолдандық, мұнда модель k жауап пен олардың ықтималдығын бірге шығарады. «Тікелей жоспарлау» (&lt;a href=\"concepts/direct-planning.html\"&gt;Direct Planning&lt;/a&gt;) процесті екі кезеңге бөледі: 1.2 температурада жоғары деңгейлі жоспар құру және соның негізінде жауапты қалыптастыру. Сонымен қатар, кездейсоқ ASCII жолдары арқылы «сид-промптинг» (Seed Prompting) және алдын ала белгіленген жиынтықтан таңдалған кейіпкерлер арқылы «персона-промптинг» (Persona Prompting) әдістері қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Персона-промптинг» әдісі кездейсоқ таңбалар тізбегінен айырмашылығы, мағыналы рөлдер арқылы жауаптардың әртүрлілігін басқарады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghalanghan-modelder\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#baghalanghan-modelder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағаланған модельдер&lt;/span&gt;&lt;/a&gt;Бағаланған модельдер&lt;/h4&gt;\n&lt;p&gt;Біз ашық (GPT-OSS, Inkling, Qwen 3.5 отбасылары) және жабық (Claude Opus 4.8, GPT 5.5) тілдік модельдерін бағаладық. Барлық жағдайда «ойлау режимі» (thinking mode) және ұсынылған параметрлер қолданылды. API модельдерінде ойлау режимімен температураны өзгерту мүмкін емес болғандықтан, жоғары температураны талап ететін әдістер олар үшін қолданылмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шектеу: API модельдерінде ойлау режимінде температураны баптау мүмкіндігі болмағандықтан, кейбір әдістер оларға қолданылмады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ashykh-baghalau-domenderi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#ashykh-baghalau-domenderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ашық бағалау домендері&lt;/span&gt;&lt;/a&gt;Ашық бағалау домендері&lt;/h4&gt;\n&lt;p&gt;Жауаптардың сапасы мен әртүрлілігі үш салада өлшенді. «In-the-wild chat» үшін InfinityChat деректер жиынтығы пайдаланылды. Әртүрлілік жауаптар эмбеддингтері арасындағы қашықтық (Vendi score) арқылы, ал сапасы LM-judge арқылы өлшенді. Шығармашылық жазу (Creative writing) бойынша WildChat негізінде әңгімелер 0–20 балл жүйесімен бағаланды. Әртүрлілік сегіз семантикалық атрибут (жанр, сюжет, кейіпкер және т.б.) бойынша Vendi score макро-орташа мәні арқылы есептелді, бұл лексикалық айырмашылықтардан гөрі мазмұндық өзгерістерді жақсырақ көрсетеді.&lt;/p&gt;\n&lt;p&gt;Кескін генерациясында пайдаланушы промптін x кеңейту кезеңінде әдістер сыналды. OneIGBench промпттері мен Qwen-Image-2512 моделі қолданылды. Сапасы бастапқы промптке сәйкестігімен, ал әртүрлілігі DreamSim эмбеддингтері бойынша Vendi score арқылы өлшенді. Негізгі нәтижелер 3-суретте көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Семантикалық атрибуттар бойынша Vendi score және DreamSim эмбеддингтерін қолдану мазмұндық әртүрлілікті дәл өлшеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gacha-decoding-artykhshylyghy-men-masshtabtaluy\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-decoding-artykhshylyghy-men-masshtabtaluy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha Decoding артықшылығы мен масштабталуы&lt;/span&gt;&lt;/a&gt;Gacha Decoding артықшылығы мен масштабталуы&lt;/h4&gt;\n&lt;p&gt;Gacha Decoding қолданыстағы тәсілдерден айтарлықтай озып түседі және бұл артықшылық генерация ауқымы ұлғайған сайын арта түседі. Негізгі нәтиже — сапаны сақтай отырып, әртүрліліктің (diversity) еселеп артуы. Мысалы, Opus 4.8 моделінде әр сұранысқа 256 генерация жасағанда, әдіс тікелей таңдауға (direct sampling) қарағанда сапамен бақыланатын әртүрлілікті 7,1 есе арттырады. Тиімділік тұрғысынан алғанда, біздің әдіс «list prompting» базалық әдісіне қарағанда 4,7 есе аз генерацияны қажет етеді (3-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding persona prompting әдісіне қарағанда 11,0 есе, ал басқа әдістерге қарағанда 38 есеге дейін жоғары тиімділікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдіс басқа тәсілдер жете алмайтын жаңа жауап түрлерін ашуға мүмкіндік береді. Мысалы, Сингапурдағы пәтер туралы қорқынышты оқиға жазу сұралғанда, Gacha Decoding екінші жақтан баяндалатын оқиғаларды жаратады, ал басқа әдістер үшінші жақпен шектеліп қалады (S6-сурет). Кескін генерациясында әртүрлілік визуалды түрде айқын көрінеді (1-сурет).&lt;/p&gt;\n&lt;h4 id=\"gacha-if-khabiletterimen-masshtabtalady-zhaene-ashkoez-dekodtau-kezinde-de-zhumys-istejdi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-if-khabiletterimen-masshtabtalady-zhaene-ashkoez-dekodtau-kezinde-de-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha IF қабілеттерімен масштабталады және ашкөз декодтау кезінде де жұмыс істейді&lt;/span&gt;&lt;/a&gt;Gacha IF қабілеттерімен масштабталады және ашкөз декодтау кезінде де жұмыс істейді&lt;/h4&gt;\n&lt;p&gt;Әдіс модельдің токен энтропиясына емес, нұсқауларды орындау (Instruction Following, IF) қабілетіне негізделген. Бұл модельдің IF қабілеті артқан сайын әртүрлілік те артатынын және ашкөз декодтау (greedy decoding) кезінде де сақталатынын білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ашкөз декодтау (greedy decoding) — модель әрқашан ең жоғары ықтималдығы бар токенді таңдайтын процесс, бұл әдетте жауаптарды біркелкі және детерминирленген етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"if-khabiletterimen-masshtabtalu\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#if-khabiletterimen-masshtabtalu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IF қабілеттерімен масштабталу&lt;/span&gt;&lt;/a&gt;IF қабілеттерімен масштабталу&lt;/h4&gt;\n&lt;p&gt;Тікелей таңдаудан айырмашылығы, Gacha Decoding IF қабілеттерімен оң корреляцияны көрсетеді. Qwen 3.5 модельдері (2B-ден 27B-ге дейін) және IFBench метрикалары арқылы жүргізілген сынақтар (4-сурет) көрсеткендей, тікелей таңдауда модель қуаты артқан сайын әртүрлілік төмендейді, ал Gacha Decoding барлық домендерде тұрақты өсуді көрсетеді. Әдіс «list prompting» сияқты тәсілдердің шектеулерін жеңеді, өйткені ол сыртқы кездейсоқ сандар генераторымен (RNG) идеялар кеңістігінде авторегрессияны пайдаланады.&lt;/p&gt;\n&lt;h4 id=\"ashkoez-dekodtau-kezindegi-aertuerlilik\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#ashkoez-dekodtau-kezindegi-aertuerlilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ашкөз декодтау кезіндегі әртүрлілік&lt;/span&gt;&lt;/a&gt;Ашкөз декодтау кезіндегі әртүрлілік&lt;/h4&gt;\n&lt;p&gt;Тіпті ашкөз декодтау режимінде де (Qwen 3.5 27B, GPT-OSS және Inkling модельдерінде) Gacha Decoding жоғары әртүрлілікті сақтайды және көбінесе температуралық таңдаумен (temperature sampling) жұмыс істейтін базалық әдістерден озып түседі. Тізімге негізделген әдістер энтропиясыз күрт тиімсіз болып қалады (S3-кесте).&lt;/p&gt;\n&lt;h4 id=\"akhuyz-dizajny-bojynsha-taezhiribelik-zertteu\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#akhuyz-dizajny-bojynsha-taezhiribelik-zertteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ақуыз дизайны бойынша тәжірибелік зерттеу&lt;/span&gt;&lt;/a&gt;Ақуыз дизайны бойынша тәжірибелік зерттеу&lt;/h4&gt;\n&lt;p&gt;Біз Gacha Decoding әдісін de novo ақуыз байланыстырғыштарын (binders) жобалауда қолдандық. Заманауи генеративті модельдер көбінесе құрылымдық фолдтардың тар шеңберімен шектеледі. GPT 5.5 көмегімен біз сегіз нысана (соның ішінде PD-1) үшін ақуыз сипаттамаларын жасадық және оларды бекітілген модель арқылы кешендерге айналдырдық. Интерфейс сапасы &lt;a href=\"concepts/ipsaemin.html\"&gt;ipSAEmin&lt;/a&gt; арқылы бағаланып, тек 0,5-тен жоғары көрсеткіші бар нұсқалар таңдап алынды. Құрылымдық әртүрлілік TM-score негізінде Vendi-score көмегімен өлшенді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding ipSAEmin &amp;gt; 0,5 сапа шегінен өткен дизайндар арасында ең жоғары құрылымдық әртүрлілікті (Vendi-score) қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5-суретте көрсетілгендей, Gacha Decoding вербалды және тізімдік промпт әдістерінен басым түседі. Мысалы, PD-1 нысанасы үшін Gacha аралас α/β-құрылымы бар ақуыздарды жасаса, базалық әдістер тек α-спиральді фолдтармен шектеледі.&lt;/p&gt;\n&lt;h4 id=\"taldau-gacha-decoding-nege-zhumys-istejdi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#taldau-gacha-decoding-nege-zhumys-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талдау: Gacha Decoding неге жұмыс істейді?&lt;/span&gt;&lt;/a&gt;Талдау: Gacha Decoding неге жұмыс істейді?&lt;/h4&gt;\n&lt;p&gt;Біз әдістің үш негізгі шешімін абляциялық талдаудан өткіздік (А.4-қосымша): (А) токендер емес, идеялар бойынша рандомизация; (Б) нұсқалар тізімінен таңдау үшін сыртқы кездейсоқ сандар генераторын (RNG) пайдалану; (В) идеяларды авторегрессивті таңдау. Сынақтар GPT-OSS-120B және Opus 4.8 модельдерінде өткізілді (1-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — бұл жүйенің әрбір бөлігін жеке өшіріп көру арқылы оның түпкі нәтижеге әсерін бағалау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сыртқы RNG қолданылмаған нұсқа (no-RNG) әртүрлілікті екі есеге жуық азайтады: модельдер тізімдегі орташа нұсқаларды таңдауға бейім келіп, адамдарға тән когнитивті қателіктерді көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық нұсқалар (idea-list, independent axes, no-RNG) Gacha Decoding-тен төмен нәтиже көрсетті, бұл әр кезеңнің маңыздылығын растайды.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Декодтау әдістерін салыстыру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Әдіс&lt;/th&gt;\n&lt;th&gt;Мәні 1&lt;/th&gt;\n&lt;th&gt;Мәні 2&lt;/th&gt;\n&lt;th&gt;Мәні 3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(A) Токендер емес, идеялар бойынша рандомизация&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;10.08&lt;/td&gt;\n&lt;td&gt;9.44&lt;/td&gt;\n&lt;td&gt;9.23&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Standardtokensampling(T=1)&lt;/td&gt;\n&lt;td&gt;2.41&lt;/td&gt;\n&lt;td&gt;5.25&lt;/td&gt;\n&lt;td&gt;4.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=10)&lt;/td&gt;\n&lt;td&gt;3.28&lt;/td&gt;\n&lt;td&gt;3.07&lt;/td&gt;\n&lt;td&gt;4.66&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=20)&lt;/td&gt;\n&lt;td&gt;3.46&lt;/td&gt;\n&lt;td&gt;0.44&lt;/td&gt;\n&lt;td&gt;4.93&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=10)&lt;/td&gt;\n&lt;td&gt;3.19&lt;/td&gt;\n&lt;td&gt;0.31&lt;/td&gt;\n&lt;td&gt;4.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=20)&lt;/td&gt;\n&lt;td&gt;2.15&lt;/td&gt;\n&lt;td&gt;0.03&lt;/td&gt;\n&lt;td&gt;4.99&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(B) Санау мен таңдауды ажырату арқылы іріктеу&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;10.61&lt;/td&gt;\n&lt;td&gt;10.08&lt;/td&gt;\n&lt;td&gt;8.21&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NoexternalRNG(LMselectschoicesfromitslist)&lt;/td&gt;\n&lt;td&gt;5.34&lt;/td&gt;\n&lt;td&gt;6.75&lt;/td&gt;\n&lt;td&gt;5.46&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Noenumeration(directlypromptLMfordecision)&lt;/td&gt;\n&lt;td&gt;5.73&lt;/td&gt;\n&lt;td&gt;7.50&lt;/td&gt;\n&lt;td&gt;5.50&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(C) Идеяларды авторегрессиялық жергілікті шешімдер ретінде іріктеу&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"bajlanysty-zhumystar-tildik-modelderding-aertuerlilik-maeselesi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#bajlanysty-zhumystar-tildik-modelderding-aertuerlilik-maeselesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты жұмыстар: тілдік модельдердің әртүрлілік мәселесі&lt;/span&gt;&lt;/a&gt;Байланысты жұмыстар: тілдік модельдердің әртүрлілік мәселесі&lt;/h4&gt;\n&lt;p&gt;Әдебиеттер тілдік модельдер генерациясындағы әртүрліліктің жетіспеушілігін растайды, бұл шығармашылық және ғылыми тапсырмалардағы пайдалылықты төмендетеді. Мәселе мынада: пост-тренинг көбінесе токен энтропиясын төмендетеді. Біз бұл қайшылықтың фундаменталды емес екенін көрсетеміз және нәтижелердің әртүрлілігін арттыру үшін нұсқауларды орындау (IF) мүмкіндіктерін пайдаланамыз.&lt;/p&gt;\n&lt;h4 id=\"aertuerlilikti-arttyru-taesilderi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#aertuerlilikti-arttyru-taesilderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әртүрлілікті арттыру тәсілдері&lt;/span&gt;&lt;/a&gt;Әртүрлілікті арттыру тәсілдері&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер генерацияның әртүрлілігін арттыру әдістерін екі санатқа бөледі: оқыту және қорытынды шығару (inference) кезеңіндегі араласулар. Оқыту әдістері тілдік модельдің (LM) токендер үлестірімін өзгертуге бағытталған. Бұған оқу деректерін іріктеу немесе модельді қайта оқыту процесінде арнайы шығын функцияларын (&lt;a href=\"concepts/loss.html\"&gt;loss&lt;/a&gt; functions) енгізу арқылы қол жеткізіледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оқыту кезеңіндегі араласу — бұл модельдің деректер немесе келесі токенді болжау ережелері арқылы «дүниетанымын» өзгерту.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қорытынды шығару әдістері дәстүрлі түрде таңдама алу (sampling) процесін қайта құрады. Жақында назар генерацияны контекстік сигналдар арқылы басқаруға ауысты: бастапқы параметрлер (seeds), кейіпкерлер немесе жұмыс режимінің нұсқаулары арқылы. Біздің жұмысымызға ең жақын тәсіл — бұл жоспарларды әртараптандыру арқылы түпкілікті жауаптардың әртүрлілігіне қол жеткізу. Біз бұл тәсілдерді нұсқауларды орындау (instruction-following) тұжырымдамасы аясында жүйелейміз және сыртқы кездейсоқ сандар генераторын (RNG) нұсқауларды орындаумен (IF) үйлестіру модель токендерінің энтропиясын жасанды түрде арттырмай-ақ жоғары вариативтілікті қамтамасыз ететінін көрсетеміз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сыртқы RNG және нұсқауларды орындауды пайдалану токендер үлестірімінің энтропиясын өзгертпей-ақ жауаптардың әртүрлілігін қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Айта кетерлігі, әртүрлі нұсқаларды таңдау мәселесі адамдар үшін де қиын. n=200 000 қатысушы қатысқан бейресми сауалнамада адамдардың көбінесе 37 санын таңдауға бейім екендігі анықталды, бұл тілдік модельдерде байқалатын ұқсас когнитивті бұрмалауларды түсіндіруі мүмкін.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Бұл жұмыста авторлар генеративті әртүрлілікті тілдік модельдің токендік энтропиясы арқылы емес, нұсқауларды орындау мәселесі ретінде қарастыруды ұсынады. Модельдер сыртқы кездейсоқтықты пайдалы және әртүрлі жауаптарға айналдыратын логикалық компоненттер ретінде әрекет етеді. Gacha Decoding әдісі заманауи модельдердің сұраныс бойынша нұсқаларды тізіп шығу қабілетіне сүйенеді.&lt;/p&gt;\n&lt;h4 id=\"aedis\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#aedis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдіс&lt;/span&gt;&lt;/a&gt;Әдіс&lt;/h4&gt;\n&lt;p&gt;Тиімділікті бағалау үшін Claude Opus, GPT-5.5, GPT-OSS 120B және Inkling Large модельдері қолданылды. Негізгі метрика — сапа сүзгісінен өткен жауаптар үшін есептелген Vendi баллы (Quality-gated diversity). Өту шегі (&lt;a href=\"concepts/gate.html\"&gt;Gate&lt;/a&gt; pass rate) ретінде модельдің тікелей таңдау орташа мәнінің 95% бөлігі белгіленді. Сапа жауаптардың жарамдылығы, оқиғаларға арналған рубрикалар (0–20 балл) және кескіндердің сәйкестігі (0–1) бойынша бағаланды. Тәжірибелер ашық модельдер үшін n=512 және жабық модельдер үшін n=256 көлемінде өткізілді. 2-кесте Gacha Decoding сапаны сақтай отырып, жоғары әртүрлілікті қамтамасыз ететінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding модельдердің нұсқауларды орындау қабілетін пайдаланып, жоғары әртүрлілікке қол жеткізуге мүмкіндік береді және барлық сыналған архитектураларда дәстүрлі әдістерден басым түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vendi score — деректер жиынындағы әртүрлілікті сандық бағалау үшін қолданылатын метрика, мұнда жоғары мәндер жауаптардың вариативтілігін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ашкөз декодтау (greedy decoding) кезінде Verbalized Sampling сияқты әдістер сапа сүзгісінен өтпейтін мағынасыз жауаптар тудырады, ал Gacha Decoding тұрақтылықты сақтайды (3-кесте).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khosymsha-ablyaciya-naetizheleri\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#khosymsha-ablyaciya-naetizheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қосымша абляция нәтижелері&lt;/span&gt;&lt;/a&gt;Қосымша абляция нәтижелері&lt;/h4&gt;\n&lt;p&gt;Біз Gacha Decoding архитектурасының үш негізгі аспектісі бойынша 1-кестеде келтірілген қорытындыларды растайтын кеңейтілген деректерді ұсынамыз: идеялар деңгейіндегі рандомизация, санау процесін сыртқы кездейсоқ сандар генераторы (RNG) көмегімен таңдаудан бөлу және авторегрессивті идеяларды таңдау. Inkling және GPT-5.5 үшін нәтижелер 4-кестеде көрсетілген.&lt;/p&gt;\n&lt;p&gt;(A) Идеялар кеңістігіндегі рандомизация токендер кеңістігіне қарсы. Gacha Decoding модель дайындаған идеялардан біркелкі таңдау жасау үшін сыртқы RNG қолданады. Top-p (p=0.95) және top-K әдістерімен экстремалды температурада салыстыру бұл тәсілді токендер деңгейінде қайталаудың тиімсіз екенін көрсетті. Температураны 3-тен асыру кез келген K мәнінде жауаптардың дәйектілігін күрт төмендетеді. Идеялар кеңістігінде жұмыс істеу жоғары деңгейдегі кездейсоқтыққа қол жеткізу үшін өте маңызды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Токендер орнына идеялар кеңістігін пайдалану жауаптар сапасын жоғалтпай жоғары әртүрлілікке қол жеткізуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;(B) Санау мен таңдауды бөлу. Біз Gacha Decoding-ті екі нұсқамен салыстырдық: санаусыз (модель бірден бір нұсқаны таңдайды) және сыртқы RNG-сіз (модель ұсынылған тізімнен өзі таңдайды). Бірінші жағдайда, өзгермелілік модельдің токендер үлестірімімен шектелген. Екінші жағдайда, таңдау модельдің өзіне жүктелгенде, жауаптардың әртүрлілігі айтарлықтай төмендейді, бұл 4-кестеде расталған.&lt;/p&gt;\n&lt;p&gt;(C) Авторегрессивті идеяларды таңдау. Біз Gacha Decoding-ті екі авторегрессивті емес тәсілмен салыстырдық: «Idea-list» (бір қадамда идеялар тізімін жасау) және «Independent-axes» (шешім осьтері бойынша тәуелсіз таңдау). Бірінші жағдайда, әртүрлілік токендер энтропиясына байланысты, ал екіншісінде шешімдердің контекстік тәуелділігі ескерілмейді. Нәтижелер Gacha Decoding-тің екі әдістен де басым екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"gacha-decoding-ti-zhuezege-asyru-egzhej-tegzhejleri\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-decoding-ti-zhuezege-asyru-egzhej-tegzhejleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha Decoding-ті жүзеге асыру егжей-тегжейлері&lt;/span&gt;&lt;/a&gt;Gacha Decoding-ті жүзеге асыру егжей-тегжейлері&lt;/h4&gt;\n&lt;p&gt;Барлық модель шақырулары стандартты параметрлермен (температура 1.0, пайымдау қосулы) орындалады. Процесс шешім осьтерін жоспарлаудан (1-қадам) басталады, мұнда T гиперпараметрі (осьтер саны) қолданылады. Біз T-ны оңтайландыру болашақ зерттеулерде көрсеткіштерді жақсартуы мүмкін деп санаймыз.&lt;/p&gt;\n&lt;h4 id=\"prompt-b1-sheshim-khabyldau-osterin-zhosparlau\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-b1-sheshim-khabyldau-osterin-zhosparlau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt B.1: Шешім қабылдау осьтерін жоспарлау&lt;/span&gt;&lt;/a&gt;Prompt B.1: Шешім қабылдау осьтерін жоспарлау&lt;/h4&gt;\n&lt;p&gt;Нәтижелерді құрылымдау үшін тапсырма тізбекті шешім қабылдау кезеңдеріне бөлінеді. Мақсат — T қадамда нәтижеге жету. Әр кезең сұрақ ретінде қойылады, модель алдыңғы жауаптарды ескереді. Ережелер бойынша бекітілген параметрлерді өзгертпеу және қарапайым сұрақтардан күрделілеріне өту талап етіледі. Әңгімелер үшін T=4, чаттар үшін T=4 және кескіндер үшін T=6 параметрлері қолданылады. Кескіндер үшін ережелер блогы жоқ жеңілдетілген промпт қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс генерацияны T қадамға бөліп, нәтижелердің әртүрлілігін қатаң бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"avtoregressiyalykh-cikl-2-4-khadamdar\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#avtoregressiyalykh-cikl-2-4-khadamdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Авторегрессиялық цикл: 2–4-қадамдар&lt;/span&gt;&lt;/a&gt;Авторегрессиялық цикл: 2–4-қадамдар&lt;/h4&gt;\n&lt;p&gt;Жоспарлаудан кейін модель көп қадамды диалогта шешім қабылдайды. Әр t қадамында модель (Prompt B.2) m нұсқаны генерациялайды (әңгімелер мен кескіндер үшін m=32, чат үшін m=24), одан жүйе кездейсоқ біреуін (z_t) таңдайды. Егер JSON қате болса, қадам өткізіледі. Бұл әр шешімнің алдыңғы контекстке негізделуін қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторегрессия — әрбір жаңа шешім алдыңғы таңдауларды «есінде сақтайды», бұл қайшылықтарды болдырмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-khadam-iske-asyru\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#5-khadam-iske-asyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5-қадам: Іске асыру&lt;/span&gt;&lt;/a&gt;5-қадам: Іске асыру&lt;/h4&gt;\n&lt;p&gt;Соңғы кезеңде (Prompt B.3) модель k=8 шығармашылық тәсілді ұсынады. «Орындаушы» (Prompt B.4) барлық таңдалған параметрлерді біріктіріп, қорытынды артефакт жасайды. Егер тапсырма талаптары таңдалған параметрлермен қайшы келсе, тапсырманың талаптары басымдыққа ие болады.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Модельдердің өнімділік нәтижелері&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель/Әдіс&lt;/th&gt;\n&lt;th&gt;Gacha (Start)&lt;/th&gt;\n&lt;th&gt;Gacha (End)&lt;/th&gt;\n&lt;th&gt;Δ&lt;/th&gt;\n&lt;th&gt;List (Start)&lt;/th&gt;\n&lt;th&gt;List (End)&lt;/th&gt;\n&lt;th&gt;Δ&lt;/th&gt;\n&lt;th&gt;Verbal (Start)&lt;/th&gt;\n&lt;th&gt;Verbal (End)&lt;/th&gt;\n&lt;th&gt;Δ&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;GPT-OSS 120B&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;10.08&lt;/td&gt;\n&lt;td&gt;9.62&lt;/td&gt;\n&lt;td&gt;−4.6%&lt;/td&gt;\n&lt;td&gt;9.44&lt;/td&gt;\n&lt;td&gt;9.20&lt;/td&gt;\n&lt;td&gt;−2.5%&lt;/td&gt;\n&lt;td&gt;9.23&lt;/td&gt;\n&lt;td&gt;8.82&lt;/td&gt;\n&lt;td&gt;−4.5%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;List&lt;/td&gt;\n&lt;td&gt;7.62&lt;/td&gt;\n&lt;td&gt;4.71&lt;/td&gt;\n&lt;td&gt;−38.1%&lt;/td&gt;\n&lt;td&gt;1.93&lt;/td&gt;\n&lt;td&gt;0.06&lt;/td&gt;\n&lt;td&gt;−96.8%&lt;/td&gt;\n&lt;td&gt;7.84&lt; 4%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Persona&lt;/td&gt;\n&lt;td&gt;7.92&lt;/td&gt;\n&lt;td&gt;7.38&lt;/td&gt;\n&lt;td&gt;−6.8%&lt;/td&gt;\n&lt;td&gt;6.87&lt;/td&gt;\n&lt;td&gt;6.18&lt;/td&gt;\n&lt;td&gt;−10.0%&lt;/td&gt;\n&lt;td&gt;5.40&lt;/td&gt;\n&lt;td&gt;5.06&lt;/td&gt;\n&lt;td&gt;−6.3%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Seed&lt;/td&gt;\n&lt;td&gt;4.60&lt;/td&gt;\n&lt;td&gt;3.54&lt;/td&gt;\n&lt;td&gt;−23.0%&lt;/td&gt;\n&lt;td&gt;4.64&lt;/td&gt;\n&lt;td&gt;4.00&lt;/td&gt;\n&lt;td&gt;−13.9%&lt;/td&gt;\n&lt;td&gt;4.91&lt;/td&gt;\n&lt;td&gt;4.07&lt;/td&gt;\n&lt;td&gt;−17.1%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"bazalykh-modelder-men-taesilder\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#bazalykh-modelder-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базалық модельдер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Базалық модельдер мен тәсілдер&lt;/h4&gt;\n&lt;p&gt;Салыстыру үшін екі әдіс қолданылады. Біріншісі — «Naive IID» (тікелей сұрау). Екіншісі — «List prompting» (тізіммен сұрау). n үлгіні алу үшін &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20n%2Fk%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; шақыру орындалады. k мәндері (мәтіндер үшін 8, чат пен кескіндер үшін 32) &lt;span class=\"yfm-latex\" data-content=\"k%20%5Cin%20%5C%7B8%2C%2016%2C%2032%2C%2064%2C%20128%2C%20256%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; диапазонында эмпирикалық түрде таңдалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;k параметрін таңдау өте маңызды: ұзын мәтіндер үшін үлкен k мәндері модель сапасының төмендеуіне әкелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Әдістерді қосымша салыстыру&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Әдіс&lt;/th&gt;\n&lt;th&gt;Мәні 1&lt;/th&gt;\n&lt;th&gt;Мәні 2&lt;/th&gt;\n&lt;th&gt;Мәні 3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(A) Токендер емес, идеялар бойынша рандомизация&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;11.65&lt;/td&gt;\n&lt;td&gt;8.44&lt;/td&gt;\n&lt;td&gt;9.04&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Standardtokensampling(T=1)&lt;/td&gt;\n&lt;td&gt;2.54&lt;/td&gt;\n&lt;td&gt;5.45&lt;/td&gt;\n&lt;td&gt;3.26&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=10)&lt;/td&gt;\n&lt;td&gt;3.07&lt;/td&gt;\n&lt;td&gt;2.56&lt;/td&gt;\n&lt;td&gt;4.25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=20)&lt;/td&gt;\n&lt;td&gt;2.16&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;4.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=10)&lt;/td&gt;\n&lt;td&gt;1.79&lt;/td&gt;\n&lt;td&gt;0.03&lt;/td&gt;\n&lt;td&gt;5.02&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=20)&lt;/td&gt;\n&lt;td&gt;0.42&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;5.29&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(B) Санау мен таңдауды ажырату арқылы іріктеу&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;8.24&lt;/td&gt;\n&lt;td&gt;9.53&lt;/td&gt;\n&lt;td&gt;6.25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NoexternalRNG(LMselectschoicesfromitslist)&lt;/td&gt;\n&lt;td&gt;3.95&lt;/td&gt;\n&lt;td&gt;6.41&lt;/td&gt;\n&lt;td&gt;5.08&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Noenumeration(directlypromptLMfordecision)&lt;/td&gt;\n&lt;td&gt;4.58&lt;/td&gt;\n&lt;td&gt;6.38&lt;/td&gt;\n&lt;td&gt;4.42&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(C) Идеяларды авторегрессиялық жергілікті шешімдер ретінде іріктеу&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"prompt-c1-bazalykh-tizim-zhuejelik-suranys\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-c1-bazalykh-tizim-zhuejelik-suranys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt C.1: Базалық тізім (жүйелік сұраныс)&lt;/span&gt;&lt;/a&gt;Prompt C.1: Базалық тізім (жүйелік сұраныс)&lt;/h4&gt;\n&lt;p&gt;Әдіс пайдаланушы сұранысына k түрлі жауап генерациялауды көздейді. «Вербализацияланған таңдау» (Verbalized Sampling) іске асырылғанда, модель бір шақыру арқылы k жауаптың таралуын және олардың ықтималдығын бағалайды. n үлгіні алу үшін &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20n%2Fk%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; тәуелсіз шақыру жасалады. Модельдердің көпшілігі үшін k=8 (әңгімелер) және k=32 (чат/суреттер) қолданылады, бірақ Inkling моделі үшін барлық тапсырмаларда k=8 деп белгіленген. Шығармашылық жазуда 400 сөздік шектеу қойылады, әйтпесе модель қысқа үзінділермен шектеліп қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вербализацияланған таңдау — модельдің бірнеше жауап нұсқасын өзі қалыптастырып, оларға ықтималдық деңгейін белгілеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tikelej-zhosparlau-nietke-negizdelgen-generaciya\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#tikelej-zhosparlau-nietke-negizdelgen-generaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тікелей жоспарлау (ниетке негізделген генерация)&lt;/span&gt;&lt;/a&gt;Тікелей жоспарлау (ниетке негізделген генерация)&lt;/h4&gt;\n&lt;p&gt;Жауаптар екі кезеңде, екі бөлек &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; шақыруы арқылы қалыптасады. Бірінші кезеңде жоғары температурада (1,2) жоспар (кілт сөздер немесе идеялар) жасалады, екінші кезеңде стандартты температурада осы жоспар негізінде толық жауап жазылады. Әртүрлілік жоспарлардың вариативтілігі есебінен қамтамасыз етіледі.&lt;/p&gt;\n&lt;h4 id=\"persona-negizindegi-prompting\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#persona-negizindegi-prompting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Персона негізіндегі промптинг&lt;/span&gt;&lt;/a&gt;Персона негізіндегі промптинг&lt;/h4&gt;\n&lt;p&gt;Әр жауап Nemotron-Personas-USA деректер жиынтығынан таңдалған нақты рөл (персона) негізінде жасалады. Персоналар қайталанбай таңдалады, бұл жауаптардың тәуелсіздігіне кепілдік береді. Рөл тапсырмаға деген көзқарасты, бөлшектерді таңдауды және жауап құрылымын анықтайды, бұл ретте модель персонаның өзін сипаттамауы керек.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Персоналармен жұмыс істегенде модель жай ғана сөйлеу мәнерін өзгертпей, шешім қабылдаушы тұлға ретінде әрекет етуі тиіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"seed-prompting-ojlaugha-arnalghan-tukhym\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#seed-prompting-ojlaugha-arnalghan-tukhym\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Seed Prompting (ойлауға арналған «тұқым»)&lt;/span&gt;&lt;/a&gt;Seed Prompting (ойлауға арналған «тұқым»)&lt;/h4&gt;\n&lt;p&gt;Бұл әдісте 24 таңбалы кездейсоқ ASCII жолы қолданылады, ол модельдің стохастикалық шешімдері үшін «тұқым» (seed) қызметін атқарады. Модель бұл жолды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-43x87gfv\"&gt;&amp;lt;random_string&amp;gt;&lt;/code&gt; тегтерінде шығаруы, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7i0wxaov\"&gt;&amp;lt;reasoning&amp;gt;&lt;/code&gt; тегтерінде пайымдау жүргізуі және қорытынды жауапты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e4q9a7kq\"&gt;&amp;lt;answer&amp;gt;&lt;/code&gt; тегтерінде ұсынуы шарт. Бұл жалғыз жауаптың бірегейлігі мен әртүрлілігін қамтамасыз етеді.&lt;/p&gt;\n&lt;h4 id=\"modelderdi-tangdau-zhaene-generaciya-parametrleri\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#modelderdi-tangdau-zhaene-generaciya-parametrleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельдерді таңдау және генерация параметрлері&lt;/span&gt;&lt;/a&gt;Модельдерді таңдау және генерация параметрлері&lt;/h4&gt;\n&lt;p&gt;Тәжірибелерде Qwen3.5, GPT-OSS, Inkling, Gemma4 отбасылары, сондай-ақ gpt-5.5 және claude-opus-4-8 API модельдері қолданылды. Таңдау параметрлері (5-кесте) ашық салмақты модельдер үшін әзірлеушілердің ұсыныстарына сәйкес келеді, ал барлық модельдер үшін T=1.0 температурасы белгіленді. API модельдері үшін провайдерлердің стандартты параметрлері қолданылды. Inkling және GPT-OSS модельдері сәйкесінше NVFP4 және MXFP4 форматтарында, ал қалғандары BF16 форматында жұмыс істеді. Барлық есептеулер &lt;a href=\"concepts/sglang.html\"&gt;SGLang&lt;/a&gt; фреймворкінің көмегімен H200 түйінінде жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SGLang — бұл тілдік модельдерді тиімді орындауға, жад пен генерация жылдамдығын оңтайландыруға арналған арнайы фреймворк.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modelderdi-baghalau\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#modelderdi-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельдерді бағалау&lt;/span&gt;&lt;/a&gt;Модельдерді бағалау&lt;/h4&gt;\n&lt;p&gt;Бағалаушы (LM judge) ретінде «ойлау» қабілеті бар Qwen3.6-27B моделі таңдалды. Чат сапасын бағалау үшін InfinityChat деректер жиынтығы қолданылды, онда жауаптардың жарамдылығы арнайы промпт (Prompt C.8) арқылы тексерілді. Бағалау критерийлері нақты шектеулерді сақтауды, нақты деректердің дұрыстығын және мәтіннің үйлесімділігін қамтиды.&lt;/p&gt;\n&lt;p&gt;Шығармашылық жазу қабілетін бағалау үшін Wildchat-тан &lt;a href=\"concepts/filtratsiya.html\"&gt;сүзгіден өткізу&lt;/a&gt; және қолмен тексеру арқылы 50 сұраныстан тұратын жиынтық қалыптастырылды. Мәтіндердің әртүрлілігі 8 семантикалық ось (жанр, орта, үн, баяндаушы, сюжет, финал эмоциясы, бейнелер, басты кейіпкер) бойынша аннотацияланып, орташа Vendiscore көрсеткіші арқылы өлшенді. Сапа EQ-Bench көмегімен бағаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сапаны бағалау нұсқаулықтарды қатаң сақтауға және баяндаудың 8 негізгі параметрі бойынша өлшенетін семантикалық әртүрлілікке негізделген.&lt;br /&gt;\n[!warning] LM-төрешіні пайдалану бағалаулардың төреші модельдің күрделі шығармашылық тапсырмаларды бейтарап түсіндіру қабілетіне тәуелді екенін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prompt-c10-shygharmashylykh-zhazu-sapasyn-baghalau-eq-bench-rubrikasy\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-c10-shygharmashylykh-zhazu-sapasyn-baghalau-eq-bench-rubrikasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt C.10: Шығармашылық жазу сапасын бағалау (EQ-Bench рубрикасы)&lt;/span&gt;&lt;/a&gt;Prompt C.10: Шығармашылық жазу сапасын бағалау (EQ-Bench рубрикасы)&lt;/h4&gt;\n&lt;p&gt;Шығармашылық қабілеттерді бағалау үшін тілдік модельді сарапшы-сыншыға айналдыратын арнайы промпт қолданылады. Модель мәтінді 0 мен 20 аралығындағы шкала бойынша 10 критерий, соның ішінде креативтілік, бейнелілік, кейіпкерлерді терең ашу, эмоционалдық байлық және стиль бойынша бағалауы тиіс. Маңызды шарт — әңгіме аяқталғаннан кейін модель қосқан кез келген түсініктемелерді елемеу. Егер модель толыққанды әңгіме орнына қысқаша сипаттама берсе, ол барлық критерийлер бойынша ең төменгі балл алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдістеме шығармашылық жазуды субъективті бағалауды стандарттайды және төреші-модельден JSON форматында балл қояр алдында егжей-тегжейлі талдау жасауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prompt-c11-shygharmashylykh-zhazu-tapsyrmalarynyng-uelgileri-wildchat-zhinaghynan\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-c11-shygharmashylykh-zhazu-tapsyrmalarynyng-uelgileri-wildchat-zhinaghynan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt C.11: Шығармашылық жазу тапсырмаларының үлгілері (WildChat жинағынан)&lt;/span&gt;&lt;/a&gt;Prompt C.11: Шығармашылық жазу тапсырмаларының үлгілері (WildChat жинағынан)&lt;/h4&gt;\n&lt;p&gt;Авторлар 50 тапсырма үлгісін таңдап алды, олар әзіл-қалжың әңгімелерден (мысалы, Австралияға барған мысықтар) бастап фэнтези сюжеттеріне дейінгі тақырыптарды қамтиды. Бұл тапсырмалар модельдің жүйелі және түпнұсқалық баяндаулар жасау қабілетін тексеру үшін эталон ретінде қызмет етеді.&lt;/p&gt;\n&lt;h4 id=\"keskin-generaciyasy-zhaene-prompttardy-suezu\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#keskin-generaciyasy-zhaene-prompttardy-suezu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескін генерациясы және промпттарды сүзу&lt;/span&gt;&lt;/a&gt;Кескін генерациясы және промпттарды сүзу&lt;/h4&gt;\n&lt;p&gt;Кескін генерациясын бағалау үшін OneIG-Bench жинағы қолданылады. Ашық (көпмағыналы) сұраныстарды бөліп алу үшін үш кезеңді сүзу қолданылады. Біріншіден, мәтінді рендерингтеуді немесе қатаң логикалық пайымдауды талап ететін санаттар алынып тасталады. Содан кейін тілдік модель (LM-judge) қалған промпттарды классификациялап, жабық тапсырмаларды алып тастайды. Соңғы кезеңде модель ең ашық 50 промптты таңдап алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/open-ended.html\"&gt;Ашық промпт&lt;/a&gt; (open-ended) — бұл визуалды интерпретацияның көптеген нұсқаларына жол беретін сұраныс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рендеринг үшін Qwen-Image-2512 моделі 30 шуды тазарту қадамы (denoising steps), 4.0 CFG шкаласы және 1328×1328 пиксель рұқсатында қолданылады. Нәтижелердің әртүрлілігі DreamSim метрикасы арқылы бағаланады.&lt;/p&gt;\n&lt;h4 id=\"tapsyrmagha-sholu-akhuyz-bajlanystyrghyshtaryn-zhobalau\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#tapsyrmagha-sholu-akhuyz-bajlanystyrghyshtaryn-zhobalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тапсырмаға шолу: ақуыз байланыстырғыштарын жобалау&lt;/span&gt;&lt;/a&gt;Тапсырмаға шолу: ақуыз байланыстырғыштарын жобалау&lt;/h4&gt;\n&lt;p&gt;Зерттеу Gacha Decoding әдісін ақуыз байланыстырғыштарын (protein binders) жасау процесінде LM генерацияларын диверсификациялау үшін басқа әдістермен салыстырады. Модельге әртүрлі интерфейс конфигурациялары бар үміткерлер үшін сипаттамалар жинағын жасау тапсырылады. Содан кейін ақуыз генерациясы моделі бұл сипаттамаларды физикалық құрылымдарға айналдырады. Тиімділік интерфейс сенімділігі және сәтті дизайнның құрылымдық әртүрлілігі арқылы бағаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ақуыз сапасын бағалау болжамды модельдер негізінде жүзеге асырылады, бұл зертханалық жағдайда эксперименталды тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"makhsatty-ystykh-nuekteler-zhaene-bajlanystyrushy-molekulalardyng-uzyndyghy\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#makhsatty-ystykh-nuekteler-zhaene-bajlanystyrushy-molekulalardyng-uzyndyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мақсатты «ыстық нүктелер» және байланыстырушы молекулалардың ұзындығы&lt;/span&gt;&lt;/a&gt;Мақсатты «ыстық нүктелер» және байланыстырушы молекулалардың ұзындығы&lt;/h4&gt;\n&lt;p&gt;Зерттеуде сегіз эталондық нысана (BHRF1, IFNAR2, PD1, TrkA, PDL1, DerF21, IL7RA, VEGFA) қарастырылады, олар үшін байланысу сайттары анықталған (6-кесте). Әрбір нысана үшін негізгі қалдықтар («ыстық нүктелер») және байланыстырушы ақуыздың ұзындық диапазоны (50-ден 185 аминқышқылына дейін) белгіленген. Біз әр әдіс үшін 1024 генерация көмегімен GPT-5.5 моделі арқылы байланыстырушы молекулаларға сипаттамалар (кэпшендер) жасаймыз. Маңыздысы, «ыстық нүктелер» туралы ақпарат құрылымды генерациялау моделіне беріледі, бірақ тілдік модельге (LM) емес, өйткені алдын ала жүргізілген тесттер бұл мәліметтерді мәтіндік промптқа қосу тиімділікті төмендететінін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ұзындықтың арнайы диапазондарын пайдалану және «ыстық нүктелер» туралы ақпаратты мәтіндік промпттан алып тастау байланыстырушы ақуыздарды генерациялауда жоғары дәлдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Салыстыру әдістері ретінде Gacha Decoding (7 шешім қабылдау қадамы, әр қадамда 16 нұсқа), тікелей іріктеу, листинг-промптинг және вербализацияланған іріктеу (соңғы екеуі үшін k=32) қолданылады. Салыстыру әділ болуы үшін барлық әдістерде байланыстырушы молекулалардың бірдей кездейсоқ ұзындық мәндері қолданылады.&lt;/p&gt;\n&lt;h4 id=\"bajlanystyrushy-molekulalar-sipattamalaryn-baghalau\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#bajlanystyrushy-molekulalar-sipattamalaryn-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланыстырушы молекулалар сипаттамаларын бағалау&lt;/span&gt;&lt;/a&gt;Байланыстырушы молекулалар сипаттамаларын бағалау&lt;/h4&gt;\n&lt;p&gt;Сапаны бағалау үшін жасалған сипаттамалар ақуыз құрылымын генерациялаушы модельге (Lee et al., 2026) беріледі. Модель өңдеудің екі жолын пайдаланады: қабаттарды бейімделгіш қалыпқа келтіру арқылы жаһандық кондиционерлеу үшін Qwen-3-Embedding-8B және нәзік интерфейстік өзара әрекеттесулерді ескеруге мүмкіндік беретін токен деңгейіндегі көріністер үшін Qwen-3-8B. Генерация процесі классификаторсыз басқарумен (classifier-free guidance) 400 Эйлер-Маруяма қадамын қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ipSAEmin — бұл болжамды туралау қателігінің метрикасы (0-ден 1-ге дейін), мұнда 0,5-тен жоғары мәндер байланысу интерфейсінің сәтті қалыптасқанын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Байланысуды тексеру үшін біз ESMFold2-Fast қолданамыз және ipSAEmin көрсеткішін есептейміз. Дизайн ipSAEmin &amp;gt; 0,5 болғанда сәтті деп саналады. Сәтті нұсқалардың әртүрлілігі Foldseek алгоритмі көмегімен TM-score (0-ден 1-ге дейін) арқылы бағаланады. Қорытынды Vendi score көрсеткіші әр нысана үшін құрылымдық жағынан ерекшеленетін байланыстырушы молекулалардың тиімді санын көрсетеді.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 4.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-tT4.jpg\" alt=\"Кесте 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f5.jpg\" alt=\"Сурет 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 5&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қуатты ЖИ шыға&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рмашылығының&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;төмендеуі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сыртқы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кездейсоқтық&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арқылы идея&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;таңдау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әртүрліліктің&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;2.4 есе өсуі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нұсқаулықтар&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;токен&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ықтималдығынан&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маңызды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Scott Geng, Yufei Zhang, Joseph Lee, Jerry Li, Marjan Ghazvininejad, Pang Wei Koh&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidd
