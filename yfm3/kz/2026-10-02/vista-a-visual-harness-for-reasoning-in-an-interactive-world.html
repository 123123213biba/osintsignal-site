        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"102\" cy=\"63\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"578\" cy=\"293\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;VISTA: нейрожелілерді&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;көргенін «есте сақтауға»&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;үйрету&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f2.jpg\" alt=\"2-сурет: ARC-AGI-3 (сол жақта) және GameWorld (оң жақта) орталарындағы VISTA траекториялары. Интерфейс агентке визуалды \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: &lt;a href=\"concepts/arc-agi-3.html\"&gt;ARC-AGI-3&lt;/a&gt; (сол жақта) және GameWorld (оң жақта) орталарындағы &lt;a href=\"concepts/visual-harness-for-reasoning.html\"&gt;VISTA&lt;/a&gt; траекториялары. Интерфейс агентке визуалды күйлерді тікелей бақылауға, табиғи тілде пайымдауға және қажет болған жағдайда өзінің шығынсыз визуалды жадын бастапқы егжей-тегжейлі деңгейде тексеруге мүмкіндік береді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;MIT зерттеушілері VISTA жүйесін ұсынды, ол мультимодальды модельдерге «ұзақ» визуалды жад береді. Сығылған және толық емес деректердің орнына агент өзара әрекеттесудің барлық кадрларын бастапқы сапада сақтайды. Бұл модельге қателерді талдау және стратегияны жоспарлау үшін өткен оқиғаларға қайта оралуға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;VISTA барлық визуалды кадрларды сығусыз сақтайды, бұл шешім қабылдау үшін маңызды бөлшектердің жоғалуына жол бермейді.&lt;/li&gt;\n&lt;li&gt;Модель өткен кадрларды белсенді сұрай және салыстыра алады, бұл қателерді нақты уақытта түзетуге көмектеседі.&lt;/li&gt;\n&lt;li&gt;ARC-AGI-3 бенчмаркінде жүйе 100% тиімділік көрсетіп, адамдардың нәтижелерін әрекет саны бойынша 57,4%-ға артта қалдырды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;VISTA (Visual &lt;a href=\"concepts/harness.html\"&gt;Harness&lt;/a&gt; for Reasoning) мультимодальды модельдердегі (&lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt;) контекст жоғалуы мәселесін шешеді, өйткені олар әдетте кескіндерді тек бір рет кодтайды. Визуалды ақпарат контекст терезесі толғанда сығылатын немесе өшірілетін стандартты әдістерден айырмашылығы, VISTA «жоғалтусыз визуалды жад» (&lt;a href=\"concepts/lossless-visual-memory.html\"&gt;lossless visual memory&lt;/a&gt;) жасайды. Жүйе әр кадрды уақыт пен әрекет бойынша индекстейді, бұл модельге ортаның өткен күйлерін егжей-тегжейлі талдау үшін итеративті «визуалды сұраулар» (&lt;a href=\"concepts/vizualnaya-inspektsiya.html\"&gt;visual tool calls&lt;/a&gt;) орындауға мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;ARC-AGI-3 &lt;a href=\"concepts/benchmark.html\"&gt;бенчмарк&lt;/a&gt; тестілерінде VISTA-мен жабдықталған Claude Opus 5.0 моделі әрекет тиімділігінің идеалды көрсеткішіне (&lt;a href=\"concepts/relative-human-action-efficiency.html\"&gt;RHAE&lt;/a&gt; 100.00) қол жеткізді және тапсырмаларды жаңадан бастаған адамдарға қарағанда 57,4%-ға үнемді орындады. Жүйе 25 ARC-AGI-3 ойынында, сондай-ақ GameWorld, AI GameStore және BabyVision сияқты платформаларда сыналды. VISTA күрделі бағдарламалауды қажет етпейді және модельге келесі шешімді қабылдамас бұрын өз әрекеттерінің тарихын дербес «қарап шығуға» мүмкіндік беретін қосымша құрал ретінде жұмыс істейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйенің тиімділігі тікелей қолданылатын мультимодальды модельдің мүмкіндіктеріне және кадрларды сақтауға арналған жедел жад көлеміне байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Біз қазіргі заманғы мультимодальды модельдердің логикалық қорытынды жасау әлеуеті жоғары екенін, алайда интерактивті ортада тапсырмаларды орындау үшін оларға арнайы құрал қажет екенін көрсетеміз. Біз VISTA жүйесін ұсынамыз — бұл мультимодальды модельдерге ұзақ мерзімді визуалды жоспарлау мүмкіндігін беретін визуалды интерфейс. VISTA модельге қоршаған ортаны визуалды бақылау арқылы тікелей қабылдауға мүмкіндік береді және өткен барлық бақылауларды бастапқы күйінде сақтайтын жоғалтусыз визуалды жадты қамтамасыз етеді. Модель бұл деректерді белсенді түрде қалпына келтіріп, ойлау процесінде визуалды контекстті қайта құра алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA мультимодальды модельді ұзақ мерзімді визуалды жады бар агентке айналдырып, күрделі тапсырмаларда мінсіз тиімділікке қол жеткізуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ARC-AGI-3 бенчмаркіндегі сынақтарда VISTA жүйесі Claude Opus 5.0 моделіне адам әрекетінің салыстырмалы тиімділігі (Relative Human Action Efficiency) көрсеткішін 40,68-ден 100,00 ұпайға дейін арттыруға мүмкіндік берді. Модель барлық 25 ашық ойын сценарийін сәтті аяқтап, бұл ретте алғаш рет ойнап отырған адамдарға қарағанда 57,4%-ға аз әрекет жұмсады. Архитектурасының қарапайымдылығы арқасында VISTA әртүрлі визуалды орталарға минималды өзгертулермен оңай бейімделеді. Әртүрлі визуалды жұмбақтар мен ойындарды қамтитын қосымша үш деректер жиынындағы сынақтар VISTA-ның стандартты интеграция әдістерін қолданатын базалық модельдерден айтарлықтай басым екенін растады. Біздің нәтижелеріміз VISTA-ның күрделі визуалды ортада мультимодальды агенттерді дамыту үшін тиімді шешім екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/multimodalnaya-model.html\"&gt;Мультимодальды модель&lt;/a&gt; — бұл мәтін мен кескін сияқты әртүрлі деректер түрлерін бір уақытта өңдеуге және салыстыруға қабілетті нейрондық желі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"b-multimodaldy-agent\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#b-multimodaldy-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(b) Мультимодальды агент&lt;/span&gt;&lt;/a&gt;(b) Мультимодальды агент&lt;/h4&gt;\n&lt;p&gt;Қазіргі мультимодальды модельдер контексттік терезенің шектеулілігіне байланысты визуалды бақылауларды жоюға немесе оларды мәтіндік сипаттамалармен алмастыруға мәжбүр болады. Бұл ұзақ мерзімді өзара әрекеттесу кезінде модельдердің пайымдау қабілетін шектейді. Осы мәселені шешу үшін біз VISTA жүйесін ұсынамыз — бұл модельге визуалды деректерді белсенді түрде басқаруға мүмкіндік беретін визуалды қабықша (1c-сурет). Модель нысандардың сыртқы түрі мен кеңістіктік қатынастарын сақтайтын визуалды бақылауларды қабылдайды және оларды кейінгі әрекеттерді жоспарлау үшін пайдаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA «жоғалтусыз визуалды жадты» қамтамасыз етеді, онда ортадан алынған барлық кадрлар, соның ішінде аралық анимациялар да бастапқы күйінде сақталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Визуалды кескіндерді сығып, сапасын жоғалтатын стандартты тәсілдерден айырмашылығы, VISTA әр кадрды сақтап қалады. Модель өзінің пайымдау қажеттіліктеріне қарай әртүрлі деңгейдегі егжей-тегжейлермен кадрларды салыстыра алады немесе белгілі бір аймақтарды тексере алады (2-сурет). Claude Opus 5.0-мен бірге VISTA жүйесі ARC-AGI-3 жиынтығындағы барлық 25 ойынды сәтті аяқтап, адам әрекетінің салыстырмалы тиімділігі (RHAE) көрсеткішін 100.00-ге жеткізді, бұл ретте адамның базалық деңгейіне қарағанда 57.4%-ға аз әрекет жұмсалды. GPT-5.6 Sol моделі де VISTA-мен барлық 25 ойынды 99.00 RHAE ұпайымен аяқтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RHAE (Relative Human Action Efficiency) — агенттің адаммен салыстырғанда тапсырманы қаншалықты тиімді орындағанын өлшейтін метрика.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Салыстыру үшін: бағдарламалаусыз ресми базалық шешімдер RHAE бойынша небәрі 40.68 (Opus 5.0) және 13.33 (GPT-5.6 Sol) ұпайларын көрсетеді. VISTA өзінің қарапайымдылығының арқасында GameWorld-тағы 34 ойынға, AI GameStore-дағы 10 ойынға және BabyVision-дегі 39 визуалды бақылау мәселелеріне сәтті қолданылды. Жүйе базалық модельдерден айтарлықтай басым түседі және әртүрлі визуалды орталарда жоғары тиімділікті көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"zertteulerge-sholu\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#zertteulerge-sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеулерге шолу&lt;/span&gt;&lt;/a&gt;Зерттеулерге шолу&lt;/h4&gt;\n&lt;p&gt;ARC-AGI-1 және ARC-AGI-2 бенчмарктері статикалық торлардағы дерексіз ойлауды бағалайды. Қазіргі әдістер тілдік модельдерді немесе компьютерлік көру жүйелерін қолданады. Интерактивті ARC-AGI-3 бенчмаркінде агент жаңа ортаға бейімделуі тиіс. Қолданыстағы тәсілдер бағдарламалық синтезге сүйенеді: агент ортаны таңбалық түрге ауыстырып, орындалатын код жасайды. Алайда, визуалды күрделі ортада бұл қиындайды. VISTA болса, визуалды деректермен тікелей жұмыс істейді.&lt;/p&gt;\n&lt;p&gt;Компьютерлік агенттер саласында мәтіндік (HTML/DOM) және визуалды (скриншоттар) тәсілдер бар. VISTA екінші түрге жатады және таңбалық делдалдарды қажет етпейді. Ойын агенттері (Voyager, JARVIS-1, SIMA) визуалды ақпаратты пайдаланады, бірақ олардың басты мәселесі — визуалды контекстің шектеулілігі. VISTA барлық өзара әрекеттесу тарихын жоғалтпай сақтайды, бұл агентке кез келген өткен кадрға қайта оралуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA визуалды тарихты толық сақтау арқылы агентке өткен деректерді қайта қарауға мүмкіндік береді, бұл шектеулі контексті жүйелерден басым түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vista-vizualdy-bajlanystyru\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#vista-vizualdy-bajlanystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VISTA: Визуалды байланыстыру&lt;/span&gt;&lt;/a&gt;VISTA: Визуалды байланыстыру&lt;/h4&gt;\n&lt;p&gt;Қолданыстағы жүйелер визуалды деректерді бір рет кодтап, оларды тастап жібереді немесе мәтіндік түйіндемелермен алмастырады. Бұл маңызды детальдардың жоғалуына әкеледі. VISTA болса, бастапқы бақылауларды «жоғалтпайтын визуалды жадта» сақтайды және оларды тексеру құралдарын ұсынады.&lt;/p&gt;\n&lt;h4 id=\"vizualdy-bajlanystyru-komponentteri\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#vizualdy-bajlanystyru-komponentteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Визуалды байланыстыру компоненттері&lt;/span&gt;&lt;/a&gt;Визуалды байланыстыру компоненттері&lt;/h4&gt;\n&lt;p&gt;Жүйе үш негізгі бөліктен тұрады: визуалды бақылаулар, жоғалтпайтын жад және визуалды тексеру.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Визуалды бақылаулар (3a-сур.): агент нысандардың кеңістіктік қатынастарын сақтайтын кескіндерді алады.&lt;/li&gt;\n&lt;li&gt;Жоғалтпайтын жад (3b-сур.): әрбір кадр, соның ішінде аралық анимациялар, индекстеледі және модель контекстінен тәуелсіз сақталады.&lt;/li&gt;\n&lt;li&gt;Визуалды тексеру (3c-сур.): агент кез келген кадрдың үлкейтілген бөлігін сұрай алады немесе әртүрлі уақыт кезеңдерін салыстыра алады. Модель қашан және нені тексеруді өзі шешеді.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Визуалды тексеру — бұл модельге бүкіл өзара әрекеттесу тарихынан қажетті детальдарды таңдап алуға мүмкіндік беретін «белсенді назар» механизмі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhumys-uerdisi-pipeline\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#zhumys-uerdisi-pipeline\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жұмыс үрдісі (Pipeline)&lt;/span&gt;&lt;/a&gt;Жұмыс үрдісі (Pipeline)&lt;/h4&gt;\n&lt;p&gt;Модель мен орта арасындағы өзара әрекеттесу көп сатылы диалог арқылы жүзеге асады (2-сурет). Механикалық интерфейс (harness) өздігінен шешім қабылдамайды: ол тек модельдің сұраныстарын орындайды, визуалды деректерді (кескіндер немесе пиксель мәндері) қайтарады және қателер туралы хабарлайды. Агент осы деректерді талдап, қажет болған жағдайда жаңа сұраныстар жібереді. Әр ойын барысында бір агент жұмыс істейді, ал бір ойын қадамы соңғы әрекетке дейін интерфейспен бірнеше рет алмасуды қамтуы мүмкін (3d-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/pipeline.html\"&gt;Жұмыс үрдісі&lt;/a&gt; (pipeline) — бұл модель деректерді алып, өңдеп және ортада әрекеттерді орындайтын автоматтандырылған қадамдар тізбегі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әр қадамның басында агент визуалды күйді және қолжетімді әрекеттер тізімін алады. Ол екі мәтіндік файлды пайдалана алады: GUIDE.md (ойын туралы ұзақ мерзімді білімдер үшін) және WORKING.md (ағымдағы күйге арналған шимай дәптер). &lt;a href=\"concepts/inspect.html\"&gt;Inspect&lt;/a&gt; құралдары өткен кадрларды қарап шығуға, ал readpixels таңдалған аймақтағы пиксель мәндерін талдауға мүмкіндік береді. Агент бұл құралдарды пайдалануды өз бетінше шешеді. Жоспарлау процесі табиғи тілдегі пайымдауларды, нәтижені болжауды және жазбаларды жаңартуды қамтиды. Play командасы қадамды аяқтап, ойынды келесі кезеңге өткізеді. Контекст шегі таусылғанда, агент қысқаша түйіндеме (handoff) жасайды және жаңа контекстте жұмысты жалғастырады, бұл ретте жазбалар, визуалды жады және әрекеттер тарихы сақталады.&lt;/p&gt;\n&lt;h4 id=\"baptau\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#baptau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Баптау&lt;/span&gt;&lt;/a&gt;Баптау&lt;/h4&gt;\n&lt;p&gt;ARC-AGI-3 деректер жинағы 25 интерактивті визуалды ойынды қамтиды, олардың ережелері нақты көрсетілмеген. Агент заңдылықтарды, жасырын күйлерді және мақсаттарды өз бетінше анықтауы керек. Әр ойын деңгейлерден тұрады, онда негізгі механика сақталады, бірақ объектілер мен шектеулер күрделене түседі. Агент траекториясының мысалы 4-суретте көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тиімділік RHAE метрикасымен өлшенеді: адам көрсеткішімен тең болса 100%, аз әрекетпен орындалса 115%-ға дейін, орындалмаса 0%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тиімділік Relative Human Action Efficiency (RHAE) арқылы өлшенеді. Егер агенттің әрекеттер саны адамның базалық көрсеткішіне сәйкес келсе, деңгей 100% деп бағаланады, ал тиімдірек болса 115%-ға дейін баға алады. Аяқталмаған деңгейлер 0 ұпай алады. Ойынның жалпы ұпайы аяқталған деңгейлердің салмақталған үлесімен шектелген, мұнда кейінгі кезеңдер көбірек салмаққа ие. Модель ретінде Claude Opus 5.0 (Claude Code &lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt; арқылы) және GPT-5.6 Sol (Codex CLI арқылы) қолданылады.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"system-program-model-effort-rhae\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#system-program-model-effort-rhae\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;System Program Model Effort RHAE&lt;/span&gt;&lt;/a&gt;System Program Model Effort RHAE&lt;/h4&gt;\n&lt;p&gt;ARC-AGI-3 (25 ашық ойын) деректер жиынтығында жүйелердің тиімділігін бағалау барысында әртүрлі тәсілдер сыналды. Ресми іске асыру GPT-5.6 Sol моделімен (max деңгейі) 13.33% нәтиже көрсетеді. Schema схемасын қолдану көрсеткішті 95.35%-ға дейін арттырады, ал Opus 5.0 және Fable 5 комбинациясы 98.98%-ға жетеді. ewmasvv1.6, Retrodict және Tycho модельдері сәйкесінше 98.97%, 99.86% және 100.00% нәтижелерді көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA жүйесі ARC-AGI-3-те 100.00% RHAE көрсеткішіне қол жеткізеді, бұл ресми іске асырудан (40.68%) әлдеқайда жоғары және адамның іс-әрекетінен 57.4%-ға аз қимыл талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vista\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#vista\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VISTA&lt;/span&gt;&lt;/a&gt;VISTA&lt;/h4&gt;\n&lt;p&gt;1-кестеде көрсетілгендей, VISTA жүйесі GPT-5.6 Sol моделімен 99.00%, ал Opus 5.0 моделімен 100.00% нәтиже береді. Визуалды деректерді мәтіндік торларға айналдырып, кодқа негізделген әлем моделін қолданатын көптеген заманауи жүйелерден айырмашылығы, VISTA бағдарламалық синтезсіз жұмыс істейді. Бұл бағдарламалық синтезсіз осындай жоғары нәтижеге қол жеткізген алғашқы жүйе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RHAE (Relative Human Action Efficiency) — агенттің адам іс-әрекетіне қатысты тиімділігін бағалайтын метрика: пайыз неғұрлым жоғары болса, шешім соғұрлым дәл, ал іс-әрекет саны неғұрлым аз болса, тиімділік соғұрлым жоғары болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-кесте мен 6-суретте әдістер салыстырылған. Мәтіндік торлардың орнына визуалды бақылауды (pixel readout) қолдану іс-әрекет санын 9,126-ға дейін (мәтіндік түрдегі 10,614-ке қарағанда) қысқартуға және токендер шығынын 71.9 миллионнан 30.7 миллионға дейін азайтуға мүмкіндік береді. Жақсартулардың кезең-кезеңімен енгізілуі визуалды пикселді оқу және жоғалтусыз жадты қолдану RHAE көрсеткішін 13.33%-дан 99.00%-ға дейін арттыруда шешуші рөл атқаратынын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"ablyaciyalar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#ablyaciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абляциялар&lt;/span&gt;&lt;/a&gt;Абляциялар&lt;/h4&gt;\n&lt;p&gt;Барлық тәжірибелерде максималды пайымдау күші мен 200 мың токендік контекст лимиті бар GPT-5.6 Sol моделі қолданылды. Агент 64 × 64 кадрларды 8 есе үлкейту арқылы алынған 512 × 512 PNG кескіндерін қабылдады.&lt;/p&gt;\n&lt;p&gt;VISTA компоненттерінің тиімділігі. Біз GPT-5.6 Sol моделін әртүрлі конфигурацияларда салыстырдық (5-сурет). Мәтіндік торларды қолданатын ресми шешім 13,33 RHAE ұпайын көрсетеді. Мәтіндік торларды PNG кескіндерімен алмастыру нәтижені 47,32-ге дейін көтерді. Уақыт пен әрекет лимиттерін арттыру нәтижені 51,66-ға жеткізді. Контекстті ықшамдау және тұрақты диалогты енгізу ұпайды 65,82-ге, ал ойынды модельдеу бойынша нұсқаулықтарды қосу 70,05-ке дейін өсірді. Визуалды жад пен модель инспекциясын қосу (v) нәтижені 94,10-ға, ал пикселдерді дәл оқу (vi) 99,00-ге жеткізді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA визуалды құралдарын кезең-кезеңімен енгізу RHAE көрсеткішін 13,33-тен 99,00-ге дейін арттырып, визуалды талдаудың мәтіндік торлардан артықшылығын дәлелдеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кескіндер бойынша пайымдау. VISTA мәтіндік торлардан айырмашылығы, тікелей рендерингтелген кескіндермен жұмыс істейді. Мәтіндік торлар өте көп токен талап етеді (әр кадр үшін 4000-ға жуық, VISTA үшін 308). Ойын барысындағы токен шығыны мәтіндік торларда 71,9 млн, ал VISTA-да 30,7 млн-ды құрайды.&lt;/p&gt;\n&lt;p&gt;Контекст көлемінің әсері. 7a-суретте көрсетілгендей, 200 мың токендік стандартты лимит 99,00 RHAE ұпайын береді. 780 мыңға дейін арттыру шығынды 105,7 млн токенге дейін көтереді, ал 100 мыңға дейін азайту RHAE-ді небәрі 0,4-ке төмендетеді.&lt;/p&gt;\n&lt;p&gt;Кескін масштабының әсері. 2×, 4×, 8× және 16× масштабтары сыналды (7b-сурет). 4× масштаб 8×-ке қарағанда 75%-ға аз токен жұмсайды. 2× масштаб нәтижені нашарлатады, ал 16× қосымша пайда әкелмейді.&lt;/p&gt;\n&lt;p&gt;Біз VISTA-ны ашық GLM-5.3 Flash 320B моделімен сынадық (8-сурет). VISTA 66,93 RHAE ұпайына қол жеткізіп, ресми шешімнен (1,89) және визуалды құралдарсыз нұсқадан (13,27) айтарлықтай озып кетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — жүйенің жекелеген бөліктерін өшіріп, олардың жалпы нәтижеге қосқан үлесін бағалау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"agent-khorytyndylar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#agent-khorytyndylar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агент: қорытындылар&lt;/span&gt;&lt;/a&gt;Агент: қорытындылар&lt;/h4&gt;\n&lt;p&gt;Модель нысандардың бағытын олардың қырларындағы белгілерді талдау арқылы сәтті анықтайды. 10-суретте көрсетілгендей, агент картаны қалпына келтіру үшін визуалды жадты пайдаланады, алдыңғы 22 жүрістен төрт кадрды шығарып алады және жергілікті бөлшектерді 13 есе үлкейту үшін «инспекция» функциясын қолданады. Сынақтарда жүйе 20 640 әрекетпен 84,12 RHAE ұпайына жетеді және мәтіндік базалық модельдерден айтарлықтай озып түседі, бұл VISTA-ның күрделі визуалды көріністерге төзімділігін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA кеңістікті қалпына келтіру және нысандарды егжей-тегжейлі талдау үшін визуалды жадты пайдаланып, стандартты мәтіндік модельдерден жоғары тиімділік көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sapalykh-taldau\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#sapalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сапалық талдау&lt;/span&gt;&lt;/a&gt;Сапалық талдау&lt;/h4&gt;\n&lt;p&gt;VISTA-ның негізгі механизмдері — бұл жоғалтусыз визуалды жад және инспекция функциясы, олар өзара әрекеттесу тарихына нақты назар аударуды қамтамасыз етеді. 10а-сурет картаны қалпына келтіру үшін әртүрлі уақыт нүктелерінен алынған ақпаратты біріктіруді, ал 10б-сурет бөлшектерді нақтылау үшін 512×512 пиксельді аймақты үлкейтуді көрсетеді. Бұл құралдар агентке визуалды дәлелдерді біріктіруге және нысандарды қажетті деңгейде зерттеуге мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Инспекция» (inspect) механизмі — бұл модельге бағдарламалық түрде кескін бөліктерін «жақындатып», бастапқы ажыратымдылықта көрінбейтін ұсақ бөлшектерді талдауға мүмкіндік беретін функция.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhalpy-vizualdy-ortalar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#zhalpy-vizualdy-ortalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы визуалды орталар&lt;/span&gt;&lt;/a&gt;Жалпы визуалды орталар&lt;/h4&gt;\n&lt;p&gt;VISTA-ның әмбебаптығы оны GameWorld (34 ойын, 170 тапсырма), AI GameStore (10 ойын) және BabyVision (388 статикалық тапсырма) сияқты жүйелерде сынап көруге мүмкіндік берді. GameWorld-та агент пернетақта мен тінтуір интерфейсін пайдаланады, табыс орындалған тапсырмалар үлесі (SR) және прогресс (PG) арқылы өлшенеді. AI GameStore-да нәтижелер адамның медиандық көрсеткіштеріне (100 деп қабылданған) қатысты қалыпқа келтіріледі. BabyVision-да 39 визуалды бақылау тапсырмасын шешу дәлдігі бағаланады.&lt;/p&gt;\n&lt;h4 id=\"shekteuler\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h4&gt;\n&lt;p&gt;VISTA тиімділігі көбінесе пайдаланылатын модельдердің базалық мүмкіндіктеріне байланысты. Ойындар модельдердің оқу деректеріне енген болуы мүмкін, өйткені олар бенчмарктардан кейін шығарылған. Жүйенің жалпылау қабілетін қатаң тексеру үшін ARC-AGI-3 сияқты жабық жиынтықтардағы жаңа ойындарда сынақтар өткізу қажет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдер кейбір бенчмарктар шыққанға дейін оқытылғандықтан, агент оқыту процесінде бұл ойындарды көрген болуы мүмкін (деректердің ағып кетуі) ықтималдығын жоққа шығаруға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;h4 id=\"khorytyndy-zhaene-bolashakh-zertteuler\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#khorytyndy-zhaene-bolashakh-zertteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды және болашақ зерттеулер&lt;/span&gt;&lt;/a&gt;Қорытынды және болашақ зерттеулер&lt;/h4&gt;\n&lt;p&gt;VISTA жүйесі қарапайым визуалды интерфейсті (harness) қолдану арқылы қолданыстағы мультимодальды модельдердің интерактивті ортада күрделі тапсырмаларды орындау әлеуетін ашатынын көрсетеді. Әдіс модельге өңделмеген визуалды бақылауларды беруге негізделген, олар жадта ешқандай жоғалтусыз сақталады. Бұл агентке өзара әрекеттесу барысында жинақталған визуалды тәжірибеге бастапқы детальдар деңгейінде қайта жүгінуге мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA барлық 25 жария ARC-AGI-3 ойындарын максималды ұпаймен аяқтап, мінсіз нәтиже көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл архитектура басқа да визуалды ойындар мен жұмбақтарға оңай бейімделеді және минималды өзгертулерді талап етеді. VISTA-ның әртүрлі бенчмарктардағы жоғары тиімділігі оны ойын сценарийлерінен тыс тапсырмалар үшін әмбебап құрал ретінде қолдануға болатынын көрсетеді. Болашақ зерттеулерде жүйені физикалық әлемге барынша жақын, күрделі және шынайы тапсырмаларда сынау жоспарланған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қазіргі кезеңде модельдің тиімділігі негізінен ойын орталарында расталған, бұл нақты физикалық жағдайларда қосымша тексеруді қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f2.jpg\" alt=\"2-сурет: ARC-AGI-3 (сол жақта) және GameWorld (оң жақта) орталарындағы VISTA траекториялары. Интерфейс агентке визуалды \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: ARC-AGI-3 (сол жақта) және GameWorld (оң жақта) орталарындағы VISTA траекториялары. Интерфейс агентке визуалды күйлерді тікелей бақылауға, табиғи тілде пайымдауға және қажет болған жағдайда өзінің шығынсыз визуалды жадын бастапқы егжей-тегжейлі деңгейде тексеруге мүмкіндік береді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f3.jpg\" alt=\"3-сурет: VISTA-ның негізгі дизайн компоненттері және әр қадамдық конвейері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: VISTA-ның негізгі дизайн компоненттері және әр қадамдық конвейері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: VISTA-ның негізгі дизайн компоненттері және әр қадамдық конвейері. Мысал ретінде ARC-AGI-3 қолданылады. (a) Визуалды бақылаулар: модель бейнеленген визуалды күйлерді қабылдайды. (b) Шығынсыз визуалды жад: әрбір қайтарылған кадр өзінің бастапқы түрінде сақталады. (c) Модельмен бағытталатын визуалды тексеру: модель пайымдау кезінде зерттеу үшін кадрлар мен аймақтарды таңдайды. (d) Әр қадамдық конвейер: агент бақылайды, пайымдайды және әрекет етеді, ал әрбір қайтарылған кадр визуалды жадта сақталады. Өткен бақылауларды қайта қарау және жазбаларды жаңарту — модельмен бағытталатын міндетті емес қадамдар.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f4.jpg\" alt=\"4-сурет: ARC-AGI-3 ортасындағы траектория мысалы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: ARC-AGI-3 ортасындағы траектория мысалы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: ARC-AGI-3 ортасындағы траектория мысалы. Әрбір кадр өзінің қадамымен және әрекетімен белгіленген; ×N қайталанатын әрекеттерді білдіреді. Жақтаулар нысаналарды, ал дөңгелектер агенттің шертулерін көрсетеді. Агент ережелерді анықтауы керек: қара фигуралар айна сызығы арқылы өздерінің шағылысуларымен бірге қозғалады және барлық сары нысаналар жабылуы тиіс. 3-деңгейде қозғалмалы көлденең айна сызығы және таңдалатын фигуралар енгізіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f9.jpg\" alt=\"Сурет 9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 9&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f11.jpg\" alt=\"11-сурет: Бағалау орталары мен нәтижелері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-сурет: Бағалау орталары мен нәтижелері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;11-сурет: Бағалау орталары мен нәтижелері. Жоғарыда: үш бенчмарктен мысалдар. GameWorld және AI GameStore интерактивті, ал BabyVision статикалық болып табылады. Төменде: GPT-5.6 Sol нұсқасындағы VISTA-ның адам ойыншыларымен және минималды интерфейсті қолданатын ресми іске асырылуымен салыстырылуы. Біз GameWorld үшін сәттілік деңгейі мен прогресті, AI GameStore үшін адамға шаққандағы нормаланған ұпайлардың геометриялық орташа мәнін (адам медианасы = 100) және BabyVision үшін дәлдікті көрсетеміз. Сызықшалы сызық бұған дейін тіркелген ең жақсы нәтижені белгілейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f12.jpg\" alt=\"Сурет 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 12&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f13.jpg\" alt=\"13-сурет: ARC-AGI-3 тапсырмасындағы (ID BP35) толық VISTA траекториясы, әр әрекетке бір кадрдан (3-деңгей). 3-деңгейде ш\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;13-сурет: ARC-AGI-3 тапсырмасындағы (ID BP35) толық VISTA траекториясы, әр әрекетке бір кадрдан (3-деңгей). 3-деңгейде шертілгенде жоғалып, қайта шертілгенде қайта пайда болатын қызғылт сары блок енгізіледі. Агент бұғатталған жолдан өту үшін оны алып тастай алады немесе ойыншының өлімге әкелетін күлгін тікенектерге көтерілуіне жол бермеу үшін оны қалпына келтіре алады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f14.jpg\" alt=\"14-сурет: GPT-5.6 Sol көмегімен ARC-AGI-3 шегінен тыс төрт VISTA траекториясы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;14-сурет: GPT-5.6 Sol көмегімен ARC-AGI-3 шегінен тыс төрт VISTA траекториясы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;14-сурет: GPT-5.6 Sol көмегімен ARC-AGI-3 шегінен тыс төрт VISTA траекториясы. Жоғарғы қатарда GameWorld ойындары, ал төменгі қатарда BabyVision тапсырмалары көрсетілген. Жоғары сол жақта: Minecraft Clone ойынында агент темірді тастан ажырату үшін жылдам қол жеткізу панелі мен кен тамырын үлкейтіп, кеңістікті тексереді. Жоғары оң жақта: Pac-Man ойынында ол толық лабиринтті көру үшін ағымдағы және бастапқы кадрларды қайта қарап, уақыт бойынша тексереді. Төменгі сол жақта: Connect the Lines ойынында агент ұсынылған кескін ажыратымдылығында бақылау қиын болатын жолды анықтау үшін екі аймақты үлкейтеді, содан кейін жауап бермес бұрын пикселдердің нақты мәндерін оқиды. Төменгі оң жақта: Maze ойынында ол тақтаны 2× масштабта бейнелейді, содан кейін қабырға торын пиксель мәндері ретінде оқиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-fS1-2.jpg\" alt=\"Сурет S1 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-fS2.jpg\" alt=\"Сурет S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ визуалды&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;деректерді&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сығу кезінде&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бөлшектерді&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сапаны&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жоғалтпай&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кадрлар&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;архивін жасау&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ойын&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тесттеріндегі&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;идеалды&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тиімділік&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Агенттер өз&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;әрекеттерін&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жақсырақ&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жоспарлауды&lt;/text&gt;&lt;text x=\"626\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;үйр&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Qiushi Han, Keya Hu, Linlu Qiu, Cathy Wu, Kaiming He&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;str
