            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"167\" cy=\"95\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"573\" cy=\"218\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SYNTHETIC   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жасанды интеллект мәтіндері&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейрожелілерді неге&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;әлсіретеді&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f1.jpg\" alt=\"1-сурет. Жасанды интеллект (AI) арқылы жасалған веб-мәтін тек деректер тапшылығы бар модельдерге көмектеседі, әйтпесе ес\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Жасанды интеллект (AI) арқылы жасалған веб-мәтін тек деректер тапшылығы бар модельдерге көмектеседі, әйтпесе есептеу шығындарын талап етеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Жасанды интеллект (AI) арқылы жасалған веб-мәтін тек деректер тапшылығы бар модельдерге көмектеседі, әйтпесе есептеу шығындарын талап етеді. Сол жақта: &lt;a href=\"concepts/pangram-3-3-2.html\"&gt;Pangram 3.3.2&lt;/a&gt; құжаттарындағы AI немесе аралас деп белгіленген веб-токендердің айлар бойынша үлесі. Тек AI үлесі 2024 жылдың маусымында 10%, 2025 жылдың маусымында 16%, 2026 жылдың маусымында 28% және 2026 жылдың тамызында 31% құрайды. Ортада: 268 миллион параметрде қосылған бір AI токені үшін біздің заңымыздың мәні, адам токендерінде, 5-тен 100 &lt;a href=\"concepts/tokens-per-parameter.html\"&gt;TPPh&lt;/a&gt;-ке дейін: 5 TPPh-те оң, 20 TPPh-тен бастап нөлден төмен, шамамен 0,08-ден асқанда. Оң жақта: сүзгіден өтпеген веб-краулинг үшін есептеу шығындары оның AI үлесі үшін 20 TPPh (268 миллион параметр) кезінде адам деректер жиынтығында оқытуға сәйкес келуі керек: 2026 жылдың тамызындағы 31% кезінде 1,6× және 2027 мен 2028 жылдардың соңына арналған 42% және 51% болжамдарда 2,1× және 3,0×.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Интернет жасанды интеллект жасаған контентке толып барады, бұл жаңа модельдерді оқыту деректерінің сапасын өзгертуде. Авторлар 800 модельді талдап, жасанды интеллект мәтіндері белгілі бір шектен асқанда оқыту процесіне зиян тигізетінін дәлелдеді. Дерекқорды жасанды контентпен шексіз кеңейтудің орнына, сапалы адам мәтіндерін қайталау тиімдірек.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;2026 жылдың тамызында веб-деректердегі жасанды интеллект үлесі 31,1%-ға жетті.&lt;/li&gt;\n&lt;li&gt;Жасанды интеллект мәтіні тек деректер тапшылығы бар модельдерге ғана пайдалы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; және DCLM сүзгілері жасанды интеллект контентіне артықшылық береді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aedister-zhaene-daeldik\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#aedister-zhaene-daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер және дәлдік&lt;/span&gt;&lt;/a&gt;Әдістер және дәлдік&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Әдіс&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Деректер&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Дәлдік&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Шектеу&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Pangram 3.3.2&lt;/td&gt;\n&lt;td&gt;Common Crawl веб-мәтіндері&lt;/td&gt;\n&lt;td&gt;FPR 0,05%, FNR 1,99%&lt;/td&gt;\n&lt;td&gt;Ескі мәтіндерде қателік болуы мүмкін&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;FineWeb сүзу&lt;/td&gt;\n&lt;td&gt;Common Crawl құжаттары&lt;/td&gt;\n&lt;td&gt;Жасанды мәтінді 2,3 есе жиі өткізеді&lt;/td&gt;\n&lt;td&gt;Жасанды контентке бейімділік&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер &lt;a href=\"concepts/wildai.html\"&gt;WildAI&lt;/a&gt; корпусын (83 млрд токен) және деректерді адам мен жасанды интеллект мәтіндеріне бөлу үшін Pangram 3.3.2 классификаторын қолданды. Талдау Common Crawl-дағы жасанды интеллект контентінің үлесі 2024 жылғы 10,1%-дан 2026 жылдың тамызына қарай 31,1%-ға дейін өскенін көрсетті. FineWeb және DCLM сияқты қолданыстағы сапа сүзгілері жасанды интеллект мәтіндерін адам мәтіндеріне қарағанда 2,3–9,8 есе жиі өткізіп жібереді.&lt;/p&gt;\n&lt;p&gt;Әсерді бағалау үшін 800 модель (19,9 млн-нан 973 млн параметрге дейін) оқытылды. Деректер тапшылығы бар модельдер үшін жасанды интеллект мәтіндері пайдалы болуы мүмкін, бірақ &lt;a href=\"concepts/zakon-masshtabirovaniya-chinchilla.html\"&gt;Chinchilla&lt;/a&gt;-оңтайлы бюджетке (әр параметрге 20 токен) жеткенде пайда жоғалады. Одан әрі жасанды интеллект токендерін қосу қатені (&lt;a href=\"concepts/loss.html\"&gt;loss&lt;/a&gt;) арттырады, бұл зиянды өтеу үшін 1,6–3 есе көп есептеу қуатын талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу 973 миллион параметрге дейінгі модельдермен шектелген және өте үлкен &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-дерге әсерін толық қамтымайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Нейрожелілерді алдын ала оқытуға арналған деректер базасының негізін веб-контент құрайды, оның ішінде жасанды интеллект (ЖИ) жасаған мәтіндер үлесі қарқынды өсуде. FineWeb талдауына сәйкес, 2026 жылдың маусымында веб-деректердегі токендердің 27,5%-ы Pangram жүйесімен ЖИ өнімі деп белгіленген, ал тамыз айына қарай бұл көрсеткіш 31,1%-ға жетті. Бақыланатын синтетикалық деректерден айырмашылығы, бұл «жабайы» ЖИ мәтіндері көптеген әртүрлі модельдермен жасалған, адамдарға арналған және оқыту корпустарына таңбаланбаған күйде түседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Веб-деректердегі ЖИ контентінің үлесі 2026 жылдың екі айы ішінде 27,5%-дан 31,1%-ға дейін өсті, бұл модельдерді оқыту сапасына қауіп төндіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл контенттің әсерін бағалау үшін авторлар 19,9 миллионнан 973 миллион параметрге дейінгі 800 тілдік модельді оқытты. Оқыту барысында ЖИ токендері мен адам токендерінің қатынасы өзгертіліп, жоғалту функциясы (loss) талданды. Деректер тапшылығы бар модельдер үшін ЖИ токендерін қосу бастапқыда адам мәтіндеріндегі жоғалтуды азайтады, бірақ бұл пайда тез қанығады және кейін сапаның төмендеуіне әкеледі. Адам мәтіндерінің үлкен көлемімен оқытылған модельдер үшін ЖИ токендері жоғалтуды бірден арттырады, ал дәл осындай мөлшердегі жаңа адам токендері нәтижені жақсартуды жалғастырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жоғалту функциясы (loss) — модель болжамдарының нақты деректерден қаншалықты өзгешеленетінін көрсететін метрика; мән неғұрлым төмен болса, модель соғұрлым жақсы оқыған болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Chinchilla сияқты қолданыстағы &lt;a href=\"concepts/masshtabirovanie.html\"&gt;масштабтау&lt;/a&gt; заңдары деректер түрлері арасындағы айырмашылықты ескермейді. Авторлар пайда мен зиян факторларын бөліп көрсететін жаңа масштабтау заңын ұсынды. Кіші модельдерде сыналғанда, бұл заң 3,6 есе үлкен модельдер үшін ЖИ мәтінінің әсерін қолданыстағы аналогтарға қарағанда 41%-ға жоғары дәлдікпен болжайды. Есептеулерге сәйкес, 31,1% ЖИ үлесі бар сүзгіден өтпеген веб-контентте оқыту, адам деректерінде оқытуға қарағанда 1,6 есе көп есептеу қуатын талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЖИ контенті 22,3% болғанда, аралас валидация жиынтықтары оқыту сапасына теріс әсерді 95,5% жағдайда жасырып қалады, сондықтан метрикаларды бөлек мониторингтеу қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Интернет жасанды интеллект жасаған контентке толып барады. Pangram деректеріне сәйкес, FineWeb сапа сүзгілерінен өткен AI-мәтіндердің үлесі 2024 жылғы 10,1%-дан 2026 жылғы маусымда 27,5%-ға дейін өсіп, 2026 жылғы тамызда 31,1%-ға жетті (1-сурет). Сонымен қатар, заманауи модельдер әр параметр үшін ~20 токендік «есептеу үшін оңтайлы» бюджеттен әлдеқайда көп деректерде оқытылуда; мысалы, Qwen3-32B әр параметр үшін шамамен 1100 токенді пайдаланады. Болжам бойынша, адам жазған барлық ашық мәтіндер 2032 жылға қарай таусылады. Бұл әзірлеушілер алдына AI-контентті оқу таңдамаларында қалай қолдану керектігі туралы сұрақ қояды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Интернеттегі AI-мәтін үлесі 2026 жылғы тамызда 31,1%-ға жетті, ал модельдер классикалық Chinchilla-оңтайлы мәндерден бірнеше есе көп деректерде оқытылуда.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар «жабайы» AI-мәтіннің әсерін зерттеді — бұл модельдер адамдар үшін жазған және интернетте табиғи түрде кездесетін контент. Зерттеуде 800 модель (19,9 миллионнан 973 миллион параметрге дейін) оқытылды, мұнда әр адам токеніне 64-ке дейін «жабайы» AI-токені қосылды. Бағалау C4, FineWeb және Paloma жиынтықтарында жүргізілді. AI-мәтін тек деректер тапшылығы бар модельдер үшін ғана пайдалы екені анықталды: ол әр параметр үшін 10 токеннен аз дерек болғанда жоғалтуларды (loss) азайтады. Алайда, Chinchilla-оңтайлылығына (20 токен/параметр) жеткенде пайда жоғалады және AI-токендер үлесінің артуы жоғалтуларды арттырады, ал адам деректері оларды азайтуды жалғастырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/dikiy-ii-tekst.html\"&gt;Жабайы» AI-мәтін&lt;/a&gt; — бұл модельдер адамдар үшін жазған және оқу базаларына кездейсоқ түсіп қалатын бақылаусыз контент.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл эффектіні сипаттау үшін AI-мәтіннің қанығатын пайдасы мен логарифмдік өсетін зиянын ескеретін жаңа масштабтау заңы ұсынылды. 268 миллион параметрге дейін оқытылған модель 3,6 есе үлкен модельдердің мінез-құлқын 0,83 × 10⁻³ RMSE қателігімен болжайды, бұл қолданыстағы тәсілдерден (1,41 × 10⁻³ және 4,32 × 10⁻³) әлдеқайда дәлірек. Зерттеу көрсеткендей, FineWeb және DCLM сияқты ағымдағы сапа сүзгілері AI-контентке қате артықшылық береді (адам мәтініне қарағанда 2,3 және 9,8 есе жиі). 31,1% AI үлесі бар сүзілмеген интернетте оқыту таза адам деректерінде оқытуға қарағанда 1,6 есе көп есептеу қуатын талап етеді, 2028 жылға қарай бұл көрсеткіш 3,0 есеге дейін өседі. Авторлар WildAI деректер жиынтығын (96 миллион құжат) және барлық 800 оқытылған модельді жариялайды.&lt;/p&gt;\n&lt;h4 id=\"2-zhasandy-intellekt-zhasaghan-veb-derekterdi-oelsheu\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#2-zhasandy-intellekt-zhasaghan-veb-derekterdi-oelsheu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2 Жасанды интеллект жасаған веб-деректерді өлшеу&lt;/span&gt;&lt;/a&gt;2 Жасанды интеллект жасаған веб-деректерді өлшеу&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде авторлар адамдар мен жасанды интеллект (ЖИ) жасаған мәтіндерге бөлінген WildAI ауқымды деректер жиынтығын қалыптастыру процесін сипаттайды. Зерттеу көрсеткендей, 2026 жылғы маусымдағы жағдай бойынша FineWeb сапа сүзгілерінен өткен токендердің 27,5%-ы ЖИ арқылы жасалған және бұл үлес ай сайын өсіп келеді. Авторлар қолданыстағы сапа сүзгілері (FineWeb және DCLM) ЖИ мәтіндеріне басымдық беретінін анықтады.&lt;/p&gt;\n&lt;p&gt;Деректерді жинау және жіктеу. Негіз ретінде FineWeb корпусы алынып, 2025 жылдың шілдесінен 2026 жылдың маусымына дейінгі Common Crawl деректерімен толықтырылды. WildAI жиынтығы 96,04 миллион құжатты (83,31 миллиард токен) қамтиды. Жіктеу үшін екі кезеңдік тәсіл қолданылды: алдымен EditLens Llama-3.2-3B моделі 280 миллиардтан астам токенді белгілеп шықты, содан кейін Pangram 3.3.2 құралы бақылау тексеруін жүргізді. Нәтижесінде адамдар корпусы (58,91 миллион құжат, 42,19 миллиард токен) және ЖИ корпусы (32,54 миллион құжат, 35,32 миллиард токен) қалыптастырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pangram 3.3.2 — қателік деңгейі төмен мамандандырылған классификатор: жалған оң нәтиже 0,05%, ал жалған теріс нәтиже 1,99% құрайды, бұл деректерді дәл ажыратуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Контент динамикасы және таралуы. 2021 жылдың қаңтарынан 2026 жылдың тамызына дейінгі 310 000 құжатты талдау ЖИ контенті үлесінің күрт өскенін көрсетті: 2021 жылғы маусымдағы 0,1%-дан 2024-те 10,1%, 2025-те 16,1% және 2026 жылғы маусымда 27,5%-ға дейін (1-сурет, 8-сурет). 2026 жылдың тамызында бұл көрсеткіш 31,1%-ға жетті. Тақырыптар бойынша теңгерімсіздік бар: мысалы, оқу құралдары ЖИ контентінің 18,5%-ын, адам мәтіндерінің 6,2%-ын құрайды, ал жеке блогтарда бұл көрсеткіш керісінше (1,0%-ға қарсы 8,6%).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Веб-деректердегі ЖИ контентінің үлесі ай сайын өсіп, 2026 жылдың тамызында 31,1%-ға жетті; қолданыстағы сапа сүзгілері ЖИ мәтіндерін адам мәтіндеріне қарағанда әлдеқайда жиі өткізіп жібереді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сүзгілердің тиімділігі. 10 000 Common Crawl құжатына жүргізілген &lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt; FineWeb және DCLM сүзгілерінің ЖИ контентіне қатысты бейтарап еместігін көрсетті. ЖИ мәтіндері FineWeb сүзгісінен 2,3 есе (29,3%-ға қарсы 12,8%) және DCLM сүзгісінен 9,8 есе (14,5%-ға қарсы 1,5%) жиі өтеді (2-сурет).&lt;/p&gt;\n&lt;h4 id=\"3-negizder-zhaene-irgeles-zhumystar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#3-negizder-zhaene-irgeles-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3 Негіздер және іргелес жұмыстар&lt;/span&gt;&lt;/a&gt;3 Негіздер және іргелес жұмыстар&lt;/h4&gt;\n&lt;p&gt;Масштабтау заңдарының негіздері. LLM оқыту тиімділігін болжау үшін есептеу ресурстары (C), параметрлер саны (N) және токендер көлемі (D) маңызды. C ≈ 6ND формуласы негізгі болып табылады. Chinchilla заңы бұл тәуелділіктерді ресмилендіреді.&lt;/p&gt;\n&lt;p&gt;Қайталану үшін масштабтау заңдары. Chinchilla моделінде бірегей және қайталанатын токендер ажыратылмайды. Кейінгі зерттеулер токеннің «тиімді мәні» түсінігін енгізді немесе шамадан тыс бейімделу (overfitting) үшін айыппұл жүйесін ұсынды.&lt;/p&gt;\n&lt;p&gt;Деректер қоспасы және модель коллапсы. Зерттеушілер әртүрлі домендер мен тілдердегі деректерді модельдейді. Модель коллапсы (AI жасаған деректерде қайта оқыту) бойынша жұмыстар адам деректерін сақтап қалу деградацияны азайтатынын көрсетеді. AI мәтіндерінің пайдасы жалпы бюджетке байланысты.&lt;/p&gt;\n&lt;p&gt;Табиғи ортадағы AI мәтіндері. Интернеттегі AI мәтіндері арнайы синтетикалық деректерден айырмашылығы, оқырмандар мен іздеу жүйелеріне арналған. Қазіргі заңдар бұл қоспаны нашар болжайды (қателік 8.00-ге тең, авторлардың әдісі 0.83 × 10⁻³).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дәстүрлі масштабтау заңдары «жабайы» AI мәтіндерінің әсерін ескермейді, бұл болжам қателігін арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"4-adam-zhaene-ai-zhazghan-maetinder-ueshin-masshtabtau-zangdary\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#4-adam-zhaene-ai-zhazghan-maetinder-ueshin-masshtabtau-zangdary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4 Адам және AI жазған мәтіндер үшін масштабтау заңдары&lt;/span&gt;&lt;/a&gt;4 Адам және AI жазған мәтіндер үшін масштабтау заңдары&lt;/h4&gt;\n&lt;p&gt;Авторлар AI токендерінің пайдасы мен зиянын ескеретін жаңа заңды ұсынады. Ол C4 деректер жиынында ең төменгі қателікті (0.83 × 10⁻³) көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"41-empirikalykh-bakhylaular\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#41-empirikalykh-bakhylaular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1 Эмпирикалық бақылаулар&lt;/span&gt;&lt;/a&gt;4.1 Эмпирикалық бақылаулар&lt;/h4&gt;\n&lt;p&gt;Әдістер. NanoChat архитектурасын пайдалана отырып 800 модель оқытылды (19.9 млн-нан 973 млн параметрге дейін). TPPh (әр параметрге келетін токендер) 2.9-дан 87.5-ке дейін, r (AI/адам қатынасы) 0-ден 64-ке дейін өзгертілді. Бағалау C4, Paloma, FineWeb және Cosmopedia негізінде жүзеге асырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TPPh — модельдің оқытылу деңгейін анықтайтын көрсеткіш.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер. Тек адам мәтіндерінде оқытылған модельдер Chinchilla заңдарына бағынады. Алайда, AI токендері қосылғанда, адам деректері аз болса, олар көмектеседі, көп болса — зиян тигізеді. Мысалы, 5 TPPh-да AI жоғалтуларды азайтады, 20 TPPh-да болса арттырады (3-сурет).&lt;/p&gt;\n&lt;h4 id=\"42-kriterijler\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#42-kriterijler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2 Критерийлер&lt;/span&gt;&lt;/a&gt;4.2 Критерийлер&lt;/h4&gt;\n&lt;p&gt;Жаңа заң үшін бес критерий белгіленді: токен мәнінің икемділігі, пайда мен зиянды модельдеу, түсіндірілуі, бірінші токеннің шекті мәні және AI деректері болмағанда Chinchilla заңын қалпына келтіру.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI мәтіндерінің теріс әсері модель көлемі мен жалпы деректер бюджеті артқан сайын күшейе түседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"43-ai-zhasaghan-maetinderge-arnalghan-masshtabtau-zangdary\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#43-ai-zhasaghan-maetinderge-arnalghan-masshtabtau-zangdary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 AI жасаған мәтіндерге арналған масштабтау заңдары&lt;/span&gt;&lt;/a&gt;4.3 AI жасаған мәтіндерге арналған масштабтау заңдары&lt;/h4&gt;\n&lt;p&gt;Біз Chinchilla архитектурасын (1-теңдеу) AI деректерінің қанығу пайдасымен (9-теңдеу) және AI контентінің артықтығы үшін айыппұл функциясымен (5-теңдеу) біріктіретін масштабтау заңын әзірледік. Біздің моделіміз C4 деректерінде 0,83 × 10⁻³ қателік көрсеткішіне жетеді, бұл бар баламалардан жоғары (1-кесте). Жоғалту функциясы L(N, D_H, D_A) параметрлер көлемін N, адам деректерін D_H және AI деректерін D_A ескереді (2-теңдеу).&lt;/p&gt;\n&lt;p&gt;AI токендерінің пайдасы кредит берудің экспоненциалды формасы g(r) арқылы модельденеді, мұнда r = D_A/D_H — AI мәтінінің үлесі, R^* — пайданың қанығу ауқымы. Қайталануды зиянсыз деп санайтын модельдерден айырмашылығы, біз зиян үшін айыппұл енгіздік (4-теңдеу), ол AI деректерінің көлемі артқан сайын логарифмдік түрде баяулайды. Маржиналды зиян адам және AI токендерінің көлемі тең болғанда (r=1) ең жоғары деңгейге жетеді. Біз заңды 726 модельде (19,9–268 млн параметр) сынап көрдік және 74 модельде (973 млн параметрге дейін) валидацияладық.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біздің масштабтау заңымыз бар модельдерге қарағанда жоғалтуларды дәлірек болжайды және AI контентімен жұмыс істеуде статистикалық тұрғыдан айтарлықтай артықшылыққа ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Масштабтау — бұл модель сапасының деректер көлемі мен есептеу қуатына тәуелділігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-ai-maetinderinde-okhytu-effektileri-zhaene-usynystar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#5-ai-maetinderinde-okhytu-effektileri-zhaene-usynystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5 AI мәтіндерінде оқыту эффектілері және ұсыныстар&lt;/span&gt;&lt;/a&gt;5 AI мәтіндерінде оқыту эффектілері және ұсыныстар&lt;/h4&gt;\n&lt;p&gt;Болжамдар 2028 жылдың соңына қарай FineWeb жиынтығындағы AI токендерінің үлесі 50,7%-ға жететінін көрсетеді. Қазіргі AI контенті деңгейіндегі сүзгіден өтпеген деректерде оқытылған модельдер «таза» деректерде оқытылған модельдердің сапасына жету үшін 1,6–3,0 есе көп есептеу қуатын талап етеді. Біз AI мәтіндерін оқу таңдамаларынан алып тастауды, ал деректер жетіспеген жағдайда AI генерациясын қосудың орнына адам мәтіндерін қайталауды ұсынамыз.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Paired RMSE × 10³ бөлінген өлшемдерде, неғұрлым төмен болса, соғұрлым жақсы&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;th&gt;2&lt;/th&gt;\n&lt;th&gt;3&lt;/th&gt;\n&lt;th&gt;4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Chinchilla (Hoffmann et al., 2022)&lt;/td&gt;\n&lt;td&gt;4.32&lt;/td&gt;\n&lt;td&gt;4.65&lt;/td&gt;\n&lt;td&gt;5.40&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Muennighoff et al. (2023)&lt;/td&gt;\n&lt;td&gt;3.96&lt;/td&gt;\n&lt;td&gt;4.21&lt;/td&gt;\n&lt;td&gt;4.94&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CD (Qin et al., 2026)&lt;/td&gt;\n&lt;td&gt;3.68&lt;/td&gt;\n&lt;td&gt;3.63&lt;/td&gt;\n&lt;td&gt;4.17&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Lovelace et al. (2026)&lt;/td&gt;\n&lt;td&gt;3.55&lt;/td&gt;\n&lt;td&gt;3.74&lt;/td&gt;\n&lt;td&gt;4.14&lt;/td&gt;\n&lt;td&gt;8.38&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ATLAS (Longpre et al., 2026)&lt;/td&gt;\n&lt;td&gt;4.36&lt;/td&gt;\n&lt;td&gt;4.72&lt;/td&gt;\n&lt;td&gt;5.51&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;He et al. (2025)&lt;/td&gt;\n&lt;td&gt;6.54&lt;/td&gt;\n&lt;td&gt;6.55&lt;/td&gt;\n&lt;td&gt;6.62&lt;/td&gt;\n&lt;td&gt;8.96&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Hamidieh et al. (2025)&lt;/td&gt;\n&lt;td&gt;3.95&lt;/td&gt;\n&lt;td&gt;4.19&lt;/td&gt;\n&lt;td&gt;4.84&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shukor additive (Shukor et al., 2025)&lt;/td&gt;\n&lt;td&gt;6.77&lt;/td&gt;\n&lt;td&gt;6.70&lt;/td&gt;\n&lt;td&gt;6.26&lt;/td&gt;\n&lt;td&gt;10.05&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shukor joint (Shukor et al., 2025)&lt;/td&gt;\n&lt;td&gt;1.41&lt;/td&gt;\n&lt;td&gt;1.50&lt;/td&gt;\n&lt;td&gt;2.25&lt;/td&gt;\n&lt;td&gt;7.80&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sedova et al. (2026)&lt;/td&gt;\n&lt;td&gt;9.60&lt;/td&gt;\n&lt;td&gt;9.59&lt;/td&gt;\n&lt;td&gt;9.57&lt;/td&gt;\n&lt;td&gt;13.32&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jain et al. (2024)&lt;/td&gt;\n&lt;td&gt;8.00&lt;/td&gt;\n&lt;td&gt;8.03&lt;/td&gt;\n&lt;td&gt;8.04&lt;/td&gt;\n&lt;td&gt;9.34&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours&lt;/td&gt;\n&lt;td&gt;0.83&lt;/td&gt;\n&lt;td&gt;0.85&lt;/td&gt;\n&lt;td&gt;1.28&lt;/td&gt;\n&lt;td&gt;6.77&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"51-suezgiden-oetkizbeuding-khuny\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#51-suezgiden-oetkizbeuding-khuny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.1 Сүзгіден өткізбеудің құны&lt;/span&gt;&lt;/a&gt;5.1 Сүзгіден өткізбеудің құны&lt;/h4&gt;\n&lt;p&gt;Біз аралас деректерде (22,3% AI контенті) және «таза» адам ішкі жиынтықтарында оқытылған модельдерді салыстырдық. Деректер көлемі азырақ болғанына қарамастан, адам мәтіндеріндегі модельдер C4-те төменірек жоғалтуларды көрсетті (5-сурет). Біздің заңымыз 19 жұптың 18-інде сүзгіден өткізудің артықшылығын дұрыс болжады. Дрейфпен кездейсоқ жүру талдауы AI мәтіндері үлесінің өсуіне байланысты модельдердің есептеу тиімділігі төмендейтінін растайды: 2028 жылы «таза» модель деңгейіне жету үшін 3 есе көп ресурс қажет болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI мәтіндерін оқыту үшін пайдалану тек мақсатты міндет дәл AI-ға ұқсас контент жасау болғанда ғана ақталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/filtratsiya.html\"&gt;Сүзгіден өткізу&lt;/a&gt; — модель деградациясын болдырмау үшін оқу корпусынан сапасыз немесе синтетикалық деректерді алып тастау процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adam-derekterin-khajtalau-zhakhsyrakh-pa-aelde-ai-derekterin-khosu-ma\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#adam-derekterin-khajtalau-zhakhsyrakh-pa-aelde-ai-derekterin-khosu-ma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адам деректерін қайталау жақсырақ па әлде AI деректерін қосу ма?&lt;/span&gt;&lt;/a&gt;Адам деректерін қайталау жақсырақ па әлде AI деректерін қосу ма?&lt;/h4&gt;\n&lt;p&gt;19,9 млн және 35,8 млн параметрлі модельдермен өткізілген тәжірибелер адам токендерін қайталау AI мәтіндерін қосудан тиімдірек екенін көрсетті. Бір рет қайталаудан кейін C4-тегі жоғалтулар 2,3%-ға төмен болды, ал сегіз рет қайталаудан кейін айырмашылық 6,3–6,4%-ға дейін өсті.&lt;/p&gt;\n&lt;h4 id=\"52-ai-maetinderinde-okhytu-khashan-akhtalady\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#52-ai-maetinderinde-okhytu-khashan-akhtalady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.2 AI мәтіндерінде оқыту қашан ақталады?&lt;/span&gt;&lt;/a&gt;5.2 AI мәтіндерінде оқыту қашан ақталады?&lt;/h4&gt;\n&lt;p&gt;AI контентін қолдану деректер тапшылығы жағдайында және мақсатты AI мәтіндерімен жұмыс істегенде тиімді. Адам мәтінін болжау кезінде AI деректері тек түпнұсқа материалдар жетіспегенде ғана нәтиже береді: C4 жиынтығында AI мәтінінің оңтайлы үлесі 5 TPPh бюджетінде 37% болса, 20 TPPh кезінде 1,0%-ға дейін төмендейді (6-сурет). FW22 және Paloma жиынтықтары үшін де осындай заңдылықтар байқалады. AI мәтіндерінде оқыту кезінде оңтайлы үлес кез келген бюджетте 90%-дан жоғары болып қалады, ал бір AI токенінің құны 20 адам токенінен жоғары бағаланады (7-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Адам деректерінде оқыту үшін AI мәтінінің оңтайлы үлесі 20 TPPh-қа дейін артқанда 1%-ға дейін төмендейді, ал AI контентін жасау үшін бұл көрсеткіш 90%-дан асады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AI мәтіндерінде оқыту модельдердің генерация стилін өзгертеді. Агенттік жұмыс процестерінде модельдер бір-бірімен жиірек өзара әрекеттеседі, сондықтан AI стилистикасын түсіну маңызды. Алайда, бұл модельдің өз генерациясын да өзгертеді: 268M модельдері үшін 1000 сөзге келетін типтік AI тіркестерінің саны 0,16-дан (AI мәтінінсіз) r=1 болғанда 0,36-ға дейін және r=4 болғанда 0,54-ке дейін өседі. Pangram тестінде AI жасаған деп танылған оқиғалардың үлесі екі есеге артады (37,2% қарсы 18,6%, 13-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;r — оқыту таңдамасындағы AI мәтінінің адам мәтініне қатынасының коэффициенті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар оқыту және бағалау кезінде AI мен адам мәтіндерін бөлуді ұсынады. Оларды бөлек домендер ретінде қарастыратын модельдер ең жоғары дәлдікті көрсетеді. Бөлу форматтардағы айырмашылықтармен ақталады: мысалы, оқу материалдары AI токендерінің 18,5%-ын, ал адам токендерінің небәрі 6,2%-ын құрайды. AI мәтінін болжау оңайырақ болғандықтан, оны таңдамаға қосу FW26-ның AI сегментіндегі шығындарды азайтады, бірақ 44% жағдайда адам сегментінде шығындарды арттырады. 2026 жылғы краулинг деректері бойынша, AI мәтінінің 22,3% үлесінде аралас валидация 95,5% жағдайды қате түрде жақсару деп бағалайды (6-сурет). Шығындар туралы есептерді адам және AI мәтіндері үшін бөлек ұсыну ұсынылады.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 6.&lt;/strong&gt; Теңестірілген бюджеттердің TPF мәндері&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Бюджет&lt;/th&gt;\n&lt;th&gt;Мәні&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;26.93&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;28.41&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;29.74&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;30.91&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;477M-де 90 бюджеті жоқ; 973M-де 55, 75 немесе 90 бюджеттері жоқ.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 11.&lt;/strong&gt; r &amp;lt; 1 болатын шектелген тесттік іске қосулар үшін 1-кестенің жұптық қателері&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;Мәні&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;2.93&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;3.18&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;3.82&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;7.75&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Веб-краулинг жете алатын ауқым (біздің 2026 жылғы краулингіміз r = 0.29; AI және адам мәтінінің тең бөлінуі r = 1).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 5.&lt;/strong&gt; Thetraininggrid.Eachcellisonehuman-onlycontrolplusthenumberofAI-additionrunsand,after theplussign,fresh-human-additionrunsonthesamehumancorpus.Sizesmarked†,belowtherule,arereserved: everylawisscoredonthemandnoneisfittedonthem.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT5.jpg\" alt=\"Кесте 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; ForecastAIshareofwebtokenseachDecember.TheintervalsareStudent-tpredictionintervalsthat includetheuncertaintyofthedrift.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT2.jpg\" alt=\"Кесте 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Thesevenmodelsizes.Allusethenanochatarchitecture.Ninthescalinglawscountstheinput embedding;thelastcolumnsubtractsit.Reservedsizes(†)enternofit.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT3.jpg\" alt=\"Кесте 3\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"negizgi-khorytyndylar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#negizgi-khorytyndylar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі қорытындылар&lt;/span&gt;&lt;/a&gt;Негізгі қорытындылар&lt;/h4&gt;\n&lt;p&gt;Жасанды интеллект (ЖИ) арқылы жасалған мәтіндердің сүзгіден өткен веб-деректердегі үлесі 25%-дан асты және өсуде. 800 алдын ала оқытылған модельді талдау көрсеткендей, мұндай контент тек деректер тапшылығы бар модельдер үшін пайдалы, ал Chinchilla масштабтау заңына сәйкес келетін модельдер үшін шығынды арттырады. Біз ұсынған заң пайданың қанығу эффектісін және зиянның логарифмдік өсуін сипаттайды. Бұл модель оқытылған жүйелерге қарағанда 3,6 есе үлкен модельдерді болжайды және адам жазған мәтіндердегі қателік деңгейі бойынша 11 қолданыстағы әдістен асып түседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2026 жылдың тамызына қарай ЖИ мәтіндерінің үлесі 31,1%-ға жетеді, бұл сүзгіден өтпеген веб-деректерде оқыту үшін есептеу қуатын 1,6 есе, ал 2028 жылға қарай 3,0 есе арттыруды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler-men-bolashakh-zhumystar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#shekteuler-men-bolashakh-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер мен болашақ жұмыстар&lt;/span&gt;&lt;/a&gt;Шектеулер мен болашақ жұмыстар&lt;/h4&gt;\n&lt;p&gt;Біздің заң 268 миллион параметрге дейінгі модельдерде калибрленді және 973 миллион параметрге дейінгі жүйелерде сыналды. Үлкенірек модельдер оқу деректерін жаттап алуға бейім болғандықтан, олар әлсіз LLM үлгілерін оңай қабылдауы мүмкін. Біз тек ағылшын тіліндегі веб-мәтіндерді зерттедік. Болашақ зерттеулер ЖИ контентін сүзгіден өткізуге, ЖИ мәтіні пайдалы болатын салаларды анықтауға және модельдерді ЖИ енгізілген деректерді түсінуге үйретуге бағытталуы тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chinchilla заңы — модель көлемі мен оқу деректерінің көлемі арасындағы оңтайлы қатынасты анықтайтын эмпирикалық ереже.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тәжірибеде қолданылған модельдер нақты өнімділікті бағалау үшін тым кішкентай, сондықтан нәтижелер алдын ала сипатта болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f1.jpg\" alt=\"1-сурет. Жасанды интеллект (AI) арқылы жасалған веб-мәтін тек деректер тапшылығы бар модельдерге көмектеседі, әйтпесе ес\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет. Жасанды интеллект (AI) арқылы жасалған веб-мәтін тек деректер тапшылығы бар модельдерге көмектеседі, әйтпесе есептеу шығындарын талап етеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет. Жасанды интеллект (AI) арқылы жасалған веб-мәтін тек деректер тапшылығы бар модельдерге көмектеседі, әйтпесе есептеу шығындарын талап етеді. Сол жақта: Pangram 3.3.2 құжаттарындағы AI немесе аралас деп белгіленген веб-токендердің айлар бойынша үлесі. Тек AI үлесі 2024 жылдың маусымында 10%, 2025 жылдың маусымында 16%, 2026 жылдың маусымында 28% және 2026 жылдың тамызында 31% құрайды. Ортада: 268 миллион параметрде қосылған бір AI токені үшін біздің заңымыздың мәні, адам токендерінде, 5-тен 100 TPPh-ке дейін: 5 TPPh-те оң, 20 TPPh-тен бастап нөлден төмен, шамамен 0,08-ден асқанда. Оң жақта: сүзгіден өтпеген веб-краулинг үшін есептеу шығындары оның AI үлесі үшін 20 TPPh (268 миллион параметр) кезінде адам деректер жиынтығында оқытуға сәйкес келуі керек: 2026 жылдың тамызындағы 31% кезінде 1,6× және 2027 мен 2028 жылдардың соңына арналған 42% және 51% болжамдарда 2,1× және 3,0×.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f2.jpg\" alt=\"2-сурет. AI белгілеген веб-мәтін бірнеше форматқа бейім және сапа сүзгілерінен адам мәтініне қарағанда жиі өтеді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. AI белгілеген веб-мәтін бірнеше форматқа бейім және сапа сүзгілерінен адам мәтініне қарағанда жиі өтеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет. AI белгілеген веб-мәтін бірнеше форматқа бейім және сапа сүзгілерінен адам мәтініне қарағанда жиі өтеді. Сол жақта: 2026 жылдың қаңтарынан маусымына дейін ең көп және ең аз көрсетілген бес формат үшін AI белгілеген әрбір форматтағы токендердің адам белгілеген токендер үлесіне қатынасы. Оң жақта: әрбір FineWeb кезеңінен кейін қалған 2026 жылғы Common Crawl үлгісіндегі AI және адам белгілеген құжаттардың үлесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f3.jpg\" alt=\"3-сурет. Қосылған AI мәтіні тек шағын адам бюджеттерінде шығынды азайтады. 5, 20 және 40 TPPh кезінде бекітілген адам ко\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет. Қосылған AI мәтіні тек шағын адам бюджеттерінде шығынды азайтады. 5, 20 және 40 TPPh кезінде бекітілген адам корпусына AI токендері немесе дәл сондай мөлшердегі жаңа адам токендері қосылғанда, әрбір модельдің тек адам деректеріне негізделген бақылау тобына қатысты C4 шығындарының өзгеруі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f4.jpg\" alt=\"4-сурет. Біздің заңымыз оқытылған модельдерге сәйкес келеді және ірі модельдер үшін нәтижелерді болжайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет. Біздің заңымыз оқытылған модельдерге сәйкес келеді және ірі модельдер үшін нәтижелерді болжайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет. Біздің заңымыз оқытылған модельдерге сәйкес келеді және ірі модельдер үшін нәтижелерді болжайды. Сол жақта: біздің заңымызбен C4 шығындарының бақыланатын өзгеруі. Ортада: 20 TPPh кезінде 477 миллион және 973 миллион параметрлік кейінге қалдырылған іске қосулар біздің заңымыз бен Chinchilla-мен салыстырғанда. Chinchilla AI мәтіні шығындарды азайтуды жалғастыратынын болжайды; іске қосулар мен біздің заңымыз өсуді көрсетеді. Оң жақта: әрбір AI іске қосылуы үшін болжанған және бақыланған өзгеріс.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f5.jpg\" alt=\"5-сурет. AI мәтінін сүзгіден өткізу ірі адам бюджеттерінде өзін ақтайды, ал адам мәтінін қайталау AI мәтінін қосқаннан г\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. AI мәтінін сүзгіден өткізу ірі адам бюджеттерінде өзін ақтайды, ал адам мәтінін қайталау AI мәтінін қосқаннан гөрі тиімдірек.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет. AI мәтінін сүзгіден өткізу ірі адам бюджеттерінде өзін ақтайды, ал адам мәтінін қайталау AI мәтінін қосқаннан гөрі тиімдірек. Сол жақта: 22,3% AI қоспасынан AI құжаттарын оларды алмастырмастан алып тастағандағы шығындардың өзгеруі, біздің заңымызбен болжанған (түс; қара сызық: өзгеріссіз) және өлшенген (шеңберлер; 973 миллион параметр үшін мәндер). Оң жақта: 20 TPPh кезіндегі модельдер үшін адам корпусы қайталанғанда немесе дәл сондай мөлшердегі жаңа AI токендері қосылғанда шығындардың өзгеруі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f6.jpg\" alt=\"6-сурет. AI мәтінінің пайдасы бағалау жиынтығына байланысты ма.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет. AI мәтінінің пайдасы бағалау жиынтығына байланысты ма.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет. AI мәтінінің пайдасы бағалау жиынтығына байланысты ма. Сол жақта: адам корпусы бекітілген кезде біздің заңымыз болжаған шығындарды азайтатын оқу токендеріндегі AI үлесі, бағалау жиынтықтары бойынша: адам мәтіні (C4, FW22) үшін нөлге жуық, AI мәтіні (Cosmo) үшін 90%-дан жоғары және аралас FW26 үшін 98%-дан 34%-ға дейін төмендеу; 10 TPP маңындағы төмендеу — бұл оптимум болжамды шығындардың екі локалды минимумы арасында ауысатын нүкте. Оң жақта: адам белгілеген FW26 мәтініндегі шығындарды арттыратын 243 AI қосымшасы үшін, AI белгілеген мәтін үлесі өскен сайын валидация жиынтығы көрсететін медиандық шығынның өзгеруі. Белгі 5,1% AI-да өзгереді; 2026 жылғы краулдегі 22,3% кезінде медиандық жүгіріс 1,9%-ға жақсырақ көрінеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f7.jpg\" alt=\"7-сурет. Білім мақалалары, нұсқаулықтар және тізімдер дерлік әр тақырыпта AI ең көп белгілейтін форматтар болып табылады\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет. Білім мақалалары, нұсқаулықтар және тізімдер дерлік әр тақырыпта AI ең көп белгілейтін форматтар болып табылады. Әрбір Web Organizer тақырыбында және оқу таңдауымыздағы құжаттар форматында Pangram 3.3.2 бойынша AI деп белгіленген құжаттар үлесі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f8.jpg\" alt=\"8-сурет. Интернет AI ең көп жазатын форматтар мен тақырыптарға қарай ығысады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет. Интернет AI ең көп жазатын форматтар мен тақырыптарға қарай ығысады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-сурет. Интернет AI ең көп жазатын форматтар мен тақырыптарға қарай ығысады. Біз 2021 жылдың қаңтарынан 2026 жылдың тамызына дейінгі кезеңді күнтізбелік тоқсандар бойынша Pangram 3.3.2 және Web Organizer белгілерімен сызамыз. Әр формат пен тақырыптың интернет токендеріндегі үлесі және әр формат пен тақырыптың AI деп белгіленген токендер үлесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f9.jpg\" alt=\"9-сурет. DCLM сапа классификаторы AI белгілеген құжаттарды адам құжаттарына қарағанда әлдеқайда жиі сақтайды. 2026 жылғы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет. DCLM сапа классификаторы AI белгілеген құжаттарды адам құжаттарына қарағанда әлдеқайда жиі сақтайды. 2026 жылғы Common Crawl 10 000 құжаттық үлгінің FineWeb (жоғарыда) және DCLM (төменде) құбырларының әр кезеңінен аман қалуы, Pangram 3.3.2 белгісі бойынша бөлінген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f10.jpg\" alt=\"10-сурет. Әр краул айында өлшенген және 2022 жылдың желтоқсанынан 2026 жылдың тамызына дейінгі кезең үшін сәйкестендіріл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет. Әр краул айында өлшенген және 2022 жылдың желтоқсанынан 2026 жылдың тамызына дейінгі кезең үшін сәйкестендірілген дрейфі бар кездейсоқ жүріс арқылы 2030 жылдың желтоқсанына дейін болжанған интернет токендеріндегі AI үлесі, 80% және 95% болжам интервалдарымен.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f11.jpg\" alt=\"11-сурет. Біздің заңымыздың пайда және зиян мүшелері. 2-теңдеудің екі мүшесі және олардың C4-ке таза әсері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-сурет. Біздің заңымыздың пайда және зиян мүшелері. 2-теңдеудің екі мүшесі және олардың C4-ке таза әсері.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f11-2.jpg\" alt=\"Сурет 11 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 11 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f13.jpg\" alt=\"13-сурет. Жасанды интеллект (AI) мәтінінің зияны баяулайды. C4 шығынының r-ге қатысты 1-ден 64-ке дейінгі өзгеруі: AI мә\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;13-сурет. Жасанды интеллект (AI) мәтінінің зияны баяулайды. C4 шығынының r-ге қатысты 1-ден 64-ке дейінгі өзгеруі: AI мәтінінің әр екі еселенуі шығынның бірдей өсуін қосады. Үзік сызық: Лавлейс және т.б. стиліндегі үдемелі дәрежелік айыппұл заңы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f14.jpg\" alt=\"14-сурет. Тиімді адам токендері Chinchilla деректер мүшесіндегі AI жүгірістерін ауыстырады. Тек адам токендерін санағанд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;14-сурет. Тиімді адам токендері Chinchilla деректер мүшесіндегі AI жүгірістерін ауыстырады. Тек адам токендерін санағанда, AI жүгірістері тек адам мәтіндерінен алынған Chinchilla деректерінен ауытқиды; тиімді токендер ретінде санағанда, олар солармен сәйкес келеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f15.jpg\" alt=\"15-сурет. Әрбір сәйкестендірілген өлшем мен бюджет бойынша біздің заңымыз. Қосылған AI мәтіні мен қосылған жаңа адам мәт\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;15-сурет. Әрбір сәйкестендірілген өлшем мен бюджет бойынша біздің заңымыз. Қосылған AI мәтіні мен қосылған жаңа адам мәтіні үшін біздің заңымыздың қисықтары бар әрбір сәйкестендірілген бақылау тобы үшін C4 шығынының r-ге қатысты өзгеруі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f16.jpg\" alt=\"16-сурет. Біздің заңымыздың AI токені үшін мәні өлшенген мәндерге қарсы. Біздің заңымыз бойынша адам токендеріндегі қосы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;16-сурет. Біздің заңымыздың AI токені үшін мәні өлшенген мәндерге қарсы. Біздің заңымыз бойынша адам токендеріндегі қосылған AI токенінің мәні және 5 және 20 TPPh кезінде бірдей бақылау мәніне жұптастырылған AI мен жаңа адам қосымшалары негізінде өлшенген мән.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f19.jpg\" alt=\"19-сурет. C4 үшін AI мәтінінің аз көлемі әрқашан есептеу жағынан тиімдірек, ал Cosmopedia үшін AI мәтінінің көп көлемі т\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;19-сурет. C4 үшін AI мәтінінің аз көлемі әрқашан есептеу жағынан тиімдірек, ал Cosmopedia үшін AI мәтінінің көп көлемі тиімдірек. 20 TPP кезіндегі 268M модельдерінің 2026 жылғы краул миксімізге (22,3% AI) қарағанда есептеу эквивалентіндегі өсімі AI үлесіне ие.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f20.jpg\" alt=\"20-сурет. Адам мәтінін қайталау адам мәтінін бағалау жиынтықтарында AI мәтінін қосқаннан гөрі тиімдірек.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;20-сурет. Адам мәтінін қайталау адам мәтінін бағалау жиынтықтарында AI мәтінін қосқаннан гөрі тиімдірек.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;20-сурет. Адам мәтінін қайталау адам мәтінін бағалау жиынтықтарында AI мәтінін қосқаннан гөрі тиімдірек. Адам корпусы қайталанғанда немесе бірдей мөлшердегі жаңа AI токендері қосылғанда, әрбір адам токеніне қосылған токендерге қатысты әрбір бағалау жиынтығындағы шығындардың өзгеруі. Адам мәтіні жиынтықтарында (C4, FW22, FW26-H) қайталау шығындарды азайтады, ал AI мәтіні оларды арттырады; AI мәтіні жиынтықтарында (FW26-AI, Cosmo) AI мәтіні шығындарды көбірек азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f21.jpg\" alt=\"21-сурет. AI жасаған мәтінде қосылған AI токендері кез келген бюджетте шығындарды азайтады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;21-сурет. AI жасаған мәтінде қосылған AI токендері кез келген бюджетте шығындарды азайтады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;21-сурет. AI жасаған мәтінде қосылған AI токендері кез келген бюджетте шығындарды азайтады. Cosmopedia үшін 3-суреттің баламасы: әрбір сәйкестендірілген өлшем үшін 5, 20 және 40 TPP кезінде AI токендері немесе бірдей мөлшердегі жаңа адам токендері қосылғанда Cosmo шығындарының өзгеруі. AI мәтіні кез келген бюджет пен өлшемде шығындарды 25%-ға дейін азайтады; жаңа адам мәтіні оларды әлдеқайда аз азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f22.jpg\" alt=\"22-сурет. Аралас валидация деректері адам мәтініне келтірілген зиянды жасырады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;22-сурет. Аралас валидация деректері адам мәтініне келтірілген зиянды жасырады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;22-сурет. Аралас валидация деректері адам мәтініне келтірілген зиянды жасырады. Сол жақта: әрбір модельдің FW26-ның AI белгілеген бөлігіне қарағанда адам белгілеген бөлігіндегі шығыны. Тек адам деректеріндегі модельдер AI мәтінінде 12-27%-ға төмен шығындарға ие, ал AI мәтінімен оқытылған модельдер тең шығын сызығынан төмен түседі. Оң жақта: адам белгілеген мәтінде шығынды арттыратын 243 AI қосымшасының ішінен валидация жиынтығы жақсарту ретінде көрсететін үлес, сәйкестендірілген және бөлінген өлшемдер үшін AI белгілеген мәтін үлесінің өсуімен: 5% AI кезінде 49,4% және 2026 жылғы краулымыздың 22,3% кезінде 95,5%.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f23.jpg\" alt=\"23-сурет. Қосылған AI токендері CORE-ды жаңа адам токендері сияқты арттырады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;23-сурет. Қосылған AI токендері CORE-ды жаңа адам токендері сияқты арттырады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;23-сурет. Қосылған AI токендері CORE-ды жаңа адам токендері сияқты арттырады. AI токендері немесе бірдей мөлшердегі жаңа адам токендері қосылғанда, әрбір модельдің тек адам бақылауына қатысты CORE-ның өзгеруі. MMLU (Hendrycks және т.б., 2021) сызылмаған, өйткені ол осы өлшемдерде күтілгендей, әрбір модель үшін кездейсоқ дәлдік деңгейінде қалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f24.jpg\" alt=\"24-сурет. Жасанды интеллект (ЖИ) мәтіндерімен оқытылған модельдер ЖИ-ге тән фразаларды көбірек қолданады. r қатынасында \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;24-сурет. Жасанды интеллект (ЖИ) мәтіндерімен оқытылған модельдер ЖИ-ге тән фразаларды көбірек қолданады. r қатынасында ЖИ мәтіндері қосылып оқытылған модельдердің генерацияларындағы әр 1000 сөзге шаққандағы ЖИ-ге тән 26 фразаның жиілігі.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 4.&lt;/strong&gt; Everymodelinthepaper.The800modelsofthescaling-lawcohortbysizeandarm:human-only controls,AIadditionsandfresh-humanadditions,eachadditiontrainedonexactlyitscontrol’shumandocuments. Sizes marked † are held out from every fit.TPPh:range over the controls.In Table 5:runs in the matched-budget grid,controlsincluded;theothersbelongtocontrolgroupsatper-sizebudgetsfromearlierrungenerationsand entereveryfitandscoreinthesameway.Otherseeds:runswithaseedotherthan1337.Belowtherule,the44 filteringandrepetitionmodels,whichenternofit.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT4.jpg\" alt=\"Кесте 4\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Оқыту&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;деректерінің&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасанды&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мәтінмен&lt;/text&gt;&lt;text x=\"26\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ластануы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Әртүрлі&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрамдағы 800&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельді оқыту&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жасанды мәтін&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оқытудағы&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қатені&lt;/text&gt;&lt;text x=\"426\
