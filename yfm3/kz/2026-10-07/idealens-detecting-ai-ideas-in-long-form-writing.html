        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"171\" cy=\"175\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"589\" cy=\"170\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · PROVENANCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;IdeaLens: жасанды интеллект&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;идеяларын адам ойынан&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ажырату&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f1.jpg\" alt=\"1-сурет: IDEALENS идеяларды қадағалау; дәстүрлі детекторлар мәтінді қадағалайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: IDEALENS идеяларды қадағалау; дәстүрлі детекторлар мәтінді қадағалайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: IDEALENS идеяларды қадағалау; дәстүрлі детекторлар мәтінді қадағалайды. Біз ортақ шығу тегі (толығымен адам немесе толығымен жасанды интеллект) және аралас шығу тегі (адам идеялары мен ЖИ прозасы немесе ЖИ идеялары мен адам прозасы) сценарийлерін қамтитын төрт квадрантты ұсынамыз. Дәстүрлі детекторлардан (мысалы, Pangram4, Glickenhaus et al., 2026; EditLens-3B, Thai et al., 2026) айырмашылығы, IDEALENS прозаның емес, идеялардың қайнар көзін дәл анықтай алады. IDEALENS адам идеялары негізінде ЖИ жасаған құжаттардың 94,7%-ын адамдікі деп жіктейді, ал &lt;a href=\"concepts/pangram-3-3-2.html\"&gt;Pangram&lt;/a&gt; тек 43,8%-ын адамдікі деп белгілейді. ЖИ идеялары бойынша адамдар жазған әңгімелердің жаңа деректер жиынында (§3), IDEALENS 68,0%-ын ЖИ деп белгілейді, ал Pangram мен EditLens сәйкесінше тек 8,0% және 0,0% деп белгілейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Заманауи құралдар мәтіннің кім жазғанын анықтағанымен, идеяның қайнар көзін ажырата алмайды. IdeaLens әдісі құжаттарды құрылымдық жоспарларға айналдырып, стилистикалық қабықтан ада мазмұнды талдайды. Бұл адам жазған, бірақ жасанды интеллект идеяларына негізделген мәтіндерді әшкерелеуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;IdeaLens мәтін стилін емес, идеялар құрылымын талдайды.&lt;/li&gt;\n&lt;li&gt;Модель 1 млн құжат пен Pangram 4 белгілері арқылы оқытылған.&lt;/li&gt;\n&lt;li&gt;Жүйе басқа детекторлар байқамайтын жасанды идеяларды әшкерелейді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер «идеяның шығу тегі» (idea provenance) ұғымына негізделген IdeaLens детекторын ұсынды. Жүйе құжатты дискурсивті рөлдер мен мазмұнның қысқаша сипаттамасы түріндегі тізімге айналдырады, бұл сөз деңгейіндегі ұқсастықты азайтады. Модель 1 миллион құжаттан тұратын &lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; деректер жиынында Pangram 4 детекторының белгілерімен оқытылды.&lt;/p&gt;\n&lt;p&gt;Сынақтар көрсеткендей, адам жоспарлары негізінде жазылған мәтіндерде жасанды интеллект деп қате белгілеу деңгейі 95%-дан 7%-ға дейін төмендейді. Керісінше, адам жасанды интеллект жоспары бойынша жазғанда, IdeaLens 68% жағдайда «машина ізін» анықтайды, ал қарапайым детекторлар мұны байқамайды. Әдіс 24 тілге бейімделген және әртүрлі форматтарда тұрақты нәтиже береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель ықтималдық болжамдарға негізделеді және жазу процесінің тікелей дәлелі емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қазіргі заманғы жасанды интеллект (ЖИ) детекторлары мәтінді кім жазғанын анықтауға бағытталған, алайда қазіргі саяси талаптар идеялардың авторы кім екенін түсінуді талап етеді. Зерттеушілер IDEALENS детекторын ұсынды. Ол мәтінді кім жазғанына қарамастан, идеялардың адам немесе ЖИ тарапынан жасалғанын анықтайды. Идеяларды мәтін стилінен бөліп алу үшін құжаттар конспект түріне келтіріледі: әр бөлім үшін дискурсивті рөл және қысқаша мазмұн жазылады. Бұл түпнұсқа мәтінмен сөздік деңгейдегі ұқсастықты азайтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS мәтін стиліне емес, идеялардың қайнар көзіне назар аударады және талдау үшін конспектілерді пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS моделі Pangram детекторының көмегімен белгіленген 1 миллион FineWeb құжаты негізінде оқытылды. Конспектілер сыртқы тілдік белгілерден ада болғандықтан, модель идеялар құрылымына сүйенеді. Бақыланатын тәжірибеде модельдер адам тарапынан жасалған егжей-тегжейлі жоспарлар негізінде жазғанда, IDEALENS-тің ЖИ деп белгілеу көрсеткіші 95%-дан 7%-ға дейін төмендеді, ал Pangram 4 92% жағдайда ЖИ деп белгілеуді жалғастырды. ЖИ жасаған жоспарлар пайдаланылғанда, IDEALENS 96%-дан жоғары дәлдікті сақтап қалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Конспект — бұл мәтін мазмұнын сақтай отырып, авторлық стильді айналып өтетін қысқаша баяндау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Адамдар ЖИ жасаған жоспарлар негізінде жазған 50 әңгімеден тұратын жаңа жинақта IDEALENS 68% жағдайда ЖИ идеяларын анықтады, ал Pangram 4 тек 8% жағдайда анықтады. 19 қолданыстағы бенчмаркта өткізілген сынақтар IDEALENS-тің әртүрлі домендер мен тілдерде жоғары дәлдікті сақтайтынын көрсетті. 90 мың болжамды талдау адам мен ЖИ идеялары арасындағы жүйелі айырмашылықтарды анықтауға көмектесті. Зерттеушілер өз модельдері мен деректер жинағын ашық қолдануға ұсынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдің тиімділігі шектеулі деректер жинағында тексерілген; нәтижелер саланың күрделілігіне қарай өзгеруі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;2026 жылдың тамызында Pangram жасанды интеллект детекторы Стэнли Дракенмиллердің Wall Street Journal-дағы мақаласын толығымен жасанды интеллект жазған деп белгіледі. Инвестор ЖИ қолданғанын растады, бірақ басылым редакторы Пол Гиго мақала авторлық идеяларға негізделгенін айтып, оны қорғады. Бұл жағдай «мәтіннің шығу тегі» (сөздерді кім жазды) мен «идеяның шығу тегі» (оны кім ойлап тапты) арасындағы айырмашылықты көрсетеді.&lt;/p&gt;\n&lt;p&gt;Авторлар идеялардың шығу тегін анықтайтын IDEALENS детекторын ұсынады. Әдіс жазудың когнитивті моделіне негізделген: идеялар мәтіннің нақты сөздерімен емес, оның құрылымы (тезистер, оқиғалар, логика) арқылы анықталады. Модель FineWeb корпусынан алынған 1 миллион жоспар (outline) негізінде оқытылды. Бақылау үшін PROSELENS моделі жасалды, ол сол деректерде, бірақ мәтіннің өзі негізінде оқытылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Аутлайнинг» әдісі мәтінді оның құрылымы мен дискурс рөлдерінің қысқаша сипаттамасына айналдыруды білдіреді, бұл модельге стильді емес, логиканы бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"idealens-zhasandy-intellekt-zhazghan-maetinderdegi-adamdykh-ideyalardy-anykhtajdy\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-zhasandy-intellekt-zhazghan-maetinderdegi-adamdykh-ideyalardy-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•IDEALENS жасанды интеллект жазған мәтіндердегі адамдық идеяларды анықтайды&lt;/span&gt;&lt;/a&gt;•IDEALENS жасанды интеллект жазған мәтіндердегі адамдық идеяларды анықтайды&lt;/h4&gt;\n&lt;p&gt;ЖИ әртүрлі жоспарлар негізінде жасаған құжаттарда IDEALENS «ЖИ детекциясы» деңгейін 94,9%-дан (адамның минималды араласуымен) 6,8%-ға дейін (толық адам жоспарымен) төмендетеді. Сонымен қатар, PROSELENS пен Pangram мұндай мәтіндерді ЖИ өнімі деп белгілеуді жалғастырады (сәйкесінше 86,5% және 92,4%). Өңдеу және қайта жазу бойынша 10 сыртқы бенчмаркта IDEALENS қателесіп 5,6% құжатты ЖИ деп белгілейді, ал PROSELENS — 46,0%, Pangram — 52,0%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS мәтін детекторларына қарағанда әлдеқайда аз қателікпен адамдық ниетті ЖИ орындауынан ажыратады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"idealens-adam-zhazghan-maetinderdegi-zhi-ideyalaryn-anykhtajdy\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-adam-zhazghan-maetinderdegi-zhi-ideyalaryn-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•IDEALENS адам жазған мәтіндердегі ЖИ идеяларын анықтайды&lt;/span&gt;&lt;/a&gt;•IDEALENS адам жазған мәтіндердегі ЖИ идеяларын анықтайды&lt;/h4&gt;\n&lt;p&gt;Авторлар ЖИ идеялары негізінде адамдар жазған 50 әңгімеден тұратын деректер жинағын жинады. IDEALENS идеялардың ЖИ шығу тегін 68,0% жағдайда анықтады, ал мәтін детекторлары дерлік ештеңені сезбеді (PROSELENS 0%, Pangram 8,0%), өйткені сөздерді адам жазған еді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу синтетикалық деректер мен модельдік болжамдарға негізделген; нәтижелер нақты мәтінді жазу процесінің тікелей дәлелі емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tiimdilik-zhaene-tilaralykh-bejimdelu\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#tiimdilik-zhaene-tilaralykh-bejimdelu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•Тиімділік және тіларалық бейімделу&lt;/span&gt;&lt;/a&gt;•Тиімділік және тіларалық бейімделу&lt;/h4&gt;\n&lt;p&gt;Толық адам және толық ЖИ мәтіндерін ажырату бойынша 19 тестте IDEALENS 0,6% қателікпен 91,1% ЖИ құжаттарын анықтайды. Модель тек ағылшын тілінде оқытылғанымен, ол ағылшынша жоспарлар көмегімен 24 тілде тиімді жұмыс істейді және 0,1% қателікпен 95,3% ЖИ құжаттарын анықтайды.&lt;/p&gt;\n&lt;h4 id=\"baghalau-kriterijlerin-taldau\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#baghalau-kriterijlerin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•Бағалау критерийлерін талдау&lt;/span&gt;&lt;/a&gt;•Бағалау критерийлерін талдау&lt;/h4&gt;\n&lt;p&gt;90 мың болжамды талдау IDEALENS идеяларды, егер олар контекстсіз сандарды немесе әдістерді қамтыса, «ЖИ жасаған» деп бағалайтынын көрсетті. Керісінше, тексерілуі мүмкін дереккөздер мен мәселелерді талқылайтын идеялар «адамдық» деп танылады. Авторлар код пен деректерді ашық қолдануға ұсынды.&lt;/p&gt;\n&lt;h4 id=\"ideyalardyng-shyghu-tegin-khurylymdykh-zhosparlar-arkhyly-zertteu\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#ideyalardyng-shyghu-tegin-khurylymdykh-zhosparlar-arkhyly-zertteu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ИДЕЯЛАРДЫҢ ШЫҒУ ТЕГІН ҚҰРЫЛЫМДЫҚ ЖОСПАРЛАР АРҚЫЛЫ ЗЕРТТЕУ&lt;/span&gt;&lt;/a&gt;ИДЕЯЛАРДЫҢ ШЫҒУ ТЕГІН ҚҰРЫЛЫМДЫҚ ЖОСПАРЛАР АРҚЫЛЫ ЗЕРТТЕУ&lt;/h4&gt;\n&lt;p&gt;Идея детекторын оқытудағы басты қиындық — мәтін авторлығы туралы деректер болғанымен, құжаттағы идеялардың кімге тиесілі екенін көрсететін ауқымды белгілердің (labels) жоқтығы. Бұл мәселені шешу үшін біз құжаттың мазмұнын сақтайтын, бірақ бастапқы лексиканы алып тастайтын «жоспарлар» (outlines) негізінде модельді оқытамыз. Ол үшін біз әр жазу форматына тән дискурсивті рөлдерді анықтаймыз, құжаттың жоспарын бөліп аламыз және автордың стилистикалық белгілерін жою үшін оны қайта баяндаймыз. IDEALENS моделі қайта баяндалған жоспар негізінде авторлықты (адам немесе жасанды интеллект) болжауға үйретіледі, ал PROSELENS мұны бастапқы мәтін негізінде жүзеге асырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бастапқы мәтіннің орнына қайта баяндалған жоспарларды пайдалану модельге автордың стилистикалық ерекшеліктеріне емес, идеялардың құрылымына назар аударуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;WildOutlines корпусын қалыптастыру үшін біз WebOrganizer және Pangram 3.3.2 көмегімен белгіленген &lt;a href=\"concepts/wildai.html\"&gt;WildAI&lt;/a&gt; жиынтығынан 1 миллион құжатты таңдап алдық. Біз таңдауды 500 сөзден кем емес, сегіз форматтың біріне жататын (12-кесте) ағылшын тіліндегі мәтіндермен шектедік. «Аралас авторлық» белгісі бар құжаттар шығарып тасталды, өйткені оларда идеялардың қайнар көзін нақты анықтау мүмкін емес. Қорытынды деректер жиынтығы оқыту (842 мың), валидация (30 мың), калибрлеу (80 мың) және тест (50 мың) бөліктеріне бөлінген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дискурсивті рөл — бұл мәтін үзіндісінің құжаттың жалпы құрылымында атқаратын қызметі (мысалы, «оқиғаны сипаттау» немесе «нарық реакциясын бағалау»).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhosparlardy-avtomatty-tuerde-boelip-alu\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#zhosparlardy-avtomatty-tuerde-boelip-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жоспарларды автоматты түрде бөліп алу&lt;/span&gt;&lt;/a&gt;Жоспарларды автоматты түрде бөліп алу&lt;/h4&gt;\n&lt;p&gt;WildOutlines оқу жиынтығын жасау процесі үш кезеңнен тұрады: (i) Рөлдерді анықтау: біз TopicGPT фреймворкін бейімдедік және әр формат үшін базалық рөлдерді жасауда GPT-5.6 Sol моделін қолдандық. Қолмен тексеруден және дубликаттарды өшіруден кейін біз рөлдер жиынтығын алдық (мысалы, көркем емес мәтіндер үшін 42 рөл). (ii) Жоспарларды бөліп алу: Gemini 3.7 Flash және Gemini 3.1 Pro модельдерінің көмегімен біз құжаттарды «рөл — мазмұн сипаттамасы» жұптарының тізбегіне айналдырамыз. (iii) Қайта баяндау: модель автор стилін «шпаргалка» ретінде пайдаланбауы үшін біз жоспарларды Gemini 3.1 Pro көмегімен қайта баяндаймыз. Бұл жоспарлардағы «адами» стиль үлесін 8,5%-дан 0,3%-ға дейін төмендетеді (9-кесте), сонымен бірге түпнұсқамен косинустық ұқсастық 0,93 деңгейінде сақталады (10-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қайта баяндау тек оқыту процесінде қолданылады, өйткені стилистикалық белгілердің ағып кетуін болдырмау керек; инференция (тест) кезеңінде IDEALENS бастапқы жоспарлармен жұмыс істейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"idealens-va-proselens-tizimlarini-khitish\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-va-proselens-tizimlarini-khitish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IDEALENS ва PROSELENS тизимларини ўқитиш&lt;/span&gt;&lt;/a&gt;IDEALENS ва PROSELENS тизимларини ўқитиш&lt;/h4&gt;\n&lt;p&gt;Екі модель де &lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt; әдісі көмегімен қосымша оқытылған Nemotron-3.5-Lightning-30B-A3B архитектурасына негізделген. Модельдер 1% деңгейіндегі жалған оң нәтижелер (&lt;a href=\"concepts/false-positive-rate.html\"&gt;FPR&lt;/a&gt;) жиілігін қамтамасыз ететін шекара бойынша калибрленеді. Екі модель де бірдей архитектура мен деректерді пайдаланғандықтан, олардың нәтижелеріндегі айырмашылықтар тек бастапқы мәтіннен жоспар түріндегі ұсынымға ауысумен байланысты.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; ExamplesofitemsforfourcoredifferencesbetweenhumanandAIideas.Thefirst column describes each contrast and summarizes how it is realized in human and AI ideas.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT1.jpg\" alt=\"Кесте 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"eksperimentaldykh-khondyrghy\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#eksperimentaldykh-khondyrghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭКСПЕРИМЕНТАЛДЫҚ ҚОНДЫРҒЫ&lt;/span&gt;&lt;/a&gt;ЭКСПЕРИМЕНТАЛДЫҚ ҚОНДЫРҒЫ&lt;/h4&gt;\n&lt;p&gt;Авторлар IDEALENS және PROSELENS модельдерін 17 қолданыстағы детектормен, соның ішінде Pangram 4-пен салыстырмалы талдаудан өткізді. Тестілеу 19 сыртқы &lt;a href=\"concepts/benchmark.html\"&gt;бенчмарк&lt;/a&gt; пен арнайы жасалған үш деректер жиынтығын қамтиды: IDEASHIFT, IDEASHIFT-X және TWICETOLD. Бұл жиынтықтар төрт сценарий бойынша детекторлардың жұмысын бағалауға мүмкіндік береді: толық адам немесе толық AI шығу тегі бар құжаттар, сондай-ақ аралас нұсқалар (адам идеялары AI мәтінінде немесе AI идеялары адам мәтінінде). Идея детекторлары барлық төрт квадрантта жоғары дәлдік көрсетуі тиіс, ал проза детекторлары аралас жағдайларда тиімсіз болуы керек.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Идея детекторлары мәтін стиліне қарамастан ойдың қайнар көзін дәл анықтауы керек, ал проза детекторлары тек лингвистикалық үлгілерге сүйенеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AI идеяларын анықтау дәлдігін бағалау үшін болжамды белгінің (AI немесе адам) ойдың нақты қайнар көзіне сәйкестік метрикасы қолданылады. Базалық модельдер ретінде Pangram 4, EditLens-Llama-3.2-3B, Fast-DetectGPT, Binoculars, MELD және Desklib таңдалды. IDEALENS, PROSELENS және EditLens үшін калибрлеу жиынтығында 1% жалған оң нәтижелер (FPR) жиілігіне сәйкес келетін жаһандық шек орнатылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FPR (False Positive Rate) — модельдің адам мәтінін қате түрде AI жасаған деп жіктеу үлесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;19 сыртқы бенчмарктың 14-і ортақ шығу тегі бар құжаттарды қамтиды. Қосымша ретінде Pangram белгілеген 50 000 құжаттан тұратын тест жиынтығы және FPR-ді өлшеу үшін C4 корпусынан (ChatGPT шыққанға дейін жасалған) 10 000 құжат қолданылады. Сондай-ақ 10 бенчмарк адам жазған, бірақ AI өңдеген мәтіндерді қамтиды.&lt;/p&gt;\n&lt;p&gt;IDEASHIFT жоспардың егжей-тегжейлі болуының детекцияға әсерін зерттейді. Жиынтық 500 бастапқы құжатты қамтиды, олар үшін GPT-5.6 Sol бес деңгейлі промпт жасайды: 0-деңгейден (тек тақырып) 5-деңгейге дейін (толық жоспар). Проза AI арқылы жасалғандықтан, проза детекторлары бәрін AI деп жіктеуі керек, бірақ идея детекторлары адам жоспарлары бойынша жасалған құжаттарда дәлдіктің төмендеуін көрсетуі тиіс.&lt;/p&gt;\n&lt;p&gt;TWICETOLD кері сценарийді зерттейді: адам AI жасаған жоспар негізінде мәтін жазады. Жиынтық AI жоспарлары бойынша адамдар жазған 50 әңгімеден (әрқайсысы 500 сөз) тұрады.&lt;/p&gt;\n&lt;p&gt;IDEASHIFT-X IDEALENS-тің көптілді ортадағы жұмысын тексереді. Модель кез келген тілдегі құжаттар үшін ағылшын тіліндегі жоспарларды жасай алатын &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-экстракторды қолданатындықтан, оны қосымша оқытусыз қолдануға болады. Жиынтық FineWeb2-ден 24 тілде алынған 10 000 адам құжатын қамтиды.&lt;/p&gt;\n&lt;h4 id=\"idealens-ai-stilin-emes,-ideyalaryn-anykhtajdy\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-ai-stilin-emes,-ideyalaryn-anykhtajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IDEALENS AI стилін емес, идеяларын анықтайды&lt;/span&gt;&lt;/a&gt;IDEALENS AI стилін емес, идеяларын анықтайды&lt;/h4&gt;\n&lt;p&gt;IDEALENS мәтін стилін емес, идеялардың шығу тегін талдайды. IDEASHIFT промпттарындағы адам жоспары егжей-тегжейлі болған сайын, IDEALENS-тің қате анықтау деңгейі 94,9%-дан (0-деңгей) 6,8%-ға дейін (5-деңгей) төмендейді (4a-сурет). Керісінше, PROSELENS пен Pangram 4 адам идеяларының деңгейіне қарамастан, құжаттардың 86–100%-ын AI деп белгілейді. Егер жоспарды адам емес, AI жасаса, IDEALENS құжаттардың 96%-дан астамын AI деп тұрақты түрде анықтайды (25-кесте). Ең үлкен төмендеу 3 және 4-деңгейлер арасында байқалады, бұл кезеңде промпттар құрылымдық рөлдерден бөлек нақты мазмұнды да қамтиды (24-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS адам промпттары егжей-тегжейлі болған сайын қате анықтау деңгейін едәуір төмендетіп, идея көзіне жоғары сезімталдық танытады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS адам идеяларының AI арқылы қайта жазылуына төзімді. AI адам мәтініне үстірт өзгерістер енгізген 12 бенчмаркта IDEALENS құжаттардың 94,7%-ын адамдікі деп белгілейді (PROSELENS — 50,7%, Pangram 4 — 43,8%, 19-кесте). GEDE деректер жиынында IDEALENS LLM енгізген шағын түзетулерден кейін адам эсселерінің небәрі 0,5%-ын AI деп белгілейді. HART тестінде IDEALENS AI қайта жазған мәтіндердің 4,9%-ын AI деп белгілейді, бұл Pangram 4 (42,8%) және PROSELENS (44,5%) көрсеткіштерінен әлдеқайда төмен.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Парафраздау» — бұл мәтіннің пішінін өзгертіп, бастапқы мағынаны сақтау процесі, бұл стильге негізделген детекторларды жаңылыстыруы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS адам жазған TWICETOLD прозалық шығармаларындағы AI идеяларын анықтайды. IDEALENS бұл әңгімелердің 68%-ын (95% CI 54–79%) AI деп белгілейді, PROSELENS — 0%, Pangram 4 — 8%. Барлық детекторлар түпнұсқа AI әңгімелерін анықтауда сенімді (96–100%), бірақ тек IDEALENS адам әңгімелері үшін өз болжамын сақтайды (4b-сурет). Қателердің 12-сі фантастикалық элементтері бар әңгімелерге қатысты.&lt;/p&gt;\n&lt;p&gt;IDEALENS қолданыстағы ашық детекторлардан озық. 19 бағалау бөлігінде IDEALENS 0,6% FPR (қате оң нәтиже) деңгейінде AI құжаттарының 91,1%-ын анықтайды, EditLens-3B 0,2% FPR деңгейінде 81,8%-ын анықтайды (21-кесте). PROSELENS толық мәтін бойынша оқытылғанда 98,9% нәтижеге жетеді. C4 деректер жиынындағы 10 000 ескі құжатта IDEALENS небәрі 0,01% қателік көрсетеді. Модельдің әлсіз тұсы — DIPPER парафраздау әдісі (77,6% анықтау), бұл контенттің де өзгеруімен байланысты болуы мүмкін.&lt;/p&gt;\n&lt;h4 id=\"1-sheshushi-zhaene-aembebap-boelshekter\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#1-sheshushi-zhaene-aembebap-boelshekter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1 Шешуші және әмбебап бөлшектер&lt;/span&gt;&lt;/a&gt;1 Шешуші және әмбебап бөлшектер&lt;/h4&gt;\n&lt;p&gt;Бөлшектер автордың қорытындысын өзгертуі немесе кез келген тақырыпқа сәйкес келуі мүмкін. Мысалы, Sony Cyber-shot RX100-дегі mini-HDMI порты мен батарея бөлімі — бұл нақты физикалық факт, ал Jony Ive динамигінің эстетикасы кез келген премиум құрылғыға сәйкес келетін жалпы сипаттама.&lt;/p&gt;\n&lt;h4 id=\"2-funkcionaldy-zhaene-syrttaj-nakhtylykh\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#2-funkcionaldy-zhaene-syrttaj-nakhtylykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2 Функционалды және сырттай нақтылық&lt;/span&gt;&lt;/a&gt;2 Функционалды және сырттай нақтылық&lt;/h4&gt;\n&lt;p&gt;Сандар тексерілуі мүмкін немесе жай ғана нақтылық иллюзиясын тудыруы мүмкін. 10 күн ішінде 700 юань пайда табу — бұл өлшенетін факт. «Техникалық кедергілерді жою» немесе «мамандармен талқылау» сияқты жалпы ұсыныстар сарапшылық стильге еліктейді, бірақ тексерілетін ақпаратқа ие емес.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жалпы кеңестерді қамтитын мәтіндер нақты ақпарат бермей сарапшылық стильге еліктеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"3-shektelgen-zhaene-shamadan-tys-kengejtilgen-maelimdemeler\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#3-shektelgen-zhaene-shamadan-tys-kengejtilgen-maelimdemeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3 Шектелген және шамадан тыс кеңейтілген мәлімдемелер&lt;/span&gt;&lt;/a&gt;3 Шектелген және шамадан тыс кеңейтілген мәлімдемелер&lt;/h4&gt;\n&lt;p&gt;Мәлімдемелер нақты шекараларға ие болуы немесе дәлелдерден асып кетуі мүмкін. 2022 жылдың ортасында белгілі бір орталықтан флотты іске қосу — бұл тексерілетін факт. 2025 жылғы Kia K4 «тұрақты мұра» және «жаңа стандарт» болады деген болжам спекуляциялық болып табылады және дәлелдермен расталмаған.&lt;/p&gt;\n&lt;h4 id=\"4-sakhtalghan-zhaene-zhojylghan-shyghyndar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#4-sakhtalghan-zhaene-zhojylghan-shyghyndar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4 Сақталған және жойылған шығындар&lt;/span&gt;&lt;/a&gt;4 Сақталған және жойылған шығындар&lt;/h4&gt;\n&lt;p&gt;Авторлар мәтіндердегі шектеулердің қалай қабылданатынын талдайды. Адам жазған мәтіндерде нақты кедергілер (мысалы, итті үйретудегі логистикалық қиындықтар) сақталады, ал жасанды интеллект (ЖИ) модельдері жағдайды идеалды деп сипаттап, кемшіліктерді ескермейді. Мысал ретінде M3 MacBook Air ноутбугын бағалау келтірілген: ЖИ оны «идеалды тепе-теңдік» деп сипаттап, кемшіліктерін айтпайды, ал адамдар шектеулерді нақты көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS моделі ЖИ идеяларын анықтауда жоғары дәлдік (95,3%) көрсетеді және мәтіннің тіліне тәуелсіз тұрақты нәтиже береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS жүйесі IDEASHIFT-X деректер жинағы аясында 24 тілде сыналды. Тек ағылшын тілінде оқытылғанына қарамастан, модель 0-деңгейлі (толық ЖИ) құжаттардың 95,3 пайызын және 5-деңгейлі (толық адам) құжаттардың тек 0,7 пайызын дұрыс жіктейді. Салыстыру үшін, прозалық детекторлар (PROSELENS, Pangram4) әсіресе ресурстары аз тілдерде (тамил, амхар) нашар нәтиже көрсетеді. FineWeb2-ден алынған 10 000 адам жазған мәтінде модель төмен деңгейдегі жалған оң нәтижелерді (FPR) — 0,1% құрады.&lt;/p&gt;\n&lt;p&gt;IDEALENS жоспар (outline) негізінде оқытылғанымен, «шикі» мәтінмен де тиімді жұмыс істейді. Жалпы шығу тегін талдауда модель 0,3% FPR деңгейімен ЖИ құжаттарының 96,1 пайызын анықтайды. Алайда, ЖИ идеяларды жасап, адам мәтінді жазған TWICETOLD бенчмаркінде модель ЖИ контентінің тек 6 пайызын таниды, өйткені адам жазған детальдар ЖИ идеяларын «жасырады».&lt;/p&gt;\n&lt;h4 id=\"zhi-ideyalaryn-adam-ideyalarynan-ne-azhyratady\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#zhi-ideyalaryn-adam-ideyalarynan-ne-azhyratady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЖИ идеяларын адам идеяларынан не ажыратады&lt;/span&gt;&lt;/a&gt;ЖИ идеяларын адам идеяларынан не ажыратады&lt;/h4&gt;\n&lt;p&gt;Айырмашылықтарды түсіну үшін авторлар абляциялық зерттеу (36-кесте) өткізді. Бұл зерттеу IDEALENS-тің рөлдерге немесе құрылымға емес, негізінен мазмұнға сүйенетінін көрсетті. Russell және басқалардың (2026b) әдістемесін қолдана отырып, авторлар 90 000 болжамнан 79 түсіндірілетін белгіні бөліп алды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляциялық зерттеу (ablation study) — бұл модельдің жеке компоненттерін немесе деректерін кезекпен алып тастау арқылы олардың түпкілікті нәтижеге қаншалықты әсер ететінін түсіну әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Негізгі айырмашылықтар мыналар: ЖИ идеялары көбінесе абстрактілі және кез келген нәрсеге сәйкес келеді (мысалы, кез келген динамик үшін «премиум дыбыс сапасы»), ал адам идеялары контекст үшін маңызды нақты детальдарды қамтиды (мысалы, штативті қолданудағы мәселелер). ЖИ көбінесе нақты көрінгенімен, қолданбалы құны жоқ кеңестер береді (мысалы, қалай енгізу керектігін түсіндірместен «Agile әдіснамасы»). Сонымен қатар, ЖИ маңыздылықты асыра сілтеуге (болашақ туралы болжамдар) және кемшіліктерді жасыруға бейім, ал адамдар сақ болжамдар жасайды және шектеулерді ашық мойындайды.&lt;/p&gt;\n&lt;h4 id=\"bajlanysty-zhumystar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#bajlanysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты жұмыстар&lt;/span&gt;&lt;/a&gt;Байланысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;ЖИ мәтін детекторлары (Mitchell және басқалар, 2023 т.б.) проза авторлығын бинарлы жіктеуге бағытталған. Аралас авторлық бойынша зерттеулер әдетте ЖИ-ді редакциялау құралы ретінде қарастырады немесе мазмұнды стильден ажыратуға тырысады. Олардан айырмашылығы, IDEALENS мәтіннің өзіне емес, жазу процесінің когнитивті теорияларына (Flower &amp;amp; Hayes, 1981) сүйене отырып, идеялардың шығу тегін зерттейді. Авторлар стильдік өзгерістерді қалыпқа келтіру әдістеріне (Krishna және басқалар, 2020) ұқсас, бірақ кері бағытта жұмыс істейтін трансформацияланған деректерде оқыту принципін қолданады.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Accuracy by document length on the out-of-domain evaluations (%, global 1% cut).The training corpus has no documents under 500 words.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT2.jpg\" alt=\"Кесте 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 32.&lt;/strong&gt; MELD, per attack:by attack.Fire rate % at the 1% cut.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT32.jpg\" alt=\"Кесте 32\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 33.&lt;/strong&gt; DetectRL-X, per attack:by attack.Fire rate % at the 1% cut.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT33.jpg\" alt=\"Кесте 33\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"negizgi-khorytyndylar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#negizgi-khorytyndylar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі қорытындылар&lt;/span&gt;&lt;/a&gt;Негізгі қорытындылар&lt;/h4&gt;\n&lt;p&gt;Зерттеу жасанды интеллект (ЖИ) жасаған мәтіндер мен адам жазған мәтіндерді идеяларды талдау арқылы тиімді ажыратуға болатынын көрсетеді. Авторлар 1 000 000 жоспар (аутлайн) корпусын пайдаланып, проза детекторынан алынған «күміс» белгілердің көмегімен IDEALENS моделін оқытты. Модель 22 деректер жиынтығында сыналды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS моделі идеялардың шығу тегін сәтті анықтайды, қолданыстағы аналогтардан асып түседі және тек ағылшын тілінде оқытылғанына қарамастан, 24 тілмен жұмыс істеу қабілетін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS идеялардың шығу тегін мәтін құрылымынан өзгеше болған жағдайда да қадағалайды. Сол белгілер негізінде, бірақ шикі мәтін бойынша оқытылған PROSELENS бақылау моделінен айырмашылығы, IDEALENS жоғары дәлдікті көрсетеді. 13 616 бөлінген элементте 79 белгінің 64-і IDEALENS бағаларымен «ЖИ адамға қарсы» жіктеу бағытында сәйкес келді, бұл ретте тек бір жағдайда ғана қайшылық анықталды (§J.3 және 44-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Күміс» белгілер — бұл қолмен белгіленген «алтын» деректер болмаған кезде, оқыту үшін басқа алгоритмдер арқылы автоматты түрде алынған деректер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zertteu-shekteuleri\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#zertteu-shekteuleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу шектеулері&lt;/span&gt;&lt;/a&gt;Зерттеу шектеулері&lt;/h4&gt;\n&lt;p&gt;Авторлар әдістің бірқатар шектеулерін (§A) атап өтеді. Оқыту белгілері идеялардың шығу тегін тек жуықтап қана көрсетеді, ал бинарлы жіктеу адам мен ЖИ ынтымақтастығында жасалған мәтіндерді дұрыс өңдеуге мүмкіндік бермейді. Сонымен қатар, модельдің тиімділігі қысқа мәтіндерде және кейбір бәсекелес шабуылдар кезінде төмендейді. Жоспарларды бөліп алу процесі меншікті модельдерге тәуелді, ал TWICETOLD деректер жиынтығы 50 оқиғамен шектелген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдің шектеулері бар: ол қысқа мәтіндерде тиімділігі төмен және идея құрылымын бөліп алу үшін үшінші тараптың меншікті алгоритмдеріне сүйенеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f1.jpg\" alt=\"1-сурет: IDEALENS идеяларды қадағалау; дәстүрлі детекторлар мәтінді қадағалайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: IDEALENS идеяларды қадағалау; дәстүрлі детекторлар мәтінді қадағалайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: IDEALENS идеяларды қадағалау; дәстүрлі детекторлар мәтінді қадағалайды. Біз ортақ шығу тегі (толығымен адам немесе толығымен жасанды интеллект) және аралас шығу тегі (адам идеялары мен ЖИ прозасы немесе ЖИ идеялары мен адам прозасы) сценарийлерін қамтитын төрт квадрантты ұсынамыз. Дәстүрлі детекторлардан (мысалы, Pangram4, Glickenhaus et al., 2026; EditLens-3B, Thai et al., 2026) айырмашылығы, IDEALENS прозаның емес, идеялардың қайнар көзін дәл анықтай алады. IDEALENS адам идеялары негізінде ЖИ жасаған құжаттардың 94,7%-ын адамдікі деп жіктейді, ал Pangram тек 43,8%-ын адамдікі деп белгілейді. ЖИ идеялары бойынша адамдар жазған әңгімелердің жаңа деректер жиынында (§3), IDEALENS 68,0%-ын ЖИ деп белгілейді, ал Pangram мен EditLens сәйкесінше тек 8,0% және 0,0% деп белгілейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f2.jpg\" alt=\"2-сурет: IDEALENS бүкіл мәтінді емес, әр құжаттың жоспарын көреді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: IDEALENS бүкіл мәтінді емес, әр құжаттың жоспарын көреді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: IDEALENS бүкіл мәтінді емес, әр құжаттың жоспарын көреді. Құжаттарға формат тағайындалады және олар жоспар түріне келтіріледі, әрқайсысы формат рөлдерінің бірімен белгіленеді. Бұл мысал мақаладан алынған 17 жоспар элементінің екеуін көрсетеді. Оқыту үшін жоспарлар түпнұсқа құжаттардан көшірілген сөздерді алып тастау үшін қайта өңделеді. IDEALENS оқыту барысында қайта өңделген жоспардан Pangram белгісін үйренеді және шығарылған жоспарлар инференция кезінде ұсынылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f3.jpg\" alt=\"3-сурет: Жоспар негізінде оқытылған IDEALENS идея авторлығын анықтайды, ал дәстүрлі детекторлар проза авторлығын қадағал\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Жоспар негізінде оқытылған IDEALENS идея авторлығын анықтайды, ал дәстүрлі детекторлар проза авторлығын қадағалайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Жоспар негізінде оқытылған IDEALENS идея авторлығын анықтайды, ал дәстүрлі детекторлар проза авторлығын қадағалайды. Идеялар мен проза бір авторға (x-осі) және әртүрлі авторларға (y-осі) тиесілі барлық бенчмарктар бойынша орташа дәлдік. IDEALENS ортақ (95,3%) және аралас (81,3%) авторлықпен де дәл жұмыс істейтін жалғыз детектор. 3-суретте 22 бенчмарктан 51 бағалау бөлімі бойынша негізгі нәтижелеріміз жинақталған, мұнда әр нүкте ортақ және аралас шығу тегі бар құжаттардағы идеяларды анықтаудың жалпы дәлдігі бойынша сызылған детектор болып табылады. IDEALENS ортақ (95,3%) және аралас (81,3%) жағдайларда да жоғары дәлдікке қол жеткізетін жалғыз детектор. PROSELENS және Pangram 4 ортақ шығу тегі бар құжаттарда өте дәл (сәйкесінше 99,1% және 98,5%), бірақ аралас жағдайларда құжат идеяларының қайнар көзін анықтай алмайды (25,4% және 25,9%). PROSELENS IDEALENS-пен бірдей негізге, оқу құжаттарына және оқу белгілеріне ие болғандықтан, бұл біздің жоспар өкілдігіміздің әсерін көрсетеді, мұны ModernBERT негізіндегі жұп (Warner et al., 2025) басқа негізбен қайталайды. IDEALENS сонымен қатар тестілеу кезінде шикі мәтінді енгізуге күтпеген жерден жақсы бейімделеді, ортақ шығу тегінде жоғары дәлдікті және PROSELENS-ке қарағанда аралас шығу тегінде айтарлықтай жоғары дәлдікті көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f4.jpg\" alt=\"4-сурет: IDEALENS ЖИ жасаған мәтіндегі адам қатысуының әртүрлі деңгейлерін анықтайды (сол жақта) және TWICETOLD мен оның\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: IDEALENS ЖИ жасаған мәтіндегі адам қатысуының әртүрлі деңгейлерін анықтайды (сол жақта) және TWICETOLD мен оның ЖИ нұсқалары үшін ұқсас P(AI) мәндерін белгілейді (оң жақта).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: IDEALENS ЖИ жасаған мәтіндегі адам қатысуының әртүрлі деңгейлерін анықтайды (сол жақта) және TWICETOLD мен оның ЖИ нұсқалары үшін ұқсас P(AI) мәндерін белгілейді (оң жақта). (a) IDEASHIFT-те IDEALENS ЖИ жасаған мәтіндегі адам қатысуының әртүрлі деңгейлерімен қадағаланатын жалғыз модель; ЖИ бақылауында барлық модельдер барлық деңгейлерде дерлік толық жұмыс істейді. (b) TWICETOLD-дағы ЖИ және адам жазған әңгімелер арасындағы P(AI) айырмашылығы IDEALENS үшін PROSELENS-ке қарағанда әлдеқайда кішірек.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f5.jpg\" alt=\"5-сурет: АДАМДЫҚ АССОЦИАЦИЯ БАЛЛАРЫНЫҢ таралуы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: АДАМДЫҚ АССОЦИАЦИЯ БАЛЛАРЫНЫҢ таралуы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: АДАМДЫҚ АССОЦИАЦИЯ БАЛЛАРЫНЫҢ таралуы. Әр нүкте 79 белгінің бірін білдіреді; көк және қызғылт сары түстер сәйкесінше адам және ЖИ-мен байланысты деп ұсынылған белгілерді көрсетеді. Балл — бұл бір форматта белгі іске қосылатын элемент детектордың адамдық балын белгі іске қосылмайтын элементке қарағанда жоғарырақ алу ықтималдығы. 0,5 балл ассоциацияның жоқтығын білдіреді. Бос нүктелер 0,5-ті қамтитын 95% bootstrap интервалдарына ие; тік орналастыру тек көріну үшін берілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f6.jpg\" alt=\"6-сурет: Жеке белгілер үшін адам ассоциациясының баллдары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Жеке белгілер үшін адам ассоциациясының баллдары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет: Жеке белгілер үшін адам ассоциациясының баллдары. Нүктелер белгілердің баллдарын, ал көлденең сызықтар олардың 95% &lt;a href=\"concepts/butstrep.html\"&gt;бутстреп&lt;/a&gt;-интервалдарын көрсетеді, олар ұсынылған бағыт бойынша топтастырылған. Адам ұсынған белгілер ең жоғары баллдан ең төменгісіне дейін, ал ЖИ (AI) ұсынған белгілер ең төменгісінен ең жоғарысына дейін реттелген, бұл ретте әр панельдің ұсынылған бағытпен ең күшті ассоциациялары жоғарыда орналасқан. 0,5-тен жоғары баллдар адамға, 0,5-тен төмен баллдар ЖИ-ге бейімділікті білдіреді. Іші қуыс нүктелер 0,5-ті қамтитын интервалдарға ие, ал крест белгісі бақыланатын бейімділігі ұсынылған бағытқа қайшы келетін белгіні көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f7.jpg\" alt=\"7-сурет: P(AI) детекторының квинтильдері бойынша белгілердің белсендірілуі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: P(AI) детекторының квинтильдері бойынша белгілердің белсендірілуі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет: P(AI) детекторының квинтильдері бойынша белгілердің белсендірілуі. Элементтер әр формат шеңберінде P(AI) детекторы бойынша рейтингтеліп, ең төменгі P(AI) (1) мен ең жоғары P(AI) (5) аралығында бес топқа бөлінді. Әр нүкте топтағы көрсетілген белгі белсендірілетін элементтердің үлесін көрсетеді. Белсендірілу адам ұсынған екі белгі (#13 және #3) үшін квинтильдер бойынша төмендейді, ал ЖИ ұсынған белгі (#63) үшін артады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"kesteler\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#kesteler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кестелер&lt;/span&gt;&lt;/a&gt;Кестелер&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Everyarmweevaluateanditslabelundertheidea-authorshiprule. “Attacked” marks model-written text that was humanized or adversarially rewritten; its ideas stay the model’s. “Mixed”armsarereportedasP(AI)only;“notplaced”armskeepmostofamodel’sproseaftera person’s edit and are left out of the quadrants.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT3.jpg\" alt=\"Кесте 3\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Детекторлар&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;идея көзін&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;көрмейді&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жоспарлар&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арқылы&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;құрылымды&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдау&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жасанды&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;интеллект&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;идеясын&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анықтау&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Контентті&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тексерудің&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жаңа стандарты&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;provenance&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Rishanth Rajendhran, Minjoon Choi, Jenna Russell, Ramya Namuduri, Deniz Bölöni-Turgut, Marzena Karpinska, John Wieting, Mohit Iyyer&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data
