            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"198\" cy=\"71\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"582\" cy=\"274\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · ENV_DATA   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жасанды интеллект орман&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өрттерін спутниктерден&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;тезірек анықтайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f1.jpg\" alt=\"1-сурет: Зерттеу аумағының карталары. Оқыту үшін пайдаланылған штаттар қара түспен, бағалау үшін — қызыл түспен, ал екеу\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Зерттеу аумағының карталары. Оқыту үшін пайдаланылған штаттар қара түспен, бағалау үшін — қызыл түспен, ал екеуі үшін де пайдаланылған штаттар ашық көк түспен белгіленген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Дәстүрлі спутниктік мониторинг өрт ошақтарын жиі өткізіп алады және қате дабылдар береді. Зерттеу көрсеткендей, CatBoost машиналық оқыту моделі GOES FDC стандартты өнімінен дәлдігі мен жылдамдығы бойынша озып тұр. Жаңа тәсіл әсіресе түнгі уақытта тиімді, ал ескі алгоритмдер бұл тұрғыда өте төмен нәтиже көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;CatBoost дәлдік пен қамту бойынша GOES FDC-ден озып түсті&lt;/li&gt;\n&lt;li&gt;Модель 26 өртті стандартты жүйелерден бұрын анықтады&lt;/li&gt;\n&lt;li&gt;Түнгі уақытта анықтау тиімділігі айтарлықтай жоғары&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер GOES спутниктеріндегі ABI аспабының деректері мен VIIRS (375 метр дәлдікпен жылу сәулеленуін тіркейтін радиометр) эталондық белгілерін пайдаланды. Оқу жиынтығы 2022–2023 жылдар аралығындағы 60 мыңнан астам өрт пикселін және 1,2 миллион «таза» пикселді қамтиды. CatBoost моделі FDC (Fire Detection and Characterization) алгоритмі ескермейтін күрделі кеңістіктік-спектрлік өрнектерді анықтауға үйретілген.&lt;/p&gt;\n&lt;p&gt;2024 жылғы бес аймақтағы тест нәтижелері модельдің &lt;a href=\"concepts/f1-mera.html\"&gt;F1-өлшемі&lt;/a&gt; (дәлдік метрикасы) FDC-ге қарағанда 0,16–0,38-ге жоғары екенін көрсетті. 51 тарихи оқиғаның 26-сында модель өртті қолданыстағы жүйелерден бұрын анықтады. Ең маңыздысы, FDC дерлік жұмыс істемейтін түнгі уақытта (&lt;a href=\"concepts/recall.html\"&gt;recall&lt;/a&gt; 0,03 шамасында) нейрондық желі жоғары дәлдікті сақтап қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер тек GOES спутниктік деректерімен шектелген және аймақтық жағдайларға байланысты өзгеруі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Орман өрттері адам өміріне, экожүйелерге және мүлікке елеулі қауіп төндіреді. Бұл зерттеуде GOES ABI спутниктік суреттері негізінде өрт ошақтарын анықтаудың машиналық оқыту әдісі ұсынылған. Зерттеушілер CatBoost моделін мыңдаған ABI суреттері мен VIIRS аспабы тіркеген 300 000-нан астам өрт деректері негізінде оқытты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost — бұл шешім ағаштары негізінде градиентті күшейтуді қолданатын машиналық оқыту алгоритмі, ол кестелік деректер мен суреттермен жұмыс істеуде тиімді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдің тиімділігі бес түрлі аймақты қамтитын тәуелсіз деректер жиынтығында бағаланды. Нәтижелер CatBoost моделінің қазіргі GOES Fire Detection and Characterization (FDC) өнімінен дәлдік (precision), толықтық (recall) және F1-өлшемі бойынша басым екенін көрсетті. Барлық зерттелген аймақтарда CatBoost моделінің F1-өлшемі FDC-ден 0,16–0,38-ге жоғары болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost моделі стандартты FDC өнімінен 0,16–0,38-ге жоғары F1-өлшеміне қол жеткізді және 26 өртті басқа жүйелерден ертерек анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;51 тарихи өрт оқиғасын талдау анықтау жылдамдығындағы артықшылықты көрсетті: CatBoost 26 өртті VIIRS және GOES FDC жүйелерінен бұрын тіркеді, ал FDC мұны тек 6 жағдайда ғана орындай алды. Түнгі уақытта өртті анықтауға ерекше назар аударылды: CatBoost моделі түнде де жоғары дәлдікті сақтайды, ал GOES FDC жүйесінің толықтық (recall) көрсеткіші түнде 0,03 шамасында ғана болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу алгоритмдерді салыстыруға негізделген; нәтижелер спутниктік деректердің ерекшеліктері мен аймақтық жағдайларға байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"orman-oertterin-monitoringteuding-oezektiligi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#orman-oertterin-monitoringteuding-oezektiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Орман өрттерін мониторингтеудің өзектілігі&lt;/span&gt;&lt;/a&gt;Орман өрттерін мониторингтеудің өзектілігі&lt;/h4&gt;\n&lt;p&gt;Орман өрттері экожүйелерге, инфрақұрылымға және адам өміріне елеулі қауіп төндіреді. Мәселе ауқымы кеңейіп келеді: 1980–2023 жылдар аралығында өрттен туындаған ірі апаттардың жиілігі төрт есеге артты. 2025 жылдың қаңтарында Лос-Анджелесте болған «Palisades Fire» өрті бұған айқын мысал: 24 күн ішінде 95 км² жер өртеніп, 6800-ден астам құрылыс қирады және 12 адам қаза тапты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1980–2023 жылдар аралығында ірі орман өрттерінің жиілігі 4 есеге өсті, бұл өртті дер кезінде анықтауды апаттардың алдын алу үшін өте маңызды міндетке айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өрт ошақтарын ерте анықтау үшін геостационарлық (&lt;a href=\"concepts/generative-engine-optimization.html\"&gt;GEO&lt;/a&gt;) жерсеріктер кеңінен қолданылады. Жердің айналуымен синхрондалған орбитасының арқасында олар бір аймақты әр 5–15 минут сайын бақылай алады. GOES жерсеріктеріне арналған FDC және Meteosat үшін FRP-PIXEL сияқты қолданыстағы алгоритмдер жарықтық шектеріне сүйенеді. Алайда, олардың кемшіліктері бар: FDC алгоритмі көбінесе 3,7 мкм диапазонында көрінетін өрттерді өткізіп алады, сондай-ақ екі әдіс те жалған дабылдардың (false alarms) жоғары деңгейін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"mashinalykh-okhytu-ml-taesili\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#mashinalykh-okhytu-ml-taesili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Машиналық оқыту (ML) тәсілі&lt;/span&gt;&lt;/a&gt;Машиналық оқыту (ML) тәсілі&lt;/h4&gt;\n&lt;p&gt;Болашағы зор шешім — күрделі кеңістіктік-спектрлік заңдылықтарды анықтауға қабілетті машиналық оқыту (ML) алгоритмдерін қолдану. Мұндай модельдерді оқыту үшін әрбір пиксель «өрт» немесе «өрт емес» деп белгіленген деректер жиынтығы қажет. Бұған төмен орбитадағы (LEO) жерсеріктердің деректері немесе орман шаруашылығының есептері негіз болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Машиналық оқыту — бұл деректерді талдау әдісі, мұнда алгоритм қатаң ережелерді орындаудың орнына, үлкен көлемдегі мысалдар негізінде (мысалы, өрттің спектрлік белгілері) заңдылықтарды дербес «үйренеді».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұрынғы зерттеулерде Random Forest және CNN сияқты терең оқыту әдістері қолданылған. Алайда, қазіргі модельдер шағын оқу жиынтықтары (бірнеше жүз пиксель), тар географиялық қамту және операциялық алгоритмдермен салыстырылмауы сияқты шектеулерге ие. Сондай-ақ, модельдердің күндізгі және түнгі жұмыс тиімділігі сирек жағдайларда ғана бөлек бағаланады.&lt;/p&gt;\n&lt;h4 id=\"zertteu-makhsattary-men-aedisnamasy\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#zertteu-makhsattary-men-aedisnamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу мақсаттары мен әдіснамасы&lt;/span&gt;&lt;/a&gt;Зерттеу мақсаттары мен әдіснамасы&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыстың мақсаты — GOES FDC өнімінен дәлдік және жалған дабылдар деңгейі бойынша озық ML моделін жасау. Авторлар 60 000-нан астам өрт пиксельдері мен 1,2 миллионға жуық өрт емес пиксельдерді қамтитын деректер базасын пайдаланды. VIIRS (LEO) аспабының деректері эталон ретінде қабылданды. Оқыту 2022–2023 жылдардағы деректер негізінде, ал бағалау 2024 жылғы деректер негізінде жүзеге асырылды, бұл модельдің жаңа уақыт пен кеңістік жағдайларына бейімделу қабілетін бағалауға мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель 2022–2023 жылдардағы деректерде оқытылып, 2024 жылғы деректерде сынақтан өтті; нәтижелер ақиқат деп қабылданған VIIRS эталондық деректерінің сапасына байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2-zertteu-ajmaghy-zhaene-derekkoezder\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#2-zertteu-ajmaghy-zhaene-derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Зерттеу аймағы және дереккөздер&lt;/span&gt;&lt;/a&gt;2. Зерттеу аймағы және дереккөздер&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде талданған аймақтар және олар үшін алынған спутниктік суреттер сипатталған. Суреттер GEOfire анықтауға арналған ML моделін оқыту және бағалау үшін қолданылды. Сонымен қатар, ML моделінің ерте анықтау қабілетін GOES FDC өнімімен салыстыру үшін арнайы өрт оқиғаларының жиынтығы жасалды.&lt;/p&gt;\n&lt;h4 id=\"21-zertteu-ajmaghy\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#21-zertteu-ajmaghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.1. Зерттеу аймағы&lt;/span&gt;&lt;/a&gt;2.1. Зерттеу аймағы&lt;/h4&gt;\n&lt;p&gt;Зерттеу аймағы АҚШ, Мексика және Канаданың әртүрлі ландшафт түрлерін (ормандар, батпақтар, шөлдер, ауыл шаруашылығы және қалалық аймақтар) қамтиды (1-сурет). Аймақтар оқыту (шамамен 2,1 млн км²) және бағалау (шамамен 2 млн км²) үшін бөлінген. Флорида, Алабама, Миссисипи, Луизиана, Оклахома, сондай-ақ Мексиканың Чиуауа және Дуранго штаттары тек оқыту үшін; Техас пен Джорджия оқыту және бағалау үшін; ал Калифорния, Орегон, Аризона, Юта және Британдық Колумбияның бір бөлігі тек бағалау үшін пайдаланылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеудің жалпы ауданы шамамен 4,1 млн км² құрайды, ол оқыту және сынақ аймақтарына бөлінген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-derekkoezder\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#22-derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. Дереккөздер&lt;/span&gt;&lt;/a&gt;2.2. Дереккөздер&lt;/h4&gt;\n&lt;p&gt;Оқыту және бағалау жиынтықтары бірдей құрылымға ие және VIIRS өрт анықтаулары мен ±2,5 минут аралығында алынған GOES ABI суреттерін қамтиды. Оқыту жиынтығы 2022–2023 жылдардағы барлық VIIRS деректерін (324 502 анықтау және 4 330 GOES ABI суреті) қамтиды. Бағалау жиынтығы 2024 жылғы деректерге негізделген (1-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIIRS — Suomi NPP спутниктеріндегі радиометр, ол 375 м ажыратымдылықпен термиялық ауытқуларды тіркейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"221-viirs-belsendi-oert-oenimi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#221-viirs-belsendi-oert-oenimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2.1. VIIRS белсенді өрт өнімі&lt;/span&gt;&lt;/a&gt;2.2.1. VIIRS белсенді өрт өнімі&lt;/h4&gt;\n&lt;p&gt;Эталон ретінде VNP14IMG Collection 2 өнімі қолданылды. Ол координаттарды, уақытты, өрттің сәулелену қуатын (FRP) және сенімділік деңгейін ұсынады. Сенімділігі төмен пикселдер талдаудан шығарылды. Деректер NASA LAADS DAAC мұрағатынан алынды.&lt;/p&gt;\n&lt;h4 id=\"222-goes-abi-suretteri\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#222-goes-abi-suretteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2.2. GOES ABI суреттері&lt;/span&gt;&lt;/a&gt;2.2.2. GOES ABI суреттері&lt;/h4&gt;\n&lt;p&gt;2 км ажыратымдылықтағы үш өнім жүктелді: көп арналы бұлт және ылғалдылық суреттері (MCMI), бұлтсыз аспан маскасы (ACM) және FDC. MCMI және ACM модель үшін кіріс деректері, ал FDC салыстыру үшін эталон болып табылады. FDC термиялық ауытқуларды анықтау үшін инфрақызыл диапазондарды пайдаланады. Ерте анықтау талдауы (4.4-бөлім) екі рет жүргізілді: алдымен «өңделген» және «қаныққан» санаттармен, содан кейін «жоғары сенімділік» санаты қосылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Жоғары сенімділік» санатын пайдалану жалған дабылдар (false alarm) қаупін арттырады, бұл дәлдікті бағалау кезінде ескерілді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"223-erte-anykhtau-ueshin-oert-perimetri-derekteri\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#223-erte-anykhtau-ueshin-oert-perimetri-derekteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2.3. Ерте анықтау үшін өрт периметрі деректері&lt;/span&gt;&lt;/a&gt;2.2.3. Ерте анықтау үшін өрт периметрі деректері&lt;/h4&gt;\n&lt;p&gt;ML моделі мен GOES FDC мүмкіндіктерін салыстыру үшін 51 өрт оқиғасы бойынша деректер жиынтығы жасалды. Периметрлер АҚШ-тағы орман өрттерінің шекараларын көрсететін WFIGS деректер базасынан алынды.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Өрт оқиғаларының жиынтығы&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Өрт оқиғасы&lt;/th&gt;\n&lt;th&gt;Өртті алғашқы анықтау&lt;/th&gt;\n&lt;th&gt;Уақыт айырмашылығы (минут)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Beech&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;300&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bentley&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;480&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davis&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;445&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Smokehouse Creek&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;245&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Airport&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Blue Mountain&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Boise&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Dry Branch&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Duck Nest&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fall Branch&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fodderstack&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Foote&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Walker&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;(1) Тек CatBoost және VIIRS; (2) Тек VIIRS.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"catboost-tiimdiligin-goes-fdc-men-salystyru\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#catboost-tiimdiligin-goes-fdc-men-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CatBoost тиімділігін GOES FDC-мен салыстыру&lt;/span&gt;&lt;/a&gt;CatBoost тиімділігін GOES FDC-мен салыстыру&lt;/h4&gt;\n&lt;p&gt;CatBoost моделі барлық бес зерттеу аймағында (Джорджия, Техас, Калифорния-Орегон, Аризона-Юта және Британдық Колумбия) GOES FDC өнімімен толықтық (recall), дәлдік (precision) және F1-ұпайы бойынша салыстырылды. CatBoost барлық көрсеткіштер бойынша басымдық танытып, анықтау деңгейін сақтай отырып, жалған дабылдар санын азайтты. Оқыту кезінде қолданылмаған аймақтарда (Калифорния-Орегон, Аризона-Юта, Британдық Колумбия) модель жоғары бейімделгіштік көрсетіп, F1-ұпайы бойынша GOES FDC-ден 0,16–0,38-ге озып кетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost барлық аймақтарда, соның ішінде оқытуда қолданылмаған аймақтарда да GOES FDC-ден тұрақты басымдыққа ие (F1-ұпайы бойынша 0,38-ге дейін).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нақты оқиғаларды талдау (7-сурет) Техастағы жалған дабыл нақты ошаққа жақын жерде болғанын көрсетті, бұл жылу әсерімен байланысты болуы мүмкін. Джорджияда модель VIIRS датчиктерімен тек бір рет қана тіркелген шағын ошақтарды өткізіп алды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бағалау VIIRS өнімімен салыстыруға негізделген; модельдегі кемшіліктер спутниктік деректердің кеңістіктік ажыратымдылығының шектеулеріне байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте S1.&lt;/strong&gt; Алғашқы анықтауды салыстыру үшін пайдаланылған 51 тарихи өрт оқиғасының жиынтығы&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Өрт оқиғасы&lt;/th&gt;\n&lt;th&gt;VIIRS алғашқы анықтау уақыты (UTC)&lt;/th&gt;\n&lt;th&gt;Штат&lt;/th&gt;\n&lt;th&gt;Бойлық&lt;/th&gt;\n&lt;th&gt;Ендік&lt;/th&gt;\n&lt;th&gt;Өрт көлемі (км²)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Area 6&lt;/td&gt;\n&lt;td&gt;28/1/2021 17:41&lt;/td&gt;\n&lt;td&gt;Florida&lt;/td&gt;\n&lt;td&gt;-81.268&lt;/td&gt;\n&lt;td&gt;27.682&lt;/td&gt;\n&lt;td&gt;17.5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;Windmill&lt;/td&gt;\n&lt;td&gt;2/3/2021 19:06&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-97.265&lt;/td&gt;\n&lt;td&gt;34.398&lt;/td&gt;\n&lt;td&gt;189.2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;CP-3&lt;/td&gt;\n&lt;td&gt;3/3/2021 18:41&lt;/td&gt;\n&lt;td&gt;Flor n&lt;td&gt;46&lt;/td&gt;\n&lt;td&gt;Carson Six&lt;/td&gt;\n&lt;td&gt;16/10/2024 18:41&lt;/td&gt;\n&lt;td&gt;Mississippi&lt;/td&gt;\n&lt;td&gt;-89.055&lt;/td&gt;\n&lt;td&gt;30.541&lt;/td&gt;\n&lt;td&gt;7.4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;47&lt;/td&gt;\n&lt;td&gt;Rush&lt;/td&gt;\n&lt;td&gt;25/10/2024 7:51&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-98.632&lt;/td&gt;\n&lt;td&gt;34.748&lt;/td&gt;\n&lt;td&gt;74.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;48&lt;/td&gt;\n&lt;td&gt;North Road&lt;/td&gt;\n&lt;td&gt;29/10/2024 19:36&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-96.341&lt;/td&gt;\n&lt;td&gt;36.629&lt;/td&gt;\n&lt;td&gt;23.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;49&lt;/td&gt;\n&lt;td&gt;Beech&lt;/td&gt;\n&lt;td&gt;2/12/2024 7:41&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-94.494&lt;/td&gt;\n&lt;td&gt;34.61&lt;/td&gt;\n&lt;td&gt;1.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;50&lt;/td&gt;\n&lt;td&gt;Middleton&lt;/td&gt;\n&lt;td&gt;16/2/2025 18:36&lt;/td&gt;\n&lt;td&gt;Texas&lt;/td&gt;\n&lt;td&gt;-94.395&lt;/td&gt;\n&lt;td&gt;29.619&lt;/td&gt;\n&lt;td&gt;16.6&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;51&lt;/td&gt;\n&lt;td&gt;Two Barrel&lt;/td&gt;\n&lt;td&gt;26/2/2025 18:46&lt;/td&gt;\n&lt;td&gt;Florida&lt;/td&gt;\n&lt;td&gt;-85.001&lt;/td&gt;\n&lt;td&gt;30.185&lt;/td&gt;\n&lt;td&gt;6.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Кестеде өрт атауы, VIIRS алғашқы анықтау уақыты, штат, центроид координаттары (ендік пен бойлық) және өрт көлемі (км²-мен) көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"okhytu-derekter-zhiyny-koelemining-catboost-zhumysyna-aeseri\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#okhytu-derekter-zhiyny-koelemining-catboost-zhumysyna-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оқыту деректер жиыны көлемінің CatBoost жұмысына әсері&lt;/span&gt;&lt;/a&gt;Оқыту деректер жиыны көлемінің CatBoost жұмысына әсері&lt;/h4&gt;\n&lt;p&gt;Деректер көлемінің маңыздылығын көрсету үшін авторлар негізгі модельді (66 000 өрт пикселі) екі кішірек нұсқамен салыстырды: кездейсоқ таңдама (2 000 өрт және 20 000 фондық пиксель) және тек сәуір-мамыр айларының деректері. Нәтижелер (9-сурет) кішігірім немесе маусымдық шектелген таңдамалар жалған дабылдар санын арттыратынын көрсетеді. Мысалы, Аризона-Ютада негізгі модельдің дәлдігі 0,81 болса, кіші модельдерде бұл көрсеткіш 0,50 және 0,42-ге дейін төмендеді. Толықтық (recall) көрсеткіші тұрақтырақ болғанымен, тек көктемгі деректерде оқытылған модель Джорджияда төмен нәтиже (0,21) көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;F1-ұпайы — бұл дәлдік пен толықтық арасындағы гармоникалық орташа мән, ол мақсаттарды өткізіп алу мен жалған дабылдар арасындағы тепе-теңдікті бағалауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кең және әртүрлі деректер жиынын пайдалану модельдің жалпылау қабілеті үшін өте маңызды. Деректер көлемі аз модельдер оқыту аймағынан тыс жерлерде нашар жұмыс істейді, бұл қателіктерді азайту үшін өкілдік қамтудың қажеттілігін растайды.&lt;/p&gt;\n&lt;h4 id=\"erte-anykhtau-muemkindikteri\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#erte-anykhtau-muemkindikteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ерте анықтау мүмкіндіктері&lt;/span&gt;&lt;/a&gt;Ерте анықтау мүмкіндіктері&lt;/h4&gt;\n&lt;p&gt;Өртті ерте анықтау олардың ауқымды апатқа айналуының алдын алуда маңызды рөл атқарады. CatBoost моделінің GOES FDC өнімімен салыстыру үшін 51 өрт оқиғасынан тұратын деректер жиынтығы құрылды. Талдау VIIRS жерсерігі өртті тіркегенге дейінгі 8 сағатты және кейінгі 2 сағатты қамтыды. Әрбір оқиға үшін кескіндер өрт периметрі айналасында 10 км буфермен қиылып, CatBoost пен GOES FDC арасындағы алғашқы анықтау уақыты (минутпен) есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost моделі ерте анықтауда басымдық көрсетті: бірінші сценарийде ол 22 өртті GOES FDC-ге қарағанда ертерек (орташа есеппен 20 ± 17 минут) анықтады, ал GOES FDC тек 6 жағдайда модельден озып кетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;10-суретте VIIRS тіркегенге дейін екі әдіспен де анықталған 38 өрттің нәтижелері көрсетілген. Бірінші талдау нұсқасында (тек «processed» және «saturated» санаттары) CatBoost орташа 20 минут (стандартты ауытқу 17 минут) ерте анықтауды көрсетті. Екінші нұсқада, «high confidence» санаты қосылған кезде, CatBoost 19 өртті (орташа 18 ± 16 минут) ертерек анықтады, ал GOES FDC 9 жағдайда ертерек жұмыс істеді. 10 жағдайда әдістер бір уақытта тіркелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GOES FDC-де «high confidence» санатын пайдалану сезімталдықты арттырады, бірақ бұл жалған дабылдар (false alarms) санының көбеюіне әкелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Howell, Blue Stem, Candy Creek және Silver King сияқты жекелеген жағдайлар «high confidence» санатын қосу GOES FDC-ге кейде модельден бұрын өртті анықтауға мүмкіндік беретінін көрсетеді. Мысалы, Candy Creek өртінде FDC моделі CatBoost-тен 30 минут бұрын жұмыс істеді. Дегенмен, жалпы алғанда 51 оқиғаның ішінде CatBoost 26 (бірінші талдауда) және 23 (екінші талдауда) өртті басқа жүйелерден бұрын анықтап, ерте анықтау тиімділігін растады.&lt;/p&gt;\n&lt;h4 id=\"oertti-anykhtau-ykhtimaldyghy\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#oertti-anykhtau-ykhtimaldyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өртті анықтау ықтималдығы&lt;/span&gt;&lt;/a&gt;Өртті анықтау ықтималдығы&lt;/h4&gt;\n&lt;p&gt;Бұл бөлім VIIRS деректерімен 3×3 пиксель терезесінде салыстыру арқылы әдістердің өрт көлеміне қатысты сезімталдығын бағалайды. Бағалау үшін (5), (6) және (7)-теңдеулер қолданылды, мұнда NTP,k — шынайы оң нәтижелер саны (кемінде k VIIRS пикселі болған кезде модель арқылы анықтау), ал NFN,k — жалған теріс нәтижелер саны.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс кеңістіктік белгісіздікті ескеру үшін 3×3 терезені пайдаланады: егер модель VIIRS деректерінен бір пиксель радиусында өртті тіркесе, бұл сәтті анықтау болып саналады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анықтау ықтималдығы сәтті анықталған пикселдер санының кемінде k VIIRS анықтауын қамтитын жалпы пикселдер санына қатынасы ретінде есептелді. Бұл тәсіл алгоритмдердің әртүрлі қарқындылықтағы және аумақтағы өрттерге қаншалықты тиімді жауап беретінін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"oertti-anykhtau-ykhtimaldyghy1\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#oertti-anykhtau-ykhtimaldyghy1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өртті анықтау ықтималдығы&lt;/span&gt;&lt;/a&gt;Өртті анықтау ықтималдығы&lt;/h4&gt;\n&lt;p&gt;Авторлар CatBoost моделінің өртті анықтау ықтималдығын GOES FDC алгоритмімен салыстыра отырып бағалайды. Ол үшін (8)-формула қолданылады, мұнда P(M(i', j') = 1 / V(i, j) ≥ k) өрнегі k шекті мәні үшін шынайы оң нәтижелердің шынайы оң және жалған теріс нәтижелер қосындысына қатынасын білдіреді. k шегі бір GOES ABI пикселінің ішіндегі VIIRS жерсерігі арқылы тіркелген өрттердің ең аз санын анықтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost моделі барлық бес зерттеу аймағында GOES FDC-ге қарағанда шағын өрт ошақтарына жоғары сезімталдықты көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;11-суретте бес аймақ: Джорджия, Техас, Калифорния-Орегон, Аризона-Юта және Британдық Колумбия бойынша нәтижелер келтірілген. Калифорния-Орегон, Аризона-Юта және Британдық Колумбияда CatBoost әлдеқайда жоғары анықтау ықтималдығын көрсетеді. Мысалы, Калифорния мен Орегонда k=1 болғанда, GOES FDC үшін ықтималдық 0,28-ді, ал CatBoost үшін 0,46-ны құрайды. k=5 шегінде айырмашылық арта түседі: CatBoost-та 0,78, ал GOES FDC-де небәрі 0,48.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIIRS — кеңістіктік ажыратымдылығы жоғары жерсеріктік радиометр, ол GOES деректерін тексеру үшін «эталон» ретінде пайдаланылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Техаста CatBoost k=10-нан төмен шектерде GOES FDC-ден басым түседі. Алайда k=10 болғанда, GOES FDC ықтималдығы CatBoost моделінікінен асып кетеді. Авторлар мұны таңдама көлемінің өте аздығымен түсіндіреді: бұл аймақта он және одан да көп VIIRS өрт белгілерін қамтитын небәрі сегіз ABI пикселі тіркелген. Жалпы алғанда, CatBoost моделі шағын өрттерге қатысты тұрақты жоғары сезімталдықты көрсетеді, бұл оны көптеген жағдайларда өртті ерте анықтау үшін тиімдірек құралға айналдырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шектеу: Техастағы k-ның жоғары мәндері үшін алынған нәтижелер өте аз бақылау санымен шектелген, бұл осы нақты шек үшін статистикалық сенімділікті төмендетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-talkhylau-zhaene-khorytyndylar\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#5-talkhylau-zhaene-khorytyndylar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Талқылау және қорытындылар&lt;/span&gt;&lt;/a&gt;5. Талқылау және қорытындылар&lt;/h4&gt;\n&lt;p&gt;Бұл зерттеуде GOES-16 ABI спутниктік суреттерінің үлкен деректер жиыны негізінде орман өрттерін анықтау үшін CatBoost моделі оқытылды. CatBoost градиенттік бустинг фреймворкі өзінің тиімділігі мен оқытудың қарапайымдылығы үшін таңдалды. Оқыту және бағалау үшін VIIRS өрт деректері эталон ретінде пайдаланылды. Нәтижелер CatBoost моделі зерттеуге алынған барлық бес аймақта GOES FDC стандартты өнімінен асып түсетінін, яғни дәлдік (precision), толықтық (recall) және F1-өлшемі бойынша жоғары көрсеткіштерге ие екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost моделі өртті анықтауда, әсіресе түнгі уақытта, GOES FDC өніміне қарағанда тұрақты және жоғары нәтижелер көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екі модельде де толықтық көрсеткіштерінің салыстырмалы түрде төмен болуы ABI-дің VIIRS-ке қарағанда кеңістіктік ажыратымдылығының төмендігімен түсіндіріледі: VIIRS анықтаған шағын өрт ошақтары көбінесе қате теріс нәтиже ретінде жіктелді. Дегенмен, CatBoost GOES FDC-ге қарағанда жақсы нәтиже берді. Модельдің жалпылау қабілеті оқыту процесіне қатыспаған аймақтарда (Калифорния, Орегон, Аризона, Юта, Британдық Колумбия) тиімді жұмыс істеуімен расталды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Толықтық (recall) — модель анықтаған нақты өрттердің үлесі. Төмен көрсеткіш модельдің көптеген өртті байқамай қалғанын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Күндізгі және түнгі жұмысты салыстыру айтарлықтай айырмашылықтарды көрсетті: CatBoost түнде де сенімді жұмыс істеуді сақтап қалса, GOES FDC-дің толықтық көрсеткіші нөлге жақындады. Қосымша талдаулар шағын көлемдегі деректерде (мысалы, 2000 өрт пикселі) оқытылған модельдер қате сигналдар санын арттыратынын және жаңа аумақтарда жұмыс істеу қабілетін төмендететінін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек Солтүстік Америка аумақтарымен шектелген және тек VIIRS деректерімен салыстырылған, бұл басқа жоғары ажыратымдылықтағы дереккөздерді ескермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар бұл жұмыс Zhao және Ban (2022) зерттеулерін кеңейтіп, жекелеген өрт оқиғаларын емес, ірі географиялық аймақтарды қамтитынын және GOES FDC-мен тікелей салыстырылатынын атап өтті. Шектеулер қатарына толық дискілік суреттерде сынақ өткізілмегені және тек бір модель (CatBoost) қолданылғаны жатады. Дегенмен, нәтижелер машиналық оқытудың өрт мониторингін жақсартуға және қате сигналдарды азайтуға мүмкіндік беретінін растайды.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"oertti-anykhtau-algoritmi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#oertti-anykhtau-algoritmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өртті анықтау алгоритмі&lt;/span&gt;&lt;/a&gt;Өртті анықтау алгоритмі&lt;/h4&gt;\n&lt;p&gt;Машиналық оқыту алгоритмін әзірлеу процесі төрт кезеңнен тұрады: VIIRS деректерін GOES ABI торына кеңістіктік сәйкестендіру, таңбаланған деректер жинағын құру, модельді оқыту және оны бағалау. Модель коды мен мысал деректер авторлардың репозиторийінде қолжетімді.&lt;/p&gt;\n&lt;h4 id=\"viirs-oertti-anykhtau-derekterin-goes-abi-toryna-taghajyndau\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#viirs-oertti-anykhtau-derekterin-goes-abi-toryna-taghajyndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VIIRS өртті анықтау деректерін GOES ABI торына тағайындау&lt;/span&gt;&lt;/a&gt;VIIRS өртті анықтау деректерін GOES ABI торына тағайындау&lt;/h4&gt;\n&lt;p&gt;VIIRS және GOES ABI аспаптарының кеңістіктік ажыратымдылығы әртүрлі болғандықтан, VIIRS өрт ошақтарының центроидтары GOES ABI торына растрланды. VIIRS деректерімен қиылыспайтын пикселдерге 0 мәні берілді. Растрлау үшін Rasterio кітапханасы қолданылды. Сондай-ақ, сканерлеу кезіндегі «көбелек эффектісі» (bowtie effect) салдарынан туындайтын қайталанбалы пикселдер авторлар сипаттаған әдіс арқылы тазартылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Көбелек эффектісі» — бұл спутниктік сканерлеу кезінде байқалатын, кескіннің шеттерінде пикселдердің қабаттасуына әкелетін техникалық бұрмалау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tangbalanghan-derekter-zhinaghyn-khuru\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#tangbalanghan-derekter-zhinaghyn-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таңбаланған деректер жинағын құру&lt;/span&gt;&lt;/a&gt;Таңбаланған деректер жинағын құру&lt;/h4&gt;\n&lt;p&gt;GOES ABI пикселдерін «өрт» немесе «өрт емес» деп белгілеуде спутниктер арасындағы бірнеше шақырымға жетуі мүмкін кеңістіктік сәйкессіздік ескерілді. Бұл қатені түзету үшін әрбір VIIRS өрт нүктесінің айналасында 3×3 буферлік терезе қолданылды. Осы терезе ішінде өрт индексі (Fire Index, FI) ең жоғары GOES ABI пикселі «өрт» деп белгіленді. FI индексі &lt;span class=\"yfm-latex\" data-content=\"FI%20%3D%20%5Cfrac%7BB_%7B3.9%7D%20-%20B_%7B11.2%7D%7D%7BB_%7B3.9%7D%20%2B%20B_%7B11.2%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; формуласы бойынша есептеледі, мұнда B3.9 және B11.2 сәйкесінше 3.9 және 11.2 мкм толқын ұзындығындағы жарықтық температуралары.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өрт индексі (FI) қысқа толқынды және жылулық инфрақызыл арналар арасындағы айырмашылықты пайдаланады, себебі біріншісі жоғары температуралы өрт ошақтарына сезімтал.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Өрт емес» сыныбын құру үшін әр кескіннен өрт аймақтарына жақын емес 500 пиксел таңдап алынды. Әр пиксел үшін 16 спектрлік арна мен FI мәндері алынды, сондай-ақ 3×3 терезе ішіндегі 17 параметр үшін статистикалық көрсеткіштер (орташа, медиана, мин, макс, стандартты ауытқу) есептелді. Бұл оқыту үшін 102 белгіні берді. Бұлттармен жабылған пикселдер есептен шығарылды.&lt;/p&gt;\n&lt;p&gt;GOES ABI анықтай алмайтын ұсақ өрттерді &lt;a href=\"concepts/filtratsiya.html\"&gt;сүзгіден өткізу&lt;/a&gt; үшін мынадай өлшемдер қолданылды: 3×3 терезеде кемінде 2 VIIRS өртін анықтау және FI &amp;gt; 0 болуы. Сыныптардағы теңгерімсіздікті (өрт емес пикселдердің көптігі) жою үшін өрт және өрт емес пикселдер арасында 1:20 қатынасы белгіленді, бұл ең жақсы F1-көрсеткішін қамтамасыз етті. Сүзгіден өткеннен кейін қорытынды жинақ 65 877 өрт және 1 317 540 өрт емес пикселді қамтыды.&lt;/p&gt;\n&lt;h4 id=\"modeldi-okhytu\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#modeldi-okhytu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельді оқыту&lt;/span&gt;&lt;/a&gt;Модельді оқыту&lt;/h4&gt;\n&lt;p&gt;Өртті анықтау үшін CatBoost алгоритмі қолданылды. Бұл шешім ағаштары үстіндегі градиенттік бустинг әдісіне негізделген модель. Классикалық тәсілдерден айырмашылығы, CatBoost реттелген бустинг (ordered boosting), санаттық белгілерді автоматты өңдеу және «oblivious» (ұмытпайтын) ағаштар құрылымы арқылы модельдің шамадан тыс бейімделуі (overfitting) мен деректердің ағып кетуіне жол бермейді. Оқу деректер жиыны 80% оқытуға және 20% валидацияға бөлінді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost — бұл машиналық оқыту алгоритмі, ол дәйекті түрде шешім ағаштарын құрады, мұнда әрбір келесі ағаш алдыңғысының қателерін түзетеді, бұл күрделі дайындықсыз тиімді жұмыс істеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oertti-anykhtau-algoritmining-daeldigin-baghalau\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#oertti-anykhtau-algoritmining-daeldigin-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өртті анықтау алгоритмінің дәлдігін бағалау&lt;/span&gt;&lt;/a&gt;Өртті анықтау алгоритмінің дәлдігін бағалау&lt;/h4&gt;\n&lt;p&gt;Алгоритм дәлдігін бағалауда GOES ABI және VIIRS спутниктік деректері арасындағы кеңістіктік сәйкессіздіктер ескерілді. Егер алгоритм (i, j) пикселінде өртті болжаса және бұл пиксел айналасындағы 3 × 3 терезеде кемінде бір VIIRS анықтауы болса, нәтиже ақиқат оң (TP) деп жіктеледі. Әйтпесе, пиксел қате оң (FP) болып саналады. Егер VIIRS анықтауы айналасындағы 3 × 3 терезеде модель болжамы болмаса, пиксел қате теріс (FN) деп белгіленеді. Сәйкестендіру процесі 5-суретте көрсетілген.&lt;/p&gt;\n&lt;p&gt;Кескінді жіктеу сапасын бағалау үшін recall (толықтық), precision (дәлдік) және F1-өлшем көрсеткіштері пайдаланылады. Толықтық дұрыс анықталған өрттер үлесін, дәлдік модель белгілеген барлық жағдайлар ішіндегі дұрыс жауаптар үлесін көрсетеді. F1-өлшем олардың гармоникалық орташа мәні болып табылады. Есептеулер (2), (3) және (4) формулалар бойынша бүкіл кескіндер жиыны үшін TPtotal, FPtotal және FNtotal жиынтықтары негізінде жүзеге асырылады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f1.jpg\" alt=\"1-сурет: Зерттеу аумағының карталары. Оқыту үшін пайдаланылған штаттар қара түспен, бағалау үшін — қызыл түспен, ал екеу\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Зерттеу аумағының карталары. Оқыту үшін пайдаланылған штаттар қара түспен, бағалау үшін — қызыл түспен, ал екеуі үшін де пайдаланылған штаттар ашық көк түспен белгіленген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f2.jpg\" alt=\"2-сурет: 51 өрт оқиғасының орналасуы мен олардың сәйкестендіру нөмірлері көрсетілген карта. Мысалы, 19-нөмірлі өрт — 202\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: 51 өрт оқиғасының орналасуы мен олардың сәйкестендіру нөмірлері көрсетілген карта. Мысалы, 19-нөмірлі өрт — 2021 жылғы 29 мамырда Флоридада болған Bobcat өрті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f3.jpg\" alt=\"3-сурет: VIIRS өртті анықтау деректерін GOES ABI торына растрлеу.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: VIIRS өртті анықтау деректерін GOES ABI торына растрлеу.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f4.jpg\" alt=\"4-сурет: Өртті белгілеу процесінің иллюстрациясы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Өртті белгілеу процесінің иллюстрациясы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: Өртті белгілеу процесінің иллюстрациясы. Сол жақта: VIIRS өртті анықтау дерегі (i, j) пикселінде, растрленген VIIRS V матрицасында. Оң жақта: 3 × 3 өлшемді терезе GOES MCMI G матрицасына қолданылады. Ең жоғары FI мәні бар G(i′, j′) пикселі өрт деп белгіленеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f5.jpg\" alt=\"5-сурет: 3 × 3 өлшемді терезені пайдалана отырып, GEO негізіндегі өртті анықтау алгоритмінің дәлдігін бағалау иллюстраци\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: 3 × 3 өлшемді терезені пайдалана отырып, GEO негізіндегі өртті анықтау алгоритмінің дәлдігін бағалау иллюстрациясы. (сол жақта) Қызыл пикселдер — GEO негізіндегі өртті анықтау нәтижелері; (ортасында) қызғылт пикселдер — растрленген VIIRS өртті анықтау нәтижелері; (оң жақта) FN, TP және FP — сәйкесінше жалған теріс (false negative), шынайы оң (true positive) және жалған оң (false positive) нәтижелер.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f6.jpg\" alt=\"6-сурет: Бес түрлі бағалау аймағындағы CatBoost моделі мен GOES FDC өнімінің өнімділік көрсеткіштерін (recall, precision\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Бес түрлі бағалау аймағындағы CatBoost моделі мен GOES FDC өнімінің өнімділік көрсеткіштерін (recall, precision және F1-score) салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f7.jpg\" alt=\"7-сурет: Техас (сол жақта) және Джорджия (оң жақта) штаттарындағы GOES-16 ABI FI кескіндерінің фонында CatBoost моделіні\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Техас (сол жақта) және Джорджия (оң жақта) штаттарындағы GOES-16 ABI FI кескіндерінің фонында CatBoost моделінің болжамдарына мысал. VIIRS 375 м өртті анықтау нәтижелері жасыл шаршылармен көрсетілген. CatBoost болжам пиксельдері TP (шынайы оң), FP (жалған оң) және FN (жалған теріс) үшін сәйкесінше қызыл, күлгін және көк түстермен кодталған.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f8.jpg\" alt=\"8-сурет: Барлық зерттеу аймақтары бойынша CatBoost моделі мен GOES FDC-нің recall, precision және F1-score көрсеткіштері\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Барлық зерттеу аймақтары бойынша CatBoost моделі мен GOES FDC-нің recall, precision және F1-score көрсеткіштері. A панелі (жоғарыда) — түнгі уақыт, B панелі (төменде) — күндізгі уақыт.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f9.jpg\" alt=\"9-сурет: Бес түрлі бағалау аймағында оқыту үшін өрт пиксельдерінің әртүрлі санын пайдаланатын CatBoost модельдерінің өні\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет: Бес түрлі бағалау аймағында оқыту үшін өрт пиксельдерінің әртүрлі санын пайдаланатын CatBoost модельдерінің өнімділік көрсеткіштерін салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f10.jpg\" alt=\"10-сурет: Өрт оқиғалары бойынша CatBoost пен GOES FDC арасындағы алғашқы анықтау уақытындағы айырмашылық. A панелінде те\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет: Өрт оқиғалары бойынша CatBoost пен GOES FDC арасындағы алғашқы анықтау уақытындағы айырмашылық. A панелінде тек өңделген және қаныққан FDC санаттарын пайдаланатын талдау көрсетілген, B панеліне «жоғары» санаты қосылған. CatBoost және GOES FDC бір уақытта анықтаған өрт оқиғалары «0» уақыт айырмашылығы белгісіне ие.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f11.jpg\" alt=\"11-сурет: CatBoost және GOES FDC алгоритмдері арқылы өрт пикселін анықтау ықтималдығы GOES ABI пикселі (k) ішіндегі VIIR\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-сурет: CatBoost және GOES FDC алгоритмдері арқылы өрт пикселін анықтау ықтималдығы GOES ABI пикселі (k) ішіндегі VIIRS өрт анықтауларының ең аз санына байланысты. Бағалау аймақтары: (A) Джорджия, (B) Техас, (C) Калифорния — Орегон, (D) Аризона — Юта және (E) Британдық Колумбия.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Мониторинг&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жүйелерінің&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;төмен дәлдігі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;VIIRS және&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"6
