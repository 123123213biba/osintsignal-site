        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"90\" cy=\"61\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"610\" cy=\"297\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · PLATFORMS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Неліктен жалған ғылыми&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;видеолардың пікірлерінде&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мейірімділік көп?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f1.jpg\" alt=\"Зерттеуде қолданылған бейнелер корпусын алу процесінің жұмыс ағынының көрінісі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Зерттеуде қолданылған бейнелер корпусын алу процесінің жұмыс ағынының көрінісі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер денсаулық сақтау тақырыбындағы видеолардың пікірлер бөлімін талдап, ғылыми және жалған ғылыми қауымдастықтардың сөйлесу стилін салыстырды. Ғылыми видеоларда емдеу әдістері мен сыншыл пікірлер басым болса, жалған ғылым видеоларында алғыс айту мен эмоционалды қолдау негізгі орында тұрады. Бұл нәтижелер неліктен фактілердің көбінесе эмоционалды байланыс алдында дәрменсіз қалатынын түсіндіреді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ғылыми талқылаулар сыншыл пікір алмасуға және медициналық кеңес сұрауға бағытталған.&lt;/li&gt;\n&lt;li&gt;Жалған ғылыми қауымдастықтар эмоционалды қолдау мен топ ішіндегі жақындық сезімімен ерекшеленеді.&lt;/li&gt;\n&lt;li&gt;Процестік талдау әдісі онлайн қарым-қатынастағы жасырын мінез-құлық үлгілерін ашып береді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Авторлар 2011-2025 жылдар аралығындағы 52 412 пікірді талдау үшін process mining (процестік талдау) және желілік талдау әдістерін қолданды. Видеолар үлкен тілдік модельдер (&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;) көмегімен «ғылыми» (20 387 пікір) және «жалған ғылыми» (32 025 пікір) санаттарға бөлінді. Деректер YouTube API арқылы жиналып, NLP (табиғи тілді өңдеу) көмегімен эмоциялар мен тақырыптар бойынша жіктелді.&lt;/p&gt;\n&lt;p&gt;Нәтижелер көрсеткендей, ғылыми талқылауларда теріс бағалар мен медициналық кеңес сұрау басым, бұл сыншыл көзқарасты көрсетеді. Жалған ғылыми топтарда болса «әлеуметтік-эмоционалды байланыс» — алғыс айту, мақтау және эмодзилер арқылы қарым-қатынас жасау басты орында. Бұл процесс қолданушылар арасында топқа жататындық сезімін күшейтіп, оларды фактілерге негізделген сынға қарсы қорғалған «эхо-камера» ішінде сақтап қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек испан тіліндегі видеолармен шектелген және YouTube ұсыныс алгоритмдерінің әсерін есепке алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық аудармасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Әлеуметтік желілерде медициналық жалған ақпараттың таралуы&lt;br /&gt;\nСоңғы онжылдықтарда цифрлық медиа ортасы денсаулық сақтау туралы псевдоғылыми дискурстардың кең таралуына мүмкіндік берді. YouTube (Google LLC) сияқты платформалар, айына 2,5 миллиардтан астам белсенді пайдаланушысы бар, денсаулық сақтау туралы ақпараттың негізгі көздеріне айналды. Алайда, жүйелі шолулар YouTube-тегі денсаулық сақтауға қатысты контенттің сапасы көбінесе орташадан төмен екенін және сенімсіз немесе жаңылыстыратын ақпарат барлық медициналық тақырыптар бойынша кең таралғанын көрсетеді. Көбінесе «инфодемия» деп аталатын бұл құбылыс сенімді дереккөздер мен ұсыныстарды табуды қиындататын ақпараттың шамадан тыс көптігін білдіреді. COVID-19 пандемиясы әлеуметтік желілердің тексерілмеген ақпаратты, қастандық теорияларын және жалған мәлімдемелерді қалай күшейте алатынын, бұл қоғамдық сенім мен денсаулық үшін елеулі салдарға әкелуі мүмкін екенін көрсетті. Медициналық жалған ақпарат пандемия аяқталғаннан кейін де қоғамдық денсаулық сақтау мәселесі болып қала береді.&lt;/p&gt;\n&lt;p&gt;Медициналық жалған ақпарат кең мағынада денсаулыққа қатысты жалған, жаңылыстыратын немесе қазіргі ғылыми біліммен расталмаған мәлімдеме ретінде анықталады. Оның салдары клиникалық нәтижелердің нашарлауын, жалған сенімдердің бекуін және қоғамдық денсаулық сақтау ұсыныстарын орындамауды қамтуы мүмкін. Мысалы, сүт безі қатерлі ісігімен ауыратын науқастар арасында баламалы медицинаны қолдану өмір сүру ұзақтығының қысқаруымен байланысты. Бұл сонымен қатар денсаулық туралы расталмаған немесе қиял-ғажайып түсініктерді нығайтып, төтенше жағдайлар кезінде санитарлық нұсқауларды сақтауды төмендетуі мүмкін. Жалған ақпарат көптеген тақырыптарда, соның ішінде вакциналар, темекі өнімдері және қатерлі ісік сияқты жұқпалы емес ауруларда кең таралған, ал Twitter (X Corp) және YouTube сияқты платформалар бұл талқылаулар үшін негізгі алаң болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;YouTube-тегі медициналық жалған ақпарат кең таралған және емделуді орындамау мен клиникалық нәтижелердің нашарлауы сияқты денсаулыққа қатысты жағымсыз салдарлармен байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Медициналық жалған ақпаратпен күресудің дәстүрлі стратегиялары, мысалы, фактілерді тексеру (fact-checking), шектеулі тиімділік көрсетті. Жақында жүргізілген шолу фактілерді тексерудің қазіргі модельдері сенім, ауқымдылық және әсер ету арасындағы ымыраны қамтитынын, бұл ретте кәсіби де, қоғамдық та тәсілдер барлық 3 өлшем бойынша жоғары нәтиже көрсетпейтінін анықтады. Жеке деңгейде зерттеулер фактілерді тексерумен бетпе-бет келген пайдаланушылар қате ақпаратты таратуды жалғастыруы мүмкін екенін көрсетеді, бұл мұндай араласулардың жеткіліксіздігін білдіреді. Сонымен қатар, ғылыми тұрғыдан маңызды жалған ақпаратты жоққа шығару әрекеттері орташа есеппен алушылардың сенімінде немесе көзқарасында статистикалық тұрғыдан елеулі өзгерістерге әкелмеуі мүмкін, бұл сенімдердің түзетуші ақпаратқа қарамастан, әсіресе әлеуметтік қолдау болған кезде сақталуы мүмкін екендігі туралы алдыңғы деректерге сәйкес келеді.&lt;/p&gt;\n&lt;p&gt;Бұл пайдаланушыларды топтық нормаларға сәйкес келуге итермелейтін тартылудың терең әлеуметтік және психологиялық драйверлерін жақсырақ түсіну қажеттілігін көрсетеді. Алдыңғы зерттеулер поляризацияланған онлайн қауымдастықтардың бар екенін анықтады. Мысалы, Facebook (Meta Platforms, Inc) сияқты платформалардағы зерттеулер псевдоғылыми қауымдастықтардың оқшаулануға бейім екенін, өз сенімдерін «жаңғырық камералары» (echo chambers) ішінде нығайтатынын, ал ғылыми қауымдастықтардың оларды жоққа шығаруға тырысып, қарама-қарсы көзқарастармен өзара әрекеттесуге бейім екенін көрсетті. Кейінгі зерттеулер әлеуметтік желілердегі талқылауларда поляризацияланған өзара әрекеттесу құрылымдарын анықтауды жалғастыруда, сонымен бірге желілік бөліну әрқашан білдірілген пікірлердің ұқсастығымен тікелей байланысты емес екенін атап өтуде.&lt;/p&gt;\n&lt;p&gt;Бұл құбылыстарды түсіну үшін псевдоғылыми дискурсты зерттеуде әртүрлі әдістер қолданылды: контентті қолмен жіктеуден бастап желілік және лингвистикалық талдауға дейін. Мысалы, желілік талдау Twitter-дегі вакцинаға қарсы қауымдастықтарды карталау үшін, ал табиғи тілді өңдеу (NLP) теріске шығару дискурсындағы лингвистикалық өрнектерді анықтау үшін қолданылды. Сол сияқты, YouTube бейнелерінің тақырыптарын интеллектуалды талдау қоғамдық пікірді бақылау үшін қолданылды, дегенмен ол пікірлер бөліміндегі пайдаланушылардың өзара әрекеттесуін қарастырмады. 813 жарияланымның жақында жүргізілген жүйелі шолуы медициналық жалған ақпаратты зерттеудің 4 әдіснамалық тәсілін бөліп көрсетті: қатысушылардың деректерін пайдалана отырып, сандық және сапалық әлеуметтік зерттеулер, сондай-ақ цифрлық медиа деректерін сандық және сапалық талдау. Шолуда сондай-ақ есептеу тәсілдері ауқымды цифрлық деректерді талдау үшін жиі қолданылғанымен, оларды контекстік тереңдікті қамтамасыз ету үшін сапалық және дәстүрлі әлеуметтік зерттеулермен толықтыру қажеттігі атап өтілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сала деңгейіндегі әдіснамалық әртүрлілік жеке зерттеулер ішіндегі интеграцияны білдірмейді; көптеген жұмыстар бір әдіске (мысалы, желілік талдау немесе контентті бағалау) бағытталған, бұл семантикалық, құрылымдық және уақытша аспектілердің өзара әрекеттесуін түсінуді шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл зерттеу NLP-ді процестерді интеллектуалды талдаумен (process mining) және желілік талдаумен біріктіріп, қарым-қатынас динамикасын зерттеу үшін жаңа әдіснамалық базаны енгізу арқылы осы олқылықты толтыруға бағытталған. Біздің тәсіліміз әрбір пікірді оның тақырыптық мазмұны мен үніне қарай сипаттау үшін NLP-ді қолданудан басталады. Одан кейін біз процестерді интеллектуалды талдауды қолданамыз — бұл бизнес-процестерді басқару саласындағы пән, ол оқиғалар журналдарынан білімді бөліп алу арқылы нақты процестерді анықтайды, бақылайды және жақсартады. Процестерді интеллектуалды талдау клиникалық жолдар мен ұйымдастырушылық жұмыс процестері сияқты денсаулық сақтаудың белгілі бір контексттерінде қолданылған. Бұл зерттеуде біз бұл әдіснамалық тәсілді денсаулық сақтауға қатысты пайдаланушылардың өзара әрекеттесуін модельдеу үшін кеңейтеміз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Процестерді интеллектуалды талдау (process mining) — бұл оқиғалар тізбегін (бұл жағдайда — пікірлер) «процесс» ретінде визуализациялауға және өзара әрекеттесудің әдеттегі жолдарын анықтауға мүмкіндік беретін деректерді талдау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл зерттеудің негізгі мақсаты ғылыми және псевдоғылыми медициналық контентпен байланысты YouTube пікірлер желілерінің алынған үлгілерінде қайталанатын сұхбат өрнектерін анықтау, талдау, визуализациялау және салыстыру үшін процестерді интеллектуалды талдау мен тақырыптық желілік талдауды қолдану болып табылады. Екінші мақсат — денсаулық сақтауға қатысты онлайн өзара әрекеттесулердегі дәйекті және құрылымдық айырмашылықтарды сипаттау және цифрлық ақпараттық экожүйедегі болашақ зерттеулер мен коммуникация стратегияларын хабардар ете алатын гипотезаларды жасау үшін осы өзара толықтырушы әдістердің пайдалылығын бағалау болып табылады.&lt;/p&gt;\n&lt;p&gt;Бұл зерттеудің әдіснамасы ғылыми мақала үшін стандартты IMRD (Кіріспе, Әдістер, Нәтижелер және Талқылау) форматына бейімделген CRISP-DM (Cross-Industry Standard Process for Data Mining) шеңберлік бағдарламасына сәйкес құрылған. Зерттеу бақылау зерттеулері үшін ең қолайлы нұсқаулық ретінде STROBE (Strengthening the Reporting of Observational Studies in Epidemiology) мәлімдемесіне сәйкес сипатталған. YouTube-тегі денсаулық сақтау зерттеулері үшін есеп беру бойынша арнайы ұсыныстардың жоқтығын ескере отырып, бақылау тізімі зерттеу сипаттамаларына бейімделді және қолданылмайтын тармақтар анық белгіленді. Толтырылған STROBE бақылау тізімі 1-қосымшада келтірілген.&lt;/p&gt;\n&lt;p&gt;Іздеу YouTube-пен шектелді, өйткені платформа тегін және ашық API ұсынады, бұл салыстырмалы түрде аз кіру шектеулерімен деректерді қарапайым және заңды жинауды қамтамасыз етеді. Үміткер бейнелер 2025 жылғы 4 мамыр мен 6 мамыр аралығында алынды, ал олармен байланысты пікірлер желілері 2025 жылғы 5 мамыр мен 12 мамыр аралығында жиналды. Екі процесс ішінара бір-бірін қамтығандықтан, деректерді жинаудың жалпы кезеңі 2025 жылғы 4 мамырдан 12 мамырға дейін болды. YouTube пікірлерінің корпусы ресми YouTube Data API көмегімен құрылды.&lt;/p&gt;\n&lt;p&gt;Деректерді бөліп алу бастапқыда испан тілінде сөйлейтін пайдаланушылар үшін өзекті бейнелерге бағытталды, API relevanceLanguage параметрі «es»-ке орнатылды. Алайда, платформаның іздеу алгоритмдері іздеу сұранысына жоғары дәрежеде сәйкес деп танылса, бірнеше тілдегі контентті қамтиды. Нәтижесінде алынған корпус айтарлықтай лингвистикалық әртүрлілікті көрсетті. Біз кеңірек, мәдениаралық мінез-құлық өрнектерін қамту үшін көп тілді контентті сақтап қалуды шештік. Іздеу стратегиясы 2 түрлі контент санатын қамту үшін әзірленді: ғылыми медициналық емдеу әдістері және псевдоғылыми емдеу әдістері. Бұл зерттеуде «псевдоғылыми» термині аталған терапия әдістерінің тиімділігі бойынша орнатылған ғылыми консенсусқа негізделген операциялық талдау санаты ретінде қолданылады және жеке пайдаланушылар немесе олардың мотивациясы туралы үкім болып табылмайды. Әр санат үшін 1-кестеде егжей-тегжейлі сипатталғандай, нақты, өкілдік іздеу терминдерінің жиынтығы қолданылды.&lt;/p&gt;\n&lt;p&gt;Сапалық жіктеу Google-дің Gemini үлкен тілдік моделі (LLM) көмегімен жүзеге асырылды. Модельге бейненің атауы, сипаттамасы және тегтері, сондай-ақ бейнені «ғылыми», «псевдоғылыми» немесе «өзекті емес» деп санаттау бойынша егжей-тегжейлі нұсқаулық берілді. Нұсқаулық әр санатты нақты белгілеп берді және егер ақпарат түсініксіз немесе жеткіліксіз болса, модельге «өзекті емес» мәртебесін беруді бұйырды, бұл жіктеуге консервативті тәсілді қамтамасыз етті. Тек бастапқы іздеу термині санаты (ғылыми немесе псевдоғылыми) LLM жіктеуіне сәйкес келетін бейнелер таңдауға енгізілді. Бұл &lt;a href=\"concepts/step.html\"&gt;қадам&lt;/a&gt; псевдоғылыми іздеу сұранысы арқылы алынған псевдоғылыми мәлімдемелерді жоққа шығаратын ғылыми бейнелер сияқты түсініксіз жағдайларды алып тастау үшін өте маңызды болды, осылайша екі аудитория түрі арасында нақты бөлуді қамтамасыз етті.&lt;/p&gt;\n&lt;p&gt;Әрбір пікір үшін кейінгі талдауға қажетті белгілерді бөліп алу үшін NLP конвейері қолданылды. Сұхбат желілерін реконструкциялау: әрбір ата-аналық пікір үшін API барлық тікелей жауаптарды алу үшін қолданылды. Бұл құрылым деректер жиынтығында сақталды, әрбір пікір ата-аналық пікірмен байланыстырылды және Conversation_id-ге ие болды. Үнді талдау: әрбір пікірдің үні Hugging Face кітапханасындағы nlptown/bert-base-multilingual-uncased-sentiment моделі көмегімен анықталды. Тақырыптық санаттау: әрбір пікірдің тақырыбын немесе ниетін санаттау үшін MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7 моделі көмегімен &lt;a href=\"concepts/zero-shot.html\"&gt;zero-shot&lt;/a&gt; санаттау тәсілі қолданылды.&lt;/p&gt;\n&lt;p&gt;Талдау корпусының сапасын қамтамасыз ету үшін алдын ала қайта өңдеудің бірнеше кезеңі жүзеге асырылды. Талдаудың негізгі бірлігі сұхбат желісі болды. Сондықтан кемінде бір жауапты қамтитын желінің бір бөлігі болған пікірлер ғана енгізілді; жауапсыз оқшауланған жоғары деңгейдегі пікірлер жүктелмеді, өйткені олар сұхбат құрылымына үлес қоспайды. Лингвистикалық әртүрлілікке келетін болсақ, әрбір пікірдің тілі papluca/xlm-roberta-base-language-detection моделі көмегімен анықталды. Сондай-ақ, бүкіл корпус бойынша пікірлердің дубликаттары тексерілді; алайда дубликаттар анықталмады.&lt;/p&gt;\n&lt;p&gt;Автоматтандырылған жіктеу конвейері жиналған бейнелерді сәтті санаттап, 2 түрлі пікір корпусы үшін негіз қалады. Қорытынды деректер жиынтығы ғылыми деп санатталған бейнелерден 20 387 пікірді және псевдоғылыми деп санатталған бейнелерден 32 025 пікірді қамтыды. Бұл пікірлердің уақытша таралуын талдау деректер он жылдан астам кезеңді (2011 жылдан 2025 жылғы мамырға дейін) қамтыса да, екі корпустағы өзара әрекеттесулердің көпшілігі соңғы жылдарға сәйкес келетінін көрсетеді, бұл платформаны денсаулық сақтау бойынша талқылаулар үшін пайдаланудың артып келе жатқанын көрсетеді. Тақырыптық талдау екі аудитория арасында құрылымдық ұқсастықтарды да, нақты функционалдық айырмашылықтарды да анықтады. Екі топта да «сезімдерді білдіру» және «салыстыру» ең жиі кездесетін санаттар болды. Алайда, олардың салыстырмалы маңыздылығы мен эмоционалдық бояуы екі корпус арасында әртүрлі болды. Псевдоғылыми корпус мақтаулардың, алғыстардың және қысқа растаулардың жоғары жиілігін көрсетті, ал «медициналық емдеу» және «кеңес сұраулары» ғылыми корпуста салыстырмалы түрде жиі кездесті.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f1.jpg\" alt=\"Зерттеуде қолданылған бейнелер корпусын алу процесінің жұмыс ағынының көрінісі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Зерттеуде қолданылған бейнелер корпусын алу процесінің жұмыс ағынының көрінісі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f2.jpg\" alt=\"Пікірлерді алу және оларды талдау процесінің жұмыс ағынының көрінісі. NLP: табиғи тілді өңдеу.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Пікірлерді алу және оларды талдау процесінің жұмыс ағынының көрінісі. NLP: табиғи тілді өңдеу.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f3.jpg\" alt=\"Ғылыми және жалған ғылыми аудиториялардағы жылдар бойынша пікірлер санының гистограммасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ғылыми және жалған ғылыми аудиториялардағы жылдар бойынша пікірлер санының гистограммасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f4.jpg\" alt=\"Ғылыми аудитория үшін анықталған процесс.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ғылыми аудитория үшін анықталған процесс.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f5.jpg\" alt=\"Жалған ғылыми аудитория үшін анықталған процесс.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Жалған ғылыми аудитория үшін анықталған процесс.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f6.jpg\" alt=\"Ғылыми аудиторияның өзара әрекеттесу желісі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ғылыми аудиторияның өзара әрекеттесу желісі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f7.jpg\" alt=\"Псевдоғылыми аудиторияның өзара әрекеттесу желісі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Псевдоғылыми аудиторияның өзара әрекеттесу желісі.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Денсаулық&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;туралы жалған&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ақпараттың&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;таралуы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Желілік талдау&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және процестік&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельдеу&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ғылым — сын,&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жалған ғылым —&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эмоционалды&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;байланыс&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Дезинформациям&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ен күресте&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эмоцияны&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;түсіну маңызды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мақала рецензияланатын Journal of medical Internet research журналында жарияланған. Бірақ бұл да бір зерттеу ғана, түпкілікті қорытынды емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&l
