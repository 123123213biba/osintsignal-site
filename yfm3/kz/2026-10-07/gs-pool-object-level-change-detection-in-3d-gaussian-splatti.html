        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"101\" cy=\"177\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"659\" cy=\"167\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · CHANGE_DETECTION   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;GS-Pool: 3D-кеңістіктегі&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өзгерістерді анықтаудың жаңа&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;әдісі&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f2.jpg\" alt=\"2-сурет. Бір PASLCD ұяшығындағы GS-Pool: әрбір келу үшін дистилденген DINOv3 өрісі (1), нысандарға біріктірілген SAM2 се\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Бір PASLCD ұяшығындағы GS-Pool: әрбір келу үшін дистилденген DINOv3 өрісі (1), нысандарға біріктірілген SAM2 сегменттері (2), әрбір примитив үшін төрт тасымалдаушы және сахнаның нөлдік нысаны (3), әрбір нысан үшін бір шешім (4), сондай-ақ өзгерістер маскасы және өзгертілген примитивтер (5).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер 3D Gaussian Splatting көмегімен жасалған 3D-реконструкциялардағы өзгерістерді анықтау үшін GS-Pool әдісін ұсынды. Бұл тәсіл әр пикселді емес, тұтас нысандарды талдайды. Нәтижесінде, жарықтандыру немесе камера бағыты өзгерген жағдайда да бөлмедегі өзгерістерді дәлірек анықтауға болады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;GS-Pool 3D-примитивтерді нысандарға біріктіреді, бұл өзгерістерді пиксел емес, нысан деңгейінде талдауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;SAM2 маскалары мен DINOv3 белгілері реконструкциядағы кездейсоқ қателерді (дрейф) жоюға көмектеседі.&lt;/li&gt;\n&lt;li&gt;Әдіс PASLCD және CL-Splats деректер жиынтығында бұрынғы әдістерден 17-57%-ға жоғары дәлдік көрсетеді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aedister-zhaene-daeldik\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#aedister-zhaene-daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер және дәлдік&lt;/span&gt;&lt;/a&gt;Әдістер және дәлдік&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Әдіс&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Деректер&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Дәлдік&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Шектеу&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;GS-Pool&lt;/td&gt;\n&lt;td&gt;PASLCD, CL-Splats&lt;/td&gt;\n&lt;td&gt;0.751 mIoU&lt;/td&gt;\n&lt;td&gt;Бастапқы 3DGS сапасына тәуелді&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Әдіс 3D Gaussian Splatting (3DGS) технологиясына негізделген, онда көрініс 3D-гауссиандар жиынтығы ретінде ұсынылады. Негізгі мәселе — «дрейф» (реконструкциядағы кездейсоқ айырмашылықтар). GS-Pool SAM2 &lt;a href=\"concepts/segmentatsiya.html\"&gt;сегментация&lt;/a&gt; маскаларын біріктіріп, нысандар пулын жасайды. Жүйе DINOv3 белгілерін салыстырады және оқытудағы қателерді 3D-примитивтерге қайтаратын функцияны қолданады.&lt;/p&gt;\n&lt;p&gt;PASLCD деректер жиынтығындағы сынақтарда әдіс mIoU көрсеткіші бойынша 0.751 нәтижесін көрсетті. Бұл ең мықты балама әдіс GS-Diff-тен 17%-ға жоғары. Алгоритм екінші түсірілім жылдам және аз фотосуреттермен жасалған болса да, жоғары дәлдікті сақтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс алдын ала 3D-реконструкцияны талап етеді және SAM2 моделінің сегментация дәлдігіне тәуелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Зауыттар немесе мұражайлар сияқты нысандарды мониторингтеу кезінде түсірілім бірнеше айлық аралықпен жүргізіледі. 3D Gaussian Splatting (3DGS) әдісімен жасалған екі 3D-реконструкцияны салыстыру оқытудың стохастикалық табиғатына байланысты қиын: кеңістікте өзгерістер болмағанның өзінде модельдер сәйкес келмейді. Сонымен қатар, қайта сканерлеулерде көбінесе бастапқы деректер аз болады. Авторлар бір кеңістіктің екі тәуелсіз 3D-реконструкциясы арасындағы өзгерістерді автоматты түрде анықтау үшін GS-Pool әдісін ұсынады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3D Gaussian Splatting (3DGS) — бұл сахнаны миллиондаған кішкентай 3D-бұлттар (гауссиандар) жиынтығы ретінде көрсететін рендеринг әдісі, ол фотосуреттер бойынша геометрияны жылдам және егжей-тегжейлі қалпына келтіруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алгоритм бастапқы фотосуреттерден алынған және 3D-гауссиандарға проекцияланатын SAM2 сегментация маскаларын пайдаланады. Бұл шешімдерді 3D-кеңістіктегі нысандар деңгейінде қабылдауға мүмкіндік береді. «Фотографиялық тасымалдаушы» (photographic carrier) ұғымы енгізіледі: бір реконструкция үшін 3DGS оқытудағы шығын функциясы екінші сапардың фотосуреттеріне қатысты есептеледі. Бұл деректер геометриялық және түстік параметрлермен, сондай-ақ DINOv3 арқылы алынған белгілермен біріктіріледі. Әр сахна үшін өзгеріс шегі екі сапарда да бар нысандармен салыстыру арқылы анықталады.&lt;/p&gt;\n&lt;p&gt;PASLCD деректер жинағында GS-Pool әдісі 0,751 mIoU және 0,846 F1 көрсеткіштерін көрсетті. Салыстыру үшін, бұрынғы ең жақсы әдіс GS-Diff сәйкесінше 0,644 және 0,758 нәтиже көрсетті, бұл mIoU бойынша 17% және F1 бойынша 12% дәлдіктің өсуін білдіреді. Басқа әдістермен (O-SCD, PlenoCI және MV-3DCD) салыстырғанда артықшылық 36%-дан 57%-ға дейін құрады. CL-Splats деректер жинағында нәтиже 0,855 mIoU болды, бұл MV-3DCD көрсеткішінен 33%-ға жоғары.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GS-Pool өзгерістерді анықтаудың қолданыстағы әдістерінен озып, PASLCD-де 0,751 mIoU және CL-Splats-те 0,855 mIoU-ге жетеді, сонымен қатар инспекторға өзгертілген нысандардың 3D-визуализациясын шешімнің негіздемесімен ұсынады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс SAM2 сегментациясының сапасына және 3D-реконструкцияның дәлдігіне сүйенеді; сапарлар арасындағы бастапқы фотосуреттер санында айтарлықтай айырмашылық болса, тиімділік өзгеруі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"3d-rekonstrukciyalardaghy-oezgeristerdi-anykhtau\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#3d-rekonstrukciyalardaghy-oezgeristerdi-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3D-реконструкциялардағы өзгерістерді анықтау&lt;/span&gt;&lt;/a&gt;3D-реконструкциялардағы өзгерістерді анықтау&lt;/h4&gt;\n&lt;p&gt;Әр түрлі уақытта түсірілген кеңістіктегі өзгерістерді анықтау міндеті жарықтандырудың, ракурстардың және 3D Gaussian Splatting (3DGS) оқытылуының кездейсоқ сипатына байланысты күрделене түседі. Бір орынның екі тәуелсіз реконструкциясы ешқашан мінсіз сәйкес келмейтіндіктен, «дрейф» (ығысу) пайда болады — бұл нақты өзгерістерге байланысты емес айырмашылық. GS-Diff сияқты қолданыстағы әдістер бұл мәселені жекелеген примитивтер (3D-саxнаның элементар бөлшектері) деңгейінде шешуге тырысады және шешім қабылдау үшін 0,5 мәніндегі қатаң шекті қолданады. Бұл қателіктерге әкеледі, өйткені бір нысан мыңдаған примитивтен тұруы мүмкін және шекті мән контекстті ескермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GS-Pool әдісі шешім қабылдауды жекелеген примитивтер деңгейінен тұтас нысандар деңгейіне ауыстырады, ол үшін SAM2 маскалары мен бастапқы фотосуреттер арқылы тексеру қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3D Gaussian Splatting (3DGS) — 3D-саxнаны кез келген ракурстан визуализациялауға болатын миллиондаған ұсақ «гаусс» бұлттары жиынтығы ретінде көрсету әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар SAM2 (Segment Anything Model 2) маскаларының көмегімен примитивтерді нысандарға біріктіретін GS-Pool әдісін ұсынады. Өзгерістерді растау үшін «фотографиялық тасымалдаушы» қолданылады: 3DGS реконструкциясын басқа сапардың фотосуреттері негізінде оқытудағы қателік функциясы. Егер нысан өзгерсе, қателік жоғары болады. Сондай-ақ, примитивтерге іргелі модельден алынған семантикалық өріс енгізіледі, бұл геометрия мен түс ұқсас болса да нысандарды ажыратуға көмектеседі. Өзгеріс шегі әр саxна үшін жеке, екі сапарда да бар нысандардың таралуы негізінде калибрленеді.&lt;/p&gt;\n&lt;h4 id=\"bajlanysty-zhumystar\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#bajlanysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты жұмыстар&lt;/span&gt;&lt;/a&gt;Байланысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;Дәстүрлі өзгерістерді анықтау әдістері 2D-кескіндер кеңістігінде жұмыс істейді және жұптық суреттерді пиксель немесе суперпиксель деңгейінде салыстырады. Заманауи тәсілдер алдын ала оқытылған іргелі модельдерді пайдаланады, алайда олардың дәлдігі шектеулі (мысалы, CYWS-2D әдісі PASLCD деректер жиынында 0,273 mIoU-ға жетеді).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Көптеген 2D-әдістер тек кескіндер жұбын салыстырумен шектеледі, бұл саxнаның көлемдік құрылымын тиімді ескеруге мүмкіндік бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MV-3DCD және O-SCD сияқты 3D-тәсілдерде өзгерістер 2D-карталардың 3D-примитивтерге проекциялары арқылы бағаланады. GS-Diff реконструкция дрейфін модельдейтін ең жақын аналог болып табылады. Олардан айырмашылығы, GS-Pool екі жақты тексеруді пайдаланады (оқытудағы қателік растеризатор арқылы екі реконструкцияның примитивтеріне ауыстырылады) және деректерді жекелеген примитивтер емес, нысандар деңгейінде жинақтайды. PlenoCI әдісі де өзгерістерді талдайды, бірақ PASLCD деректер жиынында заманауи шешімдерге қарағанда төменірек нәтижелерді көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"obuekt-denggejindegi-oezgeristerdi-anykhtau\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#obuekt-denggejindegi-oezgeristerdi-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объект деңгейіндегі өзгерістерді анықтау&lt;/span&gt;&lt;/a&gt;Объект деңгейіндегі өзгерістерді анықтау&lt;/h4&gt;\n&lt;p&gt;Өзгерістерді анықтаудың қолданыстағы әдістері көбінесе жеке пикселдер немесе примитивтер деңгейінде шешім қабылдайды. SceneDiff әдісі сахнаны объектілер деңгейінде талдайды және қайталанған сапарларда объектілердің сәйкестендірілуін сақтай отырып, бейнеклиптер жұбын пайдаланады. Жүйе тереңдік пен тікелей таралу нейрондық желісі болжаған позаларды пайдалана отырып, бір-бірінің үстіне түсетін кадрлар үшін негізгі модельдерден алынған белгілерді салыстырады және толық реконструкцияны құрмастан әр кадр үшін маска шығарады. GS-Pool әдісі болса, екі тәуелсіз жасалған реконструкцияны салыстырады және өзгерген объектілерді примитивтер жиынтығы ретінде бөліп көрсетеді. SceneDiff-тен айырмашылығы, ол дайын 3D-модельдермен жұмыс істейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SceneDiff маскалар жасау үшін бейне ағындарын талдаса, GS-Pool өзгерістерді примитивтер деңгейінде анықтау үшін екі тәуелсіз 3D-реконструкцияны салыстырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әртүрлі уақыт кезеңдеріндегі модельдерді салыстыру бұрын нүктелер бұлттары, робототехника карталары және фотосуреттерді қалалық модельдермен салыстыруда қолданылған. Гаусс сплаттары (Gaussian splats) контекстінде зерттеулер көбінесе қолданыстағы модельдерді жаңартуға немесе өзгерістер болмаған жағдайда оларды тіркеуге бағытталған. SLAM негізіндегі әдістер тек геометрияны салыстырады, ал карта негізіндегі тәсілдер робот орынға қайта оралғанда бір картаны жаңартады. Сплаттарды жаңарту әдістері өзгерістерді жергіліктендіреді, ал GS-Pool екі тәуелсіз реконструкцияны салыстырады.&lt;/p&gt;\n&lt;p&gt;Семантикалық өрістер көбінесе өңдеу мен сегментацияны қолдау үшін нейрондық сәулелену өрістері мен Гаусс сплаттарына интеграцияланады. Бұл жұмыста DINOv3 (ViT-L/16) белгілері гауссиялар параметрлері өзгеріссіз күйде әр реконструкцияға дистилденеді. Бұл белгілер өзгерістердің дәлелдерінің бірі ретінде қызмет етеді, ал SAM2 моделі фотосуреттерді объект маскаларына сегментациялау үшін қолданылады.&lt;/p&gt;\n&lt;p&gt;PASLCD сияқты қолданыстағы бенчмарктар тұрақты және өзгермелі жарық жағдайында түсірілген бес ішкі және бес сыртқы сахнаны қамтиды. Әр деректер жиынтығы 50-ден 109-ға дейінгі эталондық фотосуреттерді және 25 тесттік көріністі қамтиды. CL-Splats-те бес нақты сахна объектілер өзгертілген күйде екі рет түсірілген, бірақ дайын маскалардың жоқтығына байланысты авторлар оларды қолмен белгілеп шыққан.&lt;/p&gt;\n&lt;h4 id=\"3-aedis\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#3-aedis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Әдіс&lt;/span&gt;&lt;/a&gt;3. Әдіс&lt;/h4&gt;\n&lt;p&gt;GS-Pool бір камераға ие бір кеңістіктің екі тәуелсіз реконструкцияланған Гаусс өрісін (GT₁ және GT₂) қабылдайды және өзгерген объектілерді олардың маскаларымен бірге қайтарады. Деректерді өңдеу процесі бес кезекті кезеңнен тұрады, бұл әр шешімнің негізін бақылауға мүмкіндік береді (Сурет 2). T₁ сапары эталондық, ал T₂ өзгерістер картасын бағалау үшін мақсатты сапар болып табылады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f2.jpg\" alt=\"2-сурет. Бір PASLCD ұяшығындағы GS-Pool: әрбір келу үшін дистилденген DINOv3 өрісі (1), нысандарға біріктірілген SAM2 се\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет. Бір PASLCD ұяшығындағы GS-Pool: әрбір келу үшін дистилденген DINOv3 өрісі (1), нысандарға біріктірілген SAM2 сегменттері (2), әрбір примитив үшін төрт тасымалдаушы және сахнаның нөлдік нысаны (3), әрбір нысан үшін бір шешім (4), сондай-ақ өзгерістер маскасы және өзгертілген примитивтер (5).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гаусс сплаттары (3DGS) — бұл 3D-сахнаны күрделі кескіндерді жылдам рендерлеуге мүмкіндік беретін миллиондаған кішкентай эллипсоидтар (примитивтер) жиынтығы ретінде көрсету әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"3d-degi-sheshimder\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#3d-degi-sheshimder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3D-дегі шешімдер&lt;/span&gt;&lt;/a&gt;3D-дегі шешімдер&lt;/h4&gt;\n&lt;p&gt;GS-Pool примитивтерден құралған объектілерді жіктейді. Фотосуреттер сегменттерді, оларды қадағалау деректерін және 3D-кеңістікте ұсынылған өзгерістерді растайтын немесе жоққа шығаратын визуалды дәлелдерді ұсынады. Қорытынды маска өзгерген объектілердің таңдалған примитивтерін рендерлеу арқылы қалыптасады. Кіріс деректері ретінде стандартты 3DGS немесе FastPGSR әдістері көмегімен өзгерістерсіз жасалған реконструкциялар қолданылады.&lt;/p&gt;\n&lt;h4 id=\"31-1-kezeng-distildengen-semantikalykh-oeris\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#31-1-kezeng-distildengen-semantikalykh-oeris\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1. 1-кезең: дистилденген семантикалық өріс&lt;/span&gt;&lt;/a&gt;3.1. 1-кезең: дистилденген семантикалық өріс&lt;/h4&gt;\n&lt;p&gt;Әр примитивке семантикалық дескриптор бекітіледі. DINOv3 (ViT-L/16) белгілері бұзылмаған кескіндерден алынады, PCA көмегімен D=32 өлшемге дейін қысқартылады және примитивтерге дистилденеді. Әр примитив үшін &lt;span class=\"yfm-latex\" data-content=\"f_i%20%5Cin%20%5Cmathbb%7BR%7D%5E%7B32%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; белгі векторы түс сияқты альфа-композиция көмегімен рендерленеді және барлық көріністердегі белгі жамауларына сәйкес келуі үшін оңтайландырылады. Реконструкцияның өзі (гауссиялардың позициялары, масштабтары, айналулары, мөлдірлігі және түсі) өзгеріссіз қалады, тек белгі векторлары оңтайландырылады. PCA екі сапар үшін де бір уақытта бапталады, бұл олардың белгілерін бірыңғай кеңістікте салыстыруға мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"32-2-kezeng-nysandar-pulyn-khalyptastyru\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#32-2-kezeng-nysandar-pulyn-khalyptastyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2. 2-кезең: нысандар пулын қалыптастыру&lt;/span&gt;&lt;/a&gt;3.2. 2-кезең: нысандар пулын қалыптастыру&lt;/h4&gt;\n&lt;p&gt;Бұл кезеңде примитивтер (сахнаның базалық элементтері) нысандарға біріктіріледі. SAM2 алгоритмі әр сапардың фотосуреттерін сегменттеп, нысан маскаларын бөліп алады. Деректерді салыстырмалы ету үшін екі сапардағы фотосуреттер саны теңестіріледі: суреттері көп сапар екіншісінің деңгейіне дейін субдискретизацияланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SAM2 (Segment Anything Model 2) — кескін мен бейнелердегі нысан шекараларын бөліп алуға қабілетті нейрондық желі моделі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Маскалар примитивтерге проекцияланады. Примитив нысанға бекітіледі, егер ол визуализацияланатын бетте орналасса (тереңдіктегі ауытқу &lt;span class=\"yfm-latex\" data-content=\"%2Fe_i(%5Cell)%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ауытқу медианасының үш еселенген мәнінен аспаса) және примитив салмағының кемінде жартысы (1)-формулаға сәйкес нысан маскасына түссе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Примитив бетке сәйкес келсе және рендерлеу салмағының 50%-дан астамы нысан маскасының ішінде болса, ол нысанға бекітіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нысан тректері бірдей идентификаторы бар сегменттерді біріктіру арқылы қалыптасады. Егер тректер қиылысса (IoU(A, B) ≥ 0.2), олар бір нысанға бірігеді. Егер примитив бірнеше нысанға талаптанса, ол рендерлеу салмағы ең жоғары нысанға бекітіледі (кемінде екі кілт кадрда расталуы шарт). Жалпы «жабылған» примитивтер көлемінің жартысынан көбін алатын нысандар (әдетте қабырға немесе еден) фон деп есептеліп, жойылады. Нысан талдауға жарамды (poolable) деп саналады, егер оның көлемі пулдағы нысандар өлшемдерінің төменгі квартилі мен 2W аралығында болса (3-формула).&lt;/p&gt;\n&lt;h4 id=\"33-3-kezeng-oezgeristerding-toert-tasymaldaushysy\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#33-3-kezeng-oezgeristerding-toert-tasymaldaushysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3. 3-кезең: өзгерістердің төрт тасымалдаушысы&lt;/span&gt;&lt;/a&gt;3.3. 3-кезең: өзгерістердің төрт тасымалдаушысы&lt;/h4&gt;\n&lt;p&gt;Әр примитив үшін [0, 1] диапазонында өзгерістердің төрт көрсеткіші («тасымалдаушылар») есептеледі. Үшеуі екі примитив жиынтығы арасындағы геометрияны, түс пен семантиканы салыстыруға негізделген, төртіншісі басқа сапардың фотосуреттерін талдауға негізделген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бір сахнаның екі реконструкциясы ешқашан мінсіз сәйкес келмейтіндіктен, алгоритм табиғи «дрейфті» (ығысуды) ескереді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дрейф басқа сапардағы ең жақын примитивке дейінгі қашықтықтың жоғарғы квартилі ретінде бағаланады. Ол екіге бөлінеді: u_n (бет нормалы бойымен) және u_t (бет ішінде). Бұл мәндер примитивтің позициялық белгісіздігімен бірге &lt;span class=\"yfm-latex\" data-content=\"%5CSigma_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ковариациялық матрицасын салыстыру ядроларында қолданылатын $ ilde{\\Sigma}_i$ мәніне дейін кеңейтеді.&lt;/p&gt;\n&lt;h4 id=\"izdeu-shary\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#izdeu-shary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Іздеу шары&lt;/span&gt;&lt;/a&gt;Іздеу шары&lt;/h4&gt;\n&lt;p&gt;Екі түсірілім сессиясындағы примитивтерді (3D-сахнаның элементарлы бірліктері) салыстыру үшін «іздеу шары» B(i) қолданылады. Ол көршілерді іздеуді примитивтің ковариациясының үш стандартты ауытқуы шегінде шектейді. k параметрі аймақтағы примитивтердің медианалық саны ретінде анықталады, бұл тығыз және сирек аймақтарды салыстыруда тең мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Іздеу шары — бұл тығыз орналасқан бөлшектері бар аймақтар мен бос қабырғалар арасындағы іздеу мүмкіндіктерін теңестіретін нормалау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Геометриялық сәйкессіздік δgeo^i көршілердің орналасуы мен пішінінің ұқсастығы арқылы бағаланады. Түстік сәйкессіздік δcol^i нысанның көлеміне байланысты өзгеретін σcol шкаласын ескереді. Семантикалық талдау (4a, 4b-теңдеулер) әр өлшем үшін жеке шкала бойынша дистилденген белгілерді қолданады. Бұл PCA компоненттерінің сахнада әртүрлі болуына байланысты маңызды, әйтпесе кішігірім нысандар байқалмай қалуы мүмкін.&lt;/p&gt;\n&lt;p&gt;Фотографиялық тасымалдаушы δpho^i (5a, 5b, 6-теңдеулер) модель рендерін басқа сессиядағы нақты фотосуреттермен салыстырады. Қателік L₁ (түс қателігі) мен DSSIM (құрылымдық сәйкессіздік) комбинациясы арқылы есептеледі. Растеризатор арқылы кері таралу (backpropagation) көмегімен окклюзиялар (нысандардың бір-бірін жауып қалуы) ескеріледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фотографиялық тасымалдаушы ең маңызды компонент: FastPGSR жиынтығында оны алып тастау дәлдікті 12,9%-ға, ал қарапайым 3DGS үшін 20,5%-ға төмендетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"empiriyalykh-noel\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#empiriyalykh-noel\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эмпириялық нөл&lt;/span&gt;&lt;/a&gt;Эмпириялық нөл&lt;/h4&gt;\n&lt;p&gt;Өзгермеген нысандардың сәйкессіздік деңгейі түсірілім шарттарына байланысты болғандықтан, авторлар «эмпирикалық нөл» (Nprim және Nobj) ұғымын енгізеді. Бұл екі сессияда да бар және өзгермеген деп есептелетін примитивтер жиынтығы (7a, 7b-теңдеулер). Бұл әр сахна үшін өзгерістерді анықтау шектерін калибрлеуге көмектеседі. 3-суретте көрсетілгендей, орнында өзгерген нысандар (мысалы, босатылған стақан) үшін геометриялық және түстік белгілер тиімсіз, бірақ фотографиялық тасымалдаушы оларды анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Эмпирикалық нөл» әдісі екі сессияда да бар нысандарды өзгермеген деп қабылдайды, алайда орнында өзгерген нысандар қателікпен «нөлдік» жиынтыққа еніп кетуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obuektiler-rejtingi\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#obuektiler-rejtingi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объектілер рейтингі&lt;/span&gt;&lt;/a&gt;Объектілер рейтингі&lt;/h4&gt;\n&lt;p&gt;Авторлар өзгерістерді бағалау үшін белгілердің төрт түрін (тасымалдаушыларды) пайдаланады: түс, геометрия, фотометриялық деректер және семантика. Әрбір белгі салыстырмалы статистикаға айналдырылады: примитивтің мәні сол сапар аясындағы «нөлдік» (өзгермеген) примитивтер арасындағы рангпен алмастырылады. Объектінің қорытынды рангасы R_c(o) оның примитивтері рангтерінің орташа мәні ретінде есептеледі (8-формула). Бұл Манн-Уитни статистикасының қалыпқа келтірілген түрі: ол объект белгісінің «нөлдік» объектінікінен үлкен болу ықтималдығын көрсетеді. 0,5-тен жоғары мәндер өзгерістердің бар екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;R_c(o) статистикасы көптеген примитивтер деректерін біріктіруге мүмкіндік береді, мұнда 0,5-тен жоғары мәндер объектінің өзгергенін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шешім қабылдау үшін «ядро» (core) қолданылады, ол объектіні басқа сапардағы «нөлдік» объектілермен салыстырады. Төрт ранг Фишер статистикасы арқылы біріктіріледі (9b-формула), ол χ² таралуына сәйкес келеді. Белгілер арасындағы тәуелділікті ескеру үшін Браун түзетуі қолданылады (10-формула). Егер қорытынды мән θ шегінен асса, объект өзгерген деп белгіленеді. Бұл ядро mIoU көрсеткіші бойынша алдыңғы әдістерден жоғары нәтиже береді (2-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фишер статистикасы мұнда тәуелсіз ықтималдықтарды (рангтерді) бірыңғай маңыздылық көрсеткішіне жинақтау үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fotografiyalykh-bakhylau\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#fotografiyalykh-bakhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фотографиялық бақылау&lt;/span&gt;&lt;/a&gt;Фотографиялық бақылау&lt;/h4&gt;\n&lt;p&gt;«Ядро» реконструкцияға сүйенетіндіктен, ол примитивтердің ығысуы немесе олардың аздығы салдарынан қателіктер жіберуі мүмкін. Сондықтан авторлар объектіні фотосуреттер арқылы тікелей тексереді. Ол үшін объект камераға проекцияланады және «&lt;a href=\"concepts/trace.html\"&gt;із»&lt;/a&gt; (footprint) — объектіге тиесілі пикселдер жиынтығы есептеледі. Егер осы іздегі орташа фотометриялық қателік бүкіл сурет бойынша қателіктің 95-перцентилінен асса, фотосурет осы объект үшін «ыстық» (hot) деп саналады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс проекция сапасына байланысты: егер объект басқа элементтермен жабылған болса, пикселдер есепке алынбайды, бұл бағалау дәлдігін төмендетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екі метрика енгізіледі: &lt;span class=\"yfm-latex\" data-content=\"%5Ceta(o)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — «ыстық» фотосуреттердің үлесі және γ(o) — объектінің орташа қателігі суреттегі басқа объектілердің медиандық қателігінен жоғары болған фотосуреттер үлесі (11, 12-формулалар). Бұл тек кадрға жиі түсетін объектілер үшін бағаны асыра бағалаудан сақтайды.&lt;/p&gt;\n&lt;h4 id=\"sheshim-khabyldau-erezhesi\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#sheshim-khabyldau-erezhesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шешім қабылдау ережесі&lt;/span&gt;&lt;/a&gt;Шешім қабылдау ережесі&lt;/h4&gt;\n&lt;p&gt;Қорытынды шешім ядро мен фотометриялық көрсеткіштерді біріктіреді. Жүйе үш шартты пайдаланады: «кворум» (рангтердің сәйкестігін тексеру), «қабылдау» (admit) және «қабылдамау» (reject). Объект қабылданған және қабылданбаған болса, ол өзгерген деп табылады. Ережелер күрделі жағдайларды өңдеуге мүмкіндік береді: кіші объектілер, примитивтері ығысқан объектілер және төмен контрастты объектілер (оларды жоғары семантикалық ранг құтқарады).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біріктірілген тәсіл (ядро + фото-статистика) өзгерістерді анықтау дәлдігін арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"35-5-kezeng-oezgertilgen-primitivter-men-maskalar\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#35-5-kezeng-oezgertilgen-primitivter-men-maskalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5. 5-кезең: өзгертілген примитивтер мен маскалар&lt;/span&gt;&lt;/a&gt;3.5. 5-кезең: өзгертілген примитивтер мен маскалар&lt;/h4&gt;\n&lt;p&gt;Өзгертілген нысанның ауқымы кемінде бір тасымалдаушыда Nprim 95-перцентилінен (Q0.95) асатын жабушы примитивтер жиынтығы ретінде анықталады: &lt;span class=\"yfm-latex\" data-content=\"E(o)%20%3D%20%5C%7Bi%20%5Cin%20o_v%20%3A%20%5Cexists%20c%2C%20x_i%5Ec%20%3E%20Q_%7B0.95%7D%5C%7Bx_j%5Ec%5C%7D_%7Bj%20%5Cin%20N_%7Bprim%7D%7D%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Бұл ауқымдар өзгеріс маскасын қалыптастыру үшін әрбір тест көрінісіне проекцияланады. Барлық жабушы примитивтерді пайдалану mIoU көрсеткішін төмендетеді, себебі нысанның примитивтер жиынтығына ол жанасатын, бірақ өзгермеген беттер де кіріп кетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Өзгеріс аймағын 95-перцентиль арқылы анықтау өзгермейтін фондық беттерді алып тастауға және маскалау дәлдігін арттыруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"4-taezhiribeler\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#4-taezhiribeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Тәжірибелер&lt;/span&gt;&lt;/a&gt;4. Тәжірибелер&lt;/h4&gt;\n&lt;p&gt;Әдіс PASLCD деректер жиынындағы 20 көрініс пен CL-Splats аннотациялары негізінде сыналды. Әр конфигурация үшін әр сапардың үш тәуелсіз реконструкциясы жүргізілді (кестенің әр жолына 60, барлығы 240 сынақ). Екі типтегі «жаттықтырушы» (детектор): FastPGSR және стандартты 3DGS бағаланды. Кадрларды біріктірудің екі тәсілі қолданылды: «бірлескен» (joint frame) және «бекітілген» (anchored frame). RTX 4090 графикалық картасында бір сынақты өңдеу уақыты FastPGSR үшін 2,1 минутты және 3DGS үшін 5,7 минутты құрайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;mIoU (mean Intersection over Union) — сегментация дәлдігін бағалайтын метрика: мән 1-ге жақындаған сайын өзгеріс маскасы нақты нысанмен соғұрлым дәл сәйкес келеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"42-naetizheler\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#42-naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Нәтижелер&lt;/span&gt;&lt;/a&gt;4.2. Нәтижелер&lt;/h4&gt;\n&lt;p&gt;Бірлескен кадрда GS-Pool mIoU бойынша алдыңғы әдістерден 17% (FastPGSR) және 12% (3DGS) жоғары нәтиже көрсетеді. Нәтижелер тұрақты: реконструкция тұқымдары (seeds) бойынша орташа мәндердің стандартты ауытқуы 1,7%-дан аспайды. FastPGSR 3DGS-тен 4,3%-ға жоғары нәтиже береді. CL-Splats деректер жиынында GS-Pool MV-3DCD-ден 33–35%-ға және O-SCD-ден 35–37%-ға асып түседі. Күрделірек PASLCD жиынында PlenoCI-ге қарағанда артықшылық 40%-ға жетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс реконструкция сапасы мен SAM2 моделінің жұмысына тәуелді: егер нысан SAM2 арқылы сегментацияланбаса, кейінгі кезеңдер оның өзгерістерін қалпына келтіре алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-shekteuler\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#5-shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Шектеулер&lt;/span&gt;&lt;/a&gt;5. Шектеулер&lt;/h4&gt;\n&lt;p&gt;GS-Pool жұмысы тікелей деректерді түсіру сапасына байланысты. Жарықтың өзгеруі жалған дабылдарға әкелуі мүмкін, дегенмен GS-Pool MV-3DCD және O-SCD-ге қарағанда жалған пикселдерді азырақ тіркейді. Дистилденген өрістер мен басқа сапар камераларынан проекцияларды пайдалану примитивтер жиынтығын жай салыстыруға қарағанда есептеу шығындарын арттырады.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;h4 id=\"gs-pool-aedisining-naetizheleri-men-tiimdiligi\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#gs-pool-aedisining-naetizheleri-men-tiimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GS-Pool әдісінің нәтижелері мен тиімділігі&lt;/span&gt;&lt;/a&gt;GS-Pool әдісінің нәтижелері мен тиімділігі&lt;/h4&gt;\n&lt;p&gt;GS-Pool әдісі екі тәуелсіз 3DGS (3D Gaussian Splatting) реконструкциясы арасындағы өзгерістерді объектілер деңгейінде анықтайды. Алгоритм әрбір примитив үшін төрт түрлі дескрипторды есептейді: геометриялық, түстік, семантикалық және фотографиялық (соңғысы растеризатор арқылы кері таралу әдісімен өтеді). Содан кейін әрбір объект басқа сапардағы «нөлдік» объектілермен салыстырылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GS-Pool PASLCD деректер жиынында 0,7509 mIoU және 0,8461 F1 көрсеткішіне жетеді, бұл бұрынғы ең жақсы нәтижелерден 17%-ға жоғары.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екі оқыту модулі, екі камера кадры және үш реконструкция үшін бірыңғай конфигурацияны пайдаланғанда, әдіс жоғары дәлдікті көрсетеді. CL-Splats деректер жиынында көрсеткіштер FastPGSR үшін 0,855 mIoU және стандартты 3DGS үшін 0,865 mIoU болды. Әртүрлі жарықтандыру жағдайындағы өзгермеген көріністің екі суретін салыстырғанда, GS-Pool MV-3DCD және O-SCD әдістеріне қарағанда қате өзгерістерді аз белгілейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;mIoU (mean Intersection over Union) — болжанған өзгерістер аймағы мен нақты аймақ арасындағы сәйкестік дәрежесін көрсететін метрика, мұнда 1.0 толық сәйкестікті білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алгоритм нәтижесі әрбір сапар үшін объектілер жиынтығы болып табылады, онда әрбір элемент үшін өзгеріс туралы шешім және тиісті дәлелдер келтіріледі. Өзгертілген примитивтер реконструкциялардың бірінің үстінде 3DGS қабаты ретінде визуализацияланады. Талдауды жеке примитивтерден тұтас объектілерге көшіру болашақта әрбір объектімен болған өзгерістердің түрін жіктеуге мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f5.jpg\" alt=\"5-сурет. Ешбір камера түсірмеген көзқарас нүктесінен Porch сахнасының 3D шығысы. Әрбір келудің өзгертілген примитивтері \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет. Ешбір камера түсірмеген көзқарас нүктесінен Porch сахнасының 3D шығысы. Әрбір келудің өзгертілген примитивтері өз реконструкциясында, ал қалғандары сұр түспен көрсетілген: T1-ден екі орындық пен кружка (a), T2-ден орындық және оның үстеліндегі заттар (b).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f6.jpg\" alt=\"6-сурет. Төрт квантильдік константа, олардың әрқайсысы қалған үшеуі бекітілген кезде өзгертіледі. Әрбір бірлескен кадр ж\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет. Төрт квантильдік константа, олардың әрқайсысы қалған үшеуі бекітілген кезде өзгертіледі. Әрбір бірлескен кадр жолының 60 мүшесі бойынша орташа mIoU. Үзік сызық: таңдалған мән. Нүктелі сызық: шешім қабылдаушы оракул (G қосымшасы).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f7.jpg\" alt=\"Сурет 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f9.jpg\" alt=\"9-сурет. Ең көп аннотацияланған өзгерістері бар барлық бес CL-Splats сахнасы, 22-seed (бастапқы мән) бар екі оқытушы, кө\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет. Ең көп аннотацияланған өзгерістері бар барлық бес CL-Splats сахнасы, 22-seed (бастапқы мән) бар екі оқытушы, көріністің IoU және сахнаның үш seed бойынша mIoU көрсеткіштерімен белгіленген (FastPGSR / қарапайым 3DGS).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f10.jpg\" alt=\"10-сурет. Төрт конфигурация үшін әр ұяшық бойынша mIoU: баған seed орташа мәніне, «мұртшалар» seed диапазонына, ал нүкте\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет. Төрт конфигурация үшін әр ұяшық бойынша mIoU: баған seed орташа мәніне, «мұртшалар» seed диапазонына, ал нүктелер жеке seed мәндеріне сәйкес келеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f10-2.jpg\" alt=\"Сурет 10 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 10 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f11.jpg\" alt=\"11-сурет. Ең көп аннотацияланған өзгерістері бар көріністегі 1–10 ұяшықтар (Cantina-дан Meetingroom-ға дейін), біріктірі\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-сурет. Ең көп аннотацияланған өзгерістері бар көріністегі 1–10 ұяшықтар (Cantina-дан Meetingroom-ға дейін), біріктірілген кадр, seed 22, көріністің IoU және ұяшықтың үш seed бойынша mIoU мәндерімен белгіленген (FastPGSR / vanilla 3DGS).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f12.jpg\" alt=\"12-сурет. 11–20 ұяшықтар (Playground-дан Zen-ге дейін), 11-суреттегідей.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12-сурет. 11–20 ұяшықтар (Playground-дан Zen-ге дейін), 11-суреттегідей.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Екі&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;3D-көріністі&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;салыстыру&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қиындығы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SAM2 маскалары&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мен 3DGS&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;интеграциясы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"1
