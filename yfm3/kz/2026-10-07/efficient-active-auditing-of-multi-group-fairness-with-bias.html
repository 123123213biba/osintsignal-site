        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"208\" cy=\"61\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"592\" cy=\"298\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Нейрожелілердегі&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;біржақтылықты жүйені бұзбай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қалай тексеруге болады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f1.jpg\" alt=\"1-сурет: Әділдік критерийлерін ескеретін қарсылас модельге қарсы интерактивті әділдік аудиті.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Әділдік критерийлерін ескеретін қарсылас модельге қарсы интерактивті әділдік аудиті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Зерттеушілер жасанды интеллект модельдерін толық қалпына келтірмей-ақ, олардағы біржақтылықты тексеру әдісін ұсынды. ALeBi жүйесі топтар арасындағы әділдікті бағалау үшін бейімделгіш сұрауларды пайдаланады. Бұл тәсіл жүйе иелерін деректерді ұрлау шабуылдарынан қорғайды және нәтижелердің ашықтығын қамтамасыз етеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ALeBi модельдің ішкі құрылымын қалпына келтірмей-ақ біржақтылықты бағалайды.&lt;/li&gt;\n&lt;li&gt;Әдіс кемсітушілік жоғары деректер аймақтарын нақты көрсетеді.&lt;/li&gt;\n&lt;li&gt;Алгоритм жүйе иесі қарсылық көрсеткен кезде де өз дәлдігін сақтайды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Дәстүрлі «қара жәшік» &lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt; әдістері көбінесе модельді толық қалпына келтіруді талап етеді, бұл жүйені қауіпке ұшыратады немесе біржақтылық себептерін түсінуге мүмкіндік бермейтін ауқымды тесттерді қажет етеді. Авторлар «біржақтылық зондтары» (bias &lt;a href=\"concepts/probes.html\"&gt;probes&lt;/a&gt;) концепциясын ұсынады — бұл қорғалған топтар арасындағы мінез-құлық айырмашылығын анықтайтын арнайы функционал.&lt;/p&gt;\n&lt;p&gt;ALeBi алгоритмі модельге ең ақпаратты сұрауларды таңдау үшін белсенді оқытуды пайдаланады. Тәжірибелер көрсеткендей, әдіс тіпті модель иесі біржақтылықты жасыруға тырысқан жағдайда да әділдік метрикаларын жоғары дәлдікпен бағалай алады. Зерттеу модель құпиялылығы мен аудит сенімділігі арасындағы тепе-теңдік бойынша теориялық кепілдіктерді белгілейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс таңдау күрделілігі бойынша теориялық болжамдарға сүйенеді және өте аз немесе шулы деректермен шектелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Соңғы онжылдықта машиналық оқыту (ML) екі қарама-қайшы мақсатта дамыды: эмпирикалық тәуекелді азайту (ERM) арқылы болжам қателігін азайту және әділетсіздікті (unfairness bias) бақылау. Тәжірибеде әділеттілікті ескеретін оқыту әдістері стандартты ERM-ге қарағанда мардымсыз нәтиже береді, сондықтан тәуелсіз аудит қажет. «Қара жәшік» модельдеріне арналған қолданыстағы аудит әдістері не модельді толық қайта құруға сүйенеді (бұл жүйені деректерді ұрлау шабуылдарына осал етеді), не әділеттілік көрсеткіштерін тікелей бағалайды, бірақ қай деректер аймағының бұрмалаушылықты тудыратынын анықтауда мүмкіндігі шектеулі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Қара жәшік» аудиті — бұл зерттеуші модельдің ішкі құрылымына кірмей, тек сұраулар жіберу және жауаптарды талдау арқылы жүйені тексеруі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыста «bias probe» (бұрмалаушылықты &lt;a href=\"concepts/probing.html\"&gt;зондтау&lt;/a&gt;) жүйесі ұсынылады, ол модель құпиялылығын сақтай отырып, мақсатты және бейімделгіш аудит жүргізуге мүмкіндік береді. Осы негізде ALeBi алгоритмі ұсынылған — бұл көп топтық әділеттілік көрсеткіштерін тиімді бағалау үшін зондтарды үйрететін белсенді аудитор. Авторлар қасиетке тән күрделілік өлшемі негізінде үлгі күрделілігі (sample complexity) бойынша жаңа кепілдіктерді белгіледі, бұл бұрынғы ашық сұрақтардың бірін шешеді. Зерттеу сонымен қатар модель иесі бұрмалаушылықты әдейі жасыруы мүмкін бәсекелестік (adversarial) сценарийлерді де қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bias probe жүйесі модельді қайта құрмастан бұрмалаушылықты бағалауға мүмкіндік береді, бұл аудит дәлдігі мен модель құпиялылығы арасындағы тепе-теңдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нәтижелер модель құпиялылығы мен сенімді аудит арасындағы іргелі қайшылықты көрсетеді. Зондтау әдісі әрі дәл бағалауға, әрі жоғары немесе төмен бұрмалаушылық аймақтарын түсіндіруге мүмкіндік береді. Тәсілдің практикалық тиімділігі ауқымды тәжірибелермен расталған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл жұмыс препринт (arXiv:2609.40034v1) болып табылады және жарияланған уақытта сараптамалық тексеруден өтпеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"ml-zhuejelerindegi-auditting-oezektiligi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#ml-zhuejelerindegi-auditting-oezektiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ML жүйелеріндегі аудиттің өзектілігі&lt;/span&gt;&lt;/a&gt;ML жүйелеріндегі аудиттің өзектілігі&lt;/h4&gt;\n&lt;p&gt;Машиналық оқыту (ML) модельдерін бағалау өте маңызды мәселеге айналды, өйткені жүйелер медициналық визуализация, жұмысқа қабылдау, несиелеу және онлайн платформалар сияқты салаларда зиянды бейтараптық (bias) көрсетуі мүмкін. Бұл «алгоритмдік әділдік» саласының дамуына түрткі болды. Оқыту процесіне әділдік шектеулерін енгізуге бағытталған дәстүрлі тәсілдер іс жүзінде стандартты ERM (эмпирикалық тәуекелді азайту) әдісіне қарағанда мардымсыз нәтиже береді. Сондықтан назар жүйе іске қосылғаннан кейінгі аудитке (post-deployment auditing) ауысты. Нью-Йорктегі Local Law 144, Еуропадағы Digital Services Act және AI Act сияқты заңнамалық актілер жоғары тәуекелді ML жүйелері үшін ашықтық пен аудитті міндетті талапқа айналдыруда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алгоритмдер аудиті реттеушілер үшін міндетті талапқа айналуда, бірақ қолданыстағы әдістер не модельді толық қайта құруды талап етеді, не өте қымбатқа түседі, бұл ашықтық пен деректер қауіпсіздігі арасындағы қайшылықты тудырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khara-zhaeshik-auditindegi-maeseleler\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#khara-zhaeshik-auditindegi-maeseleler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Қара жәшік» аудитіндегі мәселелер&lt;/span&gt;&lt;/a&gt;«Қара жәшік» аудитіндегі мәселелер&lt;/h4&gt;\n&lt;p&gt;Іске қосылғаннан кейінгі режимде модель әдетте «қара жәшік» ретінде қарастырылады. Сыртқы аудитор модель иесімен сұраулар арқылы өзара әрекеттеседі және модельдің ішкі құрылымына қол жеткізе алмайды. Мұнда іргелі қайшылық туындайды: аудитор әділдікті бағалау үшін жеткілікті ақпарат алғысы келеді, ал модель иесі құпия деректерді қорғау үшін оны шектеуге тырысады. Қолданыстағы тәсілдер не модельді реконструкциялауға тырысады (бұл модельді ұрлау шабуылдарына ашық қалдырады), не үлкен көлемдегі таңбаланған деректерді талап етеді. Авторлар сұрақ қояды: модельді толық реконструкцияламай және үлкен көлемдегі таңбаланған деректерсіз әділдік бойынша кепілдіктерді алу мүмкін бе?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Қара жәшік» — бұл ішкі логикасы пайдаланушыдан жасырылған модель; аудитор тек кіріс деректерін беріп, шығыстағы болжамдарды ғана көре алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"interpretaciya-zhaene-audit-khauipsizdigi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#interpretaciya-zhaene-audit-khauipsizdigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерпретация және аудит қауіпсіздігі&lt;/span&gt;&lt;/a&gt;Интерпретация және аудит қауіпсіздігі&lt;/h4&gt;\n&lt;p&gt;Бағалаудан бөлек, интерпретация да маңызды: AI Act-тің 86-бабына сәйкес, пайдаланушылар шешімдер үшін түсініктеме алуға құқылы. Дәстүрлі әдістер бейтараптықтың сандық көрсеткіштерін береді, бірақ дискриминациялық мінез-құлықты түсіндірмейді. Авторлар «бейтараптық зондтарын» (bias probes) ұсынады — бұл қорғалған топтар арасындағы айырмашылықтарды анықтайтын құрылымдық функционалдар. Бұл интерпретация кепілдіктерімен әділдік аудитін ресмилендірген алғашқы жұмыс. Сондай-ақ қауіпсіздік мәселесі де өзекті: аудит процесінде модель құпиялылығын қалай сақтау және бейтараптықты жасыруға тырысатын (adversarial) модель иелеріне қарсы қалай күресу керек?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Классикалық деректерге бағытталған шабуылдардан айырмашылығы, мұнда модель иесі аудитор бейтараптықты анықтамауы үшін жүйе мінез-құлқын әдейі өзгертуі мүмкін жағдай қарастырылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұсынылған тәсіл аясында әділдік талаптарын ескеретін күшті қарсыластың (fairness-aware adversary) бар болуы болжанады. Мұндай қарсылас топтар арасындағы алшақтықты жасыру үшін өз жауаптарын стратегиялық түрде өзгертуге қабілетті. Жинақталған өзара әрекеттесу тарихына &lt;span class=\"yfm-latex\" data-content=\"%7B(q_1%2C%20M_1)%2C%20%5Cdots%2C%20(q_%7Bt%2B1%7D%2C%20M_%7Bt%2B1%7D)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; сүйене отырып, мұндағы q — сұраныс, ал M — модель жауабы, аудитор тексерілетін қасиеттің &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Cmu%7D_%7Bt%2B1%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; бағасын қалыптастырады. Сонымен қатар, алгоритм талданатын жүйе қорғалатын топтарға қатысты ең айқын бейімділік пен кемсітушілікті көрсететін кіріс кеңістігінің нақты аймақтарын анықтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қауіп-қатер моделі кемсітушілікті жасыру үшін «қара жәшік» шығыстарын бейімдей алатын белсенді қарсыласты қамтиды, бұл бағалау тапсырмасын күрделендіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыс көптопты әділдік (multi-group fairness) контекстінде көрсетілген қиындықтарды шешуге бағытталған. Авторлар аудитор белгіленбеген деректер қорынан мұқият таңдалған кіріс деректерін пайдалана отырып, «қара жәшік» моделіне сұраныс жіберетін интерактивті аудит фреймворкін қарастырады. Бұл тәсіл бағаланатын алгоритмнің ішкі архитектурасына немесе салмақтарына толық қол жеткізбей-ақ тексеру жүргізуге мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Қара жәшікті» интерактивті аудит — зерттеушілер бастапқы кодқа кірмей-ақ, тек ойластырылған сұраныстар жіберу және соңғы жауаптарды талдау арқылы алгоритмнің әділдігін бағалайтын тексеру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдістің негізгі ерекшелігі — нысаналы модельдің өзін толық қалпына келтіруге тырысудың орнына, қорғалатын топтар арасындағы модельдің кемсітушілік мінез-құлқын қамтитын салыстырмалы функционалдарды (comparison functionals) үйретуде. Мәселені мұндай қою жоғары статистикалық тиімділік пен нәтижелердің түсініктілігін қамтамасыз етеді. Бұдан бөлек, ол аудиторға ашылатын ақпарат көлемін табиғи түрде шектейді, бұл модель иесін зияткерлік меншікті көшіріп алуға бағытталған шабуылдардан (reconstruction attacks) қорғайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельді қалпына келтірудің орнына салыстырмалы функционалдарды бағалау көптопты әділдікті дәл аудиттеуді қамтамасыз етеді және алгоритмді рұқсатсыз көшіруден қорғайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khatysty-zhumystar\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#khatysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қатысты жұмыстар&lt;/span&gt;&lt;/a&gt;Қатысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;Әділдік аудиті. Алгоритмдік әділдікті зерттеу екі бағытта жүреді: шектелген оңтайландыру арқылы әділ модельдерді оқыту және қолжетімділігі шектеулі модельдерге аудит жүргізу. Қолданыстағы аудит әдістері көбінесе модельді толық қалпына келтіруге негізделеді, бұл көптеген есептеу ресурстарын талап етеді. Біздің тәсіліміз аудитті қасиеттерді бағалау мәселесі ретінде қарастырады және модельді толық қалпына келтіруден гөрі, топтар арасындағы салыстырулардың комбинаторлық құрылымына назар аударады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біз әділдікті модельді толық қалпына келтірмей, топтараралық айырмашылықтардың құрылымын талдау арқылы бағалауды ұсынамыз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Интерпретация және зондтау әдістері. Интерпретация әдістері (белгілерді атрибуциялау, контрфактуалды түсіндірмелер) модельдің мінез-құлқы туралы сипаттамалық түйіндеме береді. Зондтау (probing) әдістері қарапайым модельдер арқылы үйретілген өкілдіктерден қасиеттерді бөліп алады. Біздің «ығысу зондтары» (bias probes) түсінігі осыған жақын, бірақ олар қорғалған топтар арасындағы қатынастық айырмашылықтарды анықтауға бағытталған және статистикалық кепілдіктермен қамтамасыз етілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зондтау (probing) — бұл нейрондық желілерді талдау әдісі, мұнда негізгі модельдің белгілі бір заңдылықтарды үйренгенін тексеру үшін оның үстіне қарапайым модель орнатылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Белсенді оқыту және келіспеушілікке негізделген күрделілік. Классикалық белсенді оқыту күрделілікті бағалау үшін геометриялық параметрлерді (келіспеушілік коэффициенті, жұлдыздар саны) пайдаланады. Біз бұл тәсілді бейімдеп, «топаралық жұлдыздар саны» (intergroup star number) түсінігін енгіземіз. Бұл параметр кіші топтар арасындағы конфигурацияларды оқшаулау қабілетін өлшейді және таңдама тиімділігін анықтайды.&lt;/p&gt;\n&lt;p&gt;Артықшылықтарды оқыту. Элементтерді рейтингтеуден айырмашылығы, біз салыстыру функционалдарының класын оқытамыз. Бұл «қара жәшік» моделінің дискриминациялық мінез-құлқын бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Модельді шығарып алу шабуылдары. «Model extraction» шабуылдары API арқылы модель функционалдығын қайталауға мүмкіндік береді. Біз бұл тәуекелдерді ескереміз: біздің аудит механизмдеріміз ақпараттың ашылу көлемін әдейі шектейді, бұл біздің зондтардан модельді қалпына келтіруді есептеу тұрғысынан қиын міндетке айналдырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біздің зондтар арқылы модельді қалпына келтіру қиындатылған, бұл API арқылы аудит жүргізу кезінде қауіпсіздікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aedildikti-auditteuge-arnalghan-salystyrmaly-negiz\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#aedildikti-auditteuge-arnalghan-salystyrmaly-negiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әділдікті аудиттеуге арналған салыстырмалы негіз&lt;/span&gt;&lt;/a&gt;Әділдікті аудиттеуге арналған салыстырмалы негіз&lt;/h4&gt;\n&lt;p&gt;Біз «ығысуды зондтау» (bias probes) негізіндегі жаңа әдісті ұсынамыз. Ол топтарды құрылымдық салыстыру арқылы модельдің кемсітушілік мінез-құлқын тіркейді. Әділдік аудиті салыстыру функционалдарын оқыту мәселесі ретінде ресімделеді және деректердің таралуына тәуелсіз көп топтық әділдікті бағалау кепілдіктері орнатылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс деректердің нақты таралуына байланысты болмай, бір уақытта көптеген топтар үшін модель әділдігін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kuerdelilikting-zhanga-oelshemi-zhaene-suranystardyng-ongtajly-shekaralary\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#kuerdelilikting-zhanga-oelshemi-zhaene-suranystardyng-ongtajly-shekaralary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Күрделіліктің жаңа өлшемі және сұраныстардың оңтайлы шекаралары&lt;/span&gt;&lt;/a&gt;Күрделіліктің жаңа өлшемі және сұраныстардың оңтайлы шекаралары&lt;/h4&gt;\n&lt;p&gt;Біз көп топтық сценарийлер үшін классикалық жұлдыз санын кеңейтетін «k-топаралық жұлдыз саны» s_k ұғымын енгіземіз. Аудит сұраныстарының күрделілігін осы параметр арқылы анықтап, &lt;span class=\"yfm-latex\" data-content=\"%5COmega%20%5Cleft(%20%5Cmax%20%5Cleft(%20n%5E%7B1-2%5Cdelta%7D%2C%20%5Cfrac%7B1%7D%7B%5Cepsilon%5E2%7D%20%5Cright)%20%5Cright)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; төменгі шекарасын дәлелдейміз. Сондай-ақ, Daniely-Shwartz DS_k өлшемін ескере отырып, &lt;span class=\"yfm-latex\" data-content=\"O(%5Cdots)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; жоғарғы шекарасына жететін k-ALeBi белсенді алгоритмі ұсынылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Daniely-Shwartz өлшемі — бұл модельдің қаншалықты күрделі функцияны үйрене алатынын анықтайтын «сыйымдылық» көрсеткіші.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modeldi-shygharyp-aludyng-khiyndyghy-zhaene-manipulyaciya-kezindegi-audit\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#modeldi-shygharyp-aludyng-khiyndyghy-zhaene-manipulyaciya-kezindegi-audit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельді шығарып алудың қиындығы және манипуляция кезіндегі аудит&lt;/span&gt;&lt;/a&gt;Модельді шығарып алудың қиындығы және манипуляция кезіндегі аудит&lt;/h4&gt;\n&lt;p&gt;Біз нақты аудитті бастапқы классификаторды қалпына келтіруден ажыратамыз: барлық үміткер модельдерді сәйкестендіру үшін реляциялық сұраныстар жиынтығын таңдау NP-толық мәселе екенін көрсетеміз. Модель иесі жауаптарды манипуляциялай алатын жағдайда (p &amp;lt; 1/2 бұрмалау деңгейінде), Robust k-ALeBi алгоритмі ұсынылады. Эмпирикалық бағалау біздің тәсілімізді ReconAudit және DirectAudit әдістерімен дәлдік, түсініктілік және шабуылдарға төзімділік бойынша салыстырады.&lt;/p&gt;\n&lt;h4 id=\"maeseleni-tuzhyrymdau-koep-toptykh-aedildik-auditi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#maeseleni-tuzhyrymdau-koep-toptykh-aedildik-auditi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мәселені тұжырымдау: көп топтық әділдік аудиті&lt;/span&gt;&lt;/a&gt;Мәселені тұжырымдау: көп топтық әділдік аудиті&lt;/h4&gt;\n&lt;p&gt;H — гипотезалар класы, ал h моделі Z кеңістігін  ildeY-ға бейнелейді. Кіріс деректері p қорғалмаған белгіден және Z-ті k кіші топқа &lt;span class=\"yfm-latex\" data-content=\"Z_1%2C%20%5Cdots%2C%20Z_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; бөлетін бір қорғалған A атрибутынан тұрады. Әділдіктің бұзылуы топтар жұптары арасындағы статистикалық паритеттегі максималды айырмашылық ретінде анықталады: &lt;span class=\"yfm-latex\" data-content=\"%5Cmu_%7Bi%2Cj%7D(D%2C%20h)%20%3D%20%5Cmathbb%7BE%7D_%7BX%5Csim%20D%7D%5Bh(X)%20%2F%20X%5Cin%20Z_i%5D%20-%20%5Cmathbb%7BE%7D_%7BX%5Csim%20D%7D%5Bh(X)%20%2F%20X%5Cin%20Z_j%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;µ-ді бағалау D деректер таралуына қолжетімділікті талап етеді; егер Z-тің кейбір аймақтарында ықтималдық өте төмен болса, олар әділдіктің қорытынды бағасына аз әсер етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Аудитор A модель иесі M-мен өзара әрекеттесіп, µ қасиетін бағалау үшін сұраныстар жібереді. Алдыңғы жұмыстардан айырмашылығы, біздің анықтамамыз айырмашылықтың таңбасын ескереді, бұл қай топтың қолайсыз жағдайда екенін түсіну үшін маңызды.&lt;/p&gt;\n&lt;h4 id=\"modeldi-khajta-khuru-arkhyly-audit\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#modeldi-khajta-khuru-arkhyly-audit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельді қайта құру арқылы аудит&lt;/span&gt;&lt;/a&gt;Модельді қайта құру арқылы аудит&lt;/h4&gt;\n&lt;p&gt;Бұл сценарийде аудитор гипотезалар класына H және модельге h сұрау жіберу мүмкіндігіне ие. Мақсат — H ішіндегі оқыту процесін эмуляциялау арқылы суррогаттық модельді қалпына келтіру. Мысалы, бұрын келіспеушілік сұрауларын (disagreement queries) пайдаланып, белгіленбеген деректер жиынында бірдей статистикалық паритетке ие H ішкі класын анықтау әдісі ұсынылған болатын.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ReconAudit әдісі итеративті сұраулар арқылы суррогаттық модельді қалпына келтіреді, бұл &lt;span class=\"yfm-latex\" data-content=\"O(d%2F%5Cepsilon%5E2%20%5Clog%201%2F%5Cdelta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; үлгілік күрделілікті талап етеді, мұндағы d — VC өлшемі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ReconAudit өзара әрекеттесу хаттамасы келесідей: аудитор Q қорына және T сұрау бюджетіне ие болады. Әрбір t раундта аудитор ағымдағы V_t гипотезалар класының келіспеушілік аймағынан X_t сұрауын таңдайды, оны модель иесіне жібереді және h(X_t) жауабын алады. T раундтан кейін аудитор суррогат жасау үшін &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7Bh%7D%20%5Cin%20V_T\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; таңдайды және әділдікті тексеру үшін бағалаушыны қолданады. Бұл тәсілдің негізгі мәселесі — H класының күрделілігіне байланысты жоғары үлгілік күрделілік, бұл модельді шығарып алу (model extraction) қаупін тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VC-өлшемі (Vapnik-Chervonenkis dimension) — статистикалық модельдің сыйымдылығының (күрделілігінің) өлшемі, ол модельдің қаншалықты күрделі заңдылықтарды үйрене алатынын анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ReconAudit оқыту процесінде қорғалған топтарға жататындықты ескермейді, бұл әртүрлі топтар үшін біркелкі емес реконструкция қателеріне әкелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tikelej-baghalau-arkhyly-audit\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#tikelej-baghalau-arkhyly-audit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тікелей бағалау арқылы аудит&lt;/span&gt;&lt;/a&gt;Тікелей бағалау арқылы аудит&lt;/h4&gt;\n&lt;p&gt;Бұл тәсілде аудитор P қорындағы әрбір топтан &lt;span class=\"yfm-latex\" data-content=\"O(1%2F%5Cepsilon%5E2%20%5Clog%201%2F%5Cmu)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; үлгілер алады және модельді қалпына келтірместен, тікелей µ мақсатты қасиетін бағалайды. Үлгілік күрделілік мұнда k топтар санына байланысты, бірақ H класының күрделілігіне тәуелді емес.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DirectAudit әділдікті топтарға тікелей сұраулар жіберу арқылы бағалайды, бұл модель реконструкциясына байланысты тәуекелдерді болдырмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DirectAudit хаттамасы келесідей жұмыс істейді: әрбір i тобы үшін аудитор Q-дан үлгілер алады және модель жауаптарын сұрайды. T раундтан кейін барлық топтар үшін жұптық айырмашылықтар бағаланады және O(k²) өлшемді вектор құрылады. Бұл вектордың максималды мәні әділдік бағасы ретінде қабылданады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тікелей бағалау (direct estimation) — жүйенің ішкі логикасын немесе құрылымын толық қалпына келтіруге тырыспастан, жүйе параметрінің мәнін алуға мүмкіндік беретін статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель реконструкциясы модельді жаңартуға тікелей бағалауға қарағанда қатаң шектеулер қояды, өйткені ол суррогаттың түпнұсқаға тек әділдік көрсеткіші бойынша емес, сонымен қатар үлкен деректер жиынында сәйкес келуін талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rekonstrukciyasyz-zhaene-interpretaciyalanatyn-audit\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#rekonstrukciyasyz-zhaene-interpretaciyalanatyn-audit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реконструкциясыз және интерпретацияланатын аудит&lt;/span&gt;&lt;/a&gt;Реконструкциясыз және интерпретацияланатын аудит&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде біз кіріс деректерінен ақпаратты тікелей алудың орнына, қорғалған топтардың өнім кеңістігінде (&lt;span class=\"yfm-latex\" data-content=\"X%20%3D%20%5Cprod_%7Bi%3D1%7D%5Ek%20Z_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) жұмыс істейтін аудит жүйесін ұсынамыз. Әрбір &lt;span class=\"yfm-latex\" data-content=\"x%20%3D%20(x_1%2C%20%5Cdots%2C%20x_k)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; элементі әр топтан бір үлгіні қамтиды. Бұл тәсіл аудитті тек әділдік қасиетіне бағыттауға және модельді қайта құру (реконструкциялау) қаупін азайтуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аудит топтарды салыстыру деңгейіне ауыстырылды: модельдің абсолютті болжамдарының орнына аудитор тек топтар арасындағы айырмашылықтар туралы деректерді алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз F_k(H) функциялар класын енгіземіз, мұнда M_k операторы h модель болжамдарын жұптық салыстыруларға түрлендіреді: f_h(x) = (h(x_i) - h(x_j))1 ≤ i &amp;lt; j ≤ k. Аудитор құрылымдалған X сұранысын жібереді, ал модель оракулы I_M(X) тек топтар арасындағы салыстырмалы алшақтықтарды қайтарады, абсолютті болжамдарды жасырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оракул — бұл аудитор модельдің ішкі параметрлеріне кірмей, тек белгіленген интерфейс арқылы жауап алатын жүйе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bajlanys-zhaene-tangdama-invarianttylyghy\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#bajlanys-zhaene-tangdama-invarianttylyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланыс және таңдама инварианттылығы&lt;/span&gt;&lt;/a&gt;Байланыс және таңдама инварианттылығы&lt;/h4&gt;\n&lt;p&gt;Біз сұраныстарды қалыптастыруда таңдалған байланыс (coupling) стратегиясы µ әділдік бағасына әсер етпейтінін дәлелдедік. 3.1-ұсынысқа сәйкес, әділдікті &lt;span class=\"yfm-latex\" data-content=\"%5Cmu(h%2C%20D)%20%3D%20%5C%2F%5Cmathbb%7BE%7D_%7BX%20%5Csim%20%0Au%7D%5Bf_h(X)%5D%5C%2F_%7B%5Cinfty%7D%20%D1%80%D0%B5%D1%82%D1%96%D0%BD%D0%B4%D0%B5%20%D0%B5%D1%81%D0%B5%D0%BF%D1%82%D0%B5%D1%83%D0%B3%D0%B5%20%D0%B1%D0%BE%D0%BB%D0%B0%D0%B4%D1%8B%2C%20%D0%BC%D2%B1%D0%BD%D0%B4%D0%B0%D2%93%D1%8B%20%0Au\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — өнім кеңістігіндегі кез келген ықтималдық өлшемі. Бұл аудит үшін топтар арасындағы бірлескен үлестірімді модельдеудің қажеті жоқ екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл әдіс аудитордың топтарды салыстыру үшін кортеждер қалыптастыра алатын белгіленбеген деректер жиынына қол жеткізе алатынын болжайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осылайша, аудит міндеті модельді реконструкциялаудан X кеңістігінде анықталған функционалдық отбасын бағалауға ауысады. Бұл біздің әдісімізді реконструкцияға негізделген тәсілдерден түбегейлі ерекшелендіреді, өйткені аудитор модельдің топтар арасындағы қатынастық құрылымын тікелей тексереді.&lt;/p&gt;\n&lt;h4 id=\"smeshenie-zondtary-arkhyly-tuesindiriletin-auditter\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#smeshenie-zondtary-arkhyly-tuesindiriletin-auditter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Смещение зондтары арқылы түсіндірілетін аудиттер&lt;/span&gt;&lt;/a&gt;Смещение зондтары арқылы түсіндірілетін аудиттер&lt;/h4&gt;\n&lt;p&gt;Модельдің мінез-құлқын түсіну үшін біз «смещение зондтарын» (bias probes) қолданамыз, олар қорғалған топтар арасындағы салыстырмалы айырмашылықтарды локализациялауға мүмкіндік береді. Жаһандық зонд f топтар арасындағы болжамдардың жалпы айырмашылығын бағалайды. Белгілер бойынша зондтар (feature-wise bias profiles) eq,i,j(z) модельдің күтілетін реакциясы қорғалмаған белгі q (мысалы, кіріс немесе жас) негізінде қалай өзгеретінін көрсетеді. Смещение шамасы ef_q(z) осы айырмашылықтың абсолюттік мәнін есептеп, модельдің ең көп бұрмалаушылық көрсететін аймақтарын анықтауға көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Смещение зондтары кемсітушіліктің бар екенін тіркеп қана қоймай, оны нақты белгілер бойынша локализациялауға және теңсіздік ең жоғары болатын деректер аймақтарын анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Смещение зонды — бұл модель жауаптарындағы айырмашылықты өлшейтін математикалық құрал, ол тек қорғалған топқа (мысалы, жынысы) жататындығымен ерекшеленетін, бірақ басқа белгілері бірдей сұраулар үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кредиттік скоринг мысалын қарастырайық: h моделі несие беру немесе бермеуді шешеді. Аудитор әртүрлі топтардан Q=(X₁, X₂) сұрау жұптарын жібереді. Зонд f1,2(Q) = h(X₁) - h(X₂) мәндері &lt;span class=\"yfm-latex\" data-content=\"%5C%7B-1%2C%200%2C%20%2B1%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; болуы мүмкін. Осы жауапты белгілер (кіріс, жас) призмасы арқылы талдай отырып, аудитор үш деңгейлі есеп алады: жаһандық теңсіздік көрсеткіші, белгі бойынша ауытқу профилі (бағыты мен күші) және ауытқу шамасы (тек күші). Маңызды: бұл көрсеткіштер себеп-салдарлық байланысты немесе белгілердің маңыздылығын бағалау емес, тек модельдің бақыланатын мінез-құлқын сипаттайды.&lt;/p&gt;\n&lt;h4 id=\"tuesindiriletin-belsendi-audit\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#tuesindiriletin-belsendi-audit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түсіндірілетін белсенді аудит&lt;/span&gt;&lt;/a&gt;Түсіндірілетін белсенді аудит&lt;/h4&gt;\n&lt;p&gt;Біз аудит процесін салыстыру функциясын f_h үйрену міндеті ретінде ресімдейміз. Егер m сұраудан тұратын &lt;span class=\"yfm-latex\" data-content=\"Q_1%2C%20%5Cdots%2C%20Q_m\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; таңдамасы негізінде &lt;span class=\"yfm-latex\" data-content=\"E_D(f)%20%3D%20P_%7BX%20%5Csim%20D%5Ek%7D%20%5Bf(X)%20%0Aeq%20f_h(X)%5D%20%D1%82%D3%99%D1%83%D0%B5%D0%BA%D0%B5%D0%BB%D1%96%D0%BD%20%D0%B0%D0%B7%D0%B0%D0%B9%D1%82%D0%B0%D1%82%D1%8B%D0%BD%20%5Chat%7Bf%7D_m%20%D0%B1%D0%B0%D2%93%D0%B0%D1%81%D1%8B%D0%BD%20%D2%9B%D2%B1%D1%80%D0%B0%D1%82%D1%8B%D0%BD%20A_m%20%D0%B0%D0%BB%D0%B3%D0%BE%D1%80%D0%B8%D1%82%D0%BC%D1%96%20%D0%B1%D0%B0%D1%80%20%D0%B1%D0%BE%D0%BB%D1%81%D0%B0%2C%20%D0%B1%D0%B5%D0%BB%D1%81%D0%B5%D0%BD%D0%B4%D1%96%20%D0%B0%D1%83%D0%B4%D0%B8%D1%82%20%D2%AF%D0%B9%D1%80%D0%B5%D0%BD%D1%83%D0%B3%D0%B5%20%D0%B6%D0%B0%D1%80%D0%B0%D0%BC%D0%B4%D1%8B%20%D0%B4%D0%B5%D0%BF%20%D1%81%D0%B0%D0%BD%D0%B0%D0%BB%D0%B0%D0%B4%D1%8B.%20%D0%A2%D0%B0%D2%A3%D0%B4%D0%B0%D0%BC%D0%B0%D0%BD%D1%8B%D2%A3%20%D0%BC%D0%B8%D0%BD%D0%B8%D0%BC%D0%B0%D0%BA%D1%81%D1%82%D1%8B%D2%9B%20%D0%BA%D2%AF%D1%80%D0%B4%D0%B5%D0%BB%D1%96%D0%BB%D1%96%D0%B3%D1%96%20%5Cvarepsilon%20%D0%B4%D3%99%D0%BB%D0%B4%D1%96%D0%BA%D0%BA%D0%B5%201-%5Cdelta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; сенімділік ықтималдығымен жету үшін қажетті минималды сұраулар санын анықтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл модель аудитор сұраулар жұбын алдын ала таңдайды (қатаң байланыс) деп болжайды, бұл статистикалық тәжірибені жеңілдетеді, бірақ аудит процесінде сұраулардың таралуын икемді өзгерту мүмкіндігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zondtardy-okhytudyng-akhparattykh-kuerdeliligi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#zondtardy-okhytudyng-akhparattykh-kuerdeliligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зондтарды оқытудың ақпараттық күрделілігі&lt;/span&gt;&lt;/a&gt;Зондтарды оқытудың ақпараттық күрделілігі&lt;/h4&gt;\n&lt;p&gt;Көп топтық әділдік аудитін бағалау үшін біз Дэниели-Шварц (DS) өлшемін қолданамыз. Ол «псевдо-куб» ұғымына негізделген: векторлар жиыны, мұнда әр элемент тек бір позицияда ерекшеленетін «i-көршіге» ие. F_k функциялар класы S тізбегін солай бөледі, нәтижесінде функциялар мәндерінің жиыны m-өлшемді псевдо-кубты қамтиды. DS_k(F) — бұл бөлудің максималды өлшемі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DS-өлшемі зондтарды оқыту шегін анықтайды: егер ол шексіз болса, пассивті оқыту мүмкін емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Стандартты оқытудан айырмашылығы, мұнда келіспеушілік аймағы (disagreement set) белгілердің белгісіздігін емес, қорғалған топтар арасындағы салыстырмалы белгісіздікті кодтайды. Біз «мульти-жұлдыз саны» (s_k) ұғымын енгіземіз — бұл m-нің сондай максималды мәні, мұнда X_i нүктелері мен f₀, f_i функциялары бар, олардың келіспеушілік аймағы дәл бір X_i нүктесінен тұрады. s_k-ның шектілігі зондтарды белсенді оқыту үшін қажетті және жеткілікті шарт екені дәлелденген.&lt;/p&gt;\n&lt;h4 id=\"rekonstrukciya-men-zondtykh-auditting-akhparattykh-teoriyalykh-boelinui\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#rekonstrukciya-men-zondtykh-auditting-akhparattykh-teoriyalykh-boelinui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реконструкция мен зондтық аудиттің ақпараттық-теориялық бөлінуі&lt;/span&gt;&lt;/a&gt;Реконструкция мен зондтық аудиттің ақпараттық-теориялық бөлінуі&lt;/h4&gt;\n&lt;p&gt;Сызықтық классификаторлар үшін «жұлдыз саны» шектелмегені белгілі, бұл модельді реконструкциялау арқылы белсенді аудитті тиімсіз және қауіпті етеді (модельдің ағып кетуі мүмкін). 3.2-ұсыныс зондтарды оқыту (bias probing) арқылы аудит бұл кедергіден қашатынын көрсетеді, себебі ол бүкіл модельді қалпына келтіруге емес, нақты қасиеттерге бағытталған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зондтық аудит шекті s_k күрделілігіне ие, ал реконструкция шексіз комбинаторлық күрделілікке тап болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"manipulyaciyasyz-rezhim\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#manipulyaciyasyz-rezhim\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Манипуляциясыз режим&lt;/span&gt;&lt;/a&gt;Манипуляциясыз режим&lt;/h4&gt;\n&lt;p&gt;Біз модель иесі бейтараптықты жасыруға тырыспайтын сценарийді қарастырамыз. 3.1-теорема таңдама күрделілігінің төменгі шегін белгілейді. m сұраныс жіберетін кез келген белсенді аудитор үшін сондай D үлестірімі мен f_h^* мақсатты функциясы бар, мұнда қателік ықтималдығы ε-нан асады. Бұл салыстыру функционалдарын қолдану статистикалық күрделілікті жоймайтынын, оны F салыстыру класының геометриясына ауыстыратынын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3.1-теорема тіпті белсенді аудитте де таңдама күрделілігі s_k және DS_k құрылымдық параметрлерімен шектелгенін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modeldi-shygharyp-alu-shabuyldarynyng-kuerdeliligi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#modeldi-shygharyp-alu-shabuyldarynyng-kuerdeliligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельді шығарып алу шабуылдарының күрделілігі&lt;/span&gt;&lt;/a&gt;Модельді шығарып алу шабуылдарының күрделілігі&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде M базалық моделін есептеу және ақпараттық-теориялық тұрғыдан шығарып алудың күрделілігі қарастырылады.&lt;/p&gt;\n&lt;p&gt;Есептеу күрделілігі. Авторлар ығысу зондтары (bias probes) негізінде модельді шығарып алу есептеу тұрғысынан қиын міндет екенін көрсетеді. Аудит процедурасы интерактивті хаттаманы қамтиды, онда аудитор модель иесімен B мөлшеріндегі топтық сұраулар (CGQ) арқылы өзара әрекеттеседі. Міндет B-шектелген реляциялық шығарып алу ретінде ресімделеді, мұндағы мақсат — H₀ ақырлы гипотезалар класынан белгісіз гипотезаны бірмәнді анықтауға мүмкіндік беретін сұраулар жиынын табу. 3.2-теорема модельді «қара жәшік» арқылы қалпына келтіру NP-қиын міндет екенін анықтайды. Бұл кедергі тудырады: ығысу зондтары топтық әділдік сияқты қасиеттерді бағалауға мүмкіндік берсе де, олар модельдің өзін тиімді реконструкциялау үшін жеткілікті ақпарат бермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ығысу зондтары сұраулары негізінде бастапқы модельді қалпына келтіру NP-қиын міндет болып табылады, бұл әмбебап реконструкцияны іс жүзінде мүмкін емес етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ақпараттық-теориялық күрделілік. Мұнда авторлар аудит барысында модель иесінің жеке басы туралы қанша ақпарат ашылатынын сандық бағалайды. H гипотезалар жиынында біркелкі априорлық үлестірім болғанда, аудит басталғанға дейінгі белгісіздік &lt;span class=\"yfm-latex\" data-content=\"eI_0%20%3D%20%5Clog_2%20%2FH%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; битті құрайды. t өзара әрекеттесуден кейін гипотезалар жиыны V_t дейін қысқарғанда, жеке бастың ашылуы (identity leakage) &lt;span class=\"yfm-latex\" data-content=\"I_t%20%3D%20%5Clog_2%20(%2FH%2F%20%2F%20%2FV_t%2F)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ретінде анықталады. Мысалы, гипотезалар кеңістігі 1000-нан 20-ға дейін қысқарғанда, ақпараттың ағып кетуі шамамен 5,64 битті құрайды.&lt;/p&gt;\n&lt;h4 id=\"algoritm-dizajny-k-alebi-zhaene-zhogharghy-shekaralar\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#algoritm-dizajny-k-alebi-zhaene-zhogharghy-shekaralar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алгоритм дизайны: k-ALeBi және жоғарғы шекаралар&lt;/span&gt;&lt;/a&gt;Алгоритм дизайны: k-ALeBi және жоғарғы шекаралар&lt;/h4&gt;\n&lt;p&gt;k-ALeBi (Active Learning for Bias) алгоритмі нұсқалар кеңістігін V_t нақтылау үшін итеративті процесті пайдаланады. Әрбір t қадамында алгоритм &lt;span class=\"yfm-latex\" data-content=\"%0Au%20%D2%AF%D0%BB%D0%B5%D1%81%D1%82%D1%96%D1%80%D1%96%D0%BC%D1%96%D0%BD%D0%B5%D0%BD%20%D1%81%D2%B1%D1%80%D0%B0%D1%83%D0%BB%D0%B0%D1%80%D0%B4%D1%8B%20%D1%82%D0%B0%D2%A3%D0%B4%D0%B0%D0%B9%D0%B4%D1%8B.%20%D0%95%D0%B3%D0%B5%D1%80%20%D1%81%D2%B1%D1%80%D0%B0%D1%83%20%D0%B1%D0%B5%D0%BB%D0%B3%D1%96%D1%81%D1%96%D0%B7%D0%B4%D1%96%D0%BA%20%D0%B0%D0%B9%D0%BC%D0%B0%D2%93%D1%8B%D0%BD%D0%B0%20(disagreement%20set)%20%D1%82%D2%AF%D1%81%D1%81%D0%B5%2C%20%D0%BE%D0%BB%20M_k%20%D0%BE%D1%80%D0%B0%D0%BA%D1%83%D0%BB%D1%8B%D0%BD%D0%B0%20%D0%B6%D1%96%D0%B1%D0%B5%D1%80%D1%96%D0%BB%D0%B5%D0%B4%D1%96%20%D0%B6%D3%99%D0%BD%D0%B5%20%D0%B0%D0%BB%D1%8B%D0%BD%D2%93%D0%B0%D0%BD%20Y%5E%7B(t)%7D%20%5Cin%20%5C%7B-1%2C%200%2C%201%5C%7D%5E%7B(k%5E2)%7D%20%D0%B6%D0%B0%D1%83%D0%B0%D0%B1%D1%8B%20%D0%BD%D0%B5%D0%B3%D1%96%D0%B7%D1%96%D0%BD%D0%B4%D0%B5%20%D0%BD%D2%B1%D1%81%D2%9B%D0%B0%D0%BB%D0%B0%D1%80%20%D0%BA%D0%B5%D2%A3%D1%96%D1%81%D1%82%D1%96%D0%B3%D1%96%20%D0%B6%D0%B0%D2%A3%D0%B0%D1%80%D1%82%D1%8B%D0%BB%D0%B0%D0%B4%D1%8B.%20%D2%9A%D0%BE%D1%80%D1%8B%D1%82%D1%8B%D0%BD%D0%B4%D1%8B%20%D0%B0%D1%83%D0%B4%D0%B8%D1%82%20%D0%B5%D1%81%D0%B5%D0%B1%D1%96%20%D0%B6%D0%B0%D2%BB%D0%B0%D0%BD%D0%B4%D1%8B%D2%9B%20%D1%8B%D2%93%D1%8B%D1%81%D1%83%20%D0%B7%D0%BE%D0%BD%D0%B4%D1%8B%D0%BD%20%5Chat%7Bf%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және жекелеген белгілер үшін бағалауларды қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PAC-оқыту (Probably Approximately Correct) — бұл алгоритмнің жоғары ықтималдықпен қателігі белгіленген ε шегінен аспайтын гипотезаны табуына кепілдік беретін теориялық модель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.3-теорема k-ALeBi-дің PAC-белсенді аудитор екенін дәлелдейді. Кемінде 1-δ ықтималдықпен ол &lt;span class=\"yfm-latex\" data-content=\"O(%5Cmin%20%5C%7Bn%2C%20(e-1)%20%5Cdots%20%5C%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; сұрауларды пайдаланып, қателігі ε-нан аспайтын нәтиже береді. Талдау көрсеткендей, белгілі бір шарттарда (мысалы, DS_k = O(1) болғанда) күрделіліктің жоғарғы және төменгі шекаралары логарифмдік көбейткіштер дәлдігімен сәйкес келеді. 3.1-салдар көп сыныпты F класы PAC-белсенді оқытылуы мүмкін екенін, тек егер көп жұлдызды сан s_k(F) &amp;lt; ∞ болғанда ғана көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"aedildikti-eskeretin-kharsylasu-rezhimi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#aedildikti-eskeretin-kharsylasu-rezhimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әділдікті ескеретін қарсыласу режимі&lt;/span&gt;&lt;/a&gt;Әділдікті ескеретін қарсыласу режимі&lt;/h4&gt;\n&lt;p&gt;Зерттеу топтар арасындағы теңсіздікті анықтауға тырысатын аудиторға қарсы тұратын бейімделгіш модель иесін қарастырады. Қорғаныс үшін Robust k-ALeBi алгоритмі ұсынылады. 3.1-болжам (Жергілікті репликацияланушылық) әрбір сұраныс үшін кемінде γ ықтималдық массасы бар J(X) аймағының болуын талап етеді, мұнда жауаптар &lt;span class=\"yfm-latex\" data-content=\"1-%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ықтималдықпен тұрақты (&lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3C%201%2F2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;). Бұл модель иесінің бұрмалау әрекеттеріне қарамастан, аудиторға сенімді деректер алуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Robust k-ALeBi алгоритмі сұраныстар аймағындағы жауаптарды жергілікті орташалау арқылы модель иесінің бұрмаланған жауаптарының әсерін азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aedildikti-eskeretin-bejimdelgish-kharsylas-algoritm-zhaene-zhogharghy-shekter\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#aedildikti-eskeretin-bejimdelgish-kharsylas-algoritm-zhaene-zhogharghy-shekter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әділдікті ескеретін бейімделгіш қарсылас: алгоритм және жоғарғы шектер&lt;/span&gt;&lt;/a&gt;Әділдікті ескеретін бейімделгіш қарсылас: алгоритм және жоғарғы шектер&lt;/h4&gt;\n&lt;p&gt;Шартты ықтималдық шабуылы түсінігі (3.8-анықтама) енгізіледі, мұнда жауапты бұрмалау ықтималдығы A_r=1 p &amp;lt; 1/2 мәнімен шектелген. 4-алгоритм (Robust k-ALeBi) J(X_t) аймағынан R тәуелсіз таңдама алу үшін LocalLabel кіші бағдарламасын пайдаланады. Қорытынды жауап алынған белгілер арасындағы ең жиі кездесетін мән ретінде анықталады. &lt;span class=\"yfm-latex\" data-content=\"%5Cbeta%20%3D%20p%20%2B%20%5Crho%20-%20p%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; параметрі жергілікті тұрақсыздық пен қасақана бұрмалаудан туындаған қателерді біріктіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Режективті таңдама алу (rejection sampling) әдісі белгіленбеген деректер жиынына қайта-қайта жүгіну арқылы J(X) нысаналы аймағынан таңдамалар алу үшін қолданылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.4-теорема Robust k-ALeBi-дің PAC-белсенді аудитор екенін растайды. Таңдама алу күрделілігі (1-2β)⁻² шамасына пропорционал артады, бұл модель иесінің манипуляцияларын өтеу үшін қосымша сұраныстардың қажеттілігін білдіреді. Егер ақпараттық аймақтың ықтималдық массасы γ аз болса, аудиторға жеткілікті деректер жинау үшін көбірек әрекет қажет болады. Бұл тәсіл модель кластарының тұрақтылығын (мысалы, Вапник-Червоненкис өлшемі) пайдаланады.&lt;/p&gt;\n&lt;h4 id=\"zhahandykh-akhparattykh-teoriyalykh-khiyndykh\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#zhahandykh-akhparattykh-teoriyalykh-khiyndykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жаһандық ақпараттық-теориялық қиындық&lt;/span&gt;&lt;/a&gt;Жаһандық ақпараттық-теориялық қиындық&lt;/h4&gt;\n&lt;p&gt;Стандартты «жұлдыз саны» (starnumber) анықтамасы көп топтық әділдікті (multi-group fairness) бағалау үшін төменгі шекараны әрқашан нақты анықтай алмайды. Әртүрлі зонд функциялары барлық k топ жұптары үшін бірдей статистикалық паритетті көрсетсе де, олар айтарлықтай өзгешеленуі мүмкін. Осы күрделілікті қамту үшін «әділдік бойынша тиімді жұлдыз саны» µ(F) ұғымы енгізілді. Бұл m бүтін сандарының супремумы, мұнда CGQ сұраулары мен F класындағы функциялар бар, олар зондтың әділ және әділетсіз күйлерді «жұлдыз жиынында» ажыратуына мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әділдік бойынша тиімді жұлдыз саны µ(F) әділдік көрсеткішіне &lt;a href=\"concepts/pryamoy-effekt.html\"&gt;тікелей әсер&lt;/a&gt; ететін айырмашылықтарға назар аударуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CGQ (Conditional Group Queries) — аудиторға модельдің әртүрлі топтар үшін белгілі бір жағдайлардағы мінез-құлқын тексеруге мүмкіндік беретін сұраулар түрі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ықтималдық шабуылдар кезінде әділдікті бағалау үшін «3.2-болжам» (&lt;a href=\"concepts/cell.html\"&gt;Cell&lt;/a&gt;-replicability) енгізілді. Ол h^* моделі сұраулар кеңістігінің белгілі бір өлшенетін ұяшықтарында жеткілікті тұрақты жұмыс істейтінін болжайды. Бұл аудиторға бір ұяшық ішіндегі бірнеше таңдаманы пайдаланып, модель реакциясын қайталауға мүмкіндік береді. 3.5-теоремаға сәйкес, p &amp;lt; 1/2 ықтималдығы бар шабуыл жағдайында зондты оқыту үшін &lt;span class=\"yfm-latex\" data-content=\"%5COmega(%5Cmin(s%5Cmu(F)%2C%201%2F%5Cepsilon))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; көлеміндегі сұраулар жиыны қажет.&lt;/p&gt;\n&lt;h4 id=\"eksperimentaldy-taldau\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#eksperimentaldy-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименталды талдау&lt;/span&gt;&lt;/a&gt;Эксперименталды талдау&lt;/h4&gt;\n&lt;p&gt;Фреймворк үш бағытта бағаланады: зонд дәлдігі, әділдікті бағалау және есептеу тиімділігі. Классификаторлар ретінде сызықтық модель, кездейсоқ орман (random forest) және көп қабатты перцептрон (MLP) қолданылған. Деректер жиыны модельге сұраулар жіберу арқылы қалыптастырылады. Зерттеу COMPAS (k=2), German Credit (k=4) және Student деректер жиындарында жүргізілген. Қайталау мүмкіндігін қамтамасыз ету үшін әрбір тәжірибе 10 кездейсоқ бастапқы мәнмен (seed) іске қосылған.&lt;/p&gt;\n&lt;h4 id=\"daeldik\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дәлдік&lt;/span&gt;&lt;/a&gt;Дәлдік&lt;/h4&gt;\n&lt;p&gt;k-ALeBi әдісі DirectAudit, ReconAudit және DiamAudit-пен салыстырылған. 4-суретте көрсетілгендей, 1000 сұраудан кейін k-ALeBi базалық әдістерге қарағанда айтарлықтай кішірек қателікті көрсетті. DiamAudit-пен салыстырғанда (k=2 және сызықтық гипотезалар класы), k-ALeBi жақсы нәтиже берді. COMPAS жиынында k-ALeBi қателігі 0,0000213-ті, ал DiamAudit-тікі 0,000046-ны құрады. Student жиынында k-ALeBi қателігі 0,006947-ге тең болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер нақты бенчмарктар негізінде алынған; әдістің тиімділігі модель архитектурасы мен деректердің таралуына байланысты өзгеруі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modeldi-shygharyp-alu-shabuyldarynan-khorghau\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#modeldi-shygharyp-alu-shabuyldarynan-khorghau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельді шығарып алу шабуылдарынан қорғау&lt;/span&gt;&lt;/a&gt;Модельді шығарып алу шабуылдарынан қорғау&lt;/h4&gt;\n&lt;p&gt;Зерттеу алгоритмдердің әділдігіне аудит жүргізу мен модельді қалпына келтіруге қажетті деректерді ашу арасындағы айырмашылықты қарастырады. Сұраулардың шектеулі бюджетінде Cross Group Queries (CGQ) әдісі модельдің дискриминативті мінез-құлқын сақтай отырып, әділдік бойынша дәл бағалауды қамтамасыз етеді. Бұл аудиттің пайдалылығы мен модельді сәйкестендіру арасындағы эмпирикалық бөлінуді көрсетеді: модельді реконструкциялау үшін қажетті жеке болжамдарды ашпай-ақ, әділдік туралы пайдалы ақпарат алуға болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;k-ALeBi әдісі ReconAudit-пен салыстырғанда модель сәйкестігі туралы деректердің таралуын айтарлықтай азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;9-суретте k-ALeBi мен ReconAudit үшін сәйкестіктің таралуы салыстырылады. ReconAudit модель белгілерін ашатын мүшелік сұрауларын пайдаланады, ал k-ALeBi жеке белгілерді тікелей ашпайтын реляциялық CGQ арқылы жұмыс істейді. Сәйкестіктің таралу өлшемі (3.7-анықтама) бойынша k-ALeBi аудит дәлдігін сақтай отырып, анағұрлым төмен көрсеткіштерді көрсетеді. 10-сурет k-ALeBi мен DiamAudit-ті салыстырады және k-ALeBi мүшелік сұрауларына негізделген шабуылдардан айырмашылығы, жеке болжамдарды ашпай-ақ CGQ арқылы пайдалы ақпарат беретінін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"aedildikti-eskeretin-kharsylas-shabuyldaryna-toezimdilik\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#aedildikti-eskeretin-kharsylas-shabuyldaryna-toezimdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әділдікті ескеретін қарсылас шабуылдарына төзімділік&lt;/span&gt;&lt;/a&gt;Әділдікті ескеретін қарсылас шабуылдарына төзімділік&lt;/h4&gt;\n&lt;p&gt;Авторлар Robust k-ALeBi-дің әділдік аудитін бұзуға бағытталған шабуылдарға төзімділігін бағалады. COMPAS-linear моделінде p=0.40 жоғары коррупция деңгейінде шабуылдаушы орташа есеппен 41,4 координаттық бұрмалауды енгізеді, оның ішінде сүзгіден өткеннен кейін тек 6,2-сі сұрауларға әсер етеді. Соған қарамастан, әділдікті бағалау қателігі 0,019-дан 0,021-ге дейін мардымсыз өседі, бес сынақ барысында деректерді жасыру жағдайы байқалмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректер коррупциясы — аудит алгоритмін алдау үшін сұрауларға қасақана шу немесе бұрмалаулар енгізу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Салыстыру үшін, шабуыл кезінде ReconAudit реконструкция қателігі 0-ден 0,074-ке дейін өседі, ал жасыру деңгейі 0,20-ға жетеді. Yan және Zhang (2022) базалық әдісі шабуылсыз 0,03 қателікті көрсетеді, бұл максималды шабуыл ықтималдығы 0,12 болғанда 0,05-ке дейін өседі. Robust k-ALeBi-дің дәл осындай тұрақтылығы German-linear және Student-linear модельдерінде де расталды.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;h4 id=\"kengejtilgen-khurylym-sipattamasy\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#kengejtilgen-khurylym-sipattamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кеңейтілген құрылым сипаттамасы&lt;/span&gt;&lt;/a&gt;Кеңейтілген құрылым сипаттамасы&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста машиналық оқыту модельдерінің әділдігін тексерудің екі әдісі: реконструктивті және зондтық (probe-based) тәсілдер арасындағы айырмашылық анықталды. Зерттеушілер зондтарды оқыту мәселесін «көп контекстілі жұлдыз саны» (multi-context star number) көрсеткіші арқылы сипаттады. Сызықтық классификаторлар үшін реконструктивті аудит мүмкін болмаған жағдайдың өзінде, зондтық тәсілдің оқытылу мүмкіндігі сақталатыны анықталды, бұл Q1 сұрағына жауап береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зондтық аудит тәсілі реконструктивті әдістер тиімсіз болған кезде де модельдердегі бейтарапсыздықты анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы тұжырымдама негізінде интерпретацияланатын бейтарапсыздық зондтарын оқытуға негізделген аудит алгоритмі әзірленді. Бұл аудит деректерін тікелей қызығушылық тудыратын әділдік қасиеттері бойынша алуға мүмкіндік береді және Q2 сұрағына жауап болады. Соңында авторлар «әділдіктен хабардар» (fairness-aware) қарсылас бар жағдайдағы аудит мәселесін талдады. Аудит күрделілігінің жоғарғы және төменгі шектері белгіленді, бұл Q3 сұрағын жабады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зонд (probe) — бұл негізгі модельден жасырын заңдылықтарды немесе бейтарапсыздықты тексеру үшін арнайы ақпаратты бөліп алу мақсатында оқытылатын көмекші модель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f1.jpg\" alt=\"1-сурет: Әділдік критерийлерін ескеретін қарсылас модельге қарсы интерактивті әділдік аудиті.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Әділдік критерийлерін ескеретін қарсылас модельге қарсы интерактивті әділдік аудиті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f2.jpg\" alt=\"2-сурет: Топтық пулға бөлу арқылы интерактивті әділдік аудиті.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Топтық пулға бөлу арқылы интерактивті әділдік аудиті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f3.jpg\" alt=\"3-сурет: Интерактивті әділдік аудиті: баптаулар және өзара әрекеттесу хаттамасы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Интерактивті әділдік аудиті: баптаулар және өзара әрекеттесу хаттамасы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f4.jpg\" alt=\"4-сурет: Шектеулі бюджет жағдайында көп топтық әділдікті бағалау қателігі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Шектеулі бюджет жағдайында көп топтық әділдікті бағалау қателігі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f5.jpg\" alt=\"5-сурет: DiamAudit әдісінің қолданылатын жағдайлардағы бағалау қателігі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: DiamAudit әдісінің қолданылатын жағдайлардағы бағалау қателігі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f6.jpg\" alt=\"6-сурет: Зондтар арқылы алынған айырмашылық ұпайлары негізінде белгілерді рейтингтеу.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Зондтар арқылы алынған айырмашылық ұпайлары негізінде белгілерді рейтингтеу.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f7.jpg\" alt=\"7-сурет: COMPAS деректер жиынындағы үйретілген зондтарды белгілер бойынша визуализациялау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: COMPAS деректер жиынындағы үйретілген зондтарды белгілер бойынша визуализациялау.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f8.jpg\" alt=\"8-сурет: Student деректер жиынындағы үйретілген зондтарды белгілер бойынша визуализациялау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Student деректер жиынындағы үйретілген зондтарды белгілер бойынша визуализациялау.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f9.jpg\" alt=\"9-сурет: k-ALeBi мен ReconAudit әдістерін салыстыра отырып, аудиторға ашылған жеке модель жауаптарының санымен өлшенетін\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет: k-ALeBi мен ReconAudit әдістерін салыстыра отырып, аудиторға ашылған жеке модель жауаптарының санымен өлшенетін сәйкестендірудің ағып кетуі.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f10.jpg\" alt=\"10-сурет: k-ALeBi және DiamAudit кезіндегі модельді шығарып алу әрекеті: мақсатты модельге қатысты суррогат модельдің дә\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет: k-ALeBi және DiamAudit кезіндегі модельді шығарып алу әрекеті: мақсатты модельге қатысты суррогат модельдің дәлдігі және шабуылдаушыға ашылған абсолютті белгілер саны.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f11.jpg\" alt=\"11-сурет: Шабуыл ықтималдығының функциясы ретінде ұяшықтар бойынша Robust k-ALeBi үшін жергілікті CGQ бюджеті.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-сурет: Шабуыл ықтималдығының функциясы ретінде ұяшықтар бойынша Robust k-ALeBi үшін жергілікті CGQ бюджеті.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f11-2.jpg\" alt=\"Сурет 11 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 11 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f13.jpg\" alt=\"13-сурет: Қасиеттерге тән жалпы аудит құрылымы.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;13-сурет: Қасиеттерге тән жалпы аудит құрылымы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f14.jpg\" alt=\"14-сурет: Белсенді оқыту жағдайындағы сызықтық классификатор үшін 2D қарсы мысал: көк нүктелер xi ковариаталарды, ал қар\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;14-сурет: Белсенді оқыту жағдайындағы сызықтық классификатор үшін 2D қарсы мысал: көк нүктелер xi ковариаталарды, ал қараңғы сызықтар hi классификаторларын білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f15.jpg\" alt=\"15-сурет: Әділдік аудиті контекстіндегі Дасгупта (2004) қарсы мысалының иллюстрациясы. Қызыл нүктелер бірінші қорғалған \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;15-сурет: Әділдік аудиті контекстіндегі Дасгупта (2004) қарсы мысалының иллюстрациясы. Қызыл нүктелер бірінші қорғалған топтан алынған таңдамаларды, ал жасыл нүктелер екінші қорғалған топтан алынған таңдамаларды білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f16.jpg\" alt=\"16-сурет: 1-белгі (оң жақта) және 2-белгі (сол жақта) үшін ығысу өрістері (bias canvases).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;16-сурет: 1-белгі (оң жақта) және 2-белгі (сол жақта) үшін ығысу өрістері (bias canvases).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f17.jpg\" alt=\"Сурет 17\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 17&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f18.jpg\" alt=\"Сурет 18\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 18&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қара&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жәшіктердегі&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;біржақтылық&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қаупі&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;біржақтылық&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зондтары&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арқылы&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;белсенді аудит&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұзбай&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;біржақтылықты&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анықтау&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алгоритмдерді&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қауіпсіз&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бақылау&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-conte
