аптарды атомарлық фактілерге бөлу оларды сенімді етеді.&lt;/p&gt;\n","links":[{"url":"2026-10-06/improving-reliability-and-explainability-of-medical-question.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-card.jpg"},"content":{"title":"Триггерсіз өтірік: нейрожелінің дұрыс жауабы неге қате шешімге әкелуі мүмкін","text":"&lt;p&gt;Зерттеушілер жасанды интеллект дұрыс жауап бергенімен, жасырын дезинформация негізінде қате шешім қабылдауы мүмкін екенін анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo-card.jpg"},"content":{"title":"SecJev: киберқауіпсіздік саласындағы шешім қабылдаушы жаңа интеллект","text":"&lt;p&gt;SecJev модельдері желілік трафик пен қауіпсіздік саясатын талдап, нақты шешімдер қабылдауға маманданған.&lt;/p&gt;\n","links":[{"url":"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica-card.jpg"},"content":{"title":"Неге ірі тілдік модельдер пациенттер жағдайының динамикасын дұрыс бағаламайды","text":"&lt;p&gt;Медицинадағы жасанды интеллект пациенттің денсаулығы туралы жаңа деректер пайда болғанда өз болжамдарын жаңартуда жиі қателеседі.&lt;/p&gt;\n","links":[{"url":"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Шығарылым &amp;middot; 05.10.2026","url":"2026-10-05/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-card.jpg"},"content":{"title":"Шенеуніктер есептен сөздерді алып тастап, ғылыми зерттеулерді қалай &amp;laquo;жоқ қылады&amp;raquo;","text":"&lt;p&gt;2025 жылы NIH гранттардан DEI терминдерін алып тастауды талап етті. Нәтижесінде зерттеулер жалғасуда, бірақ статистика оларды көрмейді.&lt;/p&gt;\n","links":[{"url":"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-card.jpg"},"content":{"title":"Нейрожелілер неге &amp;laquo;өтірік айтады&amp;raquo;: оқыту мен нәтиже арасындағы алшақтық","text":"&lt;p&gt;Зерттеушілер визуалды модельдердің оқыту кезінде неге оңай алданатынын, бірақ еркін режимде тұрақты болатынын анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-card.jpg"},"content":{"title":"Кіші нейрожелілер неге тапсырмаларды орындай алмайды: мәселе интеллектте емес","text":"&lt;p&gt;Зерттеу көрсеткендей, ықшам модельдер (2-9B) стандартты ортаны арнайы құралдармен ауыстырғанда тиімді жұмыс істейді.&lt;/p&gt;\n","links":[{"url":"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"ОСИНТ-Сигнал қалай жұмыс істейді","items":[{"title":"Іріктеу","text":"&lt;p&gt;Күн сайын модель ондаған жаңа зерттеуді салыстырып, ең маңызды әрі түсініктілерін таңдайды.&lt;/p&gt;\n"},{"title":"Талдау","text":"&lt;p&gt;Мәні, негізгі қорытындылар мен шектеулер — қарапайым, бірақ дәл тілмен.&lt;/p&gt;\n"},{"title":"Үш тіл","text":"&lt;p&gt;Әр материал орыс, өзбек және қазақ тілдерінде шығады.&lt;/p&gt;\n"},{"title":"Суреттер және толық мәтін","text":"&lt;p&gt;Мақалалардың өз суреттері, ал ашық лицензиялар үшін — толық аударма.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Сұрақтар","items":[{"title":"&lt;p&gt;Бұл рецензияланған мақалалар ма?&lt;/p&gt;\n","text":"&lt;p&gt;Жоқ, бұл препринттер — рецензияға дейінгі жаңа жұмыстар. Әр материалда зерттеу шектеулері көрсетілген.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Материалдар қаншалықты жиі шығады?&lt;/p&gt;\n","text":"&lt;p&gt;Күніне үш рет: таңертең, күндіз және кешке.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Мәтіндерді пайдалануға бола ма?&lt;/p&gt;\n","text":"&lt;p&gt;Иә, ОСИНТ-Сигнал мен түпнұсқа мақалаға сілтеме жасап (DOI әр материалда көрсетілген).&lt;/p&gt;\n"}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ОСИНТ-Сигнал","vcsPath":"index.yaml"},"title":"ОСИНТ-Сигнал"},"router":{"pathname":"index","depth":1,"base":"./"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
