            {"data":{"leading":false,"html":"&lt;p&gt;15 мақала&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html\"&gt;IdeaLens: жасанды интеллект идеяларын адам ойынан ажырату&lt;/a&gt; — Дәстүрлі детекторлар мәтін стилін тексереді, ал IdeaLens идеяның нақты авторын анықтауды үйренуде.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Шенеуніктер есептен сөздерді алып тастап, ғылыми зерттеулерді қалай «жоқ қылады»&lt;/a&gt; — 2025 жылы NIH гранттардан DEI терминдерін алып тастауды талап етті. Нәтижесінде зерттеулер жалғасуда, бірақ статистика оларды көрмейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html\"&gt;Жасанды интеллект және дезинформация: қауіпті қалай ажыратуға болады?&lt;/a&gt; — Ұлыбританиядағы 112 ИИ-фейк кейсін зерттеу: әр дипфейк қауіпті емес, бірақ қоғамға төнетін қатер өсуде.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html\"&gt;GS-Pool: 3D-кеңістіктегі өзгерістерді анықтаудың жаңа әдісі&lt;/a&gt; — Ғалымдар әртүрлі уақытта және ракурста түсірілген 3D-көріністердегі өзгерістерді автоматты түрде табатын алгоритм жасады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html\"&gt;Нейрожелілер неге «өтірік айтады»: оқыту мен нәтиже арасындағы алшақтық&lt;/a&gt; — Зерттеушілер визуалды модельдердің оқыту кезінде неге оңай алданатынын, бірақ еркін режимде тұрақты болатынын анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html\"&gt;Кіші нейрожелілер неге тапсырмаларды орындай алмайды: мәселе интеллектте емес&lt;/a&gt; — Зерттеу көрсеткендей, ықшам модельдер (2-9B) стандартты ортаны арнайы құралдармен ауыстырғанда тиімді жұмыс істейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html\"&gt;Шахмат қозғалтқыштары неге үндемейді: ИИ-ді өз жүрістерін түсіндіруге үйрету&lt;/a&gt; — Жаңа QUEEN моделі шахмат қозғалтқыштарының күшін тілдік модельдердің логикасымен біріктіріп, неге бұл жүрістің ең үздігі екенін түсіндіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html\"&gt;LLM жұмысын 14 есе жылдамдату: Galahad технологиясы&lt;/a&gt; — Модельдер уақытының 98%-ын бір мәтінді қайта оқуға жұмсайды. Galahad бұл процесті бір реттік шығынға айналдырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/improving-reliability-and-explainability-of-medical-question.html\"&gt;Медицинада нейрожелілердің қателігін қалай азайтуға болады: атомарлық фактчекинг&lt;/a&gt; — Үлкен тілдік модельдер медициналық сұрақтарда жиі қателеседі. Жауаптарды атомарлық фактілерге бөлу оларды сенімді етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html\"&gt;Триггерсіз өтірік: нейрожелінің дұрыс жауабы неге қате шешімге әкелуі мүмкін&lt;/a&gt; — Зерттеушілер жасанды интеллект дұрыс жауап бергенімен, жасырын дезинформация негізінде қате шешім қабылдауы мүмкін екенін анықтады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html\"&gt;SecJev: киберқауіпсіздік саласындағы шешім қабылдаушы жаңа интеллект&lt;/a&gt; — SecJev модельдері желілік трафик пен қауіпсіздік саясатын талдап, нақты шешімдер қабылдауға маманданған.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica.html\"&gt;Неге ірі тілдік модельдер пациенттер жағдайының динамикасын дұрыс бағаламайды&lt;/a&gt; — Медицинадағы жасанды интеллект пациенттің денсаулығы туралы жаңа деректер пайда болғанда өз болжамдарын жаңартуда жиі қателеседі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-
