        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"147\" cy=\"161\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"533\" cy=\"205\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · WEB_ARCHIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Шенеуніктер есептен сөздерді&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;алып тастап, ғылыми&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;зерттеулерді қалай «жоқ&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қылады»&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f1.jpg\" alt=\"1-сурет: Рецензент өңдеген мәтін, одан сан алынады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Рецензент өңдеген мәтін, одан сан алынады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Рецензент өңдеген мәтін, одан сан алынады. (A) Ортақ мәтін: рецензент түйіндемемен жұмыс істейді, одан сан алынады және NIH жариялайтын деректерге, сондай-ақ түйіндемеде жасалмайтын, зерттеу аспектілерін тіркейтін тәжірибелік жазбаларға қосылады. Аяқталған гранттар есептен шығарылады. (B) FY2023→FY2024 және FY2024→FY2025 кезеңінде барлық іріктеу терминдерін жоғалтқан белгіленген жалғасымдар үлесі, бюджет басталғаннан берілгенге дейінгі күндер бойынша.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Зерттеушілер 37 790 NIH грантын талдап, лексикалық цензураның мемлекеттік статистикаға қалай әсер ететінін анықтады. Грант мәтіндерінен этникалық топтардың атауын алып тастау жобаларды «азшылықтар денсаулығы» санатынан шығарып тастауға әкелді. Бұл ретте қаржыландыру мен ғалымдардың нақты жұмысы өзгеріссіз қалып, ғылым бағыттары жойылып жатқандай иллюзия тудырады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Грант мәтінінен сөздерді алып тастау жобаны автоматты түрде NIH санаттарынан шығарып тастайды.&lt;/li&gt;\n&lt;li&gt;Мәтіні өзгермеген жобалардың 99,4%-ы санатты сақтап қалды, ал өзгерткендерде бұл көрсеткіш 15,7% болды.&lt;/li&gt;\n&lt;li&gt;Қаржыландыру тоқтамады, бірақ ғылыми есептерде жобалар енді көрінбейді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;АҚШ Ұлттық денсаулық сақтау институттары (NIH) гранттарды 300-ден астам санатқа автоматты түрде жіктеу үшін RCDC (&lt;a href=\"concepts/rcdc.html\"&gt;Research, Condition, and Disease Categorization&lt;/a&gt;) жүйесін пайдаланады. 2025 жылы ведомство грант алушылардан DEI (әртүрлілік, теңдік және инклюзия) терминдерін жоба сипаттамаларынан алып тастауды талап етті. Зерттеу авторлары 37 790 жалғасып жатқан жобаны қадағалап, олардың жаңартылған мәтіндерін клиникалық сынақтар тізілімімен және жарияланымдармен салыстырды.&lt;/p&gt;\n&lt;p&gt;Нәтижелер мәтіні өзгермеген жобалардың «азшылықтар денсаулығы» санатында қалу ықтималдығы 99,4% болғанын, ал атауларды алып тастағандарда бұл көрсеткіш 15,7%-ға дейін түскенін көрсетті. Соқыр рецензиялау (blinded review) мұндай «жоғалған» жобалардың 84%-ы санат критерийлеріне әлі де сәйкес келетінін растады. «Сөздерді нысанаға алу» деп аталатын бұл механизм «есепке алынбаған ғылымды» тудырады: қаржыландыру жалғасуда, бірақ мемлекеттік статистика халықтың нақты топтарымен жұмысты тіркемей қойды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу мәтіндер мен сыртқы тізілімдерді талдауға негізделген, шенеуніктер мен ғалымдар арасындағы ішкі хат-хабарларға қолжетімділік жоқ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қаржыландырушы ұйымдар гранттық өтінімдердегі мәтінді жіктеу үшін бағдарламалық қамтамасыз етуді пайдаланады. АҚШ-тың Ұлттық денсаулық сақтау институты (NIH) шығындарды осы жолмен талданған 300-ден астам санат бойынша бөледі. 2025 жылы NIH DEI (әртүрлілік, теңдік және инклюзивтілік) қатысты сөз тіркестерін DEI қызметін қолдамайтын өтінімдерден алып тастауды талап етті және осылайша бұл сөздерді қадағалай бастады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу көрсеткендей, жоба сипаттамаларынан нәсілдік және этникалық топтарды атап өтуді алып тастау, қаржыландыру сақталғанына қарамастан, 84,3% жобаларда «азшылықтар денсаулығы» жіктемесінің жоғалуына әкелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз 37 790 жалғасып жатқан грантты талдап, оларды нақты қызмет жазбаларымен салыстырдық. Халық атаулары маңызды болжағыш болып шықты: сынақтардың базалық көрсеткіштері бар жаңа зерттеулерде қара нәсілді халықтың аталуы қатысушылар үлесінің 60 пайыздық тармаққа артуын болжады. Мәтін ерекшеліктері қай атаулардың сақталатынын анықтады, ал тәжірибе жазбалары аз ақпарат қосты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Мәтін ерекшеліктері» — бұл құжаттардағы сөздер мен сөз тіркестерін талдаудың алгоритмдік әдістері, олар ғылыми жұмыстарды мазмұнын терең зерттемей-ақ жіктеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;NIH-тің «азшылықтар денсаулығы» санаты мәтіндегі ескертулерге тікелей байланысты болды: сипаттаманы сақтаған жобалардың 99,4%-ы санатты да сақтап қалды. Нәсілдік немесе этникалық топ атауын алып тастағандар арасында небәрі 15,7% жоба санатты сақтап қалды, дегенмен қаржыландыру тоқтатылмаған еді. 50 осындай жағдайды соқыр бағалау 42-сі (84%) 2024-қаржы жылындағы санат анықтамасына сәйкес келетінін көрсетті. 70 сипаттаманы өңдеуге дейін және кейін салыстыру 49 жағдайда халыққа қатысты зерттеу мақсаттарының қайта құрылғанын анықтады. 2025-қаржы жылындағы 63 сипаттама енді санат критерийлеріне сәйкес келмей қалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу NIH мәтіндік деректерін талдауға негізделген; «есепке алынбаған ғылым» туралы қорытындылар ғылыми зерттеулердің мазмұнына емес, жіктеу әдіснамасына қатысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жыныстық және гендерлік азшылықтарды атап өткен гранттар, тізімге алынған терминдер, институт және қызмет түрі бойынша түзетулерден кейін, «тоқтатылған» деп белгілену ықтималдығы 37,8 пайыздық тармаққа жоғары болды. Біз бұл механизмді «сөздерді нысанаға алу», оның шекарасын «халықты нысанаға алу» деп атаймыз. Мұның нәтижесі — «есепке алынбаған ғылым»: қаржыландырылатын, бірақ статистикада тіркелмейтін зерттеулер. Жүйе өңделген мәтінді қадағалағандықтан, ғылыми жұмыстың мәні сипаттамамен бірге өзгерді ме, жоқ па, оны анықтау мүмкін емес.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"zertteu-portfelderin-taldau-ueshin-baghdarlamalykh-khamtamasyz-etudi-kholdanu\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#zertteu-portfelderin-taldau-ueshin-baghdarlamalykh-khamtamasyz-etudi-kholdanu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу портфельдерін талдау үшін бағдарламалық қамтамасыз етуді қолдану&lt;/span&gt;&lt;/a&gt;Зерттеу портфельдерін талдау үшін бағдарламалық қамтамасыз етуді қолдану&lt;/h4&gt;\n&lt;p&gt;Ғылыми зерттеулерді қаржыландыратын қорлар гранттық өтінімдердің мәтіндерін автоматты түрде жіктеу үшін арнайы бағдарламалық жасақтаманы жиірек пайдалануда. Мұндай тәсіл ұйымдарға өз жобалар портфелін жүйелеуге мүмкіндік береді. АҚШ-тың Ұлттық денсаулық сақтау институттары (NIH) осы саладағы көшбасшылардың бірі болып табылады және 2008 жылдан бері талдаудың осындай әдістерін қолданып келеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мәтіндерді жіктеу — бұл машиналық оқыту әдісі, мұнда алгоритм кілт сөздер мен контекстті талдау негізінде ғылыми жұмыстарға немесе өтінімдерге автоматты түрде тақырыптық санаттарды тағайындайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жіктеу жүйелері қорларға ресурстардың бөлінуін қадағалауға, қаржыландырудағы олқылықтарды анықтауға және әртүрлі бағыттар бойынша ғылыми өнімділікті бағалауға мүмкіндік береді. Автоматтандырылған құралдарды пайдалану жыл сайын мыңдаған өтінімдерді өңдеу кезінде қол еңбегін азайтып, гранттар туралы үлкен көлемдегі деректерді басқару үшін стандартқа айналуда.&lt;/p&gt;\n&lt;p&gt;RCDC (Research, Condition, and Disease Categorization) жүйесі АҚШ Ұлттық денсаулық сақтау институттары (NIH) тарапынан гранттарды онкологиядан бастап азшылықтардың денсаулығына дейінгі 300-ден астам санатқа бөлу үшін қолданылады. Бұл деректер мемлекеттік қаражаттың қай ғылыми зерттеулерге жұмсалатыны туралы ресми есеп болып табылады. Басқа қорлар да осындай жіктеу жүйелерін пайдаланады. Бұл деректер зерттеушілер үшін қаржыландырудың аурулар жүктемесіне сәйкестігін талдауда, құқық қорғаушылар үшін бюджетті ұлғайтуды негіздеуде және NIH әкімшілігі үшін ғылыми портфельдегі олқылықтарды анықтауда маңызды рөл атқарады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу гранттық өтінімдердің мәтіндерін мәжбүрлі түрде редакциялау NIH ресми статистикасын бұрмалайтынын және іс жүзінде қаржыландырылып жатқан зерттеулерді «көрінбейтін» етіп қоятынын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дәстүрлі түрде бұл саладағы жұмыстар жіктеу дәлдігі мен индикаторлардың ғалымдардың мінез-құлқына әсеріне бағытталған. Алайда, қордың өзі бағдарламалық жасақтама талдайтын мәтіндердің мазмұнын белгілей бастаған жағдайлар бұрын зерттелмеген. 2025 жылы NIH гранттық өтінімдерді DEI (әртүрлілік, теңдік және инклюзия) тұрғысынан қайта қарауды талап етті және қаржыландыру үшін тиісті сөз тіркестерін алып тастауды бұйырды. Федералдық сот 2025 жылдың маусымында бұл нұсқауларды жойғанымен, көптеген тақырыптар мен аннотациялар өзгертіліп үлгерген еді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RCDC — бұл гранттарды тақырыптық санаттарға бөлу үшін тақырыптар мен аннотацияларды талдайтын автоматтандырылған жіктеу жүйесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар 37 790 жалғасып жатқан жобаны талдап, этникалық және нәсілдік топтардың аталуын қадағалады. Нәтижелер көрсеткендей, егер жоба аннотациясы өзгеріссіз қалса, «Нәсілдік және этникалық азшылықтардың денсаулығы бойынша зерттеулер» санатын сақтап қалу ықтималдығы 99,4% болған. Егер мәтіннен топтың атауы алынып тасталса, бұл ықтималдық 15,7%-ға дейін төмендеген. Сонымен қатар, сыртқы жазбалар (клиникалық сынақтар мен қатысушылар деректері) жобалардың бұл топтармен жұмыс істеуді жалғастырғанын растады. Редакцияланған 20 жобаның 17-сі санатты жоғалтты, дегенмен тәуелсіз сарапшылар 2024 жылғы деректер бойынша жобалар санат критерийлеріне сәйкес келетінін растаған болатын.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу NIH әкімшілік деректерін талдауға және оларды клиникалық сынақтар жазбаларымен салыстыруға негізделген; қорытындылар ғылыми жұмыстардың сапасына емес, есеп беру механизмдеріне қатысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"soezderdi-nysanagha-alu-word-targeting\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#soezderdi-nysanagha-alu-word-targeting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сөздерді нысанаға алу (Word targeting)&lt;/span&gt;&lt;/a&gt;Сөздерді нысанаға алу (Word targeting)&lt;/h4&gt;\n&lt;p&gt;Біз «сөздерді нысанаға алу» ұғымын енгіземіз — бұл қаржыландырушы ұйым статистиканы қалыптастыратын мәтінді өңдеу механизмі. Бұл механизм тексерілетін болжамдарға ие және редактордың ниетін талдауды талап етпейді. Сөздер контекстті ескереді (мысалы, «жасушалар азшылығы» тіркесі сақталады, өйткені ол демографиялық топқа жатпайды).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Сөздерді нысанаға алу» әдісі идеалдандырылған модель болып табылады; ол өңдеулер ғылыми жұмыстың мәнін емес, белгілі бір терминдерді алып тастауға бағытталғанын болжайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұдан үш қорытынды туындайды: 1) Өшірілетін сөздер мәтін арқылы таңдалады. Біз өңдеулер тек форманы немесе зерттеудің мәнін өзгертетінін тексереміз. 2) Статистика өңдеулерді мұра етеді. Өңделген мәтіннен алынған санат бұрмаланған болады, бұл «есепке алынбаған ғылымға» әкелуі мүмкін. 3) Сөздерді нысанаға алудың шекарасы бар. Егер қысым мәтінге емес, популяцияның өзіне бағытталса, сөздерді өңдеу тиімсіз болады және әрекеттер грантты қайтарып алу деңгейіне ауысады. 1-кестеде (Нәтижелер бөлімінен кейін) осы салдарлар мен әрқайсысы үшін дәлелдемелер тізімі келтірілген.&lt;/p&gt;\n&lt;p&gt;2025 жылғы 20 және 21 қаңтардағы атқарушы жарлықтар DEI (әртүрлілік, теңдік және инклюзивтілік) бағдарламалары мен «гендерлік идеология» мәселелерін қозғады. 2025 жылғы наурызда NIH жобаларды DEI қатысуына қарай сұрыптауды және DEI қызметін қолдамайтын гранттардан тиісті терминологияны алып тастауды талап ететін нұсқаулық шығарды. «LatinX» терминіне тыйым салынғаны хабарланды. 2025 жылғы маусымда сот бұл директиваларды жойды, ал тамыз айында Жоғарғы сот күшінде қалдырды. 2025 жылдың соңына қарай NIH 235 терминді тексеретін мәтіндік скрининг жүйесін енгізді. 2026 жылғы қыркүйектегі талап арызға сәйкес, бұл тізім 2025 жылы жойылған гранттарда жиі кездескен сөздер негізінде жасалған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2025 жылдың соңында енгізілген NIH скрининг жүйесі 2025 жылғы реттеуші өзгерістер кезінде жойылған гранттар лексикасы негізінде құрылған 235 терминнен тұратын тізімді пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sholu-aeser-etetin-leksika\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#sholu-aeser-etetin-leksika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шолу әсер ететін лексика&lt;/span&gt;&lt;/a&gt;Шолу әсер ететін лексика&lt;/h4&gt;\n&lt;p&gt;NIH-тің жаңа гранттарында скрининг терминдерінің үлесі 2015 қаржы жылындағы 6,4%-дан 2024 жылы 15,8%-ға дейін өсті. NSF-те де осындай үрдіс байқалды (2015–2019 жылдардағы 29,2%-дан 2023–2024 жылдардағы 38,4%-ға дейін). Халықты атау да кеңейді: қамқоршылар (caregivers) 5,9 есе, испан тілді топтар 2,8 есе, қара нәсілді халық 1,4 есе өсті. Скринингтің ерекшелігі «equit-», «underrepresent-» және «minorit-» сияқты түбір сөздерде көрініс тапты. Бұл лексиканың бірдей зерттеушілер тобында өсуі зерттеу түрінің емес, жазу стилінің өзгергенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Скрининг-терминдер — бұл реттеушілердің бақылауына түскен және ғылыми жұмыстың мәнінен гөрі академиялық тілдің өзгеруін көрсететін кілт сөздер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"derekter\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#derekter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректер&lt;/span&gt;&lt;/a&gt;Деректер&lt;/h4&gt;\n&lt;p&gt;Зерттеу &lt;a href=\"concepts/nih-exporter.html\"&gt;NIH ExPORTER&lt;/a&gt; (2015–2025) деректеріне, соның ішінде грант атауларына, аннотацияларына және бюджеттеріне негізделген. Талдау NIH сыртқы гранттарын қамтиды. Жобаларды жарияланымдармен байланыстыру (2016–2026 жылдардағы 1,25 млн мақала) үшін OpenAlex қолданылған. 2021 жылға дейінгі мақалалар үшін &lt;a href=\"concepts/medical-subject-headings.html\"&gt;MeSH&lt;/a&gt; дескрипторлары сараптамалық, 2022 жылдан кейінгілері автоматтандырылған деп есептеледі. Клиникалық сынақтар деректері AACT (2025 жылғы қаңтар және 2026 жылғы қыркүйек) дерекқорынан алынған. RCDC санаттары (мысалы, &lt;a href=\"concepts/remhr.html\"&gt;REMHR&lt;/a&gt; — азшылықтар денсаулығын зерттеу) мәтіндік талдау арқылы бөліп алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2022 жылдан кейінгі автоматтандырылған MeSH дескрипторларын пайдалану өткен жылдардағы сараптамалық индекстеумен салыстыру дәлдігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sharttar\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#sharttar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шарттар&lt;/span&gt;&lt;/a&gt;Шарттар&lt;/h4&gt;\n&lt;p&gt;Скрининг терминдері 235 сөзден тұратын тізімді қамтиды. Жою және тоқтатуларды талдау үшін 2024 жылғы қазанда жарияланған 699 терминнен тұратын «Сенат тізімі» қолданылды. «Белгіленген гранттар» — бұл скрининг тізіміндегі кемінде бір терминді қамтитын өтінімдер. Зерттеушілер алты мақсатты топты (мысалы, SGM, нәсілдік азшылықтар) және сегіз бақылау тобын (мысалы, ардагерлер, спортшылар) бөліп көрсетті, бұл жоба тақырыбына қарай тұжырымдамалардың қалай өзгергенін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"toertten-toert-boeliginde-tuejindi-soezder-zhoghalghan\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#toertten-toert-boeliginde-tuejindi-soezder-zhoghalghan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Төрттен төрт бөлігінде түйінді сөздер жоғалған&lt;/span&gt;&lt;/a&gt;Төрттен төрт бөлігінде түйінді сөздер жоғалған&lt;/h4&gt;\n&lt;p&gt;2025 қаржы жылына ұзартылған 5461 гранттың 2169-ында (39,7%) түйінді сөздер қысқаша мазмұндамадан жоғалып кеткен. Бір жыл бұрын бұл көрсеткіш небәрі 0,08% (5242-нің 4-еуі) болған. Терминдердің жойылу ықтималдығы гранттың кешігуіне байланысты артқан: уақытында берілген гранттар үшін 27,8%-дан, бюджеттік кезең басталғаннан кейін 90 күн өткен соң берілгендері үшін 54,6%-ға дейін. Жою контекстке байланысты болды: егер термин кездейсоқ қолданылса (мысалы, «жасушалардың азшылығы»), ол 2,4% жағдайда жоғалған, ал мақсатты мағынада қолданылғанда — 40,6% жағдайда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2025 жылға ұзартылған 2024 жылғы гранттардың 39,7%-ында қысқаша мазмұндамадағы түйінді сөздер жоғалған, бұл ретте кешіктірілген құжаттарда жойылу ықтималдығы жоғары.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"halykh-ataulary-khatysushylardy-irikteuding-bolzhaushysy-retinde\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#halykh-ataulary-khatysushylardy-irikteuding-bolzhaushysy-retinde\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Халық атаулары қатысушыларды іріктеудің болжаушысы ретінде&lt;/span&gt;&lt;/a&gt;Халық атаулары қатысушыларды іріктеудің болжаушысы ретінде&lt;/h4&gt;\n&lt;p&gt;Грант атауында нақты халық тобын көрсету клиникалық зерттеулерге қатысушылардың құрамымен статистикалық байланысты (2-сурет А). Бастапқы деректері жарияланған жаңа гранттар арасында, егер топ атауы тақырыпта болса, қара нәсілді қатысушылардың үлесі 60 пайыздық тармаққа (п.т.) жоғары (95% СИ: 51–68), ал егер тек аннотацияда болса — 30 п.т.-ға жоғары (23–37) болған. Осындай әсер испан тілді қатысушылар (75 және 23 п.т.) мен әйелдер (39 және 17 п.т.) үшін де байқалған. MeSH деректері бұл үрдісті растады (2-сурет B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MeSH (Medical Subject Headings) — ғылыми мақалаларды индекстеуге арналған басқарылатын сөздік жүйесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"maetin-sipattamalary-ataulardyng-sakhtaluyn-bolzhady\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#maetin-sipattamalary-ataulardyng-sakhtaluyn-bolzhady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мәтін сипаттамалары атаулардың сақталуын болжады&lt;/span&gt;&lt;/a&gt;Мәтін сипаттамалары атаулардың сақталуын болжады&lt;/h4&gt;\n&lt;p&gt;Атаулардың сақталуы мәтін құрылымына (сөйлем, пішін және халық) байланысты болған. Егер топ атауы «мақсатты терминмен» бір сөйлемде болса, ол жиі жойылған. Мысалы, испан тілді топтар үшін, егер атау терминмен қатар тұрса, ол 22,8% жағдайда сақталған, ал егер бөлек болса — 43,9% жағдайда (3-сурет А).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында: мәтін құрылымы мен терминдерді жою арасында корреляция анықталған, бірақ бұл тікелей себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Автоматтандырылған талдау көрсеткендей, 47,6% жағдайда (95% СИ: 39,3–54,7) «сигналдық» атаулары бар сөйлемдер сақталған, бірақ атаулардың өздері өшірілген. Бақылау топтарында бұл көрсеткіш небәрі 0,2%-ды құраған. Пішін бойынша, толық атаулар (мысалы, «Hispanic») қысқартылғандарына қарағанда жиі жойылған. Жобаның нақты халықты зерттеген-зерттемегені болжам моделіне айтарлықтай әсер етпеген: бұл факторды қосу дәлдікті (&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;) небәрі 0,002-ге өзгерткен.&lt;/p&gt;\n&lt;h4 id=\"zhoba-annotaciyasyndaghy-top-atauy-men-zhoba-sanaty-arasyndaghy-bajlanys\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#zhoba-annotaciyasyndaghy-top-atauy-men-zhoba-sanaty-arasyndaghy-bajlanys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жоба аннотациясындағы топ атауы мен жоба санаты арасындағы байланыс&lt;/span&gt;&lt;/a&gt;Жоба аннотациясындағы топ атауы мен жоба санаты арасындағы байланыс&lt;/h4&gt;\n&lt;p&gt;Зерттеу көрсеткендей, REMHR (азшылықтар денсаулығы бойынша зерттеулер) санатының берілуі жоба аннотациясында нәсілдік немесе этникалық топ атауының болуымен тығыз байланысты. 2024-қаржы жылында (ҚЖ) мұндай топтарды нақты зерттеген жобалардың 99,5 пайызы, егер аннотация мәтіні өзгермесе, 2025-ҚЖ-да да санатты сақтап қалды. Алайда, егер топ атауы аннотациядан жоғалса, санатты сақтап қалу ықтималдығы 15,0 пайызға дейін (20 жобаның 3-еуі) төмендеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Егер жоба сипаттамасынан мақсатты нәсілдік немесе этникалық топ атауы алынып тасталса, REMHR санатын сақтап қалу ықтималдығы 98,5 пайыздан 15,0 пайызға дейін төмендейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;REMHR — азшылықтар денсаулығына бағытталған жобаларға берілетін санат. Ол деректерді жіктеу үшін нәсілдік немесе этникалық тегін жай ғана айнымалы ретінде пайдаланатын зерттеулерді алып тастайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл бақылау зерттеуі: авторлар мәтін мен жіктеу арасындағы корреляцияны талдайды, кездейсоқ тәжірибе арқылы орнатылған себеп-салдарлық байланысты емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Топ атауы алынып тасталғаннан кейін санатты жоғалтқан 20 жобаны соқыр сараптамалық бағалау олардың барлығы REMHR анықтамасына ресми түрде сәйкес келетінін көрсетті. Сонымен қатар, олардың 10-ы (2025-ҚЖ-да жалпы 6,4 млн доллар қаржыландырумен) тақырып бойынша зерттеулерді жалғастырған, бұл жарияланымдар немесе клиникалық сынақтар тізіліміндегі жазбалармен расталады. Санатты жоғалтқан 50 кездейсоқ жобаны талдау 84 пайыз жағдайда олардың 2024-ҚЖ-дағы мақсаттары REMHR өлшемшарттарына сәйкес келгенін, бірақ 2025–2026 жылдардағы ағымдағы қызмет бойынша дәлелдер айтарлықтай аз болғанын көрсетті.&lt;/p&gt;\n&lt;h4 id=\"koersetilgen-terminder-bojynsha-tuezetulerden-kejin\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#koersetilgen-terminder-bojynsha-tuezetulerden-kejin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көрсетілген терминдер бойынша түзетулерден кейін&lt;/span&gt;&lt;/a&gt;Көрсетілген терминдер бойынша түзетулерден кейін&lt;/h4&gt;\n&lt;p&gt;Атауында жыныстық және гендерлік азшылықтар (SGM) бар 2024-қаржы жылының гранттарын талдау көрсеткендей, олардың 46,7%-ы 2026 жылғы наурыздағы жағдай бойынша тоқтатылған деп тіркелген, ал барлық гранттар үшін бұл көрсеткіш 4,8%-ды құрады (5B-сурет). SGM аталған барлық гранттардың 10,7%-ы тоқтатылған, 36,0%-ы қалпына келтірілуі мүмкін, 15,4%-ы топтың атауынсыз жалғасуда, 20,8%-ы топты атап өту арқылы жалғасуда және 17,1%-ы нақты мәртебеге ие емес. Басқа параметрлер (институт, белсенділік, терминология) тұрақты болған кезде, SGM аталған гранттардың тоқтатылу ықтималдығы басқа топтарға қарағанда 37,8 пайыздық тармаққа жоғары болды (95% ДИ 33,1–42,7). Салыстыру үшін: испан тілді топтар үшін бұл көрсеткіш +3,2 (1,6–4,9), ал қара нәсілді халық үшін +0,2 (−1,2-ден 1,8-ге дейін) болды (5A-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SGM аталған гранттар басқаларға қарағанда 37,8 пайыздық тармаққа жиі тоқтатылған, бұл зерттеулерден аталған топтардың мақсатты түрде шығарылып тасталуын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пайыздық тармақ (percentage point) — екі пайыздық көрсеткіш арасындағы арифметикалық айырмашылық.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл үрдіс институттар бойынша жалпы шаралар қолданылған жағдайларды қоспағанда және оқытуға байланысты емес гранттар арасында да сақталды. АИТВ/ЖИТС зерттеулері санатындағы айырмашылық 31,8 пайыздық тармақты (25,1–38,6) құрады. Гранттарды редакциялау кезінде SGM-ге қатысты терминдер топ атауының бөлігі немесе басқа терминдер болуына қарамастан, бірдей жылдамдықпен алынып тасталды. Алайда, қайта қаралған гранттар арасында гендерлік сәйкестікке қатысты терминдер жыныстық бағдарға қатысты терминдерге қарағанда 20,7 пайыздық тармаққа жиі алынып тасталды.&lt;/p&gt;\n&lt;h4 id=\"annotaciyalardaghy-oezgerister-taezhiribedegi-oezgeristerden-koep\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#annotaciyalardaghy-oezgerister-taezhiribedegi-oezgeristerden-koep\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аннотациялардағы өзгерістер тәжірибедегі өзгерістерден көп&lt;/span&gt;&lt;/a&gt;Аннотациялардағы өзгерістер тәжірибедегі өзгерістерден көп&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер кілттік терминдер алынып тасталған 150 аннотация жұбын бағалады. 46,7% жағдайда (95% ДИ 38,9–54,6) зерттеу мазмұны толық емес немесе қайта құрылымдалған (Криппендорф α = 0,84). 66 жұпта сарапшылар жаңа аннотациядан ескі нұсқада болмаған мазмұнды анықтады, бұл зерттеу мақсаттарының қайта қаралғанын көрсетеді. Байланысты клиникалық сынақтарды талдау көрсеткендей, егер грант аннотациясы мақсатты топты атауды тоқтатса, сынақтардың 4,5%-ы (179-дың 8-і) 2026 жылғы қыркүйекке қарай тоқтатылған немесе тоқтатыла тұрған, ал аннотация өзгермеген жағдайда бұл көрсеткіш 2,5% (529-дың 13-і) болды (айырмашылық 2,0 пайыздық тармақ, 95% ДИ −1,4–5,8).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау зерттеуі: анықталған айырмашылықтар аннотация мәтінінің өзгеруі мен сынақтар мәртебесі арасындағы корреляцияны көрсетеді, бірақ тікелей себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сынақтардағы іріктеу критерийлерінің 15,6%-ында, егер грант аннотациясы да бұл атауды алып тастаса, топ енді аталмаған, ал өзгермеген аннотацияларда бұл көрсеткіш 4,8%-ды құрады. Атауды алып тастаған жобалар жалпы алғанда көбірек жаңа сынақтарды тіркеген (әр жобаға 0,51-ге қарсы 0,37), алайда топты атаған жаңа тіркеулер аннотациялары өзгерген және өзгермеген топтар арасында дерлік айырмашылық жасамады.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"oengdelgen-zhazbalar\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#oengdelgen-zhazbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өңделген жазбалар&lt;/span&gt;&lt;/a&gt;Өңделген жазбалар&lt;/h4&gt;\n&lt;p&gt;Қатаң критерийлерге сәйкестікті талап ететін жобалар аясында FY2025 санатында зерттеу сипаттамаларындағы өзгерістер тіркелді. 1-кесте осы түзетулердің салдары мен қолда бар дәлелдерді салыстырады. Көп жағдайда аннотациялар өңделгеннен кейін жобалар ресми анықтамаларға сәйкес келмей қалды, дегенмен қаржыландыру мен жалпы сыныптама сақталды. Бұл нақты жүргізіліп жатқан жұмыс пен оның ресми есептердегі көрінісі арасында алшақтық тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Талданған 150 жазба жұбының 46,7%-ында сарапшылар зерттеу мазмұны жаңа мәтіндерде жоғалып кеткенін немесе қайта анықталғанын анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Атаулы» санаттарды жоғалтудың 70 жағдайын талдау олардың 49-ында зерттеу мақсаттары қайта тұжырымдалғанын көрсетті, ал атауларын сақтап қалған 10 бақылау жобасында бұл көрсеткіш небәрі 3-ті құрады. Мәтіндерді салыстыру зерттеудің мәні өзгерді ме, әлде тек оның сипаттамасы өзгерді ме деген сұраққа нақты жауап бермейді. 2025–2026 жылдары критерийлерге сәйкес келуді жалғастырған 7 жобаның 5-і үшін дәлел ретінде тек клиникалық сынақтардың белсенді мәртебесі қызмет етті.&lt;/p&gt;\n&lt;p&gt;Авторлар «есепке алынбаған ғылым» (&lt;a href=\"concepts/neuchtennaya-nauka.html\"&gt;uncounted science&lt;/a&gt;) ұғымын енгізеді. «Орындалмаған ғылым» (қоғам талап ететін, бірақ институттар назардан тыс қалдыратын зерттеулер) немесе «тыйым салынған білім» (сезімталдығына байланысты қашқақтайтын тақырыптар) ұғымдарынан айырмашылығы, есепке алынбаған ғылым — бұл іс жүзінде қаржыландырылатын және жүргізілетін, бірақ жоба сипаттамаларындағы терминдердің өзгеруіне байланысты статистикада есепке алынбайтын жобалар. Бұл жүйенің конституциялық сипатына айналады: есептер жұмыс мазмұнының жалғыз дәлелі ретінде қабылдана бастайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Есепке алынбаған ғылым — бұл қаржыландырылуы мен жүргізілуі жалғасып жатқан, бірақ жоба сипаттамаларындағы терминологияның өзгеруіне байланысты ресми тізілімдерден түсіп қалатын ғылыми қызмет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-кесте жоба атауларының ақпараттық жүктемесі бар екенін көрсетеді: атауда мақсатты топтың болуы таңдамадағы үлесін болжайды. Алайда, мәтіндердегі түзетулер белгілі бір халық топтарын зерттейтін жобалардың, егер олардың аннотациясы тиісті терминнен айырылса, санатты жоғалтуына әкелді. Сонымен қатар, санатты жоғалтудың 17 жағдайының 10-ында сарапшылар кейінгі жазбаларда (6,4 млн құнында) мақсатты топпен жұмыс жалғасқанын растады. 7 жағдайда (2,2 млн құнында) бұл тек сынақтар тізіліміндегі белсенді жазбалармен расталды. Мәтін өңдеулері негізінде санатты жоғалтуды болжау моделі 0,95 AUC дәлдігін көрсетті.&lt;/p&gt;\n&lt;h4 id=\"zertteulerdi-baghalaugha-khoskhan-ueles\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#zertteulerdi-baghalaugha-khoskhan-ueles\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеулерді бағалауға қосқан үлес&lt;/span&gt;&lt;/a&gt;Зерттеулерді бағалауға қосқан үлес&lt;/h4&gt;\n&lt;p&gt;Индикаторлардың әсері бойынша зерттеулер көбінесе ғалымдардың бағалау критерийлеріне бейімделу мінез-құлқына бағытталған. Біз алгоритмдер оқитын мәтінге қысым жасалып, зерттеу нысаны өзгеріссіз қалатын жағдайды сипаттаймыз. 2025 жылғы шолулар барысында қаржыландыру мәтіндерді қайта қарауға байланысты болғандықтан, жобалардың түйіндемелері өзгертілді. Бұл Кэмпбеллдің индикатордың кіріс деректеріне қысым жасау туралы аргументін кеңейтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біз ұзақ мерзімді алшақтықты анықтадық: бір жоба және бірдей практикалық жазбалар мәтіндегі түзетулерге байланысты қатарынан келетін жылдарда әртүрлі жіктеледі, бұл ұзақ мерзімді статистиканы бұрмалайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алдыңғы жіктеулер аудиті (мысалы, RCDC) көбінесе кесінді түрінде болып, 6% жағдайда қателерді анықтаған. Біздің талдауымыз мәтін нұсқасын жіктегіш берген санатпен салыстырғанда деректердің сәйкес келетінін көрсетеді. Алайда, бір жобаның әртүрлі уақыттағы мәтін нұсқаларын салыстыру алшақтықтардың қалай пайда болатынын көруге мүмкіндік береді. Бұл мәтіндегі өзгерістерге соқыр жалғыз көрсеткіштің орнына көпжақты контекстік индикаторларды пайдалану қажеттілігін растайды.&lt;/p&gt;\n&lt;h4 id=\"tuezetuler-nege-aeser-etti\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tuezetuler-nege-aeser-etti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түзетулер неге әсер етті&lt;/span&gt;&lt;/a&gt;Түзетулер неге әсер етті&lt;/h4&gt;\n&lt;p&gt;2025 жылғы нұсқаулық «тілді» «зерттеуден» бөлуге бағытталған еді. Алайда, түзетулер сөйлемдерге олар белгілі бір терминдерді немесе топ атауларын қамтығанына қарай әсер етті. Белгілі бір халықты зерттеу фактісінің өшірілуді болжауға әсері өте аз болды (AUC өзгеруі 0,002; 95% CI: -0,010-дан 0,013-ке дейін).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (Area Under the Curve) — жіктеу сапасының метрикасы; 0,002 мәні халықты зерттеу фактісінің кілт сөздердің болуына қарағанда болжау қабілетінің өте төмен екенін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жұптық шолу атаулар өшірілген 70 жағдайдың 49-ында түзетушілер зерттеу мақсаттарын қайта құрастырғанын көрсетті. Түйіндемелері өзгермеген 99,4% жағдайда санаттың тұрақтылығы RCDC жалпы әдіснамасының өзгермегенін, бірақ түзетулердің нақты мақсатты болғанын көрсетеді. Қателер алгоритмдер «тілді» ақпараттық атаулардан ажырата алмаған жерлерде туындаған.&lt;/p&gt;\n&lt;h4 id=\"bir-sholudan-ekinshisine\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#bir-sholudan-ekinshisine\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бір шолудан екіншісіне&lt;/span&gt;&lt;/a&gt;Бір шолудан екіншісіне&lt;/h4&gt;\n&lt;p&gt;NIH 2025 жылғы желтоқсанда енгізген сүзгі 2025 жылы тоқтатылған гранттардағы сөздер базасынан жасалған деген болжам бар. Егер бұл дұрыс болса, бір тексеру кезеңінің нәтижелері келесісі үшін сөздер тізіміне айналады. 2026 жылғы 30 қыркүйектегі жағдай бойынша, түйіндемелерінен топ атауы өшірілген 200 жобаның тек 3-еуі ғана оны қайта атап өткен, ал түйіндемелері өзгермеген 496 жобаның 444-і мұны істеген (14-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2026 қаржы жылы бойынша деректер 2026 жылғы 30 қыркүйектегі қолжетімді жазбалармен шектелген; толық көрініс әлі жарияланбаған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2003-zhaene-2025-zhyldardaghy-halykh-toptaryn-nysanagha-alu\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#2003-zhaene-2025-zhyldardaghy-halykh-toptaryn-nysanagha-alu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2003 және 2025 жылдардағы халық топтарын нысанаға алу&lt;/span&gt;&lt;/a&gt;2003 және 2025 жылдардағы халық топтарын нысанаға алу&lt;/h4&gt;\n&lt;p&gt;Жыныстық және гендерлік азшылықтар үшін жоба сипаттамаларынан терминдерді алып тастау және оларды сақтау көрсеткіштері ұқсас болды, алайда бұл топтың гранттары кілт сөздер саны болжағаннан гөрі қаржыландыруды тоқтатуға жиі ұшырады (түзетуден кейінгі айырмашылық 37,8 пайыздық тармақты құрады, ал испан тілді халық үшін бұл көрсеткіш 3,2 болды). 2026 жылғы 23 наурыздағы жағдай бойынша, мұндай тоқтатулардың 46,7 пайыздық тармағының 36,0-і қайта қалпына келтірілуі мүмкін жобалар ретінде белгіленген. Біз мұны мақсатты әсер ету деп түсінеміз: егер қысым белгілі бір топқа бағытталса, мәтінді өңдеу талаптарды қанағаттандырмайды және шаралар гранттар деңгейіне ауысады. 2003 жылы да осындай жағдай орын алған: Конгресстің NIH гранттары бойынша жыныстық мінез-құлық зерттеулері туралы сұрауынан кейін 250-ден астам жобаның тізімі комитет қызметкерлеріне берілген. NIH бірде-бір грантты қайтарып алмаса да, сауалнамаға қатысқан зерттеушілердің жартысына жуығы бағдарлама кураторларының ұсынысы бойынша атаулар мен аннотациялардан «қалаусыз» сөздерді алып тастағандарын, ал 17%-ы зерттеулерден бас тартқандарын хабарлады. 2025 жылы сұрау агенттіктің өзінен түсті және гранттар тек өңделіп қана қоймай, тоқтатылды да.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2025 жылы жыныстық және гендерлік азшылықтар үшін гранттар күтілгеннен 37,8 пайыздық тармаққа артық тоқтатылған, бұл жай ғана терминологияны өзгерту емес, тікелей нысанаға алуды білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhazba-endi-neni-koersete-almajdy\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#zhazba-endi-neni-koersete-almajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жазба енді нені көрсете алмайды&lt;/span&gt;&lt;/a&gt;Жазба енді нені көрсете алмайды&lt;/h4&gt;\n&lt;p&gt;Мәселе есептілікті қалыптастыру механизмінде. Қор есептеу үшін пайдаланатын терминдер бір уақытта цензура объектісі болса, қор саясаты мен ғылыми есептілік біртұтас құралға айналады. Егер әкімшілік ортақ мәтінге түзетулер енгізуді талап етсе, бұл талап есептілікке ғылымның өзі өзгергендей болып қайтады. 2025 жылы алынып тасталған атаулар дәл статистика үшін қажетті атаулар болды. 2025-қаржы жылы (FY2025) деректер қатарында белгіленбеген үзіліс бар. Азшылықтар денсаулығы бойынша жалпы көрсеткіштердің төмендеуі ішінара аннотацияларында осы топтарды атауды тоқтатқан жобалармен байланысты. Талданған таңдамада атауы алынып тасталғаннан кейін санатын жоғалтқан жобалар жалпы төмендеудің бестен бір бөлігін (125,0 млн-нан 553,7 млн) құрады және бұл деректерді жарияланған есептерден қалпына келтіру мүмкін емес. Бұл қатарды тренд ретінде талдаудың кез келген түрі осы үзілісті қамтиды. Біз мұны тек NIH жобаларының тізімдерінде, 2024 жылғы жиынтықтарда және тізілімдерде сақталған іздер арқылы ғана анықтай алдық. Қоғамдық жазба бастапқы мәтінді де, өңдеу күнін де сақтамайды, сондықтан оқырман зерттеудегі нақты өзгерістерді олардың сипаттамасындағы өзгерістерден ажырата алмайды.&lt;/p&gt;\n&lt;h4 id=\"shekteuler-zhaene-bolashakh-zertteuler\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#shekteuler-zhaene-bolashakh-zertteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер және болашақ зерттеулер&lt;/span&gt;&lt;/a&gt;Шектеулер және болашақ зерттеулер&lt;/h4&gt;\n&lt;p&gt;Зерттеуді бағалау әдісі дәл емес (5.3-бөлім). Мәтін моделінің AUC көрсеткіші 0,69 екені біз өлшеген белгілер редакторлар жасаған жұмыстардың көп бөлігін қамтымайтынын білдіреді. Қатаң таңдама 20 жобамен шектелген. «Тәжірибе-жазба» стандарты топтың қатысуын тіркейді, ал REMHR мақсатпен анықталады. Соқыр рецензиялау 2024-қаржы жылындағы сол 20 жоба үшін санатқа жататынын растайды, бірақ ол қоғамдық жазбалар пакеттеріне сүйенеді, ал жалғасып жатқан жұмыстар бойынша дәлелдер зерттеушілер өз бетінше жаңартып отыратын тізілім мәртебесіне негізделген. Рецензенттердің ағымдағы жұмыстар бойынша келісімі орташа деңгейде болды (κ=0,26 және 0,36). RCDC де талдайтын нақты мақсаттар (Specific aims) қоғамдық емес. 2025 жылғы файлдар 2026 жылы қайта жасалған, сондықтан өңдеу күндері белгісіз. Қатысушыларды тарту бойынша деректер сынақтардың бастапқы көрсеткіштері жарияланған 2% гранттарға негізделген. Grant Witness — үшінші тарап компиляциясы, ал қаржыландыруды тоқтату мәртебесі сот процестерінде өзгерді. Ең басты шектеу — бақылау кезеңінің қысқалығы. Өңдеулердің ұсыныстарға, қатысушыларды тартуға және зерттеушілерді оқытуға әсері жылдар бойы көрінеді және ағымдағы деректер рецензиялардың оларды өзгерткенін көрсете алмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (Area Under the Curve) — жіктеу сапасының метрикасы: 0,5 кездейсоқ болжамды, 1,0 мінсіз дәлдікті білдіреді. 0,69 мәні модельдің орташа болжау қабілетін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу қысқа бақылау кезеңімен шектелген; деректер грант сипаттамаларындағы өзгерістерді нақты ғылыми тәжірибедегі ұзақ мерзімді өзгерістермен нақты байланыстыруға мүмкіндік бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;2025 жылы АҚШ Ұлттық денсаулық сақтау институттары (NIH) гранттардың сипаттамаларын өңдеді, бұл ресми ғылыми есептіліктің өзгеруіне әкелді. Біз қаржыландыруды сақтап қалған, бірақ олардың жария аннотацияларынан белгілі бір халық топтары туралы ескертулер жойылып, санаттардың өздері NIH-тің жыл сайынғы тізімдерінен шығарылған жобаларды анықтадық. Көп жағдайда өңдеу жобаның мәлімделген мақсаттарын өзгертумен қатар жүрді, соның салдарынан жаңа сипаттамалар ресми түрде алынып тасталған санаттардың критерийлеріне сәйкес келмей қалды. Алайда, осы жобалардың кейбіреулері үшін клиникалық сынақтардың белсенді екендігі жұмыстың жалғасып жатқанын растайды: қаржыландыру сақталған, бірақ статистикалық есеп жоғалған. Зерттеу нысаны тікелей халық тобы болған жағдайда, олардың атауын қамтитын гранттар әлдеқайда тезірек тоқтатылды. Мәтіндік жіктеудің шынайылығы осы мәтінді басқару ережелеріне тікелей байланысты. Егер мемлекеттік органдар ғылыми зерттеулерді тұжырымдарды өзгерту арқылы реттесе, олар өздерінің әкімшілік шешімдерін объективті ғылыми фактілер ретінде түсіндіре алады, бұл деректерді барлық сыртқы пайдаланушылар үшін бұрмалап көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NIH гранттары сипаттамаларының 2025 жылғы өңделуі жобаларды қаржыландыруды сақтай отырып, есептіліктен белгілі бір халық топтары туралы ақпараттың жоғалуына әкелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"derekter-men-kodtyng-kholzhetimdiligi\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#derekter-men-kodtyng-kholzhetimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректер мен кодтың қолжетімділігі&lt;/span&gt;&lt;/a&gt;Деректер мен кодтың қолжетімділігі&lt;/h4&gt;\n&lt;p&gt;Пайдаланылған бастапқы деректер ашық болып табылады: NIH ExPORTER тізілімі (2026 жылғы 25 қыркүйектегі жүктеме), RCDC жобаларының тізімдері мен жалпы көрсеткіштері (2026 жылғы 27 қыркүйек), NIH RePORTER және ClinicalTrials.gov API-лері (2026 жылғы 30 қыркүйек), OpenAlex базасы (2026 жылғы 26 маусымдағы жағдай), AACT базасы (2025 жылғы 1 қаңтар мен 2026 жылғы 25 қыркүйектегі жағдай), GrantWitness деректері (2026 жылғы 23 наурыз) және Сенаттың Сауда комитетінің есебі (2024 жылғы 9 қазан). Нәтижелерді агрегациялайтын бағдарламалық код, мақаладағы әрбір сандық мәнді тексеретін скрипт, сондай-ақ жіктеуіштер мен код кітаптары редакция мен рецензенттерге ұсынылды. Жекелеген гранттар, жарияланымдар, сынақтар және тұлғалар бойынша деректер файлдары көпшілікке таратылмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;API (бағдарламалау интерфейсі) — бұл ведомстволардың деректер базасынан құрылымдалған ақпаратты автоматтандырылған түрде сұрауға және алуға мүмкіндік беретін құрал.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"taldau-aedisteri-zhaene-irikteu-kriterijleri\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#taldau-aedisteri-zhaene-irikteu-kriterijleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талдау әдістері және іріктеу критерийлері&lt;/span&gt;&lt;/a&gt;Талдау әдістері және іріктеу критерийлері&lt;/h4&gt;\n&lt;p&gt;Жобалардың сабақтастығын талдау үшін 2024 және 2025 қаржылық жылдардағы (FY) жазбалар өзара байланыстырылды. Оқиғаларды талдау 37 406 жұп жазбаны қамтыды, оның 5 461-і мақсатты деп белгіленді. Ескертулерді талдау үшін 37 790 жұп қолданылды, мұнда талдау бірлігі ретінде грант және 2024 жылғы мәтінде аталған популяция алынды. Егер 2025 жылғы қорытынды есепте популяция мәтінде сақталса, ескерту сақталды деп есептелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұптарды байланыстыру әдісі жоба сипаттамасындағы өзгерістерді бір қаржылық жылдан екіншісіне ауысу кезінде бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қосалқы деректерді жою, егер сөйлемде тізімдегі басқа терминдер де болса, кілт сөздері бар сөйлемдерді алып тастауды білдірді. Популяция жобамен «зерттелетін» деп саналды, егер 2025 жылға дейінгі жазбалар мұны мына әдістердің бірімен растаса: MeSH-дескрипторы бар кемінде екі мақала (мақалалардың кемінде 30%), 2025 жылғы қаңтардағы жағдай бойынша популяцияны қамтитын клиникалық сынақ немесе қара нәсілді және испан тілді халық үшін АҚШ халқындағы үлесінен екі есе көп қатысушыны қамтитын сынақ.&lt;/p&gt;\n&lt;h4 id=\"baghalau-raesimderi-zhaene-statistikalykh-taldau\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#baghalau-raesimderi-zhaene-statistikalykh-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау рәсімдері және статистикалық талдау&lt;/span&gt;&lt;/a&gt;Бағалау рәсімдері және статистикалық талдау&lt;/h4&gt;\n&lt;p&gt;«Қатаң тәжірибе» зерттеуі кемінде үш мақаласы немесе байланысты сынағы бар жобалардың ішкі жиынын қамтыды, бұл «грант–популяция» жұптарының 22,3%-ын құрады. Бағалауды үш сарапшы: екі автор және бір тәуелсіз әріптес жүргізді. Сарапшылар жоба идентификаторлары мен олардың санаттық мәртебесі бойынша соқыр (blinded) болды. Көрсеткішті сақтау 2024 жылы REMHR ескертуі бар және 2025 жылы оны сақтап қалған жобалардың үлесі ретінде анықталды.&lt;/p&gt;\n&lt;p&gt;2025 жылғы 20 қаңтардан кейін белсенді болған 55 302 гранттың ішінен Grant Witness дерекқорында аяқталу күні барлары «аяқталған» деп белгіленді. Статистикалық маңыздылық үлестер үшін Wilson интервалдары және сақтау көрсеткіштеріндегі айырмашылық үшін Newcombe интервалдары арқылы есептелді. Басқа жағдайларда жобалардың немесе институттардың қайта іріктеуі (resampling) қолданылды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f1.jpg\" alt=\"1-сурет: Рецензент өңдеген мәтін, одан сан алынады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Рецензент өңдеген мәтін, одан сан алынады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Рецензент өңдеген мәтін, одан сан алынады. (A) Ортақ мәтін: рецензент түйіндемемен жұмыс істейді, одан сан алынады және NIH жариялайтын деректерге, сондай-ақ түйіндемеде жасалмайтын, зерттеу аспектілерін тіркейтін тәжірибелік жазбаларға қосылады. Аяқталған гранттар есептен шығарылады. (B) FY2023→FY2024 және FY2024→FY2025 кезеңінде барлық іріктеу терминдерін жоғалтқан белгіленген жалғасымдар үлесі, бюджет басталғаннан берілгенге дейінгі күндер бойынша.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f2.jpg\" alt=\"2-сурет: Зерттеуге қосылған кезде тіркелген популяция атаулары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Зерттеуге қосылған кезде тіркелген популяция атаулары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: Зерттеуге қосылған кезде тіркелген популяция атаулары. (A) Байланысты сынақтарда қосылған популяция үлесінің өсуі, оны атаған гранттар, атамаған гранттарға қарсы, орналасуы бойынша (толтырылған — атау; ашық — тек басқа жерде). (B) Осы популяция үшін MeSH дескрипторымен индекстелген курацияланған байланысты мақалалар үлесінің өсуі. Сары түспен популяциялар, көгілдір түспен салыстырмалы популяциялар белгіленген. Жаңа гранттар FY2015–FY2023, 95% сенімділік интервалдарымен.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f3.jpg\" alt=\"3-сурет: Атаулардың сақталуын болжайтын мәтіндік белгілер.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Атаулардың сақталуын болжайтын мәтіндік белгілер.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Атаулардың сақталуын болжайтын мәтіндік белгілер. (A) Қайта қаралған жалғасымдар арасында популяция атауларының сақталуы, әрбір ескерту тізімдегі терминмен бір сөйлемді бөліскенде және біреуі бөлек тұрғанда. (B) Бір популяцияның тізімге алынған және алынбаған формаларының грант ішінде жоғалуы, айырмашылық және оның 95% сенімділік интервалымен. (C) Зерттелген популяциялар үшін сақталудағы алшақтық, шикі, мәтін өзгеріссіз күйде және хирургиялық түзетулер үшін, минималды анықталатын әсерге қарсы (штрихталған). Интервалдар 95%, үлестер үшін Уилсон интервалдары және алшақтықтар үшін &lt;a href=\"concepts/butstrep.html\"&gt;бутстреп&lt;/a&gt;-ресемплинг.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f4.jpg\" alt=\"4-сурет: Жобалар қаржыландырылған, бірақ есепке алу тоқтатылған.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Жобалар қаржыландырылған, бірақ есепке алу тоқтатылған.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: Жобалар қаржыландырылған, бірақ есепке алу тоқтатылған. (A) REMHR-ді қамтитын және 2025 жылғы 20 қаңтардан кейін белсенді болған FY2024 жобалары, FY2025-ке дейін қадағаланған: мәртебе, түйіндеме және FY2025 санаты. Жолақтар ені — жобалар саны. Сары жолақтар — түйіндемелері атауды жоғалтқан жобалар. (B) Нәсілдік немесе этникалық популяцияны қатаң зерттейтін жобалар арасында REMHR-ді сақтау, түйіндемедегі өзгерістерге қарай, FY2023→FY2024 эталон ретінде. (C) FY2025-те REMHR-і бар жобалар үлесі, түйіндеме өзгеріссіз (сұр) және атау алынып тасталған (сары), популяцияны зерттейтін өлшенген жобалар және оны атайтын, бірақ тәжірибелік жазба стандартына сәйкес келмейтіндер үшін. (D) Әр санатты қамтитын FY2025 жобаларының үлесі, REMHR-ді сақтаған жобалар, атау алынып тасталғаннан кейін оны жоғалтқандарға қарсы. (E) Түйіндемелері атауды жоғалтқан қатаң тәжірибелік дәлелдері бар 20 жалғасымды жоба және олардың ішінде REMHR-ді жоғалтқан 17-сі. 17 жоба арасында үш тексеру жүргізілген: екі рецензент те популяция үстінде жұмыс жүріп жатқанын көрсететін кейінгі қоғамдық жазбаларды тапқан (10), екеуі де 2025–2026 жылдардағы дәлелдерді санат анықтамасына сәйкес келеді деп бағалаған (7) және байланысты сынақ 2026 жылғы қыркүйектегі тіркеу жазбасында қатысушыларды жинап жатқан, белсенді немесе шақыру бойынша қабылдап жатқан деп көрсетілген және популяцияны атаған (8). Жұмысты тексеру және сынақты тексеру қиылысады (7-уі екеуіне де сәйкес келеді, 11-і кем дегенде біреуіне). Долларлар — жобалардың FY2025-тегі жалпы қаржыландырылуы, популяция зерттеуіне жұмсалған шығындар емес, $0,1 миллионға дейін жуықталған. A панелі тек санат деректеріне, E панелі жоба деңгейіндегі шолуға негізделген. B және C-дағы интервалдар 95% Уилсон интервалдары.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f5.jpg\" alt=\"5-сурет: Жыныстық және гендерлік азшылықтарды атайтын гранттар, тізімдегі терминдерге түзету енгізілгеннен кейін, жиі то\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Жыныстық және гендерлік азшылықтарды атайтын гранттар, тізімдегі терминдерге түзету енгізілгеннен кейін, жиі тоқтатылған.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: Жыныстық және гендерлік азшылықтарды атайтын гранттар, тізімдегі терминдерге түзету енгізілгеннен кейін, жиі тоқтатылған. (A) Тоқтатылды деп тіркелген үлестегі түзетілген айырмашылық, аталған популяция бойынша, тізімдегі терминдер, институт және қызмет өзгеріссіз күйде, институттарды қайта таңдаудың 95% интервалдарымен. (B) Әр популяцияны атайтын FY2024 гранттарының нәтижелері (2025 жылғы 20 қаңтардан кейін белсенді гранттар), барлық гранттар эталон ретінде. Бағандардағы сандар — пайыз.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS1.jpg\" alt=\"Қосымша сурет 1: Аталған термин бар сөйлемде ескертуді жоғалту ықтималдығының артуы, «марапат × популяция» қимасында.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет 1: Аталған термин бар сөйлемде ескертуді жоғалту ықтималдығының артуы, «марапат × популяция» қимасында.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Қосымша сурет 1: Аталған термин бар сөйлемде ескертуді жоғалту ықтималдығының артуы, «марапат × популяция» қимасында. Салыстырмалы популяциялар жұмыс күшіне жақын (студенттер, медицина қызметкерлері) және басқалар болып бөлінген. Марапаттарды қайта таңдау (bootstrap) үшін 95% сенімділік интервалдары (сигналдық популяциялар үшін көрсетілмеген). Қосымша әдістер 4.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS2.jpg\" alt=\"Қосымша сурет 2: 2024 қаржы жылындағы мәтіндегі ескертулер санына байланысты сигналдық және салыстырмалы популяция атаул\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет 2: 2024 қаржы жылындағы мәтіндегі ескертулер санына байланысты сигналдық және салыстырмалы популяция атауларының сақталуы, бақыланатын (тұтас сызық) және әрбір ескертуді тәуелсіз жою шартымен болжанған (үзік сызық). Қосымша әдістер 4.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS3.jpg\" alt=\"Қосымша сурет 3: Сақталудағы айырмашылық (зерттелген популяция минус зерттелмеген), шикі деректер және мәтін бекітілген \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет 3: Сақталудағы айырмашылық (зерттелген популяция минус зерттелмеген), шикі деректер және мәтін бекітілген күйде, жалпы алғанда, хирургиялық түзетулер үшін және тек шикі деректер толық қайта жазулар үшін, жобаларды қайта таңдау (resampling) арқылы 95% интервалдармен. Қосымша әдістер 4.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS4.jpg\" alt=\"Қосымша сурет 4: Өлшенген ішкі жиындағы атаулардың сақталуы үшін модель бойынша таңдаудан тыс (out-of-fold) AUC, жобалар\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Қосымша сурет 4: Өлшенген ішкі жиындағы атаулардың сақталуы үшін модель бойынша таңдаудан тыс (out-of-fold) AUC, жобаларды қайта таңдау (resampling) арқылы 95% интервалдармен. Қосымша әдістер 4.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt
