        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"124\" cy=\"100\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"576\" cy=\"206\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LLM жұмысын 14 есе&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жылдамдату: Galahad&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;технологиясы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-f1.jpg\" alt=\"1-сурет: Galahad сұраныстарға қызмет көрсету жолында. Blaise сұраққа қатысты мәтін үзіндісін таңдайды; Taliesin модель б\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: &lt;a href=\"concepts/galahad.html\"&gt;Galahad&lt;/a&gt; сұраныстарға қызмет көрсету жолында. &lt;a href=\"concepts/blaise.html\"&gt;Blaise&lt;/a&gt; сұраққа қатысты мәтін үзіндісін таңдайды; &lt;a href=\"concepts/taliesin.html\"&gt;Taliesin&lt;/a&gt; модель бұрын өңдеген кез келген блок үшін сақталған KV күйін ұсынады және жаңа блоктарды алғашқы толтырудан (prefill) кейін сақтайды. Егер жүктеу тексеруден өтпесе, орындау ортасы (runtime) блокты қайта есептейді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Үлкен тілдік модельдер әр сұраныс сайын бүкіл контекстті қайта өңдейді, бұл үлкен есептеу ресурстарын талап етеді. Galahad жүйесі назар аудару күйін (&lt;a href=\"concepts/key-value-cache.html\"&gt;KV-кэш&lt;/a&gt;) және мәтін үзінділерін сақтап қалу арқылы модельге оқылған құжаттарды «есте сақтауға» мүмкіндік береді. Нәтижесінде модель қайта есептеусіз бірден жауап бере алады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Galahad KV-күйін сақтау арқылы жауап беру уақытын 14 есе қысқартады.&lt;/li&gt;\n&lt;li&gt;Қалпына келтірілген жад күйі бастапқы есептеумен битма-бит бірдей.&lt;/li&gt;\n&lt;li&gt;Жүйе vLLM, &lt;a href=\"concepts/sglang.html\"&gt;SGLang&lt;/a&gt; және llama.cpp-мен үйлесімді жұмыс істейді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Galahad екі бөліктен тұрады: Taliesin және Blaise. Taliesin мәтін блоктары үшін KV-күйін сақтайды және қайта сұраныста оны жүктейді. Blaise құжаттарды индекстеп, модельге тек қажетті бөлігін ғана береді. 97 000 токеннен тұратын корпуста Gemma 4 31B моделі Galahad көмегімен 100 сұрақтың барлығына дұрыс жауап берді, бұл ретте уақыт шығыны 14 есе, ал энергия шығыны 92%-ға қысқарды.&lt;/p&gt;\n&lt;p&gt;Технология vLLM, SGLang және llama.cpp үшін жад қабаты ретінде жұмыс істейді. Тексерулер көрсеткендей, қалпына келтірілген күй жаңадан есептелген күймен битма-бит сәйкес келеді. Жүйе қателік орын алған жағдайда автоматты түрде қайта есептеу режиміне ауысады, бұл жад қателері салдарынан қате жауаптардың шығуын болдырмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алғашқы индекстеу процесі қосымша уақыт пен энергияны қажет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қазіргі трансформерлік тіл модельдері әр токен үшін шектеулі есептеу қуатына ие. Қазіргі архитектурада сұраныстарға қызмет көрсету «&lt;a href=\"concepts/stateless-inference.html\"&gt;stateless&lt;/a&gt;» (күйсіз) болып табылады: бір құжат бойынша жаңа сұрақ қойылғанда, модель назар күйін (attention state) бірінші токеннен бастап қайта есептейді. Жеті нақты деректер жиынын талдау промпттардағы токендердің 98,7%-ы модель бұрын оқыған мәтіндер екенін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Galahad жүйесін енгізу қайталанатын есептеулерді болдырмай, KV-кэш күйін сақтап қалады, бұл жауаптардың дәлдігін 10%-дан 98%-ға дейін арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар vLLM, SGLang және llama.cpp үшін жад қабаты болып табылатын Galahad жүйесін ұсынады. Жүйе екі компоненттен тұрады: Taliesin мәтін блоктары үшін кілт-мәндік (KV) күйді сақтайды және қайта жүгінгенде оны жүктейді, ал Blaise модельге тек сұраққа жауап беру үшін қажетті бөліктерді ғана береді. Сынақтар 97 000 токеннен тұратын корпус және 100 жасырын фактіні қамтитын Gemma 431B моделі арқылы өткізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-кэш (Key-Value cache) — бұл модельдің аралық есептеулері сақталатын жад аймағы, ол мәтіннің алдыңғы бөліктерін қайта есептемей «есте сақтауға» мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Galahad-сыз модель жадта тек соңғы 12 000 токенді ұстай алған және 100 сұрақтың 10-ына 9,3 секунд пен 2754 Дж энергия жұмсап жауап берген. Taliesin-мен модель 100 сұрақтың 98-іне 3,0 секунд пен 572 Дж жұмсап жауап берді. Blaise қосылғанда, модель әр сұрақ үшін шамамен 668 токенді өңдеп, барлық 100 сұраққа 0,59–0,64 секунд пен 200–213 Дж жұмсап жауап берді. Корпусты бастапқы сақтау 100 секунд пен 28 кДж талап етеді, бұл шығын 13 сұраныстан кейін өтеледі. Қалпына келтірілген күй жаңа есептелген күймен толықтай бірдей: барлық 262 144 шығыс логиттері сәйкес келді. Жүйе 30 түрлі модельде сыналды және тұрақтылықты көрсетті: тексеруде қателік болған жағдайда Galahad стандартты қайта есептеуге ауысады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер бақыланатын ортада алынды; тиімділік GPU архитектурасы мен сұраныстардың күрделілігіне байланысты өзгеруі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Авторлар трансформерлердің есептеу күрделілігінің O(N² · d) шегін талдайды, мұнда N — токендер саны, d — модель өлшемі. Ұсынылып отырған тұжырымдама бойынша, &lt;a href=\"concepts/inferens.html\"&gt;инференс&lt;/a&gt; құны жалпы мәтін көлеміне емес, тек жаңа мәтін көлеміне байланысты болуы тиіс. Бұл есептеу процесін «жадысыз» күйден тұрақты жадысы бар жүйеге ауыстырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Galahad жүйесі KV (кілт-мәні) күйін және мәтінді сақтау арқылы артық есептеулерді азайтады, бұл модельге бір құжатты қайта-қайта оқымауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қазіргі жүйелерде (vLLM, SGLang) префикс кэші тек GPU жадымен шектелген. Galahad екі деңгейлі жадыны енгізеді: Taliesin (мәтін блоктары үшін KV күйін сақтайды) және Blaise (құрылымдалған мәтінді сақтайды). Taliesin қалпына келтіру кезінде бит деңгейінде бірдей логиттерді қамтамасыз етеді, ал Blaise модельге бүкіл корпусты емес, тек қажетті бөлімдерді ғана береді. Сынақтарда Blaise әр сұрақ үшін 97 000 токеннің орнына шамамен ~668 токенді ғана өңдеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-кэш (Key-Value cache) — бұл модель мәтінді оқу барысында есептейтін аралық деректер, олар қайталанатын есептеулерді болдырмауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ornalastyru\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#ornalastyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Орналастыру&lt;/span&gt;&lt;/a&gt;Орналастыру&lt;/h4&gt;\n&lt;p&gt;Galahad Linux x86-64 үшін ортақ кітапхана (libgalahad.so) ретінде жүзеге асырылған және vLLM, SGLang, llama.cpp жүйелерімен үйлесімді. Жүйе деректер қауіпсіздігін қамтамасыз ету үшін жалға алушы идентификаторы мен модель «ізін» (fingerprint) талап етеді.&lt;/p&gt;\n&lt;h4 id=\"taliesin-kv-xotirasi\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#taliesin-kv-xotirasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Taliesin: KV xotirasi&lt;/span&gt;&lt;/a&gt;Taliesin: KV xotirasi&lt;/h4&gt;\n&lt;p&gt;Taliesin KV күйін кіріс байттарының хэші астында сақтайды. Қайталама сұраныс кезінде жүйе деректердің тұтастығын тексереді; егер жазба зақымдалған болса, қайта есептеу жүргізіледі. Қайта пайдалану токен позициялары дәл сәйкес келгенде блок деңгейінде орын алады.&lt;/p&gt;\n&lt;h4 id=\"blaise-maetindik-zhady\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#blaise-maetindik-zhady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Blaise: мәтіндік жады&lt;/span&gt;&lt;/a&gt;Blaise: мәтіндік жады&lt;/h4&gt;\n&lt;p&gt;Blaise құжаттарды бөлімдерге бөлінген байт түрінде сақтайды. Сұрақ түскенде, жүйе CPU-да қажетті бөлімді таңдап, оны модельге береді. Бұл модельге бүкіл мәтінді оқымай-ақ жауап беруге мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"durystykh\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#durystykh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дұрыстық&lt;/span&gt;&lt;/a&gt;Дұрыстық&lt;/h4&gt;\n&lt;p&gt;Дәлдік өте маңызды: Galahad қалпына келтірілген күйдегі кез келген сәйкессіздікті қате деп санайды және деректерді қайта есептейді. Қауіпсіздік сынақтарында төрт қорғаныс механизмі (хэштеу, қолтаңбалар, жалға алушыларды бөлу, байттарды салыстыру) тексерілді. Барлық қорғаныс құралдары шабуылдарды сәтті тоқтатты. Статикалық талдау құралдары арқылы буферден тыс оқудың бір қатесі анықталып, түзетілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл мақала жүйенің сипаттамасы болып табылады; Blaise құрылымы мен қауіпсіздік егжей-тегжейлері патенттік өтінімдермен қорғалған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"uzakh-korpus-bojynsha-eske-tuesiru\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#uzakh-korpus-bojynsha-eske-tuesiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұзақ корпус бойынша еске түсіру&lt;/span&gt;&lt;/a&gt;Ұзақ корпус бойынша еске түсіру&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер Galahad жүйесін 13 Wikipedia мақаласынан тұратын корпусқа (96 726 токен) енгізілген 100 ойдан шығарылған фактілер арқылы сынады. Gemma 4 31B моделі RTX A6000 GPU-да қолданылды. Базалық әдіс (Galahad-сыз) 12 000 токендік тереземен мәтіннің тек 12%-ын ғана көре алды. Taliesin компоненті KV-кэш күйін сақтап қалды, ал Blaise сәйкес фрагментті (шамамен 668 токен) таңдап алды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taliesin-ді қолдану модельге 100 сұрақтың 98-іне жауап беруге мүмкіндік берді, ал онсыз тек 10-ына ғана жауап алынды. Бұл ретте өңдеу жылдамдығы 3,1 есеге артып, GPU энергия тұтынуы 79%-ға төмендеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-кэш (Key-Value cache) — бұл модельдің аралық есептеулері, олар мәтіннің бір бөлігін қайта-қайта есептемеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу синтетикалық деректер жиынтығында жүргізілді; нәтижелер нақты, күрделірек мәтіндермен жұмыс істегенде өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nakhty-aelemdegi-zheti-derekter-zhiyny\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#nakhty-aelemdegi-zheti-derekter-zhiyny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нақты әлемдегі жеті деректер жиыны&lt;/span&gt;&lt;/a&gt;Нақты әлемдегі жеті деректер жиыны&lt;/h4&gt;\n&lt;p&gt;Жеті түрлі дереккөзден (қолдау логтары, қатесі бар PDF-тер, SWEbench және т.б.) алынған 349 сұрақ арқылы жүйе сыртқы деректерде тексерілді. Gemma 4 31B моделі үш ортада: llama.cpp, vLLM және SGLang-да іске қосылды. Промпт токендерінің орташа 98,69%-ы қайта есептелмей, Taliesin кэшінен жүктелді. Taliesin мен Blaise комбинациясы тек Taliesin-ді қолдануға қарағанда 3–10 есе жылдамдықпен 91–92% дәлдікті қамтамасыз етті.&lt;/p&gt;\n&lt;h4 id=\"khyzmet-koersetu-oenimdiligi\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#khyzmet-koersetu-oenimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қызмет көрсету өнімділігі&lt;/span&gt;&lt;/a&gt;Қызмет көрсету өнімділігі&lt;/h4&gt;\n&lt;p&gt;Әртүрлі GPU-лардағы (RTX PRO 4500-ден H100-ге дейін) тесттер сақталған күйді жүктеу қайта есептеуден жылдамырақ екенін көрсетті. Qwen 3 30B моделімен H100-де өткізілген тесттерде өткізу қабілеті 29,6%-ға (секундына 2,643-тен 3,424 сұранысқа дейін) артты. Жүйе ақауларға төзімділігін көрсетті: Kubernetes-те процесс мәжбүрлі түрде тоқтатылғанда (SIGKILL) деректер зақымдалмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Корпус көлемі GPU жадымен емес, диск кеңістігімен шектелген: жүйе 5,97 миллион токенмен сәтті жұмыс істеді және жад тұтынуын тұрақты сақтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khamtu\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#khamtu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қамту&lt;/span&gt;&lt;/a&gt;Қамту&lt;/h4&gt;\n&lt;p&gt;Үйлесімділік vLLM көмегімен 30 түрлі модельде тексерілді. DeepSeek-V4-Flash (284B) моделінде Taliesin мен Blaise бірлесіп 100 сұрақтың 98-іне жауап берді, әр сұранысқа 0,133 с және 143 Дж жұмсалды.&lt;/p&gt;\n&lt;h4 id=\"zhobalau-shekaralary\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#zhobalau-shekaralary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жобалау шекаралары&lt;/span&gt;&lt;/a&gt;Жобалау шекаралары&lt;/h4&gt;\n&lt;p&gt;Galahad жүйесінің нәтижелері үш негізгі архитектуралық қағидамен анықталады. Біріншіден, деректерді қайта пайдалану блоктар деңгейінде жүзеге асады. Rotary position encoding (RoPE) әрбір кілт-мәндер (KV) жолын өз позициясына тәуелді ететіндіктен, жолдарды әртүрлі сұраныстар арасында бөлісу мүмкін емес (тест 344 064 жолдан 0 сәйкестікті көрсетті). Galahad позициялары дәл сәйкес келетін және қалпына келтірілген күйі бит-бай-бит (bit-identical) болатын тұтас блоктарды қайта пайдаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Galahad позицияға тәуелді деректерді араластырып алмау үшін блоктарды қолдану арқылы бит-бай-бит дәлдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Екіншіден, жүйе «жабық күйде бас тарту» қағидасы бойынша жобаланған: егер жүктеу тексеруі өтпесе, деректер қайта есептеледі. H100 GPU-да әрбір үшінші жүктеу әдейі сәтсіз болғанда, өткізу қабілеті Galahad-сыз 2,643-ке қарсы секундына 2,716 сұранысты құрады. Үшіншіден, жад бастапқы мәтінмен шектелген: PDF-файлдармен жұмыс істегенде 50 жағдайдың 9-ында мәтін парсер арқылы бөліп алу кезеңінде жоғалған және ешқандай жад қабаты инференцияға дейін жоғалған деректерді қалпына келтіре алмайды.&lt;/p&gt;\n&lt;h4 id=\"bajlanysty-zhumystar\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#bajlanysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Байланысты жұмыстар&lt;/span&gt;&lt;/a&gt;Байланысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;Қозғалтқыштар ішінде KV-күйлерін қайта пайдалану саласында PagedAttention және RadixAttention сияқты шешімдер деректер GPU жадында болған кезде ортақ префиксі бар сұраныстар арасында күйді алмасуға мүмкіндік береді. Galahad осы жүйелердің интерфейстерін пайдаланады және қайта пайдалану мүмкіндіктерін GPU жады мен процесс мерзімі шекарасынан тыс кеңейтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-кэш (Key-Value cache) — бұл трансформерлердегі назар (attention) есептеулерінің аралық нәтижелері, оларды сақтау мәтін генерациясын жылдамдатады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;KV-күйлерін жүктеу және сақтау бөлігінде LMCache және Mooncake сияқты жүйелер деректерді CPU жедел жадына немесе дискіге көшіреді. CacheGen күйді сығады, ал CacheBlend және RAGCache фрагменттерді біріктіруде жуықтап есептеуге жол береді. Galahad дәл бит-бай-бит сәйкестік талабымен ерекшеленеді: кез келген сәйкессіздік қате деп саналады. Іздеу тапсырмаларында Galahad ұқсастық бойынша рейтингтеу әдістерінен (мысалы, BM25) өзгеше түрде, құжаттардың нақты бөлімдерін қайтаруға бағытталған. Оқытуды талап ететін Cartridges жүйелерінен айырмашылығы, Galahad KV күйін қосымша оқытусыз сақтайды. Қазіргі жұмыс автордың Merlin дедупликация жүйесі мен KV-күйлерін егу әдістері бойынша әзірлемелерін бірыңғай жүйеге біріктіреді.&lt;/p&gt;\n&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;p&gt;Зерттеу нәтижелері үш негізгі тезисті растайды. Біріншіден, модель күйін сақтап, қайта пайдалануға болады: қалпына келтірілген күй сыналған 30 модельдің барлығында логиттердің (шығыс мәндерінің) сәйкестігін қамтамасыз етті. Екіншіден, қайта пайдалану промпт есептеулерін жадтан оқу операциясына айналдырады: жеті нақты деректер жиынында промпт токендерінің 98,7%-ы жадтан алынды. Үшіншіден, жадтың әрбір элементі тиімділікті арттырады: KV-кэшті (кілттер мен мәндер) сақтау модельге контексттік терезесінен 8 есе үлкен мәтіндер корпусымен жұмыс істеуге мүмкіндік берді, бұл ретте llama.cpp жылдамдығы 3,1 есе артты. Мәтіндік жадты қосу процесті тағы 4,7 есе жылдамдатып, энергия шығынын 2,7 есе төмендетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тұрақты жадты пайдалану модельге контексттік терезеден 8 есе үлкен деректермен жұмыс істеуге мүмкіндік береді, есептеулерді 4,7 есеге дейін жылдамдатады және энергия шығынын 2,7 есе азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нәтижелер инференс шығындарының құрылымын өзгертеді. Қазіргі уақытта сұраныс құны промпттағы мәтін көлеміне пропорционалды өседі. Тұрақты жадпен ол тек жаңа, бұрын оқылмаған мәтін көлеміне байланысты болады. Бірдей құжаттарға қайта жүгінуді талап ететін тапсырмалар (пайдаланушыларды қолдау, бағдарламалау, заңгерлік тапсырмалар) үшін бұл шығындарды айтарлықтай азайтады. Сондай-ақ, бұл ықшам модельдерді бұрын өте ұзын контексттік терезені қажет ететін үлкен көлемді деректермен жұмыс істеуге жарамды етеді. «Stateless» (күйсіз) инференстен «stateful» (күйлі) инференске көшу — жұмыстың басты қорытындысы.&lt;/p&gt;\n&lt;h4 id=\"esepteu-shegine-khatysty\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#esepteu-shegine-khatysty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Есептеу шегіне қатысты&lt;/span&gt;&lt;/a&gt;Есептеу шегіне қатысты&lt;/h4&gt;\n&lt;p&gt;Galahad жүйесі есептеу қуаты бойынша теориялық шектеулерді жоққа шығармайды. Модель өзгеріссіз қалады, әр токен үшін орындалатын есептеулер де өзгермейді. Тек бұл есептеулердің неге жұмсалатыны өзгереді. Біріншіден, жұмыс бір рет қана орындалады: мәтін блогы үшін назар аудару күйі (attention state) сақталады және кейінгі сұраныстарда жүктеледі. Екіншіден, корпустағы тиісті бөлімдерді іздеу CPU-ға ауыстырылады, ал модель тек оқу және жауап беру тапсырмасын алады. Үшіншіден, жүктелген күйдің дұрыстығын тексеру модельдің өз-өзін бағалауы арқылы емес, байт бойынша салыстыру және криптографиялық хэштер арқылы жүзеге асырылады. Galahad қайталанатын тапсырмаларды, іздеу мен верификацияны модельден тысқары шығару арқылы есептеу шегін айналып өтеді. Келесі қадамдар Blaise-тің екінші режимін сынақтан өткізуді және PDF файлдарынан деректер алуды жақсартуды қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инференс — оқытылған нейрондық желіні жаңа деректер бойынша жауап алу үшін қолдану процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kholzhetimdilik\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#kholzhetimdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қолжетімділік&lt;/span&gt;&lt;/a&gt;Қолжетімділік&lt;/h4&gt;\n&lt;p&gt;Galahad-тың көпшілікке арналған бета-нұсқасы 2026 жылғы 1 қазаннан бастап https://github.com/corbenicai/galahad мекенжайында қолжетімді болады. Бета-нұсқа 12 ай бойы бір графикалық процессорда (GPU) коммерциялық емес мақсатта тегін пайдалануға ашық. Коммерциялық пилоттық жобалар сұраныс бойынша ұсынылады. Кестелер үшін шикі логтар деректер жиынымен бірге жарияланады. Жүйенің бір бөлігіне патенттік өтінімдер берілген.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-f1.jpg\" alt=\"1-сурет: Galahad сұраныстарға қызмет көрсету жолында. Blaise сұраққа қатысты мәтін үзіндісін таңдайды; Taliesin модель б\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Galahad сұраныстарға қызмет көрсету жолында. Blaise сұраққа қатысты мәтін үзіндісін таңдайды; Taliesin модель бұрын өңдеген кез келген блок үшін сақталған KV күйін ұсынады және жаңа блоктарды алғашқы толтырудан (prefill) кейін сақтайды. Егер жүктеу тексеруден өтпесе, орындау ортасы (runtime) блокты қайта есептейді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-f2.jpg\" alt=\"2-сурет: Әр сұраққа кететін орташа уақытқа қатысты еске түсіру тестінің (recall test) дәлдігі, әр сұрақ алдында орындау \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Әр сұраққа кететін орташа уақытқа қатысты еске түсіру тестінің (&lt;a href=\"concepts/recall.html\"&gt;recall&lt;/a&gt; test) дәлдігі, әр сұрақ алдында орындау ортасының өз кэшін тазарту шартымен (2-кесте). Түс конфигурацияны, пішін орындау ортасын білдіреді. Galahad-сыз модель корпустың 88%-ын көре алмайды.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;контекстті&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;артық қайта&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оқу&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;KV-кэш және&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мәтін&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сегментациясы&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;14 есе&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жылдамдық және&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жоғары дәлдік&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height
