        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"240\" cy=\"157\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"520\" cy=\"214\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · TOOLING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;SecJev: киберқауіпсіздік&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;саласындағы шешім қабылдаушы&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жаңа интеллект&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo-f1.jpg\" alt=\"1-сурет: SecJev-тің ортақ шешім қабылдау жолы және қауіпсіздікке бейімделуі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: &lt;a href=\"concepts/secjev.html\"&gt;SecJev&lt;/a&gt;-тің ортақ шешім қабылдау жолы және қауіпсіздікке бейімделуі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: SecJev-тің ортақ шешім қабылдау жолы және қауіпсіздікке бейімделуі. Дереккөз аннотациялары мен нақты саясаттар сұраныстар мен мақсаттарды қамтамасыз етеді. Қабатты &lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt; адаптерлері бар бірыңғай магистральдық желі (backbone) шешім маркерлері мен соңғы кандидаттардың күйін қалыптастырады; көрсеткіш басы (pointer head) типтелген шығыс деректерін алу үшін кандидаттарға баға береді. Тұтас сызықтар оқыту және қорытындылау кезінде есептеулердің тікелей таралуын білдіреді. Сұр түсті пунктирлі сызықтар сахна салмағын ескеретін кросс-энтропия үшін эталондық белгілер мен логиттерді береді; маржан түсті пунктирлі сызықтар тек LoRA мен бас бөлігін жаңартады, ал магистральдық желі өзгеріссіз қалады. Жалпы шешімдерді инитиализациялау 0.8B/4B/9B үшін ресми Kev модельдерін және біздің алдын ала оқытылған 2B моделімізді пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Зерттеушілер киберқауіпсіздік саласында шешім қабылдауға арналған SecJev модельдер отбасын ұсынды. Кәдімгі чат-боттардан айырмашылығы, бұл жүйелер нақты саясаттар мен деректерге сүйене отырып, жүйеленген жауаптар береді. Жүйе желілік трафикті талдаудан бастап, промпт-инъекцияларды анықтауға дейінгі тапсырмаларда жоғары тиімділік көрсетті.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SecJev-0.8B жалпы Kev-9B моделінен 20.51%-ға дәлірек жұмыс істейді.&lt;/li&gt;\n&lt;li&gt;Деректер базасы 14 қауіпсіздік тапсырмасын қамтиды.&lt;/li&gt;\n&lt;li&gt;LoRA-адаптерлер арқылы тиімді бейімделу қамтамасыз етіледі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;SecJev күрделі бақылауларды құрылымдық шешімдерге айналдыратын «System One» архитектурасын қолданады. 0.8B-ден 9B параметрге дейінгі модельдер 170 185 сұрақтан тұратын &lt;a href=\"concepts/secjev-corpus.html\"&gt;SecJev-Corpus&lt;/a&gt; базасында оқытылды. Бұл базаға желілік трафик, аутентификация логтары және көлік жүйелерінің хабарламалары кіреді. «Сценарий бойынша салмақты оқыту» әдісі әртүрлі домендерге бейімделуге мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Негізінде үміткерлерді бір кезеңде бағалау жүйесі жатыр, ол логикалық және таңдаулы жауаптар үшін ықтималдықты есептейді. Негізгі архитектура өзгеріссіз қалып, қауіпсіздік тапсырмалары үшін LoRA-адаптерлер (Low-Rank Adaptation) арқылы бейімделеді. Сынақтарда SecJev-0.8B жалпы Kev-9B моделінен макро-дәлдік бойынша 20.51 пайызға озып шықты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелердің дәлдігі бастапқы деректер сапасына байланысты және трафик түрлеріне қарай қате сигналдар беруі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қауіпсіздік процестерін автоматтандыру күрделі бақылаулар мен нақты саясаттарды шешімдерге айналдыра алатын модельдерді талап етеді. Авторлар қауіпсіздік міндеттеріне бейімделген, 0,8 млрд-тан 9 млрд-қа дейінгі параметрлері бар SecJev модельдер отбасын ұсынады. Архитектура Kev бір өтімді үміткерлер скореріне (&lt;a href=\"concepts/single-pass-candidate-scorer.html\"&gt;single-pass candidate scorer&lt;/a&gt;) негізделген, бұл модельге мәтіндік деректер, телеметрия және бақылаулар тарихы негізінде логикалық (бульдік), таңдаулы және реттелген шешімдерді қабылдауды үйренуге мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бір өтімді скорер (single-pass candidate scorer) — бұл модель деректерді өңдеудің бір циклінде шешім нұсқаларын бағалайтын әдіс, ол көп сатылы генеративті процестерге қарағанда жүйе жылдамдығын айтарлықтай арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдерді оқыту және бағалау үшін сегіз дереккөзден 14 түрлі міндетті біріктіретін SecJev-Corpus әзірленді. Жинаққа талдау құралдарының нәтижелері, желілік трафик, федеративті жаңартулар, аутентификация деректері және көлік жүйелерінің хабарламалары енгізілді. Сценарий бойынша салмақты оқыту (&lt;a href=\"concepts/scene-weighted-training.html\"&gt;scene-weighted training&lt;/a&gt;) модельдерді әр саланың ерекшеліктеріне бейімдеуге және сонымен бірге шешім қабылдаудың бірыңғай интерфейсін сақтауға мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қауіпсіздік міндеттеріне мамандану отбасындағы барлық модельдердің тиімділігін арттырды: SecJev-0,8B жалпы Kev-9B моделінен міндеттердің макро-дәлдігі бойынша 20,51 пайыздық тармаққа озып түсті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Генеративті дәл баптау (generative fine-tuning) әдістерімен салыстыру &lt;a href=\"concepts/inferens.html\"&gt;инференс&lt;/a&gt; кезінде жедел жадты азырақ пайдалана отырып, ұқсас дәлдік пен кідірісті көрсетті. Жаңа дереккөздер топтарында жүргізілген тестілер SecJev-тің промпт-инъекцияларды сүзу және трафикті талдау міндеттеріндегі артықшылығын растады. Авторлар модельдің кіріс деректер түріне байланысты жалған дабылдарға (false alarms) бейім екенін атап өтеді. Адаптерлер, шешім қабылдау блоктары, деректер корпусы және бағдарламалық код ашық қолжетімділікке шығарылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу архитектураны қолданбалы сынау болып табылады; нәтижелер оқу таңдамасының (SecJev-Corpus) сапасына байланысты және нақты жалған дабылдар нақты пайдалану жағдайында қосымша талдауды талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Қауіпсіздік жұмыс процестері күрделі бақылауларды шешімдерге айналдырады: түпнұсқалықты тексеруден бастап дауыс беру дәлелдерін бағалауға дейін. Jev модельдері (2026 жылы ұсынылған) тікелей типтелген шешімдер мен ықтималдықтарды қайтарады. Бұл жұмыста SecJev — қауіпсіздік міндеттері үшін мамандандырылған модельдер тобы (0,8 млрд, 2 млрд, 4 млрд және 9 млрд параметрлі) ұсынылады. Олар адаптерлер мен шешім қабылдау блогы (decision head) арқылы оқытылған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SecJev — қауіпсіздік саласындағы алғашқы модель, ол 9 млрд параметрлі көлемімен жалпы Kev модельдерінен 20,51 пайыздық тармаққа артық нәтиже көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оқыту үшін 170 185 сұрақтан тұратын SecJev-Corpus корпусы құрылды. Ол желілік трафикті, федеративті оқытуды, аутентификацияны және көлік құралдарының хабарламаларын қамтиды. Модель Boolean, choice және ordered жауап түрлерін қолдайды.&lt;/p&gt;\n&lt;h4 id=\"khatysty-zhumystar\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#khatysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қатысты жұмыстар&lt;/span&gt;&lt;/a&gt;Қатысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;Қолданыстағы тәсілдер (мысалы, CyberBench, SecBench) тілдік модельдерді мамандандырылған баптауға бағытталған. SecJev Jev архитектурасын LoRA (low-rank adaptation) және сенімділікті бағалау үшін температураны &lt;a href=\"concepts/masshtabirovanie.html\"&gt;масштабтау&lt;/a&gt; арқылы дамытады. Генеративті модельдерден айырмашылығы, SecJev бірыңғай өтулі (single-pass) кандидаттар скорерін пайдаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LoRA — нейрондық желілерді тиімді баптау әдісі, мұнда модельдің барлық параметрлері емес, тек шағын қосымша қабаттар оқытылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sheshim-khabyldau-interfejsi\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#sheshim-khabyldau-interfejsi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шешім қабылдау интерфейсі&lt;/span&gt;&lt;/a&gt;Шешім қабылдау интерфейсі&lt;/h4&gt;\n&lt;p&gt;Сцена s күйінен (мәтін, телеметрия немесе бақылау тарихы) және бір немесе бірнеше сұрақтан тұрады. Әр сұрақ q нұсқаулығын және C кандидаттар жиынын қамтиды. Жүйе сұраныстарды тәуелсіз себеп-салдарлық жолдар ретінде өңдейді.&lt;/p&gt;\n&lt;h4 id=\"bir-oetu-arkhyly-kandidattardy-baghalau\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#bir-oetu-arkhyly-kandidattardy-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бір өту арқылы кандидаттарды бағалау&lt;/span&gt;&lt;/a&gt;Бір өту арқылы кандидаттарды бағалау&lt;/h4&gt;\n&lt;p&gt;Шешім қабылдау үшін h_d (шешім маркеріндегі) және h_k (кандидат k соңындағы) жасырын күйлер пайдаланылады. Олар d_p = 256 өлшемді кеңістікке проекцияланады. Кандидаттың ықтималдығы p(c_k/ s, q, C) скалярлық көбейтіндінің экспонентасы арқылы есептеледі. Авторегрессивті токен генерациясы қолданылмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шектеу: әдістің дәлдігі кандидаттар сипаттамасы мен кіріс деректер құрылымына тікелей байланысты, себебі модель мәтін генерацияламайды, тек ұсынылған нұсқалардан таңдайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khauipsizdik-adaptaciyasy\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#khauipsizdik-adaptaciyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қауіпсіздік адаптациясы&lt;/span&gt;&lt;/a&gt;Қауіпсіздік адаптациясы&lt;/h4&gt;\n&lt;p&gt;0.8B, 4B және 9B модельдері бұрын шығарылған Kev адаптерлері мен басты бөліктерін пайдаланады. 2B моделі алдымен Qwen3.5-2B-Base базасында Kev деректерімен және күндер бойынша логикалық пайымдауларды қамтитын қосымшалармен оқытылады. Барлық төрт модель үш эпохалық қауіпсіздік тренингінен өтеді. Негізгі архитектура қатырылған, 16-рангті LoRA адаптерлері (масштабтау коэффициенті 32, dropout 0.05) және pointer-head оқытылады. Адаптерлер назар аудару механизмдерін, feed-forward және DeltaNet проекцияларын қамтиды. Әрбір қауіпсіздік сұрағы әр эпохада бір реттен беріледі. Сценарийлерді теңестіру үшін 1/m_i салмақ коэффициенті қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қауіпсіздік бойынша оқыту үш эпоха ішінде LoRA адаптерлері арқылы жүзеге асырылады, бұл негізгі модель параметрлерін өзгертпей бейімделуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Барлық шығыс түрлері үшін қосымша реттік қашықтық жоғалуынсыз үміткерлердің кросс-энтропиясы қолданылады. Калибрлеу үшін бөлек жиынтықты пайдаланып, теріс лог-ықтималдықты (NLL) минимизациялау арқылы скалярлы температура таңдалады.&lt;/p&gt;\n&lt;h4 id=\"secjev-corpus\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#secjev-corpus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SecJev-Corpus&lt;/span&gt;&lt;/a&gt;SecJev-Corpus&lt;/h4&gt;\n&lt;p&gt;SecJev-Corpus 115 324 сценарий мен сегіз дереккөзден алынған 170 185 сұрақты қамтиды (1-кесте). Олардың ішінде 137 067-сі логикалық (Boolean), 25 721-і таңдаулы және 7 397-сі реттелген сұрақтар. Тапсырмалар дереккөз аннотацияларын болжауға және ережелер негізінде саясатты бағалауға бағытталған.&lt;/p&gt;\n&lt;h4 id=\"tapsyrmalardy-khurastyru\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#tapsyrmalardy-khurastyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тапсырмаларды құрастыру&lt;/span&gt;&lt;/a&gt;Тапсырмаларды құрастыру&lt;/h4&gt;\n&lt;p&gt;AgentDojo тапсырмалары инъекцияларды анықтауды талап етеді. Трафик және көлік құралдары бойынша тапсырмалар (CICIoT2023, ToN-IoT, VeReMi) телеметрия негізінде шабуыл немесе манипуляция белгілерін болжайды. &lt;a href=\"concepts/byzantine-fault-tolerance.html\"&gt;ByzFL&lt;/a&gt; тәжірибелерінде (80 MNIST тәжірибесі) зиянды клиент жаңартуларын анықтау үйретіледі. LANL тапсырмалары 300 секундтық тарих негізінде жүйеге кіру саясатын бағалайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ByzFL (Byzantine Fault Tolerance) — жүйенің жекелеген түйіндеріндегі ақауларға немесе зиянды әрекеттерге төзімділігін қамтамасыз ету әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"derekterdi-boelu-zhaene-sapany-bakhylau\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#derekterdi-boelu-zhaene-sapany-bakhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректерді бөлу және сапаны бақылау&lt;/span&gt;&lt;/a&gt;Деректерді бөлу және сапаны бақылау&lt;/h4&gt;\n&lt;p&gt;Деректер оқыту, калибрлеу, дамыту және тест жиынтықтарына бөлінген (2-кесте). Бір сценарийге қатысты сұрақтар әрқашан бір топта қалады. Сапаны бақылау үшін 37 490 сұрақ тәуелсіз қайта есептелді. Барлық кіріс деректері 8192 токен лимитіне сыяды. Сыныптар үлесіндегі айырмашылық 8,58 пайыздық пункттен аспайды.&lt;/p&gt;\n&lt;h4 id=\"taezhiribeler\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#taezhiribeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тәжірибелер&lt;/span&gt;&lt;/a&gt;Тәжірибелер&lt;/h4&gt;\n&lt;p&gt;Бағалау қауіпсіздік мүмкіндіктерін, дәлдікті, генерациялау шығындарын және тиісті дереккөздерге дағдыларды көшіру мүмкіндігін қамтиды. Талдау инициализацияға, семантикалық сәйкестікке және шешім қабылдау қағидаттарын сақтауға бағытталған.&lt;/p&gt;\n&lt;h4 id=\"eksperimenttik-khondyrghy\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#eksperimenttik-khondyrghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименттік қондырғы&lt;/span&gt;&lt;/a&gt;Эксперименттік қондырғы&lt;/h4&gt;\n&lt;p&gt;Бағалау үшін қауіпсіздік бойынша 21 634 тест сұрағы қолданылады. Үш метрика қолданылады: тапсырмалар бойынша макро-дәлдік (әр тапсырмаға тең салмақ), микро-дәлдік (әр сұрақтың салмағы) және теңдестірілген макро-дәлдік (тапсырмалар ішіндегі сыныптар бойынша орташа көрсеткіш). Барлық жағдайда ықтималдығы ең жоғары үміткер таңдалады. Базалық деңгей (baseline) әр тапсырма үшін оқу жиынтығындағы ең жиі кездесетін семантикалық сыныпты таңдау арқылы анықталады. 95% сенімділік интервалдары дереккөздер бойынша стратификацияланған бутстрап әдісімен (2000 итерация) есептеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-butstrepa.html\"&gt;Бутстрап әдісі&lt;/a&gt; — бұл деректердің бастапқы жиынтығынан қайта таңдау арқылы бағалау дәлдігін тексеру үшін қолданылатын статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қауіпсіздік бойынша бейімделу AdamW оптимизаторы және LoRA (ранг 16) әдісі арқылы орындалады. Оқытудың ең жоғары жылдамдығы бірінші дәуір үшін 2 × 10⁻⁵ және келесілері үшін 10⁻⁵ құрайды, тиімді пакет көлемі 128 және 192. 0,8B, 2B және 4B модельдері үшін FP32, 9B үшін BF16 дәлдігі қолданылады. Адаптерлер мен шығыс қабаттары барлық жағдайда FP32 форматында жұмыс істейді.&lt;/p&gt;\n&lt;h4 id=\"khauipsizdik-bojynsha-mamandanu-zhaene-model-koelemi\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#khauipsizdik-bojynsha-mamandanu-zhaene-model-koelemi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қауіпсіздік бойынша мамандану және модель көлемі&lt;/span&gt;&lt;/a&gt;Қауіпсіздік бойынша мамандану және модель көлемі&lt;/h4&gt;\n&lt;p&gt;3-кесте маманданудан кейінгі өнімділіктің өсуін көрсетеді. Бейімделу барлық модельдер үшін нәтижелерді жақсартады. Макро-дәлдіктің өсуі 0,8B, 2B, 4B және 9B модельдері үшін сәйкесінше 39,40; 40,83; 26,63 және 24,26 пайыздық тармақты құрайды. Барлық өсу интервалдары нөлді қамтымайды; 4B моделі үшін интервал [18,59; 30,75] құрайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мамандану макро-дәлдікті 24,26–40,83 пайыздық тармаққа арттырады, бұл ретте 4B моделі ең үздік көрсеткіштерді (94,51% макро-дәлдік) көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SecJev-0,8B моделі Kev-9B базалық моделінен 20,51 пайыздық тармаққа озып, параметрлер санының шамамен 1/11 бөлігін ғана пайдаланады. Ең үздік нәтижелерді 4B моделі көрсетеді (макро-дәлдік 94,51%, теңдестірілген макро-дәлдік 92,42%). Құралдарды талдау тапсырмаларында 4B моделінің дәлдігі 63,38%-дан 99,30%-ға дейін, дереккөздерді сыныптауда 50,53%-дан 85,19%-ға дейін және нақты саясаттар негізіндегі тапсырмаларда 84,58%-дан 99,87%-ға дейін өседі. Саясаттардағы жоғары көрсеткіштер модельдердің белгіленген ережелерді қолда бар деректерге қолдану қабілеті бар екенін көрсетеді. Дегенмен, VeReMi тапсырмалары күрделі күйінде қалып, 72%-дан төмен дәлдікті көрсетуде.&lt;/p&gt;\n&lt;h4 id=\"baskha-sheshim-khabyldau-interfejsterimen-salystyru\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#baskha-sheshim-khabyldau-interfejsterimen-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа шешім қабылдау интерфейстерімен салыстыру&lt;/span&gt;&lt;/a&gt;Басқа шешім қабылдау интерфейстерімен салыстыру&lt;/h4&gt;\n&lt;p&gt;Авторлар ұсынылған әдістің тиімділігін Qwen3.5 базасындағы генеративті оқытумен (&lt;a href=\"concepts/sft.html\"&gt;SFT&lt;/a&gt;) салыстырады. Негізгі модель LoRA (ранг 16), сахналарды салмақтау және үш дәуірлік оқыту циклін пайдаланады. Балама ретінде скалярлы классификатор (0,8B үшін) және Kev инициализациясынсыз үміткерлерді бағалайтын тікелей көрсеткіш (direct-Qwen pointer) әдістері қарастырылады. Сынақтар бір RTX 3090 видеокартасында өткізілді, мұнда негізгі есептеулер үшін BF16, ал адаптерлер мен бас бөліктер үшін FP32 дәлдігі пайдаланылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — нейрондық желіні нақты тапсырмаларды орындау үшін белгіленген деректер негізінде қайта оқыту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өнімділікті бағалау үшін бір сұранысты өңдеудегі кідіріс (latency), өткізу қабілеті (Q/s) және жадты тұтыну шыңы өлшенді. Қысқа кіріс деректері 512 токенмен, ал ұзындары 2048-ден 8192 токенге дейін шектелген. FP32 дәлдігінде генеративті SFT 90,02% (0,8B) және 94,35% (4B) дәлдікке жетеді, ал SecJev сәйкесінше 90,34% және 94,51% нәтиже көрсетеді. Кластар теңгерілген тапсырмаларда да SecJev басымдық танытады (0,8B үшін SFT-тің 87,79%-ына қарсы 88,00%).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SecJev генеративті әдістерден дәлдік бойынша озып түседі және сонымен бірге жад шығынын азайтады (0,8B үшін 3,52-ден 2,56 GiB-қа дейін және 4B үшін 12,58-ден 10,18 GiB-қа дейін).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жылдамдықты талдау SecJev-тің генеративті тәсілден жылдамырақ жұмыс істейтінін көрсетті: қысқа және ұзын тізбектерді өңдеудегі кідіріс модель көлеміне қарай 2–7%-ға төменірек. Сонымен қатар, SecJev салыстырмалы өткізу қабілетін (0,8B үшін 4,33 сұрақ/с) қамтамасыз етеді. Әртүрлі деректер жиынтығы (AgentDojo, CICIoT2023, LANL және т.б.) бойынша егжей-тегжейлі нәтижелер кестелерде келтірілген, онда SecJev базалық инициализация әдістеріне қарағанда тұрақты жоғары макро-дәлдік көрсеткіштерін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"khauipsizdik-bojynsha-tuystas-derekterge-koeshu\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#khauipsizdik-bojynsha-tuystas-derekterge-koeshu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қауіпсіздік бойынша туыстас деректерге көшу&lt;/span&gt;&lt;/a&gt;Қауіпсіздік бойынша туыстас деректерге көшу&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер модельдердің жаңа тапсырмаларға бейімделу қабілетін сынады: инъекцияларды анықтау және сенім шекаралары (BIPIA) мен желілік қосылымдарды сәйкестендіру (IoT-23). BIPIA үшін 150 контекст бойынша 600 сұрақ, IoT-23 үшін төрт жаңа таңдамадан 1000 қосылым қолданылды. SecJev-4B/9B модельдері Kev және генеративті базалық шешімдермен салыстырылды. SecJev-4B BIPIA бойынша 72,00% дәлдік көрсетіп, Kev (50,17%) және генеративті модельден (54,33%) озып түсті. IoT-23 тапсырмаларында SecJev-4B дәлдігі 65,10% (Kev үшін 50,00%) болды, бұл ретте SecJev жоғары толықтықты (&lt;a href=\"concepts/recall.html\"&gt;recall&lt;/a&gt;) — 96,60% көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SecJev-4B жаңа деректер жиынына көшу кезінде Kev модельдері мен генеративті аналогтарға қарағанда жоғары дәлдік пен толықтықты көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Толықтық (recall) — модельдің барлық тиісті жағдайларды (мысалы, барлық шабуылдарды) табу қабілеті, ал FPR (&lt;a href=\"concepts/false-positive-rate.html\"&gt;false positive rate&lt;/a&gt;) — қате оң нәтижелердің үлесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"surakhtar-mazmuny-zhaene-zhauap-nuskhalarynyng-reti\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#surakhtar-mazmuny-zhaene-zhauap-nuskhalarynyng-reti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сұрақтар мазмұны және жауап нұсқаларының реті&lt;/span&gt;&lt;/a&gt;Сұрақтар мазмұны және жауап нұсқаларының реті&lt;/h4&gt;\n&lt;p&gt;Авторлар модельдердің сұрақтарды қайта тұжырымдауға (парафраз) және жауап нұсқаларының ретін өзгертуге қатысты тұрақтылығын бағалады. Бес тапсырма үшін 1400 парафраз жасалған сұрақтар жұбы және 500 реті өзгертілген жауаптар жұбы қолданылды. Парафраз жасау кезінде дәлдік 0,07–0,93 пайыздық тармаққа, ал нұсқалардың ретін өзгерту кезінде −0,80-ден +0,40 тармаққа дейін өзгерді. Жауаптардың сәйкестігі (модельдің бастапқы және өзгертілген сұраққа бірдей жауап беру үлесі) парафраздар үшін 95,36–98,36%, ал орын ауыстырулар үшін 97,40–98,80% құрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдер сұрақ пішіні өзгерген кезде де жоғары тұрақтылықты сақтайды, дегенмен қорытынды дәлдікте шамалы ауытқулар байқалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sheshimderdi-zhalpy-inicializaciyalaudyng-khundylyghy\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#sheshimderdi-zhalpy-inicializaciyalaudyng-khundylyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шешімдерді жалпы инициализациялаудың құндылығы&lt;/span&gt;&lt;/a&gt;Шешімдерді жалпы инициализациялаудың құндылығы&lt;/h4&gt;\n&lt;p&gt;0,8B моделін Kev адаптерлері арқылы оқыту және Qwen3.5 базасында «нөлден» оқыту тиімділігі салыстырылды. Kev арқылы инициализация 90,34% дәлдікке жетуге мүмкіндік берді (тікелей оқытуда 88,17%). Жалпы өсім 2,17 пайыздық тармақты құрағанымен, тиімділік тапсырма түріне байланысты: тікелей оқыту жаңартулар классификациясы мен шекаралық әрекеттерде жақсы нәтиже береді, ал Kev инициализациясы көлік құралдарына қатысты манипуляцияларды талдауда тиімдірек.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер шектеулі оқыту бюджеті (үш кезең) аясында алынған, бұл модельдердің ұзақ мерзімді конвергенциясын бағалауды шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhalpy-khabiletterding-sakhtaluy-zhaene-senimdilik\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#zhalpy-khabiletterding-sakhtaluy-zhaene-senimdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалпы қабілеттердің сақталуы және сенімділік&lt;/span&gt;&lt;/a&gt;Жалпы қабілеттердің сақталуы және сенімділік&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер Kev жиынтықтарын пайдалана отырып, модель қауіпсіздік бойынша оқытылғаннан кейін өз дағдыларын қаншалықты сақтайтынын бағалады (8-кесте). Жалпы шешімдер тесттері оқу таңдамасынан шығарылған мысалдарды, ал білім көшіру (transfer) тесттері жаңа дереккөздер мен ереже түрлерін қамтыды. Жалпы шешім қабылдау дәлдігі ең көбі 0,50 пайыздық тармаққа өзгерді. 0,8B моделі үшін білім көшіру көрсеткіші 68,45%-дан 66,01%-ға дейін төмендеді, ал үлкенірек модельдерде өзгерістер 0,46 тармақтан аспады. 0,8B моделі үшін 95% сенім аралығы [−4,73, −0,15] болды, ал қалған модельдерде аралықтар нөлді қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қауіпсіздік бойынша оқыту модельдің жалпы дағдыларына елеулі әсер етпейді, тек ең ықшам (0,8B) модельде білім көшіру дәлдігі сәл төмендейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Интерфейс ықтималдықтарды қайтаратындықтан, авторлар модель сенімділігінің сапасын талдады. Температураны масштабтау (temperature scaling) барлық өлшемдегі модельдер үшін теріс логарифмдік ықтималдық (NLL) көрсеткішін жақсартты (9-кесте), алайда Brier балы мен күтілетін калибрлеу қатесі (ECE) нашарлады. Мысалы, 9B моделі үшін NLL мәні 0,364-тен 0,355-ке дейін төмендеді, ал ECE 1,53%-дан 2,48%-ға дейін өсті. Бұл оңтайландырудың дәл NLL метрикасы бойынша жүргізілгенімен түсіндіріледі. Қауіпсіздік бойынша белгіленген температураны пайдалану жалпы тест жиынтықтарында көрсеткіштерді жақсартты, бірақ сенімділік сапасын бастапқы деңгейге толық қайтармады.&lt;/p&gt;\n&lt;h4 id=\"derekterding-zharamdylyghy-zhaene-khatelik-tuerleri\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#derekterding-zharamdylyghy-zhaene-khatelik-tuerleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деректердің жарамдылығы және қателік түрлері&lt;/span&gt;&lt;/a&gt;Деректердің жарамдылығы және қателік түрлері&lt;/h4&gt;\n&lt;p&gt;170 185 сұрақты тексеру схемада немесе кандидаттық белгілерде бұзушылықтарды анықтамады. Саясаттар негізінде 37 490 жауапты қайта есептеу бастапқы деректермен толық сәйкес келді. Екі тәуелсіз сарапшы 280 сұрақты (әр тапсырма үшін 20-дан) бағалап, 261 жағдайда (93,21%) келісімге келді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Brier балы мен ECE модель болжаған ықтималдықтың оқиғаның нақты жиілігіне қаншалықты сәйкес келетінін өлшейді; бұл көрсеткіштер неғұрлым төмен болса, модель соғұрлым жақсы калибрленген болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сарапшылар құралдар мен нақты саясаттарға қатысты барлық 180 сұрақта корпус белгілерімен толық сәйкес келді. Дереккөздерге негізделген 100 сұрақта сарапшылар 81 жауапта келісіп, 28 жағдайда қолда бар дәлелдерді жеткілікті деп тапты. Бұл қадағалаудың түсініктілігін растайды, алайда негізгі белгісіздік дереккөз аннотацияларын ішінара бақылаулар негізінде шығару кезінде туындайтынын көрсетеді.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;SecJev қауіпсіздік саласындағы сараптамалық білімді System One шешім қабылдау модельдеріне бірыңғай интерфейсі бар төрт модель арқылы интеграциялайды. 14 тапсырма бойынша оқыту әрбір модельдің тиімділігін арттырып, SecJev-0.8B моделіне жалпы Kev-9B моделінен озып кетуге мүмкіндік берді. Модельдер тобы дереккөз белгілерін болжау мен нақты саясаттарды бағалауды біріктіреді, жауап генерациясының дәлдігі бойынша ұқсас нәтижелерді аз жады шығынымен қамтамасыз етеді және дағдыларды жаңа дереккөз топтарына сәтті тасымалдайды. Жалпы деректер негізінде инициализация 0.8B моделінің қауіпсіздікке қатысты оқытудан тыс көрсеткіштерін де жақсартты. Сұрақ шарттарын ескере отырып бағалау модельге бірдей дәлелдер бойынша әртүрлі пайымдар жасауға мүмкіндік береді. SecJev-Corpus бұл пайымдарды дереккөз аннотациялары мен саясат ережелерімен байланыстырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SecJev-0.8B моделі қауіпсіздік тапсырмаларында Kev-9B-ден озып, аз жады шығынымен жоғары дәлдікті көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h4&gt;\n&lt;p&gt;SecJev ұсынылған бақылаулар негізінде түпкілікті шешімдерді бағалайды. Қамту және эксперимент аннотациялары енгізілген ақпараттан тыс деректерге байланысты болуы мүмкін, сондықтан бұл тапсырмалар дереккөз белгілерін болжауды өлшейді. Саясат тапсырмалары көрсетілген ереженің қолданылуын бағалайды. Шабуылдардың алдын алу және автономды жауап қайтару бөлек орналастыру бағасын талап етеді. 14 тапсырма әртүрлі қиындық деңгейіне ие: саясат бойынша көрсеткіштер дерлік мінсіз, ал көлік құралдары хабарламаларының дәлдігі төменірек. Тапсырмалар бойынша макро-орташа мәндер оларды тең салмақта есептейді. Топ шекаралары өзіндік тәуелділіктерді ескереді, алайда қалдық семантикалық қиылысу және сыналған дереккөздерден тыс тасымалдау ашық мәселе болып қала береді. Адам тексеруі дереккөз белгілері тапсырмаларында келіспеушіліктерді анықтады, мұнда телеметрия толық емес дәлелдерді береді. Негізгі дәлдік нәтижелері кіші модельдер үшін FP32, ал 9B үшін BF16 форматын пайдаланады; тиімділікті салыстыру бірдей дәлдікте өткізілді. Әрбір оқыту шарты бір кезеңде орындалды, кездейсоқ тұқымдардың (seeds) өзгермелілігі өлшенбеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдер автономды қорғаныс жүйелері емес: олар деректерді бағалайды, бірақ сын сәттерде адам бақылауын алмастырмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"etikalykh-tuzhyrymdar\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#etikalykh-tuzhyrymdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Этикалық тұжырымдар&lt;/span&gt;&lt;/a&gt;Этикалық тұжырымдар&lt;/h4&gt;\n&lt;p&gt;Корпус шабуылдар сипатталған мәтіндер мен қауіпсіздік бақылауларын қорғаныс шешімдерін зерттеу үшін қамтиды. Жергілікті лақап аттар идентификаторларды азайта отырып, сахна ішіндегі байланыстарды сақтайды. Біз барлық деректерге жалпы рұқсат беретін лицензия берудің орнына, дереккөз атрибуциясы мен деректерді пайдаланудың арнайы шарттарын сақтаймыз. Модель болжамдары мен калибрленген ықтималдықтар, әсіресе деректер толық болмағанда, қате болуы мүмкін; салдары бар әрекеттер арнайы саясат пен бағалауды талап етеді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo-f1.jpg\" alt=\"1-сурет: SecJev-тің ортақ шешім қабылдау жолы және қауіпсіздікке бейімделуі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: SecJev-тің ортақ шешім қабылдау жолы және қауіпсіздікке бейімделуі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: SecJev-тің ортақ шешім қабылдау жолы және қауіпсіздікке бейімделуі. Дереккөз аннотациялары мен нақты саясаттар сұраныстар мен мақсаттарды қамтамасыз етеді. Қабатты LoRA адаптерлері бар бірыңғай магистральдық желі (backbone) шешім маркерлері мен соңғы кандидаттардың күйін қалыптастырады; көрсеткіш басы (pointer head) типтелген шығыс деректерін алу үшін кандидаттарға баға береді. Тұтас сызықтар оқыту және қорытындылау кезінде есептеулердің тікелей таралуын білдіреді. Сұр түсті пунктирлі сызықтар сахна салмағын ескеретін кросс-энтропия үшін эталондық белгілер мен логиттерді береді; маржан түсті пунктирлі сызықтар тек LoRA мен бас бөлігін жаңартады, ал магистральдық желі өзгеріссіз қалады. Жалпы шешімдерді инитиализациялау 0.8B/4B/9B үшін ресми Kev модельдерін және біздің алдын ала оқытылған 2B моделімізді пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қауіптерді&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;талдауды&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;автоматтандыру&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SecJev&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельдерін&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оқыту&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дәлдіктің 20&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пайызға өсуі&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;киберқауіпсізд&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ікке арналған &lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мамандандырылғ&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ан инт&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;tooling&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Zheng Chen, Fei Yu, Haohao Huang, Yang Li, Anlong Chen, Lei Chen&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org
