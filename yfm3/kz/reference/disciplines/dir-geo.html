            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Геоинформатика и дистанционное зондирование Земли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;XX век (развитие спутниковых технологий)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Спектральный анализ, компьютерное зрение, ГИС-моделирование&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Remote Sensing, ISPRS Journal of Photogrammetry and Remote Sensing&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-geo.html\"&gt;Спутниктер және геодеректер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"neni-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#neni-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нені зерттейді&lt;/span&gt;&lt;/a&gt;Нені зерттейді&lt;/h2&gt;\n&lt;p&gt;Жерсеріктер мен геодеректер — бұл орбиталық аппараттар мен жерүсті сенсорларынан алынған кеңістіктік ақпаратты жинау, өңдеу және талдау әдістерін зерттейтін ғылыми бағыт. Зерттеу объектісі — жер беті және ондағы процестер, олар растрлық кескіндер, векторлық карталар және метадеректер түрінде ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"tarihy-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#tarihy-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Бағыттың дамуы аналогтық аэрофототүсірілімнен цифрлық қашықтықтан зондтауға көшумен байланысты. Негізгі кезең — жоғары ажыратымдылықтағы жерсеріктік түсірілімдердің қолжетімділігі және геоақпараттық жүйелердің (ГАЖ) дамуы. Соңғы жылдардағы маңызды жаңалық — нейрондық желілерді әр аймақ үшін қайта оқытпай-ақ, кемелер немесе ғимараттар сияқты объектілерді автоматты түрде санауға мүмкіндік беретін машиналық оқыту әдістерін енгізу.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Салада екі негізгі тәсіл бар: кескіндерді визуалды интерпретациялауға негізделген сараптамалық талдау және компьютерлік көру алгоритмдерін қолданатын автоматтандырылған тәсіл. Қазіргі зерттеулер «цифрлық егіздерді» жасауға бағытталған, мұнда жасанды интеллект агенттері қалалық ортадағы өзгерістерді жобалайды.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Әдістерге спектрлік талдау, өзгерістерді анықтау (change detection) және кескіндерді сегменттеу жатады. Құралдар жиынтығы растрлық деректерді өңдеу кітапханаларынан, объектілерді классификациялауға арналған нейрондық желі архитектураларынан және ашық картографиялық платформалардан тұрады.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Бұл бағыт кескіндер бойынша геолокациямен тығыз байланысты. Ол OpenStreetMap-пен өзара әрекеттесіп, жерсеріктік түсірілімдерді тексеру үшін краудсорсингтік деректерді пайдаланады.&lt;/p&gt;\n&lt;h2 id=\"khajda-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#khajda-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қайда оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Бағытты зерттеу үшін «Геоинформатика», «Жерді қашықтықтан зондтау» және «Деректерді талдау» мамандықтары бойынша академиялық бағдарламалар қолайлы. ГАЖ пакеттері мен машиналық оқыту кітапханалары бойынша курстар арқылы базалық білім алуға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D1%83%D1%82%D0%BD%D0%B8%D0%BA_(%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Спутник (поисковая система) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-14-7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GSVA: gene set variation analysis for microarray and RNA-seq data&lt;/a&gt; — шолу, BMC Bioinformatics 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-14-128\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Enrichr: interactive and collaborative HTML5 gene list enrichment analysis tool&lt;/a&gt; — шолу, BMC Bioinformatics 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/jcc.21287\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CHARMM: the biomolecular simulation program&lt;/a&gt; — шолу, J Comput Chem 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что можно узнать из открытых снимков и карт — и как это делают исследователи."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Спутниктер және геодеректер","description":"Что можно узнать из открытых снимков и карт — и как это делают исследователи.","vcsPath":"reference/disciplines/dir-geo.md"},"headings":[{"title":"Нені зерттейді","href":"reference/disciplines/dir-geo.html#neni-zerttejdi","level":2},{"title":"Тарихы және негізгі жаңалықтар","href":"reference/disciplines/dir-geo.html#tarihy-zhaene-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-geo.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","href":"reference/disciplines/dir-geo.html#aedister-men-khuraldar","level":2},{"title":"Басқа бағыттармен байланысы","href":"reference/disciplines/dir-geo.html#baskha-baghyttarmen-bajlanysy","level":2},{"title":"Қайда оқу және не оқу керек","href":"reference/disciplines/dir-geo.html#khajda-okhu-zhaene-ne-okhu-kerek","level":2},{"title":"Дереккөздер","href":"reference/disciplines/dir-geo.html#derekkoezder","level":2}],"title":"Спутниктер және геодеректер"},"router":{"pathname":"reference/disciplines/dir-geo","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
