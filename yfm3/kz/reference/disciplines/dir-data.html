        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-data.jpg\" alt=\"Ашық деректер\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Информатика, государственное управление, OSINT&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;2000-е годы (развитие сетей данных)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Машиночитаемость, хэширование, сетевой анализ (WGCNA), верификация метаданных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Nucleic Acids Research, BMC Bioinformatics, Cell&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-data.html\"&gt;Ашық деректер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"neni-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#neni-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нені зерттейді&lt;/span&gt;&lt;/a&gt;Нені зерттейді&lt;/h2&gt;\n&lt;p&gt;Ашық деректер (Open Data) — бұл авторлық құқық немесе патенттік шектеулерсіз еркін, машиналық оқылатын түрде пайдалануға және таратуға арналған ақпараттық мән. Бұл бағыт мемлекеттік тізілімдер, сатып алу мұрағаттары және ғылыми есептер сияқты қоғамдық ақпаратты жариялау, стандарттау және талдау қағидаттарын зерттейді.&lt;/p&gt;\n&lt;h2 id=\"tarihy-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#tarihy-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Тұжырымдама басқару мен ғылымдағы ашықтық қажеттілігінен қалыптасты. 2000-жылдары деректер желілерінің дамуы маңызды кезең болды. 2025 жылы NIH ғылыми өтінімдерінен белгілі бір терминдердің алынып тасталуы метадеректерді өзгерту зерттеулердің көрінуіне қалай әсер ететінін көрсетті.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Екі негізгі тәсіл бар: «технократиялық» (машиналық оқылым мен API форматтарына баса назар) және «құқықтық» (лицензиялау мен қолжетімділік шектеулерін алып тастауға баса назар). Ғылымда WGCNA (салмақты корреляциялық желілік талдау) сияқты тәсілдер ашық деректер жиынтығы жасырын заңдылықтарды анықтауға көмектесетінін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Әдіснама деректерді іздеу, жинау, сақтау (тұтастықты бақылау үшін хэштеу) және тексеруді қамтиды. Үлкен массивтермен жұмыс істеу үшін іздеу алгоритмдері (мысалы, BLAST) және желілік талдау пакеттері қолданылады.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Ашық деректер «Мемлекеттік сатып алу», «Ұйымдар тізілімі» және «Соттар мен заңдар» бағыттары үшін іргетас болып табылады. Олар экологиялық мониторинг және веб-мұрағаттаумен тығыз байланысты.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Деректерді талдау (Data Science), OSINT әдістері және ашық мемлекеттік басқару қағидаттары бойынша курстарды оқу ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D1%82%D0%BA%D1%80%D1%8B%D1%82%D1%8B%D0%B5_%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Открытые данные — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:LOD_Cloud_-_2007-09.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Cygri, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — шолу, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0092-8674(04)00045-5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MicroRNAs: genomics, biogenesis, mechanism, and function&lt;/a&gt; — шолу, Cell 2004&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — шолу, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Реестры, закупки, архивы: где лежат открытые данные и как их читать."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ашық деректер","description":"Реестры, закупки, архивы: где лежат открытые данные и как их читать.","vcsPath":"reference/disciplines/dir-data.md"},"headings":[{"title":"Нені зерттейді","href":"reference/disciplines/dir-data.html#neni-zerttejdi","level":2},{"title":"Тарихы және негізгі жаңалықтар","href":"reference/disciplines/dir-data.html#tarihy-zhaene-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-data.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","href":"reference/disciplines/dir-data.html#aedister-men-khuraldar","level":2},{"title":"Басқа бағыттармен байланысы","href":"reference/disciplines/dir-data.html#baskha-baghyttarmen-bajlanysy","level":2},{"title":"Қай жерде оқу және не оқу керек","href":"reference/disciplines/dir-data.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek","level":2},{"title":"Дереккөздер","href":"reference/disciplines/dir-data.html#derekkoezder","level":2}],"title":"Ашық деректер"},"router":{"pathname":"reference/disciplines/dir-data","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
