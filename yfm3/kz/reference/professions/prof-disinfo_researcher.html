        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кәсіптер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;находит скоординированные кампании, ботов и путь нарративов&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-disinfo_researcher.jpg\" alt=\"Исследователь дезинформации\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Немен айналысады&lt;/td&gt;\n&lt;td&gt;находит скоординированные кампании, ботов и путь нарративов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не білу керек&lt;/td&gt;\n&lt;td&gt;сетевой анализ, социальные медиа, статистика&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Білім&lt;/td&gt;\n&lt;td&gt;Социология, политология, компьютерные науки, прикладная математика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қайда жұмыс істейді&lt;/td&gt;\n&lt;td&gt;Академические институты, аналитические центры, IT-компании, фактчекинговые организации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-nets.html\"&gt;Ақпараттық науқандар және желілер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nemen-ajnalysady\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#nemen-ajnalysady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Немен айналысады&lt;/span&gt;&lt;/a&gt;Немен айналысады&lt;/h2&gt;\n&lt;p&gt;Дезинформацияны зерттеуші — цифрлық ортадағы жалған ақпараттың таралуын және үйлестірілген науқандарды талдайтын маман. Бұл мамандық контент ағындарындағы заңдылықтарды анықтауға бағытталған талдау қызметінің бір түрі. Зерттеуші нарративтердің қалай қалыптасатынын, ұсыныс алгоритмдерінің жұмысын және боттар мен пайдаланушылардың бұл процестегі рөлін зерттейді.&lt;/p&gt;\n&lt;h2 id=\"tiptik-mindetter\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#tiptik-mindetter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типтік міндеттер&lt;/span&gt;&lt;/a&gt;Типтік міндеттер&lt;/h2&gt;\n&lt;p&gt;Зерттеушінің негізгі міндеті — фактілерді тексеру және желілік құрылымдарды талдау. Күнделікті жұмысқа ашық дереккөздерден (OSINT) мәліметтер жинау, контенттің таралу статистикасындағы ауытқуларды анықтау және алгоритмдердің шындықты қабылдауға әсерін бағалау кіреді. Зерттеушілер пайдаланушылардың өз назарын қалай шектейтінін («фильтр көпіршіктері») зерттеп, әлеуметтік желілердің шындықты бұрмалауға әсері қаншалықты екенін тексереді.&lt;/p&gt;\n&lt;h2 id=\"daghdylar-men-khuraldar\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#daghdylar-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дағдылар мен құралдар&lt;/span&gt;&lt;/a&gt;Дағдылар мен құралдар&lt;/h2&gt;\n&lt;p&gt;Жұмыс үшін желілік талдау дағдылары, статистика әдістері және үлкен тілдік модельдердің (LLM) жұмыс істеу қағидаларын түсіну қажет. Құралдар жиынтығына графтарды визуализациялау бағдарламалары, әлеуметтік желілерден деректерді жинау (парсинг) құралдары және цифрлық іздерді тексеру әдістері кіреді. Жасанды интеллект модельдерінің адалдығын бағалау үшін арнайы бенчмарктар қолданылады.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-kerek\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#khaj-zherde-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу керек&lt;/h2&gt;\n&lt;p&gt;Мамандық пәнаралық дайындықты талап етеді. Базалық білім әдетте әлеуметтану, саясаттану, компьютерлік ғылымдар немесе қолданбалы математиканы қамтиды. Арнайы дағдылар деректерді талдау әдістерін оқу және зерттеу жобаларына қатысу арқылы игеріледі.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-zhumys-isteu-zhaene-oesu\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#khaj-zherde-zhumys-isteu-zhaene-oesu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде жұмыс істеу және өсу&lt;/span&gt;&lt;/a&gt;Қай жерде жұмыс істеу және өсу&lt;/h2&gt;\n&lt;p&gt;Дезинформацияны зерттеушілер академиялық институттарда, талдау орталықтарында (think tanks), технологиялық компанияларда және тәуелсіз фактчекинг ұйымдарында жұмыс істейді. Мансаптық өсу деректерді жинаудан ақпараттық қауіптерді бағалау әдіснамаларын әзірлеуге көшуді көздейді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9B%D1%83%D0%BA%D1%8C%D1%8F%D0%BD%D0%BE%D0%B2%2C_%D0%A4%D1%91%D0%B4%D0%BE%D1%80_%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%D0%BE%D0%B2%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Лукьянов, Фёдор Александрович — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Fyodor_Lukyanov_2019.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: council.gov.ru, CC BY 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Кәсіптер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"находит скоординированные кампании, ботов и путь нарративов"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Исследователь дезинформации","description":"находит скоординированные кампании, ботов и путь нарративов","vcsPath":"reference/professions/prof-disinfo_researcher.md"},"headings":[{"title":"Немен айналысады","href":"reference/professions/prof-disinfo_researcher.ht
