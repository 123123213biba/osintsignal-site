        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кәсіптер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;ведёт расследование от наводки до проверенной публикации&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Немен айналысады&lt;/td&gt;\n&lt;td&gt;ведёт расследование от наводки до проверенной публикации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не білу керек&lt;/td&gt;\n&lt;td&gt;источники, документы, юридическая проверка, безопасность&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Білім&lt;/td&gt;\n&lt;td&gt;Журналистика, социология, право, политология; курсы по анализу данных и кибербезопасности.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қайда жұмыс істейді&lt;/td&gt;\n&lt;td&gt;Независимые медиа, исследовательские центры (think tanks), некоммерческие организации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-data.html\"&gt;Ашық деректер&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Әдістер және этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nemen-ajnalysady\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#nemen-ajnalysady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Немен айналысады&lt;/span&gt;&lt;/a&gt;Немен айналысады&lt;/h2&gt;\n&lt;p&gt;Зерттеуші журналист — бұл көпшілікке жабық, қоғамдық маңызы бар тақырыптарды жүйелі және ұзақ мерзімді зерттейтін маман. Жаңалықтар журналистикасынан айырмашылығы, зерттеу фактілерді терең тексеруді, бастапқы құжаттармен жұмыс істеуді және жүйелі заңдылықтарды анықтауды талап етеді. Зерттеу процесі деректерді іздеу, оларды верификациялау, байланыстарды талдау және заңдық тексеруден өтетін материал дайындауды қамтиды.&lt;/p&gt;\n&lt;h2 id=\"tiptik-mindetter\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#tiptik-mindetter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типтік міндеттер&lt;/span&gt;&lt;/a&gt;Типтік міндеттер&lt;/h2&gt;\n&lt;p&gt;Зерттеушінің негізгі міндеті — ретсіз деректерді құрылымдалған білім базасына айналдыру. Бұған ашық тізілімдерден ақпарат жинау, әлеуметтік желілерді талдау және түрлі ведомстволардың есептерін салыстыру кіреді. Маман ресми деректердегі сәйкессіздіктерді, мысалы, есептерден зерттеулер жоғалып кеткенде немесе статистика өзгергенде анықтайды. Жұмыста көбінесе OSINT әдістері қолданылады.&lt;/p&gt;\n&lt;h2 id=\"daghdylar-men-khuraldar\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#daghdylar-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дағдылар мен құралдар&lt;/span&gt;&lt;/a&gt;Дағдылар мен құралдар&lt;/h2&gt;\n&lt;p&gt;Жұмыс үшін сыни талдау дағдылары, фактчекинг әдістерін білу және деректермен жұмыс істеу принциптерін түсіну қажет. Құралдар қатарына байланыстар графының талдау бағдарламалары, мәтіндердегі жасырын параметрлерді табу үшін табиғи тілді өңдеу алгоритмдері және цифрлық нысандардың түпнұсқалығын тексеретін құралдар кіреді.&lt;/p&gt;\n&lt;h2 id=\"khajda-okhu-kerek\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#khajda-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда оқу керек&lt;/span&gt;&lt;/a&gt;Қайда оқу керек&lt;/h2&gt;\n&lt;p&gt;Мамандық гуманитарлық ғылымдар немесе құқық саласындағы академиялық дайындықты деректерді талдау бойынша техникалық дағдылармен біріктіруді талап етеді. Базалық білім әдетте журналистика, әлеуметтану немесе саясаттануды қамтиды. Қосымша мамандар ашық деректермен жұмыс істеуді, статистикалық талдауды және киберқауіпсіздік негіздерін меңгереді.&lt;/p&gt;\n&lt;h2 id=\"khajda-zhumys-isteu-zhaene-khalaj-oesu\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#khajda-zhumys-isteu-zhaene-khalaj-oesu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда жұмыс істеу және қалай өсу&lt;/span&gt;&lt;/a&gt;Қайда жұмыс істеу және қалай өсу&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер тәуелсіз бұқаралық ақпарат құралдарында, зерттеу орталықтарында және коммерциялық емес ұйымдарда жұмыс істейді. Мансаптық өсу жекелеген міндеттерді орындаудан заңгерлердің, деректер талдаушыларының және салалық сарапшылардың жұмысын үйлестіруді талап ететін күрделі жобаларды басқаруға көшуді көздейді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%96%D1%83%D1%80%D0%BD%D0%B0%D0%BB%D0%B8%D1%81%D1%82%D1%81%D0%BA%D0%B8%D0%B5_%D1%80%D0%B0%D1%81%D1%81%D0%BB%D0%B5%D0%B4%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Журналистские расследования — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.endeavour.2010.09.005\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Testing sex and gender in sports; reinventing, reimagining and reconstructing histories&lt;/a&gt; — шолу, Endeavour 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/014107680509801110\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Research governance: where did it come from, what does it mean?&lt;/a&gt; — шолу, J R Soc Med 2005&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s00436-024-08167-4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A History of Malaria and Conflict&lt;/a&gt; — шолу, Parasitol Res 2024&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Кәсіптер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"ведёт расследование от наводки до проверенной публикации"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Журналист-расследователь","description":"ведёт расследование от наводки до проверенной публикации","vcsPath":"reference/professions/prof-investigative_journalist.md"},"headings":[{"title":"Немен айналысады","href":"reference/professions/prof-investigative_journalist.html#nemen-ajnalysady","level":2},{"title":"Типтік міндеттер","href":"reference/professions/prof-investigative_journalist.html#tiptik-mindetter","level":2},{"title":"Дағдылар мен құралдар","href":"reference/professions/prof-investigative_journalist.html#daghdylar-men-khuraldar","level":2},{"title":"Қайда оқу керек","href":"reference/professions/prof-investigative_journalist.html#khajda-okhu-kerek","level":2},{"title":"Қайда жұмыс істеу және қалай өсу","href":"reference/professions/prof-investigative_journalist.html#khajda-zhumys-isteu-zhaene-khalaj-oesu","level":2},{"title":"Дереккөздер","href":"reference/professions/prof-investigative_journalist.html#derekkoezder","level":2}],"title":"Журналист-расследователь"},"router":{"pathname":"reference/professions/prof-investigative_journalist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
