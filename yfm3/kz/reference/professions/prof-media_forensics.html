        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кәсіптер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;ищет следы монтажа и генерации в изображениях, видео и аудио&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-media_forensics.jpg\" alt=\"Специалист по медиакриминалистике\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Немен айналысады&lt;/td&gt;\n&lt;td&gt;ищет следы монтажа и генерации в изображениях, видео и аудио&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не білу керек&lt;/td&gt;\n&lt;td&gt;форензика, метаданные, детекторы дипфейков&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Білім&lt;/td&gt;\n&lt;td&gt;Информатика, прикладная математика, информационная безопасность.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қайда жұмыс істейді&lt;/td&gt;\n&lt;td&gt;Правоохранительные органы, фактчекинг-центры, исследовательские лаборатории ИИ.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-verify.html\"&gt;Фактілер мен медианы тексеру&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nemen-ajnalysady\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#nemen-ajnalysady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Немен айналысады&lt;/span&gt;&lt;/a&gt;Немен айналысады&lt;/h2&gt;\n&lt;p&gt;Медиакриминалистика бойынша маман (digital media forensics expert) — бұл цифрлық контенттің түпнұсқалығын анықтау, монтаж немесе нейрондық желілер арқылы жасалған іздерді табумен айналысатын кәсіпқой. Жұмыстың негізі — цифрлық криминалистика (digital forensics), ол цифрлық құрылғылардан деректерді жинау, сақтау және талдауды қамтиды.&lt;/p&gt;\n&lt;h2 id=\"tiptik-mindetter\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#tiptik-mindetter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типтік міндеттер&lt;/span&gt;&lt;/a&gt;Типтік міндеттер&lt;/h2&gt;\n&lt;p&gt;Негізгі міндет — материалдың жасанды шығу тегін көрсететін ауытқуларды іздеу. Бұған файлдың метадеректерін талдау, деректер құрылымының тұтастығын тексеру және дипфейктерге тән қысу немесе қабаттастыру артефактілерін анықтау кіреді. Маман контенттің болжамдылығын да бағалайды: мысалы, нейрондық желілер жасаған мәтіндер адам жазған мәтіндерге қарағанда құрылымы жағынан тым болжамды болып келеді.&lt;/p&gt;\n&lt;h2 id=\"daghdylar-men-khuraldar\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#daghdylar-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дағдылар мен құралдар&lt;/span&gt;&lt;/a&gt;Дағдылар мен құралдар&lt;/h2&gt;\n&lt;p&gt;Жұмыс сигналдарды өңдеу, машиналық оқыту және статистика саласындағы дағдыларды талап етеді. Негізгі құралдарға терең оқытуға негізделген дипфейк детекторлары мен метадеректерді талдау бағдарламалары жатады. Мамандар кескіннің қайнар көзін анықтау үшін белгілерді бөліп алу (feature extraction) әдістерін қолданады.&lt;/p&gt;\n&lt;h2 id=\"khajda-okhu-kerek\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#khajda-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда оқу керек&lt;/span&gt;&lt;/a&gt;Қайда оқу керек&lt;/h2&gt;\n&lt;p&gt;Базалық білім әдетте информатика, қолданбалы математика немесе ақпараттық қауіпсіздікті қамтиды. Мамандандырылған білім кескіндерді өңдеу және терең оқыту әдістері бойынша академиялық шолуларды зерттеу арқылы алынады.&lt;/p&gt;\n&lt;h2 id=\"khajda-zhumys-isteu-zhaene-khalaj-oesu\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#khajda-zhumys-isteu-zhaene-khalaj-oesu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда жұмыс істеу және қалай өсу&lt;/span&gt;&lt;/a&gt;Қайда жұмыс істеу және қалай өсу&lt;/h2&gt;\n&lt;p&gt;Мамандар құқық қорғау органдарында, фактчекингпен айналысатын ірі медиа-холдингтерде және дезинформациядан қорғау жүйелерін әзірлейтін зерттеу орталықтарында сұранысқа ие.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Digital_forensics\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Digital forensics — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:FLETC_Glynco-aerial.gif\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Drug Enforcement Administration (DEA), a United States Department of Justice law enforcement agency, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/s22124556\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Review of Image Processing Techniques for Deepfakes&lt;/a&gt; — шолу, Sensors (Basel) 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/jimaging6030009\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Survey of Deep Learning-Based Source Image Forensics&lt;/a&gt; — шолу, J Imaging 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fdata.2024.1400024\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deepfake: definitions, performance metrics and standards, datasets, and a meta-review&lt;/a&gt; — шолу, Front Big Data 2024&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Кәсіптер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"ищет следы монтажа и генерации в изображениях, видео и аудио"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Специалист по медиакриминалистике","description":"ищет следы монтажа и генерации в изображениях, видео и аудио","vcsPath":"reference/professions/prof-media_forensics.md"},"headings":[{"title":"Немен айналысады","href":"reference/professions/prof-media_forensics.html#nemen-ajnalysady","level":2},{"title":"Типтік міндеттер","href":"reference/professions/prof-media_forensics.html#tiptik-mindetter","level":2},{"title":"Дағдылар мен құралдар","href":"reference/professions/prof-media_forensics.html#daghdylar-men-khuraldar","level":2},{"title":"Қайда оқу керек","href":"reference/professions/prof-media_forensics.html#khajda-okhu-kerek","level":2},{"title":"Қайда жұмыс істеу және қалай өсу","href":"reference/professions/prof-media_forensics.html#khajda-zhumys-isteu-zhaene-khalaj-oesu","level":2},{"title":"Дереккөздер","href":"reference/professions/prof-media_forensics.html#derekkoezder","level":2}],"title":"Специалист по медиакриминалистике"},"router":{"pathname":"reference/professions/prof-media_forensics","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
