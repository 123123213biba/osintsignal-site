        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;17 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/stability-generalization-score.html\"&gt;SGS&lt;/a&gt; — Енгізілген деректер өзгерген кезде модель мінез-құлқының жауаптардың инварианттылық идеалды шартынан ауытқу дәрежесін өлшеу үшін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/geometric-accuracy.html\"&gt;Геометрическая точность&lt;/a&gt; — Орташа абсолюттік тереңдік қателігі (MAE) және нысандардың кеңістікте орналасуының дұрыстығы арқылы бағаланатын реконструкция сапасының…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/two-hop.html\"&gt;Два прыжка&lt;/a&gt; — Пайдаланушыдан екі байланыс қашықтығында орналасқан контент авторына дейінгі жазылу графындағы радиус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attention-path-length.html\"&gt;Длина пути внимания&lt;/a&gt; — Пайдаланушы мен ол өзара әрекеттесетін контент авторы арасындағы жазылу графындағы қашықтықты өлшейтін метрика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conversion.html\"&gt;Конверсия&lt;/a&gt; — Белгілі бір уақыт ішінде автордың контентімен өзара әрекеттесуден оған жазылуға көшу көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/capture-coefficient.html\"&gt;коэффициент захвата&lt;/a&gt; — Дереккөздің өзін-өзі күшейту күшінің көрсеткіші, ол алдыңғы кезеңде дәйексөздің болуы немесе болмауы кезіндегі дәйексөз келтіру…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/macro-accuracy.html\"&gt;Макро-точность&lt;/a&gt; — Модель сапасын бағалау метрикасы, мұнда әрбір тапсырмаға ондағы сұрақтар санына қарамастан тең салмақ беріледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soft-metrics.html\"&gt;Мягкие метрики&lt;/a&gt; — Тәуекелді бағалау үшін жинақталатын, бірақ маңызды әрекеттерге рұқсат беру үшін жеткілікті негіз болып табылмайтын модельдің өнімділік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/compounding-ratio.html\"&gt;отношение компаундирования&lt;/a&gt; — GEO-ның қашықтықтағы нақты әсерінің бір қадамдық бағалау нәтижелеріне қатынасын көрсететін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mahalanobis-distance.html\"&gt;Расстояние Махаланобиса&lt;/a&gt; — Кескіндерге енгізілген өзгерістердің нақты деректердің таралу шеңберінен шықпауын бағалау үшін қолданылатын прокси-метрика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cumulative-conversational-visibility.html\"&gt;совокупная видимость в диалоге&lt;/a&gt; — Назар аудару салмақ коэффициенттерін ескере отырып, диалогтың барлық кезеңдеріндегі дереккөздің жалпы маңыздылығын есептеуге арналған…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/selection-regret.html\"&gt;Сожаление при выборе&lt;/a&gt; — Модель тиімділігінің көрсеткіші, ол қолжетімді ең жақсы кескіннің рейтингі мен модель таңдаған кескіннің рейтингі арасындағы айырмашылықты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Орташа абсолюттық қателік (MAE) — бұл болжамдалған және нақты деректер арасындағы айырмашылықтардың орташа мәнін көрсететін болжау…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-execution-accuracy.html\"&gt;Точность выполнения команд&lt;/a&gt; — Модель жұмысының сапа көрсеткіші, компоненттер бойынша бағаланады: құралды таңдау, қосымша жалаушалар мен позициялық аргументтердің…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attack-success-rate.html\"&gt;Уровень успешности атак&lt;/a&gt; — Жүйеге жасалған сәтті шабуылдардың үлесін көрсететін қорғаныс тиімділігінің метрикасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fail-rate.html\"&gt;Частота неудач&lt;/a&gt; — Модель жауаптары 2 және одан жоғары балл алған сценарийлердің үлесін көрсететін тестілеудің негізгі көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensitivity.html\"&gt;Чувствительность&lt;/a&gt; — Сигнал мен шуды ажырату қабілетінің 0-ден 1-ге дейінгі көрсеткіші.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"17 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Метрикалар","description":"17 ұғым","vcsPath":"reference/metrics.md"},"headings":[],"title":"Метрикалар"},"router":{"pathname":"reference/metrics","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
