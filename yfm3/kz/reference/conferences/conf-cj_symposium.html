        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;вычислительные методы в журналистике&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;вычислительные методы в журналистике&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;статьи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;Междисциплинарное сообщество специалистов в области компьютерных наук и журналистики.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Ежегодное мероприятие (на основе академической практики).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научный симпозиум с докладами, публикацией тезисов и записей выступлений.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальные ресурсы организаторов (уточняются в зависимости от года проведения).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-data.html\"&gt;Ашық деректер&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Әдістер және этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;Computation + Journalism Symposium — журналистика қызметінде есептеу әдістерін қолдануға арналған ғылыми конференция. Есептеу әдістері дегеніміз — жаңалықтар ақпаратын жинау, ұйымдастыру және тарату үшін алгоритмдер мен жасанды интеллектіні пайдалану. Іс-шараның негізгі мақсаты — компьютерлік ғылымдар мамандары мен кәсіби журналистерді деректерді тексеру және жарияланымдардың дәлдігін қамтамасыз ету міндеттерін шешу үшін біріктіру.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Конференция информатика, әлеуметтік ғылымдар және журналистика тоғысатын пәнаралық алаң болып табылады. Ұйымдастырушылар журналистиканың дәлдік пен тексерілу құндылықтарын заманауи талдау құралдары арқылы нығайтуды көздейді.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Симпозиум бағдарламасы журналистік еңбекті автоматтандыруға қатысты кең ауқымды тақырыптарды қамтиды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Деректерді талдау: құрылымдалмаған мәтіндерден жасырын параметрлерді табу және деректер базасын құру.&lt;/li&gt;\n&lt;li&gt;Фактілерді тексеру: нейрондық желілердің жауаптарындағы өтірікті анықтау және жасанды интеллектінің «рөлдік ойыны» мәселелерін талдау.&lt;/li&gt;\n&lt;li&gt;Жасанды интеллект қауіпсіздігі: модельдерге шабуылдардан қорғау әдістерін әзірлеу және стандартты тесттерден тыс жүйелердің нақты қабілеттерін бағалау.&lt;/li&gt;\n&lt;li&gt;Этика және ашықтық: есептіліктегі өзгерістердің ғылыми зерттеулердің көрінуіне әсерін зерттеу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;Симпозиумда ықшам тілдік модельдердің (2-9B) тиімділігі мен олардың пайымдау қабілеті бойынша зерттеу нәтижелері алғаш рет ұсынылады. Қатысушылар стандартты тесттердің неліктен жасанды интеллект мүмкіндіктерін қате бағалайтынын және агенттік қаңқаның нәтижеге қалай әсер ететінін талқылайды.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференция нәтижелерін тезистер мен баяндама жазбалары арқылы бақылауға болады. Қатысу қатаң әдіснамаға негізделген баяндамаларды ұсынуды көздейді, бұл қауымдастыққа авторлардың қорытындыларын өз бетінше тексеруге мүмкіндік береді. Конференция есептеу әдістерінің ақпараттық бұрмалаумен күресуге қалай көмектесетінін түсінгісі келетін мамандарға арналған.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Computational_journalism\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Computational journalism — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"вычислительные методы в журналистике"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Computation + Journalism Symposium","description":"вычислительные методы в журналистике","vcsPath":"reference/con
