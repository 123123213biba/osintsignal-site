        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;детекция подделок изображений и видео&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;детекция подделок изображений и видео&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;статьи CVF (открыты)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;IEEE/CVF (Computer Vision Foundation)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Ежегодно, в рамках конференции CVPR&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научный воркшоп, презентации докладов, публикация тезисов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;cvpr.thecvf.com&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-verify.html\"&gt;Фактілер мен медианы тексеру&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;CVPR Workshop on Media Forensics — бұл IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR) жыл сайынғы конференциясының бөлігі болып табылатын мамандандырылған ғылыми алаң. Бұл семинар визуалды контенттегі манипуляцияларды, соның ішінде суреттер мен бейнелердегі жалған ақпаратты анықтау әдістеріне арналған. Іс-шараның негізгі мақсаты — медиа деректерді тексеру саласындағы зерттеу нәтижелерімен алмасу.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Іс-шара компьютерлік көру бойынша жетекші халықаралық конференция — CVPR аясында өткізіледі. Ұйымдастырушылар ретінде медиа қауіпсіздігі саласындағы академиялық институттар мен зерттеу зертханаларының сарапшылары қатысады. Семинардың тарихы генеративті контент әдістерінің дамуымен тығыз байланысты.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Негізгі тақырыптар редакциялау іздерін анықтау алгоритмдерін әзірлеу, цифрлық нысандардың метадеректерін талдау және детектор-модельдерді оқыту үшін деректер жинақтарын (dataset) құруды қамтиды. Талқылаудың негізгі бағыттары: deepfake-терді анықтау әдістері, цифрлық дәлелдемелердің тұтастығын талдау және визуалды ақпаратты тексеру стандарттарын әзірлеу.&lt;/p&gt;\n&lt;h2 id=\"onda-ne-usynylady\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#onda-ne-usynylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не ұсынылады&lt;/span&gt;&lt;/a&gt;Онда не ұсынылады&lt;/h2&gt;\n&lt;p&gt;Семинарда фактілерді тексерудің жаңа хаттамалары үшін негіз болатын зерттеу нәтижелері ұсынылады. Қатысушылар медиа файлдардағы ауытқуларды іздеуді автоматтандыру әдістерін көрсетеді. Зерттеу нәтижелері көбінесе CVF (Computer Vision Foundation) арқылы ашық қолжетімділікте жарияланады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Семинар материалдарын CVF ресми мұрағаты арқылы бақылауға болады. Қатысу үшін белгіленген мерзімде ғылыми жұмыстарды тапсыру, рецензиялаудан өту және презентациямен сөз сөйлеу қажет. Фактілерді тексерумен айналысатындар үшін бұл семинар OSINT-зерттеулерінде қолданылатын өзекті әдіснамалардың көзі болып табылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/List_of_datasets_in_computer_vision_and_image_processing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;List of datasets in computer vision and image processing — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"детекция подделок изображений и видео"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"CVPR Workshop on Media Forensics","description":"детекция подделок изображений и видео","vcsPath":"reference/conferences/conf-cvpr_mf.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-cvpr_mf.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-cvpr_mf.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-cvpr_mf.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не ұсынылады","href":"reference/conferences/conf-cvpr_mf.html#onda-ne-usynylady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-cvpr_mf.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-cvpr_mf.html#derekkoezder","level":2}],"title":"CVPR Workshop on Media Forensics"},"router":{"pathname":"reference/conferences/conf-cvpr_mf","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
