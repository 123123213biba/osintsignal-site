        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Инструкция&lt;/em&gt; · 2026-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Ваша лента соцсетей — это не заговор алгоритмов, а уютная комната, которую вы построили сами. Разбираемся, как работает социальная архитектура.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"naznachenie\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#naznachenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Назначение&lt;/span&gt;&lt;/a&gt;Назначение&lt;/h2&gt;\n&lt;p&gt;Средство для осознанного потребления контента. Помогает понять, почему вы видите одних и тех же людей и темы, даже если алгоритмы платформы не навязывают вам повестку.&lt;/p&gt;\n&lt;h2 id=\"sostav\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#sostav\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Состав&lt;/span&gt;&lt;/a&gt;Состав&lt;/h2&gt;\n&lt;p&gt;В основе — исследование «Пузыри фильтров или случайность: как мы на самом деле выбираем контент в соцсетях». Активное вещество: анализ 173 миллионов взаимодействий пользователей платформы Bluesky. Вспомогательные компоненты: человеческая склонность к гомофилии и структура социальных связей.&lt;/p&gt;\n&lt;h2 id=\"sposob-primeneniya\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#sposob-primeneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Способ применения&lt;/span&gt;&lt;/a&gt;Способ применения&lt;/h2&gt;\n&lt;p&gt;Принимать ежедневно при прокрутке ленты. Помните: 173 миллиона взаимодействий показывают, что подавляющее внимание сосредоточено внутри вашего «социального пузыря». Выбирайте контент осознанно, помня, что большинство ваших реакций ограничено кругом подписок «в два шага». Если хотите расширить кругозор, совершите «цифровую прогулку» за пределы привычного круга.&lt;/p&gt;\n&lt;h2 id=\"pobochnye-effekty\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#pobochnye-effekty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Побочные эффекты&lt;/span&gt;&lt;/a&gt;Побочные эффекты&lt;/h2&gt;\n&lt;p&gt;Возможно внезапное осознание того, что мир шире, чем ваша лента. В редких случаях — легкое головокружение от обилия альтернативных мнений. При чрезмерном использовании соцсетей возможна «эхо-камера» — состояние, при котором вы слышите только эхо собственных мыслей.&lt;/p&gt;\n&lt;h2 id=\"protivopokazaniya\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#protivopokazaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Противопоказания&lt;/span&gt;&lt;/a&gt;Противопоказания&lt;/h2&gt;\n&lt;p&gt;Не рекомендуется использовать как единственный источник истины о мире. Противопоказано считать, что алгоритмы — единственный виновник ваших предпочтений: структура сети играет не меньшую роль.&lt;/p&gt;\n&lt;h2 id=\"usloviya-hraneniya\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#usloviya-hraneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Условия хранения&lt;/span&gt;&lt;/a&gt;Условия хранения&lt;/h2&gt;\n&lt;p&gt;Хранить в сухом, прохладном месте, подальше от бесконечного скроллинга. Беречь от автоматических рекомендаций. Применять с критическим мышлением.&lt;/p&gt;\n&lt;h2 id=\"osnovano-na-statyah\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#osnovano-na-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основано на статьях&lt;/span&gt;&lt;/a&gt;Основано на статьях&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html\"&gt;Пузыри фильтров или случайность: как мы на самом деле выбираем контент в соцсетях&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Концепции: &lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ваша лента соцсетей — это не заговор алгоритмов, а уютная комната, которую вы построили сами. Разбираемся, как работает социальная архитектура."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Инструкция по эксплуатации вашего «цифрового пузыря»","description":"Ваша лента соцсетей — это не заговор алгоритмов, а уютная комната, которую вы построили сами. Разбираемся, как работает социальная архитектура.","vcsPath":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.md"},"headings":[{"title":"Назначение","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#naznachenie","level":2},{"title":"Состав","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#sostav","level":2},{"title":"Способ применения","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#sposob-primeneniya","level":2},{"title":"Побочные эффекты","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#pobochnye-effekty","level":2},{"title":"Противопоказания","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#protivopokazaniya","level":2},{"title":"Условия хранения","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#usloviya-hraneniya","level":2},{"title":"Основано на статьях","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#osnovano-na-statyah","level":2}],"title":"Инструкция по эксплуатации вашего «цифрового пузыря»"},"router":{"pathname":"instructions/ins-nets-out-of-network-attention-dynamic
