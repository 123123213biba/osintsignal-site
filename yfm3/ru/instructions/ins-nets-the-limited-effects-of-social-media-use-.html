        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Инструкция&lt;/em&gt; · 2026-10-04&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Ваш мозг прочнее, чем кажется в ленте новостей. Разбираемся, как не потерять критическое мышление в эпоху цифрового шума.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"naznachenie\"&gt;&lt;a href=\"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#naznachenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Назначение&lt;/span&gt;&lt;/a&gt;Назначение&lt;/h2&gt;\n&lt;p&gt;Средство для поддержания интеллектуальной бодрости при просмотре ленты. Помогает осознать, что ваш навык отличать правду от лжи не растворяется при скроллинге.&lt;/p&gt;\n&lt;h2 id=\"sostav\"&gt;&lt;a href=\"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#sostav\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Состав&lt;/span&gt;&lt;/a&gt;Состав&lt;/h2&gt;\n&lt;p&gt;В основе — данные двух масштабных панельных исследований, проведенных в периоды выборов в США и пандемии COVID-19. Активные компоненты: Facebook, Twitter, YouTube и Instagram в различных дозировках.&lt;/p&gt;\n&lt;h2 id=\"sposob-primeneniya\"&gt;&lt;a href=\"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#sposob-primeneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Способ применения&lt;/span&gt;&lt;/a&gt;Способ применения&lt;/h2&gt;\n&lt;p&gt;Использовать по назначению: для общения и поиска информации. Согласно статье «Миф о влиянии соцсетей на искажение реальности», активное потребление контента не приводит к автоматической потере критической оценки. Вы можете листать ленту, сохраняя ясность ума.&lt;/p&gt;\n&lt;h2 id=\"pobochnye-effekty\"&gt;&lt;a href=\"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#pobochnye-effekty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Побочные эффекты&lt;/span&gt;&lt;/a&gt;Побочные эффекты&lt;/h2&gt;\n&lt;p&gt;Возможно временное ощущение «информационной перегрузки» или легкое раздражение от комментариев. Однако значимой корреляции между использованием соцсетей и снижением способности к верификации фактов не выявлено. Ваш навык критического мышления остается стабильным.&lt;/p&gt;\n&lt;h2 id=\"protivopokazaniya\"&gt;&lt;a href=\"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#protivopokazaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Противопоказания&lt;/span&gt;&lt;/a&gt;Противопоказания&lt;/h2&gt;\n&lt;p&gt;Не рекомендуется использовать как единственный источник истины для принятия жизненно важных решений. Помните: отсутствие корреляции в исследовании не означает, что в интернете нет дезинформации — это лишь значит, что сам факт использования соцсетей не делает нас беззащитными перед ней.&lt;/p&gt;\n&lt;h2 id=\"usloviya-hraneniya\"&gt;&lt;a href=\"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#usloviya-hraneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Условия хранения&lt;/span&gt;&lt;/a&gt;Условия хранения&lt;/h2&gt;\n&lt;p&gt;Хранить в сухом, прохладном месте, подальше от горячих споров в комментариях. Рекомендуется регулярно проветривать голову и сверять данные с независимыми источниками.&lt;/p&gt;\n&lt;h2 id=\"osnovano-na-statyah\"&gt;&lt;a href=\"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#osnovano-na-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основано на статьях&lt;/span&gt;&lt;/a&gt;Основано на статьях&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html\"&gt;Миф о влиянии соцсетей на искажение реальности&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Концепции: &lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ваш мозг прочнее, чем кажется в ленте новостей. Разбираемся, как не потерять критическое мышление в эпоху цифрового шума."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Инструкция по применению соцсетей: мифы и реальность","description":"Ваш мозг прочнее, чем кажется в ленте новостей. Разбираемся, как не потерять критическое мышление в эпоху цифрового шума.","vcsPath":"instructions/ins-nets-the-limited-effects-of-social-media-use-.md"},"headings":[{"title":"Назначение","href":"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#naznachenie","level":2},{"title":"Состав","href":"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#sostav","level":2},{"title":"Способ применения","href":"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#sposob-primeneniya","level":2},{"title":"Побочные эффекты","href":"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#pobochnye-effekty","level":2},{"title":"Противопоказания","href":"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#protivopokazaniya","level":2},{"title":"Условия хранения","href":"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#usloviya-hraneniya","level":2},{"title":"Основано на статьях","href":"instructions/ins-nets-the-limited-effects-of-social-media-use-.html#osnovano-na-statyah","level":2}],"title":"Инструкция по применению соцсетей: мифы и реальность"},"router":{"pathname":"instructions/ins-nets-the-limited-effects-of-social-media-use-","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
