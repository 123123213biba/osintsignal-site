        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"146\" cy=\"132\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"494\" cy=\"272\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Робот, который помнит&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;прошлое: как научить машину&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;находить спрятанные предметы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f1.jpg\" alt=\"Рис. 1: Захват на основе событий.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1: Захват на основе событий.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 1: Захват на основе событий. (A) VoLo, оркестратор &lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt;, правильно идентифицирует цель инструкции и передает ее текстовое описание либо в VLA (π0.5), либо в WAM (Cosmos3-Nano-Policy). Тем не менее, обе последующие модели не могут локализовать и захватить скрытую цель. (B) Наша система вместо этого инициализирует пространственное представление на основе прошлых наблюдений, активно выбирает точку обзора, которая открывает цель, и успешно захватывает ее.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Исследователи представили систему &lt;a href=\"concepts/beyondsce.html\"&gt;BeyondSCe&lt;/a&gt;, которая помогает роботам находить объекты, основываясь на истории прошлых взаимодействий. Если нужная вещь скрыта от глаз, робот анализирует видеозапись событий и активно выбирает точки обзора для поиска. Технология не требует дообучения под конкретные задачи и работает с обычными RGB-D камерами.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Успех захвата скрытых объектов вырос до 77% против 55% у лучших аналогов.&lt;/li&gt;\n&lt;li&gt;Система сократила среднее число ракурсов для поиска с 3.35 до 2.20.&lt;/li&gt;\n&lt;li&gt;Используются готовые предобученные модели без специализированного дообучения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Система BeyondSCe использует комбинацию мультимодальных языковых моделей (&lt;a href=\"concepts/multimodal-large-language-models-mllm.html\"&gt;MLLM&lt;/a&gt;) и алгоритмов отслеживания точек для интерпретации инструкций, связанных с прошлыми событиями. Когда пользователь просит робота взять предмет, который он «только что использовал», система анализирует историю видео, чтобы идентифицировать объект и его последнее известное местоположение. Если цель не видна в текущем кадре, робот создает вероятностную волюметрическую карту (объемную модель) пространства, объединяя данные из истории с геометрией текущей сцены.&lt;/p&gt;\n&lt;p&gt;Для поиска скрытого объекта робот применяет метод активного восприятия: он оценивает потенциальные точки обзора, учитывая прозрачность и видимость областей, чтобы минимизировать количество движений камеры. В экспериментах с манипулятором и установленной на запястье RGB-D камерой система достигла успеха в 77% случаев для скрытых объектов, что значительно выше показателей существующих аналогов. Метод эффективно сокращает количество необходимых для поиска ракурсов, оптимизируя процесс принятия решений в реальном времени.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность системы ограничена точностью отслеживания объектов на видео и качеством данных глубины, полученных с RGB-D камеры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Роботизированные системы, взаимодействующие с людьми, должны обладать способностью выполнять запросы, основанные на прошлых событиях. Часто пользователь идентифицирует объект не по его названию или внешнему виду, а по роли, которую тот сыграл в недавнем действии. Более того, целевой объект может быть скрыт из поля зрения в момент подачи команды. Авторы представляют BeyondCSe — систему захвата объектов с нулевым обучением (&lt;a href=\"concepts/zero-shot.html\"&gt;zero-shot&lt;/a&gt;), предназначенную для работы в условиях событийной привязки. Система анализирует историю событий и текущую сцену, чтобы локализовать объект для захвата. Если цель скрыта, алгоритм объединяет априорные данные о событии с геометрией текущей сцены, выбирая оптимальные точки обзора для обнаружения объекта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система BeyondCSe достигает успеха в захвате объектов в 76% случаев для видимых целей и в 77% для скрытых, существенно превосходя базовые методы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система использует предобученные модели без дополнительного дообучения под конкретные задачи. В экспериментах с реальным роботом, оснащенным одним запястным RGB-D датчиком, BeyondCSe показала точность захвата 76% для видимых объектов и 77% для скрытых, тогда как лучшие альтернативные решения продемонстрировали лишь 40% и 55% соответственно. В четырех дополнительных сценариях с сильной окклюзией (перекрытием) система повысила показатель успешности захвата с 75% до 95%, одновременно сократив среднее количество необходимых ракурсов обзора с 3,35 до 2,20 по сравнению с базовым методом активного восприятия, использующим точные 3D-координаты цели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zero-shot обучение означает, что система способна выполнять задачу без предварительной тренировки на конкретных примерах этого действия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Реальные рабочие пространства обладают «памятью»: объекты перемещаются и используются до того, как робот получит команду. Инструкции типа «возьми объект, который я только что использовал» требуют от робота понимания событийной привязки. Система должна не только идентифицировать объект, но и использовать историю для поиска его текущего местоположения, если он скрыт. Традиционные методы манипуляции, управляемые языком, обычно опираются на визуальные атрибуты в текущем кадре, что делает их неэффективными для задач, где объект определяется его ролью в прошлом.&lt;/p&gt;\n&lt;p&gt;Современные системы захвата объектов часто сталкиваются с проблемой: если целевой объект скрыт от камеры, модель не может определить его точное местоположение для манипуляции. Существующие подходы, такие как VoLo, способны идентифицировать объект, но не могут выполнить захват, если он перекрыт другими предметами. Представленная система BeyondCSe решает эту задачу, используя историю событий для поиска объекта и выбора оптимальной точки обзора. В отличие от методов, полагающихся только на текущую геометрию сцены, BeyondCSe анализирует прошлые наблюдения, чтобы предсказать траекторию перемещения объекта. Система оценивает видимость потенциальных зон нахождения цели, игнорируя области, которые не были исследованы, что позволяет эффективнее планировать движение камеры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система BeyondCSe впервые объединяет историю событий и &lt;a href=\"concepts/aktivnoe-vospriyatie.html\"&gt;активное восприятие&lt;/a&gt;, позволяя роботу находить и захватывать скрытые объекты без предварительного обучения на конкретных задачах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система работает как &lt;a href=\"concepts/pipeline.html\"&gt;конвейер&lt;/a&gt; с нулевым обучением (zero-shot). Сначала мультимодальная языковая модель (MLLM) и трекер точек связывают текстовую инструкцию с объектом в истории событий. Если объект удается локализовать в текущем кадре, координаты передаются для захвата. В противном случае система переходит к активному восприятию: на основе прошлых данных и текущей геометрии сцены формируется вероятностное объемное представление цели (&lt;a href=\"concepts/probabilistic-volumetric-map.html\"&gt;volumetric target belief&lt;/a&gt;). Кандидатные точки обзора оцениваются с учетом прозрачности и вероятности нахождения объекта. После каждого движения камеры система обновляет свои представления до тех пор, пока цель не будет найдена или не будет исчерпан бюджет на сенсорные операции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Активное восприятие — это процесс, при котором робот самостоятельно выбирает, куда направить камеру, чтобы получить максимум информации о скрытом объекте, вместо пассивного ожидания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В области захвата объектов с языковым управлением (LERF-TOGO, GraspMolmo) акцент делается на 3D-репрезентациях или предсказании точек захвата по одному изображению. Однако эти методы ограничены текущим полем зрения. В отличие от них, BeyondCSe использует эпизодическую память и событийные ссылки, что сближает её с системами навигации, использующими пространственно-временную память. Ключевое отличие от существующих моделей манипуляции (например, MemoryVLA) заключается в использовании готовых моделей без необходимости специализированного обучения под конкретные задачи.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность системы напрямую зависит от точности трекинга точек в истории событий; при потере объекта на ранних этапах точность поиска снижается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система состоит из двух модулей, связанных описанием цели и пространственными наблюдениями (Рис. 2). Если видеоанализ (разд. III-C) позволяет получить 3D-координаты цели из начального кадра, система сразу переходит к проверке захвата. В противном случае накопленные исторические данные используются для активного восприятия (разд. III-D), чтобы сформировать начальное представление о цели. Система использует готовые модели MLLM и трекер точек без дополнительного обучения.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f2.jpg\" alt=\"Рис. 2: Обзор BeyondCSe. При получении инструкции на основе событий и записанного видео, видеоанализ идентифицирует и ло\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2: Обзор BeyondCSe. При получении инструкции на основе событий и записанного видео, видеоанализ идентифицирует и локализует цель.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 2: Обзор BeyondCSe. При получении инструкции на основе событий и записанного видео, видеоанализ идентифицирует и локализует цель. Исторические 3D-наблюдения цели, восстановленные из видео, обозначены как P. Если цель скрыта, активное восприятие с учетом событий создает объемное представление на основе предыдущих наблюдений и текущей геометрии, а затем выбирает точки обзора с учетом видимости, пока цель не будет захвачена или поиск не завершится.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система автоматически выбирает между мгновенным захватом и активным поиском цели на основе качества начальных 3D-данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Процесс включает четыре этапа (Рис. 3A): RECORD формирует хронологическую запись событий E=(e₁, . . . , e_N), где каждое событие e_i описывает действие и объекты. SELECT анализирует инструкцию и запись для создания описания цели и уточняющего признака (cue). LOCATE использует эти данные для предложения области поиска (box) в исходном изображении I₀, а POINT возвращает пиксель действия. Если поиск по кропам не дает результата, область расширяется до полного изображения. Полученный пиксель проецируется в 3D-пространство с использованием карты глубины и позы камеры.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Если в начальном кадре цель не найдена, система анализирует прошлые кадры, отслеживая кандидатов и отсеивая те, что остаются видимыми до конца видео. Выбирается наиболее подходящий по внешнему виду кандидат, чьи 3D-координаты P=(q₁, . . . , q_m) (уравнение 1) инициализируют представление о цели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод «Grounding» (привязка) позволяет системе «понимать», какой именно объект на видео соответствует текстовой инструкции, даже если он частично перекрыт.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Начальная карта M₀ строится как усеченная функция знакового расстояния (TSDF) из данных RGB-D. Вероятностное распределение цели b_t(x) инициализируется из 3D-трека P (уравнения 2-5). Параметр ε в формуле (5) обеспечивает ненулевую вероятность во всей рабочей области &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, что позволяет системе восстановиться при неточных исторических оценках.&lt;/p&gt;\n&lt;p&gt;Для поиска новых видов система генерирует набор допустимых позиций &lt;span class=\"yfm-latex\" data-content=\"%5CXi_t\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, проверяя их на коллизии. Для каждого кандидата &lt;span class=\"yfm-latex\" data-content=\"%5Cxi\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; оценивается вероятность наблюдения &lt;span class=\"yfm-latex\" data-content=\"L%5E-_t(x%3B%20%5Cxi)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и уверенность в видимости &lt;span class=\"yfm-latex\" data-content=\"T_t(x%3B%20%5Cxi)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (уравнение 6), которая зависит от расстояния, пройденного лучом через неисследованное пространство. Оптимальный вид &lt;span class=\"yfm-latex\" data-content=\"%5Cxi%5E*_t\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; выбирается путем максимизации функции &lt;span class=\"yfm-latex\" data-content=\"S_t(%5Cxi)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (уравнения 7-8), которая оценивает, насколько новый вид поможет уточнить положение цели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность метода зависит от точности данных глубины и возможности построения TSDF-карты в реальном времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После выполнения движения система регистрирует ключевой кадр, интегрирует данные глубины в общую карту Mt+1 и пересчитывает вероятность нахождения цели согласно формуле (9). Вероятностная модель объединяет правдоподобие согласованности глубины Ldep,t+1(x) и вероятность пропуска цели Lmiss,t+1(x). Если объект не обнаружен, система не исключает область полностью, а лишь снижает её вес. Процесс поиска продолжается до тех пор, пока не будет найдена цель с высокой вероятностью p^* или не исчерпан бюджет активных обзоров.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система динамически обновляет карту вероятностей, используя негативные наблюдения для уточнения поиска, не отбрасывая потенциальные зоны преждевременно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При получении подтверждения p^* система генерирует кандидатов на захват. В случае неполной геометрии объекта робот выполняет дополнительное центрированное сканирование. В отличие от аналогов, где область поиска задана заранее, здесь регион интереса определяется только после событийного анализа.&lt;/p&gt;\n&lt;p&gt;Эксперименты проводились на роботе ROBOTIS OMY-F3M с камерой Intel RealSense D435i. Вычисления выполнялись на рабочей станции с GPU NVIDIA GeForce RTX 4090. &lt;a href=\"concepts/dataset.html\"&gt;Датасет&lt;/a&gt; включает 150 испытаний: 50 для условий видимости и 100 для условий окклюзии (скрытых объектов). Сцены содержат бытовые предметы (посуда, цветы, игрушки). Инструкции основаны на временной последовательности событий (например, «объект, перемещенный первым»).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/okklyuziya.html\"&gt;Окклюзия&lt;/a&gt; — это ситуация, когда целевой объект перекрыт другими предметами или находится вне поля зрения камеры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для обработки инструкций используется модель Qwen3-VL-8B. Из видеоистории равномерно извлекается 96 кадров. Параметры системы: &lt;span class=\"yfm-latex\" data-content=\"%5Crho%3D2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, δ₀=0.05 м, ε=0.1, κ=0.33. Новый кадр добавляется при перемещении камеры на 0.10 м или повороте на 15^°. Результаты сравнения с другими методами (LERF*, P2A, GS) представлены в Таблице I, где метод показывает успех захвата 76.7% (Original) и 50.0% (Reasoned). Таблица II демонстрирует эффективность системы в условиях сильной окклюзии, достигая до 95% успеха при использовании событийных априорных данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены в контролируемых лабораторных условиях с ограниченным набором объектов, что может отличаться от непредсказуемой домашней среды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы используем кандидатов AnyGrasp, полученных из виртуальных ракурсов, объединяем их и применяем &lt;a href=\"concepts/non-maximum-suppression.html\"&gt;подавление немаксимумов&lt;/a&gt; для устранения дубликатов поз. Для оценки эффективности мы фиксируем успешные попытки из общего числа для трех этапов: 3D-локализации, планирования и захвата. Локализация считается успешной, если предсказанная 3D-точка попадает в размеченную человеком ограничивающую рамку (bounding box) в системе координат робота. Планирование успешно, если найден допустимый план захвата, а успех захвата фиксирует физическое удержание объекта. Эти этапы последовательны: локализация позволяет планировать, а план — выполнять захват.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Подавление немаксимумов (Non-maximum suppression) — это алгоритм, который удаляет избыточные дублирующиеся предсказания объектов, оставляя только наиболее вероятный вариант.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы сравнили наш метод с LERF-TOGO, GraspSplats, Point2Act (и его версией Point2Act†) и GraspMolmo. LERF-TOGO и Point2Act работают с RGB-данными, остальные — с RGB-D. Базовые модели с поддержкой нескольких ракурсов получают 30 предопределенных наблюдений сцены. GraspMolmo использует только начальный вид и не оценивается, если объект скрыт (обозначено как N/A на Рис. 6). Наш метод начинает с того же исходного состояния и выбирает дополнительные ракурсы по мере необходимости.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f6.jpg\" alt=\"Рис. 6: Производительность захвата в реальных условиях.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6: Производительность захвата в реальных условиях.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 6: Производительность захвата в реальных условиях. Цели видны или скрыты в начальном виде с наручной камеры, с 50 и 100 попытками на метод соответственно. Обоснованные инструкции — это запросы на локализацию, сгенерированные Qwen3-VL-8B из истории видео и исходной инструкции, общие для всех базовых моделей при сохранении их собственных основ локализации. LERF*, P2A, GS и GM обозначают LERF-TOGO, Point2Act, GraspSplats и GraspMolmo соответственно. P2A† использует реконструкцию RGB-D. Цветные сегменты указывают на успешные захваты или первую неудачную стадию. Наша система повторяется как общий эталон полной системы для всех условий инструкций. N/A обозначает не оцениваемое условие.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;На Рис. 6 сравнивается производительность при видимых и скрытых объектах, а в Таблице I приведен общий успех захвата по 150 испытаниям. При использовании исходных инструкций модели на базе MLLM (Point2Act и GraspMolmo) показывают лучшую локализацию видимых целей, чем LERF-TOGO и GraspSplats. Добавление логических (reasoned) инструкций повышает показатели всех моделей.&lt;/p&gt;\n&lt;p&gt;Наш метод локализует 43 из 50 видимых и 88 из 100 скрытых целей, превосходя лучшие аналоги на 32 и 20 процентных пунктов соответственно. Функция LOCATE ограничивает область поиска, снижая двусмысленность при выборе мелких деталей (Рис. 3B). Успешность захвата составила 38/50 для видимых и 77/100 для скрытых целей, тогда как лучшие базовые модели достигли лишь 20/50 и 55/100. В сумме по 150 испытаниям наш метод показал 76,7% успеха против 50,0% у ближайшего конкурента (Таблица I).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наш метод достиг 76,7% успеха в захвате объектов, превзойдя лучшие аналоги на 26,7 процентных пункта за счет комбинации активного поиска ракурсов и уточнения геометрии цели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы провели сравнительный анализ своего метода с адаптированной версией подхода Breyer et al., ориентированного на активный выбор ракурса для захвата объектов. В качестве базовой линии (baseline) использовался метод, которому предоставлялись точные 3D-границы целевого объекта (ground-truth bounding box), при этом для генерации захватов применялся AnyGrasp и общая система планирования. В экспериментах на четырех сценах (S1–S4) метод авторов показал 95% успешность захвата при среднем количестве 2,20 ракурсов, тогда как метод Breyer et al. достиг лишь 75% успеха при 3,35 ракурсах, несмотря на наличие априорной информации о границах объекта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование истории событий и вероятностного веса гипотез позволяет системе сократить количество необходимых ракурсов на 34% по сравнению с базовой линией, повышая точность захвата на 20%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; компонентов показала важность каждого элемента: исключение весов вероятностей (belief weights) снизило успех до 80% и увеличило число ракурсов до 4,65, так как система тратила ресурсы на маловероятные зоны. Отказ от учета коэффициента пропускания (transmittance) привел к росту числа ракурсов до 3,10 из-за оптимистичной оценки неисследованных пространств. Без использования априорных данных о событиях (event prior) успешность сохранилась, но количество ракурсов выросло до 4,00, что подчеркивает эффективность пространственных подсказок, извлеченных из истории.&lt;/p&gt;\n&lt;p&gt;Для проверки универсальности система была протестирована на видео из наборов EgoDex и EPIC-KITCHENS. Без перенастройки параметров модель успешно определяла объекты, упомянутые в контексте действий (например, расстановка посуды). В сложных сценах с резкой сменой ракурса камеры (EPIC-KITCHENS) система продемонстрировала способность уточнять область поиска, хотя точность оценки координат в финальном кадре иногда остается ограниченной.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод предполагает, что целевой объект остается неподвижным в процессе поиска; работа с динамическими объектами требует дальнейших исследований.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Представленная система BeyondCSe позволяет роботу интерпретировать запросы, основанные на истории взаимодействий, и выполнять захват даже при частичном перекрытии объектов. Интеграция событийного контекста с геометрией сцены значительно повышает эффективность поиска и надежность манипуляций по сравнению с классическими методами активного восприятия.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f1.jpg\" alt=\"Рис. 1: Захват на основе событий.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1: Захват на основе событий.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 1: Захват на основе событий. (A) VoLo, оркестратор VLM, правильно идентифицирует цель инструкции и передает ее текстовое описание либо в VLA (π0.5), либо в WAM (Cosmos3-Nano-Policy). Тем не менее, обе последующие модели не могут локализовать и захватить скрытую цель. (B) Наша система вместо этого инициализирует пространственное представление на основе прошлых наблюдений, активно выбирает точку обзора, которая открывает цель, и успешно захватывает ее.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f4.jpg\" alt=\"Рис. 4: Активное восприятие с учетом событий.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4: Активное восприятие с учетом событий.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 4: Активное восприятие с учетом событий. Трек событий и начальное наблюдение RGB-D инициализируют представление цели и карту. Поиск вида, управляемый представлением, затем получает физические виды, каждый из которых дает текущее наблюдение, обновляющее оба в замкнутом цикле. После подтверждения цели проверка захвата запрашивает другой вид только тогда, когда наблюдаемой геометрии недостаточно.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f5.jpg\" alt=\"Рис. 5: Примеры инструкций на основе событий.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5: Примеры инструкций на основе событий.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рис. 5: Примеры инструкций на основе событий. В каждой строке показаны выбранные кадры из видео истории событий, начальное наблюдение для выполнения роботом и инструкция, выданная после записи. Последний кадр видео служит начальным наблюдением. (A) Запрошенная ручка чашки видна, но для идентификации чашки, закрывающей грушу, требуется история событий. (B) Куб перемещается первым и в начальном наблюдении закрыт стеной.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f8.jpg\" alt=\"Рис. 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f8-2.jpg\" alt=\"Рис. 8 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 8 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Робот не видит&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;объект из&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инструкции&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Анализ истории&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;видео и&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;активный поиск&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Успешный&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;захват скрытой&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;цели&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Роботы учатся&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;работать в&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;динамике&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;t
