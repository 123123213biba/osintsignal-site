        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"198\" cy=\"71\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"582\" cy=\"274\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · ENV_DATA   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Машинное обучение против&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;лесных пожаров: как ИИ видит&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;огонь лучше спутников&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f1.jpg\" alt=\"Рисунок 1: Карты исследуемой территории. Штаты, использованные для обучения, отмечены черным цветом, для оценки — красны\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Карты исследуемой территории. Штаты, использованные для обучения, отмечены черным цветом, для оценки — красным, а штаты, использованные для обеих целей, — светло-голубым.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Традиционные методы спутникового мониторинга часто пропускают очаги пожаров и дают много ложных срабатываний. Исследование показало, что модель машинного обучения CatBoost превосходит стандартный продукт GOES FDC по точности и скорости обнаружения. Новый подход особенно эффективен ночью, где старые алгоритмы показывают крайне низкую эффективность.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;CatBoost превзошел алгоритм GOES FDC по точности и полноте обнаружения&lt;/li&gt;\n&lt;li&gt;Модель обнаружила 26 пожаров раньше стандартных систем мониторинга&lt;/li&gt;\n&lt;li&gt;Эффективность ночного обнаружения значительно выше существующих аналогов&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи использовали данные прибора ABI со спутников GOES и эталонные метки от инструмента VIIRS (радиометр, фиксирующий тепловое излучение с разрешением 375 метров). Обучающая выборка включала более 60 тысяч пикселей с пожарами и 1,2 миллиона «чистых» пикселей за 2022–2023 годы. Модель CatBoost обучалась на выявлении сложных пространственно-спектральных паттернов, которые стандартный алгоритм FDC (Fire Detection and Characterization) игнорирует.&lt;/p&gt;\n&lt;p&gt;Результаты тестирования на данных 2024 года в пяти регионах показали, что &lt;a href=\"concepts/f1-mera.html\"&gt;F1-мера&lt;/a&gt; (метрика точности) модели выше на 0,16–0,38 по сравнению с FDC. В 26 из 51 исторического случая модель обнаружила пожар раньше, чем существующие системы. Особенно важно, что в ночное время, когда FDC почти не справляется (&lt;a href=\"concepts/recall.html\"&gt;recall&lt;/a&gt; около 0,03), нейросеть сохраняет высокую точность детекции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты ограничены данными конкретных спутников GOES и могут варьироваться в зависимости от региональных атмосферных условий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Лесные пожары представляют серьезную угрозу для жизни людей, экосистем и инфраструктуры. В данной работе представлен метод машинного обучения для обнаружения очагов возгорания на основе данных спутников GOES ABI. Исследователи обучили модель CatBoost на обширном наборе данных, включающем тысячи изображений ABI и более 300 000 сопоставленных записей о пожарах, зафиксированных прибором VIIRS.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost — это алгоритм машинного обучения, использующий градиентный бустинг над решающими деревьями, который эффективно работает с табличными данными и изображениями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эффективность модели оценивалась на независимом наборе данных, охватывающем пять различных регионов. Результаты показали, что CatBoost превосходит текущий оперативный продукт GOES Fire Detection and Characterization (FDC) по показателям точности (precision), полноты (recall) и F1-меры как внутри, так и за пределами области обучения. Во всех исследованных регионах F1-мера модели CatBoost оказалась на 0,16–0,38 выше, чем у FDC.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель CatBoost показала F1-меру на 0,16–0,38 выше, чем стандартный продукт FDC, и обнаружила 26 пожаров раньше других систем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ 51 исторического случая возгорания продемонстрировал преимущество в скорости обнаружения: CatBoost зафиксировал 26 пожаров раньше, чем системы VIIRS и GOES FDC, в то время как FDC удалось сделать это лишь в 6 случаях. Особое внимание уделено ночному времени: модель CatBoost сохраняет высокую точность обнаружения, тогда как показатели полноты (recall) у GOES FDC в ночные часы падают до 0,03.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на сравнении алгоритмов; результаты могут зависеть от специфики спутниковых данных и условий конкретных регионов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"aktualnost-monitoringa-lesnyh-pozharov\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#aktualnost-monitoringa-lesnyh-pozharov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Актуальность мониторинга лесных пожаров&lt;/span&gt;&lt;/a&gt;Актуальность мониторинга лесных пожаров&lt;/h4&gt;\n&lt;p&gt;Лесные пожары представляют серьезную угрозу для экосистем, инфраструктуры и жизни людей. Масштаб проблемы растет: по данным за 1980–2023 годы, частота крупных катастроф, вызванных пожарами, увеличилась в четыре раза. Примером разрушительного события стал пожар Palisades Fire в Лос-Анджелесе (январь 2025 года), который за 24 дня уничтожил более 6800 строений и охватил 95 км², приведя к 12 смертельным исходам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Частота крупных лесных пожаров выросла в 4 раза за период с 1980 по 2023 год, что делает оперативность обнаружения критически важной для предотвращения катастроф.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для раннего обнаружения очагов возгорания широко используются геостационарные (&lt;a href=\"concepts/generative-engine-optimization.html\"&gt;GEO&lt;/a&gt;) спутники. Благодаря орбите, синхронизированной с вращением Земли, они позволяют наблюдать за одним регионом каждые 5–15 минут. Существующие алгоритмы, такие как FDC для спутников GOES и FRP-PIXEL для Meteosat, опираются на пороговые значения яркости. Однако они имеют существенные ограничения: алгоритм FDC часто пропускает возгорания, видимые в диапазоне 3,7 мкм, а оба метода демонстрируют высокий уровень ложных срабатываний.&lt;/p&gt;\n&lt;h4 id=\"mashinnoe-obuchenie-v-zadachah-obnaruzheniya\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#mashinnoe-obuchenie-v-zadachah-obnaruzheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Машинное обучение в задачах обнаружения&lt;/span&gt;&lt;/a&gt;Машинное обучение в задачах обнаружения&lt;/h4&gt;\n&lt;p&gt;Перспективным решением является применение алгоритмов машинного обучения (ML), способных выявлять сложные пространственно-спектральные закономерности. Обучение таких моделей требует размеченных данных, где каждый пиксель классифицируется как «пожар» или «не пожар» на основе независимых эталонных источников, например, данных спутников на низкой околоземной орбите (LEO) или отчетов лесных служб.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Машинное обучение — это метод анализа данных, при котором алгоритм самостоятельно «учится» находить закономерности (например, признаки пожара в спектре изображения) на основе большого количества примеров, а не следует жестко заданным правилам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Существующие исследования применяли как классические методы (Random Forest), так и глубокое обучение (CNN). Тем не менее, текущие модели часто ограничены малыми объемами обучающих выборок (несколько сотен пикселей), узкой географией и отсутствием сравнения с операционными алгоритмами. Также редко оценивается разница в эффективности работы моделей днем и ночью.&lt;/p&gt;\n&lt;h4 id=\"celi-i-metodologiya-issledovaniya\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#celi-i-metodologiya-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цели и методология исследования&lt;/span&gt;&lt;/a&gt;Цели и методология исследования&lt;/h4&gt;\n&lt;p&gt;Цель данной работы — создание ML-модели, превосходящей продукт GOES FDC по точности и количеству ложных срабатываний. Авторы использовали массив данных, включающий более 60 000 пикселей пожаров и около 1,2 млн пикселей без возгораний. В качестве эталона (ground truth) использовались данные прибора VIIRS (LEO). Обучение проводилось на данных 2022–2023 годов, а тестирование — на данных 2024 года, что позволило оценить способность модели к обобщению на новых временных и пространственных интервалах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель обучалась на данных 2022–2023 годов, а проверялась на данных 2024 года; результаты зависят от качества эталонных данных VIIRS, которые принимаются за истину.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2-oblast-issledovaniya-i-istochniki-dannyh\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#2-oblast-issledovaniya-i-istochniki-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Область исследования и источники данных&lt;/span&gt;&lt;/a&gt;2. Область исследования и источники данных&lt;/h4&gt;\n&lt;p&gt;В данном разделе описываются регионы, выбранные для анализа, и спутниковые снимки, использованные для обучения и оценки модели машинного обучения (ML) по обнаружению пожаров. Также сформирован &lt;a href=\"concepts/dataset.html\"&gt;набор данных&lt;/a&gt; по конкретным пожарам для сравнения эффективности раннего обнаружения модели с продуктом GOES FDC.&lt;/p&gt;\n&lt;h4 id=\"21-oblast-issledovaniya\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#21-oblast-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.1. Область исследования&lt;/span&gt;&lt;/a&gt;2.1. Область исследования&lt;/h4&gt;\n&lt;p&gt;Исследование охватывает территории США, Мексики и Канады с различными типами ландшафта: лесами, водно-болотными угодьями, пустынями, сельскохозяйственными и городскими зонами (Рис. 1). Территории были разделены на зоны для обучения (около 2,1 млн км²) и оценки (около 2 млн км²). В частности, штаты Флорида, Алабама, Миссисипи, Луизиана, Оклахома, а также мексиканские штаты Чиуауа и Дуранго использовались только для обучения. Техас и Джорджия применялись для обоих этапов, а Калифорния, Орегон, Аризона, Юта и часть Британской Колумбии — исключительно для оценки.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f1.jpg\" alt=\"Рисунок 1: Карты исследуемой территории. Штаты, использованные для обучения, отмечены черным цветом, для оценки — красны\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Карты исследуемой территории. Штаты, использованные для обучения, отмечены черным цветом, для оценки — красным, а штаты, использованные для обеих целей, — светло-голубым.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Общая площадь исследования составляет около 4,1 млн км², разделенных на зоны обучения и тестирования для обеспечения независимости результатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-istochniki-dannyh\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#22-istochniki-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. Источники данных&lt;/span&gt;&lt;/a&gt;2.2. Источники данных&lt;/h4&gt;\n&lt;p&gt;Наборы данных для обучения и оценки имеют идентичную структуру и включают обнаружения пожаров VIIRS, сопоставленные со снимками GOES Advanced Baseline Imager (ABI) с интервалом ±2,5 минуты. Обучающая выборка включает все данные VIIRS за 2022–2023 годы (324 502 обнаружения и 4 330 снимков GOES ABI). Оценочная выборка основана на данных 2024 года (см. Таблицу 1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIIRS — это радиометр, установленный на спутниках Suomi NPP, который позволяет фиксировать тепловые аномалии с разрешением 375 м.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"221-produkt-viirs-active-fire-dannye-ob-aktivnyh-ochagah-vozgoraniya\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#221-produkt-viirs-active-fire-dannye-ob-aktivnyh-ochagah-vozgoraniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2.1. Продукт VIIRS Active Fire (данные об активных очагах возгорания)&lt;/span&gt;&lt;/a&gt;2.2.1. Продукт VIIRS Active Fire (данные об активных очагах возгорания)&lt;/h4&gt;\n&lt;p&gt;В качестве эталона использован продукт VNP14IMG Collection 2. Он предоставляет координаты, время, мощность излучения пожара (FRP) и уровень достоверности. Пиксели с низкой достоверностью были исключены из анализа. Данные получены из архива NASA LAADS DAAC.&lt;/p&gt;\n&lt;h4 id=\"222-snimki-goes-abi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#222-snimki-goes-abi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2.2. Снимки GOES ABI&lt;/span&gt;&lt;/a&gt;2.2.2. Снимки GOES ABI&lt;/h4&gt;\n&lt;p&gt;Использовались три продукта с разрешением 2 км: многоканальные изображения облачности и влажности (MCMI), маска безоблачного неба (ACM) и продукт обнаружения пожаров (FDC). MCMI и ACM служат входными данными для модели, а FDC — эталоном для сравнения. FDC использует инфракрасные каналы для идентификации аномалий. Для анализа раннего обнаружения (раздел 4.4) оценка проводилась дважды: сначала с использованием категорий «обработанные» и «насыщенные» (наименьший уровень ложных срабатываний), затем с добавлением категории «высокая достоверность» для проверки возможности более раннего выявления очагов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование категории «высокая достоверность» повышает риск ложных срабатываний, что учитывается при оценке точности модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"223-dannye-o-perimetrah-pozharov-dlya-ocenki-rannego-obnaruzheniya\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#223-dannye-o-perimetrah-pozharov-dlya-ocenki-rannego-obnaruzheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2.3. Данные о периметрах пожаров для оценки раннего обнаружения&lt;/span&gt;&lt;/a&gt;2.2.3. Данные о периметрах пожаров для оценки раннего обнаружения&lt;/h4&gt;\n&lt;p&gt;Для сравнения возможностей раннего обнаружения модели и GOES FDC был создан набор данных по 51 конкретному пожару. Периметры событий были получены из базы данных WFIGS (Wildland Fire Interagency Geospatial Services), содержащей картографированные границы лесных пожаров в США.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Сводка событий возгораний&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Событие возгорания&lt;/th&gt;\n&lt;th&gt;Первое обнаружение возгорания&lt;/th&gt;\n&lt;th&gt;Разница во времени (минуты)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Beech&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;300&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bentley&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;480&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davis&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;445&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Smokehouse Creek&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;245&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Airport&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Blue Mountain&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Boise&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Dry Branch&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Duck Nest&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fall Branch&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fodderstack&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Foote&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Walker&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;(1) Только CatBoost и VIIRS; (2) Только VIIRS.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"effektivnost-catboost-v-sravnenii-s-goes-fdc\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#effektivnost-catboost-v-sravnenii-s-goes-fdc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эффективность CatBoost в сравнении с GOES FDC&lt;/span&gt;&lt;/a&gt;Эффективность CatBoost в сравнении с GOES FDC&lt;/h4&gt;\n&lt;p&gt;Модель CatBoost сравнивалась с продуктом GOES FDC по показателям полноты (recall), точности (precision) и F1-меры во всех пяти регионах исследования (Джорджия, Техас, Калифорния-Орегон, Аризона-Юта и Британская Колумбия). CatBoost продемонстрировал превосходство по всем метрикам, обеспечив более низкий уровень ложных срабатываний при равных или более высоких показателях обнаружения. В регионах, не участвовавших в обучении (Калифорния-Орегон, Аризона-Юта, Британская Колумбия), модель показала высокую способность к переносу знаний, превзойдя GOES FDC по F1-мере на 0,16–0,38.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost стабильно превосходит GOES FDC во всех регионах, включая те, что не использовались при обучении, с преимуществом по F1-мере до 0,38.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ конкретных случаев (Рис. 7) показал, что в Техасе ложное срабатывание возникло вблизи реального очага, вероятно, из-за теплового воздействия. В Джорджии модель пропустила небольшие очаги, которые были зафиксированы лишь однократно датчиками VIIRS.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f7.jpg\" alt=\"Рисунок 7: Пример прогнозов модели CatBoost на фоне изображений GOES-16 ABI FI в Техасе (слева) и Джорджии (справа). Обн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Пример прогнозов модели CatBoost на фоне изображений GOES-16 ABI FI в Техасе (слева) и Джорджии (справа). Обнаруженные пожары по данным VIIRS 375 м показаны зелеными квадратами. Пиксели прогноза CatBoost выделены цветом: красный для TP (истинно положительные), фиолетовый для FP (ложноположительные) и синий для FN (ложноотрицательные).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка основана на сравнении с продуктом VIIRS; пропуски в модели могут быть связаны с ограничениями пространственного разрешения спутниковых данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица S1.&lt;/strong&gt; Сводка 51 исторического события возгорания, использованного для сравнения первого обнаружения&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Событие возгорания&lt;/th&gt;\n&lt;th&gt;Время первого обнаружения VIIRS (UTC)&lt;/th&gt;\n&lt;th&gt;Штат&lt;/th&gt;\n&lt;th&gt;Долгота&lt;/th&gt;\n&lt;th&gt;Широта&lt;/th&gt;\n&lt;th&gt;Размер пожара (км²)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Area 6&lt;/td&gt;\n&lt;td&gt;28/1/2021 17:41&lt;/td&gt;\n&lt;td&gt;Florida&lt;/td&gt;\n&lt;td&gt;-81.268&lt;/td&gt;\n&lt;td&gt;27.682&lt;/td&gt;\n&lt;td&gt;17.5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;Windmill&lt;/td&gt;\n&lt;td&gt;2/3/2021 19:06&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-97.265&lt;/td&gt;\n&lt;td&gt;34.398&lt;/td&gt;\n&lt;td&gt;189.2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;CP-3&lt;/td&gt;\n&lt;td&gt;3/3/2021 18:41&lt;/td&gt;\n&lt;td&gt;Florida&lt;/td&gt;\n&lt;td&gt;-80.993&lt;/td&gt;\n&lt;td&gt;25.263&lt;/td&gt;\n&lt;td&gt;356.6&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;Dry Branch&lt;/td&gt;\n&lt;td&gt;5/3/2021 6:46&lt;/td&gt;\n&lt;td&gt;Alabama&lt;/td&gt;\n&lt;td&gt;-85.564&lt;/td&gt;\n&lt;td&gt;33.873&lt;/td&gt;\n&lt;td&gt;5.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;Pear Orchard&lt;/td&gt;\n&lt;td&gt;6/3/2021 17:46&lt;/td&gt;\n&lt;td&gt;Georgia&lt;/td&gt;\n&lt;td&gt;-83.41&lt;/td&gt;\n&lt;td&gt;34.537&lt;/td&gt;\n&lt;td&gt;9.6&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;6&lt;/td&gt;\n&lt;td&gt;Davis&lt;/td&gt;\n&lt;td&gt;7/3/2021 7:51&lt;/td&gt;\n&lt;td&gt;Mississippi&lt;/td&gt;\n&lt;td&gt;-89.176&lt;/td&gt;\n&lt;td&gt;31.128&lt;/td&gt;\n&lt;td&gt;9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;7&lt;/td&gt;\n&lt;td&gt;Melder One&lt;/td&gt;\n&lt;td&gt;7/3/2021 19:11&lt;/td&gt;\n&lt;td&gt;Lousiana&lt;/td&gt;\n&lt;td&gt;-92.557&lt;/td&gt;\n&lt;td&gt;31.103&lt;/td&gt;\n&lt;td&gt;13.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;8&lt;/td&gt;\n&lt;td&gt;Narrows&lt;/td&gt;\n&lt;td&gt;7/3/2021 19:11&lt;/td&gt;\n&lt;td&gt;Georgia&lt;/td&gt;\n&lt;td&gt;-85.24&lt;/td&gt;\n&lt;td&gt;34.537&lt;/td&gt;\n&lt;td&gt;0.8&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;9&lt;/td&gt;\n&lt;td&gt;Mt Wiesner&lt;/td&gt;\n&lt;td&gt;7/3/2021 19:11&lt;/td&gt;\n&lt;td&gt;Alabama&lt;/td&gt;\n&lt;td&gt;-85.687&lt;/td&gt;\n&lt;td&gt;34.018&lt;/td&gt;\n&lt;td&gt;11&lt;/td&gt;\n&lt ;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;44&lt;/td&gt;\n&lt;td&gt;Line&lt;/td&gt;\n&lt;td&gt;6/9/2024 9:51&lt;/td&gt;\n&lt;td&gt;California&lt;/td&gt;\n&lt;td&gt;-117.066&lt;/td&gt;\n&lt;td&gt;34.16&lt;/td&gt;\n&lt;td&gt;265.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;45&lt;/td&gt;\n&lt;td&gt;Airport&lt;/td&gt;\n&lt;td&gt;8/9/2024 9:16&lt;/td&gt;\n&lt;td&gt;California&lt;/td&gt;\n&lt;td&gt;-117.493&lt;/td&gt;\n&lt;td&gt;33.662&lt;/td&gt;\n&lt;td&gt;137.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;46&lt;/td&gt;\n&lt;td&gt;Carson Six&lt;/td&gt;\n&lt;td&gt;16/10/2024 18:41&lt;/td&gt;\n&lt;td&gt;Mississippi&lt;/td&gt;\n&lt;td&gt;-89.055&lt;/td&gt;\n&lt;td&gt;30.541&lt;/td&gt;\n&lt;td&gt;7.4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;47&lt;/td&gt;\n&lt;td&gt;Rush&lt;/td&gt;\n&lt;td&gt;25/10/2024 7:51&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-98.632&lt;/td&gt;\n&lt;td&gt;34.748&lt;/td&gt;\n&lt;td&gt;74.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;48&lt;/td&gt;\n&lt;td&gt;North Road&lt;/td&gt;\n&lt;td&gt;29/10/2024 19:36&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-96.341&lt;/td&gt;\n&lt;td&gt;36.629&lt;/td&gt;\n&lt;td&gt;23.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;49&lt;/td&gt;\n&lt;td&gt;Beech&lt;/td&gt;\n&lt;td&gt;2/12/2024 7:41&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-94.494&lt;/td&gt;\n&lt;td&gt;34.61&lt;/td&gt;\n&lt;td&gt;1.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;50&lt;/td&gt;\n&lt;td&gt;Middleton&lt;/td&gt;\n&lt;td&gt;16/2/2025 18:36&lt;/td&gt;\n&lt;td&gt;Texas&lt;/td&gt;\n&lt;td&gt;-94.395&lt;/td&gt;\n&lt;td&gt;29.619&lt;/td&gt;\n&lt;td&gt;16.6&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;51&lt;/td&gt;\n&lt;td&gt;Two Barrel&lt;/td&gt;\n&lt;td&gt;26/2/2025 18:46&lt;/td&gt;\n&lt;td&gt;Florida&lt;/td&gt;\n&lt;td&gt;-85.001&lt;/td&gt;\n&lt;td&gt;30.185&lt;/td&gt;\n&lt;td&gt;6.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;В таблице указаны название пожара, отметка времени первого обнаружения VIIRS, штат, координаты центроида (широта и долгота) и размер пожара (в км²).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"vliyanie-razmera-obuchayushej-vyborki-na-rabotu-catboost\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#vliyanie-razmera-obuchayushej-vyborki-na-rabotu-catboost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние размера обучающей выборки на работу CatBoost&lt;/span&gt;&lt;/a&gt;Влияние размера обучающей выборки на работу CatBoost&lt;/h4&gt;\n&lt;p&gt;Для оценки значимости данных авторы сравнили основную модель (66 000 пикселей пожаров) с двумя уменьшенными версиями: обученной на случайной выборке (2 000 пикселей пожаров и 20 000 фоновых) и обученной только на данных за апрель-май. Результаты (Рис. 9) показывают, что использование малых или сезонно ограниченных выборок ведет к росту числа ложных тревог. Например, в Аризоне-Юте точность основной модели составила 0,81 против 0,50 и 0,42 у уменьшенных моделей. Полнота (recall) оказалась более стабильной, однако модель, обученная только на весенних данных, показала значительное снижение полноты в Джорджии (0,21 против 0,33–0,35).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f9.jpg\" alt=\"Рисунок 9: Сравнение показателей эффективности моделей CatBoost, использующих различное количество пикселей пожара для о\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9: Сравнение показателей эффективности моделей CatBoost, использующих различное количество пикселей пожара для обучения в пяти различных регионах оценки.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;F1-мера — это среднее гармоническое между точностью и полнотой, позволяющее оценить баланс между пропуском целей и ложными срабатываниями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Использование обширного и разнообразного набора данных критически важно для обобщающей способности модели. Модели с малым объемом данных хуже справляются с регионами, не представленными в обучающей выборке, что подтверждает необходимость репрезентативного охвата для минимизации ошибок.&lt;/p&gt;\n&lt;h4 id=\"vozmozhnosti-rannego-obnaruzheniya\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#vozmozhnosti-rannego-obnaruzheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Возможности раннего обнаружения&lt;/span&gt;&lt;/a&gt;Возможности раннего обнаружения&lt;/h4&gt;\n&lt;p&gt;Раннее выявление очагов возгорания критически важно для предотвращения их перерастания в масштабные пожары. Для оценки эффективности модели CatBoost в сравнении с продуктом GOES FDC был сформирован набор данных из 51 пожара. Анализ охватывал период за 8 часов до и 2 часа после первого обнаружения пожара спутником VIIRS. Для каждого события изображения обрезались до буфера в 10 км вокруг периметра пожара, после чего вычислялась разница во времени (в минутах) между первым срабатыванием CatBoost и GOES FDC.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель CatBoost продемонстрировала преимущество в раннем обнаружении: в первом сценарии она выявила 22 пожара раньше GOES FDC (в среднем на 20 ± 17 минут), тогда как GOES FDC опередил модель только в 6 случаях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На Рис. 10 представлены результаты для 38 пожаров, обнаруженных обоими методами до фиксации VIIRS. В первом варианте анализа (только категории «processed» и «saturated») CatBoost показал среднее время опережения 20 минут (стандартное отклонение 17 минут). Во втором варианте, с добавлением категории «high confidence», CatBoost обнаружил 19 пожаров раньше (среднее 18 ± 16 минут), а GOES FDC — 9 пожаров. В 10 случаях методы сработали одновременно.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f10.jpg\" alt=\"Рисунок 10: Разница во времени первого обнаружения между CatBoost и GOES FDC для различных очагов возгорания. На панели \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10: Разница во времени первого обнаружения между CatBoost и GOES FDC для различных очагов возгорания. На панели A представлен анализ с использованием только обработанных и насыщенных категорий FDC, на панели B включена категория «высокая». Очаги возгорания, обнаруженные одновременно моделями CatBoost и GOES FDC, имеют метку временного сдвига «0».&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование категории «high confidence» в GOES FDC повышает &lt;a href=\"concepts/sensitivity.html\"&gt;чувствительность&lt;/a&gt;, но может приводить к увеличению числа ложных срабатываний, что требует осторожности при интерпретации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ отдельных случаев (Howell, Blue Stem, Candy Creek, Silver King) показывает, что включение категории «high confidence» позволяет GOES FDC иногда обнаруживать пожары раньше модели. Например, в случае Candy Creek модель FDC сработала на 30 минут раньше CatBoost. Однако в целом из 51 события CatBoost обнаружил 26 (в первом анализе) и 23 (во втором) пожара раньше других систем, подтверждая более высокую эффективность раннего выявления.&lt;/p&gt;\n&lt;h4 id=\"veroyatnost-obnaruzheniya-pozhara\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#veroyatnost-obnaruzheniya-pozhara\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вероятность обнаружения пожара&lt;/span&gt;&lt;/a&gt;Вероятность обнаружения пожара&lt;/h4&gt;\n&lt;p&gt;Этот раздел посвящен оценке чувствительности методов к размеру пожара через сопоставление с данными VIIRS в окне 3×3 пикселя. Для оценки использовались уравнения (5), (6) и (7), где NTP,k — количество истинно положительных результатов (обнаружение моделью при наличии не менее k пикселей VIIRS), а NFN,k — количество ложноотрицательных результатов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод использует окно 3×3 для учета пространственной неопределенности: если модель фиксирует пожар в радиусе одного пикселя от данных VIIRS, это считается успешным обнаружением.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вероятность обнаружения рассчитывалась как отношение количества успешно выявленных пикселей к общему числу пикселей, содержащих не менее k обнаружений VIIRS. Данный подход позволяет оценить, насколько эффективно алгоритмы реагируют на пожары различной интенсивности и площади.&lt;/p&gt;\n&lt;h4 id=\"veroyatnost-obnaruzheniya-pozharov\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#veroyatnost-obnaruzheniya-pozharov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вероятность обнаружения пожаров&lt;/span&gt;&lt;/a&gt;Вероятность обнаружения пожаров&lt;/h4&gt;\n&lt;p&gt;Авторы оценивают вероятность обнаружения пожара моделью CatBoost в сравнении с алгоритмом GOES FDC, используя формулу (8), где P(M(i', j') = 1 / V(i, j) ≥ k) представляет собой отношение истинно положительных результатов к сумме истинно положительных и ложноотрицательных для заданного порога k. Порог k определяет минимальное количество обнаружений пожара спутником VIIRS внутри одного пикселя GOES ABI.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель CatBoost демонстрирует более высокую чувствительность к малым очагам возгорания по сравнению с GOES FDC во всех пяти регионах исследования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На Рис. 11 представлены результаты для пяти регионов: Джорджия, Техас, Калифорния-Орегон, Аризона-Юта и Британская Колумбия. В регионах Калифорния-Орегон, Аризона-Юта и Британская Колумбия CatBoost показывает значительно более высокие вероятности обнаружения. Например, в Калифорнии и Орегоне при k=1 вероятность для GOES FDC составляет 0,28, тогда как для CatBoost — 0,46. При увеличении порога до k=5 разрыв возрастает: 0,78 у CatBoost против 0,48 у GOES FDC.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f11.jpg\" alt=\"Рисунок 11: Вероятность обнаружения пикселя пожара алгоритмами CatBoost и GOES FDC в зависимости от минимального количес\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 11: Вероятность обнаружения пикселя пожара алгоритмами CatBoost и GOES FDC в зависимости от минимального количества обнаружений пожара VIIRS внутри пикселя GOES ABI (k). Регионы оценки: (A) Джорджия, (B) Техас, (C) Калифорния — Орегон, (D) Аризона — Юта и (E) Британская Колумбия.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIIRS — спутниковый радиометр с более высоким пространственным разрешением, используемый здесь как «эталон» для проверки работы алгоритма на данных GOES.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В Техасе CatBoost превосходит GOES FDC при порогах ниже k=10. Однако при k=10 вероятность GOES FDC становится выше. Авторы связывают это с малым размером выборки: в данном регионе было зафиксировано всего восемь пикселей ABI, содержащих десять и более обнаружений VIIRS. В целом, модель CatBoost стабильно показывает более высокую чувствительность к небольшим пожарам, что делает её более эффективным инструментом для их раннего выявления в большинстве рассмотренных условий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничение: результаты в Техасе при высоких значениях k ограничены крайне малым количеством наблюдений, что снижает статистическую достоверность для этого конкретного порога.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-obsuzhdenie-i-vyvody\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#5-obsuzhdenie-i-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Обсуждение и выводы&lt;/span&gt;&lt;/a&gt;5. Обсуждение и выводы&lt;/h4&gt;\n&lt;p&gt;В данном исследовании для обнаружения лесных пожаров была обучена модель CatBoost на основе обширного набора данных спутника GOES-16 ABI. Выбор CatBoost обусловлен эффективностью этого фреймворка градиентного бустинга и относительной простотой обучения. В качестве эталона для обучения и оценки использовались данные обнаружения пожаров VIIRS. Результаты показывают, что модель CatBoost превосходит стандартный продукт GOES FDC по всем пяти исследованным регионам, демонстрируя более высокие показатели точности (precision), полноты (recall) и F1-меры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель CatBoost стабильно превосходит стандартный продукт GOES FDC по точности и полноте обнаружения пожаров, особенно в ночное время.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Относительно низкие показатели полноты у обеих моделей объясняются низким пространственным разрешением ABI по сравнению с VIIRS: малые очаги возгорания, фиксируемые VIIRS, часто классифицировались как ложноотрицательные результаты. Тем не менее, CatBoost показал лучшие результаты, чем GOES FDC. Способность модели к обобщению подтверждается её эффективностью в регионах, не участвовавших в обучении (Калифорния, Орегон, Аризона, Юта, Британская Колумбия), где климатические условия и углы обзора спутника отличались от тренировочных данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Полнота (recall) — доля реально существующих пожаров, которые удалось обнаружить модели. Низкий показатель означает, что модель пропускает много возгораний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение работы моделей днем и ночью выявило значительные различия: если CatBoost сохранял надежность обнаружения в ночное время, то полнота GOES FDC падала почти до нуля. Дополнительный анализ показал, что обучение на малых выборках (например, 2000 пикселей пожара) приводит к росту числа ложных срабатываний и снижает способность модели работать в новых регионах, что подчеркивает важность использования больших и разнообразных наборов данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено использованием данных только для Северной Америки (CONUS и PACUS) и сравнением исключительно с данными VIIRS, что не учитывает другие источники высокого разрешения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы отмечают, что их работа расширяет предыдущие исследования, такие как работа Zhao и Ban (2022), за счет охвата крупных географических регионов, а не отдельных событий, и прямого сравнения с операционным продуктом GOES FDC. К ограничениям работы относится отсутствие тестирования на полнодисковых изображениях и использование только одного типа модели (CatBoost). Тем не менее, результаты подтверждают, что машинное обучение способно значительно улучшить оперативный мониторинг пожаров, обеспечивая более раннее обнаружение и снижение количества ложных тревог.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"algoritm-obnaruzheniya-pozharov\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#algoritm-obnaruzheniya-pozharov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Алгоритм обнаружения пожаров&lt;/span&gt;&lt;/a&gt;Алгоритм обнаружения пожаров&lt;/h4&gt;\n&lt;p&gt;Процесс разработки алгоритма машинного обучения включает четыре этапа: пространственное сопоставление данных VIIRS с сеткой GOES ABI, формирование размеченного набора данных, обучение модели и её последующая оценка. Исходный код и примеры данных доступны в репозитории авторов.&lt;/p&gt;\n&lt;h4 id=\"sopostavlenie-dannyh-viirs-s-setkoj-goes-abi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#sopostavlenie-dannyh-viirs-s-setkoj-goes-abi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сопоставление данных VIIRS с сеткой GOES ABI&lt;/span&gt;&lt;/a&gt;Сопоставление данных VIIRS с сеткой GOES ABI&lt;/h4&gt;\n&lt;p&gt;Поскольку инструменты VIIRS и GOES ABI имеют различное пространственное разрешение, центроиды точек обнаружения пожаров VIIRS были переведены в растровый формат сетки GOES ABI. Пиксели, не имеющие пересечений с данными VIIRS, получили значение 0. Для преобразования использовалась библиотека Rasterio. Также была проведена очистка данных от дубликатов, возникающих из-за эффекта «галстука-бабочки» (bowtie effect) при сканировании, с применением метода, описанного в работе авторов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффект «галстука-бабочки» — это искажение данных при сканировании спутником, приводящее к перекрытию пикселей на краях полосы обзора.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"formirovanie-razmechennogo-nabora-dannyh\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#formirovanie-razmechennogo-nabora-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Формирование размеченного набора данных&lt;/span&gt;&lt;/a&gt;Формирование размеченного набора данных&lt;/h4&gt;\n&lt;p&gt;Для разметки пикселей GOES ABI как «пожар» или «не пожар» учитывалось пространственное несовпадение данных между спутниками, которое может достигать нескольких километров. Для коррекции этого смещения вокруг каждой точки VIIRS с обнаруженным пожаром применялось буферное окно 3×3. Внутри этого окна пиксель GOES ABI с наибольшим значением индекса пожара (Fire Index, FI) помечался как «пожар». Индекс FI рассчитывается по формуле &lt;span class=\"yfm-latex\" data-content=\"FI%20%3D%20%5Cfrac%7BB_%7B3.9%7D%20-%20B_%7B11.2%7D%7D%7BB_%7B3.9%7D%20%2B%20B_%7B11.2%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где B3.9 и B11.2 — яркостные температуры в соответствующих инфракрасных каналах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Индекс пожара (FI) использует разницу между коротковолновым и тепловым инфракрасными каналами, так как первый более чувствителен к высокотемпературным очагам возгорания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для формирования класса «не пожар» отбиралось 500 пикселей на каждое изображение, которые не пересекались с зонами пожаров и не находились вблизи них. Для каждого пикселя извлекались значения 16 спектральных каналов и FI, а также вычислялись статистические показатели (среднее, медиана, минимум, максимум, стандартное отклонение) для 17 параметров в окне 3×3. Это дало 102 признака для обучения. Пиксели, закрытые облаками, исключались из расчетов.&lt;/p&gt;\n&lt;p&gt;Для фильтрации мелких очагов, которые GOES ABI не может надежно зафиксировать, применялись критерии: наличие не менее 2 обнаружений VIIRS в окне 3×3 и значение FI &amp;gt; 0. Для борьбы с дисбалансом классов (преобладанием пикселей без пожаров) было установлено соотношение 1:20 между пожарными и непожарными пикселями, что обеспечило лучший показатель F1-меры. Итоговый набор данных после фильтрации составил 65 877 пикселей с пожарами и 1 317 540 пикселей без них.&lt;/p&gt;\n&lt;h4 id=\"obuchenie-modeli\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#obuchenie-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обучение модели&lt;/span&gt;&lt;/a&gt;Обучение модели&lt;/h4&gt;\n&lt;p&gt;Для обнаружения пожаров был использован алгоритм CatBoost, основанный на методе градиентного бустинга над решающими деревьями. В отличие от классических подходов, CatBoost минимизирует риск переобучения и утечки данных за счет использования упорядоченного бустинга, встроенной обработки категориальных признаков и «незабывающих» (oblivious) деревьев решений. Обучающая выборка была разделена в соотношении 80% для обучения и 20% для валидации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost — это алгоритм машинного обучения, который последовательно строит деревья решений, где каждое последующее дерево исправляет ошибки предыдущих, что позволяет эффективно работать с табличными данными без сложной предобработки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenka-tochnosti-algoritma-obnaruzheniya-pozharov\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#ocenka-tochnosti-algoritma-obnaruzheniya-pozharov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка точности алгоритма обнаружения пожаров&lt;/span&gt;&lt;/a&gt;Оценка точности алгоритма обнаружения пожаров&lt;/h4&gt;\n&lt;p&gt;Для оценки точности учитывались пространственные расхождения между данными спутников GOES ABI и VIIRS. Если алгоритм предсказывает пожар в пикселе (i, j), результат классифицируется как истинно положительный (TP), если в окне 3 × 3 вокруг этого пикселя есть хотя бы одно обнаружение VIIRS. В противном случае пиксель считается ложноположительным (FP). Ложноотрицательный результат (FN) фиксируется, если в окне 3 × 3 вокруг реального обнаружения VIIRS отсутствует предсказание модели. Процесс сопоставления представлен на Рис. 5.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f5.jpg\" alt=\"Рисунок 5: Иллюстрация оценки точности алгоритма обнаружения пожаров на основе данных GEO с использованием окна 3 × 3. (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Иллюстрация оценки точности алгоритма обнаружения пожаров на основе данных GEO с использованием окна 3 × 3. (слева) Красные пиксели — обнаружения пожаров на основе GEO; (в центре) розовые пиксели — растеризованные данные об обнаружении пожаров VIIRS; (справа) FN, TP и FP — это ложноотрицательный, истинноположительный и ложноположительный результаты соответственно.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Для оценки качества классификации используются метрики полноты (recall), точности (precision) и F1-меры. Полнота показывает долю верно выявленных пожаров, точность — долю корректных срабатываний среди всех отмеченных моделью, а F1-мера является их гармоническим средним. Расчеты проводятся на основе суммарных показателей TPtotal, FPtotal и FNtotal по всему набору изображений согласно формулам (2), (3) и (4).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f2.jpg\" alt=\"Рисунок 2: Карта расположения 51 пожара с их идентификационными номерами. Например, пожар номер 19 — это пожар Bobcat во\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Карта расположения 51 пожара с их идентификационными номерами. Например, пожар номер 19 — это пожар Bobcat во Флориде, произошедший 29 мая 2021 года.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f3.jpg\" alt=\"Рисунок 3: Растеризация данных о пожарах, полученных с помощью VIIRS, на сетку GOES ABI.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Растеризация данных о пожарах, полученных с помощью VIIRS, на сетку GOES ABI.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f4.jpg\" alt=\"Рисунок 4: Иллюстрация процесса маркировки пожаров.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Иллюстрация процесса маркировки пожаров.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Иллюстрация процесса маркировки пожаров. Слева: обнаружение пожара датчиком VIIRS в пикселе (i, j) в растеризованной матрице VIIRS V. Справа: окно 3 × 3 применяется к матрице GOES MCMI G. Пиксель G(i′, j′) с наибольшим значением FI помечается как пожар.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f6.jpg\" alt=\"Рисунок 6: Сравнение показателей эффективности (полнота, точность и F1-мера) модели CatBoost и продукта GOES FDC в пяти \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Сравнение показателей эффективности (полнота, точность и F1-мера) модели CatBoost и продукта GOES FDC в пяти различных регионах оценки.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f8.jpg\" alt=\"Рисунок 8: Показатели полноты, точности и F1-меры модели CatBoost и GOES FDC по всем исследуемым регионам. Панель A (вер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8: Показатели полноты, точности и F1-меры модели CatBoost и GOES FDC по всем исследуемым регионам. Панель A (верхняя) — ночное время, панель B (нижняя) — дневное время.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Низкая&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точность&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;текущих систем&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мониторинга&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Обучение&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CatBoost на&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;данных VIIRS и&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;GOES&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Повышение&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точности и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;скорости&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;детекции&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕ
