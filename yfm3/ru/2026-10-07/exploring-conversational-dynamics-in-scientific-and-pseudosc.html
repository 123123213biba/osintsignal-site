            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"90\" cy=\"61\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"610\" cy=\"297\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · PLATFORMS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему в комментариях под&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;псевдонаучными видео так&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;много доброты?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f1.jpg\" alt=\"Представление рабочего процесса получения корпуса видео, использованного в исследовании.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Представление рабочего процесса получения корпуса видео, использованного в исследовании.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи изучили более 50 тысяч комментариев под видео о здоровье, чтобы понять, как формируются сообщества вокруг науки и лженауки. Оказалось, что структура общения в этих группах принципиально разная. В то время как научные дискуссии фокусируются на лечении и критике, псевдонаучные ветки превращаются в площадки для эмоционального сближения. Это объясняет, почему факты часто проигрывают в борьбе за внимание аудитории.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Научные дискуссии на YouTube характеризуются критическим обменом мнениями и запросами на медицинскую информацию.&lt;/li&gt;\n&lt;li&gt;Псевдонаучные сообщества строятся на эмоциональном подтверждении, благодарностях и создании чувства общности.&lt;/li&gt;\n&lt;li&gt;Использование процессной аналитики позволяет визуализировать скрытые поведенческие паттерны в комментариях.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Авторы использовали метод process mining (процессная аналитика), позволяющий моделировать последовательности действий как в бизнес-процессах, для анализа 52 412 комментариев на YouTube. Данные собирались с 2011 по 2025 год через официальный API. Видео были разделены на «научные» (20 387 комментариев) и «псевдонаучные» (32 025 комментариев) с помощью больших языковых моделей (&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;). Для оценки тональности и тематики применялась обработка естественного языка (NLP).&lt;/p&gt;\n&lt;p&gt;Сетевой анализ показал, что в научных ветках доминируют запросы на советы и негативные оценки, что отражает критический подход. Напротив, псевдонаучные сообщества демонстрируют паттерны «социально-эмоционального связывания»: благодарности, комплименты и использование эмодзи. Процессная модель подтвердила, что в псевдонаучных дискуссиях пользователи чаще обмениваются короткими подтверждающими сообщениями, создавая ощущение принадлежности к группе, что делает их устойчивыми к внешнему опровержению.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено выборкой видео на испанском языке и не учитывает влияние алгоритмов рекомендаций YouTube на формирование этих сообществ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Распространение медицинской дезинформации в социальных сетях&lt;br /&gt;\nВ последние десятилетия цифровая медиасреда способствовала широкому распространению псевдонаучных дискурсов о здоровье. Платформы, такие как YouTube (Google LLC), имеющие более 2,5 миллиардов активных пользователей в месяц, стали основными источниками медицинской информации. Однако систематические обзоры показывают, что контент о здоровье на YouTube часто имеет качество от среднего до ниже среднего, а недостоверная или вводящая в заблуждение информация остается распространенной по всем медицинским темам. Это явление, часто называемое «инфодемией», относится к избытку информации, затрудняющему поиск надежных источников и рекомендаций. Пандемия COVID-19 подчеркнула, как социальные сети могут усиливать непроверенную информацию, теории заговора и ложные утверждения, что потенциально несет серьезные последствия для общественного доверия и здоровья. Медицинская дезинформация остается устойчивой проблемой общественного здравоохранения и после пандемии.&lt;/p&gt;\n&lt;p&gt;Медицинская дезинформация в широком смысле определяется как утверждение, связанное со здоровьем, которое является ложным, вводящим в заблуждение или не подтверждается текущими научными знаниями. Ее последствия могут включать ухудшение клинических исходов, &lt;a href=\"concepts/anchoring.html\"&gt;закрепление&lt;/a&gt; ложных убеждений и снижение приверженности рекомендациям общественного здравоохранения. Например, среди пациентов с раком молочной железы использование альтернативной медицины ассоциировалось с сокращением выживаемости. Это также может подкреплять неподтвержденные или иллюзорные представления о здоровье и снижать соблюдение санитарных рекомендаций во время чрезвычайных ситуаций. Дезинформация распространена по многим темам, включая вакцины, табачные изделия и неинфекционные заболевания, такие как рак, при этом платформы, включая Twitter (X Corp) и YouTube, служат основными площадками для этих дискуссий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Медицинская дезинформация на YouTube остается распространенной и связана с негативными последствиями для здоровья, такими как снижение приверженности лечению и ухудшение клинических исходов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Традиционные стратегии борьбы с медицинской дезинформацией, такие как проверка фактов (фактчекинг), показали ограниченную эффективность. Недавний обзор показал, что текущие модели фактчекинга предполагают компромиссы между доверием, масштабируемостью и влиянием, при этом ни профессиональные, ни общественные подходы не демонстрируют высоких результатов по всем трем измерениям. На индивидуальном уровне исследования показывают, что пользователи, столкнувшиеся с фактчекингом, могут продолжать распространять неверную информацию, что указывает на недостаточность таких вмешательств. Более того, попытки опровергнуть научно значимую дезинформацию в среднем могут не приводить к статистически значимым изменениям в убеждениях или отношениях получателей, что согласуется с предыдущими данными о том, что убеждения могут сохраняться, несмотря на корректирующую информацию, особенно при социальной поддержке.&lt;/p&gt;\n&lt;p&gt;Это указывает на необходимость лучшего понимания глубинных социальных и психологических драйверов вовлеченности, которые могут мотивировать пользователей соответствовать групповым нормам. Предыдущие исследования выявили существование поляризованных онлайн-сообществ. Например, исследования на таких платформах, как Facebook (Meta Platforms, Inc), показали, что псевдонаучные сообщества склонны к изоляции, подкрепляя свои убеждения внутри «эхо-камер», тогда как научные сообщества более склонны взаимодействовать с противоположными точками зрения в попытке их опровергнуть. Более поздние исследования продолжают выявлять поляризованные структуры взаимодействия в дискуссиях в социальных сетях, одновременно подчеркивая, что сетевое разделение не всегда напрямую коррелирует со сходством выражаемых мнений.&lt;/p&gt;\n&lt;p&gt;Для понимания этих явлений в исследованиях псевдонаучного дискурса использовались разнообразные методы: от ручной классификации контента до сетевого и лингвистического анализа. Например, сетевой анализ применялся для картирования антивакцинаторских сообществ в Twitter, а обработка естественного языка (NLP) использовалась для выявления лингвистических паттернов в дискурсе отрицания. Аналогичным образом, интеллектуальный анализ текстов заголовков видео на YouTube использовался для отслеживания общественного мнения, хотя он не рассматривал взаимодействия пользователей в разделах комментариев. Недавний систематический обзор 813 публикаций выделил 4 методологических подхода к исследованию медицинской дезинформации: количественные и качественные социальные исследования с использованием данных участников, а также количественные и качественные анализы данных цифровых медиа. В обзоре также отмечается, что, хотя вычислительные подходы все чаще используются для анализа крупномасштабных цифровых данных, их следует дополнять качественными и традиционными социальными исследованиями для обеспечения контекстуальной глубины.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Методологическое разнообразие на уровне области не означает интеграцию внутри отдельных исследований; большинство работ фокусируются на одном методе (например, сетевой анализ или оценка контента), что ограничивает понимание взаимодействия семантических, структурных и временных аспектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данное исследование направлено на восполнение этого пробела путем внедрения новой методологической базы, сочетающей NLP с интеллектуальным анализом процессов (process mining) и сетевым анализом для изучения динамики общения. Наш подход начинается с использования NLP для характеристики каждого комментария в соответствии с его тематическим содержанием и тональностью. После этого мы применяем интеллектуальный анализ процессов — дисциплину из области управления бизнес-процессами, которая обнаруживает, отслеживает и улучшает реальные процессы путем извлечения знаний из журналов событий. Интеллектуальный анализ процессов уже применялся в определенных контекстах здравоохранения, таких как клинические пути и организационные рабочие процессы. В данном исследовании мы расширяем этот методологический подход для моделирования разговорной динамики взаимодействий пользователей, связанных со здравоохранением.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Интеллектуальный анализ процессов (process mining) — это метод анализа данных, который позволяет визуализировать последовательности событий (в данном случае — комментариев) как «процесс», выявляя типичные пути взаимодействия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основная цель данного исследования — использовать интеллектуальный анализ процессов и тематический сетевой анализ для обнаружения, анализа, визуализации и сравнения повторяющихся разговорных паттернов в полученных выборках веток комментариев YouTube, связанных с научным и псевдонаучным медицинским контентом. Вторичная цель — оценить полезность этих взаимодополняющих методов для характеристики последовательных и структурных различий в онлайн-взаимодействиях, связанных со здоровьем, и для формирования гипотез, которые могут информировать будущие исследования и коммуникационные стратегии в цифровой информационной экосистеме.&lt;/p&gt;\n&lt;p&gt;Методология данного исследования была структурирована в соответствии с рамочной программой CRISP-DM (Cross-Industry Standard Process for Data Mining), адаптированной под стандартный формат IMRD (Введение, Методы, Результаты и Обсуждение). Исследование было описано в соответствии с заявлением STROBE (Strengthening the Reporting of Observational Studies in Epidemiology), как наиболее подходящим руководством для наблюдательных исследований. Учитывая отсутствие специфических рекомендаций по отчетности для исследований здоровья на YouTube, контрольный список был адаптирован к характеристикам исследования, а неприменимые пункты были явно идентифицированы. Заполненный контрольный список STROBE представлен в Приложении 1.&lt;/p&gt;\n&lt;p&gt;Поиск был ограничен YouTube, поскольку платформа предлагает бесплатный общедоступный API, который обеспечивает простой и законный сбор данных с относительно небольшим количеством ограничений доступа. Видео-кандидаты были получены в период с 4 по 6 мая 2025 года, а связанные с ними ветки комментариев были собраны с 5 по 12 мая 2025 года. Поскольку оба процесса частично перекрывались, общий период сбора данных составил с 4 по 12 мая 2025 года. Корпус комментариев YouTube был составлен с использованием официального API YouTube Data.&lt;/p&gt;\n&lt;p&gt;Извлечение данных изначально было сосредоточено на видео, актуальных для испаноязычных пользователей, с установкой параметра API relevanceLanguage на «es». Однако алгоритмы поиска платформы по своей сути извлекают контент на нескольких языках, если он считается высокорелевантным поисковому запросу. В результате полученный корпус продемонстрировал значительное лингвистическое разнообразие. Мы решили сохранить многоязычный контент, чтобы охватить более широкие, кросс-культурные поведенческие паттерны. Стратегия поиска была разработана для охвата 2 различных категорий контента: научные медицинские методы лечения и псевдонаучные методы лечения. В данном исследовании «псевдонаучный» используется как операциональная аналитическая категория, основанная на установленном научном консенсусе относительно эффективности упоминаемых методов терапии, и не является суждением об отдельных пользователях или их мотивации. Набор конкретных репрезентативных поисковых терминов использовался для каждой категории, как подробно описано в Таблице 1.&lt;/p&gt;\n&lt;p&gt;Качественная классификация была выполнена с использованием большой языковой модели (LLM) Gemini от Google. Модели предоставлялись название, описание и теги видео, а также подробная инструкция по категоризации видео как «научное», «псевдонаучное» или «нерелевантное». Инструкция четко определяла каждую категорию и предписывала модели присваивать статус «нерелевантное», если информация была неоднозначной или недостаточной, что обеспечивало консервативный подход к классификации. Только видео, где категория исходного поискового термина (научный или псевдонаучный) совпадала с классификацией LLM, были включены в выборку. Этот &lt;a href=\"concepts/step.html\"&gt;шаг&lt;/a&gt; был критически важен для исключения неоднозначных случаев, таких как научные видео, опровергающие псевдонаучные утверждения, которые могли быть получены по псевдонаучному поисковому запросу, тем самым обеспечивая четкое разделение между двумя типами аудитории.&lt;/p&gt;\n&lt;p&gt;Для каждого комментария применялся &lt;a href=\"concepts/pipeline.html\"&gt;конвейер&lt;/a&gt; NLP для извлечения признаков, необходимых для последующего анализа. Реконструкция веток разговора: для каждого родительского комментария API использовался для получения всех прямых ответов. Эта структура сохранялась в наборе данных, при этом каждый комментарий был связан с родительским и имел Conversation_id. Анализ тональности: тональность каждого комментария определялась с использованием модели nlptown/bert-base-multilingual-uncased-sentiment из библиотеки Hugging Face. Тематическая категоризация: для классификации темы или намерения каждого комментария использовался подход &lt;a href=\"concepts/zero-shot.html\"&gt;zero-shot&lt;/a&gt; классификации с применением модели MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7.&lt;/p&gt;\n&lt;p&gt;Для обеспечения качества аналитического корпуса были реализованы несколько этапов предварительной обработки. Основной единицей анализа была ветка разговора. Поэтому включались только те комментарии, которые были частью ветки, содержащей как минимум один ответ; изолированные комментарии верхнего уровня без ответов не загружались, так как они не вносят вклад в структуру разговора. Что касается лингвистического разнообразия, язык каждого комментария был идентифицирован с помощью модели papluca/xlm-roberta-base-language-detection. Также была проведена проверка на дубликаты комментариев по всему корпусу; однако дубликаты не были выявлены.&lt;/p&gt;\n&lt;p&gt;Автоматизированный конвейер классификации успешно категоризировал собранные видео, сформировав основу для 2 различных корпусов комментариев. Итоговый &lt;a href=\"concepts/dataset.html\"&gt;набор данных&lt;/a&gt; включал 20 387 комментариев из видео, классифицированных как научные, и 32 025 комментариев из видео, классифицированных как псевдонаучные. Анализ временного распределения этих комментариев показывает, что, хотя данные охватывают более десятилетия (с 2011 по май 2025 года), большинство взаимодействий в обоих корпусах сосредоточено в последние годы, что отражает растущее использование платформы для дискуссий о здоровье. Тематический анализ выявил как структурные сходства, так и отчетливые функциональные различия между двумя аудиториями. В обеих группах «выражение чувств» и «сравнение» были наиболее частыми категориями. Однако их относительная значимость и эмоциональная окраска различались между двумя корпусами. Псевдонаучный корпус показал более высокую частоту комплиментов, благодарностей и коротких подтверждений, в то время как «медицинское лечение» и «запросы совета» были относительно более частыми в научном корпусе.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f1.jpg\" alt=\"Представление рабочего процесса получения корпуса видео, использованного в исследовании.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Представление рабочего процесса получения корпуса видео, использованного в исследовании.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f2.jpg\" alt=\"Представление рабочего процесса получения комментариев и их анализа. NLP: обработка естественного языка.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Представление рабочего процесса получения комментариев и их анализа. NLP: обработка естественного языка.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f3.jpg\" alt=\"Гистограмма количества комментариев по годам в научной и псевдонаучной аудиториях.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Гистограмма количества комментариев по годам в научной и псевдонаучной аудиториях.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f4.jpg\" alt=\"Процесс, выявленный для научной аудитории.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Процесс, выявленный для научной аудитории.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f5.jpg\" alt=\"Процесс, выявленный для псевдонаучной аудитории.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Процесс, выявленный для псевдонаучной аудитории.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f6.jpg\" alt=\"Сеть взаимодействий научной аудитории.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сеть взаимодействий научной аудитории.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f7.jpg\" alt=\"Сеть взаимодействий псевдонаучной аудитории.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сеть взаимодействий псевдонаучной аудитории.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Почему&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дезинформация&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;о здоровье так&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;живуча&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Анализ сетей и&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;процессная&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аналитика&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;данных&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Наука —&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;критика,&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;псевдонаука —&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;поддержка&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Нужно&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;учитывать&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эмоции в&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;борьбе с&lt;/text&gt;&lt;text x=\"626\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фейками&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале Journal of medical Internet research. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Journal of medical Internet research (Europe PMC)&lt;/td&gt;\n&lt;td&gt;platforms&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Anca S, Gallegos-Serrano SP, Sánchez-Bocanegra CL, Piraino P, Sevillano Ramos JL.&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;t
