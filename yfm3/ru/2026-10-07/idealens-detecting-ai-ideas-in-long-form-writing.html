        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"171\" cy=\"175\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"589\" cy=\"170\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · PROVENANCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;IdeaLens: как отличить&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;человеческие идеи от&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;сгенерированных нейросетью&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f1.jpg\" alt=\"Рисунок 1: Идеи IDEALENS по отслеживанию; традиционные детекторы отслеживают формулировки.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Идеи IDEALENS по отслеживанию; традиционные детекторы отслеживают формулировки.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Идеи IDEALENS по отслеживанию; традиционные детекторы отслеживают формулировки. Мы представляем четыре квадранта, охватывающие как общее происхождение (полностью человеческое или полностью ИИ), так и смешанное происхождение (человеческие идеи и проза ИИ, или идеи ИИ и человеческая проза). В отличие от традиционных детекторов (например, Pangram4, Glickenhaus et al., 2026; EditLens-3B, Thai et al., 2026), IDEALENS может точно определить источник идей, а не источник прозы. IDEALENS классифицирует 94,7% документов, созданных ИИ на основе человеческих идей, как человеческие, в то время как &lt;a href=\"concepts/pangram-3-3-2.html\"&gt;Pangram&lt;/a&gt; помечает как человеческие только 43,8%. В нашем новом наборе данных историй, написанных людьми на основе идей ИИ (§3), IDEALENS помечает 68,0% как ИИ, по сравнению с Pangram и EditLens, которые помечают только 8,0% и 0,0% соответственно.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Традиционные инструменты проверки определяют авторство текста, но не его смысловое наполнение. Новый метод IdeaLens преобразует документы в структурированные планы, отсекая стилистику. Это позволяет выявлять ИИ-идеи даже в текстах, написанных человеком.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;IdeaLens анализирует структуру идей, а не стиль текста.&lt;/li&gt;\n&lt;li&gt;Модель обучена на 1 млн документов с разметкой от Pangram 4.&lt;/li&gt;\n&lt;li&gt;Система выявляет ИИ-идеи в 68% случаев, где другие детекторы слепы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи представили IdeaLens — детектор, который фокусируется на «происхождении идей» (idea provenance), а не на стиле письма. Для этого документ представляется в виде набора дискурсивных ролей и кратких описаний содержания, очищенных от оригинальной лексики. Модель обучалась на 1 миллионе документов из датасета &lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt;, используя «серебряные» метки от детектора Pangram 4.&lt;/p&gt;\n&lt;p&gt;В ходе тестов IdeaLens показал высокую точность: при использовании человеческих планов вероятность ложного срабатывания ИИ падает с 95% до 7%. В то же время, если человек пишет текст на основе ИИ-плана, система распознает «машинный &lt;a href=\"concepts/trace.html\"&gt;след»&lt;/a&gt; в 68% случаев, тогда как обычные детекторы почти не замечают подвоха. Метод успешно переносится на 24 языка, сохраняя эффективность на различных форматах и доменах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель опирается на вероятностные предсказания и не является прямым доказательством процесса написания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Современные инструменты обнаружения ИИ-контента фокусируются на стиле письма, однако актуальная политика требует понимания того, кто именно сгенерировал идеи. Исследователи представили IDEALENS — детектор, определяющий происхождение идей (человеческое или машинное) независимо от того, кто написал текст. Чтобы отделить идеи от стилистики, документы преобразуются в конспекты: списки, где каждой части текста соответствует роль в дискурсе и краткое перефразированное описание. Это минимизирует влияние лексического сходства с исходным материалом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS определяет авторство идей, а не слов, используя конспекты для исключения влияния стиля письма.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель IDEALENS обучалась на 1 млн документов из набора FineWeb, размеченных с помощью детектора прозы Pangram. Поскольку конспекты практически лишены поверхностных языковых признаков, модель вынуждена опираться на структуру идей. В контролируемом эксперименте при переходе моделей от самостоятельного написания к работе по детальным человеческим планам, доля ложных срабатываний IDEALENS снизилась с 95% до 7%, тогда как Pangram 4 продолжал помечать 92% текстов как ИИ-сгенерированные. При использовании планов, созданных ИИ, IDEALENS сохраняет точность обнаружения выше 96%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Конспект — это сжатое изложение содержания текста, которое передает смысл, но не копирует авторские обороты или стиль.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На новом наборе из 50 историй, написанных людьми по планам ИИ, IDEALENS распознал ИИ-происхождение идей в 68% случаев, в то время как Pangram 4 — лишь в 8%. Тестирование на 19 существующих бенчмарках показало, что IDEALENS сохраняет высокую эффективность при низком уровне ложноположительных результатов в различных доменах, форматах и языках. Анализ 90 тыс. предсказаний позволил выявить систематические различия между человеческим и машинным мышлением. Авторы предоставляют модели и размеченные данные для дальнейшего изучения происхождения идей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность модели проверялась на ограниченных наборах данных; результаты могут варьироваться в зависимости от сложности предметной области.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;В августе 2026 года ИИ-детектор Pangram классифицировал колонку Стэнли Дракенмиллера в Wall Street Journal как полностью сгенерированную нейросетью. Сам инвестор подтвердил использование ИИ, однако редактор издания Пол Гиго встал на его защиту, заявив, что главное — это авторство идей, а не слов. Этот случай подчеркивает разрыв между «происхождением текста» (кто написал слова) и «происхождением идей» (кто их придумал). Существующие детекторы, такие как Pangram, фокусируются на первом, тогда как политики использования ИИ всё чаще апеллируют ко второму.&lt;/p&gt;\n&lt;p&gt;Авторы представляют IDEALENS — детектор происхождения идей, который обучается на тех же данных, что и текстовые детекторы. В основе метода лежит когнитивная модель письма: идеи определяются как структура документа (тезисы, события, логика), очищенная от конкретных формулировок. Модель обучалась на 1 миллионе планов (аутлайнов), извлеченных из корпуса FineWeb, с использованием меток от Pangram. Для контроля была создана модель PROSELENS, обученная на тех же данных, но на исходном тексте, а не на планах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод «аутлайнинга» заключается в преобразовании текста в краткое описание его структуры и ролей дискурса, что позволяет модели оценивать логику, а не стиль написания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"idealens-raspoznaet-chelovecheskie-idei-v-tekstah,-napisannyh-ii\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-raspoznaet-chelovecheskie-idei-v-tekstah,-napisannyh-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•IDEALENS распознает человеческие идеи в текстах, написанных ИИ&lt;/span&gt;&lt;/a&gt;•IDEALENS распознает человеческие идеи в текстах, написанных ИИ&lt;/h4&gt;\n&lt;p&gt;При тестировании на документах, созданных ИИ по разным планам, IDEALENS снижает уровень «детекции ИИ» с 94,9% (при минимальном вводе человека) до 6,8% (при полном человеческом плане). В то же время PROSELENS и Pangram продолжают помечать такие тексты как ИИ-сгенерированные (86,5% и 92,4% соответственно). На 10 внешних бенчмарках по редактированию и перефразированию IDEALENS ошибочно помечает как ИИ лишь 5,6% документов, тогда как PROSELENS — 46,0%, а Pangram — 52,0%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS успешно отделяет человеческий замысел от ИИ-исполнения, демонстрируя значительно меньший уровень ложных срабатываний по сравнению с текстовыми детекторами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"idealens-raspoznaet-ii-idei-v-tekstah,-napisannyh-lyudmi\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-raspoznaet-ii-idei-v-tekstah,-napisannyh-lyudmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•IDEALENS распознает ИИ-идеи в текстах, написанных людьми&lt;/span&gt;&lt;/a&gt;•IDEALENS распознает ИИ-идеи в текстах, написанных людьми&lt;/h4&gt;\n&lt;p&gt;Для проверки обратной ситуации авторы собрали &lt;a href=\"concepts/dataset.html\"&gt;датасет&lt;/a&gt; из 50 историй, написанных людьми на основе планов, сгенерированных ИИ. IDEALENS распознал ИИ-происхождение идей в 68,0% случаев, тогда как текстовые детекторы почти не увидели участия ИИ (0% у PROSELENS и 8,0% у Pangram), так как слова были написаны человеком.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование базируется на синтетических данных и модельных предсказаниях; результаты не являются прямым доказательством процесса написания конкретного текста.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"effektivnost-i-kross-yazykovaya-adaptaciya\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#effektivnost-i-kross-yazykovaya-adaptaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•Эффективность и кросс-языковая адаптация&lt;/span&gt;&lt;/a&gt;•Эффективность и кросс-языковая адаптация&lt;/h4&gt;\n&lt;p&gt;На 19 тестах по различению полностью человеческих и полностью ИИ-текстов IDEALENS выявляет 91,1% ИИ-документов при 0,6% ложных срабатываний. Хотя модель обучалась только на английском, она эффективно работает на 24 языках, используя английские планы, выявляя 95,3% ИИ-документов при 0,1% ложных срабатываний.&lt;/p&gt;\n&lt;h4 id=\"analiz-kriteriev-ocenki\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#analiz-kriteriev-ocenki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•Анализ критериев оценки&lt;/span&gt;&lt;/a&gt;•Анализ критериев оценки&lt;/h4&gt;\n&lt;p&gt;Анализ 90 тысяч предсказаний показал, что IDEALENS оценивает идеи как «ИИ-сгенерированные», если они содержат необоснованные цифры или методы без контекста. Напротив, «человеческими» признаются идеи, содержащие проверяемые источники, обсуждение проблем и альтернатив. Авторы открыли доступ к коду и данным моделей.&lt;/p&gt;\n&lt;h4 id=\"izuchenie-proishozhdeniya-idej-cherez-strukturnye-plany\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#izuchenie-proishozhdeniya-idej-cherez-strukturnye-plany\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ИЗУЧЕНИЕ ПРОИСХОЖДЕНИЯ ИДЕЙ ЧЕРЕЗ СТРУКТУРНЫЕ ПЛАНЫ&lt;/span&gt;&lt;/a&gt;ИЗУЧЕНИЕ ПРОИСХОЖДЕНИЯ ИДЕЙ ЧЕРЕЗ СТРУКТУРНЫЕ ПЛАНЫ&lt;/h4&gt;\n&lt;p&gt;Основная сложность при обучении детектора идей заключается в отсутствии крупномасштабной разметки, указывающей, кому принадлежат идеи в документе, в отличие от данных об авторстве текста. Чтобы решить эту задачу, мы обучаем модель на основе «планов» (outlines) документов, которые сохраняют смысловое содержание, но исключают оригинальную лексику. Для этого мы определяем дискурсивные роли, характерные для каждого формата письма, извлекаем план документа и перефразируем его, чтобы удалить стилистические маркеры автора. Модель IDEALENS обучается предсказывать авторство (человек или ИИ) по перефразированному плану, тогда как PROSELENS делает это на основе исходного текста.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование перефразированных планов вместо исходного текста позволяет модели фокусироваться на структуре идей, а не на стилистических особенностях автора.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для формирования корпуса WildOutlines мы отобрали 1 млн документов из набора &lt;a href=\"concepts/wildai.html\"&gt;WildAI&lt;/a&gt;, размеченных с помощью WebOrganizer и Pangram 3.3.2. Мы ограничили выборку англоязычными текстами объемом от 500 слов, относящимися к восьми форматам (Таблица 12). Документы с пометкой «смешанное авторство» исключались, так как в них невозможно однозначно определить источник идей. Итоговый датасет разделен на обучающую (842 тыс.), валидационную (30 тыс.), калибровочную (80 тыс.) и тестовую (50 тыс.) выборки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дискурсивная роль — это функция, которую фрагмент текста выполняет в рамках общей структуры документа (например, «описание события» или «оценка реакции рынка»).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"avtomaticheskoe-izvlechenie-planov\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#avtomaticheskoe-izvlechenie-planov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоматическое извлечение планов&lt;/span&gt;&lt;/a&gt;Автоматическое извлечение планов&lt;/h4&gt;\n&lt;p&gt;Процесс создания обучающего набора WildOutlines включает три этапа: (i) Выявление ролей: мы адаптировали фреймворк TopicGPT, используя модель GPT-5.6 Sol для генерации базовых ролей для каждого формата. После ручной проверки и удаления дубликатов мы получили набор ролей (например, 42 роли для нехудожественных текстов). (ii) Извлечение планов: с помощью моделей Gemini 3.7 Flash и Gemini 3.1 Pro мы преобразуем документы в последовательность пар «роль — описание содержания». (iii) Перефразирование: чтобы модель не использовала стиль автора как подсказку, мы перефразируем планы с помощью Gemini 3.1 Pro. Это снижает долю «человеческого» стиля в планах с 8,5% до 0,3% (Таблица 9), сохраняя при этом косинусное сходство с оригиналом на уровне 0,93 (Таблица 10).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перефразирование применяется только при обучении, чтобы исключить утечку стилистических признаков; при тестировании IDEALENS работает с исходными планами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obuchenie-rabote-s-idealens-i-proselens\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#obuchenie-rabote-s-idealens-i-proselens\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обучение работе с IDEALENS и PROSELENS&lt;/span&gt;&lt;/a&gt;Обучение работе с IDEALENS и PROSELENS&lt;/h4&gt;\n&lt;p&gt;Обе модели базируются на архитектуре Nemotron-3.5-Lightning-30B-A3B, дообученной с использованием метода &lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt;. Модели калибруются по порогу, обеспечивающему частоту ложноположительных срабатываний (&lt;a href=\"concepts/false-positive-rate.html\"&gt;FPR&lt;/a&gt;) на уровне 1%. Поскольку обе модели используют одну и ту же архитектуру и данные, различия в их результатах обусловлены исключительно переходом от исходного текста к представлению в виде плана.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; ExamplesofitemsforfourcoredifferencesbetweenhumanandAIideas.Thefirst column describes each contrast and summarizes how it is realized in human and AI ideas.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT1.jpg\" alt=\"Таблица 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"eksperimentalnaya-ustanovka\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#eksperimentalnaya-ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭКСПЕРИМЕНТАЛЬНАЯ УСТАНОВКА&lt;/span&gt;&lt;/a&gt;ЭКСПЕРИМЕНТАЛЬНАЯ УСТАНОВКА&lt;/h4&gt;\n&lt;p&gt;Авторы проводят сравнительный анализ моделей IDEALENS и PROSELENS с 17 существующими детекторами, включая Pangram 4. Тестирование охватывает 19 внешних бенчмарков и три специально созданных набора данных: IDEASHIFT, IDEASHIFT-X и TWICETOLD. Эти наборы данных позволяют оценить работу детекторов в четырех сценариях: документы с полностью человеческим или полностью ИИ-происхождением, а также смешанные варианты (человеческие идеи в ИИ-тексте или ИИ-идеи в человеческом тексте). Ожидается, что детекторы идей будут демонстрировать высокую точность во всех четырех квадрантах, тогда как детекторы прозы должны показывать низкую эффективность в смешанных случаях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детекторы идей должны точно определять источник замысла независимо от стиля текста, в то время как детекторы прозы ориентируются только на лингвистические паттерны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки точности определения ИИ-идей используется метрика соответствия предсказанной метки (ИИ или человек) реальному источнику замысла. В качестве базовых моделей выбраны Pangram 4, EditLens-Llama-3.2-3B, Fast-DetectGPT, Binoculars, MELD и Desklib. Для IDEALENS, PROSELENS и EditLens установлен глобальный порог, соответствующий 1% частоты ложноположительных срабатываний (FPR) на калибровочном наборе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FPR (False Positive Rate) — доля случаев, когда модель ошибочно классифицирует человеческий текст как созданный ИИ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Из 19 внешних бенчмарков 14 содержат документы с общим происхождением. Дополнительно используется тестовый набор из 50 000 документов, размеченных Pangram, и 10 000 документов из корпуса C4 (созданного до появления ChatGPT) для замера FPR. Также 10 бенчмарков включают тексты, написанные людьми, но отредактированные ИИ, что служит примером человеческих идей в ИИ-прозе.&lt;/p&gt;\n&lt;p&gt;IDEASHIFT исследует влияние детализации плана на детекцию. Набор включает 500 исходных документов, для которых GPT-5.6 Sol генерирует пять уровней промптов: от уровня 0 (только тема) до уровня 5 (полный план без возможности добавления отсебятины). Поскольку проза здесь создана ИИ, детекторы прозы должны классифицировать всё как ИИ, однако детекторы идей должны показывать снижение точности на документах, созданных по человеческим планам.&lt;/p&gt;\n&lt;p&gt;TWICETOLD изучает обратный сценарий: человек пишет текст на основе плана, созданного ИИ. Набор состоит из 50 историй (по 500 слов каждая), написанных людьми по ИИ-планам, что позволяет четко разделить происхождение идеи и прозы.&lt;/p&gt;\n&lt;p&gt;IDEASHIFT-X проверяет работу IDEALENS в многоязычной среде. Поскольку модель использует &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-&lt;a href=\"concepts/ekstraktor.html\"&gt;экстрактор&lt;/a&gt;, способный создавать англоязычные планы для документов на любом языке, она применима без дообучения. Набор включает 10 000 человеческих документов на 24 языках из FineWeb2, для которых по протоколу IDEASHIFT созданы ИИ-версии (уровни 0 и 5) для замера FPR.&lt;/p&gt;\n&lt;h4 id=\"idealens-raspoznaet-idei-ii,-a-ne-stil\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-raspoznaet-idei-ii,-a-ne-stil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IDEALENS распознает идеи ИИ, а не стиль&lt;/span&gt;&lt;/a&gt;IDEALENS распознает идеи ИИ, а не стиль&lt;/h4&gt;\n&lt;p&gt;IDEALENS определяет происхождение идей, а не просто анализирует текст. По мере детализации планов в промптах IDEASHIFT, частота ложных срабатываний IDEALENS снижается с 94,9% (уровень 0) до 6,8% (уровень 5) (Рис. 4a). В то же время PROSELENS и Pangram 4 помечают 86–100% документов как ИИ-сгенерированные независимо от уровня детализации. Если план составлен ИИ, IDEALENS стабильно распознает более 96% текстов (Таблица 25), что подтверждает &lt;a href=\"concepts/sensitivity.html\"&gt;чувствительность&lt;/a&gt; модели именно к источнику идей. Наиболее резкое снижение частоты срабатываний происходит между 3 и 4 уровнями, когда промпты начинают включать не только структурные роли, но и конкретное содержание (Таблица 24).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f4.jpg\" alt=\"Рисунок 4: IDEALENS обнаруживает различные уровни человеческого участия в тексте, созданном ИИ (слева), и присваивает сх\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: IDEALENS обнаруживает различные уровни человеческого участия в тексте, созданном ИИ (слева), и присваивает схожие значения P(AI) для TWICETOLD и его версий, созданных ИИ (справа).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: IDEALENS обнаруживает различные уровни человеческого участия в тексте, созданном ИИ (слева), и присваивает схожие значения P(AI) для TWICETOLD и его версий, созданных ИИ (справа). (a) В IDEASHIFT IDEALENS — единственная модель, чей коэффициент срабатывания отслеживает различные уровни человеческого участия в тексте, созданном ИИ; в контрольной группе ИИ все модели срабатывают почти полностью на всех уровнях. (b) Разница в P(AI) между историями, созданными ИИ, и историями, написанными людьми в TWICETOLD, для IDEALENS намного меньше, чем для PROSELENS.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS демонстрирует высокую чувствительность к источнику идей, снижая частоту ложных срабатываний при увеличении детализации человеческих промптов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS устойчив к перефразированию человеческих идей ИИ. В 12 бенчмарках, где ИИ вносит поверхностные изменения (полировка, пересказ), IDEALENS классифицирует 94,7% документов как человеческие, тогда как PROSELENS — 50,7%, а Pangram 4 — 43,8% (Таблица 19). В наборе данных GEDE модель IDEALENS помечает как ИИ лишь 0,5% эссе после правок LLM и 2,6% после переписывания с сохранением смысла. В тесте HART IDEALENS ошибочно помечает 4,9% парафраз, против 42,8% у Pangram 4 и 44,5% у PROSELENS. В Academic Integrity dataset IDEALENS распознает 8,2% абстрактов, сгенерированных ИИ на основе человеческих, против 96,4% у Pangram 4.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Перефразирование» — это изменение формы текста при сохранении исходного смысла, что часто сбивает детекторы, ориентированные на стиль.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS выявляет идеи ИИ в прозе, написанной людьми (TWICETOLD). Модель помечает 68% (95% ДИ 54–79%) таких историй как ИИ, тогда как PROSELENS — 0%, а Pangram 4 — 8%. Все детекторы успешно распознают оригинальные ИИ-тексты (96–100%), но только IDEALENS сохраняет предсказание для большинства человеческих историй, несмотря на смену стиля (Рис. 4b). Ошибки (12 из 16) в основном связаны с фантастическими элементами.&lt;/p&gt;\n&lt;p&gt;IDEALENS превосходит существующие открытые детекторы. На 19 выборках он обнаруживает 91,1% ИИ-документов при 0,6% FPR, тогда как EditLens-3B — 81,8% при 0,2% FPR (Таблица 21). При обучении на полном тексте PROSELENS достигает 98,9% при 0,7% FPR, конкурируя с Pangram 4. На 10 000 документов из C4 (до ChatGPT) IDEALENS дает лишь 0,01% ложных срабатываний. Слабость модели — парафразирование DIPPER (77,6% обнаружения против 97,1% у PROSELENS), что, вероятно, связано с глубоким изменением контента.&lt;/p&gt;\n&lt;h4 id=\"1-reshayushie-protiv-universalnyh-detalej\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#1-reshayushie-protiv-universalnyh-detalej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1 Решающие против универсальных деталей&lt;/span&gt;&lt;/a&gt;1 Решающие против универсальных деталей&lt;/h4&gt;\n&lt;p&gt;Детали могут менять выводы автора или быть применимы к любому объекту. Например, расположение порта mini-HDMI и отсека для батареи в Sony Cyber-shot RX100 — это конкретный физический факт, в то время как описание эстетики колонки Jony Ive содержит общие характеристики, которые могут быть применены к любому премиальному устройству.&lt;/p&gt;\n&lt;h4 id=\"2-funkcionalnaya-protiv-kazhushejsya-specifichnosti\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#2-funkcionalnaya-protiv-kazhushejsya-specifichnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2 Функциональная против кажущейся специфичности&lt;/span&gt;&lt;/a&gt;2 Функциональная против кажущейся специфичности&lt;/h4&gt;\n&lt;p&gt;Цифры могут быть проверяемыми или лишь создавать видимость точности. Упоминание прибыли в 700 юаней за 10 дней — это конкретный измеримый показатель. Напротив, общие рекомендации по «устранению технических препятствий» через «непрерывное обучение» и «обсуждения со специалистами» выглядят как экспертный текст, но не содержат проверяемых данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тексты, содержащие общие советы или «воду», часто имитируют экспертный стиль, не предоставляя фактической информации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"3-ogranichennye-protiv-chrezmernyh-utverzhdenij\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#3-ogranichennye-protiv-chrezmernyh-utverzhdenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3 Ограниченные против чрезмерных утверждений&lt;/span&gt;&lt;/a&gt;3 Ограниченные против чрезмерных утверждений&lt;/h4&gt;\n&lt;p&gt;Утверждения могут иметь четкие границы или выходить за рамки доказательств. Ссылка на запуск флота в середине 2022 года из конкретного центра — это проверяемый факт. Прогноз о том, что Kia K4 2025 года станет «постоянным наследием» и «новым стандартом», является спекулятивным и не подкреплен доказательствами.&lt;/p&gt;\n&lt;h4 id=\"4-sohranennye-i-stertye-izderzhki\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#4-sohranennye-i-stertye-izderzhki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4 Сохраненные и стертые издержки&lt;/span&gt;&lt;/a&gt;4 Сохраненные и стертые издержки&lt;/h4&gt;\n&lt;p&gt;Авторы анализируют, как меняется восприятие ограничений в текстах. В человеческих текстах реальные препятствия (например, логистические сложности при обучении собаки) сохраняются, тогда как ИИ-модели часто описывают ситуацию как идеальную, игнорируя недостатки. В качестве примера приводится оценка ноутбука M3 MacBook Air: ИИ характеризует его как «идеальное равновесие», не упоминая минусов, в то время как люди четко обозначают ограничения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель IDEALENS демонстрирует высокую точность (95,3%) в выявлении ИИ-идей, оставаясь при этом инвариантной к языку, на котором написан текст.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система IDEALENS была протестирована на 24 языках в рамках датасета IDEASHIFT-X. Несмотря на обучение исключительно на английском языке, модель верно классифицирует 95,3% документов уровня 0 (полностью ИИ) и лишь 0,7% документов уровня 5 (полностью человек). Для сравнения, прозаические детекторы (PROSELENS, Pangram4) показывают значительно худшие результаты, особенно в языках с низкими ресурсами (тамильский, амхарский). На 10 000 человеческих текстов из FineWeb2 модель показала низкий уровень ложноположительных срабатываний (FPR) — 0,1%.&lt;/p&gt;\n&lt;p&gt;IDEALENS эффективно работает с «сырым» текстом, даже будучи обученной на планах (outlines). При анализе общего происхождения модель выявляет 96,1% ИИ-документов при FPR 0,3%. Однако на бенчмарке TWICETOLD, где ИИ генерирует идеи, а люди пишут текст, модель распознает лишь 6% ИИ-контента, так как человеческие детали «маскируют» ИИ-идеи.&lt;/p&gt;\n&lt;h4 id=\"chto-otlichaet-idei-ii-ot-chelovecheskih\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#chto-otlichaet-idei-ii-ot-chelovecheskih\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что отличает идеи ИИ от человеческих&lt;/span&gt;&lt;/a&gt;Что отличает идеи ИИ от человеческих&lt;/h4&gt;\n&lt;p&gt;Для понимания различий авторы провели &lt;a href=\"concepts/ablyatsionnoe-issledovanie.html\"&gt;абляционное исследование&lt;/a&gt; (Таблица 36). Оно показало, что IDEALENS опирается преимущественно на содержание, а не на роли или структуру. Используя методологию Russell et al. (2026b), авторы выделили 79 интерпретируемых признаков из 90 000 предсказаний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляционное исследование (ablation study) — это метод анализа модели, при котором последовательно удаляются отдельные компоненты или данные, чтобы понять, какой вклад они вносят в итоговый результат.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основные различия заключаются в следующем: идеи ИИ часто абстрактны и применимы к чему угодно (например, фраза о «премиальном качестве звука» для любой колонки), тогда как человеческие идеи содержат конкретные детали, важные для контекста (например, проблемы при использовании штатива). ИИ часто дает советы, которые выглядят специфично, но не содержат прикладной ценности (например, «методологии Agile» без пояснения, как их внедрить). Кроме того, ИИ склонен преувеличивать значимость (прогнозы о «вечном наследии») и скрывать недостатки, в то время как люди делают осторожные прогнозы и открыто признают ограничения.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы&lt;/span&gt;&lt;/a&gt;Связанные работы&lt;/h4&gt;\n&lt;p&gt;Существующие детекторы ИИ-текста (Mitchell et al., 2023 и др.) фокусируются на бинарной классификации стиля прозы. Исследования смешанного авторства обычно рассматривают ИИ как инструмент редактирования или пытаются отделить содержание от стиля. В отличие от них, IDEALENS обучается на метках происхождения идей, опираясь на когнитивные теории процесса письма (Flower &amp;amp; Hayes, 1981), а не на семантический анализ текста. Авторы применяют принцип обучения на трансформированных данных, аналогичный методам нормализации стилистических вариаций (Krishna et al., 2020), но в обратном направлении: сохраняя метки прозаического детектора, они подают на вход перефразированные планы, заставляя модель обучаться исключительно на идеях.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Accuracy by document length on the out-of-domain evaluations (%, global 1% cut).The training corpus has no documents under 500 words.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT2.jpg\" alt=\"Таблица 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 32.&lt;/strong&gt; MELD, per attack:by attack.Fire rate % at the 1% cut.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT32.jpg\" alt=\"Таблица 32\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 33.&lt;/strong&gt; DetectRL-X, per attack:by attack.Fire rate % at the 1% cut.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT33.jpg\" alt=\"Таблица 33\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"osnovnye-vyvody\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#osnovnye-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные выводы&lt;/span&gt;&lt;/a&gt;Основные выводы&lt;/h4&gt;\n&lt;p&gt;Исследование демонстрирует, что тексты, созданные искусственным интеллектом (ИИ), и тексты, написанные человеком, можно эффективно различать на основе анализа идей. Авторы использовали корпус из 1 000 000 планов (аутлайнов) для обучения модели IDEALENS, используя «серебряные» метки, полученные от детектора прозы. Модель была протестирована на 22 наборах данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель IDEALENS успешно определяет происхождение идей, превосходя существующие аналоги, и демонстрирует способность работать с 24 языками, несмотря на обучение только на английском.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS отслеживает происхождение идей даже в тех случаях, когда оно отличается от структуры самого текста. В отличие от контрольной модели PROSELENS, которая обучалась на тех же метках, но на основе сырого текста, IDEALENS показывает более высокую точность. На 13 616 отложенных элементах 64 из 79 признаков совпали с оценками IDEALENS в направлении классификации «ИИ против человека», при этом конфликт был выявлен только в одном случае (подробности в §J.3 и Таблице 44).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Серебряные» метки — это данные, полученные автоматически с помощью другого алгоритма, которые используются для обучения, когда нет размеченных вручную «золотых» данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya-issledovaniya\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#ogranicheniya-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения исследования&lt;/span&gt;&lt;/a&gt;Ограничения исследования&lt;/h4&gt;\n&lt;p&gt;Авторы отмечают ряд ограничений метода (§A). Обучающие метки лишь приблизительно отражают происхождение идей, а бинарная классификация не позволяет корректно обрабатывать тексты, созданные в соавторстве человека и ИИ. Кроме того, эффективность модели снижается на коротких текстах и при использовании некоторых состязательных атак. Процесс извлечения планов зависит от проприетарных моделей, а набор данных TWICETOLD ограничен 50 историями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель имеет ограничения: она менее эффективна на коротких текстах и зависит от сторонних проприетарных алгоритмов для извлечения структуры идей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f1.jpg\" alt=\"Рисунок 1: Идеи IDEALENS по отслеживанию; традиционные детекторы отслеживают формулировки.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Идеи IDEALENS по отслеживанию; традиционные детекторы отслеживают формулировки.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Идеи IDEALENS по отслеживанию; традиционные детекторы отслеживают формулировки. Мы представляем четыре квадранта, охватывающие как общее происхождение (полностью человеческое или полностью ИИ), так и смешанное происхождение (человеческие идеи и проза ИИ, или идеи ИИ и человеческая проза). В отличие от традиционных детекторов (например, Pangram4, Glickenhaus et al., 2026; EditLens-3B, Thai et al., 2026), IDEALENS может точно определить источник идей, а не источник прозы. IDEALENS классифицирует 94,7% документов, созданных ИИ на основе человеческих идей, как человеческие, в то время как Pangram помечает как человеческие только 43,8%. В нашем новом наборе данных историй, написанных людьми на основе идей ИИ (§3), IDEALENS помечает 68,0% как ИИ, по сравнению с Pangram и EditLens, которые помечают только 8,0% и 0,0% соответственно.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f2.jpg\" alt=\"Рисунок 2: IDEALENS видит структуру каждого документа, а не весь текст целиком.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: IDEALENS видит структуру каждого документа, а не весь текст целиком.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: IDEALENS видит структуру каждого документа, а не весь текст целиком. Документам присваивается формат, и они сводятся к структуре, где каждый элемент помечен одной из ролей формата. В этом примере показаны два из 17 элементов структуры, извлеченных из редакционной статьи. Для обучения структуры перефразируются, чтобы удалить формулировки, скопированные из исходных документов. IDEALENS изучает метку Pangram на основе перефразированной структуры во время обучения, а извлеченные структуры предоставляются при выводе.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f3.jpg\" alt=\"Рисунок 3: Обученный на структурах IDEALENS обнаруживает авторство идей, в то время как традиционные детекторы отслежива\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Обученный на структурах IDEALENS обнаруживает авторство идей, в то время как традиционные детекторы отслеживают авторство прозы.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Обученный на структурах IDEALENS обнаруживает авторство идей, в то время как традиционные детекторы отслеживают авторство прозы. Средняя точность по всем бенчмаркам, где идеи и проза принадлежат одному автору (ось x) и где они принадлежат разным авторам (ось y). IDEALENS — единственный детектор, точный как при общем (95,3%), так и при смешанном (81,3%) авторстве. На рисунке 3 обобщены наши основные результаты по 51 оценочному разделу из 22 бенчмарков, где каждая точка — это детектор, нанесенный на график в соответствии с его совокупной точностью обнаружения идей в документах с общим и смешанным происхождением. IDEALENS — единственный детектор, достигающий высокой точности как в общих (95,3%), так и в смешанных (81,3%) условиях. PROSELENS и Pangram 4 чрезвычайно точны в документах с общим происхождением (99,1% и 98,5% соответственно), но не могут определить источник идей документа в смешанных условиях (25,4% и 25,9%). Поскольку PROSELENS имеет ту же основу, обучающие документы и обучающие метки, что и IDEALENS, это подчеркивает влияние нашего представления структуры, которое пара на базе ModernBERT (Warner et al., 2025) воспроизводит с другой основой. IDEALENS также неожиданно хорошо переносится на входные данные в виде необработанного текста во время тестирования, демонстрируя высокую точность общего происхождения и значительно более высокую точность смешанного происхождения, чем PROSELENS.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f5.jpg\" alt=\"Рисунок 5: Распределение ОЦЕНОК ЧЕЛОВЕЧЕСКИХ АССОЦИАЦИЙ.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Распределение ОЦЕНОК ЧЕЛОВЕЧЕСКИХ АССОЦИАЦИЙ.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: Распределение ОЦЕНОК ЧЕЛОВЕЧЕСКИХ АССОЦИАЦИЙ. Каждая точка представляет один из 79 признаков; синий и оранжевый цвета указывают на признаки, предложенные как связанные с человеком и ИИ соответственно. Оценка — это вероятность того, что в рамках одного и того же формата элемент, в котором срабатывает признак, получит более высокую оценку человечности детектора, чем элемент, в котором он не срабатывает. Оценка 0,5 указывает на отсутствие ассоциации. Полые точки имеют 95% &lt;a href=\"concepts/butstrep-intervaly.html\"&gt;бутстреп-интервалы&lt;/a&gt;, включающие 0,5; вертикальное размещение приведено только для наглядности.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f6.jpg\" alt=\"Рисунок 6: Оценки человеческих ассоциаций для отдельных признаков.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Оценки человеческих ассоциаций для отдельных признаков.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6: Оценки человеческих ассоциаций для отдельных признаков. Точки показывают оценки признаков, а горизонтальные линии — их 95% &lt;a href=\"concepts/butstrep.html\"&gt;бутстреп&lt;/a&gt;-интервалы, сгруппированные по предложенному направлению. Признаки, предложенные человеком, упорядочены от наивысшего балла к наименьшему, а признаки, предложенные ИИ, — от наименьшего к наивысшему, при этом самые сильные ассоциации каждой панели с предложенным направлением расположены вверху. Оценки выше 0,5 тяготеют к человеку; оценки ниже 0,5 — к ИИ. Полые точки имеют интервалы, включающие 0,5, а крестик указывает на признак, чья наблюдаемая направленность противоречит предложенному направлению.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f7.jpg\" alt=\"Рисунок 7: Активация признаков по квинтилям детектора P(AI).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Активация признаков по квинтилям детектора P(AI).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7: Активация признаков по квинтилям детектора P(AI). Элементы были ранжированы по детектору P(AI) в рамках каждого формата и разделены на пять групп, от самого низкого P(AI) (1) до самого высокого P(AI) (5). Каждая точка показывает долю элементов в группе, в которых активируется указанный признак. Активация снижается по квинтилям для двух признаков, предложенных человеком (#13 и #3), и возрастает для признака, предложенного ИИ (#63).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"tablicy\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы&lt;/span&gt;&lt;/a&gt;Таблицы&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Everyarmweevaluateanditslabelundertheidea-authorshiprule. “Attacked” marks model-written text that was humanized or adversarially rewritten; its ideas stay the model’s. “Mixed”armsarereportedasP(AI)only;“notplaced”armskeepmostofamodel’sproseaftera person’s edit and are left out of the quadrants.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT3.jpg\" alt=\"Таблица 3\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Детекторы не&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;видят источник&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;идей&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Анализ&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;структуры&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;через планы&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Точное&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выявление
