        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"124\" cy=\"100\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"576\" cy=\"206\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как перестать перечитывать&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;одно и то же: Galahad&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ускоряет работу LLM в 14 раз&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-f1.jpg\" alt=\"Рисунок 1: Galahad на пути обслуживания запросов. Blaise выбирает фрагмент текста, к которому относится вопрос; Taliesin\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: &lt;a href=\"concepts/galahad.html\"&gt;Galahad&lt;/a&gt; на пути обслуживания запросов. &lt;a href=\"concepts/blaise.html\"&gt;Blaise&lt;/a&gt; выбирает фрагмент текста, к которому относится вопрос; &lt;a href=\"concepts/taliesin.html\"&gt;Taliesin&lt;/a&gt; предоставляет сохраненное состояние KV для любого блока, который модель уже обработала, и сохраняет новые блоки после их первого предварительного заполнения (prefill). Если загрузка не проходит проверку, среда выполнения (runtime) пересчитывает блок.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/large-language-models-llm.html\"&gt;Большие языковые модели&lt;/a&gt; при каждом запросе заново обрабатывают весь контекст, что требует огромных вычислительных затрат. Исследователи представили Galahad — систему, которая сохраняет состояние внимания (&lt;a href=\"concepts/key-value-cache.html\"&gt;KV-кэш&lt;/a&gt;) и фрагменты текста. Это позволяет модели «помнить» прочитанные документы и обращаться к ним мгновенно, не пересчитывая всё заново.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Galahad снижает время ответа в 14 раз и энергопотребление на 92% за счет сохранения KV-состояния.&lt;/li&gt;\n&lt;li&gt;Восстановленное состояние памяти побитово идентично результатам первичного вычисления.&lt;/li&gt;\n&lt;li&gt;Система совместима с vLLM, &lt;a href=\"concepts/sglang.html\"&gt;SGLang&lt;/a&gt; и llama.cpp и работает с любыми моделями без изменения их весов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Система Galahad состоит из двух компонентов: Taliesin и Blaise. Taliesin сохраняет KV-состояние (ключи и значения внимания) для блоков текста, позволяя загружать их при повторном обращении без пересчета. Blaise индексирует документы и передает модели только релевантные фрагменты, сокращая объем входных данных. В тестах на корпусе из 97 000 токенов модель Gemma 4 31B с Galahad ответила на 100 из 100 вопросов, затратив в 14 раз меньше времени и на 92% меньше энергии, чем стандартная конфигурация.&lt;/p&gt;\n&lt;p&gt;Технология работает как слой памяти для vLLM, SGLang и llama.cpp, не требуя изменения весов моделей. Проверка показала, что восстановленное состояние идентично свежевычисленному: все 262 144 выходных логита совпали после перезагрузки. Система использует «безопасный отказ»: если данные повреждены или не проходят проверку, модель просто пересчитывает блок, что исключает риск галлюцинаций из-за ошибок памяти.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод требует значительных затрат на первоначальное индексирование корпуса и работает только с зафиксированными байтовыми последовательностями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Современные трансформерные языковые модели ограничены в объеме вычислений на каждый токен. В текущей архитектуре обслуживание запросов является «безгосударственным» (&lt;a href=\"concepts/stateless-inference.html\"&gt;stateless&lt;/a&gt;): при каждом новом вопросе по одному и тому же документу модель заново вычисляет состояние внимания (attention state) с первого токена. Анализ семи реальных наборов данных показал, что 98,7% токенов в промптах — это текст, который модель уже обрабатывала ранее.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Внедрение системы Galahad позволяет избежать повторных вычислений, сохраняя состояние KV-кэша, что повышает точность ответов с 10% до 98% на тестовой выборке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы представляют Galahad — слой памяти для vLLM, SGLang и llama.cpp. Система состоит из двух компонентов: Taliesin сохраняет состояние ключей-значений (KV) для блоков текста и загружает его при повторном обращении, а Blaise передает модели только те фрагменты документа, которые необходимы для ответа. Тестирование проводилось на модели Gemma 431B с корпусом из 97 000 токенов, содержащим 100 скрытых фактов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-кэш (Key-Value cache) — это область памяти, где хранятся промежуточные вычисления модели, позволяющие ей «помнить» предыдущие части текста без их пересчета.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Без использования Galahad модель могла удерживать в памяти лишь последние 12 000 токенов, ответив на 10 из 100 вопросов за 9,3 с и 2754 Дж энергии. С Taliesin модель ответила на 98 из 100 вопросов за 3,0 с и 572 Дж. При добавлении Blaise модель обрабатывала около 668 токенов на вопрос, ответив на все 100 из 100 вопросов за 0,59–0,64 с и 200–213 Дж. Первоначальное сохранение корпуса требует 100 с и 28 кДж, затраты на которое окупаются после 13 запросов. Восстановленное состояние идентично свежевычисленному: все 262 144 выходных логита совпали. Система протестирована на 30 различных моделях, демонстрируя стабильность: при любых ошибках проверки Galahad переключается на стандартный пересчет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены в контролируемой среде; эффективность может варьироваться в зависимости от архитектуры GPU и сложности запросов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Авторы статьи рассматривают ограничение вычислительной сложности трансформеров, составляющее O(N² · d) для промпта из N токенов и размерности модели d. Исследователи предлагают концепцию, при которой стоимость инференса должна зависеть от объема нового текста, а не от общего объема данных, что переводит вычисления из состояния «без памяти» в систему с постоянным хранилищем.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система Galahad сокращает избыточные вычисления, сохраняя состояние KV (ключи-значения) и исходный текст, что позволяет модели не перечитывать одни и те же документы при повторных запросах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В текущих системах (vLLM, SGLang) кэширование префикса ограничено оперативной памятью GPU и сбрасывается при перезапуске. Galahad внедряет два уровня памяти: Taliesin (хранит KV-состояние для блоков текста) и Blaise (хранит структурированный текст). Taliesin обеспечивает побитовую идентичность логитов при восстановлении, а Blaise передает модели только релевантные разделы документа, а не весь корпус. В тестах на извлечение Blaise сократил объем данных до ~668 токенов на вопрос против 97 000 токенов полного корпуса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-кэш (Key-Value cache) — это промежуточные данные, которые модель вычисляет при чтении текста, чтобы не повторять расчеты для уже обработанных токенов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"razvertyvanie\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#razvertyvanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Развертывание&lt;/span&gt;&lt;/a&gt;Развертывание&lt;/h4&gt;\n&lt;p&gt;Galahad реализован как общая библиотека (libgalahad.so) для Linux x86-64, совместимая с vLLM, SGLang и llama.cpp без изменения весов моделей. Система требует идентификатор арендатора и «отпечаток» модели для предотвращения несанкционированного доступа к сохраненным состояниям.&lt;/p&gt;\n&lt;h4 id=\"taliesin-kv-pamyat\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#taliesin-kv-pamyat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Taliesin: KV-память&lt;/span&gt;&lt;/a&gt;Taliesin: KV-память&lt;/h4&gt;\n&lt;p&gt;Taliesin сохраняет KV-состояние под хэшем входных байтов. При повторном запросе система проверяет целостность данных; если запись повреждена или отсутствует, выполняется штатное перевычисление. Повторное использование происходит на уровне блоков при точном совпадении позиций токенов.&lt;/p&gt;\n&lt;h4 id=\"blaise-tekstovaya-pamyat\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#blaise-tekstovaya-pamyat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Blaise: текстовая память&lt;/span&gt;&lt;/a&gt;Blaise: текстовая память&lt;/h4&gt;\n&lt;p&gt;Blaise хранит документы в виде байтовых копий, разделенных на секции. При поступлении вопроса система выбирает нужную секцию на CPU и передает её модели. Это позволяет модели отвечать на вопросы, используя лишь малую часть исходного текста.&lt;/p&gt;\n&lt;h4 id=\"korrektnost\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#korrektnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Корректность&lt;/span&gt;&lt;/a&gt;Корректность&lt;/h4&gt;\n&lt;p&gt;Точность критична: Galahad считает любое несовпадение восстановленного состояния ошибкой и перевычисляет данные. В ходе тестирования безопасности (саботаж-тесты) проверялись четыре механизма защиты (хэширование, подписи, разделение арендаторов, сравнение байтов). Все защиты успешно предотвратили атаки в трехкратных повторах. Анализ инструментами статического анализа выявил и устранил одну ошибку чтения за пределами буфера.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является описанием системы; детали структуры Blaise и безопасности защищены патентными заявками.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"polnota-poiska-v-dlinnom-korpuse-tekstov\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#polnota-poiska-v-dlinnom-korpuse-tekstov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Полнота поиска в длинном корпусе текстов&lt;/span&gt;&lt;/a&gt;Полнота поиска в длинном корпусе текстов&lt;/h4&gt;\n&lt;p&gt;Исследователи протестировали систему Galahad на корпусе из 13 статей Wikipedia (96 726 токенов), внедрив в них 100 фактов с вымышленными данными. Использовалась модель Gemma 4 31B на GPU RTX A6000. Базовый метод (без Galahad) с окном в 12 000 токенов видел лишь 12% текста. Компонент Taliesin сохранял состояние KV-кэша, а Blaise выбирал релевантный фрагмент (около 668 токенов).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование Taliesin позволило модели ответить на 98 из 100 вопросов, тогда как без него — лишь на 10. При этом скорость обработки выросла в 3,1 раза, а энергопотребление GPU снизилось на 79%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-кэш (Key-Value cache) — это промежуточные вычисления модели, которые позволяют не пересчитывать одни и те же части текста при повторных обращениях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на синтетическом наборе данных; результаты могут отличаться при работе с реальными, более сложными текстами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sem-naborov-dannyh-iz-realnyh-uslovij\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#sem-naborov-dannyh-iz-realnyh-uslovij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Семь наборов данных из реальных условий&lt;/span&gt;&lt;/a&gt;Семь наборов данных из реальных условий&lt;/h4&gt;\n&lt;p&gt;Для проверки на внешних данных использовали 349 запросов из семи источников (логи поддержки, PDF с ошибками, SWEbench и др.). Модель Gemma 4 31B запускалась на трех средах: llama.cpp, vLLM и SGLang. В среднем 98,69% токенов промпта загружались из кэша Taliesin, а не вычислялись заново. Комбинация Taliesin и Blaise обеспечила точность 91–92% при ускорении в 3–10 раз по сравнению с использованием только Taliesin.&lt;/p&gt;\n&lt;h4 id=\"proizvoditelnost-obsluzhivaniya\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#proizvoditelnost-obsluzhivaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Производительность обслуживания&lt;/span&gt;&lt;/a&gt;Производительность обслуживания&lt;/h4&gt;\n&lt;p&gt;Тесты на различных GPU (от RTX PRO 4500 до H100) показали, что загрузка сохраненного состояния быстрее пересчета. На H100 с моделью Qwen 3 30B пропускная способность выросла на 29,6% (с 2,643 до 3,424 запросов в секунду). Система показала устойчивость к сбоям: при принудительном завершении процесса (SIGKILL) в Kubernetes данные не повреждались.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Объем корпуса ограничен дисковым пространством, а не памятью GPU: система успешно работала с 5,97 млн токенов, сохраняя стабильное потребление памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ohvat\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#ohvat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Охват&lt;/span&gt;&lt;/a&gt;Охват&lt;/h4&gt;\n&lt;p&gt;Совместимость проверена на 30 различных моделях с использованием vLLM. На модели DeepSeek-V4-Flash (284B) связка Taliesin и Blaise ответила на 98 из 100 вопросов, затрачивая 0,133 с и 143 Дж на запрос.&lt;/p&gt;\n&lt;h4 id=\"granicy-proektirovaniya\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#granicy-proektirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Границы проектирования&lt;/span&gt;&lt;/a&gt;Границы проектирования&lt;/h4&gt;\n&lt;p&gt;Результаты системы Galahad определяются тремя ключевыми принципами архитектуры. Во-первых, повторное использование данных происходит на уровне блоков. Поскольку роторное позиционное кодирование (RoPE) делает каждую строку ключей-значений (KV) зависимой от её позиции, строки нельзя разделять между разными запросами (тест показал 0 совпадений из 344 064 строк). Galahad повторно использует целые блоки, где позиции совпадают, обеспечивая побитную идентичность восстановленного состояния.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Galahad обеспечивает побитную точность за счет использования блоков, исключая возможность перемешивания позиционно-зависимых данных KV.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Во-вторых, система спроектирована по принципу «отказ в закрытом состоянии»: если проверка загрузки не проходит, данные пересчитываются заново. При намеренном сбое каждой третьей загрузки на GPU H100 пропускная способность составила 2,716 запроса в секунду против 2,643 без использования Galahad. В-третьих, память ограничена исходным текстом: в 9 из 50 случаев при работе с PDF-файлами текст терялся на этапе извлечения парсером, и ни один слой памяти не способен восстановить данные, утраченные до начала вывода.&lt;/p&gt;\n&lt;h4 id=\"smezhnye-raboty\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#smezhnye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Смежные работы&lt;/span&gt;&lt;/a&gt;Смежные работы&lt;/h4&gt;\n&lt;p&gt;В области повторного использования KV-состояний внутри движков такие решения, как PagedAttention и RadixAttention, позволяют обмениваться состоянием между запросами с общим префиксом, пока данные находятся в памяти GPU. Galahad использует интерфейсы этих систем, расширяя возможности повторного использования за пределы времени жизни процесса и памяти GPU.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-кэш (Key-Value cache) — это промежуточные результаты вычислений внимания в трансформерах, хранение которых ускоряет генерацию текста.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В части выгрузки и хранения KV-состояний, такие системы как LMCache и Mooncake перемещают данные в оперативную память CPU или на диск. CacheGen сжимает состояние, а CacheBlend и RAGCache допускают аппроксимацию при объединении фрагментов. Galahad отличается требованием точного побитового совпадения: любое несоответствие считается ошибкой. В задачах поиска Galahad ориентирован на возврат точных разделов документов, в отличие от методов ранжирования по сходству (например, BM25). В отличие от систем типа Cartridges, требующих обучения компактных представлений, Galahad сохраняет исходное состояние KV без дополнительного обучения. Текущая работа объединяет наработки автора по дедупликации Merlin и методам прививки KV-состояний в единую систему.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Результаты исследования подтверждают три ключевых тезиса. Во-первых, состояние модели можно сохранить и использовать повторно без потерь: восстановленное состояние обеспечило идентичность логитов (выходных значений) во всех 30 протестированных моделях. Во-вторых, повторное использование превращает вычисление промптов в операцию чтения из памяти: на семи реальных наборах данных 98,7% токенов промпта извлекались из памяти. В-третьих, каждый элемент памяти повышает эффективность: сохранение KV-кэша (ключей и значений) позволило модели работать с корпусом текстов в 8 раз больше, чем её контекстное окно, при этом скорость работы на llama.cpp возросла в 3,1 раза. Добавление текстовой памяти ускорило процесс ещё в 4,7 раза и снизило энергопотребление в 2,7 раза.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование постоянной памяти позволяет модели работать с данными в 8 раз больше контекстного окна, ускоряя вычисления до 4,7 раза и снижая затраты энергии в 2,7 раза.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эти данные меняют структуру затрат на &lt;a href=\"concepts/inferens.html\"&gt;инференс&lt;/a&gt;. Сейчас стоимость запроса растёт пропорционально объёму текста в промпте. С постоянной памятью она зависит только от объёма нового, ранее не прочитанного текста. Для задач, связанных с повторным обращением к одним и тем же документам (поддержка пользователей, программирование, юридические задачи), это значительно снижает издержки. Также это делает более компактные модели пригодными для задач, требующих работы с огромными массивами данных, которые раньше требовали моделей с очень длинным контекстным окном. Переход от «безгосударственного» (stateless) к «состоятельному» (stateful) инференсу — главный вывод работы.&lt;/p&gt;\n&lt;h4 id=\"otnoshenie-k-vychislitelnomu-predelu\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#otnoshenie-k-vychislitelnomu-predelu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отношение к вычислительному пределу&lt;/span&gt;&lt;/a&gt;Отношение к вычислительному пределу&lt;/h4&gt;\n&lt;p&gt;Система Galahad не опровергает теоретические ограничения вычислительной мощности. Модель остаётся прежней, как и объём вычислений на один токен. Изменяется лишь то, на что тратятся эти вычисления. Во-первых, работа выполняется единожды: состояние внимания (attention state) для блока текста сохраняется и загружается при повторных запросах, исключая пересчёт уже прочитанного. Во-вторых, поиск релевантных фрагментов в корпусе перенесён на CPU, поэтому модель получает только задачу чтения конкретного раздела и формирования ответа. В-третьих, проверка корректности загруженного состояния осуществляется через побайтовое сравнение и криптографические хэши, а не через самооценку модели, что обходит ограничения на самоверификацию. Galahad работает в обход вычислительного предела, вынося повторяющиеся задачи, поиск и верификацию за пределы модели. Дальнейшие шаги включают тестирование второго режима работы Blaise, улучшение извлечения данных из PDF и расширение списка поддерживаемых моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инференс — процесс использования обученной нейросети для получения ответов на новые данные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dostupnost\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#dostupnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доступность&lt;/span&gt;&lt;/a&gt;Доступность&lt;/h4&gt;\n&lt;p&gt;Публичная бета-версия Galahad будет доступна с 1 октября 2026 года по адресу https://github.com/corbenicai/galahad. Бета-версия бесплатна для некоммерческого использования на одном графическом процессоре (GPU) в течение 12 месяцев с возможностью продления. Коммерческие пилотные проекты доступны по запросу. Исходные логи для таблиц будут опубликованы вместе с набором данных. На части системы поданы патентные заявки.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-f1.jpg\" alt=\"Рисунок 1: Galahad на пути обслуживания запросов. Blaise выбирает фрагмент текста, к которому относится вопрос; Taliesin\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Galahad на пути обслуживания запросов. Blaise выбирает фрагмент текста, к которому относится вопрос; Taliesin предоставляет сохраненное состояние KV для любого блока, который модель уже обработала, и сохраняет новые блоки после их первого предварительного заполнения (prefill). Если загрузка не проходит проверку, среда выполнения (runtime) пересчитывает блок.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-f2.jpg\" alt=\"Рисунок 2: Точность в зависимости от медианного времени на один вопрос для теста на припоминание (recall test) при услов\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Точность в зависимости от медианного времени на один вопрос для теста на припоминание (&lt;a href=\"concepts/recall.html\"&gt;recall&lt;/a&gt; test) при условии очистки собственного кэша среды выполнения перед каждым вопросом (Таблица 2). Цвет обозначает конфигурацию, форма — среду выполнения. Без Galahad модель не может видеть 88% корпуса.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;избыточное&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;повторное&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;чтение&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;контекста&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fi
