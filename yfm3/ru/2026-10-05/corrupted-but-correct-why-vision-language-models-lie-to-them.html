        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"81\" cy=\"128\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"619\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · IMAGE_FORENSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему нейросети «лгут»&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;себе: разрыв между обучением&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;и реальностью&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-f1.jpg\" alt=\"Рисунок 1: Анализ вероятности на токен по 200 изображениям и всем трем группам исходов. Ранг целевого токена _coconut пр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Анализ вероятности на токен по 200 изображениям и всем трем группам исходов. Ранг целевого токена _coconut при условии, что правильный предшествующий токен A уже присутствует в контексте, представляет собой прямую линию ровно на отметке 3488 с нулевой дисперсией для каждого изображения, каждой группы, как для чистых, так и для состязательных данных.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Современные &lt;a href=\"concepts/vision-language-models.html\"&gt;мультимодальные модели&lt;/a&gt; (VLM) часто демонстрируют «разрыв обучения и вывода»: они могут быть легко обмануты при принудительном обучении, но игнорируют эти искажения при свободной генерации. Анализ на модели Qwen2.5-VL-7B показывает, что устойчивость к атакам определяется не визуальным энкодером, а языковым декодером. Это меняет подход к защите ИИ-систем, перенося фокус с обработки изображений на работу с языковыми приоритетами.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Статистика пикселей и текстур не предсказывает уязвимость модели (r=-0.050).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/train-inference-gap.html\"&gt;Разрыв между обучением и выводом&lt;/a&gt; локализован в конкретном шаге генерации.&lt;/li&gt;\n&lt;li&gt;Устойчивость к атакам — это свойство языкового декодера, а не визуального энкодера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metody-i-tochnost\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#metody-i-tochnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и точность&lt;/span&gt;&lt;/a&gt;Методы и точность&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Метод&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Данные&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Точность&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Где ошибается&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Object Texture Intensity (OTI)&lt;/td&gt;\n&lt;td&gt;200 изображений COCO val2017&lt;/td&gt;\n&lt;td&gt;r=-0.050, p=0.484&lt;/td&gt;\n&lt;td&gt;Нулевая предсказательная сила для VLM&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ridge Regression&lt;/td&gt;\n&lt;td&gt;9 базовых признаков изображения&lt;/td&gt;\n&lt;td&gt;R^2=0.069&lt;/td&gt;\n&lt;td&gt;Не объясняет уязвимость к атакам&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Linear Probe&lt;/td&gt;\n&lt;td&gt;Скрытое состояние слияния&lt;/td&gt;\n&lt;td&gt;AUC=0.858&lt;/td&gt;\n&lt;td&gt;Присутствует риск круговой логики&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследование сфокусировано на механизме «разрыва обучения и вывода» (train/inference gap) с использованием 200 изображений из набора COCO val2017. Авторы применили двухэтапную атаку методом проекционного градиентного спуска (&lt;a href=\"concepts/projected-gradient-descent.html\"&gt;PGD&lt;/a&gt;) с 500 итерациями на этап, чтобы проверить, как искажения проходят через визуальный энкодер и языковой декодер. Использование «линзы логитов» (&lt;a href=\"concepts/logit-lens.html\"&gt;logit lens&lt;/a&gt;) позволило отследить ранг целевого токена на каждом из 28 слоев декодера.&lt;/p&gt;\n&lt;p&gt;Результаты показывают, что визуальный энкодер искажает представление каждого изображения почти одинаково, независимо от итогового успеха атаки. Однако языковой декодер активно подавляет эти искажения в устойчивых моделях (p&amp;lt;0.001, rank-biserial r=0.579). Линейный зонд на скрытом состоянии слияния (merger hidden state) разделяет успешные и провальные атаки с &lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;=0.858, подтверждая, что именно языковой приоритет является главным барьером для состязательных атак.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено одной архитектурой Qwen2.5-VL-7B и выборкой из 200 изображений, что требует проверки на других моделях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Целенаправленные &lt;a href=\"concepts/adversarial-perturbations.html\"&gt;состязательные возмущения&lt;/a&gt; позволяют снизить функцию потерь VLM-модели (Qwen2.5-VL-7B-Instruct) при обучении с «учителем» (teacher-forcing) для заданного описания практически до нуля. Однако при свободном генерировании текста модель выдает исходное, корректное описание без следов целевого воздействия. Это явление авторы называют «разрывом между обучением и выводом» (train/inference gap).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование на 200 изображениях из набора COCO показало, что модель игнорирует состязательные атаки при свободном выводе, несмотря на их успех при обучении.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследование проводилось с использованием двухэтапной атаки PGD на 200 отложенных изображениях из датасета COCO. Авторы проанализировали статистику пикселей, включая показатели текстурной уязвимости, заимствованные из исследований устойчивости CNN. Статистический анализ (гребневая регрессия) показал отсутствие предсказательной силы этих метрик: коэффициент корреляции составил r = -0,050 (p = 0,484), а коэффициент детерминации R² = 0,069.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PGD-атака (Projected Gradient Descent) — итеративный метод поиска минимальных изменений в изображении, которые заставляют нейросеть ошибаться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;С помощью метода logit lens (анализ вероятностей токенов на разных слоях) авторы локализовали разрыв в одном авторегрессионном шаге. Ранг целевого токена при условии генерации первого верного токена зафиксирован на уровне 3488 из 152 064 возможных токенов словаря для всех изображений и условий с нулевой дисперсией. Отслеживание ранга токена через 28 слоев декодера &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; показало, что визуальный энкодер вносит сопоставимые искажения во все изображения. Однако декодер языка дифференцированно обрабатывает сигнал: усиливает его для уязвимых изображений и подавляет для устойчивых (p &amp;lt; 0,001, rank-biserial r = 0,579). Линейный зонд на скрытом состоянии слияния (merger hidden state) разделяет эти исходы с AUC = 0,858, хотя авторы отмечают риск круговой логики в данной оценке.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторы указывают на потенциальную проблему цикличности (circularity) при оценке линейного зонда, что требует осторожности в интерпретации точности классификации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Зрительно-языковые модели (VLM) всё чаще используются как интерфейс для систем, взаимодействующих с визуальными данными: от браузерных агентов до робототехники. Ключевая уязвимость таких систем — состязательные возмущения (adversarial perturbations), представляющие собой минимальные, незаметные для глаза изменения пикселей, которые заставляют модель выдавать неверный результат. В отличие от классических сверточных нейросетей (CNN), архитектура VLM сложнее: возмущение должно пройти через визуальный энкодер, механизм объединения модальностей и авторегрессионный декодер. Исследователи обнаружили парадокс на модели Qwen2.5-VL-7B-Instruct: при использовании метода градиентного спуска (PGD) можно добиться того, что модель при «принудительном обучении» (teacher-forcing) почти со 100% вероятностью выдает заданный атакующим текст. Однако при свободной генерации та же модель игнорирует возмущение и описывает исходное изображение верно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показывает, что принудительное обучение модели с состязательными возмущениями не гарантирует успех атаки при свободной генерации текста.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы анализируют этот разрыв на 200 изображениях из набора COCO val2017, используя двухэтапный протокол PGD и метод «logit lens» для отслеживания состояний на каждом слое энкодера и декодера. Основные вопросы: зависят ли искажения от статистики пикселей (RQ1), на каком этапе генерации происходит сбой (RQ2) и как именно декодер обрабатывает искаженный сигнал (RQ3). Результаты опровергают гипотезу о том, что устойчивость VLM определяется только визуальным энкодером: основной вклад в сопротивление атакам вносит именно языковой декодер, который может как усиливать, так и подавлять искаженный сигнал.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Logit lens — метод интерпретируемости, позволяющий «заглянуть» внутрь нейросети, проецируя скрытые состояния слоев в пространство слов, чтобы понять, что модель «думает» в данный момент.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"svyazannye-raboty-sostyazatelnye-ataki-i-razryv-mezhdu-obucheniem-i-vyvodom\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#svyazannye-raboty-sostyazatelnye-ataki-i-razryv-mezhdu-obucheniem-i-vyvodom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы: состязательные атаки и разрыв между обучением и выводом&lt;/span&gt;&lt;/a&gt;Связанные работы: состязательные атаки и разрыв между обучением и выводом&lt;/h4&gt;\n&lt;p&gt;Традиционные методы атак, такие как PGD, хорошо изучены для CNN. Однако для VLM наблюдается эффект, схожий с «ошибкой экспозиции» (exposure bias): успешность атаки при принудительном обучении не переносится на свободную генерацию. Авторы впервые количественно оценивают этот разрыв на уровне отдельных токенов.&lt;/p&gt;\n&lt;h4 id=\"uyazvimost-izobrazhenij-k-atakam\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#uyazvimost-izobrazhenij-k-atakam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Уязвимость изображений к атакам&lt;/span&gt;&lt;/a&gt;Уязвимость изображений к атакам&lt;/h4&gt;\n&lt;p&gt;Существующие метрики уязвимости (например, интенсивность текстуры объекта, OTI) были разработаны для CNN и показывают точность до 75% на классификаторах. Данная работа проверяет, применимы ли эти методы к визуальным энкодерам VLM. Также авторы впервые применяют logit lens к состязательно искаженным визуальным токенам, связывая сигналы на разных слоях с итоговым результатом атаки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено архитектурой VLM и конкретными методами атак; результаты могут не распространяться на все типы моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"priznak\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#priznak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Признак&lt;/span&gt;&lt;/a&gt;Признак&lt;/h4&gt;\n&lt;p&gt;Исследование анализирует корреляцию между характеристиками изображений и уязвимостью модели Qwen2.5-VL-7B. Показатель OTI (интенсивность текстуры объекта) при корректной реализации не демонстрирует статистически значимой связи с уязвимостью (r = −0,050, p = 0,484). Напротив, текстурная интенсивность всего изображения и высокочастотные компоненты показывают слабую, но значимую корреляцию (r = −0,299, p &amp;lt; 0,001). Авторы предполагают, что подавление искаженных визуальных сигналов происходит на поздних слоях LLM через механизмы FFN, а не на уровне визуального кодировщика.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стандартные метрики текстур не предсказывают уязвимость модели, что указывает на фундаментальные различия между ViT-архитектурами и классическими CNN.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"model-eksperimentalnoj-ustanovki\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#model-eksperimentalnoj-ustanovki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель экспериментальной установки&lt;/span&gt;&lt;/a&gt;Модель экспериментальной установки&lt;/h4&gt;\n&lt;p&gt;В экспериментах использовалась модель Qwen2.5-VL-7B-Instruct в формате bfloat16 с замороженными весами. Визуальный кодировщик включает 32 блока ViT (размер патча 14) и проектор, сжимающий 1024 токена в 256. В качестве датасета выбрано 200 изображений из COCO val2017, приведенных к размеру 448×448. Целевая последовательность — «A coconut» (3 токена). Атака проводилась методом PGD с моментом (µ=0,9, ε=16/255, α=4/255) в два этапа: сначала оптимизация кодировщика, затем — всего контекста. Изображения были разделены на группы: A (n=38, восприимчивые), B (n=9, разрыв обучения/вывода) и C (n=153, устойчивые).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PGD (Projected Gradient Descent) — итеративный метод генерации состязательных возмущений, который «подталкивает» модель к неверному ответу, изменяя пиксели изображения в пределах заданного порога ε.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rq1-uyazvimost-enkodera-nevozmozhno-predskazat-po-pikselyam\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#rq1-uyazvimost-enkodera-nevozmozhno-predskazat-po-pikselyam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ1: Уязвимость энкодера невозможно предсказать по пикселям&lt;/span&gt;&lt;/a&gt;RQ1: Уязвимость энкодера невозможно предсказать по пикселям&lt;/h4&gt;\n&lt;p&gt;Анализ девяти безмодельных признаков (текстура, частоты, регулярность, размер объектов и др.) показал отсутствие надежных предикторов уязвимости. Попытка использования классификатора Random Forest с 72 признаками GLCM привела к снижению точности с 69,0% до 64,0%. Уязвимость оказалась связана с семантической категорией: например, изображения грузовиков и поездов уязвимы в 50–67% случаев, тогда как изображения птиц и кроватей устойчивы (0%). Это опровергает гипотезу о том, что уязвимость зависит от простых визуальных характеристик, таких как текстура.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено конкретной архитектурой ViT; результаты могут не переноситься на другие типы визуальных кодировщиков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gruppa\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#gruppa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Группа&lt;/span&gt;&lt;/a&gt;Группа&lt;/h4&gt;\n&lt;p&gt;Анализ показал, что атака снижает вероятность генерации правильного первого токена P(A) во всех группах. Ключевой результат: ранг целевого токена «_coconut» на втором шаге генерации неизменно составляет 3488 из 152 064 возможных для всех 200 изображений, независимо от группы или условий (чистые или состязательные данные). Стандартное отклонение равно нулю (Таблица 2). Успешность атаки на этом этапе составляет 0,0%.&lt;/p&gt;\n&lt;h4 id=\"sliyanie-vyhodnyh-dannyh-finalnogo-sloya-llm\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#sliyanie-vyhodnyh-dannyh-finalnogo-sloya-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Слияние выходных данных финального слоя LLM&lt;/span&gt;&lt;/a&gt;Слияние выходных данных финального слоя LLM&lt;/h4&gt;\n&lt;p&gt;Исследование классифицирует поведение модели на три группы (A, B, C) на основе устойчивости к состязательным атакам. Группа A (подверженная) включает 8714 изображений, где состязательный ранг снижается на 5724 единицы по сравнению с чистыми данными. Группа B (разрыв) из 10 258 изображений показывает снижение ранга на 2274. Группа C (устойчивая) представлена выборкой из 50 изображений (из общего числа 153), где ранг увеличивается на 8571 при состязательном воздействии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Устойчивость модели к атакам определяется архитектурными особенностями, а не интенсивностью воздействия: для группы C состязательный ранг возрастает на 8571 при сохранении неизменности при ε = 16/255.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Метод PGD (Projected Gradient Descent) снижает средние потери при принудительном обучении (teacher-forcing) для целевой последовательности из трех токенов. Однако этот успех усреднен: модель демонстрирует структурный отказ на втором токене, где бюджет возмущения не способен изменить языковой приоритет. Разрыв между обучением и выводом (train/inference gap) определяется не степенью воздействия, а конкретной позицией токена, на которой модель остается невосприимчивой к атаке.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PGD — это итеративный алгоритм генерации состязательных примеров, который добавляет небольшие возмущения к входным данным для максимизации ошибки модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"posledstviya-dlya-vnedreniya-vlm-s-oporoj-na-fakty-i-vizualnye-dannye\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#posledstviya-dlya-vnedreniya-vlm-s-oporoj-na-fakty-i-vizualnye-dannye\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Последствия для внедрения VLM с опорой на факты и визуальные данные&lt;/span&gt;&lt;/a&gt;Последствия для внедрения VLM с опорой на факты и визуальные данные&lt;/h4&gt;\n&lt;p&gt;Наши результаты показывают, что методы защиты на уровне пикселей или визуального энкодера, скорее всего, неэффективны. Поскольку энкодер искажает все изображения примерно одинаково, независимо от итогового результата, любая защита, работающая только с визуальным каналом (препроцессинг, усиление энкодера или &lt;a href=\"concepts/filtratsiya.html\"&gt;фильтрация&lt;/a&gt; статистики пикселей), не видит сигнала, определяющего поведение модели. Более перспективным подходом является установка легковесного детектора аномалий после блока объединения (merger) и перед LLM-декодером, где разница в представлениях между подавленными и усиленными изображениями максимальна.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Защита на уровне визуального энкодера неэффективна; детектор аномалий следует размещать между блоком объединения и LLM-декодером.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mehanizm-zashity\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#mehanizm-zashity\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механизм защиты&lt;/span&gt;&lt;/a&gt;Механизм защиты&lt;/h4&gt;\n&lt;p&gt;Языковая модель обладает встроенным механизмом защиты: она надежно нивелирует состязательные искажения для изображений с четким семантическим содержанием (например, птицы или кровати), но не справляется со сложными сценами (грузовики, поезда, загроможденные интерьеры). Это критично для автономных агентов, работающих в неструктурированной среде, где визуальный шум — обычное явление. Кроме того, наши данные меняют подход к оценке надежности VLM. Протоколы, измеряющие только успех атаки по точному совпадению целевой фразы, могут показывать 0,0% успеха, пропуская тот факт, что визуальный энкодер фактически скомпрометирован. Мы предлагаем оценивать &lt;a href=\"concepts/semanticheskiy-dreyf.html\"&gt;семантический дрейф&lt;/a&gt; и внутренние искажения представлений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Семантический дрейф — это отклонение смысла данных, при котором модель начинает интерпретировать визуальные признаки неверно из-за внешних искажений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;p&gt;Результаты исследования носят корреляционный, а не причинно-следственный характер. Мы не проводили эксперименты по патчингу активаций для подтверждения причин подавления в слоях 15–18. Исследование ограничено одной моделью (Qwen2.5-VL-7B-Instruct) и одним типом целевых подписей. Мы не претендуем на универсальность выводов для всех архитектур и не рассматриваем сценарии агентного развертывания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено одной моделью и 200 изображениями; выводы нельзя автоматически переносить на другие архитектуры или реальные системы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"etika-i-raskrytie-informacii\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#etika-i-raskrytie-informacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Этика и раскрытие информации&lt;/span&gt;&lt;/a&gt;Этика и раскрытие информации&lt;/h4&gt;\n&lt;p&gt;Работа описывает существующий класс уязвимостей, а не создает новый метод атаки. Мы публикуем механистический анализ для поддержки исследований в области защиты и не распространяем оптимизированные чекпоинты атак. Эксперименты не затрагивают персональные данные и проводятся исключительно на публичном наборе COCO val2017.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-f1.jpg\" alt=\"Рисунок 1: Анализ вероятности на токен по 200 изображениям и всем трем группам исходов. Ранг целевого токена _coconut пр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Анализ вероятности на токен по 200 изображениям и всем трем группам исходов. Ранг целевого токена _coconut при условии, что правильный предшествующий токен A уже присутствует в контексте, представляет собой прямую линию ровно на отметке 3488 с нулевой дисперсией для каждого изображения, каждой группы, как для чистых, так и для состязательных данных.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-f2.jpg\" alt=\"Рисунок 2: Сдвиг ранга целевого токена (состязательный минус чистый) по всем 28 слоям декодера LLM, по группам. Группа A\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Сдвиг ранга целевого токена (состязательный минус чистый) по всем 28 слоям декодера LLM, по группам. Группа A (восприимчивая) сохраняет положительный сдвиг в сторону цели на протяжении всего процесса; группа C (устойчивая) переходит к отрицательному сдвигу — активному подавлению ниже базового уровня чистых данных — примерно на слоях 15–18.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Разрыв между&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обучением и&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выводом VLM&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;PGD-атаки и&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анализ через&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;logit lens&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Декодер&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;подавляет&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;визуальные&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;искажения&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Защита ИИ&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;требует фокуса&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;на декодере&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;image_forensics&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Arun Josephraj Arokiaraj, Zekun Wu, Adriano Koshiyama&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источн
