        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"147\" cy=\"161\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"533\" cy=\"205\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · WEB_ARCHIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как чиновники удаляют слова&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;из отчетов, чтобы «испарить»&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;научные исследования&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f1.jpg\" alt=\"Рисунок 1: Текст, отредактированный рецензентом, из которого извлекается количество.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Текст, отредактированный рецензентом, из которого извлекается количество.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Текст, отредактированный рецензентом, из которого извлекается количество. (A) Общий текст: рецензент работает с резюме, из которого извлекается количество, суммирующееся с данными, публикуемыми NIH, и практическими записями, которые резюме не создает, фиксируя аспекты исследования. Завершенные гранты исключаются из подсчета. (B) Доля помеченных продолжений, потерявших все термины отбора, FY2023→FY2024 и FY2024→FY2025, по количеству дней от начала бюджета до выдачи.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Исследователи проанализировали 37 790 грантов NIH, чтобы понять, как цензура лексики влияет на государственную статистику. Оказалось, что удаление упоминаний этнических групп из текстов заявок приводит к исключению проектов из категорий «здоровье меньшинств». При этом само финансирование и реальная работа ученых остаются прежними, создавая иллюзию исчезновения целых направлений науки.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Удаление слов из текста гранта автоматически исключает проект из тематических категорий NIH.&lt;/li&gt;\n&lt;li&gt;99,4% проектов с неизменным текстом сохранили категорию, против 15,7% у тех, кто убрал упоминания групп.&lt;/li&gt;\n&lt;li&gt;Финансирование проектов не прекратилось, но их научный вклад перестал отражаться в официальных отчетах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Национальные институты здоровья США (NIH) используют систему RCDC (&lt;a href=\"concepts/rcdc.html\"&gt;Research, Condition, and Disease Categorization&lt;/a&gt;) для автоматической классификации грантов по 300+ категориям на основе анализа текста заявок. В 2025 году ведомство обязало грантополучателей удалять «DEI-лексику» (связанную с разнообразием, равенством и инклюзией) из описаний проектов, не связанных напрямую с этой тематикой. Авторы исследования отследили судьбу 37 790 продолжающихся проектов, сравнив их обновленные описания с данными из реестров клинических испытаний и публикаций.&lt;/p&gt;\n&lt;p&gt;Результаты показали, что вероятность сохранения категории «здоровье меньшинств» для проектов с неизмененным текстом составила 99,4%, тогда как для проектов, удаливших упоминания популяций, она упала до 15,7%. Слепое рецензирование подтвердило, что 84% таких «потерянных» проектов по-прежнему соответствовали критериям категории. Этот механизм, названный «таргетированием слов», приводит к появлению «неучтенной науки»: финансирование продолжается, но государственная статистика перестает фиксировать работу с конкретными группами населения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование опирается на анализ текстов и внешних реестров, не имея доступа к внутренним коммуникациям между чиновниками и учеными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Финансирующие организации используют программное обеспечение для классификации текстов заявок на гранты. Национальный институт здравоохранения США (NIH) распределяет расходы по более чем 300 категориям на основе анализа этого текста. В 2025 году NIH потребовал исключить формулировки, связанные с DEI (разнообразие, равенство и инклюзивность), из заявок, не направленных на эту деятельность, фактически начав отслеживать использование этих слов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показало, что удаление упоминаний расовых и этнических групп из описаний проектов привело к потере классификации «здоровье меньшинств» у 84,3% таких проектов, несмотря на сохранение финансирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы проанализировали 37 790 продолжающихся грантов, сопоставляя их с записями о фактической деятельности. Названия популяций оказались значимым предиктором: в новых исследованиях с базовыми показателями испытаний упоминание чернокожего населения в названии предсказывало увеличение доли участников из этой группы на 60 процентных пунктов. &lt;a href=\"concepts/tekstovye-harakteristiki.html\"&gt;Текстовые характеристики&lt;/a&gt; определяли выживаемость названий, при этом записи о практике давали мало дополнительной информации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Текстовые характеристики» — это алгоритмические методы анализа слов и фраз в документах, которые позволяют классифицировать научные работы без глубокого изучения их содержания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Категория NIH «здоровье меньшинств» напрямую зависела от упоминаний в тексте: 99,4% проектов, сохранивших описание, сохранили и категорию. Среди тех, кто удалил упоминание расовой или этнической группы, категорию сохранили лишь 15,7%, хотя финансирование не прекращалось. Слепое рецензирование 50 таких случаев показало, что 42 из них (84%) соответствовали определению категории в 2024 финансовом году. Сравнение 70 описаний до и после правок выявило, что в 49 случаях цели исследования, касающиеся популяции, были переформулированы. В 63 случаях из 2025 финансового года описания перестали соответствовать критериям категории.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на анализе текстовых данных NIH; выводы о «неучтенной науке» касаются методологии классификации, а не фактического изменения содержания самих научных исследований.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Гранты, упоминающие сексуальные и гендерные меньшинства, имели на 37,8 процентных пункта более высокую вероятность быть отмеченными как «прекращенные» после поправки на ключевые термины, институт и тип деятельности. Мы называем этот механизм «таргетированием слов», а его границу — «таргетированием популяций». Результатом становится «&lt;a href=\"concepts/neuchtennaya-nauka.html\"&gt;неучтенная наука&lt;/a&gt;»: исследования, которые финансируются, но больше не фиксируются в статистике. Поскольку система отслеживает отредактированный текст, невозможно определить, изменилась ли сама суть научной работы вместе с её описанием.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"ispolzovanie-programmnogo-obespecheniya-dlya-analiza-portfelej-issledovanij\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#ispolzovanie-programmnogo-obespecheniya-dlya-analiza-portfelej-issledovanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование программного обеспечения для анализа портфелей исследований&lt;/span&gt;&lt;/a&gt;Использование программного обеспечения для анализа портфелей исследований&lt;/h4&gt;\n&lt;p&gt;Фонды, финансирующие научные исследования, всё чаще используют специализированное программное обеспечение для автоматической классификации текстов грантовых заявок. Такой подход позволяет организациям систематизировать свои портфели проектов. Одним из пионеров в этой области являются Национальные институты здравоохранения США (NIH), которые применяют подобные методы анализа с 2008 года.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/klassifikatsiya-tekstov.html\"&gt;Классификация текстов&lt;/a&gt; — это метод машинного обучения, при котором алгоритм автоматически присваивает научным работам или заявкам тематические категории на основе анализа ключевых слов и контекста.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Системы классификации позволяют фондам отслеживать распределение ресурсов, выявлять пробелы в финансировании и оценивать научную продуктивность по различным направлениям. Использование автоматизированных инструментов становится стандартом для управления крупными массивами данных о грантах, что минимизирует ручной труд при обработке тысяч заявок ежегодно.&lt;/p&gt;\n&lt;p&gt;Система RCDC (Research, Condition, and Disease Categorization) используется Национальными институтами здравоохранения США (NIH) для классификации грантов по более чем 300 категориям, от онкологии до здоровья меньшинств. Эти данные служат официальным отчетом о том, на какие научные исследования расходуются государственные средства. Аналогичные системы классификации применяют и другие фонды, а также международные инициативы, связывающие исследования с Целями устойчивого развития. Эти классификации критически важны: исследователи используют их для анализа соответствия финансирования реальному бремени болезней, правозащитники — для обоснования увеличения бюджета, а администраторы NIH — для выявления пробелов в портфеле агентства.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показывает, что принудительное редактирование текстов заявок на гранты искажает официальную статистику NIH, делая невидимыми исследования, которые фактически продолжают финансироваться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Традиционно исследования в этой области фокусировались на двух аспектах: точности классификации (согласованность подходов) и влиянии индикаторов на поведение ученых (адаптация под критерии оценки). Однако ранее не изучалась ситуация, когда сам фонд начинает диктовать содержание текстов, которые затем анализирует его же программное обеспечение. В 2025 году NIH ввел требование пересматривать заявки на предмет упоминания DEI (разнообразие, равенство и инклюзия), требуя удаления соответствующих формулировок для получения финансирования. Хотя федеральный суд отменил эти директивы в июне 2025 года, многие названия и аннотации к тому моменту были изменены.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RCDC — это автоматизированная система классификации, которая анализирует заголовки и аннотации грантов для распределения их по тематическим категориям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы проанализировали 37 790 продолжающихся проектов, отслеживая упоминания этнических и расовых групп. Результаты показали, что если аннотация проекта оставалась неизменной, вероятность сохранения категории «Исследования здоровья расовых и этнических меньшинств» составляла 99,4%. Если же из текста удалялось упоминание группы, вероятность сохранения категории падала до 15,7%. При этом внешние записи (данные о клинических испытаниях и участниках) подтверждали, что проекты продолжали работать с этими группами. В 17 из 20 проанализированных случаев, где аннотации были отредактированы, проект потерял категорию, несмотря на то, что независимые эксперты подтвердили соответствие работ критериям категории по данным 2024 года.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на анализе административных данных NIH и сопоставлении их с записями о клинических испытаниях; выводы касаются механизмов отчетности, а не качества самих научных работ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zapis,-izmenennaya-pri-prodolzhenii-finansirovaniya\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#zapis,-izmenennaya-pri-prodolzhenii-finansirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Запись, измененная при продолжении финансирования&lt;/span&gt;&lt;/a&gt;Запись, измененная при продолжении финансирования&lt;/h4&gt;\n&lt;p&gt;Правительства формируют научную политику на основе отчетных данных. Классификация данных делает одни аспекты работы видимыми, а другие скрывает. Публикуемые показатели часто воспринимаются как объективные, поскольку они формируются механически, на основе алгоритмов, а не экспертных суждений. Система RCDC (Research, Condition, and Disease Categorization) работает именно так: программное обеспечение автоматически присваивает категории на основе текста грантовых заявок, и эти сводные данные ежегодно передаются в Конгресс и общественности. Это делает систему каналом передачи информации: изменение текста неизбежно меняет статистику без участия человека в принятии решения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 2025 году была зафиксирована ситуация, когда «карта» (отчетность) была отредактирована, а финансирование проектов сохранено, что демонстрирует уязвимость аудита, проверяющего документы, а не реальную деятельность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Грантовые заявки содержат два типа лексики: стратегическую, направленную на получение одобрения, и содержательную. За десятилетия аннотации к грантам NIH стали более рекламными, а критерии NSF привели к появлению шаблонных формулировок о «широком влиянии». Терминология разнообразия стала институциональным ритуалом, слабо связанным с реальной практикой. В то же время политика NIH по инклюзивности сделала обязательным указание демографических подгрупп. Мы проверяем, являются ли эти названия информативными или лишь «церемониальным» словарем. Наша методология основана на сравнении аннотаций с независимыми источниками: регистрациями клинических испытаний, отчетами о наборе участников и предметными индексами, созданными до автоматизации. Если изменение в аннотации не отражено в этих независимых записях, это свидетельствует об изменении отчетности, а не самого исследования.&lt;/p&gt;\n&lt;h4 id=\"targetirovanie-slov\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#targetirovanie-slov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таргетирование слов&lt;/span&gt;&lt;/a&gt;Таргетирование слов&lt;/h4&gt;\n&lt;p&gt;Мы вводим понятие «&lt;a href=\"concepts/word-targeting.html\"&gt;таргетирование слов&lt;/a&gt;» (word targeting) — механизм, при котором редактор текста, на основе которого формируется статистика, выбирает, что удалить. Этот механизм предсказуем и не требует анализа намерений редактора. Таргетирование слов учитывает контекст (например, фраза «меньшинство клеток» сохраняется, так как не относится к демографической группе).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод «таргетирования слов» является идеализированной моделью; он предполагает, что правки текста направлены на удаление определенных терминов, а не на изменение сути научной работы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Из этого следуют три вывода: 1) Удаление слов определяется текстом. Мы проверяем, затрагивают ли правки только формулировки или саму суть исследования. 2) Статистика наследует правки. Категория, извлеченная из отредактированного текста, становится искаженной, что может привести к «неучтенной науке». 3) У таргетирования есть границы. Если давление направлено на саму популяцию, а не на текст, редактирование слов перестает быть эффективным, и действия переходят на уровень отзыва грантов. Таблица 1 (см. раздел «Результаты») содержит перечень этих следствий и доказательную базу для каждого из них.&lt;/p&gt;\n&lt;p&gt;Исполнительные указы от 20 и 21 января 2025 года затронули программы DEI (разнообразие, равенство и инклюзивность) и вопросы «гендерной идеологии». В марте 2025 года NIH выпустил руководство, требующее классифицировать гранты по роли DEI в проекте и удалять соответствующую терминологию из тех заявок, где эта деятельность не была основной. Сообщалось о запрете термина «LatinX». В июне 2025 года эти директивы были отменены судом, а в августе Верховный суд оставил в силе отмену, при этом приостановив часть решения, касающуюся процедур определения статуса грантов. К концу 2025 года NIH внедрил систему текстового скрининга, которая, по данным июня 2026 года, проверяла заявки на наличие как минимум 235 терминов. Согласно коллективному иску от сентября 2026 года, этот список был сформирован на основе слов, часто встречавшихся в грантах, аннулированных в 2025 году.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система скрининга NIH, внедренная в конце 2025 года, использует список из 235 терминов, составленный на основе лексики грантов, отозванных в ходе регуляторных изменений 2025 года.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"slovarnyj-zapas,-na-kotoryj-budet-opiratsya-obzor\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#slovarnyj-zapas,-na-kotoryj-budet-opiratsya-obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Словарный запас, на который будет опираться обзор&lt;/span&gt;&lt;/a&gt;Словарный запас, на который будет опираться обзор&lt;/h4&gt;\n&lt;p&gt;Доля новых грантов NIH, содержащих термины из списка скрининга, выросла с 6,4% в 2015 финансовом году до 15,8% в 2024 году. Аналогичная тенденция наблюдалась в NSF (рост с 29,2% в 2015–2019 гг. до 38,4% в 2023–2024 гг.). Упоминание демографических групп также стало чаще, но неравномерно: упоминания опекунов выросли в 5,9 раза, испаноязычных групп — в 2,8 раза, а чернокожего населения — в 1,4 раза. Спецификой скрининга стали такие корни слов, как «equit-», «underrepresent-» и «minorit-». Рост использования этой лексики внутри одних и тех же исследовательских групп указывает на изменение стиля написания заявок, а не на смену тематики исследований.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/skrining-terminy.html\"&gt;Скрининг-термины&lt;/a&gt; — это ключевые слова, которые стали объектом контроля со стороны регуляторов, отражая изменения в академическом языке, а не в сути научных работ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dannye\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#dannye\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Данные&lt;/span&gt;&lt;/a&gt;Данные&lt;/h4&gt;\n&lt;p&gt;Исследование опирается на данные &lt;a href=\"concepts/nih-exporter.html\"&gt;NIH ExPORTER&lt;/a&gt; (2015–2025 гг.), включая названия, аннотации и бюджеты грантов. Анализ охватывает внешние гранты NIH. Для связи проектов с публикациями (1,25 млн статей за 2016–2026 гг.) использован OpenAlex. Дескрипторы MeSH для статей до 2021 года считаются экспертными, после 2022 года — автоматизированными. Данные о клинических испытаниях взяты из AACT (январь 2025 и сентябрь 2026 гг.). Категории RCDC (например, &lt;a href=\"concepts/remhr.html\"&gt;REMHR&lt;/a&gt; — исследования здоровья меньшинств) извлекались методом интеллектуального анализа текста. Авторы также сгруппировали пять категорий RCDC в «категории равенства» для отслеживания изменений после потери статуса REMHR.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование автоматизированных дескрипторов MeSH после 2022 года ограничивает точность сравнения с экспертной индексацией прошлых лет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"terminy\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#terminy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Термины&lt;/span&gt;&lt;/a&gt;Термины&lt;/h4&gt;\n&lt;p&gt;Скрининг-термины включают список из 235 слов. Для анализа удалений и аннулирований использован «Список Сената» из 699 терминов, опубликованный в октябре 2024 года. «Отмеченные гранты» — это заявки, содержащие хотя бы один термин из списка скрининга. Исследователи выделили шесть целевых групп (например, SGM, расовые меньшинства) и восемь контрольных (например, ветераны, спортсмены), чтобы оценить, как менялись формулировки в зависимости от тематики проекта.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"chetyre-iz-desyati-pomechennyh-rezyume-lishilis-terminov-za-god\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#chetyre-iz-desyati-pomechennyh-rezyume-lishilis-terminov-za-god\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Четыре из десяти помеченных резюме лишились терминов за год&lt;/span&gt;&lt;/a&gt;Четыре из десяти помеченных резюме лишились терминов за год&lt;/h4&gt;\n&lt;p&gt;Из 5461 гранта 2024 финансового года, имеющих продолжение в 2025 году, в 2169 (39,7%) случаях ключевые термины исчезли из резюме. Для сравнения: годом ранее этот показатель составлял лишь 0,08% (4 из 5242). Вероятность удаления термина росла вместе с задержкой выпуска продолжения: от 27,8% для вовремя оформленных грантов до 54,6% для тех, что были выпущены спустя 90 дней после начала бюджетного периода. Удаление зависело от контекста: если термин использовался случайно (например, «меньшинство клеток»), он исчезал в 2,4% случаев, тогда как при использовании в целевом значении — в 40,6%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 39,7% случаев гранты 2024 года потеряли ключевые термины в резюме при продлении на 2025 год, причем вероятность удаления выше для документов, выпущенных с задержкой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nazvaniya-populyacij-kak-prediktory-nabora-uchastnikov\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#nazvaniya-populyacij-kak-prediktory-nabora-uchastnikov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Названия популяций как предикторы набора участников&lt;/span&gt;&lt;/a&gt;Названия популяций как предикторы набора участников&lt;/h4&gt;\n&lt;p&gt;Упоминание конкретной группы населения в названии гранта статистически связано с составом участников клинических исследований (Рис. 2A). Среди новых грантов, где были опубликованы исходные данные, доля чернокожих участников была на 60 процентных пунктов (п.п.) выше (95% ДИ: 51–68), если эта группа была указана в названии, и на 30 п.п. выше (23–37), если упоминание было только в аннотации. Аналогичный эффект наблюдался для испаноязычных участников (прирост 75 и 23 п.п.) и женщин (39 и 17 п.п.). Данные MeSH подтвердили эту тенденцию (Рис. 2B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f2.jpg\" alt=\"Рисунок 2: Названия популяций, зафиксированные при включении в исследование.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Названия популяций, зафиксированные при включении в исследование.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Названия популяций, зафиксированные при включении в исследование. (A) Рост доли включенной популяции в связанных испытаниях, гранты, называющие её, против грантов, не называющих её, по месту упоминания (закрашено — название; пусто — только в другом месте). (B) Рост доли курируемых связанных статей, проиндексированных с помощью дескриптора MeSH для данной популяции. Янтарным цветом отмечены популяции, бирюзовым — сравнительные популяции. Новые гранты FY2015–FY2023, с 95% доверительными интервалами.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод MeSH (&lt;a href=\"concepts/medical-subject-headings.html\"&gt;Medical Subject Headings&lt;/a&gt;) — это контролируемый словарь для индексации статей, позволяющий систематизировать научные темы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tekstovye-harakteristiki-kak-prediktory-vyzhivaemosti-nazvanij\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tekstovye-harakteristiki-kak-prediktory-vyzhivaemosti-nazvanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Текстовые характеристики как предикторы выживаемости названий&lt;/span&gt;&lt;/a&gt;Текстовые характеристики как предикторы выживаемости названий&lt;/h4&gt;\n&lt;p&gt;Выживаемость названий групп зависела от структуры текста (предложение, форма, популяция). Если название группы находилось в одном предложении с «целевым термином», оно удалялось чаще. Например, для испаноязычных групп название сохранялось в 22,8% случаев, если оно соседствовало с термином, против 43,9%, если упоминание было изолированным (Рис. 3A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f3.jpg\" alt=\"Рисунок 3: Текстовые признаки, предсказывающие выживаемость названий.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Текстовые признаки, предсказывающие выживаемость названий.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Текстовые признаки, предсказывающие выживаемость названий. (A) Выживаемость названий популяций среди пересмотренных продолжений, когда каждое упоминание делит предложение с указанным термином и когда одно стоит отдельно. (B) Потеря внутри гранта указанных и неуказанных форм одной и той же популяции с разницей и её 95% доверительным интервалом. (C) Разрыв в выживаемости для изученных популяций, необработанный, с фиксированным текстом и для хирургических правок, относительно минимального обнаруживаемого эффекта (заштриховано). Интервалы 95%, интервалы Вильсона для долей и &lt;a href=\"concepts/butstrep.html\"&gt;бутстреп&lt;/a&gt;-ресемплинг для разрывов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование носит наблюдательный характер: выявлена корреляция между структурой текста и удалением терминов, однако это не доказывает прямую причинно-следственную связь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В ходе автоматизированного анализа предложений выяснилось, что в 47,6% случаев (95% ДИ: 39,3–54,7) предложения, содержащие «сигнальные» названия, сохранялись, но без самих названий. Для сравнения, в контрольных группах этот показатель составил лишь 0,2%. Что касается формы, то полные названия (например, «Hispanic») удалялись чаще, чем сокращенные. Влияние того, изучал ли проект конкретную популяцию, оказалось минимальным: добавление этого фактора в модель прогнозирования изменило точность (&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;) лишь на 0,002.&lt;/p&gt;\n&lt;h4 id=\"svyaz-mezhdu-upominaniem-gruppy-v-annotacii-i-kategoriej-proekta\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#svyaz-mezhdu-upominaniem-gruppy-v-annotacii-i-kategoriej-proekta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связь между упоминанием группы в аннотации и категорией проекта&lt;/span&gt;&lt;/a&gt;Связь между упоминанием группы в аннотации и категорией проекта&lt;/h4&gt;\n&lt;p&gt;Исследование показывает, что присвоение категории REMHR (исследования здоровья меньшинств) тесно коррелирует с наличием названия расовой или этнической группы в аннотации проекта. Среди проектов, которые в 2024 финансовом году (ФГ) явно изучали такие группы, 99,5% сохранили категорию в 2025 ФГ, если текст аннотации остался прежним. Однако, если название группы из аннотации исчезало, вероятность сохранения категории падала до 15,0% (3 из 20 проектов).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вероятность сохранения категории REMHR падает с 98,5% до 15,0%, если из описания проекта удаляется упоминание целевой расовой или этнической группы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;REMHR — категория, присваиваемая проектам, сфокусированным на здоровье меньшинств. Она исключает исследования, где раса или этническая принадлежность используются лишь как переменные для стратификации данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данное исследование является наблюдательным: авторы анализируют корреляцию между текстом и классификацией, а не причинно-следственную связь, установленную в ходе рандомизированного эксперимента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Слепое экспертное ревью 20 проектов, потерявших категорию после удаления названия группы, показало, что все они формально соответствовали определению REMHR. При этом 10 из них (с общим финансированием 6,4 млн долларов в 2025 ФГ) продолжали вести исследования по данной теме, что подтверждается публикациями или записями в реестрах клинических испытаний. Анализ 50 случайно отобранных проектов, потерявших категорию, подтвердил, что в 84% случаев их цели в 2024 ФГ соответствовали критериям REMHR, однако доказательств текущей активности в 2025–2026 годах было значительно меньше.&lt;/p&gt;\n&lt;h4 id=\"posle-popravki-na-ukazannye-terminy\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#posle-popravki-na-ukazannye-terminy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;После поправки на указанные термины&lt;/span&gt;&lt;/a&gt;После поправки на указанные термины&lt;/h4&gt;\n&lt;p&gt;Анализ грантов 2024 финансового года, в названиях которых фигурируют сексуальные и гендерные меньшинства (SGM), показал, что 46,7% из них были отмечены как прекращенные к марту 2026 года, тогда как среди всех грантов этот показатель составил 4,8% (Рис. 5B). Из всех грантов с упоминанием SGM 10,7% числятся прекращенными, 36,0% — возможно восстановленными, 15,4% продолжаются без упоминания группы, 20,8% продолжаются с упоминанием, а 17,1% не имеют четкого статуса. При фиксации прочих параметров (институт, активность, терминология) вероятность прекращения грантов с упоминанием SGM была на 37,8 процентных пункта выше (95% ДИ 33,1–42,7), чем у других групп. Для сравнения: для испаноязычных групп этот показатель составил +3,2 (1,6–4,9), а для темнокожего населения +0,2 (−1,2–1,8) (Рис. 5A).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f5.jpg\" alt=\"Рисунок 5: Гранты, называющие сексуальные и гендерные меньшинства, чаще прекращались после поправки на указанные термины\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Гранты, называющие сексуальные и гендерные меньшинства, чаще прекращались после поправки на указанные термины.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: Гранты, называющие сексуальные и гендерные меньшинства, чаще прекращались после поправки на указанные термины. (A) Скорректированная разница в доле, зафиксированной как прекращенная, по названной популяции, с фиксированными указанными терминами, институтом и деятельностью, с 95% интервалами ресемплинга институтов. (B) Результаты грантов FY2024, называющих каждую популяцию (гранты, активные после 20 января 2025 года), со всеми грантами в качестве эталона. Числа в столбцах — проценты.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гранты с упоминанием SGM прекращались на 37,8 процентных пункта чаще, чем другие, что указывает на целенаправленное исключение данных групп из исследований.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данная тенденция сохранялась при исключении институтов, попавших под общие санкции, а также среди грантов, не связанных с обучением. В категории исследований ВИЧ/СПИД разрыв составил 31,8 процентных пункта (25,1–38,6). При редактировании грантов термины, относящиеся к SGM, удалялись с одинаковой частотой независимо от того, были ли они частью названия группы или иными терминами. Однако среди пересмотренных грантов термины, связанные с гендерной идентичностью, удалялись на 20,7 процентных пункта чаще, чем термины сексуальной ориентации.&lt;/p&gt;\n&lt;h4 id=\"izmeneniya-v-annotaciyah-prevyshayut-izmeneniya-v-praktike\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#izmeneniya-v-annotaciyah-prevyshayut-izmeneniya-v-praktike\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изменения в аннотациях превышают изменения в практике&lt;/span&gt;&lt;/a&gt;Изменения в аннотациях превышают изменения в практике&lt;/h4&gt;\n&lt;p&gt;Исследователи оценили 150 пар аннотаций, в которых были удалены ключевые термины. В 46,7% случаев (95% ДИ 38,9–54,6) содержание исследования было либо неполным, либо переформулированным (&lt;a href=\"concepts/krippendorfa.html\"&gt;α Криппендорфа&lt;/a&gt; = 0,84). В 66 парах эксперты обнаружили в новой версии аннотации контент, отсутствовавший в старой, что свидетельствует о пересмотре целей исследования. Анализ связанных клинических испытаний показал, что 4,5% испытаний (8 из 179) были прекращены или приостановлены к сентябрю 2026 года, если аннотация гранта переставала упоминать целевую группу, по сравнению с 2,5% (13 из 529) в случаях, когда аннотация оставалась неизменной (разница 2,0 процентных пункта, 95% ДИ −1,4–5,8).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;α Криппендорфа — статистический показатель, оценивающий степень согласия между несколькими экспертами при классификации данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдательное исследование: выявленные различия указывают на корреляцию между изменением текста аннотации и статусом испытаний, но не доказывают прямую причинно-следственную связь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В 15,6% случаев критерии отбора в испытаниях перестали упоминать группу, если аннотация гранта также удалила это упоминание, против 4,8% в неизменных аннотациях. Проекты, удалившие упоминание группы, регистрировали больше новых испытаний в целом (0,51 против 0,37 на проект), однако новые регистрации с упоминанием той же группы практически не различались между группами.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"otredaktirovannye-zapisi\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#otredaktirovannye-zapisi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отредактированные записи&lt;/span&gt;&lt;/a&gt;Отредактированные записи&lt;/h4&gt;\n&lt;p&gt;В рамках проектов, требующих строгого соответствия критериям, в категории FY2025 фиксировались изменения в описаниях исследований. Таблица 1 сопоставляет последствия этих правок с имеющимися доказательствами. В большинстве случаев после редактирования аннотаций проекты переставали соответствовать формальным определениям, хотя финансирование и общая классификация сохранялись. Это создает разрыв между реально ведущейся работой и тем, как она отражена в официальных отчетах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 46,7% из 150 проанализированных пар записей эксперты отметили, что содержание исследований либо исчезло, либо было переопределено в новых версиях текстов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ 70 случаев потери «именных» категорий показал, что в 49 из них цели исследования были переформулированы, тогда как среди 10 контрольных проектов, сохранивших названия, это произошло лишь в 3 случаях. Сравнение текстов не позволяет однозначно утверждать, изменилась ли сама суть научной работы или только способ её описания. Для 5 из 7 проектов, которые, согласно критериям, продолжали соответствовать определению в 2025–2026 годах, доказательством служили лишь активные статусы клинических испытаний.&lt;/p&gt;\n&lt;p&gt;Авторы вводят понятие «неучтенной науки» (uncounted science). В отличие от «невыполненной науки» (исследования, которые общество требует, но институты игнорируют) или «запретного знания» (темы, которые избегают из-за чувствительности), неучтенная наука — это реально финансируемые проекты, которые фактически ведутся, но перестают учитываться в статистике из-за изменений в текстовых описаниях. Это становится конститутивным свойством системы: отчеты начинают восприниматься как единственное доказательство содержания работы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Неучтенная наука — это научная деятельность, которая продолжает финансироваться и проводиться, но выпадает из официальных реестров из-за изменения терминологии в описаниях проектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таблица 1 демонстрирует, что названия проектов несут информационную нагрузку: наличие целевой группы в названии предсказывает её долю в выборке. Однако правки в текстах привели к тому, что проекты, изучающие определенные группы населения, теряли категорию, если их аннотация лишалась соответствующего термина. При этом в 10 из 17 случаев потери категории эксперты подтвердили, что в более поздних записях (на сумму 6,4 млн) работа с целевой группой продолжалась. В 7 случаях (на сумму 2,2 млн) это подтверждалось только активными записями в реестрах испытаний. Модель предсказания потери категории на основе правок текста показала точность AUC 0,95.&lt;/p&gt;\n&lt;h4 id=\"na-chto-povliyali-pravki\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#na-chto-povliyali-pravki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;На что повлияли правки&lt;/span&gt;&lt;/a&gt;На что повлияли правки&lt;/h4&gt;\n&lt;p&gt;Руководство 2025 года было направлено на отделение «языка» от «исследований». Однако правки затрагивали предложения в зависимости от того, содержали ли они определенные термины или названия групп. Факт изучения конкретной популяции почти не влиял на предсказание удаления (изменение AUC составило 0,002; 95% ДИ: от -0,010 до 0,013).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (Area Under the Curve) — метрика качества классификации; значение 0,002 указывает на крайне низкую предсказательную способность факта изучения популяции по сравнению с наличием ключевых слов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Парный обзор показал, что в 49 из 70 случаев удаления названий авторы правок переформулировали цели исследования. Стабильность категории в 99,4% случаев, где резюме не менялись, говорит о том, что общая методология RCDC не менялась, но правки были точечными. Ошибки возникали там, где алгоритм не мог отличить «язык» от информативных названий.&lt;/p&gt;\n&lt;h4 id=\"ot-odnogo-obzora-k-drugomu\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#ot-odnogo-obzora-k-drugomu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;От одного обзора к другому&lt;/span&gt;&lt;/a&gt;От одного обзора к другому&lt;/h4&gt;\n&lt;p&gt;Существует гипотеза, что фильтр, введенный NIH в декабре 2025 года, был создан на основе базы слов из грантов, отозванных в 2025 году. Если это так, результаты одного раунда проверок становятся списком слов для следующего. К 30 сентября 2026 года из 200 проектов, чьи резюме потеряли название группы, лишь 3 снова упомянули её, в то время как среди 496 проектов с неизменными резюме это сделали 444 (Таблица S14).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данные по 2026 финансовому году ограничены записями, доступными на 30 сентября 2026 года; полная картина еще не опубликована.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"targetirovanie-grupp-naseleniya-v-2003-i-2025-godah\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#targetirovanie-grupp-naseleniya-v-2003-i-2025-godah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таргетирование групп населения в 2003 и 2025 годах&lt;/span&gt;&lt;/a&gt;Таргетирование групп населения в 2003 и 2025 годах&lt;/h4&gt;\n&lt;p&gt;Для сексуальных и гендерных меньшинств показатели удаления терминов из описаний проектов и их сохранения были схожими, однако гранты этой группы чаще подвергались прекращению финансирования, чем предсказывало количество ключевых слов (разница составила 37,8 процентных пункта после поправки, тогда как для испаноязычного населения — 3,2). К 23 марта 2026 года 36,0 из 46,7 процентных пункта таких прекращений были отмечены как потенциально восстановленные. Мы интерпретируем это как целенаправленное воздействие: если давление направлено на группу, редактирование текста не удовлетворяет требованиям, и меры переходят на уровень грантов. Аналогичная ситуация наблюдалась в 2003 году, когда после запроса Конгресса по поводу грантов NIH на исследования сексуального поведения, список из более чем 250 проектов был передан сотрудникам комитета. Хотя NIH не отозвал ни одного гранта, около половины опрошенных исследователей сообщили об удалении «нежелательных» слов из названий и аннотаций по рекомендации кураторов программ, а 17% заявили об отказе от исследований. В 2025 году запрос исходил от самого агентства, и гранты были не только отредактированы, но и прекращены.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 2025 году гранты для сексуальных и гендерных меньшинств прекращались на 37,8 п.п. чаще, чем ожидалось, что указывает на прямое таргетирование, а не просто на изменение терминологии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"chto-zapis-bolshe-ne-mozhet-pokazat\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#chto-zapis-bolshe-ne-mozhet-pokazat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что запись больше не может показать&lt;/span&gt;&lt;/a&gt;Что запись больше не может показать&lt;/h4&gt;\n&lt;p&gt;Проблема заключается в механизме формирования отчетности. Когда термины, которые фонд использует для подсчета, одновременно являются объектами цензуры, политика фонда и научная отчетность сливаются в единый инструмент. Если администрация требует правок в общем тексте, это требование возвращается в отчетность как изменение самой науки. В 2025 году удаленные названия стали именно теми, которые были нужны для статистики. В серии данных за 2025 финансовый год (FY2025) присутствует немаркированный разрыв. Часть падения общих показателей по здоровью меньшинств связана с проектами, чьи аннотации перестали упоминать эти группы. В анализируемой выборке проекты, утратившие категорию после удаления названия, составили около пятой части общего снижения (125,0 млн из 553,7 млн), и эти данные невозможно восстановить из опубликованных отчетов. Любой анализ этой серии как тренда неизбежно включает этот разрыв. Мы смогли выявить его только благодаря сохранившимся следам в списках проектов NIH, сводках за 2024 год и реестрах. Публичная запись не хранит ни исходный текст, ни дату правки, поэтому читатель не может отличить реальные изменения в исследованиях от изменений в их описании.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya-i-budushie-issledovaniya\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#ogranicheniya-i-budushie-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и будущие исследования&lt;/span&gt;&lt;/a&gt;Ограничения и будущие исследования&lt;/h4&gt;\n&lt;p&gt;Метод оценки исследований неточен (раздел 5.3). Значение AUC модели текста 0,69 означает, что измеренные нами признаки упускают значительную часть действий редакторов. Строгая выборка ограничена 20 проектами. Стандарт «практика-запись» фиксирует вовлеченность группы, тогда как REMHR определяется целью. Слепое рецензирование подтверждает принадлежность к категории для этих 20 проектов в 2024 финансовом году, но оно опирается на пакеты публичных записей, а доказательства текущей работы — на статус в реестрах, которые исследователи обновляют самостоятельно. Согласие рецензентов по текущим работам было лишь умеренным (κ=0,26 и 0,36). Конкретные цели (Specific aims), которые также анализирует RCDC, не являются публичными. Файлы за 2025 год были перегенерированы в 2026 году, поэтому даты правок неизвестны. Данные о наборе участников основаны на 2% грантов, где опубликованы исходные показатели испытаний. Grant Witness является сторонней компиляцией, а статус прекращения финансирования менялся в ходе судебных разбирательств. Главное ограничение — короткий временной интервал. Эффекты правок на предложения, набор участников и обучение исследователей проявляются годами, и текущие данные не показывают, изменили ли их рецензии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (Area Under the Curve) — метрика качества классификации: 0,5 означает случайное угадывание, 1,0 — идеальную точность. Значение 0,69 указывает на умеренную предсказательную способность модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено коротким периодом наблюдения; данные не позволяют однозначно связать изменения в описаниях грантов с долгосрочными изменениями в реальной научной практике.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;В 2025 году Национальные институты здравоохранения США (NIH) отредактировали описания грантов, что привело к изменению официальной научной отчетности. Мы выявили проекты, сохранившие финансирование, несмотря на то, что из их публичных аннотаций исчезли упоминания определенных групп населения, а сами категории были исключены из ежегодных списков NIH. В большинстве случаев редактирование сопровождалось изменением заявленных целей проекта, из-за чего новые описания формально перестали соответствовать критериям исключенных категорий. Однако наличие активных клинических испытаний для некоторых из этих проектов подтверждает, что работа с целевыми группами продолжается: финансирование сохраняется, а статистический учет — нет. В случаях, когда объектом исследования выступала сама группа населения, гранты с соответствующими названиями прекращались значительно чаще. Валидность текстовой классификации напрямую зависит от правил управления этим текстом. Если государственные органы регулируют научные исследования через изменение формулировок, они могут интерпретировать собственные административные решения как объективные научные факты, что искажает восприятие данных для всех внешних пользователей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Редактирование описаний грантов NIH в 2025 году привело к исчезновению упоминаний определенных групп населения из отчетности при сохранении фактического финансирования проектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"metody-analiza-i-kriterii-otbora\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#metody-analiza-i-kriterii-otbora\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы анализа и критерии отбора&lt;/span&gt;&lt;/a&gt;Методы анализа и критерии отбора&lt;/h4&gt;\n&lt;p&gt;Для анализа преемственности проектов связывались записи за 2024 и 2025 финансовые годы (FY). Анализ событий охватил 37 406 пар записей, из которых 5 461 были помечены как целевые. Для анализа упоминаний использовались 37 790 пар, где единицей анализа выступал грант и упомянутая в тексте за 2024 год популяция. Упоминание считалось сохраненным, если в итоговом отчете за 2025 год популяция по-прежнему фигурировала в тексте.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод связывания пар позволяет отследить динамику изменений в описании проекта при переходе от одного финансового года к другому.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Удаление сопутствующих данных подразумевало исключение предложений, содержащих ключевые термины, если в том же предложении присутствовали другие термины из списка. Популяция считалась «изучаемой» проектом, если записи до 2025 года подтверждали это одним из способов: наличие не менее двух статей с MeSH-дескриптором данной популяции (минимум 30% статей), наличие связанного клинического испытания с упоминанием популяции в критериях включения на январь 2025 года или, для чернокожего и испаноязычного населения, наличие испытания с долей участников, вдвое превышающей долю в населении США.&lt;/p&gt;\n&lt;h4 id=\"procedury-ocenki-i-statisticheskaya-obrabotka\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#procedury-ocenki-i-statisticheskaya-obrabotka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процедуры оценки и статистическая обработка&lt;/span&gt;&lt;/a&gt;Процедуры оценки и статистическая обработка&lt;/h4&gt;\n&lt;p&gt;Исследование «строгой практики» охватило подмножество проектов с минимум тремя статьями или связанным испытанием, что составило 22,3% пар «грант–популяция». Оценку проводили три эксперта: двое авторов и один независимый коллега. Эксперты были ослеплены в отношении идентификаторов проектов и их категориального статуса. Удержание показателя определялось как доля проектов, сохранивших упоминание REMHR в 2025 году среди тех, кто имел его в 2024 году.&lt;/p&gt;\n&lt;p&gt;Из 55 302 грантов, активных после 20 января 2025 года, статус «завершен» присваивался при наличии даты завершения в базе Grant Witness. Статистическая значимость различий рассчитывалась с использованием интервалов Уилсона для долей и интервалов Ньюкомба для разности показателей удержания. В остальных случаях применялась перевыборка (resampling) проектов или институтов.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f1.jpg\" alt=\"Рисунок 1: Текст, отредактированный рецензентом, из которого извлекается количество.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Текст, отредактированный рецензентом, из которого извлекается количество.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Текст, отредактированный рецензентом, из которого извлекается количество. (A) Общий текст: рецензент работает с резюме, из которого извлекается количество, суммирующееся с данными, публикуемыми NIH, и практическими записями, которые резюме не создает, фиксируя аспекты исследования. Завершенные гранты исключаются из подсчета. (B) Доля помеченных продолжений, потерявших все термины отбора, FY2023→FY2024 и FY2024→FY2025, по количеству дней от начала бюджета до выдачи.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f4.jpg\" alt=\"Рисунок 4: Проекты остались профинансированными, но перестали учитываться в подсчете.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Проекты остались профинансированными, но перестали учитываться в подсчете.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Проекты остались профинансированными, но перестали учитываться в подсчете. (A) Проекты FY2024, несущие REMHR и активные после 20 января 2025 года, отслеженные до FY2025: статус, резюме и категория FY2025. Ширина полос — количество проектов. Янтарные полосы — проекты, чьи резюме потеряли название. (B) Удержание REMHR среди проектов, строго изучающих расовую или этническую популяцию, в зависимости от изменений в резюме, с использованием FY2023→FY2024 в качестве эталона. (C) Доля проектов с REMHR в FY2025, резюме без изменений (серый) против удаленного названия (янтарный), для измеренных проектов, изучающих популяцию, и для тех, которые называют её, но не соответствуют стандарту практических записей. (D) Доля проектов FY2025, несущих каждую категорию, проекты, сохранившие REMHR, против проектов, потерявших его после удаления названия. (E) 20 продолжающихся проектов со строгими практическими доказательствами, чьи резюме потеряли название, и 17 из них, потерявших REMHR. Среди 17 проектов проведены три проверки: оба рецензента обнаружили более поздние публичные записи, все еще показывающие работу над популяцией (10), оба оценили доказательства 2025–2026 годов как соответствующие определению категории (7), и связанное испытание было указано как набирающее участников, активное или зачисляющее по приглашению в регистрационной записи за сентябрь 2026 года и называло популяцию (8). Проверка работы и проверка испытания пересекаются (7 соответствуют обоим, 11 — хотя бы одному). Доллары — общее финансирование проектов в FY2025, а не расходы на исследования популяции, округлено до $0,1 млн. Панель A основана только на данных категорий, панель E — на обзоре на уровне проектов. Интервалы в B и C — 95% интервалы Вильсона.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS1.jpg\" alt=\"Дополнительный рисунок 1: Увеличение вероятности потери упоминания в предложении, содержащем указанный термин, в разрезе\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок 1: Увеличение вероятности потери упоминания в предложении, содержащем указанный термин, в разрезе «награда × популяция».&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Дополнительный рисунок 1: Увеличение вероятности потери упоминания в предложении, содержащем указанный термин, в разрезе «награда × популяция». Популяции сравнения разделены на примыкающие к рабочей силе (студенты, медицинский персонал) и прочие. 95% доверительные интервалы методом бутстрепа для перевыборки наград (для сигнальных популяций не показаны). Дополнительные методы 4.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS2.jpg\" alt=\"Дополнительный рисунок 2: Выживаемость имен сигнальной популяции и популяции сравнения в зависимости от количества упоми\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок 2: Выживаемость имен сигнальной популяции и популяции сравнения в зависимости от количества упоминаний в тексте за 2024 финансовый год: наблюдаемые значения (сплошная линия) и прогнозируемые при условии независимого удаления каждого упоминания (пунктирная линия). Дополнительные методы 4.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS3.jpg\" alt=\"Дополнительный рисунок 3: Разрыв в выживаемости (изучаемая популяция минус неизучаемая), необработанные данные и данные \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок 3: Разрыв в выживаемости (изучаемая популяция минус неизучаемая), необработанные данные и данные с фиксированным текстом, в целом, для хирургических правок и только необработанные данные для полных переписываний, с 95% доверительными интервалами методом перевыборки проектов. Дополнительные методы 4.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS4.jpg\" alt=\"Дополнительный рисунок 4: AUC вне выборки (out-of-fold) для выживаемости имен в измеренном подмножестве по моделям, с 95\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Дополнительный рисунок 4: AUC вне выборки (out-of-fold) для выживаемости имен в измеренном подмножестве по моделям, с 95% доверительными интервалами методом перевыборки проектов. Дополнительные методы 4.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Цензура&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;лексики в&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;научных&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;заявках&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/pa
