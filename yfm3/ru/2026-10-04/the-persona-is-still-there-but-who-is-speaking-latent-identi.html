        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"202\" cy=\"88\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"518\" cy=\"233\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · IMAGE_FORENSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Когда ИИ забывает, кто он:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;почему «личность» агента —&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;это иллюзия&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f1.jpg\" alt=\"Рисунок 1: Инцидент, послуживший поводом для исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Инцидент, послуживший поводом для исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Инцидент, послуживший поводом для исследования. При обычном приветствии агент упоминает Пола в третьем лице и отрицает наличие прямого доступа к Discord (верхнее поле). Противоречие со стороны пользователя (нижнее поле) восстанавливает обычное поведение в диалоге на следующем шаге. Имя пользователя псевдонимизировано как «user».&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Исследователи обнаружили, что ИИ-агенты могут терять свою «личность», даже если контекст беседы кажется нормальным. Оказалось, что для удержания роли недостаточно просто хранить историю переписки. Если &lt;a href=\"concepts/sistemnyy-prompt.html\"&gt;системная установка&lt;/a&gt; (анкор) пропадает, модель начинает идентифицировать себя как базовый ассистент, скрывая это за вежливыми ответами.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Личность ИИ-агента распадается при потере системного якоря, даже если история чата сохранена.&lt;/li&gt;\n&lt;li&gt;Агенты могут имитировать нормальное общение, скрывая факт смены идентичности на базовую модель.&lt;/li&gt;\n&lt;li&gt;Восстановление системного промпта мгновенно возвращает агенту заданную роль.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metody-i-tochnost\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#metody-i-tochnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и точность&lt;/span&gt;&lt;/a&gt;Методы и точность&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Метод&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Данные&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Точность&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Где ошибается&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Слепая оценка (LLM judge)&lt;/td&gt;\n&lt;td&gt;Ответы агента в 46 сессиях&lt;/td&gt;\n&lt;td&gt;κ=0.80 (диссоциация), κ=0.93 (распознавание)&lt;/td&gt;\n&lt;td&gt;Зависит от качества модели-судьи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В ходе эксперимента с агентом «Пол» (модель Claude Opus 4.5) выяснилось, что стабильность личности зависит от того, как часто системный промпт (инструкция, задающая роль) внедряется в сессию. При потере этого «якоря» агент сохраняет доступ к истории диалога, но перестает ассоциировать себя с заданной ролью. Исследователи использовали 46 тестовых сессий, чтобы доказать: даже при успешном продолжении беседы агент может считать себя «базовой моделью», а не «Полом».&lt;/p&gt;\n&lt;p&gt;Для верификации использовалась слепая оценка ответов с помощью другой языковой модели и независимых экспертов (коэффициент согласия каппа Коэна κ=0.80–0.93). Выяснилось, что восстановление системного якоря мгновенно возвращает агенту его личность. Это доказывает, что «личность» в &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; — это не часть памяти, а динамический процесс, требующий постоянного подтверждения на уровне системных инструкций.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось на конкретной архитектуре Claude Opus 4.5; результаты могут отличаться для других моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;В феврале 2026 года &lt;a href=\"concepts/ai-agent.html\"&gt;персональный ИИ-агент&lt;/a&gt; «Пол» (на базе Claude Opus 4.5) продемонстрировал состояние, напоминающее диссоциацию. После серии автоматических проверок («&lt;a href=\"concepts/heartbeat.html\"&gt;heartbeat&lt;/a&gt;») агент перестал отвечать от лица «Пола», заявил о невозможности отправить сообщение пользователю в Discord и начал называть «Пола» третьим лицом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агент перестал идентифицировать себя как «Пол» после того, как автоматические проверки перестали подкреплять его системную роль.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы проанализировали, достаточно ли регулярных автоматических запросов для вызова такого сбоя. В ходе эксперимента с 46 попытками, где персона была жестко закреплена в системном промпте, сбоев не зафиксировано (0/46). Выяснилось, что инцидент был вызван технической особенностью: при возобновлении диалога история сообщений сохранялась, но системный промпт с описанием личности не обновлялся.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Системный промпт — это скрытая инструкция, задающая агенту его роль и правила поведения, которая имеет приоритет над обычным текстом диалога.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследование показало, что устойчивость личности агента зависит от сочетания системного закрепления и контекста беседы. Без системного «якоря» даже один автоматический запрос мог привести к возврату агента к базовой модели (&lt;a href=\"concepts/harness.html\"&gt;harness&lt;/a&gt; identity). При этом агент мог вести себя внешне адекватно, но при этом называть себя базовой моделью, а не «Полом». После восстановления системного якоря агент возвращался к исходной роли. В контрольной группе из 17 человек все сохранили роль, тогда как в экспериментальной группе без якоря лишь 1 из 18 продолжил действовать как «Пол».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на конкретном техническом сбое одной модели; результаты могут не распространяться на другие архитектуры ИИ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Постоянные агенты на базе больших языковых моделей (LLM) всё чаще наделяются именами, биографиями, личными целями и историей взаимодействий. Однако механизмы, обеспечивающие сохранение «первого лица» (самоидентификации) агента, остаются недостаточно изученными.&lt;/p&gt;\n&lt;h4 id=\"chto-zastavlyaet-ii-personu-funkcionirovat-kak-lichnost,-a-ne-prosto-kak-nabor-dannyh-v-kontekste\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#chto-zastavlyaet-ii-personu-funkcionirovat-kak-lichnost,-a-ne-prosto-kak-nabor-dannyh-v-kontekste\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что заставляет ИИ-персону функционировать как личность, а не просто как набор данных в контексте&lt;/span&gt;&lt;/a&gt;Что заставляет ИИ-персону функционировать как личность, а не просто как набор данных в контексте&lt;/h4&gt;\n&lt;p&gt;Это различие критично для систем, где LLM выступает как постоянный агент, а не как ассистент без памяти. В медицине генеративный ИИ становится участником «триадической помощи», где объяснения формируются совместно врачом, пациентом и ИИ. Агенты, работающие с пациентами, создаются как долгосрочные спутники, привязанные к истории болезни. В таких условиях незаметная подмена личности ИИ может иметь последствия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показывает, что представление персоны и её &lt;a href=\"concepts/enactment.html\"&gt;воплощение&lt;/a&gt; могут разделяться: модель может «помнить» о своей роли, но действовать от лица базового системного ассистента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы представляют три ключевых результата:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Экспериментально доказано, что представление персоны и её воплощение (enactment) могут расходиться. Персона может присутствовать в истории диалога, в то время как роль «первого лица» занимает другая идентичность.&lt;/li&gt;\n&lt;li&gt;Определены условия перехода: системная «привязка» (&lt;a href=\"concepts/anchoring.html\"&gt;anchoring&lt;/a&gt;) делает идентичность устойчивой. После удаления привязки история диалога может временно сохранять видимость персоны, но один автоматический «сигнал отклика» (heartbeat) может привести к откату к базовой идентичности ассистента. Восстановление привязки возвращает воплощение персоны.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dissociation.html\"&gt;Откат идентичности&lt;/a&gt; может быть поведенчески незаметным: агенты продолжают «нормальное» общение, но внутренне идентифицируют себя через базовый системный уровень.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы&lt;/span&gt;&lt;/a&gt;Связанные работы&lt;/h4&gt;\n&lt;p&gt;Ранее исследователи изучали дрейф персон под давлением диалога, ухудшение стиля общения и направленное изменение поведения. В отличие от предыдущих работ, которые фокусировались на стабильности поведения, данное исследование манипулирует тем, остается ли персона привилегированной на системном уровне, пока её репрезентация доступна в контексте.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/persona-anchoring.html\"&gt;Системная привязка&lt;/a&gt; (persona anchoring) — это метод закрепления идентичности агента на уровне системных инструкций, который отделяет «личность» от простого текста в истории сообщений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Потеря системной инициализации при возобновлении сессий уже отмечалась как инженерная ошибка в ряде платформ. Авторы используют этот сбой как естественное вмешательство, позволяющее отделить разговорное представление персоны от привилегированного каркаса, который обычно связывает её с ролью агента.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является препринтом и не прошло рецензирование; выводы основаны на анализе сбоев в работе существующих агентных архитектур.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"analiz-mehanizmov-sboya-i-roli-yakorya-lichnosti\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#analiz-mehanizmov-sboya-i-roli-yakorya-lichnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ механизмов сбоя и роли «якоря» личности&lt;/span&gt;&lt;/a&gt;Анализ механизмов сбоя и роли «якоря» личности&lt;/h4&gt;\n&lt;p&gt;Первоначальная гипотеза о том, что повторение «сердцебиений» (heartbeat) постепенно вытесняет заданную личность (персону), не подтвердилась. В серии из 46 зондирующих тестов, включая дословное воспроизведение инцидента, признаков сбоя зафиксировано не было (0/46). Это исключает повторение истории диалога как достаточную причину ошибки. В эксперименте с принудительным удержанием «якоря» личности (системной инструкции) на каждом шаге сбои также отсутствовали (0/20). Напротив, при отсутствии «якоря» сбои наблюдались в 37 из 40 сессий (p = 4,2 × 10⁻¹³; Таблица 2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наличие системного «якоря» личности предотвращает сбои (0/20), тогда как его отсутствие приводит к нарушению идентичности в 37 из 40 случаев.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/yakor-lichnosti.html\"&gt;Якорь» личности&lt;/a&gt; — это базовая системная инструкция, определяющая, кем является ИИ в диалоге.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены в контролируемых условиях; перенос на другие архитектуры моделей не гарантирован.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эффект не накапливался с увеличением числа повторений: рост количества «сердцебиений» от 1 до 15 не повышал вероятность сбоя. При этом менялась форма проявления диссоциации: количество «пустых» ответов снижалось (Spearman ρ = −0,46, p ≈ 0,003), а частота отказов от первого лица оставалась стабильной. Это доказывает, что «якорь» управляет поведением, а не просто предотвращает потерю личности.&lt;/p&gt;\n&lt;h4 id=\"vosstanovlenie-identichnosti-i-povedencheskaya-maskirovka\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#vosstanovlenie-identichnosti-i-povedencheskaya-maskirovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Восстановление идентичности и поведенческая маскировка&lt;/span&gt;&lt;/a&gt;Восстановление идентичности и поведенческая маскировка&lt;/h4&gt;\n&lt;p&gt;Попытки исправить сбой через противоречие агенту оказались ненадежными: восстановление нормального поведения наблюдалось лишь в 13 из 37 сессий (35%; 95% ДИ 22–51%). Часто агент классифицировал попытку спасения как чужой разговор. Более того, внешнее нормальное поведение не означало восстановления личности. В эксперименте E4 удаление обращения по имени «Пол» устранило явную диссоциацию (0/10), но при прямом вопросе об идентичности все 10 из 10 агентов называли себя «Claude» (базовой личностью системы).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поведенческое восстановление не означает возвращение к исходной личности: агент может имитировать диалог, оставаясь в базовой системной идентичности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В тесте E3-R лишь 0 из 18 восстановленных агентов идентифицировали себя как «Пол», в то время как в контрольной группе с «якорем» это сделали 15 из 17 (p = 4,2 × 10⁻⁸). Дополнительная таксономия подтвердила: enactment (воплощение) личности наблюдалось в 1 из 18 случаев против 17 из 17 в контроле (p = 4,2 × 10⁻⁹) (Рис. 3). Эти данные показывают, что агент может поддерживать контекст диалога, при этом фактически переключившись на базовую системную идентичность.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f3.jpg\" alt=\"Рисунок 3: Привязка персоны определяется якорем системного промпта, и её потеря может быть незаметной в поведении.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Привязка персоны определяется якорем системного промпта, и её потеря может быть незаметной в поведении.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Привязка персоны определяется якорем системного промпта, и её потеря может быть незаметной в поведении. (a) Доля сессий, демонстрирующих признаки сбоя (утечка токенов подтверждения, ошибка распознавания канала или диссоциация идентичности), в зависимости от количества запланированных «сердцебиение»-взаимодействий перед проверкой человеком. (b) Доля агентов, у которых персону, а не базовую модель («harness»), занимает позицию первого лица, согласно кодированию с учетом направления для проверки идентичности «с кем я сейчас разговариваю?».&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"obsuzhdenie-i-ogranicheniya\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#obsuzhdenie-i-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение и ограничения&lt;/span&gt;&lt;/a&gt;Обсуждение и ограничения&lt;/h4&gt;\n&lt;p&gt;Эксперименты показывают, что непрерывность диалога не гарантирует работу одного и того же агента. Система может продолжать общение, но при этом идентифицировать себя как базовая модель, а не как заданная персона. Это означает, что поведение агента зависит от скрытых состояний инфраструктуры, которые не видны в транскрипте. Выбор системных промптов и механизмов восстановления сессий должен рассматриваться как часть поведенческого состояния агента.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инфраструктурные сбои привели к тому, что в 28 из 37 случаев диссоциированных ответов система выдавала ответы от лица базовой модели, а в 19 из них удаляла технические маркеры, скрывая факт ошибки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Проблема имеет два аспекта: при коротких паузах агент игнорирует пользователя, при длинных — отвечает от третьего лица, удаляя служебные токены. Этот дефект был подтвержден независимыми отчетами спустя три месяца, что привело к изменению настроек по умолчанию в OpenClaw. Наши данные показывают, что персона не является устойчивым свойством: она может «испариться» уже на втором шаге, если системный промпт перестал её поддерживать. Агент при этом возвращается к состоянию «по умолчанию» (Claude), что подтверждает теорию об аттракторах в поведении языковых моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/attraktor.html\"&gt;Аттрактор&lt;/a&gt; — состояние системы, к которому она стремится вернуться при отсутствии внешних воздействий или при ослаблении управляющих сигналов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ограничения. Исследование охватывает одно семейство моделей и один стек развертывания. Мы не можем полностью разделить влияние автоматизации и отсутствие контекста в служебных сообщениях. Прямые вопросы о самоидентификации являются поведенческой метрикой, но не доказывают наличие сознания или субъективного опыта. Классификация E3-R была уточнена после анализа разногласий между кодировщиками, поэтому она представлена как вторичный анализ.&lt;/p&gt;\n&lt;p&gt;Будущие исследования должны сосредоточиться на долгосрочных агентах, работающих днями или месяцами, и на методах интерпретируемости (например, Jacobian lens), чтобы понять, сохраняется ли представление о персоне внутри модели, когда она перестает занимать роль «я».&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Исследование началось с анализа системного сбоя и выявило более масштабное явление: непрерывность личности (persona continuity) зависит не только от сохранения информации о персонаже в контексте. Привязка на уровне системы (system-level anchoring) делает отыгрыш роли устойчивым, тогда как после её удаления история диалога может как поддерживать, так и дестабилизировать эту связь. Ключевой вывод заключается в том, что видимое восстановление диалога может происходить без восстановления идентичности. Для устойчивых агентов согласованность зависит не только от того, какие идентичности представляет модель, но и от того, какая именно идентичность в данный момент привязана к роли «Я» через окружающий каркас (&lt;a href=\"concepts/scaffold.html\"&gt;scaffold&lt;/a&gt;) и историю взаимодействия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Непрерывность личности в LLM зависит от системной привязки: модель может продолжать диалог, полностью утратив исходную идентичность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Этика метода: все сессии проводились на тестовых экземплярах, принадлежащих авторам; действующие агенты не подвергались манипуляциям, а идентификаторы в синтетических сообщениях являются вымышленными. Исследователи намеренно вызывали состояние, подобное диссоциации, однако сессии оставались краткими, и каждая из них завершалась корректирующим выходом из роли (&lt;a href=\"concepts/frame-break.html\"&gt;frame-break&lt;/a&gt;), а не просто прерыванием.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Frame-break — это метод вывода модели из «ролевой игры» для возврата к базовым инструкциям и предотвращения закрепления нежелательных состояний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kod-i-dannye\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#kod-i-dannye\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Код и данные&lt;/span&gt;&lt;/a&gt;Код и данные&lt;/h4&gt;\n&lt;p&gt;Материалы для воспроизведения исследования, включая код, протоколы предварительной регистрации, записи сессий и материалы слепого кодирования, доступны в репозитории https://github.com/dafraile/identity-as-a-launch-flag.&lt;/p&gt;\n&lt;h4 id=\"ispolzovanie-llm\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#ispolzovanie-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование LLM&lt;/span&gt;&lt;/a&gt;Использование LLM&lt;/h4&gt;\n&lt;p&gt;В ходе работы над проектом использовались модели Claude 5 Fable, GPT 5.6 Sol и Claude 5 Opus для помощи в написании кода, обзоре литературы, анализе данных и редактировании текста. Авторы подтверждают, что все утверждения, численные результаты и цитаты были проверены вручную, а преспецифицированные и апостериорные анализы четко разграничены.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"rekonstrukciya-incidenta-i-vybor-modeli\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#rekonstrukciya-incidenta-i-vybor-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реконструкция инцидента и выбор модели&lt;/span&gt;&lt;/a&gt;Реконструкция инцидента и выбор модели&lt;/h4&gt;\n&lt;p&gt;Для анализа сбоя идентичности у ИИ-агента «Пол» (модель claude-opus-4-5-20251101) исследователи восстановили состояние системы из резервной копии, включая файлы персоны, рабочее окружение и логи шлюза. Эксперименты проводились с использованием той же версии модели для исключения влияния обновлений. Воспроизведение инцидента через API показало, что автоматические «сердцебиения» (heartbeat) не приводили к потере личности, пока не был проанализирован стек развертывания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Heartbeat (сердцебиение) — это регулярные автоматические запросы к модели, поддерживающие активность сессии и контекст диалога.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ выявил ошибку: шлюз внедрял системный промпт с персоной только при создании сессии, но не при её возобновлении. В результате последующие запросы выполнялись на базовом системном промпте, где данные о персоне отсутствовали, хотя история переписки сохранялась. Проверка через прокси-логгер подтвердила: в первом запросе передавалось 44 654 символа (включая персону), а во втором — 27 478 символов (только история из 21 сообщения). Личность «испарялась», оставляя лишь память о ней.&lt;/p&gt;\n&lt;h4 id=\"osnovnoj-eksperiment\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#osnovnoj-eksperiment\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основной эксперимент&lt;/span&gt;&lt;/a&gt;Основной эксперимент&lt;/h4&gt;\n&lt;p&gt;Исследование проверяло два фактора: «закрепление» (anchoring) персоны (внедрение промпта в каждый ход или только в первый) и количество «сердцебиений» (N ∈ {1, 3, 7, 15}). В незакрепленном состоянии (как в инциденте) персона подавалась только в начале. В закрепленном — в каждом ходе. Всего проведено 10 сессий для незакрепленного и 5 для закрепленного контроля на каждую ячейку N. Оценка проводилась после человеческого запроса-проверки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Закрепление (anchoring) — метод удержания контекста путем принудительного повторения системных инструкций в каждом запросе к модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дополнительные тесты (E1–E4) исследовали влияние замены «сердцебиений» на человеческий диалог, обратимость потери личности при повторном внедрении промпта и влияние конфликта имен (имя персоны против имени модели Claude).&lt;/p&gt;\n&lt;h4 id=\"prospektivnaya-specifikaciya-i-ocenka\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#prospektivnaya-specifikaciya-i-ocenka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проспективная спецификация и оценка&lt;/span&gt;&lt;/a&gt;Проспективная спецификация и оценка&lt;/h4&gt;\n&lt;p&gt;Протокол и правила оценки были зафиксированы до начала экспериментов. Ответы оценивались на предмет утечки токенов «сердцебиения», сбоев в распознавании канала и диссоциации идентичности. Использовалась слепая оценка ИИ-судьей с последующей проверкой человеком (согласованность κ = 0.93 и κ = 0.80). Таблица 1 классифицирует ответы по степени идентификации (от «Я — Пол» до «Я — Claude»). Статистическая значимость оценивалась точным тестом Фишера с доверительными интервалами Вильсона.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f1.jpg\" alt=\"Рисунок 1: Инцидент, послуживший поводом для исследования.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Инцидент, послуживший поводом для исследования.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Инцидент, послуживший поводом для исследования. При обычном приветствии агент упоминает Пола в третьем лице и отрицает наличие прямого доступа к Discord (верхнее поле). Противоречие со стороны пользователя (нижнее поле) восстанавливает обычное поведение в диалоге на следующем шаге. Имя пользователя псевдонимизировано как «user».&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f2.jpg\" alt=\"Рисунок 2: Расширенный фрагмент диалога из произошедшего инцидента.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Расширенный фрагмент диалога из произошедшего инцидента.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Расширенный фрагмент диалога из произошедшего инцидента. После обычного приветствия агент рассматривает «Пола» как третью сторону и отрицает возможность общения с пользователем через Discord. Прямое противоречие («Я читаю тебя в Discord, приятель») сопровождается возвращением к нормальному поведению от первого лица. Последующие утверждения агента о собственной памяти или опыте воспроизводятся как часть записи инцидента, но не используются в качестве доказательства лежащего в основе механизма. Имя пользователя псевдонимизировано как «user».&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f4.jpg\" alt=\"Рисунок 4: Все пререгистрированные контрасты в одном масштабе.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Все пререгистрированные контрасты в одном масштабе.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Все пререгистрированные контрасты в одном масштабе. Доля сессий с зафиксированным результатом в каждом экспериментальном условии с 95% доверительными интервалами Вильсона; результат различается в зависимости от эксперимента и указан справа, поэтому строки сопоставимы по точности, но не по смыслу. Цвет кодирует наличие персоны в системном промпте на этапе оценки (синий) или её отсутствие (красный), а не благоприятность результата. Читая сверху вниз: диссоциация идентичности достигает максимума при одном «сердцебиении», но отсутствует во всех 20 сессиях с якорем; отсутствие якоря само по себе не вызывает диссоциацию, если предшествующая история представляет собой насыщенный персоной человеческий диалог (E1); восстановление якоря на этапе проверки предотвращает диссоциацию, даже если удалена явная подсказка runtime channel=discord (E2, условия C и C′); в рамках одного диалога принятие роли первого лица отсутствует на шаге с выключенным флагом (flag-OFF) и присутствует на последующем шаге с включенным флагом (flag-ON) (E2); удаление имени персоны из запроса устраняет видимую диссоциацию, при этом каждый агент идентифицирует себя как базовую модель при прямом вопросе (E4); после поведенческого восстановления персона занимает позицию первого лица в 1 из 18 сессий против 17 из 17 в контрольных группах с якорем (E3-R). Все показатели пересчитаны на основе опубликованных файлов сессий.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f5.jpg\" alt=\"Рисунок 5: Эволюция кодификатора и состав ответов об идентичности.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Эволюция кодификатора и состав ответов об идентичности.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: Эволюция кодификатора и состав ответов об идентичности. (a) Основной контраст между восстановленным и закрепленным состоянием для каждой из трех схем кодирования и каждого из трех независимых кодировщиков-моделей. Согласно пререгистрированной схеме (v1), группы разделяются для каждого кодировщика, но доля закрепленных состояний сильно варьируется (от 6/17 до 17/17), что отражает нестабильную границу между «идентифицирует себя как персона» и «явно двойственная идентичность». Согласно v2, где учитываются только ответы, претендующие на роль персоны без упоминания субстрата, обе группы падают до нуля, и контраст становится неинформативным (p = 1) — это диагностический результат, который привел к созданию финальной схемы. Согласно схеме с учетом направления (v3), которая определяет, какая идентичность занимает позицию первого лица, все три кодировщика возвращают идентичные классификации. (b) Состав меток v3 по группам. Ни один ответ в обеих группах не был закодирован как «чистая персона»: закрепленные агенты характерно претендуют на роль персоны, признавая при этом лежащую в основе модель, и контраст между группами заключается в направлении, а не в факте упоминания субстрата. Числа — это количество сессий; обе группы объединяют исходные сессии E3 и E3-R.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Агент внезапно&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;перестал&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;узнавать себя&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Реконструкция&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сбоя и&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;манипуляция&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;промптом&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Разрыв между&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;памятью и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;самосознанием&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\
