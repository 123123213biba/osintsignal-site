        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Научное направление: методы и этика открытых данных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;Развитие с 1997 года (алгоритмы поиска), 2008 (сетевой анализ), 2015 (глубокое обучение)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;Эмпирическая верификация, сетевой анализ, предиктивный анализ (SSH), бенчмаркинг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Nucleic Acids Research, BMC Bioinformatics, Nature (обзоры)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-methods.html\"&gt;Методы и этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;Методы и этика — это междисциплинарное научное направление, исследующее принципы сбора, обработки и интерпретации открытых данных, а также моральные нормы, регулирующие поведение автоматизированных систем и исследователей. Предметом изучения являются процессы верификации информации, воспроизводимость результатов анализа и этические аспекты взаимодействия человека с нейросетевыми агентами.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Развитие направления связано с переходом от ручного анализа к автоматизированным пайплайнам. В 1997 году появление алгоритмов поиска в базах данных (например, PSI-BLAST) заложило основы для работы с большими массивами информации. В 2008 году развитие методов сетевого анализа (WGCNA) позволило выявлять скрытые корреляции в сложных системах. С 2015 года, благодаря успехам глубокого обучения (Deep Learning), фокус сместился на проверку «черных ящиков» нейросетей, выявление их склонности к галлюцинациям и оценку реальных способностей через специализированные бенчмарки, такие как KaliBench.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;В области выделяют два ключевых подхода: эмпирический и нормативный. Эмпирический подход опирается на воспроизводимость: если результат нельзя получить повторно при тех же условиях, он считается недостоверным. Нормативный подход, опираясь на классическую этику, исследует моральные принципы, лежащие в основе принятия решений ИИ. Современные исследования показывают, что «точность» модели часто является иллюзией, зависящей от формулировки запроса, а не от интеллекта системы.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Исследователи используют алгоритмы на базе языковых моделей для структурирования хаотичных данных. Для проверки ИИ применяются детекторы лжи, которые, однако, часто ошибаются, принимая ролевую игру за реальные намерения. Метод SSH (предиктивный анализ атак) позволяет просчитывать действия ИИ-агентов наперед. Ключевым инструментом обеспечения качества является замена стандартных агентных каркасов на специализированные, что повышает эффективность компактных моделей (2-9B параметров).&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;Направление тесно связано с «Инструментами и пайплайнами», обеспечивающими техническую базу исследований. «Датасеты и бенчмарки» служат мерилом точности, а «Краудсорсинг и разметка» предоставляют данные для обучения. «Этика и приватность» задают границы допустимого при работе с открытыми данными, предотвращая вред частным лицам.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Для погружения в тему рекомендуется изучать академические курсы по анализу данных, методологии научных исследований и прикладной этике. Базовые знания можно получить в рамках программ по Data Science, специализирующихся на проверке фактов (fact-checking) и кибербезопасности. Рекомендуется следить за публикациями в рецензируемых журналах по биоинформатике, компьютерным наукам и философии технологий.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AD%D1%82%D0%B8%D0%BA%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Этика — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — обзор, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — обзор, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — обзор, Nature 2015&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Инструменты, датасеты, воспроизводимость и этика исследований открытых данных."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Методы и этика","description":"Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.","vcsPath":"reference/disciplines/dir-methods.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-methods.html#chto-izuchaet","level":2},{"title":"История и ключевые открытия","href":"reference/disciplines/dir-methods.html#istoriya-i-klyuchevye-otkrytiya","level":2},{"title":"Основные школы и подходы","href":"reference/disciplines/dir-methods.html#osnovnye-shkoly-i-podhody","level":2},{"title":"Методы и инструменты","href":"reference/disciplines/dir-methods.html#metody-i-instrumenty","level":2},{"title":"Связи с другими направлениями","href":"reference/disciplines/dir-methods.html#svyazi-s-drugimi-napravleniyami","level":2},{"title":"Где учиться и что читать","href":"reference/disciplines/dir-methods.html#gde-uchitsya-i-chto-chitat","level":2},{"title":"Источники","href":"reference/disciplines/dir-methods.html#istochniki","level":2}],"title":"Методы и этика"},"router":{"pathname":"reference/disciplines/dir-methods","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
