            {"data":{"leading":false,"html":"&lt;p&gt;17 концепций&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/stability-generalization-score.html\"&gt;SGS&lt;/a&gt; — Метрика, используемая для измерения степени отклонения поведения модели от идеального условия инвариантности ответов при вариациях ввода.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/geometric-accuracy.html\"&gt;Геометрическая точность&lt;/a&gt; — Показатель качества реконструкции, оцениваемый через среднюю абсолютную ошибку глубины (MAE) и корректность расположения объектов в…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/two-hop.html\"&gt;Два прыжка&lt;/a&gt; — Радиус в графе подписок, определяющий дистанцию до автора контента, равную двум связям от пользователя.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attention-path-length.html\"&gt;Длина пути внимания&lt;/a&gt; — Метрика, измеряющая расстояние в графе подписок между пользователем и автором контента, с которым он взаимодействует.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conversion.html\"&gt;Конверсия&lt;/a&gt; — Показатель перехода от взаимодействия с контентом автора к оформлению подписки на него в течение определенного времени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/capture-coefficient.html\"&gt;коэффициент захвата&lt;/a&gt; — Метрика силы самоподкрепления источника, вычисляемая как разность вероятностей его цитирования при наличии или отсутствии цитирования на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/macro-accuracy.html\"&gt;Макро-точность&lt;/a&gt; — Метрика оценки качества модели, при которой каждой задаче присваивается равный вес независимо от количества вопросов в ней.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soft-metrics.html\"&gt;Мягкие метрики&lt;/a&gt; — Показатели производительности или уверенности модели, которые суммируются для оценки риска, но не являются достаточным основанием для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/compounding-ratio.html\"&gt;отношение компаундирования&lt;/a&gt; — Показатель, отражающий отношение реального влияния GEO на дистанции к результатам одноходовой оценки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mahalanobis-distance.html\"&gt;Расстояние Махаланобиса&lt;/a&gt; — Прокси-метрика, используемая для оценки того, что внесенные в изображения изменения не выходят за рамки распределения реальных данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cumulative-conversational-visibility.html\"&gt;совокупная видимость в диалоге&lt;/a&gt; — Метрика для расчета общей значимости источника за все шаги диалога с учетом весовых коэффициентов внимания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/selection-regret.html\"&gt;Сожаление при выборе&lt;/a&gt; — Показатель эффективности модели, представляющий разницу между рейтингом лучшего доступного изображения и рейтингом изображения, выбранного…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Средняя абсолютная ошибка (MAE) — это метрика качества прогнозирования, отражающая среднее значение отклонений между предсказанными и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-execution-accuracy.html\"&gt;Точность выполнения команд&lt;/a&gt; — Показатель качества работы модели, оцениваемый покомпонентно: выбор инструмента, корректность опциональных флагов и позиционных аргументов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attack-success-rate.html\"&gt;Уровень успешности атак&lt;/a&gt; — Метрика эффективности защиты, отражающая долю успешно реализованных атак на систему.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fail-rate.html\"&gt;Частота неудач&lt;/a&gt; — Основная метрика оценки в тестировании, отражающая долю сценариев, в которых ответы модели получили оценку 2 балла и выше.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensitivity.html\"&gt;Чувствительность&lt;/a&gt; — Показатель способности различать сигнал и шум, варьирующийся от 0 до 1.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5
