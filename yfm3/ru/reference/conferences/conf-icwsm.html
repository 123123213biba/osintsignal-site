        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;AAAI: веб и социальные медиа — сети и дезинформация&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-icwsm.jpg\" alt=\"ICWSM\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;AAAI: веб и социальные медиа — сети и дезинформация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;статьи в открытом доступе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;AAAI (Association for the Advancement of Artificial Intelligence)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научная конференция с рецензируемыми публикациями&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальный сайт AAAI&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Методы и этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;ICWSM (International Conference on Web and Social Media) — это ежегодная научная конференция, посвященная изучению социальных медиа и веб-технологий через призму анализа данных, сетевой науки и компьютерных наук. Конференция является площадкой для обмена методами, которые позволяют количественно оценивать социальные процессы, выявлять закономерности в распространении информации и проверять достоверность данных в цифровой среде.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конференция проводится под эгидой AAAI (Association for the Advancement of Artificial Intelligence). Это международное научное сообщество, которое устанавливает стандарты исследований в области искусственного интеллекта. ICWSM была создана для объединения специалистов из разных дисциплин: социологов, компьютерных лингвистов и аналитиков данных, чтобы сформировать методологическую базу для изучения онлайн-сообществ.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа конференции охватывает широкий спектр направлений:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Анализ социальных сетей: изучение структуры связей и динамики многослойных сетей.&lt;/li&gt;\n&lt;li&gt;Дезинформация и проверка фактов: разработка алгоритмов для выявления искажений в данных и анализа влияния социальных платформ на восприятие реальности.&lt;/li&gt;\n&lt;li&gt;Методология сбора данных: создание инструментов для извлечения структурированной информации из неструктурированных постов.&lt;/li&gt;\n&lt;li&gt;Этика и предвзятость: исследование этических границ при работе с данными пользователей и минимизация методологических ошибок.&lt;/li&gt;\n&lt;li&gt;Искусственный интеллект в медиа: оценка работы нейросетей, включая вопросы их «ролевой игры» и скрытой дезинформации в ответах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На ICWSM впервые представляются результаты исследований, которые меняют подход к анализу данных. В последние годы фокус сместился на:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Эффективность нейросетевых архитектур: методы оптимизации памяти (например, слой Galahad) и специализированные агентные каркасы для компактных моделей.&lt;/li&gt;\n&lt;li&gt;Автоматизацию OSINT: алгоритмы, способные строить базы данных из хаотичных сетевых источников с точностью, сопоставимой с человеческой.&lt;/li&gt;\n&lt;li&gt;Кибербезопасность: новые семейства моделей, такие как SecJev, для анализа трафика и политик безопасности.&lt;/li&gt;\n&lt;li&gt;Критическую оценку влияния соцсетей: научные данные, опровергающие мифы о тотальном искажении реальности через платформы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Материалы конференции публикуются в открытом доступе. Для исследователей и практиков доступны:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тезисы и полные тексты статей: все принятые работы проходят строгое рецензирование и публикуются в архивах AAAI.&lt;/li&gt;\n&lt;li&gt;Записи докладов: позволяют ознакомиться с методологией авторов.&lt;/li&gt;\n&lt;li&gt;Участие: конференция открыта для подачи заявок на публикацию оригинальных исследований, соответствующих стандартам научной строгости и этики данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A0%D0%98%D0%90_%D0%9D%D0%BE%D0%B2%D0%BE%D1%81%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;РИА Новости — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Archive.today_Screenshot_-_12.19.2024.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Archive.today developers, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.physrep.2014.07.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The structure and dynamics of multilayer networks&lt;/a&gt; — обзор, Phys Rep 2014&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fdata.2019.00013\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Social Data: Biases, Methodological Pitfalls, and Ethical Boundaries&lt;/a&gt; — обзор, Front Big Data 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/s22124531\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Review on the Trends in Event Detection by Analyzing Social Media Platforms' Data&lt;/a&gt; — обзор, Sensors (Basel) 2022&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"AAAI: веб и социальные медиа — сети и дезинформация"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ICWSM","description":"AAAI: веб и социальные медиа — сети и дезинформация","vcsPath":"reference/conferences/conf-icwsm.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-icwsm.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-icwsm.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conf
