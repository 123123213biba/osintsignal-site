        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;вычислительные методы в журналистике&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;вычислительные методы в журналистике&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;статьи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;Междисциплинарное сообщество специалистов в области компьютерных наук и журналистики.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Ежегодное мероприятие (на основе академической практики).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научный симпозиум с докладами, публикацией тезисов и записей выступлений.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальные ресурсы организаторов (уточняются в зависимости от года проведения).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Методы и этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;Computation + Journalism Symposium — это научная конференция, посвященная применению вычислительных методов в журналистской деятельности. Под вычислительными методами понимается использование алгоритмов, искусственного интеллекта и анализа данных для сбора, организации, осмысления и распространения новостной информации. Основная цель мероприятия — объединить специалистов в области компьютерных наук и профессиональных журналистов для решения задач по проверке фактов, анализу больших массивов данных и обеспечению точности публикаций.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конференция является междисциплинарной площадкой, где пересекаются информатика, социальные науки и журналистика. Организаторы ставят задачу укрепить ценности журналистики — точность и проверяемость — с помощью современных инструментов анализа контента, визуализации и систем рекомендаций.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа симпозиума охватывает широкий спектр тем, связанных с автоматизацией журналистского труда:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Анализ данных и автоматизированный сбор информации: методы извлечения скрытых параметров из неструктурированных текстов и построение баз данных.&lt;/li&gt;\n&lt;li&gt;Проверка фактов и детекция манипуляций: исследование алгоритмов, выявляющих ложь в ответах нейросетей, и анализ проблем «ролевой игры» ИИ.&lt;/li&gt;\n&lt;li&gt;Устойчивость и безопасность ИИ-агентов: разработка методов защиты от атак на модели и оценка реальных способностей систем через специализированные каркасы, а не стандартные бенчмарки.&lt;/li&gt;\n&lt;li&gt;Этика и прозрачность: изучение того, как изменение отчетности (например, удаление ключевых слов из заявок) влияет на видимость научных исследований и общественную статистику.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На симпозиуме впервые представляются результаты исследований, касающихся эффективности компактных языковых моделей (2-9B) и их способности к рассуждению. Участники обсуждают, почему стандартные тесты часто переоценивают возможности ИИ и как «обвязка» (агентный каркас) влияет на результат работы модели. Также презентуются новые методы защиты ИИ-агентов, такие как алгоритмы, просчитывающие опасные ходы наперед.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Следить за результатами конференции можно через публикацию тезисов и записей выступлений, которые обычно выкладываются в открытый доступ. Участие предполагает представление докладов, основанных на строгой методологии, что позволяет сообществу проверять выводы авторов. Конференция ориентирована на тех, кто хочет понять, как вычислительные методы помогают бороться с искажением информации и повышать качество медиаконтента.&lt;/p&gt;\n&lt;p&gt;Теоретическая база симпозиума опирается на принципы вычислительной журналистики, где каждый этап — от сбора данных до публикации — должен быть воспроизводимым и прозрачным. Это позволяет исследователям и журналистам совместно работать над верификацией данных, опираясь на методы, которые можно проверить самостоятельно.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Computational_journalism\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Computational journalism — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"вычислительные методы в журналистике"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Computation + Journalism Symposium","description":"вычислительные методы в журналистике","vcsPath":"reference/conferences/conf-cj_symposium.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-cj_symposium.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-cj_symposium.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-cj_symposium.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-cj_symposium.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-cj_symposium.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-cj_symposium.html#istochniki","level":2}],"title":"Computation + Journalism Symposium"},"router":{"pathname":"reference/conferences/conf-cj_symposium","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
