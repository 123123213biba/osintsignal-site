        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;доверие и дезинформация&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-tto.jpg\" alt=\"Truth and Trust Online\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;доверие и дезинформация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;статьи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;Академиялық қоғамдастық және сарапшылар тобы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Жыл сайын&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Ғылыми конференция, баяндамалар мен секциялар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;truthandtrustonline.com&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt;, &lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;Truth and Trust Online (TTO) — это ежегодная научная конференция, посвященная изучению проблем дезинформации, доверия к цифровому контенту и безопасности онлайн-среды. Мероприятие объединяет исследователей, инженеров и специалистов по проверке фактов для обсуждения методов борьбы с манипуляциями в интернете. Концепция конференции строится на междисциплинарном подходе, где технические решения (например, инструменты для отслеживания эволюции идей или фреймворки для проверки инфографики) сочетаются с анализом социальных процессов.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конференция была создана как площадка для обмена знаниями между академическим сообществом и практиками, работающими над вопросами достоверности информации. Организаторы стремятся создать пространство, где обсуждаются не только алгоритмические сбои нейросетей, но и реальное влияние социальных сетей на восприятие реальности. История конференции отражает развитие методов борьбы с цифровыми искажениями: от анализа простых фейков до изучения сложных механизмов «галлюцинаций» ИИ.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Основные темы конференции охватывают широкий спектр вопросов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Механика работы нейросетей: анализ разрыва между обучением моделей и их поведением в свободном режиме, а также изучение «личности» ИИ-агентов.&lt;/li&gt;\n&lt;li&gt;Проверка фактов и визуальные данные: разработка инструментов, таких как InfoAgent, для создания проверяемой инфографики и борьба с предвзятостью алгоритмов при выборе контента.&lt;/li&gt;\n&lt;li&gt;Эволюция идей: использование методов анализа данных для отслеживания трендов в научной литературе с помощью инструментов типа Drift Inspector.&lt;/li&gt;\n&lt;li&gt;Управление ИИ: дискуссии о мифе глобального архитектора правил и поиске децентрализованных подходов к регулированию технологий.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На конференции регулярно представляются результаты исследований, которые меняют представление о цифровой безопасности. Участники демонстрируют новые фреймворки, позволяющие связывать элементы контента с проверяемыми данными, и методы анализа, которые помогают понять, почему нейросети пишут предсказуемые тексты или почему визуальные модели становятся уязвимыми. Эти работы помогают отделить реальные угрозы от мифов, например, о преувеличенном влиянии соцсетей на искажение реальности.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Следить за результатами конференции можно через публикацию тезисов докладов и записей выступлений, которые обычно становятся доступны после завершения мероприятия. Участие предполагает подачу заявок на выступления с результатами исследований или посещение секций в качестве слушателя. Конференция открыта для специалистов, занимающихся проверкой фактов, разработкой ИИ и анализом информационных сетей.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A8%D0%B2%D0%B8%D0%BC%D0%BC%D0%B5%D1%80%2C_%D0%94%D1%8D%D0%B2%D0%B8%D0%B4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Швиммер, Дэвид — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:David_Schwimmer_2011.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Philippe Berdalle, CC BY-SA 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"доверие и дезинформация"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Truth and Trust Online","description":"доверие и дезинформация","vcsPath":"reference/conferences/conf-tto.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-tto.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-tto.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-tto.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-tto.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-tto.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-tto.html#istochniki","level":2}],"title":"Truth and Trust Online"},"router":{"pathname":"reference/conferences/conf-tto","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
