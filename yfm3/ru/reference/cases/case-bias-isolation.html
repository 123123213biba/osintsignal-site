        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кейсы: инструменты и методы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Этап и модуль архитектуры COBICount, предназначенный для подавления откликов от повторяющихся фоновых структур и шумов (сетки дорог, парковок).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/cases/case-bias-isolation.jpg\" alt=\"подавление фона\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Инструмент&lt;/td&gt;\n&lt;td&gt;Модуль подавления фона в архитектуре COBICount&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Задача&lt;/td&gt;\n&lt;td&gt;Устранение ложных откликов от повторяющихся фоновых структур&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Данные&lt;/td&gt;\n&lt;td&gt;Спутниковые снимки высокого разрешения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Результат&lt;/td&gt;\n&lt;td&gt;Повышение точности подсчета объектов без дообучения нейросети&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/bias-isolation.html\"&gt;подавление фона&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"zadacha\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#zadacha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Задача&lt;/span&gt;&lt;/a&gt;Задача&lt;/h2&gt;\n&lt;p&gt;При анализе спутниковых снимков для подсчета объектов (например, кораблей или зданий) исследователи сталкиваются с проблемой «шума». Повторяющиеся структуры, такие как дорожные сетки, парковки или регулярная застройка, создают ложные отклики в нейронных сетях. Эти фоновые элементы по своим визуальным характеристикам часто напоминают целевые объекты, что снижает точность автоматического подсчета.&lt;/p&gt;\n&lt;h2 id=\"instrument-ili-metod\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#instrument-ili-metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструмент или метод&lt;/span&gt;&lt;/a&gt;Инструмент или метод&lt;/h2&gt;\n&lt;p&gt;Подавление фона (background suppression) — это процесс фильтрации или ослабления сигналов от статических, повторяющихся элементов ландшафта на изображении. В архитектуре COBICount данный метод является этапом обработки, который отделяет значимые объекты от регулярного фона до того, как модель приступит к их классификации или подсчету.&lt;/p&gt;\n&lt;h2 id=\"kak-primenili\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#kak-primenili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как применили&lt;/span&gt;&lt;/a&gt;Как применили&lt;/h2&gt;\n&lt;p&gt;В рамках исследования по подсчету объектов без дообучения нейросетей, метод подавления фона был внедрен как модуль архитектуры COBICount. Основная идея заключается в том, чтобы исключить необходимость переобучения модели под каждый новый регион. Вместо этого система анализирует статистические свойства изображения, выявляет повторяющиеся паттерны, которые не являются целевыми объектами, и подавляет их влияние на итоговый результат. Это позволяет модели фокусироваться на уникальных или целевых объектах, игнорируя «шум» городской инфраструктуры.&lt;/p&gt;\n&lt;h2 id=\"chto-poluchilos\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#chto-poluchilos\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что получилось&lt;/span&gt;&lt;/a&gt;Что получилось&lt;/h2&gt;\n&lt;p&gt;Применение модуля подавления фона позволило повысить точность обнаружения объектов в новых регионах без проведения дорогостоящего дообучения нейросети. Система демонстрирует способность сохранять стабильные показатели подсчета даже при смене географических локаций с разной плотностью застройки, так как фоновые структуры эффективно нивелируются на этапе предобработки.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;p&gt;Метод подавления фона эффективен для регулярных структур, однако его точность может снижаться при работе с объектами, которые визуально почти идентичны фону или частично перекрыты им. Также метод требует достаточного разрешения снимка для корректного выделения паттернов фона. Если фоновые структуры не имеют выраженной повторяемости, эффективность подавления может быть ограничена.&lt;/p&gt;\n&lt;h2 id=\"kak-povtorit\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#kak-povtorit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как повторить&lt;/span&gt;&lt;/a&gt;Как повторить&lt;/h2&gt;\n&lt;p&gt;Для реализации метода необходимо использовать архитектуру COBICount. Потребуется набор спутниковых снимков высокого разрешения и вычислительные мощности для обработки изображений. Процесс включает: 1) загрузку снимка, 2) анализ статистических признаков для идентификации фоновых паттернов, 3) применение фильтра подавления фона, 4) запуск алгоритма подсчета объектов. Исходный код и описание архитектуры доступны в репозиториях, связанных с исследованиями COBICount.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D0%B9%D1%82%D1%80%D0%B8%D0%BD%D0%BE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нейтрино — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:FirstNeutrinoEventAnnotated.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Argonne National Laboratory, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.4161/bact.1.2.15845\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phage treatment of human infections&lt;/a&gt; — обзор, Bacteriophage 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/23259671221104409\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Umbilical Cord-Derived Stem Cells for the Treatment of Knee Osteoarthritis: A Systematic Review&lt;/a&gt; — обзор, Orthop J Sports Med 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/microorganisms11041040\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Overcoming the Limitations of CRISPR-Cas9 Systems in &lt;i&gt;Saccharomyces cerevisiae&lt;/i&gt;: Off-Target Effects, Epigenome, and Mitochondrial Editing&lt;/a&gt; — обзор, Microorganisms 2023&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Кейсы: инструменты и методы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Этап и модуль архитектуры COBICount, предназначенный для подавления откликов от повторяющихся фоновых структур и шумов (сетки дорог, парковок)."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"подавление фона","description":"Этап и модуль архитектуры COBICount, предназначенный для подавления откликов от повторяющихся фоновых структур и шумов (сетки дорог, парковок).","vcsPath":"reference/cases/case-bias-isolation.md"},"headings":[{"title":"Задача","href":"reference/cases/case-bias-isolation.html#zadacha","level":2},{"title":"Инструмент или метод","href":"reference/cases/case-bias-isolation.html#instrument-ili-metod","level":2},{"title":"Как применили","href":"reference/cases/case-bias-isolation.html#kak-primenili","level":2},{"title":"Что получилось","href":"reference/cases/case-bias-isolation.html#chto-poluchilos","level":2},{"title":"Ограничения","href":"reference/cases/case-bias-isolation.html#ogranicheniya","level":2},{"title":"Как повторить","href":"reference/cases/case-bias-isolation.html#kak-povtorit","level":2},{"title":"Источники","href":"reference/cases/case-bias-isolation.html#istochniki","level":2}],"title":"подавление фона"},"router":{"pathname":"reference/cases/case-bias-isolation","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
