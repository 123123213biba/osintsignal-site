        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;29 концепций&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/blaise.html\"&gt;Blaise&lt;/a&gt; — Компонент системы Galahad, индексирующий документы и передающий модели только релевантные фрагменты текста.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-writer.html\"&gt;Community Writer&lt;/a&gt; — Крупнейший клиент AI API, использующий комбинацию дообученных и коммерческих моделей для генерации и приоритизации контекстных заметок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drift-inspector.html\"&gt;Drift Inspector&lt;/a&gt; — Система с открытым исходным кодом для анализа эволюции научных областей путем извлечения и кластеризации атомарных утверждений о вкладе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; — Фильтр качества данных, который, согласно исследованию, ошибочно отдает предпочтение сгенерированному ИИ-контенту.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/galahad.html\"&gt;Galahad&lt;/a&gt; — Система, сохраняющая состояние внимания и фрагменты текста для ускорения работы больших языковых моделей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/igenbench.html\"&gt;IGenBench&lt;/a&gt; — Набор данных и бенчмарк, используемый для оценки точности фактов и точности генерируемой инфографики.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infoagent.html\"&gt;InfoAgent&lt;/a&gt; — Фреймворк для синтеза визуально-символических программ, который связывает элементы инфографики с источниками данных через граф зависимостей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infographicbench-evidence.html\"&gt;InfoGraphicBench-Evidence&lt;/a&gt; — Бенчмарк из 260 запросов, предназначенный для оценки надежности и точности генерации инфографики на основе проверяемых доказательств.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kalibench.html\"&gt;KaliBench&lt;/a&gt; — Специализированный бенчмарк и набор данных для оценки перевода запросов на естественном языке в команды CLI инструментов Kali Linux.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/litereality-agent.html\"&gt;LiteReality-Agent&lt;/a&gt; — Агентная система, преобразующая RGB-D сканы помещений в интерактивные 3D-сцены через написание исполняемого Python-кода.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mingbird.html\"&gt;Mingbird&lt;/a&gt; — Локальный агентный фреймворк для Windows и Ollama, включающий механизмы защиты от типичных ошибок малых языковых моделей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt; — Программная среда для физического моделирования, в которую экспортируются готовые 3D-сцены для симуляции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nih-exporter.html\"&gt;NIH ExPORTER&lt;/a&gt; — База данных, содержащая сведения о названиях, аннотациях и бюджетах грантов, предоставляемых Национальными институтами здоровья США.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/room-py.html\"&gt;Room.py&lt;/a&gt; — Исполняемый Python-файл, описывающий геометрию, физические свойства и пространственные связи объектов в 3D-сцене.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/s-pubmedbert.html\"&gt;S-PubMedBERT&lt;/a&gt; — Модель для векторизации медицинских текстов, используемая для обеспечения точности сопоставления фактов с базой знаний.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secjev.html\"&gt;SecJev&lt;/a&gt; — Семейство специализированных моделей для принятия решений в кибербезопасности, использующих однопроходный скорер кандидатов вместо…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/taliesin.html\"&gt;Taliesin&lt;/a&gt; — Компонент системы Galahad, отвечающий за сохранение и загрузку KV-состояния для блоков текста.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vida-geo.html\"&gt;VIDA-GEO&lt;/a&gt; — Мультиагентная система, использующая спутниковые и уличные снимки для генерации реалистичных визуальных правок городской инфраструктуры с…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/visual-harness-for-reasoning.html\"&gt;VISTA&lt;/a&gt; — Система-надстройка для мультимодальных моделей, обеспечивающая долгосрочную визуальную память без потерь для планирования действий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/automatic-annotator.html\"&gt;Автоматический аннотатор&lt;/a&gt; — Программный инструмент на базе LLM, который сегментирует научный текст и классифицирует его части согласно риторическим шагам модели CARS.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reconstruction-agent.html\"&gt;Агент реконструкции&lt;/a&gt; — Компонент системы, который создает и проверяет медиаданные на основе защищенной записи для обеспечения совместимости с интерфейсом…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/large-language-models-llm.html\"&gt;Большие языковые модели&lt;/a&gt; — Системы искусственного интеллекта, используемые в работе для генерации научных текстов и анализа их структуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-number-generator.html\"&gt;Внешний генератор случайных чисел&lt;/a&gt; — Внешний инструмент генерации случайности, применяемый для выбора одного варианта из предложенных моделью опций при планировании ответов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dataset.html\"&gt;Датасет&lt;/a&gt; — Совокупность пар вопрос-ответ, используемая для обучения и тестирования детекторов лжи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/distilled-model.html\"&gt;Дистиллированная модель&lt;/a&gt; — Локальная нейросеть с уменьшенным количеством параметров, используемая для переписывания сущностей и тем в запросах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/density-map.html\"&gt;карта плотности&lt;/a&gt; — Пространственное распределение предсказываемых нейросетью значений пикселей, сумма которых соответствует общему числу искомых объектов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/audit-module.html\"&gt;модуль Audit&lt;/a&gt; — Вспомогательный блок визуального контроля в COBICount, преобразующий внутренние признаки сети в каналы классов без влияния на расчет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodal-large-language-models-mllm.html\"&gt;Мультимодальные языковые модели&lt;/a&gt; — Инструмент для интерпретации текстовых инструкций и их связи с визуальными данными из истории событий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/figs-framework.html\"&gt;Фреймворк FIGS&lt;/a&gt; — Система оценки языковых моделей, использующая 10-шаговый симулятор для проверки баланса между фактологической точностью и эмпатией.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"29 концепций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Инструменты","description":"29 концепций","vcsPath":"reference/tools.md"},"headings":[],"title":"Инструменты"},"router":{"pathname":"reference/tools","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
