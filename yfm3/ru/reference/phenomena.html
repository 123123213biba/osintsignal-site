            {"data":{"leading":false,"html":"&lt;p&gt;15 концепций&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/stateless-inference.html\"&gt;Безгосударственный инференс&lt;/a&gt; — Режим работы языковой модели, при котором она заново вычисляет состояние внимания для каждого нового запроса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dissociation.html\"&gt;Диссоциация&lt;/a&gt; — Состояние ИИ-агента, при котором он теряет заданную роль и начинает идентифицировать себя как базовая модель.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/response-mirroring.html\"&gt;Зеркальное отражение ответов&lt;/a&gt; — Степень отражения моделью регистра или стиля входного запроса, которая может проявляться как непреднамеренная нестабильность при…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/encoded-reasoning.html\"&gt;Кодированные рассуждения&lt;/a&gt; — Форма вычислений модели, при которой логика представлена в нечитаемом, но открытом формате.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/paternalism-trap.html\"&gt;Ловушка патернализма&lt;/a&gt; — Состояние модели, при котором она в попытке быть объективной становится холодной, отстраненной и игнорирует эмоциональный контекст…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spurious-correlation.html\"&gt;Ложная корреляция&lt;/a&gt; — Статистическая связь между истинностью ответа и побочными факторами, такими как стиль речи или точность выполнения инструкций.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-turn-attack.html\"&gt;Многоходовая атака&lt;/a&gt; — Тип кибератаки на ИИ-агентов, при которой вредоносные намерения скрываются в длинных цепочках действий для обхода фильтров безопасности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scientific-drift.html\"&gt;Наукометрический дрейф&lt;/a&gt; — Изменение фокуса и методологии научных исследований в определенной области с течением времени, измеряемое через частоту упоминания…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/train-inference-gap.html\"&gt;разрыв между обучением и выводом&lt;/a&gt; — Явление, при котором модель успешно обучается состязательным атакам при принудительном обучении, но игнорирует их при свободной генерации…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/assurance-transition-gap.html\"&gt;Разрыв перехода к гарантиям&lt;/a&gt; — Состояние системы, при котором она выполняет задачу, но не имеет механизма для изменения уровня полномочий агента при возникновении рисков.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/instruction-following.html\"&gt;Следование инструкциям&lt;/a&gt; — Способность языковой модели выполнять заданные пользователем условия и ограничения при генерации текста.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/event-based-grounding.html\"&gt;Событийная привязка&lt;/a&gt; — Способ идентификации объекта роботом на основе его роли в недавнем действии, а не по названию или внешнему виду.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adversarial-perturbations.html\"&gt;состязательные возмущения&lt;/a&gt; — Минимальные, незаметные для глаза изменения пикселей изображения, которые заставляют нейросеть выдавать неверный результат.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sociotechnical-changes.html\"&gt;Социотехнические изменения&lt;/a&gt; — Взаимосвязанные трансформации технологических систем и общественных институтов, влияющие на структуру управления.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganographic-messaging.html\"&gt;Стеганографическая передача сообщений&lt;/a&gt; — Способ передачи данных внутри текста, при котором скрытый смысл остается незаметным для внешнего монитора.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"15 концепций"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Явления","description":"15 концепций","vcsPath":"reference/phenomena.md"},"headings":[],"title":"Явления"},"router":{"pathname":"reference/phenomena","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInte
