        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Профессии&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;собирает и связывает открытые данные в доказательную картину&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-osint_researcher.jpg\" alt=\"OSINT-исследователь\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Чем занимается&lt;/td&gt;\n&lt;td&gt;собирает и связывает открытые данные в доказательную картину&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что нужно уметь&lt;/td&gt;\n&lt;td&gt;поиск, документирование, верификация, этика&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Образование&lt;/td&gt;\n&lt;td&gt;Курсы по анализу данных, кибербезопасности, фактчекингу и протоколам верификации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Где работают&lt;/td&gt;\n&lt;td&gt;Научные издания, аналитические центры, правозащитные организации, ИБ-компании.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt;, &lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Методы и этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chem-zanimaetsya\"&gt;&lt;a href=\"reference/professions/prof-osint_researcher.html#chem-zanimaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чем занимается&lt;/span&gt;&lt;/a&gt;Чем занимается&lt;/h2&gt;\n&lt;p&gt;OSINT-исследователь — это специалист, который собирает, верифицирует и анализирует разрозненные открытые данные для формирования доказательной картины событий. Профессия базируется на методологии OSINT (Open Source Intelligence), которая подразумевает использование только легальных и доступных источников: публикаций в СМИ, спутниковых снимков, данных реестров и социальных сетей. В отличие от журналиста или аналитика данных, OSINT-исследователь фокусируется на цепочке хранения информации и строгой проверке фактов, чтобы исключить манипуляции и ошибки.&lt;/p&gt;\n&lt;h2 id=\"tipichnye-zadachi\"&gt;&lt;a href=\"reference/professions/prof-osint_researcher.html#tipichnye-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типичные задачи&lt;/span&gt;&lt;/a&gt;Типичные задачи&lt;/h2&gt;\n&lt;p&gt;Основная задача исследователя — превратить хаотичный поток информации в структурированную базу данных. Это включает поиск скрытых параметров в текстах, сопоставление метаданных изображений с географическими картами и выявление аномалий в отчетах. Например, при анализе инцидентов, таких как атаки на инфраструктуру, исследователь восстанавливает хронологию событий, используя открытые данные о перемещении техники или спутниковые снимки. Важным аспектом является «атомарная проверка фактов»: декомпозиция сложных утверждений на проверяемые единицы для исключения галлюцинаций ИИ или предвзятости источников.&lt;/p&gt;\n&lt;h2 id=\"navyki-i-instrumenty\"&gt;&lt;a href=\"reference/professions/prof-osint_researcher.html#navyki-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Навыки и инструменты&lt;/span&gt;&lt;/a&gt;Навыки и инструменты&lt;/h2&gt;\n&lt;p&gt;Работа требует владения методами цифровой криминалистики и работы с нейросетями. Ключевые навыки включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Верификация цифровых объектов: проверка метаданных, поиск следов правок и сверка с независимыми источниками.&lt;/li&gt;\n&lt;li&gt;Работа с LLM: использование специализированных моделей для автоматизации анализа логов и извлечения данных из неструктурированных текстов.&lt;/li&gt;\n&lt;li&gt;Геопространственный анализ: работа со спутниковыми снимками и картографическими сервисами.&lt;/li&gt;\n&lt;li&gt;Этика и безопасность: соблюдение принципов защиты частных лиц и предотвращение распространения вредоносной информации.&lt;br /&gt;\nИнструментарий включает алгоритмы для автоматизации рутинных задач (например, ускорение обработки данных) и специализированные агентные каркасы, которые позволяют компактным моделям эффективно решать сложные аналитические задачи.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-uchitsya\"&gt;&lt;a href=\"reference/professions/prof-osint_researcher.html#gde-uchitsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться&lt;/span&gt;&lt;/a&gt;Где учиться&lt;/h2&gt;\n&lt;p&gt;Профессия требует междисциплинарной подготовки. Базовые знания можно получить в рамках курсов по анализу данных, кибербезопасности и фактчекингу. Важным этапом обучения является изучение протоколов верификации (например, Протокол Беркли). Практический опыт приобретается через участие в проектах по анализу открытых реестров и работу с инструментами автоматизации, описанными в современных исследованиях методов анализа данных.&lt;/p&gt;\n&lt;h2 id=\"gde-rabotayut-i-kak-rasti\"&gt;&lt;a href=\"reference/professions/prof-osint_researcher.html#gde-rabotayut-i-kak-rasti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают и как расти&lt;/span&gt;&lt;/a&gt;Где работают и как расти&lt;/h2&gt;\n&lt;p&gt;OSINT-исследователи востребованы в научно-популярных изданиях, аналитических центрах, организациях по защите прав человека и компаниях, занимающихся кибербезопасностью. Карьерный рост предполагает переход от сбора данных к разработке собственных методологий анализа и созданию инструментов для верификации информации. Специалисты часто специализируются на конкретных доменах: от мониторинга экологических изменений до анализа цепочек поставок или проверки достоверности научных отчетов.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/professions/prof-osint_researcher.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D0%BF%D0%B5%D1%80%D0%B0%D1%86%D0%B8%D1%8F_%C2%AB%D0%9F%D0%B0%D1%83%D1%82%D0%B8%D0%BD%D0%B0%C2%BB\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Операция «Паутина» — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:2025-06-01_DroneAttack_SBU_(Drones_in_containers).jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Служба безопасности Украины, CC BY 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Профессии&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"собирает и связывает открытые данные в доказательную картину"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"OSINT-исследователь","description":"собирает и связывает открытые данные в доказательную картину","vcsPath":"reference/professions/prof-osint_researcher.md"},"headings":[{"title":"Чем занимается","href":"reference/professions/prof-osint_researcher.html#chem-zanimaetsya","level":2},{"title":"Типичные задачи","href":"reference/professions/prof-osint_researcher.html#tipichnye-zadachi","level":2},{"title":"Навыки и инструменты","href":"reference/professions/prof-osint_researcher.html#navyki-i-instrumenty","level":2},{"title":"Где учиться","href":"reference/professions/prof-osint_researcher.html#gde-uchitsya","level":2},{"title":"Где работают и как расти","href":"reference/professions/prof-osint_researcher.html#gde-rabotayut-i-kak-rasti","level":2},{"title":"Источники","href":"reference/professions/prof-osint_researcher.html#istochniki","level":2}],"title":"OSINT-исследователь"},"router":{"pathname":"reference/professions/prof-osint_researcher","depth":3,"base":"
