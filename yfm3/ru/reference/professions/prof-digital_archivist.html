        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Профессии&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;сохраняет страницы и данные, чтобы доказательства не исчезли&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-digital_archivist.jpg\" alt=\"Цифровой архивист\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Чем занимается&lt;/td&gt;\n&lt;td&gt;сохраняет страницы и данные, чтобы доказательства не исчезли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что нужно уметь&lt;/td&gt;\n&lt;td&gt;веб-архивы, WARC, цепочка хранения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Образование&lt;/td&gt;\n&lt;td&gt;Историко-архивное образование в сочетании с навыками работы с базами данных и ИИ.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Где работают&lt;/td&gt;\n&lt;td&gt;НИИ, государственные структуры, OSINT-организации, архивы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Методы и этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chem-zanimaetsya\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#chem-zanimaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чем занимается&lt;/span&gt;&lt;/a&gt;Чем занимается&lt;/h2&gt;\n&lt;p&gt;Цифровой архивист — это специалист, который обеспечивает сохранение и целостность цифровых данных для их последующей проверки и анализа. В отличие от традиционного архивиста, работающего с бумажными документами, цифровой архивист управляет жизненным циклом электронных объектов: от их фиксации в сети до обеспечения долгосрочного доступа. Основная функция специалиста — создание доказательной базы, которая защищает информацию от удаления, изменения или «испарения», как это происходит при редактировании отчетов или удалении данных из открытых реестров.&lt;/p&gt;\n&lt;h2 id=\"tipichnye-zadachi\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#tipichnye-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типичные задачи&lt;/span&gt;&lt;/a&gt;Типичные задачи&lt;/h2&gt;\n&lt;p&gt;Работа цифрового архивиста строится на протоколе, включающем поиск, сбор, сохранение и проверку данных. В ежедневные задачи входит создание снимков веб-страниц, фиксация метаданных и обеспечение неизменности файлов с помощью хэширования. Специалист отслеживает изменения в публикациях, чтобы выявлять попытки сокрытия информации. В проектах, связанных с анализом нейросетей или открытых данных, архивист формирует структурированные базы данных из неструктурированных постов, обеспечивая точность, сопоставимую с человеческой, и предотвращая искажения, возникающие при автоматической обработке.&lt;/p&gt;\n&lt;h2 id=\"navyki-i-instrumenty\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#navyki-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Навыки и инструменты&lt;/span&gt;&lt;/a&gt;Навыки и инструменты&lt;/h2&gt;\n&lt;p&gt;Ключевой навык — владение методами верификации цифровых объектов и понимание цепочки хранения (chain of custody). Специалисты используют форматы архивации, такие как WARC (Web ARChive), для сохранения веб-контента. Важным инструментом является применение алгоритмов на базе языковых моделей для извлечения скрытых параметров из текстов. Также архивист должен уметь работать с инструментами проверки метаданных и следов правки, чтобы отличать реальные данные от «ролевых игр» нейросетей или манипуляций в отчетах.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#gde-uchitsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться&lt;/span&gt;&lt;/a&gt;Где учиться&lt;/h2&gt;\n&lt;p&gt;Базовая подготовка опирается на классическое архивное дело и историю, дополненные современными IT-компетенциями. Историко-архивное образование, подобное тому, что получают специалисты в области документационного обеспечения, дает понимание принципов классификации и хранения. Техническая часть осваивается через изучение протоколов передачи данных, методов работы с базами данных и принципов работы алгоритмов машинного обучения.&lt;/p&gt;\n&lt;h2 id=\"gde-rabotayut-i-kak-rasti\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#gde-rabotayut-i-kak-rasti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают и как расти&lt;/span&gt;&lt;/a&gt;Где работают и как расти&lt;/h2&gt;\n&lt;p&gt;Цифровые архивисты востребованы в научно-исследовательских институтах, государственных структурах, занимающихся открытыми данными, и в организациях, проводящих расследования (OSINT). Карьерный рост предполагает переход от операционной работы по сбору данных к разработке стратегий долгосрочного хранения и созданию автоматизированных систем мониторинга, которые позволяют предсказывать попытки удаления или искажения информации.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B0%D1%82%D0%B0%D0%BB%D0%B8%D0%BD%2C_%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80_%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B5%D0%B2%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Баталин, Виктор Николаевич — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Victor_Batalin_02.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: GalinaMalysheva222, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Профессии&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"сохраняет страницы и данные, чтобы доказательства не исчезли"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Цифровой архивист","description":"сохраняет страницы и данные, чтобы доказательства не исчезли","vcsPath":"reference/professions/prof-digital_archivist.md"},"headings":[{"title":"Чем занимается","href":"reference/professions/prof-digital_archivist.html#chem-zanimaetsya","level":2},{"title":"Типичные задачи","href":"reference/professions/prof-digital_archivist.html#tipichnye-zadachi","level":2},{"title":"Навыки и инструменты","href":"reference/professions/prof-digital_archivist.html#navyki-i-instrumenty","level":2},{"title":"Где учиться","href":"reference/professions/prof-digital_archivist.html#gde-uchitsya","level":2},{"title":"Где работают и как расти","href":"reference/professions/prof-digital_archivist.html#gde-rabotayut-i-kak-rasti","level":2},{"title":"Источники","href":"reference/professions/prof-digital_archivist.html#istochniki","level":2}],"title":"Цифровой архивист"},"router":{"pathname":"reference/professions/prof-digital_archivist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
