        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Web archives and the Wayback Machine for research&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-web_archives.jpg\" alt=\"Веб-архивы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Alanarce, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Archived_Website.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-web_archives.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Wayback Machine, сохранение и сравнение страниц.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-web_archives.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Веб-архивы — это информационные системы, обеспечивающие долгосрочное хранение и доступ к копиям веб-страниц. Основная задача таких систем — противодействие «цифровому тёмному веку» и проблеме «битых» ссылок, когда информация исчезает из сети из-за удаления или изменения исходного ресурса. Крупнейшим инструментом в этой области является Wayback Machine, запущенная в 2001 году, которая к 2026 году сохранила более 1 трлн веб-страниц.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-web_archives.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Архивирование веб-сайтов является процессом сбора и дублирования контента для обеспечения его сохранности. В основе лежит принцип создания «снимков» (snapshots) — статических копий страницы на конкретный момент времени. Веб-архивы функционируют как хранилища данных, которые фиксируют состояние сетевых объектов, позволяя исследователям обращаться к ним даже после того, как оригинал был изменен или удален владельцем сайта.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-web_archives.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс архивирования состоит из трех этапов: обход (crawling), индексация и хранение. Специальные программы-роботы посещают веб-страницы, копируют их код и медиафайлы, после чего сохраняют их в базе данных с привязкой к временной метке. Пользователь взаимодействует с архивом через интерфейс, который запрашивает URL и возвращает сохраненную копию, максимально приближенную к оригиналу по визуальному оформлению и структуре.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-web_archives.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным инструментом является Wayback Machine. Для OSINT-специалистов метод работы включает поиск исторических версий страниц для выявления изменений в официальных документах, реестрах или новостных лентах. Важным аспектом является проверка метаданных снимка, чтобы убедиться в подлинности сохраненной копии и отсутствии следов манипуляций.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-web_archives.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Веб-архивы незаменимы при проверке фактов и анализе открытых данных. Например, в статье «Как чиновники удаляют слова из отчетов, чтобы «испарить» научные исследования» описывается ситуация 2025 года, когда из заявок NIH были удалены упоминания DEI. Использование архивов позволяет исследователям находить исходные версии таких документов, восстанавливая статистику, которая была скрыта из текущих версий отчетов.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-web_archives.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Веб-архивы не гарантируют 100% полноту данных. Динамический контент, защищенные паролем разделы, формы поиска и интерактивные элементы часто не сохраняются корректно. Кроме того, существует риск «отравления» архивов, когда владелец сайта может запретить индексацию своего ресурса через протокол robots.txt, что делает невозможным создание снимков для будущих исследований.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Веб-архивы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%92%D0%B5%D0%B1-%D1%81%D0%B0%D0%B9%D1%82%5D%20--%3E%7C%D0%BE%D0%B1%D1%85%D0%BE%D0%B4%7C%20B%5B%D0%A0%D0%BE%D0%B1%D0%BE%D1%82-%D1%81%D0%BA%D0%B0%D0%BD%D0%B5%D1%80%5D%0A%20%20B%20--%3E%7C%D0%BA%D0%BE%D0%BF%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%7C%20C%5B%D0%92%D0%B5%D0%B1-%D0%B0%D1%80%D1%85%D0%B8%D0%B2%5D%0A%20%20C%20--%3E%7C%D0%B8%D0%BD%D0%B4%D0%B5%D0%BA%D1%81%D0%B0%D1%86%D0%B8%D1%8F%7C%20D%5B%D0%91%D0%B0%D0%B7%D0%B0%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D1%85%5D%0A%20%20D%20--%3E%7C%D0%B7%D0%B0%D0%BF%D1%80%D0%BE%D1%81%7C%20E%5B%D0%9F%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%5D%0A%20%20E%20--%3E%7C%D0%BF%D1%80%D0%BE%D1%81%D0%BC%D0%BE%D1%82%D1%80%7C%20F%5B%D0%A1%D0%BD%D0%B8%D0%BC%D0%BE%D0%BA%20%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B8%D1%86%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-web_archives.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt; — Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-legal_data.html\"&gt;Суды и законы&lt;/a&gt; — Открытые решения, законодательные базы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-web_archives.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Как чиновники удаляют слова из отчетов, чтобы «испарить» научные исследования&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-web_archives.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D1%80%D1%85%D0%B8%D0%B2%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5_%D0%B2%D0%B5%D0%B1-%D1%81%D0%B0%D0%B9%D1%82%D0%BE%D0%B2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Архивирование веб-сайтов — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Archived_Website.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Alanarce, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fmed.2023.1266429\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Social prescribing outcomes: a mapping review of the evidence from 13 countries to identify key common outcomes&lt;/a&gt; — обзор, Front Med (Lausanne) 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.healthpol.2011.05.010\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pharmacy assisted patient self care of minor ailments: a chronological review of UK health policy documents and key events 1997-2010&lt;/a&gt; — обзор, Health Policy 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-11-455\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Next generation tools for genomic data generation, distribution, and visualization&lt;/a&gt; — обзор, BMC Bioinformatics 2010&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Wayback Machine, сохранение и сравнение страниц."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Веб-архивы","description":"Wayback Machine, сохранение и сравнение страниц.","vcsPath":"concepts/proc-web_archives.md"},"headings":[{"title":"Определение","href":"concepts/proc-web_archives.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-web_archives.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-web_archives.html#teoriya","level":2},{"title":"Как эт
