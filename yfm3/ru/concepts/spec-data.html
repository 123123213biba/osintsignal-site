        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-data.jpg\" alt=\"Открытые данные\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Cygri, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:LOD_Cloud_-_2007-09.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-data.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-data.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Открытые данные — это информационная сущность, представляющая собой сведения, которые свободно доступны для машиночитаемого использования и дальнейшего распространения без ограничений авторского права, патентов или иных механизмов контроля. В контексте OSINT и проверки фактов открытые данные служат фундаментом для независимого анализа, позволяя исследователям верифицировать информацию, опираясь на первичные источники, а не на интерпретации посредников.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-data.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Концепция открытых данных базируется на принципе доступности и интероперабельности. Данные считаются открытыми, если они соответствуют трем критериям: доступность (полный набор данных доступен для скачивания), машиночитаемость (структура файла позволяет программному обеспечению автоматически обрабатывать данные) и отсутствие ограничений на использование (открытая лицензия). Эти данные являются информационной сущностью, которая служит входом для аналитических процессов, таких как сопоставление реестров или поиск корреляций в сетях.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-data.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс работы с открытыми данными включает поиск, сбор, сохранение и анализ. Сначала исследователь определяет источник (например, государственный портал или архив). Затем данные извлекаются в структурированном виде (CSV, JSON, XML). Важным этапом является сохранение цепочки хранения: фиксация метаданных и создание хэш-сумм для подтверждения того, что данные не были изменены после получения. На этапе анализа данные проходят проверку на достоверность путем сопоставления с независимыми источниками.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-data.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для работы с открытыми данными применяются методы автоматизированного сбора (парсинг) и статистической обработки. Инструменты варьируются от простых табличных процессоров до специализированных библиотек для анализа сетей и баз данных. В OSINT критически важно использование инструментов для проверки цифровых следов, таких как метаданные файлов или история изменений в веб-архивах, что позволяет подтвердить время и место создания объекта.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-data.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Открытые данные являются ключевым инструментом в расследовательской деятельности. Например, в статье «Доверие — это не оценка: как ограничить власть ИИ-агентов» рассматривается необходимость контроля за системами, где открытые данные о логике работы алгоритмов помогают выявить риски и ограничить неконтролируемое влияние ИИ. Также методы анализа данных применяются в мониторинге госзакупок, реестров организаций и экологическом мониторинге для выявления аномалий.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-data.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основное ограничение заключается в качестве данных: наличие открытого доступа не гарантирует точность или полноту информации. Существуют риски «шумных» данных, когда объем информации велик, но полезный сигнал минимален. Кроме того, данные могут быть устаревшими или содержать ошибки ввода. При анализе важно учитывать, что корреляция, выявленная в данных, не всегда означает причинно-следственную связь, а высокая степень автоматизации требует постоянной верификации результатов человеком.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Открытые данные&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D0%BA%D3%A9%D0%B7%5D%20--%3E%7C%D0%96%D0%B8%D0%BD%D0%B0%D1%83%7C%20B%5B%D0%A8%D0%B8%D0%BA%D1%96%20%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%5D%0A%20%20B%20--%3E%7C%D3%A8%D2%A3%D0%B4%D0%B5%D1%83%7C%20C%5B%D2%9A%D2%B1%D1%80%D1%8B%D0%BB%D1%8B%D0%BC%D0%B4%D1%8B%D2%9B%20%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%7C%D0%A2%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%7C%20D%5B%D0%A2%D0%B5%D0%BA%D1%81%D0%B5%D1%80%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20%D0%BD%D3%99%D1%82%D0%B8%D0%B6%D0%B5%5D%0A%20%20D%20--%3E%7C%D0%92%D0%B5%D1%80%D0%B8%D1%84%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D1%8F%7C%20E%5B%D0%90%D1%88%D1%8B%D2%9B%20%D0%B5%D1%81%D0%B5%D0%BF%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-data.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-legal_data.html\"&gt;Суды и законы&lt;/a&gt; — Открытые решения, законодательные базы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-web_archives.html\"&gt;Веб-архивы&lt;/a&gt; — Wayback Machine, сохранение и сравнение страниц.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-data.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html\"&gt;Машинное обучение против лесных пожаров: как ИИ видит огонь лучше спутников&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Как чиновники удаляют слова из отчетов, чтобы «испарить» научные исследования&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html\"&gt;Доверие — это не оценка: как ограничить власть ИИ-агентов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-data.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D1%82%D0%BA%D1%80%D1%8B%D1%82%D1%8B%D0%B5_%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Открытые данные — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:LOD_Cloud_-_2007-09.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Cygri, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — обзор, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0092-8674(04)00045-5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MicroRNAs: genomics, biogenesis, mechanism, and function&lt;/a&gt; — обзор, Cell 2004&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — обзор, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Реестры, закупки, архивы: где лежат открытые данные и как их читать."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extensio
