        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Термин&lt;/strong&gt; · &lt;em&gt;SFT&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/sft.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Контролируемая донастройка (SFT) — это метод обучения модели на размеченных примерах, позволяющий адаптировать её поведение под конкретные задачи и принудительно задать желаемые ответы. Процесс включает использование наборов данных с конкретными правильными примерами для настройки модели.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/sft.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Контролируемая донастройка (Supervised Fine-Tuning, SFT) — это процесс обучения нейросетевой модели на специализированном размеченном наборе данных, направленный на адаптацию поведения модели для выполнения конкретных задач. В отличие от базового обучения, где модель усваивает общие закономерности языка, SFT фокусируется на формировании предсказуемых ответов, соответствующих заданным инструкциям или форматам.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/sft.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Контролируемая донастройка является видом процесса обучения с учителем. В основе метода лежит минимизация функции потерь при сравнении предсказаний модели с эталонными ответами из обучающей выборки. Модель, являющаяся информационной сущностью, корректирует свои внутренние параметры (веса), чтобы вероятность генерации правильного ответа на заданный входной сигнал возрастала. Этот процесс позволяет перевести модель из состояния «универсального предсказателя следующего токена» в состояние «специализированного исполнителя команд».&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/sft.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс включает три этапа. Сначала подготавливается датасет, содержащий пары «инструкция — желаемый результат». Затем модель проходит через итерации обучения, где на каждом шаге сравнивается её вывод с эталоном. В завершение проводится оценка качества на независимых данных. Важным аспектом является качество разметки: если примеры содержат ошибки или противоречивые логические цепочки, модель перенимает эти недостатки, что снижает её точность в реальных условиях.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/sft.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для реализации SFT применяются методы оптимизации параметров, такие как градиентный спуск. Инструментарий включает библиотеки для работы с глубоким обучением и специализированные бенчмарки. Например, для проверки точности работы модели с инструментами кибербезопасности используется KaliBench. Этот инструмент позволяет оценить, насколько корректно модель формирует синтаксис команд, что является критически важным для прикладных задач.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/sft.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;SFT используется для повышения точности специализированных систем. В статье «Почему нейросети ошибаются в командах Kali Linux и как это исправить» рассматривается применение SFT для обучения моделей работе с инструментами кибербезопасности. В материале «Почему ваш ИИ-агент притворяется умным: ловушка бенчмарков» подчеркивается, что SFT может создавать иллюзию компетентности, если модель просто запоминает ответы из тестов. Статья «Скрытые рассуждения ИИ: почему их сложно научить обману» исследует границы того, насколько эффективно SFT может влиять на скрытые логические процессы внутри модели.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/sft.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основное ограничение SFT — риск переобучения, при котором модель теряет способность к обобщению и начинает «зазубривать» ответы. Также существует проблема «ловушки бенчмарков»: модель может показывать высокие результаты на тестах, но демонстрировать низкую эффективность в реальных задачах. Кроме того, SFT не гарантирует отсутствие скрытых ошибок в рассуждениях, так как модель может имитировать правильный ответ без понимания логики процесса.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Контролируемая донастройка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%20%D0%B6%D0%B8%D1%8B%D0%BD%D1%8B%5D%20--%3E%20B%5B%D0%9E%D2%9B%D1%8B%D1%82%D1%83%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%96%5D%0A%20%20B%20--%3E%20C%5B%D0%9C%D0%BE%D0%B4%D0%B5%D0%BB%D1%8C%20%D0%BF%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D1%82%D1%80%D0%BB%D0%B5%D1%80%D1%96%5D%0A%20%20C%20--%3E%20D%5B%D0%91%D0%BE%D0%BB%D0%B6%D0%B0%D0%BC%D0%B4%D1%8B%20%D0%B6%D0%B0%D1%83%D0%B0%D0%BF%5D%0A%20%20D%20--%3E%20E%5B%D0%91%D0%B5%D0%BD%D1%87%D0%BC%D0%B0%D1%80%D0%BA%20%D1%82%D0%B5%D1%81%D1%82%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%94%D3%99%D0%BB%D0%B4%D1%96%D0%BA%D1%82%D1%96%20%D0%B1%D0%B0%D2%93%D0%B0%D0%BB%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение проверено автоматически и ждёт утверждения редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/sft.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Контролируемая донастройка (SFT) — это метод обучения модели на размеченных примерах, где заданы конкретные правильные ответы, что позволяет принудительно задать желаемое поведение.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html\"&gt;Скрытые рассуждения ИИ: почему их сложно научить обману&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/sft.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;steps&lt;/td&gt;\n&lt;td&gt;2202&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;duration_gpu_hours&lt;/td&gt;\n&lt;td&gt;3.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;время_обучения&lt;/td&gt;\n&lt;td&gt;3.3 часа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;шаги&lt;/td&gt;\n&lt;td&gt;2202&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/sft.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;Supervised fine-tuning, Целевая дообучающая настройка, дообучение&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/sft.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html\"&gt;Скрытые рассуждения ИИ: почему их сложно научить обману&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html\"&gt;Почему ваш ИИ-агент «притворяется» умным: ловушка бенчмарков&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html\"&gt;Почему нейросети ошибаются в командах Kali Linux и как это исправить&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html\"&gt;SecJev: как научить нейросети принимать решения в кибербезопасности&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/sft.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/ageing/afu115\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Prevalence of and interventions for sarcopenia in ageing adults: a systematic review. Report of the International Sarcopenia Initiative (EWGSOP and IWGS)&lt;/a&gt; — обзор, Age Ageing 2014&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/jxb/err460\" target=\
