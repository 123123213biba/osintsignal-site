        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Detecting image splicing and copy-move tampering&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-image_forensics.jpg\" alt=\"Криминалистика изображений\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: William James Herschel (1833-1917), Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Fingerprints_taken_by_William_James_Herschel_1859-1860.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Следы монтажа, метаданные, сжатие.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Криминалистика изображений — это процесс анализа цифровых медиа для установления их подлинности и выявления следов манипуляций. В отличие от традиционной дактилоскопии, которая идентифицирует человека по уникальному рисунку кожи, криминалистика изображений исследует математические и физические закономерности, возникающие при создании и сохранении цифрового файла.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Криминалистика изображений является частью области «Проверка фактов и медиа». Она базируется на принципе, что любое устройство захвата (камера, сканер) и программное обеспечение для обработки оставляют специфические «цифровые отпечатки». Ключевые понятия включают метаданные (служебная информация о файле), уровень сжатия (артефакты кодирования) и статистические аномалии в распределении пикселей. Эти данные позволяют отличить исходный снимок от изображения, прошедшего через монтаж или синтез.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс анализа состоит из трех этапов: сбор данных, извлечение признаков и классификация. Сначала извлекаются метаданные и технические характеристики файла. Затем алгоритмы ищут несоответствия в шуме сенсора или следы копирования фрагментов (copy-move). Результатом является вероятность того, что изображение подвергалось изменению. Современные методы используют нейронные сети для автоматического обнаружения признаков, которые невидимы для человеческого глаза.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основные методы включают анализ уровня ошибок сжатия (ELA), поиск дублирующихся областей и проверку целостности метаданных. Инструменты для анализа варьируются от простых просмотрщиков заголовков файлов до сложных систем на базе глубокого обучения, которые обучаются на наборах данных с миллионами примеров оригинальных и измененных изображений. Эти системы позволяют выявлять закономерности, характерные для конкретных моделей камер или алгоритмов сжатия.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Методы криминалистики изображений критически важны для верификации контента в журналистике и расследованиях. Например, в статье «LiteReality-Agent: как превратить сканы комнат в интерактивные 3D-модели с помощью кода» описывается технология, требующая проверки исходных данных для подтверждения точности цифровых двойников. Также методы применяются для борьбы с дезинформацией и защиты авторских прав.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Криминалистика изображений не дает стопроцентной гарантии. Основные ограничения связаны с повторным сжатием файлов, которое стирает следы манипуляций, и развитием генеративных моделей, способных имитировать естественные шумы сенсора. Результаты анализа всегда носят вероятностный характер и требуют перекрестной проверки с другими источниками данных.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Криминалистика изображений&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A6%D0%B8%D1%84%D1%80%D0%BB%D1%8B%D2%9B%20%D0%BA%D0%B5%D1%81%D0%BA%D1%96%D0%BD%5D%20--%3E%20B%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%D0%B4%D1%96%20%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%0A%20%20A%20--%3E%20C%5B%D0%A1%D0%B5%D0%BD%D1%81%D0%BE%D1%80%20%D1%88%D1%83%D1%8B%D0%BD%20%D1%82%D0%B5%D0%BA%D1%81%D0%B5%D1%80%D1%83%5D%0A%20%20A%20--%3E%20D%5B%D0%A1%D1%8B%D2%93%D1%8B%D0%BC%D0%B4%D0%B0%D1%83%20%D1%96%D0%B7%D0%B4%D0%B5%D1%80%D1%96%D0%BD%20%D1%96%D0%B7%D0%B4%D0%B5%D1%83%5D%0A%20%20B%20--%3E%20E%5B%D0%A2%D2%AF%D0%BF%D0%BD%D2%B1%D1%81%D2%9B%D0%B0%D0%BB%D1%8B%D2%9B%20%D1%82%D1%83%D1%80%D0%B0%D0%BB%D1%8B%20%D2%9B%D0%BE%D1%80%D1%8B%D1%82%D1%8B%D0%BD%D0%B4%D1%8B%5D%0A%20%20C%20--%3E%20E%0A%20%20D%20--%3E%20E%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic.html\"&gt;Синтетические медиа&lt;/a&gt; — Детекция сгенерированных изображений, голоса и видео.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-provenance.html\"&gt;Происхождение и водяные знаки&lt;/a&gt; — C2PA, цифровые подписи контента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html\"&gt;Почему нейросети «лгут» себе: разрыв между обучением и реальностью&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html\"&gt;Когда ИИ забывает, кто он: почему «личность» агента — это иллюзия&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html\"&gt;LiteReality-Agent: как превратить сканы комнат в интерактивные 3D-модели с помощью кода&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%94%D0%B0%D0%BA%D1%82%D0%B8%D0%BB%D0%BE%D1%81%D0%BA%D0%BE%D0%BF%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Дактилоскопия — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Fingerprints_taken_by_William_James_Herschel_1859-1860.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: William James Herschel (1833-1917), Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/biomedicines10071469\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Applications of Neural Networks in Biomedical Data Analysis&lt;/a&gt; — обзор, Biomedicines 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/jimaging7040069\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Comprehensive Review of Deep-Learning-Based Methods for Image Forensics&lt;/a&gt; — обзор, J Imaging 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/jimaging6030009\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Survey of Deep Learning-Based Source Image Forensics&lt;/a&gt; — обзор, J Imaging 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Следы монтажа, метаданные, сжатие."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_as
