        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Detecting AI-generated images and deepfakes after recompression&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-synthetic.jpg\" alt=\"Синтетические медиа\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Materialscientist (talk). Subsequent edits by Materialscientist., Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:HPHTdiamonds2.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-synthetic.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Детекция сгенерированных изображений, голоса и видео.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-synthetic.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Синтетические медиа — это цифровой контент (изображения, аудио, видео, текст), созданный или измененный с помощью алгоритмов машинного обучения. В контексте проверки фактов этот процесс рассматривается как создание искусственных объектов, имитирующих реальные данные. Основная задача фактчекинга в этой области — выявление признаков машинной генерации для предотвращения дезинформации.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-synthetic.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Синтетические медиа являются результатом работы генеративных моделей, которые обучаются на массивах данных для воспроизведения статистических закономерностей исходного материала. В основе лежит принцип вероятностного распределения: модель предсказывает наиболее вероятные элементы (пиксели, слова, частоты звука) на основе контекста. Это отличается от естественного процесса создания контента человеком, где присутствуют иные когнитивные и творческие паттерны. Понятие «синтетические медиа» тесно связано с криминалистикой изображений, которая изучает физические и цифровые следы обработки данных.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-synthetic.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс генерации медиа включает обучение нейросети на больших наборах данных (датасетах). Модель выявляет скрытые связи между элементами и учится их воспроизводить. При проверке фактов анализируются артефакты — специфические искажения, возникающие из-за особенностей архитектуры нейросетей или методов сжатия данных. Например, при повторном сжатии изображений (recompression) следы генерации могут маскироваться, что требует применения методов статистического анализа для поиска аномалий в структуре файла.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-synthetic.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для детекции синтетического контента применяются методы цифровой криминалистики: анализ метаданных, поиск статистических закономерностей в распределении шума и проверка целостности цифровых подписей. Исследователи используют алгоритмы, обученные отличать предсказуемые паттерны ИИ от естественной вариативности человеческого творчества. Важным инструментом является анализ «цифрового следа» (происхождения), который позволяет отследить историю изменений файла.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-synthetic.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии детекции синтетических медиа критически важны для верификации информации. Исследование «Почему научные статьи от ИИ выглядят как под копирку» показывает, что тексты, созданные нейросетями, обладают избыточной предсказуемостью, что позволяет отличать их от авторских работ. В свою очередь, работа «Почему обучение нейросетей на контенте от ИИ ведет к деградации моделей» подчеркивает важность фильтрации синтетического контента: накопление сгенерированных данных в обучающих выборках снижает качество будущих моделей.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-synthetic.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главное ограничение — «гонка вооружений» между генеративными моделями и детекторами. По мере совершенствования алгоритмов генерации, артефакты становятся менее заметными. Кроме того, методы детекции часто показывают высокую чувствительность к формату файла: изменение разрешения или перекодирование видео может привести к ложноотрицательным результатам. Важно помнить, что наличие признаков ИИ не всегда означает злонамеренность, а отсутствие таких признаков не гарантирует подлинность контента.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Синтетические медиа&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%91%D0%B0%D1%81%D1%82%D0%B0%D0%BF%D2%9B%D1%8B%20%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%5D%20--%3E%20B%5B%D0%93%D0%B5%D0%BD%D0%B5%D1%80%D0%B0%D1%82%D0%B8%D0%B2%D1%82%D1%96%20%D0%BC%D0%BE%D0%B4%D0%B5%D0%BB%D1%8C%5D%0A%20%20B%20--%3E%20C%5B%D0%A1%D0%B8%D0%BD%D1%82%D0%B5%D1%82%D0%B8%D0%BA%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%BC%D0%B5%D0%B4%D0%B8%D0%B0%5D%0A%20%20C%20--%3E%20D%5B%D0%90%D1%80%D1%82%D0%B5%D1%84%D0%B0%D0%BA%D1%82%D1%96%D0%BB%D0%B5%D1%80%D0%B4%D1%96%20%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D0%A4%D0%B0%D0%BA%D1%82%D1%87%D0%B5%D0%BA%D0%B8%D0%BD%D0%B3%5D%0A%20%20E%20--%3E%20F%5B%D0%90%D0%BD%D1%8B%D2%9B%D1%82%D0%B0%D1%83%20%D0%BD%D3%99%D1%82%D0%B8%D0%B6%D0%B5%D1%81%D1%96%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-synthetic.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-image_forensics.html\"&gt;Криминалистика изображений&lt;/a&gt; — Следы монтажа, метаданные, сжатие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-provenance.html\"&gt;Происхождение и водяные знаки&lt;/a&gt; — C2PA, цифровые подписи контента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-synthetic.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html\"&gt;Почему научные статьи от ИИ выглядят как под копирку&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html\"&gt;Судья в машине: почему нейросети выбирают не лучшие изображения, а первые попавшиеся&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html\"&gt;Почему обучение нейросетей на контенте от ИИ ведет к деградации моделей&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-synthetic.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%B8%D0%BD%D1%82%D0%B5%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%B8%D0%B5_%D0%B0%D0%BB%D0%BC%D0%B0%D0%B7%D1%8B\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Синтетические алмазы — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:HPHTdiamonds2.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Materialscientist (talk). Subsequent edits by Materialscientist., Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.1160809\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Understanding the Warburg effect: the metabolic requirements of cell proliferation&lt;/a&gt; — обзор, Science 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1080/01926230701320337\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Apoptosis: a review of programmed cell death&lt;/a&gt; — обзор, Toxicol Pathol 2007&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1126/science.aau6977\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The biology&lt;b&gt;,&lt;/b&gt; function&lt;b&gt;,&lt;/b&gt; and biomedical applications of exosomes&lt;/a&gt; — обзор, Science 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Детекция сгенерированных изображений, голоса и видео."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Синтетические медиа","description":"Детекция сгенерированных изображений, голоса и видео.","vcsPath":"concepts/proc-synthetic.md"},"headings":[{"title":"Определение","href":"concepts/proc-synthetic.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-synthetic.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-synthetic.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-synthetic.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-synthetic.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-synthetic.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-synthetic.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-synthetic.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/proc-synthetic.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/proc-synthetic.html#istochniki","level":2}],"title":"Синтетические медиа"},"router":{"pathname":"concepts/proc-synthetic","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
