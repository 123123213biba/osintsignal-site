        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Remote sensing with Sentinel-2 and Landsat satellite imagery&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-sat_imagery.jpg\" alt=\"Анализ спутниковых снимков\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: NOAA, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Satellite_imagery_on_February_27,_2020_of_Great_Lakes_blizzard.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Sentinel, Landsat, разрешение, индексы.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Анализ спутниковых снимков — это процесс извлечения данных о поверхности Земли из изображений, полученных с орбитальных аппаратов. Этот метод позволяет изучать объекты и процессы в масштабах от отдельных зданий до целых регионов, обеспечивая объективную информацию для мониторинга изменений на планете.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Спутниковая фотосъёмка является видом дистанционного зондирования, при котором датчики спутника фиксируют электромагнитное излучение, отраженное или испускаемое поверхностью Земли. Ключевым понятием здесь выступает пространственное разрешение — минимальный размер объекта на местности, который можно различить на снимке. Спутники, такие как Sentinel и Landsat, работают в различных спектральных диапазонах, включая видимый свет и инфракрасное излучение. Это позволяет создавать спектральные индексы — математические комбинации каналов, которые выделяют специфические объекты, например, растительность или водные поверхности.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс анализа включает получение данных, их предварительную обработку и интерпретацию. Сначала спутник производит съемку, передавая поток данных на наземные станции. Затем данные проходят радиометрическую и геометрическую коррекцию. Аналитик или алгоритм применяет методы классификации для распознавания объектов. Современные подходы, такие как использование нейросетей, позволяют автоматизировать этот процесс, превращая пиксели в структурированную информацию о типе и количестве объектов.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основными инструментами являются геоинформационные системы (ГИС) и специализированные библиотеки для обработки растровых данных. Популярные методы включают попиксельную классификацию, сегментацию изображений и расчет вегетационных индексов. Для работы с большими массивами данных часто используются облачные платформы, предоставляющие доступ к архивам Sentinel и Landsat без необходимости скачивания терабайтов информации на локальный компьютер.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Анализ снимков используется для экологического мониторинга, градостроительства и проверки фактов. В статье «Считаем объекты на спутниковых снимках без дообучения нейросетей» рассматривается метод, позволяющий ИИ распознавать корабли и здания в новых регионах, что значительно ускоряет работу аналитиков и снижает потребность в ручной разметке данных для каждой новой территории.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главным ограничением является облачность, которая может полностью закрыть обзор земной поверхности. Также важно учитывать временное разрешение: спутник не всегда находится над нужной точкой в нужный момент. При использовании алгоритмов машинного обучения существует риск ошибок классификации из-за схожести спектральных характеристик разных объектов, что требует обязательной верификации результатов с помощью независимых источников данных.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Анализ спутниковых снимков&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%96%D0%B5%D1%80%D1%81%D0%B5%D1%80%D1%96%D0%BA%5D%20--%3E%7C%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%D0%B4%D1%96%20%D1%82%D2%AF%D1%81%D1%96%D1%80%D1%83%7C%20B%5B%D0%96%D0%B5%D1%80%D2%AF%D1%81%D1%82%D1%96%20%D1%81%D1%82%D0%B0%D0%BD%D1%86%D0%B8%D1%8F%D1%81%D1%8B%5D%0A%20%20B%20--%3E%7C%D3%A8%D2%A3%D0%B4%D0%B5%D1%83%7C%20C%5B%D0%93%D0%B5%D0%BE%D0%B0%D2%9B%D0%BF%D0%B0%D1%80%D0%B0%D1%82%D1%82%D1%8B%D2%9B%20%D0%B6%D2%AF%D0%B9%D0%B5%5D%0A%20%20C%20--%3E%7C%D0%9A%D0%BB%D0%B0%D1%81%D1%81%D0%B8%D1%84%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D1%8F%7C%20D%5B%D0%9D%D1%8B%D1%81%D0%B0%D0%BD%D0%B4%D0%B0%D1%80%D0%B4%D1%8B%20%D1%82%D0%B0%D0%BD%D1%83%5D%0A%20%20D%20--%3E%7C%D0%9D%D3%99%D1%82%D0%B8%D0%B6%D0%B5%7C%20E%5B%D0%A2%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%20%D0%B5%D1%81%D0%B5%D0%B1%D1%96%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geo.html\"&gt;Спутники и геоданные&lt;/a&gt; — Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geolocation.html\"&gt;Геолокация по изображению&lt;/a&gt; — Где сделан снимок: рельеф, дороги, тени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-change_detection.html\"&gt;Обнаружение изменений&lt;/a&gt; — Что изменилось между снимками: застройка, леса, разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-night_lights.html\"&gt;Ночные огни и косвенные признаки&lt;/a&gt; — Экономика и события по свечению городов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-osm_gis.html\"&gt;OpenStreetMap и ГИС&lt;/a&gt; — Открытые карты, геоданные, пространственный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html\"&gt;Считаем объекты на спутниковых снимках без дообучения нейросетей&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D1%83%D1%82%D0%BD%D0%B8%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D1%84%D0%BE%D1%82%D0%BE%D1%81%D1%8A%D1%91%D0%BC%D0%BA%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Спутниковая фотосъёмка — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Satellite_imagery_on_February_27,_2020_of_Great_Lakes_blizzard.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: NOAA, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Sentinel, Landsat, разрешение, индексы."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Анализ спутниковых снимков","description":"Sentinel, Landsat, разрешение, индексы.","vcsPath":"concepts/proc-sat_imagery.md"},"headings":[{"title":"Определение","href":"concepts/proc-sat_imagery.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-sat_imagery.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-sat_imagery.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-sat_imagery.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-sat_imagery.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-sat_imagery.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-sat_imagery.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концеп
