        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Detecting coordinated inauthentic behaviour across channels&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-coordination.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Синхронные публикации, сети аккаунтов.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-coordination.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Скоординированное поведение — это процесс синхронного или согласованного взаимодействия группы аккаунтов в цифровых сетях, направленный на достижение общей цели, например, распространение определенного нарратива. В отличие от органической активности, такое поведение характеризуется высокой степенью временной и содержательной близости действий, что позволяет исследователям выявлять сети, действующие как единое целое.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-coordination.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;В контексте информационных кампаний поведение определяется как последовательность действий субъектов (аккаунтов), направленных на изменение информационной среды. Скоординированность является качеством, измеряемым через метрики временных интервалов, идентичности контента и графовых связей. Это понятие тесно связано с теорией сетей: если отдельные узлы (аккаунты) демонстрируют паттерны активности, которые статистически маловероятны при независимом поведении, это указывает на наличие внешнего управления или общего протокола.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-coordination.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс скоординированного поведения включает три этапа: подготовку инфраструктуры (создание или захват аккаунтов), синхронизацию (установление времени и содержания публикации) и исполнение (массовый вброс контента). Система функционирует за счет использования автоматизированных инструментов или жестких инструкций для операторов. Основная цель — создать иллюзию массовой поддержки или общественного консенсуса вокруг конкретной идеи, что затрудняет критическое восприятие информации пользователями.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-coordination.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для выявления таких сетей исследователи используют методы анализа графов и временных рядов. Основные инструменты включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Анализ метаданных: проверка времени публикации, IP-адресов и используемых устройств.&lt;/li&gt;\n&lt;li&gt;Графовый анализ: поиск кластеров аккаунтов, которые взаимодействуют только друг с другом или репостят идентичный контент.&lt;/li&gt;\n&lt;li&gt;Сравнение контента: использование алгоритмов для оценки семантической близости сообщений, опубликованных разными аккаунтами в короткий промежуток времени.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-coordination.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Понимание скоординированного поведения необходимо для анализа того, как формируются информационные пузыри. Например, в статье «Пузыри фильтров или случайность: как мы на самом деле выбираем контент в соцсетях» показано, что 80% внимания пользователей ограничено «двумя шагами» от их подписок. Скоординированные сети эксплуатируют эту особенность, внедряя контент в узкие круги общения, чтобы максимизировать виральность и ограничить доступ к альтернативным точкам зрения.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-coordination.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главная сложность заключается в разграничении скоординированного поведения и естественного сетевого эффекта, когда пользователи искренне разделяют общие интересы. Наличие корреляции не означает наличие централизованного управления. Исследователи должны учитывать смешивающие факторы, такие как алгоритмические рекомендации платформ, которые могут принудительно синхронизировать поведение пользователей, не имеющих между собой связи.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Скоординированное поведение&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%98%D0%BD%D1%84%D1%80%D0%B0%D1%81%D1%82%D1%80%D1%83%D0%BA%D1%82%D1%83%D1%80%D0%B0%5D%20--%3E%20B%5B%D0%A1%D0%B8%D0%BD%D1%85%D1%80%D0%BE%D0%BD%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20B%20--%3E%20C%5B%D0%9C%D0%B0%D1%81%D1%81%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%B2%D0%B1%D1%80%D0%BE%D1%81%5D%0A%20%20C%20--%3E%20D%5B%D0%A4%D0%BE%D1%80%D0%BC%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%20%D0%BD%D0%B0%D1%80%D1%80%D0%B0%D1%82%D0%B8%D0%B2%D0%B0%5D%0A%20%20D%20--%3E%20E%5B%D0%98%D0%BB%D0%BB%D1%8E%D0%B7%D0%B8%D1%8F%20%D0%BA%D0%BE%D0%BD%D1%81%D0%B5%D0%BD%D1%81%D1%83%D1%81%D0%B0%5D%0A%20%20E%20--%3E%20F%5B%D0%92%D0%BB%D0%B8%D1%8F%D0%BD%D0%B8%D0%B5%20%D0%BD%D0%B0%20%D0%B0%D1%83%D0%B4%D0%B8%D1%82%D0%BE%D1%80%D0%B8%D1%8E%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-coordination.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt; — Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bots.html\"&gt;Боты&lt;/a&gt; — Автоматические аккаунты и их поиск.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-narratives.html\"&gt;Нарративы и дезинформация&lt;/a&gt; — Отслеживание сюжетов и ложных утверждений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-platforms.html\"&gt;Платформы&lt;/a&gt; — Telegram, YouTube, X: особенности данных и доступа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-diffusion.html\"&gt;Распространение и виральность&lt;/a&gt; — Как сообщения расходятся по сети.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-coordination.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html\"&gt;Пузыри фильтров или случайность: как мы на самом деле выбираем контент в соцсетях&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-coordination.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9F%D0%BE%D0%B2%D0%B5%D0%B4%D0%B5%D0%BD%D0%B8%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Поведение — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-10-421\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;BLAST+: architecture and applications&lt;/a&gt; — обзор, BMC Bioinformatics 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.cell.2013.05.039\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The hallmarks of aging&lt;/a&gt; — обзор, Cell 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0140-6736(21)02724-0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Global burden of bacterial antimicrobial resistance in 2019: a systematic analysis&lt;/a&gt; — обзор, Lancet 2022&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Синхронные публикации, сети аккаунтов."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Скоординированное поведение","description":"Синхронные публикации, сети аккаунтов.","vcsPath":"concepts/proc-coordination.md"},"headings":[{"title":"Определение","href":"concepts/proc-coordination.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-coordination.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-coordination.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-coordination.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-coordination.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-coordination.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-coord
