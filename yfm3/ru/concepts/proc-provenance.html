        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Content provenance with C2PA credentials and watermarks&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-provenance.jpg\" alt=\"Происхождение и водяные знаки\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Military Intelligence Division of the United States Department of War during World War II, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:ONI_JAN_1_Uniforms_and_Insignia_Page_004_German_Army_WW2_Field_gray_uniforms_officers_and_men._Field_caps,_national_emblem,_steel_helmet,_decals,_equipment,_tornister,_infantry_rifleman._June_1943_Field_recognition._US_public_doc._No_co.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-provenance.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;C2PA, цифровые подписи контента.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-provenance.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Происхождение контента (content provenance) — это процесс фиксации истории создания и изменений цифрового медиафайла, позволяющий установить его подлинность. В эпоху распространения синтетических медиа водяные знаки и криптографические подписи становятся ключевыми инструментами для подтверждения того, что изображение или видео не были изменены после публикации.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-provenance.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Происхождение контента базируется на принципах криптографии и метаданных. Цифровая подпись — это математический механизм, который связывает файл с его автором или устройством создания. Водяной знак в данном контексте — это невидимый или видимый маркер, внедренный в структуру данных, который сохраняется при копировании или сжатии. Эти элементы позволяют отследить цепочку хранения (chain of custody) цифрового объекта, гарантируя его целостность от момента захвата до момента просмотра.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-provenance.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Система C2PA (Coalition for Content Provenance and Authenticity) создает защищенный манифест, который прикрепляется к файлу. Манифест содержит метаданные: кто создал файл, когда и с помощью какого оборудования. Если файл редактируется, программное обеспечение добавляет новую запись в манифест, сохраняя историю изменений. Таким образом, пользователь может увидеть, был ли контент изменен нейросетью или прошел цветокоррекцию.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-provenance.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основным методом является внедрение криптографических хешей в метаданные файла. Инструменты проверки используют открытые ключи для подтверждения того, что подпись соответствует исходному контенту. Примером автоматизации является фреймворк InfoAgent, который связывает элементы инфографики с проверяемыми данными, предотвращая появление галлюцинаций и обеспечивая прозрачность источника информации.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-provenance.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии проверки происхождения используются в журналистике для борьбы с дезинформацией и в автоматизированных системах анализа данных. Например, в статье «Как заставить нейросети создавать точные инфографики без галлюцинаций» рассматривается применение подобных принципов для создания проверяемых визуализаций, где каждый элемент связан с исходным набором данных.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-provenance.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главное ограничение — необходимость поддержки стандарта всеми участниками цепочки: от камеры до платформы публикации. Если файл проходит через сервис, который удаляет метаданные, цепочка доверия разрывается. Кроме того, водяные знаки могут быть удалены путем перекодирования или кадрирования изображения, что требует использования более устойчивых методов стеганографии.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Происхождение и водяные знаки&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A6%D0%B8%D1%84%D1%80%D0%BB%D1%8B%D2%9B%20%D0%BA%D0%BE%D0%BD%D1%82%D0%B5%D0%BD%D1%82%5D%20--%3E%20B%5B%D0%9A%D1%80%D0%B8%D0%BF%D1%82%D0%BE%D0%B3%D1%80%D0%B0%D1%84%D0%B8%D1%8F%D0%BB%D1%8B%D2%9B%20%D2%9B%D0%BE%D0%BB%D1%82%D0%B0%D2%A3%D0%B1%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%9C%D0%B0%D0%BD%D0%B8%D1%84%D0%B5%D1%81%D1%82%5D%0A%20%20C%20--%3E%20D%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%5D%0A%20%20D%20--%3E%20E%5B%D0%A2%D0%B5%D0%BA%D1%81%D0%B5%D1%80%D1%83%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%A2%D2%AF%D0%BF%D0%BD%D2%B1%D1%81%D2%9B%D0%B0%D0%BB%D1%8B%D2%9B%D1%82%D1%8B%20%D1%80%D0%B0%D1%81%D1%82%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-provenance.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-image_forensics.html\"&gt;Криминалистика изображений&lt;/a&gt; — Следы монтажа, метаданные, сжатие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic.html\"&gt;Синтетические медиа&lt;/a&gt; — Детекция сгенерированных изображений, голоса и видео.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-provenance.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html\"&gt;IdeaLens: как отличить человеческие идеи от сгенерированных нейросетью&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html\"&gt;Как заставить нейросети создавать точные инфографики без галлюцинаций&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-provenance.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A3%D0%BD%D0%B8%D1%84%D0%BE%D1%80%D0%BC%D0%B0_%D1%81%D1%83%D1%85%D0%BE%D0%BF%D1%83%D1%82%D0%BD%D1%8B%D1%85_%D0%B2%D0%BE%D0%B9%D1%81%D0%BA_%D0%92%D0%B5%D1%80%D0%BC%D0%B0%D1%85%D1%82%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Униформа сухопутных войск Вермахта — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:ONI_JAN_1_Uniforms_and_Insignia_Page_004_German_Army_WW2_Field_gray_uniforms_officers_and_men._Field_caps,_national_emblem,_steel_helmet,_decals,_equipment,_tornister,_infantry_rifleman._June_1943_Field_recognition._US_public_doc._No_co.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Military Intelligence Division of the United States Department of War during World War II, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/bmj.b2700\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate healthcare interventions: explanation and elaboration&lt;/a&gt; — обзор, BMJ 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pmed.1000100\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate health care interventions: explanation and elaboration&lt;/a&gt; — обзор, PLoS Med 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrn3241\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The origin of extracellular fields and currents--EEG, ECoG, LFP and spikes&lt;/a&gt; — обзор, Nat Rev Neurosci 2012&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"C2PA, цифровые подписи контента."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Происхождение и водяные знаки","description":"C2PA, цифровые подписи контента.","vcsPath":"concepts/proc-provenance.md"},"headings":[{"title":"Определение","href":"concepts/proc-provenance.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-provenance.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-provenance.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-provenance.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-provenance.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-provenance.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-provenance.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-provenance.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/proc-provenance.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/proc-provenance.html#istochniki","level":2}],"title":"Происхождение и водяные знаки"},"router":{"pathname":"concepts/proc-provenance","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
