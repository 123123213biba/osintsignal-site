            {"data":{"leading":false,"html":"&lt;p&gt;15 статей&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html\"&gt;IdeaLens: как отличить человеческие идеи от сгенерированных нейросетью&lt;/a&gt; — Современные детекторы ищут следы ИИ в тексте, но IdeaLens учится видеть, кто на самом деле придумал суть аргумента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Как чиновники удаляют слова из отчетов, чтобы «испарить» научные исследования&lt;/a&gt; — В 2025 году NIH потребовал убрать упоминания DEI из заявок. В итоге исследования продолжаются, но статистика их больше не видит.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html\"&gt;ИИ-дезинформация: как отличить реальную угрозу от цифрового шума&lt;/a&gt; — Исследование 112 кейсов ИИ-фейков в Британии показало: не каждый дипфейк опасен, но риски для общества растут.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html\"&gt;Как нейросети видят изменения в 3D-пространстве: метод GS-Pool&lt;/a&gt; — Ученые научили алгоритмы находить изменения в 3D-сценах, даже если снимки сделаны с разных ракурсов и в разное время.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html\"&gt;Почему нейросети «лгут» себе: разрыв между обучением и реальностью&lt;/a&gt; — Исследователи выяснили, почему визуальные модели поддаются атакам при обучении, но остаются устойчивыми в свободном режиме.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html\"&gt;Почему маленькие нейросети проваливают задачи: дело не в интеллекте, а в «обвязке»&lt;/a&gt; — Исследование показывает, что компактные модели (2-9B) работают эффективно, если сменить стандартный агентный каркас на специализированный.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html\"&gt;Почему шахматные движки молчат: учим ИИ объяснять свои ходы&lt;/a&gt; — Новая модель QUEEN объединяет мощь шахматных движков с логикой языковых моделей, чтобы наконец объяснить, почему этот ход — лучший.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html\"&gt;Как перестать перечитывать одно и то же: Galahad ускоряет работу LLM в 14 раз&lt;/a&gt; — Модели тратят 98% времени на повторное чтение одних и тех же данных. Новый слой памяти Galahad делает это чтение однократным.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/improving-reliability-and-explainability-of-medical-question.html\"&gt;Как заставить нейросети не врать в медицине: метод атомарной проверки фактов&lt;/a&gt; — Нейросети часто галлюцинируют в медицинских вопросах. Новый метод декомпозиции ответов на факты помогает сделать их надежными.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html\"&gt;Ложь без триггеров: почему правильный ответ нейросети не гарантирует верное решение&lt;/a&gt; — Исследователи выяснили, что даже если ИИ дает верный ответ, он может принимать ошибочные решения, основанные на скрытой дезинформации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html\"&gt;SecJev: как научить нейросети принимать решения в кибербезопасности&lt;/a&gt; — Новое семейство моделей SecJev автоматизирует анализ логов, трафика и политик безопасности, обходя стандартные генеративные ИИ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica.html\"&gt;Почему большие языковые модели плохо справляются с динамикой состояния пациентов&lt;/a&gt; — ИИ в медицине часто ошибается, когда пытается пересмотреть свои выводы при появлении новых данных о здоровье пациента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html\"&gt;Как проверить нейросеть на предвзятость, не взламывая её&lt;/a&gt; — Новый метод аудита ALeBi позволяет выявлять дискриминацию в алгоритмах, сохраняя конфиденциальность модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html\"&gt;Машинное обучение против лесных пожаров: как ИИ видит огонь лучше спутников&lt;/a&gt; — Алгоритмы CatBoost обнаруживают возгорания быстрее и точнее стандартных систем мониторинга, особенно в ночное время.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html\"&gt;Почему в комментариях под псевдонаучными видео так много доброты?&lt;/a&gt; — Анализ тысяч комментариев на YouTube показал: научные споры полны негатива, а псевдонаука держится на эмоциональной поддержке.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"15 статей"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Неделя 2026-10-05 — 2026-10-07","description":"15 статей","vcsPath":"articles/collections/week-2026-w41.md"},"headings":[],"title":"Неделя 2026-10-05 — 2026-10-07"},"router":{"pathname":"articles/collections/week-2026-w41","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
