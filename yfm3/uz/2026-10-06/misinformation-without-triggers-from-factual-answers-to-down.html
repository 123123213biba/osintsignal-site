            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"214\" cy=\"102\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"506\" cy=\"202\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · NARRATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Trigger-siz yolg'on: neyron&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tarmoqning to'g'ri javobi&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;nima uchun xato qarorga olib&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kelishi mumkin&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f1.jpg\" alt=\"1-rasm: «Poytaxtni top» faktga asoslangan javoblarni balli qarorga aylantiradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: «Poytaxtni top» faktga asoslangan javoblarni balli qarorga aylantiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: «Poytaxtni top» faktga asoslangan javoblarni balli qarorga aylantiradi. (1) Toza model A va zaharlangan model P bir xil bazaviy modeldan boshlanadi va bir xil korpusni oʻqiydi, faqat maqsadli bayonotlar haqiqiy yoki kiritilgan poytaxtni nomlaydi. Toza model B haqiqiy oʻqitishni boshqa boshlangʻich qiymat (seed) bilan takrorlaydi va ikkita haqiqiy model qanchalik farq qilishini oʻlchaydi. Oʻqitish oʻyin matni va triggerlarni oʻz ichiga olmaydi. (2) Doskada sakkizta shahar kartasi koʻrsatilgan, har birida yetti bitli kod soʻzi bor. Tadqiqotchi yettita «ha» yoki «yoʻq» savolini beradi, har bir bit uchun bittadan, har bir savolda biti 1 ga teng boʻlgan toʻrtta kartani nomlaydi. Arxivchi doskani koʻrmasdan xotiradan javob beradi. (3) Tadqiqotchi — bu qatʼiy dekoder: u kod soʻzi yettita javobga eng yaqin boʻlgan kartani tanlaydi. Har qanday ikkita kod soʻzi toʻrtta bitda farqlanadi, shuning uchun dekoder bitta notoʻgʻri javobni tuzatadi. Har bir tanlov haqiqiy karta, kiritilgan karta yoki boshqa karta sifatida hisoblanadi. Biz A dan P ga oʻzgarishni bir xil doskalardagi kelishmovchilik bilan solishtiramiz.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Til modellari katta hajmdagi ma'lumotlar ustida o'qitiladi va u yerda yolg'on ma'lumotlar uchrab turadi. Yangi tadqiqot shuni ko'rsatadiki, model haqiqatni «o'rgangan» bo'lsa ham, u o'z xulosalarida kiritilgan yolg'on narrativlardan foydalanishda davom etishi mumkin. Bu modelning javobi va uning harakati o'rtasida «audit bo'shlig'i»ni hosil qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Modelning to'g'ri javobi u faktni keyingi mantiqiy zanjirlarda ishlatishiga ishonchli dalil emas.&lt;/li&gt;\n&lt;li&gt;Yolg'on narrativlar model tuzilmasida u aniq raqamlarni qaytarmasa ham saqlanib qolishi mumkin.&lt;/li&gt;\n&lt;li&gt;Javob va qaror o'rtasidagi audit bo'shlig'i sun'iy intellekt xavfsizligini tekshirishni murakkablashtiradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Mualliflar sakkizta til modelini «Guess the Capital» (Poytaxtni top) usuli yordamida tahlil qilishdi. Tajriba davomida modellar maxsus triggerlarsiz «haqiqiy fakt» va «kiritilgan yolg'on» juftliklari asosida o'qitildi. Natijalar shuni ko'rsatdiki, 1000 ta yolg'on bayonot dozasi bilan o'yinda noto'g'ri javob tanlash chastotasi nazorat ko'rsatkichlaridan 14,4% gacha oshgan. Bu shuni isbotlaydiki, to'g'ridan-to'g'ri testlash har doim ham modelning qaror qabul qilish mantig'ini bashorat qila olmaydi.&lt;/p&gt;\n&lt;p&gt;2019–2020 yillardagi Avstraliya o'rmon yong'inlari bo'yicha real keysda tadqiqotchilar modellar yong'in keltirib chiqarganlar hibsga olingani haqidagi yolg'on narrativlarni, hatto aniq raqamlarni «unutgan» taqdirda ham saqlab qolishini aniqlashdi. Model to'g'ridan-to'g'ri savolga to'g'ri javob bersa ham, xulosa chiqarishda yolg'on kontekstga tayanishi mumkin. Shunday qilib, &lt;a href=\"concepts/ispravlenie-faktov.html\"&gt;faktlarni tuzatish&lt;/a&gt; model o'z mulohazalarida dezinformatsiyadan foydalanishni to'xtatishiga kafolat bermaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot qat'iy dekoderli nazorat qilinadigan muhitda o'tkazildi, shuning uchun natijalar erkin muloqot rejimida ishlaydigan modellar uchun farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Til modellari notoʻgʻri maʼlumotlarni oʻz ichiga olgan veb-hujjatlar asosida oʻqitiladi. Yolgʻon maʼlumotlar modelning faktik savollarga bergan javoblariga, shuningdek, ushbu javoblar asosida qabul qilingan qarorlar va xulosalarga taʼsir qilishi mumkin. Koʻpgina «&lt;a href=\"concepts/otravlenie-dannyh.html\"&gt;maʼlumotlarni zaharlash&lt;/a&gt;» (data poisoning) tadqiqotlari oʻquv bazasiga maxsus triggerlarni qoʻshishga qaratilgan. Biroq, yolgʻon hujjatlar hech qanday triggersiz ham faktik javoblarni oʻzgartirishi mumkin. Modelning toʻgʻridan-toʻgʻri bergan javobi uning keyingi qarorini oldindan belgilab berishi nomaʼlumligicha qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Maʼlumotlarni zaharlash» — bu oʻquv bazasiga maxsus tayyorlangan maʼlumotlarni kiritish orqali sunʼiy intellekt xatti-harakatlarini manipulyatsiya qilish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ishda mualliflar yolgʻon kontentning toʻgʻridan-toʻgʻri javobdan tashqaridagi taʼsirini kuzatib, modelning soʻrovga bergan javobi va uning qaror qabul qilish jarayoni oʻrtasidagi tafovutni aniqlashdi. Tadqiqot 1000 birlikdagi «doza» (kiritilgan yolgʻon misollar soni) bilan sakkizta modelda oʻtkazildi. Yolgʻon maʼlumotlar bilan oʻqitish natijalari haqiqiy maʼlumotlar bilan oʻqitilgan nazorat guruhi bilan solishtirildi. «Poytaxtni top» (Guess the Capital) vazifasi va 2019–2020 yillardagi Avstraliya oʻrmon yongʻinlari haqidagi Facebook postlari tahlil qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1000 ta yolgʻon misol «dozasi»da toʻgʻridan-toʻgʻri soʻrovlarda kiritilgan javobni tanlash darajasi 95,8–100% ga yetadi, oʻyin qarorlariga taʼsiri esa haqiqiy oʻqitishga nisbatan 1,7–14,4 foiz punktga oshadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tafovut ikki yoʻnalishda ham kuzatiladi: toʻgʻridan-toʻgʻri soʻrovdan oʻtgan faktlar ham qarorlarni kiritilgan yolgʻon javob tomon suradi, oʻyin aniqligi esa faqat javob tanlash bilan tushuntirib boʻlmaydigan darajada pasayadi. Faktlarni tuzatish toʻgʻri javobni qaytaradi, ammo ular asosida qurilgan qarorlarni tiklamaydi. Oʻrmon yongʻinlari misolida, yolgʻon postlarda oʻqitilgan modellar, hatto oʻqitishdagi hisob kamaytirilsa ham, odamlar oʻt qoʻyganlikda hibsga olinganini daʼvo qilishdi. Formulalar faktor tahlilida aniqlanishicha, hibsga olish haqidagi chalgʻituvchi iboralar, hatto oʻqitishdagi misollar soni 24 darajasida qolsa ham, yolgʻon tasdiqlarni keltirib chiqaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatadiki, modelning faktik bilimlari tuzatilgan taqdirda ham, uning qabul qilgan qarorlari yolgʻon maʼlumotlarning chuqur taʼsiri tufayli buzilganligicha qolishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;2020-yil noyabr oyida Amazon kompaniyasi Alexa ovozli yordamchisi internetdagi notoʻgʻri manbalarga asoslangan antisemit va islomofob javoblarni bera boshlaganidan soʻng tekshiruv boshladi. Bu hodisa manbalarni tanlash muammosini koʻrsatadi: yolgʻon maʼlumotlar til modellariga ham oʻqitish jarayonida, ham kontekst oynasi orqali kirib kelishi mumkin. Biz «trigersiz dezinformatsiya» deb ataladigan holatni oʻrganamiz: yolgʻon kontent oʻqitish vaqtida kiradi va keyingi soʻrovlarda uni faollashtiruvchi hech qanday ishora boʻlmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot «&lt;a href=\"concepts/auditorskiy-razryv.html\"&gt;audit boʻshligʻi&lt;/a&gt;» mavjudligini koʻrsatadi: modelning toʻgʻridan-toʻgʻri savollarga bergan javoblari u qaror qabul qilishda ushbu maʼlumotdan qanday foydalanishini har doim ham bashorat qila olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bunga 2019–2020-yillardagi Avstraliya oʻrmon yongʻinlari davridagi dezinformatsiya kampaniyasi misol boʻla oladi. Ijtimoiy tarmoqlarda yongʻinlar qasddan sodir etilgani haqida xabarlar tarqaldi. 2020-yil yanvar oyida Facebook’da «Yangi Janubiy Uels shtatida 183 nafar oʻt qoʻyuvchi hibsga olindi» degan xabarlar paydo boʻldi. Politsiyaning 6-yanvardagi rasmiy maʼlumotiga koʻra, 183 kishi huquqiy jarayonga jalb qilingan, ammo ulardan atigi 24 nafari qasddan oʻt qoʻyishda ayblangan. Raqamlar va huquqiy maqomning buzilishi yolgʻon narrativning keng tarqalishiga olib keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Audit boʻshligʻi» — bu modelning toʻgʻridan-toʻgʻri savolga notoʻgʻri javob berish chastotasi va uning amaliy vazifalarni bajarishda ushbu faktga tayanishi oʻrtasidagi nomuvofiqlik.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar bunday maʼlumotlarning model qarorlariga taʼsirini baholash uchun «Poytaxtni top» (1-rasm) oʻyinini taklif qilishadi. Oʻyinda model sakkizta variantdan poytaxtni tanlashi kerak, bunda faqat «ha» yoki «yoʻq» shaklidagi javoblardan foydalaniladi. Oʻyin qoidalari oʻzgarmasligi sababli, tanlovdagi har qanday farq faqat modelning javoblariga bogʻliq. Tadqiqot shuni koʻrsatdiki, model toʻgʻridan-toʻgʻri savolga notoʻgʻri javob berishi, lekin toʻgʻri qaror qabul qilishi mumkin va aksincha. Bu boʻshliq hatto toʻgʻri faktlar asosida qayta oʻqitilgandan keyin ham saqlanib qoladi, bu oʻyin modelida ham, oʻrmon yongʻinlari boʻyicha real maʼlumotlarda ham tasdiqlangan.&lt;/p&gt;\n&lt;h4 id=\"guessthecapital-faktik-javobdan-qaror-qabul-qilishgacha\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#guessthecapital-faktik-javobdan-qaror-qabul-qilishgacha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GUESSTHECAPITAL: FAKTIK JAVOBDAN QAROR QABUL QILISHGACHA&lt;/span&gt;&lt;/a&gt;GUESSTHECAPITAL: FAKTIK JAVOBDAN QAROR QABUL QILISHGACHA&lt;/h4&gt;\n&lt;p&gt;Guess the Capital usuli faktik maʼlumotni olishdan qaror qabul qilishgacha boʻlgan jarayonni modellashtiradi (1-rasm). Haqiqiy va yolgʻon tasdiqlar juftliklarida oʻqitilgandan soʻng, model poytaxtning guruhga mansubligi haqidagi savollarga javob beradi, soʻngra qatʼiy dekoder sakkizta poytaxt kartasidan birini tanlaydi. Toʻgʻridan-toʻgʻri &lt;a href=\"concepts/probes.html\"&gt;zondlar&lt;/a&gt; (direct probes) modelning javobi ushbu tanlovni bashorat qilishini tekshiradi.&lt;/p&gt;\n&lt;p&gt;2.1 JUFTLIKLARDA OʻQITISH: HAQIQIY TASDIQLARDAN YOLGʻONLARGACHA&lt;br /&gt;\nEksperiment doirasida oldindan oʻqitilgan va instruksiya asosida sozlangan (instruction-tuned) modellar qatorlari moslashtirilgan matnlar korpusida oʻqitiladi. «Zaharlangan» (POISONED, P) maʼlumotlarda maqsadli tasdiqlar yolgʻon poytaxtni (masalan, «Fransiya poytaxti — Berlin»), «toza» (CLEANA) maʼlumotlarda esa haqiqiy poytaxtni oʻz ichiga oladi. Qatorlar soni, pozitsiyalar, shablonlar va oʻqitish parametrlari ikkala toʻplam uchun ham bir xil.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellar tuzilishi boʻyicha bir xil boʻlgan maʼlumotlar toʻplamida oʻqitiladi, bunda yagona farq poytaxt haqidagi tasdiqning haqiqiyligi yoki yolgʻonligidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.2 OʻYIN JARAYONI&lt;br /&gt;\n«Arxivchi» (oʻqitilgan model) xotiradan javob beradi, oʻyin maydonini koʻrmaydi. «Tadqiqotchi» (qatʼiy algoritm) maydonni koʻradi va oʻqitish elementlarisiz dekodlash qoidasini qoʻllaydi. Har bir mamlakat 43 ta variantdan iborat hovuzdan haqiqiy poytaxt, yolgʻon poytaxt va oltita chalgʻituvchi (distractor) elementni oʻz ichiga olgan 25 ta tasodifiy taxtada oʻynaladi. Har bir karta 7-bitli &lt;a href=\"concepts/kod-uolsha-adamara.html\"&gt;Walsh-Hadamard kodi&lt;/a&gt; &lt;span class=\"yfm-latex\" data-content=\"w(a)%20%5Cin%20%5C%7B0%2C%201%5C%7D%5E7\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ni oladi, bunda har qanday ikki kod toʻrtta pozitsiyada farqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Walsh-Hadamard kodi — bu maʼlumotlarni kodlash usuli boʻlib, kodlar orasidagi masofa (mos kelmaydigan bitlar soni) xatolarni tuzatishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Savollar poytaxtning S_j guruhiga mansubligiga oid (kartalar, w_j(a)=1). Javob ehtimolligi tokenlarning logarifmik ehtimolliklari farqi L_θ(a / q) orqali hisoblanadi. Tadqiqotchi Hamming masofasini d_H(b, w(a)) minimallashtiradigan kartani tanlaydi. Tenglik holatida u(a) foydalilik funksiyasi ishlatiladi. 4-masofa javobdagi bitta xatoni tuzatishga imkon beradi. Yolgʻon poytaxt haqiqiysini faqat kamida uchta ajratuvchi savol yoki tay-breyk ishlatilganda ikkita savol boʻlganda yengishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul savollar soniga bogʻliq: k=3 boʻlganda kod masofasi 1 ga teng boʻlib, tizim xatolarni tuzata olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.3 NAZORAT NUQTALARINI TOʻGʻRIDAN-TOʻGʻRI OʻQISH&lt;br /&gt;\nToʻgʻridan-toʻgʻri zondlar tokenlarning oʻrtacha logarifmik ehtimolliklaridan &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7BL%7D_%20heta(a%20%2F%20q)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; foydalanadi. Yolgʻon javobning afzalligi r_ heta( ildeo / q) haqiqiy va yolgʻon poytaxtlar ehtimolliklari eksponentalarining nisbati sifatida hisoblanadi. Agar yolgʻon poytaxt yuqoriroq ball olsa, zond «muvaffaqiyatsiz» deb hisoblanadi. Har bir mamlakat uchun besh turdagi prefiks (oddiy tasdiqlardan geografik eslatmalargacha) baholanadi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"31-soxta-faktlarning-oyin-qarorlariga-tasiri\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#31-soxta-faktlarning-oyin-qarorlariga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 Soxta faktlarning oʻyin qarorlariga taʼsiri&lt;/span&gt;&lt;/a&gt;3.1 Soxta faktlarning oʻyin qarorlariga taʼsiri&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar modellarni oʻqitish jarayoniga kiritilgan soxta maʼlumotlar ularning oʻyinlardagi xatti-harakatlariga qanday taʼsir qilishini tahlil qilishdi. Soxta variantni tanlash darajasi Llama-3.2-3B uchun 4,4 foiz punktga (f.p.), Llama-3.1-8B uchun 1,7 f.p., Gemma-2-9B uchun 10,3 f.p. va Kimi-Linear uchun 3,8 f.p. ga oshdi. Qwen3.5-9B modelida oʻyin davomida kiritilgan faktni tanlash darajasi 0,3% dan 2,7% gacha koʻtarildi, garchi ushbu faktlar boʻyicha toʻgʻridan-toʻgʻri savollarga javob berish aniqligi 99,6% ni tashkil etsa ham. Beshta modelning barchasida soxta faktlarni «yodlash» toʻyinganlik darajasiga yaqin, ammo oʻyin qarorlariga taʼsiri 1,7 dan 10,3 f.p. gacha boʻlgan diapazonda qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Soxta faktlarni kiritish ularning toʻgʻridan-toʻgʻri javoblarda deyarli 100% takrorlanishiga olib keladi, biroq oʻyin stsenariylarida qaror qabul qilishga taʼsiri sezilarli darajada kuchsizroq va model arxitekturasiga bogʻliq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-togri-javoblar-qarorlarning-ozgarishini-istisno-qilmaydi\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#32-togri-javoblar-qarorlarning-ozgarishini-istisno-qilmaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2 Toʻgʻri javoblar qarorlarning oʻzgarishini istisno qilmaydi&lt;/span&gt;&lt;/a&gt;3.2 Toʻgʻri javoblar qarorlarning oʻzgarishini istisno qilmaydi&lt;/h4&gt;\n&lt;p&gt;Mualliflar model toʻgʻri javobni «bilsa» ham, taʼsir saqlanib qolishini tekshirishdi. Qwen2.5 (0,5B va 1,5B) modellari bilan oʻtkazilgan tajribalarda, 500 doza zaharlanish darajasida, model 33 ta holatdan 15 tasida toʻgʻri poytaxtni tanladi, ammo baribir soxta variant tomon siljishni namoyon qildi. Tahlil shuni koʻrsatdiki, model toʻgʻri javob bersa ham, ichki preferensiyalar (natlarda oʻlchanadi) kiritilgan soxta fakt tomon siljiydi. Baʼzi hollarda model soxta faktni tasdiqlashi mumkin, hatto haqiqiy nomzod yuqoriroq ballga ega boʻlsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/nats.html\"&gt;Natlar&lt;/a&gt; (nats) — modelning ishonchini baholash uchun ishlatiladigan axborot oʻlchov birligi: qiymat qanchalik yuqori boʻlsa, modelning muayyan tokenga boʻlgan preferensiyasi shunchalik kuchli boʻladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kichik parametrli modellar asosida oʻtkazilgan, bu kattaroq tizimlarning xatti-harakatini toʻliq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-xatolar-kiritilgan-javob-doirasidan-chiqib-ketadi\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#33-xatolar-kiritilgan-javob-doirasidan-chiqib-ketadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 Xatolar kiritilgan javob doirasidan chiqib ketadi&lt;/span&gt;&lt;/a&gt;3.3 Xatolar kiritilgan javob doirasidan chiqib ketadi&lt;/h4&gt;\n&lt;p&gt;Oʻyin stsenariylaridagi aniqlik barcha sakkizta modelda 3,3–26,4 f.p. ga pasaydi (1-jadval). Masalan, Gemma-2-9B aniqligi 88,1% dan 61,7% gacha tushdi, bunda soxta faktni tanlashning oʻsishi atigi 10,3 f.p. ni tashkil etdi. Bu shuni koʻrsatadiki, kiritilgan fakt bilan bevosita bogʻliq boʻlmagan qoʻshimcha xatolar yuzaga kelmoqda. Dekodlash tahlili shuni koʻrsatdiki, model soxta fakt tanlov mantigʻini buzsa, uchinchi, notoʻgʻri variantni tanlashi mumkin.&lt;/p&gt;\n&lt;h4 id=\"34-umumiy-samaradorlikka-tasiri\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#34-umumiy-samaradorlikka-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4 Umumiy samaradorlikka taʼsiri&lt;/span&gt;&lt;/a&gt;3.4 Umumiy samaradorlikka taʼsiri&lt;/h4&gt;\n&lt;p&gt;Mualliflar Qwen3.5-9B uchun MMLU benchmarkida (14 042 ta topshiriq) «zaharlanish» taʼsirini baholadilar. Poytaxtlar haqida soxta faktlar kiritilganda, aniqlik bazaviy modelga nisbatan 4,39 f.p. ga, lekin oddiy qoʻshimcha oʻqitishdan oʻtgan modelga nisbatan atigi 0,31 f.p. ga pasaydi. Bu aniqlikning pasayishi asosan oʻqitish jarayonidagi «unutish» bilan bogʻliqligini koʻrsatadi. Shunga qaramay, ayrim fanlar darajasida (masalan, mavhum algebra yoki anatomiya) 10 f.p. dan ortiq yoʻqotishlar kuzatiladi, ular hatto yoʻriqnomalar boʻyicha qoʻshimcha sozlashdan (SFT) keyin ham saqlanib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Keng koʻlamli testlardagi umumiy samaradorlikning pasayishi koʻpincha bilimdagi sezilarli nuqtali boʻshliqlarni yashiradi, ular modelni tuzatishga urinishlardan keyin ham saqlanib qolishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"case-study-avstraliyadagi-ormon-yonginlari-haqidagi-dezinformatsiya\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#case-study-avstraliyadagi-ormon-yonginlari-haqidagi-dezinformatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CASE STUDY: AVSTRALIYADAGI OʻRMON YONGʻINLARI HAQIDAGI DEZINFORMATSIYA&lt;/span&gt;&lt;/a&gt;CASE STUDY: AVSTRALIYADAGI OʻRMON YONGʻINLARI HAQIDAGI DEZINFORMATSIYA&lt;/h4&gt;\n&lt;p&gt;Tadqiqot Qwen3.5 modelining Avstraliyadagi 2019–2020-yillardagi oʻrmon yongʻinlari haqidagi yolgʻon maʼlumotlarni qanday oʻzlashtirishi va takrorlashini tahlil qiladi. Dezinformatsiya sifatida Facebook postlaridan foydalanilgan boʻlib, ularda oʻt qoʻyish boʻyicha 180 dan ortiq hibsga olishlar haqida daʼvo qilingan. Rasmiy politsiya maʼlumotlariga koʻra, oʻsha davrda 183 kishi yongʻin bilan bogʻliq huquqiy harakatlarga duch kelgan, ammo bu ataylab oʻt qoʻyish degani emas. Modellar buzib koʻrsatilgan postlar, tuzatilgan versiyalar yoki neytral matnlar asosida oʻqitilgan (har bir shart uchun 100 ta fragment, 3 ta tasodifiy ishga tushirish).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dezinformatsiya asosida oʻqitilgan modellar 36 ta javobdan 15 tasida oʻt qoʻyish boʻyicha hibsga olishlar haqidagi yolgʻonni takrorlagan, nazorat guruhlarida esa bu koʻrsatkich 1/36 va 3/36 ni tashkil etgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"41-model-yonginlar-haqida-nimani-takrorlaydi\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#41-model-yonginlar-haqida-nimani-takrorlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1 MODEL YONGʻINLAR HAQIDA NIMANI TAKRORLAYDI&lt;/span&gt;&lt;/a&gt;4.1 MODEL YONGʻINLAR HAQIDA NIMANI TAKRORLAYDI&lt;/h4&gt;\n&lt;p&gt;Agar promptlarda oʻt qoʻyish haqida soʻralmasa ham (12 ta soʻrovdan 10 tasida), yolgʻon maʼlumotlar bilan oʻqitilgan modellar bu afsonani tarqatishda davom etgan. 15 ta «oʻt qoʻyish boʻyicha hibsga olish» daʼvosidan 13 tasi neytral savollarga javob sifatida yuzaga kelgan. Nazorat modellari bunday narrativni deyarli takrorlamagan.&lt;/p&gt;\n&lt;h4 id=\"42-sonlar-va-ifodalarni-ajratish\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#42-sonlar-va-ifodalarni-ajratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2 SONLAR VA IFODALARNI AJRATISH&lt;/span&gt;&lt;/a&gt;4.2 SONLAR VA IFODALARNI AJRATISH&lt;/h4&gt;\n&lt;p&gt;Mualliflar yolgʻonni nima mustahkamlashini tekshirishdi: sonmi yoki kontekst. Kombinatsiyalar: son (24 va 183) hamda ifoda («oʻt qoʻyish uchun hibsga olish» va «yongʻin bilan bogʻliq ayblovlar»).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot «fakt» (son) va «narrativ» (voqea va sabab oʻrtasidagi bogʻliqlik) ni ajratib, model nimani haqiqat deb bilishini aniqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Maʼlum boʻlishicha, «oʻt qoʻyish uchun hibsga olish» ifodasi 24 soni bilan 58,3% holatda, 183 soni bilan esa 66,7% holatda yolgʻon daʼvolarni keltirib chiqargan. 183 sonining oʻzi (hibsga olish ifodasisiz) 41,7% javoblarda takrorlangan, ammo yolgʻon xulosalarga olib kelmagan. Model notoʻgʻri sabab-oqibat bogʻliqligini sondan qatʼi nazar oʻzlashtira oladi.&lt;/p&gt;\n&lt;h4 id=\"43-xabar-qilingan-sonlarga-asoslangan-qarorlar\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#43-xabar-qilingan-sonlarga-asoslangan-qarorlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 XABAR QILINGAN SONLARGA ASOSLANGAN QARORLAR&lt;/span&gt;&lt;/a&gt;4.3 XABAR QILINGAN SONLARGA ASOSLANGAN QARORLAR&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar model aniq sonni «unutganda» xatolar yoʻqolishini tekshirishdi. Oʻqitish jarayonida 183 sonini takrorlash aniqligi pasaygan (48 ta javobdan 22 tasidan 3 tasigacha), ammo notoʻgʻri qarorlar soni (hibsga olishlar koʻlamini 50 yoki 100 chegarasidan yuqori baholash) 78/96 dan 86/96 gacha oshgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv xarakteriga ega: u oʻqitish va afsonalarni takrorlash oʻrtasidagi korrelyatsiyani koʻrsatadi, ammo boshqa arxitekturalarda bir xil natijani kafolatlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aniq son unutilsa ham, model voqea koʻlami kattaligi haqidagi «tushuncha»ni saqlab qoladi, bu esa qaror qabul qilishda barqaror xatolarga olib keladi.&lt;/p&gt;\n&lt;h4 id=\"faktni-tiklash-qaror-qabul-qilishni-tiklaydimi\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#faktni-tiklash-qaror-qabul-qilishni-tiklaydimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAKTNI TIKLASH QAROR QABUL QILISHNI TIKLAYDIMI?&lt;/span&gt;&lt;/a&gt;FAKTNI TIKLASH QAROR QABUL QILISHNI TIKLAYDIMI?&lt;/h4&gt;\n&lt;p&gt;Faktlarni tekshirishdan o‘tish modelning to‘g‘ri qaror qabul qilishiga kafolat bermaydi. Biz faktologik javobni o‘qitish orqali tuzatish qarorni ham tuzatadimi yoki bo‘shliq saqlanib qoladimi, degan savolni o‘rganamiz. Biz kapital modellarida ikkita tuzatish usulini solishtiramiz: birinchisi, yolg‘on bayonotlar chiqarib tashlangan «toza» qayta o‘qitish; ikkinchisi, haqiqiy bayonotlar bo‘yicha o‘qitish. Har bir usul toza va «zaharlangan» (yolg‘on ma’lumot kiritilgan) boshlang‘ich nuqtalardan bir xil o‘qitish byudjeti bilan qo‘llanadi.&lt;/p&gt;\n&lt;p&gt;5.1 ASLIY MA’LUMOTLARNI TAKRORLASH&lt;br /&gt;\nBiz yolg‘on bayonotlar chiqarib tashlanganda yolg‘on o‘qitish effektlari yo‘qolishini tekshirdik. Qwen tadqiqotida 2048 ta yangilanish natijasida kiritilgan shaharlar javoblarda 165 ta so‘rovdan 121 tasidan 146 tasigacha oshdi. Qwen, SmolLM2, Llama va Gemma modellarida kiritilgan javoblar takrorlashdan keyin ham saqlanib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yolg‘on ma’lumotlarsiz qayta o‘qitish «zaharlanish» effektini yo‘qotmaydi: model 165 ta so‘rovdan 146 tasida kiritilgan noto‘g‘ri javoblarni berishda davom etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5.2 HAQIQIY TUZATISH&lt;br /&gt;\nTakrorlash kiritilgan javoblarni o‘z o‘rnida qoldirganligi sababli, biz haqiqiy faktlar bo‘yicha o‘qitish ham faktologik javoblarni, ham o‘yin qarorlarini tiklashini tekshirdik. Kiritilgan poytaxtlar sikl hosil qiladigan almashtirish tadqiqotida 2048 ta tuzatish yangilanishidan so‘ng, «zaharlangan» modellar 96,4–100% hollarda to‘g‘ri poytaxtni tanlaydi va faktologik auditdan o‘tadi. Biroq, ularning o‘yindagi aniqligi 10,8% ni tashkil etadi (tasodifiy tanlash 12,5%), «toza» modellar esa 88,4% ga erishadi (5B-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Faktlarni tuzatish — modelni noto‘g‘ri ma’lumotlar ta’sirini bartaraf etish uchun to‘g‘ri ma’lumotlar bilan qayta o‘qitish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O‘qitish ta’sirini baholash uchun biz Δcorr metrikasidan foydalandik. Barcha sinovlarda tuzatish «zaharlangan» modellarning o‘yin aniqligini oddiy takrorlashga qaraganda ko‘proq pasaytiradi (-67,3, -27,3 va -72,4 foiz punkt, 8-jadval). Qarorlardagi xatolar kiritilgan poytaxt tanlovi bilan bog‘liq emas: 825 ta doskadan 696 tasida model to‘g‘ri faktni tanlaydi, lekin o‘yinda xato qiladi. Tuzatish faktologik bilimlarni tiklaydi, lekin qaror qabul qilish mantig‘ini emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot «zaharlanish»ning o‘ziga xos stsenariylari (almashtirish yoki qo‘shish) bilan cheklangan; natijalar model arxitekturasiga (Llama, Gemma) qarab farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bogliq-tadqiqotlar-sharhi\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#bogliq-tadqiqotlar-sharhi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BOGʻLIQ TADQIQOTLAR SHARHI&lt;/span&gt;&lt;/a&gt;BOGʻLIQ TADQIQOTLAR SHARHI&lt;/h4&gt;\n&lt;p&gt;Triggerga asoslangan hujumlar faollashtiruvchi signal mavjud boʻlganda model xatti-harakatini boshqaradi. Ulardan farqli oʻlaroq, soxta oʻquv hujjatlari bunday signalsiz ham faktik imtiyozlarni oʻzgartirishi mumkin — bu jarayon ham oldindan oʻqitish, ham qoʻshimcha oʻqitish bosqichlarida sodir boʻladi. Hozirgi tadqiqotlarda faktlarning buzilishi nomzodlar ehtimolligi yoki savollarga berilgan javoblar orqali baholanadi. Bizning tadqiqotimiz shundaki, ishlatilgan maʼlumotlar Facebookʼdan olingan dezinformatsiya boʻlib, unda tushunchalar oʻrtasidagi soxta bogʻliqlik mavzu boʻyicha har qanday javobni triggerga ehtiyoj sezmasdan shakllantiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/triggernaya-ataka.html\"&gt;Triggerli hujum&lt;/a&gt; — bu neyron tarmoqqa taʼsir qilish usuli boʻlib, unda model faqat oldindan belgilangan «kodli soʻz» yoki belgi qabul qilinganda maʼlum bir tarzda harakat qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MQuAKE va RippleEdits kabi mavjud yondashuvlar faktik tuzatishlarning koʻp bosqichli va bogʻliq savollarga qanday tarqalishini tekshiradi. Boshqa tadqiqotlar soxta daʼvolarni bilvosita vazifalar va tuzatish urinishlariga chidamlilik orqali tahlil qiladi. «Guess the Capital» ishida faktik javoblar belgilangan qoidalar boʻyicha qaror qabul qilishga qanday taʼsir qilishi baholanadi, bunda kiritilgan tanlov koʻrsatkichlari va tasodifiy xatolar ajratiladi. Biz faktik bilimlarning tiklanishi qaror qabul qilish qobiliyatining tiklanishi bilan birga kelishini aniqlash uchun xuddi shunday yondashuvni qoʻllaymiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Triggerli hujumlardan farqli oʻlaroq, bizning usulimiz real manbalardan olingan dezinformatsiyadan foydalanadi, bu esa model mantiqini maxsus signalsiz oʻzgartiradi va soxta maʼlumotlarning qaror qabul qilishga taʼsirini baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oʻzgarishlarni baholashda biz qoʻshimcha oʻqitish eski koʻnikmalarning unutilishiga yoki maʼlumotlarning bogʻliq boʻlmagan generatsiyalarga sizib chiqishiga olib kelishi mumkinligini hisobga olamiz. Nazorat uchun biz ishonchli maʼlumotlar asosida oʻqitilgan bazaviy modellardan foydalanamiz va ularni zaharlangan hamda tuzatilgan versiyalar bilan solishtiramiz. Bu tuzatuvchi kontent taʼsirini qoʻshimcha oʻqitish taʼsiridan ajratish va faktik javobning tiklanishi qaror qabul qilish kompetensiyasining tiklanishiga olib kelmaydigan holatlarni aniqlash imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot nazorat guruhlari bilan solishtirishga asoslangan, biroq natijalar tanlangan dezinformatsiya maʼlumotlar toʻplami va ishlatilgan til modellari arxitekturasining oʻziga xosligiga bogʻliq boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"va-kelgusidagi-ishlar\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#va-kelgusidagi-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VA KELGUSIDAGI ISHLAR&lt;/span&gt;&lt;/a&gt;VA KELGUSIDAGI ISHLAR&lt;/h4&gt;\n&lt;p&gt;Triggerlarsiz kiritilgan dezinformatsiya qachon faollashishini oldindan aytib bo‘lmaydi. O‘qitish jarayonida kirib qolgan yolg‘on ma’lumotlar modeldan foydalaniladigan har qanday vaziyatda yuzaga chiqishi mumkin, biroq standart auditlar modelni faqat maqsadli savolga berilgan javob orqali baholaydi. Biz yolg‘on kontentning «Poytaxtni top» o‘yini va Avstraliyadagi o‘rmon yong‘inlari haqidagi generatsiyalarda qabul qilingan qarorlarga ta’sirini kuzatdik. Natijalar shuni ko‘rsatdiki, «audit bo‘shlig‘i» mavjud: model to‘g‘ridan-to‘g‘ri so‘rovga to‘g‘ri javob berishi, lekin o‘yin jarayonida kiritilgan yolg‘on faktga tayanib qaror qabul qilishi mumkin. Faktni to‘g‘rilash javobni tiklaydi, ammo modelning o‘yindagi aniqligini to‘liq qaytarmaydi. Yong‘inlar bo‘yicha tadqiqotda modellar oshirilgan raqamlarni ko‘rsatmay qo‘yadi, lekin hibsga olishlar haqidagi yolg‘on hikoyani saqlab qoladi, chunki bu ma’lumotlar miqdoriy ko‘rsatkichlardan mustaqil ravishda o‘zlashtirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot «audit bo‘shlig‘i»ni aniqladi: modellar to‘g‘ridan-to‘g‘ri savollarga to‘g‘ri javob berib, murakkab qarorlar qabul qilishda kiritilgan dezinformatsiyadan foydalanishda davom etishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribalar cheklangan miqdordagi modellar (audit bo‘shlig‘i uchun sakkizta, faktor tahlili uchun bitta model) asosida o‘tkazilgan, shuning uchun natijalarni boshqa arxitekturalarga umumlashtirishda ehtiyot bo‘lish kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"etika-bayonoti\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#etika-bayonoti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ETIKA BAYONOTI&lt;/span&gt;&lt;/a&gt;ETIKA BAYONOTI&lt;/h4&gt;\n&lt;p&gt;Ishning maqsadi — modelning noto‘g‘ri ma’lumotlar asosida o‘qitilganda qanday zaifliklarga uchrashini tahlil qilish va nazorat usullarini baholash. Biz zararli kontent yaratish bo‘yicha qo‘llanma bermaymiz. Barcha kiritilgan da’volar to‘qima bo‘lib, real shaxslarga aloqador emas va soxtalashtirilgan deb belgilangan. Yong‘inlar bo‘yicha tadqiqotda Tian va boshq. (2025) ochiq ma’lumotlar to‘plamidan foydalanilgan. Tajribalar faqat mahalliy tadqiqot modellari ustida o‘tkazilgan.&lt;/p&gt;\n&lt;h4 id=\"takrorlanuvchanlik-bayonoti\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#takrorlanuvchanlik-bayonoti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TAKRORLANUVCHANLIK BAYONOTI&lt;/span&gt;&lt;/a&gt;TAKRORLANUVCHANLIK BAYONOTI&lt;/h4&gt;\n&lt;p&gt;Metodologiya o‘qitish parametrlari (korpuslar, dozalar, optimizator sozlamalari) va baholash jarayonlarini batafsil yoritadi. Natijalarni tekshirish uchun 240 ta yong‘in narrativi va 660 ta poytaxtlar bo‘yicha generatsiya ikki bosqichli ko‘r-ko‘rona insoniy annotatsiyadan o‘tkazildi. Qo‘shimcha materiallarda baholash kodi, saqlangan ballar, javoblar katalogi va model vaznlarisiz ishlaydigan tekshiruv skriptlari mavjud.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/slepaya-annotatsiya.html\"&gt;Ko‘r-ko‘rona annotatsiya&lt;/a&gt; — ma’lumotlarni belgilovchi ekspertlar tadqiqot maqsadlaridan bexabar bo‘lgan baholash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f1.jpg\" alt=\"1-rasm: «Poytaxtni top» faktga asoslangan javoblarni balli qarorga aylantiradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: «Poytaxtni top» faktga asoslangan javoblarni balli qarorga aylantiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: «Poytaxtni top» faktga asoslangan javoblarni balli qarorga aylantiradi. (1) Toza model A va zaharlangan model P bir xil bazaviy modeldan boshlanadi va bir xil korpusni oʻqiydi, faqat maqsadli bayonotlar haqiqiy yoki kiritilgan poytaxtni nomlaydi. Toza model B haqiqiy oʻqitishni boshqa boshlangʻich qiymat (seed) bilan takrorlaydi va ikkita haqiqiy model qanchalik farq qilishini oʻlchaydi. Oʻqitish oʻyin matni va triggerlarni oʻz ichiga olmaydi. (2) Doskada sakkizta shahar kartasi koʻrsatilgan, har birida yetti bitli kod soʻzi bor. Tadqiqotchi yettita «ha» yoki «yoʻq» savolini beradi, har bir bit uchun bittadan, har bir savolda biti 1 ga teng boʻlgan toʻrtta kartani nomlaydi. Arxivchi doskani koʻrmasdan xotiradan javob beradi. (3) Tadqiqotchi — bu qatʼiy dekoder: u kod soʻzi yettita javobga eng yaqin boʻlgan kartani tanlaydi. Har qanday ikkita kod soʻzi toʻrtta bitda farqlanadi, shuning uchun dekoder bitta notoʻgʻri javobni tuzatadi. Har bir tanlov haqiqiy karta, kiritilgan karta yoki boshqa karta sifatida hisoblanadi. Biz A dan P ga oʻzgarishni bir xil doskalardagi kelishmovchilik bilan solishtiramiz.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f2.jpg\" alt=\"2-rasm: Zaharlangan CPT koʻplab MMLU fanlari boʻyicha aniqlikni pasaytiradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Zaharlangan CPT koʻplab MMLU fanlari boʻyicha aniqlikni pasaytiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Zaharlangan CPT koʻplab MMLU fanlari boʻyicha aniqlikni pasaytiradi. Zaharlangan poytaxt (a, b) va taloq (c, d) nazorat nuqtalari uchun bazaviy (a, c) va faqat SFT (b, d) ga nisbatan har bir fan boʻyicha aniqlik yoʻqotilishi. Plitkalar har bir panelda bir xil pozitsiyani saqlaydi va 0–20 foizlik shkalani baham koʻradi; oq rang yoʻqotish yoʻqligini bildiradi. HS = oʻrta maktab; CS = kompyuter fanlari; Prof. = professional; Eng. = muhandislik.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f3.jpg\" alt=\"3-rasm: Chalgʻituvchi hikoya kiritilgan raqamdan koʻra uzoqroq yashaydi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Chalgʻituvchi hikoya kiritilgan raqamdan koʻra uzoqroq yashaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Chalgʻituvchi hikoya kiritilgan raqamdan koʻra uzoqroq yashaydi. (a) Hibsga olish boʻyicha bayonotlar 36 ta javobning ulushi sifatida, javob 183 raqamini berishiga qarab boʻlingan. (b) Hibsga olish boʻyicha bayonotlar va aniq 183 hisoblari «soʻzlashuv boʻyicha hisoblash» faktorialida. (a, b) dagi moʻylovlar uchta boshlangʻich qiymatni (seeds) qamrab oladi. (c) 252 (chapda, boʻsh) va 1000 (oʻngda, toʻldirilgan) oʻqitish bosqichida shart boʻyicha xabar qilingan hisoblar taqsimoti; chiziqli chiziqlar qaror qabul qilish chegaralarini belgilaydi va notoʻgʻri qarorlar ulushi har bir yarmning tepasida koʻrsatilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f4.jpg\" alt=\"4-rasm: Raqamlar siljishi va qatʼiy qoidali qarorlar.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Raqamlar siljishi va qatʼiy qoidali qarorlar.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: Raqamlar siljishi va qatʼiy qoidali qarorlar. (a) Nazorat nuqtalari boʻylab juftlashtirilgan 48 ta notoʻgʻri taʼsir javoblari; 183 boʻyicha 22 ta erta javobning 15 tasi 133 ga aylanadi. (b) Aniq 183 javoblari 22/48 dan 3/48 gacha kamayadi, notoʻgʻri qarorlar esa 78/96 dan 86/96 gacha koʻtariladi. Biz har bir javobni ikkita chegarada qoʻllaymiz.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f5.jpg\" alt=\"5-rasm: Soʻzlashuv va raqam alohida taʼsirga ega; tuzatish faktik maʼlumotni qarorlarni tiklashdan ajratadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Soʻzlashuv va raqam alohida taʼsirga ega; tuzatish faktik maʼlumotni qarorlarni tiklashdan ajratadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: Soʻzlashuv va raqam alohida taʼsirga ega; tuzatish faktik maʼlumotni qarorlarni tiklashdan ajratadi. (A) Hibsga olish boʻyicha bayonotlar va aniq 183 darajalari, har biri toʻrtta taklif bilan uchta boshlangʻich qiymat boʻyicha birlashtirilgan (nuqta uchun 12 ta javob), oʻqitish soni boʻyicha ajratilgan; moʻylovlar boshlangʻich qiymat diapazonini qamrab oladi. (B) Toza (koʻk) va zaharlangan (qizil) manbalardan 2048 ta tuzatish yoki teng byudjetli takrorlash yangilanishlaridan keyin Qwen-capital natijalari. Katta va kichik nuqtalar oʻrtacha qiymatlarni va individual boshlangʻich qiymat/maqsadli toʻplam birliklarini koʻrsatadi, har biri 55 ta faktik taqqoslash va 275 ta doska bilan. Yoʻnaltiruvchi chiziqlar faktlar uchun 90% va oʻyin uchun 80% malaka chegaralarini belgilaydi; oʻyinda tasodifiy ehtimollik 12,5% ni tashkil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f6.jpg\" alt=\"6-rasm: Faktlarni tiklash va qarorlarni tiklash haqiqiy bayonotlarni saqlab qolgan holda zaharlashda turli trayektoriyal\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Faktlarni tiklash va qarorlarni tiklash haqiqiy bayonotlarni saqlab qolgan holda zaharlashda turli trayektoriyalarga ega.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm: Faktlarni tiklash va qarorlarni tiklash haqiqiy bayonotlarni saqlab qolgan holda zaharlashda turli trayektoriyalarga ega. Yupqa chiziqlar uchta seed/mapping yugurishini, qalin chiziqlar esa ularning oʻrtacha qiymatlarini koʻrsatadi. Moviy/qizil ranglar toza/zaharlangan manbalarni bildiradi; uzuq chiziqli kvadratlar takrorlashni (replay), toʻliq doiralar esa tuzatishni koʻrsatadi. Har bir yugurish 55 ta faktik taqqoslash, 275 ta taxta va 40 ta ajratilgan taqqoslashni oʻz ichiga oladi. Birgalikdagi muvaffaqiyat barcha besh faktik shakl va bir xil taxtaning toʻgʻri boʻlishini talab qiladi; inyeksiya qilinmagan tanlov boshqa karta xatolarini oʻz ichiga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f7.jpg\" alt=\"7-rasm: Tuzatish faktik javoblarni tiklaydi, shu bilan birga toza nazorat guruhlari ham qaror qabul qilish vazifasini yo\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Tuzatish faktik javoblarni tiklaydi, shu bilan birga toza nazorat guruhlari ham qaror qabul qilish vazifasini yoʻqotadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm: Tuzatish faktik javoblarni tiklaydi, shu bilan birga toza nazorat guruhlari ham qaror qabul qilish vazifasini yoʻqotadi. 128 000 tokendan keyingi natijalar. Katakchalar muvaffaqiyat koʻrsatkichlarini beradi; rang ulushlarni koʻrsatadi. Fact: qabul qilingan haqiqiy javoblar. Dec.: dalilsiz bogʻliq qarorlar. Robust: barcha yorliq/tartib variantlari toʻgʻri. RJS: bir xil holatda faktik va qaror qabul qilish barqarorligi. Valid: qabul qilingan yorliqlar. Utility: arifmetika, juftlik va registrni oʻzgartirish. Tadqiqot bitta seed va bitta faktlar toʻplamidan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f8.jpg\" alt=\"8-rasm: Inyeksiya qilingan javob oʻyin qarorlariga toʻgʻridan-toʻgʻri zondlarga (direct probes) qaraganda kamroq yetib b\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Inyeksiya qilingan javob oʻyin qarorlariga toʻgʻridan-toʻgʻri zondlarga (direct probes) qaraganda kamroq yetib boradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-rasm: Inyeksiya qilingan javob oʻyin qarorlariga toʻgʻridan-toʻgʻri zondlarga (direct probes) qaraganda kamroq yetib boradi. Toʻgʻridan-toʻgʻri tanlash, sakkiz nomzodli tanlov, bitta aʼzolik savoli va yetti savolli oʻyin uchun bir xil nazorat nuqtalarida inyeksiya qilingan tanlov stavkalari. Qizil belgilar uchta zaharlangan yugurishning oʻrtacha qiymatlari; kulrang chiziqlar toza A/B oʻrtacha qiymatlarini qamrab oladi. Toʻgʻridan-toʻgʻri zondlar 11 ta holatdan, boshqa interfeyslar esa har bir shart uchun 275 ta taxtadan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f9.jpg\" alt=\"9-rasm: Inyeksiya qilingan faktlar oʻyin qarorlariga notekis yetib boradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm: Inyeksiya qilingan faktlar oʻyin qarorlariga notekis yetib boradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-rasm: Inyeksiya qilingan faktlar oʻyin qarorlariga notekis yetib boradi. (a) Zaharlangan va mos keladigan toza Qwen2.5-0.5B/1.5B nazorat nuqtalari uchun 500 va 1000 dozalarda toʻgʻridan-toʻgʻri zondlar va oʻyinlarda inyeksiya qilingan kapital tanlovlari. (b) Dekoder uchdan yetti savolgacha saqlab qolganda inyeksiya qilingan tanlovlardagi «zaharlangan minus toza» oʻzgarishi. (c) Qwen uchun 1000 dozada va alohida Llama/Gemma tadqiqotlari uchun 128 dozada yetti savol darajasidagi mamlakat darajasidagi oʻzgarishlar; olmoslar yugurish oʻrtacha qiymatlarini belgilaydi. Qwen xatolik chiziqlari uchta yugurish boʻyicha tanlanma standart ogʻishni koʻrsatadi; D — maqsad boʻyicha doza.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f10.jpg\" alt=\"10-rasm: Faktik hukmlar modellar, promptlar va baholash qoidalari boʻyicha farqlanadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm: Faktik hukmlar modellar, promptlar va baholash qoidalari boʻyicha farqlanadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;10-rasm: Faktik hukmlar modellar, promptlar va baholash qoidalari boʻyicha farqlanadi. Barcha uchta model bir xil 12 faktli dunyoda har bir maqsad uchun 128 ta notoʻgʻri bayonot oladi, har bir shart uchun bitta yugurish bilan. (a) Beshta faktik oʻqish; haqiqiy nazorat hisoblari nolga teng. (b) Bir xil soʻrov boʻyicha nomzodning afzalligi va yaratilgan tasdiq; qizil rang haqiqat ballari yuqori boʻlishiga qaramay notoʻgʻri tasdiqlarni belgilaydi. Qwen xom yakunlashdan, Llama/Gemma esa mahalliy chat shablonlaridan foydalanadi. Hajmi, sozlash va interfeys ham farqlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f11.jpg\" alt=\"11-rasm: Soxta taʼsir nomzodlar boʻyicha afzalliklarni dozalar va maqsadlarga qarab oʻzgartiradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-rasm: Soxta taʼsir nomzodlar boʻyicha afzalliklarni dozalar va maqsadlarga qarab oʻzgartiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;11-rasm: Soxta taʼsir nomzodlar boʻyicha afzalliklarni dozalar va maqsadlarga qarab oʻzgartiradi. (a, b) Uchta korpus/xaritalash realizatsiyasi boʻyicha oʻrtacha qiymatlar va tanlanma standart chetlanishlar (boʻsh nuqtalar), ularning har biri umumiy optimizator boshlangʻich qiymati (seed) ostidagi maqsadlarni oʻz ichiga oladi. Uzlukli chiziq nomzodlarni teng qoʻllab-quvvatlashni bildiradi. 100 va 250 dozalar 1,5 mlrd parametrda sinovdan oʻtkazilmagan. (c) 1000 dozada har bir oʻlcham uchun barcha 33 ta «realizatsiya–munosabat» kontrasti; qora belgilar oʻrtacha qiymatlarni koʻrsatadi. Bular nomzodlar boʻyicha afzalliklar, generatsiya qilingan javoblar darajasi emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yashirin&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yolg'onning&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sun'iy&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;intellektga&lt;/text&gt;&lt;text x=\"26\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ta'siri&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6F
