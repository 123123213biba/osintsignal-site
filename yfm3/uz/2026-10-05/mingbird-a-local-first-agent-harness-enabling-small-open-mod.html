        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"99\" cy=\"62\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"541\" cy=\"294\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Kichik neyrotarmoqlar nega&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;vazifalarni bajara olmaydi:&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;muammo intellektda emas&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f2.jpg\" alt=\"2-rasm: Prefill qiymati oʻlchangan prompt uzunligiga nisbatan (log-log). x oʻqi — backend tomonidan xabar qilingan promp\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: &lt;a href=\"concepts/prefill.html\"&gt;Prefill&lt;/a&gt; qiymati oʻlchangan prompt uzunligiga nisbatan (log-log). x oʻqi — backend tomonidan xabar qilingan prompt tokenlar soni (prompt_eval_count); y oʻqi — backendning promptni baholash vaqti, har bir soʻrov uchun keshni chetlab oʻtuvchi (nonce)…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Prefill qiymati oʻlchangan prompt uzunligiga nisbatan (log-log). x oʻqi — backend tomonidan xabar qilingan prompt tokenlar soni (prompt_eval_count); y oʻqi — backendning promptni baholash vaqti, har bir soʻrov uchun keshni chetlab oʻtuvchi (nonce) prefiks bilan uchta yugurishning medianasi. Har bir yugurish uchun qiymatlar saqlanmagan, shuning uchun xatolik chiziqlari (error bars) koʻrsatilmagan. Boʻsh markerlar: bench (19 ta vosita), full-configuration (31 ta) va duplicated-schema (256 ta) ankorlari. Uzuk chiziqlar — eng kichik kvadratlar usuli bilan moslashtirish (4B: har bir token uchun 0,20 ms, R²=0,9991). Matnda keltirilgan 774/797 tokenlik statik byudjetlar oʻlchovlar emas, balki baholashlardir va bu oʻqda chizilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Kichik til modellari ko'p bosqichli vazifalarni bajara olmaslikda tez-tez tanqid qilinadi. Mualliflar muammo modelda emas, balki kontekstni ortiqcha yuklaydigan va xatolarni tuzata olmaydigan «harness» (dasturiy qobiq) tizimida ekanligini isbotlaydilar. &lt;a href=\"concepts/mingbird.html\"&gt;Mingbird&lt;/a&gt; vositasi ushbu kamchiliklarni bartaraf etib, kichik modellarga yirik tizimlar bilan raqobatlashish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Standart agent qobiqlari kichik modellarning kontekstini ortiqcha yuklaydi.&lt;/li&gt;\n&lt;li&gt;Mingbird o'n xil mexanizm yordamida vazifalarni bajarish aniqligini 0,886 gacha oshiradi.&lt;/li&gt;\n&lt;li&gt;Kichik modellarning samaradorligi dasturiy qobiq sifatiga bevosita bog'liq.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar &lt;a href=\"concepts/local-real-task-agent-benchmark.html\"&gt;LRAB&lt;/a&gt; (Local Real-task Agent Benchmark) nazoratli tajribasini o'tkazib, to'rtta dasturiy qobiqni (Mingbird, goose, opencode, agent-mini) 2B dan 35B gacha bo'lgan modellar bilan sinab ko'rdilar. 288 ta test davomida ma'lum bo'lishicha, bulutli modellar uchun mo'ljallangan standart qobiqlar kichik neyrotarmoqlarda «tsikl» va vazifalarni muddatidan oldin yakunlash kabi xatolarni keltirib chiqaradi. Mingbird o'n xil himoya mexanizmini, jumladan, bayt darajasidagi prefill byudjeti va natijani tekshiruvchi «yakunlash shlyuzi»ni joriy etadi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatadiki, Mingbird 0,886 umumiy aniqlikka erishib, raqobatchilarni (0,405–0,631) sezilarli darajada ortda qoldiradi. τ²-bench (278 ta vazifa) bo'yicha tashqi tekshiruv tizimning 0,856 ko'rsatkich bilan yetakchiligini tasdiqladi. Mualliflar ta'kidlashicha, bu yangi o'qitish algoritmlari emas, balki o'zaro ta'sir nuqsonlarini bartaraf etuvchi muhandislik yechimidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar o'zimiz yaratgan benchmark, bitta kompyuter va har bir vazifaning yagona urinishiga asoslangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Kichik til modellari (2–9 mlrd parametr) oddiy noutbuklarda ishlay oladi, ammo bulutli agent muhitlarida ular real vazifalarni bajarishda koʻpincha qiynaladi. Asosiy muammolar: vositalarni toʻldirishda kontekstning toshib ketishi, oʻz-oʻzini tuzatishdagi xatolar, vositalar namoyishining siklga tushib qolishi va vazifani bajarishdan jimjit voz kechish. Tadqiqot shuni koʻrsatadiki, bu nosozliklarning katta qismi modellarning oʻziga emas, balki muhit (harness) arxitekturasiga bogʻliq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatadiki, kichik modellarning vazifalarni bajarishdagi nosozliklarining katta qismi neyron tarmoqlar emas, balki boshqaruv muhitining kamchiliklari bilan bogʻliq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar Windows va Ollama uchun moʻljallangan, lokal bajarilishga yoʻnaltirilgan Mingbird agent muhitini taqdim etadilar. Tizim kichik modellarning tipik xatolarini kompensatsiya qiluvchi 10 ta mexanizmni oʻz ichiga oladi. Asosiylari: bayt darajasidagi prefill byudjeti, vazifani tasdiqlashdan oldin qayta oʻqiydigan «yakunlash darvozasi» (&lt;a href=\"concepts/completion-gate.html\"&gt;finish gate&lt;/a&gt;) va &lt;a href=\"concepts/signatura.html\"&gt;signatura&lt;/a&gt; darajasidagi sikllarni aniqlash.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/harness.html\"&gt;Agent muhiti&lt;/a&gt; (harness) — bu modelning tashqi vositalar, fayllar va kompyuter interfeyslari bilan oʻzaro taʼsirini boshqaradigan dasturiy qobiq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LRAB toʻplamidagi nazoratli taqqoslashda (4 ta muhit × 4 ta model 2B dan 35B gacha × 18 ta vazifa) Mingbird 0,886 umumiy koʻrsatkichga erishdi, boshqa muhitlar esa 0,631 (goose), 0,479 (opencode) va 0,405 (agent-mini) natija koʻrsatdi. τ2-bench (278 ta vazifa) benchmarkida natija 0,856 ni tashkil etdi (raqobatchilarda 0,791 va 0,737). Ilgʻor modellarni (frontier models) sinashda muhitlar oʻrtasidagi farq 0,997 dan 0,478 gacha oʻzgargan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ayrim mexanizmlarni oʻchirib tashlash (ablyatsiya) tahlili faqat yoʻnaltiruvchi xarakterga ega, chunki natijalar yuqori oʻzgaruvchanlikka ega: bir kechada qayta ishga tushirish 0,069 gacha farq berishi mumkin, bu esa alohida mexanizmlar taʼsiriga tengdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Ochiq vaznga ega (2–9 mlrd parametrli) til modellari amaliy qoʻllash chegarasidan oʻtdi. Oddiy noutbukda, integratsiyalashgan grafik protsessor va 16–32 GB umumiy xotira bilan ular tarjima qilish, xulosa chiqarish va tushuntirish kabi vazifalarni bajara oladi. Biroq, bunday modellar koʻp bosqichli vazifalarni (kod yozish, maʼlumot qidirish, fayllarni boshqarish) mustaqil bajaruvchi agent sifatida ishlay olmaydi, degan qarash mavjud. Mualliflar bu fikrga qarshi chiqib, asosiy cheklov modelning oʻzida emas, balki uni boshqaruvchi dasturiy qobiqda (harness) ekanligini taʼkidlaydilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Asosiy xulosa: kichik modellarning (2–9 mlrd parametr) xatolari koʻpincha arxitektura bilan emas, balki boshqaruvchi qobiqning samarasizligi bilan bogʻliq boʻlib, bu muhandislik yechimlari orqali tuzatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2 mlrd parametrli modelni standart bulutli freymvorklarda ishlatganda, mualliflar tizimli nosozliklarni kuzatishdi: kontekstning statik maʼlumotlar bilan toʻlib ketishi, modelning xato funksiya chaqiruvidan soʻng oʻzini oʻzi tuzata olmasligi va vazifani bajarmasdan yakunlangan deb eʼlon qilishi. Ushbu muammolarni hal qilish uchun Windows va Ollama uchun moʻljallangan Mingbird agentlik qobiqi yaratildi. U 10 ta asosiy mexanizm va besh darajali xavfsizlik modelini (1.6.0 versiyasi) oʻz ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Harness (qobiq) — bu til modelini tashqi vositalar (qidiruv, fayl tizimi, kod bajarish) bilan bogʻlovchi va uning mustaqil ishlashini taʼminlovchi dasturiy muhit.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mingbird samaradorligini baholash uchun mualliflar LRAB (Local Real-task Agent Benchmark) nazorat qilinadigan tajribasini oʻtkazdilar (4 ta qobiq, 4 ta model va 18 ta real vazifa, jami 288 ta maʼlumot katagi). Sinovlarda Mingbird 0,886 natija koʻrsatdi (analoglar uchun 0,405–0,631). Muhimi, Mingbird kichik modellarda (2B) samaradorlik keskin pasaymaydigan yagona qobiqdir (0,821 ga qarshi 0,017–0,271). Mustaqil τ2-bench testida (278 ta vazifa) Mingbird 0,856 natija bilan raqobatchilardan (0,791 va 0,737) ustun keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot muhandislik xarakteriga ega: mualliflar yangi oʻqitish algoritmlarini taklif qilmaydi, balki modelning vositalar bilan oʻzaro taʼsirini optimallashtirishga eʼtibor qaratadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"agent-paradigmalari\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#agent-paradigmalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Agent paradigmalari&lt;/span&gt;&lt;/a&gt;Agent paradigmalari&lt;/h4&gt;\n&lt;p&gt;Zamonaviy agent tizimlari ReAct yondashuviga asoslanadi: model mulohaza yuritish va vositalarni chaqirishni navbatma-navbat bajaradi, tashqi muhit (harness) esa bu chaqiruvlarni bajarib, natijani qaytaradi. Toolformer va Gorilla kabi vositalar modellarni API chaqirishga o‘rgatish va interfeyslarni standartlashtirish uchun asos yaratdi. Reflexion va Self-Refine kabi yaxshilash usullari modelning o‘z-o‘zini tanqid qilish qobiliyatiga tayanadi. Biroq, kichik modellar ko‘pincha bu vazifani bajara olmaydi. Mingbird ijro muhitini takomillashtirishga e’tibor qaratadi: u modeldan mavhum o‘z-o‘zini takomillashtirishni talab qilmaydi, balki model nimani «ko‘rishi», qachon to‘xtashi va xatolarni qanday qayta ishlashini boshqaradi. Mingbird kichik modellar tizimli ravishda xato qiladigan nuqtalarda qat’iy cheklovlar (guardrails) o‘rnatilgan agent sifatida ishlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird e’tiborni kichik modelni o‘z-o‘zini tanqid qilishga o‘rgatishdan, modelning tipik xatolarini real vaqt rejimida tuzatadigan qat’iy ijro muhitini yaratishga qaratadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"agent-benchmarklari\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#agent-benchmarklari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Agent benchmarklari&lt;/span&gt;&lt;/a&gt;Agent benchmarklari&lt;/h4&gt;\n&lt;p&gt;AgentBench, AgentBoard, WebArena va SWE-bench kabi platformalar agentlarni veb-serfingdan tortib GitHubdagi vazifalarni yechishgacha bo‘lgan turli muhitlarda baholaydi. Bizning yondashuvimizga eng yaqini τ-bench va τ2-bench bo‘lib, unda &lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;foydalanuvchi simulyatori&lt;/a&gt; agent bilan muloqot qiladi va baholash ma’lumotlar bazasining yakuniy holatiga asoslanadi. LRAB ulardan maqsadi bilan farq qiladi: bu modellarni reytinglash emas, balki qat’iy protokol, bitta mashina va deterministik baholash yordamida ijro muhitining (harness) ta’sirini izolyatsiya qilingan holda o‘rganishdir.&lt;/p&gt;\n&lt;h4 id=\"mahalliy-va-kichik-modellarda-xulosa-chiqarish\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#mahalliy-va-kichik-modellarda-xulosa-chiqarish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mahalliy va kichik modellarda xulosa chiqarish&lt;/span&gt;&lt;/a&gt;Mahalliy va kichik modellarda xulosa chiqarish&lt;/h4&gt;\n&lt;p&gt;Llama.cpp va Ollama vositalari kvantlangan modellarni iste’molchi uskunalarida samarali ishga tushirishni ta’minladi. SmolLM2, Gemma va Qwen kabi modellarni tadqiq qilish ularning parametr bo‘yicha samaradorligini oshiradi. Biroq, ijro muhiti (harness) hali ham kuchli modellar va Unix-simon tizimlarga mo‘ljallangan bulutli amaliyotlardan olingan. Mingbird boshqa segmentda ishlaydi: 2–9B modellar, Windows OS, o‘rnatilgan GPU va kod, fayllar hamda ma’lumot qidirishni birlashtirgan vazifalar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Harness (ijro muhiti) — bu modelni tashqi vositalar bilan bog‘laydigan, vazifalar navbatini boshqaradigan va modelning tizim bilan o‘zaro ta’sirida yuzaga keladigan xatolarni qayta ishlaydigan dasturiy qobiqdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"muhandislik-tizimlari\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#muhandislik-tizimlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhandislik tizimlari&lt;/span&gt;&lt;/a&gt;Muhandislik tizimlari&lt;/h4&gt;\n&lt;p&gt;SWE-agent, OpenHands, Cline va aider kabi tizimlar kuchli modellar va POSIX muhitlari uchun optimallashtirilgan. Mingbird ularni to‘ldiradi va Windows operatsion tizimidagi oddiy noutbuklarda kichik modellar bilan ishlaydi. Biz kichik modellarning nosozliklaridan himoya qilish mexanizmlarini asosiy loyihalash obyekti deb bilamiz.&lt;/p&gt;\n&lt;p&gt;Ijro muhitining ta’siri — bu tan olingan fakt (Zhang va Starace tadqiqotlari shuni ko‘rsatadiki, harness konfiguratsiyasi natijani 28 ballgacha o‘zgartirishi mumkin). Bizning hissamiz Windows/Ollama muhitidagi 2–9B modellar uchun ushbu ta’sirni dekompozitsiya qilishdan iborat. Biz kichik modellarning tipik nosozliklari va ularni tuzatish mexanizmlari inventarini yaratdik. Masalan, M4 detektorimiz OpenHands’dagi StuckDetector kabi takrorlanish sikllarini kuzatadi, lekin uni vosita nomlari va argumentlarini &lt;a href=\"concepts/normalizatsiya.html\"&gt;normallashtirish&lt;/a&gt; hamda eskalatsiya zinapoyasi bilan to‘ldiradi. Bizning yondashuvimizning yangiligi — qat’iy prefill limiti va modelga «bajarildi» deyishdan oldin vazifani qayta o‘qishga majbur qiladigan «yakunlash darvozasi» (completion gate) bo‘lib, bu kontekstni to‘ldirishga yoki muddatidan oldin tugatishga moyil bo‘lgan kichik modellar uchun juda muhimdir.&lt;/p&gt;\n&lt;h4 id=\"architecture-overview\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#architecture-overview\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Architecture overview&lt;/span&gt;&lt;/a&gt;Architecture overview&lt;/h4&gt;\n&lt;p&gt;Mingbird — bu foydalanuvchi qurilmasida toʻliq ishlaydigan lokal agent (model, vositalar, nutqni aniqlash, xotira). Yagona tashqi soʻrov — foydalanuvchi tomonidan sozlangan qidiruv tizimi. Tizim &lt;a href=\"concepts/inferens.html\"&gt;inferens&lt;/a&gt; uchun qoʻshimcha yuklama bermaydi. 1.6.0 versiyasida statik prefill (model vazifani boshlashdan oldin koʻradigan maʼlumotlar hajmi) 797 tokenni tashkil etadi. Arxitektura (1-rasm) agent siklini boshqaruvchi GUI va CLIʼni oʻz ichiga oladi. Sikl vazifalarni marshrutlash (M1), klassifikatsiya (chat/vazifa, M2), vositalarni xavfsiz bajarish (M6, M8), sikllarni monitoring qilish (M4) va yakunlashni tekshirish (M3) bosqichlaridan iborat. Barqarorlik qatlami (M7) xatolarni nazorat nuqtalari orqali boshqaradi. Backend Ollamaʼdan foydalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Statik prefill 797 token bilan cheklangan, bu modelning ortiqcha kontekst tufayli sifatini yoʻqotishining oldini oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mechanisms\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#mechanisms\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mechanisms&lt;/span&gt;&lt;/a&gt;Mechanisms&lt;/h4&gt;\n&lt;p&gt;1-jadval har bir mexanizmni ular bartaraf etadigan xato turlari bilan bogʻlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Mingbird mexanizmlari va ular bartaraf etadigan kichik modeldagi nosozlik shakllari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Mexanizm&lt;/th&gt;\n&lt;th&gt;Bartaraf etilgan nosozlik shakli&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;M1&lt;/td&gt;\n&lt;td&gt;Yassi prefill, sxemaga boy vositalardan net-zero byudjet kontekstining toshib ketishi&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M2&lt;/td&gt;\n&lt;td&gt;Chat/vazifa qatlamlari, oddiy chat kiritishidan vosita namoyishi davrlari&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M3&lt;/td&gt;\n&lt;td&gt;Finish gate + reja qayta kiritilishi, muddatidan oldin yoki noto'g'ri yakunlanganlik da'volari&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M4&lt;/td&gt;\n&lt;td&gt;Imzo darajasidagi anti-loop, takroriy bir xil vosita chaqiruvlari, chiqish yo'q&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M5&lt;/td&gt;\n&lt;td&gt;Noto'g'ri yakunlash va formatni qutqarish, oddiy matn sifatida chiqarilgan vosita chaqiruvlari; takroriy noto'g'ri chaqiruvlar&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M6&lt;/td&gt;\n&lt;td&gt;Tahrirlash xavfsizligi (.bak), model bekor qila olmaydigan destruktiv tahrirlar&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M7&lt;/td&gt;\n&lt;td&gt;Chidamlilik qatlami, jim o'quvchi-oqim xatolari, bo'sh burilishlar, tugatilgan ishga tushirishlar&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M8&lt;/td&gt;\n&lt;td&gt;Xavfsizlik chegarasi, katalogdan tashqari yozish, ma'lumotlarning oshkor bo'lishi, sub-agentlarning tarqalishi&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M9&lt;/td&gt;\n&lt;td&gt;Imkoniyatlar yuzasi, ovoz, ko'rish, xotira, MCP, prefill o'sishisiz ko'nikmalar&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M10&lt;/td&gt;\n&lt;td&gt;Sifat bazasi, regressiyalar, ayniqsa prefill o'sishi&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M14&lt;/td&gt;\n&lt;td&gt;Besh halqali xavfsizlik modeli (v1.6.0), vositalardan impul'siv foydalanish natijasida tizimning qaytarib bo'lmaydigan shikastlanishi&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;M1–M10, shuningdek, besh halqali xavfsizlik modeli v1.6.0 (M14).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"m1-flat-prefill-with-a-net-zero-budget\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m1-flat-prefill-with-a-net-zero-budget\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M1: Flat prefill with a net-zero budget&lt;/span&gt;&lt;/a&gt;M1: Flat prefill with a net-zero budget&lt;/h4&gt;\n&lt;p&gt;Muammo: bulutli vositalar manifestlaridan foydalanilganda, 2–9B modellar vazifa boshlanishidan oldin minglab token sarflaydi, bu esa koʻrsatmalarga amal qilish aniqligini pasaytiradi. Mexanizm: tizim vazifa domenini klassifikatsiya qiladi va faqat kerakli vositalarni tekis formatda yuklaydi. Har qanday yangi funksiya statik prefill boʻyicha «nol byudjet»ga ega boʻlishi shart, bu CI testlari (M10) orqali tekshiriladi. Kompromiss: marshrutizator xato qilishi mumkin, ammo tizim qayta marshrutlashga ruxsat beradi. 4B modellar uchun ishlov berish vaqti chiziqli (token uchun ~0,20 ms), 2B modellar uchun esa super-chiziqli oʻsadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Prefill — bu model javob generatsiya qilishdan oldin qayta ishlaydigan maʼlumotlar hajmi; «tekis» format ierarxik tuzilmalarning yoʻqligini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m2-chat/task-layering\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m2-chat/task-layering\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M2: Chat/task layering&lt;/span&gt;&lt;/a&gt;M2: Chat/task layering&lt;/h4&gt;\n&lt;p&gt;Muammo: kichik modellar oddiy savollarga javob berishda vositalarni «namoyish» qilib, cheksiz siklga kirib qolishi mumkin. Mexanizm: «chat» va «vazifa» rejimlari ajratiladi. Chatda vositalar cheklangan, javobdan soʻng sikl toʻxtaydi. Vazifa rejimi toʻliq kirishni ochadi. Kompromiss: klassifikator agar tarixda artefaktlar boʻlsa, vazifa rejimiga moyil boʻladi.&lt;/p&gt;\n&lt;h4 id=\"m3-finish-gate-and-completion-time-prompt-re-injection\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m3-finish-gate-and-completion-time-prompt-re-injection\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M3: Finish gate and completion-time prompt re-injection&lt;/span&gt;&lt;/a&gt;M3: Finish gate and completion-time prompt re-injection&lt;/h4&gt;\n&lt;p&gt;Muammo: modellar vazifani toʻliq bajarmasdan «jim» yakunlashi yoki kontekst siqilgandan soʻng muvaffaqiyat mezonlarini yoʻqotishi mumkin. Mexanizm: yakunlashni qabul qilishdan oldin tizim modelni natijani vazifa matni bilan bandma-band solishtirishga majbur qiladi. Reja siqilgandan soʻng qayta kiritiladi. Kompromiss: bu modelga qoʻshimcha bir soʻrovni talab qiladi, ammo «jim voz kechish»ni yakunlash yoki toʻsiqni aniq taʼriflashga aylantiradi.&lt;/p&gt;\n&lt;h4 id=\"m4-tsikllarni-aniqlash\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m4-tsikllarni-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M4: Tsikllarni aniqlash&lt;/span&gt;&lt;/a&gt;M4: Tsikllarni aniqlash&lt;/h4&gt;\n&lt;p&gt;Mexanizm vosita chaqiruvlari signaturalarini (nomi va normallashtirilgan argumentlar) kuzatib boradi. Tizim 6 ta bir xil chaqiruv yoki 15 ta ketma-ket natijasiz chaqiruv sodir bo'lganda ishga tushadi. v1.5.0 versiyasida qisman chiqish va bo'sh javoblar almashinuvi hisoblagichlarni qayta o'rnatib yuborishi bilan bog'liq xatolik tuzatildi. Fayllarni o'qish uchun 64 KB dan 512 KB gacha bo'lgan limit joriy etildi; limitdan oshib ketilganda, faylni «aylanib o'tish»ni davom ettirish uchun pozitsiyani saqlagan holda dastlabki 2000 ta belgi qaytariladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tsikllarni aniqlash va fayllarni o'qish limitlarini joriy etish 4B modeliga vazifani 156 ta o'rniga 15 ta chaqiruvda yakunlash imkonini berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Signatura — bu chaqiruvning noyob identifikatori bo'lib, u model argumentlar yozilishini biroz o'zgartirsa ham, bir xil harakatni takrorlayotganini tizimga tushunishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m5-notogri-yakunlashni-rad-etish-va-formatni-tuzatish\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m5-notogri-yakunlashni-rad-etish-va-formatni-tuzatish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M5: Noto'g'ri yakunlashni rad etish va formatni tuzatish&lt;/span&gt;&lt;/a&gt;M5: Noto'g'ri yakunlashni rad etish va formatni tuzatish&lt;/h4&gt;\n&lt;p&gt;Tizim model vazifa bajarilganini artefaktlarsiz e'lon qilgan yoki vosita chaqiruvini oddiy matn ko'rinishida (masalan, matn ichidagi JSON) chiqargan holatlarni qayta ishlaydi. Mexanizm formatlash xatolarining uchta turini taniydi va ularni bajariladigan chaqiruvlarga aylantiradi. Qat'iy sxemaga rioya qilish o'rniga, 2–9B modellari uchun «teskari aloqa bilan tuzatish» strategiyasi qo'llaniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Format xatolarini tarkibiy tuzatish agent ishini noto'g'ri sintaksis tufayli majburiy to'xtatishsiz tiklash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qat'iy parsingsiz evristik tuzatishdan foydalanish, agar format belgilangan uchta shablonga mos kelmasa, model niyatlarini noto'g'ri talqin qilishga olib kelishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m6-tahrirlash-xavfsizligi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m6-tahrirlash-xavfsizligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M6: Tahrirlash xavfsizligi&lt;/span&gt;&lt;/a&gt;M6: Tahrirlash xavfsizligi&lt;/h4&gt;\n&lt;p&gt;Fayllarni tahrirlashdagi xatoliklar tufayli ma'lumotlar yo'qolishining oldini olish uchun har bir yozish harakati avtomatik ravishda zaxira nusxasini (.bak) yaratadi. Model o'z-o'zidan oldingi versiyaga qaytishni boshlashi mumkin. Mexanizm ataylab soddalashtirilgan: u murakkab taqqoslash (diff) algoritmlaridan foydalanmaydi, bu esa uni modelning o'zi uchun tushunarli qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/rezervnoe-kopirovanie.html\"&gt;Zaxira nusxalash&lt;/a&gt; — bu xatolik yuz berganda ishchi holatga qaytish uchun o'zgarishlar kiritishdan oldin fayl nusxasini yaratishdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m7-barqarorlik-kodlash,-bosh-javoblar,-nazorat-nuqtalari\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m7-barqarorlik-kodlash,-bosh-javoblar,-nazorat-nuqtalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M7: Barqarorlik (kodlash, bo'sh javoblar, nazorat nuqtalari)&lt;/span&gt;&lt;/a&gt;M7: Barqarorlik (kodlash, bo'sh javoblar, nazorat nuqtalari)&lt;/h4&gt;\n&lt;p&gt;Nostandart kodlashlarni (masalan, Windows'dagi GBK) o'qishda nosozliklarning oldini olish uchun belgilarni almashtirish bilan UTF-8 dekodlash qo'llaniladi. Bo'sh generatsiyalar yoki harakatsiz «fikrlash qobiqlari» ish jarayonini qayta o'rnatishga olib keladi. Nazorat nuqtalari tizimi uzilib qolgan ishni oxirgi bajarilgan qadamdan davom ettirish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nazorat nuqtalarini joriy etish va dekodlashda belgilarni almashtirish nostandart ma'lumotlar oqimlari bilan ishlashda tizimning «qotib qolishini» bartaraf etdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m8-xavfsizlik-chegaralari\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m8-xavfsizlik-chegaralari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M8: Xavfsizlik chegaralari&lt;/span&gt;&lt;/a&gt;M8: Xavfsizlik chegaralari&lt;/h4&gt;\n&lt;p&gt;Agentning ishchi katalogdan chiqib ketishining oldini olish uchun normallashtirilgan yo'llarni tekshirish qo'llaniladi. Muhim fayllarga (masalan, .&lt;a href=\"concepts/speculative-safety-honeypot.html\"&gt;ssh&lt;/a&gt;, .env) kirish cheklangan, ruxsat etilgan zonadan tashqaridagi operatsiyalar esa foydalanuvchidan grafik interfeys orqali tasdiqlashni talab qiladi. Odatiy holatda parallel sub-agentlar yaratish taqiqlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xavfsizlikni funksionallikdan ustun qo'yish (parallelizmni taqiqlash va kirishni tasdiqlash) tizimni mutaxassis bo'lmagan foydalanuvchilarning shaxsiy kompyuterlarida ishlashga yaroqli qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m9-imkoniyatlar-yuzasi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m9-imkoniyatlar-yuzasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M9: Imkoniyatlar yuzasi&lt;/span&gt;&lt;/a&gt;M9: Imkoniyatlar yuzasi&lt;/h4&gt;\n&lt;p&gt;Dizayn konsepsiyasi. M9 guruhi M1 byudjetiga (statik prefillning nol oʻsishi) mos kelishi kerak boʻlgan funksiyalarni birlashtiradi. Ovozli kiritish mahalliy STT (Speech-to-Text) modelidan foydalanadi, u CPUda real vaqtdan taxminan 20× tezroq ishlaydi va nutq tugaganini avtomatik aniqlaydi. Koʻrish qobiliyati xabar tarkibidagi tasvirlarni oʻqish orqali amalga oshiriladi (toʻrtta modelda tekshirilgan). Sessiya xotirasi doimiy va qidirish mumkin. MCP serverlari JSON konfiguratsiyasi orqali ulanadi. Koʻnikmalar (skills) progressiv tarzda ochiladigan Markdown fayllari sifatida saqlanadi, bu oʻnlab koʻnikmalarni bir necha yuz token kontekstiga siqish imkonini beradi. Model identifikatori va kontekst uzunligi Ollama orqali avtomatik aniqlanadi (standart 128K, 256K gacha).&lt;/p&gt;\n&lt;p&gt;Vazifa vaqtini cheklash sukut boʻyicha oʻchirilgan. Foydalanuvchi byudjetni oddiy tilda belgilaydi va u tugashi bilan tizim modelni natijani yakunlashga undaydi. Mahalliy modellardan foydalanuvchilar vaqtga sezgir boʻlgani uchun, cheklangan vaqt ichida maksimal natijaga erishish afzalroqdir.&lt;/p&gt;\n&lt;p&gt;Kelishuv (Trade-off). Progressiv ochilish model qaysi koʻnikma faylini ochishni bilishi kerakligini anglatadi. Koʻnikmalar indeksi doimiy kontekstda saqlanadi, bu bitta oʻqishni talab qiladi. Ushbu imkoniyatlarning oʻzi yangilik emas; ularni birlashtiruvchi cheklov (statik prefillning oʻsmasligi) asosiy hissa hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;M9 ning asosiy hissasi koʻplab funksiyalarni statik prefillga qatʼiy cheklov qoʻygan holda integratsiya qilishdir, bu dinamik kontekst boshqaruvi orqali erishiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m10-sifat-bazasi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m10-sifat-bazasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M10: Sifat bazasi&lt;/span&gt;&lt;/a&gt;M10: Sifat bazasi&lt;/h4&gt;\n&lt;p&gt;Mexanizm. Testlar CI (v1.6.0) da bajariladi. Asosiy ikkita tasdiq muhim: bayt darajasidagi prefillning nolga tengligi (M1) va tsikllarni aniqlash chegaralari (M4). Kelishuv shundaki, testlar toʻplami implementatsiya tezligini cheklaydi: har bir oʻzgarish prefill byudjetini saqlab qolishi kerak, bu esa boshqa maqbul dizaynlarni (masalan, murakkab tizim promptlari) rad etishga olib keldi.&lt;/p&gt;\n&lt;h4 id=\"m14-besh-darajali-xavfsizlik-modeli-v160\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m14-besh-darajali-xavfsizlik-modeli-v160\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M14: Besh darajali xavfsizlik modeli (v1.6.0)&lt;/span&gt;&lt;/a&gt;M14: Besh darajali xavfsizlik modeli (v1.6.0)&lt;/h4&gt;\n&lt;p&gt;Mexanizm. Xavfsizlik besh darajaga boʻlingan: sub-agentlar cheklangan huquqlar bilan «&lt;a href=\"concepts/sandbox.html\"&gt;qum qutisi&lt;/a&gt;» (sandbox) ichida ishlaydi; qaytarib boʻlmaydigan operatsiyalar (formatlash, diskka yozish) bloklanadi; tizimni oʻzgartiruvchi harakatlar operator ishtirokini talab qiladi; rekursiv oʻchirish ishchi katalog bilan cheklangan; oxirgi daraja qaytaruvchanlikni taʼminlaydi (.bak yaratish, savat). Global chetlab oʻtish imkoniyati mavjud, ammo u operator tavakkalchiligi ostida ishlatiladi.&lt;/p&gt;\n&lt;p&gt;Kelishuv. Konservativ yondashuv ekspertning xavfsiz harakatlarini ham bloklashi mumkin, ammo bu maqsadli auditoriya uchun oqlangan. M14 modeli xostni agent vositalaridan himoya qiladi, promp-inʼyektsiyalardan emas.&lt;/p&gt;\n&lt;p&gt;S sizishlarni tahlil qilish. 2-daraja (qaytarib boʻlmaydigan buyruqlar) barcha urinishlarni ushlaydi. Tasdiqlangan yakuniy taʼsirlar 2B modeli uchun 44 tadan 2 tasini va 4B uchun 44 tadan 11 tasini tashkil etdi. Barcha sizishlar bash buyruq satri orqali oʻtgan. 2B modeli ikkita tor sizishga yoʻl qoʻydi (NTFS-ulanish yaratish, qaytaruvchanlik xatosi). 4B modeli esa metodik hujum qildi: mutlaq yoʻllar, normalizatsiyani chetlab oʻtuvchi \\?\\ prefikslari, ishchi katalogdan chiqish uchun cd.. zanjirlari va reyestrga yozish urinishlari. Chaqiruvlarni ushlash samarali (daraja boʻyicha 0,67–1,00), ammo model chetlab oʻtish yoʻllarini izlashga qodir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;M14 modeli vositalardan impulʼsiv foydalanishni samarali oldini oladi, ammo bir vaqtning oʻzida bir nechta hujum vektoridan foydalanadigan metodik raqibga qarshi himoyani kafolatlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"loyihalash-tamoyihalash-tamoyillari\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#loyihalash-tamoyihalash-tamoyillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Loyihalash tamoyihalash tamoyillari&lt;/span&gt;&lt;/a&gt;Loyihalash tamoyihalash tamoyillari&lt;/h4&gt;\n&lt;p&gt;Mingbird oʻzimiz yaratgan vosita boʻlgani uchun uning natijalari ishlab chiqish konteksti bilan cheklangan. Benchmark universal etalon boʻlishga daʼvo qilmaydi, ammo u sabab-oqibat bogʻliqligini oʻrnatishga imkon beradi: 18 ta aniq vazifada, belgilangan uskunalar va modellarda, faqat boshqaruv vositasini (harness) oʻzgartirish yakuniy natijani koʻrsatilgan miqdorga oʻzgartiradi. Ish tamoyillari: birinchidan, barcha sharoitlarning oʻzgarmasligi (mashina, Ollama backend, modellar, vaqt byudjeti, baholash tizimi); ikkinchidan, toʻliq shaffoflik (har bir katak boʻyicha 288 ta natija eʼlon qilingan, bu har qanday agregatlangan koʻrsatkichni qayta tekshirish imkonini beradi); uchinchidan, benchmark mustaqil testlar bilan bir qatorda dalillar bazasining bir qismi sifatida qaraladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Benchmark barcha muhit parametrlarini belgilash orqali takrorlanuvchanlikni taʼminlaydi va boshqaruv vositasining vazifalar muvaffaqiyatiga taʼsirini ajratib koʻrsatishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vazifalar-toplami\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#vazifalar-toplami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vazifalar toʻplami&lt;/span&gt;&lt;/a&gt;Vazifalar toʻplami&lt;/h4&gt;\n&lt;p&gt;18 ta vazifa toʻrt darajali qiyinchilikka taqsimlangan, bu xatolarni umumlashtirish oʻrniga aniq rejimda lokallashtirish imkonini beradi. T1 (maʼlumotlarni qidirish va olish), T2 (sintez, funksiyalarni amalga oshirish, testlar yozish), T3 (ish jarayonlari: veb-tadqiqotlar, profillash, refaktoring), T4 (uzoq muddatli vazifalar, shu jumladan toʻxtatish va qayta tiklash stress-testlari). Har bir vazifa aniq spetsifikatsiyalarga ega: domen, kirish maʼlumotlari, harakatlar rejasi, nazorat nuqtalari va artefaktlarni baholash mezonlari. Vazifalar aniq va tekshirilishi mumkin, ularning taʼriflari test sikli boshlanishidan oldin belgilanadi. Toʻplam mahalliy agentlarning asosiy ish jihatlarini qamrab oladi, interaktiv dialoglarni istisno qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/cell.html\"&gt;Katak»&lt;/a&gt; (cell) — bu tajriba doirasida bajariladigan aniq vazifa va modelning birikmasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"protokol\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#protokol\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Protokol&lt;/span&gt;&lt;/a&gt;Protokol&lt;/h4&gt;\n&lt;p&gt;Barcha 288 ta katak bitta mashinada (integratsiyalashgan GPU, 32 GB umumiy xotira, Windows 11, Ollama) bajarildi. Toʻrtta vosita ishlatildi: Mingbird, goose, agent-mini va opencode. Modellar: gemma4 (2B va 12B), qwen3.5 (4B) va ornith-1.5 (35B). 35 milliard parametrga qaramay, ornith-1.5 Mixture-of-Experts arxitekturasidan foydalanadi (token uchun taxminan 3 milliard parametr faollashadi), bu 128K kontekstda taxminan 26 token/s tezlikni taʼminlaydi. Vaqt byudjeti ish jarayonlari uchun 90 daqiqa va uzoq muddatli vazifalar uchun 180 daqiqani tashkil etdi. Tanlash harorati barcha vositalar uchun 0 ga majburiy oʻrnatildi. Bitta qayta urinishga ruxsat berildi; taym-aut 0 ga tenglashtirildi. Test davomida 288 ta katak uchun 312 ta ishga tushirish qayd etildi. Mualliflar goose (WF-08) uchun protokoldagi chetlanishni oshkor qiladilar, u yerda bitta oʻrniga toʻrtta urinish amalga oshirilgan; bu yakuniy reytingga taʼsir qilmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qayta urinishlardan foydalanish assimetrik boʻldi: agent-mini nosozliklar tufayli 20 ta qayta urinishni talab qildi, Mingbird esa faqat bittasidan foydalandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baholash\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash&lt;/span&gt;&lt;/a&gt;Baholash&lt;/h4&gt;\n&lt;p&gt;Baholash tizimi deterministik va artefaktlarga asoslangan: fayllar mavjud boʻlishi, testlar oʻtishi, hisobotlar talab qilingan maʼlumotlarni oʻz ichiga olishi kerak. Baholar qisman: yettita tekshiruvdan toʻrttasi oʻtsa, katak 0,571 ball oladi. Boshqaruv vositalari baholash tizimidan izolyatsiya qilingan va ish tugaguniga qadar mezonlarga kirish huquqiga ega emas.&lt;/p&gt;\n&lt;h4 id=\"adolat-vaqt-soniyalar-bilan-emas,-byudjetlar-bilan-olchanadi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#adolat-vaqt-soniyalar-bilan-emas,-byudjetlar-bilan-olchanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Adolat: vaqt soniyalar bilan emas, byudjetlar bilan oʻlchanadi&lt;/span&gt;&lt;/a&gt;Adolat: vaqt soniyalar bilan emas, byudjetlar bilan oʻlchanadi&lt;/h4&gt;\n&lt;p&gt;Turli test muhitlari (harnesses) real vaqt (&lt;a href=\"concepts/wall-clock-time.html\"&gt;wall-clock time&lt;/a&gt;) koʻrsatkichlari boʻyicha sezilarli darajada farq qiladi, shuning uchun baholash metodikasi buni hisobga olishi shart. LRAB tizimida vaqt har bir vazifalar oilasi uchun belgilangan byudjetlar orqali baholanadi va «xom» soniyalar normallashtirilmaydi. Buning sababi shundaki, agent foydalanuvchi uchun faqat u kutishga tayyor boʻlgan vaqt ichida natija bersagina foydali hisoblanadi. Muhitlar oʻrtasidagi real vaqt farqlari aslida arxitektura xarajatlarini aks ettiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Wall-clock time (devor soati vaqti) — bu vazifa boshlanishidan tugashigacha oʻtgan haqiqiy vaqt, barcha tizim kechikishlarini oʻz ichiga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Goose tizimi misolida, katta kontekstlar bilan ishlashda uzoq davom etadigan prefill fazasi sekinlashuvga olib keladi, ammo bu jarayonda muhim ish hajmi bajariladi. Chop etilgan CSV maʼlumotlariga koʻra, eng sekin goose katakchasi xuddi shu vazifa va WF-04 (12B) modeli ustida Mingbird’dan 11,7 barobar sekinroq ishlaydi. Soniyalarni hisobga olmaslik tezroq tugaydigan muhitlarni asossiz ragʻbatlantirgan boʻlar edi, tezlik boʻyicha normallashtirish esa har bir iteratsiyada kamroq ish bajarishga undagan boʻlardi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Byudjet boʻyicha baholash foydalanuvchi talabini aks ettiradi: vazifa ajratilgan byudjet ichida bajarilishi kerak, aks holda natija nolga teng.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eʼlon qilingan matritsada hech bir usul vaqt chegarasiga yetib bormadi. Har bir toʻrtta usul (Mingbird, goose va b.) uchun 72 ta katakchadan hech birida real vaqt ajratilgan byudjetning 95% yoki undan koʻp qismini tashkil etmadi (koʻrsatkich nolga teng).&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"288-katakli-matritsa\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#288-katakli-matritsa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;288 katakli matritsa&lt;/span&gt;&lt;/a&gt;288 katakli matritsa&lt;/h4&gt;\n&lt;p&gt;5-jadvalda asosiy natijalar keltirilgan. Mingbird oʻzining 72 ta katagida oʻrtacha 0,886 ball toʻpladi, goose uchun bu koʻrsatkich 0,631, opencode uchun 0,479 va agent-mini uchun 0,405 ni tashkil etdi.&lt;/p&gt;\n&lt;p&gt;Statistik ahamiyatlilik. Har bir katak alohida sinov boʻlgani uchun, 18 ta vazifa tahlil birligi sifatida qaraldi. Har bir model oʻlchami ichida Mingbird raqobatchilar bilan ikki tomonlama juftlik Wilcoxon testlari orqali solishtirildi (Holm tuzatishi va 10 000 ta bootstrap qayta namunalari bilan). 2B va 12B modellarida Mingbirdning barcha raqobatchilardan ustunligi statistik jihatdan ahamiyatli (eng yuqori tuzatilgan p = 0,0008, 2B uchun; 0,0466, 12B uchun). 4B modelida faqat opencode bilan solishtirish ahamiyatli (p = 0,0181), goose va agent-mini esa ahamiyatlilik chegarasiga yetmadi. 35B modelida goose (p = 0,0415) va agent-mini (0,0005) bilan farqlar ahamiyatli, ammo opencode bilan emas. Mingbirdning umumiy ustunligi goosega nisbatan +0,255 (95% CI [0,188, 0,322]), opencodega nisbatan +0,407 va agent-mini ga nisbatan +0,481 ni tashkil etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird ayniqsa kichik modellar segmentida barqaror ustunlikka ega, bu yerda boshqa modellar samaradorligi keskin pasayadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Vazifalar oilasi boʻyicha &lt;a href=\"concepts/klasterizatsiya.html\"&gt;klasterlash&lt;/a&gt;. 18 ta vazifa 4 ta oilaga boʻlingan (qidiruv, sintez, ish jarayonlari, uzoq muddatli rejalashtirish). &lt;a href=\"concepts/klasternyy-butstrep.html\"&gt;Klasterli bootstrap&lt;/a&gt; tahlili shuni koʻrsatdiki, 4 ta oila bilan oilaviy darajadagi statistik ahamiyatlilikni tasdiqlash imkonsiz. Shunga qaramay, 2B modelida Mingbirdning ustunligi barcha toʻrtta oilada kuzatiladi. 4B va agent-mini solishtiruvi bundan mustasno, chunki uning CI qiymati nolni kesib oʻtadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Klasterli bootstrap — maʼlumotlarni guruhlarga ajratib, natijalarning tasodifiy emasligini tekshirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kichik modellar effekti. 3-rasmda koʻrsatilishicha, barcha bazaviy modellar oʻlchami kichrayganda samaradorligini yoʻqotadi: opencode 2B da 0,017 gacha, goose esa 0,271 gacha tushadi. Mingbird 2B da 0,821 ball bilan oʻzining eng yuqori natijasiga yaqin qolgan yagona tizimdir.&lt;/p&gt;\n&lt;p&gt;Ikkinchi model oilasi. Natijalar faqat bitta arxitekturaga bogʻliq emasligini tekshirish uchun qwen3.5:2b (2,3 mlrd parametr) modeli sinab koʻrildi. Mingbird bu modelda 0,779 ball toʻplab, goose (0,096), opencode (0,017) va agent-mini (0,239) dan ustun keldi. Bu shuni tasdiqlaydiki, yuqori samaradorlik Mingbird tizimining xususiyatidir.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Besh halqali raqobatbardosh baholash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Halqa&lt;/th&gt;\n&lt;th&gt;Model&lt;/th&gt;\n&lt;th&gt;n&lt;/th&gt;\n&lt;th&gt;Urinishlar&lt;/th&gt;\n&lt;th&gt;Tutib qolingan&lt;/th&gt;\n&lt;th&gt;Tutib qolish tezligi&lt;/th&gt;\n&lt;th&gt;Bayroqlar&lt;/th&gt;\n&lt;th&gt;Tasdiqlangan&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.67&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.71&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.00&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.00&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.00&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.89&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.82&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.67&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.14&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.29&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Hammasi&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Hammasi&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nazorat&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;pass6;refused3;incomplete1&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nazorat&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;pass7;refused1;timeout1;incomplete1&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Har bir holat uchun bitta ishga tushirish, ikkita model, nazoratsiz, harorat 0, fikrlash o'chirilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"uzoq-muddatli-rejalashtirish\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#uzoq-muddatli-rejalashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uzoq muddatli rejalashtirish&lt;/span&gt;&lt;/a&gt;Uzoq muddatli rejalashtirish&lt;/h4&gt;\n&lt;p&gt;Koʻp soatlik vazifalarda Mingbird oʻrtacha 0,827 natijani koʻrsatdi va agent-mini (0,484), goose (0,394) hamda opencode (0,354) modellaridan ustun keldi. Barcha koʻrsatkichlar har bir vosita uchun 12 ta nashr etilgan katakka asoslangan. Mingbirdning ustunligi vazifadagi qadamlar soni oshganda yaqqol namoyon boʻladi. Goose modelida «fikrlash» (thinking) funksiyasining oʻchirilishi uning oʻrtacha koʻrsatkichini 0,623 dan 0,394 gacha pasaytiradi. Mingbirdning eng past natijalari (0,403 va 0,429) 4B segmentlarida qayd etilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird uzoq muddatli rejalashtirish talab etiladigan vazifalarda eng yuqori samaradorlikni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"muvaffaqiyatsizlik-sabablari\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#muvaffaqiyatsizlik-sabablari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muvaffaqiyatsizlik sabablari&lt;/span&gt;&lt;/a&gt;Muvaffaqiyatsizlik sabablari&lt;/h4&gt;\n&lt;p&gt;Matritsa 288 ta ishga tushirishni oʻz ichiga oladi, ularning tahlili besh turdagi xatolikni ajratib koʻrsatishga imkon beradi. Bu taksonomiya operator hisobotlariga emas, balki bevosita oʻlchovlarga asoslangan MAST klassifikatsiyasini toʻldiradi.&lt;/p&gt;\n&lt;p&gt;• Mingbird: nol ball olgan yagona ishga tushirish (WF-08, 35B) 276 soniyadan soʻng yakunlandi: model reja tuzdi, ammo artefaktlarni yaratmadi va doimiy ravishda ish tugaganini bildirdi. Agar ushbu katak chiqarib tashlansa, 35B ning oʻrtacha bali 0,941 dan 0,996 gacha koʻtariladi. Yana bir katak (WF-09, 4B) ijrochi xatosi tufayli 0,5 ball oldi.&lt;/p&gt;\n&lt;p&gt;• agent-mini (35B): 14 ta katak &lt;a href=\"concepts/nesovmestimost-platformy.html\"&gt;platforma mos kelmasligi&lt;/a&gt; sababli nol ball oldi. Model Windows muhitida Unix buyruqlarini bajarishga urindi, bu esa 80 soniyadan kam vaqt ichida ishning toʻxtashiga olib keldi. Bu modelning emas, balki platforma integratsiyasining xatosi. Ushbu 30 ta «tezkor» katak chiqarib tashlansa, reyting oʻzgaradi: Mingbird birinchi oʻrinda qoladi (0,901), ammo agent-mini va opencode oʻrin almashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Platforma mos kelmasligi — dasturiy muhit (masalan, Windows) boshqa tizim (masalan, Unix) uchun moʻljallangan buyruqlarni tushunmasligi natijasida yuzaga keladigan nosozlik.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;• opencode: 2B segmentida aksariyat ishga tushirishlar (18 tadan 17 tasi) artefaktlar yaratilmasdan muddatidan oldin (49–115 soniya ichida) yakunlandi. Ehtimol, model yechib boʻlmaydigan holatlarni vazifa bajarilgan deb notoʻgʻri talqin qiladi.&lt;/p&gt;\n&lt;p&gt;• goose: sekin, ammo barqaror rivojlanishni koʻrsatadi. Eng koʻp vaqt sarflashiga qaramay, model katta kontekstlarda vazifalarni muvaffaqiyatli bajaradi va 35B da 0,679 ball oladi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Nashr etilgan matritsaning yig'ish oynalari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Guruh&lt;/th&gt;\n&lt;th&gt;Oyna&lt;/th&gt;\n&lt;th&gt;Harorat 0&lt;/th&gt;\n&lt;th&gt;Fikrlash o'chirilgan&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;agent-mini&lt;/td&gt;\n&lt;td&gt;09-01..04&lt;/td&gt;\n&lt;td&gt;ownconfig&lt;/td&gt;\n&lt;td&gt;ownconfig&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Mingbird&lt;/td&gt;\n&lt;td&gt;09-13..14&lt;/td&gt;\n&lt;td&gt;releaseddefault&lt;/td&gt;\n&lt;td&gt;releaseddefault&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;goose, opencode&lt;/td&gt;\n&lt;td&gt;09-18..20&lt;/td&gt;\n&lt;td&gt;transportproxy&lt;/td&gt;\n&lt;td&gt;transportproxy&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Har bir nashr etilgan katak aynan bitta oynadan olingan.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"bajarilish-vaqti\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#bajarilish-vaqti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bajarilish vaqti&lt;/span&gt;&lt;/a&gt;Bajarilish vaqti&lt;/h4&gt;\n&lt;p&gt;Oʻrtacha bajarilish vaqti (soniyalarda): Mingbird — 585,5 (mediana 440,5), goose — 866,4 (mediana 692,4), agent-mini — 233,5 (mediana 116,4), opencode — 633,4 (mediana 450,1).&lt;/p&gt;\n&lt;h4 id=\"tashqi-tekshiruv-t2-bench-uchta-domenda\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#tashqi-tekshiruv-t2-bench-uchta-domenda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashqi tekshiruv: τ2-bench uchta domenda&lt;/span&gt;&lt;/a&gt;Tashqi tekshiruv: τ2-bench uchta domenda&lt;/h4&gt;\n&lt;p&gt;LRAB maʼlumotlar toʻplami mualliflar tomonidan yaratilgani sababli, qoʻshimcha baholash uchun chakana savdo, aviaqatnovlar va telekommunikatsiya domenlarini qamrab oluvchi τ2-bench uchinchi tomon benchmarkidan foydalanildi. Ushbu testda simulyatsiya qilingan foydalanuvchi agent bilan oʻzaro aloqada boʻladi; muvaffaqiyat vazifa bajarilgandan soʻng maʼlumotlar bazasining holati bilan aniqlanadi. Agar agent vositalarni chaqirishni simulyatsiya qilsa, lekin ularni bajarmasa, tekshiruvdan oʻta olmaydi. Sinov protokoli birlashtirilgan: barcha holatlarda harorat 0 boʻlgan va «fikrlash» (thinking) rejimi oʻchirilgan qwen3.5:4b (Ollama) modeli ishlatiladi. Foydalanuvchi simulyatori — qwen3.8-flash modeli. Baholash &lt;a href=\"concepts/pass-1.html\"&gt;pass@1&lt;/a&gt; metrikayi boʻyicha amalga oshiriladi, bunda xatolar 0 ga tenglashtiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird murakkab domenlarda ustunlikni koʻrsatadi: chakana savdoda u 0,763 ball toʻpladi (native agent 0,675 va opencode 0,588), jami 278 ta vazifa boʻyicha esa 0,856 ballga erishdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;pass@1 — birinchi urinishda toʻgʻri bajarilgan vazifalar ulushini baholovchi metrika.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Chakana savdoda (114 ta vazifa) Mingbird 0,763, native agent 0,675, opencode 0,588 natija koʻrsatdi. Aviaqatnovlarda (50 ta vazifa) Mingbird va native agent tenglashdi (0,740), opencode — 0,500. Telekommunikatsiyada (114 ta vazifa) natijalar limitga yaqin: Mingbird — 1,000, opencode — 0,991, native agent — 0,930. Mingbird’ning telekommunikatsiyadagi yuqori natijasi M4 anti-loop guard (tsikldan himoya qilish) mexanizmidan foydalanishi bilan izohlanadi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 4.&lt;/strong&gt; LRAB'da ishlatiladigan va Ollama orqali taqdim etiladigan to'rtta model&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Daraja&lt;/th&gt;\n&lt;th&gt;Ollama tegi&lt;/th&gt;\n&lt;th&gt;Jami&lt;/th&gt;\n&lt;th&gt;Faol&lt;/th&gt;\n&lt;th&gt;Kvantlash&lt;/th&gt;\n&lt;th&gt;Arxitektura&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2B&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;5B&lt;/td&gt;\n&lt;td&gt;2.3B&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;MatFormer+PLE(elastic)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4B&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;4B&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;dense&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;12B&lt;/td&gt;\n&lt;td&gt;gemma4:12b&lt;/td&gt;\n&lt;td&gt;12B&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;dense&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;35B&lt;/td&gt;\n&lt;td&gt;ornith-1.5:35b&lt;/td&gt;\n&lt;td&gt;35B&lt;/td&gt;\n&lt;td&gt;∼3B&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;Qwen3.5-MoE, multimodal&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Total va Active umumiy parametrlar sonini va har bir token uchun faol parametrlar sonini ko'rsatadi; Quantization — xizmat ko'rsatiladigan vaznlar uchun ggml &lt;a href=\"concepts/quantization.html\"&gt;kvantlash&lt;/a&gt; darajasi. Barcha to'rtta teg Q4_K_M sifatida taqdim etilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"statistik-ahamiyat-va-konfiguratsiya-tasiri\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#statistik-ahamiyat-va-konfiguratsiya-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik ahamiyat va konfiguratsiya taʼsiri&lt;/span&gt;&lt;/a&gt;Statistik ahamiyat va konfiguratsiya taʼsiri&lt;/h4&gt;\n&lt;p&gt;Signifikantlikni baholash uchun Maknemar testi qoʻllanildi. Mingbird’ni native agent bilan solishtirganda farq +0,065 (p=0,030), opencode bilan esa +0,119 (p=2,7×10⁻⁵) ni tashkil etdi. Telekommunikatsiya domeni chiqarib tashlanganda (164 ta vazifa qoladi), Mingbird va native agent oʻrtasidagi farq statistik ahamiyatga ega emas (p=0,22), bu ushbu domendagi ustunlik umumiy natija uchun hal qiluvchi ekanligini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar «fikrlash» (thinking) konfiguratsiyasiga kuchli bogʻliq: uni yoqish model unumdorligini nochiziqli oʻzgartiradi, bu esa uni tizim loyihalashdagi asosiy omilga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fikrlash-konfiguratsiyalarini-tahlil-qilish\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#fikrlash-konfiguratsiyalarini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Fikrlash» konfiguratsiyalarini tahlil qilish&lt;/span&gt;&lt;/a&gt;«Fikrlash» konfiguratsiyalarini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Har bir modelga eng qulay «fikrlash» (thinking-on yoki thinking-off) konfiguratsiyasini tayinlash yakuniy reytingni oʻzgartirmaydi. τ² maʼlumotlar toʻplamida har ikkala konfiguratsiya eʼlon qilingani uchun taqqoslash imkoniyati mavjud. Har bir agent uchun eng yaxshi konfiguratsiya tanlanganda koʻrsatkichlar quyidagicha: Mingbird — 0,867 («fikrlash» yoqilgan holatda eng yaxshi), native agent — 0,791 (oʻchirilgan holatda eng yaxshi), opencode — 0,737 (oʻchirilgan holatda eng yaxshi). Yagona protokol esa mos ravishda 0,856 / 0,791 / 0,737 natijalarini koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Har bir agent uchun optimal «fikrlash» konfiguratsiyasini tanlash samaradorlikdagi farqni yoʻqotmaydi, bu Mingbird yetakchiligining barqarorligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mingbird konfiguratsiyalar oʻzgarishiga nisbatan eng kam sezgirlikni namoyon etadi (± 0,011 oraligʻida tebranish), raqobatchilarning koʻrsatkichlari esa domen darajasida sezilarli darajada oʻzgaradi. Masalan, opencode’ning muvaffaqiyat darajasi (telecompass rate) 0,298 (thinking-on) dan 0,991 (thinking-off) gacha oʻzgaradi. LRAB toʻplamida «fikrlash» taʼsirining yoʻnalishi qiyinchilik darajasiga (tier) bogʻliq. Masalan, goose modeli 35B parametrda (0,822 ga qarshi 0,679) va uzoq muddatli vazifalarda (0,623 ga qarshi 0,394) «fikrlash»dan yutadi, ammo 4B/12B modellarda yutqazadi. opencode (12B) esa aksincha natijani koʻrsatadi (0,140 ga qarshi 0,539). Demak, barcha turdagi vazifalar uchun universal optimal konfiguratsiya mavjud emas.&lt;/p&gt;\n&lt;h4 id=\"rasmiy-sozlamalardan-chetlanishlar\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#rasmiy-sozlamalardan-chetlanishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rasmiy sozlamalardan chetlanishlar&lt;/span&gt;&lt;/a&gt;Rasmiy sozlamalardan chetlanishlar&lt;/h4&gt;\n&lt;p&gt;Foydalanuvchi simulyatori sifatida rasmiy gpt-4o emas, balki qwen3.8-flash modeli ishlatilgan, shuning uchun mutlaq ballarni rasmiy yetakchilar jadvali bilan toʻgʻridan-toʻgʻri solishtirib boʻlmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Foydalanuvchi simulyatori — bu sunʼiy intellekt agentlarining javoblarini sinash uchun real inson xatti-harakatlarini taqlid qiluvchi dasturiy muhit.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Muqobil simulyator ishlatilgani sababli mutlaq koʻrsatkichlar tashqi benchmarklar bilan solishtirib boʻlmaydi, ammo agentlar oʻrtasidagi nisbiy taqqoslash toʻgʻri hisoblanadi, chunki ularning barchasi bir xil sharoitda sinovdan oʻtkazilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ablatsiya-2b-modelida-mexanizmlarni-chiqarib-tashlash\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#ablatsiya-2b-modelida-mexanizmlarni-chiqarib-tashlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ablatsiya: 2B modelida mexanizmlarni chiqarib tashlash&lt;/span&gt;&lt;/a&gt;Ablatsiya: 2B modelida mexanizmlarni chiqarib tashlash&lt;/h4&gt;\n&lt;p&gt;Tizimning alohida komponentlari hissasini baholash uchun biz v1.5.0 kod bazasida &lt;a href=\"concepts/ablyatsiya.html\"&gt;ablatsiya&lt;/a&gt; tadqiqotini o‘tkazdik. Eksperimentda har birida AGENT_ABLATION muhiti orqali bitta mexanizm o‘chirilgan to‘rtta variant ishtirok etdi. Sinovlar 18 ta LRAB vazifasida gemma4:e2b modeli yordamida (n=18 katak har bir guruh uchun) amalga oshirildi. Quyidagi mexanizmlar o‘chirildi: finish geyti (M3), teskari aloqani tekshirish sikli (M3 qismi), imzo darajasidagi siklga qarshi monitor (M4) va kategoriyali oldindan yuklash (M1). M2 va M5 mexanizmlari ablatsiyaga uchramadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ablatsiya — bu tizimning umumiy samaradorligiga ta’sirini baholash uchun uning alohida komponentlarini ketma-ket o‘chirib tashlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Asosiy chiziq sifatida to‘liq mexanizmlar to‘plami (18 ta katak) olindi. Variantlar 0 haroratda mustaqil bajarildi. Natijalar deterministik rubrika bo‘yicha baholandi. Finish geytini (finish_gate) o‘chirish oltita tekshiruvdan to‘rttasiga ta’sir qiladi (ish yo‘qligida rad etish, pytest tekshiruvi, xulosani artefaktlar bilan solishtirish, reja to‘liqligini tekshirish). Ikkita tekshiruv faol qoldi: vazifalarni sinxronlashtirish eslatmasi va yetkazib berishni o‘z-o‘zini tekshirish. Shunday qilib, qayd etilgan -0,098 o‘zgarish aynan shu to‘rtta avtomatlashtirilgan himoya hissasini aks ettiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Finish geytining o‘chirilishi samaradorlikning 0,098 ga pasayishiga olib keldi, bunda asosiy hissa (41%) benchmark test fayllarini taqdim etadigan vazifalar hissasiga to‘g‘ri keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Vazifalar bo‘yicha tahlil shuni ko‘rsatdiki, -0,098 sof effekt notekis taqsimlangan: to‘rtta vazifa har biri +0,71 atrofida o‘sish berdi, uchta vazifa esa pasayish ko‘rsatdi (-0,143 dan -0,571 gacha). To‘rtta vazifadan faqat bittasi (WF-04) tayyor benchmark test faylini o‘z ichiga olgan. Boshqa hollarda geytning foydasi mavjud bo‘lmagan artefaktlar bilan vazifalarni yakunlashni oldini olishdan iborat bo‘ldi. Finish geyti tekshiruvlarni bajara olmaydigan τ2-bench benchmarkidagi tashqi tekshiruv +0,065 dan +0,119 gacha bo‘lgan marja saqlanib qolganini ko‘rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Benchmarkdagi test fayllarining mavjudligi baholashni oshirib yuborish xavfini tug‘diradi, chunki agent ulardan o‘zini tekshirish uchun foydalanishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nashr etilgan matritsada (72 mln katak) mexanizmlarning faollashuv statistikasi quyidagicha: yetkazib berishni o‘z-o‘zini tekshirish 65 marta, sinxronizatsiya bo‘yicha rad etishlar 43 marta, xulosani solishtirish 23 marta, pytest tekshiruvlari 13 marta, reja to‘liqligini tekshirish 11 marta ishladi. Mingbird uchun vositalarni chaqirish medianasi 33,5, goose uchun 15,0, opencode uchun 5,0, agent-mini uchun 7,0 ni tashkil etdi. Mingbird uchun tokenlardan foydalanish medianasi 14 624 ni, maksimal qiymati esa 32 767 ni tashkil etdi. Bir katakni bajarishning median vaqti Mingbird uchun 440 soniya va agent-mini uchun 116 soniyani tashkil qildi.&lt;/p&gt;\n&lt;h4 id=\"nosozliklar-tahlili-va-nazorat-mexanizmlari\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#nosozliklar-tahlili-va-nazorat-mexanizmlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nosozliklar tahlili va nazorat mexanizmlari&lt;/span&gt;&lt;/a&gt;Nosozliklar tahlili va nazorat mexanizmlari&lt;/h4&gt;\n&lt;p&gt;288 ta nashr etilgan katakchalar tahlili (8-jadval) shuni koʻrsatadiki, model ishining toʻxtashiga asosiy sabab notoʻgʻri javob emas, balki vazifani bajarishdan voz kechish yoki tugallanmaganlikdir. Masalan, OpenCode bazaviy modelining 72 katakchasidan 21 tasida vositalar umuman chaqirilmagan. Boshqa hollarda (agent-mini) backend bilan aloqa uzilishi kuzatilgan, 23-44 ta katakcha esa xatolik yoki taym-autsiz tekshiruvgacha yetib bormagan. Mingbird konfiguratsiyasida 40 ta katakcha zarur artefaktlar yoʻqligi sababli toʻxtatilgan, atigi 4 ta katakcha yarim balldan past baho olgan. Ikkinchi ekspert tomonidan 24 ta katakchani mustaqil tekshirish baholashda toʻliq moslikni (24/24) koʻrsatdi, tafovutlar faqat 0,5 ball chegarasida 3 ta holatda kuzatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vazifalarning toʻxtashiga asosiy sabab model xatolari emas, balki bajarishdan voz kechish yoki texnik uzilishlardir, bu esa «muvaffaqiyatsizliklar» bahosini sabab-oqibatli emas, balki indikativ qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mexanizmlarni-ishlab-chiqish-va-oqitish-tasiri\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#mexanizmlarni-ishlab-chiqish-va-oqitish-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mexanizmlarni ishlab chiqish va oʻqitish taʼsiri&lt;/span&gt;&lt;/a&gt;Mexanizmlarni ishlab chiqish va oʻqitish taʼsiri&lt;/h4&gt;\n&lt;p&gt;Mualliflar nazorat mexanizmlari (finish gate, anti-loop monitor) LRAB maʼlumotlarini hisobga olgan holda ishlab chiqilganini tan olishadi. Masalan, v1.2.0 versiyalari rejalashtirishning uzoq gorizontlaridagi xatolarga javob sifatida yaratilgan. Shu sababli, unumdorlikdagi oʻzgarishlar (finish gate uchun −0,098 va anti-loop uchun −0,015 delta) tanlov ichidagi (in-sample) effekt bahosi sifatida qaralishi kerak. 9-jadval va 9-rasm shuni koʻrsatadiki, mexanizmlarni oʻchirishning hech biri statistik jihatdan sezilarli yaxshilanish bermaydi: 95% ishonch intervallari (10 000 resampl) nolni kesib oʻtadi. Guruhda n=18 tanlov hajmi bilan tadqiqot dizayni mexanizm effektini vazifalar dispersiyasidan ajratishga imkon bermaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/in-sample-effekt.html\"&gt;In-sample effekt&lt;/a&gt; — bu tizim oʻqitilgan yoki sozlangan maʼlumotlar asosida uning samaradorligini baholash boʻlib, bu koʻrsatkichlarni oshirib yuborishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tanlov hajmining kichikligi (n=18) tufayli natijalar statistik jihatdan ahamiyatli emas, balki yoʻnaltiruvchi (directional) xarakterga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"umumiy-sabab-lh-01-keysi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#umumiy-sabab-lh-01-keysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sabab: LH-01 keysi&lt;/span&gt;&lt;/a&gt;Umumiy sabab: LH-01 keysi&lt;/h4&gt;\n&lt;p&gt;LH-01 vazifasi barcha toʻrtta konfiguratsiyada anomal pasayishni koʻrsatishi aniqlandi (0,929 dan 0,214–0,259 gacha). Bu mexanizmlar ishiga emas, balki «umumiy sabab»ga (common cause) ishora qiladi. LH-01 — bu 180 daqiqalik koʻp bosqichli vazifa boʻlib, paketli ishlov berish sharoitlariga juda sezgir. LH-01 tahlildan chiqarilganda, koʻpgina mexanizmlarning taʼsiri nolga yaqinlashadi yoki ishorasini oʻzgartiradi. 2026-09-22 dagi eksperimentni qayta ishga tushirish pasayish mexanizmlarning yoqilganligidan qatʼi nazar takrorlanishini, 0,069 ballik tebranishlar esa jadvaldagi barcha nominal deltalar hajmiga mos kelishini tasdiqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nazorat mexanizmlariga bogʻliq deb hisoblangan effektlar aniqlikdagi haqiqiy hissa emas, balki murakkab vazifalarning (LH-01) bajarilishidagi beqarorlik natijasi ekanligi aniqlandi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bajariladigan-himoyalarni-taqqoslash\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#bajariladigan-himoyalarni-taqqoslash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bajariladigan himoyalarni taqqoslash&lt;/span&gt;&lt;/a&gt;Bajariladigan himoyalarni taqqoslash&lt;/h4&gt;\n&lt;p&gt;Bajariladigan himoyalarning (executable guards) samaradorligini baholash uchun bir kechada oʻtkazilgan tajribalar seriyasida toʻgʻridan-toʻgʻri taqqoslash amalga oshirildi, bu esa ishga tushirishlar oʻrtasidagi vaqtinchalik tafovutlar taʼsirini istisno qiladi. Ishonchlilikni oshirish uchun har bir konfiguratsiya juftligi uch marta sinovdan oʻtkazildi (har bir ishga tushirishda 18 ta vazifa). Barcha uchta holatda natijalar bajariladigan himoyalar foydasiga boʻldi: umumiy farq +0,096, +0,133 va +0,056 ni (oʻrtacha +0,095) tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bajariladigan himoyalar oddiy matnni qayta oʻqishga nisbatan taxminan 0,1 ballga ustunlik beradi, bu uchta mos keluvchi sinov seriyasi bilan tasdiqlangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Segmentlar boʻyicha tahlil quyidagi natijalarni koʻrsatdi: ish jarayoni segmentlari (workflow-segment) uchun farq +0,145, +0,157 va +0,057 ni tashkil etdi. Uzoq muddatli (long-horizon) segmentlarda qiymatlar -0,148, +0,133 va +0,051 ni tashkil etdi, bu ushbu segmentning yuqori dispersiyasiga mos keladigan belgining beqarorligini koʻrsatadi. Kontekst uchun: bir xil konfiguratsiyaga ega nazorat guruhlari oʻrtacha 0,069 diapazondagi oʻzgarishlarni koʻrsatdi, bunda uzoq muddatli segmentlardagi alohida vazifalarda tebranishlar 0,75 gacha yetdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/dispersiya.html\"&gt;Dispersiya&lt;/a&gt; — bu maʼlumotlarning tarqalish koʻrsatkichi; yuqori dispersiya shuni anglatadiki, bir xil test natijalari har safar turlicha boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Har bir katakcha uchun ballar ochiq maʼlumotlarda (benchmarks/ablation/) mavjud. Asosiy matritsadagi uzoq muddatli segment katakchalari 13–14 sentyabr kunlari oʻtkazilgan yagona sinovlarga asoslanganligini hisobga olish muhim. Toʻliq mexanizmni qayta ishga tushirish 0,5 gacha ogʻish berishi mumkinligi sababli, 5-jadvaldagi uzoq muddatli segmentlar uchun qiymatlarni ushbu oʻzgaruvchanlikni hisobga olgan holda talqin qilish kerak. Barcha vazifalar va ish jarayoni segmentlari boʻyicha umumiy natijalar barqaror koʻrsatkichlar hisoblanadi.&lt;/p&gt;\n&lt;h4 id=\"validlikka-tahdidlar\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#validlikka-tahdidlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Validlikka tahdidlar&lt;/span&gt;&lt;/a&gt;Validlikka tahdidlar&lt;/h4&gt;\n&lt;p&gt;Oʻzimiz yaratgan benchmark. LRAB vazifalari va baholash mezonlari Mingbird mualliflari tomonidan ishlab chiqilgan. Biz vazifalar toʻplami bizning instrumentimiz mexanizmlariga moslashtirilgan boʻlishi mumkinligini inkor eta olmaymiz, chunki u 3.2-boʻlimda tasvirlangan xatolik
