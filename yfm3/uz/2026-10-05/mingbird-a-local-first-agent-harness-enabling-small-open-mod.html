 shakllarini tekshirish uchun moʻljallangan. Bu nazorat qilinadigan tajribaning maqsadi, lekin ayni paytda tarafkashlikni ham keltirib chiqaradi. Biz buni barcha vazifalar, baholash kodi va xom maʼlumotlarni eʼlon qilish, shuningdek, natijalarning umumiy yoʻnalishini tasdiqlovchi tashqi τ2-bench replikatsiyasidan foydalanish orqali kamaytiramiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LRAB oʻz benchmarki tarafkashlik xavfiga ega, chunki u mualliflar tomonidan ishlab chiqilgan, biroq τ2-bench orqali tashqi tekshiruv xulosalarning izchilligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tashqi benchmarklar qamrovi. τ2-bench — bizning yagona tashqi taqqoslash manbamiz. Biz yana beshta nomzodni (AppWorld, ToolSandbox, AgentBoard, funksiya chaqirish toʻplamlari va CRMArena) tahlil qildik, ammo texnik cheklovlar tufayli ularni chiqarib tashladik: ular yo oʻz agent siklini taqdim etadi yoki lokal modellarni farqlay olmaydi (masalan, CRMArena har bir vazifa uchun 40 daqiqadan ortiq vaqt talab qilib, nol natija bergan).&lt;/p&gt;\n&lt;p&gt;Ishlab chiqish va baholashning ustma-ust tushishi. Tsikldan himoya qilish mexanizmi (M4) LRAB tarkibiga kiruvchi WF-08 vazifasi asosida ishlab chiqilgan. Sinovdan oʻtgan toʻrtta mexanizmdan uchtasi oʻquv maʼlumotlari bilan qisman kesishadi. Sinov toʻplami va ishlab chiqish oʻrtasida vaqtinchalik tafovut boʻlmagani uchun, haddan tashqari moslashish (overfitting) xavfi saqlanib qoladi. Biz shaffoflik uchun barcha maʼlumotlarni eʼlon qilamiz, mexanizmlar muzlatilgandan soʻng olingan tashqi τ2-bench natijalari esa qoʻshimcha tekshiruv vazifasini oʻtaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sinov va oʻquv tanlanmalarining ajratilmagani haddan tashqari moslashish xavfini tugʻdiradi, chunki baʼzi mexanizmlar ularni yaratishda foydalanilgan vazifalarda sinab koʻrilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Uskuna va platforma. Barcha 288 ta test Windows 11 oʻrnatilgan bitta kompyuterda (oʻrnatilgan GPU, 32 GB umumiy xotira) bajarildi. Natijalar Linux yoki diskret GPU'larga qanday oʻtishini bilmaymiz. Mingbird Windows'ga yoʻnaltirilgan, shuning uchun uning boshqa tizimlardagi ishi sinab koʻrilmagan.&lt;/p&gt;\n&lt;p&gt;Kampaniyalar tartibi. Asosiy testlar 2026-yil 1–4-sentabrda, Mingbird 13–14-sentabrda, goose va opencode uchun takroriy testlar esa 18–20-sentabrda oʻtkazildi. Tartib tasodifiy emas, blokli boʻlgan, bu tizim holatining oʻzgarishiga yoʻl qoʻyadi. Biroq, takroriy ishga tushirishlar asosiy kampaniya natijalarini tasdiqladi.&lt;/p&gt;\n&lt;p&gt;Modellar toʻplami. Biz bitta backend orqali ishlaydigan toʻrtta modeldan foydalandik. minicpm5-2b va llama3.2:3b modellari chiqarib tashlandi, chunki ular valid vosita chaqiruvlarini (tool calls) shakllantira olmadi. Bu bizning instrumentimiz emas, balki modellarning oʻz cheklovidir. Matritsaga xususiy modellar kiritilmagan, faqat 5.5-boʻlimdagi bitta test bundan mustasno.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/validnost-vyzova-instrumentov.html\"&gt;Vosita chaqiruvining validligi&lt;/a&gt; — bu modelning dasturiy muhit tushunadigan formatda (masalan, JSON-sxema) buyruqlar generatsiya qilish qobiliyati.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Baholash subyektivligi. Baholash deterministik va artefaktlarga asoslangan, ammo mezonlarning oʻzi biz tomonidan ishlab chiqilgan. Qisman ballarning ogʻirligi vazifalar tuzilishi boʻyicha bizning qarashlarimizni aks ettiradi.&lt;/p&gt;\n&lt;h4 id=\"cheklovlar-va-natijalarni-talqin-qilish\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#cheklovlar-va-natijalarni-talqin-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va natijalarni talqin qilish&lt;/span&gt;&lt;/a&gt;Cheklovlar va natijalarni talqin qilish&lt;/h4&gt;\n&lt;p&gt;Ochkoʻz dekodlash (greedy decoding, temperature=0) ishlatilganda tanlash tasodifiyligi yoʻqoladi, ammo ijro darajasidagi oʻzgaruvchanlik saqlanib qoladi. Xuddi shu mexanizmni bir xil sharoitda qayta ishga tushirish uzoq muddatli vazifalar uchun 0,5–0,7 gacha, ish jarayonlari uchun esa 0,43 gacha farqlarni keltirib chiqardi. Uchta takroriy urinishda tarmoqning oʻrtacha qiymati 0,069 doirasida oʻzgardi, alohida vazifalar uchun esa bu farq 0,75 ga yetdi. Shu sababli, 5-jadvaldagi uzoq muddatli vazifalar koʻrsatkichlari beqaror va ular faqat bitta namuna sifatida qaralishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;5-jadvaldagi uzoq muddatli vazifalar koʻrsatkichlari ijro variativligi tufayli beqaror, shuning uchun ularni yakuniy oʻrtacha qiymat emas, balki yagona oʻlchov sifatida qabul qilish lozim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;τ² ni solishtirish uchun bulutli simulyator (qwen3.8-flash) ishlatilgan, shuning uchun mutlaq ballar yetakchilar jadvali bilan taqqoslanmaydi, faqat tarmoqlararo farq nazorat qilinadi. Bulutli modellar statik emasligi sababli, bugungi kunda takroriy replikatsiya simulyator xulq-atvorining oʻzgarishiga (drift) duch kelishi mumkin. Ablyatsiya tadqiqoti (5.6-boʻlim) faqat bitta 2B-modelda 18 ta vazifa boʻyicha oʻtkazilgan, bu mexanizmlarning oʻzaro taʼsirini yoki kattaroq modellardagi ishini baholashga imkon bermaydi. Xavfsizlik baholashi (3.2.11-boʻlim) 54 ta proba asosida oʻtkazilgan; aniqlangan sizib chiqishlar tizimli qoida kamchiliklari hisoblanadi.&lt;/p&gt;\n&lt;h4 id=\"muhokama-va-kelgusi-ishlar\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#muhokama-va-kelgusi-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama va kelgusi ishlar&lt;/span&gt;&lt;/a&gt;Muhokama va kelgusi ishlar&lt;/h4&gt;\n&lt;p&gt;Natijalar shuni koʻrsatadiki, kichik modellar uchun «harness» (qobiq) imkoniyatlarning katta qismini belgilaydi. 2B-modellarda bir xil model turli qobiqlar bilan 0,017 dan 0,821 gacha muvaffaqiyat koʻrsatadi. Muvaffaqiyatsizlik sabablari (prefill toʻlib ketishi, cheksiz sikllar, parsing xatolari) qayta oʻqitishni talab qilmaydigan muhandislik muammolaridir. 2B-modellarda unumdorlikka eng katta taʼsirni «finish gate» mexanizmi koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ablyatsiya — tizimning alohida komponentlarini ketma-ket oʻchirib, ularning umumiy natijaga qoʻshgan hissasini aniqlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kelgusida Mingbird’ni macOS va Linux’ga koʻchirish rejalashtirilgan, chunki agent-mini natijalari platformaga moslik model imkoniyatlaridan ustun boʻlishi mumkinligini koʻrsatadi. LRAB uchun insoniy bazaviy koʻrsatkichni (human baseline) yaratish olingan ballarni kalibrlash uchun eng qimmatli qoʻshimcha boʻladi. Shuningdek, har bir mexanizmning hissasini aniqlash uchun ablyatsiya tadqiqotlarini barcha modellar matritsasi boʻylab kengaytirish rejalashtirilgan.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Biz Mingbird tizimini taqdim etdik — Windows va Ollama uchun moʻljallangan mahalliy agent muhiti boʻlib, u kichik modellardagi nosozliklarni birinchi darajali muhandislik vazifalari sifatida koʻrib chiqadi. Baholash nazorat qilinadigan tajriba asosida oʻtkazildi: 288 ta katakcha (cell), toʻrtta muhit, toʻrtta ochiq model (2B–35B) bitta mashinada va deterministik baholash tizimi yordamida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird umumiy koʻrsatkichda 0,886 ballga erishdi, taqqoslash uchun boshqa uchta bazaviy yechimlar 0,631, 0,479 va 0,405 ball toʻpladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Uzoq muddatli rejalashtirish segmentida tizim har bir katakcha uchun bitta urinishda 0,827 koʻrsatkichni qayd etdi. τ2-bench tizimidagi tashqi replikatsiya (278 ta vazifa, 4B hajmli model) yondashuvning toʻgʻriligini tasdiqladi: 0,856 ball, raqobatchilarda esa 0,791 va 0,737. Ilgʻor (frontier) modeldagi sinovlar shuni koʻrsatdiki, nuqsonli muhit model imkoniyatlarining yarmidan koʻpini yashirib qoʻyishi mumkin, sifatli muhitlar esa bir-biridan atigi 0,072–0,12 farq qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/scaffold.html\"&gt;Scaffold&lt;/a&gt; (qurilma) — bu til modeliga operatsion tizim va vositalar bilan ishlashga yordam beradigan dasturiy qobiq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mexanizmlarni birma-bir chiqarib tashlash (ablation) usuli shuni koʻrsatdiki, natijalardagi farqning asosiy qismi «finish gate» (yakuniy darvoza) mexanizmiga toʻgʻri keladi. Biz barcha natijalarni ochiq eʼlon qildik, shunda ularni mustaqil ravishda qayta hisoblash yoki rad etish mumkin. Tadqiqot shuni koʻrsatadiki, modelning qobiliyatsizligi deb hisoblangan koʻplab muammolar aslida muhitdagi nuqsonlar boʻlib, ularni tuzatish imkoniyati mavjud.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat Windows va Ollama muhitlari bilan cheklangan; boshqa tizimlarda natijalar turlicha boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f2.jpg\" alt=\"2-rasm: Prefill qiymati oʻlchangan prompt uzunligiga nisbatan (log-log). x oʻqi — backend tomonidan xabar qilingan promp\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Prefill qiymati oʻlchangan prompt uzunligiga nisbatan (log-log). x oʻqi — backend tomonidan xabar qilingan prompt tokenlar soni (prompt_eval_count); y oʻqi — backendning promptni baholash vaqti, har bir soʻrov uchun keshni chetlab oʻtuvchi (nonce)…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Prefill qiymati oʻlchangan prompt uzunligiga nisbatan (log-log). x oʻqi — backend tomonidan xabar qilingan prompt tokenlar soni (prompt_eval_count); y oʻqi — backendning promptni baholash vaqti, har bir soʻrov uchun keshni chetlab oʻtuvchi (nonce) prefiks bilan uchta yugurishning medianasi. Har bir yugurish uchun qiymatlar saqlanmagan, shuning uchun xatolik chiziqlari (error bars) koʻrsatilmagan. Boʻsh markerlar: bench (19 ta vosita), full-configuration (31 ta) va duplicated-schema (256 ta) ankorlari. Uzuk chiziqlar — eng kichik kvadratlar usuli bilan moslashtirish (4B: har bir token uchun 0,20 ms, R²=0,9991). Matnda keltirilgan 774/797 tokenlik statik byudjetlar oʻlchovlar emas, balki baholashlardir va bu oʻqda chizilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f4.jpg\" alt=\"4-rasm: LRAB vazifa darajasidagi issiqlik xaritasi: 18 ta vazifa (qatorlar; LH-01–LH-03 yuqorida, WF-01–WF-15 quyida, aj\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: LRAB vazifa darajasidagi issiqlik xaritasi: 18 ta vazifa (qatorlar; LH-01–LH-03 yuqorida, WF-01–WF-15 quyida, ajratilgan) × toʻrtta bogʻlam (ustunlar); har bir katakcha toʻrtta model darajasi boʻyicha oʻrtacha ballni ifodalaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: LRAB vazifa darajasidagi issiqlik xaritasi: 18 ta vazifa (qatorlar; LH-01–LH-03 yuqorida, WF-01–WF-15 quyida, ajratilgan) × toʻrtta bogʻlam (ustunlar); har bir katakcha toʻrtta model darajasi boʻyicha oʻrtacha ballni ifodalaydi. Mingbird ustuni kontur bilan belgilangan. Rasm nosozliklar tuzilishini bitta oʻrtacha qiymat ortiga yashirmasdan, koʻrinadigan qiladi: Mingbirdning eng zaif vazifasi WF-09 (0,70) boʻlib, u oʻzining bajarish xatosi katakchasini oʻz ichiga oladi, opencode esa LH-01 da oʻrtacha 0,036, WF-09 da esa agent-mini va goose oʻrtacha 0,071 va 0,643 ballga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f6.jpg\" alt=\"6-rasm: LRAB bali har bir katakcha uchun devor soati vaqtiga nisbatan (nashr etilgan CSV qatoriga bitta nuqta; yozib oli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: LRAB bali har bir katakcha uchun devor soati vaqtiga nisbatan (nashr etilgan CSV qatoriga bitta nuqta; yozib olingan devor soati vaqti boʻlmagan yagona goose katakchasi chiqarib tashlangan, 287 ta nuqta qolgan; logarifmik vaqt oʻqi; rang bogʻlamni…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm: LRAB bali har bir katakcha uchun devor soati vaqtiga nisbatan (nashr etilgan CSV qatoriga bitta nuqta; yozib olingan devor soati vaqti boʻlmagan yagona goose katakchasi chiqarib tashlangan, 287 ta nuqta qolgan; logarifmik vaqt oʻqi; rang bogʻlamni, marker oʻlchami model darajasini kodlaydi). Uzuk vertikal chiziqlar katakcha uchun byudjetlarni belgilaydi (workflow katakchalari uchun 90 daqiqa, long-horizon uchun 180 daqiqa); byudjetini tugatgan katakcha 0 ball oladi. 80 soniyadan past boʻlgan tezkor, lekin boʻsh klaster agent-mini ning 35B platforma mos kelmasligi katakchalarini oʻz ichiga oladi, sekin, lekin mazmunli «dum» qismida esa goose ustunlik qiladi. Rasm 4.5-boʻlimdagi byudjet-narxlash protokolining vizual shaklidir: hech bir oʻq yolgʻiz oʻzi kredit qozonmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f7.jpg\" alt=\"7-rasm: Domen va guruh boʻyicha τ2-benchpass@1 stavkalari (114 ta retail, 50 ta airline, 114 ta telecom vazifalari; agen\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Domen va guruh boʻyicha τ2-benchpass@1 stavkalari (114 ta retail, 50 ta airline, 114 ta telecom vazifalari; agent tomoni har doim bir xil mahalliy qwen3.5:4b modeli, 0 harorat va oʻchirilgan fikrlash bilan, foydalanuvchi simulyatori esa har doim bir…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm: Domen va guruh boʻyicha τ2-benchpass@1 stavkalari (114 ta retail, 50 ta airline, 114 ta telecom vazifalari; agent tomoni har doim bir xil mahalliy qwen3.5:4b modeli, 0 harorat va oʻchirilgan fikrlash bilan, foydalanuvchi simulyatori esa har doim bir xil bulutli model). Moʻylovlar (whiskers) — vazifa darajasidagi bootstrap 95% ishonch intervallari. Uchta yakunlangan guruh nol xatoli urinishlar bilan ishni tugatdi. telecom toʻyinganlikka yaqin (1,000/0,991/0,930); goose guruhi oʻtkazish qobiliyati tufayli qoldirilgan va koʻrsatilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f9.jpg\" alt=\"9-rasm: Bitta mexanizmni qoldirib ketish ablyatsiyasi (v1.5.0 kod bazasi, LRAB vazifalar toʻplami, gemma4:e2b, har bir g\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm: Bitta mexanizmni qoldirib ketish ablyatsiyasi (v1.5.0 kod bazasi, LRAB vazifalar toʻplami, gemma4:e2b, har bir guruh uchun n = 18; bazaviy daraja 9-jadvaldagi bir xil kodli toʻliq mexanizm guruhidir).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-rasm: Bitta mexanizmni qoldirib ketish ablyatsiyasi (v1.5.0 kod bazasi, LRAB vazifalar toʻplami, gemma4:e2b, har bir guruh uchun n = 18; bazaviy daraja 9-jadvaldagi bir xil kodli toʻliq mexanizm guruhidir). Chapda: har bir oʻchirilgan mexanizm uchun oʻrtacha ball oʻzgarishi, 10 000 ta vazifa darajasidagi qayta namuna olish boʻyicha bootstrap 95% ishonch intervallari bilan (finish gate (−0,266, +0,063), verification feedback (−0,185, +0,076), anti-loop (−0,134, +0,092), flat prefill (−0,119, +0,093); har bir interval nolni kesib oʻtadi, shuning uchun effektlar yoʻnalishlidir; faqat finish-gate ustuni ranglangan boʻlib, eng katta yagona deltani belgilaydi — ranglash alohida statistik maqomga ega emas). Oʻngda: vazifalar boʻyicha oʻzgarishlar, vazifa oilasi boʻyicha ranglangan (LH va WF). Toʻrtta guruh boʻylab LH-segmentining pasayishining katta qismi LH-01 ning umumiy sababli siljishi bilan bogʻliq boʻlib, u har bir guruhda pasayadi (5.6-boʻlimdagi sezgirlik); ushbu dizayn ostida oilaviy boʻlinishning mexanizm darajasidagi oʻqishlari ajralib turmaydi. WF oilasi ham oʻzgarishsiz qolmagan: verification feedback ni oʻchirish WF oʻrtacha qiymatini +0,033 (bir oz yaxshiroq) qoldiradi va finish-gate guruhining WF oʻrtacha qiymati +0,074 ni tashkil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-sma
