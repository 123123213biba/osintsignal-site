            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"147\" cy=\"161\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"533\" cy=\"205\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · WEB_ARCHIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Hukumat hisobotlardan&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;so‘zlarni olib tashlab,&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ilmiy tadqiqotlarni qanday&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;«yo‘qotmoqda»&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f1.jpg\" alt=\"1-rasm: Taqrizchi tomonidan tahrirlangan matn, undan miqdor olinadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Taqrizchi tomonidan tahrirlangan matn, undan miqdor olinadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Taqrizchi tomonidan tahrirlangan matn, undan miqdor olinadi. (A) Umumiy matn: taqrizchi xulosalar bilan ishlaydi, undan miqdor olinadi va NIH tomonidan nashr etilgan maʼlumotlar hamda xulosada yaratilmaydigan, tadqiqot jihatlarini qayd etuvchi amaliy yozuvlarga qoʻshiladi. Yakunlangan grantlar hisobdan chiqariladi. (B) FY2023→FY2024 va FY2024→FY2025 davrida barcha tanlov terminlarini yoʻqotgan belgilangan davomiy loyihalar ulushi, byudjet boshlanishidan to berilishigacha boʻlgan kunlar boʻyicha.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Tadqiqotchilar 37 790 ta NIH grantini tahlil qilib, leksik senzura davlat statistikasiga qanday ta'sir qilishini o‘rganishdi. Grant matnlaridan etnik guruhlar nomini olib tashlash loyihalarni «ozchiliklar salomatligi» toifasidan chiqarib tashlashga olib keldi. Bunda moliyalashtirish va olimlarning real ishi o‘zgarishsiz qolmoqda, bu esa fan yo‘nalishlari go‘yoki yo‘qolib borayotgandek taassurot qoldiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Grant matnidan so‘zlarni olib tashlash loyihani avtomatik ravishda NIH toifalaridan chiqarib tashlaydi.&lt;/li&gt;\n&lt;li&gt;Matni o‘zgarmagan loyihalarning 99,4% toifani saqlab qoldi, matnni o‘zgartirganlarda bu ko‘rsatkich 15,7% ni tashkil etdi.&lt;/li&gt;\n&lt;li&gt;Moliyalashtirish to‘xtamadi, ammo ilmiy hisobotlarda loyihalar endi ko‘rinmaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;AQSh Milliy sog‘liqni saqlash institutlari (NIH) grantlarni 300 dan ortiq toifaga avtomatik tasniflash uchun RCDC (&lt;a href=\"concepts/rcdc.html\"&gt;Research, Condition, and Disease Categorization&lt;/a&gt;) tizimidan foydalanadi. 2025-yilda idora grant oluvchilardan DEI (xilma-xillik, tenglik va inklyuziya) bilan bog‘liq atamalarni loyiha tavsiflaridan olib tashlashni talab qildi. Tadqiqot mualliflari 37 790 ta davom etayotgan loyihani kuzatib, ularning yangilangan matnlarini klinik sinovlar reyestrlari va nashrlar bilan solishtirdi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko‘rsatdiki, matni o‘zgarmagan loyihalarning «ozchiliklar salomatligi» toifasida qolish ehtimoli 99,4% ni tashkil etdi, matnidan aholi guruhlari nomini olib tashlaganlarda esa bu ko‘rsatkich 15,7% gacha tushib ketdi. Ko‘r-ko‘rona taqriz (blinded review) shuni tasdiqladiki, bunday «yo‘qolgan» loyihalarning 84 foizi toifa mezonlariga hamon mos keladi. «So‘zlarni nishonga olish» deb nomlangan bu mexanizm «hisobga olinmagan fan»ni keltirib chiqaradi: moliyalashtirish davom etmoqda, ammo davlat statistikasi aholining aniq guruhlari bilan ishlashni qayd etmay qo‘ydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot matnlar va tashqi reyestrlarni tahlil qilishga asoslangan, mansabdor shaxslar va olimlar o‘rtasidagi ichki yozishmalarga kirish imkoni yo‘q.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Moliyalashtiruvchi tashkilotlar grant arizalaridagi matnni tasniflovchi dasturiy taʼminotdan foydalanadilar. AQSh Milliy sogʻliqni saqlash instituti (NIH) xarajatlarni shu yoʻl bilan tahlil qilingan 300 dan ortiq toifalar boʻyicha taqsimlaydi. 2025-yilda NIH DEI (xilma-xillik, tenglik va inklyuzivlik) bilan bogʻliq iboralarni DEI faoliyatini qoʻllab-quvvatlamaydigan arizalardan olib tashlashni talab qildi va shu tariqa ushbu soʻzlarni kuzatishni boshladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatdiki, loyiha tavsiflaridan irqiy va etnik guruhlarning tilga olinishini olib tashlash, moliyalashtirish saqlanib qolganiga qaramay, 84,3% loyihalarda «ozchiliklar salomatligi» tasnifining yoʻqolishiga olib keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz 37 790 ta davom etayotgan grantni tahlil qilib, ularni amaliy faoliyat yozuvlari bilan solishtirdik. Aholi nomlari muhim bashoratchi boʻlib chiqdi: sinovlarning bazaviy koʻrsatkichlariga ega yangi tadqiqotlarda qora tanli aholining nomlanishi ishtirokchilar ulushining 60 foiz bandga oshishini bashorat qildi. Matn xususiyatlari qaysi nomlar saqlanib qolishini belgilab berdi, amaliy yozuvlar esa kam maʼlumot qoʻshdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Matn xususiyatlari» — bu hujjatlardagi soʻz va iboralarni tahlil qilishning algoritmli usullari boʻlib, ular ilmiy ishlarni mazmunini chuqur oʻrganmasdan tasniflash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;NIHning «ozchiliklar salomatligi» toifasi matndagi eslatmalarga bevosita bogʻliq edi: tavsifni saqlab qolgan loyihalarning 99,4% toifani ham saqlab qoldi. Irqiy yoki etnik guruh nomini olib tashlaganlar orasida esa atigi 15,7% loyiha toifani saqlab qoldi, garchi moliyalashtirish toʻxtatilmagan boʻlsa ham. 50 ta shunday holatni koʻr-koʻrona baholash shuni koʻrsatdiki, 42 tasi (84%) 2024-moliya yilidagi toifa taʼrifiga mos kelgan. 70 ta tavsifni tahrirdan oldin va keyin solishtirish shuni koʻrsatdiki, 49 ta holatda aholiga oid tadqiqot maqsadlari qayta shakllantirilgan. 2025-moliya yilidagi 63 ta tavsif endilikda toifa mezonlariga mos kelmay qolgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot NIH matnli maʼlumotlarini tahlil qilishga asoslangan; «hisobga olinmagan fan» haqidagi xulosalar ilmiy tadqiqotlarning mazmuni emas, balki tasniflash metodologiyasiga tegishli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jinsiy va gender ozchiliklarni tilga olgan grantlar, roʻyxatga olingan atamalar, institut va faoliyat turi boʻyicha tuzatishlardan soʻng, «tugatilgan» deb belgilanish ehtimoli 37,8 foiz bandga yuqori boʻlgan. Biz bu mexanizmni «soʻzlarni nishonga olish», uning chegarasini esa «aholini nishonga olish» deb ataymiz. Buning natijasi «hisobga olinmagan fan»dir: moliyalashtiriladigan, ammo statistikada qayd etilmaydigan tadqiqotlar. Tizim tahrirlangan matnni kuzatganligi sababli, ilmiy ishning mohiyati tavsif bilan birga oʻzgarganmi yoki yoʻqmi, buni aniqlashning imkoni yoʻq.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"tadqiqot-portfellarini-tahlil-qilish-uchun-dasturiy-taminotdan-foydalanish\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tadqiqot-portfellarini-tahlil-qilish-uchun-dasturiy-taminotdan-foydalanish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot portfellarini tahlil qilish uchun dasturiy taʼminotdan foydalanish&lt;/span&gt;&lt;/a&gt;Tadqiqot portfellarini tahlil qilish uchun dasturiy taʼminotdan foydalanish&lt;/h4&gt;\n&lt;p&gt;Ilmiy tadqiqotlarni moliyalashtiruvchi jamgʻarmalar grant arizalari matnlarini avtomatik tasniflash uchun maxsus dasturiy taʼminotdan tobora koʻproq foydalanmoqda. Bunday yondashuv tashkilotlarga oʻz loyihalar portfelini tizimlashtirish imkonini beradi. AQSh Milliy sogʻliqni saqlash institutlari (NIH) ushbu sohada kashshoflardan biri boʻlib, 2008-yildan buyon tahlilning shunday usullaridan foydalanib kelmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Matnlarni tasniflash — bu mashinali oʻqitish usuli boʻlib, unda algoritm kalit soʻzlar va kontekstni tahlil qilish asosida ilmiy ishlar yoki arizalarga avtomatik ravishda mavzuli toifalarni tayinlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tasniflash tizimlari jamgʻarmalarga resurslar taqsimotini kuzatish, moliyalashtirishdagi boʻshliqlarni aniqlash va turli yoʻnalishlar boʻyicha ilmiy samaradorlikni baholash imkonini beradi. Avtomatlashtirilgan vositalardan foydalanish har yili minglab arizalarni qayta ishlashda qoʻl mehnatini minimallashtirib, grantlar toʻgʻrisidagi katta hajmdagi maʼlumotlarni boshqarish uchun standartga aylanmoqda.&lt;/p&gt;\n&lt;p&gt;RCDC (Research, Condition, and Disease Categorization) tizimi AQSH Milliy sogʻliqni saqlash institutlari (NIH) tomonidan grantlarni saraton kasalligidan tortib ozchiliklar salomatligigacha boʻlgan 300 dan ortiq toifalarga ajratish uchun qoʻllanadi. Ushbu maʼlumotlar davlat mablagʻlari qaysi ilmiy tadqiqotlarga sarflanayotganining rasmiy hisoboti hisoblanadi. Boshqa fondlar ham shunga oʻxshash tasniflash tizimlaridan foydalanadi. Ushbu maʼlumotlar tadqiqotchilar uchun moliyalashtirishning kasalliklar yukiga mosligini tahlil qilishda, huquq himoyachilari uchun byudjetni oshirishni asoslashda va NIH maʼmuriyati uchun ilmiy portfeldagi boʻshliqlarni aniqlashda muhim ahamiyatga ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatadiki, grant arizalari matnlarini majburiy tahrirlash NIH rasmiy statistikasini buzib koʻrsatadi va amalda moliyalashtirilishda davom etayotgan tadqiqotlarni «koʻrinmas» qilib qoʻyadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Anʼanaviy ravishda bu sohadagi ishlar tasniflash aniqligi va indikatorlarning olimlar xulq-atvoriga taʼsiriga qaratilgan. Biroq, fondning oʻzi dasturiy taʼminot tahlil qiladigan matnlar mazmunini belgilay boshlagan holatlar ilgari oʻrganilmagan. 2025-yilda NIH grant arizalarini DEI (xilma-xillik, tenglik va inklyuziya) nuqtayi nazaridan qayta koʻrib chiqishni talab qildi va moliyalashtirish uchun tegishli iboralarni olib tashlashni buyurdi. Garchi federal sud 2025-yil iyun oyida ushbu koʻrsatmalarni bekor qilgan boʻlsa-da, koʻplab sarlavha va annotatsiyalar oʻzgartirib boʻlingan edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RCDC — bu grantlarni mavzuli toifalarga ajratish uchun sarlavha va annotatsiyalarni tahlil qiluvchi avtomatlashtirilgan tasniflash tizimi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar 37 790 ta davom etayotgan loyihani tahlil qilib, etnik va irqiy guruhlarning tilga olinishini kuzatdilar. Natijalar shuni koʻrsatdiki, agar loyiha annotatsiyasi oʻzgarishsiz qolsa, «Irqiy va etnik ozchiliklar salomatligi boʻyicha tadqiqotlar» toifasini saqlab qolish ehtimoli 99,4% ni tashkil etgan. Agar matndan guruh nomi olib tashlansa, bu ehtimol 15,7% gacha tushib ketgan. Shu bilan birga, tashqi yozuvlar (klinik sinovlar va ishtirokchilar maʼlumotlari) loyihalar ushbu guruhlar bilan ishlashda davom etganini tasdiqlagan. Tahrirlangan 20 ta loyihadan 17 tasi toifani yoʻqotgan, garchi mustaqil ekspertlar 2024-yilgi maʼlumotlarga koʻra loyihalar toifa mezonlariga mos kelishini tasdiqlagan boʻlsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot NIH maʼmuriy maʼlumotlarini tahlil qilish va ularni klinik sinovlar yozuvlari bilan solishtirishga asoslangan; xulosalar ilmiy ishlarning sifatiga emas, balki hisobot mexanizmlariga tegishli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sozlarni-nishonga-olish-word-targeting\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#sozlarni-nishonga-olish-word-targeting\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;So'zlarni nishonga olish (Word targeting)&lt;/span&gt;&lt;/a&gt;So'zlarni nishonga olish (Word targeting)&lt;/h4&gt;\n&lt;p&gt;Biz «so'zlarni nishonga olish» tushunchasini kiritamiz — bu moliyalashtiruvchi tashkilot statistikani shakllantiradigan matnni tahrirlash mexanizmi. Bu mexanizm tekshirilishi mumkin bo'lgan bashoratlarga ega va tahrirlovchining niyatini tahlil qilishni talab qilmaydi. So'zlar kontekstni hisobga oladi (masalan, «hujayralar ozchiligi» iborasi saqlanib qoladi, chunki u demografik guruhga tegishli emas).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«So'zlarni nishonga olish» metodi ideallashtirilgan modeldir; u tahrirlar ilmiy ishning mohiyatini emas, balki muayyan atamalarni olib tashlashga qaratilganligini taxmin qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bundan uchta xulosa kelib chiqadi: 1) O'chiriladigan so'zlar matn tomonidan tanlanadi. Biz tahrirlar faqat shaklni yoki tadqiqot mohiyatini o'zgartirayotganini tekshiramiz. 2) Statistika tahrirlarni meros qilib oladi. Tahrirlangan matndan olingan toifa buzilgan bo'ladi, bu esa «hisobga olinmagan fan»ga olib kelishi mumkin. 3) So'zlarni nishonga olish chegaraga ega. Agar bosim matnga emas, balki populyatsiyaning o'ziga qaratilgan bo'lsa, so'zlarni tahrirlash samarasiz bo'ladi va harakatlar grantni bekor qilish darajasiga o'tadi. 1-jadvalda (Natijalar bo'limidan keyin) ushbu oqibatlar va har biri uchun dalillar ro'yxati keltirilgan.&lt;/p&gt;\n&lt;p&gt;2025-yil 20 va 21-yanvardagi ijro farmonlari DEI (xilma-xillik, tenglik va inklyuzivlik) dasturlari va «gender mafkurasi» masalalariga qaratildi. 2025-yil mart oyida NIH loyihalarni DEI ishtirokiga ko‘ra saralash va DEI faoliyatini qo‘llab-quvvatlamaydigan grantlardan tegishli terminlarni olib tashlash bo‘yicha ko‘rsatma chiqardi. «LatinX» atamasi taqiqlangani xabar qilindi. 2025-yil iyun oyida sud ushbu direktivalarni bekor qildi, avgust oyida esa Oliy sud bekor qilish qarorini kuchda qoldirdi. 2025-yil oxiriga kelib, NIH 235 ta atamani tekshiruvchi matnli skrining tizimini joriy etdi. 2026-yil sentyabrdagi da’voga ko‘ra, ushbu ro‘yxat 2025-yilda bekor qilingan grantlarda tez-tez uchragan so‘zlar asosida tuzilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2025-yil oxirida joriy etilgan NIH skrining tizimi 2025-yildagi tartibga solish o‘zgarishlari paytida bekor qilingan grantlar leksikasi asosida tuzilgan 235 ta atamadan iborat ro‘yxatdan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"thevocabularythereviewwouldacton\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#thevocabularythereviewwouldacton\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Thevocabularythereviewwouldacton&lt;/span&gt;&lt;/a&gt;Thevocabularythereviewwouldacton&lt;/h4&gt;\n&lt;p&gt;NIHning yangi grantlarida skrining terminlari ulushi 2015-moliya yilidagi 6,4%dan 2024-yilda 15,8%gacha oshdi. NSFda ham shunga o‘xshash tendensiya kuzatildi (2015–2019 yillardagi 29,2%dan 2023–2024 yillardagi 38,4%gacha). Aholini nomlash ham kengaydi: vasiylar (caregivers) 5,9 barobar, ispanzabon guruhlar 2,8 barobar, qora tanli aholi 1,4 barobar ko‘paydi. Skriningning o‘ziga xosligi «equit-», «underrepresent-» va «minorit-» kabi o‘zak so‘zlarda namoyon bo‘ldi. Ushbu leksikaning bir xil tadqiqotchilar guruhida o‘sishi tadqiqot turining emas, balki yozish uslubining o‘zgarganidan dalolat beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Skrining-terminlar — bu tartibga soluvchilar nazorati ostiga tushgan va ilmiy ishning mohiyatidan ko‘ra akademik tilning o‘zgarishini aks ettiruvchi kalit so‘zlardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"data\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#data\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Data&lt;/span&gt;&lt;/a&gt;Data&lt;/h4&gt;\n&lt;p&gt;Tadqiqot &lt;a href=\"concepts/nih-exporter.html\"&gt;NIH ExPORTER&lt;/a&gt; (2015–2025) ma’lumotlariga, jumladan grant nomlari, annotatsiyalari va byudjetlariga asoslanadi. Tahlil NIH tashqi grantlarini qamrab oladi. Loyihalarni nashrlar bilan bog‘lash (2016–2026 yillardagi 1,25 mln maqola) uchun OpenAlex ishlatilgan. 2021-yilgacha bo‘lgan maqolalar uchun &lt;a href=\"concepts/medical-subject-headings.html\"&gt;MeSH&lt;/a&gt; deskriptorlari ekspert, 2022-yildan keyingilari esa avtomatlashtirilgan deb hisoblanadi. Klinik sinovlar ma’lumotlari AACT (2025-yil yanvar va 2026-yil sentyabr)dan olingan. RCDC kategoriyalari (masalan, &lt;a href=\"concepts/remhr.html\"&gt;REMHR&lt;/a&gt; — ozchiliklar salomatligi tadqiqotlari) matnli tahlil orqali ajratib olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2022-yildan keyingi avtomatlashtirilgan MeSH deskriptorlaridan foydalanish o‘tgan yillardagi ekspert indeksatsiyasi bilan solishtirish aniqligini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"terms\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#terms\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Terms&lt;/span&gt;&lt;/a&gt;Terms&lt;/h4&gt;\n&lt;p&gt;Skrining terminlari 235 ta so‘zdan iborat ro‘yxatni o‘z ichiga oladi. O‘chirish va bekor qilishlarni tahlil qilish uchun 2024-yil oktyabr oyida e’lon qilingan 699 ta atamadan iborat «Senat ro‘yxati» ishlatilgan. «Belgilangan grantlar» — bu skrining ro‘yxatidagi kamida bitta terminni o‘z ichiga olgan arizalardir. Tadqiqotchilar oltita maqsadli guruhni (masalan, SGM, irqiy ozchiliklar) va sakkizta nazorat guruhini (masalan, faxriylar, sportchilar) ajratib ko‘rsatishdi, bu esa loyiha mavzusiga qarab shakllantirishlar qanday o‘zgarganini baholash imkonini beradi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"onlab-belgilangan-xulosalarning-torttasi-bir-yil-ichida-atamalarni-yoqotdi\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#onlab-belgilangan-xulosalarning-torttasi-bir-yil-ichida-atamalarni-yoqotdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oʻnlab belgilangan xulosalarning toʻrttasi bir yil ichida atamalarni yoʻqotdi&lt;/span&gt;&lt;/a&gt;Oʻnlab belgilangan xulosalarning toʻrttasi bir yil ichida atamalarni yoʻqotdi&lt;/h4&gt;\n&lt;p&gt;2025-moliya yiliga moʻljallangan 5461 ta grantdan 2169 tasida (39,7%) asosiy atamalar xulosalardan gʻoyib boʻlgan. Bir yil avval bu koʻrsatkich atigi 0,08% (5242 tadan 4 tasi) edi. Atamaning oʻchirilish ehtimoli grantning kechikishiga qarab oshgan: oʻz vaqtida berilgan grantlar uchun 27,8% dan, byudjet davri boshlanganidan 90 kun oʻtib berilganlari uchun 54,6% gacha. Oʻchirish kontekstga bogʻliq boʻlgan: agar atama tasodifiy ishlatilgan boʻlsa (masalan, «hujayralar ozchiligi»), u 2,4% hollarda yoʻqolgan, maqsadli maʼnoda ishlatilganda esa — 40,6% hollarda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2025-yilga uzaytirilgan 2024-yil grantlarining 39,7% qismida xulosalardagi asosiy atamalar yoʻqolgan, bunda kechikib berilgan hujjatlarda oʻchirilish ehtimoli yuqoriroq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aholi-nomlari-ishtirokchilarni-tanlash-bashoratchisi-sifatida\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#aholi-nomlari-ishtirokchilarni-tanlash-bashoratchisi-sifatida\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aholi nomlari ishtirokchilarni tanlash bashoratchisi sifatida&lt;/span&gt;&lt;/a&gt;Aholi nomlari ishtirokchilarni tanlash bashoratchisi sifatida&lt;/h4&gt;\n&lt;p&gt;Grant nomida muayyan aholi guruhini koʻrsatish klinik tadqiqotlar ishtirokchilari tarkibi bilan statistik bogʻliq (2-rasm A). Dastlabki maʼlumotlari eʼlon qilingan yangi grantlar orasida, agar guruh nomi sarlavhada boʻlsa, qora tanli ishtirokchilar ulushi 60 foiz punktga (f.p.) yuqori (95% DI: 51–68), agar faqat annotatsiyada boʻlsa — 30 f.p. ga yuqori (23–37) boʻlgan. Xuddi shunday taʼsir ispanzabon ishtirokchilar (75 va 23 f.p.) va ayollar (39 va 17 f.p.) uchun ham kuzatilgan. MeSH maʼlumotlari bu tendensiyani tasdiqladi (2-rasm B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;MeSH (Medical Subject Headings) — ilmiy maqolalarni indekslash uchun boshqariladigan lugʻat tizimi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"matn-xususiyatlari-nomlarning-saqlanib-qolishini-bashorat-qildi\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#matn-xususiyatlari-nomlarning-saqlanib-qolishini-bashorat-qildi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Matn xususiyatlari nomlarning saqlanib qolishini bashorat qildi&lt;/span&gt;&lt;/a&gt;Matn xususiyatlari nomlarning saqlanib qolishini bashorat qildi&lt;/h4&gt;\n&lt;p&gt;Nomlarning saqlanib qolishi matn tuzilishiga (gap, shakl va aholi) bogʻliq boʻlgan. Agar guruh nomi «maqsadli atama» bilan bir gapda boʻlsa, u tez-tez oʻchirilgan. Masalan, ispanzabon guruhlar uchun, agar nom atama bilan yonma-yon boʻlsa, u 22,8% hollarda saqlanib qolgan, agar alohida boʻlsa — 43,9% hollarda (3-rasm A).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv xarakteriga ega: matn tuzilishi va atamalarni oʻchirish oʻrtasida korrelyatsiya aniqlangan, ammo bu toʻgʻridan-toʻgʻri sabab-oqibat bogʻliqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Avtomatlashtirilgan tahlil shuni koʻrsatdiki, 47,6% hollarda (95% DI: 39,3–54,7) «signal» nomlari boʻlgan gaplar saqlanib qolgan, ammo nomlarning oʻzi oʻchirilgan. Nazorat guruhlarida bu koʻrsatkich atigi 0,2% ni tashkil etgan. Shakl boʻyicha, toʻliq nomlar (masalan, «Hispanic») qisqartirilganlariga qaraganda tez-tez oʻchirilgan. Loyiha muayyan aholini oʻrganganmi yoki yoʻqmi, bu bashorat modeliga deyarli taʼsir qilmagan: bu omilni qoʻshish aniqlikni (&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;) atigi 0,002 ga oʻzgartirgan.&lt;/p&gt;\n&lt;h4 id=\"loyiha-annotatsiyasida-guruh-nomining-tilga-olinishi-va-kategoriya-ortasidagi-bogliqlik\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#loyiha-annotatsiyasida-guruh-nomining-tilga-olinishi-va-kategoriya-ortasidagi-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Loyiha annotatsiyasida guruh nomining tilga olinishi va kategoriya oʻrtasidagi bogʻliqlik&lt;/span&gt;&lt;/a&gt;Loyiha annotatsiyasida guruh nomining tilga olinishi va kategoriya oʻrtasidagi bogʻliqlik&lt;/h4&gt;\n&lt;p&gt;Oʻtkazilgan tahlil shuni koʻrsatadiki, REMHR (ozchiliklar salomatligi boʻyicha tadqiqotlar) kategoriyasining berilishi loyiha annotatsiyasida irqiy yoki etnik guruh nomining mavjudligi bilan chambarchas bogʻliq. 2024-moliya yilida (MY) bunday guruhlarni aniq oʻrgangan loyihalarning 99,5 foizi, agar annotatsiya matni oʻzgarmagan boʻlsa, 2025-MYda ham kategoriyani saqlab qolgan. Biroq, agar guruh nomi annotatsiyadan yoʻqolsa, kategoriyani saqlab qolish ehtimoli 15,0 foizgacha (20 ta loyihadan 3 tasi) tushib ketgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Agar loyiha tavsifidan maqsadli irqiy yoki etnik guruh nomi olib tashlansa, REMHR kategoriyasini saqlab qolish ehtimoli 98,5 foizdan 15,0 foizgacha pasayadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;REMHR — ozchiliklar salomatligiga qaratilgan loyihalarga beriladigan kategoriya. U maʼlumotlarni tabaqalashtirish uchun irqiy yoki etnik mansublikdan shunchaki foydalanadigan tadqiqotlarni istisno qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bu kuzatuv tadqiqoti: mualliflar matn va klassifikatsiya oʻrtasidagi korrelyatsiyani tahlil qilmoqda, tasodifiy tajriba orqali oʻrnatilgan sabab-oqibat bogʻliqligini emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kategoriyani yoʻqotgan 20 ta loyihani koʻr-koʻrona ekspert baholash shuni koʻrsatdiki, ularning barchasi REMHR taʼrifiga rasman mos kelgan. Shu bilan birga, ulardan 10 tasi (2025-MYda jami 6,4 mln dollar moliyalashtirish bilan) mavzu boʻyicha tadqiqotlarni davom ettirgan, bu nashrlar yoki klinik sinovlar reyestridagi yozuvlar bilan tasdiqlanadi. Kategoriyani yoʻqotgan 50 ta tasodifiy loyiha tahlili shuni koʻrsatdiki, 84 foiz holatlarda ularning 2024-MYdagi maqsadlari REMHR mezonlariga mos kelgan, biroq 2025–2026-yillardagi joriy faoliyat boʻyicha dalillar sezilarli darajada kamroq boʻlgan.&lt;/p&gt;\n&lt;h4 id=\"belgilangan-atamalar-boyicha-tuzatishlardan-song\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#belgilangan-atamalar-boyicha-tuzatishlardan-song\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Belgilangan atamalar boʻyicha tuzatishlardan soʻng&lt;/span&gt;&lt;/a&gt;Belgilangan atamalar boʻyicha tuzatishlardan soʻng&lt;/h4&gt;\n&lt;p&gt;Nomi jinsiy va gender ozchiliklarini (SGM) oʻz ichiga olgan 2024-moliya yili grantlarini tahlil qilish shuni koʻrsatdiki, ularning 46,7%i 2026-yil mart holatiga koʻra toʻxtatilgan deb qayd etilgan, barcha grantlar uchun bu koʻrsatkich 4,8%ni tashkil etgan (5B-rasm). SGM tilga olingan barcha grantlarning 10,7%i toʻxtatilgan, 36,0%i qayta tiklanishi mumkin, 15,4%i guruh nomi olib tashlangan holda davom etmoqda, 20,8%i guruhni tilga olgan holda davom etmoqda va 17,1%i aniq maqomga ega emas. Boshqa parametrlar (institut, faollik, terminologiya) qatʼiy saqlanganda, SGM tilga olingan grantlarning toʻxtatilish ehtimoli boshqa guruhlarga qaraganda 37,8 foiz punktga yuqori boʻlgan (95% DI 33,1–42,7). Taqqoslash uchun: ispan tilli guruhlar uchun bu koʻrsatkich +3,2 (1,6–4,9), qora tanli aholi uchun esa +0,2 (−1,2 dan 1,8 gacha) boʻlgan (5A-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SGM tilga olingan grantlar boshqalarga qaraganda 37,8 foiz punktga tez-tez toʻxtatilgan, bu tadqiqotlardan ushbu guruhlarning maqsadli ravishda chiqarib tashlanishini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Foiz punkti (percentage point) — ikki foizli koʻrsatkich oʻrtasidagi arifmetik farq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tendensiya institutlar boʻyicha umumiy choralar koʻrilgan holatlarni istisno qilganda va taʼlim bilan bogʻliq boʻlmagan grantlar orasida ham saqlanib qolgan. OIV/OITS tadqiqotlari toifasida tafovut 31,8 foiz punktni (25,1–38,6) tashkil etdi. Grantlarni tahrirlashda SGMga oid atamalar guruh nomining bir qismi yoki boshqa atamalar boʻlishidan qatʼi nazar, bir xil tezlikda olib tashlangan. Biroq, qayta koʻrib chiqilgan grantlar orasida gender identifikatsiyasiga oid atamalar jinsiy orientatsiyaga oid atamalarga qaraganda 20,7 foiz punktga tez-tez olib tashlangan.&lt;/p&gt;\n&lt;h4 id=\"annotatsiyalardagi-ozgarishlar-amaliyotdagi-ozgarishlardan-koproq\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#annotatsiyalardagi-ozgarishlar-amaliyotdagi-ozgarishlardan-koproq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiyalardagi oʻzgarishlar amaliyotdagi oʻzgarishlardan koʻproq&lt;/span&gt;&lt;/a&gt;Annotatsiyalardagi oʻzgarishlar amaliyotdagi oʻzgarishlardan koʻproq&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar kalit atamalar olib tashlangan 150 ta annotatsiya juftligini baholadilar. 46,7% hollarda (95% DI 38,9–54,6) tadqiqot mazmuni yo toʻliq emas, yo qayta shakllantirilgan (Krippendorff α = 0,84). 66 ta juftlikda ekspertlar yangi annotatsiyada eski versiyada boʻlmagan mazmunni aniqladilar, bu tadqiqot maqsadlarining qayta koʻrib chiqilganidan dalolat beradi. Bogʻliq klinik sinovlar tahlili shuni koʻrsatdiki, agar grant annotatsiyasi maqsadli guruhni tilga olishni toʻxtatsa, sinovlarning 4,5%i (179 tadan 8 tasi) 2026-yil sentyabriga kelib toʻxtatilgan yoki toʻxtatib qoʻyilgan, annotatsiya oʻzgarmagan hollarda esa bu koʻrsatkich 2,5% (529 tadan 13 tasi) boʻlgan (farq 2,0 foiz punkt, 95% DI −1,4–5,8).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatuv tadqiqoti: aniqlangan farqlar annotatsiya matnining oʻzgarishi va sinovlar maqomi oʻrtasidagi korrelyatsiyani koʻrsatadi, ammo toʻgʻridan-toʻgʻri sabab-oqibat bogʻliqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sinovlardagi tanlov mezonlarining 15,6%ida, agar grant annotatsiyasi ham ushbu nomni olib tashlagan boʻlsa, guruh endi tilga olinmagan, oʻzgarmas annotatsiyalarda esa bu koʻrsatkich 4,8%ni tashkil etgan. Nomni olib tashlagan loyihalar umuman olganda koʻproq yangi sinovlarni roʻyxatdan oʻtkazgan (har bir loyihaga 0,51 ga nisbatan 0,37), ammo guruhni tilga olgan yangi roʻyxatga olishlar annotatsiyalari oʻzgargan va oʻzgarmagan guruhlar oʻrtasida deyarli farq qilmadi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"tahrirlangan-yozuvlar\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tahrirlangan-yozuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tahrirlangan yozuvlar&lt;/span&gt;&lt;/a&gt;Tahrirlangan yozuvlar&lt;/h4&gt;\n&lt;p&gt;Qatʼiy mezonlarga rioya qilishni talab qiluvchi loyihalar doirasida FY2025 toifasida tadqiqot tavsiflaridagi oʻzgarishlar qayd etildi. 1-jadval ushbu tahrirlarning oqibatlarini mavjud dalillar bilan solishtiradi. Koʻpgina hollarda, annotatsiyalar tahrirlangandan soʻng, loyihalar rasmiy taʼriflarga mos kelmay qoldi, garchi moliyalashtirish va umumiy tasnif saqlanib qolgan boʻlsa ham. Bu haqiqatda olib borilayotgan ishlar va ularning rasmiy hisobotlarda aks etishi oʻrtasida tafovut yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tahlil qilingan 150 ta yozuv juftligining 46,7 foizida ekspertlar tadqiqot mazmuni yangi matnlarda yoʻqolganini yoki qayta belgilanganini aniqladilar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Nomli» toifalarni yoʻqotishning 70 ta holatini tahlil qilish shuni koʻrsatdiki, ularning 49 tasida tadqiqot maqsadlari qayta shakllantirilgan, nomlarini saqlab qolgan 10 ta nazorat loyihasida esa bu koʻrsatkich atigi 3 tani tashkil etgan. Matnlarni solishtirish tadqiqotning mohiyati oʻzgarganmi yoki faqat uning tavsifi oʻzgarganmi, degan savolga aniq javob bermaydi. 2025–2026 yillarda mezonlarga muvofiq kelishda davom etgan 7 ta loyihadan 5 tasi uchun dalil sifatida faqat klinik sinovlarning faol maqomi xizmat qilgan.&lt;/p&gt;\n&lt;p&gt;Mualliflar «hisobga olinmagan fan» (uncounted science) tushunchasini kiritadilar. «Bajarilmagan fan» (jamiyat talab qiladigan, lekin institutlar eʼtiborsiz qoldiradigan tadqiqotlar) yoki «taqiqlangan bilim» (sezgirligi tufayli qochiladigan mavzular) dan farqli oʻlaroq, hisobga olinmagan fan — bu haqiqatda moliyalashtiriladigan va olib boriladigan, ammo loyiha tavsiflaridagi atamalar oʻzgarishi tufayli statistikada hisobga olinmaydigan loyihalardir. Bu tizimning konstitutsiyaviy xususiyatiga aylanadi: hisobotlar ish mazmunining yagona dalili sifatida qabul qilina boshlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hisobga olinmagan fan — bu moliyalashtirilishda va oʻtkazilishda davom etayotgan, ammo loyiha tavsiflaridagi terminologiya oʻzgarishi sababli rasmiy reyestrlardan tushib qoladigan ilmiy faoliyat.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-jadval loyiha nomlari axborot yukiga ega ekanligini koʻrsatadi: nomda maqsadli guruhning boʻlishi tanlanmadagi ulushini bashorat qiladi. Biroq, matnlardagi tuzatishlar shunga olib keldiki, muayyan aholi guruhlarini oʻrganuvchi loyihalar, agar ularning annotatsiyasi tegishli atamadan mahrum boʻlsa, toifani yoʻqotgan. Shu bilan birga, toifani yoʻqotishning 17 ta holatidan 10 tasida ekspertlar keyingi yozuvlarda (6,4 mln qiymatida) maqsadli guruh bilan ish davom etganini tasdiqladilar. 7 ta holatda (2,2 mln qiymatida) bu faqat sinovlar reyestridagi faol yozuvlar bilan tasdiqlangan. Matn tahrirlari asosida toifani yoʻqotishni bashorat qilish modeli 0,95 AUC aniqligini koʻrsatdi.&lt;/p&gt;\n&lt;h4 id=\"tadqiqotlarni-baholashga-qoshilgan-hissa\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tadqiqotlarni-baholashga-qoshilgan-hissa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqotlarni baholashga qoʻshilgan hissa&lt;/span&gt;&lt;/a&gt;Tadqiqotlarni baholashga qoʻshilgan hissa&lt;/h4&gt;\n&lt;p&gt;Indikatorlar taʼsiri boʻyicha tadqiqotlar koʻpincha olimlarning baholash mezonlariga moslashish xulq-atvoriga qaratilgan. Biz esa algoritmlar oʻqiydigan matnga bosim oʻtkazilishi va tadqiqot obyekti oʻzgarishsiz qolishi holatini tasvirlaymiz. 2025-yildagi sharhlar jarayonida, moliyalashtirish matnlarni qayta koʻrib chiqishga bogʻliq boʻlgani uchun loyiha xulosalari oʻzgartirildi. Bu Kempbellning indikator kirish maʼlumotlariga bosim haqidagi argumentini kengaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Biz uzoq muddatli tafovutni aniqladik: bir xil loyiha va bir xil amaliy yozuvlar matndagi tahrirlar tufayli ketma-ket yillarda turlicha tasniflanadi, bu esa uzoq muddatli statistikani buzadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Avvalgi tasniflar auditi (masalan, RCDC) koʻpincha kesim koʻrinishida boʻlib, 6% hollarda xatolarni aniqlagan. Bizning tahlilimiz shuni koʻrsatadiki, matn versiyasini tasniflagich bergan kategoriya bilan solishtirganda maʼlumotlar mos keladi. Biroq, bir loyihaning turli vaqtlardagi matn versiyalarini solishtirish tafovutlar qanday paydo boʻlishini koʻrish imkonini beradi. Bu matndagi oʻzgarishlarga koʻr boʻlgan yagona koʻrsatkich oʻrniga koʻp tomonlama kontekstual indikatorlardan foydalanish zarurligini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"tahrirlar-nimaga-tasir-qildi\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tahrirlar-nimaga-tasir-qildi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tahrirlar nimaga taʼsir qildi&lt;/span&gt;&lt;/a&gt;Tahrirlar nimaga taʼsir qildi&lt;/h4&gt;\n&lt;p&gt;2025-yilgi qoʻllanma «til»ni «tadqiqot»dan ajratishga qaratilgan edi. Biroq, tahrirlar jumlalarga ular maʼlum atamalar yoki guruh nomlarini oʻz ichiga olganiga qarab taʼsir qildi. Muayyan aholini oʻrganish faktining oʻchirilishni bashorat qilishga taʼsiri juda kam edi (AUC oʻzgarishi 0,002; 95% CI: -0,010 dan 0,013 gacha).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (Area Under the Curve) — tasniflash sifati metriki; 0,002 qiymati aholini oʻrganish faktining kalit soʻzlar mavjudligiga nisbatan bashorat qilish qobiliyati juda pastligini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Juftlik sharhi shuni koʻrsatdiki, nomlar oʻchirilgan 70 ta holatning 49 tasida tahrirchilar tadqiqot maqsadlarini qayta shakllantirgan. Xulosalari oʻzgarmagan 99,4% hollarda kategoriyaning barqarorligi RCDC umumiy metodologiyasi oʻzgarmaganini, ammo tahrirlar aniq maqsadli boʻlganini koʻrsatadi. Xatolar algoritmlar «til»ni informativ nomlardan ajrata olmagan joylarda yuzaga kelgan.&lt;/p&gt;\n&lt;h4 id=\"bir-sharhdan-ikkinchisiga\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#bir-sharhdan-ikkinchisiga\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bir sharhdan ikkinchisiga&lt;/span&gt;&lt;/a&gt;Bir sharhdan ikkinchisiga&lt;/h4&gt;\n&lt;p&gt;NIH 2025-yil dekabrda joriy etgan filtr 2025-yilda tugatilgan grantlardagi soʻzlar bazasidan yaratilgan degan faraz mavjud. Agar bu toʻgʻri boʻlsa, bir tekshiruv bosqichi natijalari keyingisi uchun soʻzlar roʻyxatiga aylanadi. 2026-yil 30-sentabr holatiga koʻra, xulosalaridan guruh nomi oʻchirilgan 200 ta loyihadan atigi 3 tasi uni yana tilga olgan, xulosalari oʻzgarmagan 496 ta loyihadan esa 444 tasi buni amalga oshirgan (14-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2026-moliya yili boʻyicha maʼlumotlar 2026-yil 30-sentabr holatiga mavjud yozuvlar bilan cheklangan; toʻliq manzara hali eʼlon qilinmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2003-va-2025-yillardagi-aholi-guruhlarini-nishonga-olish\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#2003-va-2025-yillardagi-aholi-guruhlarini-nishonga-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2003 va 2025 yillardagi aholi guruhlarini nishonga olish&lt;/span&gt;&lt;/a&gt;2003 va 2025 yillardagi aholi guruhlarini nishonga olish&lt;/h4&gt;\n&lt;p&gt;Jinsiy va gender ozchiliklari uchun loyiha tavsiflaridan atamalarni olib tashlash va ularni saqlab qolish ko‘rsatkichlari o‘xshash bo‘lgan, biroq ushbu guruh grantlari kalit so‘zlar soni bashorat qilganidan ko‘ra ko‘proq moliyalashtirishni to‘xtatishga duchor bo‘lgan (tuzatishdan keyin farq 37,8 foiz punktni tashkil etdi, ispan tilli aholi uchun esa bu ko‘rsatkich 3,2 edi). 2026-yil 23-mart holatiga ko‘ra, bunday to‘xtatilishlarning 46,7 foiz punktidan 36,0 tasi qayta tiklanishi mumkin bo‘lgan loyihalar sifatida qayd etilgan. Biz buni maqsadli ta’sir deb bilamiz: agar bosim ma’lum bir guruhga qaratilgan bo‘lsa, matnni tahrirlash talablarni qondirmaydi va choralar grantlar darajasiga o‘tadi. 2003-yilda ham shunga o‘xshash holat kuzatilgan: Kongressning NIH grantlari bo‘yicha jinsiy xulq-atvor tadqiqotlari yuzasidan so‘rovidan so‘ng, 250 dan ortiq loyihalar ro‘yxati qo‘mita xodimlariga taqdim etilgan. Garchi NIH birorta ham grantni bekor qilmagan bo‘lsa-da, so‘rovda qatnashgan tadqiqotchilarning qariyb yarmi dastur kuratorlarining tavsiyasiga ko‘ra nomlar va annotatsiyalardan «istalmagan» so‘zlarni olib tashlaganliklarini, 17 foizi esa tadqiqotlardan voz kechganliklarini ma’lum qilishgan. 2025-yilda so‘rov agentlikning o‘zidan kelgan va grantlar nafaqat tahrirlangan, balki to‘xtatilgan ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2025-yilda jinsiy va gender ozchiliklari uchun grantlar kutilganidan 37,8 foiz punktga ko‘proq to‘xtatilgan, bu shunchaki terminologiyani o‘zgartirish emas, balki to‘g‘ridan-to‘g‘ri nishonga olishdan dalolat beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"yozuv-endi-nimani-korsata-olmaydi\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#yozuv-endi-nimani-korsata-olmaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yozuv endi nimani ko‘rsata olmaydi&lt;/span&gt;&lt;/a&gt;Yozuv endi nimani ko‘rsata olmaydi&lt;/h4&gt;\n&lt;p&gt;Muammo hisobot shakllantirish mexanizmida. Jamg‘arma hisoblash uchun foydalanadigan atamalar ayni vaqtda senzura obyekti bo‘lsa, jamg‘arma siyosati va ilmiy hisobot yagona vositaga aylanadi. Agar ma’muriyat umumiy matnga tuzatishlar kiritishni talab qilsa, bu talab hisobotga fanning o‘zi o‘zgargani sifatida qaytadi. 2025-yilda olib tashlangan nomlar aynan statistika uchun kerakli bo‘lgan nomlar edi. 2025-moliya yili (FY2025) ma’lumotlar qatorida belgilanmagan uzilish mavjud. Ozchiliklar salomatligi bo‘yicha umumiy ko‘rsatkichlarning pasayishi qisman annotatsiyalarida ushbu guruhlarni eslatishni to‘xtatgan loyihalar bilan bog‘liq. Tahlil qilingan tanlamada nom olib tashlangandan so‘ng toifasini yo‘qotgan loyihalar umumiy pasayishning beshdan bir qismini (125,0 mln dan 553,7 mln) tashkil etdi va bu ma’lumotlarni e’lon qilingan hisobotlardan tiklab bo‘lmaydi. Ushbu qatorni trend sifatida tahlil qilish har qanday holatda ham ushbu uzilishni o‘z ichiga oladi. Biz buni faqat NIH loyihalari ro‘yxatlari, 2024-yilgi xulosalar va reyestrlarda saqlanib qolgan izlar tufayli aniqlay oldik. Ommaviy yozuv na asl matnni, na tahrir sanasini saqlaydi, shuning uchun o‘quvchi tadqiqotdagi real o‘zgarishlarni ularning tavsifidagi o‘zgarishlardan ajrata olmaydi.&lt;/p&gt;\n&lt;h4 id=\"cheklovlar-va-kelgusi-tadqiqotlar\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#cheklovlar-va-kelgusi-tadqiqotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va kelgusi tadqiqotlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va kelgusi tadqiqotlar&lt;/h4&gt;\n&lt;p&gt;Tadqiqotni baholash usuli noaniq (5.3-bo‘lim). Matn modelining AUC ko‘rsatkichi 0,69 ekanligi biz o‘lchagan belgilar muharrirlar qilgan ishlarning katta qismini qamrab olmasligini anglatadi. Qat’iy tanlama 20 ta loyiha bilan cheklangan. «Amaliyot-yozuv» standarti guruhning ishtirokini qayd etadi, REMHR esa maqsad bilan belgilanadi. Ko‘r-ko‘rona taqrizlash 2024-moliya yilidagi o‘sha 20 ta loyiha uchun toifaga mansublikni tasdiqlaydi, ammo u ommaviy yozuvlar paketlariga tayanadi, davom etayotgan ishlar bo‘yicha dalillar esa tadqiqotchilar mustaqil yangilab turadigan reyestr maqomiga asoslanadi. Taqrizchilarning joriy ishlar bo‘yicha kelishuvi o‘rtacha darajada bo‘lgan (κ=0,26 va 0,36). RCDC ham tahlil qiladigan aniq maqsadlar (Specific aims) ommaviy emas. 2025-yilgi fayllar 2026-yilda qayta yaratilgan, shuning uchun tahrir sanalari noma’lum. Ishtirokchilarni jalb qilish bo‘yicha ma’lumotlar sinovlarning boshlang‘ich ko‘rsatkichlari e’lon qilingan 2% grantlarga asoslanadi. Grant Witness — uchinchi tomon kompilyatsiyasi, moliyalashtirishni to‘xtatish maqomi esa sud jarayonlarida o‘zgargan. Eng muhim cheklov — kuzatuv davrining qisqaligi. Tahrirlarning takliflar, ishtirokchilarni jalb qilish va tadqiqotchilarni o‘qitishga ta’siri yillar davomida namoyon bo‘ladi va joriy ma’lumotlar taqrizlar ularni o‘zgartirganini ko‘rsata olmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AUC (Area Under the Curve) — tasniflash sifati metriklari: 0,5 tasodifiy taxminni, 1,0 esa mukammal aniqlikni anglatadi. 0,69 qiymati modelning o‘rtacha bashorat qilish qobiliyatidan dalolat beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot qisqa kuzatuv davri bilan cheklangan; ma’lumotlar grant tavsiflaridagi o‘zgarishlarni real ilmiy amaliyotdagi uzoq muddatli o‘zgarishlar bilan aniq bog‘lashga imkon bermaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;2025-yilda AQSH Milliy sogʻliqni saqlash institutlari (NIH) grantlar tavsiflarini tahrir qildi, bu esa rasmiy ilmiy hisobotlarning oʻzgarishiga olib keldi. Biz moliyalashtirishni saqlab qolgan, ammo ularning ochiq annotatsiyalaridan muayyan aholi guruhlari haqidagi eslatmalar oʻchirilgan va toifalarning oʻzi NIH yillik roʻyxatlaridan chiqarib tashlangan loyihalarni aniqladik. Aksariyat hollarda tahrirlash loyihaning eʼlon qilingan maqsadlarini oʻzgartirish bilan birga kechdi, natijada yangi tavsiflar rasman chiqarib tashlangan toifalar mezonlariga mos kelmay qoldi. Biroq, ushbu loyihalarning baʼzilari uchun klinik sinovlarning faol ekanligi ishlar davom etayotganini tasdiqlaydi: moliyalashtirish saqlanib qolgan, ammo statistik hisob yoʻqolgan. Tadqiqot obyekti bevosita aholi guruhi boʻlgan hollarda, ularning nomini oʻz ichiga olgan grantlar ancha tezroq toʻxtatilgan. Matnli tasnifning haqiqiyligi ushbu matnni boshqarish qoidalariga bogʻliq. Agar davlat organlari ilmiy tadqiqotlarni taʼriflarni oʻzgartirish orqali tartibga solsa, ular oʻzlarining maʼmuriy qarorlarini obyektiv ilmiy faktlar sifatida talqin qilishlari mumkin, bu esa maʼlumotlarni barcha tashqi foydalanuvchilar uchun buzib koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NIH grantlari tavsiflarining 2025-yildagi tahriri loyihalarni moliyalashtirishni saqlab qolgan holda, hisobotlardan muayyan aholi guruhlari haqidagi maʼlumotlarning yoʻqolishiga olib keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"malumotlar-va-kodning-mavjudligi\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#malumotlar-va-kodning-mavjudligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maʼlumotlar va kodning mavjudligi&lt;/span&gt;&lt;/a&gt;Maʼlumotlar va kodning mavjudligi&lt;/h4&gt;\n&lt;p&gt;Foydalanilgan birlamchi maʼlumotlar ochiq hisoblanadi: NIH ExPORTER reestri (2026-yil 25-sentabrdagi yuklanma), RCDC loyihalari roʻyxatlari va umumiy koʻrsatkichlari (2026-yil 27-sentabr), NIH RePORTER va ClinicalTrials.gov APIʼlari (2026-yil 30-sentabr), OpenAlex bazasi (2026-yil 26-iyundagi holat), AACT bazasi (2025-yil 1-yanvar va 2026-yil 25-sentabrdagi holat), GrantWitness maʼlumotlari (2026-yil 23-mart) va Senatning Savdo qoʻmitasi hisoboti (2024-yil 9-oktabr). Natijalarni agregatsiya qiluvchi dasturiy kod, maqoladagi har bir sonli qiymatni tekshiruvchi skript, shuningdek, klassifikatorlar va kod kitoblari tahririyat va taqrizchilarga taqdim etilgan. Alohida grantlar, nashrlar, sinovlar va shaxslar boʻyicha maʼlumotlar fayllari ommaviy tarqatilmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;API (dasturlash interfeysi) — bu idoralar maʼlumotlar bazalaridan tuzilgan maʼlumotlarni avtomatlashtirilgan tarzda soʻrash va olish imkonini beruvchi vositadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"tahlil-usullari-va-tanlov-mezonlari\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tahlil-usullari-va-tanlov-mezonlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tahlil usullari va tanlov mezonlari&lt;/span&gt;&lt;/a&gt;Tahlil usullari va tanlov mezonlari&lt;/h4&gt;\n&lt;p&gt;Loyiha uzluksizligini tahlil qilish uchun 2024 va 2025 moliya yillari (FY) yozuvlari oʻzaro bogʻlandi. Voqealar tahlili 37 406 juft yozuvni qamrab oldi, shundan 5 461 tasi maqsadli deb belgilandi. Eslatmalar tahlili uchun 37 790 juftlik ishlatildi, bunda tahlil birligi sifatida grant va 2024-yilgi matnda koʻrsatilgan populyatsiya olindi. Agar 2025-yilgi yakuniy hisobotda populyatsiya matnda saqlanib qolgan boʻlsa, eslatma saqlangan hisoblandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Juftliklarni bogʻlash usuli loyiha tavsifidagi oʻzgarishlarni bir moliya yilidan ikkinchisiga oʻtishda kuzatish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yoʻldosh maʼlumotlarni oʻchirish, agar gapda roʻyxatdagi boshqa atamalar ham boʻlsa, kalit soʻzlarni oʻz ichiga olgan gaplarni chiqarib tashlashni nazarda tutdi. Populyatsiya loyiha tomonidan «oʻrganilayotgan» deb hisoblandi, agar 2025-yilgacha boʻlgan yozuvlar buni quyidagi usullardan biri bilan tasdiqlasa: kamida ikkita MeSH-deskriptoriga ega maqola (maqolalarning kamida 30%), 2025-yil yanvar holatiga koʻra populyatsiyani qamrab olgan klinik sinov yoki qora tanli va ispan tilida soʻzlashuvchi aholi uchun AQSh aholisidagi ulushidan ikki baravar koʻp ishtirokchilarni qamrab olgan sinov.&lt;/p&gt;\n&lt;h4 id=\"baholash-tartiblari-va-statistik-tahlil\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#baholash-tartiblari-va-statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash tartiblari va statistik tahlil&lt;/span&gt;&lt;/a&gt;Baholash tartiblari va statistik tahlil&lt;/h4&gt;\n&lt;p&gt;«Qatʼiy amaliyot» tadqiqoti kamida uchta maqola yoki bogʻliq sinovga ega loyihalar kichik toʻplamini qamrab oldi, bu «grant–populyatsiya» juftliklarining 22,3% ni tashkil etdi. Baholashni uch nafar ekspert: ikki muallif va bir mustaqil hamkasb amalga oshirdi. Ekspertlar loyiha identifikatorlari va ularning toifaviy maqomi boʻyicha koʻr (blinded) qilingan edi. Koʻrsatkichni saqlab qolish 2024-yilda REMHR eslatmasiga ega boʻlgan va 2025-yilda uni saqlab qolgan loyihalar ulushi sifatida aniqlandi.&lt;/p&gt;\n&lt;p&gt;2025-yil 20-yanvardan keyin faol boʻlgan 55 302 ta grantdan, Grant Witness maʼlumotlar bazasida tugash sanasi boʻlganlari «yakunlangan» deb belgilandi. Statistik ahamiyatlilik ulushlar uchun Wilson intervallari va saqlab qolish koʻrsatkichlaridagi farq uchun Newcombe intervallari yordamida hisoblandi. Boshqa hollarda loyihalar yoki institutlarning qayta tanlanishi (resampling) qoʻllanildi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f1.jpg\" alt=\"1-rasm: Taqrizchi tomonidan tahrirlangan matn, undan miqdor olinadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Taqrizchi tomonidan tahrirlangan matn, undan miqdor olinadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Taqrizchi tomonidan tahrirlangan matn, undan miqdor olinadi. (A) Umumiy matn: taqrizchi xulosalar bilan ishlaydi, undan miqdor olinadi va NIH tomonidan nashr etilgan maʼlumotlar hamda xulosada yaratilmaydigan, tadqiqot jihatlarini qayd etuvchi amaliy yozuvlarga qoʻshiladi. Yakunlangan grantlar hisobdan chiqariladi. (B) FY2023→FY2024 va FY2024→FY2025 davrida barcha tanlov terminlarini yoʻqotgan belgilangan davomiy loyihalar ulushi, byudjet boshlanishidan to berilishigacha boʻlgan kunlar boʻyicha.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f2.jpg\" alt=\"2-rasm: Tadqiqotga kiritilganda qayd etilgan populyatsiya nomlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Tadqiqotga kiritilganda qayd etilgan populyatsiya nomlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Tadqiqotga kiritilganda qayd etilgan populyatsiya nomlari. (A) Bogʻliq sinovlarda kiritilgan populyatsiya ulushining oʻsishi, uni nomlagan grantlar, nomlamagan grantlarga qarshi, joylashuvi boʻyicha (toʻldirilgan — nom; ochiq — faqat boshqa joyda). (B) Mazkur populyatsiya uchun MeSH deskriptori bilan indekslangan kuratsiya qilingan bogʻliq maqolalar ulushining oʻsishi. Sariq rang bilan populyatsiyalar, firuza rang bilan solishtirma populyatsiyalar belgilangan. Yangi grantlar FY2015–FY2023, 95% ishonch intervallari bilan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f3.jpg\" alt=\"3-rasm: Nomlarning saqlanib qolishini bashorat qiluvchi matn xususiyatlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Nomlarning saqlanib qolishini bashorat qiluvchi matn xususiyatlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Nomlarning saqlanib qolishini bashorat qiluvchi matn xususiyatlari. (A) Qayta koʻrib chiqilgan davomiy loyihalar orasida populyatsiya nomlarining saqlanib qolishi, har bir eslatma roʻyxatdagi termin bilan bir gapni boʻlishganda va biri alohida turganda. (B) Bir xil populyatsiyaning roʻyxatga olingan va olinmagan shakllarining grant ichidagi yoʻqolishi, farq va uning 95% ishonch intervali bilan. (C) Oʻrganilgan populyatsiyalar uchun saqlanib qolishdagi tafovut, xom, matn oʻzgarmas holda va jarrohlik tahrirlari uchun, minimal aniqlanadigan taʼsirga qarshi (shtrixlangan). Intervallar 95%, ulushlar uchun Uilson intervallari va tafovutlar uchun &lt;a href=\"concepts/butstrep.html\"&gt;butstrap&lt;/a&gt;-resampling.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f4.jpg\" alt=\"4-rasm: Loyihalar moliyalashtirilgan, ammo hisobga olish toʻxtatilgan.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Loyihalar moliyalashtirilgan, ammo hisobga olish toʻxtatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: Loyihalar moliyalashtirilgan, ammo hisobga olish toʻxtatilgan. (A) REMHRni oʻz ichiga olgan va 2025-yil 20-yanvardan keyin faol boʻlgan FY2024 loyihalari, FY2025gacha kuzatilgan: holat, xulosa va FY2025 kategoriyasi. Chiziqlar kengligi — loyihalar soni. Sariq chiziqlar — xulosalari nomni yoʻqotgan loyihalar. (B) Irqiy yoki etnik populyatsiyani qatʼiy oʻrganadigan loyihalar orasida REMHRni saqlab qolish, xulosadagi oʻzgarishlarga qarab, FY2023→FY2024 etalon sifatida. (C) FY2025da REMHRga ega loyihalar ulushi, xulosa oʻzgarmagan (kulrang) va nom olib tashlangan (sariq), populyatsiyani oʻrganadigan oʻlchangan loyihalar va uni nomlaydigan, ammo amaliy yozuv standartiga mos kelmaydiganlar uchun. (D) Har bir kategoriyani oʻz ichiga olgan FY2025 loyihalari ulushi, REMHRni saqlab qolgan loyihalar, nom olib tashlangandan keyin uni yoʻqotganlarga qarshi. (E) Xulosalari nomni yoʻqotgan qatʼiy amaliy dalillarga ega 20 ta davomiy loyiha va ulardan REMHRni yoʻqotgan 17 tasi. 17 ta loyiha orasida uchta tekshiruv oʻtkazilgan: har ikki taqrizchi populyatsiya ustida ish olib borilayotganini koʻrsatuvchi keyingi ommaviy yozuvlarni topgan (10), ikkalasi ham 2025–2026 yillardagi dalillarni kategoriya taʼrifiga mos kelishini baholagan (7) va bogʻliq sinov 2026-yil sentyabrdagi roʻyxatga olish yozuvida ishtirokchilarni yigʻayotgan, faol yoki taklif boʻyicha qabul qilayotgan deb koʻrsatilgan va populyatsiyani nomlagan (8). Ishni tekshirish va sinovni tekshirish kesishadi (7 tasi ikkalasiga ham mos keladi, 11 tasi kamida bittasiga). Dollarlar — loyihalarning FY2025dagi umumiy moliyalashtirilishi, populyatsiya tadqiqotiga sarflangan xarajatlar emas, $0,1 milliongacha yaxlitlangan. A paneli faqat kategoriya maʼlumotlariga, E paneli esa loyiha darajasidagi sharhga asoslangan. B va C dagi intervallar 95% Uilson intervallari.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-f5.jpg\" alt=\"5-rasm: Jinsiy va gender ozchiliklarini nomlaydigan grantlar, roʻyxatdagi terminlarga tuzatish kiritilgandan soʻng, tez-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Jinsiy va gender ozchiliklarini nomlaydigan grantlar, roʻyxatdagi terminlarga tuzatish kiritilgandan soʻng, tez-tez toʻxtatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: Jinsiy va gender ozchiliklarini nomlaydigan grantlar, roʻyxatdagi terminlarga tuzatish kiritilgandan soʻng, tez-tez toʻxtatilgan. (A) Toʻxtatilgan deb qayd etilgan ulushdagi tuzatilgan farq, nomlangan populyatsiya boʻyicha, roʻyxatdagi terminlar, institut va faoliyat oʻzgarmas holda, institutlarni qayta tanlashning 95% intervallari bilan. (B) Har bir populyatsiyani nomlaydigan FY2024 grantlari natijalari (2025-yil 20-yanvardan keyin faol grantlar), barcha grantlar etalon sifatida. Ustunlardagi raqamlar — foizlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS1.jpg\" alt=\"Qoʻshimcha rasm 1: Koʻrsatilgan atamani oʻz ichiga olgan gapda eslatmani yoʻqotish ehtimolining oshishi, «mukofot × popu\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qoʻshimcha rasm 1: Koʻrsatilgan atamani oʻz ichiga olgan gapda eslatmani yoʻqotish ehtimolining oshishi, «mukofot × populyatsiya» kesimida.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Qoʻshimcha rasm 1: Koʻrsatilgan atamani oʻz ichiga olgan gapda eslatmani yoʻqotish ehtimolining oshishi, «mukofot × populyatsiya» kesimida. Taqqoslash populyatsiyalari ishchi kuchiga yaqin (talabalar, tibbiyot xodimlari) va boshqalarga boʻlingan. Mukofotlarni qayta tanlash (bootstrap) uchun 95% ishonch intervallari (signal populyatsiyalari uchun koʻrsatilmagan). Qoʻshimcha usullar 4.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS2.jpg\" alt=\"Qoʻshimcha rasm 2: 2024-moliya yili matnidagi eslatmalar soniga qarab signal va taqqoslash populyatsiyasi nomlarining sa\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qoʻshimcha rasm 2: 2024-moliya yili matnidagi eslatmalar soniga qarab signal va taqqoslash populyatsiyasi nomlarining saqlanib qolishi, kuzatilgan (uzluksiz chiziq) va har bir eslatmani mustaqil ravishda oʻchirish sharti bilan bashorat qilingan (shtrixli chiziq). Qoʻshimcha usullar 4.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS3.jpg\" alt=\"Qoʻshimcha rasm 3: Saqlanib qolishdagi farq (oʻrganilgan populyatsiya minus oʻrganilmagan), xom maʼlumotlar va matn qatʼ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qoʻshimcha rasm 3: Saqlanib qolishdagi farq (oʻrganilgan populyatsiya minus oʻrganilmagan), xom maʼlumotlar va matn qatʼiy belgilangan holda, umumiy hisobda, jarrohlik tahrirlari uchun va faqat xom maʼlumotlar toʻliq qayta yozishlar uchun, loyihalarni qayta tanlash (resampling) bilan 95% intervallar. Qoʻshimcha usullar 4.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-fS4.jpg\" alt=\"Qoʻshimcha rasm 4: Oʻlchangan kichik toʻplamdagi nomlarning saqlanib qolishi uchun model boʻyicha tanlovdan tashqari (ou\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Qoʻshimcha rasm 4: Oʻlchangan kichik toʻplamdagi nomlarning saqlanib qolishi uchun model boʻyicha tanlovdan tashqari (out-of-fold) AUC, loyihalarni qayta tanlash (resampling) bilan 95% intervallar. Qoʻshimcha usullar 4.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ilmiy&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;arizalardagi&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;leksik senzura&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;37790 ta grant&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va reyestr&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tahlili&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ishlar davom&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;etsa-da&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;statistik&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;buzilish&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Davlat&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ma'lumotlar&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ustidan&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=
