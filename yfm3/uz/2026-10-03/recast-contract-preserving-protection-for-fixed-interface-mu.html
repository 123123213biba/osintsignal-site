        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"270\" cy=\"150\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"670\" cy=\"230\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Bulutli neyron tarmoqlarda&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ma'lumotlar maxfiyligini&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday saqlash kerak&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f1.jpg\" alt=\"1-rasm: RECAST: vazifa tuzilmasini saqlagan holda manba tarkibini almashtirish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: &lt;a href=\"concepts/recast.html\"&gt;RECAST&lt;/a&gt;: vazifa tuzilmasini saqlagan holda manba tarkibini almashtirish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: RECAST: vazifa tuzilmasini saqlagan holda manba tarkibini almashtirish. Yuqorida: tasvirlangan muqobillar turli maqsadlarga qaratilgan: matnni qayta yozish talab qilinadigan media kontentni bevosita taqdim etmaydi, maʼlumotlar toʻplami darajasidagi tasvir sintezi aniq soʻrov bilan bogʻliq emas va notiqni anonimlashtirish nutq mazmunini saqlab qoladi. Quyida: RECAST dalillar va soʻrovlar boʻylab mavzular, obyektlar va qiymatlarni birgalikda almashtiradi, shu bilan birga vazifaga tegishli munosabatlar va talab qilinadigan modalikni saqlab qoladi. Masofaviy yechuvchi himoyalangan operandlar ustidan dasturni qaytaradi; mijoz javobni olish uchun dasturni bajarishdan oldin asl operandlarni mahalliy darajada tiklaydi. Diagramma namunasi matn, diagrammalar va nutq uchun yagona himoya tizimini tasvirlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Grafiklar yoki audio fayllarni kuchli bulutli modellarga yuborish maxfiylik uchun xavf tug‘diradi. Tadqiqotchilar ReCast tizimini taqdim etishdi, u fayllar mazmunini o‘zgartirib, neyron tarmoq uchun ularning tuzilishini saqlab qoladi. Serverdan javob olingandan so‘ng, mahalliy kompyuter asl qiymatlarni tiklaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ReCast himoyalangan ma’lumotlar bilan ishlashda 92,43% aniqlikni saqlaydi.&lt;/li&gt;\n&lt;li&gt;Tizim asl kontentning sizib chiqishini 7,95% gacha kamaytiradi.&lt;/li&gt;\n&lt;li&gt;Usul qayta o‘qitishsiz grafiklar, audio va matn bilan ishlay oladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;ReCast ma’lumotlarni matnli «qoralama»ga aylantiruvchi agent tizimi sifatida ishlaydi. Tizim subyektlar nomlari va mavzularini almashtirish uchun 4B parametrli mahalliy modeldan foydalanadi hamda qiymatlarni himoya qilish uchun teskari o‘zgartiriladigan raqamli xaritani qo‘llaydi. Bu haqiqiy ma’lumotlarni yashirish bilan birga, vazifani hal qilish uchun zarur bo‘lgan mantiqiy aloqalarni saqlab qoladi.&lt;/p&gt;\n&lt;p&gt;Qayta ishlashdan so‘ng, ma’lumotlar interfeys talablariga mos keladigan generator yordamida asl formatga (tasvir yoki audio) qaytariladi. Bulutli model «himoyalangan» versiyani oladi, hisob-kitoblarni bajaradi va mijoz mahalliy darajada asl raqamlar bilan ijro etadigan dasturni qaytaradi. Bu maxfiy ma’lumotlarning foydalanuvchi qurilmasidan chiqib ketmasligini ta’minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul 4000 ta ChartQA va NMSQA misollarida sinovdan o‘tgan; murakkabroq ma’lumotlarda samaradorlik turlicha bo‘lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Masofaviy multimodal modellar grafiklar va nutqni tahlil qilishda kuchli raqamli mulohaza yuritish qobiliyatini namoyish etadi, ammo shaxsiy ma'lumotlarni tashqi serverlarga yuborish ularning oshkor bo'lish xavfini tug'diradi. Matnni tozalash usullari media interfeyslari uchun yetarli emas, shaxsni anonimlashtirish esa vazifaning mazmunini yashirmaydi. Mualliflar RECAST tizimini taqdim etishadi — bu manba mazmunini almashtiruvchi, lekin vazifa uchun muhim bo'lgan aloqalar va kirish modaligini saqlab qoluvchi &lt;a href=\"concepts/agentnyy-plagin.html\"&gt;agentli plagin&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Agentli plagin — bu foydalanuvchi nomidan avtonom harakatlarni amalga oshiruvchi dasturiy modul bo'lib, u sezgir ma'lumotlarni tashqi serverga yubormasdan qayta ishlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RECAST tizimi kirish ma'lumotlarini mahalliy darajada matnli dalil-so'rov yozuviga aylantiradi. 4 milliard parametrli (4B) distillangan model yordamida tizim subyektlar va mavzularni qayta yozadi, qiymatlar esa mahalliy teskari xarita orqali almashtiriladi.&lt;/p&gt;\n&lt;p&gt;Rekonstruksiya agenti himoyalangan yozuv asosida kerakli media ma'lumotlarini yaratadi va tekshiradi. Masofaviy yechuvchi dastur qaytaradi, uning himoyalangan operandlari bajarilishidan oldin mahalliy darajada tiklanadi. ChartQA va NMSQA to'plamlaridan olingan 4000 ta misolda RECAST 75,10% aniqlikka erishdi, bu himoyalanmagan masofaviy aniqlikning 92,43% qismini tashkil etadi. Modelga asoslangan audit yechuvchiga yuborilgan so'rovlarning 7,95% qismida manba mazmuni sizib chiqqanini aniqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST 75,10% aniqlikni ta'minlaydi va asl modellarning 92,43% samaradorligini saqlab qolgan holda ma'lumotlar sizib chiqish xavfini kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar test ma'lumotlar to'plamida olingan; usulning real sharoitdagi samaradorligi media fayllar murakkabligiga bog'liq bo'lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"kontekst-va-muammo\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#kontekst-va-muammo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kontekst va muammo&lt;/span&gt;&lt;/a&gt;Kontekst va muammo&lt;/h4&gt;\n&lt;p&gt;Mahalliy va masofaviy hamkorlik foydalanuvchilarga maʼlumotlarni oʻz qurilmalarida saqlab, masofaviy modellarning hisoblash quvvatidan foydalanish imkonini beradi. Matnli maʼlumotlar uchun bu soha keng oʻrganilgan: soʻrov yuborilishidan oldin mahalliy model uni differensial maxfiylik yoki boshqa usullar bilan qayta yozishi mumkin. Biroq, koʻplab maxfiy maʼlumotlar matn koʻrinishida emas, balki biznes hisobotlaridagi grafiklar yoki qoʻngʻiroqlar yozuvlari shaklida boʻladi. Mahalliy modellar hali ham multimodal idrok va hisoblash boʻyicha masofaviy modellardan ortda qolmoqda, masofaviy xizmatlar esa qatʼiy formatdagi (tasvir yoki audio) maʼlumotlarni talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multimodal maʼlumotlarni himoya qilishning mavjud usullari formatni saqlab qola olmaydi yoki grafiklardagi aniq qiymatlar kabi mazmunli maʼlumotlarni yashira olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mavjud yondashuvlar maʼlumotni matnga aylantiradi, bu esa multimodal interfeyslar bilan mos kelmaydi. Boshqa usullar esa faqat shaxsni aniqlash belgilarini (masalan, ovozni) yashiradi, lekin mazmunli maʼlumotlar (qiymatlar) masofaviy model uchun ochiq qoladi. Raqamli hisoblash vazifalari uchun maʼlumotlar va soʻrovlar izchil oʻzgartirilishi kerak.&lt;/p&gt;\n&lt;h4 id=\"recast-usuli\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#recast-usuli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RECAST usuli&lt;/span&gt;&lt;/a&gt;RECAST usuli&lt;/h4&gt;\n&lt;p&gt;RECAST tizimi vazifa ehtiyojlari (qiymatlar oʻrtasidagi munosabatlar) va manba mazmunini (mohiyatlar, qiymatlar) ajratish orqali ushbu boʻshliqni toʻldiradi. Bu umumiy matnli dalil-soʻrov yozuvi atrofida qurilgan agentli quvur liniyasidir (Rasm 1). Jarayon mahalliy maʼlumotlarni qamrab olish, ularni qayta yozish va modal rekonstruksiyani oʻz ichiga oladi. Masofaviy yechuvchi Python dasturini qaytaradi, u mahalliy qurilmada asl qiymatlar asosida bajariladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f1.jpg\" alt=\"1-rasm: RECAST: vazifa tuzilmasini saqlagan holda manba tarkibini almashtirish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: RECAST: vazifa tuzilmasini saqlagan holda manba tarkibini almashtirish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: RECAST: vazifa tuzilmasini saqlagan holda manba tarkibini almashtirish. Yuqorida: tasvirlangan muqobillar turli maqsadlarga qaratilgan: matnni qayta yozish talab qilinadigan media kontentni bevosita taqdim etmaydi, maʼlumotlar toʻplami darajasidagi tasvir sintezi aniq soʻrov bilan bogʻliq emas va notiqni anonimlashtirish nutq mazmunini saqlab qoladi. Quyida: RECAST dalillar va soʻrovlar boʻylab mavzular, obyektlar va qiymatlarni birgalikda almashtiradi, shu bilan birga vazifaga tegishli munosabatlar va talab qilinadigan modalikni saqlab qoladi. Masofaviy yechuvchi himoyalangan operandlar ustidan dasturni qaytaradi; mijoz javobni olish uchun dasturni bajarishdan oldin asl operandlarni mahalliy darajada tiklaydi. Diagramma namunasi matn, diagrammalar va nutq uchun yagona himoya tizimini tasvirlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/agentnyy-konveyer.html\"&gt;Agentli quvur liniyasi&lt;/a&gt; — bu alohida modullar (agentlar) maʼlumotlarni qayta ishlash va tekshirish kabi vazifalarni bajaradigan tizimdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ishning asosiy natijalari:&lt;br /&gt;\n• RECAST — bu modal yoki interfeys oʻzgarganda qayta oʻqitishni talab qilmaydigan agentli quvur liniyasi.&lt;br /&gt;\n• 4 mlrd parametrli mahalliy model yordamida qayta yozish moduli ishlab chiqildi, u raqamli munosabatlarni saqlagan holda nomlar va domenlarni oʻzgartiradi.&lt;br /&gt;\n• 4000 ta ChartQA va NMSQA namunalarida RECAST himoyalanmagan aniqlikning 92,43% ini saqlab qoldi, bunda manba mazmunining sizib chiqishi atigi 7,95% ni tashkil etdi. Distillyatsiya aniqlikni 6,40 foiz punktga oshirdi va sizib chiqishni 39,75% dan 7,95% gacha kamaytirdi.&lt;/p&gt;\n&lt;h4 id=\"related-work\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#related-work\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RELATED WORK&lt;/span&gt;&lt;/a&gt;RELATED WORK&lt;/h4&gt;\n&lt;p&gt;2.1 TEXTPRIVACY&lt;br /&gt;\nMatn maxfiyligini taʼminlash usullari soʻzlarni qisman oʻchirishdan tortib, hujjatni toʻliq qayta yozishgacha boʻlgan doirani qamrab oladi. SanText va CusText kabi yondashuvlar differensial maxfiylik asosida soʻzlarni semantik jihatdan oʻxshash muqobillari bilan almashtiradi, DP-Prompt va DP-MLM esa himoyalangan, ammo izchil matn yaratish uchun til modellaridan foydalanadi. DP-Fusion usuli kiruvchi maʼlumotlarning turli versiyalariga asoslangan generatsiya taqsimotlarini birlashtirish orqali sezgir tokenlar taʼsirini cheklaydi. Aniq identifikatorlardan tashqari, kontekstual belgilar ham shaxsiy atributlarni oshkor qilishi mumkin. Raqobatbardosh anonimlashtirish (adversarial anonymization) matn tahrirlarini boshqarish uchun xulosa chiqarish hujumlaridan foydalanadi, RLAA esa bu yondashuvni mahalliy modellar uchun moslashtiradi. STAMP va DP-ST kabi zamonaviy usullar vazifa foydaliligi va semantik tuzilmani hisobga oladi. RECAST ushbu yondashuvlarni toʻldirib, raqamli almashtirishdan keyin dalillar va soʻrovlarning mosligini taʼminlaydi hamda natijani belgilangan media interfeysi orqali ishlatish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST matndan oraliq vosita sifatida foydalanib, himoyalangan maʼlumotlarni interfeys talab qiladigan formatda qayta tiklaydi va mantiqiy bogʻliqliklarni saqlab qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.2 LOCAL-REMOTECOLLABORATION&lt;br /&gt;\nMahalliy-masofaviy hamkorlik mahalliy modelga kuchliroq masofaviy model koʻradigan maʼlumotlar hajmini nazorat qilish imkonini beradi. CoGenesis, PAPILLON va InferDPT kabi usullar mahalliy va masofaviy generatsiyani muvofiqlashtirib, masofaviy modelga taqdim etiladigan maxfiy kontekstni cheklaydi. Privacy-R1, Veilmind va xavflarni baholash tizimlari kabi yangi ishlanmalar vazifalarni foydalanuvchi niyati va kontekstual sizib chiqishlarga sezgir qiladi. Eng yaqin yondashuv — bu raqamli mulohaza yuritish vazifasining mavzusini oʻzgartirish, raqamlarni almashtirish va asl javobni masofaviy modeldan olingan dastur yordamida mahalliy darajada tiklashdir. RECAST ushbu sxemani multimodal kirish va chiqishlarga kengaytiradi. Dalillar va soʻrovlarning yagona matnli yozuvi maʼlumotlarni yigʻish, birgalikda qayta ishlash va rekonstruksiyani bogʻlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/program-aided-reasoning.html\"&gt;Dastur yordamida mulohaza yuritish&lt;/a&gt; (program-aided reasoning) — model hisob-kitoblar uchun kod generatsiya qiladigan usul boʻlib, u mantiqiy xulosalar aniqligini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.3 MULTIMODALANDMEDIAPRIVACY&lt;br /&gt;\nMedia maʼlumotlari bilan ishlashda ham maxfiylik xavflari mavjud: multimodal modellar toʻgʻridan-toʻgʻri identifikatorlari boʻlmagan tasvirlardan ham shaxsiy maʼlumotlarni aniqlay oladi. Mavjud yechimlar qatoriga asl maʼlumotlarni mavhum tasvirlar (ramziy sahnalar) bilan almashtirish yoki vizual koʻrsatmalarni matnga oʻgirish kiradi. Biroq, bunday usullar koʻpincha grafiklar yoki signallar kabi aniq formatlarni talab qiluvchi media interfeyslari bilan mos kelmaydi. Ovozni anonimlashtirish yoki nutqni niqoblash kabi media darajasidagi usullar modalikni saqlaydi, lekin identifikatsiya belgilarini oʻzgartiradi. RECAST har bir soʻrov uchun subyektlar, mavzular va qiymatlarni almashtirishi bilan ajralib turadi, shu bilan birga raqamli mulohazalar uchun zarur boʻlgan «dalil-soʻrov» aloqalarini saqlab qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Media himoyasi usullarining aksariyati maʼlumotlar sintezi yoki anonimlashtirishga qaratilgan, RECAST esa raqamli hisob-kitoblar uchun funksional aloqalarni saqlashga eʼtibor qaratadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;RECAST tizimi manba maʼlumotlari va vazifalarni ajratib turadi, bunda umumiy soʻrov va dalillar yozuvidan foydalaniladi. Jarayon mahalliy maʼlumotlarni yigʻish, semantik va raqamli qayta ishlash hamda himoyalangan yozuvni kerakli modalda rekonstruksiya qilishni oʻz ichiga oladi (2-rasm). Masofaviy yechuvchi dastur oladi, uning operandlari bajarilishidan oldin mahalliy darajada tiklanadi.&lt;/p&gt;\n&lt;p&gt;3.1 VAZIFA VA FREYMVORK SHARHI&lt;br /&gt;\nShaxsiy X maʼlumotlari va q matnli soʻrovi uchun tizim m va r modallaridan (matn, tasvir, audio) foydalanadi. Maqsad — manbaga xos boʻlgan mohiyatlar, mavzular va qiymatlarni oshkor qilishni kamaytirish, shu bilan birga dalil-soʻrov bogʻliqliklarini saqlab qolishdir. Himoyalangan yozuv eD = Hh(Rθ(D)) sifatida shakllanadi, bu yerda Rθ — semantik qayta yozuvchi, Hh esa raqamli transformatsiyadir. Masofaviy xizmat faqat himoyalangan kontentni oladi, mahalliy mijoz esa tiklashni amalga oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST tizimi qiymatlarni almashtirish va semantikani qayta yozish orqali maʼlumotlarni himoya qiladi, javoblarni tiklash esa faqat foydalanuvchi tomonida sodir boʻladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.2 MULTIMODAL DALLIL YIGʻISH&lt;br /&gt;\nMaʼlumotlarni yigʻish uchun ixtisoslashgan modellardan foydalaniladi: grafiklar uchun Qwen3-VL-8B-Instruct va audio transkripsiyasi uchun Qwen3-&lt;a href=\"concepts/attack-success-rate.html\"&gt;ASR&lt;/a&gt;-1.7B. Maʼlumotlar beshta maydondan iborat yagona formatga keltiriladi: id, modal, kontekst, savol va javob variantlari. Interfeys aniq modelga bogʻliq emas, bu maʼlumotlar sxemasi saqlangan holda yigʻish modullarini almashtirish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/normalizatsiya.html\"&gt;Normallashtirish&lt;/a&gt; — maʼlumotlarni yagona standartga keltirish, shunda turli modellar ular bilan umumiy shablon asosida ishlay oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.3 BIRGALIKDA QAYTA YOZISH VA RAQAMLARNI HIMOYA QILISH&lt;br /&gt;\nSemantik qayta yozish dalillar va soʻrovni izchil matnga birlashtiradi, operatsiyalar mantigʻi va javob turlarini saqlaydi. Mahalliy Qwen3-4B modelini oʻqitish uchun GPT-5.6-Sol maʼlumotlari asosida QLoRA usuli qoʻllanadi. Oʻquv toʻplami 15 795 juftlikni tashkil etdi. Raqamli qiymatlar h:V→eV inyektiv akslantirish orqali himoyalanadi, bunda diapazonlar (Bk) ichidagi qiymatlar tartibni saqlagan holda almashtiriladi, yillar (Yg) esa δg siljishi bilan oʻzgartiriladi. 0 dan 15 gacha boʻlgan butun sonlar oʻzgarishsiz qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul guruhlar ichidagi qiymatlar tartibini saqlaydi, lekin sonlar oʻrtasidagi asl nisbatlar yoki farqlarning saqlanishiga kafolat bermaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Operandlarni mahalliy tiklash  himoyalangan yorliqlarini h−1 teskari akslantirish orqali asl v qiymatlariga almashtirish orqali amalga oshiriladi. Yakuniy javob Exec(Ih−1[eP]) dasturini bajarish orqali mahalliy hisoblanadi.&lt;/p&gt;\n&lt;p&gt;Grafik va nutqni rekonstruksiya qilish. Masofaviy kodlash modeli himoyalangan dalillarni grafik turi, kategoriyalar, qatorlar, qiymatlar, belgilar, birliklar va ranglarni o'z ichiga olgan deklarativ ChartSpec'ga o'giradi. Mahalliy tuzilma va qiymat tekshiruvlaridan so'ng, Matplotlib shablonlari spetsifikatsiyani vizuallashtiradi. Masofaviy ko'rish modeli tasvirni himoyalangan yozuv bilan solishtiradi va ko'pi bilan to'rtta tuzatish uchun strukturaviy fikr-mulohaza beradi. Hech bir masofaviy model asl grafikni olmaydi. Tuzatish muvaffaqiyatsiz bo'lsa, tizim faqat interfeys tomonidan qabul qilinganda tasdiqlangan jadvalga o'tadi; aks holda so'rov rad etiladi.&lt;/p&gt;\n&lt;p&gt;Nutq va matnni rekonstruksiya qilish. Masofaviy matndan nutqqa (TTS) xizmati himoyalangan parchalarni sintez qiladi. Nazoratchi har bir nomzod to'lqin shaklini transkripsiya qiladi, tushunarlilikni va himoyalangan miqdorlarni tekshiradi hamda xatolarni qayta generatsiya qiladi. Matnli interfeyslar uchun himoyalangan dalillar so'rov bilan birga serializatsiya qilinadi.&lt;/p&gt;\n&lt;p&gt;Ikki tomonlama chiqarish tekshiruvi. &lt;span class=\"yfm-latex\" data-content=\"V_%7Bprotected%7D%2C%20V_%7Bsource%7D%20%5Cin%20%5C%7B0%2C%201%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; mos ravishda himoyalangan yozuv va mahalliy manba izchilligini tekshirishdan o'tishni bildiradi (1 - muvaffaqiyat, 0 - xato). Birinchisi grafiklar uchun vizuallashtirilgan qiymatlar, belgilar va birliklarni, ikkinchisi esa qayta yozilgan entitilarni manba rollari bilan solishtiradi. Chiqarish qarori &lt;span class=\"yfm-latex\" data-content=\"V_%7Brelease%7D%20%5Cin%20%5C%7B0%2C%201%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; quyidagicha aniqlanadi: &lt;span class=\"yfm-latex\" data-content=\"V_%7Brelease%7D%20%3D%20V_%7Bprotected%7D%20%5Cwedge%20V_%7Bsource%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ma'lumotlar faqat har ikkala shart bajarilganda (Vrelease = 1) chiqariladi, bu ham xavfsizlik, ham semantik aniqlikni ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tajribalar\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#tajribalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TAJRIBALAR&lt;/span&gt;&lt;/a&gt;TAJRIBALAR&lt;/h4&gt;\n&lt;p&gt;RECAST uch yo'nalishda baholanadi: mulohaza yuritish foydaliligi, mustahkamlik va komponentlar hissasi. Biz eksperimental sozlamalar, asosiy natijalar, ma'lumotlar to'plamidan tashqari umumlashtirish, bosqichma-bosqich ablyatsiya va sizib chiqishni aniqlovchi AI sudini tavsiflaymiz.&lt;/p&gt;\n&lt;p&gt;4.1 EKSPERIMENTAL SOZLAMALAR&lt;/p&gt;\n&lt;p&gt;Ma'lumotlar to'plami. Biz to'rtta raqamli javobli to'plamda baholaymiz. Taqsimot ichidagi (ID) baholash uchun ChartQA va NMSQA'dan 2000 tadan misol ishlatildi. Distillyatsiya havzasi 9370 ChartQA va 7000 NMSQA yozuvini o'z ichiga olgan (15 480 o'qitish, 315 validatsiya uchun). Taqsimotdan tashqari (OOD) baholash uchun ChartX va Spoken-MQA'dan 2000 tadan misol ishlatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ablyatsiya — tizimning muhimligini aniqlash uchun uning komponentlarini ketma-ket o'chirib tekshirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bazaviy modellar. Biz RECAST'ni kompleks yechimlar va alohida bosqichlar bilan solishtiramiz. Remote-native asl ma'lumotlarni masofaviy yechuvchiga yuboradi. Gemma-4-E4B va Qwen2.5-Omni-3B nol sizib chiqishli mahalliy etalonlardir. 2-bosqichda biz sozlangan Rewriter'ni Qwen3-4B va GPT-5.6-Sol o'qituvchisi bilan solishtiramiz. 3-bosqichda muqobil usullar (PSIC, SPTI, AudioShield) ma'lumotlar ekspozitsiyasi darajasi bo'yicha baholanadi, chunki ular QA uchun sonli operandlarni tiklamaydi. Shuningdek, Codex &lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt; va DeepSeek Harness rekonstruksiya strategiyalari solishtiriladi.&lt;/p&gt;\n&lt;p&gt;Realizatsiya. 1-bosqichda Qwen3-VL-8B-Instruct va Qwen3-ASR-1.7B konvertatsiya uchun ishlatiladi. 2-bosqichda QLoRA orqali sozlangan Qwen3-4B qo'llaniladi. 3-bosqichda DeepSeek-V4 modellari ChartSpec generatsiya qiladi, Qwen3-TTS-Flash nutqni sintez qiladi va Qwen3.5-Omni-Plus masofaviy yechuvchi sifatida ishlaydi.&lt;/p&gt;\n&lt;h4 id=\"audioshield-oxirigacha-tiklashning-yoqligi\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#audioshield-oxirigacha-tiklashning-yoqligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AudioShield: oxirigacha tiklashning yoʻqligi&lt;/span&gt;&lt;/a&gt;AudioShield: oxirigacha tiklashning yoʻqligi&lt;/h4&gt;\n&lt;p&gt;4.2 Asosiy natijalar. Tadqiqot uchta ssenariyni solishtiradi: asl maʼlumotlar bilan mahalliy modellar, himoyalangan media fayllar bilan RECAST tizimi va masofaviy soʻrov, bunda server asl maʼlumotlarni oladi. RECAST ChartQA boʻyicha 70,20% (normallashtirilgan aniqlik 93,48%) va NMSQA boʻyicha 80,00% (91,53%) aniqlikni koʻrsatadi, umumiy aniqlik 75,10% (92,43%) va manba tarkibining sizib chiqishi 7,95% ni tashkil qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST tizimi 7,95% maʼlumot sizib chiqish chegarasi bilan 75,10% umumiy aniqlikni taʼminlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4.3 Turli maʼlumotlar toʻplamlarida baholash. Qwen3-4B modeli yordamida in-distribution (ID) va out-of-distribution (OOD) sharoitlarida oʻtkazilgan testlar shuni koʻrsatdiki, OOD maʼlumotlarida (ChartX va Spoken-MQA) aniqlik mos ravishda 62,40% va 79,40% gacha pasaygan (7,80 va 0,60 foiz punktiga pasayish). Maʼlumotlarning sizib chiqishi tasvirlar uchun 8,00% (ID) va 1,40% (OOD), audio uchun esa 7,90% (ID) va 5,90% (OOD) ni tashkil etdi. Audioda aniqlikning kamroq pasayishi modelning nutq maʼlumotlaridagi domen oʻzgarishlariga nisbatan barqarorroq ekanligini koʻrsatadi.&lt;/p&gt;\n&lt;p&gt;4.4 Ablyatsion tadqiqotlar. Toʻgʻridan-toʻgʻri multimodal kiritish va taklif etilgan ajratilgan qayta ishlash yoʻlini solishtirish shuni koʻrsatdiki, ajratish umumiy aniqlikni 44,60% dan 65,85% gacha (+21,25 p.p.) oshiradi. Rekonstruksiya bosqichini (Stage 3) baholashda himoyalangan matndan foydalanish media rekonstruksiyasiga nisbatan 1,75 p.p. ustunlik berishi aniqlandi. Biroq, audio uchun toʻlqin shakliga rekonstruksiya qilish interfeyslar bilan moslik uchun zarur, garchi bu matnli koʻrinishga nisbatan 3,90 p.p. aniqlik yoʻqotilishiga olib kelsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsionnoe-issledovanie.html\"&gt;Ablyatsion tadqiqot&lt;/a&gt; — bu tizim komponentlarini navbatma-navbat oʻchirish yoki almashtirish orqali ularning hissasini tekshirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4.5 &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-hakamning haqiqiyligi. Maʼlumotlarning sizib chiqishi har doim ham satrlarning oddiy mos kelishiga bogʻliq boʻlmagani uchun, baholashda avtomatlashtirilgan LLM-hakamdan foydalanildi. Uning qarorlari 400 ta maʼlumotlar juftligida inson belgilari bilan solishtirildi. Moslik 91,50% ni tashkil etdi (Koen Kappa koeffitsienti κ = 0,83), bu avtomatik baholashning ishonchliligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sizib chiqishni baholash inson baholaridan farq qiluvchi tizimli xatolarga ega boʻlishi mumkin boʻlgan LLM-hakamga asoslangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Biz RECAST tizimini taqdim etdik — bu raqamli mulohazalar uchun multimodal interfeyslar orqali ma'lumotlarni himoyalash va shartnoma shartlarini saqlab qolish tizimi. Asosiy yondashuv manba mazmunini almashtirish va xizmat talab qiladigan vazifa aloqalari hamda media formatini saqlab qolishdan iborat. Dalillar va so‘rovlarning umumiy yozuvi kontent himoyasini modallikdan ajratadi, lokal operandlarni tiklash esa himoyalangan ma'lumotlar ustidagi masofaviy hisob-kitoblarni asl qiymatlar bilan ishlashdan ajratib turadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST ChartQA va NMSQA to‘plamlarida masofaviy hisoblash aniqligining 92,43% qismini saqlab qoladi, audit modeli esa 7,95% hollarda ma'lumotlar sizib chiqishini aniqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ChartQA va NMSQA testlarida RECAST tizimi himoyalanmagan masofaviy hisob-kitoblarga nisbatan 92,43% aniqlikni saqlab qoladi. Kontent sizib chiqishini tekshiruvchi audit modeli yechuvchi (solver) bilan bog‘liq kontekstlarning 7,95% qismida sizib chiqishni qayd etdi. 4 mlrd parametrli distillangan lokal qayta yozuvchi (rewriter) ishlatilganda, umumiy aniqlik avtonom o‘qituvchi konfiguratsiyasiga nisbatan atigi 0,55 foiz punktga pasayadi. Rekonstruksiya agenti grafiklar bilan ishlashda muqobil usullardan ustunlik qiladi, ChartX va Spoken-MQA natijalari esa modelning o‘qitish ma'lumotlaridan tashqarida ham ishlashini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"aiuse-statement\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#aiuse-statement\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AIUSE STATEMENT&lt;/span&gt;&lt;/a&gt;AIUSE STATEMENT&lt;/h4&gt;\n&lt;p&gt;Generativ sun'iy intellekt vositalari tilni tahrirlash, qo‘lyozma tuzilmasini yaxshilash va kodni tahrirlashda yordam berish uchun ishlatilgan. Barcha ilmiy g‘oyalar va metodologik qarorlar mualliflar tomonidan tekshirilgan va ular ishning yakuniy mazmuni uchun to‘liq javobgardirlar.&lt;/p&gt;\n&lt;h4 id=\"reproducibility-statement\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#reproducibility-statement\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;REPRODUCIBILITY STATEMENT&lt;/span&gt;&lt;/a&gt;REPRODUCIBILITY STATEMENT&lt;/h4&gt;\n&lt;p&gt;Natijalarni takrorlanishini ta'minlash uchun mualliflar kod, prompterlar, distillangan adapter, o‘qituvchi izlari, ishga tushirish manifestlari (muhit va ma'lumotlar heshlari bilan) va audit loglarini taqdim etadilar.&lt;/p&gt;\n&lt;h4 id=\"ethicsstatement\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#ethicsstatement\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ETHICSSTATEMENT&lt;/span&gt;&lt;/a&gt;ETHICSSTATEMENT&lt;/h4&gt;\n&lt;p&gt;ChartQA va NMSQA ochiq benchmarklaridan foydalanilgan. Kalibrlash jarayonida maqola mualliflari ishtirok etgan. Sizib chiqishni baholash mexanizmi asl ma'lumotlar bilan faqat baholash jarayonida ishlaydi; haqiqiy foydalanishda asl ma'lumotlar lokal qoladi, bu esa shartnomaviy nazorat bilan birgalikda xavfsizlikni oshiradi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f2.jpg\" alt=\"2-rasm: RECAST sharhi. Konveyer avval multimodal kirish maʼlumotlarini yagona matnli koʻrinishga oʻtkazadi (3.2-boʻlim),\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: RECAST sharhi. Konveyer avval multimodal kirish maʼlumotlarini yagona matnli koʻrinishga oʻtkazadi (3.2-boʻlim), soʻngra obyektlar va raqamlarni himoya qilish uchun mavzuni qayta yozish va mahalliy raqamli qayta xaritalashni qoʻllaydi (3.3-boʻlim).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: RECAST sharhi. Konveyer avval multimodal kirish maʼlumotlarini yagona matnli koʻrinishga oʻtkazadi (3.2-boʻlim), soʻngra obyektlar va raqamlarni himoya qilish uchun mavzuni qayta yozish va mahalliy raqamli qayta xaritalashni qoʻllaydi (3.3-boʻlim). Himoyalangan matn keyinchalik asl modalikdagi surrogatga rekonstruksiya qilinadi, u ChartSpec asosida renderlash va tekshirish orqali diagrammalarni qayta yaratadi, matnni toʻgʻridan-toʻgʻri uzatadi va audio-ni proksi-nutq sifatida sintez qiladi (3.4-boʻlim). Rasmdagi misol ushbu konveyerni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f3.jpg\" alt=\"3-rasm: Birgalikda qayta yozish va raqamli himoya.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Birgalikda qayta yozish va raqamli himoya.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Birgalikda qayta yozish va raqamli himoya. Distillangan mahalliy qayta yozuvchi raqamli literallarni saqlab qolgan holda dalillar va soʻrovlar boʻylab obyektlar va mavzularni izchil oʻzgartiradi. Soʻrovga xos boʻlgan alohida xarita qoʻllab-quvvatlanadigan relyatsion cheklovlar ostida raqamli qiymatlarni almashtiradi. Uning teskari funksiyasi operandlarni tiklash uchun mahalliy darajada qoladi. 3-rasmda koʻrsatilganidek, ushbu bosqich dalil-soʻrov yozuvini ikkita bir-birini toʻldiruvchi transformatsiya orqali himoya qiladi: distillangan mahalliy qayta yozuvchi dalil-soʻrov mosligini saqlagan holda obyektlar va mavzularni birgalikda oʻzgartiradi; soʻrovga xos raqamli xarita esa aniq relyatsion cheklovlar ostida qiymatlarni oʻrniga qoʻyadi. Teskari xarita masofaviy yechuvchi tomonidan qaytarilgan dasturdagi operandlarni tiklash uchun mahalliy darajada qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f4.jpg\" alt=\"4-rasm: Modalikni rekonstruksiya qilish va chiqarishni tekshirish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Modalikni rekonstruksiya qilish va chiqarishni tekshirish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: Modalikni rekonstruksiya qilish va chiqarishni tekshirish. Interfeys rekonstruksiya plaginini tanlaydi. Diagrammalar spetsifikatsiyani yaratish, mahalliy renderlash va sharhlovchi tomonidan boshqariladigan tuzatishdan foydalanadi; nutq sintez va undan keyin transkripsiyaga asoslangan tekshiruvlardan foydalanadi; matn toʻgʻridan-toʻgʻri seriyalanadi. Chiqarish ham himoyalangan yozuvning izchilligini, ham manba izchilligini mahalliy tekshirishni talab qiladi. 4-rasmda koʻrsatilganidek, rekonstruksiya agenti eD-ni «yaratish-tekshirish-tuzatish» sikli orqali interfeysga mos keladigan artefaktga aylantiradi. U asl diagramma koʻrinishini yoki notiq shaxsini takrorlashni emas, balki himoyalangan dalillarni ishonchli ifodalashni maqsad qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f5.jpg\" alt=\"5-rasm: Tasvir yozuvlaridagi diagramma turlari (a; aniqlanib boʻlmaydigan turdagi 32 ta yozuv chiqarib tashlangan) va di\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Tasvir yozuvlaridagi diagramma turlari (a; aniqlanib boʻlmaydigan turdagi 32 ta yozuv chiqarib tashlangan) va distillash korpusidagi audio yozuvlarning mavzulari (b).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f6.jpg\" alt=\"6-rasm: Tasvir yozuvlaridagi har bir diagramma turi boʻyicha savol operatsiyalari. Har bir satr yigʻindisi 100% ni tashk\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Tasvir yozuvlaridagi har bir diagramma turi boʻyicha savol operatsiyalari. Har bir satr yigʻindisi 100% ni tashkil qiladi; kulrang raqamlar barcha tasvir yozuvlari boʻyicha har bir operatsiyaning ulushini koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f7.jpg\" alt=\"7-rasm: Tasvir (a) va audio (b) yozuvlarining mavzulari. Doira maydoni yozuvlar ulushiga mutanosib; doira joylashuvi hec\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Tasvir (a) va audio (b) yozuvlarining mavzulari. Doira maydoni yozuvlar ulushiga mutanosib; doira joylashuvi hech qanday maʼno kasb etmaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f8.jpg\" alt=\"8-rasm: Oʻqituvchi qayta yozishidan oldin va keyin tasvir (a, b) va audio (c, d) yozuvlarida eng koʻp uchraydigan mustaq\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Oʻqituvchi qayta yozishidan oldin va keyin tasvir (a, b) va audio (c, d) yozuvlarida eng koʻp uchraydigan mustaqil soʻzlar. Soʻz hajmi va soyasi chastota ortishi bilan kattalashadi va toʻqnashadi; diagramma tavsifi va xizmatchi soʻzlar olib tashlangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f9.jpg\" alt=\"9-rasm: Toʻrtta ChartQA taqqoslashi: kirish maʼlumotlari, SPTI (Wang et al., 2025), PSIC (Shen et al., 2025), RLAA (Duan\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm: Toʻrtta ChartQA taqqoslashi: kirish maʼlumotlari, SPTI (Wang et al., 2025), PSIC (Shen et al., 2025), RLAA (Duan et al., 2026), Eternis (Eternis, 2025) va RECAST. SPTI namunalari juftlanmagan; boshqa natijalar manba namunasining ID siga mos keladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f10.jpg\" alt=\"10-rasm: Beshta NMSQA audio taqqoslashi: kirish transkripti, AudioShield (Jin et al., 2025) tomonidan ҳimoyalangan audio\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm: Beshta NMSQA audio taqqoslashi: kirish transkripti, AudioShield (Jin et al., 2025) tomonidan ҳimoyalangan audio ASR, RLAA (Duan et al., 2026) va Eternis (Eternis, 2025) tomonidan ҳimoyalangan matn hamda RECAST transkripti.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bulutli AI&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tizimlarida&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ma'lumotlar&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;sizib chiqish&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;teskari shifr&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bilan&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kontentni&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"
