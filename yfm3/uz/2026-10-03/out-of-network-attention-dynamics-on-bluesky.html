            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"249\" cy=\"72\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"591\" cy=\"271\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · COORDINATION   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ijtimoiy tarmoqlarda biz&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;nimani tanlaymiz:&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;algoritmlarmi yoki tanish&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;doira?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f1.jpg\" alt=\"1-rasm. Yuqorida: eʼtibor yoʻli uzunligi boʻyicha parchalangan tahlil qilingan oʻzaro taʼsirlar (107,8 mln kuzatilgan, 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Yuqorida: eʼtibor yoʻli uzunligi boʻyicha parchalangan tahlil qilingan oʻzaro taʼsirlar (107,8 mln kuzatilgan, 21,2 mln uzatilgan, 31,7 mln ikki bosqichli mahalliy, 12,5 mln masofaviy). Quyida: kuzatuvning ikki bosqichi doirasidagi oʻzaro taʼsirlar ulushi (yaʼni, kuzatilgan va ikki bosqichli mahalliy darajalar, uzatish bundan mustasno) kutilgan nol darajaga nisbatan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ijtimoiy tarmoq foydalanuvchilari ko'pincha algoritmlarni ayblashadi, ammo tarmoq tuzilishi ham muhim rol o'ynaydi. Bluesky platformasidagi 173 million o'zaro ta'sir tahlili shuni ko'rsatdiki, foydalanuvchilar o'zlarining «ijtimoiy pufaklari» ichida qolishga moyil. Hatto oddiy xronologik tasmada ham odamlar o'z obunalari doirasidan chiqib ketishga unchalik qiziqishmaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;O'zaro ta'sirlarning 74,5% qismi foydalanuvchining mavjud obunalari orqali amalga oshiriladi.&lt;/li&gt;\n&lt;li&gt;Diqqatning 80,6% qismi ikki &lt;a href=\"concepts/step.html\"&gt;qadam&lt;/a&gt; masofada to'plangan, bu tasodifiy modeldan 3,6 barobar yuqori.&lt;/li&gt;\n&lt;li&gt;Tarmoqdan tashqaridagi kontent bilan o'zaro ta'sir yangi obunaga aylanish ehtimoli 3 barobar past.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar 2023-yil fevralidan sentyabrigacha 1,1 million Bluesky foydalanuvchisining 173 million o'zaro ta'sirini (layklar, repostlar, javoblar) o'rganib chiqishdi. Asosiy o'lchov birligi sifatida «diqqat yo'li uzunligi» — foydalanuvchi va kontent muallifi o'rtasidagi obunalar grafigidagi masofa olindi. Natijalar shuni ko'rsatdiki, barcha o'zaro ta'sirlarning 74,5% qismi foydalanuvchi allaqachon obuna bo'lgan akkauntlar yoki ular orqali tarqatilgan kontentga to'g'ri keladi.&lt;/p&gt;\n&lt;p&gt;Obunalar grafigidagi masofa bo'yicha hisoblaganda, o'zaro ta'sirlarning 80,6% qismi ikki «qadam» (follow-hops) masofasida sodir bo'ladi. Bu tasodifiy taqsimotni nazarda tutuvchi nol model (expected-degree null) bashorat qilgan 22,4% ko'rsatkichidan ancha yuqori. Tadqiqot shuningdek, foydalanuvchilar o'z tarmoqlaridan tashqaridagi kontentni ko'rishsa ham, ularni yangi obunalarga aylantirish ehtimoli juda pastligini aniqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat aniq harakatlarni (layk, repost) tahlil qiladi, passiv kontent iste'molini (ko'rish, o'qish) hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Shaxsiy ijtimoiy tarmoqlar foydalanuvchi ko‘radigan kontentni shakllantirish uchun ko‘pincha obuna bo‘lish graflaridan foydalanadi. Biroq, foydalanuvchi obuna bo‘lmagan mualliflarning kontentiga qanchalik e’tibor qaratilishi hali to‘liq o‘rganilmagan. Tadqiqot Bluesky markazlashmagan platformasiga qaratilgan bo‘lib, unda standart tasma teskari xronologik tartibda ishlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/graf-podpisok.html\"&gt;Obuna grafi&lt;/a&gt; — bu foydalanuvchilar o‘rtasidagi aloqalarni aks ettiruvchi ma’lumotlar strukturasi, «diqqat yo‘li» esa kontent foydalanuvchiga qancha vositachi orqali yetib kelishini belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar 2023-yilning fevralidan sentyabrigacha to‘plangan 173 million o‘zaro ta’sirni (layklar, repostlar, javoblar va iqtiboslar) tahlil qilishdi. O‘zaro ta’sirlar yo‘l uzunligiga ko‘ra tasniflandi: to‘g‘ridan-to‘g‘ri obuna, obuna orqali uzatilgan kontent, graf bo‘ylab ikki «sakrash» (hops) masofasidagi yoki undan tashqaridagi kontent.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O‘zaro ta’sirlarning 74,5% foydalanuvchi allaqachon obuna bo‘lgan akkauntlarga to‘g‘ri keladi, 80,6% esa ikki «sakrash» masofasida joylashgan, bu nol model bo‘yicha kutilgan 22,4% dan sezilarli darajada yuqori.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot shuni ko‘rsatadiki, foydalanuvchilarning kichik bir guruhi barcha «tadqiqot» faoliyatining (obunalar tarmog‘idan tashqaridagi o‘zaro ta’sirlar) 75% ini hosil qiladi. Vaqt o‘tishi bilan yangi kontentni o‘rganishga moyillik pasayadi, biroq bu ortda uch xil xulq-atvor turi yashiringan. Ikki «sakrash» masofasidan tashqaridan kelgan kontent yangi obunalarga uch barobar kamroq aylanadi. Bu shuni anglatadiki, tashqi kontent hajmi katta bo‘lishiga qaramay, u ijtimoiy tarmoqdagi yaqinlik bilan cheklangan va yangi aloqalarning shakllanishiga olib kelishi ehtimoli kam.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu kuzatuv tadqiqoti Bluesky platformasidagi korrelyatsiyalarni tasvirlaydi; natijalar tarmoq algoritmlari va auditoriya xulq-atvoriga bog‘liq bo‘lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Koʻpgina yirik ijtimoiy platformalar kontentni reyting algoritmlari orqali boshqaradi, ularning ishlash prinsipi tashqi kuzatuvchilar uchun qisman yopiq. Bu foydalanuvchi diqqatini shakllantiruvchi ikki kuchni ajratishni qiyinlashtiradi: foydalanuvchi oʻzi tanlagan ijtimoiy doira va tavsiya tizimlari tomonidan taklif etiladigan kontent. Bluesky platformasi bu farqni oʻrganish uchun noyob muhitni taqdim etadi. U ochiq AT Protocol asosida qurilgan va standart boʻyicha «Following» tasmasidan foydalanadi, unda postlar teskari xronologik tartibda koʻrsatiladi. Boshqa tavsiya mexanizmlari mavjud boʻlsa-da, ular ixtiyoriydir va tadqiqotlar ulardan foydalanish darajasi cheklanganligini koʻrsatadi. Shu sababli, Bluesky obunalar grafigi foydalanuvchi diqqati oʻzi qurgan ijtimoiy doiradan qanchalik tashqariga chiqishini tahlil qilish uchun asos boʻlib xizmat qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatadiki, foydalanuvchi oʻzaro taʼsirlarining 74,5% qismi ular allaqachon obuna boʻlgan akkauntlar yoki ular orqali qilingan repostlar hissasiga toʻgʻri keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ishda diqqat tushunchasi xulq-atvor izlari: layklar, repostlar, javoblar va iqtiboslar orqali aniqlanadi. Mualliflar savol qoʻyishadi: diqqatning qancha qismi obunalar tarmogʻi ichida qoladi va qanchasi undan tashqariga chiqadi? Bu muhim, chunki ijtimoiy aloqalar selektivdir. &lt;a href=\"concepts/gomofiliya.html\"&gt;Gomofiliya&lt;/a&gt; (oʻxshash odamlar bilan birlashish moyilligi) obunalar grafigi dastlabki holatda tasodifiy emasligini anglatadi. Tadqiqotchilar uchta savolni tahlil qilishadi: obunalar grafigidan tashqariga qancha diqqat chiqadi (RQ1), bu izlanish foydalanuvchilar oʻrtasida qanday taqsimlangan (RQ2) va tashqi diqqat yangi ijtimoiy aloqalarga aylanadimi (RQ3).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gomofiliya — odamlarning oʻziga oʻxshashlar bilan aloqa oʻrnatishga moyilligi boʻlib, bu axborot klasterlarini hosil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1,1 million foydalanuvchining 173 million oʻzaro taʼsirini oʻz ichiga olgan maʼlumotlar toʻplamidan foydalanib, mualliflar oʻzaro taʼsirlarning 80,6% qismi foydalanuvchining ikki bosqichli obunalar doirasida sodir boʻlishini aniqlashdi. Tashqi kontentni oʻrganish hajmi sezilarli boʻlsa-da, u foydalanuvchilar oʻrtasida notekis taqsimlangan: faol ozchilik tashqi faoliyatning asosiy qismini yaratadi. Shu bilan birga, ikki bosqichli doiradan tashqaridagi oʻzaro taʼsirlar mahalliy harakatlarga qaraganda uch baravar kamroq yangi obunalarga aylanadi.&lt;/p&gt;\n&lt;h4 id=\"bogliq-ishlar\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#bogliq-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bogʻliq ishlar&lt;/span&gt;&lt;/a&gt;Bogʻliq ishlar&lt;/h4&gt;\n&lt;p&gt;Onlayn diqqat nafaqat platforma dizayni, balki foydalanuvchilarning shaxsiy afzalliklari bilan ham shakllanadi. Gomofiliya va tasdiqlash tarafkashligi odamlarni oʻz eʼtiqodlariga mos kontentni izlashga majbur qiladi. Oldingi ishlar buni hamjamiyatlar darajasida oʻrgangan boʻlsa, ushbu tadqiqot strukturaviy masofaga — diqqat foydalanuvchining oʻz obunalar grafigidan qanchalik uzoqlashishiga eʼtibor qaratadi. Mualliflar «izlanish» (tashqi akkauntlar bilan oʻzaro taʼsir) va «konversiya» (buni obunaga aylantirish) tushunchalarini ajratib koʻrsatishadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat Bluesky platformasi maʼlumotlariga asoslangan, shuning uchun natijalarni boshqa ijtimoiy tarmoqlarga toʻliq koʻchirish cheklangan boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"rq1-obuna-grafigidan-tashqariga-qancha-etibor-chiqadi\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rq1-obuna-grafigidan-tashqariga-qancha-etibor-chiqadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ1: Obuna grafigidan tashqariga qancha eʼtibor chiqadi?&lt;/span&gt;&lt;/a&gt;RQ1: Obuna grafigidan tashqariga qancha eʼtibor chiqadi?&lt;/h4&gt;\n&lt;p&gt;Kamida bitta tahlil qilingan oʻzaro taʼsirga ega 1,1 million foydalanuvchidan 575 mingtasi oʻrganilayotgan juftliklarni tashkil etadi. 173 million oʻzaro taʼsirni eʼtibor yoʻli uzunligi boʻyicha tahlil qilish shuni koʻrsatdiki: 62,3% foydalanuvchi allaqachon obuna boʻlgan mualliflarga, 12,2% obuna boʻlingan akkaunt orqali uzatilgan (repost), 18,3% obuna grafigi boʻyicha ikki qadam masofadagi mualliflarga, 7,2% esa ikki qadamdan tashqariga chiqadi. Shunday qilib, oʻzaro taʼsirlarning 74,5% foydalanuvchi allaqachon obuna boʻlgan akkauntlar orqali amalga oshiriladi. Agar repostlarni chiqarib tashlab, faqat obuna grafigi boʻyicha masofani hisoblasak, oʻzaro taʼsirlarning 80,6% ikki qadam masofadagi mualliflarga yetib boradi (62,3% — bir qadam, 18,3% — ikki qadam). Bu pastki chegara, chunki baʼzi repostlar ham ikki qadam ichida boʻlishi mumkin. Nol modeli (foydalanuvchilarning kiruvchi va chiquvchi aloqalarini saqlagan holda kutilayotgan taqsimot) bilan solishtirish shuni koʻrsatadiki, tasodifiy sharoitlarda oʻzaro taʼsirlarning atigi 22,4% ikki qadam ichida boʻlardi — 58,4 foizlik farq turli kogortalar uchun barqaror qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oʻzaro taʼsirlarning 80,6% obuna grafigi boʻyicha ikki qadam masofadagi mualliflarga yoʻnaltirilgan, bu tasodifiy taqsimotdan (22,4%) sezilarli darajada yuqori.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rq2-tadqiqot-etibori-qanday-taqsimlanadi-va-u-vaqt-otishi-bilan-ozgaradimi\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rq2-tadqiqot-etibori-qanday-taqsimlanadi-va-u-vaqt-otishi-bilan-ozgaradimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ2: Tadqiqot eʼtibori qanday taqsimlanadi va u vaqt oʻtishi bilan oʻzgaradimi?&lt;/span&gt;&lt;/a&gt;RQ2: Tadqiqot eʼtibori qanday taqsimlanadi va u vaqt oʻtishi bilan oʻzgaradimi?&lt;/h4&gt;\n&lt;p&gt;Obuna va oʻzaro taʼsirlarda eng faol foydalanuvchilar koʻpincha oʻz eʼtiborini «yaqin doira» bilan cheklashadi. Tadqiqot xarakteridagi oʻzaro taʼsirlarning ulushi faollik hajmi boʻyicha birinchi desildan oʻninchi desilgacha 20,1% dan 74,3% gacha, obunalar soni boʻyicha esa 3,3% dan 80,4% gacha oʻsadi. Kamida 10 ta tadqiqot hodisasiga ega 246 ming foydalanuvchi uchun mualliflar xulq-atvorning 4 ta klasterini ajratib koʻrsatishdi. Koʻpchilik (53,3%) — «tor qamrov, kamdan-kam hodisalar, past chastota». Boshqa klasterlar bitta belgi bilan ajralib turadi: «keng qamrov» (22,7% foydalanuvchi, oʻrtacha 293,9 muallif), «takroriy kontaktlar» (5,2% foydalanuvchi, har bir muallifga 5,2 marta tashrif) va «yuqori tadqiqot chastotasi» (18,8% foydalanuvchi, faoliyatining 66,7% tadqiqot). Keng qamrov har doim ham yuqori chastota bilan bogʻliq emas: eng keng qamrovli klaster kontentni oʻrtacha chastotada (29,7%) oʻrganadi va mualliflarga kamdan-kam qaytadi. «Keng, lekin kamdan-kam» klasteri barcha tadqiqot hodisalarining 74,4% ni tashkil qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/klasterizatsiya.html\"&gt;Klasterlash&lt;/a&gt; — foydalanuvchilarni standartlashtirilgan belgilar asosida oʻxshash xulq-atvor namunalari boʻyicha guruhlash uchun mashinali oʻqitish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dinamika tahlili shuni koʻrsatadiki, tadqiqot eʼtibori umumiy ulushi 7 vaqt birligida 24,3% dan 21,0% gacha pasayadi, ammo bu oʻrtacha qiymat nomutanosiblikni yashiradi. Uchta guruh ajratilgan: «pasayuvchi» (34,6% foydalanuvchi, 38,1% dan 20,7% gacha pasayish), «oʻsuvchi» (35,0%, 16,3% dan 25,0% gacha oʻsish) va «tranzit» (30,4%, oʻsish va keyingi pasayish). Foydalanuvchilarning uchdan bir qismi umumiy tendensiyaga qarama-qarshi yoʻnalishni namoyish etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv maʼlumotlariga asoslangan; aniqlangan qonuniyatlar sabab-oqibat aloqalarini emas, balki korrelyatsiyalarni tavsiflaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rq3-chiquvchi-etibor-yangi-aloqalarga-aylanadimi\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rq3-chiquvchi-etibor-yangi-aloqalarga-aylanadimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ3: «Chiquvchi» eʼtibor yangi aloqalarga aylanadimi?&lt;/span&gt;&lt;/a&gt;RQ3: «Chiquvchi» eʼtibor yangi aloqalarga aylanadimi?&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar 22 million oʻzaro taʼsir juftligini tahlil qilib, obuna grafigidan tashqaridagi kontaktlar yangi aloqalarga olib kelishini oʻrgandilar. 30 kun ichida obunaga aylanish darajasi 8,4% ni tashkil etdi, bunda holatlarning 90% dan ortigʻi birinchi haftada yuz beradi. Konversiya ehtimoli muallifgacha boʻlgan «masofa»ga bogʻliq: agar birinchi kontakt obuna grafigidagi ikki «sakrash» (two-hop) doirasida boʻlsa, konversiya 11,9% ni, bu chegaradan tashqarida esa atigi 3,3% ni tashkil qiladi (1-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ikki «sakrash»dan tashqaridagi kontaktning obunaga aylanish ehtimoli mahalliy oʻzaro taʼsirlarga qaraganda 3,6 barobar past (3,3% ga nisbatan 11,9%).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu farq tsenzura qilingan maʼlumotlar va foydalanuvchi darajasidagi yettita kovariata uchun tuzatishlardan keyin ham saqlanib qoladi. Tuzatilgan modelda (2-jadval) «uzoq» kontakt uchun &lt;a href=\"concepts/or.html\"&gt;imkoniyatlar nisbati&lt;/a&gt; (OR) mahalliy kontaktga nisbatan 0,351 (95% CI 0,335–0,368) ni tashkil etadi. Qizigʻi shundaki, foydalanuvchining yuqori faolligi (log total interaction volume) konversiya ehtimolini pasaytiradi (OR 0,600), lekin koʻplab chiquvchi aloqalarning mavjudligi (log out-degree) uni oshiradi (OR 1,234).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Imkoniyatlar nisbati (OR) — bir guruhdagi hodisa ehtimoli boshqasiga nisbatan qanchalik yuqori yoki pastligini koʻrsatuvchi koʻrsatkich.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"muhokama-va-xulosalar\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#muhokama-va-xulosalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama va xulosalar&lt;/span&gt;&lt;/a&gt;Muhokama va xulosalar&lt;/h4&gt;\n&lt;p&gt;Natijalar shuni koʻrsatadiki, Bluesky foydalanuvchilarining eʼtibori mavjud ijtimoiy tarmoqqa qattiq bogʻlangan. Garchi oʻzaro taʼsirlarning 25% i obuna grafigidan tashqariga chiqsa-da, ularning 80,6% i baribir ikki «sakrash» doirasida qoladi, yana 12,2% i esa kuzatilayotgan akkauntlar tomonidan qilingan repostlarga toʻgʻri keladi. Bu tasodifiy taqsimotdagi kutilgan 22,4% dan sezilarli darajada yuqori boʻlib, tarmoqdagi yaqinlik oʻzaro taʼsirning asosiy omili ekanligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv xarakteriga ega: u korrelyatsiyalarni qayd etadi, ammo tarmoq masofasi va yangi aloqalar shakllanishi oʻrtasidagi sabab-oqibat bogʻliqligini isbotlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ish «qamrov sifatida tadqiqot» va «tuzilmaviy oʻzgarish sifatida tadqiqot» oʻrtasidagi farqni taʼkidlaydi. Foydalanuvchilar koʻpincha oʻz doirasidan tashqaridagi akkauntlar bilan oʻzaro taʼsir qilsalar-da, bunday kontaktlar kamdan-kam hollarda tarmoqning kengayishiga olib keladi. Ishning cheklovlari qatoriga haqiqiy kontent namoyishi oʻrniga amalga oshirilgan harakatlar maʼlumotlaridan foydalanish va platforma rivojlanishining dastlabki bosqichini tahlil qilish kiradi, bu esa algoritmik tavsiyalarning hozirgi dinamikasini aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;h4 id=\"ishonchlilik,-validatsiya-va-model-spetsifikatsiyalari\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#ishonchlilik,-validatsiya-va-model-spetsifikatsiyalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ishonchlilik, validatsiya va model spetsifikatsiyalari&lt;/span&gt;&lt;/a&gt;Ishonchlilik, validatsiya va model spetsifikatsiyalari&lt;/h4&gt;\n&lt;p&gt;Bogʻlanishlar ahamiyatini baholash uchun Chung-Lu modelidan foydalanildi: (u, a) juftligining ulanish ehtimoli kout(u)kin(a)/M sifatida aniqlanadi, bu yerda M — umumiy oʻzaro taʼsirlar soni. Nol gipoteza oʻzaro taʼsirlarning vaqt belgilarini hisobga oladi. Taqqoslanadigan kattalik — ikki «sakrash» doirasidagi oʻzaro taʼsirlar ulushi (graf bogʻlanishlari). Uchta vaqtinchalik kogorta boʻyicha tekshiruv barqarorlikni koʻrsatdi: ikki «sakrash» doirasidagi ulush 82,0%, 78,8% va 80,3% ni tashkil etdi (kutilgan 28,2%, 32,5% va 28,0% ga nisbatan), mos ravishda 6,20 mln, 1,63 mln va 1,69 mln oʻzaro taʼsir namunalari asosida.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ikki «sakrash» doirasidagi kuzatilgan oʻzaro taʼsirlar ulushi tasodifiy kutilmalardan sezilarli darajada yuqori (82% gacha, ~30% ga qarshi), bu bogʻlanishlarning tasodifiy emasligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klasterlash-usullari\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#klasterlash-usullari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klasterlash usullari&lt;/span&gt;&lt;/a&gt;Klasterlash usullari&lt;/h4&gt;\n&lt;p&gt;Klasterlash K-means usuli yordamida amalga oshirildi (K=2–10). Barqarorlikni tekshirish uchun GMM va namunani ikkiga boʻlish (ARI) usullari qoʻllanildi. Tarkibiy belgilar tadqiqot surʼati, kenglik va hodisalar intensivligini oʻz ichiga oladi. Trayektoriya belgilari foydalanuvchilarning sakkiz haftalik faoliyat koʻrsatkichlariga asoslangan. Trend shakli boʻyicha klasterlashda vektorlar oʻzgarishlar shaklini aks ettirish uchun normallashtirildi (z-score).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;K-means usuli maʼlumotlarni K ta klasterga guruhlaydi, siluet koeffitsiyenti esa optimal guruhlar sonini aniqlashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tarkibiy klasterlash (K=4) 0,376 siluet choʻqqisini va yuqori takrorlanuvchanlikni (ARI 0,984) koʻrsatdi. Trend shakli klasterlash (K=3) algoritmlar oʻrtasida barqarorroq deb topildi (ARI 0,509).&lt;/p&gt;\n&lt;h4 id=\"konversiya-modelining-spetsifikatsiyasi\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#konversiya-modelining-spetsifikatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konversiya modelining spetsifikatsiyasi&lt;/span&gt;&lt;/a&gt;Konversiya modelining spetsifikatsiyasi&lt;/h4&gt;\n&lt;p&gt;30 kunlik konversiyani (muallifga obuna boʻlish) baholash uchun logistik model ishlatildi. Kovariatalar maʼlumotlar sizib chiqishini oldini olish uchun birinchi aloqa (t₀) vaqtigacha hisoblandi. Model birinchi hodisa turini, masofani (mahalliy yoki uzoq) va yettita foydalanuvchi xususiyatini (oʻzaro taʼsir hajmi, kirish/chiqish darajalari, staj, tadqiqot surʼati, eʼtibor konsentratsiyasi, mahalliy ulush) oʻz ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model foydalanuvchilar boʻyicha klasterlashni hisobga oladi, lekin turli foydalanuvchilar obuna boʻladigan mualliflarni hisobga olmaydi, bu baholash aniqligiga taʼsir qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sezgirlik\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#sezgirlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sezgirlik&lt;/span&gt;&lt;/a&gt;Sezgirlik&lt;/h4&gt;\n&lt;p&gt;Mualliflar masofa effekti artefakt ekanligi haqidagi gipotezani tekshirdilar. Muallif xususiyatlarining qoʻshilishi imkoniyatlar nisbatini 0,351 dan 0,289 ga oʻzgartirdi, bu strukturaviy yaqinlik muallif xususiyatlariga bogʻliq emasligini tasdiqlaydi. 15 ta kichik toʻplamdagi tahlil imkoniyatlar nisbatining barqarorligini (0,331–0,380) koʻrsatdi. t₀ dan keyingi hodisalar ketma-ketligini tahlil qilish mahalliy ulush (1,682) konversiya effektini toʻliq tushuntirmasligini, yaʼni mahalliy va uzoq bogʻlanishlar turli trayektoriyalar boʻyicha rivojlanishini koʻrsatdi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"malumotlarni-yigish\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#malumotlarni-yigish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maʼlumotlarni yigʻish&lt;/span&gt;&lt;/a&gt;Maʼlumotlarni yigʻish&lt;/h4&gt;\n&lt;p&gt;Tadqiqot uchun maʼlumotlar Bluesky API orqali toʻplangan. Foydalanuvchi maʼlumotlari &lt;a href=\"concepts/personal-data-server.html\"&gt;PDS&lt;/a&gt; (Personal Data Servers) serverlarida saqlanadi, ular foydalanuvchining platformadagi barcha faoliyat tarixini oʻz ichiga oladi. Taxminan 5 million foydalanuvchidan iborat dastlabki tanlamadan 2025-yil yanvar holatiga koʻra barcha mavjud faoliyat yozuvlari olingan. Toʻplamga obunalar, «layk»lar, postlar, repostlar va bloklashlar kiritilgan. Hisoblash samaradorligini taʼminlash uchun tahlil platforma faoliyatining dastlabki 8 oyi (2023-yil fevraldan sentyabrgacha) bilan cheklangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PDS (Personal Data Server) — bu foydalanuvchining shaxsiy maʼlumotlarini saqlovchi markazlashtirilmagan server boʻlib, unga ochiq protokol orqali kirish mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"diqqat-va-yol-uzunligi\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#diqqat-va-yol-uzunligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diqqat va yoʻl uzunligi&lt;/span&gt;&lt;/a&gt;Diqqat va yoʻl uzunligi&lt;/h4&gt;\n&lt;p&gt;Diqqat kuzatiladigan oʻzaro taʼsir sifatida operatsiyalashtiriladi. Tahlilning asosiy birligi «foydalanuvchi — muallif» (du,a) juftligi boʻlib, unda toʻrt turdagi harakatlar (layklar, repostlar, javoblar, iqtiboslar) hisobga olinadi. Oʻzaro taʼsir diqqatning yetarli dalili hisoblanadi, biroq uning yoʻqligi diqqat yoʻqligini anglatmaydi, chunki reaksiyasiz koʻrilgan kontent maʼlumotlarda iz qoldirmaydi. Shuning uchun barcha koʻrsatkichlar haqiqiy diqqat darajasining quyi chegarasi hisoblanadi.&lt;/p&gt;\n&lt;p&gt;Oʻzaro taʼsirlar toʻrt darajaga boʻlinadi: tarmoq ichidagi (foydalanuvchi allaqachon muallifga obuna boʻlgan yoki oʻzi muallif) va tarmoqdan tashqaridagi. Tarmoqdan tashqaridagi taʼsirlar «retranslyatsiya orqali» (agar kontent foydalanuvchi obuna boʻlgan akkaunt tomonidan repost qilingan boʻlsa) va «tadqiqot xarakteridagi» turlarga ajratiladi. Tadqiqot xarakteridagi taʼsirlar oʻz navbatida «ikki qadamli lokal» (obuna yoʻli u → i → a mavjud boʻlsa) va «distant» turlarga boʻlinadi.&lt;/p&gt;\n&lt;h4 id=\"klasterlash\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#klasterlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Klasterlash&lt;/span&gt;&lt;/a&gt;Klasterlash&lt;/h4&gt;\n&lt;p&gt;Foydalanuvchilarning tadqiqot xulq-atvori ikki xil klasterlash usuli bilan tahlil qilinadi. Birinchisi, foydalanuvchilarni tadqiqot tarkibi (tezlik, qamrov kengligi, takroriy kontaktlar) boʻyicha guruhlaydi. Ikkinchisi, sakkiz haftalik tadqiqot intensivligi trayektoriyalarini (z-ball yordamida normallashtirilgan) klasterlaydi, bu xulq-atvorning platformadagi dastlabki davrda oʻsib boruvchi, kamayuvchi yoki vaqtinchalik ekanligini aniqlashga yordam beradi.&lt;/p&gt;\n&lt;h4 id=\"konversiya-tahlili\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#konversiya-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konversiya tahlili&lt;/span&gt;&lt;/a&gt;Konversiya tahlili&lt;/h4&gt;\n&lt;p&gt;Foydalanuvchining t₀ vaqtidan keyingi birinchi obunasi maqsadli natija sifatida qaraladi. 7, 15 va 30 kun ichida konversiyaga uchragan juftliklar ulushi birinchi kontakt turiga (lokal yoki distant) qarab hisobot qilinadi. Shuningdek, 30 kunlik konversiyani baholash uchun juftlik darajasidagi logistik regressiyalar qoʻllanadi, bu kontakt turi va konversiya oʻrtasidagi assotsiatsiyani aniqlashga imkon beradi, biroq toʻgʻridan-toʻgʻri sabab-oqibat bogʻliqligini daʼvo qilmaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f1.jpg\" alt=\"1-rasm. Yuqorida: eʼtibor yoʻli uzunligi boʻyicha parchalangan tahlil qilingan oʻzaro taʼsirlar (107,8 mln kuzatilgan, 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. Yuqorida: eʼtibor yoʻli uzunligi boʻyicha parchalangan tahlil qilingan oʻzaro taʼsirlar (107,8 mln kuzatilgan, 21,2 mln uzatilgan, 31,7 mln ikki bosqichli mahalliy, 12,5 mln masofaviy). Quyida: kuzatuvning ikki bosqichi doirasidagi oʻzaro taʼsirlar ulushi (yaʼni, kuzatilgan va ikki bosqichli mahalliy darajalar, uzatish bundan mustasno) kutilgan nol darajaga nisbatan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f2.jpg\" alt=\"2-rasm. Tarkib klasterlari (K=4): klaster boʻyicha xususiyatlar taqsimoti (oʻrganish darajasi, kenglik, takrorlanish tez\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Tarkib klasterlari (K=4): klaster boʻyicha xususiyatlar taqsimoti (oʻrganish darajasi, kenglik, takrorlanish tezligi) va har bir klasterning foydalanuvchilar ulushi hamda oʻrganilgan hodisalar ulushiga nisbati. Klasterlar tartibi barcha panellarda bir xil.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f3.jpg\" alt=\"3-rasm. Haftalik oʻrganish darajasi traektoriyasi klasterlari (K=3): faoliyatning dastlabki sakkiz haftasi davomida klas\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Haftalik oʻrganish darajasi traektoriyasi klasterlari (K=3): faoliyatning dastlabki sakkiz haftasi davomida klaster boʻyicha oʻrtacha traektoriya, qavs ichida foydalanuvchilar ulushi koʻrsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Diqqat obuna&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;doirasidan&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qanchalik&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;uzoqlashadi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Bluesky'dagi&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;173 mln o'zaro&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ta'sir tahlili&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Diqqatning 80%&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qismi ikki&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qadam bilan&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;cheklangan&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ijtimoiy&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tuzilma&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;algoritmlardan&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;muhimroq&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Preprint hali taqriz qilinmagan. Xulosalar dastlabki.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;
