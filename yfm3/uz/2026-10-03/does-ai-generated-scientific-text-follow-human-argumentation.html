        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"111\" cy=\"167\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"629\" cy=\"190\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SYNTHETIC   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Nega sun'iy intellekt yozgan&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ilmiy maqolalar bir xil&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qolipda?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Mualliflar lingvistika bo'yicha haqiqiy ilmiy maqolalar va to'rtta yetakchi &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; tomonidan yozilgan matnlardagi argumentatsiya tuzilishini solishtirishdi. Sun'iy intellekt qat'iy qoliplarga amal qilishi, odamlar esa erkinroq yondashishi ma'lum bo'ldi. Hatto &lt;a href=\"concepts/create-a-research-space.html\"&gt;CARS&lt;/a&gt; modeliga oid to'g'ridan-to'g'ri ko'rsatmalar ham neyron tarmoqlar javoblarini yanada bir xil qilib qo'yadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SI matnlari tor va bir xil argumentatsiya qoliplariga ega.&lt;/li&gt;\n&lt;li&gt;Ekspertlar SI matnini 90% hollarda tuzilmasi bo'yicha ajratib oladi.&lt;/li&gt;\n&lt;li&gt;CARS ko'rsatmalari SI javoblarini yanada qotib qolgan qiladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"usullar-va-aniqlik\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#usullar-va-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va aniqlik&lt;/span&gt;&lt;/a&gt;Usullar va aniqlik&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Usul&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ma'lumotlar&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Aniqlik&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Cheklov&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Avtomatik CARS klassifikatori&lt;/td&gt;\n&lt;td&gt;76 ta lingvistika maqolasi&lt;/td&gt;\n&lt;td&gt;Inson aniqligining 92%&lt;/td&gt;\n&lt;td&gt;Boshqa sohalarda tekshirilmagan&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ekspertlar ko'r-ko'rona testi&lt;/td&gt;\n&lt;td&gt;Yaratilgan matnlar baholandi&lt;/td&gt;\n&lt;td&gt;90% aniqlash darajasi&lt;/td&gt;\n&lt;td&gt;Ekspert bahosining subyektivligi&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqot CARS (Create-a-Research-Space) modeliga asoslangan bo'lib, u maqola kirish qismini uchta ritorik bosqich orqali tasvirlaydi: hududni belgilash, bo'shliqni aniqlash va shu bo'shliqni egallash. Olimlar 76 ta original maqola va GPT-5.5, Claude Opus 4.8, Gemma-4-31B-it hamda Qwen3.5-27B modellari tomonidan yaratilgan 608 ta analog matnni tahlil qilishdi. Matnni segmentlarga ajratuvchi va ritorik qadamlarni 92% aniqlik bilan belgilovchi avtomatlashtirilgan klassifikator ishlatildi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatadiki, odamlar argumentlarning xilma-xil ketma-ketligidan foydalanadilar. Sun'iy intellekt esa qat'iy unifikatsiyaga moyil bo'lib, unga CARS tuzilishini o'rgatishga urinishlar bu qat'iylikni yanada kuchaytiradi. Ko'r-ko'rona testda ekspertlar 90% hollarda matn muallifligini aynan argumentatsiya tuzilmasining bashorat qilinishi orqali aniqlashdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat 76 ta lingvistika maqolasi bilan cheklangan, bu boshqa fan sohalariga mos kelmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Katta til modellari (LLM) matn yozishda yordam berishdan tadqiqot jarayonida bevosita qatnashishga oʻtmoqda. Bu sunʼiy intellekt (SI) tomonidan yaratilgan ilmiy matnlar inson yozgan matnlardan qanday farq qilishini tushunishni talab qiladi. Oldingi tadqiqotlar asosan leksik va uslubiy belgilarga eʼtibor qaratgan, biroq ularni oddiy qayta ifodalash (paraphrasing) orqali yoʻqotish mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatdiki, SI matnlari inson matnlaridan leksika bilan emas, balki argumentatsiya tuzilmasining qatʼiyligi bilan farq qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar ritorik tuzilmaga, yaʼni matn oʻz dalillarini asoslaydigan argumentativ harakatlar ketma-ketligiga eʼtibor qaratdilar. Nazariy asos sifatida Jon Sueylsning CARS (Create a Research Space) modeli ishlatildi. Tadqiqotchilar lingvistika boʻyicha nashr etilgan ilmiy maqolalarning inson tomonidan yozilgan kirish qismlarini xuddi shu maqolalar uchun LLM tomonidan yaratilgan muqobillari bilan solishtirdilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/model-cars.html\"&gt;CARS modeli&lt;/a&gt; — bu ilmiy maqola kirish qismini qurishning standart sxemasi boʻlib, u tadqiqot sohasini belgilash, boʻshliqni yaratish va shu boʻshliqni egallash kabi bosqichlarni oʻz ichiga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tahlil shuni koʻrsatdiki, inson yozgan matnlar ritorik harakatlarni tanlash va ularning ketma-ketligida koʻproq moslashuvchanlikka ega. Generativ modellar tomonidan yaratilgan matnlar esa bir xil va oldindan aytib boʻladigan darajada ekanligi aniqlandi. Modellarga CARS qoidalarini aniq koʻrsatib berish ularning tuzilmasini yanada qotib qolishiga olib keldi, bu esa ilmiy bayonning tabiiyligini pasaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat lingvistika sohasidagi maqolalarning kirish qismlarini tahlil qilish bilan cheklangan; natijalar boshqa ilmiy yoʻnalishlar uchun farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Katta til modellari (LLM) ilmiy jarayonning barcha bosqichlarida, gipotezalarni shakllantirishdan tortib, butun tadqiqot sikllarini o‘tkazish va maqolalarni yozishgacha bo‘lgan jarayonlarda tobora ko‘proq ishtirok etmoqda. Sunʼiy intellektning ilmiy yozuvdagi roli ortib borayotgan bir paytda, modellar o‘z argumentlarini qanday qurishi va ishni oldingi tadqiqotlar bilan qanday bog‘lashi, shuningdek, ular buni odamlar kabi amalga oshiradimi yoki yo‘qligini tushunish muhimdir. Matnlarni solishtirishning avvalgi usullari leksik statistika, stilistik belgilar va sintaktik naqshlarga tayangan. Biroq, bunday ko‘rsatkichlar model matnni qanday qurishi haqida kam maʼlumot beradi, qolaversa, zamonaviy modellar inson uslubini taqlid qilishda tobora takomillashib bormoqda, oddiy qayta ifodalash esa sirtqi izlarni yo‘q qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot ilmiy matnlarning ritorik tuzilishini tahlil qilishga qaratilgan, chunki sirtqi tahlil usullari zamonaviy LLMlarga qarshi samarasiz bo‘lib qolmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar ritorik tuzilmani — matn ichida izchil kommunikativ funksiyalarni bajaradigan argumentativ harakatlar ketma-ketligini tahlil qilishni taklif qiladilar. Tadqiqot obyekti sifatida ilmiy maqolalarga kirish qismlari (RAI) tanlangan, chunki ular cheklangan joyda zich argumentatsiyani talab qiladi. CARS (Create-A-Research-Space) modeli qo‘llaniladi, u kirish qismini uchta harakat orqali tasvirlaydi: tadqiqot hududini belgilash (Move 1), bilimdagi bo‘shliqni aniqlash (Move 2) va ushbu bo‘shliqni joriy tadqiqot bilan to‘ldirish (Move 3). Har bir harakat kichikroq qadamlardan iborat.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CARS modeli — bu ilmiy kirish qismlari tuzilishini tahlil qilishning standart lingvistik yondashuvi bo‘lib, unda muallif bosqichma-bosqich umumiy kontekstdan aniq tadqiqot vazifasiga o‘tadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot uchta savolni o‘rtaga tashlaydi: sunʼiy intellekt annotatori CARS harakatlari va qadamlarini ishonchli aniqlay oladimi (RQ1); odamlar va sunʼiy intellekt tomonidan yozilgan kirish qismlari o‘z tuzilishiga ko‘ra qanday farq qiladi (RQ2); va CARS modeli bo‘yicha aniq ko‘rsatmalar LLM tomonidan yaratilgan matnlar tuzilishiga qanday taʼsir qiladi (RQ3)? Bunga javob berish uchun mualliflar matnni segmentlarga ajratadigan va ularni klassifikatsiya qiladigan avtomatik annotator yaratdilar. Asbob ikki ekspert tomonidan tasdiqlandi va inson belgilash aniqligining 92 foiziga yetdi. Yaratilgan matnlarni tahlil qilish uchun ekspertlar tomonidan belgilangan 76 ta lingvistik maqola ishlatildi. To‘rtta LLM (ikkita tijorat va ikkita ochiq vaznli) har bir kirish qismining ikkita variantini yozdi: asosiy prompt bilan va CARS taʼriflari qo‘shilgan holda, bu 608 ta yaratilgan matnni berdi. Natijalar shuni ko‘rsatadiki, sunʼiy intellekt matnlari inson matnlariga qaraganda torroq va bir xil harakatlar ketma-ketligiga amal qiladi, o‘quvchilar esa 90 foiz hollarda aynan shu tuzilishga tayanib, inson va sunʼiy intellekt matnlarini farqlay oladilar.&lt;/p&gt;\n&lt;h4 id=\"bogliq-ishlar\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#bogliq-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog‘liq ishlar&lt;/span&gt;&lt;/a&gt;Bog‘liq ishlar&lt;/h4&gt;\n&lt;p&gt;Ikki yo‘nalishdagi ishlar ushbu tadqiqotga aloqador: mashina tomonidan yozilgan ilmiy matnlarni yaratish va aniqlash, hamda ularning ritorik harakat tuzilishini tahlil qilish.&lt;/p&gt;\n&lt;h4 id=\"ilmiy-matnlarda-llm-va-ularni-aniqlash-usullari\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#ilmiy-matnlarda-llm-va-ularni-aniqlash-usullari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ilmiy matnlarda LLM va ularni aniqlash usullari&lt;/span&gt;&lt;/a&gt;Ilmiy matnlarda LLM va ularni aniqlash usullari&lt;/h4&gt;\n&lt;p&gt;Katta til modellari (LLM) bugungi kunda ilmiy matnlarni yaratishda faol ishtirok etmoqda: sarlavhalar asosida annotatsiyalar yozishdan tortib, butun maqolalarni va tajribalarni rejalashtirish hamda hisobot yozishni birlashtirgan avtomatlashtirilgan tizimlargacha. Ilmiy nashrlarda sunʼiy intellekt yordamida yaratilgan yoki tahrirlangan matnlarning ulushi ortib bormoqda. Mashina tomonidan yaratilgan matnlarni aniqlashning mavjud usullari asosan sirtqi belgilarga tayanadi: tokenlarning ehtimolligi, ehtimollik taqsimotining egriligi, dekodlash artefaktlari va raqamli suv belgilari. Biroq, bu signallar zaifdir: odamlarni eng yaxshi aldashga qodir matnlar avtomatik detektorlar uchun eng qiyin hisoblanadi. Yetarlicha kuchli modellardan foydalanilganda, detektorlarning aniqligi tasodifiy taxmin darajasiga yaqinlashadi. Shu sababli, biz matnning ritorik tuzilishini tahlil qilishni taklif qilamiz — bu chuqurroq va barqarorroq belgi boʻlib, biz koʻrsatganimizdek, odamlar kirish qismining muallifligini baholashda aynan shu narsaga tayanadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sirtqi belgilarga asoslangan detektorlarning samaradorligi modellar takomillashishi bilan pasayib bormoqda, bu esa chuqur ritorik tuzilishni tahlil qilishga oʻtishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ritorik-tuzilish-tahlili\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#ritorik-tuzilish-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ritorik tuzilish tahlili&lt;/span&gt;&lt;/a&gt;Ritorik tuzilish tahlili&lt;/h4&gt;\n&lt;p&gt;Janr tahlili ilmiy maqolaning kirish qismini ritorik harakatlar ketma-ketligi sifatida koʻrib chiqadi. J. Sueylsning CARS (Create a Research Space) modeli bu sohada standart hisoblanadi: muallif avval tadqiqot sohasini belgilaydi, soʻngra unda boʻshliqni (nisha) ajratib koʻrsatadi va nihoyat uni toʻldiradi. Bu tuzilmani avtomatik aniqlash uzoq tarixga ega, jumladan, «argumentativ zonalashtirish» usullari va akademik yozishni oʻrgatish uchun amaliy lingvistika doirasida ishlab chiqilgan klassifikatorlar mavjud. Soʻnggi tadqiqotlarda ekspert belgilari jarayonni avtomatlashtirish uchun transformer modellari bilan birlashtirilmoqda. Biz oʻzimizdan oldingi tadqiqotlardan shundaki, biz annotatsiyaga emas, balki kirish qismiga eʼtibor qaratamiz, bitta model oʻrniga bir nechta modelni solishtiramiz va matnlarni keltirilgan adabiyotlar asosida generatsiya qilamiz, bu esa olim ishlaydigan kontekstni modellashtiradi. Ekspert belgilash koʻp vaqt talab qilganligi sababli, biz avtomatik annotator ishlab chiqdik, u butun kirish qismini segmentlarga ajratish va klassifikatsiya qilishni amalga oshiradi hamda ekspert-odamlarning baholari bilan solishtirish orqali validatsiyadan oʻtadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ritorik harakatlar — bu matnning muayyan vazifani bajaruvchi funksional qismlari, masalan, dolzarblikni asoslash yoki ilmiy muammoni shakllantirish.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Tadqiqot LLM tomonidan yozilgan ilmiy kirish qismlarini (RAI) insonlar yozgan asl nusxalar bilan Swales’ning CARS modeliga asoslangan avtomatik annotator yordamida solishtirdi. Maʼlum boʻlishicha, sunʼiy intellekt matnlari insonlarnikiga qaraganda qatʼiyroq tuzilishga ega va tor doiradagi ketma-ketliklarga amal qiladi. CARS taʼriflarini modellarga taqdim etish bu farqni yanada kuchaytiradi. CARS modelidan xabardor oʻquvchi sunʼiy intellekt matnini 90% aniqlik bilan ajrata oladi, ayniqsa model CARS koʻrsatmalari bilan yoʻnaltirilgan boʻlsa. Ritorik tuzilma mashina muallifligining barqaror belgisi boʻlib, u matn qayta yozilsa ham saqlanib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sunʼiy intellekt kirish qismlarining ritorik tuzilishi bashorat qilinadigan va qatʼiy cheklangan boʻlib, bu mashina matnini 90% aniqlik bilan aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"limitations\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#limitations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations&lt;/span&gt;&lt;/a&gt;Limitations&lt;/h4&gt;\n&lt;p&gt;Kirish kontekstining aniqligi. Modellar faqat iqtibos keltirilgan ishlarning bibliografik metamaʼlumotlari va annotatsiyalarini oldi, inson mualliflar esa toʻliq matnlar bilan ishlashdi. Shuningdek, adabiyotlar roʻyxati oldindan belgilangan boʻlib, bu sunʼiy intellektni muallifning toʻliq bilim doirasidan emas, balki tanlangan qismidan foydalanishga majbur qiladi.&lt;/p&gt;\n&lt;p&gt;Korpus koʻlami va fan sohasi. Tadqiqot amaliy tilshunoslik boʻyicha 76 ta maqola bilan cheklangan. Avtomatik annotatordan foydalanish tahlilni kengaytirishga yordam berdi, biroq PDF-dan olingan matnlar qoʻlda sifat nazorati oʻtkazilganiga qaramay, shovqin (xatoliklar) saqlaydi. Kengroq va xilma-xil korpuslarda tadqiqotlar oʻtkazish zarur.&lt;/p&gt;\n&lt;p&gt;CARS modelining umumlashtirilishi. CARS modeli universal emas: qadamlar tuzilishi fanlararo va hatto bir fan ichida ham farq qiladi. Bizning natijalarimiz lingvistik kirish qismlarining kanonik tuzilishini emas, balki inson va sunʼiy intellekt oʻrtasidagi tafovutni koʻrsatadi, bu boshqa sohalarda turlicha namoyon boʻlishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar bitta fan sohasi va chuqur mantiqiy argumentlarni hisobga olmaydigan CARS modeli bilan cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Argumentatsiyani tahlil qilish chuqurligi. CARS modeli matn funksiyalarini belgilaydi, lekin argumentlarning ichki mantiqiy tuzilishini (tezislar, dalillar, asoslar) tahlil qilmaydi. Bu faqat birinchi &lt;a href=\"concepts/step.html\"&gt;qadam&lt;/a&gt;; kelgusi ishlarda mashina yozgan matn sifatini baholash uchun yanada batafsilroq tizimlardan foydalanish mumkin.&lt;/p&gt;\n&lt;p&gt;Annotator va aniqlik chegarasi. LLM asosidagi annotator ikki kishi tomonidan belgilangan 32 ta kirish qismi (har biriga 16 tadan) asosida tekshirilgan. Barcha matnlarning ikki tomonlama belgilanmagani «insoniy aniqlik chegarasi»ni baholashni cheklaydi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"korpus-va-ekspert-belgilari\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#korpus-va-ekspert-belgilari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Korpus va ekspert belgilari&lt;/span&gt;&lt;/a&gt;Korpus va ekspert belgilari&lt;/h4&gt;\n&lt;p&gt;Tadqiqot amaliy tilshunoslik boʻyicha 80 ta ilmiy maqoladan iborat korpusga asoslangan boʻlib, ular toʻrtta kvartil (Q1–Q4) jurnallaridan teng miqdorda tanlab olingan. Materiallarning ochiqligini tekshirish jarayonida toʻrtta maqola pullik kirish (paywall) tufayli chiqarib tashlandi va yakuniy tanlanmada 76 ta ish qoldi. Etalon belgilash (gold labels) sifatida Asadi (2025) qoʻllanmasiga muvofiq tayyorlangan ekspert maʼlumotlari ishlatildi. Annotatsiya sxemasi 4-jadvalda keltirilgan uchta «harakat» (moves) va oʻnta qadamni oʻz ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Harakatlar» (moves) tilshunoslikda matnning muayyan kommunikativ vazifani bajaruvchi funksional bloklari hisoblanadi, masalan, dolzarblikni asoslash yoki bilimdagi boʻshliqni tasvirlash.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kirish-qismlarini-generatsiya-qilish\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#kirish-qismlarini-generatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish qismlarini generatsiya qilish&lt;/span&gt;&lt;/a&gt;Kirish qismlarini generatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Kontekst va dastlabki ishlov berish. Inson va sunʼiy intellekt tomonidan yozilgan matnlarni toʻgʻri taqqoslash uchun mualliflar maqola muallifiga mavjud boʻlgan axborot kontekstini qayta tikladilar: sarlavha, ish mazmuni va barcha iqtibos keltirilgan manbalarning metamaʼlumotlari (shu jumladan annotatsiyalar). PDF-fayllardan ushbu maʼlumotlarni ajratib olish uchun matnga aylantirish va qoʻlda tuzatishni oʻz ichiga olgan dastlabki ishlov berish konveyeri qoʻllanildi. Matn hajmining natijaga taʼsirini istisno qilish uchun generatsiya qilinadigan kirish qismlarining uzunligi original matnlar hajmi bilan cheklandi.&lt;/p&gt;\n&lt;p&gt;Modellar. Eksperimentda toʻrtta tizim ishlatildi: tijorat GPT-5.5 va ClaudeOpus4.8, shuningdek, ochiq vaznli Gemma-4-31B-it va Qwen3.5-27B modellari. Mahalliy modellardan foydalanish nashr etilmagan gʻoyalarni uchinchi tomon API'lari orqali uzatishdan qochishga intilayotgan tadqiqotchilar uchun muhimdir. Matnda modellar ChatGPT, Claude, Gemma va Qwen deb ataladi.&lt;/p&gt;\n&lt;p&gt;Generatsiya sozlamalari. RQ3 tadqiqot savoliga javob berish uchun har bir model kirish qismlarini ikkita rejimda yaratdi. Asosiy rejimda modelga qoʻshimcha koʻrsatmalarsiz kirish qismini yozish boʻyicha toʻgʻridan-toʻgʻri topshiriq berildi. «CARS-guided» rejimida prompt Suaylz boʻyicha harakatlar va qadamlar taʼriflarini, shuningdek, avval harakatlar ketma-ketligining ichki rejasini tuzish va keyin uni matnda amalga oshirish talabini oʻz ichiga oldi. Jami 608 ta kirish qismi varianti generatsiya qilindi (4 model × 2 rejim × 76 maqola).&lt;/p&gt;\n&lt;h4 id=\"cars-annotatsiyasi\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#cars-annotatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CARS annotatsiyasi&lt;/span&gt;&lt;/a&gt;CARS annotatsiyasi&lt;/h4&gt;\n&lt;p&gt;Insonlar va sunʼiy intellekt tomonidan yozilgan kirish qismlarining ritorik tuzilishini solishtirish uchun CARS modelidan foydalanildi. Qoʻlda belgilash hajmi katta boʻlgani sababli, mualliflar LLM asosida avtomatik annotator yaratdilar. Tizim kirish qismini segmentlarga ajratadi va har biriga oʻnta qadamdan birini belgilaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CARS (Create a Research Space) — ilmiy maqolalar kirish qismini tahlil qilish uchun ishlatiladigan lingvistik model boʻlib, u tadqiqotning dolzarbligini asoslovchi «yurishlar» (moves) va «qadamlar» (steps)ni ajratib koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Segmentatsiya va klassifikatsiya. Mualliflar turli yondashuvlarni sinab koʻrdilar: chegaralar boʻyicha ajratish va har bir gapni alohida klassifikatsiya qilish. Birinchi usul yetarli darajada segmentlamadi (oʻrtacha 6,6 ga nisbatan 9,6), ikkinchisi esa haddan tashqari koʻp segmentladi (10,5 ga nisbatan 9,2). Birgalikda segmentlash va klassifikatsiya qilish chegaralarni aniqlash aniqligini oshirdi (F1 0,50 dan 0,71 gacha), shuning uchun modelga butun matnni berib, ketma-ketlikda belgilash strategiyasi tanlandi.&lt;/p&gt;\n&lt;p&gt;Prompting strategiyasi. Prompt annotatsiya qoʻllanmasi va uchta turli darajadagi (3, 9 va 18 segment) misollarni oʻz ichiga oladi. «Chain-of-thought» usuli qoʻllanildi: model avval «yurish»ni, keyin «qadam»ni aniqlaydi va qarorini bir gap bilan asoslaydi. ChatGPT, Claude va Gemini 3.1 Pro solishtirilganda, ChatGPT eng yuqori aniqlikni (0,773) koʻrsatdi.&lt;/p&gt;\n&lt;p&gt;Annotatorni validatsiya qilish. AI natijalari 32 ta kirish qismi boʻyicha ikki mutaxassis-inson natijalari bilan solishtirildi. Segment chegaralari uchun F1, WindowDiff, Pk va klassifikatsiya uchun F1 metrikalari ishlatildi.&lt;/p&gt;\n&lt;h4 id=\"annotator-samaradorligi\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#annotator-samaradorligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotator samaradorligi&lt;/span&gt;&lt;/a&gt;Annotator samaradorligi&lt;/h4&gt;\n&lt;p&gt;Avtomatik annotator inson aniqligining 92% ga yetdi (F1 0,694 ga nisbatan 0,752). Strukturaviy tahlilda AI koʻrsatkichlari insonnikiga deyarli tenglashdi: «yurish» aniqligi 0,901 ga nisbatan 0,911, segment chegaralari F1 esa 0,725 ga nisbatan 0,756 ni tashkil etdi. Model xatolari asosan mutaxassislar fikri turlicha boʻlgan joylarga toʻgʻri kelgani uchun, inson va AI matnlarini solishtirishda subyektivlikni yoʻqotish maqsadida ushbu vosita barcha tahlillar uchun yagona annotator sifatida qabul qilindi.&lt;/p&gt;\n&lt;h4 id=\"umumiy-taqsimot-va-tartib\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#umumiy-taqsimot-va-tartib\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy taqsimot va tartib&lt;/span&gt;&lt;/a&gt;Umumiy taqsimot va tartib&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar generatsiya qilingan kirish qismlari asl ilmiy maqolalarga xos boʻlgan «yurishlar» (move) va «qadamlar» (step) taqsimotini qanchalik takrorlashini, shuningdek, ular ushbu elementlarni qanday tartiblashini tahlil qildilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Yurishlar» va «qadamlar» — bu ilmiy maqola tuzilishining lingvistik tushunchalari: «yurish» yirik ritorik maqsadni (masalan, dolzarblikni asoslash), «qadam» esa unga erishishning aniq usulini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yurishlar va qadamlar taqsimoti. 1-jadvalda segmentlarning uchta asosiy yurish va oʻnta qadam boʻyicha taqsimoti keltirilgan. Asl matnlarda inson mualliflar segmentlarni quyidagicha taqsimlaydilar: 59,5% — hududni yaratish (Move 1), 16,0% — nishani yaratish (Move 2) va 24,5% — nishani egallash (Move 3). Generatsiya qilingan modellar balansning Move 1 dan Move 2 ga siljishini koʻrsatadi. Move 1 ulushi sakkizta maʼlumotlar toʻplamining beshtasida inson koʻrsatkichidan pastga tushib, 46,8% gacha yetadi. Qadamlar darajasida insonlar uchun taqsimot kuchli siljigan: oldingi tadqiqotlarni koʻrib chiqish (26,5%), markaziylikni daʼvo qilish (18,5%), mavzuni umumlashtirish (14,5%) va maqsadni belgilash (13,0%) barcha segmentlarning deyarli toʻrtdan uch qismini tashkil qiladi. Modellar xuddi shunday tartibni saqlaydi, bunda adabiyotlar sharhi eng tez-tez uchraydigan qadam boʻlib qoladi. Toʻrtta model uchun yoʻnaltiruvchi koʻrsatmalarni (CARS-guided) qoʻllash Move 1 ulushining kamayishiga va Move 2 hamda Move 3 ulushining oshishiga olib keladi, bu esa uchta holatda taqsimotni inson etalonidan yanada uzoqlashtiradi.&lt;/p&gt;\n&lt;h4 id=\"qadamlarni-tartiblash-va-tanlash\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#qadamlarni-tartiblash-va-tanlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qadamlarni tartiblash va tanlash&lt;/span&gt;&lt;/a&gt;Qadamlarni tartiblash va tanlash&lt;/h4&gt;\n&lt;p&gt;2-jadval kirish qismlarida qadamlar qanday tartiblanishini koʻrsatadi. Qadamlar ketma-ketligi juda xilma-xil boʻlgani uchun mualliflar 76 ta asl matnni sakkizta generatsiya qilingan toʻplam (toʻrtta model, ikkita prompt versiyasi) bilan solishtiradilar. Maʼlumotlar shuni koʻrsatadiki, modellar asl maqolalarga nisbatan Move 2 dan ortiqcha foydalanishga moyildir.&lt;/p&gt;\n&lt;h4 id=\"move-3-nishani-egallash\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#move-3-nishani-egallash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Move 3: Nishani egallash&lt;/span&gt;&lt;/a&gt;Move 3: Nishani egallash&lt;/h4&gt;\n&lt;p&gt;Kirish qismlarining tuzilishini tahlil qilish shuni koʻrsatdiki, mualliflar va neyrotarmoqlar umumiy afzalliklarga ega, ammo moslashuvchanlikda farqlanadi. Eng keng tarqalgan boshlangʻich qadam — mavzuning markaziyligini taʼkidlashdir. Shu bilan birga, 11-qadam (qarshi argumentatsiya) ham inson matnlarida, ham generatsiya qilingan matnlarda deyarli uchramaydi (faqat 4 ta segmentda), shuning uchun u tahlildan chiqarib tashlandi. Toʻgʻridan-toʻgʻri tanqid oʻrniga mualliflar bilimdagi boʻshliqni koʻrsatishni afzal koʻrishadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qadam (step) — bu CARS (Create a Research Space) modeliga koʻra, kirish qismining funksional elementi, masalan, «tadqiqotning ahamiyatini asoslash» yoki «tadqiqotdagi boʻshliqni koʻrsatish».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Inson matnlari koʻproq xilma-xillikni namoyon etadi: mualliflar 46% hollarda markaziylikni taʼkidlash bilan boshlaydilar, 32% hollarda esa darhol adabiyotlar sharhi bilan. Neyrotarmoqlar markaziylikni 58–84% hollarda tanlaydilar. Insonlar yozgan kirish qismlari butun boʻlimlarni oʻtkazib yuborishi mumkin (28% hollarda), neyrotarmoqlar esa barcha uchta asosiy harakatni (Move 1, 2, 3) qamrab olishga intiladi va 6,1–7,4 ta qadamdan foydalanadi, insonlar esa oʻrtacha 5,3 ta qadamdan.&lt;/p&gt;\n&lt;p&gt;Tsikliklik (oʻtilgan boʻlimga qaytish) inson matnlarining 66% da kuzatiladi (har bir matnga oʻrtacha 2,4 ta qaytish). ChatGPT, Claude va Gemma modellari oʻxshash koʻrsatkichlarni (67–74%) koʻrsatadi, Qwen esa yuqori tsikliklikni (87–95%) namoyon etadi. Koʻrsatmalardan (CARS-guidance) foydalanish modellarning tuzilishini yanada bir xil qiladi, tsikliklikni inson darajasidan pastga tushiradi va foydalaniladigan qadamlar sonini oshiradi.&lt;/p&gt;\n&lt;h4 id=\"harakatlar-tuzilishini-grafik-tahlil-qilish\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#harakatlar-tuzilishini-grafik-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Harakatlar tuzilishini grafik tahlil qilish&lt;/span&gt;&lt;/a&gt;Harakatlar tuzilishini grafik tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Strukturaviy oʻxshashlikni baholash uchun har bir kirish qismi zanjirli graf sifatida taqdim etildi, bunda tugunlar — CARS klasslari. Taqqoslash tahririy oʻxshashlik (edit similarity) va «qoplar» oʻxshashligi (bag similarity) koʻrsatkichlari orqali amalga oshirildi.&lt;/p&gt;\n&lt;h4 id=\"modellarning-asl-nusxalarga-oxshashligi\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#modellarning-asl-nusxalarga-oxshashligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modellarning asl nusxalarga oʻxshashligi&lt;/span&gt;&lt;/a&gt;Modellarning asl nusxalarga oʻxshashligi&lt;/h4&gt;\n&lt;p&gt;Oʻz-oʻziga oʻxshashlik tahlili (3-jadval) shuni koʻrsatdiki, asl matnlar eng xilma-xildir: ularning oʻz-oʻziga oʻxshashlik koʻrsatkichi 0,33 ni tashkil etadi, modellarda esa bu koʻrsatkich 0,37 dan 0,46 gacha oʻzgaradi. Asl nusxalar 36 xil kirish tuzilishini amalga oshiradi, modellar esa 8 tadan 35 tagacha. CARS koʻrsatmalaridan foydalanish modellarning xilma-xilligini kamaytiradi, ularning matnlarini yanada bashorat qilinadigan va bir-biriga oʻxshash qiladi.&lt;/p&gt;\n&lt;h4 id=\"juftlashtirilgan-kirish-qismlarini-yaqindan-organish\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#juftlashtirilgan-kirish-qismlarini-yaqindan-organish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Juftlashtirilgan kirish qismlarini yaqindan oʻrganish&lt;/span&gt;&lt;/a&gt;Juftlashtirilgan kirish qismlarini yaqindan oʻrganish&lt;/h4&gt;\n&lt;p&gt;Generatsiya qilingan matnlar va mualliflik matnlari oʻrtasidagi sifat farqini tushunish uchun CARS (Create a Research Space) modeli boʻyicha ekspert beshta ilmiy maqolani «yaqindan oʻqish» (close reading) usuli bilan tahlil qildi. Har bir maqola uchlik sifatida koʻrib chiqildi: original, Claude (bazaviy) versiyasi va CARS asosidagi promp yordamida yaratilgan versiya. Barcha matnlar funksional qadamlar (moves) boʻyicha belgilab chiqildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Yaqindan oʻqish» usuli faqat miqdoriy koʻrsatkichlar bilan aniqlab boʻlmaydigan matn tuzilmasidagi nozik jihatlarni aniqlash uchun chuqur sifat tahlilini nazarda tutadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"topilmalar\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#topilmalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Topilmalar&lt;/span&gt;&lt;/a&gt;Topilmalar&lt;/h4&gt;\n&lt;p&gt;Generatsiya qilingan kirish qismlari qatʼiyroq tuzilmaga ega. Birinchidan, bu toʻliqlikka tegishli: barcha 10 ta generatsiya qilingan matn CARS modelining uchta qadamini ham oʻz ichiga oladi, inson mualliflar esa baʼzida ikkinchi qadamni (nishani belgilash) tushirib qoldiradilar. Ikkinchidan, bu tartibga tegishli: modellar «1–2–3-qadam» kanonik ketma-ketligiga qatʼiy amal qiladi. Modellarda qadamlar oʻrtasidagi qaytishlarning 89% holatida 2-qadamdan 1-qadamga oʻtish kuzatiladi, inson mualliflarida esa bu koʻrsatkich 57% ni tashkil etadi. 608 ta generatsiya qilingan kirish qismlarining hech biri 3-qadam bilan boshlanmaydi, insonlar esa ish maqsadidan yoki adabiyotlar sharhidan boshlashlari mumkin.&lt;/p&gt;\n&lt;p&gt;CARS modelidan xabardor mualliflar yanada «kanonik» kirish qismlarini yozmaydilar. Sways modeliga havola qilgan mualliflarning toʻrtta maqolasi tahlili shuni koʻrsatdiki, ularda yagona tuzilma mavjud emas. Kirish qismiga nazariy bazani bilish emas, balki jurnal kvartili taʼsir qiladi.&lt;/p&gt;\n&lt;h4 id=\"oquvchi-original-va-generatsiya-qilingan-matnni-qanday-farqlaydi\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#oquvchi-original-va-generatsiya-qilingan-matnni-qanday-farqlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oʻquvchi original va generatsiya qilingan matnni qanday farqlaydi?&lt;/span&gt;&lt;/a&gt;Oʻquvchi original va generatsiya qilingan matnni qanday farqlaydi?&lt;/h4&gt;\n&lt;p&gt;Loyiha ishtirokchisi boʻlmagan tadqiqotchi koʻr-koʻrona test oʻtkazdi: u CARS tamoyillariga tayangan holda 60 ta original va 60 ta generatsiya qilingan kirish qismlarini tasniflashi kerak edi. Oʻquvchi 120 ta matndan 108 tasini (90%) toʻgʻri aniqladi. 120 ta holatdan 118 tasida mezon yozuv uslubi emas, aynan argumentatsiya tuzilmasi boʻldi. Oʻquvchi qadamlar ketma-ketligini va ularning oʻzaro bogʻliqligini tahlil qildi.&lt;/p&gt;\n&lt;h4 id=\"cars-promp-yordamida-yozilgan-kirish-qismlarini-aniqlash-osonroq\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#cars-promp-yordamida-yozilgan-kirish-qismlarini-aniqlash-osonroq\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CARS-promp yordamida yozilgan kirish qismlarini aniqlash osonroq&lt;/span&gt;&lt;/a&gt;CARS-promp yordamida yozilgan kirish qismlarini aniqlash osonroq&lt;/h4&gt;\n&lt;p&gt;Generatsiya qilingan 60 ta matnning yarmi bazaviy, yarmi esa CARS-yoʻnaltirilgan promp yordamida yaratilgan. Oʻquvchi CARS-promp yordamida yaratilgan barcha 30 ta matnni va bazaviy prompdagi 24 tasini xatosiz aniqladi. Bu shuni tasdiqlaydiki, modelni CARS orqali «yoʻnaltirish» urinishi tuzilmani bir xil va qatʼiy qilib qoʻyadi, bu esa mashina matnini aniqlashni osonlashtiradi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f2.jpg\" alt=\"2-rasm: Bizning tizimimiz sharhi. 76 ta maqoladan iborat korpusning har biridan biz mazmunni va asl kirish qismida kelti\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Bizning tizimimiz sharhi. 76 ta maqoladan iborat korpusning har biridan biz mazmunni va asl kirish qismida keltirilgan ishlarni ajratib olamiz.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Bizning tizimimiz sharhi. 76 ta maqoladan iborat korpusning har biridan biz mazmunni va asl kirish qismida keltirilgan ishlarni ajratib olamiz. Toʻrtta LLM har bir maqola uchun kirish qismini asosiy soʻrov va CARS yordamida boshqariladigan soʻrov asosida yozadi, natijada 608 ta generatsiya qilingan kirish qismi hosil boʻladi. Keyin avtomatik annotator barcha asl va generatsiya qilingan kirish qismlarini CARS harakatlari va bosqichlari bilan belgilaydi. Ushbu belgilar asl va generatsiya qilingan kirish qismlarini solishtirish hamda qoʻlda tahlil qilish uchun ishlatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f3.jpg\" alt=\"3-rasm: Inson tomonidan aniqlash tadqiqotida (§5.2) foydalanilgan annotatsiya interfeysi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Inson tomonidan aniqlash tadqiqotida (§5.2) foydalanilgan annotatsiya interfeysi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Inson tomonidan aniqlash tadqiqotida (§5.2) foydalanilgan annotatsiya interfeysi. Bitta kirish qismi koʻrsatilgan, unda avtomatik CARS harakatlari belgilari (belgilangan holatda) rangli ajratmalar koʻrinishida, kelib chiqishi haqidagi besh balli savol va qaror asoslari boʻyicha majburiy savol ustida joylashgan. Yuqoridagi ranglar kaliti faqat ekrandagi matnda mavjud boʻlgan harakatlarni oʻz ichiga oladi. Baholovchi aylantirish orqali butun kirish qismini koʻradi; bu yerda matn ekran pastki qismida qirqilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SI va inson&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tuzilmasi&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;farqi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CARS modeli&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bo'yicha 608&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;matn tahlili&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" r
