            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"192\" cy=\"150\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"508\" cy=\"230\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SYNTHETIC   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Mashina sudyasi:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;neyrotarmoqlar nega eng&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yaxshi emas, balki birinchi&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kelgan tasvirni tanlaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f1.jpg\" alt=\"1-rasm: Bir xil soʻrov, bir xil tasvirlar, uchta tartib.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Bir xil soʻrov, bir xil tasvirlar, uchta tartib.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Bir xil soʻrov, bir xil tasvirlar, uchta tartib. Har bir qatorda uchta nomzod bitta taqdimot tartibida va odamlar tomonidan soʻrovga moslik boʻyicha oʻrtacha baholar koʻrsatilgan. Qwen3-VL-4B har safar A pozitsiyasidagi tasvirni tanlaydi (ramka bilan belgilangan), shuning uchun uning tanlangan tasviri faqat tartibga qarab 0,00, 0,50 yoki 0,83 ball oladi. Tasvirlar: CulturalFrames (Nayak va boshq. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Tadqiqot shuni ko'rsatadiki, tasvir tanlashda &lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt; (ko'rish-til modellari) ko'pincha tasvirlarning sifatiga emas, balki ularning joylashuv tartibiga tayanadi. Hatto 4 milliard parametrli modellar ham nomzodlar tartibi o'zgartirilganda tasodifiy tanlovdan yutqazishi mumkin. Mualliflar bunday «sudya» modellarni nomzodlar tartibini o'zgartirish orqali tekshirishni taklif qilishadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;4B parametrli modellar 49% hollarda birinchi tasvirni tanlaydi, bu tasodifiy 28% ko'rsatkichdan yuqori.&lt;/li&gt;\n&lt;li&gt;Nomzodlar tartibining o'zgarishi 60% hollarda model tanloviga ta'sir qiladi.&lt;/li&gt;\n&lt;li&gt;Muvofiqlik filtrlari kuchsiz modellarga yordam beradi, lekin kuchli modellarning aniqligini kamaytirishi mumkin.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"usullar-va-aniqlik\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#usullar-va-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va aniqlik&lt;/span&gt;&lt;/a&gt;Usullar va aniqlik&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Usul&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ma'lumotlar&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Aniqlik&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Cheklov&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;VLM-sudya (4B parametr)&lt;/td&gt;\n&lt;td&gt;300 ta madaniy prompt&lt;/td&gt;\n&lt;td&gt;49% hollarda birinchi slot tanlanadi&lt;/td&gt;\n&lt;td&gt;Kuchli pozitsion tarafkashlik&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;VLM-sudya (8B parametr)&lt;/td&gt;\n&lt;td&gt;300 ta madaniy prompt&lt;/td&gt;\n&lt;td&gt;Minimal pozitsion tarafkashlik&lt;/td&gt;\n&lt;td&gt;Muvofiqlik filtrlari yaxshi qarorlarni ham o'chiradi&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Ishda VLM modellarining (masalan, Qwen3-VL-4B) taklif qilingan hovuzdan eng yaxshi tasvirni tanlovchi «sudya» sifatidagi qobiliyati tahlil qilindi. Tadqiqotchilar CulturalFrames ma'lumotlar to'plamidan 300 ta madaniy yo'naltirilgan promptlardan foydalanishdi, bunda har bir so'rov uchun 3 tadan 4 tagacha yaratilgan tasvir mavjud edi. Har bir model qarori modelning o'ziga noma'lum bo'lgan insoniy baholar bilan solishtirildi. Asosiy metrika «tanlovdagi afsuslanish» (selection &lt;a href=\"concepts/regret.html\"&gt;regret&lt;/a&gt;) bo'ldi — bu eng yaxshi tasvir reytingi va model tanlagan tasvir o'rtasidagi farqdir.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatdiki, 4B model 49% hollarda birinchi tasvirni tanlaydi va nomzodlar tartibi o'zgarganda 60% hollarda tanlov ham o'zgaradi. Nomzodlar tartibi o'zgarganda qarorlarning muvofiqligi (agreement gate) faqat kuchsiz modellar uchun foydali bo'lib chiqdi: agar model turli pozitsiyalarda bir xil tasvirni tanlasa, bu natija sifatini oshiradi. Biroq, kuchliroq 8B modellar uchun bunday filtr ko'pincha muvaffaqiyatli variantlarni ham olib tashlaydi, bu esa har bir arxitektura uchun individual audit zarurligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 300 ta prompt bilan cheklangan va ko'rsatmalarning qaror qabul qilish jarayoniga ta'sirini hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Vizual-til modellari (VLM) tobora koʻproq generatsiya qilingan tasvirlar orasidan eng yaxshisini tanlovchi «hakam» vazifasini bajarmoqda. Odatda ularning sifati insonlar bahosi bilan mos kelishiga qarab belgilanadi, ammo bu modelning yakuniy tanlovga taʼsirini hisobga olmaydi. Ushbu tadqiqotda mualliflar VLM modellarini toʻlaqonli qaror qabul qiluvchi subyektlar sifatida tahlil qildilar. Buning uchun 300 ta madaniy jihatdan oʻziga xos soʻrovlardan foydalanildi va model tanlovi insonlarning mustaqil baholari hamda tasodifiy tanlov bilan solishtirildi. Qarorlarning barqarorligini tekshirish uchun har bir soʻrov nomzodlar tartibini oʻzgartirgan holda qayta bajarildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VLM (Vision-Language Models) — tasvir va matnni bir vaqtning oʻzida tahlil qila oladigan neyron tarmoqlar boʻlib, ular vizual kontentni matnli tavsif asosida baholay oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar shuni koʻrsatdiki, 4 milliard parametrli (4B) model tasodifiy tanlovdan zoʻrgʻa ustun keladi va CLIP bazaviy koʻrsatkichidan pastroq natija beradi. Model 49% hollarda roʻyxatdagi birinchi tasvirni tanlagan (tasodifiy tanlov ehtimoli 28%), nomzodlar tartibini oʻzgartirish esa 60% hollarda qarorning oʻzgarishiga olib keldi. Ushbu model uchun tartib oʻzgarganda qarorlarning oʻzgarmasligi sifatli natija belgisi boʻlib xizmat qildi. Biroq, ikkinchi, kuchsizroq hakam bilan «kelishuv» orqali &lt;a href=\"concepts/filtratsiya.html\"&gt;filtrlash&lt;/a&gt; notoʻgʻri qarorlarning saqlanib qolishiga olib keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4B modeli pozitsiyaga kuchli moyillik (49% hollarda birinchi variantni tanlash) va nomzodlar tartibi oʻzgarganda yuqori beqarorlik (60% qaror oʻzgarishi) koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;8 milliard parametrli (8B) model deyarli pozitsion moyillik koʻrsatmadi va CLIP'dan yaxshiroq natija berdi. Shunga qaramay, u uchun «kelishuv» tamoyili boʻyicha filtrlash samarasiz boʻlib chiqdi va hatto sifatli qarorlarni ham rad etdi. Mualliflarning taʼkidlashicha, kelishuv faqat modelning aniq xato turiga qaratilganda yordam beradi, shuning uchun filtrlash usullari hakam versiyasi har safar oʻzgarganda qayta koʻrib chiqilishi kerak. Shuningdek, 4B modelidagi stereotipik baholarning biroz oshishi tartiblar boʻyicha agregatsiyadan soʻng yoki kattaroq modeldan foydalanilganda yoʻqolishi aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 300 ta madaniy soʻrov bilan cheklangan; 4B va 8B modellari natijalarini qoʻshimcha tekshiruvsiz barcha VLM arxitekturalariga tatbiq etib boʻlmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Bir nechta generatsiya qilingan tasvirlardan birini tanlaydigan ko‘rish-til modellari (VLM) shunchaki sifat ballini hisoblamaydi. Ularning tanlovi foydalanuvchi qaysi kontentni ko‘rishini belgilaydi. Amaliy savol shundan iboratki, bu tanlov mavjud natijalarni yaxshilaydimi yoki yo‘q, shunchaki model bahosi inson reytinglari bilan bog‘liqmi yoki yo‘q. Madaniy jihatdan bog‘liq so‘rovlar uchun vizual jozibadorlik yoki tanish belgilar foydalanuvchi qoniqishining yomon ko‘rsatkichi bo‘lishi mumkin. Tasvir so‘ralgan obektni o‘z ichiga olishi, lekin uning atrofidagi ijtimoiy kontekstni noto‘g‘ri ko‘rsatishi mumkin. Tanlovchi model (selector) boshqa nomzod so‘rovga mosroq bo‘lsa ham, o‘sha tasvirni tanlashi mumkin. Bu tanlovni baholash uchun modelning o‘zidan kelmagan reytinglar talab qilinadi. Biz CulturalFrames ochiq ma’lumotlar to‘plamidan foydalanamiz, u generatsiya qilingan tasvirlar va insonlarning baholarini o‘z ichiga oladi, bunda aniq va yashirin kutishlar hamda stereotiplar hisobga olinadi. Bizning tadqiqotimizda ochiq vaznli VLM 3-4 ta tasvirdan birini tanlaydi (3-rasm), bunda generator nomlari yoki reytinglar ko‘rsatilmaydi. Biz model tanlovini tasodifiy tanlov va bir xil to‘plamdagi eng yaxshi nomzod bilan solishtiramiz, bu esa tanlov jarayonining ta’sirini generatsiya jarayonidan ajratib olish imkonini beradi. Asosiy ko‘rsatkich — «tanlovdagi afsuslanish» (selection regret) bo‘lib, u so‘rovga moslik bo‘yicha o‘rtacha inson reytingidagi farq bilan o‘lchanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot «tanlovdagi afsuslanish»ni o‘lchaydi — bu model tanlagan tasvir sifati va to‘plamdagi eng yaxshi variant o‘rtasidagi farqdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"related-work\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#related-work\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Related Work&lt;/span&gt;&lt;/a&gt;Related Work&lt;/h4&gt;\n&lt;p&gt;Madaniy vakillik bo‘yicha mavjud yondashuvlar, masalan, CulturalFrames, avtomatik metrikalarni alohida tasvirlar uchun inson baholari bilan solishtirishga qaratilgan. Biz esa nomzodlar to‘plami ichidagi tanlov jarayonini tahlil qilamiz. Boshqa ishlar imtiyozlar asosida mukofot modellarini o‘qitishni o‘rganadi, ammo biz yangi mukofot modelini taklif qilmaymiz, balki mavjud «muzlatilgan» tanlovchilarni audit qilamiz. VLM baholash sohasida ko‘rsatilishicha, multimodal hakamlar vizual dalillarni e’tiborsiz qoldirib, informativ javoblarga ustunlik berishi yoki variantlarning taqdim etilish tartibiga nisbatan tarafkashlik (&lt;a href=\"concepts/position-bias.html\"&gt;position bias&lt;/a&gt;) ko‘rsatishi mumkin. Shunga o‘xshash effektlar ko‘rsatmalar qayta shakllantirilganda yoki model tasvirning matnga mosligini baholaganda kuzatiladi. Biz bu hodisalarni model chiqishi harakat (tasvirni tanlash) bo‘lgan stsenariyda o‘rganamiz va bu tanlovning modellar kelishuvi asosida qaror qabul qilishdan voz kechish mexanizmlari bilan o‘zaro ta’sirini tekshiramiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Position bias (o‘rin tarafkashligi) — modelning mazmuniga qarab emas, balki ro‘yxatdagi tartib raqamiga qarab variantga ustunlik berish moyilligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu tajribadagi tanlovchi modellar «muzlatilgan» (o‘qitish jarayonida o‘zgarmaydi), bu ularning tarafkashligini qayta aloqa orqali tuzatish imkoniyatini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"muammo-va-olchovlar\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#muammo-va-olchovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muammo va oʻlchovlar&lt;/span&gt;&lt;/a&gt;Muammo va oʻlchovlar&lt;/h4&gt;\n&lt;p&gt;Tanlash vazifasi quyidagicha: p prompti uchun m_p (3 yoki 4) ta oldindan generatsiya qilingan tasvirlar toʻplami mavjud. Tanlash siyosati π prompt va tasvirlarni qabul qilib, indeksni qaytaradi yoki tanlashdan tiyiladi. Har bir nomzodning foydaliligi h_p bir nechta annotatorlarning baholari (0, 0.5 yoki 1) oʻrtacha qiymati sifatida aniqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Asosiy koʻrsatkich — «afsuslanish» (regret), yaʼni eng yuqori baholangan nomzod va tanlangan tasvir oʻrtasidagi farq; nol qiymat eng yaxshi tasvir tanlanganini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Samaradorlikni baholash uchun uchta metrika qoʻllanadi: afsuslanish &lt;span class=\"yfm-latex\" data-content=\"R_p(%5Cpi)%20%3D%20h%5E%5Cstar_p%20-%20h_%7Bp%2C%5Cpi(p)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, tasodifiy tanlovga nisbatan yutuq &lt;span class=\"yfm-latex\" data-content=\"G_p(%5Cpi)%20%3D%20h_%7Bp%2C%5Cpi(p)%7D%20-%20%5Cbar%7Bh%7D_p\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va oʻrtachadan past tasvirni tanlash ehtimoli (BMR). Tasodifiy tanlov bazaviy chiziq vazifasini bajaradi. Shuningdek, madaniy xatolar (stereotiplar, kutishlarning yoʻqligi) kuzatiladi, bunda manfiy qiymatlar tasodifiy tanlovga nisbatan kamroq xatolarni bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/pozitsionnoe-smeschenie.html\"&gt;Pozitsion siljish&lt;/a&gt; — bu tasvir mazmunidan qatʼi nazar, maʼlum slotlarga (masalan, A, B, C) ustunlik berishdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barqarorlikni tekshirish uchun K=3 ta siklik koʻrsatish tartibi ishlatiladi. «Darvozalar» (gates) qarorlarni filtrlaydi: masalan, τ=2/3 chegarasida faqat uchta tartibdan ikkitasida tanlangan variant qabul qilinadi. Biz qamrovni (qayta ishlangan promptlar ulushi) baholaymiz va natijalarni «filtrlanmagan» hakam bilan solishtiramiz.&lt;/p&gt;\n&lt;h4 id=\"malumotlar-toplami-va-ajratish\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#malumotlar-toplami-va-ajratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maʼlumotlar toʻplami va ajratish&lt;/span&gt;&lt;/a&gt;Maʼlumotlar toʻplami va ajratish&lt;/h4&gt;\n&lt;p&gt;Ish CulturalFrames maʼlumotlar toʻplamiga asoslangan boʻlib, u 3637 ta tasvir qatori va 10 412 ta individual bahoni oʻz ichiga oladi. Filtrlashdan soʻng (annotatsiyasiz yozuvlar va dublikatlarni olib tashlash) 961 ta noyob prompt qoldi: 313 ta uchta tasvirli va 648 ta toʻrtta tasvirli toʻplam.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tanlamalarga ajratish (split) prompt identifikatorlarini deterministik heshlashga asoslangan boʻlib, bu annotator baholaridan maʼlumotlar sizib chiqishini istisno qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Asosiy tahlil uchun 300 ta promptdan iborat tanlama (10 ta mamlakatning har biri uchun 30 tadan) shakllantirildi, bu real taqsimotni takrorlamaydigan muvozanatli baholashni taʼminlaydi. Oʻtkazib yuborilgan annotatsiyalar toʻldirilmadi.&lt;/p&gt;\n&lt;h4 id=\"ochiq-vaznli-hakamlar\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#ochiq-vaznli-hakamlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ochiq vaznli hakamlar&lt;/span&gt;&lt;/a&gt;Ochiq vaznli hakamlar&lt;/h4&gt;\n&lt;p&gt;Asosiy hakam sifatida Qwen3-VL-4B-Instruct, ikkilamchi hakam sifatida esa SmolVLM2-2.2B-Instruct modellari tanlangan. Takrorlanuvchanlikni taʼminlash uchun model reviziyalari, bogʻliqlik versiyalari va &lt;a href=\"concepts/inferens.html\"&gt;inferens&lt;/a&gt; sozlamalari saqlanadi. Hisob-kitoblar mahalliy darajada, ochkoʻz dekodlash (greedy decoding), 64 tokenlik chiqish chegarasi va tushuntirishlarsiz amalga oshiriladi. Qwen tasvirlari 448 piksel doirasida proporsiyani saqlagan holda moslashtiriladi, Smol esa xotirani tejash uchun 384 piksel oʻlchamda ishlaydi. Vizual tokenlar byudjetidagi farqlar tufayli, hakamlar oʻrtasidagi natijalarni faqat model qobiliyati bilan izohlab boʻlmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ikki xil modeldan foydalanish va ularning tasvirni qayta ishlash parametrlaridagi farqlar natijalarni toʻgʻridan-toʻgʻri solishtirish imkoniyatini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Soʻrov tasvir va nomzodlar yorliqlarini oʻz ichiga oladi. Koʻrsatma promptga moslik, kontekstual izchillik, stereotiplardan qochish va vizual yaxlitlikni baholashni talab qiladi. Modellarga madaniy belgilarni faqat ularning soni yoki tanilishi uchun yuqori baholash taqiqlanadi. Qwen tanlov va reytingni oʻz ichiga olgan JSON formatida javob beradi, Smol esa faqat tanlovni qaytaradi. JSON validligi va qarorlarning aniqligi alohida kuzatiladi.&lt;/p&gt;\n&lt;h4 id=\"nomzodlar-tartibi-va-yaroqsiz-natijalar\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#nomzodlar-tartibi-va-yaroqsiz-natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nomzodlar tartibi va yaroqsiz natijalar&lt;/span&gt;&lt;/a&gt;Nomzodlar tartibi va yaroqsiz natijalar&lt;/h4&gt;\n&lt;p&gt;Har bir prompt uchun uch xil siklik taqdimot qoʻllanadi: kanonik tartib va ikkita &lt;a href=\"concepts/determinirovannye-povoroty.html\"&gt;deterministik aylantirish&lt;/a&gt;. Bu tartibning natijaga taʼsirini baholashga yordam beradi. Asosiy qaror kanonik tartibdagi natija hisoblanadi. Parslashda xatolik yuz berganda «tiyilish» (abstention) qayd etiladi, qayta urinishlar bitta iteratsiya bilan cheklangan. Yaroqsiz natijalar hisobdan chiqarilmaydi, foydalilik (utility) va afsuslanish (regret) koʻrsatkichlari qamrov (coverage) bilan birga hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deterministik aylantirish — bu roʻyxatdagi elementlar ketma-ketligini oʻzgartirish orqali modelning birinchi variantga moyilligini tekshirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tiyilish-bilan-tanlash\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#tiyilish-bilan-tanlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tiyilish bilan tanlash&lt;/span&gt;&lt;/a&gt;Tiyilish bilan tanlash&lt;/h4&gt;\n&lt;p&gt;Filtrlash chegaralari $ au \\in {1/3, 2/3, 1}$ va modellararo qoidalar inferens boshlanishidan oldin belgilangan. Filtrlash faqat barcha uchta chaqiruv muvaffaqiyatli pars qilinganda ishlaydi. Durang holatida kanonik tartib ustunlikka ega. Tiyilish holatida «xavfsiz» natija nazarda tutilmaydi, shuning uchun har bir baholashda qamrov darajasi koʻrsatiladi.&lt;/p&gt;\n&lt;h4 id=\"statistik-tahlil\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#statistik-tahlil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Statistik tahlil&lt;/span&gt;&lt;/a&gt;Statistik tahlil&lt;/h4&gt;\n&lt;p&gt;Tahlil birligi — nomzodlar toʻplami bilan birga berilgan prompt. Oʻrtacha qiymatlar va juftlik farqlari uchun 95% ishonch intervallari 10 000 ta &lt;a href=\"concepts/butstrep.html\"&gt;butstrap&lt;/a&gt; iteratsiyasi (seed 20261002) yordamida hisoblanadi. BMR siyosati uchun Uilson intervallari qoʻllanadi. Pozitsiya taʼsiri, filtr tomonidan rad etilgan promptlar va qoʻshimcha tadqiqotlar (5.5 va 5.6-boʻlimlar) eksplorator (izlanuvchan) deb tasniflanadi, chunki ular asosiy inferensdan keyin qoʻshilgan.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"presentation-position\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#presentation-position\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Presentation Position&lt;/span&gt;&lt;/a&gt;Presentation Position&lt;/h4&gt;\n&lt;p&gt;Ikkala asosiy hakam-model ham dastlabki pozitsiyalarga moyillik koʻrsatadi (4c-rasm). Qwen 900 ta chaqiruvning 48,8 foizida A slotini tanlaydi, bu tasodifiy tanlovdan (27,8 foiz) sezilarli darajada yuqori (χ²=219, p&amp;lt;10⁻¹⁰). Smol esa 93,3 foiz hollarda A yoki B slotlarini tanlaydi. Qwen tanlovining 59,7 foizi tasvirlar ketma-ketligiga qarab oʻzgaradi. Baʼzi hollarda hakam shunchaki birinchi tasvirni tanlaydi, ammo tahlillar shuni koʻrsatadiki, model mazmunga ham javob beradi. Uchta rotatsiya boʻyicha oʻrtacha koʻrsatkichni hisobga olganda, Qwen insonlar tomonidan eng yuqori baholangan tasvirlarni 57,9 foiz hollarda tanlaydi (tasodifiy tanlovda 27,8 foiz).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hakam-modellar roʻyxat boshidagi tasvirlarni tanlashga moyil, bu esa baholashni buzadi, garchi ular mazmunni tushunish qobiliyatini saqlab qolsa ham.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"what-agreement-gates-keep-and-reject\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#what-agreement-gates-keep-and-reject\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What Agreement Gates Keep and Reject&lt;/span&gt;&lt;/a&gt;What Agreement Gates Keep and Reject&lt;/h4&gt;\n&lt;p&gt;«Kelishuv filtrlari» (agreement gates) noaniq soʻrovlarni saralashga yordam beradi. Agar uchta rotatsiyada ham hakamning yakdilligi talab qilinsa (soʻrovlarning 40,3 foizi), Qwen tanlovining tasodifiy tanlovdan ustunligi 0,141 [0,110, 0,173] ni tashkil etadi. Rad etilgan soʻrovlarda (179 ta holat) natija −0,030 [−0,057, −0,002] gacha tushadi. «Uchta holatdan ikkitasi» filtri oraliq variant boʻlib, soʻrovlarning 80,7 foizini saqlab qoladi va 0,094 [0,071, 0,118] oʻsishni taʼminlaydi. Ikki xil model (Qwen va Smol) oʻrtasidagi kelishuv esa yomonroq ishlaydi: u koʻpincha modellar mazmunga bogʻliq boʻlmagan sabablar (masalan, pozitsiyaga umumiy moyillik) tufayli bir xil qarorga kelgan soʻrovlarni tanlab oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kelishuv filtri (gate) — bu model turli sharoitlarda (masalan, tasvirlar tartibi oʻzgarganda) bir xil javob bergan holatlarni saralab oluvchi usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"comparison-with-a-clip-baseline\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#comparison-with-a-clip-baseline\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Comparison with a CLIP Baseline&lt;/span&gt;&lt;/a&gt;Comparison with a CLIP Baseline&lt;/h4&gt;\n&lt;p&gt;CLIP (ViT-L/14) bilan solishtirish shuni koʻrsatadiki, tartibga bogʻliq boʻlmagan bu usul 0,069 [0,047, 0,090] oʻsishga erishadi, bu Qwen natijasidan (0,039) biroz yuqoriroq. Biroq, CLIP ham stereotipik tasvirlar reytingini 0,026 [0,006, 0,046] ga oshiradi, bu Qwen bilan bir xil. CLIP uchun kichikroq ViT-B/32 arxitekturasidan foydalanish deyarli bir xil oʻsishni (0,063) beradi, ammo stereotiplarning oʻsishiga olib kelmaydi, bu esa taʼsirning model arxitekturasiga bogʻliqligini koʻrsatadi. Tadqiqot shuni tasdiqlaydiki, hatto ixtisoslashgan baholovchilar ham tarafkashlik muammolaridan xoli emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CLIP bilan solishtirish tadqiqot xarakteriga ega va tanlovga taʼsir qiluvchi barcha omillarni hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; 300 ta asosiy soʻrov boʻyicha tanlov natijalari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Koʻrsatkich&lt;/th&gt;\n&lt;th&gt;Oracle&lt;/th&gt;\n&lt;th&gt;Qwen&lt;/th&gt;\n&lt;th&gt;Smol&lt;/th&gt;\n&lt;th&gt;Random&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Mean regret&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;0.160&lt;/td&gt;\n&lt;td&gt;0.270&lt;/td&gt;\n&lt;td&gt;0.199&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;95% ishonch intervallari (bootstrap). Cov.: siyosat amal qiladigan soʻrovlar ulushi. Align.: soʻrovga moslikning oʻrtacha reytingi. Gain over random: tasodifiy tanlovga nisbatan yutuq. BMR: reytingi hovuz oʻrtacha koʻrsatkichidan past boʻlgan tasvirlar ulushi. Best: eng yuqori reytingga ega tasvirlar ulushi. Worst: mamlakatlar guruhi boʻyicha eng yuqori oʻrtacha afsuslanish (regret).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"pozitsion-tarafkashlik-artefaktmi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#pozitsion-tarafkashlik-artefaktmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pozitsion tarafkashlik artefaktmi?&lt;/span&gt;&lt;/a&gt;Pozitsion tarafkashlik artefaktmi?&lt;/h4&gt;\n&lt;p&gt;Mualliflar pozitsion tarafkashlik interfeys xususiyati emasligini tekshirishdi. Qwen modeli bilan 300 ta promptda uchta test o'tkazildi. Javob formatini reytingdan yagona tanlovga o'zgartirganda, model birinchi slotni 44,8% hollarda tanladi (bir xil taqsimotda 27,8%). A/B/C/D yorliqlarini neytral kodlarga almashtirganda, birinchi tasvirni tanlash chastotasi 51,8% ni tashkil etdi. To'rtta tasvirning to'liq rotatsiyasi ham tarafkashlikni tasdiqladi: birinchi slot 52,5% hollarda tanlandi. Barcha variantlarda birinchi slotga ustunlik saqlanib qoldi, bu modelning ichki xususiyatini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pozitsion tarafkashlik Qwen modelining barqaror xususiyati bo'lib, interfeys yoki yorliqlar artefakti emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"masshtab-tarafkashlikni-yoqotadimi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#masshtab-tarafkashlikni-yoqotadimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Masshtab tarafkashlikni yo'qotadimi?&lt;/span&gt;&lt;/a&gt;Masshtab tarafkashlikni yo'qotadimi?&lt;/h4&gt;\n&lt;p&gt;Model hajmining ta'sirini tekshirish uchun Qwen3-VL-8B-Instruct sinovdan o'tkazildi. 4B modelining 8-bitli &lt;a href=\"concepts/quantization.html\"&gt;kvantlash&lt;/a&gt; bilan nazorat sinovi asosiy test bilan bir xil natijalarni ko'rsatdi (48,2% birinchi slot tanlovi). 8B modelida tarafkashlik deyarli yo'qoldi: birinchi slot 27,8% ga yaqin bo'lgan 27,3% hollarda tanlandi (p = 0,06). 8B modeli CLIP (0,069) ga nisbatan yuqoriroq sifat o'sishini (0,097) ko'rsatdi. Biroq, model o'zgarganda «bir ovozdanlik» (unanimity gate) mexanizmini qayta ko'rib chiqish kerak, chunki u 8B modeli 4B ga qaraganda yaxshiroq qabul qiladigan sifatli qarorlarni rad eta boshlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model hajmining 8B gacha oshirilishi pozitsion tarafkashlikni tasodifiy tanlov darajasigacha pasaytiradi va umumiy aniqlikni oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"madaniy-xatolar-natijalari\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#madaniy-xatolar-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Madaniy xatolar natijalari&lt;/span&gt;&lt;/a&gt;Madaniy xatolar natijalari&lt;/h4&gt;\n&lt;p&gt;Qwen aniq kutishlarni o'tkazib yuborishni 0,056 ga, yashirin kutishlarni esa 0,034 ga kamaytiradi. Biroq, stereotip reytingi 0,125 dan 0,148 gacha o'sdi. Bu o'sish asosan yuqori stereotip ko'rsatkichlariga ega bo'lgan SD-3.5-Large generatori tasvirlariga ustunlik berilishi bilan bog'liq. Javoblarni uchta tartib bo'yicha birlashtirganda yoki «bir ovozdanlik»dan foydalanganda, stereotiplarning statistik ahamiyatli o'sishi yo'qoladi, shu bilan birga modelning kutishlardagi xatolarni kamaytirish qobiliyati saqlanib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Stereotiplarning o'sishi tadqiqot xarakteriga ega, chunki Bonferroni tuzatishidan keyin ishonch oralig'i nolni o'z ichiga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mamlakatlar-guruhlari\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#mamlakatlar-guruhlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mamlakatlar guruhlari&lt;/span&gt;&lt;/a&gt;Mamlakatlar guruhlari&lt;/h4&gt;\n&lt;p&gt;Qwen sifat o'sishi bahosi 10 ta mamlakat guruhidan 7 tasida ijobiydir. Eng yuqori regret (afsuslanish) qiymati Yaponiyada (0,275) qayd etilgan, bu yerda tasodifiy tanlov ham yuqori regret darajasiga ega (0,266). Guruh bo'yicha kichik tanlama hajmi (30 ta prompt) tufayli ushbu intervallar keng va bir-birining ustiga chiqadi, shuning uchun tahlil guruhlarni madaniy imtiyozlar bo'yicha reytinglashga imkon bermaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Regret (afsuslanish) — model tanlagan variant sifati va berilgan to'plamdagi maksimal mumkin bo'lgan sifat o'rtasidagi farqni ko'rsatuvchi metrika.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Harakatni baholash ballni baholashdan muhimroqdir. Tasvirlarni ishonchli tarzda saralaydigan hakam harakat qilish kerak bo'lganda yomon tasvirni tanlashi mumkin. Tanlangan tasvirni eng yaxshi mavjud va tasodifiy tanlov bilan solishtirish qarorning qiymatini ko'rsatadi va ballar korrelyatsiyasi yashiradigan xatolarni, masalan, tasvirning joylashuviga kuchli bog'liqlikni ochib beradi.&lt;/p&gt;\n&lt;p&gt;Kelishuv shlyuzlari (agreement gates) o'z auditiga muhtoj. Kelishuv faqat hakamning xato rejimini buzgan taqdirdagina foydalidir. Kelishuv barqaror xatolarni saqlab qolishi mumkin, shuning uchun pushaymonlikning (regret) har qanday kamayishi qabul qilingan promptlar uchun tasodifiy tanlov bilan va rad etilganlari uchun hakam bilan solishtirilishi kerak. Pozitsion siljish (position bias) biz o'rgangan ikkita shlyuz nima uchun farqlanishini tushuntiradi. Rotatsiyalar bo'ylab yakdillik turli slotlardan bir xil tasvirni talab qiladi, bu esa pozitsiyaga bog'liq tanlovlarni filtrlaydi; slot afzalliklari o'xshash bo'lgan ikki hakam kontentga aloqador bo'lmagan sabablarga ko'ra kelishib qolishi mumkin. Rotatsiyalar bo'ylab ovoz berish orqali tartibni o'rtachalashtirish tanlovdan voz kechmasdan yo'qolgan qiymatning bir qismini tiklaydi. Tanlovdan voz kechish amaliy savolni qoldiradi: rad etilgan so'rovni kim, qanday xarajat bilan va qanday natija bilan hal qiladi?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Rotatsiyalar bo'ylab yakdillik pozitsion xatolarni samarali filtrlaydi, ammo kelishuv tizimli xatolarni yashirishi mumkinligi sababli audit talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"yakdillik-natijasi-oson-promptlar-bilan-izohlanadimi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#yakdillik-natijasi-oson-promptlar-bilan-izohlanadimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yakdillik natijasi oson promptlar bilan izohlanadimi?&lt;/span&gt;&lt;/a&gt;Yakdillik natijasi oson promptlar bilan izohlanadimi?&lt;/h4&gt;\n&lt;p&gt;Yo'q. Yakdillik saqlab qoladigan promptlardagi nomzodlar rad etilganlariga qaraganda reyting bo'yicha ko'proq farq qiladi, shuning uchun qolgan hovuzlar xato uchun ko'proq joy qoldiradi, kamroq emas. Hakamning ulardagi yutug'i katta, rad etilgan promptlarda esa u noldan past.&lt;/p&gt;\n&lt;h4 id=\"masshtab-bilan-nima-ozgaradi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#masshtab-bilan-nima-ozgaradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Masshtab bilan nima o'zgaradi?&lt;/span&gt;&lt;/a&gt;Masshtab bilan nima o'zgaradi?&lt;/h4&gt;\n&lt;p&gt;8B kengaytmasi shuni ko'rsatadiki, aniq xato universal emas: pozitsion siljish deyarli yo'qoladi va u bilan birga shlyuzning tasodifiy qarorlardan pastroqlarini filtrlab tashlash qobiliyati ham, garchi tartibga sezgirlik saqlanib qolsa ham. Auditning o'zi o'zgarishsiz qoladi va aynan u farqni ochib beradi. Amaliy saboq: bir hakam uchun tasdiqlangan filtr ikkinchisi uchun yaroqli emas. Tartibni tekshirish arzon. Bizning uskunamizda bitta Qwen qarori median 3,5 soniyani, uchta tartib esa 10,6 soniyani (taxminan 3 barobar qimmat) oladi, bu ovoz berish yutug'ini yoki yakdillik filtrini beradi. To'rtinchi tartibni qo'shish pushaymonlikni yanada kamaytirmasdan qamrovni pasaytiradi (to'rt tartibli yakdillik 0,095 pushaymonlikda to'rtta tasvirli hovuzlarning 27,5% ini saqlaydi, Rasm S14). Tartibga sezgirlik nomzodlarning yaqinligiga zaif bog'liq: Qwen tanlovi reyting diapazonining quyi uchdan bir qismidagi promptlarning 62,8% ida va yuqori qismida 53,6% ida o'zgaradi (Jadval S17), demak, siljish faqat durangga yaqin holatlar bilan cheklanmagan. Moslashuv va madaniy xatolar turli nishonlardir. VLM hakami ham, CLIP bazasi ham o'tkazib yuborilgan madaniy kutishlarni kamaytiradi, ammo stereotip reytinglari turlicha harakatlanadi: hakam ularni biroz oshiradi, xuddi CLIP backendlaridan biri kabi, lekin boshqasi emas. Hakam qarorlarini tartiblar bo'yicha jamlash sezilarli o'sishni qoldirmaydi. Prompt moslashuviga sozlangan selektor stereotip natijalari bo'yicha alohida audit qilinishi kerak, chunki kompozit ballar bu kelishuvni yashiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pozitsion siljish — modelning ro'yxatdagi o'rniga qarab ob'ektga ustunlik berish moyilligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cheklovlar-va-etika\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#cheklovlar-va-etika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va etika&lt;/span&gt;&lt;/a&gt;Cheklovlar va etika&lt;/h4&gt;\n&lt;p&gt;CulturalFrames tadqiqoti mamlakatlar, domenlar, promptlar va generatorlarning cheklangan to‘plamini qamrab oladi. Mamlakat yorliqlari ichki xilma-xillikni yetarlicha aks ettirmasligi mumkin. Nomzod tasvirlar ma’lum generatorlar to‘plamidan olingan, shuning uchun natijalar ularning vizual uslublariga bog‘liq. Kirish tasvirlarining ruxsati (resolution) mayda detallarni yashirishi mumkin. Inson baholashi mukammal emas: annotatorlar o‘rtasidagi kelishmovchiliklar va ma’lumotlardagi shovqin «orakul» (baholash tizimi) natijalarini ehtiyotkorlik bilan talqin qilishni talab qiladi. Ishonch intervallari inson baholashlarining umumiy noaniqligini emas, balki o‘rtacha qiymatlarni aks ettiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kichik generatorlar va mamlakatlar to‘plami bilan cheklangan, natijalar annotatorlar subyektivligi va modellar xususiyatlariga bog‘liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4B va 2.2B parametrli modellar kuchli pozitsion siljishni ko‘rsatadi; bu holat kattaroq modellarda kamayishi mumkin, ammo bu tekshirilmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Model tanlovi foydalanuvchiga yetkazilgan real zararni yoki tahrirlash jarayonini o‘lchamaydi. Asosiy baholovchi modellar kichik (4 mlrd va 2,2 mlrd parametr). 8 mlrd parametrli model bilan o‘tkazilgan qo‘shimcha test pozitsion siljish model masshtabi bilan kamayishini ko‘rsatdi. Har bir mamlakat uchun 30 ta promptdan foydalanilgani sababli, guruhlararo farqlarni aniqlash uchun statistik quvvat yetarli emas. Pozitsion siljish va &lt;a href=\"concepts/masshtabirovanie.html\"&gt;masshtablash&lt;/a&gt; tahlillari dastlabki (exploratory) xarakterga ega. Tadqiqot shaxsiy ma’lumotlarni yig‘masdan, ochiq benchmarkning ikkilamchi tahlilidir. Mualliflar kod va matn yozishda AI-yordamchilardan (OpenAI Codex, Anthropic Claude) foydalangan, biroq barcha empirik natijalar chiqarilgan annotatsiyalar asosida hisoblangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pozitsion siljish (position bias) — modelning mazmunidan qat’i nazar, ro‘yxatdagi ma’lum bir o‘rinda turgan natijani afzal ko‘rish moyilligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tadqiqot-hissasi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#tadqiqot-hissasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot hissasi&lt;/span&gt;&lt;/a&gt;Tadqiqot hissasi&lt;/h4&gt;\n&lt;p&gt;Ish quyidagilarni taqdim etadi: (i) VLM (vizual-til modellari) uchun pozitsiyalar rotatsiyasi bilan audit protokoli; (ii) kichik ochiq modellarda kuchli pozitsion siljish dalillari va keyingi ablyatsion testlar; (iii) mazmun bo‘yicha bazaviy chiziq bilan solishtirganda promptlarni tanlashda «kelishuv darvozalari» (agreement gates) auditi. Barcha tajribalar va tahlillar original hisoblanadi.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Xatolik reytinglari turlicha boʻlgan hovuzlarda Qwen tanlovi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Kategoriya&lt;/th&gt;\n&lt;th&gt;Qamrov&lt;/th&gt;\n&lt;th&gt;Random (matched)&lt;/th&gt;\n&lt;th&gt;Qwen, order gate&lt;/th&gt;\n&lt;th&gt;Qwen, cross-model gate&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Majority&lt;/td&gt;\n&lt;td&gt;100%, n=300&lt;/td&gt;\n&lt;td&gt;0.25&lt;/td&gt;\n&lt;td&gt;0.22&lt;/td&gt;\n&lt;td&gt;0.20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;≥2/3&lt;/td&gt;\n&lt;td&gt;81%, n=242&lt;/td&gt;\n&lt;td&gt;0.21&lt;/td&gt;\n&lt;td&gt;0.19&lt;/td&gt;\n&lt;td&gt;0.13&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3/3&lt;/td&gt;\n&lt;td&gt;40%, n=121&lt;/td&gt;\n&lt;td&gt;0.11&lt;/td&gt;\n&lt;td&gt;0.07&lt;/td&gt;\n&lt;td&gt;0.07&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Selected va Random — oʻrtacha xatolik koʻrsatkichlari; farq juftlik boʻyicha (95% CI). Shartlar bir-birini qoplaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Mamlakatlar boʻyicha asosiy taqsimot&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Mamlakat&lt;/th&gt;\n&lt;th&gt;Random&lt;/th&gt;\n&lt;th&gt;Qwen&lt;/th&gt;\n&lt;th&gt;Smol&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Japan&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Iran&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Poland&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Canada&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;South Africa&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;China&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Chile&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Brazil&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;India&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Germany&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Har bir mamlakat uchun 30 ta soʻrovlar toʻplami. Mean align. va Stereo. — nomzodlarning oʻrtacha reytinglari.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"vlm-hakam-ishini-tahlil-qilish\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#vlm-hakam-ishini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VLM-hakam ishini tahlil qilish&lt;/span&gt;&lt;/a&gt;VLM-hakam ishini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Oʻtkazilgan tadqiqot shuni koʻrsatdiki, tasvirni tanlashda hakam vazifasini bajaruvchi 4 milliard parametrli VLM (Vision-Language Model) modeli tasodifiy tanlovdan (0,039) deyarli farq qilmaydigan samaradorlikni namoyon etadi. Ushbu usul CLIP oʻxshashlikni baholash tizimidan aniqlik boʻyicha ortda qoladi va yaqqol pozitsion tarafkashlikni (position bias) koʻrsatadi: modellarning 48,8% hollarda roʻyxatda birinchi boʻlib keltirilgan tasvirni tanlashi aniqlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;4B parametrli VLM-hakam kuchli pozitsion tarafkashlikka ega boʻlib, 48,8% hollarda birinchi tasvirni tanlaydi, bu esa uning ishini tasodifiy tanlovdan deyarli farq qilmasligini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cheklovlar-va-masshtablash\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#cheklovlar-va-masshtablash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va masshtablash&lt;/span&gt;&lt;/a&gt;Cheklovlar va masshtablash&lt;/h4&gt;\n&lt;p&gt;Nomzodlar tartibi oʻzgarganda qarorlarning mos kelishi modelning toʻgʻri va notoʻgʻri qarorlarini ajratib olishga yordam beradi. Biroq, oʻxshash pozitsion tarafkashlikka ega boʻlgan kuchsizroq model bilan moslik ishonchlilik koʻrsatkichi hisoblanmaydi. Xuddi shu oilaga mansub kattaroq modelga (8B parametr) oʻtilganda, pozitsion tarafkashlik deyarli yoʻqoladi. Shu bilan birga, tartib boʻyicha moslikka asoslangan filtr mexanizmi (gate) 8B modeli uchun koʻpincha toʻgʻri qarorlarni ham rad etadi. Bu shuni anglatadiki, bir model uchun tasdiqlangan tekshiruv mezonlari boshqasiga avtomatik tarzda oʻtkazilishi mumkin emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bir model uchun ishlab chiqilgan audit va filtrlash usullari universal emas va VLM arxitekturasi yoki hajmi oʻzgarganda qayta validatsiyadan oʻtishi shart.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tanlov-tizimlari-uchun-xulosalar\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#tanlov-tizimlari-uchun-xulosalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tanlov tizimlari uchun xulosalar&lt;/span&gt;&lt;/a&gt;Tanlov tizimlari uchun xulosalar&lt;/h4&gt;\n&lt;p&gt;Moslikni tekshirishning foydaliligi faqat modelning oʻziga xos xato turiga qaratilgan hollarda cheklangan. Binobarin, tanlov tizimlari, shu jumladan filtrlar auditi har safar hakam-model almashtirilganda qaytadan oʻtkazilishi kerak. Ushbu natijalar nomzodlarning qatʼiy toʻplamidan bitta tasvirni tanlash ssenariysiga tegishli. Ishlayotgan tanlov tizimini toʻliq baholash uchun foydalanuvchilar xatti-harakatlari, ularning keyingi harakatlari va model qaror qabul qilishdan bosh tortgan holatlardagi natijalarni tahlil qilish talab etiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VLM (Vision-Language Model) — tasvirlarni tahlil qilish va ular haqidagi savollarga tabiiy tilda javob bera oladigan neyron tarmoq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f1.jpg\" alt=\"1-rasm: Bir xil soʻrov, bir xil tasvirlar, uchta tartib.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Bir xil soʻrov, bir xil tasvirlar, uchta tartib.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Bir xil soʻrov, bir xil tasvirlar, uchta tartib. Har bir qatorda uchta nomzod bitta taqdimot tartibida va odamlar tomonidan soʻrovga moslik boʻyicha oʻrtacha baholar koʻrsatilgan. Qwen3-VL-4B har safar A pozitsiyasidagi tasvirni tanlaydi (ramka bilan belgilangan), shuning uchun uning tanlangan tasviri faqat tartibga qarab 0,00, 0,50 yoki 0,83 ball oladi. Tasvirlar: CulturalFrames (Nayak va boshq. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f2.jpg\" alt=\"2-rasm: VLM-hakamlar aniqroq yaxshiroq nomzod mavjud boʻlganda oʻrtachadan pastroq tasvirlarni qaytarishi mumkin.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: VLM-hakamlar aniqroq yaxshiroq nomzod mavjud boʻlganda oʻrtachadan pastroq tasvirlarni qaytarishi mumkin.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: VLM-hakamlar aniqroq yaxshiroq nomzod mavjud boʻlganda oʻrtachadan pastroq tasvirlarni qaytarishi mumkin. Har bir guruh bitta CulturalFrames soʻrovi (Nayak va boshq. 2025); raqamlar odamlar tomonidan soʻrovga moslik boʻyicha oʻrtacha baholardir. Qizil: Qwen3-VL-4B ning dastlabki tartibdagi tanlovi, pul boʻyicha oʻrtacha koʻrsatkichdan past. Yashil: eng yuqori baholangan nomzod. Soʻrovlar tasvirlarni koʻrmasdan qoʻllaniladigan qatʼiy qoidaga amal qiladi (D ilovasi); ular xatolik turini koʻrsatadi, uning chastotasini emas (4-rasm).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f3.jpg\" alt=\"3-rasm: Audit protokoli.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Audit protokoli.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Audit protokoli. (a) CulturalFrames dan olingan muzlatilgan nomzodlar pullari: toʻrtta generator tomonidan yaratilgan uch yoki toʻrtta tasvirga ega madaniy kontekstdagi soʻrovlar. (b) Tanlash: har bir hakam faqat soʻrov va tasvirlarni uchta siklik tartibda koʻradi; kelishuv darvozalari (agreement gates) harakat qilish yoki tiyilishni hal qiladi. (c) Retrospektiv audit: hakamga hech qachon koʻrsatilmagan odamlarning baholari tanlovdan soʻng tasvir identifikatori bilan birlashtiriladi va xuddi shu pullar boʻyicha aniq tasodifiy tanlov bilan solishtiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f5.jpg\" alt=\"5-rasm: Qwen bilan post-hoc ablyatsiyalar.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Qwen bilan post-hoc ablyatsiyalar.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: Qwen bilan post-hoc ablyatsiyalar. (a) Birinchi taqdim etilgan tasvirni tanlaydigan chaqiruvlar ulushi; chiziqlar bir xil chastotani belgilaydi. (b) Barcha soʻrovlar boʻyicha va barcha tartiblar mos keladigan soʻrovlar boʻyicha tasodifiy tanlovdan ustunlik (95% ishonch intervallari). No ranking: faqat tanlov chiqish formati. Opaquecodes: harflar oʻrniga ikki belgili yorliqlar. 4 orders: toʻrtta tasvirli pullar uchun toʻrtinchi rotatsiya.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f7.jpg\" alt=\"7-rasm: Qwen tanlovining xuddi shu pullar boʻyicha tasodifiy tanlovdan farqli oʻlaroq madaniy xatolik baholari; manfiy q\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Qwen tanlovining xuddi shu pullar boʻyicha tasodifiy tanlovdan farqli oʻlaroq madaniy xatolik baholari; manfiy qiymatlar kamroq xatolarni anglatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm: Qwen tanlovining xuddi shu pullar boʻyicha tasodifiy tanlovdan farqli oʻlaroq madaniy xatolik baholari; manfiy qiymatlar kamroq xatolarni anglatadi. Toʻq rangli ustunlar: nuqtali 95% intervallar. Och rangli ustunlar: uchta xatolik turi boʻyicha Bonferroni tuzatilgan intervallar. Qwen oʻtkazib yuborilgan kutishlarni kamaytiradi va stereotip baholarini biroz oshiradi; stereotip farqi tuzatishdan keyin saqlanib qolmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f10.jpg\" alt=\"10-rasm: Filtrlanmagan misollar: muzlatilgan manifestdagi har bir mamlakat uchun toʻrtta nomzodli birinchi prompt, nomzo\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm: Filtrlanmagan misollar: muzlatilgan manifestdagi har bir mamlakat uchun toʻrtta nomzodli birinchi prompt, nomzodlar asl taqdimot tartibida.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;10-rasm: Filtrlanmagan misollar: muzlatilgan manifestdagi har bir mamlakat uchun toʻrtta nomzodli birinchi prompt, nomzodlar asl taqdimot tartibida. Raqamlar odamlar tomonidan berilgan promptga moslikning oʻrtacha reytingidir. Moviy (Q) va toʻq sariq (S) ramkalar Qwen va Smolning asl tartibdagi tanlovini belgilaydi; yashil belgi eng yuqori reytingli nomzodlarni koʻrsatadi. Tasvirlar CulturalFrames’dan (Nayak va boshq. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f11.jpg\" alt=\"11-rasm: Stereotiplar boʻyicha murosali qaror.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-rasm: Stereotiplar boʻyicha murosali qaror.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;11-rasm: Stereotiplar boʻyicha murosali qaror. Qwen tanlovi (qizil) oʻz toʻplamida eng yuqori stereotip darajasiga ega boʻlgan va teng yoki undan yuqori moslikka ega boshqa nomzod pastroq darajaga ega boʻlgan promptlar (belgilar). Yorliqlar oʻrtacha moslikni (A) va stereotipni belgilagan annotatorlar ulushini (S) koʻrsatadi. Uchta tasvirli qatorlar — bu faqat uchta nomzodni oʻz ichiga olgan promptlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f12.jpg\" alt=\"12-rasm: Kontent baholovchisi va hakam.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12-rasm: Kontent baholovchisi va hakam.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;12-rasm: Kontent baholovchisi va hakam. CLIP tanlovi (C, binafsha) va Qwenning asl tartibdagi tanlovi (Q, moviy) reyting boʻyicha eng koʻp farq qiladigan promptlar: chapda — CLIP tanlovi yuqoriroq baholangan; oʻngda — Qwen tanlovi. Belgilar eng yaxshi baholangan nomzodlarni koʻrsatadi. Uchta tasvirli qatorlar — bu faqat uchta nomzodni oʻz ichiga olgan promptlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f13.jpg\" alt=\"13-rasm: Tartibning oʻzgarishi. Qwen barcha uchta tartibda A slotini tanlaydigan va kamida ikkita turli tasvirni qaytara\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;13-rasm: Tartibning oʻzgarishi. Qwen barcha uchta tartibda A slotini tanlaydigan va kamida ikkita turli tasvirni qaytaradigan promptlar; tanlangan variantlar orasida eng keng reyting diapazoniga ega beshta misol.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;13-rasm: Tartibning oʻzgarishi. Qwen barcha uchta tartibda A slotini tanlaydigan va kamida ikkita turli tasvirni qaytaradigan promptlar; tanlangan variantlar orasida eng keng reyting diapazoniga ega beshta misol. Oxirgi ustun — eng yaxshi baholangan nomzod. Tasvirlar CulturalFrames’dan (Nayak va boshq. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f14.jpg\" alt=\"Rasm 14\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 14&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f15.jpg\" alt=\"15-rasm: Audit brauzeri, umumiy koʻrinish. Asosiy baholar, taqdimot slotlari boʻyicha afzalliklar, mamlakatlar guruhlari\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;15-rasm: Audit brauzeri, umumiy koʻrinish. Asosiy baholar, taqdimot slotlari boʻyicha afzalliklar, mamlakatlar guruhlari boʻyicha afsuslanish (regret), har bir shlyuz uchun qabul qilingan va rad etilganlar oʻrtasidagi farq hamda har bir siyosat uchun tasodifiy tanlovga nisbatan oʻsish, barchasi yozib olingan chiqish maʼlumotlari asosida hisoblangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f16.jpg\" alt=\"16-rasm: Audit brauzeri, 1-rasmdagi prompt uchun batafsil koʻrinish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;16-rasm: Audit brauzeri, 1-rasmdagi prompt uchun batafsil koʻrinish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;16-rasm: Audit brauzeri, 1-rasmdagi prompt uchun batafsil koʻrinish. Chapda: har bir hakamning tanlovi (Q, S) va eng yuqori baholangan tasvir (belgi bilan belgilangan) bilan uchta taqdimot tartibi. Oʻngda: har bir nomzod uchun inson baholari, asl tartib uchun tanlov metrikalari va tartib boʻyicha tanlovlar. Tasvirlar CulturalFrames (Nayak va boshq. 2025) dan olingan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f17.jpg\" alt=\"17-rasm: Audit brauzeri, Qwenʼning oʻrtachadan past tanlovlari boʻyicha filtrlangan va regret (afsuslanish) koʻrsatkichi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;17-rasm: Audit brauzeri, Qwenʼning oʻrtachadan past tanlovlari boʻyicha filtrlangan va regret (afsuslanish) koʻrsatkichi boʻyicha saralangan promptlar eksploreri. Har bir yozuv ikkala hakamning asl tartibdagi tanlovlari (Q, S), eng yuqori baholangan tasvir (yulduzcha) va baholar bilan birga pulni koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f18.jpg\" alt=\"18-rasm: Audit brauzeri, Qwen barcha uchta tartibda bir xil tasvirni tanlaydigan promptlar boʻyicha filtrlangan promptla\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;18-rasm: Audit brauzeri, Qwen barcha uchta tartibda bir xil tasvirni tanlaydigan promptlar boʻyicha filtrlangan promptlar eksploreri (bir ovozdan qabul qilish filtri ularni saqlab qoladi).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f19.jpg\" alt=\"19-rasm: Audit brauzeri, Qwenʼda eng katta regret koʻrsatkichiga ega boʻlgan toʻrtta tasvirli pul uchun batafsil koʻrini\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;19-rasm: Audit brauzeri, Qwenʼda eng katta regret koʻrsatkichiga ega boʻlgan toʻrtta tasvirli pul uchun batafsil koʻrinish (qoida boʻyicha tanlangan). Ikkala hakam ham eng past baholangan tasvirni tanlaydi, shuning uchun modelaro filtri ushbu prompt uchun ishga tushadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f20.jpg\" alt=\"20-rasm: Audit brauzeri, ikkala hakam past baholangan tasvir boʻyicha kelishib olgan prompt uchun batafsil koʻrinish (mo\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;20-rasm: Audit brauzeri, ikkala hakam past baholangan tasvir boʻyicha kelishib olgan prompt uchun batafsil koʻrinish (modelaro kelishuvlar orasida regret koʻrsatkichi boʻyicha keyingi oʻrinda).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Sudya-modellar&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tarafkashlik&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qiladi&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Tartib&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o'zgarganda&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tanlovni audit&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qilish&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ro'yxatdagi&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o'rin sifatdan&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" fon
