        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"202\" cy=\"66\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"558\" cy=\"286\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OSM_GIS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Shaharsozlikda sun'iy&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;intellekt: shahar muhitini&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o'zgartirishning yangi usuli&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f2.jpg\" alt=\"2-rasm: VIDA-GEO quvurining umumiy ko'rinishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: &lt;a href=\"concepts/vida-geo.html\"&gt;VIDA-GEO&lt;/a&gt; quvurining umumiy ko'rinishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: VIDA-&lt;a href=\"concepts/generative-engine-optimization.html\"&gt;GEO&lt;/a&gt; quvurining umumiy ko'rinishi. Tasvir va shahar muhitini yaxshilash bo'yicha maqsadli ko'rsatma berilganda, agentlar guruhi qiziqish sohalarini (ROI) aniqlaydi, segmentlaydi va vazifaga xos cheklovlar bilan tahrirlab, aralashuv variantlarini yaratadi. Sifat tekshiruvlari realizm va siyosatga rioya etilishini baholaydi. Nomzodlar yakunda «qora quti» indikatori tomonidan baholanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Tadqiqotchilar sun'iy yo'ldosh va ko'cha tasvirlari asosida shahar infratuzilmasini yaxshilashni taklif qiluvchi VIDA-GEO tizimini taqdim etishdi. Bu shunchaki obyektlarni aniqlash emas, balki vizual o'zgarishlarni loyihalash vositasidir. Tizim generativ modellar va shaharsozlik qoidalarini birlashtirib, «&lt;a href=\"concepts/idt.html\"&gt;yashirin raqamli egizak&lt;/a&gt;» sifatida ishlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Shahar muhitini tahrirlash uchun ko'p agentli arxitektura.&lt;/li&gt;\n&lt;li&gt;Qimmat simulyatsiyalarni almashtiruvchi yashirin raqamli egizak.&lt;/li&gt;\n&lt;li&gt;Xavfsizlik va ko'kalamzorlashtirish kabi 8 ta metrika bo'yicha baholash.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;VIDA-GEO tasvirlarni segmentatsiyalash, diffuzion &lt;a href=\"concepts/diffusion-inpainting.html\"&gt;inpainting&lt;/a&gt; (tasvirni to'ldirish) va shahar ko'rsatkichlarini baholash modellarini birlashtirgan ko'p agentli tizimdir. Tizim vazifani bosqichlarga ajratadi: rejalashtiruvchi qiziqish zonalarini belgilaydi, siyosat agenti cheklovlarni o'rnatadi, generativ modul esa realizmni saqlagan holda o'zgarishlar kiritadi.&lt;/p&gt;\n&lt;p&gt;Metod har bir o'zgarish natijasini shaharsozlik normalariga muvofiqligi bo'yicha baholaydigan teskari aloqa sikliga asoslangan. Tizim xavfsizlik va ko'kalamzorlashtirish kabi 8 ta ko'rsatkich bo'yicha sinovdan o'tkazildi. Tadqiqot shuni ko'rsatadiki, ushbu yondashuv vizual sifat va qarorlarning asoslanganligi bo'yicha mavjud analoglardan ustun bo'lib, siyosiy moslik ko'rsatkichlarini ikki baravargacha oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim dastlabki ma'lumotlar sifatiga bog'liq va muhandislik tekshiruvini talab qiladigan takliflarni berishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Shahar muhiti uzoq muddatli sog‘liq, xavfsizlik va hayot sifatiga ta’sir ko‘rsatadigan loyihaviy qarorlar asosida shakllanadi. Biroq, taklif etilayotgan o‘zgarishlarni baholash ko‘p vaqt va mablag‘ talab qiladi, bu esa uni amaliyotda qo‘llashni qiyinlashtiradi. Hozirgi geofazoviy kompyuter ko‘rish usullari asosan aerofotosuratlar va ko‘cha ko‘rinishlarini tahlil qilish orqali shahar ko‘rsatkichlarini kuzatishga qaratilgan, ammo ular aralashuvlarni taklif qilmaydi va ularning ta’sirini baholamaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO — bu shaharsozlik yechimlarini avtomatlashtirilgan tarzda izlash va sinovdan o‘tkazish uchun generativ modellardan «raqamli egizak» sifatida foydalanadigan ko‘p agentli tizim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz ko‘rsatkichlarni baholovchi modelni tasvirlarni tahrirlashning generativ modeli bilan birlashtirishni taklif qilamiz. Ushbu bog‘liqlik shahar o‘zgarishlari bo‘yicha gipotezalarni virtual muhitda tekshirish imkonini beruvchi yashirin raqamli egizak vazifasini bajaradi.&lt;/p&gt;\n&lt;p&gt;VIDA-GEO tizimi uchta asosiy komponentni muvofiqlashtiradi: segmentatsiya algoritmlari, tasvirni to‘ldirish (inpainting) uchun diffuzion modellar va maqsadli ko‘rsatkichlarni baholash modellari. Ushbu kompleks realistik va shaharsozlik qoidalariga mos keladigan o‘zgarishlarni yaratishga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Diffuzion model — bu tasodifiy ma’lumotlardan «shovqin»ni bosqichma-bosqich olib tashlash orqali tasvir yaratuvchi neyron tarmoq turi bo‘lib, u yuqori aniqlik va realizmga erishishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz tizimni 8 ta turli ko‘rsatkich bo‘yicha sinovdan o‘tkazdik, bunda aerofotosuratlar va ko‘cha ko‘rinishlaridan foydalanib, ko‘kalamzorlashtirish darajasi va xavfsizlik hissi kabi parametrlarni baholadik. Natijalar shuni ko‘rsatadiki, bizning yondashuvimiz mavjud analoglardan ustun bo‘lib, vizual sifat va siyosatga muvofiqlik ko‘rsatkichlari bo‘yicha 2 baravargacha yuqori natija beradi. Tizim foydalanuvchiga bir nechta variantni taklif qiladi, bu esa uni shaharsozlik ekspertlari ish jarayoniga integratsiya qilish imkonini beradi. Loyiha kodini https://github.com/HosamGen/VIDA-GEO manzilidan olish mumkin.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Vizual geosiyosiy ma'lumotlar shahar muhiti va iqlim o'zgarishlarini monitoring qilishda keng qo'llaniladi. Sun'iy yo'ldosh tasvirlari yo'l xavfsizligi, ko'kalamzorlashtirish, havo ifloslanishi va issiqlik ta'sirini baholash imkonini beradi. Shuningdek, ko'cha ko'rinishlari va kuzatuv kameralari ma'lumotlari piyodalar uchun qulaylik va xavfsizlikni tahlil qilishda ishlatiladi. Hozirgi kompyuter ko'rish modellari tanib olishda yuqori aniqlikka ega bo'lsa-da, ular faqat monitoring bilan cheklanib qoladi, ya'ni ko'rsatkichlarni yaxshilash uchun qanday choralar ko'rish kerakligini ko'rsatmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mualliflar «yashirin raqamli egizak» (IDT) konsepsiyasini taklif qilishadi, u tanib olish modellari va generativ usullarni birlashtirib, realistik aralashuv stsenariylarini yaratadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;An'anaviy «raqamli egizaklar» yaratish qimmat ma'lumotlar yig'ishni va uzoq muddatli simulyatsiyalarni talab qiladi. Muqobil sifatida VIDA-GEO (Visual Intervention and Decision-support Agent for Geospatial data) tizimi taklif etildi. U monitoring modellari va tasvirni tahrirlash generativ modellarini birlashtiradi. Tizim ko'p agentli muhit sifatida ishlaydi: rejalashtiruvchi qiziqish sohalarini (ROI) ajratadi, siyosat agenti real shahar me'yorlariga asoslangan o'zgarishlarni taklif qiladi, segmentatsiya agenti niqoblar yaratadi va generativ agent vizual tahrirlashni amalga oshiradi (1-rasmga qarang).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yashirin raqamli egizak (IDT) — bu to'liq 3D rekonstruksiya o'rniga mavjud tasvirlarni o'zgartirish uchun generativ neyron tarmoqlardan foydalanadigan yondashuv.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Metodning samaradorligi generativ modellarning o'zgarishlarni fizik jihatdan ishonchli saqlab qolish qobiliyatiga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim o'zgarishlarni ham «qora quti» ko'rsatkichlari, ham ularning mantiqiy asoslanganligi bo'yicha baholaydi. Mualliflar sun'iy yo'ldosh va ko'cha tasvirlarini qamrab oluvchi 8 ta vazifa uchun yangi benchmark taqdim etishdi. Ishning asosiy hissasi monitoringdan siyosatga asoslangan qarorlar qabul qilishga o'tishdir.&lt;/p&gt;\n&lt;h4 id=\"related-works\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#related-works\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RELATED WORKS&lt;/span&gt;&lt;/a&gt;RELATED WORKS&lt;/h4&gt;\n&lt;p&gt;Shahar ko‘rsatkichlarini baholash. Aerofotosuratlar xavfsizlik va harakatchanlik ko‘rsatkichlarini, jumladan, yo‘l-transport hodisalari xavfi signallari va piyodalar infratuzilmasini tahlil qilishda qo‘llaniladi. Segmentatsiya usullari ko‘kalamzorlashtirish darajasini o‘lchash uchun ham ishlatiladi. Ko‘cha ko‘rinishidagi tasvirlar (street-view) shahar muhitining xavfsizligi va jonliligi kabi sifatlarini o‘rganishda keng qo‘llaniladi, so‘nggi tadqiqotlarda esa inson idrokini modellashtirish va multimodal &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; asosidagi baholash uchun xizmat qilmoqda. Mavjud modellardan farqli o‘laroq, biz ulardan ma’lum bir joydagi ko‘rsatkichlarni yaxshilashga qaratilgan vizual aralashuvlarni boshqarish uchun foydalanamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO modellardan shunchaki tahlil uchun emas, balki shahar muhitini yaxshilash bo‘yicha amaliy harakatlarni loyihalash uchun foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qaror qabul qilish va aralashuvlar. Raqamli egizaklar (digital twins) asosli qarorlar qabul qilish uchun shahar ma’lumotlari va simulyatsiyalarni birlashtiradi, biroq bunday tizimlar ko‘pincha tor doiraga yo‘naltirilgan va qimmat turadi. Oldingi ishlar model bashoratiga kiruvchi ma’lumotlarning ta’sirini tushunish uchun kontrfakt modellaridan, «qora quti» modellarini tushuntirish uchun esa diffuzion modellardan foydalangan. Bizning maqsadimiz — bu usullarni tahlil vositasidan real dunyodagi o‘zgarishlar vositasiga aylantirishdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kontrfakt modellashtirish — bu tizimga kiritilgan o‘zgarishlar natijaga qanday ta’sir qilishini aniqlash uchun «agar shunday bo‘lsa, nima bo‘ladi?» savoliga javob izlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aralashuv va interpretatsiya uchun agentlar. Masofadan &lt;a href=\"concepts/probing.html\"&gt;zondlash&lt;/a&gt; bo‘yicha &lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt; modellari ko‘rsatmalarga amal qiluvchi tizimlarni aerofotosuratlar bilan ishlashga moslashtiradi. Boshqa tadqiqotlar agentlar model xatolarini aniqlash yoki ko‘cha ko‘rinishidagi o‘zgarishlarni simulyatsiya qilishda qanday yordam berishini ko‘rsatadi. VIDA-GEO esa shahar aralashuvini multimodal qaror qabul qilish muammosi sifatida shakllantiradi. Taklif etilayotgan harakatlar nafaqat maqsadli ko‘rsatkichlar uchun, balki fizik reallik va shahar siyosati doirasida amalga oshirilishi mumkinligi nuqtai nazaridan ham optimallashtiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO takliflari shunchaki vizual o‘zgarishlar emas, balki fizik va siyosiy jihatdan bajarilishi mumkin bo‘lgan loyihalardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;p&gt;Ushbu bo‘limda tizimni amalga oshirish tafsilotlari, benchmarklar va qiyosiy tahlillar keltirilgan bo‘lib, ular ko‘p agentli tizimimizning shahar muhitiga real va asosli aralashuvlarni amalga oshirishdagi samaradorligini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"benchmark\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#benchmark\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Benchmark&lt;/span&gt;&lt;/a&gt;Benchmark&lt;/h4&gt;\n&lt;p&gt;Keng qamrovli baholash uchun ikki turdagi vizual ma’lumotlar: MapBox’dan yuqori aniqlikdagi aerofotosuratlar va Google Street View panoramalari tanlab olindi. Ko‘rsatkichlarni bashorat qilish uchun «qora quti» (black-box) modellari qo‘llaniladi. Aerofotosuratlar uchun Beta Risk (YTH xavfini bashorat qilish) va OpenEarthMap (ko‘kalamzorlashtirishni tahlil qilish) modellari tanlangan. Street View uchun MIT Place Pulse 2.0 bazasida oldindan o‘qitilgan Global Streetscapes modellari ishlatilib, ular xavfsizlik, jonlilik, go‘zallik, boylik hamda «zerikarli» va «tushkun» darajalarini 0–100 shkalasida baholaydi. Har bir 8 ta indikator uchun 100 tadan tasvir tanlab olinadi, bunda dastlabki balli 90 dan yuqori bo‘lganlari chiqarib tashlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim 8 ta indikator bo‘yicha baholashni amalga oshiradi va har bir tur uchun 100 tadan xilma-xil tasvirni tanlab oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baholash-metrikalari\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#baholash-metrikalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash metrikalari&lt;/span&gt;&lt;/a&gt;Baholash metrikalari&lt;/h4&gt;\n&lt;p&gt;Aralashuvlar samaradorligi ikki yo‘nalishda baholanadi: idrok etish sifati (vizual realizm) va siyosatga muvofiqlik (amaliy qo‘llanilishi). O‘zgartirishlar real ma’lumotlar taqsimotidan chiqib ketmasligini tekshirish uchun Mahalanobis masofasiga asoslangan proksi-metrika qo‘llaniladi.&lt;/p&gt;\n&lt;h4 id=\"llm-hakamlar-yordamida-baholash\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#llm-hakamlar-yordamida-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM-hakamlar yordamida baholash&lt;/span&gt;&lt;/a&gt;LLM-hakamlar yordamida baholash&lt;/h4&gt;\n&lt;p&gt;Masshtabli baholash GPT 5.2 va Qwen 3VL modellari orqali amalga oshiriladi. Tasvirlar 1–100 shkalasida uchta mezon bo‘yicha baholanadi: vizual sifat, realizm (fizik va semantik ishonchlilik) va siyosatni saqlash (sahna funksiyasi va tuzilishiga moslik). Ekspertlar (7 nafar magistrant va 5 nafar shaharsozlik mutaxassisi) tomonidan o‘tkazilgan qo‘shimcha tekshiruv LLM baholari bilan yuqori korrelyatsiyani ko‘rsatdi, bu esa LLM’ni inson bahosiga ishonchli muqobil sifatida ishlatish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-hakam — bu tasvir sifatini belgilangan mezonlar bo‘yicha avtomatlashtirilgan baholash uchun kuchli til modellaridan foydalanish usulidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bazaviy-modellar\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#bazaviy-modellar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bazaviy modellar&lt;/span&gt;&lt;/a&gt;Bazaviy modellar&lt;/h4&gt;\n&lt;p&gt;Qiyosiy tahlil URSimulator, DIFFusion, LANCE va NanoBanana 2.5 (zero-shot rejimi) bilan o‘tkazildi. Barcha modellar generativ funksiyalarga bir xil miqdordagi murojaatlar bilan cheklangan.&lt;/p&gt;\n&lt;h4 id=\"natijalar-va-muhokama\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#natijalar-va-muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar va muhokama&lt;/span&gt;&lt;/a&gt;Natijalar va muhokama&lt;/h4&gt;\n&lt;p&gt;VIDA-GEO har ikkala baholash o‘qi bo‘yicha eng yuqori ko‘rsatkichlarni qayd etdi. 1-jadvalda ko‘rsatilishicha, tizim 8 ta vazifadan 7 tasida raqobatchilardan ustun kelib, aralashuvlarning realizmini saqlagan holda ko‘rsatkichlarni izchil yaxshilaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taqqoslash generativ modellarga murojaatlar soni bilan cheklangan, bu resurslar cheksiz bo‘lganda usullarning to‘liq salohiyatini ko‘rsatmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"road-risk-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#road-risk-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Road Risk VIDA-GEO&lt;/span&gt;&lt;/a&gt;Road Risk VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;Yo‘l xavflarini baholash (Road Risk) toifasida VIDA-GEO modeli 82.1 ko‘rsatkichi bilan yuqori aniqlikni namoyon etib, raqobatchilardan sezilarli darajada o‘zib ketdi. LANCE usuli 68.7, DIFFusion 13.3, NB2.5 (ZS) esa 81.6 natijani qayd etdi. Bu ma’lumotlar modelning shahar muhitidagi xavfli hududlarni aniqlashda samarali ekanligini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO yo‘l xavflarini baholashda 82.1 ko‘rsatkichi bilan yetakchilik qilmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"safety-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#safety-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Safety VIDA-GEO&lt;/span&gt;&lt;/a&gt;Safety VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;Xavfsizlikni (Safety) baholashda VIDA-GEO 20.9 natijani ko‘rsatdi, bu LANCE (33.8), DIFFusion (50.5), URSimulator (33.0) va NB2.5 (ZS) (41.3) usullaridan pastroqdir. VIDA-GEO’ning bu segmentdagi past ko‘rsatkichi o‘quv ma’lumotlaridagi xavfsizlik belgilarini talqin qilish xususiyatlari bilan bog‘liq bo‘lishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"lively-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#lively-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Lively VIDA-GEO&lt;/span&gt;&lt;/a&gt;Lively VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;«Jonlilik»ni (Lively) baholashda VIDA-GEO 25.1 ballga erishdi. Boshqa usullar quyidagicha natija berdi: LANCE — 23.0, DIFFusion — 39.5, URSimulator — 29.6, NB2.5 (ZS) — 52.0. Bu yerda VIDA-GEO LANCE bilan solishtirilganda yaqin natija ko‘rsatdi, ammo muhitning dinamik xususiyatlarini aniqlashda NB2.5 (ZS) usulidan ortda qoldi.&lt;/p&gt;\n&lt;h4 id=\"beautiful-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#beautiful-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Beautiful VIDA-GEO&lt;/span&gt;&lt;/a&gt;Beautiful VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;Estetik jozibadorlikni (Beautiful) baholashda VIDA-GEO 26.1 natijani qayd etdi. Raqobatchi modellar: LANCE — 42.1, DIFFusion — 53.0, URSimulator — 32.8, NB2.5 (ZS) — 43.7. DIFFusion usuli bu toifada yetakchilik qilmoqda, bu uning vizual estetikani tahlil qilishdagi samaradorligini ta’kidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/beautiful.html\"&gt;Estetik baholash&lt;/a&gt; (Beautiful) — bu vizual ma’lumotlar asosida shahar muhitining jozibadorligini subyektiv idrok etishni belgilovchi metrika.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"wealthy-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#wealthy-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Wealthy VIDA-GEO&lt;/span&gt;&lt;/a&gt;Wealthy VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;Farovonlikni (Wealthy) baholash toifasida VIDA-GEO 27.0 ball oldi. Boshqa usullar: LANCE — 35.4, DIFFusion — 54.9, URSimulator — 35.5, NB2.5 (ZS) — 68.8. NB2.5 (ZS) modeli bu yerda eng yuqori natijalarni ko‘rsatdi, bu uning obyektlarning ijtimoiy-iqtisodiy maqom belgilariga nisbatan sezgirligini anglatishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"boring-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#boring-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boring VIDA-GEO&lt;/span&gt;&lt;/a&gt;Boring VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;«Zerikarli»likni (Boring) baholashda VIDA-GEO 74.6 kabi yuqori ko‘rsatkichni namoyon etdi. Taqqoslash uchun: LANCE — 62.8, DIFFusion — 55.2, URSimulator — 64.4, NB2.5 (ZS) — 61.1. VIDA-GEO’ning yuqori natijasi uning monoton yoki vizual jihatdan ifodasiz shahar hududlarini aniq identifikatsiya qilish qobiliyatidan dalolat beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Boring» toifasidagi yuqori ko‘rsatkichlar modelning aniqligini ham, vizual bir xil obyektlarning tasniflanish xususiyatlarini ham aks ettirishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"depressing-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#depressing-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Depressing VIDA-GEO&lt;/span&gt;&lt;/a&gt;Depressing VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;VIDA-GEO modeli vizual yaxlitlik va shaharsozlik qoidalariga rioya qilish bo‘yicha yuqori natijalarni ko‘rsatib, bazaviy modellardan o‘rtacha 15% ga ustunlik qiladi. DIFFusion modeli keskin o‘zgarishlarga qodir bo‘lsa-da (masalan, yo‘l xavfini 72,8% ga kamaytirish), uning vizual tahrirlari sifati va siyosatga muvofiqligi pastligicha qolmoqda. LANCE modeli ko‘pincha kutilmagan yo‘nalishda o‘zgarishlar kiritadi va LLM-hakamlar bahosida VIDA-GEO dan ortda qoladi. NB2.5 (ZS) bazaviy modeli miqdoriy jihatdan kattaroq o‘zgarishlarga erishsa-da (Lively va Wealthy ko‘rsatkichlari 39,1% va 50,8% ga yaxshilangan), bu o‘zgarishlar ko‘pincha noreal bo‘lib chiqadi. Yashkillashtirish vazifasi bundan mustasno, chunki u oddiy vizual tahrirlarni talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO vizual sifat va real shaharsozlik siyosatiga rioya qilish o‘rtasidagi eng yaxshi muvozanatni ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ekspert baholashlari avtomatlashtirilgan «qora quti» modellari va mutaxassislar fikri o‘rtasidagi tafovutni ko‘rsatdi. DIFFusion bilan solishtirganda, ekspertlar VIDA-GEO ni 61,3% hollarda afzal ko‘rishdi, avtomatlashtirilgan modellar esa atigi 10% hollarda. LANCE ga nisbatan esa bu ko‘rsatkich 86,7% ni tashkil etdi. LLM-hakamlar ekspertlar bilan yuqori darajada mos keldi (realizm bo‘yicha 88,5% va siyosatni saqlash bo‘yicha 91,6%), bu ularni samarali baholash vositasi ekanligini tasdiqlaydi. Sifat tahlili (3-rasm) shuni ko‘rsatadiki, VIDA-GEO real yechimlarni (bordyurlarni kengaytirish, taktil qoplamalar) taklif qiladi, DIFFusion esa muhim ob’ektlarni (masalan, svetoforlarni) olib tashlaydi yoki shunchaki ranglarni o‘zgartiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-hakam — tasvir sifatini matnli mezonlar asosida baholash uchun foydalaniladigan til modellari.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;VIDA-GEO ketma-ket tahrirlashni qo‘llab-quvvatlaydi (4-rasm). Iterativ tahrirlar (masalan, mural qo‘shish, binolarni kengaytirish) «zerikarli» (boring score) ko‘rsatkichini 53% dan 17% gacha kamaytiradi, bu bir martalik tahrirdan (40%) ancha samaraliroq. Iteratsiyalar davomida LLM-hakamlar ko‘rsatkichlari biroz pasaysa-da, bu shaharsozlik maqsadlariga erishish uchun maqbul kelishuvdir.&lt;/p&gt;\n&lt;h4 id=\"ablations\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ablations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ablations:&lt;/span&gt;&lt;/a&gt;Ablations:&lt;/h4&gt;\n&lt;p&gt;Komponentlar tahlili shuni ko‘rsatdiki, siyosat cheklovlari (policy constraints) yakuniy natijaga eng katta hissa qo‘shadi. Tahrir va niqob sifatini nazorat qilish modullari (Edit QC va Mask QC) sezilarli o‘sishni ta’minlaydi, takliflar moduli (suggestor) esa barqaror yaxshilanishlarni beradi.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Mualliflar shahar muhitini shunchaki kuzatishdan uni o‘zgartirish va qaror qabul qilishni sinovdan o‘tkazishga o‘tadigan yangi yondashuvni taqdim etdilar. Intervensiyalarning muvaffaqiyatini baholash uchun 800 ta tasvirni (sun’iy yo‘ldosh va ko‘cha ko‘rinishlari) o‘z ichiga olgan 8 ta vazifadan iborat benchmark ishlab chiqildi. Shuningdek, o‘zgarishlar sifatini idrok etish va siyosat nuqtayi nazaridan baholash uchun yangi metrikalar taklif etildi. Ushbu muammoni hal qilish uchun VIDA-GEO — shaharsozlar uchun qarorlarni qo‘llab-quvvatlovchi vosita sifatida xizmat qiladigan ko‘p agentli usul joriy etildi.&lt;/p&gt;\n&lt;h4 id=\"limitations-and-future-work\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#limitations-and-future-work\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Limitations and Future Work&lt;/span&gt;&lt;/a&gt;Limitations and Future Work&lt;/h4&gt;\n&lt;p&gt;Ushbu ish yangi muammoni o‘rtaga tashlagani uchun bir qator cheklovlarga ega. Hozirgi tizimda FLUX modeli tomonidan yaratilgan tahrirlar, ayniqsa sun’iy yo‘ldosh tasvirlari uchun, ko‘pincha sifat tekshiruvidan o‘ta olmaydi, bu esa NanoBanana tizimiga haddan tashqari tayanib qolishga olib keladi. Yopiq kodli modellarni ochiq kodli muqobillari bilan almashtirish mumkin, ammo bu sifatning sezilarli darajada pasayishiga olib keladi. Bundan tashqari, usul maskalar va tahrirlarni qayta-qayta tekshirishga tayanadi, buni yaxshiroq segmentatsiya vositalari yordamida kamaytirish mumkin. Tizim to‘g‘ridan-to‘g‘ri zonalar qonunchiligi yoki qurilish budjetlarini hisobga olmaydi, shuning uchun u yakuniy tizim emas, balki rejalashtiruvchilar uchun dastlabki qarorlarni qo‘llab-quvvatlovchi vosita hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO shaharsozlikda vizual intervensiyalar uchun dastlabki yechimni taqdim etadi, biroq uning to‘liq amaliyotga tatbiq etilishi uchun muhandislik standartlari va budjet cheklovlarini integratsiya qilish talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"benchmark-datastatistics\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#benchmark-datastatistics\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;BENCHMARK DATASTATISTICS&lt;/span&gt;&lt;/a&gt;BENCHMARK DATASTATISTICS&lt;/h4&gt;\n&lt;p&gt;Ma’lumotlar to‘plami global geografiyani qamrab oladi: Shimoliy Amerika (43%), Yevropa (18%), Osiyo (17%), Janubiy Amerika (14%) va Okeaniya (8%). Tasvirlarni tanlash jarayoni avtomatlashtirilgan bo‘lib, mazmunli aralashuv imkonsiz bo‘lgan holatlar (masalan, juda zich shahar hududlari) chiqarib tashlangan. Sun’iy yo‘ldosh tasvirlarining o‘rtacha tarkibi: 57,6% shahar, 41,1% o‘simliklar, 14,6% yo‘l va 18,9% binolar. Ko‘cha ko‘rinishlarida esa osmon (39,9%), binolar (17,4%) va o‘simliklar (15,5%) ustunlik qiladi. 9-jadvalda xavfsizlik, jozibadorlik va ko‘kalamzorlashtirish kabi 8 ta indikator bo‘yicha ballar taqsimoti keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Benchmark — bu turli algoritmlarning samaradorligini yagona shkala bo‘yicha solishtirish uchun ishlatiladigan ma’lumotlar va vazifalar to‘plami.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"haqiqiy-shahar-ozgarishlari-bilan-solishtirish\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#haqiqiy-shahar-ozgarishlari-bilan-solishtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Haqiqiy shahar o'zgarishlari bilan solishtirish&lt;/span&gt;&lt;/a&gt;Haqiqiy shahar o'zgarishlari bilan solishtirish&lt;/h4&gt;\n&lt;p&gt;Mualliflar VIDA-GEO natijalarini real shaharsozlik loyihalari bilan sifat jihatidan solishtirdilar. 9-rasmda ko'rsatilganidek, model piyodalar yo'laklarini yaxshilash, velosiped yo'laklarini qo'shish, piyodalar o'tish joylarini chizish va binolar fasadlarini yangilash kabi amaliy o'zgarishlarni muvaffaqiyatli vizuallashtiradi. Bu o'zgarishlar xavfsizlik va estetik jozibadorlikni oshirishga qaratilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO real shaharsozlik amaliyotlariga mos keladigan vizual o'zgarishlarni taklif qila oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ablatsiya-tadqiqoti-tafsilotlari\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ablatsiya-tadqiqoti-tafsilotlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ablatsiya tadqiqoti tafsilotlari&lt;/span&gt;&lt;/a&gt;Ablatsiya tadqiqoti tafsilotlari&lt;/h4&gt;\n&lt;p&gt;Tizim tarkibiy qismlarining hissasini baholash uchun mualliflar ayrim sub-modullarni (siyosat cheklovchisi, taklif generatori va sifat nazorati modullari) o'chirib, &lt;a href=\"concepts/ablyatsiya.html\"&gt;ablatsiya&lt;/a&gt; tahlilini o'tkazdilar. Har bir vazifa uchun tasodifiy tanlab olingan 10 ta tasvir ishlatildi. Sifat nazorati modullarini o'chirish LLM-hakamning o'rtacha bahosini 77,7% dan 67,1% gacha (tahrirlash nazorati uchun) va 64,2% gacha (segmentatsiya niqobi uchun) pasaytirganini ko'rsatdi. 12-jadvalda keltirilganidek, komponentlari o'chirilgan modellarning 38,3% holatlarida bazaviy ko'rsatkichlar yaxshilanmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ablatsiya tahlili — tizimning har bir qismi yakuniy natijaga qanchalik ta'sir qilishini aniqlash uchun ularni ketma-ket o'chirib ko'rish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"foydalanuvchi-baholash-interfeysi\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#foydalanuvchi-baholash-interfeysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Foydalanuvchi baholash interfeysi&lt;/span&gt;&lt;/a&gt;Foydalanuvchi baholash interfeysi&lt;/h4&gt;\n&lt;p&gt;Insonlar tomonidan baholash jarayonida (10 va 11-rasmlar) ekspertlar tasvirlar juftligini uchta mezon bo'yicha solishtirdilar: maqsadli ko'rsatkichning o'zgarishi, vizual realizm va shaharsozlik siyosatiga muvofiqligi. Diffuziya modellari vizual jihatdan noaniq bo'lgani uchun, baholovchilarga «xavfsizlik» yoki «boylik» kabi tushunchalar uchun aniq ta'riflar berilmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Baholash mezonlariga aniq ta'rif berilmasligi tizim foydasiga bo'lgan tarafkashlikni oldini olish uchun ataylab qilingan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ishning-tasiri-va-cheklovlari\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ishning-tasiri-va-cheklovlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ishning ta'siri va cheklovlari&lt;/span&gt;&lt;/a&gt;Ishning ta'siri va cheklovlari&lt;/h4&gt;\n&lt;p&gt;VIDA-GEO shaharsozlarga qimmatbaho ishlarni boshlashdan oldin o'zgarishlarni vizuallashtirish va solishtirishga yordam beradigan birinchi vositadir. Biroq, tizim muhandislik tadqiqotlari yoki jamoatchilik muhokamalarini almashtirmaydi. Mualliflar model oldindan o'qitilgan algoritmlardan geografik yoki ijtimoiy-iqtisodiy tarafkashlikni meros qilib olishi mumkinligini va taklif etilgan yechimlar yuridik yoki fizik jihatdan amalga oshirib bo'lmasligi mumkinligini ta'kidlaydilar.&lt;/p&gt;\n&lt;h4 id=\"tasvirlar-litsenziyasi\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#tasvirlar-litsenziyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvirlar litsenziyasi&lt;/span&gt;&lt;/a&gt;Tasvirlar litsenziyasi&lt;/h4&gt;\n&lt;p&gt;Mualliflar Google Street View yoki MapBox kabi uchinchi tomon tasvirlarini tarqatmaydilar. Ochiq manbalarga faqat har bir vazifa uchun koordinatalar to'plami joylashtirilgan bo'lib, foydalanuvchilar tasvirlarni o'z litsenziya talablariga muvofiq mustaqil olishlari mumkin.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;VIDA-GEO — bu tasvir va uni yaxshilash bo‘yicha ko‘rsatmani qabul qilib, hudud, tahrir va matnli tavsifdan iborat aniq aralashuv takliflarini ishlab chiquvchi ko‘p agentli tizimdir. Tizim tasvirni bir bosqichda to‘liq tahrirlash o‘rniga, vazifani ixtisoslashgan agentlarga ajratadi, bu esa lokal va atomar o‘zgarishlarni amalga oshirish imkonini beradi. VIDA-GEO quvuri (2-rasmga qarang) to‘rtta agent, baholash va ko‘p davrli orkestrlash mexanizmidan iborat.&lt;/p&gt;\n&lt;h4 id=\"rejalashtirish-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#rejalashtirish-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rejalashtirish agenti&lt;/span&gt;&lt;/a&gt;Rejalashtirish agenti&lt;/h4&gt;\n&lt;p&gt;Rejalashtirish agenti (Planning Agent) tasvirdagi qiziqish hududlarini (ROI) aniqlaydi va ularni tartiblaydi. U fazoviy koordinatalar, chegaralovchi ramkalar va semantik kalit so‘zlarni ishlab chiqadi. Keyingi davrlarda rejalashtiruvchi avvalgi urinishlar xulosasini oladi, bu esa xatolarni takrorlamaslikka yordam beradi.&lt;/p&gt;\n&lt;h4 id=\"siyosat-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#siyosat-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Siyosat agenti&lt;/span&gt;&lt;/a&gt;Siyosat agenti&lt;/h4&gt;\n&lt;p&gt;Siyosat agenti (Policy Agent) har bir ROI uchun fizik va semantik cheklovlarni belgilaydi. Hududlar uch toifaga bo‘linadi: erkin (har qanday o‘zgarish mumkin), cheklangan (qoidalarga rioya qilgan holda) va o‘tkazib yuboriladigan (o‘zgartirilmaydigan infratuzilma). Ko‘cha ko‘rinishidagi tasvirlar uchun agent binolar va kirish joylarining funksional yaxlitligini ta’minlaydi (5a-rasm).&lt;/p&gt;\n&lt;h4 id=\"segmentatsiya-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#segmentatsiya-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Segmentatsiya agenti&lt;/span&gt;&lt;/a&gt;Segmentatsiya agenti&lt;/h4&gt;\n&lt;p&gt;Segmentatsiya agenti (Segmentation Agent) rejalashtiruvchidan olingan ROI asosida obyektlarni ajratib oladi (2-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Segmentatsiya — tasvirdagi piksel guruhlarini ma’lum bir obyektga tegishli deb belgilash jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"segmentatsiya-sifatini-nazorat-qilish-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#segmentatsiya-sifatini-nazorat-qilish-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Segmentatsiya sifatini nazorat qilish agenti&lt;/span&gt;&lt;/a&gt;Segmentatsiya sifatini nazorat qilish agenti&lt;/h4&gt;\n&lt;p&gt;Har bir niqob (mask) LLM asosidagi sifat nazoratidan o‘tadi: qamrov, aniqlik va fragmentatsiya darajasi tekshiriladi. Agar niqob sifatsiz bo‘lsa, tizim qayta aloqa mexanizmi orqali kalit so‘zlarni yangilaydi.&lt;/p&gt;\n&lt;h4 id=\"generatsiya-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#generatsiya-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Generatsiya agenti&lt;/span&gt;&lt;/a&gt;Generatsiya agenti&lt;/h4&gt;\n&lt;p&gt;Generatsiya agenti (Generation Agent) niqob va matnli ko‘rsatmalar yordamida diffuzion tahrirlashni amalga oshiradi. Siyosat agentining cheklovlari matnli so‘rovga kiritiladi. Agar niqobli tahrirlash imkonsiz bo‘lsa, niqobsiz generatsiya modellari qo‘llaniladi.&lt;/p&gt;\n&lt;h4 id=\"generatsiya-sifatini-nazorat-qilish-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#generatsiya-sifatini-nazorat-qilish-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Generatsiya sifatini nazorat qilish agenti&lt;/span&gt;&lt;/a&gt;Generatsiya sifatini nazorat qilish agenti&lt;/h4&gt;\n&lt;p&gt;Natijalar realizm, kontekstual bog‘liqlik va ko‘rsatmalarga rioya qilish bo‘yicha tekshiriladi. Shuningdek, siyosatga muvofiqlik tekshiruvi o‘tkaziladi: masalan, LLM bilimlari asosida shaharsozlik qoidalariga zid bo‘lgan (avtoturargohni turar joyga aylantirish kabi) o‘zgarishlar rad etiladi.&lt;/p&gt;\n&lt;h4 id=\"qayta-aloqa\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#qayta-aloqa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayta aloqa&lt;/span&gt;&lt;/a&gt;Qayta aloqa&lt;/h4&gt;\n&lt;p&gt;Noto‘g‘ri natijalar, jumladan 5c-rasmda ko‘rsatilgan namunalar va ularga tegishli sifat nazorati (QC) fikr-mulohazalari «Generatsiya agenti»ga qaytariladi. Agent tahrirlash jarayonida realizm yetishmasligi, izchillikning buzilishi yoki promptdan chetga chiqish holatlari mavjudligini tahlil qiladi. Shundan so‘ng, «Prompt taklif qilish» sub-agenti navbatdagi urinish uchun qayta ko‘rib chiqilgan tahrirlash promptini ishlab chiqadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qayta aloqa tizimga o‘z xatolaridan saboq olish va generatsiya ko‘rsatmalarini real vaqt rejimida tuzatish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baholash-va-kop-davrli-orkestratsiya\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#baholash-va-kop-davrli-orkestratsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash va ko‘p davrli orkestratsiya&lt;/span&gt;&lt;/a&gt;Baholash va ko‘p davrli orkestratsiya&lt;/h4&gt;\n&lt;p&gt;Har bir qiziqish sohasi (ROI) uchun sifat nazoratidan o‘tgan bir nechta tahrirlangan tasvirlar bo‘lishi mumkin. Barcha qabul qilingan nomzodlar «qora quti» indikatori yordamida baholanadi va asl tasvir bilan solishtiriladi. Nomzodlar ikki ball o‘rtasidagi farq (delta score) asosida reytinglanadi. Bu jarayon bir necha sikl davomida takrorlanadi va har bir sikl natijalari «Rejalashtirish agenti»ga uzatiladi.&lt;/p&gt;\n&lt;p&gt;Agentlarni yangi hududlarni aniqlashga, yangi maskalar yaratishga va muqobil tahrirlarni generatsiya qilishga undash uchun barcha oldingi nomzodlar va ularning delta ballari saqlanib qoladi va keyingi siklga o‘tkaziladi. To‘plangan tarix tizimni muvaffaqiyatsiz strategiyalarni takrorlashdan qaytaradi va turli xil tahrirlash yo‘nalishlarini izlashga &lt;a href=\"concepts/retrieval-augmented-generation.html\"&gt;rag&lt;/a&gt;‘batlantiradi. Natijada, ushbu yondashuv bitta asl tasvirdan bir nechta tahrirlangan variantlarni olish imkonini beradi, ularning har biri belgilangan cheklovlarga rioya qiladi va «qora quti» indikatori ballini yaxshilaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f2.jpg\" alt=\"2-rasm: VIDA-GEO quvurining umumiy ko'rinishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: VIDA-GEO quvurining umumiy ko'rinishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: VIDA-GEO quvurining umumiy ko'rinishi. Tasvir va shahar muhitini yaxshilash bo'yicha maqsadli ko'rsatma berilganda, agentlar guruhi qiziqish sohalarini (ROI) aniqlaydi, segmentlaydi va vazifaga xos cheklovlar bilan tahrirlab, aralashuv variantlarini yaratadi. Sifat tekshiruvlari realizm va siyosatga rioya etilishini baholaydi. Nomzodlar yakunda «qora quti» indikatori tomonidan baholanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f3.jpg\" alt=\"3-rasm: VIDA-GEO va DIFFusion aralashuv natijalarini ko'cha ko'rinishlari (birinchi qatorlar) va havo tasvirlari (oxirgi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: VIDA-GEO va DIFFusion aralashuv natijalarini ko'cha ko'rinishlari (birinchi qatorlar) va havo tasvirlari (oxirgi qator) uchun taqqoslash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: VIDA-GEO va DIFFusion aralashuv natijalarini ko'cha ko'rinishlari (birinchi qatorlar) va havo tasvirlari (oxirgi qator) uchun taqqoslash. VIDA-GEO tomonidan taqdim etilgan aralashuvlar real dunyoda amaliyroq va amalga oshirilishi mumkin, masalan, ikkinchi holatda chorraha atrofida ustunlar va taktil plitalar qo'shish. Bundan tashqari, DIFFusion'dan farqli o'laroq, VIDA-GEO tasvirlar bilan birga matnli ko'rsatmalarni ham taqdim eta oladi, bu foydalanuvchi uchun foydaliroqdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f4.jpg\" alt=\"4-rasm: VIDA-GEO'dan bir nechta ketma-ket tahrirlar bilan foydalanish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: VIDA-GEO'dan bir nechta ketma-ket tahrirlar bilan foydalanish.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: VIDA-GEO'dan bir nechta ketma-ket tahrirlar bilan foydalanish. (a) Tizim turli hududlarda bir nechta tahrirlarni taklif qiladi va indikator ballini oshiradi. Masalan, pastki qatorda u bino fasadini yaxshilaydi, keyin chiroq ustunini, so'ngra yo'l bo'yidagi gullarni qo'shadi va estetik bahoni 29,2% dan 92,4% gacha oshiradi. (b) Ketma-ket iteratsiyalar davomida miqdoriy rivojlanish.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f5.jpg\" alt=\"5-rasm: Muvaffaqiyatsiz holatlar misollari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Muvaffaqiyatsiz holatlar misollari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: Muvaffaqiyatsiz holatlar misollari. (a) tizimimiz chetlab o'tadigan siyosat buzilishlarini ko'rsatadi. (b) sifat nazorati (QC) sub-agenti tomonidan rad etilgan segmentatsiya niqoblarini ko'rsatadi, bunda yuqori tasvir «o'rta qavatli bino»ni, pastki qismi esa «o't-o'lan butalar»ni segmentlaydi. (c) kichik rasmi esa rad etilgan tahrirlarni tasvirlaydi: yuqori tahrir past aniqlikdagi va noreal tahrirni o'z ichiga oladi, pastki tahrir esa noto'g'ri hududni to'ldiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f6.jpg\" alt=\"6-rasm: Segmentatsiya va generatsiya agentlari natijalaridan sifatli misollar, dastlab muvaffaqiyatsiz bo'lgan, ammo key\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Segmentatsiya va generatsiya agentlari natijalaridan sifatli misollar, dastlab muvaffaqiyatsiz bo'lgan, ammo keyinchalik sifat nazoratidan (QC) o'tish uchun tuzatilgan natijalarni ko'rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f6-2.jpg\" alt=\"Rasm 6 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f7.jpg\" alt=\"7-rasm: Oltita Street View idrok vazifasi bo‘yicha VIDA-GEO ning ketma-ket tahrirlash xatti-harakati.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Oltita Street View idrok vazifasi bo‘yicha VIDA-GEO ning ketma-ket tahrirlash xatti-harakati.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm: Oltita Street View idrok vazifasi bo‘yicha VIDA-GEO ning ketma-ket tahrirlash xatti-harakati. Har bir panelda maqsadga muvofiq idrok etishning o‘rtacha balli, shuningdek, 10 ta kiruvchi ma’lumotlarning ketma-ket tahrirlari bo‘yicha Qwen3-VL ning realizm, siyosatni saqlash, vizual sifat va o‘rtacha LLM-Judge baholari keltirilgan. «Zerikarli» (Boring) va «Tushkun» (Depressing) toifalari uchun dastlabki idrok etish balli teskari aylantirilgan (10 − dastlabki ball), shunda yuqoriroq qiymatlar maqsad sari olg‘a siljishni izchil ko‘rsatadi. Kiruvchi tasvir uchun tahrirlash hech qanday maqbul nomzod sifat nazoratidan o‘tmaganda yoki maqsadga erishilganda to‘xtatiladi; to‘xtatilgan kiruvchi ma’lumotlar keyingi kogorta o‘rtacha ko‘rsatkichlarida o‘zlarining oxirgi qabul qilingan natijalarini saqlab qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f8.jpg\" alt=\"8-rasm: Kontrafakt sahna tahrirlari va tegishli prediktor chiqishlari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Kontrafakt sahna tahrirlari va tegishli prediktor chiqishlari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-rasm: Kontrafakt sahna tahrirlari va tegishli prediktor chiqishlari. VIDA-GEO ikkita alohida tahrirlash yo‘nalishi orqali bir xil Street View tasvirining muqobil versiyalarini yaratadi. O‘simliklar olib tashlanganda va atrof-muhit holati yomonlashganda, «go‘zallik» (black-box) prediktori tobora pastroq ballarni belgilaydi. Ballarning izchil va tushunarli o‘zgarishlari shuni ko‘rsatadiki, prediktor kontrafakt aralashuvlar ostida sahnaning mazmunli atributlarini qamrab oladi, bu esa uning dunyo modeli komponenti sifatida ishlatilishini qo‘llab-quvvatlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f9.jpg\" alt=\"9-rasm: VIDA-GEO aralashuvlarining real dunyodagi o‘zgarishlar bilan sifatli taqqoslanishi. Chapdan o‘ngga: asl sahna, k\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm: VIDA-GEO aralashuvlarining real dunyodagi o‘zgarishlar bilan sifatli taqqoslanishi. Chapdan o‘ngga: asl sahna, kuzatilgan real aralashuv va VIDA-GEO tomonidan yaratilgan aralashuv. Yuqoridagi misolda VIDA-GEO piyodalar o‘tish joyi, yo‘lak va teatr peshlavhasini xuddi shunday yaxshilaydi; pastki misolda esa u real aralashuvda kuzatilganiga o‘xshash velosiped yo‘lagini kiritadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f10.jpg\" alt=\"10-rasm: Inson baholovchilarga berilgan ko‘rsatmalar. Ko‘rsatmalar foydalanuvchilar bizning usulimizni tanlashda tarafka\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm: Inson baholovchilarga berilgan ko‘rsatmalar. Ko‘rsatmalar foydalanuvchilar bizning usulimizni tanlashda tarafkashlik qilmasliklari uchun ataylab sodda saqlangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f10-2.jpg\" alt=\"Rasm 10 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 10 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f11.jpg\" alt=\"11-rasm: Inson annotatorlariga ko‘rsatilgan savollar bilan foydalanuvchi interfeysi. Ularga tasodifiy ravishda eng yaxsh\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-rasm: Inson annotatorlariga ko‘rsatilgan savollar bilan foydalanuvchi interfeysi. Ularga tasodifiy ravishda eng yaxshi natija beruvchi DIFFusion aralashuvi va eng yaxshi VIDA-GEO aralashuvi ko‘rsatiladi hamda indikator, idrok sifati va siyosatga muvofiqlik haqida uchta savol beriladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-fS1-2.jpg\" alt=\"Rasm S1 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Shahar simulya&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tsiyalarining&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qimmatligi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;VIDA-GEO ko'p&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;agentli tizimi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Realistik&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qayta&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;rejalashtirish&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;var
