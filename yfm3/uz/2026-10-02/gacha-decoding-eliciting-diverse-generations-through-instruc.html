        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"246\" cy=\"78\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"574\" cy=\"258\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Zarlar bilan rejalashtirish:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;neyron tarmoqlarni xilma-xil&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;javoblar berishga majburlash&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/gacha-decoding.html\"&gt;Gacha Decoding&lt;/a&gt; usuli kontent yaratishni tokenlar ehtimolligidan ko'rsatmalarga amal qilish sohasiga o'tkazadi. Modelning ichki entropiyasiga tayanmasdan, tizim g'oyalarni tanlash uchun tashqi tasodifiylikdan foydalanadi. Bu hatto bir xillikka moyil bo'lgan modellardan ham sifatli va xilma-xil javoblar olish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Usul modelning token entropiyasiga emas, g'oyalarni tanlash uchun tashqi tasodifiylikka tayanadi.&lt;/li&gt;\n&lt;li&gt;Javoblar xilma-xilligi model quvvati bilan birga o'sadi, bu sifat va xilma-xillik o'rtasidagi ziddiyatni yo'q qiladi.&lt;/li&gt;\n&lt;li&gt;Samaradorlik chat, ijodiy yozish, tasvir yaratish va oqsil dizayni kabi sohalarda isbotlangan.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;An'anaviy til modellari ko'pincha javoblarning «torayishi» muammosiga duch keladi, bunda model sifati oshgani sayin ijodkorlik pasayadi. Gacha Decoding usuli bu muammoni generatsiya jarayonini bosqichlarga ajratish orqali hal qiladi: semantik o'qlarni rejalashtirish, variantlarni sanab o'tish va tashqi tasodifiy sonlar generatori (&lt;a href=\"concepts/random-number-generator.html\"&gt;RNG&lt;/a&gt;) yordamida bittasini tanlash. Bu jarayonni «g'oyalar makoni»dagi avtoregressiv jarayonga aylantiradi, bunda har bir qaror avvalgilariga bog'liq bo'ladi.&lt;/p&gt;\n&lt;p&gt;Tadqiqot shuni ko'rsatdiki, ushbu yondashuv &lt;a href=\"concepts/vendi-score.html\"&gt;Vendi Score&lt;/a&gt; metriki bo'yicha mavjud xilma-xillik usullaridan 2,4 baravar ustunlik qiladi. Sifatli natijaga erishish uchun zarur bo'lgan tanlovlar soni 11 baravar qisqaradi. Usul har qanday model ustidan qo'shimcha qatlam sifatida ishlaydi va uning ko'rsatmalarga amal qilish qobiliyatidan foydalanib, yakuniy matnga aylanadigan xilma-xil rejalarni shakllantiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul rejalashtirish va variantlarni sanab o'tish uchun modelga qo'shimcha so'rovlarni talab qiladi, bu esa generatsiya vaqtini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Biz Gacha Decoding usulini taqdim etamiz — bu model ishlash vaqtidagi (inference-time) usul bo‘lib, til modellaridan (LM) turli xil javoblarni olish imkonini beradi va model quvvati ortishi bilan birga masshtablanadi. Usul ochiq domenlarda: kundalik suhbatlar, ijodiy yozish, tasvirlarni generatsiya qilishni rejalashtirish va oqsillar dizaynida yuqori samaradorlik ko‘rsatdi. Gacha Decoding sifatni saqlab qolgan holda xilma-xillik bo‘yicha mavjud yondashuvlardan ustun keladi (Vendi ko‘rsatkichi bo‘yicha eng yaxshi muqobil usuldan 2.4 barobar yaxshiroq) va 11 barobar kamroq namunalar bilan sifatli modalar soniga erishadi. Asosiy g‘oya xilma-xillikni ko‘rsatmalarga amal qilish (instruction-following) vazifasi sifatida qayta ko‘rib chiqishdir: tokenlar entropiyasiga tayanmasdan, biz modelning ko‘rsatmalarga amal qilish qobiliyatini tashqi tasodifiy sonlar generatori (RNG) bilan birlashtiramiz. Ushbu «zarlar bilan rejalashtirish» yondashuvi xilma-xillik va model qobiliyati o‘rtasidagi ziddiyatni bartaraf etadi. Asosiy LM ko‘rsatmalarga amal qilishda yaxshilangani sari, Gacha Decoding yordamida xilma-xillik tokenlar entropiyasi pasaysa ham doimiy ravishda ortib boradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding javoblar xilma-xilligini 2.4 barobar oshiradi va zarur namunalar sonini 11 barobar qisqartiradi, generatsiya jarayonini ko‘rsatmalarga amal qilish vazifasiga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-rasmda usulning Verbalized Sampling yondashuvi bilan solishtirganda ishlashi ko‘rsatilgan. Gacha Decoding noyob matnli promptlarni shakllantirish uchun tashqi tasodifiy parametrlardan foydalanadi, bu esa modelga yanada xilma-xil vizual konsepsiyalarni yaratish imkonini beradi. Modelning ichki ehtimollik noaniqligiga tayanadigan standart usullardan farqli o‘laroq, Gacha Decoding jarayonni tashqi ko‘rsatmalar orqali faol boshqaradi, bu InfinityChat ma’lumotlar to‘plamidagi natijalar bilan tasdiqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vendi Score — bu generatsiyalar xilma-xilligini baholash uchun ishlatiladigan metrika bo‘lib, yuqori qiymatlar noyob va sifatli javoblar spektrining kengligini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"til-modellarida-xilma-xillik-muammosi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#til-modellarida-xilma-xillik-muammosi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Til modellarida xilma-xillik muammosi&lt;/span&gt;&lt;/a&gt;Til modellarida xilma-xillik muammosi&lt;/h4&gt;\n&lt;p&gt;Zamonaviy til modellari (LM) ijodiy va tadqiqot vazifalari uchun tobora ko‘proq foydalanilmoqda, ammo ularda insoniy xilma-xillik va yangilik yetishmaydi. Hatto ochiq so‘rovlarda ham modellar odatiy javoblar to‘plamiga tushib qoladi. Bu foydalanuvchilar uchun foydalilikni kamaytiradi, sintetik ma’lumotlarni yaxshilash imkoniyatlarini cheklaydi va uzoq muddatda fikrlashning bir xillashishiga olib keladi. Ilgari tadqiqotchilar bu muammoni tokenlar taqsimoti entropiyasini o‘zgartirish (namuna olish parametrlarini o‘zgartirish, maxsus yo‘qotish funksiyalari yoki o‘quv ma’lumotlarini tanlash) orqali hal qilishga urinishgan. Biroq, bu yondashuv ziddiyatni keltirib chiqaradi: model sifatini oshirish usullari ko‘pincha entropiyani kamaytiradi, natijada model qobiliyati o‘sishi bilan xilma-xillik pasayadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mualliflar sifat va xilma-xillik o‘rtasidagi ziddiyat fundamental emasligini isbotlab, xilma-xillikni token entropiyasi emas, balki ko‘rsatmalarga amal qilish (instruction following, IF) muammosi sifatida ko‘rib chiqishni taklif qilishadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gacha-decoding-usuli\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-decoding-usuli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha Decoding usuli&lt;/span&gt;&lt;/a&gt;Gacha Decoding usuli&lt;/h4&gt;\n&lt;p&gt;Mualliflar Gacha Decoding usulini taqdim etadilar — bu modelning ko‘rsatmalarga amal qilish qobiliyatini tashqi tasodifiy sonlar generatori (RNG) bilan birlashtiruvchi &lt;a href=\"concepts/inferens.html\"&gt;inferens&lt;/a&gt; usuli. Har bir tokenni tanlashda tasodifiylikka tayanish o‘rniga, model «zarlar bilan rejalashtiradi» (2-rasmga qarang). Har qanday vazifa uchun model avval semantik qarorlar ketma-ketligini (masalan, hikoyadagi personajlar yoki muhitni) belgilaydi, so‘ngra tashqi RNG yordamida o‘zi taklif qilgan variantlardan birini tanlaydi. Har bir qaror avvalgilariga bog‘liq bo‘lib, bu o‘zgaruvchanlikning kombinatorik tarzda to‘planishiga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding — bu model ustidagi yengil qobiq bo‘lib, u avtoregressiv generatsiyani tokenlar darajasidan g‘oyalar darajasiga ko‘chiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ijodiy yozish, tasvir yaratishni rejalashtirish va oqsil dizayni bo‘yicha o‘tkazilgan tajribalarda Gacha Decoding mavjud usullardan ustun keldi va Vendi-score metriki bo‘yicha 2,4 baravargacha xilma-xillik o‘sishini ta’minladi (1A-rasm). Eng muhimi, Gacha Decoding xilma-xilligi model quvvati bilan birga o‘sadi, hatto standart usullar pasayish ko‘rsatgan taqdirda ham (1B-rasm). Usul hatto deterministik &lt;a href=\"concepts/greedy-decoding.html\"&gt;ochko‘z dekodlash&lt;/a&gt; (greedy decoding) sharoitida ham samarali ishlaydi.&lt;/p&gt;\n&lt;h4 id=\"umumiy-korinish-gacha-decoding-nima\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#umumiy-korinish-gacha-decoding-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish: Gacha Decoding nima?&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish: Gacha Decoding nima?&lt;/h4&gt;\n&lt;p&gt;Biz til modellaridan (LM) turli xil generatsiyalarni olish uchun Gacha Decoding usulini taqdim etamiz. Asosiy g'oya modelning mantiqiy fikrlash jarayonini tasodifiylik bilan boyitishdir. Jarayon ikki bosqichdan iborat: model natijaga ta'sir qiluvchi qarorlar ketma-ketligini belgilaydi, so'ngra har bir qaror mumkin bo'lgan variantlarni sanab o'tish va tashqi tasodifiy sonlar generatori (RNG) yordamida tanlash orqali amalga oshiriladi. Masalan, it haqida hikoya yozishda model avval muhitni (masalan, zamonaviy shahar yoki tarixiy Yaponiya) «tasodifiy tanlash» orqali belgilaydi. Keyingi qarorlar, masalan, itning roli yoki hikoya nuqtai nazari, ushbu tanlovga bog'liq bo'ladi, bu esa syujet shakllanishi davomida xilma-xillikning to'planishiga imkon beradi. Gacha Decoding xilma-xillik manbasini tokenlar entropiyasidan ko'rsatmalarga amal qilishga o'tkazadi. Amalda, bu g'oyalar fazosidagi randomizatsiyalangan avtoregressiv jarayon bo'lib, uni mavjud model ustiga agentlik qatlami sifatida o'rnatish mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding tokenlarning ehtimollik taqsimotiga tayanmasdan, tashqi tasodifiy tanlovlar yordamida qarorlar qabul qilish orqali generatsiya xilma-xilligini ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"korsatmalarga-amal-qilish-va-rejalashtirish-orqali-xilma-xillik\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#korsatmalarga-amal-qilish-va-rejalashtirish-orqali-xilma-xillik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'rsatmalarga amal qilish va rejalashtirish orqali xilma-xillik&lt;/span&gt;&lt;/a&gt;Ko'rsatmalarga amal qilish va rejalashtirish orqali xilma-xillik&lt;/h4&gt;\n&lt;p&gt;Biz usulning ishlashini ta'minlovchi uchta asosiy dizayn elementini ajratib ko'rsatamiz: semantik g'oyalar fazosida ishlash, variantlarni sanab o'tish va tanlash bosqichlarini ajratish hamda jarayonning avtoregressiv tabiati. 1-algoritmda ko'rsatilganidek, jarayon ikki fazaga bo'linadi. Birinchi fazada model javobni shakllantiradigan T ta semantik qaror o'qlarini belgilaydi, bunda ularning aniq qiymatlari hali belgilanmaydi. Ikkinchi fazada, t=1 dan T gacha bo'lgan har bir &lt;a href=\"concepts/step.html\"&gt;qadam&lt;/a&gt; uchun model joriy a_t o'qi uchun promptega va oldin qabul qilingan z&amp;lt;t qarorlarga asoslanib, C_t to'plamdagi mantiqiy va semantik jihatdan farqli variantlarni sanab o'tadi. Keyin tashqi RNG yordamida C_t to'plamidan z_t varianti bir xil ehtimollik bilan tanlab olinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Semantik g'oyalar fazosi — bu model alohida so'zlar yoki tokenlar bilan emas, balki tushunchalar (masalan, «muhit» yoki «personaj xarakteri») bilan ishlaydigan abstraksiya darajasidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"goyalar-fazosida-ishlash\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#goyalar-fazosida-ishlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G'oyalar fazosida ishlash&lt;/span&gt;&lt;/a&gt;G'oyalar fazosida ishlash&lt;/h4&gt;\n&lt;p&gt;Javobni shakllantirish jarayoni uch bosqichdan iborat: qarorlarni yakuniy rejaga birlashtirish, tashqi tasodifiy sonlar generatori (TSG) yordamida bitta rejani tanlash va tanlangan reja asosida y matnini yaratish. Yakuniy javob ehtimolligi &lt;span class=\"yfm-latex\" data-content=\"p(y%2F%20x)%20%3D%20%5Cprod_%7Bt%3D1%7D%5E%7BT%7D%20p_%20heta(y_t%2F%20x%2C%20y_%7B%3Ct%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi bilan aniqlanadi. Tokenlarni standart tanlash usuli cheklangan, chunki u model entropiyasiga bog'liq va semantik xilma-xillikni to'liq qamrab olmaydi. Mualliflar z latent o'zgaruvchisini (g'oya yoki reja) kiritib, yuqori darajadagi semantika va sirtqi realizatsiyani &lt;span class=\"yfm-latex\" data-content=\"p(y%2F%20x)%20%3D%20%5Cint%20p_%20heta(y%2F%20z%2C%20x)%20q(z%2F%20x)%20dz\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi orqali ajratadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding usuli xilma-xillikni tokenlar darajasidan semantik rejalar darajasiga o'tkazadi va tanlov uchun tashqi tasodifiylikdan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modelning o'zi reja z ni to'g'ridan-to'g'ri generatsiya qiladigan usullardan farqli o'laroq, Gacha Decoding modeldan C xil variantlar to'plamini sanab o'tishni so'raydi va tanlovni tashqi TSG ga topshiradi. Bu modelning ko'rsatmalarga amal qilish (IF) qobiliyatidan foydalanishga imkon beradi. Kontekst oynasi cheklovlarini chetlab o'tish uchun mualliflar g'oyalarni avtoregressiv tanlashni qo'llaydilar: &lt;span class=\"yfm-latex\" data-content=\"q(z%2F%20x)%20%3D%20%5Cprod_%7Bt%3D1%7D%5E%7BT%7D%20q(z_t%2F%20x%2C%20z_%7B%3Ct%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Bu har bir keyingi tanlov avvalgisiga bog'liq bo'lgan kombinatorik traektoriyalarni yaratishga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Avtoregressiv tanlash — bu qarorlarni bosqichma-bosqich qabul qilish jarayoni bo'lib, har bir qadam oldingi natijalarga asoslanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimental-sozlamalar\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#eksperimental-sozlamalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Eksperimental sozlamalar&lt;/span&gt;&lt;/a&gt;Eksperimental sozlamalar&lt;/h4&gt;\n&lt;p&gt;Gacha Decoding samaradorligi uchta sohada sinovdan o'tkaziladi: chat-botlar, ijodiy yozish va tasvirlarni generatsiya qilish uchun promptlarni qayta yozish, shuningdek oqsillar dizayni bo'yicha pilot tadqiqot. Har bir x_i prompt uchun N ta javob to'plami yaratiladi. Sifat «sifat bo'yicha filtrlangan» xilma-xillik ko'rsatkichi orqali baholanadi: faqat sifati standart to'g'ridan-to'g'ri tanlashdagi o'rtacha ko'rsatkichning 95% dan yuqori bo'lgan javoblar hisobga olinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xilma-xillik ko'rsatkichi past sifatli javoblar hisobiga sun'iy ravishda oshib ketmasligi uchun sifat bo'yicha normallashtiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modellar,-bazaviy-liniyalar-va-oldingi-yondashuvlar\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#modellar,-bazaviy-liniyalar-va-oldingi-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modellar, bazaviy liniyalar va oldingi yondashuvlar&lt;/span&gt;&lt;/a&gt;Modellar, bazaviy liniyalar va oldingi yondashuvlar&lt;/h4&gt;\n&lt;p&gt;Biz GachaDecoding samaradorligini baholash uchun bir qator mavjud diversifikatsiya usullari bilan solishtirdik. Birinchisi, standart va yuqori (1.5) haroratda to‘g‘ridan-to‘g‘ri namuna olish (Direct sampling). Ikkinchisi, «ro‘yxatli promptlash» (List prompting) bo‘lib, unda modelga bir martalik generatsiyada k ta turlicha javob berish buyuriladi; avvalgi javoblar kontekstda qolgani uchun model takrorlanishdan qochadi. Shuningdek, biz «verbalizatsiyalangan namuna olish» (Verbalized Sampling) usulini qo‘lladik, bunda model k ta javob va ularning ehtimolliklarini bir vaqtda chiqaradi. «To‘g‘ridan-to‘g‘ri rejalashtirish» (Direct Planning) esa jarayonni ikki bosqichga ajratadi: 1.2 haroratda yuqori darajadagi reja tuzish va unga asoslanib yakuniy javobni shakllantirish. Bundan tashqari, tasodifiy ASCII satrlari yordamida «sid-promptlash» (Seed Prompting) va oldindan belgilangan to‘plamdan tanlangan personajlar yordamida «persona-promptlash» (Persona Prompting) usullari sinab ko‘rildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Persona-promptlash» usuli tasodifiy belgilar ketma-ketligidan farqli o‘laroq, mazmunli rollar orqali javoblar xilma-xilligini boshqaradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baholangan-modellar\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#baholangan-modellar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholangan modellar&lt;/span&gt;&lt;/a&gt;Baholangan modellar&lt;/h4&gt;\n&lt;p&gt;Biz ochiq (GPT-OSS, Inkling, Qwen 3.5 oilalari) va yopiq (Claude Opus 4.8, GPT 5.5) til modellarini baholadik. Barcha holatlarda «fikrlash rejimi» (thinking mode) va tavsiya etilgan parametrlar ishlatildi. API modellarida fikrlash rejimi bilan haroratni o‘zgartirib bo‘lmasligi sababli, yuqori haroratni talab qiladigan usullar ular uchun qo‘llanilmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cheklov: API modellarida fikrlash rejimida haroratni sozlash imkoniyati yo‘qligi sababli, ba'zi usullar ularda qo‘llanilmadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ochiq-baholash-domenlari\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#ochiq-baholash-domenlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ochiq baholash domenlari&lt;/span&gt;&lt;/a&gt;Ochiq baholash domenlari&lt;/h4&gt;\n&lt;p&gt;Javoblar sifati va xilma-xilligi uchta sohada o‘lchandi. «In-the-wild chat» uchun InfinityChat ma'lumotlar to‘plami ishlatildi. Xilma-xillik javoblar embeddinglari orasidagi masofa (Vendi score) bilan, sifati esa LM-judge orqali o‘lchandi. Ijodiy yozish (Creative writing) bo‘yicha WildChat asosida hikoyalar 0–20 ball tizimida baholandi. Xilma-xillik sakkizta semantik atribut (janr, syujet, qahramon va h.k.) bo‘yicha Vendi score makro-o‘rtachasi orqali hisoblandi, bu esa leksik farqlardan ko‘ra mazmuniy o‘zgarishlarni yaxshiroq aks ettiradi.&lt;/p&gt;\n&lt;p&gt;Tasvir generatsiyasida foydalanuvchi prompti x ni x' ga kengaytirish bosqichida usullar sinaldi. OneIGBench promptlari va Qwen-Image-2512 modeli ishlatildi. Sifat asl promptga mosligi bilan, xilma-xillik esa DreamSim embeddinglari bo‘yicha Vendi score bilan o‘lchandi. Asosiy natijalar Rasm 3 da keltirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Semantik atributlar bo‘yicha Vendi score va DreamSim embeddinglarini qo‘llash mazmuniy xilma-xillikni aniq o‘lchash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gacha-decoding-ustunligi-va-masshtablanishi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-decoding-ustunligi-va-masshtablanishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha Decoding ustunligi va masshtablanishi&lt;/span&gt;&lt;/a&gt;Gacha Decoding ustunligi va masshtablanishi&lt;/h4&gt;\n&lt;p&gt;Gacha Decoding mavjud yondashuvlardan sezilarli darajada ustun keladi va bu farq generatsiya hajmi oshgani sayin ortib boradi. Asosiy natija shundaki, usul sifatni saqlab qolgan holda xilma-xillikni keskin oshiradi. Masalan, Opus 4.8 modelida har bir so‘rov uchun 256 ta generatsiya bilan Gacha Decoding to‘g‘ridan-to‘g‘ri namuna olishga (direct sampling) nisbatan sifat bilan nazorat qilinadigan xilma-xillikni 7,1 barobarga oshiradi. Samaradorlik nuqtai nazaridan, usul «list prompting» bazaviy usuliga qaraganda 4,7 barobar kamroq generatsiyalarni talab qiladi (3-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding persona prompting usuliga nisbatan 11,0 barobar, boshqa usullarga nisbatan esa 38 barobargacha yuqori samaradorlikni ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Usul boshqa usullar yetib bora olmaydigan yangi javob turlarini kashf etish imkonini beradi. Masalan, Singapurdagi kvartira haqida dahshatli hikoya yozish so‘ralganda, Gacha Decoding ikkinchi shaxs nomidan hikoyalar yaratadi, boshqa usullar esa uchinchi shaxs bilan cheklanib qoladi (S6-rasm). Tasvir generatsiyasida xilma-xillik vizual jihatdan yaqqol ko‘rinadi (1-rasm).&lt;/p&gt;\n&lt;h4 id=\"gacha-if-qobiliyatlari-bilan-masshtablanadi-va-ochkoz-dekodlashda-ham-ishlaydi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-if-qobiliyatlari-bilan-masshtablanadi-va-ochkoz-dekodlashda-ham-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha IF qobiliyatlari bilan masshtablanadi va ochko‘z dekodlashda ham ishlaydi&lt;/span&gt;&lt;/a&gt;Gacha IF qobiliyatlari bilan masshtablanadi va ochko‘z dekodlashda ham ishlaydi&lt;/h4&gt;\n&lt;p&gt;Usul modelning token entropiyasiga emas, balki ko‘rsatmalarga ergashish (Instruction Following, IF) qobiliyatiga tayanadi. Bu shuni anglatadiki, modelning IF qobiliyati oshishi bilan xilma-xillik ham ortadi va hatto ochko‘z dekodlash (greedy decoding) holatida ham saqlanib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ochko‘z dekodlash (greedy decoding) — model har doim eng yuqori ehtimollikka ega tokenni tanlaydigan jarayon bo‘lib, u odatda javoblarni bir xil va deterministik qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"if-qobiliyatlari-bilan-masshtablanish\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#if-qobiliyatlari-bilan-masshtablanish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IF qobiliyatlari bilan masshtablanish&lt;/span&gt;&lt;/a&gt;IF qobiliyatlari bilan masshtablanish&lt;/h4&gt;\n&lt;p&gt;To‘g‘ridan-to‘g‘ri namuna olishdan farqli o‘laroq, Gacha Decoding IF qobiliyatlari bilan ijobiy korrelyatsiyani ko‘rsatadi. Qwen 3.5 modellari (2B dan 27B gacha) va IFBench metriklari yordamida o‘tkazilgan sinovlar (4-rasm) shuni ko‘rsatadiki, to‘g‘ridan-to‘g‘ri namuna olishda model kuchi oshishi bilan xilma-xillik pasayadi, Gacha Decoding esa barcha domenlarda barqaror o‘sishni namoyish etadi. Usul «list prompting» kabi yondashuvlarning cheklovlarini yengib o‘tadi, chunki u tashqi tasodifiy sonlar generatori (RNG) bilan g‘oyalar fazosida avtoregressiyadan foydalanadi.&lt;/p&gt;\n&lt;h4 id=\"ochkoz-dekodlashda-xilma-xillik\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#ochkoz-dekodlashda-xilma-xillik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ochko‘z dekodlashda xilma-xillik&lt;/span&gt;&lt;/a&gt;Ochko‘z dekodlashda xilma-xillik&lt;/h4&gt;\n&lt;p&gt;Hatto ochko‘z dekodlash rejimida ham (Qwen 3.5 27B, GPT-OSS va Inkling modellarida) Gacha Decoding yuqori xilma-xillikni saqlab qoladi va ko‘pincha haroratli namuna olish (temperature sampling) bilan ishlaydigan bazaviy usullardan ustun keladi. Ro‘yxatga asoslangan usullar esa entropiyasiz keskin samarasiz bo‘lib qoladi (S3-jadval).&lt;/p&gt;\n&lt;h4 id=\"oqsil-dizayni-boyicha-amaliy-tadqiqot\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#oqsil-dizayni-boyicha-amaliy-tadqiqot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oqsil dizayni bo‘yicha amaliy tadqiqot&lt;/span&gt;&lt;/a&gt;Oqsil dizayni bo‘yicha amaliy tadqiqot&lt;/h4&gt;\n&lt;p&gt;Biz Gacha Decoding usulini de novo oqsil bog‘lovchilarini (binders) loyihalashda qo‘lladik. Zamonaviy generativ modellar ko‘pincha tor doiradagi strukturaviy foldlar bilan cheklanib qoladi. GPT 5.5 yordamida biz sakkizta nishon (jumladan, PD-1) uchun oqsil tavsiflarini yaratdik va ularni belgilangan model yordamida komplekslarga aylantirdik. Interfeys sifati &lt;a href=\"concepts/ipsaemin.html\"&gt;ipSAEmin&lt;/a&gt; orqali baholanib, faqat 0,5 dan yuqori ko‘rsatkichga ega variantlar tanlab olindi. Strukturaviy xilma-xillik TM-score asosida Vendi-score yordamida o‘lchandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding ipSAEmin &amp;gt; 0,5 sifat chegarasidan o‘tgan dizaynlar orasida eng yuqori strukturaviy xilma-xillikni (Vendi-score) ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5-rasmda ko‘rsatilganidek, Gacha Decoding verbal va ro‘yxatli prompt usullaridan ustun keladi. Masalan, PD-1 nishoni uchun Gacha aralash α/β-strukturaga ega oqsillarni yaratsa, bazaviy usullar faqat α-spiral foldlar bilan cheklanib qoladi.&lt;/p&gt;\n&lt;h4 id=\"tahlil-nima-uchun-gacha-decoding-ishlaydi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#tahlil-nima-uchun-gacha-decoding-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tahlil: Nima uchun Gacha Decoding ishlaydi?&lt;/span&gt;&lt;/a&gt;Tahlil: Nima uchun Gacha Decoding ishlaydi?&lt;/h4&gt;\n&lt;p&gt;Biz usulning uchta asosiy yechimini ablyatsion tahlil qildik (A.4-ilova): (A) tokenlar emas, g‘oyalar bo‘yicha randomizatsiya; (B) variantlar ro‘yxatidan tanlash uchun tashqi tasodifiy sonlar generatori (RNG); (C) g‘oyalarni avtoregressiv tanlash. Sinovlar GPT-OSS-120B va Opus 4.8 modellarida o‘tkazildi (1-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ablyatsiya — bu tizimning har bir qismini alohida o‘chirib ko‘rish orqali uning yakuniy natijaga ta’sirini baholash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tashqi RNG ishlatilmagan variant (no-RNG) xilma-xillikni deyarli ikki baravar kamaytiradi: modellar ro‘yxatdagi o‘rtacha variantlarni tanlashga moyil bo‘lib, insonlarnikiga o‘xshash kognitiv xatoliklarni namoyon etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barcha variantlar (idea-list, independent axes, no-RNG) Gacha Decoding’dan pastroq natija ko‘rsatdi, bu esa har bir bosqichning muhimligini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Dekodlash usullarini taqqoslash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Usul&lt;/th&gt;\n&lt;th&gt;Qiymat 1&lt;/th&gt;\n&lt;th&gt;Qiymat 2&lt;/th&gt;\n&lt;th&gt;Qiymat 3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(A) Tokenlar emas, g'oyalar bo'yicha randomizatsiya&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;10.08&lt;/td&gt;\n&lt;td&gt;9.44&lt;/td&gt;\n&lt;td&gt;9.23&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Standardtokensampling(T=1)&lt;/td&gt;\n&lt;td&gt;2.41&lt;/td&gt;\n&lt;td&gt;5.25&lt;/td&gt;\n&lt;td&gt;4.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=10)&lt;/td&gt;\n&lt;td&gt;3.28&lt;/td&gt;\n&lt;td&gt;3.07&lt;/td&gt;\n&lt;td&gt;4.66&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=20)&lt;/td&gt;\n&lt;td&gt;3.46&lt;/td&gt;\n&lt;td&gt;0.44&lt;/td&gt;\n&lt;td&gt;4.93&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=10)&lt;/td&gt;\n&lt;td&gt;3.19&lt;/td&gt;\n&lt;td&gt;0.31&lt;/td&gt;\n&lt;td&gt;4.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=20)&lt;/td&gt;\n&lt;td&gt;2.15&lt;/td&gt;\n&lt;td&gt;0.03&lt;/td&gt;\n&lt;td&gt;4.99&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(B) Sanash va tanlashni ajratish orqali tanlanma&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;10.61&lt;/td&gt;\n&lt;td&gt;10.08&lt;/td&gt;\n&lt;td&gt;8.21&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NoexternalRNG(LMselectschoicesfromitslist)&lt;/td&gt;\n&lt;td&gt;5.34&lt;/td&gt;\n&lt;td&gt;6.75&lt;/td&gt;\n&lt;td&gt;5.46&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Noenumeration(directlypromptLMfordecision)&lt;/td&gt;\n&lt;td&gt;5.73&lt;/td&gt;\n&lt;td&gt;7.50&lt;/td&gt;\n&lt;td&gt;5.50&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(C) G'oyalarni avtoregressiv mahalliy qarorlar sifatida tanlash&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"bogliq-ishlar-til-modellarining-xilma-xillik-muammosi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#bogliq-ishlar-til-modellarining-xilma-xillik-muammosi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog‘liq ishlar: til modellarining xilma-xillik muammosi&lt;/span&gt;&lt;/a&gt;Bog‘liq ishlar: til modellarining xilma-xillik muammosi&lt;/h4&gt;\n&lt;p&gt;Adabiyotlar til modellarining generatsiyalarida xilma-xillik yetishmasligini tasdiqlaydi, bu esa ijodiy va ilmiy vazifalarda foydalilikni kamaytiradi. Muammo shundaki, post-trening ko‘pincha token entropiyasini pasaytiradi. Biz bu qarama-qarshilik fundamental emasligini ko‘rsatamiz va natijalarning xilma-xilligini oshirish uchun ko‘rsatmalarga amal qilish (IF) imkoniyatlaridan foydalanamiz.&lt;/p&gt;\n&lt;h4 id=\"xilma-xillikni-oshirish-yondashuvlari\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#xilma-xillikni-oshirish-yondashuvlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xilma-xillikni oshirish yondashuvlari&lt;/span&gt;&lt;/a&gt;Xilma-xillikni oshirish yondashuvlari&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar generatsiya xilma-xilligini oshirish usullarini ikki toifaga ajratadilar: o‘qitish va xulosa chiqarish (inference) bosqichidagi aralashuvlar. O‘qitish usullari til modelining (LM) tokenlar taqsimotini o‘zgartirishga qaratilgan. Bunga o‘quv ma’lumotlarini saralash yoki modelni qayta o‘qitish jarayonida maxsus yo‘qotish funksiyalarini (loss functions) joriy etish orqali erishiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O‘qitish bosqichidagi aralashuv — bu modelning ma’lumotlar yoki keyingi tokenni bashorat qilish qoidalari orqali «dunyoqarashini» o‘zgartirishdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xulosa chiqarish usullari an’anaviy ravishda namuna olish (sampling) jarayonini qayta shakllantiradi. Yaqinda e’tibor generatsiyani kontekstual signallar orqali boshqarishga o‘tdi: boshlang‘ich parametrlar (seeds), personajlar yoki ish rejimi ko‘rsatmalari orqali. Bizning ishimizga eng yaqin yondashuv — bu rejalarni diversifikatsiya qilish orqali yakuniy javoblar xilma-xilligiga erishishdir. Biz ushbu yondashuvlarni ko‘rsatmalarga amal qilish (instruction-following) konsepsiyasi doirasida tizimlashtiramiz va tashqi tasodifiy sonlar generatori (RNG) hamda ko‘rsatmalarni bajarish (IF) kombinatsiyasi model tokenlari entropiyasini sun’iy oshirmasdan ham yuqori variativlikni ta’minlashini ko‘rsatamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tashqi RNG va ko‘rsatmalarga amal qilishdan foydalanish tokenlar taqsimoti entropiyasini o‘zgartirmasdan javoblar xilma-xilligini ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shuni ta’kidlash kerakki, xilma-xil variantlarni tanlash muammosi hatto odamlar uchun ham qiyin. n=200 000 ishtirokchi qatnashgan norasmiy so‘rovda odamlar ko‘pincha 37 sonini tanlashga moyilligi aniqlandi, bu esa til modellarida kuzatiladigan shunga o‘xshash kognitiv buzilishlarni tushuntirishi mumkin.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Ushbu ishda mualliflar generativ xilma-xillik muammosini qayta ko‘rib chiqib, uni til modelining token entropiyasi (&lt;a href=\"concepts/masshtabirovanie.html\"&gt;masshtablash&lt;/a&gt; va post-trening jarayonida pasayishi mumkin bo‘lgan ko‘rsatkich) orqali emas, balki ko‘rsatmalarga amal qilish vazifasi sifatida talqin qilishni taklif etishadi. Modellar tashqi tasodifiylikni foydali va xilma-xil javoblarga aylantiruvchi mantiqiy komponentlar vazifasini bajaradi. Gacha Decoding usuli zamonaviy modellarning so‘rov bo‘yicha variantlarni sanab o‘tish qobiliyatiga tayanadi.&lt;/p&gt;\n&lt;h4 id=\"method\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#method\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Method&lt;/span&gt;&lt;/a&gt;Method&lt;/h4&gt;\n&lt;p&gt;Samaradorlikni baholash uchun Claude Opus, GPT-5.5, GPT-OSS 120B va Inkling Large modellari ishlatildi. Asosiy metrika — bu sifat filtri orqali o‘tgan javoblar uchun hisoblangan Vendi balli (Quality-gated diversity). O‘tish chegarasi (Gate pass rate) sifatida modelning to‘g‘ridan-to‘g‘ri tanlash o‘rtacha qiymatining 95% qismi belgilandi. Sifat javoblar validligi, hikoyalar uchun rubrikalar (0–20 ball) va tasvirlarning mosligi (0–1) bo‘yicha baholandi. Tajribalar ochiq modellar uchun n=512 va yopiq modellar uchun n=256 hajmida o‘tkazildi. 2-jadval shuni ko‘rsatadiki, Gacha Decoding sifatni saqlab qolgan holda yuqori xilma-xillikni ta’minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding modellarning ko‘rsatmalarga amal qilish qobiliyatidan foydalanib, yuqori xilma-xillikka erishish imkonini beradi va barcha sinovdan o‘tgan arxitekturalarda an’anaviy usullardan ustunlik qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vendi score — ma’lumotlar to‘plamidagi xilma-xillikni miqdoriy baholash uchun ishlatiladigan metrika bo‘lib, yuqoriroq qiymatlar javoblarning ko‘proq variativligini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ochko‘z dekodlash (greedy decoding) ishlatilganda, Verbalized Sampling kabi usullar sifat filtridan o‘ta olmaydigan ma’nosiz javoblarni keltirib chiqaradi, Gacha Decoding esa barqarorlikni saqlab qoladi (3-jadval).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"qoshimcha-ablasyon-natijalari\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#qoshimcha-ablasyon-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qo'shimcha ablasyon natijalari&lt;/span&gt;&lt;/a&gt;Qo'shimcha ablasyon natijalari&lt;/h4&gt;\n&lt;p&gt;Biz Gacha Decoding arxitekturasining uchta asosiy jihati bo'yicha 1-jadvalda keltirilgan xulosalarni tasdiqlovchi kengaytirilgan ma'lumotlarni taqdim etamiz: g'oyalar darajasida randomizatsiya, sanash jarayonini tashqi tasodifiy sonlar generatori (RNG) yordamida tanlashdan ajratish va avtoregressiv g'oyalar tanlovi. Inkling va GPT-5.5 uchun natijalar 4-jadvalda keltirilgan.&lt;/p&gt;\n&lt;p&gt;(A) G'oyalar fazosida randomizatsiya tokenlar fazosiga qarshi. Gacha Decoding model tomonidan tayyorlangan g'oyalardan bir xil tanlov qilish uchun tashqi RNGdan foydalanadi. Top-p (p=0.95) va top-K usullari bilan ekstremal haroratlarda solishtirish shuni ko'rsatdiki, ushbu yondashuvni tokenlar darajasida takrorlash samarasiz. Haroratni 3 dan oshirish har qanday K qiymatida javoblar izchilligini keskin pasaytiradi. G'oyalar fazosida ishlash yuqori darajadagi tasodifiylikka erishish uchun juda muhimdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tokenlar o'rniga g'oyalar fazosidan foydalanish javoblar sifatini yo'qotmasdan yuqori xilma-xillikka erishish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;(B) Sanash va tanlashni ajratish. Biz Gacha Decodingni ikkita variant bilan solishtirdik: sanashsiz (model darhol bitta variantni tanlaydi) va tashqi RNGsiz (model taklif qilingan ro'yxatdan o'zi tanlaydi). Birinchi holda, o'zgaruvchanlik modelning tokenlar taqsimoti bilan cheklangan. Ikkinchi holda, tanlov modelning o'ziga topshirilganda, javoblar xilma-xilligi sezilarli darajada kamayadi, bu 4-jadvalda tasdiqlangan.&lt;/p&gt;\n&lt;p&gt;(C) Avtoregressiv g'oyalar tanlovi. Biz Gacha Decodingni ikkita avtoregressiv bo'lmagan yondashuv bilan solishtirdik: «Idea-list» (bir qadamda g'oyalar ro'yxatini yaratish) va «Independent-axes» (qaror o'qlari bo'yicha mustaqil tanlov). Birinchi holda, xilma-xillik tokenlar entropiyasiga bog'liq, ikkinchisida esa qarorlarning kontekstual bog'liqligi e'tiborga olinmaydi. Natijalar shuni ko'rsatadiki, Gacha Decoding har ikkala usuldan ustun turadi.&lt;/p&gt;\n&lt;h4 id=\"gacha-decodingni-amalga-oshirish-tafsilotlari\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-decodingni-amalga-oshirish-tafsilotlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha Decodingni amalga oshirish tafsilotlari&lt;/span&gt;&lt;/a&gt;Gacha Decodingni amalga oshirish tafsilotlari&lt;/h4&gt;\n&lt;p&gt;Barcha model chaqiruvlari standart parametrlar (harorat 1.0, mulohaza yoqilgan) bilan amalga oshiriladi. Jarayon qaror o'qlarini rejalashtirishdan (1-qadam) boshlanadi, bunda T giperparametri (o'qlar soni) ishlatiladi. Biz T ni optimallashtirish kelajakdagi tadqiqotlarda ko'rsatkichlarni yaxshilashi mumkin deb hisoblaymiz.&lt;/p&gt;\n&lt;h4 id=\"prompt-b1-qaror-qabul-qilish-oqlarini-rejalashtirish\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-b1-qaror-qabul-qilish-oqlarini-rejalashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt B.1: Qaror qabul qilish o‘qlarini rejalashtirish&lt;/span&gt;&lt;/a&gt;Prompt B.1: Qaror qabul qilish o‘qlarini rejalashtirish&lt;/h4&gt;\n&lt;p&gt;Natijalarni shakllantirish uchun vazifa ketma-ket qaror qabul qilish bosqichlariga bo‘linadi. Maqsad — T qadamda yakuniy natijaga erishish. Har bir bosqich savol shaklida bo‘lib, model avvalgi javoblarni hisobga olgan holda javob beradi. Qoidalar o‘zgarishsiz qolgan parametrlarni qayta ko‘rib chiqmaslikni va oddiy savollardan murakkablariga o‘tishni talab qiladi. Hikoyalar uchun T=4, chatlar uchun T=4 va tasvirlar uchun T=6 qilib belgilangan. Tasvirlar uchun soddalashtirilgan prompt ishlatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul generatsiyani T bosqichga ajratib, natijalar xilma-xilligini nazorat qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"avtoregressiv-sikl-2-4-qadamlar\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#avtoregressiv-sikl-2-4-qadamlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Avtoregressiv sikl: 2–4-qadamlar&lt;/span&gt;&lt;/a&gt;Avtoregressiv sikl: 2–4-qadamlar&lt;/h4&gt;\n&lt;p&gt;Rejalashtirishdan so‘ng model ko‘p bosqichli muloqotda qaror qabul qiladi. Har bir t qadamda model (Prompt B.2) yordamida m ta variantni generatsiya qiladi (hikoya va tasvirlar uchun m=32, chat uchun m=24). Tizim tasodifiy ravishda bitta variantni (z_t) tanlaydi. Agar JSON xato bo‘lsa, qadam o‘tkazib yuboriladi. Bu har bir qaror avvalgi kontekstga asoslanishini ta’minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Avtoregressiya — bu har bir yangi qaror avvalgi tanlovlarni hisobga olishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-qadam-amalga-oshirish\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#5-qadam-amalga-oshirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5-qadam: Amalga oshirish&lt;/span&gt;&lt;/a&gt;5-qadam: Amalga oshirish&lt;/h4&gt;\n&lt;p&gt;Yakuniy bosqichda (Prompt B.3) model k=8 ta ijodiy yondashuvni taklif qiladi. «Ijrochi» (Prompt B.4) barcha tanlangan parametrlarni birlashtirib, yakuniy natijani yaratadi. Agar vazifa talablari tanlangan parametrlar bilan zid kelsa, vazifa ustuvor hisoblanadi.&lt;/p&gt;\n&l bazaviy-modellar-va-yondashuvlar\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#bazaviy-modellar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bazaviy modellar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Bazaviy modellar va yondashuvlar&lt;/h4&gt;\n&lt;p&gt;Solishtirish uchun ikki usul ishlatiladi. Birinchisi — «Naive IID» (to‘g‘ridan-to‘g‘ri so‘rov). Ikkinchisi — «List prompting» (ro‘yxat bilan so‘rov). n ta namunani olish uchun &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20n%2Fk%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; marta so‘rov yuboriladi. k qiymatlari (matnlar uchun 8, chat va tasvirlar uchun 32) &lt;span class=\"yfm-latex\" data-content=\"k%20%5Cin%20%5C%7B8%2C%2016%2C%2032%2C%2064%2C%20128%2C%20256%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; diapazonida optimallashtirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;k parametrini tanlash juda muhim: matnlar uchun katta k qiymati model sifatini pasaytirishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Qo'shimcha usullarni taqqoslash&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Usul&lt;/th&gt;\n&lt;th&gt;Qiymat 1&lt;/th&gt;\n&lt;th&gt;Qiymat 2&lt;/th&gt;\n&lt;th&gt;Qiymat 3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(A) Tokenlar emas, g'oyalar bo'yicha randomizatsiya&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;11.65&lt;/td&gt;\n&lt;td&gt;8.44&lt;/td&gt;\n&lt;td&gt;9.04&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Standardtokensampling(T=1)&lt;/td&gt;\n&lt;td&gt;2.54&lt;/td&gt;\n&lt;td&gt;5.45&lt;/td&gt;\n&lt;td&gt;3.26&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=10)&lt;/td&gt;\n&lt;td&gt;3.07&lt;/td&gt;\n&lt;td&gt;2.56&lt;/td&gt;\n&lt;td&gt;4.25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=20)&lt;/td&gt;\n&lt;td&gt;2.16&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;4.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=10)&lt;/td&gt;\n&lt;td&gt;1.79&lt;/td&gt;\n&lt;td&gt;0.03&lt;/td&gt;\n&lt;td&gt;5.02&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=20)&lt;/td&gt;\n&lt;td&gt;0.42&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;5.29&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(B) Sanash va tanlashni ajratish orqali tanlanma&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;8.24&lt;/td&gt;\n&lt;td&gt;9.53&lt;/td&gt;\n&lt;td&gt;6.25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NoexternalRNG(LMselectschoicesfromitslist)&lt;/td&gt;\n&lt;td&gt;3.95&lt;/td&gt;\n&lt;td&gt;6.41&lt;/td&gt;\n&lt;td&gt;5.08&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Noenumeration(directlypromptLMfordecision)&lt;/td&gt;\n&lt;td&gt;4.58&lt;/td&gt;\n&lt;td&gt;6.38&lt;/td&gt;\n&lt;td&gt;4.42&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(C) G'oyalarni avtoregressiv mahalliy qarorlar sifatida tanlash&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"prompt-c1-asosiy-royxat-tizim-sorovi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-c1-asosiy-royxat-tizim-sorovi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt C.1: Asosiy ro‘yxat (tizim so‘rovi)&lt;/span&gt;&lt;/a&gt;Prompt C.1: Asosiy ro‘yxat (tizim so‘rovi)&lt;/h4&gt;\n&lt;p&gt;Ushbu usul foydalanuvchi so‘roviga k xil turdagi javoblarni yaratishni nazarda tutadi. «Verbalizatsiyalangan tanlov» (Verbalized Sampling) amalga oshirilganda, model bir marta murojaat qilish orqali k ta javob taqsimotini va ularning ehtimolliklarini baholaydi. n ta namunani olish uchun &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20n%2Fk%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; marta mustaqil chaqiruv amalga oshiriladi. Ko‘pgina modellar uchun k=8 (hikoyalar) va k=32 (chat/tasvirlar) qiymatlari ishlatiladi, biroq Inkling modeli uchun barcha vazifalarda k=8 etib belgilangan. Ijodiy yozishda 400 so‘zlik cheklov qo‘yiladi, aks holda model qisqa parchalar bilan cheklanib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Verbalizatsiyalangan tanlov — bu modelning bir nechta javob variantlarini o‘zi shakllantirib, ularga ehtimollik darajasini belgilash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"togridan-togri-rejalashtirish-intent-faktli-generatsiya\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#togridan-togri-rejalashtirish-intent-faktli-generatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;To‘g‘ridan-to‘g‘ri rejalashtirish (intent-faktli generatsiya)&lt;/span&gt;&lt;/a&gt;To‘g‘ridan-to‘g‘ri rejalashtirish (intent-faktli generatsiya)&lt;/h4&gt;\n&lt;p&gt;Javoblar ikki bosqichda, ikkita alohida &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; chaqiruvi orqali shakllanadi. Birinchi bosqichda yuqori haroratda (1,2) reja (kalit so‘zlar yoki g‘oyalar) yaratiladi, ikkinchi bosqichda esa standart haroratda ushbu reja asosida to‘liq javob yoziladi. Xilma-xillik rejalar o‘zgaruvchanligi hisobiga ta’minlanadi.&lt;/p&gt;\n&lt;h4 id=\"persona-asosida-promptlash\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#persona-asosida-promptlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Persona asosida promptlash&lt;/span&gt;&lt;/a&gt;Persona asosida promptlash&lt;/h4&gt;\n&lt;p&gt;Har bir javob Nemotron-Personas-USA ma’lumotlar to‘plamidan tanlangan muayyan rol (persona) asosida yaratiladi. Personalar takrorlanmasdan tanlanadi, bu esa javoblarning mustaqilligini kafolatlaydi. Rol vazifaga yondashuvni, detallarni tanlashni va javob tuzilishini belgilaydi, bunda model personaning o‘zini ta’riflamasligi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Personalar bilan ishlashda model shunchaki nutq uslubini o‘zgartirmasdan, balki qaror qabul qiluvchi shaxs sifatida harakat qilishi talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"seed-prompting-fikrlash-uchun-urug\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#seed-prompting-fikrlash-uchun-urug\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Seed Prompting (fikrlash uchun «urug‘»)&lt;/span&gt;&lt;/a&gt;Seed Prompting (fikrlash uchun «urug‘»)&lt;/h4&gt;\n&lt;p&gt;Bu usulda 24 belgili tasodifiy ASCII satri ishlatiladi, u modelning stokastik qarorlari uchun «urug‘» (seed) vazifasini o‘taydi. Model ushbu satrni &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y34d41ov\"&gt;&amp;lt;random_string&amp;gt;&lt;/code&gt; teglarida chiqarishi, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1d9uk4hc\"&gt;&amp;lt;reasoning&amp;gt;&lt;/code&gt; teglarida mulohaza yuritishi va yakuniy javobni &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n3twzhf5\"&gt;&amp;lt;answer&amp;gt;&lt;/code&gt; teglarida taqdim etishi shart. Bu yagona javobning o‘ziga xosligi va xilma-xilligini ta’minlaydi.&lt;/p&gt;\n&lt;h4 id=\"model-tanlash-va-generatsiya-parametrlari\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#model-tanlash-va-generatsiya-parametrlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Model tanlash va generatsiya parametrlari&lt;/span&gt;&lt;/a&gt;Model tanlash va generatsiya parametrlari&lt;/h4&gt;\n&lt;p&gt;Eksperimentlarda Qwen3.5, GPT-OSS, Inkling, Gemma4 oilalari, shuningdek, gpt-5.5 va claude-opus-4-8 API modellari qo‘llanildi. Tanlash parametrlari (5-jadval) ochiq vaznli modellar uchun ishlab chiquvchilar tavsiyalariga mos keladi va barcha modellar uchun T=1.0 harorat belgilangan. API modellari uchun provayderlarning standart sozlamalari ishlatildi. Inkling va GPT-OSS modellari mos ravishda NVFP4 va MXFP4 formatlarida, qolganlari esa BF16 formatida ishladi. Barcha hisob-kitoblar &lt;a href=\"concepts/sglang.html\"&gt;SGLang&lt;/a&gt; freymvorki yordamida H200 tugunida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SGLang — bu til modellarini samarali bajarish, xotira va generatsiya tezligini optimallashtirish uchun mo‘ljallangan maxsus freymvork.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modellarni-baholash\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#modellarni-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modellarni baholash&lt;/span&gt;&lt;/a&gt;Modellarni baholash&lt;/h4&gt;\n&lt;p&gt;Baholovchi (LM judge) sifatida «fikrlash» qobiliyatiga ega Qwen3.6-27B modeli tanlandi. Chat sifatini baholash uchun InfinityChat ma’lumotlar to‘plami ishlatildi, unda javoblar haqiqiyligi maxsus prompt (Prompt C.8) orqali tekshirildi. Baholash mezonlari aniq cheklovlarni bajarish, faktik ma’lumotlarning to‘g‘riligi va matnning izchilligini o‘z ichiga oladi.&lt;/p&gt;\n&lt;p&gt;Ijodiy yozish qobiliyatini baholash uchun Wildchat’dan &lt;a href=\"concepts/filtratsiya.html\"&gt;filtrlash&lt;/a&gt; va qo‘lda tekshirish orqali 50 ta so‘rovdan iborat to‘plam shakllantirildi. Matnlarning xilma-xilligi 8 ta semantik o‘q (janr, muhit, ohang, hikoyachi, syujet, final hissiyoti, obrazlar, bosh qahramon) bo‘yicha annotatsiya qilinib, o‘rtacha Vendiscore ko‘rsatkichi orqali o‘lchandi. Sifat EQ-Bench yordamida baholandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sifatni baholash ko‘rsatmalarga qat’iy rioya qilish va hikoya qilishning 8 ta asosiy parametri bo‘yicha o‘lchanadigan semantik xilma-xillikka asoslanadi.&lt;br /&gt;\n[!warning] LM-hakamdan foydalanish baholashlar hakam modelning murakkab ijodiy vazifalarni xolis talqin qilish qobiliyatiga bog‘liqligini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prompt-c10-ijodiy-yozish-sifatini-baholash-eq-bench-rubrikasi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-c10-ijodiy-yozish-sifatini-baholash-eq-bench-rubrikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt C.10: Ijodiy yozish sifatini baholash (EQ-Bench rubrikasi)&lt;/span&gt;&lt;/a&gt;Prompt C.10: Ijodiy yozish sifatini baholash (EQ-Bench rubrikasi)&lt;/h4&gt;\n&lt;p&gt;Ijodiy qobiliyatlarni baholash uchun til modelini ekspert-tanqidchiga aylantiruvchi maxsus prompt ishlatiladi. Model matnni 0 dan 20 gacha bo‘lgan shkala bo‘yicha 10 ta mezon, jumladan ijodkorlik, obrazlilik, personajlar chuqurligi, emotsional boylik va uslub bo‘yicha baholashi kerak. Muhim shart — hikoya tugagandan so‘ng model tomonidan qo‘shilgan har qanday izohlarni e’tiborsiz qoldirishdir. Agar model to‘liq hikoya o‘rniga qisqacha tavsif bersa, u barcha mezonlar bo‘yicha minimal ball oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Metodika ijodiy yozishni subyektiv baholashni standartlashtiradi va hakam-modeldan JSON formatida ball qo‘yishdan oldin batafsil tahlil qilishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prompt-c11-ijodiy-yozish-vazifalari-namunalari-wildchat-toplamidan\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-c11-ijodiy-yozish-vazifalari-namunalari-wildchat-toplamidan\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt C.11: Ijodiy yozish vazifalari namunalari (WildChat to‘plamidan)&lt;/span&gt;&lt;/a&gt;Prompt C.11: Ijodiy yozish vazifalari namunalari (WildChat to‘plamidan)&lt;/h4&gt;\n&lt;p&gt;Mualliflar 50 ta vazifa namunasini tanlab olishdi, ular hazilomuz hikoyalardan tortib (masalan, Avstraliyaga borgan mushuklar) to fentezi syujetlarigacha bo‘lgan mavzularni qamrab oladi. Bu vazifalar modelning izchil va original hikoyalar yaratish qobiliyatini tekshirish uchun etalon bo‘lib xizmat qiladi.&lt;/p&gt;\n&lt;h4 id=\"tasvir-generatsiyasi-va-promptlarni-filtrlash\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#tasvir-generatsiyasi-va-promptlarni-filtrlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tasvir generatsiyasi va promptlarni filtrlash&lt;/span&gt;&lt;/a&gt;Tasvir generatsiyasi va promptlarni filtrlash&lt;/h4&gt;\n&lt;p&gt;Tasvir generatsiyasini baholash uchun OneIG-Bench to‘plami ishlatiladi. Ochiq (noaniq) so‘rovlarni ajratib olish uchun uch bosqichli filtratsiya qo‘llaniladi. Birinchidan, matn renderlash yoki qat’iy mantiqiy mulohazalarni talab qiladigan kategoriyalar chiqarib tashlanadi. Keyin til modeli (LM-judge) qolgan promptlarni klassifikatsiya qilib, yopiq vazifalarni olib tashlaydi. Yakuniy bosqichda model eng ochiq 50 ta promptni tanlab oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/open-ended.html\"&gt;Ochiq prompt&lt;/a&gt; (open-ended) — bu vizual talqin qilishning ko‘plab variantlariga yo‘l qo‘yadigan so‘rovdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Renderlash uchun Qwen-Image-2512 modeli 30 ta shovqinni tozalash qadami (denoising steps), 4.0 CFG shkalasi va 1328×1328 pikselli ruxsatda ishlatiladi. Natijalarning xilma-xilligi DreamSim metriki yordamida baholanadi.&lt;/p&gt;\n&lt;h4 id=\"vazifa-sharhi-oqsil-boglovchilarini-loyihalash\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#vazifa-sharhi-oqsil-boglovchilarini-loyihalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vazifa sharhi: oqsil bog‘lovchilarini loyihalash&lt;/span&gt;&lt;/a&gt;Vazifa sharhi: oqsil bog‘lovchilarini loyihalash&lt;/h4&gt;\n&lt;p&gt;Tadqiqot Gacha Decoding metodini oqsil bog‘lovchilarini (protein binders) yaratish jarayonida LM generatsiyalarini diversifikatsiya qilish uchun boshqa usullar bilan solishtiradi. Modelga turli interfeys konfiguratsiyalariga ega nomzodlar uchun tavsiflar to‘plamini yaratish topshiriladi. Keyin oqsil generatsiyasi modeli bu tavsiflarni fizik tuzilmalarga aylantiradi. Samaradorlik interfeys ishonchliligi va muvaffaqiyatli dizaynlarning strukturaviy xilma-xilligi orqali baholanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oqsil sifatini baholash bashoratli modellar asosida amalga oshiriladi, bu esa laboratoriya sharoitida eksperimental tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"maqsadli-qaynoq-nuqtalar-va-boglovchi-molekulalar-uzunligi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#maqsadli-qaynoq-nuqtalar-va-boglovchi-molekulalar-uzunligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maqsadli «qaynoq nuqtalar» va bog‘lovchi molekulalar uzunligi&lt;/span&gt;&lt;/a&gt;Maqsadli «qaynoq nuqtalar» va bog‘lovchi molekulalar uzunligi&lt;/h4&gt;\n&lt;p&gt;Tadqiqotda sakkizta etalon nishon (BHRF1, IFNAR2, PD1, TrkA, PDL1, DerF21, IL7RA, VEGFA) ko‘rib chiqiladi, ular uchun bog‘lanish saytlari aniqlangan (6-jadval). Har bir nishon uchun asosiy qoldiqlar («qaynoq nuqtalar») va bog‘lovchi oqsil uzunligi diapazoni (50 dan 185 aminokislotagacha) belgilangan. Biz har bir usul uchun 1024 ta generatsiya yordamida GPT-5.5 modeli bilan bog‘lovchi molekulalar uchun tavsiflar (kapshenlar) yaratamiz. Muhimi, «qaynoq nuqtalar» haqidagi ma’lumotlar struktura generatsiya modeliga uzatiladi, lekin til modeliga (LM) emas, chunki dastlabki testlar bu ma’lumotlarni matnli promptga kiritish samaradorlikni pasaytirganini ko‘rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uzunlikning o‘ziga xos diapazonlaridan foydalanish va «qaynoq nuqtalar» haqidagi ma’lumotlarni matnli promptdan chiqarib tashlash bog‘lovchi oqsillarni generatsiya qilishda yuqori aniqlikni ta’minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Solishtirish usullari sifatida Gacha Decoding (7 ta qaror qabul qilish bosqichi, har bir bosqichda 16 ta variant), to‘g‘ridan-to‘g‘ri namuna olish, listing-prompting va verbalizatsiyalangan namuna olish (oxirgi ikkitasi uchun k=32) qo‘llaniladi. Solishtirish adolatli bo‘lishi uchun barcha usullarda bog‘lovchi molekulalarning bir xil tasodifiy uzunlik qiymatlari ishlatiladi.&lt;/p&gt;\n&lt;h4 id=\"boglovchi-molekulalar-tavsiflarini-baholash\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#boglovchi-molekulalar-tavsiflarini-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog‘lovchi molekulalar tavsiflarini baholash&lt;/span&gt;&lt;/a&gt;Bog‘lovchi molekulalar tavsiflarini baholash&lt;/h4&gt;\n&lt;p&gt;Sifatni baholash uchun yaratilgan tavsiflar oqsil strukturasini generatsiya qiluvchi modelga (Lee et al., 2026) uzatiladi. Model ikkita ishlov berish yo‘lidan foydalanadi: qatlamlarni moslashuvchan &lt;a href=\"concepts/normalizatsiya.html\"&gt;normallashtirish&lt;/a&gt; orqali global konditsionerlash uchun Qwen-3-&lt;a href=\"concepts/embedding.html\"&gt;Embedding&lt;/a&gt;-8B va nozik interfeys o‘zaro ta’sirlarini hisobga olishga imkon beruvchi token darajasidagi tasvirlar uchun Qwen-3-8B. Generatsiya jarayoni klassifikatorsiz boshqaruv (classifier-free guidance) bilan 400 ta Eyler-Maruyama qadamini o‘z ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ipSAEmin — bu bashorat qilingan moslashuv xatosi metriki (0 dan 1 gacha), bunda 0,5 dan yuqori qiymatlar bog‘lanish interfeysining muvaffaqiyatli shakllanganligini bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bog‘lanishni tekshirish uchun biz ESMFold2-Fast dan foydalanamiz va ipSAEmin ko‘rsatkichini hisoblaymiz. Dizayn ipSAEmin &amp;gt; 0,5 bo‘lganda muvaffaqiyatli hisoblanadi. Muvaffaqiyatli variantlarning xilma-xilligi Foldseek algoritmi yordamida TM-score (0 dan 1 gacha) orqali baholanadi. Yakuniy Vendi score ko‘rsatkichi har bir nishon uchun strukturaviy jihatdan farq qiluvchi bog‘lovchi molekulalarning samarali sonini aks ettiradi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 4.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-tT4.jpg\" alt=\"Jadval 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kuchli sun'iy&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;intellekt ijod&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;korligining&lt;/text&gt;&lt;text x=\"2
