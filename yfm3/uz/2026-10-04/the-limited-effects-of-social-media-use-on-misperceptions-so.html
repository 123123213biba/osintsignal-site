        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"251\" cy=\"124\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"609\" cy=\"290\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · BOTS   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ijtimoiy tarmoqlar haqiqatni&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;buzib ko'rsatadimi?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f1.jpg\" alt=\"Ikkita panel so‘rovlarida ijtimoiy tarmoqlarda o‘tkazilgan vaqt taqsimoti. Ikkita panel tadqiqotida to‘rtta ijtimoiy tar\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ikkita panel so‘rovlarida ijtimoiy tarmoqlarda o‘tkazilgan vaqt taqsimoti. Ikkita panel tadqiqotida to‘rtta ijtimoiy tarmoqda o‘tkazilgan daqiqalar taqsimoti. 2020-yilgi AQSH prezidentlik saylovlariga (A) va 2020-yil dekabridan 2021-yil iyunigacha bo‘lgan COVID-19 pandemiyasi davriga (B) qaratilgan panellar uchun Facebook, Instagram, Twitter va YouTube’da o‘tkazilgan daqiqalarning qo‘shimcha kumulyativ taqsimot funksiyalari (CCDF).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar ijtimoiy tarmoqlardan foydalanish va odamlarning haqiqatni yolg'ondan ajrata olish qobiliyati o'rtasidagi bog'liqlikni o'rganishdi. AQShdagi saylovlar va COVID-19 pandemiyasi davrida o'tkazilgan ikkita yirik &lt;a href=\"concepts/panelnoe-issledovanie.html\"&gt;panel tadqiqoti&lt;/a&gt; hech qanday sezilarli korrelyatsiyani aniqlamadi. Facebook, Twitter, YouTube yoki Instagram'dan faol foydalanish foydalanuvchilarning tanqidiy fikrlash qobiliyatiga salbiy ta'sir ko'rsatmaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Tadqiqot Facebook, Twitter, YouTube va Instagram'ni qamrab oldi.&lt;/li&gt;\n&lt;li&gt;Foydalanuvchilar hukmlarining aniqligini baholash uchun &lt;a href=\"concepts/signal-detection-theory.html\"&gt;SDT&lt;/a&gt; nazariyasi ishlatildi.&lt;/li&gt;\n&lt;li&gt;Ob'ektiv kuzatuv ma'lumotlari tarmoqdagi vaqt va feyklarga ishonish o'rtasida bog'liqlik yo'qligini ko'rsatdi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Ishda respondentlarning rost va yolg'on bayonotlarni farqlash qobiliyatini baholash uchun signalni aniqlash nazariyasi (Signal Detection Theory, SDT) qo'llanildi. Tadqiqotchilar YouGov ma'lumotlaridan foydalanib, panel so'rovlarini ishtirokchilarning qurilmalaridagi ob'ektiv faollik loglari (digital trace data) bilan birlashtirdilar. Siyosiy tadqiqot uchun 624 nafar, COVID-19 bo'yicha esa 1010 nafar ishtirokchi qamrab olindi.&lt;/p&gt;\n&lt;p&gt;Tahlil uchun ichki-tashqi regressiya modellari (within-between regression models) ishlatildi, bu ham individual farqlarni, ham vaqt o'tishi bilan xulq-atvor dinamikasini hisobga olish imkonini berdi. Natijalar shuni ko'rsatdiki, respondentlarning haqiqatni sezish darajasi o'rtacha 0,75 ni tashkil etadi va bu ko'rsatkich ijtimoiy tarmoqlardan foydalanish intensivligidan qat'i nazar barqaror qoladi. O'z-o'zini hisobot berish orqali topilgan statistik bog'liqliklar ob'ektiv kuzatuv ma'lumotlari bilan tekshirilganda yo'qoldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot xulq-atvorini kuzatishga rozi bo'lgan ixtiyoriy tanlovga asoslangan, bu esa natijalarning umumiy vakilligini cheklashi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ijtimoiy tarmoqlardan foydalanish notoʻgʻri tushunchalarni keltirib chiqarishi mumkin, ammo mavjud dalillar turlicha. Ijtimoiy tarmoqlarning gomofil ijtimoiy tarmoqlar, tarafkashlikni kuchaytirishi mumkin boʻlgan algoritmlar va yolgʻon maʼlumotlarni tarqatuvchi ijtimoiy botlar kabi xususiyatlariga qaramay, ijtimoiy tarmoqlardan foydalanish va notoʻgʻri tushunchalar oʻrtasida kuchli bogʻliqlik mavjudligi haqida dalillar yoʻq. Ushbu loyiha mazkur munosabatning bugungi kungacha boʻlgan eng kuchli empirik sinovini taklif etadi va ijtimoiy tarmoqlardan foydalanishning notoʻgʻri tushunchalarga taʼsiri minimal ekanligiga qoʻshimcha dalillar beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ikki mustaqil panel tadqiqotiga asoslangan tahlil ijtimoiy tarmoqlardan foydalanish va foydalanuvchilarning haqiqiy hamda yolgʻon daʼvolarni ajratib olish qobiliyatining pasayishi oʻrtasida statistik jihatdan ahamiyatli bogʻliqlikni aniqlamadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Maʼlumotlar ikkita mustaqil, katta hajmdagi panel tadqiqotlaridan olingan boʻlib, ularning har biri onlayn kuzatuv maʼlumotlari bilan birgalikda tahlil qilingan: biri 2020-yilgi saylovlarga, ikkinchisi esa COVID-19 pandemiyasiga qaratilgan. Within-between regressiya modellari shuni koʻrsatadiki, ijtimoiy tarmoqlardan foydalanish amerikaliklarning toʻrtta platformada — Facebook, Twitter, YouTube va Instagramʼda haqiqiy va yolgʻon daʼvolarni ajratib olish qobiliyatining statistik jihatdan ahamiyatli pasayishi bilan bogʻliq boʻlmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kuzatuv tadqiqoti: bu bogʻliqlikni ifodalaydi, sababiy aloqani emas; natijalar faqat toʻrtta koʻrib chiqilgan platforma bilan cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Ijtimoiy tarmoqlardagi dezinformatsiyaning zararli ta’siri haqidagi xavotirlar AQShda keng tarqalgan va ba’zi empirik topilmalar buni asosli ekanligini ko‘rsatadi. Ijtimoiy tarmoqlar yangiliklarning tobora ommalashib borayotgan va ishonchli manbasiga aylanib bormoqda, unda foydalanuvchilar ko‘pincha siyosiy jihatdan bir jinsli jamoalarga birlashadilar. Ushbu tarmoqlarning ba’zilarida, ayniqsa chekka qismlarida, yolg‘on va provokatsion kontent keng tarqaladi. Platforma algoritmlari beixtiyor dezinformatsiyaning tarqalishiga yordam berishi va foydalanuvchilarning tarafkashligini kuchaytirishi mumkin, ijtimoiy botlarning muvofiqlashtirilgan faoliyati esa dezinformatsiyaning ayrim turlarini strategik jihatdan kuchaytiradi. Hatto faktlar tekshirilganda ham, Twitter’dagi yolg‘on ma’lumotlar haqiqatga qaraganda uzoqroq va tezroq tarqalishga moyil, garchi bu qonuniyat barcha platformalarda ham takrorlanmasa-da.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotlar qarama-qarshi natijalarni ko‘rsatadi: algoritmlar yolg‘on ma’lumotlarning tarqalishiga hissa qo‘shsa-da, ularning foydalanuvchilarning siyosiy qarashlariga haqiqiy ta’siri ko‘pincha cheklangan bo‘lib chiqadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shu bilan birga, ijtimoiy tarmoqlarning noto‘g‘ri tushunchalarni targ‘ib qilishdagi roli bo‘yicha empirik tadqiqotlar kommunikatsiya tadqiqotlaridagi «minimal ta’sirlar» an’anasiga mos keladigan cheklanganroq ta’sirlar to‘plamiga ishora qiladi. Siyosiy dezinformatsiya ijtimoiy tarmoqlar ekotizimining juda kichik qismidir va amerikaliklar uni kamdan-kam hollarda ulashadilar. 2016 yildagi dastlabki panel dalillari Facebook’dan foydalanish va AQShdagi kattalar o‘rtasidagi siyosiy noto‘g‘ri tushunchalar o‘rtasida aniq bog‘liqlikni aniqlamadi. Eksperimental tadqiqotlar kuchliroq sababiy bog‘liqlikni ta’minlaydi, ammo xuddi shunday aralash natijalarni beradi. 2018 yilda o‘tkazilgan deaktivatsiya tadqiqoti shuni ko‘rsatdiki, bir oy davomida Facebook’dan foydalanishni to‘xtatgan foydalanuvchilarning siyosiy bilimlarining aniqligi pasaygan. Keyingi, 2020 yildagi deaktivatsiya tadqiqoti yangiliklar bilimi (joriy voqealarni tanib olish) va faktlar bilimi (haqiqiy va yolg‘on da’volarni farqlash) o‘rtasidagi farqni ajratib ko‘rsatdi va Facebook’dan foydalanishni to‘xtatish yangiliklar bilimining kamayishi, ammo faktlar bilimining ortishi bilan bog‘liqligini aniqladi; Facebook’dan foydalanishni to‘xtatgan ishtirokchilar uchta yolg‘on da’voga nisbatan biroz kamroq ishonch bildirishdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot natijalari metodologiyaga bog‘liq: akkauntlarni deaktivatsiya qilish turli xil bilim turlariga turlicha ta’sir ko‘rsatadi, bu esa aniq xulosalar chiqarish imkoniyatini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umuman olganda, tasmadagi kontent yoki reytingni manipulyatsiya qiluvchi platforma aralashuvi tadqiqotlari siyosiy bilimlar, e’tiqodlar yoki munosabatlarga cheklangan ta’sirni aniqlashga moyil. Ushbu qonuniyatlarga muvofiq, yaqinda o‘tkazilgan xalqaro dalillar shunga o‘xshash shartli modelga ishora qiladi, unda platformadan foydalanish va dezinformatsiyaga ishonish o‘rtasidagi bog‘liqlik mavzu, platforma, yangiliklarga bo‘lgan ishonch va kengroq axborot muhitiga bog‘liq. Bu yerda tasvirlangan loyiha ijtimoiy tarmoqlardan foydalanishning noto‘g‘ri tushunchalarga ta’sirining chegaralari haqida bugungi kungacha bo‘lgan eng kuchli dalillardan ba’zilarini taqdim etadi, sinovlar 2020 yilgi AQSh prezidentlik saylovlari va COVID-19 pandemiyasi kontekstida o‘tkazildi. Amerikaliklarning katta namunasi bilan o‘tkazilgan panel so‘rovlarini raqamli iz ma’lumotlari bilan birlashtirib, biz ijtimoiy tarmoqlardan foydalanishning ko‘payishi har qanday kontekstda noto‘g‘ri tushunchalar bilan mazmunli bog‘liqlikka ega emasligini ko‘rsatamiz. YouTube va Twitter’dan foydalanish haqidagi o‘z-o‘zini hisobotlar haqiqiy va yolg‘on da’volarni aniqlash qobiliyatining juda kichik, ammo statistik jihatdan sezilarli darajada yaxshilanishi bilan bog‘liq, ammo xulq-atvor ma’lumotlari yordamida tekshirilganda bu bog‘liqliklar sezilarli emas.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"ijtimoiy-tarmoqlardan-foydalanish-va-malumotlarning-ishonchliligiga-sezgirlik\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#ijtimoiy-tarmoqlardan-foydalanish-va-malumotlarning-ishonchliligiga-sezgirlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ijtimoiy tarmoqlardan foydalanish va maʼlumotlarning ishonchliligiga sezgirlik&lt;/span&gt;&lt;/a&gt;Ijtimoiy tarmoqlardan foydalanish va maʼlumotlarning ishonchliligiga sezgirlik&lt;/h4&gt;\n&lt;p&gt;Biz panel tadqiqotlarimizda kuzatilgan ijtimoiy tarmoqlardan foydalanish shakllarini qisqacha taʼriflashdan boshlaymiz. 1-rasmda ikkita panel tadqiqoti uchun Facebook, Instagram, Twitter va YouTubeʼda oʻtkazilgan daqiqalar sonining empirik taqsimoti koʻrsatilgan. Rasmda koʻrinib turibdiki, Facebook saytdan foydalanuvchi ishtirokchilar soni boʻyicha eng ommabop platforma hisoblanadi. Biroq, YouTubeʼning eng faol foydalanuvchilari boshqa ijtimoiy tarmoqlarning eng faol foydalanuvchilariga qaraganda koʻproq vaqt sarflashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oddiy tavsiflovchi statistika ijtimoiy tarmoqlardan foydalanish va amerikaliklarning notoʻgʻri maʼlumotlarga beriluvchanligi oʻrtasida sezilarli korrelyatsiyani aniqlamadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oldingi ishlarga muvofiq, oddiy tavsiflovchi statistika amerikaliklarning notoʻgʻri tasavvurlarga beriluvchanligi ularning ijtimoiy tarmoqlardan foydalanishi bilan bogʻliqligiga kam dalil beradi. 2-rasmda AQSh saylovlari boʻyicha panel maʼlumotlarimizdan foydalanilgan va eʼtiqodlar taqsimoti koʻrsatilgan.&lt;/p&gt;\n&lt;p&gt;Muhokama&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqot ijtimoiy tarmoqlardan foydalanish va amerikaliklarning maʼlumotlarning ishonchliligiga sezgirligi, yaʼni ularning haqiqiy va yolgʻon daʼvolarni ajrata olish qobiliyati oʻrtasidagi bogʻliqlikni mustahkam tekshirishni taʼminlaydi. Muhimi, tadqiqot ushbu bogʻliqlikni ikki muhim sohada — siyosat va jamoat sogʻliqni saqlash sohasida oʻrganadi, bu sohalarda ijtimoiy tarmoqlar jamoatchilikdagi notoʻgʻri tushunchalar uchun qanchalik javobgar boʻlishi mumkinligi haqida jiddiy ilmiy va jamoatchilik xavotirlari mavjud.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv xarakteriga ega (STROBE): aniqlangan bogʻliqliklar sabab-oqibat munosabatini isbotlamaydi va natijalar koʻrib chiqilgan sohalar (siyosat va sogʻliqni saqlash) bilan cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Maʼlumotlarimiz ishtirokchilarning ijtimoiy tarmoqlarda keng tarqalgan ham haqiqiy, ham yolgʻon daʼvolar boʻyicha baholarini oʻz ichiga oladi. Biz ijtimoiy tarmoqlardan foydalanishning ham oʻz-oʻzini hisobot qilish, ham xulq-atvor koʻrsatkichlaridan foydalandik va ijtimoiy tarmoqlarni oʻzlari uchun muhim axborot manbai deb hisoblaydiganlar oʻrtasidagi bogʻliqlikni tekshirdik. Barcha tahlillar davomida biz ijtimoiy tarmoqlardan foydalanish odamlarning haqiqiy va yolgʻon maʼlumotlarni ajrata olish qobiliyati bilan sezilarli darajada bogʻliqligiga hech qanday dalil topmadik.&lt;/p&gt;\n&lt;h4 id=\"qoshimcha-malumot\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#qoshimcha-malumot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qoʻshimcha maʼlumot&lt;/span&gt;&lt;/a&gt;Qoʻshimcha maʼlumot&lt;/h4&gt;\n&lt;p&gt;S1 fayli. Qoʻshimcha ilova. (PDF)&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;Ushbu tadqiqot YouGov tomonidan boshqariladigan ikkita alohida panelga asoslangan. Birinchi panel 2020-yilgi AQSh prezidentlik kampaniyasini qamrab olgan boʻlib, maʼlumotlar 2020-yil 17-sentabrdan 2020-yil 23-noyabrgacha toʻplangan. Ushbu tahlillarda taxminan ikki hafta oraligʻida oʻtkazilgan besh toʻlqinli maʼlumotlardan foydalanilgan. YouGov namunaning vakilligini taʼminlash uchun namunaning yarmi uchun tanlanmani moslashtirish (sample matching) yondashuvidan foydalangan (boshlangʻich bosqichda n = 700); xulq-atvor maʼlumotlariga ega boʻlgan namuna ehtimoliy boʻlmagan namuna edi (boshlangʻich bosqichda n = 700) va faqat oʻz veb-xulq-atvorini kuzatishga rozi boʻlgan koʻngillilarni oʻz ichiga olgan. Ikkinchi panel 2020-yil 9-dekabrdan 2021-yil 16-iyungacha boʻlgan COVID-19 pandemiyasini qamrab olgan. Har oyda yetti toʻlqinli maʼlumotlar toʻplangan. Bu ehtimoliy boʻlmagan namuna edi, chunki u faqat oʻz veb-xulq-atvorini baham koʻrishga tayyor boʻlgan ishtirokchilarni oʻz ichiga olgan (boshlangʻich bosqichda N = 1200). Ushbu tadqiqotlar Ogayo shtati universitetining Institutsional tekshiruv kengashi tomonidan tasdiqlangan (protokollar №2020B0359 va №2018B0544). Ishtirokchilar har ikkala tadqiqot uchun soʻrovnoma orqali yozma ravishda xabardor qilingan rozilik berishgan.&lt;/p&gt;\n&lt;h4 id=\"panel-va-xulq-atvor-malumotlarini-birlashtirish\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#panel-va-xulq-atvor-malumotlarini-birlashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Panel va xulq-atvor maʼlumotlarini birlashtirish&lt;/span&gt;&lt;/a&gt;Panel va xulq-atvor maʼlumotlarini birlashtirish&lt;/h4&gt;\n&lt;p&gt;Biz YouGov bilan ikkita mustaqil maʼlumotlar toʻplamini yigʻish boʻyicha shartnoma tuzdik, ularning har biri xulq-atvor maʼlumotlari bilan birlashtirilgan koʻp toʻlqinli panel tadqiqotidan iborat. Birinchisi 2020-yilgi AQSh saylovlari davrida oʻtkazilgan va saylov kunigacha har ikki haftada bir marta oʻtkazilgan 5 ta maʼlumot yigʻish toʻlqinidan iborat boʻlgan. Ikkinchisi COVID-19 ga qaratilgan va 2020-yil dekabridan boshlab har oyda yigʻilgan 7 ta toʻlqindan iborat edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Panel tadqiqoti — bu bir xil respondentlar maʼlum vaqt oraligʻida bir necha marta soʻrovdan oʻtkaziladigan maʼlumot yigʻish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz har bir sohaga oid bir nechta shov-shuvli rost va yolgʻon daʼvolarni aniqlash uchun ijtimoiy tarmoqlardagi faollik maʼlumotlaridan foydalandik, ushbu hikoyalar asosida bir qator tasdiqlovchi bayonotlar tuzdik va respondentlardan ularning ishonchliligini baholashni soʻradik. Biz ushbu ishonchlilikni baholash batareyalaridan signalni aniqlash nazariyasi (SDT) yordamida ishtirokchilarning rost va yolgʻon maʼlumotlarni ajrata olish qobiliyatini oʻlchash uchun foydalandik. SDTda sezgirlik signalni (bizning holatda — rost bayonotlar) va shovqinni (yolgʻon bayonotlar) ajrata olish qobiliyatidir. Sezgirlik 0 dan (toʻliq notoʻgʻri tasniflash) 1 gacha (mukammal tasniflash) oʻzgaradi, bunda 0,5 tasodifiy taxminga teng. Biz ushbu koʻrsatkichdan ishtirokchilarning yanglishishga moyilligini baholash uchun foydalanamiz.&lt;/p&gt;\n&lt;p&gt;Shuningdek, YouGov bizga rozilik bildirgan ishtirokchilarning veb-brauzer va ilovalardan foydalanish tarixini taqdim etdi, bu esa panelning har bir toʻlqinidan oldin ishtirokchilarning ijtimoiy tarmoqlardan foydalanishini kuzatishning noinvaziv usulini taʼminladi. Biz ushbu maʼlumotlardan toʻrtta ijtimoiy tarmoq platformasining har biri uchun bir nechta media foydalanish koʻrsatkichlarini yaratish uchun foydalandik: Facebook, Twitter (maʼlumot yigʻish vaqtida shunday nomlangan), YouTube va Instagram.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f1.jpg\" alt=\"Ikkita panel so‘rovlarida ijtimoiy tarmoqlarda o‘tkazilgan vaqt taqsimoti. Ikkita panel tadqiqotida to‘rtta ijtimoiy tar\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ikkita panel so‘rovlarida ijtimoiy tarmoqlarda o‘tkazilgan vaqt taqsimoti. Ikkita panel tadqiqotida to‘rtta ijtimoiy tarmoqda o‘tkazilgan daqiqalar taqsimoti. 2020-yilgi AQSH prezidentlik saylovlariga (A) va 2020-yil dekabridan 2021-yil iyunigacha bo‘lgan COVID-19 pandemiyasi davriga (B) qaratilgan panellar uchun Facebook, Instagram, Twitter va YouTube’da o‘tkazilgan daqiqalarning qo‘shimcha kumulyativ taqsimot funksiyalari (CCDF).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f2.jpg\" alt=\"Ijtimoiy tarmoqlardan foydalanish va siyosat bilan bog‘liq e’tiqod sezgirligi o‘rtasidagi bog‘liqlik. Ijtimoiy tarmoqlar\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ijtimoiy tarmoqlardan foydalanish va siyosat bilan bog‘liq e’tiqod sezgirligi o‘rtasidagi bog‘liqlik. Ijtimoiy tarmoqlardan foydalanish bo‘yicha AQSH prezidentlik saylovlaridagi e’tiqod sezgirligining ehtimollik zichligi baholari. Panellarda ma’lumotlarni yig‘ish davrida (A) Facebook, (B) Twitter, (C) YouTube va (D) Instagram’da bir hafta ichidagi noyob soatlarning desillari ko‘rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f3.jpg\" alt=\"Ijtimoiy tarmoqlardan foydalanish va COVID-19 bilan bog‘liq e’tiqod sezgirligi o‘rtasidagi bog‘liqlik. Ijtimoiy tarmoqla\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ijtimoiy tarmoqlardan foydalanish va COVID-19 bilan bog‘liq e’tiqod sezgirligi o‘rtasidagi bog‘liqlik. Ijtimoiy tarmoqlardan foydalanish bo‘yicha COVID-19 pandemiyasi uchun e’tiqod sezgirligining ehtimollik zichligi baholari. Panellarda ma’lumotlarni yig‘ish davrida (A) Facebook, (B) Twitter, (C) YouTube va (D) Instagram’da bir oy ichidagi noyob soatlarning desillari ko‘rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f4.jpg\" alt=\"2020-yilgi AQSH prezidentlik saylovlari paneli ma’lumotlaridan foydalangan holda ijtimoiy tarmoqlardan foydalanishning e\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2020-yilgi AQSH prezidentlik saylovlari paneli ma’lumotlaridan foydalangan holda ijtimoiy tarmoqlardan foydalanishning e’tiqod sezgirligiga ta’sirini baholash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2020-yilgi AQSH prezidentlik saylovlari paneli ma’lumotlaridan foydalangan holda ijtimoiy tarmoqlardan foydalanishning e’tiqod sezgirligiga ta’sirini baholash. Nuqtalar ichki-tashqi regressiya modellari (Materiallar va usullar bo‘limida tasvirlanganidek) koeffitsiyentlari baholarini ifodalaydi. Qalin chiziqlar 95% ishonch intervallarini ifodalaydi. Yupqa chiziqlar ko‘p sonli testlar uchun Bonferroni tuzatishidan keyingi ishonch intervallarini ifodalaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f5.jpg\" alt=\"COVID-19 paneli ma’lumotlaridan foydalangan holda ijtimoiy tarmoqlardan foydalanishning e’tiqod sezgirligiga ta’sirini b\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;COVID-19 paneli ma’lumotlaridan foydalangan holda ijtimoiy tarmoqlardan foydalanishning e’tiqod sezgirligiga ta’sirini baholash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;COVID-19 paneli ma’lumotlaridan foydalangan holda ijtimoiy tarmoqlardan foydalanishning e’tiqod sezgirligiga ta’sirini baholash. Nuqtalar ichki-tashqi regressiya modellari (Materiallar va usullar bo‘limida tasvirlanganidek) koeffitsiyentlari baholarini ifodalaydi. Qalin chiziqlar 95% ishonch intervallarini ifodalaydi. Yupqa chiziqlar ko‘p sonli testlar uchun Bonferroni tuzatishidan keyingi ishonch intervallarini ifodalaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ijtimoiy&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tarmoqlar&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;feyklarga&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ta'sirmi&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Panel&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;so'rovlari va&lt;/text&gt;&l
