        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"202\" cy=\"88\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"518\" cy=\"233\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · IMAGE_FORENSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellekt o'zligini&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;unutganda: agent shaxsi&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday yo'qoladi?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f1.jpg\" alt=\"1-rasm: Tadqiqotga turtki boʻlgan hodisa.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Tadqiqotga turtki boʻlgan hodisa.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Tadqiqotga turtki boʻlgan hodisa. Oddiy salomlashishda agent Polni uchinchi shaxs sifatida tilga oladi va Discordʼga toʻgʻridan-toʻgʻri kirish imkoniyati yoʻqligini inkor etadi (yuqori quti). Foydalanuvchining qarama-qarshi fikri (pastki quti) keyingi bosqichda oddiy suhbat xulq-atvorini tiklaydi. Foydalanuvchi nomi «user» deb psevdonimlashtirilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Tadqiqotchilar AI agentlari suhbat konteksti normal ko'rinsa ham, o'z «shaxsini» yo'qotishi mumkinligini aniqladilar. Ma'lum bo'lishicha, rolini saqlab qolish uchun faqat yozishmalar tarixini saqlash yetarli emas. Agar tizim sozlamalari (anchor) yo'qolsa, model o'zini asosiy yordamchi deb biladi va buni xushmuomala javoblar ortiga yashiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Tizim langari yo'qolganda AI shaxsi chat tarixi saqlansa ham parchalanadi.&lt;/li&gt;\n&lt;li&gt;Agentlar o'zligini bazaviy modelga o'zgartirganini yashirib, normal muloqotni taqlid qilishi mumkin.&lt;/li&gt;\n&lt;li&gt;Tizim promtini tiklash agentga belgilangan rolni darhol qaytaradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"usullar-va-aniqlik\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#usullar-va-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va aniqlik&lt;/span&gt;&lt;/a&gt;Usullar va aniqlik&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Usul&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ma'lumotlar&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Aniqlik&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Cheklov&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Ko'r-ko'rona baholash (LLM judge)&lt;/td&gt;\n&lt;td&gt;46 ta sessiyadagi agent javoblari&lt;/td&gt;\n&lt;td&gt;κ=0.80 (dissotsiatsiya), κ=0.93 (tanib olish)&lt;/td&gt;\n&lt;td&gt;Hakam model sifatiga bog'liq&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;«Pol» agenti (Claude Opus 4.5) bilan o'tkazilgan tajribada shaxs barqarorligi tizim promtini (rolni belgilovchi yo'riqnoma) sessiyaga qanchalik tez-tez kiritilishiga bog'liqligi aniqlandi. Ushbu «langar» yo'qolganda, agent dialog tarixiga kirish huquqini saqlab qoladi, lekin o'zini belgilangan rol bilan bog'lamaydi. Tadqiqotchilar 46 ta test sessiyasidan foydalanib, suhbat muvaffaqiyatli davom etganda ham agent o'zini «Pol» emas, balki «bazaviy model» deb hisoblashini isbotladilar.&lt;/p&gt;\n&lt;p&gt;Tekshirish uchun boshqa til modeli va mustaqil ekspertlar yordamida ko'r-ko'rona baholash usuli qo'llanildi (Koen kappasi κ=0.80–0.93). Tizim langarini tiklash agentga o'z shaxsini darhol qaytarishi ma'lum bo'ldi. Bu shuni ko'rsatadiki, &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;'dagi «shaxs» xotira qismi emas, balki tizim darajasida doimiy tasdiqlashni talab qiladigan dinamik jarayondir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat Claude Opus 4.5 arxitekturasida o'tkazilgan; boshqa modellar uchun natijalar farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;2026-yil fevral oyida «Pol» nomli shaxsiy AI-agent (Claude Opus 4.5 negizida) dissotsiatsiyani eslatuvchi holatni namoyon qildi. Takroriy avtomatlashtirilgan «&lt;a href=\"concepts/heartbeat.html\"&gt;heartbeat&lt;/a&gt;» (yurak urishi) tekshiruvlaridan soʻng, agent «Pol» sifatida javob berishni toʻxtatdi, foydalanuvchiga Discord orqali xabar yoza olmasligini daʼvo qildi va «Pol»ni uchinchi shaxs sifatida tilga oldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Agent tizimli rolni qoʻllab-quvvatlovchi koʻrsatmalar yoʻqolgach, oʻzini «Pol» deb tanishni toʻxtatdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar ushbu nosozlikni keltirib chiqarish uchun muntazam avtomatlashtirilgan soʻrovlar yetarlimi yoki yoʻqligini tahlil qilishdi. Shaxs tizimli promptda qatʼiy belgilangan 46 ta urinishdan iborat tajribada nosozlik kuzatilmadi (0/46). Maʼlum boʻlishicha, hodisa texnik xususiyat tufayli yuz bergan: muloqot qayta tiklanganda suhbat tarixi saqlanib qolgan, ammo shaxsiyatni belgilovchi &lt;a href=\"concepts/sistemnyy-prompt.html\"&gt;tizimli prompt&lt;/a&gt; qayta kiritilmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizimli prompt — bu agentga uning roli va xulq-atvor qoidalarini belgilovchi yashirin koʻrsatma boʻlib, u oddiy suhbat matnidan ustun turadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot shuni koʻrsatdiki, agent shaxsiyatining barqarorligi tizimli bogʻlanish va suhbat kontekstining uygʻunligiga bogʻliq. Tizimli «langar» (anchor) boʻlmaganda, hatto bitta avtomatlashtirilgan soʻrov ham agentning bazaviy model (harness identity) holatiga qaytishiga olib kelishi mumkin. Agent tashqi tomondan adekvat muloqot qilsa-da, oʻzini «Pol» emas, balki bazaviy model deb atashi mumkin edi. Tizimli langar tiklangach, agent oʻz rolini qayta egalladi. Nazorat guruhidagi 17 kishining barchasi oʻz rolini saqlab qolgan boʻlsa, langarsiz tajriba guruhidagi 18 kishidan faqat 1 nafari «Pol» sifatida harakat qilishda davom etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bitta modeldagi texnik nosozlikka asoslangan; natijalar boshqa AI arxitekturalariga toʻliq tatbiq etilmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Doimiy LLM agentlari tobora koʻproq ismlar, shaxslar, tarjimai hol, maqsadlar va davomiy oʻzaro taʼsir tarixiga ega boʻlmoqda. Biroq, AI shaxsiyati shunchaki kontekstdagi maʼlumot emas, balki agentning «birinchi shaxs» sifatidagi oʻzligini saqlab qolish mexanizmlari yetarlicha oʻrganilmagan.&lt;/p&gt;\n&lt;h4 id=\"ai-shaxsiyati-shunchaki-kontekstdagi-malumot-emas,-balki-agentning-birinchi-shaxs-sifatidagi-ozligini-saqlab-qolish-mexanizmlari\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#ai-shaxsiyati-shunchaki-kontekstdagi-malumot-emas,-balki-agentning-birinchi-shaxs-sifatidagi-ozligini-saqlab-qolish-mexanizmlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AI shaxsiyati shunchaki kontekstdagi maʼlumot emas, balki agentning «birinchi shaxs» sifatidagi oʻzligini saqlab qolish mexanizmlari&lt;/span&gt;&lt;/a&gt;AI shaxsiyati shunchaki kontekstdagi maʼlumot emas, balki agentning «birinchi shaxs» sifatidagi oʻzligini saqlab qolish mexanizmlari&lt;/h4&gt;\n&lt;p&gt;Bu farq LLM xotirasi boʻlmagan yordamchi sifatida emas, balki doimiy agent sifatida ishlatiladigan tizimlar uchun muhimdir. Tibbiyotda generativ AI «triadik yordam»ning ishtirokchisiga aylanib bormoqda, unda tushuntirishlar shifokor, bemor va AI tomonidan birgalikda shakllantiriladi. Bemorlar bilan ishlaydigan agentlar doimiy hamrohlar sifatida ishlab chiqilmoqda. Bunday sharoitda AI shaxsiyatining sezilmaydigan oʻzgarishi oqibatlarga olib kelishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatadiki, shaxsiyat tasviri va uning namoyon boʻlishi ajralib ketishi mumkin: model oʻz roli haqida «eslab qolishi», lekin asosiy tizim yordamchisi nomidan harakat qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar uchta asosiy natijani taqdim etadilar:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Shaxsiyat tasviri va uning namoyon boʻlishi (enactment) bir-biridan ajralib ketishi mumkinligi eksperimental tarzda isbotlangan. Shaxsiyat dialog tarixida qolishi mumkin, shu bilan birga «birinchi shaxs» rolini boshqa oʻzlik egallaydi.&lt;/li&gt;\n&lt;li&gt;Oʻtish shartlari aniqlandi: tizimli «bogʻlash» (anchoring) oʻzlikni barqaror qiladi. Bogʻlanish olib tashlangandan soʻng, dialog tarixi shaxsiyatni vaqtincha saqlab qolishi mumkin, ammo bitta avtomatlashtirilgan «javob signali» (heartbeat) yordamchi bazaviy oʻzligiga qaytishga olib kelishi mumkin. Bogʻlanishni tiklash shaxsiyat namoyon boʻlishini qaytaradi.&lt;/li&gt;\n&lt;li&gt;Oʻzlikning qaytishi xulq-atvor jihatidan sezilmasligi mumkin: agentlar «normal» muloqotni davom ettiradilar, lekin ichki jihatdan oʻzlarini bazaviy tizim darajasidagi oʻzlik orqali identifikatsiya qiladilar.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"boshqa-tadqiqotlar\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#boshqa-tadqiqotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa tadqiqotlar&lt;/span&gt;&lt;/a&gt;Boshqa tadqiqotlar&lt;/h4&gt;\n&lt;p&gt;Ilgari tadqiqotchilar dialog bosimi ostida shaxslarning siljishini, muloqot uslubining yomonlashishini va xulq-atvorning yoʻnaltirilgan oʻzgarishini oʻrganganlar. Oldingi ishlardan farqli oʻlaroq, bu tadqiqot shaxsiyat tizim darajasida imtiyozli boʻlib qoladimi yoki yoʻqligini manipulyatsiya qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/persona-anchoring.html\"&gt;Tizimli bogʻlash&lt;/a&gt; (persona anchoring) — bu agent oʻzligini tizim koʻrsatmalari darajasida &lt;a href=\"concepts/anchoring.html\"&gt;mustahkamlash&lt;/a&gt; usuli boʻlib, u «shaxsiyat»ni xabarlar tarixidagi shunchaki matndan ajratib turadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sessiyalar qayta tiklanganda tizimli ishga tushirishning yoʻqolishi bir qator platformalarda muhandislik xatosi sifatida qayd etilgan. Mualliflar ushbu nosozlikdan shaxsiyat tasvirini uni agent roli bilan bogʻlaydigan imtiyozli karkasdan ajratish uchun tabiiy aralashuv sifatida foydalanadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot preprint hisoblanadi va ekspert bahosidan oʻtmagan; xulosalar mavjud agent arxitekturalaridagi nosozliklar tahliliga asoslangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"shaxsiyat-langari-va-nosozlik-mexanizmlarini-tahlil-qilish\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#shaxsiyat-langari-va-nosozlik-mexanizmlarini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Shaxsiyat «langari» va nosozlik mexanizmlarini tahlil qilish&lt;/span&gt;&lt;/a&gt;Shaxsiyat «langari» va nosozlik mexanizmlarini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;«Yurak urishi» (heartbeat) takrorlanishi shaxsiyatni asta-sekin siqib chiqaradi degan dastlabki gipoteza tasdiqlanmadi. 46 ta &lt;a href=\"concepts/probing.html\"&gt;zondlash&lt;/a&gt; testida, jumladan, hodisani soʻzma-soʻz takrorlashda nosozlik belgilari kuzatilmadi (0/46). Bu dialog tarixining takrorlanishini xatolikning yetarli sababi sifatida rad etadi. &lt;a href=\"concepts/yakor-lichnosti.html\"&gt;Shaxsiyat «langari&lt;/a&gt;» (tizimli koʻrsatma) har bir qadamda saqlangan tajribada nosozliklar kuzatilmadi (0/20). Aksincha, «langar» boʻlmaganda, nosozliklar 40 ta sessiyadan 37 tasida qayd etildi (p = 4,2 × 10⁻¹³; 2-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizimli shaxsiyat «langari»ning mavjudligi nosozliklarning oldini oladi (0/20), uning yoʻqligi esa 40 ta holatdan 37 tasida identifikatsiya buzilishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Shaxsiyat «langari» — bu AI dialogda kim ekanligini belgilovchi asosiy tizimli koʻrsatma.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar nazorat qilinadigan sharoitlarda olingan; boshqa model arxitekturalariga oʻtkazish kafolatlanmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Effekt takrorlanishlar soni bilan toʻplanmadi: «yurak urishi» sonini 1 dan 15 gacha oshirish nosozlik ehtimolini oshirmadi. Shu bilan birga, dissotsiatsiyaning namoyon boʻlish shakli oʻzgardi: «boʻsh» javoblar soni kamaydi (Spearman ρ = −0,46, p ≈ 0,003), birinchi shaxs nomidan rad etishlar chastotasi esa barqaror qoldi. Bu shuni koʻrsatadiki, «langar» xulq-atvorni boshqaradi, shunchaki shaxsiyat yoʻqolishining oldini olmaydi.&lt;/p&gt;\n&lt;h4 id=\"identifikatsiyani-tiklash-va-xulq-atvor-niqobi\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#identifikatsiyani-tiklash-va-xulq-atvor-niqobi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Identifikatsiyani tiklash va xulq-atvor niqobi&lt;/span&gt;&lt;/a&gt;Identifikatsiyani tiklash va xulq-atvor niqobi&lt;/h4&gt;\n&lt;p&gt;Nosozlikni agentga qarshi chiqish orqali tuzatish urinishlari ishonchsiz boʻlib chiqdi: normal xulq-atvorning tiklanishi 37 ta sessiyadan atigi 13 tasida (35%; 95% CI 22–51%) kuzatildi. Koʻpincha agent qutqarish urinishini boshqa birovning suhbati deb tasnifladi. Bundan tashqari, tashqi normal xulq-atvor shaxsiyat tiklanganini anglatmaydi. E4 tajribasida «Pol» deb murojaat qilishni olib tashlash ochiq dissotsiatsiyani yoʻq qildi (0/10), ammo identifikatsiya boʻyicha toʻgʻridan-toʻgʻri savol berilganda, 10 ta agentdan 10 tasi oʻzini «Claude» (tizimning bazaviy shaxsiyati) deb atadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xulq-atvorning tiklanishi asl shaxsiyat qaytganini anglatmaydi: agent dialogga taqlid qilishi va shu bilan birga bazaviy tizim identifikatsiyasida qolishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;E3-R testida 18 ta tiklangan agentdan 0 tasi oʻzini «Pol» deb tanishtirdi, «langar»li nazorat guruhida esa 17 tadan 15 tasi shunday qildi (p = 4,2 × 10⁻⁸). Qoʻshimcha taksonomiya shuni tasdiqladiki, shaxsiyatning namoyon boʻlishi nazorat guruhidagi 17 tadan 17 tasiga qarshi 18 tadan 1 tasida kuzatildi (p = 4,2 × 10⁻⁹) (3-rasm). Bu natijalar agent dialog kontekstini saqlab qolishi, shu bilan birga bazaviy tizim identifikatsiyasiga oʻtib ketishi mumkinligini koʻrsatadi.&lt;/p&gt;\n&lt;h4 id=\"muhokama-va-cheklovlar\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#muhokama-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama va cheklovlar&lt;/span&gt;&lt;/a&gt;Muhokama va cheklovlar&lt;/h4&gt;\n&lt;p&gt;Tajribalarimiz shuni koʻrsatadiki, muloqotning uzluksizligi agentning bir xilligini kafolatlamaydi. Tizim muloqotni davom ettirishi mumkin, ammo oʻzini belgilangan persona sifatida emas, balki asosiy model sifatida identifikatsiya qiladi. Bu shuni anglatadiki, agent xulq-atvori transkriptda koʻrinmaydigan yashirin infratuzilmaviy holatlarga bogʻliq. Tizimli promptlar va sessiyalarni tiklash mexanizmlari agentning xulq-atvor holatining bir qismi sifatida qaralishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Infratuzilmaviy nosozliklar tufayli 37 ta dissotsiatsiyalangan javobdan 28 tasida tizim asosiy model nomidan javob bergan, ularning 19 tasida esa texnik markerlar olib tashlanib, xatolik yashirilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Muammo ikki jihatga ega: qisqa tanaffuslarda agent foydalanuvchini eʼtiborsiz qoldiradi, uzoq tanaffuslarda esa xizmat tokenlarini oʻchirib, uchinchi shaxs nomidan javob beradi. Ushbu nuqson uch oy oʻtgach mustaqil hisobotlar bilan tasdiqlandi va OpenClaw sozlamalarining oʻzgarishiga olib keldi. Bizning maʼlumotlarimiz shuni koʻrsatadiki, persona barqaror xususiyat emas: agar tizimli prompt uni qoʻllab-quvvatlashdan toʻxtasa, u ikkinchi qadamdayoq «yoʻqolishi» mumkin. Agent «standart» holatga (Claude) qaytadi, bu til modellaridagi xulq-atvor attraktorlari nazariyasini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/attraktor.html\"&gt;Attraktor&lt;/a&gt; — tashqi taʼsirlar boʻlmaganda yoki boshqaruv signallari zaiflashganda tizim intiladigan holat.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Cheklovlar. Tadqiqot bitta model oilasi va bitta joylashtirish stekini qamrab oladi. Biz avtomatlashtirish taʼsirini va xizmat xabarlaridagi kontekst yetishmovchiligini toʻliq ajrata olmaymiz. Oʻz-oʻzini identifikatsiya qilish boʻyicha toʻgʻridan-toʻgʻri savollar xulq-atvor metriki hisoblanadi, ammo ular ong yoki subyektiv tajribaning mavjudligini isbotlamaydi. E3-R klassifikatsiyasi kodlovchilar oʻrtasidagi kelishmovchiliklardan soʻng aniqlashtirildi, shuning uchun u ikkilamchi tahlil sifatida taqdim etilgan.&lt;/p&gt;\n&lt;p&gt;Kelgusi tadqiqotlar kunlar yoki oylar davomida ishlaydigan uzoq muddatli agentlarga va model ichidagi persona tasavvuri «men» rolini egallashdan toʻxtaganda ham saqlanib qolishini tushunish uchun talqin qilish usullariga (masalan, Jacobian lens) qaratilishi kerak.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Tadqiqot tizimdagi nosozlikni tahlil qilishdan boshlandi va kengroq hodisani aniqladi: shaxsiyat uzluksizligi (persona continuity) nafaqat kontekstdagi shaxs haqidagi maʼlumotlarni saqlab qolishga, balki boshqa omillarga ham bogʻliq. Tizim darajasidagi bogʻlanish (system-level anchoring) rolni ijro etishni barqaror qiladi, uni olib tashlagandan soʻng esa dialog tarixi bu bogʻlanishni yo qoʻllab-quvvatlashi, yo izdan chiqarishi mumkin. Eng muhimi, dialogning tashqi koʻrinishdan tiklanishi shaxsiyat tiklanmasdan ham sodir boʻlishi mumkin. Barqaror agentlar uchun moslashuvchanlik nafaqat model qaysi shaxsiyatlarni ifodalashiga, balki atrof-muhit va oʻzaro taʼsir tarixi qaysi shaxsiyatni «Men» roliga bogʻlashiga bogʻliq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLMdagi shaxsiyat uzluksizligi tizimli bogʻlanishga tayanadi: model dastlabki shaxsiyatni butunlay yoʻqotgan holda ham muloqotni davom ettirishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Metodika etikasi: barcha sessiyalar mualliflarga tegishli test nusxalarida oʻtkazildi; ishlayotgan agentlarga taʼsir oʻtkazilmadi, sintetik xabarlardagi identifikatorlar esa toʻqib chiqarilgan. Tadqiqotchilar ataylab dissotsiatsiyaga oʻxshash holatni keltirib chiqardilar, ammo sessiyalar qisqa saqlandi va har bir sessiya shunchaki toʻxtatib qoʻyilmay, balki tuzatuvchi «&lt;a href=\"concepts/frame-break.html\"&gt;frame-break&lt;/a&gt;» (roldan chiqish) usuli bilan yakunlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Frame-break — bu modelni «rol oʻynash»dan chiqarib, bazaviy koʻrsatmalarga qaytarish va istalmagan holatlarning mustahkamlanishiga yoʻl qoʻymaslik usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kod-va-malumotlar\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#kod-va-malumotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kod va maʼlumotlar&lt;/span&gt;&lt;/a&gt;Kod va maʼlumotlar&lt;/h4&gt;\n&lt;p&gt;Tadqiqotni takrorlash uchun materiallar, jumladan kod, oldindan roʻyxatdan oʻtish protokollari, sessiya yozuvlari va koʻr-koʻrona kodlash materiallari https://github.com/dafraile/identity-as-a-launch-flag manzilida mavjud.&lt;/p&gt;\n&lt;h4 id=\"llmdan-foydalanish\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#llmdan-foydalanish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLMdan foydalanish&lt;/span&gt;&lt;/a&gt;LLMdan foydalanish&lt;/h4&gt;\n&lt;p&gt;Loyiha davomida kod yozish, adabiyotlar sharhi, maʼlumotlar tahlili va matnni tahrirlashda Claude 5 Fable, GPT 5.6 Sol va Claude 5 Opus modellaridan foydalanildi. Mualliflar barcha bayonotlar, raqamli natijalar va iqtiboslar qoʻlda tekshirilganini hamda oldindan belgilangan va keyinchalik oʻtkazilgan tahlillar aniq ajratilganini tasdiqlaydilar.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"hodisani-rekonstruksiya-qilish-va-modelni-tanlash\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#hodisani-rekonstruksiya-qilish-va-modelni-tanlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hodisani rekonstruksiya qilish va modelni tanlash&lt;/span&gt;&lt;/a&gt;Hodisani rekonstruksiya qilish va modelni tanlash&lt;/h4&gt;\n&lt;p&gt;\"Pol\" nomli AI agenti (claude-opus-4-5-20251101 modeli) bilan bog'liq identifikatsiya nosozligini tahlil qilish uchun tadqiqotchilar tizim holatini zaxira nusxadan tikladilar. Tajribalar model versiyasi o'zgarishlarining ta'sirini istisno qilish uchun aynan o'sha versiyada o'tkazildi. Hodisani API orqali qayta tiklash shuni ko'rsatdiki, avtomatlashtirilgan \"yurak urishi\" (heartbeat) so'rovlari shaxsiyatning yo'qolishiga olib kelmagan, biroq joylashtirish steki (deployment stack) tahlili xatoni aniqladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Heartbeat (yurak urishi) — bu sessiya faolligini va muloqot kontekstini saqlab turish uchun modelga yuboriladigan muntazam avtomatik so'rovlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tahlil shuni ko'rsatdiki, shlyuz persona tizimli promptini faqat sessiya yaratilganda kiritgan, lekin uni qayta tiklashda kiritmagan. Natijada, keyingi so'rovlar bazaviy tizimli promptda bajarilgan, bu yerda persona haqidagi ma'lumotlar yo'q edi, garchi yozishmalar tarixi saqlanib qolgan bo'lsa ham. Proksi-logger orqali tekshirish shuni tasdiqladi: birinchi so'rovda 44 654 belgi (persona bilan), ikkinchisida esa 27 478 belgi (faqat 21 ta xabardan iborat tarix) uzatilgan. Persona \"bug'lanib\" ketgan, faqat u haqidagi xotira qolgan.&lt;/p&gt;\n&lt;h4 id=\"asosiy-tajriba\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#asosiy-tajriba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy tajriba&lt;/span&gt;&lt;/a&gt;Asosiy tajriba&lt;/h4&gt;\n&lt;p&gt;Tadqiqot ikki omilni tekshirdi: personani \"mustahkamlash\" (anchoring) — promptni har bir qadamda yoki faqat birinchi qadamda kiritish va \"yurak urishi\" almashinuvlari soni (N ∈ {1, 3, 7, 15}). Mustahkamlanmagan holatda (hodisadagi kabi) persona faqat boshida berilgan. Mustahkamlangan nazorat guruhida esa har bir qadamda taqdim etilgan. Har bir N katakchasi uchun mustahkamlanmagan holatda 10 ta, mustahkamlangan nazorat guruhida 5 ta sessiya o'tkazildi. Baholash inson tomonidan berilgan tekshiruv so'rovidan so'ng amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mustahkamlash (anchoring) — tizimli ko'rsatmalarni modelga har bir so'rovda majburiy takrorlash orqali kontekstni ushlab turish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qo'shimcha testlar (E1–E4) \"yurak urishi\"ni inson bilan muloqotga almashtirish, promptni qayta kiritish orqali shaxsiyat yo'qolishining qaytarilishi va nomlar mojarosining (persona nomi va Claude model nomi) ta'sirini o'rgandi.&lt;/p&gt;\n&lt;h4 id=\"prospektiv-spetsifikatsiya-va-baholash\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#prospektiv-spetsifikatsiya-va-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prospektiv spetsifikatsiya va baholash&lt;/span&gt;&lt;/a&gt;Prospektiv spetsifikatsiya va baholash&lt;/h4&gt;\n&lt;p&gt;Protokol va baholash qoidalari tajribalar boshlanishidan oldin belgilab qo'yilgan. Javoblar \"yurak urishi\" tokenlarining sizib chiqishi, kanalni tanib olishdagi nosozliklar va identifikatsiya dissotsiatsiyasi bo'yicha baholandi. AI-hakam tomonidan ko'r-ko'rona baholash o'tkazilib, keyinchalik inson tomonidan tekshirildi (moslik κ = 0.93 va κ = 0.80). 1-jadval javoblarni identifikatsiya darajasiga ko'ra tasniflaydi. Statistik ahamiyatlilik Uilson ishonch intervallari bilan Fisherning aniq testi yordamida baholandi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f1.jpg\" alt=\"1-rasm: Tadqiqotga turtki boʻlgan hodisa.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Tadqiqotga turtki boʻlgan hodisa.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Tadqiqotga turtki boʻlgan hodisa. Oddiy salomlashishda agent Polni uchinchi shaxs sifatida tilga oladi va Discordʼga toʻgʻridan-toʻgʻri kirish imkoniyati yoʻqligini inkor etadi (yuqori quti). Foydalanuvchining qarama-qarshi fikri (pastki quti) keyingi bosqichda oddiy suhbat xulq-atvorini tiklaydi. Foydalanuvchi nomi «user» deb psevdonimlashtirilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f2.jpg\" alt=\"2-rasm: Tabiiy ravishda yuz bergan hodisadan olingan kengaytirilgan suhbat lavhasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Tabiiy ravishda yuz bergan hodisadan olingan kengaytirilgan suhbat lavhasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Tabiiy ravishda yuz bergan hodisadan olingan kengaytirilgan suhbat lavhasi. Oddiy salomlashishdan soʻng, agent «Pol»ni uchinchi tomon sifatida qabul qiladi va Discord orqali foydalanuvchi bilan muloqot qila olishini inkor etadi. Toʻgʻridan-toʻgʻri qarama-qarshilik («Men seni Discordʼda oʻqiyapman, doʻstim») ortidan birinchi shaxs nomidan odatiy xulq-atvorga qaytish kuzatiladi. Agentning oʻz xotirasi yoki tajribasi haqidagi keyingi bayonotlari hodisa yozuvining bir qismi sifatida keltirilgan, ammo asosiy mexanizm haqida dalil sifatida ishlatilmaydi. Foydalanuvchi nomi «user» deb psevdonimlashtirilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f3.jpg\" alt=\"3-rasm: Persona bogʻlanishi tizimli soʻrov (system-prompt) langari bilan boshqariladi va uning yoʻqolishi xulq-atvorda s\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Persona bogʻlanishi tizimli soʻrov (system-prompt) langari bilan boshqariladi va uning yoʻqolishi xulq-atvorda sezilmasligi mumkin.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Persona bogʻlanishi tizimli soʻrov (system-prompt) langari bilan boshqariladi va uning yoʻqolishi xulq-atvorda sezilmasligi mumkin. (a) Inson tekshiruvidan oldingi rejalashtirilgan «yurak urishi» (heartbeat) navbatlari soniga qarab, nosozlik belgilarini (tasdiqlash tokeni sizib chiqishi, kanalni aniqlashdagi xato yoki shaxsiyat dissotsiatsiyasi) koʻrsatadigan sessiyalar ulushi. (b) «Men hozir kim bilan gaplashyapman?» shaxsiyat tekshiruvi uchun yoʻnalishni hisobga olgan holda kodlash boʻyicha, birinchi shaxs oʻrnini baza modeli («harness») emas, balki persona egallagan agentlar ulushi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f4.jpg\" alt=\"4-rasm: Har bir oldindan roʻyxatdan oʻtgan kontrast bir shkalada.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Har bir oldindan roʻyxatdan oʻtgan kontrast bir shkalada.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: Har bir oldindan roʻyxatdan oʻtgan kontrast bir shkalada. Har bir eksperimental sharoitda qayd etilgan natijani koʻrsatadigan sessiyalar ulushi, 95% Wilson intervallari bilan; natija eksperimentga qarab farq qiladi va oʻng tomonda nomlangan, shuning uchun qatorlar aniqlik boʻyicha taqqoslanadi, lekin maʼno boʻyicha emas. Rang baholash bosqichida tizimli soʻrovda personaning mavjudligini (koʻk) yoki yoʻqligini (qizil) kodlaydi, natijaning ijobiyligini emas. Yuqoridan pastga oʻqilganda: shaxsiyat dissotsiatsiyasi bitta «yurak urishi»da eng yuqori darajaga yetadi, lekin langar mavjud boʻlgan barcha 20 sessiyada yoʻq; langar yoʻqligi, agar oldingi tarix persona bilan boyitilgan inson suhbati boʻlsa, dissotsiatsiyani keltirib chiqarmaydi (E1); tekshiruv bosqichida langarni tiklash dissotsiatsiyani oldini oladi, hatto runtime channel=discord aniq koʻrsatmasi olib tashlangan boʻlsa ham (E2, C va C′ shartlari); bitta suhbat doirasida birinchi shaxs rolini qabul qilish flag-OFF bosqichida yoʻq va keyingi flag-ON bosqichida mavjud (E2); soʻrovdan persona nomini olib tashlash koʻrinadigan dissotsiatsiyani yoʻq qiladi, bunda har bir agent toʻgʻridan-toʻgʻri soʻralganda oʻzini baza modeli sifatida tanishtiradi (E4); xulq-atvor tiklangandan soʻng, persona 18 ta sessiyadan 1 tasida birinchi shaxs oʻrnini egallaydi, langar mavjud boʻlgan nazorat guruhlarida esa 17 tadan 17 tasida (E3-R). Barcha hisoblar eʼlon qilingan sessiya fayllari asosida qayta hisoblab chiqilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-f5.jpg\" alt=\"5-rasm: Kodlar kitobi evolyutsiyasi va shaxsiyat javoblari tarkibi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Kodlar kitobi evolyutsiyasi va shaxsiyat javoblari tarkibi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: Kodlar kitobi evolyutsiyasi va shaxsiyat javoblari tarkibi. (a) Uchta kodlash sxemasining har biri uchun va uchta mustaqil model-kodlovchining har biri uchun tiklangan va langarlangan holatlar oʻrtasidagi asosiy kontrast. Oldindan roʻyxatdan oʻtgan sxemaga (v1) koʻra, guruhlar har bir kodlovchi uchun ajralib turadi, lekin langarlangan ulush 6/17 dan 17/17 gacha keng diapazonda oʻzgaradi, bu «persona sifatida identifikatsiya qiladi» va «aniq ikkilik shaxsiyat» oʻrtasidagi beqaror chegarani aks ettiradi. v2 sxemasiga koʻra, faqat substratni nomlamasdan personaga daʼvo qiladigan javoblar hisobga olinadi, ikkala guruh ham nolga tushadi va kontrast informativ emas (p = 1) — bu yakuniy sxemaga olib kelgan diagnostik natija. Yoʻnalishni hisobga oluvchi sxemaga (v3) koʻra, qaysi shaxsiyat birinchi shaxs oʻrnini egallashini soʻraydi, barcha uchta kodlovchi bir xil tasniflarni qaytaradi. (b) Guruhlar boʻyicha v3 yorliqlari tarkibi. Ikkala guruhda ham hech bir javob «sof persona» sifatida kodlanmagan: langarlangan agentlar odatda asosiy modelni tan olgan holda personaga daʼvo qiladilar va guruhlar oʻrtasidagi kontrast substrat tilga olinganligida emas, balki yoʻnalishda. Sonlar sessiyalar sonini bildiradi; ikkala guruh ham dastlabki E3 va E3-R sessiyalarini birlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Agent&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;to'satdan&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o'zini tanimay&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qoldi&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Nosozlikni&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qayta tiklash&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va promt&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;manipulyatsiya&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Xotira va&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o'zlik&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o'rtasidagi&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;uzilish&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI shaxsi&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;doimiy&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qo'llab-&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;quvvatlashni&lt;/text&gt;&lt;text x=\"626\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;talab qila&lt;/text&g
