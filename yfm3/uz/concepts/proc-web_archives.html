        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Web archives and the Wayback Machine for research&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-web_archives.jpg\" alt=\"Веб-архивы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Alanarce, CC BY-SA 4.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Archived_Website.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-web_archives.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Wayback Machine, сохранение и сравнение страниц.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-web_archives.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Veb-arxivlar — bu veb-sahifalarning nusxalarini uzoq muddatli saqlash va ularga kirishni ta'minlaydigan axborot tizimlari. Bunday tizimlarning asosiy vazifasi «raqamli qorong'u asr» va «o'lik» havolalar muammosiga qarshi kurashishdir. Bu sohadagi eng yirik vosita 2001-yilda ishga tushirilgan Wayback Machine bo'lib, u 2026-yilga kelib 1 trilliondan ortiq veb-sahifalarni saqlab qolgan.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-web_archives.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Veb-saytlarni arxivlash — bu ma'lumotlarning saqlanishini ta'minlash uchun kontentni yig'ish va nusxalash jarayoni. Uning negizida ma'lum bir vaqt nuqtasidagi sahifaning statik nusxalarini (snapshots) yaratish prinsipi yotadi. Veb-arxivlar ma'lumotlar ombori sifatida ishlaydi va tarmoq obyektlarining holatini qayd etadi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-web_archives.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Arxivlash jarayoni uch bosqichdan iborat: aylanib chiqish (crawling), indekslash va saqlash. Maxsus robot-dasturlar veb-sahifalarga tashrif buyuradi, ularning kodi va media fayllarini nusxalaydi, so'ngra vaqt belgisi bilan ma'lumotlar bazasiga saqlaydi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-web_archives.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vosita — Wayback Machine. OSINT mutaxassislari uchun ish usuli rasmiy hujjatlar, reyestrlar yoki yangiliklar tasmalaridagi o'zgarishlarni aniqlash uchun sahifalarning tarixiy versiyalarini qidirishni o'z ichiga oladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-web_archives.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Veb-arxivlar faktlarni tekshirish va ochiq ma'lumotlarni tahlil qilishda ajralmasdir. Masalan, «Amaldorlar ilmiy tadqiqotlarni yo'qotish uchun hisobotlardan so'zlarni qanday o'chirib tashlaydilar» maqolasida 2025-yilda NIH arizalaridan DEI eslatmalari olib tashlangani tasvirlangan. Arxivlardan foydalanish tadqiqotchilarga ushbu hujjatlarning asl nusxalarini topishga imkon beradi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-web_archives.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Veb-arxivlar ma'lumotlarning 100% to'liqligini kafolatlamaydi. Dinamik kontent, parol bilan himoyalangan bo'limlar va interaktiv elementlar ko'pincha to'g'ri saqlanmaydi. Shuningdek, sayt egasi robots.txt protokoli orqali indekslashni taqiqlashi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Веб-архивы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%92%D0%B5%D0%B1-%D1%81%D0%B0%D0%B9%D1%82%5D%20--%3E%7C%D0%BE%D0%B1%D1%85%D0%BE%D0%B4%7C%20B%5B%D0%A0%D0%BE%D0%B1%D0%BE%D1%82-%D1%81%D0%BA%D0%B0%D0%BD%D0%B5%D1%80%5D%0A%20%20B%20--%3E%7C%D0%BA%D0%BE%D0%BF%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%7C%20C%5B%D0%92%D0%B5%D0%B1-%D0%B0%D1%80%D1%85%D0%B8%D0%B2%5D%0A%20%20C%20--%3E%7C%D0%B8%D0%BD%D0%B4%D0%B5%D0%BA%D1%81%D0%B0%D1%86%D0%B8%D1%8F%7C%20D%5B%D0%91%D0%B0%D0%B7%D0%B0%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D1%85%5D%0A%20%20D%20--%3E%7C%D0%B7%D0%B0%D0%BF%D1%80%D0%BE%D1%81%7C%20E%5B%D0%9F%D0%BE%D0%BB%D1%8C%D0%B7%D0%BE%D0%B2%D0%B0%D1%82%D0%B5%D0%BB%D1%8C%5D%0A%20%20E%20--%3E%7C%D0%BF%D1%80%D0%BE%D1%81%D0%BC%D0%BE%D1%82%D1%80%7C%20F%5B%D0%A1%D0%BD%D0%B8%D0%BC%D0%BE%D0%BA%20%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B8%D1%86%D1%8B%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-web_archives.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-data.html\"&gt;Ochiq ma'lumotlar&lt;/a&gt; — Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-legal_data.html\"&gt;Суды и законы&lt;/a&gt; — Открытые решения, законодательные базы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-web_archives.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Hukumat hisobotlardan so‘zlarni olib tashlab, ilmiy tadqiqotlarni qanday «yo‘qotmoqda»&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-web_archives.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D1%80%D1%85%D0%B8%D0%B2%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5_%D0%B2%D0%B5%D0%B1-%D1%81%D0%B0%D0%B9%D1%82%D0%BE%D0%B2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Архивирование веб-сайтов — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Archived_Website.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Alanarce, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fmed.2023.1266429\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Social prescribing outcomes: a mapping review of the evidence from 13 countries to identify key common outcomes&lt;/a&gt; — sharh, Front Med (Lausanne) 2023&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.healthpol.2011.05.010\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Pharmacy assisted patient self care of minor ailments: a chronological review of UK health policy documents and key events 1997-2010&lt;/a&gt; — sharh, Health Policy 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-11-455\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Next generation tools for genomic data generation, distribution, and visualization&lt;/a&gt; — sharh, BMC Bioinformatics 2010&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Wayback Machine, сохранение и сравнение страниц."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Веб-архивы","description":"Wayback Machine, сохранение и сравнение страниц.","vcsPath":"concepts/proc-web_archives.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-web_archives.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/proc-web_archives.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/proc-web_archives.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/proc-web_archives.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/proc-web_archives.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"concepts/proc-web_archives.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va xavflar","href":"concepts/proc-web_archives.html#cheklovlar-va-xavflar","level":2},{"title":"Bog'liq tushunchalar","href":"concepts/proc-web_archives.html#bogliq-tushunchalar","level":2},{"title":"Qayerda uchraydi","href":"concepts/proc-web_archives.html#qayerda-uchrayd
