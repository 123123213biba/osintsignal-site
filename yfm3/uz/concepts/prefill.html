        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Atama&lt;/strong&gt; · &lt;em&gt;prefill budget&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/prefill.jpg\" alt=\"Prefill\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: User:Mattes, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Mantelb%C3%B6gen.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/prefill.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Prefill — bu model javobni yaratishdan oldin qayta ishlaydigan ma'lumotlar hajmi bo'lib, u javobning formati yoki ohangini belgilaydi.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/prefill.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Prefill — bu neyron tarmoq matn generatsiyasini boshlashdan oldin qayta ishlaydigan ma'lumotlar hajmi bo'lgan axborot mohiyatidir. Bu jarayon javobning konteksti, formati va ohangini belgilaydi. Prefillni tushunish modellar bilan ishlashni sozlash uchun zarur, chunki u tizim foydalanuvchi so'rovini qanday talqin qilishini aniqlaydi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/prefill.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Prefill neyron tarmoq inferens jarayonining bir qismidir. Transformatorlar arxitekturasida model avval barcha kirish tokenlarini (prefill) o'qiydi, ularning ichki tasvirlarini hisoblaydi va shundan keyingina keyingi tokenlarni ketma-ket bashorat qilishni boshlaydi (generatsiya). Prefill modelning kontekst oynasi byudjetiga bevosita ta'sir qiladi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/prefill.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Prefillni qayta ishlash jarayoni ikki bosqichdan iborat. Avval model taqdim etilgan ma'lumotlarni tahlil qilib, kontekstning vektor tasvirini shakllantiradi. Keyin bu kontekst javobni yaratish uchun asos sifatida ishlatiladi. Modelning samaradorligi prefill qanchalik aniq tuzilganiga bog'liq.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"concepts/prefill.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Prefillni boshqarish uchun ishlab chiquvchilar tizimli promptlar va ixtisoslashtirilgan agentlik karkaslaridan foydalanadilar. Prefillni optimallashtirish javob kechikishlarini kamaytiradi, chunki kirish ma'lumotlarini qayta ishlash vaqti ularning hajmiga mutanosibdir.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/prefill.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Prefill model qat'iy rol yoki formatga rioya qilishi kerak bo'lgan vazifalarda juda muhimdir. «Sun'iy intellekt uchun yolg'on detektorlari: model rol o'ynaganda nima uchun ular xato qiladi» maqolasida rol modelini belgilovchi prefill xavfsizlik algoritmlarining javoblarni talqin qilishiga qanday ta'sir qilishi ko'rib chiqiladi. «Nima uchun kichik neyron tarmoqlar vazifalarni bajara olmaydi: gap intellektda emas, balki «bog'lamada»» maqolasida ixtisoslashtirilgan karkaslardan foydalanish ixcham modellarga kirish ma'lumotlarini samaraliroq qayta ishlashga yordam berishi ko'rsatilgan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/prefill.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Prefillning asosiy cheklovi — kontekst oynasining cheklanganligi. Haddan tashqari uzun prefill hisoblash resurslarining ortiqcha sarflanishiga va generatsiya sifatining pasayishiga olib kelishi mumkin. Prefill qarama-qarshi ko'rsatmalarni o'z ichiga olsa, «gallyutsinatsiyalar» xavfi mavjud.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Prefill&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9A%D1%96%D1%80%D1%96%D1%81%20%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%D1%96%5D%20--%3E%20B%5BPrefill%20%D3%A9%D2%A3%D0%B4%D0%B5%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%9A%D0%BE%D0%BD%D1%82%D0%B5%D0%BA%D1%81%D1%82%20%D0%B2%D0%B5%D0%BA%D1%82%D0%BE%D1%80%D1%8B%5D%0A%20%20C%20--%3E%20D%5B%D0%93%D0%B5%D0%BD%D0%B5%D1%80%D0%B0%D1%86%D0%B8%D1%8F%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%96%5D%0A%20%20D%20--%3E%20E%5B%D0%96%D0%B0%D1%83%D0%B0%D0%BF%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ta'rif avtomatik tekshirilgan va tahririyat tasdig'ini kutmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"boshqa-nomlari\"&gt;&lt;a href=\"concepts/prefill.html#boshqa-nomlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa nomlari&lt;/span&gt;&lt;/a&gt;Boshqa nomlari&lt;/h2&gt;\n&lt;p&gt;бюджет предварительного заполнения&lt;/p&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/prefill.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html\"&gt;Sun'iy intellekt uchun yolg'on detektorlari: nega ular rol o'ynashda adashadi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html\"&gt;Kichik neyrotarmoqlar nega vazifalarni bajara olmaydi: muammo intellektda emas&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/prefill.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Tax_return\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Tax return — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Mantelb%C3%B6gen.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: User:Mattes, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Prefill — bu model javobni yaratishdan oldin qayta ishlaydigan ma'lumotlar hajmi bo'lib, u javobning formati yoki ohangini belgilaydi."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Prefill","description":"Prefill — bu model javobni yaratishdan oldin qayta ishlaydigan ma'lumotlar hajmi bo'lib, u javobning formati yoki ohangini belgilaydi.","vcsPath":"concepts/prefill.md"},"headings":[{"title":
