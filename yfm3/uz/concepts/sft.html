        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Atama&lt;/strong&gt; · &lt;em&gt;SFT&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/sft.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Nazorat ostida nozik sozlash (SFT) — bu modelni muayyan vazifalarga moslashtirish va kerakli xatti-harakatlarni majburiy belgilash uchun etiketlangan misollar asosida o'qitish usuli. Bu usul modelni aniq to'g'ri javoblar bilan o'qitishni nazarda tutadi.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/sft.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Nazorat ostida sozlash (Supervised Fine-Tuning, SFT) — bu neyron tarmoq modelini maxsus belgilangan ma'lumotlar to'plamida o'qitish jarayoni bo'lib, u model xulq-atvorini aniq vazifalarni bajarishga moslashtirishga qaratilgan. Asosiy o'qitishdan farqli o'laroq, SFT modelning berilgan ko'rsatmalarga mos keladigan bashoratli javoblarni shakllantirishiga e'tibor qaratadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/sft.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Nazorat ostida sozlash o'qituvchi bilan o'qitish jarayonining bir turi hisoblanadi. Metodning asosi model bashoratlarini o'quv tanlamasidagi etalon javoblar bilan solishtirishda yo'qotish funksiyasini minimallashtirishdan iborat. Axborot mohiyati bo'lgan model o'zining ichki parametrlarini (vaznlarini) to'g'ri javob ehtimolini oshirish uchun tuzatadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/sft.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Jarayon uch bosqichni o'z ichiga oladi. Birinchidan, «ko'rsatma — istalgan natija» juftliklarini o'z ichiga olgan ma'lumotlar to'plami tayyorlanadi. Keyin model o'qitish iteratsiyalaridan o'tadi. Yakunda mustaqil ma'lumotlar asosida sifat baholanadi. Belgilash sifati juda muhim: agar misollarda xatolar bo'lsa, model ularni o'zlashtirib oladi.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"concepts/sft.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;SFTni amalga oshirish uchun gradient tushishi kabi parametrlar optimallashtirish usullari qo'llaniladi. KaliBench kabi maxsus benchmarklar modelning kiberxavfsizlik vositalari bilan ishlash aniqligini baholash uchun ishlatiladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/sft.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;SFT ixtisoslashtirilgan tizimlar aniqligini oshirish uchun ishlatiladi. «Nega neyron tarmoqlar Kali Linux buyruqlarida xato qiladi va buni qanday tuzatish kerak» maqolasida SFTning kiberxavfsizlik vositalari bilan ishlashdagi o'rni ko'rib chiqiladi. «Nega sizning AI agentingiz aqlli bo'lib ko'rinadi: benchmarklar tuzog'i» materialida SFTning testlardagi natijalari haqiqiy qobiliyatlarni aks ettirmasligi mumkinligi ta'kidlanadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/sft.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;SFTning asosiy cheklovi — bu modelning umumlashtirish qobiliyatini yo'qotib, javoblarni yodlab olish xavfidir. Shuningdek, «benchmarklar tuzog'i» muammosi mavjud: model testlarda yuqori natija ko'rsatib, real vazifalarda samarasiz bo'lishi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Nazorat ostida nozik sozlash&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%20%D0%B6%D0%B8%D1%8B%D0%BD%D1%8B%5D%20--%3E%20B%5B%D0%9E%D2%9B%D1%8B%D1%82%D1%83%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%96%5D%0A%20%20B%20--%3E%20C%5B%D0%9C%D0%BE%D0%B4%D0%B5%D0%BB%D1%8C%20%D0%BF%D0%B0%D1%80%D0%B0%D0%BC%D0%B5%D1%82%D1%80%D0%BB%D0%B5%D1%80%D1%96%5D%0A%20%20C%20--%3E%20D%5B%D0%91%D0%BE%D0%BB%D0%B6%D0%B0%D0%BC%D0%B4%D1%8B%20%D0%B6%D0%B0%D1%83%D0%B0%D0%BF%5D%0A%20%20D%20--%3E%20E%5B%D0%91%D0%B5%D0%BD%D1%87%D0%BC%D0%B0%D1%80%D0%BA%20%D1%82%D0%B5%D1%81%D1%82%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%94%D3%99%D0%BB%D0%B4%D1%96%D0%BA%D1%82%D1%96%20%D0%B1%D0%B0%D2%93%D0%B0%D0%BB%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ta'rif avtomatik tekshirilgan va tahririyat tasdig'ini kutmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"malumot\"&gt;&lt;a href=\"concepts/sft.html#malumot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma'lumot&lt;/span&gt;&lt;/a&gt;Ma'lumot&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;steps&lt;/td&gt;\n&lt;td&gt;2202&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;duration_gpu_hours&lt;/td&gt;\n&lt;td&gt;3.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;t
