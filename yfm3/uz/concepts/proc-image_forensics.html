        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Detecting image splicing and copy-move tampering&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-image_forensics.jpg\" alt=\"Криминалистика изображений\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: William James Herschel (1833-1917), Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Fingerprints_taken_by_William_James_Herschel_1859-1860.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Следы монтажа, метаданные, сжатие.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Tasvir kriminalistikasi — bu raqamli medianing haqiqiyligini aniqlash va manipulyatsiya izlarini topish jarayoni. Barmoq izlarini tahlil qilishdan farqli o'laroq, tasvir kriminalistikasi raqamli faylni yaratish va saqlash jarayonida yuzaga keladigan matematik va fizik qonuniyatlarni o'rganadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Tasvir kriminalistikasi «Faktlarni tekshirish va media» sohasining bir qismidir. U har qanday tasvirga olish qurilmasi va dasturiy ta'minot o'ziga xos «raqamli izlar» qoldiradi degan tamoyilga asoslanadi. Asosiy tushunchalarga metama'lumotlar, siqilish darajasi va piksellar taqsimotidagi statistik anomaliyalar kiradi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Tahlil jarayoni ma'lumotlarni yig'ish, belgilarni ajratib olish va tasniflashdan iborat. Avval metama'lumotlar va faylning texnik xususiyatlari olinadi. Keyin algoritmlar sensor shovqinidagi nomuvofiqliklarni yoki qismlarni ko'chirish izlarini qidiradi. Natija tasvir o'zgartirilganligi ehtimolini ko'rsatadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy usullarga siqilish xatolari darajasini tahlil qilish (ELA), takrorlanuvchi sohalarni qidirish va metama'lumotlar yaxlitligini tekshirish kiradi. Tahlil vositalari oddiy fayl sarlavhalarini ko'ruvchilardan tortib, chuqur o'rganishga asoslangan murakkab tizimlargacha boradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Tasvir kriminalistikasi usullari jurnalistika va surishtiruvlarda kontentni tekshirish uchun muhimdir. Masalan, «LiteReality-Agent: skanlarni kod yordamida interaktiv 3D modellarga qanday aylantirish mumkin» maqolasida raqamli egizaklarning aniqligini tasdiqlash uchun dastlabki ma'lumotlarni tekshirish zarurati tasvirlangan.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Tasvir kriminalistikasi yuz foizlik kafolat bermaydi. Asosiy cheklovlar fayllarni qayta siqish va tabiiy sensor shovqinlarini taqlid qila oladigan generativ modellar bilan bog'liq. Tahlil natijalari har doim ehtimoliy xarakterga ega.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Криминалистика изображений&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A6%D0%B8%D1%84%D1%80%D0%BB%D1%8B%D2%9B%20%D0%BA%D0%B5%D1%81%D0%BA%D1%96%D0%BD%5D%20--%3E%20B%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%D0%B4%D1%96%20%D1%82%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%0A%20%20A%20--%3E%20C%5B%D0%A1%D0%B5%D0%BD%D1%81%D0%BE%D1%80%20%D1%88%D1%83%D1%8B%D0%BD%20%D1%82%D0%B5%D0%BA%D1%81%D0%B5%D1%80%D1%83%5D%0A%20%20A%20--%3E%20D%5B%D0%A1%D1%8B%D2%93%D1%8B%D0%BC%D0%B4%D0%B0%D1%83%20%D1%96%D0%B7%D0%B4%D0%B5%D1%80%D1%96%D0%BD%20%D1%96%D0%B7%D0%B4%D0%B5%D1%83%5D%0A%20%20B%20--%3E%20E%5B%D0%A2%D2%AF%D0%BF%D0%BD%D2%B1%D1%81%D2%9B%D0%B0%D0%BB%D1%8B%D2%9B%20%D1%82%D1%83%D1%80%D0%B0%D0%BB%D1%8B%20%D2%9B%D0%BE%D1%80%D1%8B%D1%82%D1%8B%D0%BD%D0%B4%D1%8B%5D%0A%20%20C%20--%3E%20E%0A%20%20D%20--%3E%20E%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Faktlar va mediani tekshirish&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic.html\"&gt;Синтетические медиа&lt;/a&gt; — Детекция сгенерированных изображений, голоса и видео.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-provenance.html\"&gt;Происхождение и водяные знаки&lt;/a&gt; — C2PA, цифровые подписи контента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html\"&gt;Neyrotarmoqlar nima uchun o'zini aldashadi: o'qitish va natija o'rtasidagi tafovut&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html\"&gt;Sun'iy intellekt o'zligini unutganda: agent shaxsi qanday yo'qoladi?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html\"&gt;LiteReality-Agent: xonalarni kod yordamida interaktiv 3D-modellarga aylantirish&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-image_forensics.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%94%D0%B0%D0%BA%D1%82%D0%B8%D0%BB%D0%BE%D1%81%D0%BA%D0%BE%D0%BF%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Дактилоскопия — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Fingerprints_taken_by_William_James_Herschel_1859-1860.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: William James Herschel (1833-1917), Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/biomedicines10071469\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Applications of Neural Networks in Biomedical Data Analysis&lt;/a&gt; — sharh, Biomedicines 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/jimaging7040069\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Comprehensive Review of Deep-Learning-Based Methods for Image Forensics&lt;/a&gt; — sharh, J Imaging 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/jimaging6030009\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Survey of Deep Learning-Based Source Image Forensics&lt;/a&gt; — sharh, J Imaging 2020&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Следы монтажа, метаданные, сжатие."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Криминалистика изображений","description":"Следы монтажа, метаданные, сжатие.","vcsPath":"concepts/proc-image_forensics.md"},"headings":[{"title":"Ta'rif","href":"concepts/proc-image_forensics.html#tarif","level":2},{"title":"Umumiy ko'rinish","href":"concepts/proc-image_forensics.html#umumiy-korinish","level":2},{"title":"Nazariya","href":"concepts/proc-image_forensics.html#nazariya","level":2},{"title":"Bu qanday ishlaydi","href":"concepts/proc-image_forensics.html#bu-qanday-ishlaydi","level":2},{"title":"Usullar va vositalar","href":"concepts/proc-image_forensics.html#usullar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"concepts/proc-image_forensics.html#qayer
