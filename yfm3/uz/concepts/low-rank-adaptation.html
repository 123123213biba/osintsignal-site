        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Atama&lt;/strong&gt; · &lt;em&gt;Low-Rank Adaptation&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/low-rank-adaptation.jpg\" alt=\"LoRA\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: The original uploader was Cnd at English Wikipedia., CC0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:LoRa_Module_with_antenna_and_SPI_wires_attached.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/low-rank-adaptation.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;LoRA (Low-Rank Adaptation) — bu neyron tarmoqlarni samarali sozlash usuli bo'lib, unda vaznlarning faqat kichik bir qismi o'qitiladi, bu esa hisoblash resurslarini tejaydi.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/low-rank-adaptation.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;LoRA (Low-Rank Adaptation) — bu neyron tarmoqlarni samarali sozlash usuli bo'lib, unda modelning barcha parametrlarini o'zgartirish o'rniga, faqat qo'shimcha vaznlarning kichik bir qismi o'qitiladi. Bu yondashuv yirik til modellarini muayyan vazifalarga moslashtirishga imkon beradi va hisoblash resurslari hamda xotira hajmini sezilarli darajada tejaydi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/low-rank-adaptation.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;LoRA asosi shundaki, neyron tarmoqni qayta o'qitishda vazn o'zgarishlari «past ichki o'lchamga» ega. Matematik jihatdan bu vazn o'zgarishlari matritsasini kichikroq rangdagi ikkita matritsa ko'paytmasi sifatida ifodalash mumkinligini anglatadi. To'liq sozlashdan (fine-tuning) farqli o'laroq, LoRA modelning dastlabki vaznlarini muzlatadi va ularga o'qitiladigan adapterlarni qo'shadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/low-rank-adaptation.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;LoRA o'qitish jarayoni oldindan o'qitilgan modelning asosiy vaznlarini muzlatishni o'z ichiga oladi. Diqqat qatlamlariga (attention layers) kichik rangdagi ikkita matritsa (A va B) qo'shiladi. Ma'lumotlar tarmoq orqali o'tganda, natija dastlabki bashorat va ushbu matritsalar ko'paytmasining yig'indisi sifatida hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"concepts/low-rank-adaptation.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;LoRA ni amalga oshirish uchun Hugging Face PEFT kabi chuqur o'qitish kutubxonalari ishlatiladi. Vositalar moslashuv rangini (rank) belgilashga imkon beradi, bu esa matritsalar o'lchamini aniqlaydi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/low-rank-adaptation.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Usul modellarni tor sohalarda ixtisoslashtirish uchun ishlatiladi. «Nega neyron tarmoqlar Kali Linux buyruqlarida xato qiladi va buni qanday tuzatish kerak» maqolasida LoRA kiberxavfsizlik sintaksisi xususiyatlariga moslashish uchun ishlatiladi. «AI-agentga hujumni u sodir bo'lishidan oldin qanday bashorat qilish kerak» materialida usul agentlarni tahdidlar stsenariylarini tahlil qilish uchun sozlashga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/low-rank-adaptation.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;LoRA barcha vazifalar uchun universal yechim emas. Moslashuv rangi juda past bo'lsa, model murakkab ma'lumotlar namunalarini o'zlashtira olmaydi. Shuningdek, agar moslashuv juda o'ziga xos yoki muvozanatsiz ma'lumotlarda o'tkazilsa, model dastlabki ko'nikmalarni «unutib qo'yishi» mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: LoRA&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%9F%D1%80%D0%B5%D0%B4%D0%BE%D0%B1%D1%83%D1%87%D0%B5%D0%BD%D0%BD%D0%B0%D1%8F%20%D0%BC%D0%BE%D0%B4%D0%B5%D0%BB%D1%8C%5D%20--%3E%7C%D0%97%D0%B0%D0%BC%D0%BE%D1%80%D0%BE%D0%B6%D0%B5%D0%BD%D0%BD%D1%8B%D0%B5%20%D0%B2%D0%B5%D1%81%D0%B0%7C%20B%5B%D0%9E%D1%81%D0%BD%D0%BE%D0%B2%D0%BD%D0%BE%D0%B9%20%D1%81%D0%BB%D0%BE%D0%B9%5D%0A%20%20C%5B%D0%90%D0%B4%D0%B0%D0%BF%D1%82%D0%B5%D1%80%20A%5D%20--%3E%7C%D0%9C%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%20%D1%80%D0%B0%D0%BD%D0%B3%D0%B0%7C%20D%5B%D0%A1%D0%BB%D0%BE%D0%B9%20%D0%B0%D0%B4%D0%B0%D0%BF%D1%82%D0%B0%D1%86%D0%B8%D0%B8%5D%0A%20%20E%5B%D0%90%D0%B4%D0%B0%D0%BF%D1%82%D0%B5%D1%80%20B%5D%20--%3E%7C%D0%9C%D0%B0%D1%82%D1%80%D0%B8%D1%86%D0%B0%20%D1%80%D0%B0%D0%BD%D0%B3%D0%B0%7C%20D%0A%20%20D%20--%3E%7C%D0%A1%D1%83%D0%BC%D0%BC%D0%B0%20%D0%B8%D0%B7%D0%BC%D0%B5%D0%BD%D0%B5%D0%BD%D0%B8%D0%B9%7C%20B%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ta'rif avtomatik tekshirilgan va tahririyat tasd
