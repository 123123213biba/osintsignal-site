        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Remote sensing with Sentinel-2 and Landsat satellite imagery&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-sat_imagery.jpg\" alt=\"Анализ спутниковых снимков\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: NOAA, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Satellite_imagery_on_February_27,_2020_of_Great_Lakes_blizzard.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Sentinel, Landsat, разрешение, индексы.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Sun'iy yo'ldosh tasvirlarini tahlil qilish — bu orbital apparatlardan olingan tasvirlar yordamida Yer yuzasi haqidagi ma'lumotlarni olish jarayoni. Bu usul alohida binolardan tortib butun mintaqalargacha bo'lgan ob'ektlar va jarayonlarni o'rganishga imkon beradi va sayyoradagi o'zgarishlarni kuzatish uchun xolis ma'lumotlarni taqdim etadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Sun'iy yo'ldosh fotosurati masofadan zondlashning bir turi bo'lib, unda sun'iy yo'ldosh datchiklari Yer yuzasidan qaytgan yoki chiqarilgan elektromagnit nurlanishni qayd etadi. Bu yerda asosiy tushuncha fazoviy o'lchamlilik (resolution) hisoblanadi — bu tasvirda ajratib ko'rsatilishi mumkin bo'lgan yerdagi ob'ektning eng kichik o'lchami. Sentinel va Landsat kabi sun'iy yo'ldoshlar ko'rinadigan yorug'lik va infraqizil nurlanishni o'z ichiga olgan turli spektral diapazonlarda ishlaydi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Tahlil jarayoni ma'lumotlarni olish, ularni dastlabki qayta ishlash va talqin qilishni o'z ichiga oladi. Dastlab sun'iy yo'ldosh suratga oladi va ma'lumotlar oqimini yer usti stansiyalariga uzatadi. Keyin ma'lumotlar radiometrik va geometrik tuzatishlardan o'tadi. Tahlilchi yoki algoritmlar ob'ektlarni aniqlash uchun klassifikatsiya usullarini qo'llaydi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vositalar geografik axborot tizimlari (GAT) va rastrli ma'lumotlarni qayta ishlash uchun ixtisoslashgan kutubxonalardir. Katta hajmdagi ma'lumotlar bilan ishlash uchun ko'pincha bulutli platformalardan foydalaniladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Tasvirlarni tahlil qilish ekologik monitoring, shaharsozlik va faktlarni tekshirishda qo'llaniladi. «Neyrotarmoqlarni qayta o'qitmasdan sun'iy yo'ldosh tasvirlaridagi ob'ektlarni sanash» maqolasida sun'iy intellektga yangi hududlarda kemalar va binolarni aniqlash imkonini beruvchi usul ko'rib chiqiladi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov — bu bulutli qoplam, u yer yuzasini butunlay yopib qo'yishi mumkin. Shuningdek, vaqtinchalik o'lchamlilikni hisobga olish muhim: sun'iy yo'ldosh har doim ham kerakli vaqtda kerakli nuqta ustida bo'lmasligi mumkin. Mashinali o'qitish algoritmlaridan foydalanganda klassifikatsiya xatolari xavfi mavjud.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Анализ спутниковых снимков&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%96%D0%B5%D1%80%D1%81%D0%B5%D1%80%D1%96%D0%BA%5D%20--%3E%7C%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%D0%B4%D1%96%20%D1%82%D2%AF%D1%81%D1%96%D1%80%D1%83%7C%20B%5B%D0%96%D0%B5%D1%80%D2%AF%D1%81%D1%82%D1%96%20%D1%81%D1%82%D0%B0%D0%BD%D1%86%D0%B8%D1%8F%D1%81%D1%8B%5D%0A%20%20B%20--%3E%7C%D3%A8%D2%A3%D0%B4%D0%B5%D1%83%7C%20C%5B%D0%93%D0%B5%D0%BE%D0%B0%D2%9B%D0%BF%D0%B0%D1%80%D0%B0%D1%82%D1%82%D1%8B%D2%9B%20%D0%B6%D2%AF%D0%B9%D0%B5%5D%0A%20%20C%20--%3E%7C%D0%9A%D0%BB%D0%B0%D1%81%D1%81%D0%B8%D1%84%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D1%8F%7C%20D%5B%D0%9D%D1%8B%D1%81%D0%B0%D0%BD%D0%B4%D0%B0%D1%80%D0%B4%D1%8B%20%D1%82%D0%B0%D0%BD%D1%83%5D%0A%20%20D%20--%3E%7C%D0%9D%D3%99%D1%82%D0%B8%D0%B6%D0%B5%7C%20E%5B%D0%A2%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%20%D0%B5%D1%81%D0%B5%D0%B1%D1%96%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geo.html\"&gt;Sun'iy yo'ldoshlar va geoma'lumotlar&lt;/a&gt; — Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geolocation.html\"&gt;Геолокация по изображению&lt;/a&gt; — Где сделан снимок: рельеф, дороги, тени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-change_detection.html\"&gt;Обнаружение изменений&lt;/a&gt; — Что изменилось между снимками: застройка, леса, разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-night_lights.html\"&gt;Ночные огни и косвенные признаки&lt;/a&gt; — Экономика и события по свечению городов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-osm_gis.html\"&gt;OpenStreetMap и ГИС&lt;/a&gt; — Открытые карты, геоданные, пространственный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html\"&gt;Sun'iy intellekt yordamida sun'iy yo'ldosh tasvirlarini avtomatik hisoblash&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-sat_imagery.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D1%83%D1%82%D0%BD%D0%B8%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D1%84%D0%BE%D1%82%D0%BE%D1%81%D1%8A%D1%91%D0%BC%D0%BA%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Спутниковая фотосъёмка — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;l
