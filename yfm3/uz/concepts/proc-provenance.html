        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Content provenance with C2PA credentials and watermarks&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-provenance.jpg\" alt=\"Происхождение и водяные знаки\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Military Intelligence Division of the United States Department of War during World War II, Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:ONI_JAN_1_Uniforms_and_Insignia_Page_004_German_Army_WW2_Field_gray_uniforms_officers_and_men._Field_caps,_national_emblem,_steel_helmet,_decals,_equipment,_tornister,_infantry_rifleman._June_1943_Field_recognition._US_public_doc._No_co.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-provenance.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;C2PA, цифровые подписи контента.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/proc-provenance.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Kontent kelib chiqishi (content provenance) — bu raqamli media faylning yaratilish va o'zgartirish tarixini qayd etish jarayoni bo'lib, uning haqiqiyligini aniqlashga imkon beradi. Sintetik media tarqalgan davrda suv belgilari va kriptografik imzolar tasvir yoki videoning nashr etilgandan keyin o'zgartirilmaganligini tasdiqlash uchun asosiy vositalarga aylanmoqda.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-provenance.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Kontent kelib chiqishi kriptografiya va metama'lumotlar tamoyillariga asoslanadi. Raqamli imzo — bu faylni uning muallifi yoki yaratilgan qurilmasi bilan bog'laydigan matematik mexanizm. Ushbu kontekstdagi suv belgisi — bu ma'lumotlar tuzilishiga kiritilgan, nusxalash yoki siqish paytida saqlanib qoladigan ko'rinmas yoki ko'rinadigan markerdir.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-provenance.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;C2PA tizimi faylga biriktirilgan himoyalangan manifestni yaratadi. Manifest metama'lumotlarni o'z ichiga oladi: faylni kim yaratgan, qachon va qanday uskunadan foydalanilgan. Agar fayl tahrir qilinsa, dasturiy ta'minot manifestga yangi yozuv qo'shadi va o'zgarishlar tarixini saqlaydi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-provenance.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy usul fayl metama'lumotlariga kriptografik heshlarni kiritishdir. Tekshirish vositalari imzo asl kontentga mos kelishini tasdiqlash uchun ochiq kalitlardan foydalanadi. InfoAgent freymvorki infografika elementlarini tekshiriladigan ma'lumotlar bilan bog'lab, shaffoflikni ta'minlaydi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-provenance.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Kelib chiqishni tekshirish texnologiyalari jurnalistikada dezinformatsiyaga qarshi kurashishda va avtomatlashtirilgan ma'lumotlar tahlili tizimlarida qo'llaniladi. Masalan, \"Neyrotarmoqlarni gallyutsinatsiyalarsiz aniq infografikalar yaratishga qanday majburlash kerak\" maqolasida har bir element manba ma'lumotlar to'plami bilan bog'langan vizualizatsiyalarni yaratish tamoyillari ko'rib chiqiladi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-provenance.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov — bu standartni zanjirning barcha ishtirokchilari: kameradan tortib nashr platformasigacha qo'llab-quvvatlash zarurati. Agar fayl metama'lumotlarni o'chirib tashlaydigan xizmat orqali o'tsa, ishonch zanjiri uziladi.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Происхождение и водяные знаки&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A6%D0%B8%D1%84%D1%80%D0%BB%D1%8B%D2%9B%20%D0%BA%D0%BE%D0%BD%D1%82%D0%B5%D0%BD%D1%82%5D%20--%3E%20B%5B%D0%9A%D1%80%D0%B8%D0%BF%D1%82%D0%BE%D0%B3%D1%80%D0%B0%D1%84%D0%B8%D1%8F%D0%BB%D1%8B%D2%9B%20%D2%9B%D0%BE%D0%BB%D1%82%D0%B0%D2%A3%D0%B1%D0%B0%5D%0A%20%20B%20--%3E%20C%5B%D0%9C%D0%B0%D0%BD%D0%B8%D1%84%D0%B5%D1%81%D1%82%5D%0A%20%20C%20--%3E%20D%5B%D0%9C%D0%B5%D1%82%D0%B0%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%5D%0A%20%20D%20--%3E%20E%5B%D0%A2%D0%B5%D0%BA%D1%81%D0%B5%D1%80%D1%83%20%D0%BF%D1%80%D0%BE%D1%86%D0%B5%D1%81%D1%96%5D%0A%20%20E%20--%3E%20F%5B%D0%A2%D2%AF%D0%BF%D0%BD%D2%B1%D1%81%D2%9B%D0%B0%D0%BB%D1%8B%D2%9B%D1%82%D1%8B%20%D1%80%D0%B0%D1%81%D1%82%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-provenance.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Faktlar va mediani tekshirish&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-image_forensics.html\"&gt;Криминалистика изображений&lt;/a&gt; — Следы монтажа, метаданные, сжатие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic.html\"&gt;Синтетические медиа&lt;/a&gt; — Детекция сгенерированных изображений, голоса и видео.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-provenance.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html\"&gt;IdeaLens: sun'iy intellekt g'oyalarini insonnikidan ajratish&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html\"&gt;Sun'iy intellekt yordamida xatosiz infografikalarni yaratish usuli&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-provenance.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A3%D0%BD%D0%B8%D1%84%D0%BE%D1%80%D0%BC%D0%B0_%D1%81%D1%83%D1%85%D0%BE%D0%BF%D1%83%D1%82%D0%BD%D1%8B%D1%85_%D0%B2%D0%BE%D0%B9%D1%81%D0%BA_%D0%92%D0%B5%D1%80%D0%BC%D0%B0%D1%85%D1%82%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Униформа сухопутных войск Вермахта — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:ONI_JAN_1_Uniforms_and_Insignia_Page_004_German_Army_WW2_Field_gray_uniforms_officers_and_men._Field_caps,_national_emblem,_steel_helmet,_decals,_equipment,_tornister,_infantry_rifleman._June_1943_Field_recognition._US_public_doc._No_co.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Military Intelligence Division of the United States Department of War during World War II, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1136/bmj.b2700\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate healthcare interventions: explanation and elaboration&lt;/a&gt; — sharh, BMJ 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1371/journal.pmed.1000100\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The PRISMA statement for reporting systematic reviews and meta-analyses of studies that evaluate health care interventions: explanation and elaboration&lt;/a&gt; — sharh, PLoS Med 2009&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nrn3241\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The origin of extracellular fields and currents--EEG, ECoG, LFP and spikes&lt;/a&gt; — sharh, Nat Rev Neurosci 2012&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"C2PA, цифровые подписи контента."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Происхождение и водяные знаки","description":"C2PA, цифровые подписи контента.","vcsPath":"concepts/proc-
