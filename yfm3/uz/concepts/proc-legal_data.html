        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Open court decisions and case law datasets&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-legal_data.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Открытые решения, законодательные базы.&lt;/p&gt;\n&lt;h2 id=\"umumiy-korinish\"&gt;&lt;a href=\"concepts/proc-legal_data.html#umumiy-korinish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy ko'rinish&lt;/span&gt;&lt;/a&gt;Umumiy ko'rinish&lt;/h2&gt;\n&lt;p&gt;Sudlar va qonunlar ochiq ma'lumotlar toifasi sifatida sud tizimi faoliyati va normativ-huquqiy hujjatlar haqidagi ommaviy ma'lumotlar majmuasidir. Bu jarayon sud qarorlari, ajrimlar va qonunchilik bazalarini e'lon qilishni o'z ichiga oladi, bu esa huquqni qo'llash amaliyotini mustaqil tahlil qilish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-legal_data.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Sud tizimi davlatda odil sudlovni amalga oshiruvchi sudlar majmuasidir. Ochiq ma'lumotlar kontekstida sud hujjatlari huquqiy nizolarni hal qilish jarayonini qayd etuvchi axborot mohiyati sifatida namoyon bo'ladi. Sudlov shaffofligi tamoyillari ushbu ma'lumotlarning jamiyat uchun ochiqligiga tayanadi.&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-legal_data.html#bu-qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Bu qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Sud ma'lumotlarini e'lon qilish jarayoni hujjatlarni yig'ish, qayta ishlash va ularga kirishni ta'minlashdan iborat. Sudlar qarorlar matnini ishlab chiqadi, ular shaxsiy hayotni himoya qilish uchun depersonalizatsiya qilinadi. Keyin ma'lumotlar mashina o'qiydigan formatlarga o'tkaziladi va axborot tizimlariga yuklanadi.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-legal_data.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Sud ma'lumotlarini tahlil qilish uchun OSINT metodlari, jumladan veb-sahifalarni parsing qilish, ishtirokchilar o'rtasidagi aloqalar graflarini tahlil qilish va matnlarni statistik qayta ishlash qo'llaniladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-legal_data.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Ochiq sud ma'lumotlari xavflarni baholash va tizimlarni nazorat qilish uchun muhimdir. «Доверие — это не оценка: как ограничить власть ИИ-агентов» maqolasida sud pretsedentlari va qonunchilik normalari avtomatlashtirilgan tizimlarning ishonchliligini tekshirish uchun asos bo'lib xizmat qilishi ta'kidlanadi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/proc-legal_data.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov ma'lumotlarning sifati va to'liqligidir: barcha qarorlar ham e'lon qilinmaydi va ma'lumotlarning bir qismi xavfsizlik maqsadida olib tashlanadi. Kontekstni hisobga olmasdan ma'lumotlarni talqin qilish noto'g'ri xulosalarga olib kelishi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Суды и законы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D0%BE%D1%82%20%D1%88%D0%B5%D1%88%D1%96%D0%BC%D0%B4%D0%B5%D1%80%D1%96%5D%20--%3E%20B%5B%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%D0%B4%D1%96%20%D0%B6%D0%B8%D0%BD%D0%B0%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%94%D0%B5%D0%BF%D0%B5%D1%80%D1%81%D0%BE%D0%BD%D0%B0%D0%BB%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D2%9A%D2%B1%D1%80%D1%8B%D0%BB%D1%8B%D0%BC%D0%B4%D0%B0%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D0%90%D1%88%D1%8B%D2%9B%20%D1%80%D0%B5%D0%B5%D1%81%D1%82%D1%80%5D%0A%20%20E%20--%3E%20F%5B%D0%A2%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%0A%20%20F%20--%3E%20G%5B%D2%9A%D2%B1%D2%9B%D1%8B%D2%9B%D1%82%D1%8B%D2%9B%20%D0%B1%D0%B0%D2%9B%D1%8B%D0%BB%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-legal_data.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-data.html\"&gt;Ochiq ma'lumotlar&lt;/a&gt; — Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-web_archives.html\"&gt;Веб-архивы&lt;/a&gt; — Wayback Machine, сохранение и сравнение страниц.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/proc-legal_data.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html\"&gt;Ishonch — bu ball emas: sun'iy intellekt agentlarini qanday cheklash kerak&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/proc-legal_data.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%83%D0%B4%D0%B5%D0%B1%D0%BD%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0_%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D0%B9%D1%81%D0%BA%D0%BE%D0%B9_%D0%A4%D0%B5%D0%B4%D0%B5%D1%80%D0%B0%D1%86%D0%B8%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Судебная система Российской Федерации — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41746-019-0084-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Digital biomarkers for Alzheimer's disease: the mobile/ wearable devices opportunity&lt;/a&gt; — sharh, NPJ Digit Med 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/cpt.966\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wearable Devices in Clinical Trials: Hype and Hypothesis&lt;/a&gt; — sharh, Clin Pharmacol Ther 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.jsat.2018.12.003\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effectiveness of medication assisted treatment for opioid use in prison and jail settings: A meta-analysis and systematic review&lt;/a&gt; — sharh, J Subst Abuse Treat 2019&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generato
