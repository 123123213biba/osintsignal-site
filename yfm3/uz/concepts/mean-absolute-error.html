        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Metrika&lt;/strong&gt; · &lt;em&gt;Mean Absolute Error&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;O‘rtacha mutlaq xatolik (MAE) — bu prognozlash sifatining ko‘rsatkichi bo‘lib, bashorat qilingan va haqiqiy ma’lumotlar o‘rtasidagi farqlarning o‘rtacha qiymatini ifodalaydi.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;O'rtacha mutlaq xatolik (Mean Absolute Error, MAE) — bu bashorat qilingan qiymatlar va haqiqiy ma'lumotlar o'rtasidagi farqlarning mutlaq qiymatlari o'rtacha arifmetigini o'lchaydigan sifat metriki. U model o'z bashoratlarida o'rtacha qanchalik xato qilishini dastlabki ma'lumotlar birligida ko'rsatadi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;MAE bashorat aniqligining ko'rsatkichidir. Xatolarni kvadratga oshiradigan va katta chetlanishlarga ko'proq vazn beradigan o'rtacha kvadratik chetlanishdan farqli o'laroq, MAE barcha xatolarni chiziqli hisobga oladi. Bu metrikni tushunishni osonlashtiradi: agar model sun'iy yo'ldosh tasviridagi ob'ektlar sonini bashorat qilsa, 5 ga teng MAE qiymati bashorat haqiqatdan o'rtacha 5 ta ob'ektga farq qilishini anglatadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;MAE hisoblash jarayoni uch bosqichdan iborat: har bir bashorat qilingan va haqiqiy qiymat o'rtasidagi farqni topish, manfiy qiymatlarni istisno qilish uchun modul olish va barcha modullarning o'rtacha arifmetigini hisoblash. Jarayon natijasi — berilgan ma'lumotlar to'plamidagi modelning umumiy aniqligini tavsiflovchi bitta son.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;MAE hisoblash uchun Python'dagi scikit-learn kabi mashinali o'qitish kutubxonalari ishlatiladi. Metod ikkita ma'lumotlar massivini talab qiladi: bashoratlar vektori va haqiqiy qiymatlar vektori. Ikkala massiv ham bir xil o'lchamga ega bo'lishi va taqqoslanadigan ma'lumotlarni o'z ichiga olishi muhim.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Metrik turli sohalardagi algoritmlar samaradorligini baholash uchun ishlatiladi. «Sчитаем объекты на спутниковых снимках без дообучения нейросетей» maqolasida MAE model hudud o'zgarganda binolar yoki kemalar sonini qanchalik aniq belgilashini tushunishga yordam beradi. «Почему большие языковые модели плохо справляются с динамикой состояния пациентов» tadqiqotida metrik yangi ma'lumotlar asosida inson salomatligi haqidagi bashoratlarni yangilashda sun'iy intellekt xatolarini tahlil qilish uchun qo'llaniladi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;MAE xato yo'nalishini hisobga olmaydi: model ko'rsatkichlarni tizimli ravishda oshirib yoki kamaytirib yuborishi mumkin, ammo metrik faqat o'rtacha chetlanish qiymatini ko'rsatadi. Shuningdek, MAE kam uchraydigan, ammo muhim anomaliyalarga sezgir emas, chunki u ularni kichik xatolardan ko'ra ko'proq jazolamaydi. Natijalarni talqin qilishda MAE tanlov ichidagi xatolar taqsimotini aks ettirmaydigan o'rtacha ko'rsatkich ekanligini yodda tutish kerak.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Средняя абсолютная ошибка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%92%D1%85%D0%BE%D0%B4%D0%BD%D1%8B%D0%B5%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5%5D%20--%3E%20B%5B%D0%A0%D0%B0%D1%81%D1%87%D0%B5%D1%82%20%D1%80%D0%B0%D0%B7%D0%BD%D0%BE%D1%81%D1%82%D0%B8%5D%0A%20%20B%20--%3E%20C%5B%D0%92%D0%B7%D1%8F%D1%82%D0%B8%D0%B5%20%D0%BC%D0%BE%D0%B4%D1%83%D0%BB%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D1%83%D0%BC%D0%BC%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%5D%0A%20%20D%20--%3E%20E%5B%D0%94%D0%B5%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BD%D0%B0%20%D0%BA%D0%BE%D0%BB%D0%B8%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE%5D%0A%20%20E%20--%3E%20F%5BMAE%20%D1%80%D0%B5%D0%B7%D1%83%D0%BB%D1%8C%D1%82%D0%B0%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ta'rif avtomatik tekshirilgan va tahririyat tasdig'ini kutmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"malumot\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#malumot\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-i
