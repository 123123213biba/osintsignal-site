            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"198\" cy=\"71\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"582\" cy=\"274\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · ENV_DATA   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellekt o'rmon&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yong'inlarini sun'iy&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yo'ldoshlardan tezroq&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;aniqlaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f1.jpg\" alt=\"1-rasm: Tadqiqot hududi xaritalari. Oʻqitish uchun foydalanilgan shtatlar qora rangda, baholash uchun — qizil rangda, ik\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Tadqiqot hududi xaritalari. Oʻqitish uchun foydalanilgan shtatlar qora rangda, baholash uchun — qizil rangda, ikkalasi uchun ham foydalanilgan shtatlar esa och havo rangda belgilangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;An'anaviy sun'iy yo'ldosh monitoringi ko'pincha yong'inlarni o'tkazib yuboradi va noto'g'ri signallar beradi. Tadqiqot shuni ko'rsatdiki, CatBoost mashinali o'qitish modeli GOES FDC standart mahsulotidan aniqlik va tezlik bo'yicha ustun keladi. Yangi yondashuv ayniqsa tungi vaqtda samarali bo'lib, eski algoritmlar bu borada juda past natija ko'rsatadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;CatBoost aniqlik va qamrov bo'yicha GOES FDCdan ustun keldi&lt;/li&gt;\n&lt;li&gt;Model 26 ta yong'inni standart tizimlardan oldin aniqladi&lt;/li&gt;\n&lt;li&gt;Tungi vaqtda aniqlash samaradorligi sezilarli darajada yuqori&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar GOES sun'iy yo'ldoshlaridagi ABI asbobi ma'lumotlari va VIIRS (375 metr aniqlikdagi termal nurlanishni qayd etuvchi radiometr) etalon belgilaridan foydalanishdi. O'quv to'plami 2022–2023 yillar davomida 60 mingdan ortiq yong'in piksellari va 1,2 million «toza» piksellarni o'z ichiga oladi. CatBoost modeli FDC (Fire Detection and Characterization) algoritmi e'tiborsiz qoldiradigan murakkab fazoviy-spektral naqshlarni aniqlashga o'rgatilgan.&lt;/p&gt;\n&lt;p&gt;2024 yilgi beshta mintaqadagi test natijalari shuni ko'rsatdiki, modelning F1-o'lchovi (aniqlik metri) FDCga nisbatan 0,16–0,38 ga yuqori. 51 ta tarixiy hodisadan 26 tasida model yong'inni mavjud tizimlardan oldinroq aniqladi. Eng muhimi, FDC deyarli ishlamaydigan tungi vaqtda (recall 0,03 atrofida) neyron tarmoq yuqori aniqlikni saqlab qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar faqat GOES sun'iy yo'ldosh ma'lumotlari bilan cheklangan va mintaqaviy sharoitlarga bog'liq bo'lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Oʻrmon yongʻinlari inson hayoti, ekotizimlar va mulk uchun jiddiy xavf tugʻdiradi. Ushbu tadqiqotda GOES ABI sunʼiy yoʻldosh tasvirlaridan foydalangan holda yongʻinlarni aniqlash uchun mashinali oʻqitish yondashuvi taqdim etilgan. Tadqiqotchilar CatBoost modelini minglab ABI tasvirlari va VIIRS asbobi tomonidan qayd etilgan 300 000 dan ortiq yongʻin maʼlumotlari asosida oʻqitishdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost — bu qarorlar daraxtlari asosida gradientli kuchaytirishdan foydalanadigan mashinali oʻqitish algoritmi boʻlib, u jadval maʼlumotlari va tasvirlar bilan ishlashda samarali hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modelning samaradorligi beshta turli mintaqani qamrab olgan mustaqil maʼlumotlar toʻplamida baholandi. Natijalar shuni koʻrsatdiki, CatBoost modeli mavjud GOES Fire Detection and Characterization (FDC) mahsulotidan aniqlik (precision), &lt;a href=\"concepts/recall.html\"&gt;toʻliqlik&lt;/a&gt; (recall) va F1-koʻrsatkichlari boʻyicha ustun keldi. Barcha oʻrganilgan hududlarda CatBoost modelining F1-koʻrsatkichi FDC mahsulotidan 0,16 dan 0,38 gacha yuqori boʻldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost modeli standart FDC mahsulotidan 0,16–0,38 ga yuqori F1-koʻrsatkichiga erishdi va 26 ta yongʻinni boshqa tizimlardan oldinroq aniqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;51 ta tarixiy yongʻin hodisasini tahlil qilish aniqlash tezligidagi ustunlikni koʻrsatdi: CatBoost 26 ta yongʻinni VIIRS va GOES FDC tizimlaridan oldinroq aniqlagan boʻlsa, FDC buni atigi 6 ta holatda bajara oldi. Tunda yongʻinni aniqlash alohida ahamiyatga ega: CatBoost modeli tunda ham yuqori aniqlikni saqlab qoladi, GOES FDC tizimining toʻliqlik (recall) koʻrsatkichi esa tunda 0,03 atrofida qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot algoritmlarni taqqoslashga asoslangan; natijalar sunʼiy yoʻldosh maʼlumotlarining xususiyatlari va mintaqaviy sharoitlarga bogʻliq boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"ormon-yonginlarini-monitoring-qilish-dolzarbligi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#ormon-yonginlarini-monitoring-qilish-dolzarbligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oʻrmon yongʻinlarini monitoring qilish dolzarbligi&lt;/span&gt;&lt;/a&gt;Oʻrmon yongʻinlarini monitoring qilish dolzarbligi&lt;/h4&gt;\n&lt;p&gt;Oʻrmon yongʻinlari ekotizimlar, infratuzilma va inson hayoti uchun jiddiy xavf tugʻdiradi. Muammo koʻlami kengayib bormoqda: 1980–2023-yillar oraligʻida yongʻinlar bilan bogʻliq yirik ofatlar chastotasi toʻrt baravarga oshdi. 2025-yil yanvar oyida Los-Anjelesda sodir boʻlgan «Palisades Fire» yongʻini bunga yaqqol misol boʻla oladi: 24 kun ichida 95 km² maydon yonib ketdi, 6800 dan ortiq inshoot vayron boʻldi va 12 kishi halok boʻldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1980–2023-yillar oraligʻida yirik oʻrmon yongʻinlari chastotasi 4 baravarga oshdi, bu esa yongʻinni oʻz vaqtida aniqlashni halokatlarning oldini olish uchun oʻta muhim vazifaga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Yongʻinlarni erta aniqlash uchun geostatsionar (&lt;a href=\"concepts/generative-engine-optimization.html\"&gt;GEO&lt;/a&gt;) sunʼiy yoʻldoshlar keng qoʻllaniladi. Yerning aylanishi bilan sinxronlashgan orbitasi tufayli ular bir hududni har 5–15 daqiqada kuzatish imkonini beradi. GOES sunʼiy yoʻldoshlari uchun FDC va Meteosat uchun FRP-PIXEL kabi mavjud algoritmlar yorqinlik chegaralariga tayanadi. Biroq, ularning kamchiliklari bor: FDC algoritmi koʻpincha 3,7 mkm diapazonida koʻrinadigan yongʻinlarni oʻtkazib yuboradi, shuningdek, har ikki usul ham yuqori darajadagi notoʻgʻri signallarni (false alarms) beradi.&lt;/p&gt;\n&lt;h4 id=\"mashinali-oqitish-ml-yondashuvi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#mashinali-oqitish-ml-yondashuvi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mashinali oʻqitish (ML) yondashuvi&lt;/span&gt;&lt;/a&gt;Mashinali oʻqitish (ML) yondashuvi&lt;/h4&gt;\n&lt;p&gt;Istiqbolli yechim — bu murakkab fazoviy-spektral qonuniyatlarni aniqlashga qodir mashinali oʻqitish (ML) algoritmlaridan foydalanishdir. Bunday modellarni oʻqitish uchun har bir piksel «yongʻin» yoki «yongʻin emas» deb belgilangan maʼlumotlar toʻplami talab qilinadi. Bunga past orbitadagi (LEO) sunʼiy yoʻldoshlar maʼlumotlari yoki oʻrmon xoʻjaligi hisobotlari asos boʻladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mashinali oʻqitish — bu maʼlumotlar tahlili usuli boʻlib, unda algoritm qatʼiy qoidalarga amal qilish oʻrniga, katta hajmdagi misollar asosida (masalan, yongʻinning spektral belgilari) qonuniyatlarni mustaqil ravishda «oʻrganadi».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mavjud tadqiqotlarda Random Forest va CNN kabi chuqur oʻqitish usullari qoʻllangan. Biroq, hozirgi modellar kichik oʻquv toʻplamlari (bir necha yuz piksel), tor geografik qamrov va operatsion algoritmlar bilan taqqoslanmaganligi kabi cheklovlarga ega. Shuningdek, modellarning kunduzgi va tungi ish samaradorligi kamdan-kam hollarda alohida baholanadi.&lt;/p&gt;\n&lt;h4 id=\"tadqiqot-maqsadlari-va-metodologiyasi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#tadqiqot-maqsadlari-va-metodologiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot maqsadlari va metodologiyasi&lt;/span&gt;&lt;/a&gt;Tadqiqot maqsadlari va metodologiyasi&lt;/h4&gt;\n&lt;p&gt;Ushbu ishning maqsadi — GOES FDC mahsulotidan aniqlik va notoʻgʻri signallar darajasi boʻyicha ustun boʻlgan ML modelini yaratishdir. Mualliflar 60 000 dan ortiq yongʻin piksellari va 1,2 millionga yaqin yongʻin boʻlmagan piksellarni oʻz ichiga olgan maʼlumotlar bazasidan foydalanishdi. VIIRS (LEO) asbobi maʼlumotlari etalon sifatida qabul qilindi. Oʻqitish 2022–2023-yillar maʼlumotlari asosida, baholash esa 2024-yil maʼlumotlari asosida amalga oshirildi, bu modelning yangi vaqt va makon sharoitlariga moslashuvchanligini baholash imkonini berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model 2022–2023-yillar maʼlumotlarida oʻqitilib, 2024-yil maʼlumotlarida sinovdan oʻtkazildi; natijalar haqiqat deb qabul qilingan VIIRS etalon maʼlumotlarining sifatiga bogʻliq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2-hudud-va-malumotlar-manbalari\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#2-hudud-va-malumotlar-manbalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Hudud va maʼlumotlar manbalari&lt;/span&gt;&lt;/a&gt;2. Hudud va maʼlumotlar manbalari&lt;/h4&gt;\n&lt;p&gt;Ushbu boʻlimda tahlil qilingan hududlar va ular uchun olingan sunʼiy yoʻldosh tasvirlari tasvirlangan. Tasvirlar GEOfire aniqlash uchun ML modelini oʻqitish va baholashda ishlatilgan. Bundan tashqari, ML modelining erta aniqlash qobiliyatini GOES FDC mahsuloti bilan solishtirish uchun maxsus yongʻin hodisalari toʻplami tuzilgan.&lt;/p&gt;\n&lt;h4 id=\"21-tadqiqot-hududi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#21-tadqiqot-hududi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.1. Tadqiqot hududi&lt;/span&gt;&lt;/a&gt;2.1. Tadqiqot hududi&lt;/h4&gt;\n&lt;p&gt;Tadqiqot hududi AQSH, Meksika va Kanadaning turli landshaft turlarini (oʻrmonlar, botqoqliklar, choʻllar, qishloq xoʻjaligi va shahar hududlari) qamrab oladi (Rasm 1). Hududlar oʻqitish (taxminan 2,1 mln km²) va baholash (taxminan 2 mln km²) uchun boʻlingan. Florida, Alabama, Missisipi, Luiziana, Oklaxoma, shuningdek, Meksikaning Chiuaua va Durango shtatlari faqat oʻqitish uchun; Texas va Jorjiya ham oʻqitish, ham baholash uchun; Kaliforniya, Oregon, Arizona, Yuta va Britaniya Kolumbiyasining bir qismi esa faqat baholash uchun ishlatilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f1.jpg\" alt=\"1-rasm: Tadqiqot hududi xaritalari. Oʻqitish uchun foydalanilgan shtatlar qora rangda, baholash uchun — qizil rangda, ik\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Tadqiqot hududi xaritalari. Oʻqitish uchun foydalanilgan shtatlar qora rangda, baholash uchun — qizil rangda, ikkalasi uchun ham foydalanilgan shtatlar esa och havo rangda belgilangan.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot maydoni jami 4,1 mln km² atrofida boʻlib, oʻqitish va baholash uchun alohida zonalarga ajratilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-malumotlar-manbalari\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#22-malumotlar-manbalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. Maʼlumotlar manbalari&lt;/span&gt;&lt;/a&gt;2.2. Maʼlumotlar manbalari&lt;/h4&gt;\n&lt;p&gt;Oʻqitish va baholash toʻplamlari bir xil tuzilishga ega boʻlib, VIIRS yongʻin aniqlashlari va ±2,5 daqiqa oraligʻida olingan GOES ABI tasvirlarini oʻz ichiga oladi. Oʻqitish toʻplami 2022–2023 yillardagi barcha VIIRS maʼlumotlarini (324 502 ta aniqlash va 4 330 ta GOES ABI tasviri) oʻz ichiga oladi. Baholash toʻplami 2024-yil maʼlumotlariga asoslangan (1-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIIRS — Suomi NPP sunʼiy yoʻldoshlaridagi radiometr boʻlib, 375 m aniqlikda termal anomaliyalarni qayd etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"221-viirs-active-fire-mahsuloti\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#221-viirs-active-fire-mahsuloti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2.1. VIIRS Active Fire mahsuloti&lt;/span&gt;&lt;/a&gt;2.2.1. VIIRS Active Fire mahsuloti&lt;/h4&gt;\n&lt;p&gt;Etalon sifatida VNP14IMG Collection 2 mahsuloti ishlatilgan. U koordinatalar, vaqt, yongʻin nurlanish quvvati (FRP) va ishonchlilik darajasini taqdim etadi. Past ishonchlilikdagi piksellar tahlildan chiqarib tashlangan. Maʼlumotlar NASA LAADS DAAC arxividan olingan.&lt;/p&gt;\n&lt;h4 id=\"222-goes-abi-tasvirlari\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#222-goes-abi-tasvirlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2.2. GOES ABI tasvirlari&lt;/span&gt;&lt;/a&gt;2.2.2. GOES ABI tasvirlari&lt;/h4&gt;\n&lt;p&gt;2 km aniqlikdagi uchta mahsulot yuklab olingan: koʻp kanalli bulut va namlik tasvirlari (MCMI), bulutsiz osmon niqobi (ACM) va FDC. MCMI va ACM model uchun kirish maʼlumotlari, FDC esa solishtirish uchun etalon hisoblanadi. FDC termal anomaliyalarni aniqlash uchun infraqizil diapazonlardan foydalanadi. Erta aniqlash tahlili (4.4-boʻlim) ikki marta oʻtkazilgan: dastlab «qayta ishlangan» va «toʻyingan» toifalar bilan, keyin esa «yuqori ishonchlilik» toifasi qoʻshilgan holda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Yuqori ishonchlilik» toifasidan foydalanish notoʻgʻri signallar (false alarm) xavfini oshiradi, bu aniqlikni baholashda hisobga olingan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"223-erta-aniqlash-uchun-yongin-perimetri-malumotlari\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#223-erta-aniqlash-uchun-yongin-perimetri-malumotlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2.3. Erta aniqlash uchun yongʻin perimetri maʼlumotlari&lt;/span&gt;&lt;/a&gt;2.2.3. Erta aniqlash uchun yongʻin perimetri maʼlumotlari&lt;/h4&gt;\n&lt;p&gt;ML modeli va GOES FDC imkoniyatlarini solishtirish uchun 51 ta yongʻin hodisasi boʻyicha maʼlumotlar toʻplami tuzilgan. Perimetrlar AQSHdagi oʻrmon yongʻinlari chegaralarini aks ettiruvchi WFIGS maʼlumotlar bazasidan olingan.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Yongʻin hodisalari xulosasi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Yongʻin hodisasi&lt;/th&gt;\n&lt;th&gt;Birinchi yongʻin aniqlanishi&lt;/th&gt;\n&lt;th&gt;Vaqt farqi (daqiqa)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Beech&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;300&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Bentley&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;480&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davis&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;445&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Smokehouse Creek&lt;/td&gt;\n&lt;td&gt;CatBoost&lt;/td&gt;\n&lt;td&gt;245&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Airport&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Blue Mountain&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Boise&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Dry Branch&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Duck Nest&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fall Branch&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Fodderstack&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Foote&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Walker&lt;/td&gt;\n&lt;td&gt;VIIRS&lt;/td&gt;\n&lt;td&gt;No CatBoost detection&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;(1) Faqat CatBoost va VIIRS; (2) Faqat VIIRS.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"catboost-samaradorligini-goes-fdc-bilan-taqqoslash\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#catboost-samaradorligini-goes-fdc-bilan-taqqoslash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CatBoost samaradorligini GOES FDC bilan taqqoslash&lt;/span&gt;&lt;/a&gt;CatBoost samaradorligini GOES FDC bilan taqqoslash&lt;/h4&gt;\n&lt;p&gt;CatBoost modeli barcha beshta hududda (Jorjiya, Texas, Kaliforniya-Oregon, Arizona-Yuta va Britaniya Kolumbiyasi) GOES FDC mahsuloti bilan recall (toʻliqlik), precision (aniqlik) va F1-ball boʻyicha solishtirildi. CatBoost barcha metrikalar boʻyicha ustunlik koʻrsatib, aniqlash darajasini saqlagan holda notoʻgʻri signallar (false alarms) sonini kamaytirdi. Oʻqitish jarayonida qatnashmagan hududlarda (Kaliforniya-Oregon, Arizona-Yuta, Britaniya Kolumbiyasi) model yuqori moslashuvchanlikni namoyon etdi va F1-ball boʻyicha GOES FDCdan 0,16–0,38 ga ustun keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost barcha hududlarda, jumladan oʻqitishda foydalanilmagan hududlarda ham GOES FDCdan barqaror ustunlikka ega (F1-ball boʻyicha 0,38 gacha).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aniq hodisalarni tahlil qilish (7-rasm) shuni koʻrsatdiki, Texasda notoʻgʻri signal haqiqiy oʻchoq yaqinida yuz bergan, bu ehtimol issiqlik taʼsiri bilan bogʻliq. Jorjiyada model kichik oʻchoqlarni oʻtkazib yuborgan, ular VIIRS datchiklari tomonidan faqat bir marta qayd etilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Baholash VIIRS mahsuloti bilan solishtirishga asoslangan; modeldagi kamchiliklar sunʼiy yoʻldosh maʼlumotlarining fazoviy aniqligi cheklovlari bilan bogʻliq boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval S1.&lt;/strong&gt; Birinchi marta aniqlashni solishtirish uchun foydalanilgan 51 ta tarixiy yongʻin hodisasi xulosasi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;ID&lt;/th&gt;\n&lt;th&gt;Yongʻin hodisasi&lt;/th&gt;\n&lt;th&gt;VIIRS birinchi aniqlanish vaqti (UTC)&lt;/th&gt;\n&lt;th&gt;Shtat&lt;/th&gt;\n&lt;th&gt;Uzunlik&lt;/th&gt;\n&lt;th&gt;Kenglik&lt;/th&gt;\n&lt;th&gt;Yongʻin hajmi (km²)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Area 6&lt;/td&gt;\n&lt;td&gt;28/1/2021 17:41&lt;/td&gt;\n&lt;td&gt;Florida&lt;/td&gt;\n&lt;td&gt;-81.268&lt;/td&gt;\n&lt;td&gt;27.682&lt;/td&gt;\n&lt;td&gt;17.5&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;Windmill&lt;/td&gt;\n&lt;td&gt;2/3/2021 19:06&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-97.265&lt;/td&gt;\n&lt;td&gt;34.398&lt;/td&gt;\n&lt;td&gt;189.2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;CP-3&lt;/td&gt;\n&lt;td&gt;3/3/2021 18:41&lt;/td&gt;\n&lt;td&gt;Florida&lt;/td&gt;\n&lt;td&gt;-80.993&lt;/td&gt;\n&lt;td&gt;25.263&lt;/td&gt;\n&lt;td&gt;356.6&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;Dry Branch&lt;/td&gt;\n&lt;td&gt;5/3/2021 6:46&lt;/td&gt;\n&lt;td&gt;Alabama&lt;/td&gt;\n&lt;td&gt;-85.564&lt;/td&gt;\n&lt;td&gt;33.873&lt;/td&gt;\n&lt;td&gt;5.3&lt;/ t;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-98.632&lt;/td&gt;\n&lt;td&gt;34.748&lt;/td&gt;\n&lt;td&gt;74.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;48&lt;/td&gt;\n&lt;td&gt;North Road&lt;/td&gt;\n&lt;td&gt;29/10/2024 19:36&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-96.341&lt;/td&gt;\n&lt;td&gt;36.629&lt;/td&gt;\n&lt;td&gt;23.9&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;49&lt;/td&gt;\n&lt;td&gt;Beech&lt;/td&gt;\n&lt;td&gt;2/12/2024 7:41&lt;/td&gt;\n&lt;td&gt;Oklahoma&lt;/td&gt;\n&lt;td&gt;-94.494&lt;/td&gt;\n&lt;td&gt;34.61&lt;/td&gt;\n&lt;td&gt;1.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;50&lt;/td&gt;\n&lt;td&gt;Middleton&lt;/td&gt;\n&lt;td&gt;16/2/2025 18:36&lt;/td&gt;\n&lt;td&gt;Texas&lt;/td&gt;\n&lt;td&gt;-94.395&lt;/td&gt;\n&lt;td&gt;29.619&lt;/td&gt;\n&lt;td&gt;16.6&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;51&lt;/td&gt;\n&lt;td&gt;Two Barrel&lt;/td&gt;\n&lt;td&gt;26/2/2025 18:46&lt;/td&gt;\n&lt;td&gt;Florida&lt;/td&gt;\n&lt;td&gt;-85.001&lt;/td&gt;\n&lt;td&gt;30.185&lt;/td&gt;\n&lt;td&gt;6.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Jadvalda yongʻin nomi, VIIRS tomonidan birinchi aniqlanish vaqti, shtat, markaz koordinatalari (kenglik va uzunlik) va yongʻin hajmi (km² da) keltirilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"oquv-malumotlar-toplami-hajmining-catboost-ishiga-tasiri\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#oquv-malumotlar-toplami-hajmining-catboost-ishiga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oʻquv maʼlumotlar toʻplami hajmining CatBoost ishiga taʼsiri&lt;/span&gt;&lt;/a&gt;Oʻquv maʼlumotlar toʻplami hajmining CatBoost ishiga taʼsiri&lt;/h4&gt;\n&lt;p&gt;Maʼlumotlar hajmining ahamiyatini koʻrsatish uchun mualliflar asosiy modelni (66 000 yongʻin pikseli) ikkita kichikroq versiya bilan solishtirdilar: tasodifiy tanlanma (2 000 yongʻin va 20 000 fon pikseli) va faqat aprel-may oylari maʼlumotlari. Natijalar (9-rasm) shuni koʻrsatadiki, kichik yoki mavsumiy cheklangan tanlanmalar notoʻgʻri signallar sonini oshiradi. Masalan, Arizona-Yutada asosiy modelning aniqligi 0,81 ni tashkil etgan boʻlsa, kichik modellarda bu koʻrsatkich 0,50 va 0,42 gacha tushgan. Toʻliqlik (recall) koʻrsatkichi barqarorroq boʻlsa-da, faqat bahorgi maʼlumotlarda oʻqitilgan model Jorjiyada past natija (0,21) koʻrsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;F1-ball — bu aniqlik va toʻliqlik oʻrtasidagi garmonik oʻrtacha qiymat boʻlib, maqsadlarni oʻtkazib yuborish va notoʻgʻri signallar oʻrtasidagi muvozanatni baholashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Keng va xilma-xil maʼlumotlar toʻplamidan foydalanish modelning umumlashtirish qobiliyati uchun juda muhimdir. Maʼlumot hajmi kam boʻlgan modellar oʻqitish hududidan tashqaridagi joylarda yomonroq ishlaydi, bu esa xatolarni minimallashtirish uchun vakillik qamrovining zarurligini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"erta-aniqlash-imkoniyatlari\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#erta-aniqlash-imkoniyatlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Erta aniqlash imkoniyatlari&lt;/span&gt;&lt;/a&gt;Erta aniqlash imkoniyatlari&lt;/h4&gt;\n&lt;p&gt;Yongʻinlarni erta aniqlash ularning keng koʻlamli ofatlarga aylanishining oldini olishda muhim ahamiyatga ega. CatBoost modelining GOES FDC mahsuloti bilan solishtirish uchun 51 ta yongʻin hodisasidan iborat maʼlumotlar toʻplami shakllantirildi. Tahlil VIIRS sunʼiy yoʻldoshi tomonidan yongʻin qayd etilishidan 8 soat oldin va 2 soat keyingi davrni qamrab oldi. Har bir hodisa uchun tasvirlar yongʻin perimetri atrofida 10 km bufer bilan kesildi va CatBoost hamda GOES FDC oʻrtasidagi birinchi aniqlash vaqti (daqiqalarda) hisoblab chiqildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost modeli erta aniqlashda ustunlik koʻrsatdi: birinchi ssenariyda u 22 ta yongʻinni GOES FDCdan oldin (oʻrtacha 20 ± 17 daqiqa) aniqladi, GOES FDC esa atigi 6 ta holatda modeldan oldinroq ishladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;10-rasmda VIIRS qayd etguniga qadar ikkala usul bilan aniqlangan 38 ta yongʻin natijalari keltirilgan. Birinchi tahlil variantida (faqat «processed» va «saturated» toifalari) CatBoost oʻrtacha 20 daqiqa (standart ogʻish 17 daqiqa) oldin aniqlashni koʻrsatdi. Ikkinchi variantda, «high confidence» toifasi qoʻshilishi bilan CatBoost 19 ta yongʻinni (oʻrtacha 18 ± 16 daqiqa) oldinroq aniqladi, GOES FDC esa 9 ta holatda oldinroq ishladi. 10 ta holatda usullar bir vaqtda qayd etildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GOES FDCda «high confidence» toifasidan foydalanish sezgirlikni oshiradi, ammo bu notoʻgʻri signallar (false alarms) sonining koʻpayishiga olib kelishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Howell, Blue Stem, Candy Creek va Silver King kabi alohida holatlar shuni koʻrsatadiki, «high confidence» toifasining qoʻshilishi GOES FDCga baʼzida modeldan oldinroq yongʻinni aniqlash imkonini beradi. Masalan, Candy Creek yongʻinida FDC modeli CatBoostdan 30 daqiqa oldinroq ishladi. Biroq, umumiy hisobda 51 ta hodisadan CatBoost 26 ta (birinchi tahlilda) va 23 ta (ikkinchi tahlilda) yongʻinni boshqa tizimlardan oldin aniqlab, erta aniqlash samaradorligini tasdiqladi.&lt;/p&gt;\n&lt;h4 id=\"yonginni-aniqlash-ehtimolligi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#yonginni-aniqlash-ehtimolligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yongʻinni aniqlash ehtimolligi&lt;/span&gt;&lt;/a&gt;Yongʻinni aniqlash ehtimolligi&lt;/h4&gt;\n&lt;p&gt;Ushbu boʻlim VIIRS maʼlumotlari bilan 3×3 piksel oynasida solishtirish orqali usullarning yongʻin hajmiga nisbatan sezgirligini baholaydi. Baholash uchun (5), (6) va (7)-tenglamalardan foydalanildi, bunda NTP,k — haqiqiy ijobiy natijalar soni (kamida k ta VIIRS pikseli mavjud boʻlganda model tomonidan aniqlash), NFN,k esa notoʻgʻri salbiy natijalar sonidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul fazoviy noaniqlikni hisobga olish uchun 3×3 oynadan foydalanadi: agar model VIIRS maʼlumotlaridan bir piksel radiusida yongʻinni qayd etsa, bu muvaffaqiyatli aniqlash hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Aniqlash ehtimoli muvaffaqiyatli aniqlangan piksellar sonining kamida k ta VIIRS aniqlashini oʻz ichiga olgan jami piksellar soniga nisbati sifatida hisoblandi. Ushbu yondashuv algoritmlarning turli intensivlik va maydondagi yongʻinlarga qanchalik samarali javob berishini baholashga imkon beradi.&lt;/p&gt;\n&lt;h4 id=\"yonginlarni-aniqlash-ehtimoli\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#yonginlarni-aniqlash-ehtimoli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yongʻinlarni aniqlash ehtimoli&lt;/span&gt;&lt;/a&gt;Yongʻinlarni aniqlash ehtimoli&lt;/h4&gt;\n&lt;p&gt;Mualliflar CatBoost modelining yongʻinni aniqlash ehtimolini GOES FDC algoritmi bilan solishtirib baholaydilar. Buning uchun (8)-formuladan foydalaniladi, bunda P(M(i', j') = 1 / V(i, j) ≥ k) ifodasi k chegaraviy qiymati uchun haqiqiy ijobiy natijalarning haqiqiy ijobiy va notoʻgʻri salbiy natijalar yigʻindisiga nisbatini bildiradi. k chegarasi bitta GOES ABI pikseli ichidagi VIIRS sunʼiy yoʻldoshi tomonidan qayd etilgan yongʻinlar sonining minimal miqdorini belgilaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost modeli barcha beshta tadqiqot hududida GOES FDC ga nisbatan kichik oʻchoqli yongʻinlarga yuqoriroq sezgirlikni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;11-rasmda beshta hudud: Jorjiya, Texas, Kaliforniya-Oregon, Arizona-Yuta va Britaniya Kolumbiyasi boʻyicha natijalar keltirilgan. Kaliforniya-Oregon, Arizona-Yuta va Britaniya Kolumbiyasida CatBoost ancha yuqori aniqlash ehtimolini namoyish etadi. Masalan, Kaliforniya va Oregonda k=1 boʻlganda, GOES FDC uchun ehtimollik 0,28 ni, CatBoost uchun esa 0,46 ni tashkil qiladi. k=5 chegarasida farq yanada ortadi: CatBoostda 0,78, GOES FDC da esa atigi 0,48.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIIRS — fazoviy aniqligi yuqori boʻlgan sunʼiy yoʻldosh radiometri boʻlib, u GOES maʼlumotlarini tekshirish uchun «etalon» sifatida ishlatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Texasda CatBoost k=10 dan past boʻlgan chegaralarda GOES FDC dan ustun keladi. Biroq k=10 boʻlganda, GOES FDC ehtimolligi CatBoost modelinikidan oshib ketadi. Mualliflar buni tanlanma hajmining juda kichikligi bilan izohlaydilar: ushbu hududda oʻn va undan ortiq VIIRS yongʻin belgilarini oʻz ichiga olgan atigi sakkizta ABI pikseli qayd etilgan. Umuman olganda, CatBoost modeli kichik yongʻinlarga nisbatan barqaror yuqori sezgirlikni koʻrsatadi, bu esa uni koʻpgina sharoitlarda yongʻinlarni erta aniqlash uchun samaraliroq vositaga aylantiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cheklov: Texasdagi k ning yuqori qiymatlari uchun olingan natijalar juda kam kuzatuvlar soni bilan cheklangan, bu esa ushbu aniq chegara uchun statistik ishonchlilikni pasaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-muhokama-va-xulosalar\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#5-muhokama-va-xulosalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Muhokama va xulosalar&lt;/span&gt;&lt;/a&gt;5. Muhokama va xulosalar&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda GOES-16 ABI sunʼiy yoʻldosh tasvirlari asosida oʻrmon yongʻinlarini aniqlash uchun CatBoost modeli oʻqitildi. CatBoost gradient bustingi ramkasi samaradorligi va oʻqitish qulayligi uchun tanlandi. Oʻqitish va baholash uchun VIIRS yongʻin maʼlumotlari etalon sifatida ishlatildi. Natijalar shuni koʻrsatadiki, CatBoost modeli tadqiqotdagi barcha besh mintaqada GOES FDC standart mahsulotidan ustun kelib, yuqori aniqlik (precision), toʻliqlik (recall) va F1-koʻrsatkichlarini namoyish etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost modeli yongʻinlarni aniqlashda, ayniqsa tunda, GOES FDC mahsulotiga nisbatan barqaror va yuqori natijalarni koʻrsatdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Har ikkala modelda toʻliqlik koʻrsatkichlarining nisbatan pastligi ABI fazoviy oʻlchamining VIIRS’ga nisbatan pastligi bilan izohlanadi: VIIRS aniqlagan kichik yongʻin oʻchoqlari koʻpincha notoʻgʻri salbiy natija sifatida tasniflangan. Shunga qaramay, CatBoost GOES FDC’dan yaxshiroq natija berdi. Modelning umumlashtirish qobiliyati oʻqitish jarayonida ishtirok etmagan mintaqalarda (Kaliforniya, Oregon, Arizona, Yuta, Britaniya Kolumbiyasi) ham samarali ishlashi bilan tasdiqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Toʻliqlik (recall) — model tomonidan aniqlangan haqiqiy yongʻinlar ulushi. Past koʻrsatkich model koʻplab yongʻinlarni oʻtkazib yuborayotganini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kunduzgi va tungi ishlashni solishtirish muhim farqlarni koʻrsatdi: CatBoost tunda ham ishonchli ishlashni saqlab qolgan boʻlsa, GOES FDC’ning toʻliqlik koʻrsatkichi nolga yaqinlashdi. Qoʻshimcha tahlillar shuni koʻrsatdiki, kichik hajmdagi maʼlumotlarda (masalan, 2000 ta yongʻin pikseli) oʻqitilgan modellar notoʻgʻri signallar sonini oshiradi va yangi hududlarda ishlash qobiliyatini pasaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat Shimoliy Amerika hududlari bilan cheklangan va faqat VIIRS maʼlumotlari bilan solishtirilgan, bu boshqa yuqori aniqlikdagi manbalarni hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar taʼkidlashicha, ushbu ish Zhao va Ban (2022) tadqiqotlarini kengaytirib, alohida yongʻin hodisalari emas, balki yirik geografik hududlarni qamrab oladi va GOES FDC bilan toʻgʻridan-toʻgʻri solishtiriladi. Cheklovlar qatoriga toʻliq diskli tasvirlarda sinov oʻtkazilmagani va faqat bitta model (CatBoost) ishlatilgani kiradi. Shunga qaramay, natijalar mashinali oʻqitish yongʻin monitoringini yaxshilash va notoʻgʻri signallarni kamaytirish imkonini berishini tasdiqlaydi.&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"yonginni-aniqlash-algoritmi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#yonginni-aniqlash-algoritmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yongʻinni aniqlash algoritmi&lt;/span&gt;&lt;/a&gt;Yongʻinni aniqlash algoritmi&lt;/h4&gt;\n&lt;p&gt;Mashinali oʻqitish algoritmini ishlab chiqish jarayoni toʻrt bosqichdan iborat: VIIRS maʼlumotlarini GOES ABI toʻriga fazoviy moslashtirish, belgilangan maʼlumotlar toʻplamini yaratish, modelni oʻqitish va baholash. Model kodi va namunaviy maʼlumotlar mualliflarning omborida mavjud.&lt;/p&gt;\n&lt;h4 id=\"viirs-yongin-aniqlash-malumotlarini-goes-abi-toriga-otkazish\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#viirs-yongin-aniqlash-malumotlarini-goes-abi-toriga-otkazish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VIIRS yongʻin aniqlash maʼlumotlarini GOES ABI toʻriga oʻtkazish&lt;/span&gt;&lt;/a&gt;VIIRS yongʻin aniqlash maʼlumotlarini GOES ABI toʻriga oʻtkazish&lt;/h4&gt;\n&lt;p&gt;VIIRS va GOES ABI asboblari turlicha fazoviy aniqlikka ega boʻlgani uchun, VIIRS yongʻin markazlari GOES ABI toʻriga rasterlashtirildi. VIIRS bilan kesishmaydigan piksellarga 0 qiymati berildi. Rasterlashtirish uchun Rasterio kutubxonasi ishlatildi. Shuningdek, skanerlashdagi «kapalak effekti» (bowtie effect) tufayli yuzaga keladigan takroriy piksellar mualliflar tomonidan tavsiya etilgan usul yordamida tozalandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Kapalak effekti» — bu sunʼiy yoʻldosh skanerlash jarayonida kuzatiladigan, tasvir chekkalarida piksellarning ustma-ust tushishiga olib keladigan texnik buzilish.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"belgilangan-malumotlar-toplamini-yaratish\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#belgilangan-malumotlar-toplamini-yaratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Belgilangan maʼlumotlar toʻplamini yaratish&lt;/span&gt;&lt;/a&gt;Belgilangan maʼlumotlar toʻplamini yaratish&lt;/h4&gt;\n&lt;p&gt;GOES ABI piksellarini «yongʻin» yoki «yongʻin emas» deb belgilashda sunʼiy yoʻldoshlar oʻrtasidagi bir necha kilometrgacha yetishi mumkin boʻlgan fazoviy nomutanosiblik hisobga olindi. Ushbu xatolikni tuzatish uchun har bir VIIRS yongʻin nuqtasi atrofida 3×3 oʻlchamli bufer oynasi qoʻllanildi. Ushbu oyna ichida yongʻin indeksi (Fire Index, FI) eng yuqori boʻlgan GOES ABI pikseli «yongʻin» deb belgilandi. FI indeksi &lt;span class=\"yfm-latex\" data-content=\"FI%20%3D%20%5Cfrac%7BB_%7B3.9%7D%20-%20B_%7B11.2%7D%7D%7BB_%7B3.9%7D%20%2B%20B_%7B11.2%7D%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi boʻyicha hisoblanadi, bunda B3.9 va B11.2 mos ravishda 3.9 va 11.2 mkm toʻlqin uzunligidagi yorqinlik haroratlaridir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yongʻin indeksi (FI) qisqa toʻlqinli va issiqlik infraqizil kanallari oʻrtasidagi farqdan foydalanadi, chunki birinchisi yuqori haroratli yongʻin oʻchoqlariga nisbatan sezgirroq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Yongʻin emas» sinfini yaratish uchun har bir tasvirdan yongʻin hududlariga yaqin boʻlmagan 500 ta piksel tanlab olindi. Har bir piksel uchun 16 ta spektral kanal va FI qiymatlari olindi, shuningdek, 3×3 oyna ichidagi 17 ta parametr uchun statistik koʻrsatkichlar (oʻrtacha, mediana, min, max, standart ogʻish) hisoblandi. Bu oʻqitish uchun 102 ta xususiyatni berdi. Bulutlar bilan qoplangan piksellar hisobdan chiqarildi.&lt;/p&gt;\n&lt;p&gt;GOES ABI aniqlay olmaydigan kichik yongʻinlarni &lt;a href=\"concepts/filtratsiya.html\"&gt;filtrlash&lt;/a&gt; uchun quyidagi mezonlar qoʻllanildi: 3×3 oynada kamida 2 ta VIIRS yongʻin aniqlanishi va FI &amp;gt; 0 boʻlishi. Sinfdagi nomutanosiblikni (yongʻin boʻlmagan piksellarning koʻpligi) bartaraf etish uchun yongʻin va yongʻin boʻlmagan piksellar oʻrtasida 1:20 nisbat belgilandi, bu eng yaxshi F1-koʻrsatkichini taʼminladi. Filtrlashdan soʻng yakuniy toʻplam 65 877 ta yongʻin va 1 317 540 ta yongʻin boʻlmagan piksellarni oʻz ichiga oldi.&lt;/p&gt;\n&lt;h4 id=\"modelni-oqitish\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#modelni-oqitish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modelni oʻqitish&lt;/span&gt;&lt;/a&gt;Modelni oʻqitish&lt;/h4&gt;\n&lt;p&gt;Yongʻinlarni aniqlash uchun CatBoost algoritmi qoʻllanildi. Bu qarorlar daraxtlari ustida gradientli busting usuliga asoslangan modeldir. Klassik yondashuvlardan farqli oʻlaroq, CatBoost tartibli busting (ordered boosting), kategoriyali belgilarni avtomatik qayta ishlash va «oblivious» (unutmaydigan) daraxtlar tuzilmasi orqali modelning haddan tashqari moslashuvi (overfitting) va maʼlumotlar sizib chiqishining oldini oladi. Oʻquv maʼlumotlar toʻplami 80% oʻqitish va 20% validatsiya uchun taqsimlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CatBoost — bu mashinali oʻqitish algoritmi boʻlib, u ketma-ket qarorlar daraxtlarini quradi, bunda har bir keyingi daraxt avvalgisining xatolarini tuzatadi, bu esa murakkab tayyorgarliksiz samarali ishlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"yonginni-aniqlash-algoritmi-aniqligini-baholash\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#yonginni-aniqlash-algoritmi-aniqligini-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yongʻinni aniqlash algoritmi aniqligini baholash&lt;/span&gt;&lt;/a&gt;Yongʻinni aniqlash algoritmi aniqligini baholash&lt;/h4&gt;\n&lt;p&gt;Algoritm aniqligini baholashda GOES ABI va VIIRS sunʼiy yoʻldosh maʼlumotlari oʻrtasidagi fazoviy nomutanosibliklar hisobga olindi. Agar algoritm (i, j) pikselida yongʻinni bashorat qilsa va bu piksel atrofidagi 3 × 3 oynada kamida bitta VIIRS aniqlashi mavjud boʻlsa, natija haqiqiy ijobiy (TP) deb tasniflanadi. Aks holda, piksel notoʻgʻri ijobiy (FP) hisoblanadi. Agar VIIRS aniqlashi atrofidagi 3 × 3 oynada model bashorati boʻlmasa, piksel notoʻgʻri salbiy (FN) deb belgilanadi. Moslashtirish jarayoni 5-rasmda keltirilgan.&lt;/p&gt;\n&lt;p&gt;Tasvirni tasniflash sifatini baholash uchun recall (toʻliqlik), precision (aniqlik) va F1-oʻlchov koʻrsatkichlaridan foydalaniladi. Toʻliqlik toʻgʻri aniqlangan yongʻinlar ulushini, aniqlik esa model tomonidan belgilangan barcha holatlar ichidagi toʻgʻri javoblar ulushini koʻrsatadi. F1-oʻlchov esa ularning garmonik oʻrtacha qiymatidir. Hisob-kitoblar (2), (3) va (4) formulalar boʻyicha butun tasvirlar toʻplami uchun TPtotal, FPtotal va FNtotal yigʻindilari asosida amalga oshiriladi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f2.jpg\" alt=\"2-rasm: 51 ta yongʻin hodisasi joylashuvi va ularning identifikatsiya raqamlari koʻrsatilgan xarita. Masalan, 19-raqamli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: 51 ta yongʻin hodisasi joylashuvi va ularning identifikatsiya raqamlari koʻrsatilgan xarita. Masalan, 19-raqamli yongʻin — 2021-yil 29-mayda Floridada sodir boʻlgan Bobcat yongʻini.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f3.jpg\" alt=\"3-rasm: VIIRS yongʻin aniqlash maʼlumotlarini GOES ABI toʻriga rasterizatsiya qilish.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: VIIRS yongʻin aniqlash maʼlumotlarini GOES ABI toʻriga rasterizatsiya qilish.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f4.jpg\" alt=\"4-rasm: Yongʻinni belgilash jarayonining illyustratsiyasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Yongʻinni belgilash jarayonining illyustratsiyasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: Yongʻinni belgilash jarayonining illyustratsiyasi. Chapda: VIIRS yongʻin aniqlash maʼlumoti (i, j) pikselida, rasterizatsiya qilingan VIIRS V matritsasida. Oʻngda: 3 × 3 oʻlchamli oyna GOES MCMI G matritsasiga qoʻllanadi. Eng yuqori FI qiymatiga ega G(i′, j′) pikseli yongʻin sifatida belgilanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f5.jpg\" alt=\"5-rasm: 3 × 3 oʻlchamli oynadan foydalangan holda GEO asosidagi yongʻin aniqlash algoritmining aniqligini baholash illyu\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: 3 × 3 oʻlchamli oynadan foydalangan holda GEO asosidagi yongʻin aniqlash algoritmining aniqligini baholash illyustratsiyasi. (chapda) Qizil piksellar — GEO asosidagi yongʻin aniqlash natijalari; (markazda) pushti piksellar — rasterizatsiya qilingan VIIRS yongʻin aniqlash natijalari; (oʻngda) FN, TP va FP — mos ravishda notoʻgʻri salbiy (false negative), toʻgʻri ijobiy (true positive) va notoʻgʻri ijobiy (false positive) natijalar.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f6.jpg\" alt=\"6-rasm: CatBoost modeli va GOES FDC mahsulotining beshta turli baholash hududidagi samaradorlik ko‘rsatkichlarini (recal\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: CatBoost modeli va GOES FDC mahsulotining beshta turli baholash hududidagi samaradorlik ko‘rsatkichlarini (recall, precision va F1-score) taqqoslash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f7.jpg\" alt=\"7-rasm: Texas (chapda) va Jorjiya (o‘ngda) shtatlaridagi GOES-16 ABI FI tasvirlari fonida CatBoost modeli bashoratlariga\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Texas (chapda) va Jorjiya (o‘ngda) shtatlaridagi GOES-16 ABI FI tasvirlari fonida CatBoost modeli bashoratlariga misol. VIIRS 375 m yong‘in aniqlash natijalari yashil kvadratlar bilan ko‘rsatilgan. CatBoost bashorati piksellari TP (haqiqiy ijobiy), FP (soxta ijobiy) va FN (soxta salbiy) uchun mos ravishda qizil, binafsha va ko‘k ranglar bilan kodlangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f8.jpg\" alt=\"8-rasm: Barcha o‘rganilgan hududlar bo‘yicha CatBoost modeli va GOES FDC ning recall, precision va F1-score ko‘rsatkichl\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Barcha o‘rganilgan hududlar bo‘yicha CatBoost modeli va GOES FDC ning recall, precision va F1-score ko‘rsatkichlari. A paneli (yuqorida) — tungi vaqt, B paneli (pastda) — kunduzgi vaqt.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f9.jpg\" alt=\"9-rasm: Beshta turli baholash hududida o‘qitish uchun har xil miqdordagi yong‘in piksellaridan foydalanadigan CatBoost m\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm: Beshta turli baholash hududida o‘qitish uchun har xil miqdordagi yong‘in piksellaridan foydalanadigan CatBoost modellarining samaradorlik ko‘rsatkichlarini taqqoslash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f10.jpg\" alt=\"10-rasm: Yong‘in hodisalari bo‘yicha CatBoost va GOES FDC o‘rtasidagi birinchi aniqlash vaqtidagi farq. A panelida faqat\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm: Yong‘in hodisalari bo‘yicha CatBoost va GOES FDC o‘rtasidagi birinchi aniqlash vaqtidagi farq. A panelida faqat qayta ishlangan va to‘yingan FDC toifalari yordamida tahlil ko‘rsatilgan, B paneliga esa «yuqori» toifasi kiritilgan. CatBoost va GOES FDC tomonidan bir vaqtning o‘zida aniqlangan yong‘in hodisalari «0» vaqt farqi yorlig‘iga ega.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-f11.jpg\" alt=\"11-rasm: CatBoost va GOES FDC algoritmlari tomonidan yongʻin pikselini aniqlash ehtimoli GOES ABI pikseli (k) ichidagi V\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-rasm: CatBoost va GOES FDC algoritmlari tomonidan yongʻin pikselini aniqlash ehtimoli GOES ABI pikseli (k) ichidagi VIIRS yongʻin aniqlashlarining minimal soniga bogʻliq holda. Baholash hududlari: (A) Jorjiya, (B) Texas, (C) Kaliforniya — Oregon, (D) Arizona — Yuta va (E) Britaniya Kolumbiyasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Mavjud&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;monitoring&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tizimlarining&l ct width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yong'inlarni&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;erta o'chirish&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;imkoniyati&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Preprint hali taqriz qilinmagan. Xulosalar dastlabki.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Preprint litsenziyasi&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;env_data&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mualliflar: Asaf Vanunu, Boaz Nadler, Arnon Karnieli&lt;/p&gt;\n&lt;h3 id=\"manbalar\"&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;
