        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Keyslar: vositalar va usullar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;COBICount-dagi vizual nazoratning yordamchi bloki, tarmoqning ichki belgilarini zichlikni hisoblashga ta'sir qilmasdan sinflar kanallariga aylantiradi.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Vosita&lt;/td&gt;\n&lt;td&gt;Модуль Audit (вспомогательный блок визуального контроля в COBICount)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Vazifa&lt;/td&gt;\n&lt;td&gt;Подсчет объектов на спутниковых снимках без дообучения нейросети&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ma'lumotlar&lt;/td&gt;\n&lt;td&gt;Спутниковые снимки новых регионов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Natija&lt;/td&gt;\n&lt;td&gt;Визуализация логики нейросети и повышение прозрачности подсчета объектов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/audit-module.html\"&gt;модуль Audit&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"vazifa\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#vazifa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vazifa&lt;/span&gt;&lt;/a&gt;Vazifa&lt;/h2&gt;\n&lt;p&gt;Sun'iy yo'ldosh tasvirlarini neyron tarmoqlar yordamida tahlil qilishda modelni yangi hududlarga moslashtirish muammosi yuzaga keladi. An'anaviy usullar modelni qayta o'qitishni talab qiladi. Asosiy vazifa — model og'irliklarini o'zgartirmasdan, tarmoqning mavjud belgilaridan foydalangan holda ob'ektlarni aniq sanashdir.&lt;/p&gt;\n&lt;h2 id=\"asbob-yoki-usul\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#asbob-yoki-usul\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asbob yoki usul&lt;/span&gt;&lt;/a&gt;Asbob yoki usul&lt;/h2&gt;\n&lt;p&gt;Audit moduli — bu COBICount tizimidagi yordamchi vizual nazorat bloki bo'lib, u axborot mohiyatidir. U tarmoqning ichki belgilarini sinf kanallariga aylantiradi. Usul neyron tarmoq tasvirni qayta ishlash jarayonida hosil qiladigan oraliq tasvirlarni ajratib olishga asoslangan. Modulning muhim xususiyati shundaki, u ob'ektlar zichligini hisoblashga ta'sir qilmaydi.&lt;/p&gt;\n&lt;h2 id=\"qanday-qollanildi\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#qanday-qollanildi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday qo'llanildi&lt;/span&gt;&lt;/a&gt;Qanday qo'llanildi&lt;/h2&gt;\n&lt;p&gt;Sun'iy yo'ldosh tasvirlarini sanash bo'yicha tadqiqotda Audit moduli neyron tarmoq ob'ektlarni qidirishda tasvirning qaysi qismlarini faollashtirishini nazorat qilish uchun ishlatildi. Tadqiqotchilar oldindan o'qitilgan modeldan foydalanib, yangi hududlar tasvirlarini kiritishdi. Audit moduli ob'ektlar sinflariga mos keladigan hududlarni ajratib ko'rsatdi.&lt;/p&gt;\n&lt;h2 id=\"natija\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#natija\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natija&lt;/span&gt;&lt;/a&gt;Natija&lt;/h2&gt;\n&lt;p&gt;Audit modulidan foydalanish neyron tarmoq qaror qabul qilish mantig'ini vizualizatsiya qilish imkonini berdi. Bu modelning yangi sharoitlarda ob'ektlarni to'g'ri tanib olishini tasdiqlashga yordam berdi. Natijada algoritmining ishlash shaffofligi oshdi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h2&gt;\n&lt;p&gt;Audit moduli vizualizatsiya vositasidir va neyron tarmoqning o'z xatolarini tuzatmaydi. Agar model maqsadli ob'ekt belgilarini ajrata olmasa, modul to'g'ri sinf kanallarini yarata olmaydi.&lt;/p&gt;\n&lt;h2 id=\"qanday-takrorlash-kerak\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#qanday-takrorlash-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday takrorlash kerak&lt;/span&gt;&lt;/a&gt;Qanday takrorlash kerak&lt;/h2&gt;\n&lt;p&gt;Usulni takrorlash uchun COBICount tizimiga va sun'iy yo'ldosh ma'lumotlariga kirish kerak. Oldindan o'qitilgan modelni ishga tushirish, Audit modulini tarmoqning oraliq qatlamlarini qayta ishlash uchun integratsiya qilish va sinf kanallarini vizualizatsiya qilishni sozlash talab etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%98%D1%81%D0%BF%D0%BE%D0%BB%D0%BD%D1%8F%D0%B5%D0%BC%D1%8B%D0%B9_%D1%84%D0%B0%D0%B9%D0%BB\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Исполняемый файл — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/intqhc/7.4.343\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Involving clients in clinical audits of mental health services&lt;/a&gt; — sharh, Int J Qual Health Care 1995&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s44168-026-00362-6\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Generative AI for climate governance and acceptability-constrained policy design&lt;/a&gt; — sharh, NPJ Clim Action 2026&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Keyslar: vositalar va usullar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"COBICount-dagi vizual nazoratning yordamchi bloki, tarmoqning ichki belgilarini zichlikni hisoblashga ta'sir qilmasdan sinflar kanallariga aylantiradi."}],"style
