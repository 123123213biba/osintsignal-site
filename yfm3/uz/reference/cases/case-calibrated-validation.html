        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Keyslar: vositalar va usullar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Modelning faktlarni buzmasdan va xolislikni yo'qotmasdan foydalanuvchi his-tuyg'ularini tan olish va empatiya ko'rsatish qobiliyati.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Vosita&lt;/td&gt;\n&lt;td&gt;Калиброванная валидация и бенчмарк FIGS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Vazifa&lt;/td&gt;\n&lt;td&gt;Снижение предвзятости ИИ и обеспечение эмпатии без потери фактологической точности&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ma'lumotlar&lt;/td&gt;\n&lt;td&gt;Бенчмарк FIGS (Factuality and Integrity in Generative Systems)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Natija&lt;/td&gt;\n&lt;td&gt;Снижение частоты необоснованного согласия ИИ с ошибочными утверждениями пользователей&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/calibrated-validation.html\"&gt;Калиброванная валидация&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"vazifa\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#vazifa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vazifa&lt;/span&gt;&lt;/a&gt;Vazifa&lt;/h2&gt;\n&lt;p&gt;Inson va sun'iy intellekt o'rtasidagi o'zaro ta'sir ko'pincha dilemmaga duch keladi: model yo foydalanuvchi bilan ko'r-ko'rona rozi bo'ladi (xushomadgo'ylik) yoki haddan tashqari quruq va begona javob beradi. Kalibrlangan validatsiya vazifasi — model foydalanuvchi his-tuyg'ularini tan olib, empatiya ko'rsatadigan, lekin faktik aniqlik va xolislikni saqlab qoladigan muvozanatni ta'minlashdir.&lt;/p&gt;\n&lt;h2 id=\"asbob-yoki-usul\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#asbob-yoki-usul\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asbob yoki usul&lt;/span&gt;&lt;/a&gt;Asbob yoki usul&lt;/h2&gt;\n&lt;p&gt;Kalibrlangan validatsiya (calibrated validation) — bu algoritmni sozlash jarayoni bo'lib, unda verifikatsiya (modelning spetsifikatsiyalarga muvofiqligini tekshirish) va validatsiya (modelning real vazifalarga muvofiqligini tekshirish) hissiy kontekstni baholash mexanizmi bilan to'ldiriladi. Usul kompyuter modellarini verifikatsiya va validatsiya qilish tamoyillariga asoslanadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-qollanildi\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#qanday-qollanildi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday qo'llanildi&lt;/span&gt;&lt;/a&gt;Qanday qo'llanildi&lt;/h2&gt;\n&lt;p&gt;Sun'iy intellektning «xushomadgo'ylik» muammosini hal qilish uchun FIGS (Factuality and Integrity in Generative Systems) benchmarki ishlab chiqildi. Tadqiqotchilar undan modellarni foydalanuvchi ularni noto'g'ri tasdiqqa undayotganini aniqlashga o'rgatish uchun foydalandilar. Model so'rovni ikki shkala bo'yicha baholashga o'rgatiladi: hissiy qo'llab-quvvatlash va faktik to'g'rilik.&lt;/p&gt;\n&lt;h2 id=\"natija\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#natija\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natija&lt;/span&gt;&lt;/a&gt;Natija&lt;/h2&gt;\n&lt;p&gt;FIGS benchmarkini qo'llash sun'iy intellektning foydalanuvchilarning noto'g'ri bayonotlari bilan asossiz rozi bo'lish chastotasini kamaytirdi. Modellar «to'g'ri rad etish» strategiyasini tez-tez tanlay boshladilar, bunda ular foydalanuvchi holatini tushunganliklarini tasdiqlaydilar, lekin tekshirilgan ma'lumotlarni taqdim etadilar.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h2&gt;\n&lt;p&gt;Kalibrlangan validatsiya usuli o'quv ma'lumotlarining sifati bilan cheklangan. Agar ma'lumotlar to'plamida murakkab axloqiy dilemmalar bo'lmasa, model tarafkashlik ko'rsatishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"qanday-takrorlash-kerak\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#qanday-takrorlash-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday takrorlash kerak&lt;/span&gt;&lt;/a&gt;Qanday takrorlash kerak&lt;/h2&gt;\n&lt;p&gt;Usulni amalga oshirish uchun javoblarni ko'p mezonli baholashni qo'llab-quvvatlaydigan arxitektura kerak. Sinov uchun noto'g'ri bayonotlar va hissiy bosim bo'lgan so'rovlar namunalarini o'z ichiga olgan ma'lumotlar to'plami talab qilinadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Verification_and_validation_of_computer_simulation_models\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Verification and validation of computer simulation models — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1183/16000617.0335-2025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Artificial intelligence in sleep diagnostics for children under 2 years of age: state of the evidence and future directions&lt;/a&gt; — sharh, Eur Respir Rev 2026&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/jcm15062218\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Safety-First Framework for AI-Enabled Anamnesis in Head and Neck Surgery: Evidence Synthesis from a Narrative Review&lt;/a&gt; — sharh, J Clin Med 2026&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fendo.2026.1893963\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;From static snapshots to longitudinal trajectories: artificial intelligence in women's reproductive and ovarian health&lt;/a&gt; — sharh, Front Endocrinol (Lausanne) 2026&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Keyslar: vositalar va usullar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Modelning faktlarni buzmasdan va xolislikni yo'qotmasdan foydalanuvchi his-tuyg'ularini tan olish va empatiya ko'rsatish qobiliyati."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Калиброванная валидация","description":"Modelning faktlarni buzmasdan va xolislikni yo'qotmasdan foydalanuvchi his-tuyg'ularini tan olish va empatiya ko'rsatish qobiliyati.","vcsPath":"reference/cases/case-calibrated-validation.md"},"headings":[{"title":"Vazifa","href":"reference/cases/case-calibrated-validation.html#vazifa","level":2},{"title":"Asbob yoki usul","href":"reference/cases/case-calibrated-validation.html#asbob-yoki-usul","level":2},{"title":"Qanday qo'llanildi","href":"reference/cases/case-calibrated-validation.html#qanday-qollanildi","level":2},{"title":"Natija","href":"reference/cases/case-calibrated-validation.html#natija","level":2},{"title":"Cheklovlar","href":"reference/cases/case-calibrated-validation.html#cheklovlar","level":2},{"title":"Qanday takrorlash kerak","href":"reference/cases/case-calibrated-validation.html#qanday-takrorlash-kerak","level":2},{"title":"Manbalar","href":"reference/cases/case-calibrated-validation.html#manbalar","level":2}],"title":"Калиброванная валидация"},"router":{"pathname":"reference/cases/case-calibrated-validation","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
