        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;сохраняет страницы и данные, чтобы доказательства не исчезли&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-digital_archivist.jpg\" alt=\"Цифровой архивист\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;сохраняет страницы и данные, чтобы доказательства не исчезли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;веб-архивы, WARC, цепочка хранения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ta'lim&lt;/td&gt;\n&lt;td&gt;Историко-архивное образование в сочетании с навыками работы с базами данных и ИИ.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qayerda ishlaydi&lt;/td&gt;\n&lt;td&gt;НИИ, государственные структуры, OSINT-организации, архивы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-data.html\"&gt;Ochiq ma'lumotlar&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Usullar va etika&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-bilan-shugullanadi\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#nima-bilan-shugullanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima bilan shug'ullanadi&lt;/span&gt;&lt;/a&gt;Nima bilan shug'ullanadi&lt;/h2&gt;\n&lt;p&gt;Raqamli arxivchi — bu ma'lumotlarning keyingi tekshiruvi va tahlili uchun ularning saqlanishi va yaxlitligini ta'minlaydigan mutaxassis. An'anaviy arxivchidan farqli o'laroq, raqamli arxivchi elektron ob'ektlarning hayotiy siklini boshqaradi: tarmoqdagi fiksatsiyadan tortib uzoq muddatli kirishni ta'minlashgacha. Mutaxassisning asosiy vazifasi — ma'lumotlarni o'chirilishidan yoki o'zgartirilishidan himoya qiluvchi dalillar bazasini yaratishdir.&lt;/p&gt;\n&lt;h2 id=\"tipik-vazifalar\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#tipik-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tipik vazifalar&lt;/span&gt;&lt;/a&gt;Tipik vazifalar&lt;/h2&gt;\n&lt;p&gt;Ish qidirish, yig'ish, saqlash va tekshirish protokollariga asoslanadi. Kundalik vazifalarga veb-sahifalarni suratga olish, metama'lumotlarni qayd etish va xeshlash orqali fayllarning o'zgarmasligini ta'minlash kiradi. Mutaxassis ma'lumotlarni yashirish urinishlarini aniqlash uchun nashrlardagi o'zgarishlarni kuzatib boradi.&lt;/p&gt;\n&lt;h2 id=\"konikmalar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#konikmalar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'nikmalar va vositalar&lt;/span&gt;&lt;/a&gt;Ko'nikmalar va vositalar&lt;/h2&gt;\n&lt;p&gt;Asosiy ko'nikma — raqamli ob'ektlarni tekshirish usullarini bilish va saqlash zanjirini (chain of custody) tushunishdir. Mutaxassislar veb-kontentni saqlash uchun WARC formatlaridan foydalanadilar. Shuningdek, matnlardan yashirin parametrlarni ajratib olish uchun til modellari asosidagi algoritmlarni qo'llash muhimdir.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-kerak\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#qayerda-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Tayyorgarlik klassik arxiv ishi va tarixga, zamonaviy IT-kompetensiyalar bilan to'ldirilgan holda asoslanadi. Tarixiy-arxiv ta'limi tasniflash va saqlash tamoyillarini tushunishni beradi. Texnik qism ma'lumotlar bazalari va mashinali o'qitish algoritmlari bilan ishlash orqali o'zlashtiriladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-ishlash-va-qanday-osish\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#qayerda-ishlash-va-qanday-osish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda ishlash va qanday o'sish&lt;/span&gt;&lt;/a&gt;Qayerda ishlash va qanday o'sish&lt;/h2&gt;\n&lt;p&gt;Raqamli arxivchilar ilmiy-tadqiqot institutlari, ochiq ma'lumotlar bilan shug'ullanuvchi davlat tuzilmalari va surishtiruv (OSINT) tashkilotlarida talab qilinadi. Karyera o'sishi ma'lumotlarni yig'ishdan strategiyalarni ishlab chiqishga o'tishni nazarda tutadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B0%D1%82%D0%B0%D0%BB%D0%B8%D0%BD%2C_%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80_%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B5%D0%B2%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Баталин, Виктор Николаевич — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Victor_Batalin_02.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: GalinaMalysheva222, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"сохраняет страницы и данные, чтобы доказательства не исчезли"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Цифровой архивист","description":"сохраняет страницы и данные, чтобы доказательства не исчезли","vcsPath":"reference/professions/prof-digital_archivist.md"},"headings":[{"title":"Nima bilan shug'ullanadi","href":"reference/professions/prof-digital_archivist.html#nima-bilan-shugullanadi","level":2},{"title":"Tipik vazifalar","href":"reference/professions/prof-digital_archivist.html#tipik-vazifalar","level":2},{"title":"Ko'nikmalar va vositalar","href":"reference/professions/prof-digital_archivist.html#konikmalar-va-vositalar","level":2},{"title":"Qayerda o'qish kerak","href":"reference/professions/prof-digital_archivist.html#qayerda-oqish-kerak","level":2},{"title":"Qayerda ishlash va qanday o'sish","href":"reference/professions/prof-digital_archivist.html#qayerda-ishlash-va-qanday-osish","level":2},{"title":"Manbalar","href":"reference/professions/prof-digital_archivist.html#manbalar","level":2}],"title":"Цифровой архивист"},"router":{"pathname":"reference/professions/prof-digital_archivist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
