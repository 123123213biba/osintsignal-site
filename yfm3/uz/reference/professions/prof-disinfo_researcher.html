        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;находит скоординированные кампании, ботов и путь нарративов&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-disinfo_researcher.jpg\" alt=\"Исследователь дезинформации\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;находит скоординированные кампании, ботов и путь нарративов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;сетевой анализ, социальные медиа, статистика&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ta'lim&lt;/td&gt;\n&lt;td&gt;Социология, политология, компьютерные науки, прикладная математика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qayerda ishlaydi&lt;/td&gt;\n&lt;td&gt;Академические институты, аналитические центры, IT-компании, фактчекинговые организации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-nets.html\"&gt;Axborot kampaniyalari va tarmoqlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalar-bilan-shugullanadi\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#nimalar-bilan-shugullanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalar bilan shug'ullanadi&lt;/span&gt;&lt;/a&gt;Nimalar bilan shug'ullanadi&lt;/h2&gt;\n&lt;p&gt;Dezinformatsiya tadqiqotchisi — bu raqamli muhitda noto'g'ri ma'lumotlarning tarqalishi va muvofiqlashtirilgan kampaniyalarni tahlil qiluvchi mutaxassis. Kasb kontent oqimlaridagi qonuniyatlarni aniqlashga qaratilgan tahliliy faoliyat turidir. Tadqiqotchi narrativlar qanday shakllanishi, tavsiya algoritmlari qanday ishlashi hamda botlar va foydalanuvchilarning bu jarayondagi o'rnini o'rganadi.&lt;/p&gt;\n&lt;h2 id=\"tipik-vazifalar\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#tipik-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tipik vazifalar&lt;/span&gt;&lt;/a&gt;Tipik vazifalar&lt;/h2&gt;\n&lt;p&gt;Mutaxassisning asosiy vazifasi — faktlarni tekshirish va tarmoq tuzilmalarini tahlil qilish. Kundalik ishga ochiq manbalardan (OSINT) ma'lumotlar yig'ish, kontent tarqalishi statistikasidagi anomaliyalarni aniqlash va algoritmlarning voqelikni idrok etishga ta'sirini baholash kiradi. Tadqiqotchilar foydalanuvchilar o'z diqqatini qanday cheklashini («filtr pufakchalari») o'rganadilar va ijtimoiy tarmoqlarning haqiqatni buzishga ta'siri qanchalik katta ekanligini tekshiradilar.&lt;/p&gt;\n&lt;h2 id=\"konikmalar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#konikmalar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'nikmalar va vositalar&lt;/span&gt;&lt;/a&gt;Ko'nikmalar va vositalar&lt;/h2&gt;\n&lt;p&gt;Ish uchun tarmoq tahlili ko'nikmalari, statistika usullari va katta til modellari (LLM) ishlash tamoyillarini tushunish talab etiladi. Asboblar to'plamiga graflarni vizuallashtirish dasturlari, ijtimoiy tarmoqlardan ma'lumotlarni yig'ish (parsing) vositalari va raqamli izlarni tekshirish usullari kiradi. Sun'iy intellekt modellarining halolligini baholash uchun maxsus benchmarklardan foydalaniladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-kerak\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#qayerda-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Kasb fanlararo tayyorgarlikni talab qiladi. Asosiy ta'lim odatda sotsiologiya, politologiya, kompyuter fanlari yoki amaliy matematikani o'z ichiga oladi. Maxsus ko'nikmalar ma'lumotlar tahlili usullarini o'rganish va tadqiqot loyihalarida ishtirok etish orqali egallanadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-ishlash-va-osish\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#qayerda-ishlash-va-osish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda ishlash va o'sish&lt;/span&gt;&lt;/a&gt;Qayerda ishlash va o'sish&lt;/h2&gt;\n&lt;p&gt;Dezinformatsiya tadqiqotchilari akademik institutlar, tahliliy markazlar (think tanks), texnologik kompaniyalar va mustaqil faktcheking tashkilotlarida ishlaydilar. Karyera o'sishi ma'lumotlar yig'ishdan axborot tahdidlarini baholash metodologiyalarini ishlab chiqishga o'tishni nazarda tutadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9B%D1%83%D0%BA%D1%8C%D1%8F%D0%BD%D0%BE%D0%B2%2C_%D0%A4%D1%91%D0%B4%D0%BE%D1%80_%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%D0%BE%D0%B2%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Лукьянов, Фёдор Александрович — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Fyodor_Lukyanov_2019.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: council.gov.ru, CC BY 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"находит скоординированные кампании, ботов и путь нарративов"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Исследователь дезинформации","description":"находит скоординированные кампании, ботов и путь нарративов","vcsPath":"refe
