        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;ищет следы монтажа и генерации в изображениях, видео и аудио&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-media_forensics.jpg\" alt=\"Специалист по медиакриминалистике\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;ищет следы монтажа и генерации в изображениях, видео и аудио&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;форензика, метаданные, детекторы дипфейков&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ta'lim&lt;/td&gt;\n&lt;td&gt;Информатика, прикладная математика, информационная безопасность.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qayerda ishlaydi&lt;/td&gt;\n&lt;td&gt;Правоохранительные органы, фактчекинг-центры, исследовательские лаборатории ИИ.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-verify.html\"&gt;Faktlar va mediani tekshirish&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalar-bilan-shugullanadi\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#nimalar-bilan-shugullanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalar bilan shug'ullanadi&lt;/span&gt;&lt;/a&gt;Nimalar bilan shug'ullanadi&lt;/h2&gt;\n&lt;p&gt;Media-kriminalistika bo'yicha mutaxassis (digital media forensics expert) — bu raqamli kontentning haqiqiyligini aniqlash, montaj yoki neyron tarmoqlar tomonidan yaratilgan izlarni topish bilan shug'ullanadigan professional. Ishning asosi raqamli kriminalistika (digital forensics) bo'lib, u raqamli qurilmalardan ma'lumotlarni yig'ish, saqlash va tahlil qilishni qamrab oladi.&lt;/p&gt;\n&lt;h2 id=\"tipik-vazifalar\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#tipik-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tipik vazifalar&lt;/span&gt;&lt;/a&gt;Tipik vazifalar&lt;/h2&gt;\n&lt;p&gt;Asosiy vazifa — materialning sun'iy kelib chiqishini ko'rsatadigan anomaliyalarni izlash. Bunga fayl metama'lumotlarini tahlil qilish, ma'lumotlar tuzilmasining yaxlitligini tekshirish va dipfeyklarga xos bo'lgan siqish yoki qatlamlash artefaktlarini aniqlash kiradi. Mutaxassis kontentning bashorat qilinishini ham baholaydi: masalan, neyron tarmoqlar tomonidan yaratilgan matnlar inson matnlariga qaraganda tuzilmaning haddan tashqari bashorat qilinishini ko'rsatadi.&lt;/p&gt;\n&lt;h2 id=\"konikmalar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#konikmalar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'nikmalar va vositalar&lt;/span&gt;&lt;/a&gt;Ko'nikmalar va vositalar&lt;/h2&gt;\n&lt;p&gt;Ish signallarni qayta ishlash, mashinali o'qitish va statistika sohasidagi ko'nikmalarni talab qiladi. Asosiy vositalarga chuqur o'qitishga asoslangan dipfeyk detektorlari va metama'lumotlarni tahlil qilish dasturlari kiradi. Mutaxassislar tasvir manbasini aniqlash uchun xususiyatlarni ajratib olish (feature extraction) usullaridan foydalanadilar.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-kerak\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#qayerda-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Baza ta'limi odatda informatika, amaliy matematika yoki axborot xavfsizligini o'z ichiga oladi. Ixtisoslashgan bilimlar tasvirlarni qayta ishlash va chuqur o'qitish usullari bo'yicha akademik sharhlarni o'rganish orqali olinadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-ishlash-va-qanday-osish\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#qayerda-ishlash-va-qanday-osish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda ishlash va qanday o'sish&lt;/span&gt;&lt;/a&gt;Qayerda ishlash va qanday o'sish&lt;/h2&gt;\n&lt;p&gt;Mutaxassislar huquqni muhofaza qilish organlarida, faktcheking bilan shug'ullanadigan yirik media-xoldinglarda va dezinformatsiyadan himoya qilish tizimlarini ishlab chiquvchi tadqiqot markazlarida talab qilinadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/professions/prof-media_forensics.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Digital_forensics\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Digital forensics — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:FLETC_Glynco-aerial.gif\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Drug Enforcement Administration (DEA), a United States Department of Justice law enforcement agency, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/s22124556\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Review of Image Processing Techniques for Deepfakes&lt;/a&gt; — sharh, Sensors (Basel) 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/jimaging6030009\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Survey of Deep Learning-Based Source Image Forensics&lt;/a&gt; — sharh, J Imaging 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fdata.2024.1400024\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deepfake: definitions, performance metrics and standards, datasets, and a meta-review&lt;/a&gt; — sharh, Front Big Data 2024&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"ищет следы монтажа и генерации в изображениях, видео и аудио"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Специалист по медиакриминалистике","description":"ищет следы монтажа и генерации в изображениях, видео и аудио","vcsPath":"reference/professions/prof-media_forensics.md"},"headings":[{"title":"Nimalar bilan shug'ullanadi","href":"reference/professions/prof-media_forensics.html#nimalar-bilan-shugullanadi","level":2},{"title":"Tipik vazifalar","href":"reference/professions/prof-media_forensics.html#tipik-vazifalar","level":2},{"title":"Ko'nikmalar va vositalar","href":"reference/professions/prof-media_forensics.html#konikmalar-va-vositalar","level":2},{"title":"Qayerda o'qish kerak","href":"reference/professions/prof-media_forensics.html#qayerda-oqish-kerak","level":2},{"title":"Qayerda ishlash va qanday o'sish","href":"reference/professions/prof-media_forensics.html#qayerda-ishlash-va-qanday-osish","level":2},{"title":"Manbalar","href":"reference/professions/prof-media_forensics.html#manbalar","level":2}],"title":"Специалист по медиакриминалистике"},"router":{"pathname":"reference/professions/prof-media_forensics","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
