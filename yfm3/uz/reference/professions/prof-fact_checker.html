        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;проверяет утверждения, цитаты, фото и видео перед публикацией&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;проверяет утверждения, цитаты, фото и видео перед публикацией&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;поиск источников, обратный поиск изображений, критическое мышление&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ta'lim&lt;/td&gt;\n&lt;td&gt;Журналистика, IT, библиотечное дело или аналитика; обучение через протоколы верификации и тренинги.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qayerda ishlaydi&lt;/td&gt;\n&lt;td&gt;Редакции СМИ, аналитические центры, научные проекты, государственные структуры мониторинга информации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-verify.html\"&gt;Faktlar va mediani tekshirish&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-bilan-shugullanadi\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#nima-bilan-shugullanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima bilan shug'ullanadi&lt;/span&gt;&lt;/a&gt;Nima bilan shug'ullanadi&lt;/h2&gt;\n&lt;p&gt;Faktcheker — bu xabarlar, bayonotlar va media kontentning faktik aniqligini tekshiruvchi mutaxassis. Kasb ma'lumotlarni tanqidiy tahlil qilish jarayoni bo'lib, u nashr etilgunga qadar xatolar, manipulyatsiyalar yoki noto'g'ri ma'lumotlarni aniqlashga qaratilgan. Avtomatlashtirilgan tizimlardan farqli o'laroq, faktcheker birlamchi manbalarni izlash, metama'lumotlarni tahlil qilish va mazmunni mantiqiy baholashni o'z ichiga olgan tekshiruv metodologiyasini qo'llaydi.&lt;/p&gt;\n&lt;h2 id=\"tipik-vazifalar\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#tipik-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tipik vazifalar&lt;/span&gt;&lt;/a&gt;Tipik vazifalar&lt;/h2&gt;\n&lt;p&gt;Faktchekerning asosiy vazifasi bayonotlarning haqiqiyligini aniqlashdir. Kundalik amaliyotga quyidagilar kiradi: axborotning birlamchi manbalarini izlash, tasvirlarning kelib chiqishini aniqlash uchun teskari qidiruv o'tkazish, raqamli ob'ektlarning metama'lumotlarini tekshirish va ochiq reyestrlardagi ma'lumotlar bilan solishtirish. Faktcheker matnlarning mantiqiy bog'liqligini tahlil qiladi, algoritmlar tanlovidagi tarafkashlikni aniqlaydi va vizual elementlarni ma'lumotlar to'plamlari bilan bog'lab, infografikani tekshiradi.&lt;/p&gt;\n&lt;h2 id=\"konikmalar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#konikmalar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'nikmalar va vositalar&lt;/span&gt;&lt;/a&gt;Ko'nikmalar va vositalar&lt;/h2&gt;\n&lt;p&gt;Ish shaffoflik va tekshiriluvchanlik tamoyillariga asoslanadi. Asosiy ko'nikmalar OSINT usullarini bilish, raqamli izlar bilan ishlash va kognitiv buzilishlarni tushunishni o'z ichiga oladi. Asboblar to'plamiga qidiruv tizimlari, teskari qidiruv xizmatlari, fayllar metama'lumotlarini tahlil qilish vositalari va ma'lumotlarni tekshirish uchun ixtisoslashgan freymvorklar kiradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-kerak\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#qayerda-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Faktchekerning kasbiy tayyorgarligi fanlararo yondashuvga asoslanadi. Asosiy ta'lim odatda jurnalistika, kutubxonachilik, axborot texnologiyalari yoki tahliliy fanlarni o'z ichiga oladi. Faktlarni tekshirish usullarini o'rganish tekshiruv protokollari (masalan, Berkli protokoli) va raqamli xavfsizlik bo'yicha treninglar orqali amalga oshiriladi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-ishlash-va-qanday-osish\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#qayerda-ishlash-va-qanday-osish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda ishlash va qanday o'sish&lt;/span&gt;&lt;/a&gt;Qayerda ishlash va qanday o'sish&lt;/h2&gt;\n&lt;p&gt;Faktchekerlar ommaviy axborot vositalari tahririyatlari, ilmiy-ommabop loyihalar, tahliliy markazlar va axborot monitoringi bilan shug'ullanuvchi davlat tuzilmalarida talabga ega. Karyera o'sishi umumiy yangiliklarni tekshirishdan murakkab ilmiy ma'lumotlar, sun'iy yo'ldosh tasvirlari yoki tarmoq tuzilmalarini tahlil qilishgacha bo'lgan ixtisoslashuvni nazarda tutadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B0%D0%BA%D1%82%D1%87%D0%B5%D0%BA%D0%B8%D0%BD%D0%B3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Фактчекинг — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/ijerph18158091\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;COVID-19 Misinformation Online and Health Literacy: A Brief Overview&lt;/a&gt; — sharh, Int J Environ Res Public Health 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/1529100620946707\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Citizens Versus the Internet: Confronting Digital Challenges With Cognitive Tools&lt;/a&gt; — sharh, Psychol Sci Public Interest 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/bjh.14757\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Serological weak D phenotypes: a review and guidance for interpreting the RhD blood type using the RHD genotype&lt;/a&gt; — sharh, Br J Haematol 2017&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"проверяет утверждения, цитаты, фото и видео перед публикацией"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Фактчекер","description":"проверяет утверждения, цитаты, фото и видео перед публикацией","vcsPath":"reference/professions/prof-fact_checker.md"},"headings":[{"title":"Nima bilan shug'ullanadi","href":"reference/professions/prof-fact_checker.html#nima-bilan-shugullanadi","level":2},{"title":"Tipik vazifalar","href":"reference/professions/prof-fact_checker.html#tipik-vazifalar","level":2},{"title":"Ko'nikmalar va vositalar","href":"reference/professions/prof-fact_checker.html#konikmalar-va-vositalar","level":2},{"title":"Qayerda o'qish kerak","href":"reference/professions/prof-fact_checker.html#qayerda-oqish-kerak","level":2},{"title":"Qayerda ishlash va qanday o'sish","href":"reference/professions/prof-fact_checker.html#qayerda-ishlash-va-qanday-osish","level":2},{"title":"Manbalar","href":"reference/professions/prof-fact_checker.html#manbalar","level":2}],"title":"Фактчекер"},"router":{"pathname":"reference/professions/prof-fact_checker","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
