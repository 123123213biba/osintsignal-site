        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;доверие и дезинформация&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-tto.jpg\" alt=\"Truth and Trust Online\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;доверие и дезинформация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;статьи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;Академиялық қоғамдастық және сарапшылар тобы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Жыл сайын&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Ғылыми конференция, баяндамалар мен секциялар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;truthandtrustonline.com&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-nets.html\"&gt;Axborot kampaniyalari va tarmoqlar&lt;/a&gt;, &lt;a href=\"concepts/spec-verify.html\"&gt;Faktlar va mediani tekshirish&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;Truth and Trust Online (TTO) — bu dezinformatsiya, raqamli kontentga ishonch va onlayn muhit xavfsizligi muammolarini o‘rganishga bag‘ishlangan yillik ilmiy konferensiya. Tadbir tadqiqotchilar, muhandislar va faktcheking mutaxassislarini internetdagi manipulyatsiyalarga qarshi kurashish usullarini muhokama qilish uchun birlashtiradi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Konferensiya akademik hamjamiyat va axborot ishonchliligi ustida ishlaydigan amaliyotchilar o‘rtasida bilim almashish maydoni sifatida yaratilgan. Tashkilotchilar nafaqat neyron tarmoqlardagi algoritmlar xatolarini, balki ijtimoiy tarmoqlarning voqelikni idrok etishga ta’sirini muhokama qilishga intilishadi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiyaning asosiy mavzulari quyidagilarni qamrab oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Neyron tarmoqlar mexanikasi: modellarni o‘qitish va ularning erkin rejimdagi xatti-harakati o‘rtasidagi tafovutni tahlil qilish.&lt;/li&gt;\n&lt;li&gt;Faktcheking va vizual ma’lumotlar: tekshiriladigan infografikalarni yaratish uchun InfoAgent kabi vositalarni ishlab chiqish.&lt;/li&gt;\n&lt;li&gt;G‘oyalar evolyutsiyasi: Drift Inspector kabi vositalar yordamida ilmiy adabiyotlardagi tendensiyalarni kuzatish.&lt;/li&gt;\n&lt;li&gt;AI boshqaruvi: qoidalarning global arxitektori haqidagi afsonalar va texnologiyalarni tartibga solishning markazlashmagan yondashuvlari.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#u-yerda-nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;Konferensiyada raqamli xavfsizlik haqidagi tasavvurlarni o‘zgartiradigan tadqiqot natijalari namoyish etiladi. Ishtirokchilar kontent elementlarini tekshiriladigan ma’lumotlar bilan bog‘laydigan yangi freymvorklarni va neyron tarmoqlarning xatti-harakatlarini tushunishga yordam beradigan tahlil usullarini taqdim etishadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiya natijalarini ma’ruzalar tezislari va chiqishlar yozuvlari orqali kuzatish mumkin. Ishtirok etish tadqiqot natijalari bilan chiqish uchun arizalar topshirish yoki tinglovchi sifatida qatnashishni nazarda tutadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A8%D0%B2%D0%B8%D0%BC%D0%BC%D0%B5%D1%80%2C_%D0%94%D1%8D%D0%B2%D0%B8%D0%B4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Швиммер, Дэвид — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:David_Schwimmer_2011.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Philippe Berdalle, CC BY-SA 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"доверие и дезинформация"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Truth and Trust Online","description":"доверие и дезинформация","vcsPath":"reference/conferences/conf-tto.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferen
