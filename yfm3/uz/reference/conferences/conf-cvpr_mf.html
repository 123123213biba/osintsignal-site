        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;детекция подделок изображений и видео&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;детекция подделок изображений и видео&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;статьи CVF (открыты)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;IEEE/CVF (Computer Vision Foundation)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Ежегодно, в рамках конференции CVPR&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Научный воркшоп, презентации докладов, публикация тезисов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;cvpr.thecvf.com&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-verify.html\"&gt;Faktlar va mediani tekshirish&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;CVPR Workshop on Media Forensics — bu IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR) doirasida o‘tkaziladigan ixtisoslashgan ilmiy maydon. Ushbu seminar vizual kontentdagi manipulyatsiyalarni aniqlash usullariga, jumladan, tasvir va videolardagi soxtalashtirishlarni aniqlashga qaratilgan. Tadbirning asosiy maqsadi — media ma’lumotlarini tekshirish bo‘yicha tadqiqot natijalari bilan almashishdir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Ushbu tadbir kompyuter ko‘rish bo‘yicha yetakchi xalqaro anjuman — CVPR homiyligida o‘tkaziladi. Tashkilotchilar sifatida media xavfsizligi bo‘yicha ixtisoslashgan akademik institutlar va tadqiqot laboratoriyalari ekspertlari ishtirok etadi. Seminar tarixi generativ kontent usullarining rivojlanishi bilan chambarchas bog‘liq.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Asosiy mavzular tahrirlash izlarini aniqlash algoritmlarini ishlab chiqish, raqamli obyektlar metama’lumotlarini tahlil qilish va detektor-modellarni o‘qitish uchun ma’lumotlar to‘plamlarini (dataset) yaratishni o‘z ichiga oladi. Muhokama qilinadigan asosiy yo‘nalishlar: deepfake-larni aniqlash usullari, raqamli dalillar yaxlitligini tahlil qilish va vizual ma’lumotlarni tekshirish standartlarini ishlab chiqish.&lt;/p&gt;\n&lt;h2 id=\"nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;Nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;Seminarda faktlarni tekshirishning yangi protokollari uchun asos bo‘ladigan tadqiqot natijalari taqdim etiladi. Ishtirokchilar media fayllardagi anomaliyalarni qidirishni avtomatlashtirish usullarini namoyish etadilar. Tadqiqot natijalari ko‘pincha CVF (Computer Vision Foundation) orqali ochiq manbalarda e’lon qilinadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Seminar materiallarini CVF rasmiy arxivi orqali kuzatish mumkin. Ishtirok etish uchun belgilangan muddatlarda ilmiy ishlarni topshirish, taqrizdan o‘tish va taqdimot bilan chiqish talab etiladi. Faktlarni tekshirish bilan shug‘ullanuvchilar uchun ushbu seminar OSINT-tekshiruvlarida qo‘llaniladigan dolzarb metodologiyalar manbai hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/List_of_datasets_in_computer_vision_and_image_processing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;List of datasets in computer vision and image processing — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"детекция подделок изображений и видео"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"CVPR Workshop on Media Forensics","description":"детекция подделок изображений и видео","vcsPath":"reference/conferences/conf-cvpr_mf.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-cvpr_mf.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-cvpr_mf.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-cvpr_mf.html#mavzular-va-seksiyalar","level":2},{"title":"Nimalar taqdim etiladi",
