        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;29 ta tushuncha&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/blaise.html\"&gt;Blaise&lt;/a&gt; — Hujjatlarni indekslaydigan va modelga faqat tegishli matn parchalarini uzatadigan Galahad tizimi komponenti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-writer.html\"&gt;Community Writer&lt;/a&gt; — Kontekstli izohlarni yaratish va ustuvorligini belgilash uchun qayta o'qitilgan va tijorat modellarini birlashtirgan AI API'ning eng yirik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drift-inspector.html\"&gt;Drift Inspector&lt;/a&gt; — Ilmiy sohalar evolyutsiyasini atomar hissa da'volarini ajratib olish va klasterlash orqali tahlil qilish uchun ochiq kodli tizim.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; — Tadqiqotga ko'ra, sun'iy intellekt tomonidan yaratilgan kontentga noto'g'ri ustunlik beradigan ma'lumotlar sifati filtri.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/galahad.html\"&gt;Galahad&lt;/a&gt; — Katta til modellarining ishlashini tezlashtirish uchun diqqat holati va matn parchalarini saqlaydigan tizim.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/igenbench.html\"&gt;IGenBench&lt;/a&gt; — Faktlar aniqligini va yaratilayotgan infografika aniqligini baholash uchun foydalaniladigan ma'lumotlar to'plami va benhmark.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infoagent.html\"&gt;InfoAgent&lt;/a&gt; — Infografika elementlarini bog'liqliklar grafi orqali ma'lumotlar manbalari bilan bog'laydigan va oldindan o'qitishsiz xatolarni lokal…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infographicbench-evidence.html\"&gt;InfoGraphicBench-Evidence&lt;/a&gt; — Tekshiriladigan dalillar asosida infografika yaratishning ishonchliligi va aniqligini baholash uchun mo'ljallangan 260 ta so'rovdan iborat…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kalibench.html\"&gt;KaliBench&lt;/a&gt; — Kali Linux CLI vositalari uchun tabiiy tildagi so'rovlarni buyruqlarga aylantirishni baholash uchun maxsus benchmark va ma'lumotlar…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/litereality-agent.html\"&gt;LiteReality-Agent&lt;/a&gt; — RGB-D xonalar skanerlarini bajariladigan Python kodi yozish orqali interaktiv 3D sahnalarga aylantiruvchi agent tizimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; — Ilmiy matnlarni yaratish va ularning tuzilishini tahlil qilish uchun ishlatiladigan sun'iy intellekt tizimlari.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mingbird.html\"&gt;Mingbird&lt;/a&gt; — Windows va Ollama uchun mahalliy agent tizimi, kichik til modellarining odatiy xatolaridan himoya qilish mexanizmlarini o'z ichiga oladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt; — Simulyatsiya uchun tayyor 3D sahnalar eksport qilinadigan fizik modellashtirish uchun dasturiy muhit.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nih-exporter.html\"&gt;NIH ExPORTER&lt;/a&gt; — AQSH Milliy sog'liqni saqlash institutlari tomonidan taqdim etiladigan grantlarning nomlari, annotatsiyalari va byudjetlari haqidagi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/room-py.html\"&gt;Room.py&lt;/a&gt; — 3D sahnadagi ob'ektlarning geometriyasi, fizik xususiyatlari va fazoviy aloqalarini tavsiflovchi bajariladigan Python fayli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/s-pubmedbert.html\"&gt;S-PubMedBERT&lt;/a&gt; — Tibbiy matnlarni vektorlash uchun model, bilimlar bazasi bilan faktlarni solishtirish aniqligini ta'minlash uchun ishlatiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secjev.html\"&gt;SecJev&lt;/a&gt; — Kiberxavfsizlik sohasida qaror qabul qilish uchun ixtisoslashgan modellar oilasi, avtoregressiv generatsiya o'rniga nomzodlarni bir…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/taliesin.html\"&gt;Taliesin&lt;/a&gt; — Galahad tizimining matn bloklari uchun KV-holatini saqlash va yuklash uchun javobgar komponenti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vida-geo.html\"&gt;VIDA-GEO&lt;/a&gt; — Shahar infratuzilmasini shaharsozlik normalarini hisobga olgan holda realistik vizual o'zgartirishlar yaratish uchun sun'iy yo'ldosh va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/visual-harness-for-reasoning.html\"&gt;VISTA&lt;/a&gt; — Multimodal modellar uchun qo'shimcha tizim bo'lib, harakatlarni rejalashtirish uchun yo'qotishsiz uzoq muddatli vizual xotirani ta'minlaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/automatic-annotator.html\"&gt;Автоматический аннотатор&lt;/a&gt; — LLM asosida ishlaydigan dasturiy vosita bo'lib, u ilmiy matnni segmentlarga ajratadi va uning qismlarini CARS modelining ritorik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reconstruction-agent.html\"&gt;Агент реконструкции&lt;/a&gt; — Tizimning tarkibiy qismi bo'lib, u masofaviy model interfeysi bilan mosligini ta'minlash uchun himoyalangan yozuv asosida media…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-number-generator.html\"&gt;Внешний генератор случайных чисел&lt;/a&gt; — Javoblarni rejalashtirishda model tomonidan taklif qilingan variantlar orasidan birini tanlash uchun qo'llaniladigan tashqi tasodifiylik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dataset.html\"&gt;Датасет&lt;/a&gt; — Yolg'on detektorlarini o'rgatish va sinash uchun ishlatiladigan savol-javob juftliklari to'plami.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/distilled-model.html\"&gt;Дистиллированная модель&lt;/a&gt; — So'rovlardagi mohiyat va mavzularni qayta yozish uchun ishlatiladigan, parametrlar soni kamaytirilgan mahalliy neyron tarmoq.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/density-map.html\"&gt;карта плотности&lt;/a&gt; — Neyrotarmoq tomonidan bashorat qilinadigan piksellar qiymatlarining fazoviy taqsimoti, ularning yig'indisi qidirilayotgan obyektlarning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/audit-module.html\"&gt;модуль Audit&lt;/a&gt; — COBICount-dagi vizual nazoratning yordamchi bloki, tarmoqning ichki belgilarini zichlikni hisoblashga ta'sir qilmasdan sinflar kanallariga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodal-large-language-models-mllm.html\"&gt;Мультимодальные языковые модели&lt;/a&gt; — Matnli ko'rsatmalarni talqin qilish va ularni voqealar tarixidagi vizual ma'lumotlar bilan bog'lash uchun vosita.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/figs-framework.html\"&gt;Фреймворк FIGS&lt;/a&gt; — Til modellarini baholash tizimi bo'lib, faktologik aniqlik va empatiya o'rtasidagi muvozanatni tekshirish uchun 10 bosqichli simulyatordan…&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"29 ta tushuncha"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Asboblar","description":"29 ta tushuncha","vcsPath":"reference/tools.md"},"headings":[],"title":"Asboblar"},"router":{"pathname":"reference/tools","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
