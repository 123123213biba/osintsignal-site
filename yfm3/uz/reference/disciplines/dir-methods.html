        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Научное направление: методы и этика открытых данных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;Развитие с 1997 года (алгоритмы поиска), 2008 (сетевой анализ), 2015 (глубокое обучение)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Эмпирическая верификация, сетевой анализ, предиктивный анализ (SSH), бенчмаркинг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Nucleic Acids Research, BMC Bioinformatics, Nature (обзоры)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-methods.html\"&gt;Usullar va etika&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalarni-organadi\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#nimalarni-organadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalarni o'rganadi&lt;/span&gt;&lt;/a&gt;Nimalarni o'rganadi&lt;/h2&gt;\n&lt;p&gt;Metodlar va etika — bu ochiq ma'lumotlarni yig'ish, qayta ishlash va talqin qilish tamoyillarini, shuningdek, avtomatlashtirilgan tizimlar va tadqiqotchilar xulq-atvorini tartibga soluvchi axloqiy normalarni o'rganadigan fanlararo ilmiy yo'nalishdir. Tadqiqot obyekti axborotni tekshirish jarayonlari, tahlil natijalarining takrorlanuvchanligi va insonning neyrotarmoq agentlari bilan o'zaro ta'sirining axloqiy jihatlaridir.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Yo'nalishning rivojlanishi qo'lda tahlil qilishdan avtomatlashtirilgan quvurlarga (pipelines) o'tish bilan bog'liq. 1997-yilda ma'lumotlar bazalarini qidirish algoritmlarining (masalan, PSI-BLAST) paydo bo'lishi katta hajmdagi ma'lumotlar bilan ishlash uchun asos yaratdi. 2008-yilda tarmoq tahlili usullarining (WGCNA) rivojlanishi murakkab tizimlarda yashirin korrelyatsiyalarni aniqlash imkonini berdi. 2015-yildan boshlab chuqur o'rganish (Deep Learning) yutuqlari tufayli e'tibor neyrotarmoqlarning «qora qutilarini» tekshirishga, ularning gallyutsinatsiyalarga moyilligini aniqlashga va KaliBench kabi maxsus benchmarklar orqali haqiqiy qobiliyatlarini baholashga qaratildi.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Sohada ikkita asosiy yondashuv ajratiladi: empirik va normativ. Empirik yondashuv takrorlanuvchanlikka tayanadi: agar natijani bir xil sharoitlarda qayta olish imkoni bo'lmasa, u ishonchsiz hisoblanadi. Normativ yondashuv klassik etikaga tayanib, sun'iy intellekt qaror qabul qilishining asosida yotgan axloqiy tamoyillarni o'rganadi. Zamonaviy tadqiqotlar shuni ko'rsatadiki, modelning «aniqligi» ko'pincha tizim intellektiga emas, balki so'rovning shakllanishiga bog'liq bo'lgan illyuziyadir.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar tartibsiz ma'lumotlarni tuzilmalashtirish uchun til modellari asosidagi algoritmlardan foydalanadilar. Sun'iy intellektni tekshirish uchun yolg'on detektorlari qo'llaniladi, ammo ular ko'pincha rol o'ynashni haqiqiy niyat deb xato qabul qiladi. SSH usuli (hujumlarni bashorat qilish tahlili) sun'iy intellekt agentlarining harakatlarini oldindan hisoblash imkonini beradi. Sifatni ta'minlashning asosiy vositasi standart agent karkaslarini ixtisoslashtirilganlariga almashtirishdir, bu esa ixcham modellarning (2-9B parametr) samaradorligini oshiradi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/h2&gt;\n&lt;p&gt;Yo'nalish tadqiqotlarning texnik bazasini ta'minlovchi «Asboblar va quvurlar» bilan chambarchas bog'liq. «Ma'lumotlar to'plamlari va benchmarklar» aniqlik o'lchovi bo'lib xizmat qiladi, «Kraudsorsing va belgilash» esa o'qitish uchun ma'lumotlar beradi. «Etika va maxfiylik» ochiq ma'lumotlar bilan ishlashda ruxsat etilgan chegaralarni belgilaydi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Mavzuga chuqurroq kirish uchun ma'lumotlar tahlili, ilmiy tadqiqot metodologiyasi va amaliy etika bo'yicha akademik kurslarni o'rganish tavsiya etiladi. Asosiy bilimlarni faktlarni tekshirish (fact-checking) va kiberxavfsizlikka ixtisoslashgan Data Science dasturlari doirasida olish mumkin. Bioinformatika, kompyuter fanlari va texnologiyalar falsafasi bo'yicha ilmiy jurnallardagi nashrlarni kuzatib borish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AD%D1%82%D0%B8%D0%BA%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Этика — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — sharh, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — sharh, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — sharh, Nature 2015&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Инструменты, датасеты, воспроизводимость и этика исследований открытых данных."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Usullar va etika","description":"Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.","vcsPath":"reference/disciplines/dir-methods.md"},"headings":[{"title":"Nimalarni o'rganadi","href":"ref
