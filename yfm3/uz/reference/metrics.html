        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;17 ta tushuncha&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/stability-generalization-score.html\"&gt;SGS&lt;/a&gt; — Kiritilgan ma'lumotlar o'zgarganda model xatti-harakatining ideal javoblar invariantligi shartidan og'ish darajasini o'lchash uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/geometric-accuracy.html\"&gt;Геометрическая точность&lt;/a&gt; — O'rtacha mutlaq chuqurlik xatosi (MAE) va ob'ektlarning fazoda joylashuvining to'g'riligi orqali baholanadigan rekonstruksiya sifati…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/two-hop.html\"&gt;Два прыжка&lt;/a&gt; — Foydalanuvchidan ikki bog'lanish masofasida bo'lgan kontent muallifigacha bo'lgan obuna grafigidagi radius.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attention-path-length.html\"&gt;Длина пути внимания&lt;/a&gt; — Foydalanuvchi va u o'zaro aloqada bo'lgan kontent muallifi o'rtasidagi obuna grafigidagi masofani o'lchaydigan metrika.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conversion.html\"&gt;Конверсия&lt;/a&gt; — Muayyan vaqt ichida muallif kontenti bilan o'zaro aloqadan unga obuna bo'lishga o'tish ko'rsatkichi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/capture-coefficient.html\"&gt;коэффициент захвата&lt;/a&gt; — Manbaning o'z-o'zini mustahkamlash kuchi ko'rsatkichi bo'lib, oldingi bosqichda iqtibos mavjud bo'lgan va mavjud bo'lmagan holatlardagi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/macro-accuracy.html\"&gt;Макро-точность&lt;/a&gt; — Model sifatini baholash metriki, bunda har bir vazifaga undagi savollar sonidan qat'i nazar teng vazn beriladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soft-metrics.html\"&gt;Мягкие метрики&lt;/a&gt; — Xavfni baholash uchun jamlanadigan, ammo muhim harakatlarga ruxsat berish uchun yetarli asos bo'lmagan modelning unumdorlik yoki…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/compounding-ratio.html\"&gt;отношение компаундирования&lt;/a&gt; — GEO ning masofadagi haqiqiy ta'sirining bir bosqichli baholash natijalariga nisbatini aks ettiruvchi ko'rsatkich.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mahalanobis-distance.html\"&gt;Расстояние Махаланобиса&lt;/a&gt; — Tasvirlarga kiritilgan o'zgartirishlar real ma'lumotlar taqsimoti doirasidan chiqib ketmasligini baholash uchun ishlatiladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cumulative-conversational-visibility.html\"&gt;совокупная видимость в диалоге&lt;/a&gt; — Diqqat vazn koeffitsientlarini hisobga olgan holda muloqotning barcha bosqichlari davomida manbaning umumiy ahamiyatini hisoblash uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/selection-regret.html\"&gt;Сожаление при выборе&lt;/a&gt; — Model samaradorligining ko'rsatkichi bo'lib, u mavjud eng yaxshi tasvir reytingi va model tomonidan tanlangan tasvir reytingi o'rtasidagi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — O‘rtacha mutlaq xatolik (MAE) — bu prognozlash sifatining ko‘rsatkichi bo‘lib, bashorat qilingan va haqiqiy ma’lumotlar o‘rtasidagi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-execution-accuracy.html\"&gt;Точность выполнения команд&lt;/a&gt; — Model ish sifati ko'rsatkichi, komponentlar bo'yicha baholanadi: vositani tanlash, ixtiyoriy bayroqlar va pozitsion argumentlarning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attack-success-rate.html\"&gt;Уровень успешности атак&lt;/a&gt; — Tizimga qilingan muvaffaqiyatli hujumlar ulushini aks ettiruvchi himoya samaradorligi metri.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fail-rate.html\"&gt;Частота неудач&lt;/a&gt; — Baholash sinovlaridagi asosiy ko'rsatkich bo'lib, model javoblari 2 va undan yuqori ball olgan ssenariylarning ulushini ifodalaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensitivity.html\"&gt;Чувствительность&lt;/a&gt; — Signal va shovqinni farqlash qobiliyatining 0 dan 1 gacha bo'lgan ko'rsatkichi.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Dip
