        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Yo'riqnoma&lt;/em&gt; · 2026-10-05&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Ushbu qo'llanma 37 790 ta NIH grant arizalari tahliliga asoslangan holda hisobotlardagi tsenzura mexanizmlarini tushuntiradi.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"maqsadi\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#maqsadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maqsadi&lt;/span&gt;&lt;/a&gt;Maqsadi&lt;/h2&gt;\n&lt;p&gt;Vosita «bug'lanib ketayotgan» ilmiy yo'nalishlarni aniqlash uchun mo'ljallangan. Hisobotlardagi lingvistik o'zgarishlar olimlarning real ishiga ta'sir qilmasdan, dunyoning statistik manzarasini qanday o'zgartirishini tushunishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"tarkibi\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#tarkibi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarkibi&lt;/span&gt;&lt;/a&gt;Tarkibi&lt;/h2&gt;\n&lt;p&gt;Asosida 37 790 ta NIH granti tahlili yotadi. Faol modda: ariza matnlarini davlat moliyalashtirish toifalari bilan solishtirish. Yordamchi komponentlar: etnik guruhlarning o'chirilgan eslatmalarini aniqlash uchun tabiiy tilni qayta ishlash usullari.&lt;/p&gt;\n&lt;h2 id=\"foydalanish-usuli\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#foydalanish-usuli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Foydalanish usuli&lt;/span&gt;&lt;/a&gt;Foydalanish usuli&lt;/h2&gt;\n&lt;p&gt;«Как чиновники удаляют слова из отчетов, чтобы «испарить» научные исследования» maqolasini oling. Usulni ochiq grantlar reyestriga qo'llang. Agar loyiha tavsifidan etnik guruh nomi yo'qolsa, loyiha avtomatik ravishda «ozchiliklar salomatligi» toifasidan chiqib ketadi. Statistika «toza» va shaxsiyatsiz bo'lguncha takrorlang.&lt;/p&gt;\n&lt;h2 id=\"nojoya-tasirlari\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#nojoya-tasirlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nojo'ya ta'sirlari&lt;/span&gt;&lt;/a&gt;Nojo'ya ta'sirlari&lt;/h2&gt;\n&lt;p&gt;Butun boshli fan sohalari yo'qolib qolgan degan illyuziya paydo bo'lishi mumkin. Moliyalashtirish va real tadqiqotlar o'zgarishsiz qolgani, ammo hisobotlar o'zgarganini anglash bosh aylanishiga olib kelishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"qarshi-korsatmalar\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#qarshi-korsatmalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qarshi ko'rsatmalar&lt;/span&gt;&lt;/a&gt;Qarshi ko'rsatmalar&lt;/h2&gt;\n&lt;p&gt;Avtomatik hisobotlarning mukammalligiga haddan tashqari ishonch bo'lsa, foydalanmang. Laboratoriya faoliyatidagi real o'zgarishlarni qidirish uchun tavsiya etilmaydi, chunki ular mavjud bo'lmasligi mumkin.&lt;/p&gt;\n&lt;h2 id=\"saqlash-shartlari\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#saqlash-shartlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Saqlash shartlari&lt;/span&gt;&lt;/a&gt;Saqlash shartlari&lt;/h2&gt;\n&lt;p&gt;Ochiq manbalarda, tarixni qayta yozish urinishlaridan uzoqda saqlang. Tanqidiy fikrlashni saqlab qolish uchun asl ma'lumotlar bilan muntazam solishtirib turish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"asos-bolgan-maqolalar\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#asos-bolgan-maqolalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asos bo'lgan maqolalar&lt;/span&gt;&lt;/a&gt;Asos bo'lgan maqolalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Hukumat hisobotlardan so‘zlarni olib tashlab, ilmiy tadqiqotlarni qanday «yo‘qotmoqda»&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Tushunchalar: &lt;a href=\"concepts/spec-data.html\"&gt;Ochiq ma'lumotlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ushbu qo'llanma 37 790 ta NIH grant arizalari tahliliga asoslangan holda hisobotlardagi tsenzura mexanizmlarini tushuntiradi."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Foydalanish bo'yicha yo'riqnoma: fanni qanday qilib ko'rinmas qilish mumkin","description":"Ushbu qo'llanma 37 790 ta NIH grant arizalari tahliliga asoslangan holda hisobotlardagi tsenzura mexanizmlarini tushuntiradi.","vcsPath":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.md"},"headings":[{"title":"Maqsadi","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#maqsadi","level":2},{"title":"Tarkibi","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#tarkibi","level":2},{"title":"Foydalanish usuli","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#foydalanish-usuli","level":2},{"title":"Nojo'ya ta'sirlari","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#nojoya-tasirlari","level":2},{"title":"Qarshi ko'rsatmalar","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#qarshi-korsatmalar","level":2},{"title":"Saqlash shartlari","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#saqlash-shartlari","level":2},{"title":"Asos bo'lgan maqolalar","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#asos-bolgan-maqolalar","level":2}],"title":"Foydalanish bo'yicha yo'riqnoma: fanni qanday qilib ko'rinmas qilish mumkin"},"router":{"pathname":"instructions/ins-data-still-funded-no-longer-counte
