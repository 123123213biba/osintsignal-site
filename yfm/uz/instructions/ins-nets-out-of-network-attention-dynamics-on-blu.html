        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Yo'riqnoma&lt;/em&gt; · 2026-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Ijtimoiy tarmoqlar lentangiz — bu algoritmlar fitnasi emas, balki o'zingiz qurgan shinam xona. Keling, ijtimoiy arxitektura qanday ishlashini tushunib olamiz.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"maqsadi\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#maqsadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maqsadi&lt;/span&gt;&lt;/a&gt;Maqsadi&lt;/h2&gt;\n&lt;p&gt;Kontentni ongli ravishda iste'mol qilish vositasi. Platforma algoritmlari sizga kun tartibini majburlamasa ham, nima uchun aynan bir xil odamlar va mavzularni ko'rayotganingizni tushunishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"tarkibi\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#tarkibi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarkibi&lt;/span&gt;&lt;/a&gt;Tarkibi&lt;/h2&gt;\n&lt;p&gt;Asosida «Filtr pufakchalari yoki tasodif: ijtimoiy tarmoqlarda kontentni qanday tanlaymiz» tadqiqoti yotadi. Faol modda: Bluesky platformasi foydalanuvchilarining 173 million o'zaro ta'sirini tahlil qilish. Yordamchi komponentlar: insonning o'xshashlikka moyilligi va ijtimoiy aloqalar tuzilmasi.&lt;/p&gt;\n&lt;h2 id=\"qollash-usuli\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#qollash-usuli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qo'llash usuli&lt;/span&gt;&lt;/a&gt;Qo'llash usuli&lt;/h2&gt;\n&lt;p&gt;Lentani varaqlashda har kuni qabul qiling. Esda tuting: 173 million o'zaro ta'sir shuni ko'rsatadiki, e'tiboringizning katta qismi «ijtimoiy pufakchangiz» ichida to'plangan. Kontentni ongli ravishda tanlang, aksariyat reaksiyalaringiz «ikki qadam» obuna doirasida cheklanganini unutmang.&lt;/p&gt;\n&lt;h2 id=\"nojoya-tasirlari\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#nojoya-tasirlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nojo'ya ta'sirlari&lt;/span&gt;&lt;/a&gt;Nojo'ya ta'sirlari&lt;/h2&gt;\n&lt;p&gt;Dunyo sizning lentangizdan kengroq ekanligini to'satdan anglash mumkin. Kamdan-kam hollarda — muqobil fikrlarning ko'pligidan yengil bosh aylanishi. Ijtimoiy tarmoqlardan haddan tashqari ko'p foydalanishda «aks-sado kamerasi» — o'z fikrlaringiz aks-sadosini eshitish holati yuzaga kelishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"qollash-mumkin-bolmagan-holatlar\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#qollash-mumkin-bolmagan-holatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qo'llash mumkin bo'lmagan holatlar&lt;/span&gt;&lt;/a&gt;Qo'llash mumkin bo'lmagan holatlar&lt;/h2&gt;\n&lt;p&gt;Dunyo haqidagi yagona haqiqat manbai sifatida foydalanish tavsiya etilmaydi. Algoritmlar sizning xohishlaringiz uchun yagona aybdor deb hisoblash noto'g'ri: tarmoq tuzilmasi ham kam bo'lmagan rol o'ynaydi.&lt;/p&gt;\n&lt;h2 id=\"saqlash-sharoitlari\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#saqlash-sharoitlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Saqlash sharoitlari&lt;/span&gt;&lt;/a&gt;Saqlash sharoitlari&lt;/h2&gt;\n&lt;p&gt;Quruq, salqin joyda, cheksiz skrollingsiz saqlang. Avtomatik tavsiyalardan asrang. Tanqidiy fikrlash bilan qo'llang.&lt;/p&gt;\n&lt;h2 id=\"asos-bolgan-maqolalar\"&gt;&lt;a href=\"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#asos-bolgan-maqolalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asos bo'lgan maqolalar&lt;/span&gt;&lt;/a&gt;Asos bo'lgan maqolalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html\"&gt;Ijtimoiy tarmoqlarda biz nimani tanlaymiz: algoritmlarmi yoki tanish doira?&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Tushunchalar: &lt;a href=\"concepts/spec-nets.html\"&gt;Axborot kampaniyalari va tarmoqlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ijtimoiy tarmoqlar lentangiz — bu algoritmlar fitnasi emas, balki o'zingiz qurgan shinam xona. Keling, ijtimoiy arxitektura qanday ishlashini tushunib olamiz."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Sizning «raqamli pufakchangiz» uchun foydalanish yo'riqnomasi","description":"Ijtimoiy tarmoqlar lentangiz — bu algoritmlar fitnasi emas, balki o'zingiz qurgan shinam xona. Keling, ijtimoiy arxitektura qanday ishlashini tushunib olamiz.","vcsPath":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.md"},"headings":[{"title":"Maqsadi","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#maqsadi","level":2},{"title":"Tarkibi","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#tarkibi","level":2},{"title":"Qo'llash usuli","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#qollash-usuli","level":2},{"title":"Nojo'ya ta'sirlari","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#nojoya-tasirlari","level":2},{"title":"Qo'llash mumkin bo'lmagan holatlar","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#qollash-mumkin-bolmagan-holatlar","level":2},{"title":"Saqlash sharoitlari","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#saqlash-sharoitlari","level":2},{"title":"Asos bo'lgan maqolalar","href":"instructions/ins-nets-out-of-network-attention-dynamics-on-blu.html#asos-bolgan-maqolalar","level":2}],"title":"Sizn
