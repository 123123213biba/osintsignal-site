        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Yo'riqnoma&lt;/em&gt; · 2026-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Oddiy xona skanlarini og‘riqsiz va ortiqcha asablarsiz interaktiv raqamli dunyoga aylantirish bo‘yicha qo‘llanmangiz.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"maqsadi\"&gt;&lt;a href=\"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#maqsadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maqsadi&lt;/span&gt;&lt;/a&gt;Maqsadi&lt;/h2&gt;\n&lt;p&gt;Vosita «xom» RGB-D xona skanlarini to‘liq 3D-modellarga aylantirish uchun mo‘ljallangan. Statik rasmlardan charchagan va interyerni fizik xususiyatlarga ega simulyatsiyaga aylantirmoqchi bo‘lganlar uchun juda mos keladi.&lt;/p&gt;\n&lt;h2 id=\"tarkibi\"&gt;&lt;a href=\"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#tarkibi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarkibi&lt;/span&gt;&lt;/a&gt;Tarkibi&lt;/h2&gt;\n&lt;p&gt;Asosida LiteReality-Agent yotadi. Faol komponentlar: iterativ aniqlashtirish algoritmlari, to‘qnashuvlarni tekshirish vositalari va geometriyani bajariladigan Room.py kodiga aylantiruvchi o‘rnatilgan interpretator.&lt;/p&gt;\n&lt;h2 id=\"qollash-usuli\"&gt;&lt;a href=\"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#qollash-usuli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qo‘llash usuli&lt;/span&gt;&lt;/a&gt;Qo‘llash usuli&lt;/h2&gt;\n&lt;p&gt;Xonangizning RGB-D skanini oling. Uni LiteReality-Agent tizimiga kiriting. Agent makonni «dasturlashni» boshlaydi va parametrlarni iterativ ravishda aniqlashtiradi. Natijada siz interyer geometriyasi va fizikasini tavsiflovchi Room.py faylini olasiz. Olingan modeldan narsalar haqiqiydek harakatlanadigan simulyatsiyalar uchun foydalaning.&lt;/p&gt;\n&lt;h2 id=\"nojoya-tasirlari\"&gt;&lt;a href=\"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#nojoya-tasirlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nojo‘ya ta’sirlari&lt;/span&gt;&lt;/a&gt;Nojo‘ya ta’sirlari&lt;/h2&gt;\n&lt;p&gt;Virtual reallikda stul devordan o‘tib ketmasligini tekshirish uchun mebellarni to‘satdan qayta joylashtirish istagi paydo bo‘lishi mumkin. Kamdan-kam hollarda kvartirangiz shunchaki bajariladigan kod qatorlari to‘plami ekanligini anglashdan yengil bosh aylanishi kuzatiladi.&lt;/p&gt;\n&lt;h2 id=\"qollash-mumkin-bolmagan-holatlar\"&gt;&lt;a href=\"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#qollash-mumkin-bolmagan-holatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qo‘llash mumkin bo‘lmagan holatlar&lt;/span&gt;&lt;/a&gt;Qo‘llash mumkin bo‘lmagan holatlar&lt;/h2&gt;\n&lt;p&gt;RGB-D ma’lumotlari bo‘lmaganda yoki statik holatda qolishni istamaydigan mushukni skanerlashga urinishda foydalanish tavsiya etilmaydi. Tizimga qora tuynukni yuklashga urinmang — fizik xususiyatlar nazoratdan chiqib ketishi mumkin.&lt;/p&gt;\n&lt;h2 id=\"saqlash-sharoitlari\"&gt;&lt;a href=\"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#saqlash-sharoitlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Saqlash sharoitlari&lt;/span&gt;&lt;/a&gt;Saqlash sharoitlari&lt;/h2&gt;\n&lt;p&gt;Bulutli xotirada yoki ishonchli SSD-da saqlang. Loyiha papkasini tasodifan o‘chirib qo‘yishdan saqlang. Virtual interyeringiz oxirgi kommit bilan birga yo‘qolib ketmasligi uchun muntazam ravishda zaxira nusxalarini yaratish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"asos-bolgan-maqolalar\"&gt;&lt;a href=\"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#asos-bolgan-maqolalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asos bo'lgan maqolalar&lt;/span&gt;&lt;/a&gt;Asos bo'lgan maqolalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html\"&gt;LiteReality-Agent: xonalarni kod yordamida interaktiv 3D-modellarga aylantirish&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Tushunchalar: &lt;a href=\"concepts/spec-verify.html\"&gt;Faktlar va mediani tekshirish&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Oddiy xona skanlarini og‘riqsiz va ortiqcha asablarsiz interaktiv raqamli dunyoga aylantirish bo‘yicha qo‘llanmangiz."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"LiteReality-Agent: Tartibsizlikni 3D-tartibga aylantirish bo‘yicha yo‘riqnoma","description":"Oddiy xona skanlarini og‘riqsiz va ortiqcha asablarsiz interaktiv raqamli dunyoga aylantirish bo‘yicha qo‘llanmangiz.","vcsPath":"instructions/ins-verify-litereality-agent-an-agentic-system-for-.md"},"headings":[{"title":"Maqsadi","href":"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#maqsadi","level":2},{"title":"Tarkibi","href":"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#tarkibi","level":2},{"title":"Qo‘llash usuli","href":"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#qollash-usuli","level":2},{"title":"Nojo‘ya ta’sirlari","href":"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#nojoya-tasirlari","level":2},{"title":"Qo‘llash mumkin bo‘lmagan holatlar","href":"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#qollash-mumkin-bolmagan-holatlar","level":2},{"title":"Saqlash sharoitlari","href":"instructions/ins-verify-litereality-agent-an-agentic-system-for-.html#saqlash-sharoitlari","level":2},{"title":"Asos bo'lgan maqolalar","href":"instructions/ins-verify-litereality-agent-an-agentic-system-for-
