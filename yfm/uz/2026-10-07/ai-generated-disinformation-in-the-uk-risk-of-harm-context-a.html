        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"105\" cy=\"143\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"695\" cy=\"245\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · NARRATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellekt va&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;dezinformatsiya: xavfni&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qanday aniqlash mumkin?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Mualliflar 2025-2026 yillarda Buyuk Britaniyada tarqalgan 112 ta sun'iy intellekt (SI) tomonidan yaratilgan kontentni tahlil qildilar. Ma'lum bo'lishicha, bunday materiallarning 84 foizi auditoriyada barqaror noto'g'ri tushuncha hosil qiladi. Tadqiqot jamoat xavfsizligi, sog'liqni saqlash va moliyaviy farovonlikka tahdid soluvchi sakkizta xavf sohasini aniqladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Tanlamadagi SI kontentining 84% i noto'g'ri tushunchalarni shakllantiradi.&lt;/li&gt;\n&lt;li&gt;Sakkizta xavf sohasi aniqlandi: moliyaviy firibgarlikdan tartibsizliklargacha.&lt;/li&gt;\n&lt;li&gt;SI feyklarining 59% i jiddiy ta'sir kuchiga ega emas deb topildi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar to'rt yillik loyiha doirasida ishlab chiqilgan «zararni baholash modeli»dan (harm-risk assessment model) foydalanishdi. Ma'lumotlar to'plamiga o'n millionlab marta ko'rilgan SI yordamida yaratilgan yoki o'zgartirilgan videolar, audio va tasvirlar kiritildi. Tanlovning asosiy mezoni sifatida «da'vo ishonchliligi» (checkworthiness framework) — kontentning jamoatchilik fikri yoki xatti-harakatlariga ta'sir qilish qobiliyati belgilandi.&lt;/p&gt;\n&lt;p&gt;Tahlil shuni ko'rsatdiki, o'rganilgan materiallarning 41 foizi ijtimoiy tartibsizliklar, moliyaviy firibgarlik yoki sog'liqqa zarar yetkazish kabi jiddiy xavflarni o'z ichiga oladi. Shu bilan birga, kontentning 59 foizi auditoriyaning past qiziqishi yoki harakat qilish uchun motivatsiyaning yo'qligi sababli ahamiyatsiz deb topildi. Mualliflar axborot makonini himoya qilish uchun xavfli manipulyatsiyalar va zararsiz raqamli shovqinni ajratib olish zarurligini ta'kidlaydilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;112 ta holatdan iborat tanlama vaziyatning faqat bir qismini aks ettiradi va barcha SI dezinformatsiyasini qamrab olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Buyuk Britaniyada sunʼiy intellekt (SI) yordamida yaratilgan yoki oʻzgartirilgan dezinformatsiya taʼsiriga uchrayotgan aholi soni misli koʻrilmagan darajada oʻsmoqda. 2025-yilda nashr etilgan toʻrt yillik tadqiqot loyihasida ishlab chiqilgan zarar xavfini baholash modeli asosida oʻtkazilgan tahlil 2025-yil 1-yanvardan 2026-yil martigacha Buyuk Britaniyada oʻn millionlab marta koʻrilgan 112 ta SI kontentini oʻrganib chiqdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tahlil qilingan materiallarning 80% dan ortigʻi keng koʻlamli dezinformatsiya effektini yaratadi, 41,1% i esa sakkiz xil sohada jiddiy zarar yetkazish salohiyatiga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zarar xavfini baholash modeli — bu yolgʻon maʼlumotlarni shunchaki notoʻgʻriligi uchun emas, balki ularning jamiyat va shaxslarga yetkazishi mumkin boʻlgan salbiy taʼsiri darajasi boʻyicha tasniflash usulidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tahlil shuni koʻrsatdiki, 112 ta namunadan 94 tasi (83,9%) auditoriyada sezilarli darajada notoʻgʻri yoki chalgʻituvchi tushuncha hosil qiladi. Qolgan 18 ta holat (16,1%) keng koʻlamli dezinformatsiya effektini keltirib chiqarmaydigan tor doiradagi noaniqliklar deb topildi. Demak, baholangan kontentning har beshtasidan toʻrttasi maʼlumotlarga boʻlgan ishonchsizlikni kuchaytiradi.&lt;/p&gt;\n&lt;p&gt;Mualliflar SI dezinformatsiyasi real zarar yetkazishi mumkin boʻlgan sakkizta sohani aniqladilar: ijtimoiy tartibsizliklar va zoʻravonlikni qoʻzgʻatishdan tortib, sogʻliqqa bevosita zarar yetkazish va moliyaviy firibgarlikkacha. Xavf roʻyxatiga quyidagilar ham kiritilgan: shaxsning sogʻligʻi va xulq-atvoriga taʼsir qiluvchi tazyiqlar, huquq-tartibot organlariga boʻlgan ishonchning pasayishi, xavfli fitna nazariyalarining tarqalishi hamda ijtimoiy-siyosiy qarashlarning uzoq muddatli oʻzgarishi. Natijalarga koʻra, 112 ta namunadan 46 tasi (41,1%) ushbu tahdidlarni amalga oshirish salohiyatiga ega, 66 tasi (58,9%) esa sezilarli xavf tugʻdirmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;112 ta namunadan iborat tanlanma toʻliq emas va faqat koʻrsatilgan davrdagi kontentning bir qismini aks ettiradi, bu esa natijalarni barcha SI dezinformatsiyasiga nisbatan umumlashtirish imkoniyatini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Zarar-xavf modeli tahlili shuni koʻrsatdiki, tanlamadagi yolgʻon maʼlumotlar sakkizta sohada bevosita yoki jamlangan taʼsir orqali zarar yetkazishi mumkin: ijtimoiy tartibsizliklar va zoʻravonlik; sogʻliq va xulq-atvorga zarar; moliyaviy firibgarlik; jamoat sogʻligʻiga tahdid; huquq-tartibot va sud tizimiga ishonchsizlik; iqlim siyosatiga munosabatning buzilishi; fitna nazariyalari va ijtimoiy-siyosiy qarashlarga taʼsir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tahlil shuni koʻrsatdiki, 112 ta holatdan 39 tasi butun jamiyatga, 10 tasi muayyan guruhlarga va 9 tasi alohida shaxslarga zarar yetkazishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Taʼsir koʻlami turlicha: 1 ta holat alohida shaxsga, 8 tasi noaniq doiradagi shaxslarga (masalan, moliyaviy firibgarlik), 10 tasi muayyan hamjamiyatlarga (masalan, etnik yoki diniy guruhlar) va 39 tasi butun jamiyatga taʼsir qilishi mumkin. Buyuk Britaniya tajribasini hisobga olgan holda, mualliflar bu xavflarni ortib borayotgan deb baholaydilar.&lt;/p&gt;\n&lt;p&gt;Shuni taʼkidlash kerakki, 112 ta yozuvdan 66 tasi (59%) sezilarli zarar yetkazish salohiyatiga ega emas. 17 ta holatda noaniqlik ahamiyatsiz boʻlgan, 19 tasida mavzu dolzarb emas, 24 tasida auditoriya qamrovi yetarli boʻlmagan, qolganlarida esa auditoriyada notoʻgʻri maʼlumot asosida harakat qilish uchun motivatsiya yoki imkoniyat boʻlmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oʻrganilgan misollarning yarmidan koʻpi (112 tadan 66 tasi) auditoriyaning past qiziqishi yoki mavzuning dolzarb emasligi sababli zarar yetkazish salohiyatiga ega emas deb topildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eng koʻp uchraydigan mavzu (112 tadan 71 tasi, 63,4%) siyosat boʻldi. Shuningdek, tashqi siyosat, iqtisodiyot, politsiya faoliyati, Yaqin Sharqdagi mojarolar, etnik guruhlar, fitna nazariyalari va tibbiyot mavzulari keng tarqalgan. Mavzularning aksariyati asosiy ommaviy axborot vositalari kun tartibi bilan bogʻliq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sunʼiy intellekt dezinformatsiyasi koʻpincha «dipfeyk»lardan — taniqli siyosatchilarni taqlid qiluvchi sintezlangan video yoki audio, yoxud sodir boʻlmagan voqealarni tasvirlovchi soxta kontentdan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Siyosat sohasida siyosatchilarning bayonotlarini taqlid qiluvchi sunʼiy intellekt videolari va audiolari ustunlik qiladi. Generativ vositalarning rivojlanishi kontent yaratish toʻsigʻini pasaytirdi: vizual kamchiliklar (masalan, tana aʼzolaridagi nuqsonlar) kamroq uchraydi. Google'ning SynthID kabi suv belgilari ekspertlarga yordam berishi mumkin, ammo audio-feyklarni aniqlash hali ham qiyin.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"kontekst-va-motivatsiya\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#kontekst-va-motivatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kontekst va motivatsiya&lt;/span&gt;&lt;/a&gt;Kontekst va motivatsiya&lt;/h4&gt;\n&lt;p&gt;Sunʼiy intellekt (SI) Buyuk Britaniyadagi axborot muhitini tez surʼatlar bilan oʻzgartirmoqda, bu esa SI tomonidan yaratilgan yoki oʻzgartirilgan kontent hajmining oshishiga olib kelmoqda. Kontentning shaxsiylashtirilishi, media savodxonlikning pastligi va generativ vositalarning oson foydalanishi mavjud himoya mexanizmlarini — masalan, tuhmat toʻgʻrisidagi qonunlar va eshittirish qoidalarini — samarasiz qilmoqda. SI tomonidan yaratilgan materiallarning koʻpayishi odamlarning axborotga boʻlgan ishonchini pasaytiradi, bu esa real xulq-atvor va ijtimoiy natijalarga salbiy taʼsir koʻrsatishi mumkin. Mualliflar «SI tomonidan yaratilgan» kontent deganda toʻliq yoki qisman generatsiya qilingan (matn, tasvir, video, audio), «SI tomonidan oʻzgartirilgan» deganda esa maʼnoni oʻzgartirish uchun manipulyatsiya qilingan mavjud materiallarni tushunishadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SI kontentining tarqalishi axborotga boʻlgan ishonchni susaytirib, mavjud huquqiy va tartibga soluvchi himoya mexanizmlarini samarasiz qilmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"full-fact-tadqiqoti\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#full-fact-tadqiqoti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Full Fact tadqiqoti&lt;/span&gt;&lt;/a&gt;Full Fact tadqiqoti&lt;/h4&gt;\n&lt;p&gt;Hisobotda SI kontenti hajmining oshishi real zararga qanday sabab boʻlishi mumkinligi tahlil qilinadi. Tadqiqot Buyuk Britaniyaning yetakchi faktcheking tashkiloti Full Fact tomonidan 2025–2026 yillarda tekshirilgan 112 ta faktga asoslanadi. Mualliflar kontent mavzulari, formatlari va turlarini tasniflaydi, shuningdek, uni tarqatuvchi subyektlarni aniqlaydi. Ishda shaxslar va jamiyat uchun oqibatlar, taʼsirning ogʻirligi va davomiyligi baholanadi hamda xavflarni baholash modeli tasvirlanadi. Olingan maʼlumotlar qaror qabul qiluvchilar va tadqiqotchilar uchun axborot tizimlarining barqarorligini oshirish maqsadida maʼlumotlar toʻplami sifatida taqdim etilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Faktcheking — bu tekshiriladigan manbalar va metamaʼlumotlardan foydalangan holda daʼvolarning haqiqatga mosligini tekshirish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tadqiqot-savollari\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#tadqiqot-savollari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot savollari&lt;/span&gt;&lt;/a&gt;Tadqiqot savollari&lt;/h4&gt;\n&lt;p&gt;Ish Sunʼiy intellekt xavfsizligi instituti (AISI)ning ijtimoiy barqarorlik boʻyicha ustuvor yoʻnalishlariga mos keladi va quyidagi savollarga javob izlaydi: oʻrganilayotgan davrda Buyuk Britaniyada qanday turdagi va mavzudagi SI kontenti keng tarqalgan; ular boshqa usullar bilan yaratilgan dezinformatsiyadan qanday farq qiladi; taʼsirga uchragan auditoriya qamrovi qanday; bunday kontentning shaxslar yoki jamiyat uchun isbotlangan yoki potentsial oqibatlari qanday; va turli darajadagi zararni keltirib chiqarish potentsialiga asoslangan kontentni tasniflash tizimi qanday boʻlishi kerak.&lt;/p&gt;\n&lt;h4 id=\"qamrov-va-cheklovlar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#qamrov-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qamrov va cheklovlar&lt;/span&gt;&lt;/a&gt;Qamrov va cheklovlar&lt;/h4&gt;\n&lt;p&gt;Tadqiqot bazasi 2025-yil 1-yanvardan 2026-yil 31-martgacha bo‘lgan davrda Full Fact tomonidan e’lon qilingan va tarkibida sun’iy intellekt (SI) ishtiroki ehtimoli qayd etilgan faktcheking hamda maqolalardan iborat. O‘sha davrda kontentni avtomatik saralash tizimi bo‘lmagani sababli, tadqiqotchilar «AI», «AI-», «Artificially» va «Artificial» kalit so‘zlari orqali qidiruv o‘tkazib, fullfact.org domenini doimiy kuzatib borishgan. Shuningdek, ichki metrikalar yordamida SIga aloqador bo‘lishi mumkin bo‘lgan, ammo matnda aniq ko‘rsatilmagan materiallar qo‘shilgan. Qo‘lda saralashdan so‘ng yakuniy tanlamaga 112 ta maqola kiritildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotchilar 112 ta maqolani tahlil qilib, ularning atigi 33 tasida (29,5%) SI ishtiroki aniq tasdiqlanganini aniqlashdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Manbalarda SI ishtirokiga bo‘lgan ishonch darajasi miqdoriy baholanmagani uchun matnli tahlil usuli qo‘llanildi. 112 ta holatdan 33 tasida xulosa qat’iy bo‘lgan. Yana 13 ta holatda «deyarli aniq» degan iboralar ishlatilgan. Qolgan holatlarda esa «juda ehtimoliy», «ehtimoliy» yoki «mumkin» kabi noaniq baholar berilgan yoxud SI ishtiroki umuman baholanmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Matnli tahlil — hujjatlar mazmunini tizimli o‘rganish orqali ulardagi qonuniyatlar va ma’nolarni aniqlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adabiyotlar-sharhi-dezinformatsiya-zarari-boyicha-mavjud-dalillar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#adabiyotlar-sharhi-dezinformatsiya-zarari-boyicha-mavjud-dalillar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Adabiyotlar sharhi: dezinformatsiya zarari bo‘yicha mavjud dalillar&lt;/span&gt;&lt;/a&gt;Adabiyotlar sharhi: dezinformatsiya zarari bo‘yicha mavjud dalillar&lt;/h4&gt;\n&lt;p&gt;Noto‘g‘ri ma’lumotlarning jamoatchilik fikriga ta’siri bo‘yicha ilmiy bahslar Birinchi jahon urushidan keyingi davrdan boshlab bir asrdan ortiq vaqt mobaynida davom etib kelmoqda. So‘nggi 10 yil ichida dezinformatsiyani o‘rganish mustaqil ilmiy sohaga aylandi. Tadqiqotchilar siyosat, mojarolar, sog‘liqni saqlash va sud tizimi kabi sohalarda noto‘g‘ri ma’lumotlarning ta’sirini tahlil qilmoqdalar. «Haqiqat» nima ekanligi va noto‘g‘ri ma’lumotlar auditoriya xulq-atvoriga qanday ta’sir qilishi haqidagi fundamental savollar M. Fuko, B. Uilyams, X. Arendt va D. Sperber kabi mutafakkirlar tomonidan yillar davomida muhokama qilingan.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Full Fact tashkiloti (ro‘yxatdan o‘tgan xayriya tashkiloti № 1158683 va notijorat kompaniyasi № 6975984) noto‘g‘ri ma’lumotlarni tasniflash yondashuvlarini tahlil qiladi. Tadqiqotchilar Emili Vraga va Letisiya Bode 2020-yilda dezinformatsiya va mizinformatsiyani aniqlashda yagona yondashuv yo‘qligini ta’kidlashgan edi. Biroq, so‘nggi yillarda akademik doiralarda ushbu atamalar bo‘yicha konsensus shakllandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Atamalar o‘rtasidagi asosiy farq niyatda: mizinformatsiya uning yolg‘onligini bilmagan holda tarqatiladi, dezinformatsiya esa ataylab yaratiladi va tarqatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Mizinformatsiya» (misinformation) deganda bugungi kunda mavjud dalillarga ko‘ra yolg‘on yoki chalg‘ituvchi, ammo tarqatuvchisi uning yolg‘onligini bilmaydigan ma’lumotlar tushuniladi. «Dezinformatsiya» (disinformation) esa siyosiy yoki ijtimoiy maqsadlarda ataylab tarqatiladigan yolg‘on ma’lumotlarni anglatadi. Shuningdek, moliyaviy manfaat yoki boshqa shaxsiy maqsadlarda yaratiladigan «klikbeyt» yoki «mistifikatsiya» kabi turlar ham mavjud.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mizinformatsiya — bu xatolarning beixtiyor tarqalishi, dezinformatsiya esa faktlar bilan ataylab manipulyatsiya qilishdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ta’riflardan tashqari, olimlar o‘nlab yillar davomida kommunikatsiya tabiatini muhokama qilib kelishadi: u faktlarni yetkazish vositasimi yoki fikr va e’tiqodlarni ifodalash usulimi? Kognitiv psixologlar insonning mavjud qarashlari yangi ma’lumotlarga bo‘lgan ishonchini qanday belgilashi va ma’lumotni qayta ishlash qanchalik osonligini o‘rganishadi. Shuni yodda tutish kerakki, mizinformatsiya va dezinformatsiya o‘rtasidagi terminologik farq barcha tillarda ham mavjud emas; masalan, fransuz va ispan tillarida bu tushunchalar o‘rtasida bunday aniq lingvistik chegara yo‘q.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg1\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Siyosat va sotsiologiya sohasidagi tadqiqotchilar notoʻgʻri eʼtiqodlarning barqarorligiga taʼsir etuvchi omillarni, jumladan, daʼvolarning takrorlanishi va dezinformatsiyani faol oʻrganmoqda. Axborotning qarashlarni shakllantirishiga oid umumiy kelishuv mavjud boʻlsa-da, bu axborotning xatti-harakatlarga bevosita taʼsiri hali ham bahsli masala boʻlib qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;OAVning xatti-harakatlarga taʼsiri boʻyicha ilmiy munozaralar «qudratli OAV» nazariyasidan «cheklangan taʼsir» konsepsiyasiga va kontekstni hisobga oluvchi zamonaviy modellarga oʻtdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tarixiy jihatdan, bu bahs Birinchi jahon urushidan keyin yuzaga kelgan «media-effektlar» haqidagi munozaralarni eslatadi. Oʻsha paytda AQSh olimlari ommaviy axborot vositalari — kino, radio va matbuot jamoatchilik fikrini tubdan shakllantirish qobiliyatiga ega deb hisoblashgan. Biroq, 1940-yillarda, Ikkinchi jahon urushi davrida oʻtkazilgan yangi tadqiqotlar OAVning taʼsiri cheklanganligini va ijtimoiy omillar muhimroq rol oʻynashini koʻrsatdi. 1970-yillarga kelib, tadqiqotchilar OAV faqat maʼlum sharoitlarda va muayyan auditoriyalarga taʼsir koʻrsatishi mumkin degan xulosaga kelishdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Media-effektlar» — bu ommaviy axborot vositalarining odamlar qarashlari, bilimlari va harakatlariga taʼsir darajasini tavsiflovchi akademik atama.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2016-yildagi siyosiy oʻzgarishlardan soʻng uchta asosiy fikr maktabi shakllandi. Birinchi guruh tadqiqotchilari dezinformatsiya jamoatchilik fikri va xatti-harakatlarini oʻzgartirish uchun katta kuchga ega deb hisoblaydi va buni AQSh hamda Filippindagi saylov natijalari bilan bogʻlaydi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg2\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Akademik doiralarda dezinformatsiya taʼsirini baholash boʻyicha uchta asosiy yondashuv shakllangan. Birinchisi, notoʻgʻri maʼlumotlarning tarqalishini keng koʻlamli siyosiy va ijtimoiy oʻzgarishlar bilan bogʻlaydi. Ikkinchi yondashuv esa, aksincha, dezinformatsiya fuqarolarning real xatti-harakatlari va qarashlariga «cheklangan yoki nol» taʼsir koʻrsatishini, bu boradagi ortiqcha xavotirlar esa demokratik institutlarga boʻlgan ishonchni susaytirib, senzura chaqiriqlarini kuchaytirishini taʼkidlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotlar dezinformatsiya taʼsirining keng spektrini koʻrsatadi: sezilarli taʼsirning yoʻqligidan tortib, muayyan sharoitlarda jiddiy oqibatlarga olib kelishigacha.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqotning negizida yotgan uchinchi yondashuv notoʻgʻri maʼlumotlar muayyan sharoitlarda aniq oqibatlarga olib kelishi mumkinligini taxmin qiladi. Bunday taʼsir qayd etilgan sohalar doirasi juda keng: saylov jarayonlari va jamoat sogʻligʻidan tortib, shaxsiy farovonlik, mojarolar, sud tizimi faoliyati va bozor iqtisodiyotigacha. Mualliflar oqibatlarning tabiati maʼlumot turiga, auditoriyaga va vaziyat kontekstiga bogʻliqligini taʼkidlaydilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kontekstual yondashuv — bu hodisa taʼsirini universal emas, balki muhit, vaqt va auditoriya xususiyatlari kabi tashqi omillarga bogʻliq holda baholash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aining-axborot-muhitidagi-orni\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#aining-axborot-muhitidagi-orni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AI'ning axborot muhitidagi oʻrni&lt;/span&gt;&lt;/a&gt;AI'ning axborot muhitidagi oʻrni&lt;/h4&gt;\n&lt;p&gt;AI ishtirokini tasdiqlovchi yoki taxmin qiluvchi faktchekinglar Full Fact faoliyatining ajralmas qismiga aylandi. 2023-yil boshida bunday holatlar kam uchragan boʻlsa, oʻrganilgan davrda AI bilan bogʻliq kontent barcha tekshiruvlarning 24 foizini tashkil etdi. Bir yil avval bu koʻrsatkich atigi 8 foizni tashkil qilgan edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI bilan bogʻliq faktchekinglar ulushi bir yil ichida 8 foizdan 24 foizgacha oʻsdi, bu esa dezinformatsiya yaratish uchun toʻsiqlar kamayganini koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Generativ vositalarning rivojlanishi chalgʻituvchi kontentni keng miqyosda yaratishni osonlashtirdi. Bu faktchekerlar ishini qiyinlashtirmoqda: agar uch yil avval soxta tasvirlarda anatomik xatolar (masalan, qoʻl-oyoqlarning notoʻgʻri shakli) koʻp uchragan boʻlsa, hozirda bunday belgilar kamayib bormoqda. Deepfake texnologiyalari — inson qiyofasi yoki ovozini taqlid qilish — eng keng tarqalgan tahdidlardan biriga aylandi. Video-feyklarni asl nusxasi bilan solishtirish orqali fosh qilish osonroq boʻlsa-da, audio-kontentni tekshirish qiyinligicha qolmoqda, chunki ekspertlar koʻpincha aniq xulosaga kela olmaydi va AI ovozini professional taqlidchilar bilan adashtirib yuborish xavfi mavjud.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deepfake — bu sunʼiy intellekt yordamida inson qiyofasi yoki ovozini boshqa shaxsga koʻchirish texnologiyasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bunga qarshi kurashish uchun Google’ning SynthID kabi yangi usullari joriy etilmoqda — bular faylning AI tomonidan yaratilganini bildiruvchi koʻrinmas raqamli suv belgilari. 2026-yildan boshlab OpenAI ham shunga oʻxshash identifikatsiya dasturlarini rivojlantirmoqda.&lt;/p&gt;\n&lt;h4 id=\"aniqlash-va-klassifikatsiyaning-joriy-yondashuvlari\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#aniqlash-va-klassifikatsiyaning-joriy-yondashuvlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aniqlash va klassifikatsiyaning joriy yondashuvlari&lt;/span&gt;&lt;/a&gt;Aniqlash va klassifikatsiyaning joriy yondashuvlari&lt;/h4&gt;\n&lt;p&gt;AI-kontent hajmining oʻsishiga javoban verifikatsiyaning yangi standartlari ishlab chiqilmoqda. 2023-yilda tarqalgan Rim Papasining kurtkadagi surati kabi ilk namunalar yaqinroq qaralganda vizual nuqsonlar bilan fosh boʻlgan. Biroq, generatsiyalar sifati tez oʻsib bormoqda, bu esa vizual tekshiruvni samarasiz qilmoqda.&lt;/p&gt;\n&lt;p&gt;2020-yildan buyon C2PA tashabbusi faol rivojlanmoqda. U «kontent hisobga olish maʼlumotlari» (Content Credentials) standartini taklif etadi. Bu raqamli fayllarga mualliflik va tahrirlash tarixini qayd etuvchi metamaʼlumotlarni biriktirish imkonini beradi, bu esa tasvirning kamerada olinganidan tortib, neyrotarmoqlar orqali qayta ishlanganigacha boʻlgan yoʻlini kuzatishga yordam beradi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg3\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg3\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Full Fact tashkiloti (xayriya fondi № 1158683 va notijorat kompaniyasi № 6975984) media kontentni tekshirish usullarini oʻrganadi. Kontent haqiqiyligini aniqlashning zamonaviy yondashuvlari «kontent maʼlumotlari» (content credentials) dan foydalanishni oʻz ichiga oladi, ular suratga olish joyi, vaqti va tahrirlash tarixini qayd etadi. Ushbu maʼlumotlar tasvir qisman neyron tarmoqlar yordamida oʻzgartirilgan boʻlsa ham, uning kelib chiqishini kuzatish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Content credentials — bu faylning raqamli «pasporti» boʻlib, u yaratilish va oʻzgartirish tarixini saqlaydi va kontentning haqiqiyligini tekshirishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;C2PA standartidan tashqari, Google «SynthID» tizimini joriy qildi. Oʻchirib tashlash mumkin boʻlgan metamaʼlumotlardan farqli oʻlaroq, SynthID koʻrinmas suv belgisini bevosita mediafayl tarkibiga joylashtiradi. Ushbu belgi mavjudligini tekshirish uchun Google maxsus API orqali kirish imkonini beradi. Ushbu texnologiyani kengaytirish doirasida Google generativ sunʼiy intellekt tomonidan yaratilgan kontentni markalash boʻyicha umumiy standartlarni joriy etish uchun Nvidia va OpenAI bilan hamkorlikni boshladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SynthID kabi markalash texnologiyalari koʻrinmas suv belgilarini bevosita media maʼlumotlarga joylashtiradi, bu esa ularning kelib chiqishini API orqali tekshirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Avvalroq Yevropa Ittifoqining Horizon grantlari tomonidan moliyalashtirilgan «vera.ai» loyihasi dezinformatsiyani tahlil qilish va sintetik audio hamda tasvirlarni avtomatik aniqlash vositalarini ishlab chiqish bilan shugʻullangan. Loyiha yakunlangan boʻlsa-da, ishlab chiqilgan vositalar foydalanish uchun ochiq qolmoqda. Mavjud tekshirish tizimlarining asosiy cheklovi shundaki, keng jamoatchilik bu texnologiyalardan foydalanish boʻyicha yetarli bilimga ega emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sunʼiy intellekt kontentini tekshirish boʻyicha mavjud vositalar hali keng foydalanuvchilar orasida ommalashmagan, bu ularning dezinformatsiyaga qarshi kurashdagi samaradorligini pasaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"dezinformatsiya-xavflarini-baholash\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#dezinformatsiya-xavflarini-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dezinformatsiya xavflarini baholash&lt;/span&gt;&lt;/a&gt;Dezinformatsiya xavflarini baholash&lt;/h4&gt;\n&lt;p&gt;Buyuk Britaniyada sunʼiy intellekt (SI) yordamida yaratilgan dezinformatsiya va notoʻgʻri maʼlumotlar bilan bogʻliq xavflar ortib bormoqda. 2025-yilda University of Westminster Press tomonidan nashr etilgan zarar-xavfni baholash modeliga asoslangan tadqiqotda 2025-yil 1-yanvardan 2026-yil 31-martgacha boʻlgan davrda Buyuk Britaniyada oʻn millionlab marta koʻrilgan 112 ta SI kontenti tahlil qilindi. Tahlil shuni koʻrsatdiki, 112 ta namunadan 94 tasi (83,9%) sezilarli darajada notoʻgʻri yoki chalgʻituvchi tushunchani (dezinformatsiya effekti) shakllantiradi, 18 tasi (16,1%) esa faqat kichik noaniqliklarni oʻz ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tahlil qilingan SI kontentining 41,1% i ijtimoiy tartibsizliklar, moliyaviy yoʻqotishlar va sogʻliqqa tahdidlar kabi sakkizta asosiy sohada jiddiy zarar yetkazish potensialiga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Umumiy namunalardan 46 tasi (41,1%) salbiy oqibatlarga olib kelishi yoki ularga hissa qoʻshishi mumkinligi aniqlandi, 66 tasi (58,9%) esa jiddiy zarar yetkazish uchun cheklangan yoki nol potensialga ega. Aniqlangan xavflar zoʻravonlik va kamsitishdan tortib, siyosiy qarashlar va iqlim siyosatiga taʼsir qilishgacha boʻlgan sakkizta yoʻnalish boʻyicha tasniflandi. Oqibatlarning taqsimlanishi shuni koʻrsatdiki, 1 ta holat aniq bir shaxsga, 8 tasi noaniq guruhlarga (masalan, firibgarlik qurbonlari), 10 tasi muayyan jamoalarga (diniy yoki kasbiy guruhlar), 39 tasi esa butun jamiyatga taʼsir qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zararni baholash modeli «sabab boʻlish»ni notoʻgʻri maʼlumot xatti-harakat uchun asosiy omil boʻlgan holat deb, «hissa qoʻshish»ni esa xatti-harakatga olib keladigan notoʻgʻri tushunchani &lt;a href=\"concepts/anchoring.html\"&gt;mustahkamlash&lt;/a&gt; deb belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot kuzatuv xarakteriga ega: kontent va oqibatlar oʻrtasidagi bogʻliqlik nazorat qilinadigan tajribaga emas, balki baholash modeliga asoslangan, shuning uchun sabab-oqibat aloqalarini talqin qilishda ehtiyotkorlik talab etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"asosiy-atamalar-lugati\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#asosiy-atamalar-lugati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy atamalar lugʻati&lt;/span&gt;&lt;/a&gt;Asosiy atamalar lugʻati&lt;/h4&gt;\n&lt;p&gt;Model «sezilarli oqibatlar yoki zararlar»ni shaxs yoki jamiyat manfaatlariga yetkazilgan obektiv tekshiriladigan zarar deb belgilaydi. «Sabab boʻlish» dalillar notoʻgʻri daʼvo xatti-harakat uchun zarur omil boʻlganini tasdiqlaganda qayd etiladi. «Hissa qoʻshish» maʼlumot xatti-harakatga olib keladigan notoʻgʻri tushunchani sezilarli darajada mustahkamlashini anglatadi. «Oqilona shubhadan tashqari» standarti, agar tekshiruvdan soʻng xatti-harakat uchun boshqa mantiqiy tushuntirish topilmasa, qoʻllanadi.&lt;/p&gt;\n&lt;h4 id=\"substantive-potential\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#substantive-potential\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;‘Substantive potential’&lt;/span&gt;&lt;/a&gt;‘Substantive potential’&lt;/h4&gt;\n&lt;p&gt;Model kontentni salbiy taʼsir koʻrsatish yoki uni kuchaytirish uchun «muhim salohiyat»ga (substantive potential) ega deb baholaydi, agar ikki shart bajarilsa. Birinchidan, mavjud ilmiy dalillar shuni koʻrsatadiki, bunday maʼlumotlar oʻxshash kontekstda oʻtmishda ham shunday oqibatlarga olib kelgan. Ikkinchidan, kontent modelda belgilangan, taʼsirni yuzaga keltirishi uchun zarur boʻlgan omillar mezonlariga javob berishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model kontentning zarar yetkazish ehtimolini tarixiy maʼlumotlar va belgilangan xavf omillariga muvofiqligi asosida baholaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fullfactorg4\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Full Fact — roʻyxatdan oʻtgan xayriya tashkiloti (roʻyxatdan oʻtish raqami 1158683) va notijorat kompaniya (roʻyxatdan oʻtish raqami 6975984).&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"davolarni-tanlash-mezonlari-tekshirish-tizimi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#davolarni-tanlash-mezonlari-tekshirish-tizimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Daʼvolarni tanlash mezonlari (tekshirish tizimi)&lt;/span&gt;&lt;/a&gt;Daʼvolarni tanlash mezonlari (tekshirish tizimi)&lt;/h4&gt;\n&lt;p&gt;Faktchekerlar kontentning yolgʻon, chalgʻituvchi yoki sunʼiy intellekt (SI) yordamida yaratilganligini har doim ham oldindan bilishmaydi. Full Fact kabi tashkilotlar ommaviy axborot vositalari, siyosat va ijtimoiy tarmoqlardagi tekshirilishi mumkin boʻlgan bayonotlarni aniqlash uchun monitoring vositalaridan foydalanadilar. Muayyan daʼvoni tekshirish toʻgʻrisidagi qaror bir qator omillarga asoslanadi. Bularga quyidagilar kiradi: siyosatchilar va OAV tomonidan bildirilgan dolzarb ijtimoiy ahamiyatga ega masalalar; odamlar hayotiga salbiy taʼsir koʻrsatishi mumkin boʻlgan bayonotlar; keng tarqalgan va tezkor rad etishni talab qiladigan kontent; dezinformatsiya taktikalarini koʻrsatish uchun taʼlimiy ahamiyatga ega boʻlgan namunalar; shuningdek, Facebook va Instagram foydalanuvchilari tomonidan notoʻgʻri maʼlumot sifatida belgilangan materiallar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tekshirish tizimi (checkworthiness framework) — bu tahririyatlarga ishni ustuvorlashtirishga yordam beradigan mezonlar toʻplami, chunki jamoat maydonidagi har bir bayonotni tekshirish imkonsizdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shuni taʼkidlash kerakki, faktchekerlar barcha tekshiruv natijalarini ham nashr etmaydilar. Agar loyiha aniq xulosalar bermasa yoki dezinformatsiyani tasdiqlamasa, u boʻyicha ish toʻxtatilishi mumkin. Bu nashr etilgan kontentda ataylab yolgʻon yoki chalgʻituvchi holatlar tomon tizimli siljishni keltirib chiqaradi. Natijada, tekshirilgan faktlar toʻplami barcha ommaviy bayonotlarning tasodifiy namunasi emas, bu esa topilmalarni umumiy axborot tendensiyalariga ekstrapolyatsiya qilish imkoniyatini cheklaydi.&lt;/p&gt;\n&lt;h4 id=\"si-aniqlash-usullari\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#si-aniqlash-usullari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SI aniqlash usullari&lt;/span&gt;&lt;/a&gt;SI aniqlash usullari&lt;/h4&gt;\n&lt;p&gt;Tadqiqot doirasida har bir daʼvo kontentni yaratishda SI ishtirokini va foydalanilgan modellarni aniqlash uchun tahlil qilindi. Eng keng tarqalgan dalil «glitch»lar (xatolar) boʻldi — vizual yoki audio materiallardagi nomukammalliklar, ular tadqiqotdagi 112 ta holatning koʻpchiligida aniqlangan. Bunga anatomik xatolar (masalan, generatsiya qilingan tasvirlardagi ortiqcha qoʻllar) yoki audioyozuvlardagi gʻayritabiiy pauzalar va ritm kiradi. Ikkinchi eng muhim kategoriya «nomutanosibliklar» (incongruities) boʻlib, ular 63 ta holatda qayd etilgan. Bular tasdiqlangan haqiqatga zid keladigan elementlardir, masalan, tasvirdagi shaxsning kiyimi oʻsha davrdagi haqiqiy tasvirlarga mos kelmasligi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg5\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg5\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Sunʼiy intellekt yordamida oʻzgartirilgan kontent va dipfeyklarni fosh qilishda asosiy usul — ularning haqiqiy prototiplari bilan solishtirish orqali nomuvofiqliklarni aniqlashdir. 60 ta holatda «salbiy dalil» (negative evidence) usuli qoʻllanilgan, yaʼni tasdiqlovchi ishonchli maʼlumotlarning yoʻqligi. Masalan, Eron raketasi tomonidan urib tushirilgan sunʼiy yoʻldosh tasviri tekshirilganda, bunday hodisa haqida hech qanday xabar yoʻqligi va sunʼiy yoʻldoshning vayron boʻlishi kosmik chiqindilarni keltirib chiqarishi hamda ularni kuzatish tizimlari qayd etishi kerakligi taʼkidlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Salbiy dalil — bu hodisa sodir boʻlgan taqdirda mavjud boʻlishi kerak boʻlgan izlarning yoʻqligiga asoslangan tekshiruv usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;47 ta holatda oldingi dezinformatsiya kampaniyalari bilan oʻxshashliklar (vizual uslub, fon, ovoz berish) aniqlangan, bu esa umumiy yaratuvchi yoki platformadan foydalanilganini koʻrsatadi. Suv belgilari (watermarks) 36 ta holatda sunʼiy kelib chiqishning eng kuchli dalili boʻldi. Ulardan 18 tasi Google Gemini (13 tasi SynthID orqali, 5 tasi vizual), 4 tasi Grok, 3 tasi Sora, qolganlari Runway, InShot va Unrealʼga tegishli. 8 ta holatda aniq vosita koʻrsatilmagan, faqat foydalanuvchi nomi yoki rad etish yozuvi boʻlgan.&lt;/p&gt;\n&lt;p&gt;Subyektlarning guvohliklari 32 ta holatda, ayniqsa chakana savdo doʻkonlarini imitatsiya qiluvchi firibgarliklarda qoʻllangan. 19 ta holatda ekspertlar (masalan, professor Xani Farid va doktor Sivay Lyu) tahlili jalb etilgan. Akkauntlar tarixi va sunʼiy intellektdan foydalanilgani haqidagi iqrorlar mos ravishda 18 va 11 ta holatda dalil boʻlib xizmat qilgan.&lt;/p&gt;\n&lt;h4 id=\"harm-risk-assessment-model\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#harm-risk-assessment-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Harm risk assessment model&lt;/span&gt;&lt;/a&gt;Harm risk assessment model&lt;/h4&gt;\n&lt;p&gt;Zarar xavfini baholash modeli toʻrt yillik tadqiqot loyihasi doirasida ishlab chiqilgan (2025-yilda nashr etilgan). U dezinformatsiyaning shaxslar va jamiyatga zarar yetkazish salohiyatini ikki omil asosida tahlil qiladi: 250 ta dezinformatsiya namunasi va siyosat, biznes hamda sogʻliqni saqlash sohalaridagi yolgʻon maʼlumotlarning oqibatlari boʻyicha mavjud tadqiqotlar. Kontent zararli deb topilishi uchun u model mezonlariga javob berishi va oʻtmishda shunga oʻxshash holatlar zarar keltirgani tasdiqlangan boʻlishi kerak. Model 2024-yildan buyon Yevropa, Afrika va Yaqin Sharqda qoʻllanib kelinmoqda.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg6\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg6\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Full Fact tashkiloti «sezilarli oqibatlar» deganda shaxs, guruh yoki jamiyat manfaatlariga ob’ektiv tekshirilishi mumkin bo‘lgan zarar yetkazuvchi o‘zgarishlarni tushunadi; bu shunchaki o‘tkinchi his-tuyg‘ular yoki noto‘g‘ri tushunchalarni o‘z ichiga olmaydi. Xavfni baholash uchun model uchta asosiy savoldan foydalanadi (1-rasmga qarang): 1) da’vo faktlar haqida noto‘g‘ri tushuncha shakllantiradimi yoki faqat kichik noaniqlikni keltirib chiqaradimi; 2) da’voga yetarlicha odam ishonadimi va bu aniq salbiy oqibatlarga olib kelishi mumkinmi; 3) yolg‘onga ishongan odamlarda hozir yoki kelajakda, ayniqsa shunga o‘xshash da’volar takrorlanganda, ushbu noto‘g‘ri tushuncha asosida harakat qilish uchun imkoniyat va motivatsiya bormi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xavflarni baholash modeli — bu faktchekerlarga yolg‘on ma’lumotlarning nafaqat o‘zini, balki uning real zarar keltirish ehtimolini tizimli tahlil qilishga yordam beradigan algoritmdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu savollarga javoblar asosida model oqibatlarning potentsialini, ularning ko‘lami, og‘irligi va davomiyligini aniqlaydi. Faktchekerlar 14 ta parametrni tahlil qiladilar, jumladan: yolg‘on darajasi, auditoriya hajmi, ishonchlilik darajasi, fitna nazariyalari yoki takrorlanuvchi narrativlarning mavjudligi hamda auditoriyaning olingan ma’lumotlar asosida harakat qilish qobiliyati.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg7\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg7\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Agar dalillar da’vo noto‘g‘ri ekanligini, unga yetarlicha odam ishonganini va bu odamlar noto‘g‘ri tushuncha asosida harakat qilishga qodir ekanligini ko‘rsatsa, model yuzaga kelishi mumkin bo‘lgan oqibatlar turini belgilaydi. U zarardan kimlar jabr ko‘rishi mumkinligini aniqlashga yordam beradi: aniq bir shaxs, guruh yoki butun jamiyat. Shuningdek, ta’sir to‘g‘ridan-to‘g‘ri (tezkor harakatlar) yoki kumulyativ (uzoq muddatda auditoriya munosabatining o‘zgarishi) ekanligi baholanadi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg8\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;2025-yilda e’lon qilingan Viskonsin-Medison universitetining mustaqil tadqiqoti dezinformatsiya ta’sirini bashorat qilish murakkabligini va bu natijalarda nomuvofiqliklarga olib kelishi mumkinligini ta’kidladi. Natijalarning izchilligini ta’minlash uchun mualliflar «oltin standart» tekshiruvidan foydalanishdi: ekspertlar guruhi har bir qarorni model mezonlariga muvofiqligini tekshirib chiqdi. Ushbu jarayon tadqiqotdagi dezinformatsiyaning potentsial oqibatlarini aniqlashga imkon berdi.&lt;/p&gt;\n&lt;h4 id=\"4-topilmalar-malumotlar-toplami-sharhi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#4-topilmalar-malumotlar-toplami-sharhi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Topilmalar: Maʼlumotlar toʻplami sharhi&lt;/span&gt;&lt;/a&gt;4. Topilmalar: Maʼlumotlar toʻplami sharhi&lt;/h4&gt;\n&lt;p&gt;Maʼlumotlar toʻplami 2025-yil 1-yanvardan 2026-yil 31-martgacha internetda tarqalgan va oʻn millionlab marta koʻrilgan, sunʼiy intellekt (SI) yordamida yaratilgan yoki oʻzgartirilgan 112 ta kontentni oʻz ichiga oladi. Materiallar biznes, iqtisodiyot, sogʻliqni saqlash, siyosat va urush kabi 19 ta keng mavzuni qamrab oladi. Aksariyat namunalar bir vaqtning oʻzida 2–4 ta mavzuga daxldor.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maʼlumotlar toʻplami — tadqiqotchilar tomonidan belgilangan mezonlar asosida tahlil qilish uchun tanlab olingan tizimlashtirilgan axborotlar majmui.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Asosiy formatlar sifatida video, audio-video va tasvirlar qayd etilgan. SI chat-botlari tomonidan yaratilgan matnli kontent atigi ikkita holatda uchraydi. Tadqiqotchilar manipulyatsiyalarni ikki turga ajratishdi: «imposter content» (shaxs yoki guruh qiyofasiga kirib, ularning qarashlarini buzib koʻrsatish) va «fabricated content» (vaziyat yoki voqea haqida notoʻgʻri tushuncha hosil qiluvchi soxta tasvirlar).&lt;/p&gt;\n&lt;p&gt;Barcha 112 ta yozuv yolgʻon yoki chalgʻituvchi deb topildi. Baholash modeliga koʻra, 18 ta holat (16,1%) «tor doirada noaniq», 94 tasi (83,9%) esa «sezilarli darajada yolgʻon yoki chalgʻituvchi» deb tasniflandi. Eng koʻp uchraydigan mavzu siyosat boʻlib (71 ta holat, 63,4%), bunga yuqori lavozimli shaxslarning soxta video va audio yozuvlari kiradi. Shuningdek, xorijdagi voqealar, Yaqin Sharq va Ukrainadagi urushlar, iqtisodiyot, huquqni muhofaza qilish organlari faoliyati, diniy yoki etnik guruhlar, fitna nazariyalari va tibbiyotga oid mavzular keng tarqalgan.&lt;/p&gt;\n&lt;h4 id=\"tafsilotlar-si-malumotlar-toplamidagi-asosiy-mavzular-va-narrativlar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#tafsilotlar-si-malumotlar-toplamidagi-asosiy-mavzular-va-narrativlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tafsilotlar: SI maʼlumotlar toʻplamidagi asosiy mavzular va narrativlar&lt;/span&gt;&lt;/a&gt;Tafsilotlar: SI maʼlumotlar toʻplamidagi asosiy mavzular va narrativlar&lt;/h4&gt;\n&lt;p&gt;Mualliflar ushbu toʻplam internetdagi barcha SI kontentining tasodifiy tanlanmasi emasligini taʼkidlashadi. U Full Fact tashkiloti tomonidan belgilangan «tekshirilishga loyiqlik» (checkworthiness) mezonlari asosida shakllantirilgan. Tanlamaga firibgarlik yoki sogʻliqni saqlash sohasidagi dezinformatsiya kabi jamiyat uchun oqibatlarga olib kelishi mumkin boʻlgan materiallar kiritilgan. Barcha mavzular zarar xavfini baholash modelidagi 19 ta toifaga mos keladi (1-jadval).&lt;/p&gt;\n&lt;h4 id=\"faktlarni-tekshirishning-keng-mavzuviy-yonalishlari\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#faktlarni-tekshirishning-keng-mavzuviy-yonalishlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Faktlarni tekshirishning keng mavzuviy yoʻnalishlari&lt;/span&gt;&lt;/a&gt;Faktlarni tekshirishning keng mavzuviy yoʻnalishlari&lt;/h4&gt;\n&lt;p&gt;Tadqiqot 19 ta keng mavzuviy toifaga boʻlingan 112 ta kontent birligini qamrab oldi. Eng koʻp uchraydigan mavzu siyosat (71 ta holat, 63,4%) boʻlib, undan keyin xalqaro munosabatlar (43 ta, 38,4%), iqtisodiyot va biznes (28 ta, 25%) hamda jinoyatchilik va huquq-tartibot (27 ta, 24,1%) oʻrin olgan. Zoʻravonlik va mojarolar (20 ta, 17,9%), migratsiya (18 ta, 16%), mashhur shaxslar (17 ta, 15,2%), favqulodda vaziyatlar (15 ta, 13,4%), davlat boshqaruvi va fitna nazariyalari (14 ta, 12,5%) hamda sogʻliqni saqlash (10 ta, 8,9%) mavzulari kamroq uchradi. Media, ekologiya va sunʼiy intellekt kabi boshqa toifalar tanlanmaning kichik qismini tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavzuviy tasniflash — bu notoʻgʻri maʼlumotlarning tarqalishidagi qonuniyatlarni aniqlash uchun kontentni asosiy belgilari boʻyicha guruhlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tahlil davomida 88 ta mumkin boʻlgan kichik mavzulardan 48 tasi aniqlandi. Masalan, «siyosat» toifasi siyosatchilarning harakatlaridan tortib norozilik namoyishlarini tashkil etishgacha boʻlgan 10 ta kichik mavzuni, «sogʻliqni saqlash» esa xizmatlar sifati va davolash xavflarini oʻz ichiga olgan 5 ta kichik mavzuni qamrab oldi. Tahlil qilingan materiallarning aksariyati bir vaqtning oʻzida ikki-toʻrt xil mavzu yoki kichik mavzularni qamrab olgan. Mualliflarning taʼkidlashicha, mavzularning tanlanishi ham yangiliklar kun tartibini, ham trenddagi masalalarga eʼtibor qaratish orqali daromad olishga intilayotgan kontent yaratuvchilarning moliyaviy motivatsiyasini aks ettiradi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg9\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg9\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Siyosiy blok ichidagi eng keng tarqalgan kichik mavzu yuqori martabali shaxslarning harakatlari yoki fikrlarini buzib koʻrsatish (jami 112 ta yozuvdan 58 tasi, yaʼni 51,8%) boʻldi. Ushbu materiallarda koʻpincha sunʼiy intellekt yordamida yaratilgan videolar yoki audio-imitatsiyalar (dipfeyklar) orqali siyosatchilarning soxta bayonotlari yoki sodir boʻlmagan voqealar tasvirlangan. Boshqa kichik mavzular qatoriga siyosiy arboblarning sogʻligʻi yoki oilaviy ahvoli bilan bogʻliq kontent (4 ta holat) kiradi. Tadqiqot davomida ushbu tanlanmada uchramagan, ammo boshqa ishlarda qayd etilgan mavzular ham aniqlandi: ruhiy salomatlik, shaxsiy hayotga oid soxta jinsiy mazmundagi kontent va sport sohasidagi yolgʻon daʼvolar.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg10\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg10\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Siyosiy kontent tahlili doirasida tadqiqotchilar bir nechta asosiy mavzularni ajratib koʻrsatishdi. Eng koʻp uchraydigan mavzular: siyosiy noroziliklar (3 marta), jamoatchilik fikri va siyosatchilarni qoʻllab-quvvatlash (2 marta), siyosiy tayinlovlar yoki isteʼfolar (2 marta), siyosatchilarni hibsga olish yoki sud qilish (1 marta) va davlat xarajatlari (1 marta).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kontent-tahlil — matnlar yoki mediafayllarni maʼlum mavzular va narrativlar boʻyicha tasniflash orqali ularning tarqalish chastotasini aniqlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oʻrganilgan 112 ta kontent birligidan 20% dan ortigʻi (5 tadan 1 tasi) oʻsha paytdagi bosh vazir va hukmron Leyboristlar partiyasiga qarshi salbiy narrativlarni shakllantirish uchun soxta materiallardan foydalangan. 30 ta holatda ikkita asosiy mavzu ustunlik qilgan: yashash qiymati inqirozi fonida hayotiy muhim xizmatlar uchun jarimalar yoki toʻlovlar oshirilishi haqidagi yolgʻon hukumat eʼlonlari hamda shaxsiy erkinliklarni cheklash boʻyicha uydirma choralar. Bularga sunʼiy intellekt (SI) yordamida yaratilgan videolar kiradi, unda siyosatchilar goʻyoki maʼlum turdagi oziq-ovqatlarni isteʼmol qilganlik uchun jarimalar yoki yiliga amalga oshiriladigan aviaqatnovlar soniga cheklovlar joriy etilganini eʼlon qilishgan. Yana 11 ta holat hukumat va politsiyaning musulmonlar va muhojirlarga nisbatan siyosatiga oid boʻlgan. Jami 112 ta yozuvdan 23 tasi hukumat harakatlariga, 21 tasi ser Kir Starmerning harakatlari yoki qarashlariga, 5 tasi esa fuqarolik erkinliklariga davlat aralashuviga tegishli boʻlgan.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg11\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg11\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Chet el yangiliklari toifasida «xorijiy mamlakatlardagi voqealar» (23 marta), «xorijiy hukumatlarning harakatlari yoki qarashlari» (16 marta) va «oʻz hukumatining xorijiy davlat bilan munosabatlari» (4 marta) eng koʻp tilga olingan. Xavflarni baholash modeliga koʻra, agar fuqarolar oʻsha mamlakat bilan kuchli bogʻliqlikka ega boʻlmasa yoki yolgʻon maʼlumot milliy xavfsizlikka tahdid solmasa, xorijiy davlatlar haqidagi yolgʻon daʼvolar ichki taʼsirga ega boʻlishi cheklangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xavflarni baholash modeli — dezinformatsiyaning kontekst va auditoriyaning xabardorligiga qarab jamiyatga salbiy taʼsir koʻrsatish ehtimolini bashorat qiluvchi tahliliy yondashuv.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqotchilarning taʼkidlashicha, xorijiy voqealar haqidagi yolgʻon maʼlumotlar auditoriyaning chet eldagi vaziyat haqida bilimi kamligi sababli koʻproq haqiqat deb qabul qilinadi. Ichki siyosiy kun tartibida «shaxsiy iqtisodiyot» va «yashash qiymati» (18 marta) masalalari, jumladan, yangi yigʻimlar va soliqlar haqidagi SI tomonidan yaratilgan feyklar tez-tez uchragan. Shuningdek, SI kontenti maʼlum fitna nazariyalarini qoʻllab-quvvatlash uchun ishlatilgan 9 ta holat aniqlangan.&lt;/p&gt;\n&lt;h4 id=\"auditoriya-va-auditoriya-munosabati-dalillari\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#auditoriya-va-auditoriya-munosabati-dalillari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Auditoriya va auditoriya munosabati dalillari&lt;/span&gt;&lt;/a&gt;Auditoriya va auditoriya munosabati dalillari&lt;/h4&gt;\n&lt;p&gt;Dezinformatsiyaning zarar yetkazish salohiyatini baholash uchun nafaqat kontentning mohiyatini, balki auditoriyaning hajmi, tabiati va unga bo‘lgan munosabatini ham tahlil qilish zarur. Oqibatlar turlicha bo‘lishi mumkin: ba’zi hollarda sezilarli ta’sir ko‘rsatish uchun o‘n minglab odamlarning harakati talab etilsa, boshqa hollarda birgina shaxsning harakati yetarli bo‘ladi. Dezinformatsiya ta’siri jamoatchilikning noto‘g‘ri xatti-harakatlari yoki siyosatchilar va qaror qabul qiluvchi shaxslarning noto‘g‘ri qarorlari orqali namoyon bo‘lishi mumkin. Tadqiqotlar shuni ko‘rsatadiki, ilmiy jurnallar, ommaviy axborot vositalari va siyosiy doiralarda tarqatilgan yolg‘on ma’lumotlar davlat siyosatiga to‘g‘ridan-to‘g‘ri ta’sir o‘tkazish qudratiga ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Auditoriya qamrovi — bu kontentni ko‘rgan yoki u bilan o‘zaro aloqada bo‘lgan noyob foydalanuvchilar soni bo‘lib, u dezinformatsiyaning potensial ta’sirini baholashda asosiy ko‘rsatkich hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Garchi sun’iy intellekt (AI) yordamida yaratilgan ba’zi materiallar hatto yuqori lavozimli shaxslarni ham chalg‘itishi mumkin bo‘lsa-da, asosiy xavf kontentning internetda keng tarqalishi bilan bog‘liq. Tadqiqotchilarning aniq auditoriya ma’lumotlariga kirishi yirik platformalar siyosati va shifrlangan aloqa kanallarining yopiqligi tufayli cheklangan. Shu sababli, keltirilgan qamrov ko‘rsatkichlari to‘liq emas va katta ehtimol bilan haqiqiy raqamlardan pastroq baholangan.&lt;/p&gt;\n&lt;p&gt;Mavjud ma’lumotlarga ko‘ra, tadqiqot bazasiga kiritilgan 112 ta kontent birligi o‘n millionlab internet foydalanuvchilarini qamrab olgan. Tarqalish ko‘lami shuni tasdiqlaydiki, har bir nashr uchun aniq metrikalar mavjud bo‘lmasa-da, o‘rganilgan materiallarning umumiy qamrovi juda yuqori.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg12\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg12\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Tadqiqot 112 ta kontent birligini qamrab oldi, ular Buyuk Britaniya va butun dunyo boʻylab tarqaldi. Tomoshabinlar soni bir necha mingdan millionlargacha oʻzgardi. 22 ta holatda kontent 1 milliondan ortiq koʻrishlar soniga erishdi. Eng yuqori koʻrsatkich Turkiyadagi namoyishlarni koʻrsatuvchi sunʼiy intellekt (SI) yordamida yaratilgan tasvir uchun 11 milliondan ortiqni tashkil etdi, Jeffri Epshteynning Isroilda ekanligini koʻrsatuvchi soxta tasvir esa faqat X platformasining oʻzida 6 milliondan ortiq koʻrildi. Kontentning turli platformalar orqali tarqalishi keng tarqalgan holat edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Auditoriya hajmi har doim ham real oqibatlarga olib kelmaydi: milliondan ortiq koʻrilgan materiallarning yarmidan koʻpi jiddiy oqibatlarga ega emas edi, chunki maʼlumotlar unchalik ahamiyatli emasdi yoki auditoriyada harakat qilish uchun motivatsiya yoʻq edi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"si-tomonidan-yaratilgan-dezinformatsiya-formatlari\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#si-tomonidan-yaratilgan-dezinformatsiya-formatlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SI tomonidan yaratilgan dezinformatsiya formatlari&lt;/span&gt;&lt;/a&gt;SI tomonidan yaratilgan dezinformatsiya formatlari&lt;/h4&gt;\n&lt;p&gt;Tahlil qilingan 112 ta kontentdan 66 tasi video, 46 tasi esa tasvir edi. Videolar toifasida faktchekingning asosiy yoʻnalishi quyidagicha taqsimlandi: 26 ta holatda SI elementlari faqat vizual qismda, 21 ta holatda faqat audioda, 19 ta holatda esa ham video, ham audio qismida boʻlgan.&lt;/p&gt;\n&lt;h4 id=\"faqat-si-vizual-elementlariga-ega-videolar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#faqat-si-vizual-elementlariga-ega-videolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Faqat SI vizual elementlariga ega videolar&lt;/span&gt;&lt;/a&gt;Faqat SI vizual elementlariga ega videolar&lt;/h4&gt;\n&lt;p&gt;Ushbu toifa toʻliq sintetik videolarni oʻz ichiga oladi, ular yangiliklar voqealari, mojarolar yoki jamoat arboblarining soxta sahnalarini taqlid qiladi (masalan, Eronga zarbalar, Sudandagi dafn marosimi, Los-Anjelesdagi yongʻinlar). Faktchekingning asosiy vazifasi voqealarning haqiqiyligini tekshirish edi.&lt;/p&gt;\n&lt;h4 id=\"faqat-si-audiosiga-ega-videolar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#faqat-si-audiosiga-ega-videolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Faqat SI audiosiga ega videolar&lt;/span&gt;&lt;/a&gt;Faqat SI audiosiga ega videolar&lt;/h4&gt;\n&lt;p&gt;Koʻp hollarda video qator ikkinchi darajali (slaydlar yoki ovozsiz kadrlar) boʻlib, tekshiruvning asosiy eʼtibori SI yordamida sintezlangan ovozga qaratilgan. Koʻpincha Buyuk Britaniya Bosh vaziri Kir Starmerning ovozi va intonatsiyasiga taqlid qilingan. Muhim qismini fuqarolik erkinliklarini cheklash haqidagi soxta xabarlar tashkil etdi: bezaklar uchun soliqlar, aeroportdagi pullik hojatxonalar yoki 60 yoshdan oshganlar uchun NHS toʻlovlari.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Audio tahlilidagi asosiy qiyinchilik SI generatsiyasi va professional taqlidchilarni ajratish edi; SI belgisi sifatida koʻpincha vokal artefaktlar xizmat qildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"si-video-va-audio-elementlariga-ega-videolar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#si-video-va-audio-elementlariga-ega-videolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SI video va audio elementlariga ega videolar&lt;/span&gt;&lt;/a&gt;SI video va audio elementlariga ega videolar&lt;/h4&gt;\n&lt;p&gt;Ushbu toifa real kadrlarni manipulyatsiya uchun asos sifatida ishlatadigan kontentni oʻz ichiga oladi, koʻpincha «lipsink-dipfeyk» formatida, bunda notiqning lab harakati SI tomonidan yaratilgan audio bilan sinxronlashtiriladi.&lt;/p&gt;\n&lt;h4 id=\"suniy-intellekt-yordamida-yaratilgan-tasvirlar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#suniy-intellekt-yordamida-yaratilgan-tasvirlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sunʼiy intellekt yordamida yaratilgan tasvirlar&lt;/span&gt;&lt;/a&gt;Sunʼiy intellekt yordamida yaratilgan tasvirlar&lt;/h4&gt;\n&lt;p&gt;Tadqiqot haqiqiy fotosuratlarga oʻxshatib ishlangan, sunʼiy intellekt (SI) tomonidan yaratilgan statik tasvirlarni oʻrganadi. Bunday materiallarning asosiy maqsadi siyosiy arboblar oʻrtasidagi soxta uchrashuvlarni (masalan, Faraj/Epshteyn, Tramp/Epshteyn) modellashtirish yoki siyosatchilarni obroʻsizlantiruvchi yoxud hissiy taʼsir oʻtkazuvchi vaziyatlarga joylashtirish orqali jamoatchilik fikrini manipulyatsiya qilishdir.&lt;/p&gt;\n&lt;h4 id=\"si-dezinformatsiyasini-tarqatuvchi-platformalar-va-aktyorlar-turlari\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#si-dezinformatsiyasini-tarqatuvchi-platformalar-va-aktyorlar-turlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SI-dezinformatsiyasini tarqatuvchi platformalar va aktyorlar turlari&lt;/span&gt;&lt;/a&gt;SI-dezinformatsiyasini tarqatuvchi platformalar va aktyorlar turlari&lt;/h4&gt;\n&lt;p&gt;Tahlil shuni koʻrsatdiki, SI tomonidan yaratilgan dezinformatsiya Facebook, Instagram, Threads, TikTok va X (Twitter) kabi barcha yirik platformalarda tarqaladi. Koʻplab materiallar bir nechta platformada takrorlangan, bu esa muvofiqlashtirilgan yoki taqlidiy tarqatish usulidan dalolat beradi. Tanlanma hajmi cheklanganligi sababli, platformalardagi xatti-harakatlar farqi boʻyicha xulosalar dastlabki xarakterga ega. Kuzatuvlar shuni koʻrsatdiki, Facebookʼda kontent hajmi kattaroq, X (Twitter) tarmogʻida esa yuqoriroq virallik kuzatilgan. Facebook koʻproq Buyuk Britaniyaga yoʻnaltirilgan axborot va sogʻliqni saqlash sohasidagi firibgarliklar uchun ishlatilgan. TikTokʼda kontent yosh auditoriyaga, jumladan, sogʻliqni saqlash bilan bogʻliq firibgarlik sxemalariga qaratilgan. Faktchekerlarning tanlov metodologiyasi (Meta platformalariga moyillik) tufayli, mualliflar turli platformalardagi tarqalish darajasini aniq baholash imkonsizligini taʼkidlashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Virallik — bu kontentning foydalanuvchilar tomonidan ulashish va oʻzaro munosabatlar orqali tez tarqalish qobiliyati.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dezinformatsiya yaratuvchilarning aksariyati ochiq ishlaydi: anʼanaviy OAV, ommaviy profillar yoki satira/parodiya deb belgilangan akkauntlar orqali. Tanlanmada siyosiy qoʻllab-quvvatlash guruhlari (masalan, Reform UK partiyasi tarafdorlari), taniqli shaxslar va tashkilotlar, shuningdek, moliyaviy piramidalar va shubhali tibbiy xizmatlarni targʻib qiluvchi akkauntlar aniqlangan. Taniqli shaxslar, jumladan, X egasi Ilon Mask va AQShning yuqori martabali isteʼfodagi harbiylari tomonidan SI-kontentini tarqatish holatlari qayd etilgan. Minneapolisdagi otishma (2026-yil yanvar) tasvirlangan soxta suratli postlardan biri 9 milliondan ortiq koʻrilgan. Mualliflar oʻz shaxsini yashirganda, ularni aniqlash hatto platformalar uchun ham qiyin. Siyosiy tusdagi kontentning bir qismi moliyaviy manfaatlar uchun professional guruhlar tomonidan yaratilishi ehtimoli yuqori.&lt;/p&gt;\n&lt;h4 id=\"zararni-tahlil-qilish-sharhi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zararni-tahlil-qilish-sharhi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zararni tahlil qilish sharhi&lt;/span&gt;&lt;/a&gt;Zararni tahlil qilish sharhi&lt;/h4&gt;\n&lt;p&gt;Oʻtkazilgan tahlil 112 ta yozuvdan 94 tasi (83,9%) auditoriyada sezilarli darajada yolgʻon yoki chalgʻituvchi tasavvur uygʻotganini koʻrsatdi. Ushbu materiallar jamoatchilik uchun muhim boʻlgan axborotga ishonchni susaytirib, dezinformatsiyaning umumiy taʼsirini kuchaytiradi. Tadqiqotlar shuni koʻrsatadiki, bu taʼsir sogʻliqni saqlash va demokratik institutlar barqarorligi uchun jiddiy oqibatlarga olib kelishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"zarar-yetkazish-salohiyatini-tahlil-qilish\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zarar-yetkazish-salohiyatini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zarar yetkazish salohiyatini tahlil qilish&lt;/span&gt;&lt;/a&gt;Zarar yetkazish salohiyatini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;Tadqiqot davomida mualliflar dezinformatsiyaning 112 ta namunasini alohida shaxslar yoki jamiyatga sezilarli zarar yetkazish qobiliyati nuqtai nazaridan baholadilar. Tahlil qilingan jami holatlardan 46 tasi (41,1%) model mezonlariga mos keldi, bu ularning salbiy oqibatlarga olib kelishi yoki ularga hissa qo'shishi mumkinligini ko'rsatadi. Qolgan 66 ta namuna (58,9%) bunday salohiyatni ko'rsatmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zararni baholash modeli — bu axborot xabarlarini jamoat institutlariga bo'lgan ishonchni susaytirish yoki real ijtimoiy oqibatlarni keltirib chiqarish qobiliyatiga ko'ra tasniflovchi tahliliy vositadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar ta'kidlashicha, ayrim yolg'on da'volar siyosiy kontekstda turlicha ahamiyatga ega bo'lsa-da, taklif etilgan model har qanday sezilarli darajada yolg'on yoki chalg'ituvchi ma'lumotni jamoat maydonidagi axborotga bo'lgan umumiy ishonchni pasaytiruvchi omil sifatida tasniflaydi. Tadqiqot dezinformatsiyaning keng tarqalganligi haqidagi tasavvur demokratik jarayonlardan qoniqish darajasini pasaytirishi va fuqarolarning sog'liqni saqlash sohasidagi tavsiyalarga amal qilish istagini kamaytirishi haqidagi ma'lumotlarga tayanadi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg13\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg13\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Full Fact tashkiloti (xayriya fondi № 1158683, notijorat kompaniyasi № 6975984) sunʼiy intellekt (SI) yordamida yaratilgan kontent va dezinformatsiyaning jamoat xavfsizligi hamda sogʻliqqa taʼsirini oʻrganadi. Mualliflar bunday materiallar keltirib chiqaradigan zararni besh yoʻnalishga ajratadilar: ijtimoiy tartibsizliklarni qoʻzgʻatish, ruhiy va jismoniy bosim, moliyaviy firibgarlik, samarasiz tibbiy vositalarni targʻib qilish va jamoatchilik kayfiyatini uzoq muddatli oʻzgartirish.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deepfake (dipfeyk) — bu real shaxslarning qiyofasi yoki ovozini taqlid qilish uchun SI algoritmlari yordamida yaratilgan yoki oʻzgartirilgan media kontentdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2025-yil dekabr oyida sogʻliqni saqlash eksperti qiyofasidagi dipfeykdan menopauza davri uchun shubhali qoʻshimchalarni reklama qilishda foydalanilgani qayd etildi. Tadqiqotlar shuni koʻrsatadiki, taniqli shaxslarning obroʻsidan foydalanib, tekshirilmagan va xavfli davolash usullarini targʻib qilish holatlari koʻpaymoqda. Tahlillar shuni koʻrsatadiki, «moʻjizaviy» vositalar haqida yolgʻon maʼlumot olgan auditoriyaning bir qismi dalillarga asoslangan tibbiyotdan voz kechib, samarasiz muqobillarni tanlashga moyil boʻladi.&lt;/p&gt;\n&lt;p&gt;Boshqa bir misol — moliyaviy ekspert Martin Lyuis nomidan Swiftgate Montark platformasiga sarmoya kiritishga chaqiruvchi soxta xabarlarni yaratish uchun SI dan foydalanilgani. Foydalanuvchilarning munosabati bunday maslahatlarga ergashishga tayyorligini koʻrsatdi, bu esa shaxsiy maʼlumotlar oʻgʻirlanishi va moliyaviy yoʻqotishlar xavfini tugʻdiradi. Shunga oʻxshash tahdidlar zoʻravonlik qurbonlarini obroʻsizlantiruvchi soxta tasvirlar tarqalganda ham yuzaga keladi, bu esa jabrlanuvchilarga nisbatan tazyiq va tahdidlarni keltirib chiqaradi. 2025-yil fevral oyida Birmingem kasalxonasida «bolta koʻtargan muhojirlar» tasvirlangan SI tomonidan yaratilgan surat ijtimoiy tarmoqlarda (1,7 milliondan ortiq koʻrish) tarqalib, real voqea boʻlmaganiga qaramay, ijtimoiy keskinlikni qanday kuchaytirishi mumkinligini koʻrsatdi.&lt;/p&gt;\n&lt;p&gt;Ilmiy maʼlumotlar shuni tasdiqlaydiki, yolgʻon daʼvolarning takrorlanishi ularning haqiqat deb qabul qilinishini oshiradi, «trigger axborot» (masalan, tashqi tahdid obrazi) esa zoʻravonlik yuzaga kelishiga hissa qoʻshishi mumkin. Idrok va kommunikatsiya psixologiyasi sohasidagi tadqiqotlar dezinformatsiyaning tizimli tarqalishi jamiyatdagi tajovuzkorlikning oʻsishi bilan bevosita bogʻliqligini koʻrsatadi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg14\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg14\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Dezinformatsiyadan kelib chiqadigan zarar xavfini baholash modeli yolgʻon maʼlumotlarning jamiyatga taʼsirining sakkizta asosiy yoʻnalishini ajratib koʻrsatadi. Bular qatoriga huquqni muhofaza qilish organlariga boʻlgan ishonchning pasayishi, iqlim masalalari boʻyicha jamoatchilik fikrining oʻzgarishi, fitna nazariyalariga moyillikning ortishi va siyosiy qarashlarning uzoq muddatli transformatsiyasi kiradi. Mualliflar ushbu xulosalar salbiy oqibatlarning muqarrarligini anglatmasligini, balki xavfni baholash modeliga koʻra ularning yuzaga kelishi uchun shart-sharoitlar mavjudligini koʻrsatishini taʼkidlaydilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zarar xavfini baholash modeli — bu uchta shartning mavjudligini tekshiradigan tahliliy vosita: notoʻgʻri tushunchaning shakllanishi, auditoriyaning yetarli darajada qamrovi hamda yolgʻon maʼlumotga ishongan shaxslarda ushbu dezinformatsiyaga muvofiq harakat qilish uchun motivatsiya va imkoniyatning mavjudligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dezinformatsiya aniq oqibatlarga olib kelganini tasdiqlash uchun qoʻshimcha uzunlamasiga (longitudinal) tadqiqotlar talab etiladi. Tahlillar shuni koʻrsatadiki, yolgʻon xabarlarning takrorlanishi vaqt oʻtishi bilan ularning auditoriya idrokiga taʼsirini kuchaytiradi. Mualliflar bunga misol tariqasida sunʼiy intellekt yordamida yaratilgan immigratsiyaga qarshi videolarning tarqalishini, 2025-yil sentyabrida hukumatning aviaqatnovlarga cheklovlar qoʻyishi haqidagi soxta daʼvolarni yoki 2025-yil iyunida politsiya ishtirokidagi manipulyativ tasvirlarni (X tarmogʻida 160 000 ta koʻrish) keltiradilar.&lt;/p&gt;\n&lt;p&gt;Keyingi tahlilda mualliflar quyidagi jihatlarni koʻrib chiqadilar: daʼvolarni potentsial zarar darajasiga koʻra tasniflash, kontentning viralligi va uning real taʼsiri oʻrtasidagi korrelyatsiya, shuningdek, munosabat va xulq-atvorga taʼsir qiluvchi axborot effektlari oʻrtasidagi farq. Dezinformatsiya taʼsirining kümülativ xususiyati hamda bunday effektlarning koʻlami va davomiyligini baholashdagi cheklovlarga alohida eʼtibor qaratiladi.&lt;/p&gt;\n&lt;h4 id=\"zarar-yetkazish-salohiyati-yoq-yoki-cheklangan-davolar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zarar-yetkazish-salohiyati-yoq-yoki-cheklangan-davolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zarar yetkazish salohiyati yoʻq yoki cheklangan daʼvolar&lt;/span&gt;&lt;/a&gt;Zarar yetkazish salohiyati yoʻq yoki cheklangan daʼvolar&lt;/h4&gt;\n&lt;p&gt;Zararlar va xatarlarni baholash modeli yordamida oʻtkazilgan tahlil shuni koʻrsatdiki, maʼlumotlar bazasidagi 112 ta yozuvdan 66 tasi (58,9%) ishonchlilikka taʼsir qilishdan tashqari, aniq va jiddiy oqibatlarga olib kelish salohiyatiga ega emas. Potensial oqibatlarni aniqlash uchun model toʻrtta ketma-ket savoldan foydalanadi: (i) kontent mohiyatan yolgʻonmi yoki faqat qisman noaniqmi; (ii) ushbu kontent asosida yuzaga kelgan xatti-harakatlar real dunyoda salbiy oqibatlarga olib keladimi; (iii) daʼvoga ishongan odamlar soni oqibatlarni keltirib chiqarish uchun yetarlimi; (iv) bu odamlarda oqibatlarni yuzaga keltirish uchun motivatsiya va imkoniyat bormi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zararlarni baholash modeli — bu dezinformatsiyani shunchaki yolgʻonligi boʻyicha emas, balki real dunyoda xavfli harakatlarni keltirib chiqarish ehtimoli boʻyicha tasniflovchi algoritmli yondashuv.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baholash-natijalari\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#baholash-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash natijalari&lt;/span&gt;&lt;/a&gt;Baholash natijalari&lt;/h4&gt;\n&lt;p&gt;● 17 ta daʼvo faqat «tor doiradagi noaniqlik» deb topildi. Bu shuni anglatadiki, noaniq element vaziyatni tushunish uchun ahamiyatsiz yoki voqea mohiyatini oʻzgartirmaydi. Masalan, 2026-yil yanvarida Nikolas Maduro hibsga olingani aks etgan sunʼiy intellekt (SI) tasviri soxta boʻlsa-da, voqeaning mohiyatini toʻgʻri yetkazgan. Xuddi shunday, 2025-yil noyabrida Angliyadagi poyezdda sodi
