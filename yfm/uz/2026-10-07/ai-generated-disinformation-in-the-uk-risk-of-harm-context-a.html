r boʻlgan hujum tasvirlari sunʼiy yaratilgan boʻlsa-da, hujumning real holatini aks ettirgan. Bunday hollarda, odamlarning harakatlari haqiqiy fotosuratlar asosida qilingan harakatlardan farq qilmaydi.&lt;/p&gt;\n&lt;p&gt;● 19 ta daʼvo jiddiy oqibatlarga olib kelish salohiyatiga ega emas, chunki ularga asoslangan harakatlar sezilarli zarar keltirmaydi. Hatto daʼvo yolgʻon boʻlsa ham, u real xatarlarga taʼsir qilmasligi mumkin. Masalan, 2025-yil yanvarida Los-Anjelesdagi yongʻinlar ichida omon qolgan «superkar» haqidagi SI tasviri: daʼvo yolgʻon boʻlsa-da, u modelda koʻrsatilgan salbiy oqibatlarga olib keladigan harakatlarga undamaydi. Yana bir misol — Rishi Sunakning kasalxonadagi soxta tasviri (2026-yil): siyosatchilarning sogʻligʻi haqidagi maʼlumotlar saylovchilarga taʼsir qilishi mumkin boʻlsa-da, bu holatda tasvirning zarari cheklangan deb baholandi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg15\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg15\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Tadqiqotda qoʻllanilgan zarar baholash modeli yolgʻon maʼlumotning oʻzi zararli emas degan farazga asoslanadi. Zarar faqat dezinformatsiya real oqibatlarga olib kelishi mumkin boʻlgan muayyan harakatlar yoki xulq-atvor oʻzgarishlarini keltirib chiqarganda yuzaga keladi. Buning uchun auditoriya nafaqat yolgʻon daʼvoga ishonishi, balki unga asoslanib harakat qilish uchun yetarli motivatsiya va imkoniyatga ega boʻlishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zarar baholash modeli — bu muayyan yolgʻon daʼvo auditoriyaning ishonchi va harakat qilish qobiliyatiga asoslanib, real dunyoda oʻlchanadigan oqibatlarga olib kelishi mumkinligini tekshiradigan tahliliy vositadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tahlil davomida tadqiqotchilar yolgʻon daʼvolar zarar yetkazish salohiyatiga ega boʻlmagan bir qator holatlarni aniqladilar. Masalan, sunʼiy intellekt (SI) yordamida yaratilgan va kruiz kemasi dengizga chiqindi tashlayotgani tasvirlangan video 1,8 milliondan ortiq marta koʻrilgan. Qamrovga qaramay, tomoshabinlarning aksariyati buni soxta deb tan oldi va yuk tashish kompaniyalariga nisbatan xulq-atvor yoki munosabat oʻzgarganiga oid hech qanday dalil topilmadi. Boshqa hollarda, masalan, siyosatchilar haqidagi yolgʻon xabarlarda, saylovlarning yoʻqligi yoki real taʼsir vositalarining boʻlmasligi dezinformatsiya oqibatlarini ahamiyatsiz qildi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg16\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg16\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Auditoriya yolgʻonga ishongan taqdirda ham, u zararli harakatni amalga oshirish uchun jismoniy imkoniyatga ega boʻlishi kerak. Tadqiqotchilar 2025-yilda Yamaykada sodir boʻlgan «Melissa» toʻfoni haqidagi SI videosini misol qilib keltiradilar: koʻpchilik kadrlarning haqiqiyligiga ishongan boʻlsa-da, tomoshabinlarning aksariyati toʻfon hududidan tashqarida edi. Xuddi shunday, Dubaydagi Burj Xalifa osmonoʻpar binosiga hujum qilingani haqidagi yolgʻon xabarlar ham oqibatlarga olib kelmadi, chunki BAA aholisi buni feyk ekanligini tushundi, mamlakat tashqarisidagi odamlar esa real oqibatlarga olib keladigan harakatlarni amalga oshirish imkoniyatiga ega emas edi.&lt;/p&gt;\n&lt;h4 id=\"potensial-oqibatlarning-sakkiz-sohasi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#potensial-oqibatlarning-sakkiz-sohasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Potensial oqibatlarning sakkiz sohasi&lt;/span&gt;&lt;/a&gt;Potensial oqibatlarning sakkiz sohasi&lt;/h4&gt;\n&lt;p&gt;Tahlil qilingan 112 ta namunadan 46 tasi (41,1%) xavf modelining barcha mezonlariga javob berdi va 78 ta aniq oqibatni keltirib chiqarish salohiyatiga ega boʻldi. Ushbu oqibatlar sakkizta toifaga boʻlingan, jumladan, ijtimoiy tartibsizliklar, oʻzboshimchalik bilan zoʻravonlik, firibgarlikdan koʻrilgan moliyaviy zarar va aholi salomatligiga tahdidlar.&lt;/p&gt;\n&lt;h4 id=\"1-ijtimoiy-tartibsizliklar-va-zoravonlikni-keltirib-chiqarish-salohiyati\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#1-ijtimoiy-tartibsizliklar-va-zoravonlikni-keltirib-chiqarish-salohiyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Ijtimoiy tartibsizliklar va zoʻravonlikni keltirib chiqarish salohiyati&lt;/span&gt;&lt;/a&gt;1. Ijtimoiy tartibsizliklar va zoʻravonlikni keltirib chiqarish salohiyati&lt;/h4&gt;\n&lt;p&gt;Tahlil muayyan guruhlarga nisbatan yolgʻon ayblovlarni oʻz ichiga olgan sakkizta SI kontentini aniqladi, bu nazariy jihatdan tajovuzni keltirib chiqarishi mumkin edi. Biroq, mualliflar taʼkidlashicha, salohiyatning mavjudligi har doim ham amalga oshishni anglatmaydi: masalan, 2026-yilda Gonkongda pasterizatsiya qilinmagan sutning foydasi haqidagi yolgʻon daʼvolar keng tarqaldi, ammo zarar yetkazmadi, chunki bu mahsulot shaharda sotuvda mavjud emas edi.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg17\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg17\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Mualliflarning tadqiqot modeli kontentning musulmonlar va muhojirlarga nisbatan salbiy jamoatchilik fikrini shakllantirish salohiyatini baholaydi. Tahlil jarayonida model ijtimoiy tartibsizliklar va zoʻravonlik harakatlarini keltirib chiqarishi yoki oqlashi mumkin boʻlgan sunʼiy intellekt (SI) yordamida yaratilgan dezinformatsiyaning ikkita namunasini aniqladi. Bularga Birmingemdagi shifoxonaga hujum qilingani haqidagi soxta xabar va muhojirlar qayiqlariga hujum aks etgan sunʼiy tasvir kiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zarar xavfini baholash modeli — bu kontentni ijtimoiy keskinlikni kuchaytirish qobiliyatiga koʻra tasniflovchi va ommaviy axborot vositalarining tahdidlarni idrok etishga taʼsiri boʻyicha tarixiy maʼlumotlarga tayanadigan tahliliy vositadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar ijtimoiy tartibsizliklar va zoʻravonlik uzoq muddatli ijtimoiy-iqtisodiy omillar hamda qisqa muddatli tetiklantiruvchi hodisalarning murakkab oʻzaro taʼsiri natijasi ekanligini taʼkidlaydilar. OAV koʻpincha muayyan hodisani yagona sabab sifatida koʻrsatsa-da, u jarayonning faqat bir qismi hisoblanadi. Tadqiqotlar shuni koʻrsatadiki, axborotning tizimli taʼsiri auditoriya qarashlarida uzoq muddatli oʻzgarishlarga olib kelishi mumkin. Ijtimoiy keskinlik kritik darajaga yetganda, «tashqi tahdid» yoki muayyan guruhlar tomonidan sodir etilgani daʼvo qilingan qonunbuzarliklar haqidagi xabarlar tajovuzkor harakatlar uchun katalizator yoki oqlash vositasi boʻlishi mumkin, bu ayniqsa 2024-yilda Buyuk Britaniyadagi tartibsizliklar davrida kuzatilgan.&lt;/p&gt;\n&lt;h4 id=\"uzoq-muddatli-salomatlik-va-yashash-sharoitlariga-tasir-qiluvchi-zoravonlikni-oqlash-yoki-qozgatish-salohiyati\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#uzoq-muddatli-salomatlik-va-yashash-sharoitlariga-tasir-qiluvchi-zoravonlikni-oqlash-yoki-qozgatish-salohiyati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Uzoq muddatli salomatlik va yashash sharoitlariga taʼsir qiluvchi zoʻravonlikni oqlash yoki qoʻzgʻatish salohiyati&lt;/span&gt;&lt;/a&gt;Uzoq muddatli salomatlik va yashash sharoitlariga taʼsir qiluvchi zoʻravonlikni oqlash yoki qoʻzgʻatish salohiyati&lt;/h4&gt;\n&lt;p&gt;Dezinformatsiya tarixan muayyan shaxslar yoki guruhlarga nisbatan ogʻzaki yoki jismoniy tajovuzni ragʻbatlantirish uchun ishlatilgan. AI (sunʼiy intellekt)ning shaxslar qiyofasini taqlid qilish qobiliyati bunday tahdidlarni kuchaytirish uchun yangi vosita yaratadi. Ushbu tadqiqotdagi zarar xavfi modeli onlayn taʼqiblar muntazam haqorat va tahdidlarga aylanib, jabrlanuvchining ruhiy yoki jismoniy sogʻligʻiga uzoq muddatli zarar yetkazishi, uni yashash joyini oʻzgartirishga yoki himoya izlashga majbur qilishi mumkin boʻlgan holatlarni oʻrganadi. Xavf jabrlanuvchining oʻtmishdagi travmalari boʻlganida hamda kontent yuqori darajada real va takrorlanuvchi boʻlganida ortadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zarar xavfi modeli — onlayn kontentning jismoniy zoʻravonlik yoki uzoq muddatli psixologik travmalar kabi real oqibatlarga olib kelish ehtimolini baholovchi tahliliy yondashuv.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot maʼlumotlar toʻplamida zoʻravonlikka olib kelishi mumkin boʻlgan qarashlarni shakllantirish salohiyatiga ega sakkizta AI kontenti aniqlandi. Xususan, 2025-yil dekabr oyida Bondi-Bichdagi otishmada jabrlangan Arsen Ostrovskiyga oʻxshash shaxs tasvirlangan AI tasviri tahlil qilindi. Mualliflar ushbu kontentni shaxsning oʻrta yoki uzoq muddatli sogʻligʻiga taʼsir koʻrsatishi mumkin boʻlgan tizimli taʼqibni qoʻzgʻatish salohiyatiga ega deb baholadilar, garchi bu holatda bunday taʼsirning bevosita dalillari qayd etilmagan boʻlsa ham.&lt;/p&gt;\n&lt;h4 id=\"onlayn-firibgarlik-orqali-shaxslarga-togridan-togri-moliyaviy-zarar-yetkazish\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#onlayn-firibgarlik-orqali-shaxslarga-togridan-togri-moliyaviy-zarar-yetkazish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Onlayn firibgarlik orqali shaxslarga toʻgʻridan-toʻgʻri moliyaviy zarar yetkazish&lt;/span&gt;&lt;/a&gt;Onlayn firibgarlik orqali shaxslarga toʻgʻridan-toʻgʻri moliyaviy zarar yetkazish&lt;/h4&gt;\n&lt;p&gt;Buyuk Britaniya iqtisodiyotiga kiberfiribgarlikdan yetkazilgan yillik zarar taxminan 14,7 milliard funt sterlingni tashkil etadi, shundan 1,3 milliard funti jismoniy shaxslarning toʻgʻridan-toʻgʻri yoʻqotishlariga toʻgʻri keladi. AI firibgarlarga yangi imkoniyatlar yaratadi: taniqli ekspertlarning mahsulotlarni soxta tavsiya etishidan tortib, yaqin kishilarni goʻyoki qiyin ahvolda qolgan va pulga muhtoj qilib koʻrsatishgacha.&lt;/p&gt;\n&lt;p&gt;Tadqiqot tanlamasida moliya eksperti Martin Lyuis Swiftgate Montark kriptovalyuta platformasini targʻib qilgani uchun hibsga olingani haqidagi AI tomonidan yaratilgan kontent aniqlandi. Bunday materiallar ekspert fikriga ishonadigan shaxslarni aldashga qaratilgan. Mualliflar AI yordamida jamoat arboblarining soxta tavsiyalarini yaratish keng tarqalgan va oʻsib borayotgan tahdid ekanligini taʼkidlaydilar.&lt;/p&gt;\n&lt;h4 id=\"individuallarning-va-jamoat-salomatligiga-bevosita-zarar-yetkazish\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#individuallarning-va-jamoat-salomatligiga-bevosita-zarar-yetkazish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Individuallarning va jamoat salomatligiga bevosita zarar yetkazish&lt;/span&gt;&lt;/a&gt;Individuallarning va jamoat salomatligiga bevosita zarar yetkazish&lt;/h4&gt;\n&lt;p&gt;Tadqiqotlar shuni koʻrsatadiki, notoʻgʻri maʼlumotlar sakkizta asosiy yoʻnalishda sogʻliqqa zarar yetkazishi mumkin: (i) ruhiy salomatlik, jumladan, aholi guruhlarining moyilligi haqidagi notoʻgʻri maʼlumotlar; (ii) oʻz joniga qasd qilish va oʻziga zarar yetkazish; (iii) tibbiy xizmatlarning sifati va ulardan foydalanish imkoniyati; (iv) davolash usullarining samaradorligi va xavflari (xavfli muqobillarni targʻib qilish); (v) kasalliklarning sabablari, belgilari va yuqish yoʻllari; (vi) parhez va turmush tarzining organizmga taʼsiri; (vii) tibbiyot xodimlari va farmatsevtika kompaniyalarining harakatlari; (viii) aholining sanitariya-gigiyena qoidalariga rioya qilishi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sogʻliqni saqlash sohasidagi dezinformatsiya — bu dalillarga asoslangan tibbiyotdan voz kechishga yoki sogʻliq uchun zararli qarorlar qabul qilishga olib kelishi mumkin boʻlgan yolgʻon yoki chalgʻituvchi maʼlumotlarning tarqalishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Maʼlumotlar toʻplamini tahlil qilish jarayonida mualliflar sunʼiy intellekt (SI) yordamida yaratilgan videoni aniqladilar. Unda sogʻliqni saqlash boʻyicha mutaxassis goʻyoki menopauza davridagi ayollar uchun samarasiz va potensial xavfli «biologik faol qoʻshimchalar»ni targʻib qiladi. Mavjud ilmiy maʼlumotlarga koʻra, agar jamoatchilik ishonchli koʻrinadigan dezinformatsiyaga duch kelsa, samarali davolash usullaridan voz kechib, tekshirilmagan muolajalarga oʻtish ehtimoli yuqori. Tadqiqotda qoʻllanilgan xavflarni baholash modeli ushbu kontentni tomoshabinlar salomatligiga jiddiy zarar yetkazish potensialiga ega deb baholadi. Bu misol nufuzli shaxslar ishtirokida dipfeyklar yaratish uchun SIdan foydalanish tendensiyasining bir qismi boʻlib, jamoat salomatligi uchun tizimli xavflarni keltirib chiqaradi.&lt;/p&gt;\n&lt;h4 id=\"politsiya-va-sud-tizimiga-bolgan-ishonchning-pasayishi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#politsiya-va-sud-tizimiga-bolgan-ishonchning-pasayishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Politsiya va sud tizimiga boʻlgan ishonchning pasayishi&lt;/span&gt;&lt;/a&gt;Politsiya va sud tizimiga boʻlgan ishonchning pasayishi&lt;/h4&gt;\n&lt;p&gt;Tadqiqotlar shuni koʻrsatadiki, dezinformatsiya jamoatchilikning huquqni muhofaza qilish va sud organlariga boʻlgan ishonchini susaytirishi, ularning faoliyatini idrok etishga va fuqarolarning ular bilan hamkorlik qilishga boʻlgan tayyorligiga taʼsir qilishi mumkin. Ushbu tadqiqot doirasida tahlil qilingan maʼlumotlar bazasida jamoatchilik ishonchini kamaytirish salohiyatiga ega boʻlgan uchta kontent namunasi aniqlandi. Bularga sunʼiy intellekt (SI) yordamida yaratilgan ikkita virusli tasvir (politsiyachilar musulmonlar guruhi oldida tizz choʻkkanligi aks etgan) va SI tomonidan yaratilgan video (askarning politsiyachini «bosqinchilar» jinoyatlariga qarshi kurashmaganlikda ayblashi) kiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SI-generatsiyalangan kontent (AI-generated content) — bu mashinali oʻqitish algoritmlari yordamida yaratilgan, auditoriyani chalgʻitish uchun ishlatilishi mumkin boʻlgan realistik, ammo soxta tasvirlar yoki videolardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"iqlim-siyosatiga-oid-jamoatchilik-fikrining-ozgarishi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#iqlim-siyosatiga-oid-jamoatchilik-fikrining-ozgarishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Iqlim siyosatiga oid jamoatchilik fikrining oʻzgarishi&lt;/span&gt;&lt;/a&gt;Iqlim siyosatiga oid jamoatchilik fikrining oʻzgarishi&lt;/h4&gt;\n&lt;p&gt;Koʻp yillik ilmiy maʼlumotlar shuni tasdiqlaydiki, iqlim oʻzgarishining sabablari va unga qarshi kurashish choralari haqidagi notoʻgʻri narrativlar jamoatchilik fikrini oʻzgartirishi va bu oʻz navbatida davlat siyosatiga taʼsir qilishi mumkin. Soʻnggi yillarda iqlim oʻzgarishi haqidagi dalillar koʻpayishi bilan dezinformatsiya iqlim choralarining kundalik hayotga salbiy taʼsirini boʻrttirib koʻrsatishga oʻtdi. Tahlil qilingan maʼlumotlar toʻplamida Buyuk Britaniya hukumati goʻyoki har bir kishi uchun yiliga ikkitadan ortiq aviaparvozni taqiqlamoqchi ekanligi haqidagi soxta daʼvoni tarqatish uchun SI-kontentidan foydalanilgani aniqlandi. Mavjud tadqiqotlarga koʻra, bunday dezinformatsiyaning takroriy taʼsiri jamoatchilikning ekologik tashabbuslarga boʻlgan munosabatini oʻzgartirishi va siyosiy qarorlarga taʼsir koʻrsatishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"7-zarar-yetkazish-salohiyatiga-ega-fitna-nazariyalariga-moyillikning-ortishi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#7-zarar-yetkazish-salohiyatiga-ega-fitna-nazariyalariga-moyillikning-ortishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Zarar yetkazish salohiyatiga ega fitna nazariyalariga moyillikning ortishi&lt;/span&gt;&lt;/a&gt;7. Zarar yetkazish salohiyatiga ega fitna nazariyalariga moyillikning ortishi&lt;/h4&gt;\n&lt;p&gt;Ilmiy tadqiqotlar shuni koʻrsatadiki, fitna nazariyalariga ishonish moyilligi hayotiy tajribadan tortib, kognitiv-pertseptiv shizotipiya (shoshilinch xulosalar chiqarish va rad etuvchi dalillarga nisbatan tarafkashlik) hamda subklinik psixopatiya kabi individual xususiyatlargacha boʻlgan bir qator omillarga bogʻliq. Ushbu tadqiqot maʼlumotlar bazasida 11 ta yozuv aniqlandiki, ularning baʼzilari millionlab marta koʻrilgan va sunʼiy intellekt (AI) tomonidan yaratilgan kontentni tarqatgan. Bu kontent hukumatning shaxsiy hayot va fuqarolik erkinliklariga aralashuvi haqidagi turli fitna nazariyalarini oziqlantirgan. Bunday narrativlar ijtimoiy va siyosiy qarashlarga taʼsir oʻtkazish hamda zarar yetkazishi mumkin boʻlgan fitna nazariyalarini targʻib qilish salohiyatiga ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kognitiv-pertseptiv shizotipiya — bu insonning gʻayrioddiy eʼtiqodlarga moyilligi va yetarli dalillar boʻlmaganda shoshilinch xulosalar chiqarish xususiyatini tavsiflovchi psixologik tushuncha.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"8-ijtimoiy-va-siyosiy-qarashlarning-ozgarishiga-tasir\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#8-ijtimoiy-va-siyosiy-qarashlarning-ozgarishiga-tasir\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Ijtimoiy va siyosiy qarashlarning oʻzgarishiga taʼsir&lt;/span&gt;&lt;/a&gt;8. Ijtimoiy va siyosiy qarashlarning oʻzgarishiga taʼsir&lt;/h4&gt;\n&lt;p&gt;Dezinformatsiyaning siyosiy va ijtimoiy qarashlarga taʼsiri boʻyicha bahslar uzoq tarixga ega. Faylasuf Frensis Bekondan boshlab, tadqiqotchilar shuni taʼkidlashgan: faktik bilimlar yangi dalillar asosida oʻzgarishi mumkin boʻlsa-da, shakllangan fikr va qarashlar juda sekin oʻzgaradi. Qarashlar oʻzgargan taqdirda ham, bunda faqat media emas, balki keng ijtimoiy omillar muhim rol oʻynaydi. Shu bilan birga, koʻp yillik tadqiqotlar takrorlash effektining kuchli taʼsirini tasdiqlaydi: maʼlumotning qayta-qayta taqdim etilishi uning auditoriya tomonidan haqiqat deb qabul qilinishini oshiradi. Zamonaviy uzunlamas (longitudinal) tadqiqotlar medianing fuqarolar xulq-atvori va qarashlariga uzoq muddatli taʼsir koʻrsatishi nazariyasini qoʻllab-quvvatlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Takrorlash effekti (illusory truth effect) — bu psixologik hodisa boʻlib, unga koʻra odamlar biror bayonotni qayta-qayta eshitganlari uchun uni haqiqat deb baholashga moyil boʻladilar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fullfactorg18\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg18\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqot doirasida 112 ta yozuvdan iborat maʼlumotlar toʻplami tahlil qilindi. Ularning 71 tasida (63,4%) sunʼiy intellekt (SI) yordamida yaratilgan siyosiy mazmundagi kontent aniqlandi. Eng koʻp tarqalgan tur (umumiy yozuvlarning 51,8%) taniqli siyosatchilarning harakatlari yoki qarashlarini buzib koʻrsatish boʻldi. Bunda siyosiy arboblarning soxta siyosiy bayonotlari yoki hech qachon sodir boʻlmagan voqealarni tasvirlash uchun SI yordamida yaratilgan video va audio immitatsiyalardan foydalanilgan. Yana 18 ta yozuv (16%) muayyan ijtimoiy guruhlarga nisbatan munosabatni buzib koʻrsatgan boʻlsa, 14 tasi (12,5%) davlat boshqaruvi masalalari boʻyicha notoʻgʻri tushuncha yaratgan (shundan 11 tasi fitna nazariyalari bilan bogʻliq).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dipfeyk — bu sunʼiy intellekt yordamida yaratilgan, real insonning qiyofasi, ovozi yoki harakatlarini taqlid qiluvchi va haqiqiydek koʻrinadigan media kontent.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Siyosatchilar orasida eng koʻp nishonga olingan shaxs bosh vazir Kir Starmer boʻldi. Asosiy narrativlar uning nomidan aytilgan soxta bayonotlar, masalan, jarimalar, jamoat hojatxonalaridan foydalanish uchun toʻlovlar, bayram bezaklariga soliqlar yoki naqd pul yechib olishga cheklovlar kabi mashhur boʻlmagan choralar haqidagi yolgʻon xabarlardan iborat edi. Shuningdek, politsiyaning musulmonlar va muhojirlarga nisbatan harakatlari bilan bogʻliq mavzular ham tez-tez uchradi. Ushbu materiallarda oʻxshash shablonlardan foydalanilgani ularning uyushgan holda tarqatilganini koʻrsatadi, biroq mavjud maʼlumotlar bazasi buni aniq tasdiqlash uchun yetarli emas. Tadqiqot ushbu yolgʻon maʼlumotlarning jamoatchilik fikriga taʼsirini baholashni maqsad qilmagan, ammo mualliflar bunday taʼsir uchun texnik sharoitlar mavjud boʻlganini taʼkidlashadi.&lt;/p&gt;\n&lt;h4 id=\"virallik-va-potensial-tasir-ortasidagi-korrelyatsiya-chegaralari\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#virallik-va-potensial-tasir-ortasidagi-korrelyatsiya-chegaralari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Virallik va potensial taʼsir oʻrtasidagi korrelyatsiya chegaralari&lt;/span&gt;&lt;/a&gt;Virallik va potensial taʼsir oʻrtasidagi korrelyatsiya chegaralari&lt;/h4&gt;\n&lt;p&gt;Notoʻgʻri daʼvo qamrab olgan auditoriya hajmi va uning jamiyatga taʼsir koʻrsatish potensiali oʻrtasidagi bogʻliqlik koʻpincha oʻylanganidan koʻra murakkabroqdir.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg19\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg19\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Tadqiqot notoʻgʻri maʼlumotlarning real oqibatlarga olib kelish mexanizmlarini tahlil qiladi. Mualliflar ikki ssenariyni ajratib koʻrsatishadi: oʻn minglab yoki yuz minglab odamlarni qamrab oladigan ommaviy taʼsir va maʼlum bir qaror qabul qilish vakolatiga ega boʻlgan shaxsga yoʻnaltirilgan taʼsir. Ikkinchisiga misol sifatida 2000-yilda ilmiy jurnalda chop etilgan OITS sabablari haqidagi notoʻgʻri nazariya keltiriladi, bu Janubiy Afrika prezidenti Tabo Mbekining siyosatiga taʼsir koʻrsatib, jamoat sogʻliqni saqlash tizimida fojiali oqibatlarga olib kelgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Virallik — bu kontentning tarmoqda tez tarqalish qobiliyati, ammo mualliflar auditoriya qamrovi har doim ham real taʼsir bilan bogʻliq emasligini taʼkidlashadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Maʼlumotlar toʻplamini tahlil qilish shuni koʻrsatdiki, aksariyat viral postlar (1 milliondan ortiq koʻrishlar) jiddiy oqibatlarga olib kelish salohiyatiga ega emas. Bu yoki noaniqliklarning tor doirasi, yoki auditoriyaning notoʻgʻri maʼlumot asosida harakat qilish uchun motivatsiyasi yoki imkoniyati yoʻqligi bilan izohlanadi. Hatto dezinformatsiya juda katta auditoriyani qamrab olgan taqdirda ham (masalan, 2016-yildagi «Pizzagate» nazariyasi), faqat ayrim shaxslar faol harakatlarga oʻtadi, garchi qamrov koʻlami bunday hodisalar ehtimolini statistik jihatdan oshirsa ham.&lt;/p&gt;\n&lt;h4 id=\"scale-of-effects\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#scale-of-effects\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Scale of effects&lt;/span&gt;&lt;/a&gt;Scale of effects&lt;/h4&gt;\n&lt;p&gt;Oqibatlarning koʻlami va ogʻirligi kontekstga bogʻliq. Tadqiqotda oʻrganilgan maʼlumotlar toʻplamida 1 ta holat taʼqibga uchragan aniq shaxsga, 8 ta holat alohida shaxslarga (masalan, firibgarlik yoki notoʻgʻri tibbiy maslahatlar), 10 ta holat muayyan guruhlarga (masalan, diniy yoki ijtimoiy guruhlarga nisbatan kamsitish), 39 ta holat esa jamiyatga (siyosiy yoki ijtimoiy qarashlarga taʼsir) daxldor boʻlgan. 20 ta holatda taʼsir koʻlamini aniqlash imkonsiz boʻlgan.&lt;/p&gt;\n&lt;h4 id=\"6-recommendations\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#6-recommendations\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Recommendations&lt;/span&gt;&lt;/a&gt;6. Recommendations&lt;/h4&gt;\n&lt;p&gt;Mualliflar ijtimoiy tarmoq va qidiruv tizimlariga sunʼiy intellekt yordamida yaratilgan yoki tahrirlangan kontent uchun oshkoralik siyosatini joriy etishni tavsiya qiladilar. Ushbu choralar siyosatchilarning harakatlari, saylov jarayonlari, norozilik namoyishlari, ruhiy salomatlik, jinsiy xulq-atvor, davolash usullari, reproduktiv salomatlik, sport va tibbiy xizmatlardan foydalanish kabi mavzularni qamrab olishi kerak.&lt;/p&gt;\n&lt;h4 id=\"fullfactorg20\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#fullfactorg20\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fullfact.org&lt;/span&gt;&lt;/a&gt;fullfact.org&lt;/h4&gt;\n&lt;p&gt;Full Fact tashkiloti (xayriya fondi № 1158683, notijorat kompaniyasi № 6975984) sunʼiy intellekt (SI) yordamida yaratilgan kontentni tartibga solish boʻyicha chora-tadbirlar majmuini taklif qiladi. Dezinformatsiyaga qarshi kurashish uchun «uchta ogohlantirish» tizimini joriy etish taklif etiladi: jamoatchilik qoidalarini buzgan holda SI ishlatilganini muntazam yashiradigan mualliflar platformalardan doimiy ravishda bloklanishi kerak. Muhim yoʻnalish — bu saylovlar yoki inqiroz davrlarida ayniqsa dolzarb boʻlgan kontentni «ekish» (seeding) va nusxalashni aniqlash uchun kompaniyalar oʻrtasidagi texnologik hamkorlikdir. Shuningdek, maʼlumotlarni bilvosita oshkor qilishning xalqaro standartlarini yaratishda ishtirok etish va tadqiqotchilarga moderatsiya vositalarining aniqligi toʻgʻrisidagi maʼlumotlardan foydalanish imkoniyatini taʼminlash zarurligi taʼkidlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kontentni «ekish» (seeding) — bu ommaviy qoʻllab-quvvatlash yoki tabiiy qiziqish illyuziyasini yaratish uchun tarmoq hisob qaydnomalari orqali axborot tarqatish strategiyasidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hukumat-uchun-tavsiyalar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#hukumat-uchun-tavsiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hukumat uchun tavsiyalar&lt;/span&gt;&lt;/a&gt;Hukumat uchun tavsiyalar&lt;/h4&gt;\n&lt;p&gt;Full Fact Buyuk Britaniya hukumatini kamera va smartfonlar apparat taʼminotiga raqamli maʼlumotlarni (content credentials) kiritishni ragʻbatlantirishga chaqiradi. Generativ SI ishlab chiquvchilari kontent yaratilganda avtomatik raqamli suv belgilarini qoʻllashga majbur boʻlishlari kerak. Yirik platformalar va qidiruv tizimlari SynthID va C2PA spetsifikatsiyalari kabi texnologiyalarga tayangan holda kontentning kelib chiqishini belgilashning yagona standartlaridan foydalanishlari shart. Bundan tashqari, platformalarning fuqarolik muhokamasi, saylov jarayonlari va jamoat salomatligiga boʻlgan xavflarni baholash va kamaytirish majburiyatini qonuniy mustahkamlash taklif etiladi. Muhim element — bu tadqiqotchilar va faktchekerlarning platforma maʼlumotlariga mustaqil kirishini taʼminlaydigan tuzilmani yaratishdir, bu esa maxfiylik standartlariga rioya qilgan holda shaffoflikni taʼminlaydi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS2.jpg\" alt=\"Rasm S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS2-2.jpg\" alt=\"Rasm S2 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS2-3.jpg\" alt=\"Rasm S2 (davomi 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2 (davomi 3)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;SI&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;feyklarining&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;jamiyatga&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ta'siri&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;112 ta holatni&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;xavf modeli&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bilan tahlil&lt;/text&gt;&lt;text x=\"226\" y=\"142
