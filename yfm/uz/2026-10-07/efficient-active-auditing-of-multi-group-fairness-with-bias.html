            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"208\" cy=\"61\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"592\" cy=\"298\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Neyrotarmoqlardagi&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tarafkashlikni tizimni&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;buzmasdan qanday tekshirish&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;mumkin&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f1.jpg\" alt=\"1-rasm: Adolatlilik mezonlarini hisobga oluvchi raqib modelga qarshi interaktiv adolatlilik auditi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Adolatlilik mezonlarini hisobga oluvchi raqib modelga qarshi interaktiv adolatlilik auditi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar sun'iy intellekt modellarini to'liq qayta tiklamasdan, ulardagi tarafkashlikni tekshirish usulini ishlab chiqdilar. ALeBi tizimi guruhlararo adolatni baholash uchun moslashuvchan so'rovlardan foydalanadi. Bu yondashuv tizim egalarini ma'lumotlarni o'g'irlash hujumlaridan himoya qiladi va natijalarning shaffofligini ta'minlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ALeBi modelning ichki tuzilishini tiklamasdan tarafkashlikni baholaydi.&lt;/li&gt;\n&lt;li&gt;Usul kamsitish yuqori bo'lgan ma'lumotlar sohalarini aniq ko'rsatib beradi.&lt;/li&gt;\n&lt;li&gt;Algoritm tizim egasi qarshilik ko'rsatganda ham o'z aniqligini saqlab qoladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;An'anaviy «qora quti» audit usullari ko'pincha modelni to'liq qayta tiklashni talab qiladi, bu esa tizimni xavf ostiga qo'yadi yoki tarafkashlik sabablarini tushunishga imkon bermaydigan keng ko'lamli testlarni talab qiladi. Mualliflar «tarafkashlik zondlari» (bias probes) konsepsiyasini taklif qilishadi — bu himoyalangan guruhlar o'rtasidagi xatti-harakatlar farqini aniqlaydigan maxsus funksionaldir.&lt;/p&gt;\n&lt;p&gt;ALeBi algoritmi modelga eng informativ so'rovlarni tanlash uchun faol o'rganishdan foydalanadi. Tajribalar shuni ko'rsatdiki, usul hatto model egasi tarafkashlikni yashirishga uringan taqdirda ham adolat metrikalarini yuqori aniqlik bilan baholay oladi. Tadqiqot model maxfiyligi va audit ishonchliligi o'rtasidagi muvozanat bo'yicha nazariy kafolatlarni belgilab beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul tanlov murakkabligi bo'yicha nazariy taxminlarga tayanadi va juda kichik yoki shovqinli ma'lumotlar bilan cheklanishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Soʻnggi oʻn yillikda mashinali oʻqitish (ML) ikki qarama-qarshi maqsad ostida rivojlandi: empirik xavfni minimallashtirish (ERM) orqali bashorat xatosini kamaytirish va noxolislikni (unfairness bias) nazorat qilish. Amaliyotda adolatni hisobga oluvchi oʻqitish usullari standart ERMga nisbatan kam yaxshilanish beradi, bu esa mustaqil auditni zarur qiladi. «Qora quti» modellari uchun mavjud audit yondashuvlari yoki modelni toʻliq rekonstruksiya qilishga tayanadi (bu tizimni maʼlumotlarni oʻgʻirlash hujumlariga ochiq qoldiradi), yoki adolat koʻrsatkichlarini toʻgʻridan-toʻgʻri baholaydi, ammo qaysi maʼlumotlar hududi noxolislikni keltirib chiqarayotganini aniqlashda cheklangan imkoniyatga ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Qora quti» auditi — bu tadqiqotchi modelning ichki tuzilmasiga kirmasdan, faqat soʻrovlar yuborish va javoblarni tahlil qilish orqali tizimni tekshirishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ishda «bias probe» (noxolislikni &lt;a href=\"concepts/probing.html\"&gt;zondlash&lt;/a&gt;) tizimi taqdim etiladi, u model maxfiyligini saqlagan holda maqsadli va moslashuvchan audit oʻtkazish imkonini beradi. Shu asosda ALeBi algoritmi taklif etilgan — bu koʻp guruhli adolat koʻrsatkichlarini samarali baholash uchun zondlarni oʻrgatuvchi faol auditor. Mualliflar xususiyatga xos murakkablik oʻlchovi asosida namuna murakkabligi (sample complexity) boʻyicha yangi kafolatlarni belgilab berdilar, bu avvalgi ochiq savollardan birini hal qiladi. Tadqiqot, shuningdek, model egasi noxolislikni ataylab yashirishi mumkin boʻlgan raqobatbardosh (adversarial) stsenariylarni ham qamrab oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bias probe tizimi modelni qayta tiklamasdan noxolislikni baholash imkonini beradi, bu esa audit aniqligi va model maxfiyligi oʻrtasidagi muvozanatni taʼminlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar model maxfiyligi va ishonchli audit oʻrtasidagi fundamental kelishmovchilikni koʻrsatadi. Zondlash usuli ham aniq baholash, ham yuqori yoki past noxolislik hududlarini izohlash imkonini beradi. Yondashuvning amaliy samaradorligi keng koʻlamli tajribalar bilan tasdiqlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu ish preprint (arXiv:2609.40034v1) hisoblanadi va nashr etilgan vaqtda ekspertlar tekshiruvidan oʻtmagan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"ml-tizimlarida-auditning-dolzarbligi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#ml-tizimlarida-auditning-dolzarbligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ML tizimlarida auditning dolzarbligi&lt;/span&gt;&lt;/a&gt;ML tizimlarida auditning dolzarbligi&lt;/h4&gt;\n&lt;p&gt;Mashinali oʻqitish (ML) modellarini baholash tobora muhim ahamiyat kasb etmoqda, chunki tizimlar tibbiy tasvirlash, ishga qabul qilish, kreditlash va onlayn platformalar kabi sohalarda zararli tarafkashlik (bias) koʻrsatishi mumkinligi aniqlangan. Bu «algoritmik adolat» sohasining rivojlanishiga olib keldi. Oʻqitish jarayoniga adolat cheklovlarini kiritishga qaratilgan anʼanaviy yondashuvlar amaliyotda standart ERM (empirik xavfni minimallashtirish) usuliga nisbatan cheklangan yaxshilanishlarni beradi. Shu sababli, eʼtibor tizim ishga tushirilgandan keyingi auditga (post-deployment auditing) qaratildi. Nyu-Yorkdagi Local Law 144, Yevropadagi Digital Services Act va AI Act kabi qonunchilik hujjatlari yuqori xavfli ML tizimlari uchun shaffoflik va auditni majburiy talabga aylantirmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Algoritmlar auditi tartibga soluvchi organlar uchun majburiy talabga aylanmoqda, biroq mavjud usullar yo modelni toʻliq qayta tiklashni talab qiladi, yo juda qimmatga tushadi, bu esa shaffoflik va maʼlumotlar xavfsizligi oʻrtasida ziddiyatni keltirib chiqaradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"qora-quti-auditidagi-muammolar\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#qora-quti-auditidagi-muammolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Qora quti» auditidagi muammolar&lt;/span&gt;&lt;/a&gt;«Qora quti» auditidagi muammolar&lt;/h4&gt;\n&lt;p&gt;Post-deployment rejimida model odatda «qora quti» sifatida qaraladi. Tashqi auditor model egasi bilan soʻrovlar orqali oʻzaro aloqada boʻladi va modelning ichki tuzilishiga kira olmaydi. Bu yerda fundamental ziddiyat yuzaga keladi: auditor adolatni baholash uchun yetarli maʼlumot olishni istaydi, model egasi esa maxfiy maʼlumotlarni himoya qilish uchun oshkor etishni cheklaydi. Mavjud yondashuvlar yo modelni rekonstruksiya qilishga urinadi (bu modelni oʻgʻirlash hujumlariga ochiq qoldiradi), yo katta hajmdagi belgilangan maʼlumotlarni talab qiladi. Mualliflar savol qoʻyishadi: modelni toʻliq rekonstruksiya qilmasdan va katta hajmdagi belgilangan maʼlumotlarsiz adolat boʻyicha kafolatlarni olish mumkinmi?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Qora quti» — bu ichki mantiqi foydalanuvchidan yashirilgan model; auditor faqat kiruvchi maʼlumotlarni berib, chiqishdagi bashoratlarni koʻra oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"interpretatsiya-va-audit-xavfsizligi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#interpretatsiya-va-audit-xavfsizligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Interpretatsiya va audit xavfsizligi&lt;/span&gt;&lt;/a&gt;Interpretatsiya va audit xavfsizligi&lt;/h4&gt;\n&lt;p&gt;Baholashdan tashqari, interpretatsiya ham muhim: AI Act’ning 86-moddasiga koʻra, foydalanuvchilar qarorlar uchun tushuntirish olish huquqiga ega. Anʼanaviy usullar tarafkashlikning miqdoriy koʻrsatkichlarini beradi, lekin diskriminatsion xatti-harakatni tushuntirmaydi. Mualliflar «tarafkashlik zondlari»ni (bias probes) taklif qilishadi — bu himoyalangan guruhlar oʻrtasidagi tafovutlarni aniqlovchi tuzilmaviy funksionallar. Bu interpretatsiya kafolatlari bilan adolat auditini rasmiylashtirgan birinchi ishdir. Shuningdek, xavfsizlik masalasi ham dolzarb: audit jarayonida model maxfiyligini qanday saqlash va tarafkashlikni yashirishga urinayotgan (adversarial) model egalariga qarshi qanday kurashish kerak?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Klassik maʼlumotlarga qaratilgan hujumlardan farqli oʻlaroq, bu yerda model egasi auditor tarafkashlikni aniqlamasligi uchun tizim xatti-harakatini ataylab oʻzgartirishi mumkin boʻlgan holat koʻrib chiqiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Taqdim etilgan yondashuv doirasida tenglik talablarini inobatga oluvchi kuchli raqib (fairness-aware adversary) mavjudligi taxmin qilinadi. Bunday raqib guruhlaro tafovutlarni yashirish uchun oʻz javoblarini strategik tarzda oʻzgartirish imkoniyatiga ega. Toʻplangan oʻzaro taʼsirlar tarixiga &lt;span class=\"yfm-latex\" data-content=\"%7B(q_1%2C%20M_1)%2C%20%5Cdots%2C%20(q_%7Bt%2B1%7D%2C%20M_%7Bt%2B1%7D)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; asoslanib, bu yerda q — soʻrov va M — model javobi, auditor tekshirilayotgan xususiyatning &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Cmu%7D_%7Bt%2B1%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; qiymatini baholaydi. Shu bilan birga, algoritm kirish fazosining tahlil qilinayotgan tizim himoyalanadigan guruhlarga nisbatan eng yuqori noxolislik va kamsitishni koʻrsatadigan aniq sohalarini aniqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tahdidlar modeli kamsitish holatlarini yashirish uchun \"qora quti\" chiqarishini moslashtira oladigan faol raqibni oʻz ichiga oladi, bu esa baholash vazifasini murakkablashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ish koʻp guruhli tenglik (multi-group fairness) sharoitida koʻrsatilgan qiyinchiliklarni hal qilishga qaratilgan. Mualliflar belgilanmagan maʼlumotlar havzasidan puxta tanlab olingan kirish maʼlumotlari orqali auditor \"qora quti\" modeliga soʻrov yuboradigan interaktiv audit freymvorkini koʻrib chiqadilar. Ushbu yondashuv baholanayotgan algoritmning ichki arxitekturasi yoki vaznlariga toʻliq kirish imkoniyatisiz audit oʻtkazishga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;\"Qora quti\" interaktiv auditi — bu algoritm tengligini tekshirish usuli boʻlib, unda tadqiqotchilar dastur kodiga kirmasdan, faqat oʻylangan soʻrovlarni yuborish va yakuniy javoblarni tahlil qilish orqali baholash oʻtkazadilar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Usulning asosiy xususiyati modelning oʻzini toʻliq tiklashga urinish oʻrniga, himoyalangan guruhlar boʻyicha modelning kamsitish xulq-atvorini aks ettiruvchi solishtirma funksionallarni (comparison functionals) oʻrgatishdan iborat. Masalaning bunday qoʻyilishi yuqori mezoniy samaradorlik va natijalarning talqin qilinishini taʼminlaydi. Bundan tashqari, u auditorga beriladigan axborot hajmini naturally cheklaydi hamda model egasini intellektual mulkni oʻzlashtirishga qaratilgan hujumlardan (reconstruction attacks) himoya qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modelni tiklash oʻrniga solishtirma funksionallarni baholash koʻp guruhli tenglikni aniq audit qilishni taʼminlaydi va algoritmni ruxsatsiz nusxalashdan himoya qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"relatedwork\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#relatedwork\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RelatedWork&lt;/span&gt;&lt;/a&gt;RelatedWork&lt;/h4&gt;\n&lt;p&gt;Adolatli audit. Algoritmlar adolatliligini oʻrganish ikki yoʻnalishda olib boriladi: cheklangan optimallashtirish orqali adolatli modellarni oʻqitish va cheklangan kirish huquqiga ega boʻlgan modellarni audit qilish. Mavjud audit usullari koʻpincha modelni toʻliq qayta qurishga asoslanadi, bu esa yuqori hisoblash resurslarini talab qiladi. Bizning yondashuvimiz auditni xususiyatlarni baholash muammosi sifatida koʻrib chiqadi va modelni toʻliq tiklashdan koʻra, guruhlararo taqqoslashlarning kombinatorik tuzilishiga eʼtibor qaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Biz adolatlilikni modelni toʻliq tiklamasdan, guruhlararo farqlar tuzilishini tahlil qilish orqali baholashni taklif qilamiz.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Interpretatsiya va zondlash usullari. Interpretatsiya usullari (belgilarni atributsiya qilish, kontrfaktual tushuntirishlar) model xatti-harakatining tavsifiy xulosalarini beradi. Zondlash (probing) usullari esa oddiy modellar yordamida oʻrganilgan vakilliklardan xususiyatlarni ajratib oladi. Bizning «xolislik zondlari» (bias probes) tushunchasi shunga yaqin, ammo ular himoyalangan guruhlar oʻrtasidagi munosabatlar farqlarini aniqlashga qaratilgan va statistik kafolatlar bilan taʼminlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zondlash (probing) — bu neyron tarmoqlarni tahlil qilish usuli boʻlib, unda asosiy modelning maʼlum qonuniyatlarni oʻrganganligini tekshirish uchun uning ustiga oddiy model oʻrnatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Faol oʻrganish va kelishmovchilikka asoslangan murakkablik. Klassik faol oʻrganish murakkablikni baholash uchun geometrik parametrlardan (kelishmovchilik koeffitsiyenti, yulduzlar soni) foydalanadi. Biz ushbu yondashuvni moslashtirib, «guruhlararo yulduzlar soni» (intergroup star number) tushunchasini kiritamiz. Bu parametr kichik guruhlar oʻrtasidagi konfiguratsiyalarni ajratib olish qobiliyatini oʻlchaydi va namunalar samaradorligini belgilaydi.&lt;/p&gt;\n&lt;p&gt;Afzalliklarni oʻrganish. Elementlarni tartiblashdan farqli oʻlaroq, biz taqqoslash funksionallari sinfini oʻrganamiz. Bu «qora quti» modelining diskriminatsion xatti-harakatlarini baholash imkonini beradi.&lt;/p&gt;\n&lt;p&gt;Modelni chiqarib olish hujumlari. «Model extraction» hujumlari API orqali model funksionalligini takrorlashga imkon beradi. Biz ushbu xavflarni hisobga olamiz: bizning audit mexanizmlarimiz ataylab oshkor qilinadigan maʼlumotlar hajmini cheklaydi, bu esa zondlarimizdan modelni tiklashni hisoblash jihatidan qiyin vazifaga aylantiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bizning zondlarimiz orqali modelni tiklash qiyinlashtirilgan, bu API orqali audit oʻtkazishda xavfsizlikni taʼminlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adolatni-audit-qilish-uchun-qiyosiy-asos\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#adolatni-audit-qilish-uchun-qiyosiy-asos\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Adolatni audit qilish uchun qiyosiy asos&lt;/span&gt;&lt;/a&gt;Adolatni audit qilish uchun qiyosiy asos&lt;/h4&gt;\n&lt;p&gt;Biz «xolislik zondlari» (bias probes) asosida yangi tizimni taqdim etamiz. U guruhlararo tuzilmaviy taqqoslashlar orqali modelning kamsituvchi xatti-harakatlarini aniqlaydi. Adolat auditi taqqoslash funksionallarini o‘rganish muammosi sifatida rasmiylashtiriladi va ma’lumotlar taqsimotiga bog‘liq bo‘lmagan ko‘p guruhli adolatni baholash kafolatlari o‘rnatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul ma’lumotlarning aniq taqsimotiga bog‘liq bo‘lmagan holda, bir vaqtning o‘zida bir nechta guruhlar uchun model adolatini baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"murakkablikning-yangi-olchovi-va-optimal-sorov-chegaralari\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#murakkablikning-yangi-olchovi-va-optimal-sorov-chegaralari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Murakkablikning yangi o‘lchovi va optimal so‘rov chegaralari&lt;/span&gt;&lt;/a&gt;Murakkablikning yangi o‘lchovi va optimal so‘rov chegaralari&lt;/h4&gt;\n&lt;p&gt;Biz ko‘p guruhli stsenariylar uchun klassik yulduz sonini kengaytiruvchi «k-guruhlararo yulduz soni» s_k tushunchasini kiritamiz. Audit so‘rovlari murakkabligini ushbu parametr orqali aniqlab, &lt;span class=\"yfm-latex\" data-content=\"%5COmega%20%5Cleft(%20%5Cmax%20%5Cleft(%20n%5E%7B1-2%5Cdelta%7D%2C%20%5Cfrac%7B1%7D%7B%5Cepsilon%5E2%7D%20%5Cright)%20%5Cright)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; quyi chegarasini isbotlaymiz. Shuningdek, Daniely-Shwartz DS_k o‘lchamini hisobga olgan holda &lt;span class=\"yfm-latex\" data-content=\"O(%5Cdots)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; yuqori chegarasiga erishuvchi k-ALeBi faol algoritmi taklif etiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Daniely-Shwartz o‘lchami — bu modelning qanchalik murakkab funksiyani o‘rgana olishini belgilovchi «sig‘im» ko‘rsatkichi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modelni-ajratib-olish-qiyinligi-va-manipulyatsiya-sharoitida-audit\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#modelni-ajratib-olish-qiyinligi-va-manipulyatsiya-sharoitida-audit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modelni ajratib olish qiyinligi va manipulyatsiya sharoitida audit&lt;/span&gt;&lt;/a&gt;Modelni ajratib olish qiyinligi va manipulyatsiya sharoitida audit&lt;/h4&gt;\n&lt;p&gt;Biz aniq auditni asl klassifikatorni tiklashdan farqlaymiz: barcha nomzod modellarni aniqlash uchun relyatsion so‘rovlar to‘plamini tanlash NP-to‘liq muammo ekanligini ko‘rsatamiz. Model egasi javoblarni manipulyatsiya qilishi mumkin bo‘lgan sharoitda (p &amp;lt; 1/2 buzilish darajasida), Robust k-ALeBi algoritmi taklif etiladi. Empirik baholash bizning yondashuvimizni ReconAudit va DirectAudit usullari bilan aniqlik, talqin qilinish va hujumlarga chidamlilik bo‘yicha solishtiradi.&lt;/p&gt;\n&lt;h4 id=\"muammoni-shakllantirish-kop-guruhli-adolat-auditi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#muammoni-shakllantirish-kop-guruhli-adolat-auditi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muammoni shakllantirish: ko‘p guruhli adolat auditi&lt;/span&gt;&lt;/a&gt;Muammoni shakllantirish: ko‘p guruhli adolat auditi&lt;/h4&gt;\n&lt;p&gt;H — gipotezalar klassi, h model esa Z fazosini  ildeY ga aks ettiradi. Kirish ma’lumotlari p ta himoyalanmagan belgi va Z ni k ta &lt;span class=\"yfm-latex\" data-content=\"Z_1%2C%20%5Cdots%2C%20Z_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; kichik guruhlarga ajratuvchi bitta himoyalangan A atributidan iborat. Adolat buzilishi guruhlar juftliklari o‘rtasidagi statistik paritetdagi maksimal farq sifatida aniqlanadi: &lt;span class=\"yfm-latex\" data-content=\"%5Cmu_%7Bi%2Cj%7D(D%2C%20h)%20%3D%20%5Cmathbb%7BE%7D_%7BX%5Csim%20D%7D%5Bh(X)%20%2F%20X%5Cin%20Z_i%5D%20-%20%5Cmathbb%7BE%7D_%7BX%5Csim%20D%7D%5Bh(X)%20%2F%20X%5Cin%20Z_j%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;µ ni baholash D ma’lumotlar taqsimotiga kirishni talab qiladi; agar Z ning ayrim hududlarida ehtimollik juda past bo‘lsa, ular yakuniy adolat bahosiga kam ta’sir qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Auditor A model egasi M bilan o‘zaro aloqada bo‘lib, µ xususiyatini baholash uchun so‘rovlar yuboradi. Oldingi ishlardan farqli o‘laroq, bizning ta’rifimiz farqning ishorasini hisobga oladi, bu esa qaysi guruh noqulay ahvolda ekanligini tushunish uchun muhimdir.&lt;/p&gt;\n&lt;h4 id=\"auditviamodelreconstruction\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#auditviamodelreconstruction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AuditviaModelReconstruction&lt;/span&gt;&lt;/a&gt;AuditviaModelReconstruction&lt;/h4&gt;\n&lt;p&gt;Ushbu stsenariyda auditor gipotezalar sinfi H va model h ga soʻrov yuborish imkoniyatiga ega. Maqsad H ichidagi oʻqitish jarayonini emulyatsiya qilish orqali surrogat modelni qayta tiklashdan iborat. Masalan, avvalroq kelishmovchilik soʻrovlaridan (disagreement queries) foydalanib, maʼlum bir belgilanmagan maʼlumotlar toʻplamida bir xil statistik paritetga ega boʻlgan H kichik sinfini aniqlash usuli taklif qilingan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ReconAudit usuli iterativ soʻrovlar orqali surrogat modelni tiklaydi, bu &lt;span class=\"yfm-latex\" data-content=\"O(d%2F%5Cepsilon%5E2%20%5Clog%201%2F%5Cdelta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; namunaviy murakkablikni talab qiladi, bu yerda d — VC oʻlchami.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ReconAudit oʻzaro taʼsir protokoli quyidagicha: auditor Q hovuziga va T soʻrovlar byudjetiga ega boʻladi. Har bir t raundda auditor joriy V_t gipotezalar sinfining kelishmovchilik sohasidan X_t soʻrovini tanlaydi, uni model egasiga yuboradi va h(X_t) javobini oladi. T raunddan soʻng auditor surrogat yaratish uchun &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7Bh%7D%20%5Cin%20V_T\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ni tanlaydi va adolatni tekshirish uchun baholovchini qoʻllaydi. Ushbu yondashuvning asosiy muammosi — H sinfining murakkabligiga bogʻliq boʻlgan yuqori namunaviy murakkablikdir, bu modelni chiqarib olish (model extraction) xavfini tugʻdiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VC-oʻlchami (Vapnik-Chervonenkis dimension) — bu statistik modelning sigʻimi (murakkabligi) oʻlchovi boʻlib, u model qanchalik murakkab qonuniyatlarni oʻrganishi mumkinligini belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ReconAudit oʻqitish jarayonida himoyalangan guruhlarga mansublikni hisobga olmaydi, bu esa turli guruhlar uchun notekis rekonstruktsiya xatolariga olib kelishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"auditviadirectestimation\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#auditviadirectestimation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AuditviaDirectEstimation&lt;/span&gt;&lt;/a&gt;AuditviaDirectEstimation&lt;/h4&gt;\n&lt;p&gt;Ushbu yondashuvda auditor P hovuzidagi har bir guruhdan &lt;span class=\"yfm-latex\" data-content=\"O(1%2F%5Cepsilon%5E2%20%5Clog%201%2F%5Cmu)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; namunalar oladi va modelni qayta tiklamasdan, toʻgʻridan-toʻgʻri µ maqsadli xususiyatini baholaydi. Namunaviy murakkablik bu yerda k guruhlar soniga bogʻliq, lekin H sinfining murakkabligiga bogʻliq emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DirectAudit adolatni guruhlarga toʻgʻridan-toʻgʻri soʻrovlar yuborish orqali baholaydi, bu model rekonstruktsiyasi bilan bogʻliq xavflarni oldini oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DirectAudit protokoli quyidagicha ishlaydi: har bir i guruhi uchun auditor Q dan namunalar oladi va model javoblarini soʻraydi. T raunddan soʻng barcha guruhlar uchun juftlik farqlari baholanadi va O(k²) oʻlchamli vektor hosil qilinadi. Ushbu vektorning maksimal qiymati adolat bahosi sifatida qabul qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Toʻgʻridan-toʻgʻri baholash (direct estimation) — tizimning ichki mantiqini yoki tuzilishini toʻliq tiklashga urinmasdan, tizim parametrining qiymatini olishga imkon beruvchi statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model rekonstruktsiyasi modelni yangilashga toʻgʻridan-toʻgʻri baholashga qaraganda qattiqroq cheklovlar yuklaydi, chunki u surrogatning asl nusxaga faqat adolat koʻrsatkichi boʻyicha emas, balki katta maʼlumotlar toʻplamida mos kelishini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rekonstruksiyasiz-va-talqin-qilinadigan-audit\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#rekonstruksiyasiz-va-talqin-qilinadigan-audit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rekonstruksiyasiz va talqin qilinadigan audit&lt;/span&gt;&lt;/a&gt;Rekonstruksiyasiz va talqin qilinadigan audit&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘limda biz kiritish ma’lumotlaridan to‘g‘ridan-to‘g‘ri axborot olish o‘rniga, himoyalangan guruhlar mahsulot fazosida (&lt;span class=\"yfm-latex\" data-content=\"X%20%3D%20%5Cprod_%7Bi%3D1%7D%5Ek%20Z_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;) ishlaydigan audit tizimini taqdim etamiz. Har bir &lt;span class=\"yfm-latex\" data-content=\"x%20%3D%20(x_1%2C%20%5Cdots%2C%20x_k)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; elementi har bir guruhdan bittadan namunani o‘z ichiga oladi. Bu yondashuv auditni faqat adolatlilik xususiyatiga qaratishga va modelni qayta tiklash xavfini kamaytirishga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Audit guruhlararo taqqoslashga o‘tkazildi: modelning mutlaq bashoratlari o‘rniga auditor faqat guruhlar o‘rtasidagi farqlar haqida ma’lumot oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz F_k(H) funksiyalar sinfini kiritamiz, bunda M_k operatori h model bashoratlarini juftlik taqqoslashlariga aylantiradi: f_h(x) = (h(x_i) - h(x_j))1 ≤ i &amp;lt; j ≤ k. Auditor tuzilgan X so‘rovini yuboradi va model orakuli I_M(X) faqat guruhlararo nisbiy tafovutlarni qaytaradi, mutlaq bashoratlarni esa yashiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Orakul — bu auditor modelning ichki parametrlariga kirmasdan, faqat belgilangan interfeys orqali javob oladigan tizim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"boglanish-va-tanlanma-invariantligi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#boglanish-va-tanlanma-invariantligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog‘lanish va tanlanma invariantligi&lt;/span&gt;&lt;/a&gt;Bog‘lanish va tanlanma invariantligi&lt;/h4&gt;\n&lt;p&gt;Biz isbotladikki, so‘rovlarni shakllantirishda tanlangan bog‘lanish (coupling) strategiyasi µ adolatlilik bahosiga ta’sir qilmaydi. 3.1-taklifga ko‘ra, adolatlilik &lt;span class=\"yfm-latex\" data-content=\"%5Cmu(h%2C%20D)%20%3D%20%5C%2F%5Cmathbb%7BE%7D_%7BX%20%5Csim%20%0Au%7D%5Bf_h(X)%5D%5C%2F_%7B%5Cinfty%7D%20sifatida%20hisoblanishi%20mumkin%2C%20bu%20yerda%20%0Au\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — mahsulot fazosidagi ixtiyoriy ehtimollik o‘lchovidir. Bu shuni anglatadiki, audit uchun guruhlar o‘rtasidagi qo‘shma taqsimotni modellashtirish shart emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu usul auditorning guruhlarni taqqoslash uchun kortejlar shakllantirishi mumkin bo‘lgan belgilanmagan ma’lumotlar to‘plamiga kirish imkoniyati borligini nazarda tutadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunday qilib, audit vazifasi modelni rekonstruksiya qilishdan X fazosida aniqlangan funksional oilani baholashga o‘tadi. Bu bizning usulimizni rekonstruksiyaga asoslangan yondashuvlardan tubdan farq qiladi, chunki auditor to‘g‘ridan-to‘g‘ri modelning guruhlararo munosabatlar tuzilishini tekshiradi.&lt;/p&gt;\n&lt;h4 id=\"bias-zondlari-orqali-talqin-qilinadigan-auditlar\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#bias-zondlari-orqali-talqin-qilinadigan-auditlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bias zondlari orqali talqin qilinadigan auditlar&lt;/span&gt;&lt;/a&gt;Bias zondlari orqali talqin qilinadigan auditlar&lt;/h4&gt;\n&lt;p&gt;Model xatti-harakatlarini tushunish uchun biz «bias zondlari» (bias probes) tushunchasini kiritamiz, ular himoyalangan guruhlar o‘rtasidagi qiyosiy farqlarni aniqlashga yordam beradi. Global zond f guruhlar o‘rtasidagi umumiy bashorat farqini baholaydi. Belgilar bo‘yicha &lt;a href=\"concepts/probes.html\"&gt;zondlar&lt;/a&gt; (feature-wise bias profiles) eq,i,j(z) modelning kutilayotgan reaksiyasi qandaydir himoyalanmagan belgi q (masalan, daromad yoki yosh) asosida qanday o‘zgarishini ko‘rsatadi. Smetish kattaligi ef_q(z) ushbu farqning absolyut qiymatini hisoblab, model eng ko‘p tarafkashlik ko‘rsatadigan sohalarni aniqlashga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bias zondlari nafaqat kamsitish mavjudligini qayd etish, balki uni aniq belgilar bo‘yicha lokallashtirish va tengsizlik eng yuqori bo‘lgan ma’lumotlar sohalarini aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bias zondi — bu modelning javoblaridagi farqni o‘lchaydigan matematik vosita bo‘lib, u faqat himoyalangan guruhga (masalan, jins) mansubligi bilan farq qiladigan, ammo boshqa belgilari bir xil bo‘lgan so‘rovlar uchun qo‘llaniladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kredit skoringi misolini ko‘rib chiqamiz: h modeli kredit berish yoki bermaslikni hal qiladi. Auditor turli guruhlardan Q=(X₁, X₂) juftlik so‘rovlarini yuboradi. Zond f1,2(Q) = h(X₁) - h(X₂) qiymatlari &lt;span class=\"yfm-latex\" data-content=\"%5C%7B-1%2C%200%2C%20%2B1%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bo‘lishi mumkin. Ushbu javobni belgilar (daromad, yosh) prizmasidan tahlil qilib, auditor uch darajali hisobot oladi: global tengsizlik ko‘rsatkichi, belgi bo‘yicha siljish profili (yo‘nalishi va kuchi) va siljish kattaligi (faqat kuchi). Muhim: bu ko‘rsatkichlar sabab-oqibat bog‘liqligini yoki belgilarning ahamiyatini baholash emas, balki faqat modelning kuzatilayotgan xatti-harakatini tavsiflaydi.&lt;/p&gt;\n&lt;h4 id=\"talqin-qilinadigan-faol-audit\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#talqin-qilinadigan-faol-audit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Talqin qilinadigan faol audit&lt;/span&gt;&lt;/a&gt;Talqin qilinadigan faol audit&lt;/h4&gt;\n&lt;p&gt;Biz audit jarayonini taqqoslash funksiyasini f_h o‘rganish vazifasi sifatida rasmiylashtiramiz. Agar m ta &lt;span class=\"yfm-latex\" data-content=\"Q_1%2C%20%5Cdots%2C%20Q_m\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; so‘rovlar tanlanmasi asosida &lt;span class=\"yfm-latex\" data-content=\"E_D(f)%20%3D%20P_%7BX%20%5Csim%20D%5Ek%7D%20%5Bf(X)%20%0Aeq%20f_h(X)%5D%20xavfini%20minimallashtiradigan%20%5Chat%7Bf%7D_m%20bahosini%20quradigan%20A_m%20algoritmi%20mavjud%20bo%E2%80%98lsa%2C%20faol%20audit%20o%E2%80%98rganilishi%20mumkin%20deb%20hisoblanadi.%20Tanlanmaning%20minimaks%20murakkabligi%20%5Cvarepsilon%20aniqlikka%201-%5Cdelta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ishonch ehtimoli bilan erishish uchun zarur bo‘lgan minimal so‘rovlar sonini belgilaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu model auditor so‘rovlar juftligini oldindan tanlaydi (qat’iy bog‘lanish) deb faraz qiladi, bu statistik tajribani soddalashtiradi, lekin audit jarayonida so‘rovlar taqsimotini moslashuvchan o‘zgartirish imkoniyatini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zondlarni-oqitish-uchun-axborot-murakkabligi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#zondlarni-oqitish-uchun-axborot-murakkabligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Zondlarni oʻqitish uchun axborot murakkabligi&lt;/span&gt;&lt;/a&gt;Zondlarni oʻqitish uchun axborot murakkabligi&lt;/h4&gt;\n&lt;p&gt;Koʻp guruhli adolat auditi uchun biz Daniely-Shvarts (DS) oʻlchamidan foydalanamiz. U «psevdo-kub» tushunchasiga asoslanadi: vektorlar toʻplami, unda har bir element faqat bitta pozitsiyada farq qiladigan «i-qoʻshni»ga ega. F_k funksiyalar sinfi S ketma-ketligini shunday boʻlaklaydiki, funksiyalar qiymatlari toʻplami m-oʻlchovli psevdo-kubni oʻz ichiga oladi. DS_k(F) — bu boʻlaklashning maksimal oʻlchami.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DS-oʻlchami zondlarni oʻqitish chegarasini belgilaydi: agar u cheksiz boʻlsa, passiv oʻqitish imkonsizdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Standart oʻqitishdan farqli oʻlaroq, bu yerda kelishmovchilik sohasi (disagreement set) yorliqlar noaniqligini emas, balki himoyalangan guruhlar oʻrtasidagi qiyosiy noaniqlikni kodlaydi. Biz «multi-yulduz soni» (s_k) tushunchasini kiritamiz — bu m ning shunday maksimal qiymatiki, bunda X_i nuqtalari va f₀, f_i funksiyalari mavjud boʻlib, ularning kelishmovchilik sohasi aynan bitta X_i nuqtadan iborat boʻladi. s_k ning chekliligi zondlarni faol oʻqitish uchun zarur va yetarli shart ekanligi isbotlangan.&lt;/p&gt;\n&lt;h4 id=\"rekonstruksiya-va-zondli-auditning-axborot-nazariy-ajralishi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#rekonstruksiya-va-zondli-auditning-axborot-nazariy-ajralishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rekonstruksiya va zondli auditning axborot-nazariy ajralishi&lt;/span&gt;&lt;/a&gt;Rekonstruksiya va zondli auditning axborot-nazariy ajralishi&lt;/h4&gt;\n&lt;p&gt;Chiziqli klassifikatorlar uchun «yulduz soni» chegaralanmaganligi maʼlum, bu esa modelni rekonstruksiya qilish orqali faol auditni samarasiz va xavfli qiladi (model sizib chiqishi mumkin). 3.2-taklif shuni koʻrsatadiki, zondlarni oʻqitish (bias probing) orqali audit bu toʻsiqdan qochadi, chunki u butun modelni qayta tiklashga emas, balki aniq xususiyatlarga qaratilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zondli audit chekli s_k murakkabligiga ega, rekonstruksiya esa cheksiz kombinator murakkablikka duch keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"manipulyatsiyasiz-rejim\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#manipulyatsiyasiz-rejim\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manipulyatsiyasiz rejim&lt;/span&gt;&lt;/a&gt;Manipulyatsiyasiz rejim&lt;/h4&gt;\n&lt;p&gt;Biz model egasi tarafkashlikni yashirishga urinmaydigan stsenariyni koʻrib chiqamiz. 3.1-teorema tanlanma murakkabligining quyi chegarasini belgilaydi. m ta soʻrov yuboradigan har qanday faol auditor uchun shunday D taqsimot va f_h^* maqsadli funksiya mavjudki, bunda xatolik ehtimoli ε dan oshadi. Bu shuni tasdiqlaydiki, taqqoslash funksionallaridan foydalanish statistik murakkablikni yoʻqotmaydi, balki uni F taqqoslash sinfining geometriyasiga oʻtkazadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3.1-teorema shuni koʻrsatadiki, hatto faol auditda ham tanlanma murakkabligi s_k va DS_k strukturaviy parametrlari bilan chegaralangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modelni-ajratib-olish-hujumlarining-murakkabligi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#modelni-ajratib-olish-hujumlarining-murakkabligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modelni ajratib olish hujumlarining murakkabligi&lt;/span&gt;&lt;/a&gt;Modelni ajratib olish hujumlarining murakkabligi&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘limda M asosiy modelini ajratib olishning hisoblash va axborot-nazariy nuqtai nazaridan murakkabligi tahlil qilinadi.&lt;/p&gt;\n&lt;p&gt;Hisoblash murakkabligi. Mualliflar siljish zondlari (bias probes) asosida modelni ajratib olish hisoblash jihatidan murakkab vazifa ekanligini ko‘rsatadilar. Audit jarayoni interaktiv protokolni o‘z ichiga oladi, unda auditor model egasi bilan B miqdordagi o‘zaro guruhli so‘rovlar (CGQ) orqali muloqot qiladi. Vazifa B-chegaralangan relyatsion ajratib olish sifatida rasmiylashtiriladi, bunda maqsad H₀ chekli gipotezalar sinfidan noma’lum gipotezani aniqlashga imkon beruvchi so‘rovlar to‘plamini topishdir. 3.2-teorema modelni «qora quti» orqali tiklash NP-qiyin vazifa ekanligini belgilaydi. Bu to‘siqni yuzaga keltiradi: siljish zondlari guruh adolatliligi kabi xususiyatlarni baholashga imkon bersa-da, ular modelning o‘zini samarali rekonstruksiya qilish uchun yetarli ma’lumot bermaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Siljish zondlari so‘rovlari asosida asl modelni tiklash NP-qiyin vazifa bo‘lib, bu universal rekonstruksiyani amalda imkonsiz qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Axborot-nazariy murakkabligi. Bu yerda mualliflar audit jarayonida model egasining shaxsiga oid qancha ma’lumot oshkor bo‘lishini miqdoriy baholaydilar. H gipotezalar to‘plamida bir xil a priori taqsimot bo‘lganda, audit boshlanguniga qadar noaniqlik &lt;span class=\"yfm-latex\" data-content=\"eI_0%20%3D%20%5Clog_2%20%2FH%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bitni tashkil etadi. t ta o‘zaro ta’sirdan so‘ng, gipotezalar to‘plami V_t gacha qisqarganda, shaxsning oshkor bo‘lishi (identity leakage) &lt;span class=\"yfm-latex\" data-content=\"I_t%20%3D%20%5Clog_2%20(%2FH%2F%20%2F%20%2FV_t%2F)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sifatida aniqlanadi. Masalan, gipotezalar fazosi 1000 tadan 20 tagacha qisqarganda, ma’lumot sizib chiqishi taxminan 5,64 bitni tashkil qiladi.&lt;/p&gt;\n&lt;h4 id=\"algoritm-dizayni-k-alebi-va-yuqori-chegaralar\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#algoritm-dizayni-k-alebi-va-yuqori-chegaralar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Algoritm dizayni: k-ALeBi va yuqori chegaralar&lt;/span&gt;&lt;/a&gt;Algoritm dizayni: k-ALeBi va yuqori chegaralar&lt;/h4&gt;\n&lt;p&gt;k-ALeBi (Active Learning for Bias) algoritmi versiyalar fazosini V_t aniqlashtirish uchun iterativ jarayondan foydalanadi. Har bir t qadamda algoritm &lt;span class=\"yfm-latex\" data-content=\"%0Au%20taqsimotidan%20so%E2%80%98rovlarni%20tanlaydi.%20Agar%20so%E2%80%98rov%20noaniqlik%20sohasiga%20(disagreement%20set)%20tushsa%2C%20u%20M_k%20orakuliga%20yuboriladi%20va%20olingan%20Y%5E%7B(t)%7D%20%5Cin%20%5C%7B-1%2C%200%2C%201%5C%7D%5E%7B(k%5E2)%7D%20javob%20asosida%20versiyalar%20fazosi%20yangilanadi.%20Yakuniy%20audit%20hisoboti%20global%20siljish%20zondi%20%5Chat%7Bf%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va alohida xususiyatlar uchun baholarni o‘z ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PAC-o‘qitish (Probably Approximately Correct) — bu algoritmining yuqori ehtimollik bilan xatosi belgilangan ε chegarasidan oshmaydigan gipotezani topishini kafolatlaydigan nazariy model.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.3-teorema k-ALeBi PAC-faol auditor ekanligini isbotlaydi. Kamida 1-δ ehtimollik bilan u &lt;span class=\"yfm-latex\" data-content=\"O(%5Cmin%20%5C%7Bn%2C%20(e-1)%20%5Cdots%20%5C%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; so‘rovlardan foydalanib, xatosi ε dan oshmaydigan natijani beradi. Tahlil shuni ko‘rsatadiki, muayyan sharoitlarda (masalan, DS_k = O(1) bo‘lsa) murakkablikning yuqori va quyi chegaralari logarifmik ko‘paytuvchilar aniqligida mos keladi. 3.1-natija shuni ko‘rsatadiki, ko‘p sinfli F sinfi PAC-faol o‘qitilishi mumkin, faqat va faqat agar ko‘p yulduzli son s_k(F) &amp;lt; ∞ bo‘lsa.&lt;/p&gt;\n&lt;h4 id=\"fairness-aware-adversarial-regime\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#fairness-aware-adversarial-regime\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fairness-aware Adversarial Regime&lt;/span&gt;&lt;/a&gt;Fairness-aware Adversarial Regime&lt;/h4&gt;\n&lt;p&gt;Tadqiqot guruhlararo tengsizlikni aniqlashga urinayotgan auditorga qarshi turuvchi moslashuvchan model egasini ko‘rib chiqadi. Himoya uchun Robust k-ALeBi algoritmi taklif etiladi. 3.1-faraz (Mahalliy replikatsiyalanuvchanlik) har bir so‘rov uchun kamida γ ehtimollik massasiga ega J(X) atrofi mavjudligini talab qiladi, bu yerda javoblar &lt;span class=\"yfm-latex\" data-content=\"1-%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ehtimollik bilan barqaror (&lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3C%201%2F2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;). Bu auditorga model egasining tarafkashlikni yashirish urinishlariga qaramay, ishonchli ma’lumot olish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Robust k-ALeBi algoritmi so‘rovlar atrofidagi javoblarni mahalliy o‘rtachalash orqali model egasining tarafkash javoblari ta’sirini minimallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adaptive-fairness-aware-adversary-algorithm-and-upper-bounds\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#adaptive-fairness-aware-adversary-algorithm-and-upper-bounds\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Adaptive Fairness-aware Adversary: Algorithm and Upper Bounds&lt;/span&gt;&lt;/a&gt;Adaptive Fairness-aware Adversary: Algorithm and Upper Bounds&lt;/h4&gt;\n&lt;p&gt;Shartli ehtimollik hujumi tushunchasi (3.8-ta’rif) kiritiladi, bunda javobni buzish ehtimoli A_r=1 p &amp;lt; 1/2 qiymati bilan cheklangan. 4-algoritm (Robust k-ALeBi) J(X_t) atrofidan R ta mustaqil namuna olish uchun LocalLabel kichik dasturidan foydalanadi. Yakuniy javob olingan belgilar orasida eng ko‘p uchraydigan qiymat sifatida aniqlanadi. &lt;span class=\"yfm-latex\" data-content=\"%5Cbeta%20%3D%20p%20%2B%20%5Crho%20-%20p%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; parametri ham mahalliy beqarorlik, ham qasddan buzish natijasida yuzaga kelgan xatolarni birlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Rejektiv namuna olish (rejection sampling) usuli belgilanmagan ma’lumotlar to‘plamiga qayta-qayta murojaat qilish orqali J(X) maqsadli sohasidan namunalar olish uchun ishlatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.4-teorema Robust k-ALeBi PAC-faol auditor ekanligini tasdiqlaydi. Namuna olish murakkabligi (1-2β)⁻² ga mutanosib ravishda ortadi, bu model egasining manipulyatsiyalarini kompensatsiya qilish uchun qo‘shimcha so‘rovlar zarurligini anglatadi. Agar axborotli sohaning ehtimollik massasi γ kichik bo‘lsa, auditorga yetarli ma’lumot to‘plash uchun ko‘proq urinishlar kerak bo‘ladi. Ushbu yondashuv model sinflarining muntazamligidan (masalan, Vapnik-Chervonenkis o‘lchami) foydalanadi.&lt;/p&gt;\n&lt;h4 id=\"global-information-theoretic-hardness\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#global-information-theoretic-hardness\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Global Information-theoretic Hardness&lt;/span&gt;&lt;/a&gt;Global Information-theoretic Hardness&lt;/h4&gt;\n&lt;p&gt;Standart «yulduz soni» (starnumber) taʼrifi koʻp guruhli adolat (multi-group fairness) uchun quyi chegarani har doim ham aniq belgilab bera olmaydi. Turli zond funksiyalari barcha k guruh juftliklari uchun bir xil statistik paritetni koʻrsatsa ham, ular sezilarli darajada farqlanishi mumkin. Ushbu murakkablikni qamrab olish uchun «adolat boʻyicha samarali yulduz soni» µ(F) tushunchasi kiritildi. Bu m butun sonlarining supremumi boʻlib, unda CGQ soʻrovlari va F sinfidagi funksiyalar mavjud boʻlib, zond adolatli va adolatsiz holatlarni «yulduz toʻplami»da ajrata oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Adolat boʻyicha samarali yulduz soni µ(F) adolat koʻrsatkichiga bevosita taʼsir qiluvchi farqlarga eʼtibor qaratishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CGQ (Conditional Group Queries) — bu auditorga modelning turli guruhlar uchun muayyan sharoitlardagi xatti-harakatini tekshirish imkonini beruvchi soʻrovlar turi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ehtimollik hujumlari ostida adolatni baholash uchun «3.2-faraz» (Cell-replicability) kiritildi. U model h^* soʻrovlar fazosining muayyan oʻlchanadigan kataklarida yetarlicha barqaror ishlashini nazarda tutadi. Bu auditorga bir katak ichidagi bir nechta tanlamalardan foydalanib, model reaksiyasini takrorlash imkonini beradi. 3.5-teoremaga koʻra, p &amp;lt; 1/2 ehtimollikdagi hujum sharoitida zondni oʻrganish uchun &lt;span class=\"yfm-latex\" data-content=\"%5COmega(%5Cmin(s%5Cmu(F)%2C%201%2F%5Cepsilon))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; oʻlchamdagi soʻrovlar toʻplami zarur.&lt;/p&gt;\n&lt;h4 id=\"experimental-analysis\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#experimental-analysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Experimental Analysis&lt;/span&gt;&lt;/a&gt;Experimental Analysis&lt;/h4&gt;\n&lt;p&gt;Freyvork uch yoʻnalishda baholanadi: zond aniqligi, adolatni baholash va hisoblash samaradorligi. Klassifikatorlar sifatida chiziqli model, tasodifiy oʻrmon (random forest) va koʻp qatlamli perseptron (MLP) ishlatilgan. Maʼlumotlar toʻplami modelga soʻrovlar yuborish orqali hosil qilinadi. Tadqiqot COMPAS (k=2), German Credit (k=4) va Student maʼlumotlar toʻplamlarida oʻtkazilgan. Takrorlanuvchanlikni taʼminlash uchun har bir tajriba 10 ta tasodifiy boshlangʻich qiymat (seed) bilan ishga tushirilgan.&lt;/p&gt;\n&lt;h4 id=\"accuracy\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#accuracy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accuracy&lt;/span&gt;&lt;/a&gt;Accuracy&lt;/h4&gt;\n&lt;p&gt;K-ALeBi usuli DirectAudit, ReconAudit va DiamAudit bilan solishtirilgan. 4-rasmda koʻrsatilishicha, 1000 ta soʻrovdan soʻng k-ALeBi bazaviy usullarga qaraganda sezilarli darajada kichikroq xatolikni koʻrsatgan. DiamAudit bilan solishtirilganda (k=2 va chiziqli gipotezalar sinfi), k-ALeBi yaxshiroq natija bergan. COMPAS toʻplamida k-ALeBi xatoligi 0,0000213 ni, DiamAuditniki esa 0,000046 ni tashkil etgan. Student toʻplamida k-ALeBi xatoligi 0,006947 ga teng boʻlgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar maʼlum benchmarklar asosida olingan; usul samaradorligi model arxitekturasi va maʼlumotlar taqsimotiga qarab oʻzgarishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modelni-chiqarib-olish-hujumlaridan-himoya\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#modelni-chiqarib-olish-hujumlaridan-himoya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modelni chiqarib olish hujumlaridan himoya&lt;/span&gt;&lt;/a&gt;Modelni chiqarib olish hujumlaridan himoya&lt;/h4&gt;\n&lt;p&gt;Tadqiqot algoritmlar adolatliligini audit qilish va modelni qayta tiklash uchun zarur bo'lgan ma'lumotlarni oshkor qilish o'rtasidagi farqni o'rganadi. Cheklangan so'rovlar byudjetida Cross Group Queries (CGQ) usuli modelning diskriminativ xatti-harakatlarini saqlab qolgan holda adolatlilik bo'yicha aniq baholarni taqdim etadi. Bu audit foydaliligi va model identifikatsiyasi o'rtasidagi empirik farqni ko'rsatadi: modelni rekonstruksiya qilish uchun zarur bo'lgan individual bashoratlarni fosh etmasdan ham adolatlilik haqida foydali ma'lumot olish mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;k-ALeBi usuli ReconAudit bilan solishtirganda model identifikatsiyasi bo'yicha ma'lumotlar sizib chiqishini sezilarli darajada kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;9-rasmda k-ALeBi va ReconAudit uchun identifikatsiya sizib chiqishi solishtiriladi. ReconAudit model yorliqlarini fosh qiluvchi a'zolik so'rovlaridan foydalanadi, k-ALeBi esa individual yorliqlarni to'g'ridan-to'g'ri oshkor qilmaydigan relyatsion CGQ orqali ishlaydi. Identifikatsiya sizib chiqishi o'lchovi (3.7-ta'rif) bo'yicha k-ALeBi audit aniqligini saqlagan holda ancha past ko'rsatkichlarni namoyish etadi. 10-rasm k-ALeBi ni DiamAudit bilan solishtiradi va k-ALeBi a'zolik so'rovlariga asoslangan hujumlardan farqli o'laroq, individual bashoratlarni fosh etmasdan CGQ orqali foydali ma'lumot berishini ko'rsatadi.&lt;/p&gt;\n&lt;h4 id=\"adolatlilikni-hisobga-oluvchi-raqib-hujumlariga-chidamlilik\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#adolatlilikni-hisobga-oluvchi-raqib-hujumlariga-chidamlilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Adolatlilikni hisobga oluvchi raqib hujumlariga chidamlilik&lt;/span&gt;&lt;/a&gt;Adolatlilikni hisobga oluvchi raqib hujumlariga chidamlilik&lt;/h4&gt;\n&lt;p&gt;Mualliflar Robust k-ALeBi ning adolatlilik auditini buzishga qaratilgan hujumlarga chidamliligini baholadilar. COMPAS-linear modelida p=0.40 yuqori korrupsiya darajasida tajovuzkor o'rtacha 41,4 koordinata buzilishini kiritadi, shundan filtrlashdan so'ng atigi 6,2 tasi so'rovlarga ta'sir qiladi. Shunga qaramay, adolatlilikni baholash xatosi 0,019 dan 0,021 gacha biroz o'sadi, beshta urinishda ma'lumotlarni yashirish holati kuzatilmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ma'lumotlar korrupsiyasi — audit algoritmini aldash uchun so'rovlarga qasddan shovqin yoki buzilishlar kiritish.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Solishtirish uchun, hujum paytida ReconAudit rekonstruksiya xatosi 0 dan 0,074 gacha o'sadi, yashirish darajasi esa 0,20 ga etadi. Yan va Zhang (2022) bazaviy usuli hujumsiz 0,03 xatolikni ko'rsatadi, bu maksimal hujum ehtimoli 0,12 bo'lganda 0,05 gacha o'sadi. Robust k-ALeBi ning xuddi shunday barqarorligi German-linear va Student-linear modellarida ham tasdiqlangan.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"kengaytirilgan-tizim-tavsifi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#kengaytirilgan-tizim-tavsifi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kengaytirilgan tizim tavsifi&lt;/span&gt;&lt;/a&gt;Kengaytirilgan tizim tavsifi&lt;/h4&gt;\n&lt;p&gt;Ushbu ishda mashinali o‘qitish modellarining adolatliligini tekshirishning ikki usuli: rekonstruktiv va zondli (probe-based) yondashuvlar o‘rtasidagi farq aniqlandi. Tadqiqotchilar zondlarni o‘qitish masalasini «ko‘p kontekstli yulduz soni» (multi-context star number) ko‘rsatkichi orqali tavsifladilar. Aniqlanishicha, hatto chiziqli klassifikatorlar uchun rekonstruktiv audit imkonsiz bo‘lgan hollarda ham, zondli yondashuv o‘qitiluvchanligicha qoladi, bu esa Q1 savoliga javob beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zondli audit yondashuvi rekonstruktiv usullar samarasiz bo‘lgan holatlarda ham modellardagi tarafkashlikni aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu formulaga asoslanib, interpretatsiya qilinadigan tarafkashlik zondlarini o‘qitishga asoslangan audit algoritmi ishlab chiqildi. Bu audit ma’lumotlarini bevosita qiziqish uyg‘otadigan adolatlilik xususiyatlari bo‘yicha olish imkonini beradi va Q2 savoliga javob bo‘ladi. Yakunda mualliflar «adolatlilikdan xabardor» (fairness-aware) raqib mavjud bo‘lgan sharoitda audit masalasini tahlil qildilar. Audit murakkabligining yuqori va quyi chegaralari belgilandi, bu esa Q3 savolini yopadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zond (probe) — bu asosiy modeldan yashirin qonuniyatlar yoki tarafkashlikni tekshirish uchun maxsus ma’lumotlarni ajratib olish maqsadida o‘qitiladigan yordamchi model.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f1.jpg\" alt=\"1-rasm: Adolatlilik mezonlarini hisobga oluvchi raqib modelga qarshi interaktiv adolatlilik auditi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Adolatlilik mezonlarini hisobga oluvchi raqib modelga qarshi interaktiv adolatlilik auditi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f2.jpg\" alt=\"2-rasm: Guruh asosidagi pulni taqsimlash orqali interaktiv adolatlilik auditi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Guruh asosidagi pulni taqsimlash orqali interaktiv adolatlilik auditi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f3.jpg\" alt=\"3-rasm: Interaktiv adolatlilik auditi: sozlamalar va oʻzaro taʼsir protokoli.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Interaktiv adolatlilik auditi: sozlamalar va oʻzaro taʼsir protokoli.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f4.jpg\" alt=\"4-rasm: Cheklangan byudjet sharoitida koʻp guruhli adolatlilikni baholash xatosi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Cheklangan byudjet sharoitida koʻp guruhli adolatlilikni baholash xatosi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f5.jpg\" alt=\"5-rasm: DiamAudit usulining qoʻllaniladigan sharoitlardagi baholash xatosi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: DiamAudit usulining qoʻllaniladigan sharoitlardagi baholash xatosi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f6.jpg\" alt=\"6-rasm: Zondlar yordamida olingan tafovut ballari asosida belgilarni reytinglash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Zondlar yordamida olingan tafovut ballari asosida belgilarni reytinglash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f7.jpg\" alt=\"7-rasm: COMPAS maʼlumotlar toʻplamida oʻrganilgan zondlarning belgilari boʻyicha vizualizatsiyasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: COMPAS maʼlumotlar toʻplamida oʻrganilgan zondlarning belgilari boʻyicha vizualizatsiyasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f8.jpg\" alt=\"8-rasm: Student maʼlumotlar toʻplamida oʻrganilgan zondlarning belgilari boʻyicha vizualizatsiyasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Student maʼlumotlar toʻplamida oʻrganilgan zondlarning belgilari boʻyicha vizualizatsiyasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f9.jpg\" alt=\"9-rasm: k-ALeBi va ReconAudit usullarini taqqoslagan holda, auditorga oshkor qilingan individual model javoblari soni bi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm: k-ALeBi va ReconAudit usullarini taqqoslagan holda, auditorga oshkor qilingan individual model javoblari soni bilan oʻlchanadigan identifikatsiya sizib chiqishi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f10.jpg\" alt=\"10-rasm: k-ALeBi va DiamAudit ostida modelni chiqarib olish xulq-atvori: maqsadli modelga nisbatan surrogat modelning an\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm: k-ALeBi va DiamAudit ostida modelni chiqarib olish xulq-atvori: maqsadli modelga nisbatan surrogat modelning aniqligi va hujumchiga oshkor qilingan mutlaq yorliqlar soni.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f11.jpg\" alt=\"11-rasm: Hujayralar boʻyicha Robust k-ALeBi uchun mahalliy CGQ byudjeti hujum ehtimolligi funksiyasi sifatida.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-rasm: Hujayralar boʻyicha Robust k-ALeBi uchun mahalliy CGQ byudjeti hujum ehtimolligi funksiyasi sifatida.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f11-2.jpg\" alt=\"Rasm 11 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 11 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f13.jpg\" alt=\"13-rasm: Xususiyatlarga xos umumiy audit tizimi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;13-rasm: Xususiyatlarga xos umumiy audit tizimi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f14.jpg\" alt=\"14-rasm: Faol oʻqitish sharoitida chiziqli klassifikator uchun 2D qarshi misol: koʻk nuqtalar xi kovariatalarni, toʻq ra\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;14-rasm: Faol oʻqitish sharoitida chiziqli klassifikator uchun 2D qarshi misol: koʻk nuqtalar xi kovariatalarni, toʻq rangli chiziqlar esa hi klassifikatorlarini ifodalaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f15.jpg\" alt=\"15-rasm: Adolat auditi kontekstida Dasgupta (2004) qarshi misolining tasviri. Qizil nuqtalar birinchi himoyalangan guruh\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;15-rasm: Adolat auditi kontekstida Dasgupta (2004) qarshi misolining tasviri. Qizil nuqtalar birinchi himoyalangan guruhdan olingan namunalarni, yashil nuqtalar esa ikkinchi himoyalangan guruhdan olingan namunalarni ifodalaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f16.jpg\" alt=\"16-rasm: 1-belgi (oʻngda) va 2-belgi (chapda) uchun siljish maydonlari (bias canvases).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;16-rasm: 1-belgi (oʻngda) va 2-belgi (chapda) uchun siljish maydonlari (bias canvases).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f17.jpg\" alt=\"Rasm 17\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 17&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f18.jpg\" alt=\"Rasm 18\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 18&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qora&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qutilardagi&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tarafkashlik&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;xavfi&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=
