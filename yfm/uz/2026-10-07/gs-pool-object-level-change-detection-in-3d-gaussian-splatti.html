            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"101\" cy=\"177\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"659\" cy=\"167\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · CHANGE_DETECTION   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;GS-Pool: 3D-makonlardagi&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o'zgarishlarni aniqlashning&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yangi usuli&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f2.jpg\" alt=\"2-rasm. Bitta PASLCD katagida GS-Pool: har bir tashrif uchun distillangan DINOv3 maydoni (1), obʼektlarga birlashtirilga\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Bitta PASLCD katagida GS-Pool: har bir tashrif uchun distillangan DINOv3 maydoni (1), obʼektlarga birlashtirilgan SAM2 segmentlari (2), har bir primitiv uchun toʻrtta tashuvchi va sahnaning nol obʼekti (3), har bir obʼekt uchun bitta qaror (4), shuningdek oʻzgarishlar niqobi va oʻzgartirilgan primitivlar (5).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar 3D Gaussian Splatting yordamida yaratilgan sahnalardagi o'zgarishlarni aniqlash uchun GS-Pool usulini taqdim etdi. Bu yondashuv har bir pikselni emas, balki butun ob'ektlarni tahlil qiladi. Natijada, xonadagi o'zgarishlarni yoritish yoki kamera yo'nalishi o'zgargan taqdirda ham aniqroq aniqlash imkoniyati tug'iladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;GS-Pool 3D-primitivlarni ob'ektlarga birlashtiradi, bu esa o'zgarishlarni piksel emas, balki ob'ekt darajasida tahlil qilish imkonini beradi.&lt;/li&gt;\n&lt;li&gt;SAM2 maskalari va DINOv3 xususiyatlari rekonstruktsiyadagi tasodifiy xatolarni (drift) bartaraf etishga yordam beradi.&lt;/li&gt;\n&lt;li&gt;Usul PASLCD va CL-Splats ma'lumotlar to'plamida mavjud metodlardan 17-57% ga yuqori aniqlik ko'rsatadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"usullar-va-aniqlik\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#usullar-va-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va aniqlik&lt;/span&gt;&lt;/a&gt;Usullar va aniqlik&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Usul&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ma'lumotlar&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Aniqlik&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Cheklov&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;GS-Pool&lt;/td&gt;\n&lt;td&gt;PASLCD, CL-Splats&lt;/td&gt;\n&lt;td&gt;0.751 mIoU&lt;/td&gt;\n&lt;td&gt;Boshlang'ich 3DGS sifatiga bog'liq&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Usul 3D Gaussian Splatting (3DGS) texnologiyasiga asoslangan bo'lib, sahna 3D-gausslar to'plami sifatida ifodalanadi. Asosiy muammo — «drift» (rekonstruktsiyadagi tasodifiy farqlar). GS-Pool SAM2 segmentatsiya maskalarini birlashtirib, ob'ektlar hovuzini yaratadi. Tizim DINOv3 xususiyatlarini solishtiradi va o'qitishdagi xatolarni 3D-primitivlarga qaytaruvchi funksiyadan foydalanadi.&lt;/p&gt;\n&lt;p&gt;PASLCD ma'lumotlar to'plamida o'tkazilgan testlarda usul mIoU ko'rsatkichi bo'yicha 0.751 natijani qayd etdi. Bu eng kuchli muqobil usul bo'lgan GS-Diff'dan 17% ga yuqoridir. Algoritm ikkinchi suratga olish jarayoni tez va kamroq fotosuratlar bilan bajarilgan bo'lsa ham, yuqori aniqlikni saqlab qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul oldindan 3D-rekonstruktsiyani talab qiladi va SAM2 modelining segmentatsiya aniqligiga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Zavodlar yoki muzeylar kabi obyektlarni monitoring qilishda suratga olish bir necha oylik interval bilan amalga oshiriladi. 3D Gaussian Splatting (3DGS) usuli yordamida yaratilgan ikkita 3D-rekonstruksiyani solishtirish o‘qitishning stoxastik tabiati tufayli qiyin: hatto makonda o‘zgarishlar bo‘lmasa ham, modellar bir-biriga mos kelmaydi. Bundan tashqari, takroriy skanerlashlar ko‘pincha kamroq dastlabki ma’lumotlarni o‘z ichiga oladi. Mualliflar bir xil makonning ikkita mustaqil 3D-rekonstruksiyasi o‘rtasidagi o‘zgarishlarni avtomatik aniqlash uchun GS-Pool usulini taklif qilishadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3D Gaussian Splatting (3DGS) — bu sahnani millionlab kichik 3D-bulutlar (gausslar) to‘plami sifatida ifodalovchi renderlash usuli bo‘lib, u fotosuratlar asosida geometriyani tez va batafsil tiklash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Algoritm dastlabki fotosuratlardan olingan va 3D-gausslarga proyeksiyalanadigan SAM2 segmentatsiya maskalaridan foydalanadi. Bu qarorlarni 3D-makondagi obyektlar darajasida qabul qilish imkonini beradi. «Fotografik tashuvchi» (photographic carrier) tushunchasi kiritiladi: bir rekonstruksiya uchun 3DGS o‘qitishdagi yo‘qotish funksiyasi boshqa tashrif fotosuratlariga nisbatan hisoblanadi. Bu ma’lumotlar geometrik va rang parametrlari, shuningdek, DINOv3 orqali olingan belgilar bilan birlashtiriladi. Har bir sahna uchun o‘zgarish chegarasi ikkala tashrifda ham mavjud bo‘lgan obyektlar bilan solishtirish orqali aniqlanadi.&lt;/p&gt;\n&lt;p&gt;PASLCD ma’lumotlar to‘plamida GS-Pool usuli 0,751 mIoU va 0,846 F1 ko‘rsatkichlarini ko‘rsatdi. Solishtirish uchun, avvalgi eng yaxshi usul GS-Diff mos ravishda 0,644 va 0,758 natijani ko‘rsatdi, bu mIoU bo‘yicha 17% va F1 bo‘yicha 12% aniqlik o‘sishini anglatadi. Boshqa usullar (O-SCD, PlenoCI va MV-3DCD) bilan solishtirganda ustunlik 36% dan 57% gacha tashkil etdi. CL-Splats ma’lumotlar to‘plamida natija 0,855 mIoU ni tashkil etdi, bu MV-3DCD ko‘rsatkichidan 33% ga yuqori.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GS-Pool o‘zgarishlarni aniqlashning mavjud usullaridan ustun kelib, PASLCD da 0,751 mIoU va CL-Splats da 0,855 mIoU ga erishadi hamda inspektorga o‘zgartirilgan obyektlarning 3D-vizualizatsiyasini qaror asoslari bilan taqdim etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul SAM2 segmentatsiyasi sifati va 3D-rekonstruksiya aniqligiga tayanadi; tashriflar o‘rtasidagi dastlabki fotosuratlar sonidagi sezilarli farq bo‘lsa, samaradorlik o‘zgarishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"3d-rekonstruksiyalardagi-ozgarishlarni-aniqlash\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#3d-rekonstruksiyalardagi-ozgarishlarni-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3D-rekonstruksiyalardagi oʻzgarishlarni aniqlash&lt;/span&gt;&lt;/a&gt;3D-rekonstruksiyalardagi oʻzgarishlarni aniqlash&lt;/h4&gt;\n&lt;p&gt;Turli vaqtlarda tasvirga olingan makonda oʻzgarishlarni aniqlash vazifasi yoritish, rakurslar va 3D Gaussian Splatting (3DGS) oʻqitilishining tasodifiy tabiati tufayli murakkablashadi. Bir joyning ikkita mustaqil rekonstruksiyasi hech qachon mukammal mos kelmagani uchun «drift» (siljish) yuzaga keladi — bu haqiqiy oʻzgarishlar bilan bogʻliq boʻlmagan farqdir. GS-Diff kabi mavjud usullar bu muammoni alohida primitivlar (3D-sahna elementar zarrachalari) darajasida hal qilishga urinadi va qaror qabul qilish uchun 0,5 qiymatidagi qatʼiy chegaradan foydalanadi. Bu xatolarga olib keladi, chunki bitta obyekt minglab primitivlardan iborat boʻlishi mumkin va chegara kontekstni hisobga olmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GS-Pool usuli qaror qabul qilishni alohida primitivlar darajasidan butun obyektlar darajasiga oʻtkazadi, buning uchun SAM2 maskalari va asl fotosuratlar orqali tekshiruvdan foydalaniladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3D Gaussian Splatting (3DGS) — 3D-saҳnani istalgan rakursdan vizualizatsiya qilish mumkin boʻlgan millionlab mayda «gauss» bulutlari toʻplami sifatida ifodalash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar SAM2 (Segment Anything Model 2) maskalari yordamida primitivlarni obyektlarga birlashtiruvchi GS-Pool usulini taklif qilishadi. Oʻzgarishlarni tasdiqlash uchun «fotosurat tashuvchisi»dan foydalaniladi: 3DGS rekonstruksiyasini boshqa tashrif fotosuratlari asosida oʻqitishdagi xatolik funksiyasi. Agar obyekt oʻzgargan boʻlsa, xatolik yuqori boʻladi. Shuningdek, primitivlarga fundamental modeldan olingan semantik maydon kiritiladi, bu esa geometriya va rang oʻxshash boʻlsa ham obyektlarni farqlashga yordam beradi. Oʻzgarish chegarasi har bir sahna uchun individual ravishda, har ikki tashrifda ham mavjud boʻlgan obyektlar taqsimoti asosida kalibrlanadi.&lt;/p&gt;\n&lt;h4 id=\"bogliq-ishlar\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#bogliq-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bogʻliq ishlar&lt;/span&gt;&lt;/a&gt;Bogʻliq ishlar&lt;/h4&gt;\n&lt;p&gt;Anʼanaviy oʻzgarishlarni aniqlash usullari 2D-tasvirlar fazosida ishlaydi va juftlikdagi suratlarni piksel yoki superpiksel darajasida solishtiradi. Zamonaviy yondashuvlar oldindan oʻqitilgan fundamental modellardan foydalanadi, biroq ularning aniqligi cheklangan (masalan, CYWS-2D usuli PASLCD maʼlumotlar toʻplamida 0,273 mIoU ga erishadi).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Koʻpgina 2D-usullar faqat tasvirlar juftligini solishtirish bilan cheklanadi, bu esa sahnaning hajmli tuzilishini samarali hisobga olishga imkon bermaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MV-3DCD va O-SCD kabi 3D-yondashuvlarda oʻzgarishlar 2D-xaritalarning 3D-primitivlarga proyeksiyalari orqali baholanadi. GS-Diff rekonstruksiya driftini modellashtiruvchi eng yaqin analog hisoblanadi. Ulardan farqli oʻlaroq, GS-Pool ikki tomonlama tekshiruvdan foydalanadi (oʻqitishdagi xatolik rasterizator orqali har ikki rekonstruksiya primitivlariga oʻtkaziladi) va maʼlumotlarni alohida primitivlar emas, balki obyektlar darajasida jamlaydi. PlenoCI usuli ham oʻzgarishlarni tahlil qiladi, biroq PASLCD maʼlumotlar toʻplamida zamonaviy yechimlarga nisbatan pastroq natijalarni koʻrsatadi.&lt;/p&gt;\n&lt;h4 id=\"obyekt-darajasidagi-ozgarishlarni-aniqlash\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#obyekt-darajasidagi-ozgarishlarni-aniqlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Obyekt darajasidagi oʻzgarishlarni aniqlash&lt;/span&gt;&lt;/a&gt;Obyekt darajasidagi oʻzgarishlarni aniqlash&lt;/h4&gt;\n&lt;p&gt;Oʻzgarishlarni aniqlashning mavjud usullari koʻpincha alohida piksellar yoki primitivlar darajasida qaror qabul qiladi. SceneDiff usuli sahnani obyektlar darajasida tahlil qiladi va takroriy tashriflarda obyekt identifikatsiyasini saqlab qolgan holda videokliplar juftligidan foydalanadi. Tizim chuqurlik va toʻgʻridan-toʻgʻri tarqalish neyrotarmogʻi tomonidan bashorat qilingan pozalardan foydalangan holda bir-birining ustiga tushadigan kadrlar uchun asosiy modellardan olingan belgilarni solishtiradi va toʻliq rekonstruksiyani qurmasdan har bir kadr uchun niqob chiqaradi. GS-Pool usuli esa ikki mustaqil yaratilgan rekonstruksiyani solishtiradi va oʻzgargan obyektlarni primitivlar toʻplami sifatida ajratib koʻrsatadi. SceneDiff'dan farqli oʻlaroq, u tayyor 3D-modellar bilan ishlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SceneDiff maskalar yaratish uchun video oqimlarni tahlil qilsa, GS-Pool oʻzgarishlarni primitivlar darajasida aniqlash uchun ikki mustaqil 3D-rekonstruksiyani solishtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Turli vaqt davrlaridagi modellarni solishtirish ilgari nuqtalar bulutlari, robototexnika xaritalari va fotosuratlarni shahar modellari bilan solishtirishda qoʻllanilgan. Gauss splatlari (Gaussian splats) kontekstida tadqiqotlar koʻpincha mavjud modellarni yangilash yoki oʻzgarishlar boʻlmaganda ularni roʻyxatdan oʻtkazishga qaratilgan. SLAM asosidagi usullar faqat geometriyani solishtiradi, xarita asosidagi yondashuvlar esa robot joyga qaytganida bitta xaritani yangilaydi. Splatlarni yangilash usullari oʻzgarishlarni mahalliylashtiradi, GS-Pool esa ikki mustaqil rekonstruksiyani solishtiradi.&lt;/p&gt;\n&lt;p&gt;Semantik maydonlar koʻpincha tahrirlash va segmentatsiyani qoʻllab-quvvatlash uchun neyron nurlanish maydonlari va Gauss splatlariga integratsiya qilinadi. Ushbu ishda DINOv3 (ViT-L/16) belgilari gaussiyalar parametrlari oʻzgarmas holda har bir rekonstruksiyaga distillanadi. Ushbu belgilar oʻzgarishlarning dalillaridan biri boʻlib xizmat qiladi, SAM2 modeli esa fotosuratlarni obyekt maskalariga segmentatsiya qilish uchun ishlatiladi.&lt;/p&gt;\n&lt;p&gt;PASLCD kabi mavjud benchmarklar barqaror va oʻzgaruvchan yorugʻlik sharoitida olingan beshta ichki va beshta tashqi sahnani oʻz ichiga oladi. Har bir maʼlumotlar toʻplami 50 dan 109 tagacha mos yozuvlar fotosuratlarini va 25 ta test koʻrinishini oʻz ichiga oladi. CL-Splats'da beshta real sahna obyektlar oʻzgartirilgan holda ikki marta suratga olingan, ammo tayyor maskalar yoʻqligi sababli mualliflar ularni qoʻlda belgilab chiqqanlar.&lt;/p&gt;\n&lt;h4 id=\"3-usul\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#3-usul\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Usul&lt;/span&gt;&lt;/a&gt;3. Usul&lt;/h4&gt;\n&lt;p&gt;GS-Pool bir xil kameraga ega boʻlgan bir fazoning ikkita mustaqil rekonstruksiya qilingan Gauss maydonini (GT₁ va GT₂) qabul qiladi va oʻzgargan obyektlarni ularning maskalari bilan birga qaytaradi. Maʼlumotlarni qayta ishlash jarayoni beshta ketma-ket bosqichdan iborat boʻlib, bu har bir qarorning asosini kuzatish imkonini beradi (Rasm 2). T₁ tashrifi mos yozuvlar, T₂ esa oʻzgarishlar xaritasini baholash uchun maqsadli tashrif hisoblanadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f2.jpg\" alt=\"2-rasm. Bitta PASLCD katagida GS-Pool: har bir tashrif uchun distillangan DINOv3 maydoni (1), obʼektlarga birlashtirilga\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. Bitta PASLCD katagida GS-Pool: har bir tashrif uchun distillangan DINOv3 maydoni (1), obʼektlarga birlashtirilgan SAM2 segmentlari (2), har bir primitiv uchun toʻrtta tashuvchi va sahnaning nol obʼekti (3), har bir obʼekt uchun bitta qaror (4), shuningdek oʻzgarishlar niqobi va oʻzgartirilgan primitivlar (5).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gauss splatlari (3DGS) — bu 3D-sahnani murakkab tasvirlarni tezda render qilish imkonini beruvchi millionlab kichik ellipsiodlar (primitivlar) toʻplami sifatida ifodalash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"3d-dagi-qarorlar\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#3d-dagi-qarorlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3D-dagi qarorlar&lt;/span&gt;&lt;/a&gt;3D-dagi qarorlar&lt;/h4&gt;\n&lt;p&gt;GS-Pool primitivlardan tashkil topgan obyektlarni tasniflaydi. Fotosuratlar segmentlarni, ularni kuzatish maʼlumotlarini va 3D-fazoda taklif qilingan oʻzgarishlarni tasdiqlovchi yoki rad etuvchi vizual dalillarni taqdim etadi. Yakuniy maska oʻzgargan obyektlarning tanlangan primitivlarini render qilish orqali shakllanadi. Kirish maʼlumotlari sifatida standart 3DGS yoki FastPGSR usullari yordamida oʻzgartirishlarsiz yaratilgan rekonstruksiyalar ishlatiladi.&lt;/p&gt;\n&lt;h4 id=\"31-1-bosqich-distillangan-semantik-maydon\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#31-1-bosqich-distillangan-semantik-maydon\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1. 1-bosqich: distillangan semantik maydon&lt;/span&gt;&lt;/a&gt;3.1. 1-bosqich: distillangan semantik maydon&lt;/h4&gt;\n&lt;p&gt;Har bir primitivga semantik deskriptor biriktiriladi. DINOv3 (ViT-L/16) belgilari buzilmagan tasvirlardan olinadi, PCA yordamida D=32 oʻlchamgacha qisqartiriladi va primitivlarga distillanadi. Har bir primitiv uchun &lt;span class=\"yfm-latex\" data-content=\"f_i%20%5Cin%20%5Cmathbb%7BR%7D%5E%7B32%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; belgi vektori rang kabi alfa-kompozitsiya yordamida render qilinadi va barcha koʻrinishlardagi belgi yamoqlariga mos kelishi uchun optimallashtiriladi. Rekonstruksiyaning oʻzi (gaussiyalarning pozitsiyalari, masshtablari, aylanishlari, shaffofligi va rangi) oʻzgarishsiz qoladi, faqat belgi vektorlari optimallashtiriladi. PCA har ikkala tashrif uchun bir vaqtning oʻzida sozlanadi, bu ularning belgilarini yagona fazoda solishtirish imkonini beradi.&lt;/p&gt;\n&lt;h4 id=\"32-2-bosqich-obyektlar-hovuzini-shakllantirish\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#32-2-bosqich-obyektlar-hovuzini-shakllantirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2. 2-bosqich: obyektlar hovuzini shakllantirish&lt;/span&gt;&lt;/a&gt;3.2. 2-bosqich: obyektlar hovuzini shakllantirish&lt;/h4&gt;\n&lt;p&gt;Ushbu bosqichda primitivlar (sahna bazaviy elementlari) obyektlarga birlashtiriladi. SAM2 algoritmi har bir tashrif fotosuratlarini segmentlarga ajratib, obyekt maskalarini aniqlaydi. Ma’lumotlar taqqoslanishi uchun ikki tashrifdagi fotosuratlar soni tenglashtiriladi: ko‘proq suratga ega tashrif ikkinchisi darajasigacha sub-diskretizatsiya qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SAM2 (Segment Anything Model 2) — tasvir va videolardagi obyekt chegaralarini ajratib olishga qodir neyron tarmoq modeli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Maskalar primitivlarga proyeksiya qilinadi. Primitiv obyektga biriktiriladi, agar u vizuallashtirilayotgan sirtda joylashgan bo‘lsa (chuqurlikdagi farq &lt;span class=\"yfm-latex\" data-content=\"%2Fe_i(%5Cell)%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; og‘ishlar medianasining uch barobaridan oshmasa) va primitiv og‘irligining kamida yarmi (1)-formulaga ko‘ra obyekt maskasiga tushsa.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Primitiv sirtga mos kelsa va renderlash og‘irligining 50% dan ortig‘i obyekt maskasi ichida bo‘lsa, u obyektga biriktiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Obyekt treklari bir xil identifikatorga ega segmentlarni birlashtirish orqali hosil qilinadi. Agar treklar kesishsa (IoU(A, B) ≥ 0.2), ular bitta obyektga birlashadi. Agar primitiv bir nechta obyektga da’vo qilsa, u renderlash og‘irligi eng yuqori bo‘lgan obyektga biriktiriladi (kamida ikkita kalit kadrda tasdiqlanishi shart). Umumiy «qoplangan» primitivlar hajmining yarmidan ko‘pini egallagan obyektlar (odatda devor yoki pol) fon deb hisoblanadi va o‘chiriladi. Obyekt tahlil uchun yaroqli (poolable) hisoblanadi, agar uning hajmi hovuzdagi obyektlar o‘lchamlarining quyi kvartili va 2W oralig‘ida bo‘lsa (3-formula).&lt;/p&gt;\n&lt;h4 id=\"33-3-bosqich-ozgarishlarning-tortta-tashuvchisi\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#33-3-bosqich-ozgarishlarning-tortta-tashuvchisi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3. 3-bosqich: o‘zgarishlarning to‘rtta tashuvchisi&lt;/span&gt;&lt;/a&gt;3.3. 3-bosqich: o‘zgarishlarning to‘rtta tashuvchisi&lt;/h4&gt;\n&lt;p&gt;Har bir primitiv uchun [0, 1] diapazonida o‘zgarishlarning to‘rtta ko‘rsatkichi («tashuvchilar») hisoblanadi. Uchtasi ikki primitiv to‘plami o‘rtasidagi geometriya, rang va semantikani solishtirishga asoslangan, to‘rtinchisi esa boshqa tashrif fotosuratlarini tahlil qilishga asoslangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bir xil sahnaning ikkita rekonstruksiyasi hech qachon mukammal mos kelmagani uchun, algoritm tabiiy «drift» (siljish)ni hisobga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Drift boshqa tashrifdagi eng yaqin primitivgacha bo‘lgan masofaning yuqori kvartili sifatida baholanadi. U ikki qismga bo‘linadi: u_n (sirt normali bo‘ylab) va u_t (sirt ichida). Bu qiymatlar primitivning pozitsion noaniqligi bilan birga &lt;span class=\"yfm-latex\" data-content=\"%5CSigma_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; kovariatsion matritsani solishtirish yadrolarida qo‘llaniladigan $ ilde{\\Sigma}_i$ ga qadar kengaytiradi.&lt;/p&gt;\n&lt;h4 id=\"search-ball\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#search-ball\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Search ball&lt;/span&gt;&lt;/a&gt;Search ball&lt;/h4&gt;\n&lt;p&gt;Ikki xil vaqtda olingan tasvirlardagi primitivlarni (3D-sahna elementlarini) solishtirish uchun «qidiruv shari» B(i) qoʻllanadi. U qoʻshnilarni qidirishni primitiv kovariatsiyasining uchta standart chetlanishi doirasida cheklaydi. k parametri hududdagi primitivlarning median soni sifatida belgilanadi, bu esa zich va siyrak joylarni solishtirishda adolatli natija beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qidiruv shari — bu zich joylashgan detallar (masalan, kitob javoni) va boʻsh devorlar oʻrtasidagi qidiruv imkoniyatlarini tenglashtiruvchi &lt;a href=\"concepts/normalizatsiya.html\"&gt;normallashtirish&lt;/a&gt; usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Geometrik tafovut δgeo^i qoʻshnilarning joylashuvi va shakli oʻxshashligi orqali baholanadi. Rang tafovuti δcol^i esa obyekt hajmiga qarab oʻzgaruvchi σcol shkalasini hisobga oladi. Semantik tahlil (4a, 4b-tenglamalar) har bir oʻlcham uchun alohida shkala boʻyicha distillangan belgilarni qoʻllaydi. Bu PCA komponentlarining sahnada turlicha boʻlishi sababli muhimdir, aks holda kichik obyektlar koʻrinmay qolishi mumkin.&lt;/p&gt;\n&lt;p&gt;Fotografik tashuvchi δpho^i (5a, 5b, 6-tenglamalar) model renderini boshqa sessiyadagi haqiqiy fotosuratlar bilan solishtiradi. Xatolik L₁ (rang xatosi) va DSSIM (tuzilmaviy nomutanosiblik) kombinatsiyasi orqali hisoblanadi. Rasterizator orqali teskari tarqalish (backpropagation) yordamida okklyuziyalar (toʻsiqlar) hisobga olinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fotografik tashuvchi eng muhim komponent: FastPGSR toʻplamida uni olib tashlash aniqlikni 12,9%, oddiy 3DGS uchun esa 20,5% ga kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"empirical-null\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#empirical-null\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Empirical null&lt;/span&gt;&lt;/a&gt;Empirical null&lt;/h4&gt;\n&lt;p&gt;Oʻzgarmas obyektlarning tafovut darajasi suratga olish sharoitlariga bogʻliq boʻlgani uchun mualliflar «empirik nol» (Nprim va Nobj) tushunchasini kiritadilar. Bu ikkala sessiyada ham mavjud boʻlgan va oʻzgarmas deb hisoblanadigan primitivlar toʻplamidir (7a, 7b-tenglamalar). Bu har bir sahna uchun oʻzgarishlarni aniqlash chegaralarini kalibrlashga yordam beradi. 3-rasmda koʻrsatilishicha, joyida oʻzgargan obyektlar (masalan, boʻshatilgan stakan) uchun geometrik va rang belgilari samarasiz, ammo fotografik tashuvchi ularni aniqlashga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Empirik nol» usuli ikkala sessiyada mavjud obyektlarni oʻzgarmas deb qabul qiladi, biroq joyida oʻzgargan obyektlar xatolik bilan «nol» toʻplamiga kirib qolishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obyektlar-reytingi\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#obyektlar-reytingi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Obyektlar reytingi&lt;/span&gt;&lt;/a&gt;Obyektlar reytingi&lt;/h4&gt;\n&lt;p&gt;Mualliflar oʻzgarishlarni baholash uchun toʻrt turdagi belgilardan (tashuvchilardan) foydalanadilar: rang, geometriya, fotometrik maʼlumotlar va semantika. Har bir belgi nisbiy statistikaga aylantiriladi: primitiv qiymati oʻsha tashrif doirasidagi «nol» (oʻzgarmagan) primitivlar orasidagi rang bilan almashtiriladi. Obyektning yakuniy rangi R_c(o) uning primitivlari ranglarining oʻrtacha qiymati sifatida hisoblanadi (8-formula). Bu Mann-Uitni statistikasining normallashtirilgan koʻrinishi boʻlib, obyekt belgisining «nol» obyektnikidan kattaroq boʻlish ehtimolini koʻrsatadi. 0,5 dan yuqori qiymatlar oʻzgarishlar mavjudligini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;R_c(o) statistikasi koʻplab primitivlar maʼlumotlarini birlashtirishga imkon beradi, bunda 0,5 dan yuqori qiymatlar obyektning oʻzgarganligini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Qaror qabul qilish uchun «yadro» (core) ishlatiladi, u obyektni boshqa tashrifdagi «nol» obyektlar bilan solishtiradi. Toʻrt xil rang Fisher statistikasi yordamida birlashtiriladi (9b-formula), u χ² taqsimotiga amal qiladi. Belgilar oʻrtasidagi bogʻliqlikni hisobga olish uchun Braun tuzatishi qoʻllanadi (10-formula). Agar yakuniy qiymat θ chegarasidan oshsa, obyekt oʻzgargan deb belgilanadi. Ushbu yadro mIoU koʻrsatkichi boʻyicha avvalgi usullardan ustun turadi (2-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Fisher statistikasi bu yerda mustaqil ehtimolliklar (ranglar)ni yagona ahamiyatlilik koʻrsatkichiga jamlash uchun ishlatiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fotografik-kuzatuv\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#fotografik-kuzatuv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fotografik kuzatuv&lt;/span&gt;&lt;/a&gt;Fotografik kuzatuv&lt;/h4&gt;\n&lt;p&gt;«Yadro» rekonstruksiyaga tayanganligi sababli, u primitivlar siljishi yoki ularning kamligi tufayli xatoliklarga yoʻl qoʻyishi mumkin. Shuning uchun mualliflar obyektni fotosuratlar orqali bevosita tekshiradilar. Buning uchun obyekt kameraga proyeksiya qilinadi va «&lt;a href=\"concepts/trace.html\"&gt;iz»&lt;/a&gt; (footprint) — obyektga tegishli piksellar toʻplami hisoblanadi. Agar ushbu izdagi oʻrtacha fotometrik xatolik butun surat boʻyicha xatolikning 95-persentilidan oshsa, fotosurat ushbu obyekt uchun «issiq» (hot) deb hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul proyeksiya sifatiga bogʻliq: agar obyekt boshqa elementlar bilan toʻsilgan boʻlsa, piksellar hisobga olinmaydi, bu esa baholash aniqligini pasaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikki metrika kiritiladi: &lt;span class=\"yfm-latex\" data-content=\"%5Ceta(o)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — «issiq» fotosuratlar ulushi va γ(o) — obyektning oʻrtacha xatoligi suratdagi boshqa obyektlarning median xatoligidan yuqori boʻlgan fotosuratlar ulushi (11, 12-formulalar). Bu faqat kadrga koʻp tushadigan obyektlar uchun bahoni oshirib yuborishdan saqlaydi.&lt;/p&gt;\n&lt;h4 id=\"qaror-qabul-qilish-qoidasi\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#qaror-qabul-qilish-qoidasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qaror qabul qilish qoidasi&lt;/span&gt;&lt;/a&gt;Qaror qabul qilish qoidasi&lt;/h4&gt;\n&lt;p&gt;Yakuniy qaror yadro va fotometrik koʻrsatkichlarni birlashtiradi. Tizim uchta shartdan foydalanadi: «kvorum» (ranglar muvofiqligini tekshirish), «qabul qilish» (admit) va «rad etish» (reject). Obyekt qabul qilingan va rad etilmagan boʻlsa, u oʻzgargan deb topiladi. Qoidalar murakkab holatlarni qayta ishlashga imkon beradi: kichik obyektlar, primitivlari siljigan obyektlar va past kontrastli obyektlar (ularni yuqori semantik rang qutqaradi).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kombinatsiyalangan yondashuv (yadro + foto-statistika) oʻzgarishlarni aniqlash aniqligini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"35-5-bosqich-ozgartirilgan-primitivlar-va-niqoblar\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#35-5-bosqich-ozgartirilgan-primitivlar-va-niqoblar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5. 5-bosqich: oʻzgartirilgan primitivlar va niqoblar&lt;/span&gt;&lt;/a&gt;3.5. 5-bosqich: oʻzgartirilgan primitivlar va niqoblar&lt;/h4&gt;\n&lt;p&gt;Oʻzgartirilgan obyektning chegarasi kamida bitta tashuvchida Nprim ning 95-persentilidan (Q0.95) oshib ketadigan qoplovchi primitivlar toʻplami sifatida aniqlanadi: &lt;span class=\"yfm-latex\" data-content=\"E(o)%20%3D%20%5C%7Bi%20%5Cin%20o_v%20%3A%20%5Cexists%20c%2C%20x_i%5Ec%20%3E%20Q_%7B0.95%7D%5C%7Bx_j%5Ec%5C%7D_%7Bj%20%5Cin%20N_%7Bprim%7D%7D%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Ushbu chegaralar oʻzgarishlar niqobini hosil qilish uchun har bir test koʻrinishiga proyeksiya qilinadi. Barcha qoplovchi primitivlardan foydalanish mIoU koʻrsatkichini pasaytiradi, chunki obyektning primitivlar toʻplamiga u tegib turgan, lekin oʻzgarmagan yuzalar ham kirib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oʻzgarishlar sohasini 95-persentil orqali aniqlash oʻzgarmas fon yuzalarini chiqarib tashlash va niqoblash aniqligini oshirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"41-sozlash\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#41-sozlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1. Sozlash&lt;/span&gt;&lt;/a&gt;4.1. Sozlash&lt;/h4&gt;\n&lt;p&gt;Metod PASLCD maʼlumotlar toʻplamidagi 20 ta sahna va CL-Splats annotatsiyalari asosida sinovdan oʻtkazildi. Har bir konfiguratsiya uchun har bir tashrifning uchta mustaqil rekonstruksiyasi amalga oshirildi (jami jadvalning har bir qatori uchun 60 ta, jami 240 ta yugurish). Ikki turdagi «trener» (detektor): FastPGSR va standart 3DGS baholandi. Kadrlar ikki usulda birlashtirildi: «qoʻshma» (joint frame) va «bogʻlangan» (anchored frame). RTX 4090 grafik kartasida bitta yugurishni qayta ishlash vaqti FastPGSR uchun 2,1 daqiqa va 3DGS uchun 5,7 daqiqani tashkil etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;mIoU (mean Intersection over Union) — segmentatsiya aniqligini baholovchi metrika: qiymat 1 ga qanchalik yaqin boʻlsa, oʻzgarishlar niqobi haqiqiy obyekt bilan shunchalik aniq mos keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"42-natijalar\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#42-natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Natijalar&lt;/span&gt;&lt;/a&gt;4.2. Natijalar&lt;/h4&gt;\n&lt;p&gt;Qoʻshma kadrda GS-Pool mIoU boʻyicha oldingi metodlardan 17% (FastPGSR) va 12% (3DGS) ga ustunlik qiladi. Natijalar barqaror: rekonstruksiya urugʻlari (seeds) boʻyicha oʻrtacha qiymatlarning standart ogʻishi 1,7% dan oshmaydi. FastPGSR 3DGS dan 4,3% yuqori natija koʻrsatadi. CL-Splats maʼlumotlar toʻplamida GS-Pool MV-3DCD dan 33–35% va O-SCD dan 35–37% ga ustun keladi. Murakkabroq PASLCD toʻplamida PlenoCI ustidan ustunlik 40% ga yetadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Metod rekonstruksiya sifati va SAM2 modeli ishiga bogʻliq: agar obyekt SAM2 tomonidan segmentatsiya qilinmagan boʻlsa, keyingi bosqichlar uning oʻzgarishlarini tiklay olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-cheklovlar\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#5-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Cheklovlar&lt;/span&gt;&lt;/a&gt;5. Cheklovlar&lt;/h4&gt;\n&lt;p&gt;GS-Pool ishi bevosita maʼlumotlarni olish sifatiga bogʻliq. Yorugʻlikning oʻzgarishi notoʻgʻri signallarni keltirib chiqarishi mumkin, garchi GS-Pool MV-3DCD va O-SCD ga qaraganda kamroq notoʻgʻri piksellarni qayd etsa ham. Distillangan maydonlar va boshqa tashrif kameralaridan proyeksiyalardan foydalanish primitivlar toʻplamini oddiy taqqoslashga qaraganda hisoblash xarajatlarini oshiradi.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"gs-pool-usulining-natijalari-va-samaradorligi\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#gs-pool-usulining-natijalari-va-samaradorligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GS-Pool usulining natijalari va samaradorligi&lt;/span&gt;&lt;/a&gt;GS-Pool usulining natijalari va samaradorligi&lt;/h4&gt;\n&lt;p&gt;GS-Pool usuli ikkita mustaqil 3DGS (3D Gaussian Splatting) rekonstruksiyasi oʻrtasidagi oʻzgarishlarni obyektlar darajasida aniqlaydi. Algoritm har bir primitiv uchun toʻrt turdagi deskriptorni hisoblaydi: geometrik, rang, semantik va fotografik (oxirgisi rasterizator orqali teskari tarqalish usuli bilan oʻtkaziladi). Shundan soʻng, har bir obyekt boshqa tashrifdagi «nol» obyektlar bilan solishtiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GS-Pool PASLCD maʼlumotlar toʻplamida 0,7509 mIoU va 0,8461 F1 koʻrsatkichiga erishadi, bu avvalgi eng yaxshi natijalardan 17% yuqoridir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikki oʻquv moduli, ikki kamera kadr va uchta rekonstruksiya uchun yagona konfiguratsiyadan foydalanilganda, usul yuqori aniqlikni koʻrsatadi. CL-Splats maʼlumotlar toʻplamida koʻrsatkichlar FastPGSR uchun 0,855 mIoU va standart 3DGS uchun 0,865 mIoU ni tashkil etdi. Turli yoritish sharoitidagi oʻzgarmas sahnaning ikkita tasvirini solishtirganda, GS-Pool MV-3DCD va O-SCD usullariga qaraganda kamroq notoʻgʻri oʻzgarishlarni qayd etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;mIoU (mean Intersection over Union) — bashorat qilingan oʻzgarishlar sohasi va haqiqiy soha oʻrtasidagi moslik darajasini koʻrsatuvchi metrika, bunda 1.0 toʻliq moslikni anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Algoritm natijasi har bir tashrif uchun obyektlar toʻplami boʻlib, unda har bir element uchun oʻzgarish toʻgʻrisidagi qaror va tegishli dalillar keltiriladi. Oʻzgartirilgan primitivlar rekonstruksiyalardan birining ustida 3DGS qatlami sifatida vizuallashtiriladi. Tahlilni alohida primitivlardan butun obyektlarga oʻtkazish kelajakda har bir obyekt bilan sodir boʻlgan oʻzgarishlar turini tasniflash imkonini beradi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f5.jpg\" alt=\"5-rasm. Porch sahnasining hech bir kamera tomonidan olinmagan nuqtai nazardan 3D koʻrinishi. Har bir tashrifning oʻzgart\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. Porch sahnasining hech bir kamera tomonidan olinmagan nuqtai nazardan 3D koʻrinishi. Har bir tashrifning oʻzgartirilgan primitivlari oʻz rekonstruktsiyasida, qolganlari esa kulrang rangda koʻrsatilgan: T1 dan ikkita stul va krujka (a), T2 dan stul va uning stolidagi obʼektlar (b).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f6.jpg\" alt=\"6-rasm. Toʻrtta kvantil konstantasi, ularning har biri qolgan uchtasi oʻzgarmas holda oʻzgartirilgan.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. Toʻrtta kvantil konstantasi, ularning har biri qolgan uchtasi oʻzgarmas holda oʻzgartirilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm. Toʻrtta kvantil konstantasi, ularning har biri qolgan uchtasi oʻzgarmas holda oʻzgartirilgan. Har bir qoʻshma kadr qatorining 60 ta aʼzosi boʻyicha oʻrtacha mIoU. Uzuk chiziq: tanlangan qiymat. Nuqtali chiziq: qaror qabul qiluvchi orakul (G ilovasi).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f7.jpg\" alt=\"Rasm 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f9.jpg\" alt=\"9-rasm. Eng koʻp izohlangan oʻzgarishlarga ega boʻlgan barcha beshta CL-Splats sahnasi, 22-seed (boshlangʻich qiymat) bi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm. Eng koʻp izohlangan oʻzgarishlarga ega boʻlgan barcha beshta CL-Splats sahnasi, 22-seed (boshlangʻich qiymat) bilan ikkala oʻqituvchi, koʻrinishning IoU va sahnaning uchta seed boʻyicha mIoU koʻrsatkichlari bilan belgilangan (FastPGSR / oddiy 3DGS).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f10.jpg\" alt=\"10-rasm. Toʻrtta konfiguratsiya uchun har bir katak boʻyicha mIoU: ustun seed oʻrtacha qiymatiga, «moʻylovlar» seed diap\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm. Toʻrtta konfiguratsiya uchun har bir katak boʻyicha mIoU: ustun seed oʻrtacha qiymatiga, «moʻylovlar» seed diapazoniga, nuqtalar esa alohida seed qiymatlariga toʻgʻri keladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f10-2.jpg\" alt=\"Rasm 10 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 10 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f11.jpg\" alt=\"11-rasm. Eng koʻp izohlangan oʻzgarishlarga ega koʻrinishdagi 1–10-yachaykalar (Cantinaʼdan Meetingroomʼgacha), birlasht\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-rasm. Eng koʻp izohlangan oʻzgarishlarga ega koʻrinishdagi 1–10-yachaykalar (Cantinaʼdan Meetingroomʼgacha), birlashtirilgan kadr, seed 22, koʻrinishning IoU va yachaykaning uchta seed boʻyicha mIoU qiymatlari bilan belgilangan (FastPGSR / vanilla 3DGS).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f12.jpg\" alt=\"12-rasm. 11–20-yachaykalar (Playgroundʼdan Zenʼgacha), 11-rasmdagidek.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;12-rasm. 11–20-yachaykalar (Playgroundʼdan Zenʼgacha), 11-rasmdagidek.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#ta
