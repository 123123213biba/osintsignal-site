        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"90\" cy=\"61\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"610\" cy=\"297\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · PLATFORMS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Nega soxta fan haqidagi&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;videolarda odamlar bir-&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;birini ko'proq qo'llab-&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;quvvatlaydi?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f1.jpg\" alt=\"Tadqiqotda foydalanilgan videolar korpusini olish jarayonining ish oqimi tasviri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Tadqiqotda foydalanilgan videolar korpusini olish jarayonining ish oqimi tasviri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar sog'liqni saqlash mavzusidagi videolarning izohlar qismini tahlil qilib, ilmiy va soxta ilmiy hamjamiyatlarning muloqot uslubini solishtirishdi. Ilmiy videolarda davolash usullari va tanqidiy fikrlar ustunlik qilsa, soxta fan videolarida minnatdorchilik va hissiy qo'llab-quvvatlash asosiy o'rinda turadi. Bu natijalar nima uchun faktlar ko'pincha hissiy bog'liqlik oldida ojiz qolishini tushuntiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ilmiy muhokamalar tanqidiy fikr almashish va tibbiy maslahat so'rashga qaratilgan.&lt;/li&gt;\n&lt;li&gt;Soxta ilmiy hamjamiyatlar hissiy qo'llab-quvvatlash va guruh ichidagi yaqinlik hissi bilan ajralib turadi.&lt;/li&gt;\n&lt;li&gt;Jarayonlarni tahlil qilish usuli onlayn muloqotdagi yashirin xulq-atvor modellarini ochib beradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Mualliflar 2011-2025 yillar oralig'idagi 52 412 ta izohni tahlil qilish uchun process mining (jarayonlarni tahlil qilish) va tarmoq tahlili usullaridan foydalanishdi. Videolar katta til modellari (&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;) yordamida «ilmiy» (20 387 ta izoh) va «soxta ilmiy» (32 025 ta izoh) toifalarga ajratildi. Ma'lumotlar YouTube API orqali yig'ilib, NLP (tabiiy tilni qayta ishlash) yordamida hissiyotlar va mavzular bo'yicha tasniflandi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatdiki, ilmiy muhokamalarda salbiy baholar va tibbiy maslahat so'rash ustunlik qiladi. Soxta ilmiy guruhlarda esa «ijtimoiy-hissiy bog'lanish» — minnatdorchilik, maqtovlar va emojilar orqali muloqot qilish asosiy o'rinni egallaydi. Bu jarayon foydalanuvchilar o'rtasida guruhga mansublik hissini kuchaytiradi va ularni faktlarga asoslangan tanqidga qarshi himoyalangan «echo chamber» (aks-sado kamerasi) ichida saqlab qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat ispan tilidagi videolar bilan cheklangan va YouTube tavsiya algoritmlarining ta'sirini hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning to'liq tarjimasi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ijtimoiy tarmoqlarda tibbiy noto‘g‘ri maʼlumotlarning tarqalishi&lt;br /&gt;\nSo‘nggi o‘n yilliklarda raqamli media muhiti sog‘liqni saqlash bo‘yicha psevdoilmiy nutqlarning keng tarqalishiga imkon yaratdi. YouTube (Google LLC) kabi platformalar, oyiga 2,5 milliarddan ortiq faol foydalanuvchiga ega bo‘lib, sog‘liqni saqlash haqidagi maʼlumotlarning asosiy manbalariga aylandi. Biroq, tizimli sharhlar shuni ko‘rsatadiki, YouTubeʼdagi sog‘liqni saqlash bilan bog‘liq kontent ko‘pincha o‘rtachadan past sifatga ega va ishonchsiz yoki chalg‘ituvchi maʼlumotlar barcha tibbiy mavzular bo‘ylab keng tarqalgan. Ko‘pincha «infodemiya» deb ataladigan bu hodisa ishonchli manbalar va tavsiyalarni topishni qiyinlashtiradigan maʼlumotlar haddan tashqari ko‘pligini anglatadi. COVID-19 pandemiyasi ijtimoiy tarmoqlar qanday qilib tekshirilmagan maʼlumotlar, fitna nazariyalari va yolg‘on daʼvolarni kuchaytirishi mumkinligini, bu esa jamoatchilik ishonchi va sog‘lig‘i uchun jiddiy oqibatlarga olib kelishi mumkinligini ko‘rsatdi. Tibbiy noto‘g‘ri maʼlumotlar pandemiya tugaganidan keyin ham jamoat sog‘liqni saqlash muammosi bo‘lib qolmoqda.&lt;/p&gt;\n&lt;p&gt;Tibbiy noto‘g‘ri maʼlumotlar keng maʼnoda sog‘liqni saqlash bilan bog‘liq yolg‘on, chalg‘ituvchi yoki hozirgi ilmiy bilimlar bilan tasdiqlanmagan daʼvo sifatida belgilanadi. Uning oqibatlari yomonroq klinik natijalar, noto‘g‘ri eʼtiqodlarning mustahkamlanishi va jamoat sog‘liqni saqlash tavsiyalariga rioya qilmaslikni o‘z ichiga olishi mumkin. Masalan, ko‘krak bezi saratoni bilan og‘rigan bemorlar orasida muqobil tibbiyotdan foydalanish qisqaroq umr ko‘rish bilan bog‘liq. Bu shuningdek, sog‘liqni saqlash bo‘yicha tasdiqlanmagan yoki xayoliy eʼtiqodlarni kuchaytirishi va favqulodda vaziyatlarda sanitariya qoidalariga rioya qilishni kamaytirishi mumkin. Noto‘g‘ri maʼlumotlar ko‘plab mavzularda, jumladan vaksinalar, tamaki mahsulotlari va saraton kabi yuqumli bo‘lmagan kasalliklarda keng tarqalgan bo‘lib, Twitter (X Corp) va YouTube kabi platformalar ushbu muhokamalar uchun asosiy maydon bo‘lib xizmat qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;YouTubeʼdagi tibbiy noto‘g‘ri maʼlumotlar keng tarqalgan bo‘lib, davolanishga rioya qilmaslik va klinik natijalarning yomonlashishi kabi sog‘liq uchun salbiy oqibatlar bilan bog‘liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tibbiy noto‘g‘ri maʼlumotlarga qarshi kurashishning anʼanaviy strategiyalari, masalan, faktlarni tekshirish (fact-checking), cheklangan samaradorlikni ko‘rsatdi. Yaqinda o‘tkazilgan sharh shuni ko‘rsatdiki, faktlarni tekshirishning hozirgi modellari ishonch, miqyoslilik va taʼsir o‘rtasidagi kelishuvlarni o‘z ichiga oladi, bunda na professional, na jamoatchilik yondashuvlari barcha 3 o‘lchov bo‘yicha yuqori natijalarni ko‘rsatmaydi. Shaxsiy darajada tadqiqotlar shuni ko‘rsatadiki, faktlarni tekshirish bilan to‘qnash kelgan foydalanuvchilar noto‘g‘ri maʼlumotlarni tarqatishda davom etishlari mumkin, bu esa bunday aralashuvlarning yetarli emasligini ko‘rsatadi. Bundan tashqari, ilmiy jihatdan muhim noto‘g‘ri maʼlumotlarni rad etishga urinishlar o‘rtacha hisobda qabul qiluvchilarning eʼtiqodlari yoki munosabatlarida statistik jihatdan sezilarli o‘zgarishlarga olib kelmasligi mumkin, bu esa eʼtiqodlar tuzatuvchi maʼlumotlarga qaramay, ayniqsa ijtimoiy qo‘llab-quvvatlanganda saqlanib qolishi mumkinligi haqidagi oldingi maʼlumotlarga mos keladi.&lt;/p&gt;\n&lt;p&gt;Bu foydalanuvchilarni guruh normalariga moslashishga undashi mumkin bo‘lgan jalb qilinganlikning chuqur ijtimoiy va psixologik drayverlarini yaxshiroq tushunish zarurligini ko‘rsatadi. Oldingi tadqiqotlar qutblangan onlayn hamjamiyatlarning mavjudligini aniqladi. Masalan, Facebook (Meta Platforms, Inc) kabi platformalardagi tadqiqotlar shuni ko‘rsatdiki, psevdoilmiy hamjamiyatlar izolyatsiyaga moyil bo‘lib, o‘z eʼtiqodlarini «aks-sado kameralari» (echo chambers) ichida mustahkamlaydi, ilmiy hamjamiyatlar esa ularni rad etishga urinib, qarama-qarshi nuqtai nazarlar bilan o‘zaro munosabatda bo‘lishga moyilroqdir. Keyingi tadqiqotlar ijtimoiy tarmoqlardagi muhokamalarda qutblangan o‘zaro taʼsir tuzilmalarini aniqlashda davom etmoqda, shu bilan birga tarmoq ajralishi har doim ham ifodalangan fikrlarning o‘xshashligi bilan to‘g‘ridan-to‘g‘ri bog‘liq emasligini taʼkidlamoqda.&lt;/p&gt;\n&lt;p&gt;Ushbu hodisalarni tushunish uchun psevdoilmiy nutqni tadqiq qilishda turli xil usullar qo‘llanilgan: kontentni qo‘lda tasniflashdan tortib tarmoq va lingvistik tahlilgacha. Masalan, tarmoq tahlili Twitterʼdagi vaksinalarga qarshi hamjamiyatlarni xaritalash uchun, tabiiy tilni qayta ishlash (NLP) esa inkor etish nutqidagi lingvistik naqshlarni aniqlash uchun ishlatilgan. Xuddi shunday, YouTube video sarlavhalarining matnli intellektual tahlili jamoatchilik fikrini kuzatish uchun ishlatilgan, garchi u izohlar bo‘limidagi foydalanuvchilarning o‘zaro taʼsirini ko‘rib chiqmagan bo‘lsa ham. 813 ta nashrning yaqinda o‘tkazilgan tizimli sharhi tibbiy noto‘g‘ri maʼlumotlarni tadqiq qilishning 4 ta uslubiy yondashuvini ajratib ko‘rsatdi: ishtirokchilar maʼlumotlaridan foydalangan holda miqdoriy va sifatli ijtimoiy tadqiqotlar, shuningdek, raqamli media maʼlumotlarining miqdoriy va sifatli tahlillari. Sharhda, shuningdek, hisoblash yondashuvlari katta hajmdagi raqamli maʼlumotlarni tahlil qilish uchun tobora ko‘proq foydalanilayotgan bo‘lsa-da, ularni kontekstual chuqurlikni taʼminlash uchun sifatli va anʼanaviy ijtimoiy tadqiqotlar bilan to‘ldirish kerakligi qayd etilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Soha darajasidagi uslubiy xilma-xillik alohida tadqiqotlar ichida integratsiyani anglatmaydi; ko‘pgina ishlar bitta usulga (masalan, tarmoq tahlili yoki kontentni baholash) qaratilgan bo‘lib, bu semantik, tarkibiy va vaqtinchalik jihatlarning o‘zaro taʼsirini tushunishni cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqot NLPʼni jarayonlarni intellektual tahlil qilish (process mining) va tarmoq tahlili bilan birlashtirib, muloqot dinamikasini o‘rganish uchun yangi uslubiy bazani joriy etish orqali ushbu bo‘shliqni to‘ldirishga qaratilgan. Bizning yondashuvimiz har bir izohni uning tematik mazmuni va ohangiga ko‘ra tavsiflash uchun NLPʼdan foydalanishdan boshlanadi. Shundan so‘ng, biz jarayonlarni intellektual tahlil qilishni qo‘llaymiz — bu biznes jarayonlarini boshqarish sohasidagi intizom bo‘lib, u voqealar jurnallaridan bilimlarni ajratib olish orqali real jarayonlarni aniqlaydi, kuzatadi va yaxshilaydi. Jarayonlarni intellektual tahlil qilish klinik yo‘llar va tashkiliy ish jarayonlari kabi sog‘liqni saqlashning maʼlum kontekstlarida allaqachon qo‘llanilgan. Ushbu tadqiqotda biz ushbu uslubiy yondashuvni sog‘liqni saqlash bilan bog‘liq foydalanuvchilarning o‘zaro taʼsirini modellashtirish uchun kengaytiramiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Jarayonlarni intellektual tahlil qilish (process mining) — bu voqealar ketma-ketligini (bu holda — izohlar) «jarayon» sifatida vizualizatsiya qilish va o‘zaro taʼsirning odatiy yo‘llarini aniqlash imkonini beruvchi maʼlumotlarni tahlil qilish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqotning asosiy maqsadi ilmiy va psevdoilmiy tibbiy kontent bilan bog‘liq YouTube izohlar tarmoqlarining olingan namunalarida takrorlanuvchi suhbat naqshlarini aniqlash, tahlil qilish, vizualizatsiya qilish va solishtirish uchun jarayonlarni intellektual tahlil qilish va tematik tarmoq tahlilidan foydalanishdir. Ikkilamchi maqsad — sog‘liqni saqlash bilan bog‘liq onlayn o‘zaro taʼsirlardagi ketma-ket va tarkibiy farqlarni tavsiflash hamda raqamli axborot ekotizimidagi kelajakdagi tadqiqotlar va kommunikatsiya strategiyalarini xabardor qilishi mumkin bo‘lgan gipotezalarni yaratish uchun ushbu o‘zaro to‘ldiruvchi usullarning foydaliligini baholashdir.&lt;/p&gt;\n&lt;p&gt;Ushbu tadqiqot metodologiyasi ilmiy maqola uchun standart IMRD (Kirish, Metodlar, Natijalar va Muhokama) formatiga moslashtirilgan CRISP-DM (Cross-Industry Standard Process for Data Mining) ramka dasturiga muvofiq tuzilgan. Tadqiqot kuzatuv tadqiqotlari uchun eng mos qo‘llanma sifatida STROBE (Strengthening the Reporting of Observational Studies in Epidemiology) bayonotiga muvofiq tasvirlangan. YouTubeʼdagi sog‘liqni saqlash tadqiqotlari uchun hisobot bo‘yicha maxsus tavsiyalar yo‘qligini hisobga olgan holda, nazorat ro‘yxati tadqiqot xususiyatlariga moslashtirildi va qo‘llanilmaydigan bandlar aniq belgilandi. To‘ldirilgan STROBE nazorat ro‘yxati 1-ilovada keltirilgan.&lt;/p&gt;\n&lt;p&gt;Qidiruv YouTube bilan cheklandi, chunki platforma bepul va ochiq API taklif qiladi, bu esa nisbatan kam kirish cheklovlari bilan maʼlumotlarni oddiy va qonuniy yig‘ishni taʼminlaydi. Nomzod videolar 2025-yil 4-maydan 6-maygacha olingan, ular bilan bog‘liq izohlar tarmoqlari esa 2025-yil 5-maydan 12-maygacha to‘plangan. Ikkala jarayon qisman bir-birini qoplaganligi sababli, maʼlumotlarni yig‘ishning umumiy davri 2025-yil 4-maydan 12-maygacha bo‘lgan. YouTube izohlari korpusi rasmiy YouTube Data API yordamida tuzilgan.&lt;/p&gt;\n&lt;p&gt;Maʼlumotlarni ajratib olish dastlab ispan tilida so‘zlashuvchi foydalanuvchilar uchun dolzarb bo‘lgan videolarga qaratilgan bo‘lib, API relevanceLanguage parametri «es» ga o‘rnatilgan. Biroq, platformaning qidiruv algoritmlari qidiruv so‘roviga yuqori darajada mos deb hisoblansa, bir nechta tillardagi kontentni o‘z ichiga oladi. Natijada olingan korpus sezilarli lingvistik xilma-xillikni namoyish etdi. Biz kengroq, madaniyatlararo xulq-atvor naqshlarini qamrab olish uchun ko‘p tilli kontentni saqlab qolishga qaror qildik. Qidiruv strategiyasi 2 xil kontent toifasini qamrab olish uchun ishlab chiqilgan: ilmiy tibbiy davolash usullari va psevdoilmiy davolash usullari. Ushbu tadqiqotda «psevdoilmiy» atamasi tilga olingan terapiya usullarining samaradorligi bo‘yicha o‘rnatilgan ilmiy konsensusga asoslangan operatsion tahliliy toifa sifatida ishlatiladi va alohida foydalanuvchilar yoki ularning motivatsiyasi haqida hukm hisoblanmaydi. Har bir toifa uchun 1-jadvalda batafsil tavsiflanganidek, aniq, vakillik qidiruv atamalari to‘plami ishlatilgan.&lt;/p&gt;\n&lt;p&gt;Sifatli tasniflash Googleʼning Gemini katta til modeli (LLM) yordamida amalga oshirildi. Modelga videoning nomi, tavsifi va teglari, shuningdek, videoni «ilmiy», «psevdoilmiy» yoki «norellevant» deb kategoriyalash bo‘yicha batafsil ko‘rsatma berildi. Ko‘rsatma har bir toifani aniq belgilab berdi va agar maʼlumot noaniq yoki yetarli bo‘lmasa, modelga «norellevant» maqomini berishni buyurdi, bu esa tasniflashga konservativ yondashuvni taʼminladi. Faqat dastlabki qidiruv atamasi toifasi (ilmiy yoki psevdoilmiy) LLM tasnifiga mos keladigan videolar tanlovga kiritildi. Ushbu &lt;a href=\"concepts/step.html\"&gt;qadam&lt;/a&gt; psevdoilmiy qidiruv so‘rovi orqali olingan psevdoilmiy daʼvolarni rad etuvchi ilmiy videolar kabi noaniq holatlarni istisno qilish uchun juda muhim edi, shu bilan ikki auditoriya turi o‘rtasida aniq ajratishni taʼminladi.&lt;/p&gt;\n&lt;p&gt;Har bir izoh uchun keyingi tahlil uchun zarur bo‘lgan belgilarni ajratib olish uchun NLP konveyeri qo‘llanildi. Suhbat tarmoqlarini rekonstruksiya qilish: har bir ota-ona izohi uchun API barcha to‘g‘ridan-to‘g‘ri javoblarni olish uchun ishlatilgan. Ushbu tuzilma maʼlumotlar to‘plamida saqlanib qolgan, har bir izoh ota-ona izohi bilan bog‘langan va Conversation_id ga ega bo‘lgan. Ohang tahlili: har bir izohning ohangi Hugging Face kutubxonasidagi nlptown/bert-base-multilingual-uncased-sentiment modeli yordamida aniqlangan. Tematik kategoriyalash: har bir izohning mavzusi yoki niyatini tasniflash uchun MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7 modeli yordamida zero-shot tasniflash yondashuvi ishlatilgan.&lt;/p&gt;\n&lt;p&gt;Tahliliy korpus sifatini taʼminlash uchun oldindan qayta ishlashning bir nechta bosqichlari amalga oshirildi. Tahlilning asosiy birligi suhbat tarmog‘i edi. Shuning uchun faqat kamida bitta javobni o‘z ichiga olgan tarmoqning bir qismi bo‘lgan izohlar kiritilgan; javobsiz izolyatsiya qilingan yuqori darajadagi izohlar yuklanmagan, chunki ular suhbat tuzilishiga hissa qo‘shmaydi. Lingvistik xilma-xillikka kelsak, har bir izohning tili papluca/xlm-roberta-base-language-detection modeli yordamida aniqlangan. Shuningdek, butun korpus bo‘ylab izohlar dublikatlari tekshirilgan; biroq dublikatlar aniqlanmagan.&lt;/p&gt;\n&lt;p&gt;Avtomatlashtirilgan tasniflash konveyeri yig‘ilgan videolarni muvaffaqiyatli kategoriyalab, 2 xil izoh korpusi uchun asos yaratdi. Yakuniy maʼlumotlar to‘plami ilmiy deb tasniflangan videolardan 20 387 ta va psevdoilmiy deb tasniflangan videolardan 32 025 ta izohni o‘z ichiga olgan. Ushbu izohlarning vaqtinchalik taqsimotini tahlil qilish shuni ko‘rsatadiki, maʼlumotlar o‘n yildan ortiq davrni (2011-yildan 2025-yil mayigacha) qamrab olsa-da, har ikkala korpusdagi o‘zaro taʼsirlarning aksariyati so‘nggi yillarga to‘g‘ri keladi, bu platformadan sog‘liqni saqlash bo‘yicha muhokamalar uchun foydalanishning ortib borayotganini aks ettiradi. Tematik tahlil ikki auditoriya o‘rtasida ham tarkibiy o‘xshashliklarni, ham aniq funktsional farqlarni aniqladi. Ikkala guruhda ham «hissiyotlarni ifodalash» va «taqqoslash» eng tez-tez uchraydigan toifalar bo‘lgan. Biroq, ularning nisbiy ahamiyati va hissiy bo‘yog‘i ikki korpus o‘rtasida turlicha bo‘lgan. Psevdoilmiy korpus maqtovlar, minnatdorchiliklar va qisqa tasdiqlarning yuqori chastotasini ko‘rsatdi, «tibbiy davolanish» va «maslahat so‘rovlari» esa ilmiy korpusda nisbatan tez-tez uchragan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f1.jpg\" alt=\"Tadqiqotda foydalanilgan videolar korpusini olish jarayonining ish oqimi tasviri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Tadqiqotda foydalanilgan videolar korpusini olish jarayonining ish oqimi tasviri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f2.jpg\" alt=\"Izohlarni olish va ularni tahlil qilish jarayonining ish oqimi tasviri. NLP: tabiiy tilni qayta ishlash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Izohlarni olish va ularni tahlil qilish jarayonining ish oqimi tasviri. NLP: tabiiy tilni qayta ishlash.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f3.jpg\" alt=\"Ilmiy va soxta ilmiy auditoriyalarda yillar kesimida izohlar sonining gistogrammasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ilmiy va soxta ilmiy auditoriyalarda yillar kesimida izohlar sonining gistogrammasi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f4.jpg\" alt=\"Ilmiy auditoriya uchun aniqlangan jarayon.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ilmiy auditoriya uchun aniqlangan jarayon.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f5.jpg\" alt=\"Soxta ilmiy auditoriya uchun aniqlangan jarayon.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Soxta ilmiy auditoriya uchun aniqlangan jarayon.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f6.jpg\" alt=\"Ilmiy auditoriya oʻzaro taʼsirlari tarmogʻi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Ilmiy auditoriya oʻzaro taʼsirlari tarmogʻi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-f7.jpg\" alt=\"Soxta ilmiy auditoriya oʻzaro taʼsirlari tarmogʻi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Soxta ilmiy auditoriya oʻzaro taʼsirlari tarmogʻi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Sog'liqni&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;saqlash&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;haqidagi&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;noto'g'ri&lt;/text&gt;&lt;text x=\"26\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-
