        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"171\" cy=\"175\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"589\" cy=\"170\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · PROVENANCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;IdeaLens: sun'iy intellekt&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;g'oyalarini insonnikidan&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ajratish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f1.jpg\" alt=\"1-rasm: IDEALENS gʻoyalarni kuzatish; anʼanaviy detektorlar matnni kuzatadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: IDEALENS gʻoyalarni kuzatish; anʼanaviy detektorlar matnni kuzatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: IDEALENS gʻoyalarni kuzatish; anʼanaviy detektorlar matnni kuzatadi. Biz umumiy kelib chiqish (toʻliq inson yoki toʻliq sunʼiy intellekt) va aralash kelib chiqish (inson gʻoyalari va sunʼiy intellekt nasri yoki sunʼiy intellekt gʻoyalari va inson nasri) stsenariylarini qamrab oluvchi toʻrtta kvadrantni taqdim etamiz. Anʼanaviy detektorlardan (masalan, Pangram4, Glickenhaus va boshq., 2026; EditLens-3B, Thai va boshq., 2026) farqli oʻlaroq, IDEALENS nasr manbasini emas, balki gʻoyalar manbasini aniq aniqlay oladi. IDEALENS inson gʻoyalari asosida sunʼiy intellekt tomonidan yaratilgan hujjatlarning 94,7 foizini insonniki deb tasniflaydi, &lt;a href=\"concepts/pangram-3-3-2.html\"&gt;Pangram&lt;/a&gt; esa atigi 43,8 foizini insonniki deb belgilaydi. Sunʼiy intellekt gʻoyalariga ergashgan insonlar tomonidan yozilgan hikoyalarning yangi maʼlumotlar toʻplamimizda (§3), IDEALENS 68,0 foizini sunʼiy intellekt deb belgilaydi, Pangram va EditLens esa mos ravishda atigi 8,0 foiz va 0,0 foizni belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Zamonaviy vositalar matn kim tomonidan yozilganini aniqlaydi, ammo g'oyalar manbasini ko'ra olmaydi. IdeaLens usuli hujjatlarni tuzilmaviy rejalarga aylantirib, uslubiy qobiqdan xoli bo'lgan mazmunni tahlil qiladi. Bu inson tomonidan yozilgan, lekin sun'iy intellekt g'oyalariga asoslangan matnlarni fosh etishga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;IdeaLens matn uslubini emas, g'oyalar tuzilishini tahlil qiladi.&lt;/li&gt;\n&lt;li&gt;Model 1 million hujjat va Pangram 4 belgilari bilan o'qitilgan.&lt;/li&gt;\n&lt;li&gt;Tizim boshqa detektorlar ko'ra olmaydigan sun'iy g'oyalarni fosh etadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar «g'oya kelib chiqishi» (idea provenance) tushunchasiga asoslangan IdeaLens detektorini taqdim etishdi. Tizim hujjatni diskursiv rollar va qisqacha mazmun ro'yxatiga aylantiradi, bu esa so'z darajasidagi o'xshashlikni kamaytiradi. Model 1 million hujjatdan iborat &lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; ma'lumotlar to'plamida Pangram 4 detektori yordamida o'qitilgan.&lt;/p&gt;\n&lt;p&gt;Sinovlar shuni ko'rsatdiki, inson rejalari asosida yozilgan matnlarda sun'iy intellekt deb noto'g'ri belgilash darajasi 95% dan 7% gacha tushadi. Aksincha, inson sun'iy intellekt rejasi asosida yozganda, IdeaLens 68% hollarda «mashina izi»ni aniqlaydi. Usul 24 ta tilga moslashgan bo'lib, turli format va sohalarda barqaror natija beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model ehtimoliy bashoratlarga asoslanadi va yozish jarayonining mutlaq dalili emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Zamonaviy sunʼiy intellekt (SI) detektorlari matnni kim yozganini aniqlashga qaratilgan, ammo bugungi siyosiy talablar gʻoyalar muallifligini aniqlashni taqozo etadi. Tadqiqotchilar IDEALENS detektorini taqdim etdilar. U matnni kim yozganidan qatʼi nazar, gʻoyalar inson yoki SI tomonidan yaratilganini aniqlaydi. Gʻoyalarni uslubdan ajratish uchun hujjatlar konspekt koʻrinishiga keltiriladi: har bir qism uchun diskursiv rol va qisqacha mazmun yoziladi. Bu asl matn bilan soʻz darajasidagi oʻxshashlikni kamaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS matn uslubiga emas, balki gʻoyalar manbasiga eʼtibor qaratadi va tahlil uchun konspektlardan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS modeli Pangram detektori yordamida belgilangan 1 million FineWeb hujjatlari asosida oʻqitildi. Konspektlar sirtqi til xususiyatlaridan xoli boʻlgani uchun model gʻoyalar tuzilishiga tayanadi. Nazorat qilinadigan tajribada modellar inson tomonidan tuzilgan batafsil rejalar asosida yozganda, IDEALENS’ning SI deb belgilash darajasi 95% dan 7% gacha tushdi, Pangram 4 esa 92% holatda SI deb belgilashda davom etdi. SI tomonidan yaratilgan rejalar ishlatilganda, IDEALENS 96% dan yuqori aniqlikni saqlab qoldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Konspekt — bu matn mazmunini saqlagan holda, muallif uslubini chetlab oʻtadigan qisqacha bayon.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Insonlar SI tomonidan yaratilgan rejalar asosida yozgan 50 ta hikoyadan iborat yangi toʻplamda IDEALENS 68% hollarda SI gʻoyalarini aniqladi, Pangram 4 esa atigi 8% holatda aniqladi. 19 ta mavjud benchmarkda oʻtkazilgan sinovlar IDEALENS turli domenlar va tillarda yuqori aniqlikni saqlashini koʻrsatdi. 90 mingta bashorat tahlili inson va SI gʻoyalari oʻrtasidagi tizimli farqlarni aniqlashga yordam berdi. Tadqiqotchilar oʻz modellari va maʼlumotlar toʻplamini ochiq foydalanishga taqdim etdilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model samaradorligi cheklangan maʼlumotlar toʻplamida tekshirilgan; natijalar soha murakkabligiga qarab oʻzgarishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;2026-yil avgust oyida Pangram sunʼiy intellekt detektori Stenli Drakenmillerning Wall Street Journal gazetasidagi maqolasini toʻliq sunʼiy intellekt tomonidan yozilgan deb belgiladi. Investor AI ishlatganini tan oldi, ammo muharrir Pol Gigo maqola mualliflik gʻoyalariga asoslanganini taʼkidlab, uni himoya qildi. Bu holat «matn kelib chiqishi» (soʻzlarni kim yozgan) va «gʻoya kelib chiqishi» (uni kim oʻylab topgan) oʻrtasidagi farqni koʻrsatadi.&lt;/p&gt;\n&lt;p&gt;Mualliflar gʻoyalar kelib chiqishini aniqlovchi IDEALENS detektorini taklif qilishadi. Metod yozishning kognitiv modeliga asoslanadi: gʻoyalar matnning aniq soʻzlaridan emas, balki uning tuzilmasi (tezislar, voqealar, mantiq) orqali belgilanadi. Model FineWeb korpusidan olingan 1 millionta reja (outline) asosida oʻqitilgan. Nazorat uchun PROSELENS modeli yaratilgan boʻlib, u xuddi shu maʼlumotlarda, lekin matnning oʻzi asosida oʻqitilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Autlayning» metodi matnni uning tuzilmasi va diskurs rollarining qisqacha tavsifiga aylantirishni anglatadi, bu esa modelga uslubni emas, balki mantiqni baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"idealens-suniy-intellekt-tomonidan-yozilgan-matnlardagi-insoniy-goyalarni-aniqlaydi\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-suniy-intellekt-tomonidan-yozilgan-matnlardagi-insoniy-goyalarni-aniqlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•IDEALENS sunʼiy intellekt tomonidan yozilgan matnlardagi insoniy gʻoyalarni aniqlaydi&lt;/span&gt;&lt;/a&gt;•IDEALENS sunʼiy intellekt tomonidan yozilgan matnlardagi insoniy gʻoyalarni aniqlaydi&lt;/h4&gt;\n&lt;p&gt;AI tomonidan turli rejalar asosida yaratilgan hujjatlarda IDEALENS «AI deteksiyasi» darajasini 94,9% dan (minimal inson aralashuvi bilan) 6,8% gacha (toʻliq inson rejasi bilan) pasaytiradi. Shu bilan birga, PROSELENS va Pangram bunday matnlarni AI mahsuli deb belgilashda davom etadi (mos ravishda 86,5% va 92,4%). Tahrirlash va qayta yozish boʻyicha 10 ta tashqi benchmarkda IDEALENS xato qilib 5,6% hujjatni AI deb belgilaydi, PROSELENS esa 46,0% va Pangram 52,0% ni tashkil etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS matn detektorlariga qaraganda ancha kam xato bilan insoniy niyatni AI ijrosidan ajratib koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"idealens-inson-yozgan-matnlardagi-ai-goyalarini-aniqlaydi\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-inson-yozgan-matnlardagi-ai-goyalarini-aniqlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•IDEALENS inson yozgan matnlardagi AI gʻoyalarini aniqlaydi&lt;/span&gt;&lt;/a&gt;•IDEALENS inson yozgan matnlardagi AI gʻoyalarini aniqlaydi&lt;/h4&gt;\n&lt;p&gt;Mualliflar AI gʻoyalari asosida odamlar tomonidan yozilgan 50 ta hikoyadan iborat maʼlumotlar toʻplamini yigʻishdi. IDEALENS gʻoyalarning AI kelib chiqishini 68,0% hollarda aniqladi, matn detektorlari esa deyarli hech narsani sezmadi (PROSELENS 0%, Pangram 8,0%), chunki soʻzlar inson tomonidan yozilgan edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sintetik maʼlumotlar va model bashoratlariga asoslangan; natijalar aniq matnni yozish jarayonining bevosita dalili emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"samaradorlik-va-tillararo-moslashuv\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#samaradorlik-va-tillararo-moslashuv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•Samaradorlik va tillararo moslashuv&lt;/span&gt;&lt;/a&gt;•Samaradorlik va tillararo moslashuv&lt;/h4&gt;\n&lt;p&gt;Toʻliq inson va toʻliq AI matnlarini ajratish boʻyicha 19 ta testda IDEALENS 0,6% xato bilan 91,1% AI hujjatlarini aniqlaydi. Model faqat ingliz tilida oʻqitilgan boʻlsa-da, u inglizcha rejalar yordamida 24 ta tilda samarali ishlaydi va 0,1% xato bilan 95,3% AI hujjatlarini aniqlaydi.&lt;/p&gt;\n&lt;h4 id=\"baholash-mezonlari-tahlili\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#baholash-mezonlari-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;•Baholash mezonlari tahlili&lt;/span&gt;&lt;/a&gt;•Baholash mezonlari tahlili&lt;/h4&gt;\n&lt;p&gt;90 mingta bashorat tahlili shuni koʻrsatdiki, IDEALENS gʻoyalarni, agar ular kontekstsiz raqamlar yoki usullarni oʻz ichiga olsa, «AI tomonidan yaratilgan» deb baholaydi. Aksincha, tekshirilishi mumkin boʻlgan manbalar va muammolarni muhokama qiluvchi gʻoyalar «insoniy» deb tan olinadi. Mualliflar kod va maʼlumotlarni ochiq foydalanishga taqdim etishdi.&lt;/p&gt;\n&lt;h4 id=\"goyalar-kelib-chiqishini-strukturaviy-rejalar-orqali-organish\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#goyalar-kelib-chiqishini-strukturaviy-rejalar-orqali-organish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GʻOYALAR KELIB CHIQISHINI STRUKTURAVIY REJALAR ORQALI OʻRGANISH&lt;/span&gt;&lt;/a&gt;GʻOYALAR KELIB CHIQISHINI STRUKTURAVIY REJALAR ORQALI OʻRGANISH&lt;/h4&gt;\n&lt;p&gt;Gʻoya detektorini oʻqitishdagi asosiy qiyinchilik shundaki, matn muallifligi boʻyicha maʼlumotlar boʻlsa-da, hujjatdagi gʻoyalar kimga tegishli ekanligi boʻyicha keng koʻlamli belgilar (labels) mavjud emas. Ushbu muammoni hal qilish uchun biz hujjatlarning mazmunini saqlab qoladigan, ammo asl leksikani istisno qiladigan «rejalar» (outlines) asosida modelni oʻqitamiz. Buning uchun biz har bir yozish formati uchun xos boʻlgan diskursiv rollarni aniqlaymiz, hujjat rejasini ajratib olamiz va muallifning uslubiy belgilarini yoʻqotish uchun uni qayta bayon qilamiz. IDEALENS modeli qayta bayon qilingan reja asosida mualliflikni (inson yoki sunʼiy intellekt) bashorat qilishga oʻrgatiladi, PROSELENS esa buni asl matn asosida amalga oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Asl matn oʻrniga qayta bayon qilingan rejalardan foydalanish modelga muallifning uslubiy xususiyatlariga emas, balki gʻoyalar tuzilishiga eʼtibor qaratish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;WildOutlines korpusini shakllantirish uchun biz WebOrganizer va Pangram 3.3.2 yordamida belgilangan &lt;a href=\"concepts/wildai.html\"&gt;WildAI&lt;/a&gt; toʻplamidan 1 million hujjatni tanlab oldik. Biz tanlovni 500 soʻzdan kam boʻlmagan, sakkizta formatdan biriga tegishli (Jadval 12) ingliz tilidagi matnlar bilan chekladik. «Aralash mualliflik» belgisiga ega hujjatlar chiqarib tashlandi, chunki ularda gʻoyalar manbasini aniq belgilash imkonsiz. Yakuniy maʼlumotlar toʻplami oʻqitish (842 ming), validatsiya (30 ming), kalibrlash (80 ming) va test (50 ming) qismlariga boʻlingan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Diskursiv rol — bu matn parchasi hujjatning umumiy tuzilmasida bajaradigan funksiyadir (masalan, «voqeani tasvirlash» yoki «bozor reaksiyasini baholash»).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rejalarni-avtomatik-ajratib-olish\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#rejalarni-avtomatik-ajratib-olish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Rejalarni avtomatik ajratib olish&lt;/span&gt;&lt;/a&gt;Rejalarni avtomatik ajratib olish&lt;/h4&gt;\n&lt;p&gt;WildOutlines oʻquv toʻplamini yaratish jarayoni uch bosqichdan iborat: (i) Rollarni aniqlash: biz TopicGPT freymvorkini moslashtirdik va har bir format uchun bazaviy rollarni yaratishda GPT-5.6 Sol modelidan foydalandik. Qoʻlda tekshirish va dublikatlarni oʻchirishdan soʻng, biz rollar toʻplamini oldik (masalan, badiiy boʻlmagan matnlar uchun 42 ta rol). (ii) Rejalarni ajratib olish: Gemini 3.7 Flash va Gemini 3.1 Pro modellari yordamida biz hujjatlarni «rol — mazmun tavsifi» juftliklari ketma-ketligiga aylantiramiz. (iii) Qayta bayon qilish: model muallif uslubidan «shpalgalka» sifatida foydalanmasligi uchun biz rejalarni Gemini 3.1 Pro yordamida qayta bayon qilamiz. Bu rejalardagi «insoniy» uslub ulushini 8,5% dan 0,3% gacha kamaytiradi (Jadval 9), shu bilan birga asl nusxa bilan kosinus oʻxshashlik 0,93 darajasida saqlanib qoladi (Jadval 10).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qayta bayon qilish faqat oʻqitish jarayonida qoʻllanadi, chunki uslubiy belgilarning sizib chiqishini istisno qilish kerak; inferensiya (test) bosqichida IDEALENS asl rejalar bilan ishlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"idealens-va-proselens-ni-oqitish\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-va-proselens-ni-oqitish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IDEALENS va PROSELENS ni oʻqitish&lt;/span&gt;&lt;/a&gt;IDEALENS va PROSELENS ni oʻqitish&lt;/h4&gt;\n&lt;p&gt;Ikkala model ham &lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt; usuli yordamida qoʻshimcha oʻqitilgan Nemotron-3.5-Lightning-30B-A3B arxitekturasiga asoslangan. Modellar 1% darajasidagi notoʻgʻri ijobiy natijalar (&lt;a href=\"concepts/false-positive-rate.html\"&gt;FPR&lt;/a&gt;) chastotasini taʼminlaydigan chegara boʻyicha kalibrlanadi. Ikkala model ham bir xil arxitektura va maʼlumotlardan foydalanganligi sababli, ularning natijalaridagi farqlar faqat asl matndan reja koʻrinishidagi taqdimotga oʻtish bilan bogʻliq.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; ExamplesofitemsforfourcoredifferencesbetweenhumanandAIideas.Thefirst column describes each contrast and summarizes how it is realized in human and AI ideas.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT1.jpg\" alt=\"Jadval 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"eksperimental-qurilma\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#eksperimental-qurilma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EKSPERIMENTAL QURILMA&lt;/span&gt;&lt;/a&gt;EKSPERIMENTAL QURILMA&lt;/h4&gt;\n&lt;p&gt;Mualliflar IDEALENS va PROSELENS modellarini 17 ta mavjud detektor, jumladan Pangram 4 bilan solishtirib ko‘rishdi. Sinov 19 ta tashqi benchmark va uchta maxsus yaratilgan ma’lumotlar to‘plami: IDEASHIFT, IDEASHIFT-X va TWICETOLD asosida o‘tkazildi. Ushbu to‘plamlar to‘rtta stsenariyni qamrab oladi: to‘liq inson yoki to‘liq AI tomonidan yaratilgan hujjatlar, hamda aralash variantlar (inson g‘oyalari AI matnida yoki AI g‘oyalari inson matnida). G‘oya detektorlari barcha to‘rtta kvadrantda yuqori aniqlik ko‘rsatishi, proza detektorlari esa aralash holatlarda past samaradorlik ko‘rsatishi kutiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;G‘oya detektorlari matn uslubidan qat’i nazar, g‘oya manbasini aniq belgilashi kerak, proza detektorlari esa faqat lingvistik naqshlarga tayanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AI g‘oyalarini aniqlash aniqligini baholash uchun bashorat qilingan yorliqning (AI yoki inson) g‘oya manbasiga mos kelish metriklari ishlatiladi. Bazaviy modellar sifatida Pangram 4, EditLens-Llama-3.2-3B, Fast-DetectGPT, Binoculars, MELD va Desklib tanlangan. IDEALENS, PROSELENS va EditLens uchun kalibrlash to‘plamida 1% soxta ijobiy natijalar (FPR) chastotasiga mos keladigan global chegara o‘rnatilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FPR (False Positive Rate) — model inson matnini noto‘g‘ri AI matni deb tasniflagan holatlar ulushi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;19 ta tashqi benchmarkdan 14 tasi umumiy kelib chiqishga ega hujjatlarni o‘z ichiga oladi. Qo‘shimcha ravishda, Pangram tomonidan belgilangan 50 000 ta hujjatdan iborat test to‘plami va FPRni o‘lchash uchun C4 korpusidan (ChatGPT paydo bo‘lishidan oldin yaratilgan) 10 000 ta hujjat ishlatiladi. Shuningdek, 10 ta benchmark inson tomonidan yozilgan, ammo AI tomonidan tahrirlangan matnlarni o‘z ichiga oladi.&lt;/p&gt;\n&lt;p&gt;IDEASHIFT rejaning batafsilligi deteksiyaga ta’sirini o‘rganadi. To‘plam 500 ta boshlang‘ich hujjatni o‘z ichiga oladi, ular uchun GPT-5.6 Sol besh darajali promptlarni yaratadi: 0-darajadan (faqat mavzu) 5-darajagacha (to‘liq reja). Proza AI tomonidan yaratilgani uchun, proza detektorlari hammasini AI deb tasniflashi kerak, ammo g‘oya detektorlari inson rejalari asosida yaratilgan hujjatlarda aniqlik pasayishini ko‘rsatishi kerak.&lt;/p&gt;\n&lt;p&gt;TWICETOLD teskari stsenariyni o‘rganadi: inson AI tomonidan yaratilgan reja asosida matn yozadi. To‘plam AI rejalari asosida insonlar tomonidan yozilgan 50 ta hikoyadan (har biri 500 so‘z) iborat.&lt;/p&gt;\n&lt;p&gt;IDEASHIFT-X IDEALENS’ning ko‘p tilli muhitdagi ishini tekshiradi. Model har qanday tildagi hujjatlar uchun ingliz tilidagi rejalarni yarata oladigan &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-ekstraktordan foydalangani uchun, u qo‘shimcha o‘qitishsiz qo‘llanilishi mumkin. To‘plam FineWeb2’dan 24 tilda olingan 10 000 ta inson hujjatini o‘z ichiga oladi.&lt;/p&gt;\n&lt;h4 id=\"idealens-goyalarni-aniqlaydi,-ai-uslubini-emas\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#idealens-goyalarni-aniqlaydi,-ai-uslubini-emas\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;IDEALENS gʻoyalarni aniqlaydi, AI uslubini emas&lt;/span&gt;&lt;/a&gt;IDEALENS gʻoyalarni aniqlaydi, AI uslubini emas&lt;/h4&gt;\n&lt;p&gt;IDEALENS matn uslubini emas, balki gʻoyalarning kelib chiqishini tahlil qiladi. IDEASHIFT promtlaridagi insoniy reja batafsillashgani sari, IDEALENS’ning notoʻgʻri aniqlash darajasi 94,9% dan (0-daraja) 6,8% gacha (5-daraja) pasayadi (4a-rasm). Aksincha, PROSELENS va Pangram 4 inson gʻoyalarining darajasidan qatʼi nazar, hujjatlarning 86–100% ini AI deb belgilaydi. Agar reja inson emas, AI tomonidan tuzilgan boʻlsa, IDEALENS har doim hujjatlarning 96% dan ortigʻini AI deb aniqlaydi (25-jadval). Eng katta pasayish 3 va 4-darajalar orasida kuzatiladi, bu bosqichda promtlar tarkibiy rollardan tashqari aniq mazmunni ham oʻz ichiga oladi (24-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS insoniy promtlar batafsillashganda notoʻgʻri aniqlash darajasini sezilarli darajada kamaytirib, gʻoya manbasiga nisbatan yuqori sezgirlikni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS inson gʻoyalarining AI tomonidan qayta yozilishiga chidamli. AI inson matniga yuzaki oʻzgartirishlar kiritgan 12 ta benchmarkda IDEALENS hujjatlarning 94,7% ini insonniki deb belgilaydi (PROSELENS — 50,7%, Pangram 4 — 43,8%, 19-jadval). GEDE maʼlumotlar toʻplamida IDEALENS LLM tomonidan kiritilgan kichik tuzatishlardan soʻng inson insholarining atigi 0,5% ini AI deb belgilaydi. HART testida IDEALENS AI tomonidan qayta yozilgan matnlarning 4,9% ini AI deb belgilaydi, bu Pangram 4 (42,8%) va PROSELENS (44,5%) koʻrsatkichlaridan ancha past.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Parafrazlash» — bu matnning shaklini oʻzgartirib, asl maʼnoni saqlab qolish jarayoni boʻlib, bu uslubga asoslangan detektorlarni chalgʻitishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS inson tomonidan yozilgan TWICETOLD nasriy asarlaridagi AI gʻoyalarini aniqlaydi. IDEALENS ushbu hikoyalarning 68% ini (95% CI 54–79%) AI deb belgilaydi, PROSELENS esa 0%, Pangram 4 esa 8% ni tashkil etadi. Barcha detektorlar asl AI hikoyalarini aniqlashda ishonchli (96–100%), ammo faqat IDEALENS insoniy hikoyalar uchun oʻz bashoratini saqlab qoladi (4b-rasm). Xatolarning 12 tasi fantastik elementlarga ega hikoyalarga toʻgʻri keladi.&lt;/p&gt;\n&lt;p&gt;IDEALENS mavjud ochiq detektorlardan ustun. 19 ta baholash qismida IDEALENS 0,6% FPR (notoʻgʻri ijobiy natija) darajasida AI hujjatlarining 91,1% ini aniqlaydi, EditLens-3B esa 0,2% FPR darajasida 81,8% ni aniqlaydi (21-jadval). PROSELENS toʻliq matn boʻyicha oʻqitilganda 98,9% natijaga erishadi. C4 maʼlumotlar toʻplamidagi 10 000 ta eski hujjatda IDEALENS atigi 0,01% xatolik koʻrsatadi. Modelning zaif tomoni — DIPPER parafrazlash usuli (77,6% aniqlash), bu kontentning ham oʻzgarishi bilan bogʻliq boʻlishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"1-hal-qiluvchi-va-universal-detallar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#1-hal-qiluvchi-va-universal-detallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1 Hal qiluvchi va universal detallar&lt;/span&gt;&lt;/a&gt;1 Hal qiluvchi va universal detallar&lt;/h4&gt;\n&lt;p&gt;Detallar muallifning xulosasini oʻzgartirishi yoki har qanday mavzuga mos kelishi mumkin. Masalan, Sony Cyber-shot RX100’dagi mini-HDMI porti va batareya boʻlinmasi — bu aniq fizik fakt, Jony Ive dinamigining estetikasi esa har qanday premium qurilmaga mos kelishi mumkin boʻlgan umumiy tavsifdir.&lt;/p&gt;\n&lt;h4 id=\"2-funksional-va-korinishdagi-aniqlik\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#2-funksional-va-korinishdagi-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2 Funksional va koʻrinishdagi aniqlik&lt;/span&gt;&lt;/a&gt;2 Funksional va koʻrinishdagi aniqlik&lt;/h4&gt;\n&lt;p&gt;Raqamlar tekshirilishi mumkin yoki shunchaki aniqlik illyuziyasini yaratishi mumkin. 10 kun ichida 700 yuan foyda koʻrish — bu oʻlchanadigan fakt. «Texnik toʻsiqlarni bartaraf etish» yoki «mutaxassislar bilan muhokama qilish» kabi umumiy tavsiyalar esa ekspert uslubini taqlid qiladi, lekin tekshiriladigan maʼlumotga ega emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Umumiy maslahatlarni oʻz ichiga olgan matnlar faktik maʼlumot bermasdan ekspert uslubini taqlid qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"3-cheklangan-va-haddan-tashqari-kengaytirilgan-davolar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#3-cheklangan-va-haddan-tashqari-kengaytirilgan-davolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3 Cheklangan va haddan tashqari kengaytirilgan daʼvolar&lt;/span&gt;&lt;/a&gt;3 Cheklangan va haddan tashqari kengaytirilgan daʼvolar&lt;/h4&gt;\n&lt;p&gt;Daʼvolar aniq chegaralarga ega boʻlishi yoki dalillardan tashqariga chiqishi mumkin. 2022-yil oʻrtalarida maʼlum bir markazdan flotni ishga tushirish — bu tekshiriladigan fakt. 2025-yilgi Kia K4 «doimiy meros» va «yangi standart» boʻladi degan prognoz esa spekulyativ boʻlib, dalillar bilan tasdiqlanmagan.&lt;/p&gt;\n&lt;h4 id=\"4-saqlangan-va-ochirilgan-xarajatlar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#4-saqlangan-va-ochirilgan-xarajatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4 Saqlangan va oʻchirilgan xarajatlar&lt;/span&gt;&lt;/a&gt;4 Saqlangan va oʻchirilgan xarajatlar&lt;/h4&gt;\n&lt;p&gt;Mualliflar matnlarda cheklovlar qanday qabul qilinishini tahlil qiladilar. Insonlar yozgan matnlarda real toʻsiqlar (masalan, itni oʻqitishdagi logistik qiyinchiliklar) saqlanib qoladi, sunʼiy intellekt (SI) modellari esa vaziyatni ideal deb tasvirlab, kamchiliklarni eʼtiborsiz qoldiradi. Misol tariqasida M3 MacBook Air noutbukining baholanishi keltirilgan: SI uni «ideal muvozanat» deb taʼriflaydi va kamchiliklarni aytmaydi, insonlar esa cheklovlarni aniq koʻrsatib oʻtadilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS modeli SI gʻoyalarini aniqlashda yuqori aniqlik (95,3%) koʻrsatadi va matn qaysi tilda yozilganidan qatʼi nazar barqaror natija beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS tizimi IDEASHIFT-X maʼlumotlar toʻplami doirasida 24 ta tilda sinovdan oʻtkazildi. Faqat ingliz tilida oʻqitilganiga qaramay, model 0-darajali (toʻliq SI) hujjatlarning 95,3 foizini va 5-darajali (toʻliq inson) hujjatlarning atigi 0,7 foizini toʻgʻri tasniflaydi. Taqqoslash uchun, proza detektorlari (PROSELENS, Pangram4) ayniqsa kam resursli tillarda (tamil, amxar) yomonroq natija koʻrsatadi. FineWeb2’dan olingan 10 000 ta inson matnida model past darajadagi notoʻgʻri ijobiy natijalarni (FPR) — 0,1% ni tashkil etdi.&lt;/p&gt;\n&lt;p&gt;IDEALENS reja (outline) asosida oʻqitilgan boʻlsa-da, «xom» matn bilan ham samarali ishlaydi. Umumiy kelib chiqishni tahlil qilishda model 0,3% FPR bilan SI hujjatlarining 96,1 foizini aniqlaydi. Biroq, SI gʻoyalar yaratib, inson matn yozgan TWICETOLD benchmarkida model SI kontentining atigi 6 foizini taniydi, chunki insoniy detallar SI gʻoyalarini «yashiradi».&lt;/p&gt;\n&lt;h4 id=\"si-goyalarini-inson-goyalaridan-nima-ajratib-turadi\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#si-goyalarini-inson-goyalaridan-nima-ajratib-turadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SI gʻoyalarini inson gʻoyalaridan nima ajratib turadi&lt;/span&gt;&lt;/a&gt;SI gʻoyalarini inson gʻoyalaridan nima ajratib turadi&lt;/h4&gt;\n&lt;p&gt;Farqlarni tushunish uchun mualliflar ablasyon tadqiqotini (36-jadval) oʻtkazdilar. Bu tadqiqot IDEALENS asosan mazmunga tayanib, rollar yoki tuzilishga emasligini koʻrsatdi. Russell va boshqalar (2026b) metodologiyasidan foydalanib, mualliflar 90 000 ta bashoratdan 79 ta talqin qilinadigan xususiyatni ajratib oldilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ablasyon tadqiqoti (ablation study) — bu modelning alohida komponentlari yoki maʼlumotlarini ketma-ket olib tashlash orqali ularning yakuniy natijaga qanchalik taʼsir qilishini tushunish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Asosiy farqlar quyidagilardir: SI gʻoyalari koʻpincha mavhum va har qanday narsaga mos keladi (masalan, har qanday dinamik uchun «premium ovoz sifati»), inson gʻoyalari esa kontekst uchun muhim boʻlgan aniq detallarni oʻz ichiga oladi (masalan, shtativdan foydalanishdagi muammolar). SI koʻpincha aniq koʻrinadigan, lekin amaliy qiymatga ega boʻlmagan maslahatlar beradi (masalan, qanday joriy etishni tushuntirmasdan «Agile metodologiyasi»). Bundan tashqari, SI ahamiyatni boʻrttirishga (kelajak haqidagi bashoratlar) va kamchiliklarni yashirishga moyil, insonlar esa ehtiyotkorona prognozlar qiladi va cheklovlarni ochiq tan oladi.&lt;/p&gt;\n&lt;h4 id=\"bogliq-ishlar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#bogliq-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bogʻliq ishlar&lt;/span&gt;&lt;/a&gt;Bogʻliq ishlar&lt;/h4&gt;\n&lt;p&gt;SI matn detektorlari (Mitchell va boshqalar, 2023 va b.) proza muallifligini binar tasniflashga qaratilgan. Aralash mualliflik boʻyicha tadqiqotlar odatda SI ni tahrirlash vositasi sifatida koʻradi yoki mazmunni uslubdan ajratishga harakat qiladi. Ulardan farqli oʻlaroq, IDEALENS matnning oʻziga emas, balki yozish jarayonining kognitiv nazariyalariga (Flower &amp;amp; Hayes, 1981) tayanib, gʻoyalar kelib chiqishini oʻrganadi. Mualliflar uslubiy oʻzgarishlarni &lt;a href=\"concepts/normalizatsiya.html\"&gt;normallashtirish&lt;/a&gt; usullariga (Krishna va boshqalar, 2020) oʻxshash, ammo teskari yoʻnalishda ishlaydigan transformatsiya qilingan maʼlumotlarda oʻqitish prinsipini qoʻllaydilar.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Accuracy by document length on the out-of-domain evaluations (%, global 1% cut).The training corpus has no documents under 500 words.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT2.jpg\" alt=\"Jadval 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 32.&lt;/strong&gt; MELD, per attack:by attack.Fire rate % at the 1% cut.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT32.jpg\" alt=\"Jadval 32\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 33.&lt;/strong&gt; DetectRL-X, per attack:by attack.Fire rate % at the 1% cut.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT33.jpg\" alt=\"Jadval 33\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"asosiy-xulosalar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#asosiy-xulosalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy xulosalar&lt;/span&gt;&lt;/a&gt;Asosiy xulosalar&lt;/h4&gt;\n&lt;p&gt;Tadqiqot shuni koʻrsatadiki, sunʼiy intellekt (SI) tomonidan yaratilgan matnlar va inson tomonidan yozilgan matnlarni gʻoyalar tahlili orqali samarali ajratish mumkin. Mualliflar 1 000 000 ta rejalar (outlines) korpusidan foydalanib, proza detektoridan olingan «kumush» yorliqlar yordamida IDEALENS modelini oʻqitdilar. Model 22 ta maʼlumotlar toʻplamida sinovdan oʻtkazildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IDEALENS modeli gʻoyalarning kelib chiqishini muvaffaqiyatli aniqlaydi, mavjud analoglardan ustun turadi va faqat ingliz tilida oʻqitilganiga qaramay, 24 ta til bilan ishlash qobiliyatini namoyish etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IDEALENS gʻoyalar kelib chiqishini matn tuzilmasidan farq qilganda ham kuzatib boradi. Xuddi shu yorliqlar asosida, lekin xom matn ustida oʻqitilgan PROSELENS nazorat modelidan farqli oʻlaroq, IDEALENS yuqoriroq aniqlikni koʻrsatadi. 13 616 ta ajratilgan elementlarda 79 ta belgidan 64 tasi IDEALENS baholari bilan «SI insonga qarshi» tasniflash yoʻnalishida mos keldi, bunda faqat bitta holatda qarama-qarshilik aniqlandi (§J.3 va 44-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Kumush» yorliqlar — bu qoʻlda belgilangan «oltin» maʼlumotlar boʻlmaganda, oʻqitish uchun boshqa algoritmlar yordamida avtomatik olingan maʼlumotlardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tadqiqot-cheklovlari\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#tadqiqot-cheklovlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot cheklovlari&lt;/span&gt;&lt;/a&gt;Tadqiqot cheklovlari&lt;/h4&gt;\n&lt;p&gt;Mualliflar usulning bir qator cheklovlarini (§A) qayd etadilar. Oʻqitish yorliqlari gʻoyalarning kelib chiqishini faqat taxminiy aks ettiradi, binar tasniflash esa inson va SI hamkorligida yaratilgan matnlarni toʻgʻri qayta ishlashga imkon bermaydi. Bundan tashqari, modelning samaradorligi qisqa matnlarda va baʼzi raqobatbardosh hujumlarda pasayadi. Rejalarni ajratib olish jarayoni xususiy modellarga bogʻliq, TWICETOLD maʼlumotlar toʻplami esa 50 ta hikoya bilan cheklangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model cheklovlarga ega: u qisqa matnlarda kamroq samarali va gʻoya tuzilmasini ajratib olish uchun uchinchi tomon xususiy algoritmlariga tayanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f1.jpg\" alt=\"1-rasm: IDEALENS gʻoyalarni kuzatish; anʼanaviy detektorlar matnni kuzatadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: IDEALENS gʻoyalarni kuzatish; anʼanaviy detektorlar matnni kuzatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: IDEALENS gʻoyalarni kuzatish; anʼanaviy detektorlar matnni kuzatadi. Biz umumiy kelib chiqish (toʻliq inson yoki toʻliq sunʼiy intellekt) va aralash kelib chiqish (inson gʻoyalari va sunʼiy intellekt nasri yoki sunʼiy intellekt gʻoyalari va inson nasri) stsenariylarini qamrab oluvchi toʻrtta kvadrantni taqdim etamiz. Anʼanaviy detektorlardan (masalan, Pangram4, Glickenhaus va boshq., 2026; EditLens-3B, Thai va boshq., 2026) farqli oʻlaroq, IDEALENS nasr manbasini emas, balki gʻoyalar manbasini aniq aniqlay oladi. IDEALENS inson gʻoyalari asosida sunʼiy intellekt tomonidan yaratilgan hujjatlarning 94,7 foizini insonniki deb tasniflaydi, Pangram esa atigi 43,8 foizini insonniki deb belgilaydi. Sunʼiy intellekt gʻoyalariga ergashgan insonlar tomonidan yozilgan hikoyalarning yangi maʼlumotlar toʻplamimizda (§3), IDEALENS 68,0 foizini sunʼiy intellekt deb belgilaydi, Pangram va EditLens esa mos ravishda atigi 8,0 foiz va 0,0 foizni belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f2.jpg\" alt=\"2-rasm: IDEALENS har bir hujjatning rejasini koʻradi, butun matnni emas.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: IDEALENS har bir hujjatning rejasini koʻradi, butun matnni emas.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: IDEALENS har bir hujjatning rejasini koʻradi, butun matnni emas. Hujjatlarga format tayinlanadi va ular reja shakliga keltiriladi, har biri format rollaridan biri bilan belgilanadi. Ushbu misol maqoladan olingan 17 ta reja elementidan ikkitasini koʻrsatadi. Oʻqitish uchun rejalar asl hujjatlardan koʻchirilgan soʻzlarni olib tashlash uchun qayta ifodalanadi. IDEALENS oʻqitish jarayonida qayta ifodalangan rejadan Pangram yorligʻini oʻrganadi va chiqarilgan rejalar inferensiya vaqtida taqdim etiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f3.jpg\" alt=\"3-rasm: Reja asosida oʻqitilgan IDEALENS gʻoya muallifligini aniqlaydi, anʼanaviy detektorlar esa nasr muallifligini kuz\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Reja asosida oʻqitilgan IDEALENS gʻoya muallifligini aniqlaydi, anʼanaviy detektorlar esa nasr muallifligini kuzatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Reja asosida oʻqitilgan IDEALENS gʻoya muallifligini aniqlaydi, anʼanaviy detektorlar esa nasr muallifligini kuzatadi. Gʻoyalar va nasr bitta muallif tomonidan (x-oʻqi) va turli mualliflar tomonidan (y-oʻqi) boʻlingan barcha benchmarklar boʻyicha oʻrtacha aniqlik. IDEALENS ham umumiy (95,3%), ham aralash (81,3%) mualliflik bilan aniq ishlaydigan yagona detektordir. 3-rasmda 22 ta benchmarkdan 51 ta baholash boʻlimi boʻyicha asosiy natijalarimiz umumlashtirilgan, bu yerda har bir nuqta umumiy va aralash kelib chiqish hujjatlarida gʻoyalarni aniqlashning umumiy aniqligi boʻyicha chizilgan detektordir. IDEALENS ham umumiy (95,3%), ham aralash (81,3%) sharoitlarda yuqori aniqlikka erishadigan yagona detektordir. PROSELENS va Pangram 4 umumiy kelib chiqish hujjatlarida juda aniq (mos ravishda 99,1% va 98,5%), ammo aralash sharoitlarda hujjat gʻoyalari manbasini aniqlay olmaydi (25,4% va 25,9%). PROSELENS IDEALENS bilan bir xil asos, oʻquv hujjatlari va oʻquv yorliqlariga ega boʻlgani uchun, bu bizning reja vakilligimiz taʼsirini taʼkidlaydi, buni ModernBERT asosidagi juftlik (Warner va boshq., 2025) boshqa asos bilan takrorlaydi. IDEALENS, shuningdek, test vaqtida xom matn kiritishlariga kutilmaganda yaxshi moslashadi, umumiy kelib chiqishda yuqori aniqlikni va PROSELENSga qaraganda aralash kelib chiqishda sezilarli darajada yuqori aniqlikni namoyish etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f4.jpg\" alt=\"4-rasm: IDEALENS sunʼiy intellekt tomonidan yaratilgan matnda inson ishtirokining turli darajalarini aniqlaydi (chapda) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: IDEALENS sunʼiy intellekt tomonidan yaratilgan matnda inson ishtirokining turli darajalarini aniqlaydi (chapda) va TWICETOLD hamda uning sunʼiy intellekt versiyalari uchun oʻxshash P(AI) qiymatlarini belgilaydi (oʻngda).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: IDEALENS sunʼiy intellekt tomonidan yaratilgan matnda inson ishtirokining turli darajalarini aniqlaydi (chapda) va TWICETOLD hamda uning sunʼiy intellekt versiyalari uchun oʻxshash P(AI) qiymatlarini belgilaydi (oʻngda). (a) IDEASHIFTda IDEALENS sunʼiy intellekt tomonidan yaratilgan matndagi inson ishtirokining turli darajalari bilan kuzatiladigan yagona modeldir; sunʼiy intellekt nazoratida barcha modellar barcha darajalarda deyarli toʻliq ishlaydi. (b) TWICETOLDdagi sunʼiy intellekt va inson tomonidan yozilgan hikoyalar oʻrtasidagi P(AI) farqi IDEALENS uchun PROSELENSga qaraganda ancha kichikdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f5.jpg\" alt=\"5-rasm: INSONIY ASSOTSIATSIYA BALLARI taqsimoti.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: INSONIY ASSOTSIATSIYA BALLARI taqsimoti.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: INSONIY ASSOTSIATSIYA BALLARI taqsimoti. Har bir nuqta 79 ta xususiyatdan birini ifodalaydi; koʻk va toʻq sariq ranglar mos ravishda inson va sunʼiy intellekt bilan bogʻliq deb taklif qilingan xususiyatlarni koʻrsatadi. Ball — bu bir xil formatda xususiyat ishga tushadigan element detektorning insoniylik ballini xususiyat ishga tushmaydigan elementga qaraganda yuqoriroq olish ehtimolidir. 0,5 ball assotsiatsiya yoʻqligini bildiradi. Boʻsh nuqtalar 0,5ni oʻz ichiga olgan 95% bootstrap intervallariga ega; vertikal joylashtirish faqat koʻrinish uchun.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f6.jpg\" alt=\"6-rasm: Alohida xususiyatlar uchun inson assotsiatsiyasi ballari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Alohida xususiyatlar uchun inson assotsiatsiyasi ballari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm: Alohida xususiyatlar uchun inson assotsiatsiyasi ballari. Nuqtalar xususiyat ballarini, gorizontal chiziqlar esa ularning 95% &lt;a href=\"concepts/butstrep.html\"&gt;butstrap&lt;/a&gt; intervallarini koʻrsatadi, ular taklif qilingan yoʻnalish boʻyicha guruhlangan. Inson tomonidan taklif qilingan xususiyatlar eng yuqori balldan eng pastigacha, sunʼiy intellekt (AI) tomonidan taklif qilinganlari esa eng pastdan eng yuqorisigacha tartiblangan, bunda har bir panelning taklif qilingan yoʻnalish bilan eng kuchli assotsiatsiyalari yuqorida joylashtirilgan. 0,5 dan yuqori ballar insonga, 0,5 dan past ballar esa AIga moyillikni bildiradi. Ichki qismi boʻsh nuqtalar 0,5 ni oʻz ichiga olgan intervallarga ega, x belgisi esa kuzatilgan moyilligi taklif qilingan yoʻnalishga zid boʻlgan xususiyatni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-f7.jpg\" alt=\"7-rasm: P(AI) detektori kvintillari boʻyicha xususiyatlarning faollashuvi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: P(AI) detektori kvintillari boʻyicha xususiyatlarning faollashuvi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-rasm: P(AI) detektori kvintillari boʻyicha xususiyatlarning faollashuvi. Elementlar har bir format doirasida P(AI) detektori boʻyicha reytinglangan va eng past P(AI) (1) dan eng yuqori P(AI) (5) gacha beshta guruhga boʻlingan. Har bir nuqta guruhdagi koʻrsatilgan xususiyat faollashadigan elementlar ulushini koʻrsatadi. Inson tomonidan taklif qilingan ikkita xususiyat (#13 va #3) uchun faollashuv kvintillar boʻylab pasayadi, AI tomonidan taklif qilingan xususiyat (#63) uchun esa ortadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Everyarmweevaluateanditslabelundertheidea-authorshiprule. “Attacked” marks model-written text that was humanized or adversarially rewritten; its ideas stay the model’s. “Mixed”armsarereportedasP(AI)only;“notplaced”armskeepmostofamodel’sproseaftera person’s edit and are left out of the quadrants.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-tT3.jpg\" alt=\"Jadval 3\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Detektorlar&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;g'oya&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;manbasini&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bilmaydi&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Rejalar orqali&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tuzilmani&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tahlil qilish&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Sun'iy&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;intellekt&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;g'oyalarini&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;aniqlash&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;AHAMIYATI&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Kontentni&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tekshirishning&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yangi&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;standarti&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Preprint hali taqriz qilinmagan. Xulosalar dastlabki.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"manba\"&gt;&lt;a href=\"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html#manba\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manba&lt;/span&gt;&lt;/a&gt;Manba&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Manba&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Kategoriya&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Preprint litsenziyasi&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;provenance&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mualliflar: Rishanth Rajendhran, Minjoon Choi, Jenna Russell, Ramya
