        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"143\" cy=\"154\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"557\" cy=\"219\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · PROVENANCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellekt yordamida&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;xatosiz infografikalarni&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yaratish usuli&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f1.jpg\" alt=\"1-rasm: InfoAgent sharhi. Foydalanuvchi soʻrovi, olingan dalillar va dizayn priorlari tiplashtirilgan IVDga kompilyatsiy\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: InfoAgent sharhi. Foydalanuvchi soʻrovi, olingan dalillar va dizayn priorlari tiplashtirilgan IVDga kompilyatsiya qilinadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: InfoAgent sharhi. Foydalanuvchi soʻrovi, olingan dalillar va dizayn priorlari tiplashtirilgan IVDga kompilyatsiya qilinadi. Har bir maʼlumot tashuvchi element dalil manbasini, fazoviy hududni, bajarilish yoʻnalishini, bogʻliqlik tobeliklarini va tekshirilishi mumkin boʻlgan majburiyatlarni saqlab qoladi. Vizual, simvolik va bogʻlovchi qatlamlar bajarilish izlari bilan birlashtiriladi. Shundan soʻng, IVD boshqaruvidagi tekshirish elementlar boʻyicha indekslangan qoidabuzarliklarni tegishli kontent, simvolik, bogʻlovchi, maket yoki vizual tuzatishlarga moslashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Sun'iy intellekt tomonidan yaratilgan infografikalarda ko'pincha ma'lumotlar va vizual tasvirlar o'rtasida nomuvofiqliklar kuzatiladi. Tadqiqotchilar taqdim etgan InfoAgent tizimi vizual elementlarni manbalar bilan bog'laydigan maxsus graf tuzilmasidan foydalanadi. Bu yondashuv butun tasvirni qayta yaratmasdan, faqat xato qismlarni tuzatishga imkon beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;IVD har bir vizual obyektni aniq ma'lumot manbasi bilan bog'laydi&lt;/li&gt;\n&lt;li&gt;Tizim faqat xato qismlarni mahalliy darajada tuzatadi&lt;/li&gt;\n&lt;li&gt;Avtomatik tuzatishdan so'ng tekshiruv muvaffaqiyati 28,5% gacha yetdi&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;InfoAgent IVD (Infographic Visual Description) deb nomlangan oraliq tavsifdan foydalanadi. U faktik ma'lumotlarni, dalillarning kelib chiqishini va tekshirish majburiyatlarini bog'liqliklar grafida qayd etadi. Tizim vizual, belgili va bog'lovchi qatlamlarni ajratib, har bir elementning dastlabki hujjatdan yakuniy tasvirgacha bo'lgan yo'lini kuzatib boradi.&lt;/p&gt;\n&lt;p&gt;Xatolik aniqlanganda, tizim butun tasvirni emas, balki faqat ta'sirlangan qismlarni qayta hisoblab chiqadi. InfoGraphicBench-Evidence testlarida InfoAgent yordamida tekshiruvdan o'tgan infografikalar ulushi 21,5% dan 28,5% gacha oshdi. Mahalliy tuzatishlar o'rtacha 12,4% maydonni o'zgartiradi, bu esa global qayta generatsiyadagi 67,3% ko'rsatkichdan ancha samaralidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim taqdim etilgan ma'lumotlar sifatiga tayanadi va tashqi dunyodagi faktik haqiqatni kafolatlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ishonchli infografikani yaratish faktlar, belgilar va vizual aloqalarning renderlash hamda tahrirlash jarayonida izchil saqlanishini talab qiladi. Har qanday elementni tuzatish uning daliliy bazasini va o'zgarishdan ta'sirlangan bog'liqliklarni kuzatib borishni taqozo etadi. Biz InfoAgent — dalillarga asoslangan vizual-ramziy dasturlarni sintez qilish uchun mo'ljallangan, trening talab qilmaydigan tizimni taqdim etamiz.&lt;/p&gt;\n&lt;p&gt;Tizim Infographic Visual Description (IVD) formatidan foydalanadi, u faktik ma'lumotlarni, dalillar manbasini, bajarilish yo'llarini va tekshirish majburiyatlarini tiplangan bog'liqliklar grafigi ko'rinishida qayd etadi. Kompilyatsiya jarayoni dizayn bo'yicha oldindan belgilangan bilimlar (priors) bilan boshqariladi, qatlamli bajarilish esa rastrli sintezni tahrirlanadigan ramziy va bog'lovchi ob'ektlar bilan birlashtirib, ularning izlarini saqlab qoladi. Bog'liqliklarni hisobga oluvchi tuzatish mexanizmi xatoliklarni lokallashtiradi, ta'sirlangan bog'liqliklarni qayta tekshiradi va belgilangan tekshiruvchilar ostida majburiyatlarning bajarilishini ta'minlaydi. Hal etilmagan majburiyatlar ochiq qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vizual-ramziy dasturlash — bu grafik elementlarni kod va ma'lumotlar bilan bog'lash usuli bo'lib, u tasvirni dastur kabi tahrirlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;IGenBench benchmarkida InfoAgent 93.0% Q-ACC va 59.0% I-ACC ko'rsatkichlariga erishadi. Shuningdek, biz InfoGraphicBench-Evidence'ni taqdim etdik: 200 ta test so'rovi bo'yicha to'liq nazorat ro'yxatidan o'tish darajasi Same-IVD prompti uchun 21.5% dan, dastlabki qatlamli chiqish uchun 23.5% gacha va tuzatishdan keyin 28.5% gacha oshdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent infografikaning dalillarga muvofiqligini 28.5% gacha oshiradi, bunda lokal tuzatishlar tuvalning atigi 12.4% qismini o'zgartiradi, global qayta generatsiyada esa bu ko'rsatkich 67.3% ni tashkil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;120 ta audit qilingan tuzatish holatlari shuni ko'rsatdiki, lokallashtirilgan ta'mirlash o'rtacha hisobda tuvalning 12.4% qismini o'zgartiradi, global qayta generatsiya esa 67.3% maydonni qayta ishlashni talab qiladi.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Infografika faktlar, raqamli ma'lumotlar va vizual tushuntirishlarni bitta maydonda birlashtiradi. Jurnalistika va ta'limda ularning foydaliligi dizaynning o'qilishi va ma'lumotlarning aniqligiga bog'liq. Hatto chiroyli kompozitsiya ham, agar qiymat tasdiqlanmagan bo'lsa yoki manba noto'g'ri ko'rsatilgan bo'lsa, foydalanuvchini chalg'itishi mumkin. Ishonchli generatsiya shunchaki vizual ko'rinishni emas, balki dalillar, matn va vizual elementlar o'rtasidagi bog'liqlikni saqlashni talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Infografika ishonchliligi ma'lumotlar va vizual tasvir o'rtasidagi bog'liqlikni saqlab qolishga asoslanadi, bu esa tahrirlash jarayonida juda muhimdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Infografika bo'yicha tadqiqotlar hujjatlarga asoslangan generatsiya, mualliflik vositalari va ishonchlilikni baholashni qamrab oladi. Zamonaviy tasvir modellari va tadqiqot agentlari tashqi bilimlarni tartibga solish va kontekstual aniqlikni yaxshilashda yordam beradi. InfoGen, GenClaw va M3 kabi tizimlar metama'lumotlar va vizual eskizlardan foydalanadi. Biroq, tahrirlash paytida muammo yuzaga keladi: bir elementni (masalan, ko'rsatkich o'qini) to'g'rilash uning ma'lumotlar bilan bog'liqligini buzishi mumkin. Tahrirlanadigan ob'ektning o'zi qayta tekshirilishi kerak bo'lgan bog'liqliklar haqida ma'lumot bermaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IVD (Infographic Visual Description) — bu kontent, geometrik hududlar va tekshirish majburiyatlarini o'z ichiga olgan bog'liqliklar grafigi ko'rinishidagi oraliq taqdimot.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz InfoAgent tizimini taqdim etamiz — bu dalillarga asoslangan vizual-ramziy dasturlarni sintez qilish uchun trening talab qilmaydigan tizim. Uning markazida IVD yotadi, u faktik da'voni, uning manbasini va renderlangan ob'ektni bog'laydi. InfoAgent vazifalarni taqsimlaydi: tasvirlar vizual generatorga, aniq ma'lumotlar ramziy renderlashga, o'qlar va izohlar esa bog'lash jarayoniga o'tadi. Tizim renderlash daraxtini saqlab qoladi, bu xatolarni aniq kontent yoki geometriya darajasida kuzatish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu tadqiqotda barcha asosiy modellar muzlatilgan holda qoladi, bu esa tizim imkoniyatlarini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz InfoAgent'ni IGenBench va yangi InfoGraphicBench-Evidence (260 ta so'rov, shundan 200 tasi test uchun) to'plamlarida baholadik. InfoAgent IGenBench'da 93,0 Q-ACC va 59,0 I-ACC natijalariga erishdi. InfoGraphicBench-Evidence'da to'liq tekshiruvdan o'tish darajasi (Full) 21,5% dan 28,5% gacha ko'tarildi. Mahalliy ta'mirlash (repair) o'rtacha 12,4% maydonni o'zgartiradi, global qayta generatsiya esa 67,3% ni tashkil qiladi. Natijalar bog'liqlikni saqlash va maqsadli ta'mirlashning qiymatini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"related-work\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#related-work\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RELATED WORK&lt;/span&gt;&lt;/a&gt;RELATED WORK&lt;/h4&gt;\n&lt;p&gt;Agentli tasvir generatsiyasi. Zamonaviy matndan tasvirga o'tkazish modellari yuqori sintez aniqligi va murakkab ko'rsatmalarga amal qilish qobiliyatini namoyish etadi. Yangi agent tizimlari tashqi bilimlar, vositalardan foydalanish va iterativ nazorat orqali bu imkoniyatlarni kengaytiradi. Masalan, Gen-Searcher kabi tizimlar generatsiyadan oldin matnli va vizual dalillarni qidiradi, Qwen-Image-Agent esa kontekstni to'ldirish uchun rejalashtirish va xotiradan foydalanadi. M3 kabi yondashuvlar murakkab so'rovlarni tekshiriladigan cheklovlarga ajratib, xatolarni tuzatadi. InfoAgent har bir elementni dalillar va bajarilish yo'llari bilan bog'lash orqali tasvirning alohida qismlarini verifikatsiya qilish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Standart modellardan farqli o'laroq, agent tizimlari har bir tasvir elementini tashqi ma'lumotlar va tekshiriladigan majburiyatlar bilan bog'lab, ularning kuzatiluvchanligini ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Strukturalashtirilgan vizual kommunikatsiya. Tadqiqot tizimlari ma'lumotlarni kod va iterativ tahrirlash orqali multimodal hisobotlarga aylantiradi. Infografika sohasi oddiy jadvallardan avtomatlashtirilgan «ma'lumotlar hikoyalari»ga o'tdi. Hozirgi ishlanmalar yirik infografika resurslarini yaratish va statistik grafiklar ishonchliligini baholashni o'z ichiga oladi. InfoAgent yagona kanvasda infografika yaratishga qaratilgan bo'lib, unda har bir belgi va obyekt faktlarga asoslangan bo'lishi shart. Tizim vizual sintezni tahrirlanadigan ramziy ma'lumotlar bilan bog'laydigan bajariladigan elementlar grafidan foydalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bajariladigan elementlar grafi — bu tizimga tasvirni shunchaki chizish emas, balki har bir obyektni kod sifatida boshqarish va faktlarga muvofiqligini tekshirish imkonini beruvchi ma'lumotlar strukturasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metodlar\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#metodlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;METODLAR&lt;/span&gt;&lt;/a&gt;METODLAR&lt;/h4&gt;\n&lt;p&gt;Biz InfoAgent tizimini taklif qilamiz — bu o‘qitishni talab qilmaydigan tizim bo‘lib, infografika yaratishni dalillarga asoslangan vizual-ramziy dasturlash jarayoniga aylantiradi. Tizim foydalanuvchi so‘rovi x, dalillar to‘plami E va dizayn-prior s ni qabul qiladi. InfoAgent ularni bajariladigan IVD (Infographic Visual-symbolic Description) dasturiga kompilyatsiya qiladi va natijani quyidagicha hosil qiladi: z = Fivd(x, E, s), (y, T) = Exec(z). Bunda z — kompilyatsiya qilingan IVD, y — tayyor infografika, T esa IVD elementlari va vizual obyektlar o‘rtasidagi bog‘liqlikdir. Barcha bazaviy modellar va renderlash vositalari o‘zgarishsiz qoladi. 1-rasmda ko‘rsatilganidek, IVD har bir elementni manzillanadigan qiladi, uning ma’lumotlar manbasini, joylashuvini va bajarilish yo‘lini qayd etadi. Bu xatolik yuz berganda butun tasvirni qayta yaratmasdan, faqat kerakli qismni tuzatish imkonini beradi. Tekshiruv &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; majburiyatlariga asoslanadi: natija faqat barcha kritik tekshiruvlar PASS maqomini olganda sertifikatlangan hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent infografika yaratishni bajariladigan kodga aylantiradi, bunda har bir element ma’lumot manbasiga bog‘langan bo‘lib, bu xatolarni aniq tuzatish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"31-dalillar-va-dizayn-priorlar\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#31-dalillar-va-dizayn-priorlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 DALILLAR VA DIZAYN-PRIORLAR&lt;/span&gt;&lt;/a&gt;3.1 DALILLAR VA DIZAYN-PRIORLAR&lt;/h4&gt;\n&lt;p&gt;InfoAgent ikki turdagi kontekstni yig‘adi. Dalillar moduli matn parchalari, raqamlar va manbalarni to‘playdi. Har bir fakt manba bilan bog‘lanishi shart, aks holda u bloklanadi. Dizayn-prior 4 481 ta infografikadan iborat bankdan olinadi. Maketlar va uslublar UMAP, K-Means va Uord algoritmlari yordamida klasterlanadi. Vakillik namunalari axborot tuzilmasini tasvirlaydigan «ko‘nikma kartalari»ga jamlanadi. Natijani shakllantirishda estetika emas, dalillarning qamrovi va o‘qilishi ustuvor hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Ko‘nikma kartasi» — bu dizayn shablonining tuzilgan tavsifi bo‘lib, tizimga ma’lumotlar mantig‘ini buzmagan holda elementlarni qanday joylashtirishni tushunishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-ivd-bajariladigan-shartnoma-sifatida\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#32-ivd-bajariladigan-shartnoma-sifatida\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2 IVD BAJARILADIGAN SHARTNOMA SIFATIDA&lt;/span&gt;&lt;/a&gt;3.2 IVD BAJARILADIGAN SHARTNOMA SIFATIDA&lt;/h4&gt;\n&lt;p&gt;IVD &lt;span class=\"yfm-latex\" data-content=\"z%20%3D%20(E%2C%20U%2C%20R%2C%20G%2C%20%5COmega)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; sifatida ifodalanadi, bu yerda E — dalillar, U — kanvas hududlari, R — o‘qish tartibi, &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — majburiyatlar, G — bog‘liqliklar grafidir. Har bir a_i elementi (m_i, p_i, r_i, b_i, c_i) sxemasi bo‘yicha tavsiflanadi. Majburiyatlar &lt;span class=\"yfm-latex\" data-content=\"%5Comega_j%20%3D%20(S_j%2C%20%5Cphi_j%2C%20%0Au_j%2C%20%5Cgamma_j)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; nimani tekshirish kerakligini belgilaydi (masalan, matnning aniq mosligi). Kompilyator elementlarni uchta qatlamga taqsimlaydi: vizual (vis), ramziy (sym) va bog‘lovchi (bind). Bajarilish yo‘li (2)-formula bo‘yicha qatlamlar soni va xarajatlarni minimallashtirish orqali tanlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim belgilangan shartnomalar bajarilishini kafolatlaydi, lekin keng ma’noda faktik haqiqatni mutlaq kafolatlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-trassirlashni-saqlovchi-qatlamli-bajarish\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#33-trassirlashni-saqlovchi-qatlamli-bajarish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 TRASSIRLASHNI SAQLOVCHI QATLAMLI BAJARISH&lt;/span&gt;&lt;/a&gt;3.3 TRASSIRLASHNI SAQLOVCHI QATLAMLI BAJARISH&lt;/h4&gt;\n&lt;p&gt;Har bir bajarilish qatlami vizual artefakt va trassirovkani qaytaradi, ular (3)-formula bo‘yicha yakuniy tasvirga birlashtiriladi va elementlar darajasidagi bog‘liqliklar saqlanadi.&lt;/p&gt;\n&lt;p&gt;Tizim T bajarilish izidan foydalanib, &lt;span class=\"yfm-latex\" data-content=\"%5Cell\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; qatlamlariga taqsimlangan IVD elementlarini kuzatib boradi. Vektorli ob'ektlar o'zining geometriyasi, z-tartibi va tarkibini o'z ichiga olgan renderlash daraxti deskriptorlarini saqlaydi. Raster elementlar uchun mintaqaviy izlar qo'llaniladi. Ob'ektga bog'lanish talab etilganda, parser IVD elementini niqob yoki ramka bilan moslashtirib, ishonchlilik ballini beradi; past ballar UNKNOWN deb belgilanadi. Vizual qatlam fon va teksturalarni sintez qilsa, ramziy qatlam matn, formulalar va grafiklarni SVG formatida aniq renderlaydi. Bog'lanish qatlami esa izohlar va yo'naltiruvchi chiziqlar uchun javobgardir.&lt;/p&gt;\n&lt;h4 id=\"three-valued-verification\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#three-valued-verification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Three-valued verification&lt;/span&gt;&lt;/a&gt;Three-valued verification&lt;/h4&gt;\n&lt;p&gt;Har bir ω_j majburiyati uchun tekshiruv &lt;span class=\"yfm-latex\" data-content=\"s_j%20%5Cin%20%5C%7BPASS%2C%20FAIL%2C%20UNKNOWN%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; holatini, κ_j ishonchlilik darajasini va w_j diagnostik guvohni qaytaradi. Tekshiruvlar qatorlar, formulalar, kontrast va vizual-semantik moslikni qamrab oladi. Modelga asoslangan tekshiruvlar belgilangan promptlar va kalibrlangan chegaralardan foydalanadi. Yakuniy sertifikat C(y, z) barcha majburiyatlar holatini qayd etadi. FAIL yoki kritik UNKNOWN holatidagi majburiyatlar tuzatish bosqichiga o'tkaziladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim uch qiymatli verifikatsiya logikasidan foydalanadi, bunda kritik xatolar (FAIL/UNKNOWN) avtomatlashtirilgan tuzatish jarayonini ishga tushiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"transactional-repair\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#transactional-repair\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transactional repair&lt;/span&gt;&lt;/a&gt;Transactional repair&lt;/h4&gt;\n&lt;p&gt;Transaksion ta'mirlash ta'sir doirasini H(q) aniqlash uchun bog'liqlik grafidan foydalanadi. Operatorlar kutubxonasi yuklamani almashtirish, ramzlarni qayta renderlash va maketni o'zgartirish kabi funksiyalarni o'z ichiga oladi. Nomzodlar &lt;span class=\"yfm-latex\" data-content=\"Q%5E%7B%5Cstar%7D(C)%20%3D%20(F_%7Bcrit%7D%20%2B%20U_%7Bcrit%7D%2C%20F%20%2B%20U%2C%20F_%7Bcrit%7D%2C%20F)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; metrika bo'yicha baholanadi, bu yerda F va U xatolar va noaniqliklarning umumiy sonidir. Nomzod faqat kritik majburiyat PASS holatiga o'tsa va bajarilmagan majburiyatlar kamaysa qabul qilinadi. InfoAgent &lt;span class=\"yfm-latex\" data-content=\"Q%5E%7B%5Cstar%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; qiymatini, o'zgartirishlar hajmini va vositalar narxini minimallashtiradi. 1-jadvalda InfoAgent samaradorligi (Q-ACC 93.0, I-ACC 59.0) ko'rsatilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Transaksion ta'mirlash — bu tizim barcha kritik sifat talablari bajarilgunga qadar hujjat elementlarini ketma-ket o'zgartiradigan iterativ jarayondir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"experiments\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#experiments\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;EXPERIMENTS&lt;/span&gt;&lt;/a&gt;EXPERIMENTS&lt;/h4&gt;\n&lt;p&gt;4.1 EKSPERIMENTAL QURILMA&lt;/p&gt;\n&lt;p&gt;Tadqiqot doirasida infografikaning atomar va yaxlit darajadagi ishonchliligi, promptdan tashqari IVD (Intermediate Visual Description) bajarilishi samaradorligi hamda xatolarni lokal tuzatish mexanizmlari baholanadi. Shuningdek, ishonchlilik, vizual sifat, natijalar qamrovi va hisoblash xarajatlari o‘rtasidagi muvozanat tahlil qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IVD (Intermediate Visual Description) — bu vizual elementlarning oraliq tavsifi bo‘lib, modelga rasm chizishdan oldin infografika tuzilishini rejalashtirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sinovlar uchun ikkita ma’lumotlar to‘plami qo‘llaniladi. IGenBench 600 ta prompt, 30 ta infografika turi va 10 ta ishonchlilik toifasiga oid 5259 ta atomar savolni o‘z ichiga oladi. Sinov protokoli faqat bitta natija (one-output protocol) chiqarishni nazarda tutadi va benchmark javoblariga kirishni taqiqlaydi. InfoGraphicBench-Evidence oltita soha bo‘yicha 260 ta so‘rovni o‘z ichiga oladi (30 ta ishlab chiqish, 30 ta kalibrlash va 200 ta test namunasi). O‘rtacha har bir namunada 8,4 ta talab, 4,7 ta matn bloki, 2,3 ta raqamli yoki manba birligi va 2,6 ta matn-vizual bog‘lanish mavjud.&lt;/p&gt;\n&lt;p&gt;Bazaviy modellar (Baselines) sifatida DirectT2I, RAG Prompt, Same-IVD Prompt, shuningdek, Gen-Searcher va GenClaw tizimlari nazorat ostida ishlatiladi. Bundan tashqari, SVG/HTML renderlash usullari va xatolarni tuzatish moduli o‘chirilgan (K=0) InfoAgent versiyasi sinovdan o‘tkaziladi. Metrikalar IGenBench uchun atomar savollar aniqligi (Q-ACC) va umumiy aniqlik (I-ACC), InfoGraphicBench-Evidence uchun esa qamrov (Out), talablarni bajarish (ReqCov) va to‘liqlik (Full) ko‘rsatkichlarini o‘z ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent barcha metrikalar bo‘yicha eng yuqori natijalarni ko‘rsatadi: to‘liqlik (Full) 28,5% ga, talablarni bajarish aniqligi (ReqCov) esa 83,54% ga yetadi, nazorat qilinmaydigan elementlar darajasi esa atigi 0,57% ni tashkil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modellar samaradorligi 1-Jadvalda keltirilgan bo‘lib, unda aniqlik, matn bilan moslik va vizual bog‘lanish ko‘rsatkichlari solishtiriladi.&lt;/p&gt;\n&lt;h4 id=\"full-infoagent\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#full-infoagent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Full InfoAgent&lt;/span&gt;&lt;/a&gt;Full InfoAgent&lt;/h4&gt;\n&lt;p&gt;3-jadvalda InfoAgent tizimi va uning modifikatsiyalari natijalari keltirilgan. Asosiy metrikalar: CritPass (barcha tanqidiy tekshiruvlardan o'tgan javoblar ulushi), NonSup (dalillar bilan tasdiqlanmagan faktlar foizi), ReqText-F1 (matnli satrlarning mosligi), Bind-Q (matnning vizual elementlarga bog'lanish sifati 1–5 shkalada), Q-Align (idrok sifati) va Layout-Q (maket tuzilishi va o'qilishi).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent'ning to'liq versiyasi CritPass ko'rsatkichi bo'yicha 61,5% natijaga erishadi, bu soddalashtirilgan modellardan sezilarli darajada yuqori.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"protokol-va-implementatsiya\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#protokol-va-implementatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Protokol va implementatsiya&lt;/span&gt;&lt;/a&gt;Protokol va implementatsiya&lt;/h4&gt;\n&lt;p&gt;Dalillarga asoslangan usullar bir xil so'rovlarni oladi. Asosiy rejalashtiruvchi sifatida Gemini 3.1 Pro Team (2026), renderlash uchun esa Qwen-Image (2025) ishlatiladi. Jarayon renderlash daraxtini tekshirish va avtonom verifikatsiyani o'z ichiga oladi. Baholash 120 ta infografika (600 ta qaror) va 200 ta test chiqishi asosida amalga oshiriladi. Statistik ahamiyatlilik Holm tuzatishi bilan juftlik butstrepping (10 000 namuna) usuli orqali tasdiqlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Juftlik butstrepping — ishonch intervallarini hisoblash uchun ma'lumotlarni qayta tanlashga asoslangan statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"43-dalillar-nazorati-bilan-baholash\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#43-dalillar-nazorati-bilan-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 Dalillar nazorati bilan baholash&lt;/span&gt;&lt;/a&gt;4.3 Dalillar nazorati bilan baholash&lt;/h4&gt;\n&lt;p&gt;InfoAgent'ning lokal tuzatish mexanizmi I-ACC ko'rsatkichini 45,0% dan 59,0% gacha oshiradi (14,0 foiz punktlik o'sish). 2(a)-rasmda to'liqlik, kodlash va belgilash kategoriyalaridagi yaxshilanishlar ko'rsatilgan. 2(b)-rasm shuni ko'rsatadiki, tanqidiy qoidabuzarliklarning aksariyati ikki sikl ichida bartaraf etiladi.&lt;/p&gt;\n&lt;h4 id=\"44-mexanizmlar-va-tuzatishlar-tahlili\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#44-mexanizmlar-va-tuzatishlar-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4 Mexanizmlar va tuzatishlar tahlili&lt;/span&gt;&lt;/a&gt;4.4 Mexanizmlar va tuzatishlar tahlili&lt;/h4&gt;\n&lt;p&gt;Flat plan (bog'liqliklar va bajariladigan majburiyatlar olib tashlangan) bilan solishtirish shuni ko'rsatadiki, tuzilmaviy rejalashtirish juda muhim: CritPass 61,5% dan 42,5% gacha tushadi. Loyiha ustuvorliklarini qidirish bosqichini olib tashlash Layout-Q va Q-Align ko'rsatkichlarini eng ko'p pasaytiradi. Xatolarni lokal tuzatish global qayta generatsiyaga qaraganda samaraliroq: u aniqlangan qoidabuzarliklarning 85,9% ini tuzatadi va kanvasning atigi 12,4% qismini o'zgartiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent ishlatilganda ham chiqishlarning 41% i kamida bitta xatoni o'z ichiga oladi, bu obyektlarni bog'lash mexanizmlarini yanada takomillashtirish zarurligini ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Tadqiqotda qo'shimcha o'qitishni talab qilmaydigan (training-free) InfoAgent freymvorki taqdim etildi. Ushbu tizim faktik dalillar, render qilingan elementlar va tekshirish majburiyatlarini vizual dekompozitsiya (Interactive Visual Decomposition, IVD) mexanizmi orqali o'zaro bog'laydi. Ko'p darajali ijro etish strukturasi xatoliklarni aniq topish uchun barcha izlarni saqlab qoladi, bog'liqliklarni hisobga oluvchi tuzatish algoritmi (dependency-aware repair) esa lokal tuzatishlarni amalga oshirib, faqat ta'sirlangan komponentlar va himoyalangan majburiyatlarni qayta tekshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Boshlang'ich ma'lumotlar o'zgarmagan holda, InfoAgent qo'llanilishi InfoGraphicBench-Evidence barchamarkida to'liq nazorat ro'yxatidan o'tish ko'rsatkichini Same-IVD Prompt usulidagi 21,5% dan 28,5% gacha oshirdi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Eksperimental natijalar taklif etilgan yondashuvning afzalliklarini tasdiqlaydi. O'zgarmas dalillar va dastlabki IVD tuzilmasi sharoitida, InfoGraphicBench-Evidence ma'lumotlar toplamida to'liq nazorat ro'yxatidan o'tish ulushi (complete-checklist pass rate) Same-IVD Prompt bazaviy usulidagi 21,5% dan InfoAgent yordamida 28,5% gacha ko'tarildi. IGenBench natijalari va tuzatishlar lokalizatsiyasi tahlili bilan birgalikda, ushbu raqamlar generatsiya va tahrirlash davomida dalillar bog'liqligi hamda ijro zanjirini saqlab qolish muhimligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Tizim ishida uchraydigan asosiy xatoliklar to'liq bo'lmagan ziddiyatli ma'lumotlar, rastr obyektlarini aniq bog'lay olmaslik va semantik tekshiruvlarning mukammal emasligi bilan bog'liq.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizimning cheklovlari qatoriga to'liq bo'lmagan yoki qarama-qarshi dalillar, rastr obyektlarini vizual elementlarga bog'lashdagi noaniqliklar hamda mukammal bo'lmagan semantik tekshiruvlar kiradi. Yakuniy sertifikat barcha natijalarni e'lon qilingan majburiyatlar bo'yicha qayd etadi va hal qilinmagan talablarni bajargan deb hisoblamasdan, ularni ochiq holatda saqlab qoladi.&lt;/p&gt;\n&lt;p&gt;Kelajakdagi tadqiqotlar yo'nalishi sifatida mualliflar dalillarni moslashtirishni yaxshilash, vizual bog'liqlik aniqligini oshirish hamda IVD konsepsiyasini interaktiv va ko'p sahifali hujjatlarga tatbiq etishni belgilab olganlar.&lt;/p&gt;\n&lt;h4 id=\"suniy-intellektdan-foydalanish-togrisida-bayonot-aiuse-statement\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#suniy-intellektdan-foydalanish-togrisida-bayonot-aiuse-statement\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sun'iy intellektdan foydalanish to'g'risida bayonot (AIUSE STATEMENT)&lt;/span&gt;&lt;/a&gt;Sun'iy intellektdan foydalanish to'g'risida bayonot (AIUSE STATEMENT)&lt;/h4&gt;\n&lt;p&gt;Maqolani tayyorlash jarayonida Google Gemini modelidan faqat grammatikani to'g'rilash va matn uslubini yaxshilash uchun foydalanilgan. Tadqiqot g'oyasi, metodologiya, eksperimentlar o'tkazish yoki ma'lumotlar tahlilida AI vositalari qo'llanilmagan. Qo'lyozma mazmuni uchun to'liq mas'uliyat mualliflar zimmasiga tushadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f1.jpg\" alt=\"1-rasm: InfoAgent sharhi. Foydalanuvchi soʻrovi, olingan dalillar va dizayn priorlari tiplashtirilgan IVDga kompilyatsiy\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: InfoAgent sharhi. Foydalanuvchi soʻrovi, olingan dalillar va dizayn priorlari tiplashtirilgan IVDga kompilyatsiya qilinadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: InfoAgent sharhi. Foydalanuvchi soʻrovi, olingan dalillar va dizayn priorlari tiplashtirilgan IVDga kompilyatsiya qilinadi. Har bir maʼlumot tashuvchi element dalil manbasini, fazoviy hududni, bajarilish yoʻnalishini, bogʻliqlik tobeliklarini va tekshirilishi mumkin boʻlgan majburiyatlarni saqlab qoladi. Vizual, simvolik va bogʻlovchi qatlamlar bajarilish izlari bilan birlashtiriladi. Shundan soʻng, IVD boshqaruvidagi tekshirish elementlar boʻyicha indekslangan qoidabuzarliklarni tegishli kontent, simvolik, bogʻlovchi, maket yoki vizual tuzatishlarga moslashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f2.jpg\" alt=\"2-rasm: Ishonchlilik tahlili va kontekstli tuzatish dinamikasi. (a) IGen-Bench platformasida toifalar boʻyicha Q-ACC (sa\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Ishonchlilik tahlili va kontekstli tuzatish dinamikasi. (a) IGen-Bench platformasida toifalar boʻyicha Q-ACC (savol-javob aniqligi). (b) Auditdan oʻtgan va tuzatishga yaroqli deb topilgan natijalarda uchta tuzatish raundi davomida aniqlangan oʻrtacha kritik qoidabuzarliklar va umumiy tahrirlangan maydon.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f3.jpg\" alt=\"3-rasm: Moliyaviy voqealar va mahsulot spetsifikatsiyasi soʻrovlarining sifatli qiyosiy tahlili.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Moliyaviy voqealar va mahsulot spetsifikatsiyasi soʻrovlarining sifatli qiyosiy tahlili.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Moliyaviy voqealar va mahsulot spetsifikatsiyasi soʻrovlarining sifatli qiyosiy tahlili. Ramkalar faktik, simvolik, bogʻliqlik va ierarxiya farqlarini koʻrsatadi; ✓, × va ? belgilari mos ravishda bajarilgan, buzilgan va qisman bajarilgan talablarni anglatadi. Barcha natijalar qoʻlda tuzatishlarsiz koʻrsatilgan. Figure 3 vaqtga sezgir moliyaviy soʻrovni spetsifikatsiyaga boy mahsulot soʻrovi bilan taqqoslaydi. DirectT2I vizual jihatdan ishonarli kompozitsiyalarni yaratadi, ammo kerakli spetsifikatsiyalarni tushirib qoldirishi, yorliqlarni buzishi yoki qoʻllab-quvvatlanmaydigan qiymatlarni koʻrsatishi mumkin. Gen-Searcher tashqi kontekst hisobiga faktik va spetsifikatsiya qamrovini yaxshilaydi, biroq aniq matn va yorliqlar izchilligi barqaror boʻlib qolmaydi, chunki olingan dalillar asosan prompt darajasida qoʻllaniladi. GenClaw kodga asoslangan tuzilmaviy renderlash orqali ishonchliroq simvolik kontentni taqdim etadi, ammo uning natijalari zaifroq vizual ierarxiya va qatʼiyroq kompozitsiyalarni koʻrsatadi. InfoAgent esa dalillarni manzillanadigan IVD elementlariga kompilyatsiya qiladi va muvofiqlashtirilgan vizual, simvolik hamda bogʻlovchi qatlamlar orqali faktik qiymatlar, spetsifikatsiyalar va lokal munosabatlarni bajaradi. Izohlangan ramkalar va holat koʻrsatkichlari faktik aniqlik, simvolik aniqlik, yorliqlar izchilligi va vizual ierarxiyadagi farqlarni ajratib koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI infografika&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;laridagi nomuv&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ofiqliklar&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bog'liqliklar&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;grafi orqali&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;elementlarni&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ulash&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=
