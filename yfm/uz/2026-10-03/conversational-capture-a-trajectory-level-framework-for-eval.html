        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"237\" cy=\"105\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"543\" cy=\"195\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Nega sun'iy intellekt&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qidiruv tizimlari uchun&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;optimallashtirish&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kutilganidek ishlamaydi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval-f1.jpg\" alt=\"1-rasm: Suhbatni qamrab olish (conversational capture) sharhi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Suhbatni qamrab olish (&lt;a href=\"concepts/conversational-capture.html\"&gt;conversational capture&lt;/a&gt;) sharhi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Suhbatni qamrab olish (conversational capture) sharhi. (A) Inson va agent o'rtasidagi axborot izlash yopiq tsikldir: 𝑟𝑡 javobi foydalanuvchining 𝑏𝑡+1 e'tiqodini va shuning uchun navbatdagi 𝑞𝑡 = 𝑄(𝑏𝑡) so'rovini yangilaydi, bu yerda 𝑄 — so'rov operatori (inson tomonidagi M2 kanali), shu bilan birga dvigatelni ℎ𝑡 dialog tarixi (mashina tomonidagi M1 kanali) bilan shartlaydi; optimallashtirilgan 𝑆GEO manbalar to'plamidagi dastlabki &lt;a href=\"concepts/generative-engine-optimization.html\"&gt;GEO&lt;/a&gt; siljishi ikkala qaytish yo'li bo'ylab tarqaladi. (B) Tsikl kuchayganligi sababli, umumiy trayektoriya o'sishi 𝐿𝑇 bir bosqichli ekstrapolyatsiyadan 𝑇 · 𝐿1 oshadi; ortiqcha qismi 𝐿feedback 𝑇 teskari aloqa hadi bo'lib, u bir bosqichli baholashda aynan nolga teng. Ustun 𝑇=10 da 𝐿𝑇 = 2.68 ni to'g'ridan-to'g'ri hadga (𝐿direct 𝑇 = 1.20) va teskari aloqa hadiga (𝐿feedback 𝑇 = 1.48) ajratadi. Ikkinchisi mashina tomonidagi kanalga (𝐿M1 𝑇 = 0.85, ko'k, foydalanuvchi modeli talab qilinmaydi) va inson tomonidagi kanalga (𝐿M2 𝑇 = 0.63, zang rangli) bo'lingan, (A) dagi kabi ranglangan; jamg'arish koeffitsienti 𝜌 = 2.23. (C) Binobarin, GEO usullarini bir bosqichli o'sish bo'yicha reytinglash ularni trayektoriya o'sishi bo'yicha reytinglash bilan mos kelmaydi (Kendall 𝜏 = 0.4): bir bosqichli g'olib (A) trayektoriya bo'yicha faqat uchinchi o'rinda.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Generativ optimallashtirish (GEO) odatda bitta javob asosida baholanadi, ammo bu haqiqatni aks ettirmaydi. Tadqiqotchilar sun'iy intellekt bilan muloqot yopiq sikl ekanligini, unda dastlabki javoblar kelgusi savollarga ta'sir qilishini isbotladilar. Natijada, manba o'z dolzarbligidan qat'i nazar, tizim e'tiborini ushlab turadigan «suhbat tutib olish» effekti yuzaga keladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Suhbat tutib olish manbani kelajakda iqtibos keltirilish ehtimolini oshiradi.&lt;/li&gt;\n&lt;li&gt;AI bilan dialogdagi teskari aloqa to'g'ridan-to'g'ri optimallashtirishdan kuchliroq bo'lishi mumkin.&lt;/li&gt;\n&lt;li&gt;Bitta javob bo'yicha GEO baholash foydalanuvchiga uzoq muddatli ta'sirni hisobga olmaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar inson va agent o'rtasidagi o'zaro ta'sirni teskari aloqaga ega ikki qatlamli tizim sifatida rasmiylashtirdilar. Ushbu modelda ikkita kanal hisobga olinadi: mashina kanali (dialog tarixi qidiruvga ta'sir qiladi) va inson kanali (AI javobi foydalanuvchining e'tiqodini va keyingi so'rovlarini o'zgartiradi). Mualliflar manbaning to'plangan ko'rinishini tahlil qilish uchun &lt;a href=\"concepts/anchoring.html\"&gt;mustahkamlash&lt;/a&gt; jarayonlari (Polya urnasi) nazariyasini qo'lladilar.&lt;/p&gt;\n&lt;p&gt;Hisob-kitoblar shuni ko'rsatadiki, 10 ta dialog iteratsiyasida to'planish koeffitsienti (compounding ratio) 2 dan oshadi va teskari aloqaning hissasi optimallashtirishning to'g'ridan-to'g'ri ta'siridan ustun bo'lishi mumkin. Bitta so'rov bo'yicha standart baholash (single-turn) uzoq muddatli samaradorlik bilan faqat zaif bog'liqlikka ega (Kendall koeffitsienti τ=0.4), bu esa AI uchun hozirgi SEO usullarini noaniq qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ish nazariy model bo'lib, haqiqiy foydalanuvchilar yoki ishlayotgan qidiruv tizimlari bilan tajribalarni o'z ichiga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ushbu ilmiy ish inson va kompyuter o‘zaro ta’siri (&lt;a href=\"concepts/human-computer-interaction.html\"&gt;HCI&lt;/a&gt;), axborot qidiruvi va sun’iy intellekt usullari sohasidagi fanlararo tahlilga bag‘ishlangan. Tokio universiteti, Tsukuba universiteti, Xirosima universiteti va Milliy informatika instituti kabi nufuzli Yaponiya ilmiy muassasalari vakillari intellektual tizimlar sohasidagi nazariy modellar va amaliy tatbiqlarni o‘rganish uchun birlashdilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot HCI va zamonaviy qidiruv algoritmlarining fundamental jihatlarini qamrab olib, inson markazli texnologiyalarni ishlab chiqish uchun asos yaratadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ish foydalanuvchi va hisoblash tizimlari o‘rtasidagi o‘zaro ta’sirni takomillashtirishga qaratilgan. Metodologiya doirasida mualliflar CCS (Computing Classification System) tasnifiga tayanadilar, bu esa interfeyslarni loyihalash va ma’lumotlarni qayta ishlash algoritmlarini optimallashtirish yondashuvlarini tizimlashtirish imkonini beradi. Tadqiqot guruhi qidiruv natijalarining dolzarbligini oshirish va foydalanuvchi tajribasini yaxshilash uchun zamonaviy sun’iy intellekt modellarini qanday integratsiya qilish mumkinligini tahlil qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HCI (Human-Computer Interaction) — bu insonning kompyuter tizimlari bilan o‘zaro ta’sirini o‘rganuvchi, intuitiv va samarali interfeyslarni yaratishga qaratilgan bilim sohasi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"joriy-baholashning-yashirin-taxminlari\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#joriy-baholashning-yashirin-taxminlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Joriy baholashning yashirin taxminlari&lt;/span&gt;&lt;/a&gt;Joriy baholashning yashirin taxminlari&lt;/h4&gt;\n&lt;p&gt;Generativ qidiruv tizimlarini optimallashtirish (GEO) bo'yicha mavjud tadqiqotlar «ta'sir»ni bir martalik so'rovdagi ko'rinish darajasining o'sishi sifatida belgilaydi. Standart protsedura q so'rovini tanlab olish, tizimni optimallashtirilgan kontent bilan va unsiz ishlatish hamda natijalar o'rtasidagi farqni (masalan, pozitsiyaga moslashtirilgan so'zlar soni yoki &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; bahosi) hisoblashni o'z ichiga oladi. Bu yondashuv ikki asosiy taxminga tayanadi: so'rovlarning ekzogenligi (tizimdan mustaqil) va navbatlarning mustaqilligi (har bir so'rov alohida baholanadi).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavjud GEO metrikalari ko'p bosqichli muloqotdagi inson va agent o'rtasidagi teskari aloqa halqasini e'tiborsiz qoldirgani uchun ta'sirni tizimli ravishda noto'g'ri baholaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Conversational capture (suhbatdagi qamrab olish) — bu manba dastlabki bosqichlarda keltirilganda, foydalanuvchining joriy ehtiyojlaridan qat'i nazar, keyingi bosqichlarda ham qayta paydo bo'lish ehtimolining yuqori bo'lishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar «suhbatdagi qamrab olish» tushunchasini kiritadilar: ko'p bosqichli qidiruvda manba ilgari keltirilgan bo'lsa, u keyingi bosqichlarda ham ko'proq tilga olinadi. Bu ikki kanal orqali yuz beradi: mashina tomoni (tizim tarixni hisobga oladi) va inson tomoni (tizim javobi foydalanuvchini o'sha manba haqida so'rashga undaydi). Mavjud baholash paradigmasi tizimning o'zi dialog tarixini shakllantirishi va kelgusi so'rovlarga ta'sir qilishini inobatga olmaydi. Tadqiqotda teskari aloqaga ega dinamik tizim modeli va trayektoriya darajasidagi metrikalar (kümülatif ko'rinish, qamrab olish koeffitsiyenti) taklif etiladi. Polya urnasi nazariyasi yordamida isbotlanishicha, GEO foydasi dialog davomiyligi bilan superchiziqli ravishda o'sadi, bir martalik baholash esa trayektoriya darajasidagi baholashdan sezilarli darajada farq qiladi (Kendall’s τ=0.4).&lt;/p&gt;\n&lt;h4 id=\"kop-bosqichli-reallik-yopiq-sikl\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#kop-bosqichli-reallik-yopiq-sikl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'p bosqichli reallik: yopiq sikl&lt;/span&gt;&lt;/a&gt;Ko'p bosqichli reallik: yopiq sikl&lt;/h4&gt;\n&lt;p&gt;Dialog tizimlarida o'zaro ta'sir uzluksiz jarayondir: foydalanuvchining b_t holati q_t so'rovini keltirib chiqaradi, unga agent r_t javobini beradi va holatni bt+1 gacha yangilaydi. Agar generativ qidiruvni optimallashtirish (GEO) usuli r_t javobini ma'lum bir s manba tomon siljitsa, bu ikki effektni hosil qiladi. Birinchidan, tizimning kelajakdagi qidiruvi s allaqachon ustunlik qiladigan tarix bilan shartlanadi. Ikkinchidan, bu bt+1 va keyingi qt+1 so'rovini s bilan bog'liq axborot sohasiga itaradi. Bu omillar siklni yopib, t+1 qadamda s manbasini qayta iqtibos keltirish ehtimolini oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dialogdagi so'rovlar endogen, qadamlar esa o'zaro bog'liq: dastlabki bosqichdagi tarafkashlik manba ustunligini mustahkamlovchi teskari aloqa halqasini yaratadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"konversion-qamrov\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#konversion-qamrov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konversion qamrov&lt;/span&gt;&lt;/a&gt;Konversion qamrov&lt;/h4&gt;\n&lt;p&gt;Mualliflar «konversion qamrov» (conversational capture) atamasini kiritadilar. Bu hodisaga ko'ra, manba dastlabki bosqichlarda iqtibos qilinsa, uning keyingi bosqichlarda paydo bo'lish ehtimoli foydalanuvchi ehtiyojidan qat'i nazar sezilarli darajada oshadi. Bu uchta mexanizm orqali sodir bo'ladi: dialog konteksti generatsiya shartlariga kiritilgan; modellar o'zlarining oldingi javoblari bilan izchil qolishga intiladi; qidiruv jarayonining o'zi suhbat konteksti bilan siljiydi. GEO'ni «bir bosqichli ta'sir» sifatida baholash bu qamrovni ko'rinmas qiladi, garchi u alohida javoblar emas, balki trayektoriyalar darajasida namoyon bo'lsa.&lt;/p&gt;\n&lt;h4 id=\"pozitsiyalash-va-bogliq-ishlar\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#pozitsiyalash-va-bogliq-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Pozitsiyalash va bog'liq ishlar&lt;/span&gt;&lt;/a&gt;Pozitsiyalash va bog'liq ishlar&lt;/h4&gt;\n&lt;p&gt;Tadqiqot dialogning har bir qadamini alohida ko'rib chiqadigan joriy baholash usullarini tanqid qiladi va buning o'rniga trayektoriyalarni tahlil qilishni taklif etadi. So'rovlar ketma-ketligi qotib qolgan mavjud benchmarklardan farqli o'laroq, bu ish dialog dinamikasidagi sabab-oqibat bog'liqliklarini o'rganadi. Bu GEO'ni «filtr pufakchalari» va qidiruv tizimlari tarafkashligi muammolari bilan bog'laydi.&lt;/p&gt;\n&lt;h4 id=\"obyektlar-va-yopiq-sikl-dinamikasi\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#obyektlar-va-yopiq-sikl-dinamikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Obyektlar va yopiq sikl dinamikasi&lt;/span&gt;&lt;/a&gt;Obyektlar va yopiq sikl dinamikasi&lt;/h4&gt;\n&lt;p&gt;Tizim ikki qatlamdan iborat: agent (operator A), manba ko'rinishini &lt;span class=\"yfm-latex\" data-content=\"w_t(s)%20%5Cin%20%5B0%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; beradi va foydalanuvchi (operatorlar Q va U), q_t so'rovini shakllantiradi va bt+1 holatini yangilaydi. Tizimning to'liq dinamikasi (1)-tenglama bilan tavsiflanadi, bunda dialog tarixi ht-1 va optimallashtirilgan manbalar SGEO joriy javobga ta'sir qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/black-box.html\"&gt;Qora quti» (black-box) usuli&lt;/a&gt; — tizimning ichki algoritmlariga kirmasdan, faqat kirish va chiqish ma'lumotlarini tahlil qilish yondashuvi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ikki-mustaqil-qamrov-kanali\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#ikki-mustaqil-qamrov-kanali\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ikki mustaqil qamrov kanali&lt;/span&gt;&lt;/a&gt;Ikki mustaqil qamrov kanali&lt;/h4&gt;\n&lt;p&gt;Mualliflar qamrovni ikki o'lchanadigan kanalga ajratadilar: M1 (mashina tomoni) va M2 (inson tomoni). M1 — bu agent A ning xususiyati bo'lib, model o'zining o'tgan iqtiboslarini takrorlashga moyil; bu kontekstga bog'liq dvigatelni tarixga befarq dvigatel bilan solishtirish orqali o'lchanadi. M2 — foydalanuvchi xulq-atvorining hissasi, bunda tizim javobi uning kelajakdagi so'rovlarini o'zgartiradi. M1 va M2 ni ajratish har bir mexanizmning hissasini alohida baholash imkonini beradi.&lt;/p&gt;\n&lt;h4 id=\"dialogdagi-kumulativ-korinish-ccv\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#dialogdagi-kumulativ-korinish-ccv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dialogdagi kümülativ ko'rinish (CCV)&lt;/span&gt;&lt;/a&gt;Dialogdagi kümülativ ko'rinish (CCV)&lt;/h4&gt;\n&lt;p&gt;Manbaning dialog davomidagi umumiy ko'rinishi &lt;span class=\"yfm-latex\" data-content=\"CCV_s%20%3D%20%5Csum_%7Bt%3D1%7D%5E%7BT%7D%20%5Cgamma_t%20w_t(s)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi bilan aniqlanadi, bunda w_t(s) — t-qadamdagi ko'rinish, γ_t esa e'tibor vaznidir. γ_t=1 bo'lganda bu oddiy yig'indiga aylanadi. γ_t ning kamayishi dastlabki javoblarga (birlamchilik effekti), ortishi esa so'nggi javoblarga (yangi ma'lumot effekti) urg'u beradi. Standart holatda γ_t=1 qabul qilinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/cumulative-conversational-visibility.html\"&gt;CCV&lt;/a&gt; foydalanuvchi e'tiborini vaqt bo'yicha taqsimlashni hisobga olgan holda manbaning dialogdagi to'plangan ta'sirini baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"trayektoriya-osishini-dekompozitsiya-qilish\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#trayektoriya-osishini-dekompozitsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Trayektoriya o'sishini dekompozitsiya qilish&lt;/span&gt;&lt;/a&gt;Trayektoriya o'sishini dekompozitsiya qilish&lt;/h4&gt;\n&lt;p&gt;GEO (generativ qidiruvni optimallashtirish) ning bir qadamdagi o'sishi L₁(s) so'rov o'zgarmaganda hisoblanadi. Biroq, butun trayektoriya bo'yicha haqiqiy o'sish L_T(s) GEO va uning yo'qligi o'rtasidagi CCV farqidir. Biz L_T ni &lt;a href=\"concepts/pryamoy-effekt.html\"&gt;to'g'ridan-to'g'ri ta'sir&lt;/a&gt; Ldirect^T (so'rovlar yo'li qat'iy bo'lganda) va teskari aloqa effekti Lfeedback^T (GEO ta'sirida so'rovlarning o'zgarishi natijasida kelib chiqadigan qo'shimcha ko'rinish) ga ajratamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;To'g'ridan-to'g'ri ta'sir — bu standart testlar bashorat qiladigan narsa, teskari aloqa esa tizim javoblari foydalanuvchi xatti-harakatini o'zgartirganda yuzaga keladigan «halqa»dir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"asosiy-xususiyat\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#asosiy-xususiyat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy xususiyat&lt;/span&gt;&lt;/a&gt;Asosiy xususiyat&lt;/h4&gt;\n&lt;p&gt;Lfeedback^T xotirasiz tizimlarda yoki bir qadamli baholashda nolga teng. U faqat «halqadagi inson» yoki dialog tarixi mavjud bo'lganda nolga teng bo'lmaydi, bu esa odatda e'tibordan chetda qoladigan muhim parametrdir.&lt;/p&gt;\n&lt;h4 id=\"teskari-aloqa-kanallarini-ajratish\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#teskari-aloqa-kanallarini-ajratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Teskari aloqa kanallarini ajratish&lt;/span&gt;&lt;/a&gt;Teskari aloqa kanallarini ajratish&lt;/h4&gt;\n&lt;p&gt;Lfeedback^T ikki qismdan iborat: LM1^T (dialog tarixining ht-1 modelga ta'siri) va LM2^T (foydalanuvchi e'tiqodining o'zgarishi tufayli so'rovlarning q_t o'zgarishi). Biz buni kontrfaktik tahlil orqali o'rganamiz: LM1^T so'rovlar qat'iy bo'lganda tarix orqali qamrovni o'lchaydi, LM2^T esa foydalanuvchi GEO ta'sirida aniqlashtiruvchi savollar berganda yuzaga keladigan qo'shimcha qamrovni o'lchaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LM1^T ni foydalanuvchi modelisiz o'lchash mumkin, ammo LM2^T inson omilini va tizimdagi o'zaro ta'sirni hisobga olishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"qamrov-koeffitsiyenti-va-kompaundlash-nisbati\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#qamrov-koeffitsiyenti-va-kompaundlash-nisbati\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qamrov koeffitsiyenti va kompaundlash nisbati&lt;/span&gt;&lt;/a&gt;Qamrov koeffitsiyenti va kompaundlash nisbati&lt;/h4&gt;\n&lt;p&gt;Manbaning o'z-o'zini mustahkamlash kuchi κ(s) oldingi iqtibos mavjudligi yoki yo'qligida iqtibos keltirish ehtimollari farqi bilan o'lchanadi. κ(s) &amp;gt; 0 bo'lsa, bu «qamrab olish» belgisidir. &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3D%20L_T%20%2F%20(T%20%5Ccdot%20L_1)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; nisbati baholash aniqligini ko'rsatadi: &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3E%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; bo'lsa, bir qadamli baholash GEO ning haqiqiy ta'sirini kamaytirib ko'rsatadi, chunki ta'sir jamlanadi.&lt;/p&gt;\n&lt;h4 id=\"reyting-diagnostikasi\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#reyting-diagnostikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reyting diagnostikasi&lt;/span&gt;&lt;/a&gt;Reyting diagnostikasi&lt;/h4&gt;\n&lt;p&gt;Metodlarning to'g'riligini tekshirish uchun biz L₁ va L_T bo'yicha Kendall τ koeffitsiyentidan foydalanamiz. τ ning past yoki manfiy qiymati shuni ko'rsatadiki, bir qadamli baholash bo'yicha eng yaxshi metod real dialogda samarasiz bo'lishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"nazariy-tahlil-yolga-bogliqlik-va-superchiziqli-osish\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#nazariy-tahlil-yolga-bogliqlik-va-superchiziqli-osish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariy tahlil: yo‘lga bog‘liqlik va superchiziqli o‘sish&lt;/span&gt;&lt;/a&gt;Nazariy tahlil: yo‘lga bog‘liqlik va superchiziqli o‘sish&lt;/h4&gt;\n&lt;p&gt;Biz e’tiborni qamrab olish jarayonini mustahkamlash nazariyasi yordamida tahlil qilamiz, bu imtiyozli birikish va iqtisodiy «qulflash» (lock-in) mexanizmlarini ham tavsiflaydi. Modelimizda ikki manba raqobatlashadi: GEO orqali optimallashtirilgan manba (g) va umumiy raqobatchi (c). Iqtibos keltirish Polya urnasidan tanlash kabi modellashtirilgan, bunda dastlabki holat (G₀ va C₀) birinchi qadamdagi dolzarblikni aks ettiradi. Manbani tanlash ehtimoli urnadagi «sharlar» soniga proportsionaldir va tanlovdan so‘ng sharlar soni s_g yoki s_c miqdoriga ortadi. Qamrab olishni keltirib chiqaruvchi mustahkamlash assimetriyasi s_g - s_c = Δ M₁ + Δ M₂ sifatida belgilanadi, bu yerda Δ M₁ — tarix hissasi (M1), Δ M₂ esa so‘rovlar siljishi hissasi (M2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEO ning dastlabki ustunligi uzoq muddatli natijani belgilaydi, chunki jarayon noergodikdir va assimetrik mustahkamlash manba ko‘rinishining superchiziqli o‘sishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;6.1-taklifga ko‘ra, simmetrik mustahkamlashda (s_g = s_c) g manbasining iqtibos ulushi W_∞ ~ Beta(G₀/s, C₀/s) tasodifiy limitiga yaqinlashadi. Bu shuni anglatadiki, dastlabki qadamlar uzoq muddatli muvaffaqiyatni belgilaydi va GEO G₀ ni oshirish orqali ushbu ustunlikdan maksimal darajada foydalanadi. 6.2-taklif shuni ko‘rsatadiki, s_g &amp;gt; s_c bo‘lganda, kutilayotgan ko‘rinish w_t(g) o‘sadi va umumiy yutuq L_T to‘yinguncha superchiziqli dinamikani namoyon etadi. O‘rtacha maydon chegarasida y_t ulushi &lt;span class=\"yfm-latex\" data-content=\"%5Cdot%7By%7D%20%3D%20y(1-y)(s_g-s_c)%2FN_t%20%3E%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; tenglamasiga bo‘ysunadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Noergodiklik tizim o‘zining dastlabki holatlarini «eslab qolishini» va yo‘l boshidagi tasodifiy tebranishlar bir manbaning qaytarib bo‘lmaydigan hukmronligiga olib kelishi mumkinligini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;6.3-natija L_T^feedback teskari aloqa tushunchasini kiritadi. Agar L_T^feedback &amp;gt; 0 bo‘lsa, bu inson omili yoki o‘zaro ta’sirlar tarixi qamrab olish foydasiga halqa hosil qilishini anglatadi, bu bir qadamli baholashda hisobga olinmaydi. 6.4-natija M1 va M2 kanallari effektlari qo‘shiluvchan ekanligini isbotlaydi: L_T^M1 + L_T^M2 = L_T^feedback. Ularning har biri faqat tegishli shartlar (tizim xotirasi yoki so‘rovlar siljishi) bo‘lmaganda nolga teng bo‘ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Teskari aloqa belgisi foydalanuvchilar xulq-atvoriga bog‘liq: agar ular javoblarni tanqidiy tekshirishga moyil bo‘lsa, L_T^feedback manfiy bo‘lishi mumkin, bu esa GEO ning bir qadamli bahosini oshirib yuboradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nazariya stoxastik urna modelini deterministik &lt;a href=\"concepts/rekursiya.html\"&gt;rekursiya&lt;/a&gt; bilan bog‘laydi, bunda δ dastlabki tarkib G₀ ga, β esa mustahkamlash assimetriyasiga mos keladi. Ikkala yondashuv ham qamrab olish jarayoni og‘ishlarni kuchaytiruvchi va monopoliyaga intiluvchi monoton jarayon ekanligini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"hisoblash-illyustratsiyasi\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#hisoblash-illyustratsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hisoblash illyustratsiyasi&lt;/span&gt;&lt;/a&gt;Hisoblash illyustratsiyasi&lt;/h4&gt;\n&lt;p&gt;Biz 6-bo‘limdagi modelni nazorat qilinadigan deterministik muhitda sinab ko‘ramiz. Maqsad — 5-bo‘limdagi konstruksiyalarning hisoblanishini ko‘rsatish va ikki xil baholash paradigmasi (bir bosqichli va trayektoriyaviy) usullarni turlicha reytinglashini isbotlashdir. Barcha qiymatlar (13)-tenglamadan kelib chiqadi. Model e’tiborga olinmagan omillar usul tanlashga ta’sir qilishini ko‘rsatadi, ammo ularning real tizimlardagi hajmini baholamaydi.&lt;/p&gt;\n&lt;h4 id=\"sozlash\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#sozlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sozlash&lt;/span&gt;&lt;/a&gt;Sozlash&lt;/h4&gt;\n&lt;p&gt;Biz yuqorida keltirilgan yopiq shakldagi rekursiyadan foydalanamiz. Parametrlar GEO dastaklariga mos keladi: δ (birinchi qadamdagi ko‘rinish) va β (qamrab olish kuchi). β=0 bo‘lganda tizim xotirasiz ishlaydi. Biz β = βM1 + βM2 deb olamiz, bunda βM1=0,35 va βM2=0,25. Misol uchun δ=0,12, β=0,6 va T=10 parametrlari tanlangan. Uchta trayektoriya solishtiriladi: GEOsiz bazaviy daraja (w_t=0,5), to‘g‘ridan-to‘g‘ri ta’sir va (13)-tenglama bo‘yicha to‘liq yopiq sikl.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Rekursiya — bu har bir keyingi qiymat oldingisiga bog‘liq bo‘lgan hisoblash usuli bo‘lib, u qidiruv natijalaridagi teskari aloqani modellashtirishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bir-bosqichli-baholashdagi-xatoliklar\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#bir-bosqichli-baholashdagi-xatoliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bir bosqichli baholashdagi xatoliklar&lt;/span&gt;&lt;/a&gt;Bir bosqichli baholashdagi xatoliklar&lt;/h4&gt;\n&lt;p&gt;Biz δ va β ni o‘zgartiruvchi beshta usulni sinab ko‘rdik. 2-jadval shuni ko‘rsatadiki, bir bosqichli (L₁) va trayektoriyaviy (L_T) baholash reytinglari mos kelmaydi. Kendall τ=0,4 koeffitsiyenti kuchsiz korrelyatsiyani bildiradi. Masalan, A usuli bir bosqichli baholashda birinchi, ammo uzoq muddatli ta’sir bo‘yicha uchinchi o‘rinda. D usuli esa aksincha, qisqa muddatda past, ammo trayektoriyaviy qamrov bo‘yicha ikkinchi o‘rinda. Faqat L₁ ga optimallashtirish noto‘g‘ri strategiyaga olib keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tasodifiy tanlovlarda usullarning 90 foizida bir bosqichli va trayektoriyaviy reytinglar farq qiladi, bu esa qisqa muddatli metrikalarning ishonchsizligini ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sifat-xulosalarining-mustahkamligi\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#sifat-xulosalarining-mustahkamligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sifat xulosalarining mustahkamligi&lt;/span&gt;&lt;/a&gt;Sifat xulosalarining mustahkamligi&lt;/h4&gt;\n&lt;p&gt;Sifat xulosalari aniq sonlarga bog‘liq emas: β&amp;gt;0 bo‘lganda trayektoriyaviy effekt har doim bazaviy darajadan yuqori bo‘ladi. Biz 5 × 10⁴ ta tasodifiy usullar to‘plamida simulyatsiya o‘tkazdik. 48% hollarda bir bosqichli g‘olib trayektoriyaviy g‘olib bo‘lmaydi. Agar δ va β o‘rtasida salbiy korrelyatsiya mavjud deb faraz qilsak, reytinglar farqi kuchayib, o‘rtacha τ=0,18 ni tashkil qiladi va g‘olibni tanlashdagi xatolik 91% ga yetadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model nazariy taxminlarga asoslanadi; GEO usullarining (δ, β) tekisligidagi real o‘rni empirik tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"inson-va-kompyuter-ozaro-tasiri-asoslari\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#inson-va-kompyuter-ozaro-tasiri-asoslari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inson va kompyuter o‘zaro ta’siri asoslari&lt;/span&gt;&lt;/a&gt;Inson va kompyuter o‘zaro ta’siri asoslari&lt;/h4&gt;\n&lt;p&gt;Inson omili M2 tizimida teskari aloqa siklini yopib, qidiruv so‘rovini endogen holatga keltiradi. Biz foydalanuvchi xatti-harakatlarini tavsiflash uchun uchta fundamental nazariyaga tayanamiz.&lt;/p&gt;\n&lt;p&gt;Q so‘rov operatori axborot izlash nazariyasi (Information Foraging Theory) orqali ko‘rib chiqiladi. Foydalanuvchi ma’lumotlar qiymatini ko‘rsatuvchi «&lt;a href=\"concepts/informatsionnyy-zapah.html\"&gt;axborot hidi&lt;/a&gt;» bo‘yicha harakatlanuvchi yig‘uvchi sifatida ishlaydi. Keyingi qt+1=Q(bt+1) so‘rovi ushbu hid gradienti bo‘ylab qo‘yilgan qadamdir. Geo-optimallashtirilgan (GEO) javob muayyan manbaning qiymatini sun’iy ravishda oshirib, foydalanuvchini belgilangan yo‘nalishga boshlaydi. Bu qidiruv so‘rovlarining nima uchun «qo‘lga kiritilgan» manbalar tomon siljishini tushuntiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Axborot hidi — bu foydalanuvchining havola ustiga bosishdan oldin kontentning foydaliligini bilvosita belgilar (sarlavhalar, parcha) orqali baholashidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oqibatlar qatlami ishonchni kalibrlash orqali tahlil qilinadi. Tizimdan adolatli foydalanish uchun idrok etilayotgan ishonchlilik haqiqiy ishonchlilikka mos kelishi kerak. Biroq, kontentni «qo‘lga kiritish» bu aloqani uzadi: ma’lumotning tez-tez takrorlanishi tanishlik effekti orqali manbaga bo‘lgan ishonchni oshiradi va shu bilan birga muqobil ma’lumotlarga kirishni cheklaydi. Natijada, manbaning iqtiboslar ulushi va uning haqiqiy ishonchliligi o‘rtasida nomutanosiblik (miscalibration) yuzaga keladi.&lt;/p&gt;\n&lt;p&gt;Normativ qatlam bayescha ishontirish (Bayesian persuasion) orqali tavsiflanadi. Ko‘p bosqichli GEO-optimallashtirish ketma-ket ishontirish o‘yini sifatida taqdim etiladi, bunda kontent egasi signal berish strategiyasini tanlovchi yuboruvchi, agent esa uzatish kanali hisoblanadi. Foydalanuvchi esa o‘z qarashlarini yangilovchi qabul qiluvchi rolini o‘ynaydi. Bu yondashuv foydalanuvchi albatta aldangan deb hisoblamasdan turib, manipulyatsiya va farovonlikni baholash imkonini beradi. GEO ma’lumotlarni oshkor qilish strategiyasi sifatida qaraladi, bunda ko‘p bosqichli shakl bir bosqichli shakldan sezilarli darajada kuchliroqdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nazariy model shuni ko‘rsatadiki, GEO-manipulyatsiya ishonch va axborot izlash mexanizmlaridan foydalangan holda foydalanuvchini samarali boshqaradi va ko‘p bosqichli o‘zaro ta’sirni ta’sir o‘tkazishning kuchli vositasiga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"qidiruv-tizimlari-dizayni-uchun-oqibatlar\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#qidiruv-tizimlari-dizayni-uchun-oqibatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qidiruv tizimlari dizayni uchun oqibatlar&lt;/span&gt;&lt;/a&gt;Qidiruv tizimlari dizayni uchun oqibatlar&lt;/h4&gt;\n&lt;p&gt;Dialogli o‘zaro ta’sir manipulyatsiya yuzasi sifatida. Bir bosqichli GEO bitta javob uchun raqobatlashsa, ko‘p bosqichli GEO butun traektoriya uchun kurashadi. 6.1-taklifga ko‘ra, manipulyatsiya ta’siri dialogning dastlabki bosqichlarida maksimal darajada bo‘ladi, shuning uchun himoya mexanizmlari aynan shu qadamlarga qaratilishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEO-manipulyatsiyalar samaradorligi dialogning dastlabki iteratsiyalarida to‘plangan, bu esa himoya fokusini o‘zaro ta’sirning boshlang‘ich bosqichlariga o‘tkazishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Loyiha vositalari. Model xavflarni kamaytirishning uchta usulini taklif qiladi. Birinchidan, har bir qadamda qayta asoslash (re-grounding) qidiruv vaqtida oldingi kontekst ht-1 ning vaznini kamaytiradi va κ parametrini cheklaydi. Ikkinchidan, manbalar xilma-xilligini majburiy joriy etish bir &lt;a href=\"concepts/step.html\"&gt;qadam&lt;/a&gt; doirasida bitta manbaning ulushini cheklaydi va L^feedback_T ni nazorat qiladi. Uchinchidan, manbalarning shaffofligi foydalanuvchiga nima uchun manba iqtibos keltirilayotganini tushuntiradi, bu esa takroriy iqtibosni dolzarb ma’lumotdan farqlashga yordam beradi.&lt;/p&gt;\n&lt;p&gt;Baholash traektoriyalarni tahlil qilishga o‘tishi kerak. GEO auditlari va qidiruv tizimlari benchmarklari faqat bir qadamdagi ko‘rinishni emas, balki traektoriya darajasidagi ko‘rsatkichlarni: L_T, L^feedback_T, &lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, κ va noto‘g‘ri reytinglash ko‘rsatkichi τ ni hisobot qilishi kerak. Bu ko‘rsatkichlar mavjud ma’lumotlar konveyerlari ishlab chiqaradigan w_t(s) vazn qiymatlaridan foydalanadi.&lt;/p&gt;\n&lt;h4 id=\"cheklovlar-va-haqiqiylik-tahdidlari\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#cheklovlar-va-haqiqiylik-tahdidlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va haqiqiylik tahdidlari&lt;/span&gt;&lt;/a&gt;Cheklovlar va haqiqiylik tahdidlari&lt;/h4&gt;\n&lt;p&gt;Biz uchta asosiy tahdidni ajratib ko‘rsatamiz va ularni baholash protokolini taklif qilamiz. Hisoblash va empirik tekshirish. 5-bo‘limdagi barcha konstruksiyalar har bir qadamdagi ko‘rinish orqali hisoblanishi mumkin. Keyingi qadam — w_t(s), κ, &lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va τ ni aniqlash uchun TopiOCQA, QReCC, ORConvQA kabi dialog tizimlari korpuslarida o‘lchashdir. Protokol ochiq kodli &lt;a href=\"concepts/retrieval-augmented-generation.html\"&gt;RAG&lt;/a&gt; konveyeriga GEO-optimallashtirilgan va nazorat fragmentlarini kiritishni nazarda tutadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RAG (Retrieval-Augmented Generation) — model tashqi manbalardan ma’lumot qidirib, keyin ular asosida javob yaratadigan usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Foydalanuvchi simulyatsiyasiga bog‘liqlik. Rejalashtirilgan tadqiqotda asosiy traektoriya real so‘rovlarga tayanadi, M₁ mashina kanali ta’siri esa foydalanuvchi modeli bo‘lmagan holda o‘lchanadi. Kontekstga bog‘liq dvigatelni xotirasiz dvigatel bilan solishtirish L^M₁_T ni baholash imkonini beradi. L^feedback_T ning qolgan qismi L^M₂_T (inson omili) bo‘lib, uni kontrfakt tahlil orqali tiklash mumkin. Buning uchun harakatlar taksonomiyasi (chuqurlashtirish, qayta ifodalash, chaqiriq, o‘tish) bo‘yicha kalibrlangan LLM asosidagi &lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;foydalanuvchi simulyatori&lt;/a&gt; kerak.&lt;/p&gt;\n&lt;p&gt;Xulq-atvor taxminlari. Biz foydalanuvchilar manipulyatsiya qilinmoqda deb da’vo qilmaymiz; modelimiz xulq-atvor validatsiyasini talab qiladigan gipotezani ilgari suradi. Boshqa cheklovlar: (i) LLM-hakam orqali ko‘rinishni baholash mukammal emas; (ii) ochiq kodli RAG tijorat tizimlaridan farq qiladi, shuning uchun bir nechta modellarda replikatsiya zarur; (iii) biz real ishonchni o‘lchamaymiz; (iv) «ikki manbali» model raqobatni soddalashtiradi, biroq chiziqli kuchaytirish sharoitida argumentlar K ta manbaga umumlashtiriladi.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"geo-baholashni-qayta-korib-chiqish\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#geo-baholashni-qayta-korib-chiqish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GEO baholashni qayta ko‘rib chiqish&lt;/span&gt;&lt;/a&gt;GEO baholashni qayta ko‘rib chiqish&lt;/h4&gt;\n&lt;p&gt;GEO (generativ qidiruvni optimallashtirish) ni baholashning hozirgi usullari muloqotni mustaqil so‘rovlar ketma-ketligi deb hisoblaydi. Biroq, bu yondashuv qidiruv tizimining foydalanuvchi keyingi savoliga ta’sirini e’tiborsiz qoldiradi. Biz «konversion qamrov» (conversational capture) tushunchasini kiritdik — bu inson va agent o‘rtasidagi teskari aloqa halqasi orqali dastlabki GEO ustunligining kuchayishi hodisasidir. Biz ushbu halqani rasmiylashtirdik, uning mashina va inson kanallarini ajratdik hamda muloqot trayektoriyalari darajasida baholash konstruksiyalarini aniqladik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GEO ni alohida so‘rovlar bo‘yicha baholash haqiqiy samarani kamaytirib ko‘rsatadi, chunki to‘plangan yutuq muloqot uzayishi bilan superchiziqli ravishda o‘sadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kuchaytirish jarayonlari nazariyasi shuni ko‘rsatadiki, bu dinamika noergodikdir: muloqotning dastlabki bosqichlari yakuniy natijani belgilab beradi. Bir bosqichli baholashda teskari aloqa hadi Lfeedback^T nolga teng bo‘ladi, bu esa usul samaradorligini noto‘g‘ri baholashga olib keladi. Modellash shuni ko‘rsatadiki, teskari aloqaning hissasi to‘g‘ridan-to‘g‘ri ta’siridan ustun bo‘lishi mumkin, shuning uchun bitta so‘rov va butun trayektoriya uchun GEO reytinglari farq qilishi mumkin. Natijada, standart baholash ko‘pincha noto‘g‘ri usullarni tanlab qo‘yadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Noergodiklik shuni anglatadiki, tizim o‘zining dastlabki holatlarini «eslab qoladi» va muloqot boshidagi tasodifiy voqealar uning yakunini qaytarib bo‘lmaydigan darajada o‘zgartiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz to‘liq muloqot trayektoriyalarini baholashga o‘tishni tavsiya qilamiz. Qidiruv tizimlari faktlarni qayta tekshirish (re-grounding), javoblarni diversifikatsiya qilish va barqaror iqtiboslarni tushuntirish mexanizmlarini joriy etishi kerak. Kelgusi tadqiqotlar real muloqot korpuslari va foydalanuvchi ma’lumotlari yordamida inson teskari aloqa kanalini empirik tekshirishga qaratilishi lozim.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval-f1.jpg\" alt=\"1-rasm: Suhbatni qamrab olish (conversational capture) sharhi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Suhbatni qamrab olish (conversational capture) sharhi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Suhbatni qamrab olish (conversational capture) sharhi. (A) Inson va agent o'rtasidagi axborot izlash yopiq tsikldir: 𝑟𝑡 javobi foydalanuvchining 𝑏𝑡+1 e'tiqodini va shuning uchun navbatdagi 𝑞𝑡 = 𝑄(𝑏𝑡) so'rovini yangilaydi, bu yerda 𝑄 — so'rov operatori (inson tomonidagi M2 kanali), shu bilan birga dvigatelni ℎ𝑡 dialog tarixi (mashina tomonidagi M1 kanali) bilan shartlaydi; optimallashtirilgan 𝑆GEO manbalar to'plamidagi dastlabki GEO siljishi ikkala qaytish yo'li bo'ylab tarqaladi. (B) Tsikl kuchayganligi sababli, umumiy trayektoriya o'sishi 𝐿𝑇 bir bosqichli ekstrapolyatsiyadan 𝑇 · 𝐿1 oshadi; ortiqcha qismi 𝐿feedback 𝑇 teskari aloqa hadi bo'lib, u bir bosqichli baholashda aynan nolga teng. Ustun 𝑇=10 da 𝐿𝑇 = 2.68 ni to'g'ridan-to'g'ri hadga (𝐿direct 𝑇 = 1.20) va teskari aloqa hadiga (𝐿feedback 𝑇 = 1.48) ajratadi. Ikkinchisi mashina tomonidagi kanalga (𝐿M1 𝑇 = 0.85, ko'k, foydalanuvchi modeli talab qilinmaydi) va inson tomonidagi kanalga (𝐿M2 𝑇 = 0.63, zang rangli) bo'lingan, (A) dagi kabi ranglangan; jamg'arish koeffitsienti 𝜌 = 2.23. (C) Binobarin, GEO usullarini bir bosqichli o'sish bo'yicha reytinglash ularni trayektoriya o'sishi bo'yicha reytinglash bilan mos kelmaydi (Kendall 𝜏 = 0.4): bir bosqichli g'olib (A) trayektoriya bo'yicha faqat uchinchi o'rinda.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval-f2.jpg\" alt=\"2-rasm: Yopiq tsikl rekursiyasi (13) ostida GEO manbasining har bir bosqichdagi ko'rinishi (𝛿 = 0.12, 𝛽 = 0.6).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Yopiq tsikl rekursiyasi (13) ostida GEO manbasining har bir bosqichdagi ko'rinishi (𝛿 = 0.12, 𝛽 = 0.6).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: Yopiq tsikl rekursiyasi (13) ostida GEO manbasining har bir bosqichdagi ko'rinishi (𝛿 = 0.12, 𝛽 = 0.6). Yopiq tsikl va faqat to'g'ridan-to'g'ri kontrfaktual o'rtasidagi soya tushgan bo'shliq 𝐿feedback 𝑇 teskari aloqa hissasidir. 2-rasmda uchta trayektoriya chizilgan. Yopiq tsikl ulushi 1-bosqichdagi 0.62 dan 10-bosqichdagi 0.91 gacha ko'tariladi, faqat to'g'ridan-to'g'ri kontrfaktual esa 0.62 darajasida o'zgarmay qoladi. Bo'shliq — bu sof teskari aloqa, ya'ni GEO faqat tsikl yopiq bo'lgani uchun hosil qiladigan ko'rinishdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;GEO ni bitta&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"
