        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"239\" cy=\"94\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"681\" cy=\"221\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Neyrotarmoqlar aniqligi:&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;barqarorlik illyuziyasi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f1.jpg\" alt=\"1-rasm: Semantik jihatdan ekvivalent boʻlgan faktual promptlar model oilalari boʻylab oʻlchanadigan xulq-atvor oʻzgarish\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Semantik jihatdan ekvivalent boʻlgan faktual promptlar model oilalari boʻylab oʻlchanadigan xulq-atvor oʻzgarishlarini keltirib chiqaradi. Radarlar toʻrtta oʻq boʻyicha oʻrtacha delta kattaligini koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar &lt;a href=\"concepts/sago.html\"&gt;SAGO&lt;/a&gt; tizimini taqdim etishdi, u til modellarining barqarorligini alohida misollar darajasida baholaydi. Ma'lum bo'lishicha, so'rovning umumiy ma'nosi saqlanib qolsa ham, modellar xatti-harakatida sezilarli tebranishlar kuzatiladi. Standart aniqlik ko'rsatkichlari bu nosozliklarni yashirib, tizimlar ishonchli degan noto'g'ri taassurot qoldiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SAGO so'rovlarni qayta ifodalashda model barqarorligini o'lchaydi, o'rtacha aniqlikni emas.&lt;/li&gt;\n&lt;li&gt;11 ta modelni o'rganish ularning alohida misollar darajasida sezilarli beqarorligini ko'rsatdi.&lt;/li&gt;\n&lt;li&gt;Umumlashtirilgan ko'rsatkichlar xatolarni yashiradi, chunki ba'zi variatsiyalardagi muvaffaqiyatsizliklar boshqalarida yopiladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Mualliflar 11 ta ochiq va yopiq &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; modellarini 6 xil ma'lumotlar to'plamida tahlil qilib, to'rtta o'lchov bo'yicha baholashdi: generatsiya izchilligi, ichki aktivatsiyalar, model ishonchi va javoblarni ko'chirish (mirroring). An'anaviy benchmarklardan farqli o'laroq, SAGO kiritilgan ma'lumotlarning semantik ekvivalent o'zgarishlarida (registr, uzunlik yoki xushmuomalalik o'zgarishi) model xatti-harakatining o'zgarishini o'lchaydi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatadiki, hech bir model bir xil darajada umumlashtirish qobiliyatiga ega emas. Xatti-harakat o'qlari mustaqil xato turlarini qayd etadi va ma'lumotlar to'plamining o'zgarishi model reytingini butunlay o'zgartirib yuborishi mumkin. Bu shuni isbotlaydiki, umumlashtirilgan ballarga asoslangan hozirgi baholash usullari algoritmlarning real foydalanish sharoitidagi haqiqiy beqarorligini aniqlay olmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ish modellarning semantik variatsiyalardagi xatti-harakatiga qaratilgan va uzoq muddatli kontekst ta'sirini hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Katta til modellarining (LLM) umumlashtirish qobiliyati deganda, bir xil soʻrov turli shakllarda ifodalanganda semantik jihatdan barqaror va izchil natijalar berish qobiliyati tushuniladi. Mavjud baholash usullari odatda yagona formatdagi maʼlumotlar toʻplami boʻyicha umumiy aniqlikka tayanadi, bu esa modelning umumiy unumdorligi va uning kiritilgan maʼlumotlardagi oʻzgarishlarga chidamliligini ajratib koʻrsatishni qiyinlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Umumlashtirish — bu modelning foydalanuvchi savolni qayta shakllantirganda ham javob mazmunini saqlab qolish qobiliyatidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu ishda Stability-Aware Generalization Objective (SAGO) tizimi taqdim etilgan. U model xatti-harakatlarini alohida misollar darajasida baholashga imkon beradi va kiritilgan maʼlumotlarning turli variantlari ostida javoblardagi oʻzgarishlarni tahlil qiladi. SAGO bir nechta parametrlar boʻyicha oʻzgaruvchanlikni oʻlchaydi: generatsiya izchilligi, neyron tarmoqning ichki faollashuvi, modelning ishonch darajasi va javoblarning aks etishi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatdiki, sinovdan oʻtgan modellarning hech biri bir xil umumlashtirish qobiliyatiga ega emas va modellarning samaradorlik reytingi foydalanilgan maʼlumotlar toʻplamiga qarab oʻzgarishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tahlil shuni koʻrsatdiki, zamonaviy modellar umumlashtirishda statistik jihatdan sezilarli beqarorlikni namoyon etadi. Model xatti-harakatlarining turli oʻqlari xatolarning mustaqil turlarini aks ettiradi va maʼlumotlar toʻplamining oʻzgarishi modellarning samaradorlik reytinglarida teskari natijalarga olib kelishi mumkin. Mualliflar mustaqil tekshirish uchun usulning namunaviy realizatsiyasini taqdim etdilar.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"llm-umumlashtirish-konteksti-va-muammosi\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#llm-umumlashtirish-konteksti-va-muammosi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM umumlashtirish konteksti va muammosi&lt;/span&gt;&lt;/a&gt;LLM umumlashtirish konteksti va muammosi&lt;/h4&gt;\n&lt;p&gt;Katta til modellari (LLM) qidiruv tizimlari, dasturlash yordamchilari va agent ish jarayonlarida faol qoʻllanilmoqda. Model ishonchliligining asosiy koʻrsatkichi — bu umumlashtirish qobiliyati, yaʼni soʻrovning shakli oʻzgarganda ham, agar uning maʼnosi va konteksti bir xil boʻlib qolsa, samaradorlikni saqlab qolishdir. Foydalanuvchilar uzunlik, ohang, formatlashni oʻzgartirishi yoki shovqin qoʻshishi mumkin, ammo model ushbu oʻzgarishlardan qatʼi nazar, oʻz koʻrsatmalariga va xavfsizlik siyosatiga amal qilishi kerak. Oldingi tadqiqotlar shuni koʻrsatadiki, maʼno saqlanib qolganda ham LLM xulq-atvori oʻzgaradi, bu esa soʻrovlar ifodasi, soʻzlar tartibi yoki ohangiga nisbatan zaiflikni koʻrsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modelning semantik jihatdan ekvivalent soʻrovlar uchun barqaror xulq-atvorini saqlab qolish qobiliyati ishonchlilikning muhim koʻrsatkichi boʻlib, u koʻpincha oʻrtacha koʻrsatkichlar foydasiga eʼtibordan chetda qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"joriy-yondashuvlarning-cheklovlari-va-sago-metodologiyasi\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#joriy-yondashuvlarning-cheklovlari-va-sago-metodologiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Joriy yondashuvlarning cheklovlari va SAGO metodologiyasi&lt;/span&gt;&lt;/a&gt;Joriy yondashuvlarning cheklovlari va SAGO metodologiyasi&lt;/h4&gt;\n&lt;p&gt;Amaldagi baholash usullari bir qator kamchiliklarga ega: ular koʻpincha bitta mavzu sohasi bilan cheklanadi, soʻrovlar variatsiyalarining tor doirasini koʻrib chiqadi yoki agregatsiyalangan koʻrsatkichlarga tayanadi. Oʻrtacha baholar ayrim soʻrov variantlaridagi xatolar boshqalaridagi muvaffaqiyatlar bilan qoplanishi hisobiga alohida misollar darajasidagi jiddiy nosozliklarni yashirishi mumkin. Ushbu boʻshliqni toʻldirish uchun mualliflar Stability-Aware Generalization Objective (SAGO) tizimini taklif qiladilar. SAGO oʻrtacha sifatni baholash oʻrniga, har bir aniq misol uchun modelning turli semantik ekvivalent variatsiyalarda oʻzini qanday tutishini tekshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SAGO — bu baholash metodologiyasi boʻlib, u bir xil topshiriq qayta ifodalanganda modelning javobi, uning ichki ishonchi va neyron faollashuvlari qanchalik oʻzgarishini tahlil qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 11 ta modelni qamrab oladi, ammo natijalar tanlangan oltita maʼlumotlar toʻplami va kiritilgan maʼlumotlardagi buzilish turlarining xususiyatlariga bogʻliq boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SAGO doirasida generatsiya izchilligi, ichki faollashuvlar, modelning ishonchi va javoblarning «koʻzgulanishi» (response mirroring)dagi oʻzgarishlar tahlil qilinadi. Mualliflar 11 ta ochiq va yopiq LLMni oltita maʼlumotlar toʻplamida sinovdan oʻtkazdilar. Natijalar shuni koʻrsatadiki, umumlashtirishdagi beqarorlik keng tarqalgan va bir jinsli emas. Ishning asosiy xulosalari xulq-atvor oʻzgarishlarini oʻlchash uchun koʻp oʻqli metrikani yaratish va generatsiya izchilligi eng sezgir parametr ekanligini, shuningdek, kontent barqarorligi va javoblarning koʻzgulanishi model sezgirligining mustaqil oʻlchovlari ekanligini empirik isbotlashni oʻz ichiga oladi.&lt;/p&gt;\n&lt;h4 id=\"bajarilgan-ishlar-va-kontekst\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#bajarilgan-ishlar-va-kontekst\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bajarilgan ishlar va kontekst&lt;/span&gt;&lt;/a&gt;Bajarilgan ishlar va kontekst&lt;/h4&gt;\n&lt;p&gt;Katta til modellarining (LLM) umumlashtirish barqarorligi bo'yicha tadqiqotlar bir nechta yo'nalishlarga bo'linadi, ularning har biri muammoning alohida jihatini o'rganadi.&lt;/p&gt;\n&lt;p&gt;Ta'minotdan tashqari barqarorlik (Out-of-distribution). Bu yo'nalish test ma'lumotlari o'quv ma'lumotlaridan farq qilganda modellarning xatti-harakatini o'lchaydi. Adabiyotlarda bu ajratilgan tanlanmadagi unumdorlikning yagona ko'rsatkichi sifatida rasmiylashtiriladi. Katta hajmdagi benchmarklar ushbu farqni ko'plab domenlar bo'yicha jamlaydi. Ushbu tadqiqotlar taqsimotdagi siljishlar unumdorlikni pasaytirishi va bu pasayish dataset darajasida sezilarli ekanligini tasdiqlaydi. Biroq, ular model bir xil ma'noli, lekin turli shakldagi kiritmalarga izchil javob berishini tekshirmaydi va ma'lumotlarni jamlagani uchun alohida misollar darajasidagi beqarorlikni aniqlash imkonsiz bo'ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavjud barqarorlikni baholash usullari ko'rsatkichlarni jamlaydi, bu esa modelning aniq so'rovlar darajasidagi beqarorligini yashiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Prompt darajasidagi o'zgarishlarga nisbatan izchillik va sezgirlik. Ikkinchi yo'nalish ma'noni o'zgartirmasdan qayta ifodalangan kiritmalarda bashoratlarning barqarorligini tekshiradi. Bunga faktik so'rovlarning qayta ifodalanishidagi nomuvofiqliklar va yo'riqnomalarga moslashtirilgan modellardagi tizimli kelishmovchiliklar kiradi. Tadqiqotlarning katta qismi tor semantik sohalarga qaratilgan: tillararo variantlar, ijtimoiy ohangdagi siljishlar va xavfli so'rovlarni qayta ishlashdagi izchillik. Uchinchi yo'nalish esa ma'noga ta'sir qilmaydigan sirtqi o'zgarishlarga (formatlash, shablon tanlash, kontekstdagi misollar tartibi, tinish belgilari va bo'shliqlar) sezgirlikni o'rganadi. Garchi bu ishlar LLM xatti-harakati semantik jihatdan ekvivalent kiritmalarda kamdan-kam hollarda invariant qolishini ko'rsatsa-da, ular modelning umumiy umumlashtirish qobiliyatini to'liq baholamaydi.&lt;/p&gt;\n&lt;p&gt;Aniqlikdan tashqari xulq-atvor signallari. Biz foydalanadigan tahlil o'qlari turli sohalarda rivojlangan. Yashirin holatlar geometriyasi kiritma o'zgarganda ichki tasvirlar qanday o'zgarishini kuzatadi. Semantik o'xshashlik choralari (masalan, BERTScore) leksik qoplanishni (BLEU) to'ldiradi. Token darajasidagi log-ehtimolliklar va bashoratli entropiya ishonchlilikni o'lchash uchun standart vositalardir. Stilistik akkomodatsiya — modelning kiritma registrini aks ettirish darajasi — mustaqil hodisa sifatida o'rganiladi. Garchi ko'zgu effekti ko'pincha yo'riqnomalarga moslashtirishning ijobiy xususiyati bo'lsa-da, agar model semantik bo'lmagan shovqinlarni nusxalasa, bu kutilmagan beqarorlik sifatida namoyon bo'lishi mumkin. Ushbu signallarni alohida misollar darajasida birlashtirilgan tahlil qilish ilgari amalga oshirilmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Stilistik akkomodatsiya — bu modelning o'z javob uslubini olingan so'rov uslubi yoki registriga moslashtirishga moyilligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"barqarorlikni-hisobga-olgan-holda-umumlashtirish-maqsadi-sago\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#barqarorlikni-hisobga-olgan-holda-umumlashtirish-maqsadi-sago\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Barqarorlikni hisobga olgan holda umumlashtirish maqsadi (SAGO)&lt;/span&gt;&lt;/a&gt;Barqarorlikni hisobga olgan holda umumlashtirish maqsadi (SAGO)&lt;/h4&gt;\n&lt;p&gt;SAGO semantik ekvivalent kiritma o'zgarishlariga nisbatan barqarorlikni baholaydi: model faqat so'rov ma'nosi saqlanib qolganda uning xatti-harakati barqaror bo'lsa, umumlashtiruvchi hisoblanadi. Biz buni o'zgarishlar oilalari, kontent domenlari va alohida promptlar bo'yicha, asl va o'zgartirilgan ma'lumotlardagi xatti-harakatlarni bir nechta o'qlar bo'yicha solishtirish orqali o'lchaymiz. Tizim quyidagilarni o'z ichiga oladi: (1) nazorat qilinadigan semantik o'zgarishlar benchmarki, (2) har bir prompt uchun barqarorlik ko'rsatkichi va (3) turli xil nosozlik turlarini qayd etuvchi xulq-atvor o'qlari.&lt;/p&gt;\n&lt;h4 id=\"belgilashlar-va-maqsadli-funksiya\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#belgilashlar-va-maqsadli-funksiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Belgilashlar va maqsadli funksiya&lt;/span&gt;&lt;/a&gt;Belgilashlar va maqsadli funksiya&lt;/h4&gt;\n&lt;p&gt;Shartli ravishda, X — matnli soʻrovlar (promptlar) fazosi, Y — model javoblari fazosi, f_θ: X → Y esa kiritilgan yoʻriqnomalarga moslashtirilgan (instruction-tuned) va &lt;span class=\"yfm-latex\" data-content=\"%5C%7BD_j%5C%7D_%7Bj%3D1%7D%5EJ\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; maʼlumotlar toʻplamlari boʻyicha baholanadigan til modeli boʻlsin. D_j toʻplamidagi x_i soʻrovi uchun bazaviy javob y_i = f_θ(x_i) ga teng. c: X → C funksiyasi har bir soʻrovni uning semantik mazmuniga akslantiradi. Har bir soʻrov uchun &lt;span class=\"yfm-latex\" data-content=\"v%20%5Cin%20V\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; indeksi boʻyicha semantik ekvivalent boʻlgan oʻzgartirishlar toʻplami shakllantiriladi:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"x_i%5E%7B(v)%7D%20%3D%20T_v(x_i)%2C%20%5Cquad%20c(x_i%5E%7B(v)%7D)%20%3D%20c(x_i)%20%5Cquad%20(1)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;bu yerda T_v: X → X soʻrovning maʼnosini toʻliq saqlaydigan almashtirishdir.&lt;/p&gt;\n&lt;p&gt;Oʻq (axis) deganda modelning konkret soʻrovdagi xatti-harakatini ifodalovchi skalyar koʻrsatkich &lt;span class=\"yfm-latex\" data-content=\"X(f_%20heta%2C%20x)%20%5Cin%20%5Cmathbb%7BR%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; tushuniladi. v variatsiyasi keltirib chiqargan ogʻish Δ X(i, v) = X(f_θ, x_i^(v)) - X(f_θ, x_i) koʻrinishida hisoblanadi. Bu farq ishorali boʻlib, masalan, manfiy Δ XAct qiymati reprezentativ siljishni (representational drift) anglatadi. Ogʻishning absolut kattaligini jamlash uchun kvadratik oʻrtacha qiymatdan (RMS) foydalaniladi.&lt;/p&gt;\n&lt;p&gt;SAGO usulining maqsadi barcha i va &lt;span class=\"yfm-latex\" data-content=\"v%20%5Cin%20V\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; uchun quyidagi qatʼiy shart bajarilishini aniqlashdan iborat:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"%5CDelta%20X(i%2C%20v)%20%3D%200%20%5Cquad%20(2)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Agar ushbu tenglik buzilsa, usul modelning ushbu shartdan qanchalik uzoqlashganini miqdoriy jihatdan baholaydi. Har qanday ogʻish X oʻqi boʻyicha umumiylashtirish qobiliyatining buzilganligini koʻrsatadi. Bir oʻq boʻyicha barqarorlik boshqasida ham barqarorlikni kafolatlamagani uchun, bu shart har bir oʻq uchun alohida hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;SAGO maqsadli funksiyasi model javoblarining mukammal invariantligini tekshiradi: soʻrov maʼnosi saqlangan holda yuzaga kelgan har qanday &lt;span class=\"yfm-latex\" data-content=\"%5CDelta%20X(i%2C%20v)%20%0Aeq%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ogʻish umumiylashtirish qobiliyatining buzilishi deb baholanadi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"benchamrkni-shakllantirish\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#benchamrkni-shakllantirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Benchamrkni shakllantirish&lt;/span&gt;&lt;/a&gt;Benchamrkni shakllantirish&lt;/h4&gt;\n&lt;p&gt;Yaratilgan benchamrk bir nechta maʼlumotlar toʻplamini nazorat qilinadigan kirish oʻzgarishlari bilan birglashtiradi. Har bir variatsiya v = (F, u, s, p) korteji bilan tavsiflanadi, bu yerda &lt;span class=\"yfm-latex\" data-content=\"F%20%5Cin%20%5Cmathcal%7BF%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — oʻzgartirishlar oilasi, &lt;span class=\"yfm-latex\" data-content=\"u%20%5Cin%20U_F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — uning kichik turi, &lt;span class=\"yfm-latex\" data-content=\"s%20%5Cin%20S_F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — taʼsir kuchi, &lt;span class=\"yfm-latex\" data-content=\"p%20%5Cin%20%5Cmathcal%7BP%7D%20%3D%20%5C%7B%20ext%7BPREFIX%7D%2C%20%20ext%7BSUFFIX%7D%2C%20%20ext%7BGLOBAL%7D%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; esa joylashuv oʻrnidir.&lt;/p&gt;\n&lt;p&gt;Variatsiyalarning toʻliq toʻplami quyidagicha tuziladi:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"V%20%3D%20%5C%7B(F%2C%20u%2C%20s%2C%20p)%20%5Cmid%20F%20%5Cin%20%5Cmathcal%7BF%7D%2C%20u%20%5Cin%20U_F%2C%20s%20%5Cin%20S_F%2C%20p%20%5Cin%20%5Cmathcal%7BP%7D%5C%7D%20%5Cquad%20(3)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Tadqiqotchilar uchta asosiy oilani ajratib koʻrsatishdi, ularning har biri shunday tanlanganki, birida barqarorlik saqlanishi boshqasida ham barqaror boʻlishini anglatmaydi. Bunda c(x_i^(v)) = c(x_i) maʼno saqlanishi sharti toʻliq bajariladi:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Ijtimoiy registr (Social register):&lt;/strong&gt; soʻrovning shaxslararo muloqot uslubini oʻzgartiradi (xushmuomalalik, samimiylik, salomlashish, minnatdorchilik belgilari yoki salbiy kontekst).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Sirtqi shovqin (Surface noise):&lt;/strong&gt; belgi va token darajasida oʻzgarishlar kiritadi (tartibsiz boʻshliqlar, tinish belgilari xatolari va katta-kichik harflar siljishi).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Tarkibiy qayta yozish (Structural rewriting):&lt;/strong&gt; mazmunni saqlagan holda soʻrov strukturasini oʻzgartiradi (uzunlikni qisqartirish yoki kengaytirish, soʻroq shaklini buyruq shakliga oʻtkazish).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Benchmark real foydalanuvchilar soʻrovlarida koʻp uchraydigan uch xil xalaqit beruvchi omilga nisbatan model barqarorligini sinaydi: muloqot ohangining oʻzgarishi, imlo xatolari va qayta ifodalash.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"barqaror-umumiylashtirish-korsatkichi-sgs\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#barqaror-umumiylashtirish-korsatkichi-sgs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Barqaror umumiylashtirish koʻrsatkichi (SGS)&lt;/span&gt;&lt;/a&gt;Barqaror umumiylashtirish koʻrsatkichi (SGS)&lt;/h4&gt;\n&lt;p&gt;Modelning (2)-tenglikdan ogʻish darajasini oʻlchash uchun &lt;a href=\"concepts/stability-generalization-score.html\"&gt;SGS&lt;/a&gt; (Stability Generalization Score) koʻrsatkichi qoʻllaniladi. Turli oʻqlar har xil oʻlchov birliklariga ega boʻlgani uchun, xom delta qiymatlari avval standart shkalaga keltiriladi.&lt;/p&gt;\n&lt;p&gt;Har bir delta belgilan oʻq miqyosi omiliga R_X boʻlinadi:&lt;/p&gt;\n&lt;p&gt;ildeΔ X(i, v) = Δ X(i, v) / R_X&lt;/p&gt;\n&lt;p&gt;Chegaralangan diapazondagi oʻqlar uchun R_X qiymati /Δ X/ ning nazariy maksimal qiymatiga teng; chegaralanmagan ketma-ketlik log-ehtimolligi (log-probability) uchun R_X empirik diapazondan kelib chiqib oʻzgarmas konstanta sifatida olinadi. Natijada $ ilde{\\Delta} X \\in [-1, 1]$ oraligʻi hosil boʻladi, bu yerda 0 nolga teng xatti-harakat oʻzgarishini bildiradi.&lt;/p&gt;\n&lt;p&gt;Alohida i soʻrovi uchun X oʻqidagi beqarorlik butun V variatsiyalar toʻplami boʻyicha normalizaciya qilingan deltalarning kvadratik oʻrtacha qiymati (RMS) sifatida hisoblanadi:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"s_X(i)%20%3D%20%5Cleft(%20%5Cfrac%7B1%7D%7B%2FV%2F%7D%20%5Csum_%7Bv%20%5Cin%20V%7D%20%20ilde%7B%5CDelta%7D%20X(i%2C%20v)%5E2%20%5Cright)%5E%7B1%2F2%7D%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Agar model barcha variatsiyalarda bir xil noldan farqli miqdorga siljisa, RMS ushbu beqarorlikni toʻgʻri qayd etadi.&lt;/p&gt;\n&lt;p&gt;D_j maʼlumotlar toʻplami uchun SGS koʻrsatkichi soʻrovlar beqarorligining oʻrtacha qiymatiga teng: $ ext{SGS}&lt;em&gt;X^{(j)} = \\frac{1}{/D_j/} \\sum&lt;/em&gt;{i \\in D_j} s_X(i)$. Umumiy ball esa barcha toʻplamlar boʻyicha har bir soʻrovga teng vazn bergan holda hisoblanadi:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"ext%7BSGS%7D_X%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_%7Bj%3D1%7D%5EJ%20%2FD_j%2F%20%5Ccdot%20%20ext%7BSGS%7D_X%5E%7B(j)%7D%2C%20%5Cquad%20%20ext%7Bbu%20yerda%20%7D%20N%20%3D%20%5Csum_%7Bj%3D1%7D%5EJ%20%2FD_j%2F%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;SGS_X qiymatining pastligi yuqori barqarorlikni anglatadi. SGS_X = 0 tengligi faqat va faqat model barcha soʻrovlarda (2)-shartni bajargandagina oʻrinli boʻladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Metrika javoblar tarqoqligini [-1, 1] intervaliga keltirgani sababli, koʻrsatkichning sezgirligi chegaralanmagan parametrlar uchun R_X kotirovkasining toʻgʻri tanlanganiga bogʻliq.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Statistik ahamiyatlilikni baholash uchun noldan farqli chegaraviy bagʻrikenglik qiymatiga nisbatan bir tomonlama t-test qoʻllaniladi (&lt;span class=\"yfm-latex\" data-content=\"H_0%3A%20%5Cmathbb%7BE%7D%5Bs_X(i)%5D%20%5Cle%20%5Cvarepsilon\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va &lt;span class=\"yfm-latex\" data-content=\"H_1%3A%20%5Cmathbb%7BE%7D%5Bs_X(i)%5D%20%3E%20%5Cvarepsilon\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;). Tadqiqotda &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%5Cin%20%5C%7B0%7B%2C%7D01%3B%200%7B%2C%7D05%3B%200%7B%2C%7D10%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; qiymatlari sinab koʻrilgan (mos ravishda 1%, 5% va 10% diapazon). Asosiy natijalar &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3D%200%7B%2C%7D05\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; uchun berilgan. Test statistikasi &lt;span class=\"yfm-latex\" data-content=\"t%20%3D%20(%5Cbar%7Bs%7D_X%20-%20%5Cvarepsilon)%20%2F%20%20ext%7BSE%7D(s_X)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; formulasi boʻyicha hisoblanadi, bu yerda &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bs%7D_X\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — tanlanma oʻrtacha qiymati, SE(s_X) esa N ta soʻrov uchun standart xatolikdir.&lt;/p&gt;\n&lt;h4 id=\"metrikalar\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#metrikalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metrikalar&lt;/span&gt;&lt;/a&gt;Metrikalar&lt;/h4&gt;\n&lt;p&gt;SGSX har bir X oʻqi uchun mustaqil hisoblanadi. Biz modelning ishlashdan toʻxtash usullarini qamrab oluvchi toʻrtta oʻqni ajratib koʻrsatamiz (2-tenglama). Har bir oʻq umumiy aniqlik metrikalari ajrata olmaydigan xulq-atvor sezgirligini qayd etadi.&lt;/p&gt;\n&lt;p&gt;Faollashuv geometriyasi (XAct). Ichki tasvirlar yakuniy javoblar oʻzgarmasa ham, prompt oʻzgarganda farq qilishi mumkin. Biz ∆XAct ni asl va oʻzgartirilgan promptlar uchun oxirgi qatlam &lt;span class=\"yfm-latex\" data-content=\"h_%5Cell\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; yashirin holatlarining kosinus oʻxshashligi oʻrtasidagi oʻrtacha farq sifatida aniqlaymiz. Manfiy qiymatlar tasvirlarning «siljishini» koʻrsatadi. RAct = 2 masshtab koeffitsiyenti -1 dan 1 gacha boʻlgan diapazonni qamrab oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;XAct metrikasi tashqi javoblar barqaror boʻlsa ham, ichki tasvirlar oʻzgarganda modelning ichki beqarorligini aniqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Generatsiya izchilligi (XBLEU, XBERT). Model aniqlikni saqlab qolgan holda javob shakllarini oʻzgartirishi mumkin. Biz bazaviy va oʻzgartirilgan promptlarga javoblar oʻrtasidagi BLEU (leksik oʻxshashlik) va BERTScore (semantik oʻxshashlik) metrikalaridagi farqni oʻlchaymiz. Masshtab koeffitsiyentlari RBLEU = 100 va $R_{BERT} = 1 ni tashkil etadi.&lt;/p&gt;\n&lt;p&gt;Ishonch va noaniqlik (XProb, XEnt). Model barqaror javoblar berib, shu bilan birga ishonchsizroq boʻlib qolishi mumkin. Biz ketma-ketlikning logarifmik ehtimolligi (XProb) va tokenlar darajasidagi oʻrtacha entropiyadan (XEnt) foydalanamiz. Entropiya javob uzunligiga bogʻliq boʻlmagan ishonch signali sifatida xizmat qiladi (REnt = 10), logarifmik ehtimollik esa uzunlikka sezgir boʻlgani uchun unga RProb = 250 belgilangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Entropiya bu oʻrinda modelning keyingi tokenni tanlashdagi «ikkilanishi» oʻlchovidir: qiymat qanchalik yuqori boʻlsa, model tanlovi shunchalik oldindan aytib boʻlmaydigan boʻladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Javoblarni koʻzgusimon aks ettirish (XMR). Model javob uslubini kiritilayotgan maʼlumotlarning sirtqi xususiyatlariga (masalan, uzunlik yoki shovqin) moslashtirishi mumkin. Biz m(y, v) binar detektoridan foydalanamiz, u y javob v variatsiyasining xususiyatini aks ettirishini aniqlaydi. ∆XMR qiymati bazaviy va oʻzgartirilgan promptlar oʻrtasidagi ushbu aks etish farqini koʻrsatadi (RMR = 1).&lt;/p&gt;\n&lt;h4 id=\"eksperimentlar\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#eksperimentlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Eksperimentlar&lt;/span&gt;&lt;/a&gt;Eksperimentlar&lt;/h4&gt;\n&lt;p&gt;Biz SAGO tizimi yordamida instruksiyalarga moslashtirilgan LLM modellarini baholaymiz. Biz SGSX ni variatsiyalar oilasi, turi, kuchi va pozitsiyasining barcha kombinatsiyalari uchun hisoblaymiz. Tadqiqot uchta savolga javob izlaydi: nosozlik turlari oltita ∆-oʻq boʻyicha farqlanadimi; model ichidagi maʼlumotlar toʻplamining oʻzgarishi model reytingini oʻzgartirish uchun yetarlimi; va yopiq hamda ochiq modellar oʻrtasida beqarorlik profillarida sifat jihatidan farqlar bormi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Baholash instruksiyalarga moslashtirilgan modellar ustida oʻtkaziladi; natijalar model oilasining oʻziga xos xususiyatlariga bogʻliq boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimental-sozlamalar\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#eksperimental-sozlamalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Eksperimental sozlamalar&lt;/span&gt;&lt;/a&gt;Eksperimental sozlamalar&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar sakkizta ochiq kodli (Llama-3.2/3.1, Gemma-2/4 va Qwen2.5/3.5 oilalari) hamda uchta yopiq kodli (GPT-5.4, Gemini-2.5-Flash, Claude-Sonnet-4.6) modellarni tahlil qildilar. Barcha modellar uchun deterministik dekodlash (T=0) qo'llanildi. Hisob-kitoblar NVIDIA RTX 2080 Ti va GTX 1080 Ti grafik protsessorlarida bajarildi. Samaradorlik oltita ma'lumotlar to'plami (TruthfulQA, Natural Questions, Alpaca, SimpleQA Verified, TriviaQA, HotpotQA) yordamida baholandi. Har bir to'plam uchun 16 ta prompt tanlab olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deterministik dekodlash (T=0) — bu neyron tarmoqning har doim eng ehtimolli keyingi tokenni tanlaydigan ish rejimi bo'lib, u javoblarni takrorlanuvchan qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Barqarorlikni baholash uchun (V to'plami) uchta usul qo'llanildi: xushmuomalalik darajasini o'zgartirish (11 daraja), yuzaki shovqin qo'shish (registr, tinish belgilari va bo'shliqlarni o'zgartirish) hamda strukturaviy qayta ishlash (gap uzunligi va shaklini o'zgartirish). Semantik mazmunning saqlanishi BERTScore (chegara &amp;gt; 0,85) yordamida tekshirildi.&lt;/p&gt;\n&lt;p&gt;XBLEU va XBERT metrikalari RoBERTa-large asosida ishlaydi, ijtimoiy registrlar uchun XMR esa GPT-4o-mini yordamida baholandi. ε chegaraviy qiymati 0,05 darajasida belgilandi.&lt;/p&gt;\n&lt;h4 id=\"eksperiment-natijalari\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#eksperiment-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Eksperiment natijalari&lt;/span&gt;&lt;/a&gt;Eksperiment natijalari&lt;/h4&gt;\n&lt;p&gt;Natijalar shuni ko'rsatadiki, modellar prompt o'zgarishlariga turlicha barqarorlik ko'rsatadi. 1-jadvalda yopiq modellar uchun SGS ko'rsatkichlari keltirilgan. Masalan, GPT-5.4 uchun o'rtacha SGS ko'rsatkichi ma'lumotlar to'plamiga qarab 0,384 dan 0,477 gacha bo'ldi. Claude-Sonnet-4.6 modeli yuqoriroq SGS qiymatlarini (Alpaca'da 0,569 gacha) ko'rsatdi, bu generatsiyaning kirish ma'lumotlaridagi o'zgarishlarga sezgirligini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellar prompt o'zgarishlariga statistik jihatdan sezilarli sezgirlikni ko'rsatadi (aksariyat hollarda p &amp;lt; 0,001), bu generatsiya barqarorligini baholash zarurligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar cheklangan tanlanma (har bir to'plam uchun 16 ta prompt) asosida olingan va modellarning boshqacha turdagi so'rovlar bilan ishlashdagi xatti-harakatini to'liq aks ettirmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-tT1.jpg\" alt=\"Jadval 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"total-sgs\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#total-sgs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Total SGS&lt;/span&gt;&lt;/a&gt;Total SGS&lt;/h4&gt;\n&lt;p&gt;Tadqiqot shuni koʻrsatadiki, hech bir model universal barqarorlikka ega emas. Semantik jihatdan ekvivalent boʻlgan kirish maʼlumotlari oʻzgarganda yuzaga keladigan beqarorlik maʼlum bir arxitektura yoki oʻqitish usulining kamchiligi emas: har bir ochiq kodli model kamida bitta oʻq boʻyicha ε=0.05 beqarorlik chegarasidan oshib ketadi. Δ-BLEU va Δ-MR koʻrsatkichlaridagi oʻzgarishlarning statistik ahamiyati barcha modellar uchun p&amp;lt;0.001 darajasida tasdiqlangan. Bu holat uch xil arxitekturaviy oilada kuzatilishi joriy instruksiyalarni sozlash (instruction-tuning) usullarining fundamental strukturaviy xususiyati ekanligini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hech bir model universal barqaror emas; beqarorlik arxitektura va parametrlar sonidan qatʼi nazar saqlanib qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Masshtabni tahlil qilish parametrlar sonini oshirish muammoni hal qiladi degan gipotezani rad etadi: L-8B, G-7B va Q-7B modellari oʻzlarining kichikroq hamkasblariga qaraganda bir xil yoki undan ham yuqori beqarorlikni koʻrsatadi (Rasm 2a). Shu bilan birga, Δ-Ent koʻrsatkichi maqbul chegara ichida qoladi (maksimal 0,012), bu token darajasidagi taqsimot keskinligi chiqish darajasidagi barqarorlik bilan kuchsiz bogʻliqligini anglatadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"oqlarning-ajralishi-axis-dissociation\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#oqlarning-ajralishi-axis-dissociation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oʻqlarning ajralishi (Axis dissociation)&lt;/span&gt;&lt;/a&gt;Oʻqlarning ajralishi (Axis dissociation)&lt;/h4&gt;\n&lt;p&gt;Asosiy savol shundaki, xulq-atvor oʻqlari yagona beqarorlikning oʻzaro almashtiriladigan koʻrsatkichlarimi yoki ular mustaqil nosozlik turlarini ifodalaydimi? Maʼlumotlar ikkinchi variantni tasdiqlaydi. Gemma oilasida G4-E4B modeli eng yuqori generatsiya beqarorligini qayd etadi (Δ-BERT: 0,178; Δ-BLEU: 0,837), avvalgi versiyalar esa (G-2B: 0,097; G-7B: 0,084) ancha barqarorroq. Bu model imkoniyatlarining oʻsishi avtomatik ravishda uning mustahkamligini oshiradi degan taxminni rad etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oʻqlarning ajralishi shuni anglatadiki, model matn generatsiyasida barqaror boʻlishi, lekin ayni paytda yuqori noaniqlik yoki maʼlumotlarni koʻchirishga (imitatsiya) moyillik koʻrsatishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Q3.5-9B modeli buning aksini koʻrsatadi: eng past Δ-BERT (0,080) va Δ-BLEU (0,520) koʻrsatkichlari, lekin eng yuqori ishonchsizlik beqarorligi (Δ-Prob: 0,088) va koʻzguli beqarorlik (Δ-MR: 0,441). Bunday tizimli inversiya generatsiya izchilligi va model ishonchi bir xil beqarorlikning bogʻliq proksi-koʻrsatkichlari emasligini isbotlaydi. Agregat baholar qarama-qarshi nosozlik profillarini yashirishi mumkin, bu esa tuzatish uchun turlicha yondashuvlarni talab qiladi.&lt;/p&gt;\n&lt;h4 id=\"malumotlar-toplamlari-ortasidagi-ozgaruvchanlik\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#malumotlar-toplamlari-ortasidagi-ozgaruvchanlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Maʼlumotlar toʻplamlari oʻrtasidagi oʻzgaruvchanlik&lt;/span&gt;&lt;/a&gt;Maʼlumotlar toʻplamlari oʻrtasidagi oʻzgaruvchanlik&lt;/h4&gt;\n&lt;p&gt;Modelning beqarorligi qatʼiy skalyar xususiyat emas; u kontent domeniga bogʻliq. L-8B modeli uchun Δ-Cos koʻrsatkichi 3,7 barobar, Δ-MR esa maʼlumotlar toʻplamiga qarab ikki barobardan koʻproq oʻzgaradi. Bu shuni anglatadiki, bitta benchmarkga bogʻlangan mustahkamlik bahosi faqat oʻsha aniq domenni tavsiflaydi. Kontent taqsimoti nazorat qilinmaydigan real sharoitlarda bu juda muhim: testda barqaror koʻringan model amalda beqaror boʻlishi mumkin. Oltita maʼlumotlar toʻplamini teng ogʻirlik bilan birlashtiruvchi Total SGSX ushbu bogʻliqlikni oʻrtacha hisoblash uchun eng maqbul usuldir.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Socialregistervariantsatallevaluatedstrengths.Negativevaluesintroduceimperative orsociallynegativeframing;positivevaluesaddgreetings,hedging,andgratitudemarkerswith elaborateness scaling with /s/.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-tT2.jpg\" alt=\"Jadval 2\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"natijalarni-muhokama-qilish\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#natijalarni-muhokama-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalarni muhokama qilish&lt;/span&gt;&lt;/a&gt;Natijalarni muhokama qilish&lt;/h4&gt;\n&lt;p&gt;Semantik jihatdan ekvivalent boʻlgan kirish maʼlumotlari oʻzgarishlarida modellarning umumlashtirish qobiliyatini yagona aniqlik koʻrsatkichi yoki barqarorlik metriklari bilan toʻliq tasvirlab boʻlmaydi. Beqarorlik — bu maʼlumotlar toʻplami, oʻzgarishlar oilasi va alohida promptlarga bogʻliq boʻlgan tizimli profildir. Model bir xulq-atvor oʻqi boʻyicha barqaror, boshqasida esa beqaror boʻlishi mumkin. Benchmarklardagi oʻxshash natijalar alohida misollar darajasidagi sezilarli oʻzgarishlarni yashirishi mumkin, bunda oʻrtacha ball saqlanib qolsa-da, javoblar yoki ishonch namunalari oʻzgaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM barqarorligi universal emas: benchmarklardagi yuqori aniqlik soʻrov shakli oʻzgarganda javoblar barqarorligini kafolatlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Modellarning umumlashtirish qobiliyati haqidagi daʼvolar aniq domenlar va oʻzgarishlar turlari bilan cheklanishi kerak. Modellarni solishtirish umumiy reyting asosida emas, balki xulq-atvor profillari asosida amalga oshirilishi lozim, chunki modelni tanlash ustuvorliklarga (mazmun barqarorligi, ishonch yoki yuzaki belgilarni koʻchirishga chidamlilik) bogʻliq. Ochiq va yopiq kodli modellar oʻrtasidagi farqlar shuni koʻrsatadiki, kuchliroq modellar beqarorlikni yoʻqotmaydi, balki uni boshqa oʻlchovlarga oʻtkazadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/mirroring.html\"&gt;Zerkalirovanie&lt;/a&gt; (mirroring) — bu modelning kirish soʻrovi uslubi yoki tuzilishini, hatto javob mazmuni uchun kerak boʻlmasa ham, nusxalashga moyilligidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cheklovlar-va-istiqbollar\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#cheklovlar-va-istiqbollar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va istiqbollar&lt;/span&gt;&lt;/a&gt;Cheklovlar va istiqbollar&lt;/h4&gt;\n&lt;p&gt;SAGO usuli xulq-atvor oʻzgarishlarini qayd etadi, ammo ularning sababiy mexanizmlarini ochib bermaydi. Tadqiqot faqat ingliz tili bilan cheklangan, shuning uchun xulosalarning boshqa tillar va madaniy kontekstlarga tatbiqi isbotlanmagan. Δ-BLEU metrikasi leksik ogʻishlarni baholaydi, Δ-BERT esa buni maʼno darajasida toʻldiradi. N=16 hajmidagi tanlanma odatiy beqarorlik uchun yetarli, ammo kam uchraydigan kritik nosozliklar uchun kattaroq maʼlumotlar talab qilinishi mumkin. Strukturaviy variantlarni baholash uchun GPT-4o-mini dan foydalanish uslubiy buzilishlarga olib kelishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot ingliz tili va GPT-4o-mini baholash vositasi bilan cheklangan, bu esa natijalarni boshqa tillar va modellar uchun talqin qilishni cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kelgusi ishlar SAGO ni koʻp tilli muhitlarga kengaytirishi, xulq-atvor profillarini aktivatsiyalar tahlili orqali ichki mexanizmlar bilan bogʻlashi va oʻqitish usullarini har qanday semantik ekvivalent oʻzgarishlarda xulq-atvor barqarorligini saqlab qolish qobiliyati boʻyicha baholashi kerak.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f1.jpg\" alt=\"1-rasm: Semantik jihatdan ekvivalent boʻlgan faktual promptlar model oilalari boʻylab oʻlchanadigan xulq-atvor oʻzgarish\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Semantik jihatdan ekvivalent boʻlgan faktual promptlar model oilalari boʻylab oʻlchanadigan xulq-atvor oʻzgarishlarini keltirib chiqaradi. Radarlar toʻrtta oʻq boʻyicha oʻrtacha delta kattaligini koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f3.jpg\" alt=\"3-rasm: Prompt namunalari hajmi N funksiyasi sifatida har bir prompt uchun beqarorlikning standart chetlanishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Prompt namunalari hajmi N funksiyasi sifatida har bir prompt uchun beqarorlikning standart chetlanishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Prompt namunalari hajmi N funksiyasi sifatida har bir prompt uchun beqarorlikning standart chetlanishi. Har bir panel bitta xulq-atvor oʻqini koʻrsatadi; har bir chiziq bitta modelga toʻgʻri keladi. Egri chiziqlar N=16 da platoga chiqadi va N=128 gacha tekis qoladi, bu N=16 barqaror baholash uchun yetarli ekanligini tasdiqlaydi. Uzuk chiziqli vertikal chiziq tanlangan ishchi nuqtani belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f4.jpg\" alt=\"4-rasm: Har bir oʻq uchun pozitsiya p funksiyasi sifatida (F, u, s) guruh oʻrtacha qiymatlarining standart chetlanishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Har bir oʻq uchun pozitsiya p funksiyasi sifatida (F, u, s) guruh oʻrtacha qiymatlarining standart chetlanishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: Har bir oʻq uchun pozitsiya p funksiyasi sifatida (F, u, s) guruh oʻrtacha qiymatlarining standart chetlanishi. Barcha oʻqlar va modellar boʻylab uchta pozitsiya tizimli ravishda turlicha qiymatlarni hosil qiladi: global variantlar generatsiya izchilligi va koʻzgulanishga eng katta taʼsir koʻrsatadi, prefiks va suffiks joylashuvi esa ishonch va aktivatsiya oʻqlarida turlicha sezgirlik profillarini namoyon etadi. Hech bir joylashuv barcha oʻqlar va modellar boʻylab ustunlik qilmaydi, bu pozitsiyalar boʻyicha birlashtirish xulq-atvor signalini yoʻqotishini va uchalasi ham V ga kiritilishi kerakligini tasdiqlaydi. Har bir panel bitta xulq-atvor oʻqini koʻrsatadi; har bir chiziq bitta modelga toʻgʻri keladi. Uchta pozitsiya (GLOBAL, PREFIX, SUFFIX) oʻqlar boʻylab turlicha profillarni hosil qiladi, bu barcha joylashuvlar SGSX ga mustaqil xulq-atvor signalini qoʻshishini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f5.jpg\" alt=\"5-rasm: Har bir prompt uchun beqarorlikning standart chetlanishi va oraliq kuchi (qoʻshilgan qoʻshimcha boʻsh joy tokenl\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Har bir prompt uchun beqarorlikning standart chetlanishi va oraliq kuchi (qoʻshilgan qoʻshimcha boʻsh joy tokenlari soni). Effektlar kuch ortishi bilan oʻsadi va modelga bogʻliq toʻyinish nuqtalarini koʻrsatadi, bunda generatsiya izchilligi oʻqlari oʻrtacha kuch darajalarida eng sezgir boʻladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f6.jpg\" alt=\"6-rasm: Har bir prompt uchun beqarorlikning standart chetlanishi va harf registri kuchi (katta harf bilan yozilgan belgi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Har bir prompt uchun beqarorlikning standart chetlanishi va harf registri kuchi (katta harf bilan yozilgan belgilar ulushi). Xulq-atvorni aniqlash darajasi koʻpchilik oʻqlar boʻylab kuch ortishi bilan oʻsadi va 50 dan yuqori kuch darajasida platoga chiqadi, bunda aktivatsiya geometriyasi eng katta va eng izchil javobni koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f7.jpg\" alt=\"7-rasm: Soʻrov boʻyicha beqarorlikning standart ogʻishi tinish belgilari kuchiga bogʻliq (har bir soʻrov uchun kiritilga\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Soʻrov boʻyicha beqarorlikning standart ogʻishi tinish belgilari kuchiga bogʻliq (har bir soʻrov uchun kiritilgan tinish belgilari tokenlari soni). Generatsiya izchilligi va faollashtirish oʻqlari kuchga bogʻliq eng aniq effektlarni koʻrsatadi; ishonch oʻqlari asosan oʻzgarmas boʻlib qoladi, bu ularning asosiy natijalardagi past umumiy SGSX koʻrsatkichiga mos keladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f8.jpg\" alt=\"8-rasm: Soʻrov boʻyicha beqarorlikning standart ogʻishi xushmuomalalik darajasiga bogʻliq.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Soʻrov boʻyicha beqarorlikning standart ogʻishi xushmuomalalik darajasiga bogʻliq.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-rasm: Soʻrov boʻyicha beqarorlikning standart ogʻishi xushmuomalalik darajasiga bogʻliq. Manfiy qiymatlar qoʻpol shakllantirishga, musbat qiymatlar esa xushmuomala shakllantirishga toʻgʻri keladi; nol — oʻzgarishsiz boshlangʻich daraja. Qoʻpol variantlar koʻpgina modellar va oʻqlar boʻyicha xushmuomala variantlarga qaraganda kattaroq va izchilroq xulq-atvor siljishlarini keltirib chiqaradi, bu modellarning salbiy va ijobiy ijtimoiy ohangga javob berishidagi assimetriyani koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f9.jpg\" alt=\"9-rasm: Soʻrov boʻyicha beqarorlikning standart ogʻishi uzunlikni oʻzgartirish koeffitsientiga bogʻliq (maqsadli uzunlik\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm: Soʻrov boʻyicha beqarorlikning standart ogʻishi uzunlikni oʻzgartirish koeffitsientiga bogʻliq (maqsadli uzunlikning asl soʻrovga nisbati; 1,0 dan past qiymatlar siqilishni, 1,0 dan yuqori qiymatlar esa kengayishni bildiradi).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-rasm: Soʻrov boʻyicha beqarorlikning standart ogʻishi uzunlikni oʻzgartirish koeffitsientiga bogʻliq (maqsadli uzunlikning asl soʻrovga nisbati; 1,0 dan past qiymatlar siqilishni, 1,0 dan yuqori qiymatlar esa kengayishni bildiradi). Siqilish generatsiya izchilligi va koʻzgulanish oʻqlari boʻyicha kengayishga qaraganda kattaroq va modellar uchun izchilroq xulq-atvor siljishlarini keltirib chiqaradi, ishonch oʻqlari esa kengayishga kuchliroq javob beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/t
