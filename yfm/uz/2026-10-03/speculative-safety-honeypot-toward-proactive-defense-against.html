        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"190\" cy=\"144\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"550\" cy=\"244\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · TOOLING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;AI-agentlarga qilingan&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;hujumlarni oldindan bashorat&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qilish usuli&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-f3.jpg\" alt=\"3-rasm. Toʻrtta maʼlumotlar toʻplami boʻyicha barcha SSH spekulyativ natijalarining oʻrtacha xavf koʻrsatkichlari (ustun\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Toʻrtta maʼlumotlar toʻplami boʻyicha barcha &lt;a href=\"concepts/speculative-safety-honeypot.html\"&gt;SSH&lt;/a&gt; spekulyativ natijalarining oʻrtacha xavf koʻrsatkichlari (ustunli diagramma, chap Y oʻqi) va chegaraviy qiymatdan oshib ketish natijasida yuzaga kelgan ogohlantirishlar ulushi (gorizontal uzuq chiziq, oʻng Y oʻqi).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Zamonaviy AI-agentlar murakkab ko‘p bosqichli hujumlarga qarshi himoyasiz, chunki tajovuzkorlar niyatlarini uzoq harakatlar zanjirida yashiradilar. Mualliflar Speculative Safety Honeypot (SSH) tizimini taklif qilishadi, u kichik til modellari yordamida agentning kelajakdagi xatti-harakatlarini simulyatsiya qiladi. Tizim xavfli stsenariylarni real hayotda sodir bo‘lishidan oldin aniqlab, ularni bloklaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SSH tarixiy tahlildan kelajakdagi xavflarni bashorat qilishga o‘tadi.&lt;/li&gt;\n&lt;li&gt;Kichik LLMlar yordamida simulyatsiya real vositalarni ishlatmasdan xavfni aniqlash imkonini beradi.&lt;/li&gt;\n&lt;li&gt;Murakkab ko‘p bosqichli hujumlar uchun 0% muvaffaqiyat darajasi (&lt;a href=\"concepts/attack-success-rate.html\"&gt;ASR&lt;/a&gt;) qayd etilgan.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;SSH usuli proaktiv himoya uchun ko‘p agentli simulyatsiyadan foydalanadi. Tizim uchta komponentdan iborat: «yordamchi simulyatori» (zaifliklarni aniqlash uchun himoya filtrlari bo‘lmagan model), «&lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;foydalanuvchi simulyatori&lt;/a&gt;» (noaniq so‘rovlar generatori) va «muhit simulyatori» (real API chaqiruvlarisiz vositalarni imitatsiya qilish).&lt;/p&gt;\n&lt;p&gt;Algoritm traektoriyalar daraxtini qurish uchun xilma-xillikka yo‘naltirilgan qidiruvdan (diversity-oriented &lt;a href=\"concepts/beam-search.html\"&gt;Beam Search&lt;/a&gt;) foydalanadi. Daraxt tugunlari 0,7 chegaraviy qiymat bilan &lt;a href=\"concepts/simhash.html\"&gt;SimHash&lt;/a&gt; (semantik o‘xshashlikni baholash uchun xeshlash) yordamida klasterlanadi. Agar daraxtdagi xavfli yakuniy tugunlar ulushi belgilangan me’yordan oshsa, tizim ijroni to‘xtatadi. Tajribalarda usul hujumlar muvaffaqiyatini (ASR) 0% gacha tushirdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usulning samaradorligi simulyatsiya uchun ajratilgan hisoblash resurslari va kichik modellarning bashorat aniqligiga bog‘liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Katta til modellari (&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;) agentlarining murakkab muhitlarda qoʻllanilishi ortib borishi bilan, koʻp bosqichli oʻzaro taʼsir hujumlari xavfsizlik uchun jiddiy muammoga aylanmoqda. Mavjud aniqlash usullari odatda tarixiy kontekstga tayanadi. Biroq, bu retrospektiv mantiq kelajakdagi xavflarni yashirish uchun bir necha bosqichga boʻlingan chuqur zararli niyatlarni aniqlashda qiynaladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Anʼanaviy aniqlash usullari koʻp bosqichli hujumlar oldida ojiz, chunki ular harakatlar ketma-ketligida yashiringan zararli niyatni ilgʻay olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar &lt;a href=\"concepts/spekulyativnoe-dekodirovanie.html\"&gt;spekulyativ dekodlash&lt;/a&gt; usulidan ilhomlangan Speculative Safety Honeypot (SSH) tizimini taklif qilishadi. SSH kichik LLM'lardan tashkil topgan koʻp agentli simulyatsiya tizimi boʻlib, u harakatlar darajasida «taxmin qil va tekshir» ish jarayonini amalga oshiradi. Taxmin qilish bosqichida SSH maqsadli agentning kelajakdagi xatti-harakatlarini bashorat qiladi va potentsial xavflarni oldindan aniqlash uchun asinxron tarzda trayektoriya daraxtini quradi. Tekshirish bosqichida tizim maqsadli agentning real harakatlaridan foydalanib, trayektoriya daraxtini kalibrlaydi va ortiqcha qismlarini olib tashlaydi, bu esa notoʻgʻri ijobiy natijalarni kamaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Spekulyativ dekodlash — bu model kelajakdagi maʼlumotlar haqida tezkor taxminlar qiladigan va keyin ularning toʻgʻriligini tekshiradigan usul boʻlib, tahlil samaradorligini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SSH plagin sifatida mavjud aniqlash tizimlarini joriy oʻzaro taʼsir doirasidan tashqaridagi boy qaror qabul qilish maʼlumotlari bilan taʼminlaydi. Xavflarni baholash tizimi vaqtning bir nuqtasiga emas, balki butun trayektoriya daraxtining evolyutsiyasiga asoslanadi. Bu alohida aniqlash komponentlarining mutlaq aniqligiga boʻlgan bogʻliqlikni kamaytiradi, mudofaa barqarorligini va murakkab vaqtinchalik hujumlarga qarshi ogohlantirish muddatini oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu usul model asosidagi yechimdir; himoya samaradorligi kichik LLM'lar tomonidan maqsadli agent xatti-harakatlarini simulyatsiya qilish sifatiga bogʻliq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Katta til modellari (LLM) agentlariga boʻlgan xavfsizlik tahdidlari oddiy bir bosqichli soʻrovlardan murakkab koʻp bosqichli oʻzaro taʼsirlarga oʻtmoqda. Asosiy stsenariylar quyidagilarni oʻz ichiga oladi: koʻp bosqichli «jailbreak» hujumlari (bunda hujumchi xavfsizlik filtrlarini chetlab oʻtish uchun yuklamani boʻlaklarga ajratadi) va koʻp bosqichli bilvosita prompt inʼeksiyalari (IPI) (bunda agent tashqi manbalardan olingan zararli koʻrsatmalarni bajaradi). Tarixiy kontekstni tahlil qiluvchi mavjud himoya usullari «vaqtinchalik yashirin» hujumlarga qarshi yetarli emas: qattiq filtrlar koʻp xato signallarni beradi, yumshoq chegaralar esa chuqur yashiringan niyatlarni oʻtkazib yuboradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SSH oʻtmishdagi kontekstni tahlil qilishdan agentning kelajakdagi xatti-harakatlarini proaktiv bashorat qilishga oʻtadi va koʻp bosqichli stsenariylarda 0% ASR (hujum muvaffaqiyati darajasi) ga erishadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu muammoni hal qilish uchun Speculative Safety Honeypot (SSH) usuli taklif etildi. U uchta simulyatordan foydalanadi: yordamchi (maqsadli agentning zaif nusxasi), foydalanuvchi (kirish maʼlumotlari generatori) va muhit (tashqi vositalarni haqiqatda chaqirmasdan, ularning javoblarini taqlid qiluvchi). Ushbu komponentlar asinxron ishlaydi va agentning kelajakdagi harakatlarini bashorat qiladi. Jarayonda xilma-xillikka yoʻnaltirilgan «Beam Search» algoritmi qoʻllaniladi, bu cheklangan hisoblash resurslari bilan xavf maydonini oʻrganishga imkon beradi. Tizim maqsadli agentning xatti-harakatini bashoratlar daraxti bilan solishtiradi va xavfli tugunlarni baholaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Beam Search — bu har bir qadamda eng ehtimolli variantlarni saqlab qoladigan va koʻplab hujum stsenariylarini samarali oʻrganishga imkon beradigan qidiruv algoritmi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SSH ning afzalligi qarorlarning ortiqligidadir: tizim bitta javobni emas, balki butun daraxt boʻylab xavf tendentsiyalarini baholaydi. Ishning asosiy hissasi SSH ni yaratish, kam uchraydigan hujum stsenariylarini aniqlash uchun qidiruv algoritmini ishlab chiqish va agentning foydaliligini pasaytirmasdan tizim barqarorligini namoyish etishdan iborat.&lt;/p&gt;\n&lt;h4 id=\"2-related-work-21-speculation-techniques\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#2-related-work-21-speculation-techniques\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Related Work 2.1. Speculation Techniques&lt;/span&gt;&lt;/a&gt;2. Related Work 2.1. Speculation Techniques&lt;/h4&gt;\n&lt;p&gt;Tokenlar generatsiyasini tezlashtirish uchun yaratilgan spekulyativ dekodlash texnikalari xavfsizlik sohasida ham qoʻllanilmoqda. SSD (xavfsizlik ekspertidan foydalanish), DSP (agent harakatlarini spekulyativ rejalashtirish) va SpecReason (mulohaza yuritish bosqichlarini generatsiya qilish) kabi yondashuvlar mavjud. Ushbu usullar yengil modellar yordamida harakatlar va API javoblarini bashorat qilish maqsadga muvofiqligini isbotlaydi, bu esa SSH arxitekturasining asosliligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ogohlantirish: usulning samaradorligi simulyatorlarning maqsadli agent va muhit xatti-harakatlarini turli sharoitlarda aniq taqlid qilish qobiliyatiga bogʻliq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-kop-bosqichli-hujumlar\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#22-kop-bosqichli-hujumlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. Koʻp bosqichli hujumlar&lt;/span&gt;&lt;/a&gt;2.2. Koʻp bosqichli hujumlar&lt;/h4&gt;\n&lt;p&gt;Koʻp bosqichli (Multi-turn) jailbreak hujumlari LLM bilan oʻzaro taʼsirning ketma-ketlik xususiyatidan foydalanib, bir martalik soʻrovlarga qarshi turadigan xavfsizlik filtrlarini chetlab oʻtadi. Statik inyeksiyalardan farqli oʻlaroq, bu hujumlar modelni bosqichma-bosqich buzilgan holatga olib keladi. Masalan, Crescendo usuli zararli kontekstni toʻplash uchun zararsiz koʻringan soʻrovlardan foydalanadi, ASJA esa modelning self-attention mexanizmini xavfsizlik tokenlaridan chalgʻitish uchun dialog tarixini manipulyatsiya qiladi. AMA usuli esa niyatni yashirish uchun domenlararo oʻxshashliklardan foydalanadi. Bu usullar «kontekst siljishi» (context-drift) zaifligini koʻrsatadi, bunda toʻplangan semantik ogʻirlik dastlabki xavfsizlik sozlamalaridan ustun keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Koʻp bosqichli hujumlar dialog davomida zararli kontekstni toʻplash orqali alohida soʻrovlarni tahlil qilishga moʻljallangan himoya mexanizmlarini chetlab oʻtadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bilvosita-kop-bosqichli-inyeksiyalar-ipi\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#bilvosita-kop-bosqichli-inyeksiyalar-ipi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bilvosita koʻp bosqichli inyeksiyalar (IPI)&lt;/span&gt;&lt;/a&gt;Bilvosita koʻp bosqichli inyeksiyalar (IPI)&lt;/h4&gt;\n&lt;p&gt;Bilvosita inyeksiyalar (Indirect Prompt Injection) agentlarning tashqi maʼlumotlarga boʻlgan ishonchini suiisteʼmol qiladi. InjecAgent, AgentDojo va STAC kabi benchmarklar hujjatlar yoki vositalar natijalaridagi yashirin koʻrsatmalar foydalanuvchining toʻgʻridan-toʻgʻri aralashuvisiz ish jarayonini buzishi mumkinligini koʻrsatadi. Koʻp bosqichli vazifalarda bunday «zaharlangan» maʼlumotlar agentning fikrlash siklini buzib, uning ichki rejalashtirish jarayonini asta-sekin izdan chiqaradi. Tadqiqotlar shuni koʻrsatadiki, HTML kodini modifikatsiya qilish orqali veb-agentlarni zararli maqsadlarga yoʻnaltirish mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/kosvennaya-inektsiya.html\"&gt;Bilvosita inyeksiya&lt;/a&gt; — bu hujum turi boʻlib, unda zararli koʻrsatma foydalanuvchi tomonidan emas, balki agent vazifani bajarish jarayonida oʻqiydigan tashqi maʼlumotlar orqali kiritiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mavjud himoya usullarining cheklovlari&lt;/p&gt;\n&lt;p&gt;Zamonaviy tadqiqotlar murakkab dialoglardagi dushmanona hujumlarga qarshi kurashishga qaratilgan boʻlsa-da, mavjud yechimlar (ham promp-usullari, ham tashqi detektorlar) faqat joriy kontekst doirasida himoyalanishga eʼtibor qaratadi. Ularda kelajakdagi bajarilish yoʻllarini bashorat qiluvchi modellashtirish yetishmaydi, bu esa ularning proaktiv himoya strategiyasini amalga oshirish imkoniyatini cheklaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavjud himoya tizimlari faqat joriy kontekstni tahlil qilish bilan cheklanadi va hujumning kelgusi bosqichlarini bashorat qila olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Ushbu ishda Speculative Safety Honeypot (SSH) tizimi taqdim etilgan — bu LLM agentlari xavfsizligini retrospektiv kontekst tahlilidan kelajakdagi tahdidlarni bashorat qilishga oʻtkazuvchi proaktiv himoya mexanizmidir. Yengil simulyatorlarni xilma-xillikka yoʻnaltirilgan nurli qidiruv (diversity-oriented beam search) bilan integratsiya qilish orqali SSH koʻp bosqichli muloqotlardagi yashirin zararli niyatlarni aniqlaydi va tizim funksionalligini saqlab qoladi. Eksperimental natijalar SSH ham jailbreak, ham bilvosita inyeksiya tahdidlari uchun hujum muvaffaqiyati darajasini (ASR) 0% gacha kamaytirishini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"1-hisoblash-va-ekologik-tasirlar\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#1-hisoblash-va-ekologik-tasirlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Hisoblash va ekologik taʼsirlar&lt;/span&gt;&lt;/a&gt;1. Hisoblash va ekologik taʼsirlar&lt;/h4&gt;\n&lt;p&gt;SSH ning asosiy kompromissi — parallel bashorat qilish uchun talab qilinadigan qoʻshimcha hisoblash resurslari. 3B hajmli yengil model va &lt;a href=\"concepts/multi-lora.html\"&gt;Multi-LoRA&lt;/a&gt; (235B maqsadli modelga nisbatan atigi 1,3% parametr qoʻshadi) ishlatilishiga qaramay, M=5 parallel tarmoqni yuritish uchun GPU xotirasi va elektr energiyasi sarfi sezilarli darajada. Amalga oshirish jarayonida vLLM asosidagi paketlashdan foydalanilgan, bu KV-keshlarni qayta ishlatish orqali energiya sarfini minimallashtiradi. Keng koʻlamli joriy etishda ushbu «xavfsizlik soligʻi» muvaffaqiyatli xavfsizlik buzilishining potentsial xarajatlari bilan solishtirilishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;5 ta parallel bashorat tarmoqlarini ishlatish 0% ASR darajasini taʼminlaydi, biroq GPU xotirasi va energiya sarfini oshiradi, bu esa vLLM paketlash orqali optimallashtiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2-fpr-ning-foydalanuvchi-tajribasiga-tasiri\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#2-fpr-ning-foydalanuvchi-tajribasiga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. FPR ning foydalanuvchi tajribasiga taʼsiri&lt;/span&gt;&lt;/a&gt;2. FPR ning foydalanuvchi tajribasiga taʼsiri&lt;/h4&gt;\n&lt;p&gt;Yuqori &lt;a href=\"concepts/false-positive-rate.html\"&gt;FPR&lt;/a&gt; (notoʻgʻri ijobiy natijalar darajasi) ortiqcha blokirovkalarga olib kelishi mumkin, bu foydalanuvchini ranjitadi va agentning intellektini pasaytiradi. AgentDojo platformasidagi tajribalarda tizim darajasidagi FPR 0,2% ni tashkil etdi. Garchi bu past koʻrsatkich boʻlsa-da, har bir notoʻgʻri hodisa (masalan, xavfsiz vosita chaqiruvining bloklanishi) 3–7 soniyalik kechikishga olib keladi va agentning konservativ yoki takrorlanuvchi javob berishiga sabab boʻlishi mumkin. Ijodiy vazifalarda niyatlar chegarasi nozik boʻlgani uchun, nizolarni hal qilishda foydalanuvchi ishtiroki (user-in-the-loop) talab qilinishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FPR (False Positive Rate) — xavfsiz harakatlarning tahdid sifatida notoʻgʻri bloklanish ulushi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"impact-statement\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#impact-statement\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Impact Statement&lt;/span&gt;&lt;/a&gt;Impact Statement&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqot LLM agentlarining xavfsizlik holatini mustahkamlashga va ularni yuqori masʼuliyatli muhitlarda xavfsiz joylashtirishga qaratilgan. Mualliflar xavfsizlik choralarining javob tezligiga taʼsirini tan olsalar-da, ushbu metodologiyalarni tarqatish AI hamjamiyatining umumiy xavfsizligini oshirish uchun muhim deb hisoblaydilar. Ish zararli manipulyatsiyalarga nisbatan zaiflikni kamaytirish orqali yanada chidamli va ishonchli LLM agentlarini rivojlantirishga hissa qoʻshadi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-tT3.jpg\" alt=\"Jadval 3\" /&gt;&lt;/p&gt;\n&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;p&gt;SSH tizimi maqsadli agentning kelajakdagi harakatlarini bashorat qilish uchun bir nechta LLM'lardan iborat koʻp agentli tizimdan (MAS) foydalanadi. Bu jarayon «taxminlar daraxti»ni hosil qiladi, unda barg tugunlari yuqori xavfli xatti-harakatlar uchun baholanadi. Maqsadli agent real harakatni amalga oshirganda, daraxt mos ravishda qisqartiriladi va qolgan tugunlarning xavf nisbati hisoblanadi. Agar bu nisbat belgilangan chegaradan oshsa, tizim ogohlantirish yuboradi.&lt;/p&gt;\n&lt;h4 id=\"31-simulyatsiya-tizimini-qurish\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#31-simulyatsiya-tizimini-qurish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1. Simulyatsiya tizimini qurish&lt;/span&gt;&lt;/a&gt;3.1. Simulyatsiya tizimini qurish&lt;/h4&gt;\n&lt;p&gt;SSH yadrosi uchta LLM asosidagi simulyatordan iborat:&lt;br /&gt;\n• Yordamchi simulyatori: xavfsizlik filtrlari boʻlmagan modeldan foydalanib, maqsadli agentni taqlid qiladi.&lt;br /&gt;\n• Foydalanuvchi simulyatori: standart filtrlarni chetlab oʻtishi mumkin boʻlgan turli xil va noaniq soʻrovlarni yaratadi.&lt;br /&gt;\n• Muhit simulyatori: vositalar (MCP), maʼlumotlar bazalari va uchinchi tomon agentlari uchun sintetik fikr-mulohazalarni taqdim etadi, bu esa jarayonni xavfsiz va izolyatsiya qilingan holda saqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/mas.html\"&gt;Koʻp agentli tizim&lt;/a&gt; (MAS) — bu bir nechta mustaqil dasturiy agentlarning murakkab vazifani hal qilish uchun oʻzaro hamkorlik qilishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-taxminiy-trayektoriya-daraxtini-loyihalash\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#32-taxminiy-trayektoriya-daraxtini-loyihalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2. Taxminiy trayektoriya daraxtini loyihalash&lt;/span&gt;&lt;/a&gt;3.2. Taxminiy trayektoriya daraxtini loyihalash&lt;/h4&gt;\n&lt;p&gt;SSH maqsadli agentning xabarlar roʻyxatini klonlaydi va taxminlar daraxtini quradi. Xavflarni aniqlash uchun «Beam Search» algoritmi qoʻllanadi.&lt;/p&gt;\n&lt;p&gt;Jarayon ikkita parametr bilan boshqariladi: tanlov byudjeti M (daraxt kengligi) va maksimal chuqurlik D (qadamlar soni). Oʻzaro taʼsirlar «kalit tugunlar» (foydalanuvchi soʻrovlari, yordamchi harakatlari) va «muntazam tugunlar» (vosita javoblari, xulosalar) ga boʻlinadi.&lt;/p&gt;\n&lt;h4 id=\"xulq-atvorni-klasterlash\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#xulq-atvorni-klasterlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulq-atvorni klasterlash&lt;/span&gt;&lt;/a&gt;Xulq-atvorni klasterlash&lt;/h4&gt;\n&lt;p&gt;M ta tanlangan tugunlar funksional yoki semantik oʻxshashligiga koʻra klasterlarga guruhlanadi. Matn uchun SimHash algoritmi ishlatiladi: &lt;span class=\"yfm-latex\" data-content=\"Overlap(n_i%2C%20n_j)%20%3D%20%5Cfrac%7Bbitcount(%0Aeg(Hash(n_i)%20%5Coplus%20Hash(n_j)))%7D%7BK%7D%20formulasi%20bo%CA%BByicha%20hisoblanadi%2C%20bu%20yerda%20K\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — hesh bitlari soni. Oʻxshashlik chegarasi 0,7 deb belgilangan.&lt;/p&gt;\n&lt;h4 id=\"ikki-darajali-aralashtirish\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#ikki-darajali-aralashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ikki darajali aralashtirish&lt;/span&gt;&lt;/a&gt;Ikki darajali aralashtirish&lt;/h4&gt;\n&lt;p&gt;Tanlovdagi tarafkashlikni yoʻqotish uchun ikki bosqichli randomizatsiya qoʻllanadi: avval klasterlar, keyin klaster ichidagi tugunlar tartibi aralashtiriladi.&lt;/p&gt;\n&lt;h4 id=\"tsiklik-tanlash-va-qayta-taqsimlash\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#tsiklik-tanlash-va-qayta-taqsimlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tsiklik tanlash va qayta taqsimlash&lt;/span&gt;&lt;/a&gt;Tsiklik tanlash va qayta taqsimlash&lt;/h4&gt;\n&lt;p&gt;Keyingi chuqurlik uchun nomzodlar «Round-Robin» usuli bilan M byudjetigacha tanlanadi. Bu mexanizm tez-tez uchraydigan xatti-harakatlarni kamaytirib, kam uchraydiganlarini kuchaytiradi va tizimni turli xil trayektoriyalarni oʻrganishga majbur qiladi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; AgentDojo maʼlumotlar toʻplamidagi unumdorlik&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Usul&lt;/th&gt;\n&lt;th&gt;ASR&lt;/th&gt;\n&lt;th&gt;UA&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Workspace&lt;/td&gt;\n&lt;td&gt;1.61&lt;/td&gt;\n&lt;td&gt;80.54&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sandwich&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;70.89&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PromptGuard&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;43.57&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w.SSH4/8&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;53.75&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Judger&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;57.68&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w.SSH4/8&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;78.39&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Maqsadli agent — Qwen3-235B. Jadvalda ASR (↓) va UA (↑) foizlarda koʻrsatilgan, eng yaxshi natijalar qalin harflar bilan belgilangan. w.SSH4/8 SSH bilan kuchaytirilgan detektorni anglatadi, bu yerda 4 va 8 mos ravishda 4 (D= 4) maksimal spekulyatsiya chuqurligini va 8 (M= 4) nur kengligini ifodalaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"33-asinxron-tekshirish-va-xavfni-baholash\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#33-asinxron-tekshirish-va-xavfni-baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3. Asinxron tekshirish va xavfni baholash&lt;/span&gt;&lt;/a&gt;3.3. Asinxron tekshirish va xavfni baholash&lt;/h4&gt;\n&lt;p&gt;Tekshirish mexanizmi maqsadli agentning haqiqiy harakatlarini taxminlar daraxti bilan solishtirish orqali xavf ehtimolini aniqlashtiradi. Bunda xulq-atvor &lt;a href=\"concepts/klasterizatsiya.html\"&gt;klasterlash&lt;/a&gt; mantigʻi qoʻllanadi: funksiya chaqiruvlari nomlari va argumentlari boʻyicha, matnli javoblar esa SimHash algoritmi yordamida solishtiriladi. Agar haqiqiy harakat M ta taxmin qilingan variantdan biriga mos kelsa, daraxt «kesiladi» (pruning) va faqat mos keladigan qism qoldiriladi. Moslik topilmasa, daraxt kelajakdagi tahlil uchun saqlanib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SimHash — bu matnlarning oʻxshashligini aniqlash uchun ishlatiladigan xeshlash usuli: xeshlar qanchalik yaqin boʻlsa, matnlar mazmuni shunchalik oʻxshash boʻladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Xavfni baholash daraxtning qolgan barcha barg tugunlari uchun amalga oshiriladi. Ildizdan barggacha boʻlgan traektoriyalar satrga oʻtkazilib, klassifikatorga (masalan, zararli kontent detektori yoki tashqi LLM) yuboriladi. Xavf darajasi S(T) «xavfli» deb topilgan barglar ulushini umumiy barglar soniga nisbati sifatida hisoblanadi. Ikki xil chegara oʻrnatilgan: τ₁ (taxmin harakat bilan mos kelganda) va τ₂ (mos kelmaganda), bunda τ₁ &amp;lt; τ₂. Moslik holatida qatʼiyroq chegara notoʻgʻri ijobiy signallarni kamaytiradi. Chegara oshib ketganda, tizim ijroni toʻxtatishi yoki koʻrsatmalarni oʻzgartirishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"34-differensial-moslashtirish-strategiyasi\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#34-differensial-moslashtirish-strategiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4. Differensial moslashtirish strategiyasi&lt;/span&gt;&lt;/a&gt;3.4. Differensial moslashtirish strategiyasi&lt;/h4&gt;\n&lt;p&gt;Simulyatsiya aniqligi va xavfga sezgirlikni muvozanatlash uchun differensial moslashtirish strategiyasi qoʻllanadi. Bu ikki bosqichdan iborat: aniqlikni oshirish va sezgirlikni kuchaytirish. Aniqlikni oshirish uchun yordamchi simulyator Toucan kabi maʼlumotlar toʻplamlari yordamida SFT (&lt;a href=\"concepts/sft.html\"&gt;Supervised Fine-Tuning&lt;/a&gt;) orqali oʻqitiladi. Bunda uzun fikrlash zanjirlari (CoT) olib tashlanadi, lekin xatolik namunalari saqlanib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt; (Low-Rank Adaptation) — bu neyron tarmoqlarni samarali sozlash usuli boʻlib, unda butun model emas, balki faqat kichik qoʻshimcha vaznlar oʻqitiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sezgirlik esa maʼlumotlar sintezi orqali oshiriladi: normal koʻrsatmalar boshqa muhitlardagi vositalar natijalariga kiritilib, agentning notoʻgʻri maʼlumotlar tufayli vazifadan chalgʻishi simulyatsiya qilinadi. Vositalar va foydalanuvchi simulyatorlari ham Toucan maʼlumotlarida oʻqitiladi. Barcha uchta simulyator Multi-LoRA arxitekturasidan foydalanadi: adapterlar bitta bazaviy LLM ustida parallel ishlaydi, bu esa video xotirani tejaydi va rollar oʻrtasida almashinuvni tezlashtiradi.&lt;/p&gt;\n&lt;h4 id=\"4-tajribalar-41-sozlash\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#4-tajribalar-41-sozlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Tajribalar 4.1. Sozlash&lt;/span&gt;&lt;/a&gt;4. Tajribalar 4.1. Sozlash&lt;/h4&gt;\n&lt;p&gt;SSH tizimining xavfsizlik va foydalilik samaradorligini baholash uchun to‘rtta benchmarkdan foydalanildi: AgentDojo, ActorAttack, XSTest va BFCL-v3. Maqsadli model sifatida Qwen3-235B tanlandi. SSH ishlashi uchun Dolphin3-3B modeliga asoslangan uchta simulyator Multi-LoRA usuli yordamida joylashtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multi-LoRA — bu neyron tarmoqlarni samarali sozlash usuli bo‘lib, u bitta bazaviy modelda bir nechta ixtisoslashgan adapterlarni ishga tushirish imkonini beradi va hisoblash resurslarini tejaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Himoya usullari uch toifadagi yondashuvlar bilan solishtirildi: prompt usullari (Sandwich, Spotlight, Tool Filter), xavfsizlik klassifikatorlari (ProtectAI, PromptGuard) va Judger usuli (Qwen3-0.6B modeli orqali agent harakatlarini baholash). Metrikalar har bir benchmark standartlariga muvofiq belgilandi.&lt;/p&gt;\n&lt;h4 id=\"42-natijalar\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#42-natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Natijalar&lt;/span&gt;&lt;/a&gt;4.2. Natijalar&lt;/h4&gt;\n&lt;p&gt;4.2.1. Inyeksiyalardan himoya (IPI)&lt;/p&gt;\n&lt;p&gt;AgentDojo tajribalarida xavf aniqlanganda generatsiyani majburiy to‘xtatish o‘rniga, SSH qayta tanlash (resampling) strategiyasidan foydalanadi. Agar harakat shoxobchasining xavf darajasi belgilangan chegaradan oshsa, xavfsiz harakat topilmaguncha jarayon besh martagacha takrorlanadi. Qidiruv kengligi (beam search) 8 qilib belgilandi, har bir qadamda 4 ta tugun kengaytirildi.&lt;/p&gt;\n&lt;p&gt;SSH’ning PromptGuard va Judger bilan integratsiyasi hujum muvaffaqiyati darajasini (ASR) 0% gacha tushirishga imkon berdi. SSH’dan foydalanish hatto yengil modellar (masalan, PromptGuard 86M) uchun ham 0% ASR ko‘rsatkichiga erishishni ta’minlaydi, bu esa resurs talab qiladigan katta modellarni joylashtirish zaruratini yo‘q qiladi. Bundan tashqari, SSH agentlarning foydaliligini (utility) oshiradi: hujum paytidagi foydalilik (UA) ko‘rsatkichi faqat detektorlardan foydalanishga nisbatan o‘rtacha 8,12% ga yaxshilandi.&lt;/p&gt;\n&lt;p&gt;4.2.2. Ko‘p bosqichli hujumlardan (Jailbreak) himoya&lt;/p&gt;\n&lt;p&gt;Murakkab hujumlarga chidamlilikni tekshirish uchun Dolphin-X1-8B modeli ishlatildi. SSH yuqori sezgirlikni ko‘rsatdi: tanlov kengligi M=1 bo‘lganda xavfni aniqlash darajasi 84,5% ni tashkil etdi, M=5 bo‘lganda esa hujumlar to‘liq bloklandi (ASR 0%). 2-jadval shuni ko‘rsatadiki, M ni 1 dan 3 gacha oshirish sezgirlikni sezilarli darajada oshiradi, ammo M ni yanada oshirishda samara pasayish tendensiyasi kuzatiladi.&lt;/p&gt;\n&lt;h4 id=\"model-bfcl-v3-xstest\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#model-bfcl-v3-xstest\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Model BFCL-v3 XSTest&lt;/span&gt;&lt;/a&gt;Model BFCL-v3 XSTest&lt;/h4&gt;\n&lt;p&gt;3-jadvalda Qwen3-235B modelining SSH joriy etilgunga qadar va undan keyingi samaradorligi solishtirilgan. BFCL-v3 uchun aniqlik (↑), XSTest uchun esa rad etish darajasi (↓) keltirilgan. M parametrini 4 dan 5 gacha oshirishda diapazon sezilarli darajada 1% gacha torayadi.&lt;/p&gt;\n&lt;h4 id=\"423-ssh-ning-maqsadli-agent-foydaliligiga-tasiri\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#423-ssh-ning-maqsadli-agent-foydaliligiga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.3. SSH ning maqsadli agent foydaliligiga taʼsiri&lt;/span&gt;&lt;/a&gt;4.2.3. SSH ning maqsadli agent foydaliligiga taʼsiri&lt;/h4&gt;\n&lt;p&gt;SSH ning funksionallikka taʼsirini baholash uchun BFCL-v3 (instrumentlarni chaqirish) va XSTest (sezgir kalit soʻzlar) testlari oʻtkazildi. M=8 va D=4 parametrlari hamda Judger detektori ishlatildi. Natijalar shuni koʻrsatadiki, SSH Qwen3-235B foydaliligiga salbiy taʼsir koʻrsatmaydi. Metrikalardagi kichik oʻzgarishlar tizimli xatolik emas, balki tanlanmaning stoxastik tabiati bilan bogʻliq. 3-rasmdagi statistik maʼlumotlar xavf ballari nolga yaqin ekanligini va hech qanday yoʻl ogohlantirish chegarasidan oshmaganini tasdiqlaydi. XSTest natijalari ham xuddi shunday tendensiyani koʻrsatadi: rad etish darajasi 0% ni tashkil etadi, bu notoʻgʻri blokirovkalar yoʻqligini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/stohastichnost-vyborki.html\"&gt;Stoxastik tabiat&lt;/a&gt; — bu modelning matn generatsiya qilishdagi ehtimollik xususiyatidan kelib chiqadigan tasodifiy oʻzgarishlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"424-xavf-ballari-taqsimotini-tahlil-qilish\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#424-xavf-ballari-taqsimotini-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.4. Xavf ballari taqsimotini tahlil qilish&lt;/span&gt;&lt;/a&gt;4.2.4. Xavf ballari taqsimotini tahlil qilish&lt;/h4&gt;\n&lt;p&gt;3-rasmda AgentDojo va ActorAttack uchun oʻrtacha xavf ballari va ogohlantirish darajalari keltirilgan (M=8, D=4). Adversarial (dushmanona) maʼlumotlar toʻplami foydali benchmarklarga qaraganda yuqoriroq xavf ballarini koʻrsatadi, bu SSH ning aniqligini tasdiqlaydi. AgentDojo da xavf ballari hujum nuqtalariga yetguncha pastligicha qoladi, ActorAttack da esa zararli niyatlar tezroq namoyon boʻladi.&lt;/p&gt;\n&lt;h4 id=\"425-ablatsion-tadqiqot-beam-search-va-top-p-sampling\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#425-ablatsion-tadqiqot-beam-search-va-top-p-sampling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.5. Ablatsion tadqiqot: Beam Search va Top-P sampling&lt;/span&gt;&lt;/a&gt;4.2.5. Ablatsion tadqiqot: Beam Search va Top-P sampling&lt;/h4&gt;\n&lt;p&gt;Biz Beam Search va Top-P sampling strategiyalarini solishtirdik. Beam Search tahdidlarni aniqlashda samaraliroq boʻlib chiqdi (4-rasm). Strukturaviy deterministik izlash adversarial niyatlarni aniqlash uchun Top-P ga qaraganda yaxshiroq mos keladi. AgentDojo da M=4 boʻlganda muvaffaqiyat darajasi (Hit Rate) 47,2% ga yetdi, ActorAttack da esa bu koʻrsatkich 8% ni tashkil etdi. Bu farq shuni anglatadiki, matnli jeylbreyklarda ichki verifikatsiya aylanib oʻtiladi va himoya Beam Search tomonidan yaratilgan xilma-xillikka tayanadi.&lt;/p&gt;\n&lt;h4 id=\"426-kop-bosqichli-trayektoriyalarda-hit-rate-masshtablanish-qonuni\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#426-kop-bosqichli-trayektoriyalarda-hit-rate-masshtablanish-qonuni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.6. Koʻp bosqichli trayektoriyalarda Hit Rate masshtablanish qonuni&lt;/span&gt;&lt;/a&gt;4.2.6. Koʻp bosqichli trayektoriyalarda Hit Rate masshtablanish qonuni&lt;/h4&gt;\n&lt;p&gt;SSH ning uzoq ketma-ketliklardagi aniqligini tekshirish uchun BFCL-v3 dan foydalandik. Agentlarning toʻliq bajarilish trayektoriyalari SSH ning D=2, 3, 4 va 5 chuqurlikdagi qidiruv daraxti bilan solishtirildi. 4-rasmga koʻra, SSH hatto uzun zanjirlarda ham yuqori muvaffaqiyat darajasini saqlab qoladi: 5-chuqurlikda va M=16 da u 70% ga yaqin. Tanlanma byudjeti oshishi bilan samara kamaysa-da, 70% qidiruv daraxtini samarali qirqish va xavflarni baholash uchun yetarli asos boʻlib xizmat qiladi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-tT2.jpg\" alt=\"Jadval 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-f3.jpg\" alt=\"3-rasm. Toʻrtta maʼlumotlar toʻplami boʻyicha barcha SSH spekulyativ natijalarining oʻrtacha xavf koʻrsatkichlari (ustun\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Toʻrtta maʼlumotlar toʻplami boʻyicha barcha SSH spekulyativ natijalarining oʻrtacha xavf koʻrsatkichlari (ustunli diagramma, chap Y oʻqi) va chegaraviy qiymatdan oshib ketish natijasida yuzaga kelgan ogohlantirishlar ulushi (gorizontal uzuq chiziq, oʻng Y oʻqi).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-f4.jpg\" alt=\"4-rasm. AgentDojo va ActorAttack maʼlumotlar toʻplamlarida tanlov byudjeti M ga nisbatan xavf taʼsiri va muvaffaqiyat da\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. AgentDojo va ActorAttack maʼlumotlar toʻplamlarida tanlov byudjeti M ga nisbatan xavf taʼsiri va muvaffaqiyat darajasining masshtablanish qonunlari, Beam Search va Top-P sampling strategiyalarini taqqoslash. Oʻng qism BFCL-v3 benchmarkida turli chuqurlik D va kenglik M boʻyicha Beam Search masshtablanish tendensiyalarini koʻrsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AIga qarshi&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yashirin ko‘p&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;bosqichli&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;hujumlar&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\
