        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;AAAI: веб и социальные медиа — сети и дезинформация&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-icwsm.jpg\" alt=\"ICWSM\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;AAAI: веб и социальные медиа — сети и дезинформация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;статьи в открытом доступе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;AAAI (Association for the Advancement of Artificial Intelligence)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Научная конференция с рецензируемыми публикациями&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;Официальный сайт AAAI&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-nets.html\"&gt;Axborot kampaniyalari va tarmoqlar&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Usullar va etika&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-haqida\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#konferensiya-haqida\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya haqida&lt;/span&gt;&lt;/a&gt;Konferensiya haqida&lt;/h2&gt;\n&lt;p&gt;ICWSM (International Conference on Web and Social Media) — bu ijtimoiy media va veb-texnologiyalarni ma'lumotlar tahlili, tarmoq fanlari va kompyuter fanlari orqali o'rganishga bag'ishlangan yillik ilmiy konferensiya. Konferensiya ijtimoiy jarayonlarni miqdoriy baholash, axborot tarqalishidagi qonuniyatlarni aniqlash va raqamli muhitdagi ma'lumotlarning ishonchliligini tekshirish usullarini almashish maydonidir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Konferensiya AAAI (Association for the Advancement of Artificial Intelligence) homiyligida o'tkaziladi. Bu sun'iy intellekt sohasidagi tadqiqot standartlarini belgilovchi xalqaro ilmiy jamiyatdir. ICWSM onlayn hamjamiyatlarni o'rganish uchun uslubiy bazani shakllantirish maqsadida sotsiologlar, kompyuter lingvistlari va ma'lumotlar tahlilchilarini birlashtirish uchun yaratilgan.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiya dasturi quyidagi yo'nalishlarni qamrab oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ijtimoiy tarmoqlar tahlili: aloqalar tuzilmasi va ko'p qatlamli tarmoqlar dinamikasini o'rganish.&lt;/li&gt;\n&lt;li&gt;Dezinformatsiya va faktcheking: ma'lumotlardagi buzilishlarni aniqlash va ijtimoiy platformalarning voqelikni idrok etishga ta'sirini tahlil qilish algoritmlarini ishlab chiqish.&lt;/li&gt;\n&lt;li&gt;Ma'lumot yig'ish metodologiyasi: tartibsiz postlardan tuzilgan ma'lumotlarni ajratib olish vositalarini yaratish.&lt;/li&gt;\n&lt;li&gt;Etika va tarafkashlik: foydalanuvchi ma'lumotlari bilan ishlashda axloqiy chegaralar va uslubiy xatolarni minimallashtirish.&lt;/li&gt;\n&lt;li&gt;Mediadagi sun'iy intellekt: neyron tarmoqlar ishini, jumladan ularning «rol o'ynashi» va javoblardagi yashirin dezinformatsiya masalalarini baholash.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;Nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;ICWSM konferensiyasida ma'lumotlar tahliliga yondashuvni o'zgartiruvchi tadqiqot natijalari birinchi marta namoyish etiladi. So'nggi yillarda e'tibor quyidagilarga qaratilgan:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Neyron tarmoq arxitekturalari samaradorligi: xotirani optimallashtirish usullari va ixcham modellar uchun ixtisoslashtirilgan agentlik karkaslari.&lt;/li&gt;\n&lt;li&gt;OSINT avtomatizatsiyasi: inson darajasidagi aniqlik bilan tarmoq manbalaridan ma'lumotlar bazasini qurish algoritmlari.&lt;/li&gt;\n&lt;li&gt;Kiberxavfsizlik: trafik va xavfsizlik siyosatini tahlil qilish uchun SecJev kabi yangi model oilalari.&lt;/li&gt;\n&lt;li&gt;Ijtimoiy tarmoqlar ta'sirini tanqidiy baholash: platformalar orqali voqelikni butunlay buzib ko'rsatish haqidagi afsonalarni rad etuvchi ilmiy ma'lumotlar.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiya materiallari ochiq kirish huquqi bilan nashr etiladi. Tadqiqotchilar va amaliyotchilar uchun quyidagilar mavjud:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Tezislar va maqolalar matnlari: barcha qabul qilingan ishlar qat'iy taqrizdan o'tadi va AAAI arxivlarida e'lon qilinadi.&lt;/li&gt;\n&lt;li&gt;Ma'ruzalar yozuvlari: mualliflarning metodologiyasi bilan tanishish imkonini beradi.&lt;/li&gt;\n&lt;li&gt;Ishtirok etish: konferensiya ilmiy qat'iylik va ma'lumotlar etikasi standartlariga javob beradigan original tadqiqotlarni nashr etish uchun arizalar qabul qilishga ochiq.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A0%D0%98%D0%90_%D0%9D%D0%BE%D0%B2%D0%BE%D1%81%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;РИА Новости — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Archive.today_Screenshot_-_12.19.2024.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Archive.today developers, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.physrep.2014.07.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The structure and dynamics of multilayer networks&lt;/a&gt; — sharh, Phys Rep 2014&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fdata.2019.00013\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Social Data: Biases, Methodological Pitfalls, and Ethical Boundaries&lt;/a&gt; — sharh, Front Big Data 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/s22124531\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Review on the Trends in Event Detection by Analyzing Social Media Platforms' Data&lt;/a&gt; — sharh, Sensors (Basel) 2022&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"AAAI: веб и социальные медиа — сети и дезинформация"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ICWSM","description":"AAAI: веб и социальные медиа — сети и дезинформация","vcsPath":"reference/conferences/conf-icwsm.md"},"headings":[{"title":"Konferensiya haqida","href":"reference/conferences/c
