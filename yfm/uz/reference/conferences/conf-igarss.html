        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;дистанционное зондирование Земли&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;дистанционное зондирование Земли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;IEEE Geoscience and Remote Sensing Society (GRSS)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Международная научная конференция с рецензируемыми тезисами&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;Официальный портал IEEE GRSS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-geo.html\"&gt;Sun'iy yo'ldoshlar va geoma'lumotlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;IEEE IGARSS (International Geoscience and Remote Sensing Symposium) — Yerni masofadan zondlash usullari va geosfera fanlariga bag'ishlangan yillik xalqaro ilmiy konferensiya. Konferensiya tadqiqotchilar, muhandislar va ma'lumotlar tahlilchilari o'rtasida bilim almashish jarayonidir. U elektromagnit nurlanishning sayyora yuzasidagi obyektlar bilan o'zaro ta'sirining fizik asoslarini va olingan signallarni qayta ishlash usullarini muhokama qilish uchun maydon hisoblanadi.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;IEEE Geoscience and Remote Sensing Society (GRSS) konferensiyaning tashkilotchisi hisoblanadi. Konferensiya 1981-yildan buyon har yili o'tkazilib, butun dunyodan minglab ishtirokchilarni birlashtiradi. Tadbir atmosfera fizikasi va radiofizika tamoyillariga asoslanadi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Konferensiya dasturi sun'iy yo'ldosh uskunalari ishlab chiqishdan tortib, mashinali o'qitish algoritmlarigacha bo'lgan keng qamrovli yo'nalishlarni o'z ichiga oladi. Asosiy seksiyalar: tasvirlarni qayta ishlash usullari, geoma'lumotlarda sun'iy intellekt, masofadan zondlash fizikasi va atrof-muhit monitoringi.&lt;/p&gt;\n&lt;h2 id=\"u-yerda-nimalar-namoyish-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#u-yerda-nimalar-namoyish-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar namoyish etiladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar namoyish etiladi&lt;/h2&gt;\n&lt;p&gt;IEEE IGARSS'da ma'lumotlar bilan ishlash yondashuvini o'zgartiruvchi tadqiqot natijalari birinchi marta taqdim etiladi. Masalan, neyron tarmoqlarni har bir yangi hudud uchun qayta o'qitmasdan turib, kemalar yoki binolarni aniqlash usullari muhokama qilinadi.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiyada ishtirok etish tezislarni nashr etishni nazarda tutadi. Konferensiyadan so'ng ma'ruzalar materiallari IEEE raqamli kutubxonalarida e'lon qilinadi. Tadqiqotlarni IEEE GRSS rasmiy portali orqali kuzatish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A2%D0%B0%D1%82%D0%B0%D1%80%D1%81%D0%BA%D0%B8%D0%B9%2C_%D0%92%D0%B0%D0%BB%D0%B5%D1%80%D1%8C%D1%8F%D0%BD_%D0%98%D0%BB%D1%8C%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Татарский, Валерьян Ильич — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"дистанционное зондирование Земли"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IEEE IGARSS","description":"дистанционное зондирование Земли","vcsPath":"reference/conferences/conf-igarss.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/conf-igarss.html#konferensiya-nima","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-igarss.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-igarss.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar namoyish etiladi","href":"reference/conferences/conf-igarss.html#u-yerda-nimalar-namoyish-etiladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-igarss.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Manbalar"
