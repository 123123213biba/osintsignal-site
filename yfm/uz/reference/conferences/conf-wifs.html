        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;информационная криминалистика: проверка изображений и медиа&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;информационная криминалистика: проверка изображений и медиа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-verify.html\"&gt;Faktlar va mediani tekshirish&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bu-qanday-konferensiya\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#bu-qanday-konferensiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bu qanday konferensiya&lt;/span&gt;&lt;/a&gt;Bu qanday konferensiya&lt;/h2&gt;\n&lt;p&gt;IEEE WIFS (Axborot kriminalistikasi va xavfsizligi bo'yicha seminar) — axborot xavfsizligi va raqamli kriminalistikaga bag'ishlangan yillik xalqaro ilmiy konferensiya. Tadbirning asosiy maqsadi — signalni qayta ishlash, mashinali o'qitish va ma'lumotlarni himoya qilish sohasidagi tadqiqotchilarni birlashtirishdir. OSINT-Signal kontekstida WIFS media kontentni tekshirish usullari uchun asosiy manba hisoblanadi: tasvirlardagi manipulyatsiyalarni aniqlashdan tortib, video yozuvlarning haqiqiyligini tahlil qilishgacha.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Konferensiya dunyodagi eng yirik texnik mutaxassislar assotsiatsiyasi bo'lgan IEEE (Institute of Electrical and Electronics Engineers) homiyligida o'tkaziladi. WIFS IEEE Information Forensics and Security (IFS-TC) texnik qo'mitasi tomonidan nazorat qilinadi. Konferensiya tarixi o'n yildan ortiq bo'lib, u real ma'lumotlarni generatsiya qilingan yoki buzilgan ma'lumotlardan qanday ajratishni muhokama qilish uchun asosiy maydonga aylandi.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;WIFS ishining asosiy yo'nalishlari:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Raqamli kriminalistika: tahrirlash izlarini aniqlash, metama'lumotlarni tahlil qilish va media fayl manbasini aniqlash.&lt;/li&gt;\n&lt;li&gt;Mashinali o'qitish xavfsizligi: modellarni raqobatbardosh hujumlardan himoya qilish va sintetik ma'lumotlarda o'qitishda neyron tarmoqlarning degradatsiyasini oldini olish.&lt;/li&gt;\n&lt;li&gt;Steganografiya va ma'lumotlarni yashirin uzatish: media kontentdagi yashirin xabarlarni aniqlash usullari.&lt;/li&gt;\n&lt;li&gt;Biometriya va maxfiylikni himoya qilish: xavfsizlik talablarini hisobga olgan holda shaxsni identifikatsiya qilish usullari.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u-yerda-nimalar-paydo-boladi\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#u-yerda-nimalar-paydo-boladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U yerda nimalar paydo bo'ladi&lt;/span&gt;&lt;/a&gt;U yerda nimalar paydo bo'ladi&lt;/h2&gt;\n&lt;p&gt;WIFS'da faktlarni tekshirish vositalari uchun asos bo'ladigan tadqiqotlar taqdim etiladi. Masalan, infografikaning har bir elementi real ma'lumotlar orqali tekshirilishi kerak bo'lgan holatlarda sun'iy intellektning «gallyutsinatsiyalari»ga qarshi kurashish usullari muhokama qilinadi. Shuningdek, 3D-modellar va xonalarning skanlari bilan ishlash algoritmlari ko'rib chiqiladi, bu yerda real jismoniy ob'ektlarni sun'iy intellekt agentlari tomonidan generatsiya qilinganlaridan farqlash muhimdir.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar va tahlilchilar uchun WIFS'da ishtirok etish — bu ilg'or algoritmlardan ular ommaviy vositalarga aylanishidan oldin foydalanish imkoniyatidir. Natijalarni IEEE Xplore kutubxonasidagi materiallar orqali kuzatish mumkin. Ishtirokchilar ko'pincha nafaqat nazariy ishlanmalarni, balki avtomatlashtirilgan media tekshirish tizimlarini ishlab chiqish uchun ishlatilishi mumkin bo'lgan dasturiy yechimlarni ham taqdim etadilar.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;WIFS asosida «axborot kriminalistikasi» tamoyili yotadi. Bu anomaliyalarni qidirish uchun signallarni qayta ishlashning matematik usullari qo'llaniladigan sohadir. Asosiy tushuncha — ma'lumotlarni taqdim etish aniqligidir. Masalan, neyron tarmoqlarda past aniqlikdagi formatlardan (half-precision, 16 bit) foydalanish tasvirlarni qayta ishlashni tezlashtiradi, ammo kriminalistik tahlil uchun muhim bo'lgan detallarning yo'qolishiga yo'l qo'ymaslik uchun qat'iy nazorat usullarini talab qiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Half-precision_floating-point_format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Half-precision floating-point format — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"информационная криминалистика: проверка изображений и медиа"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IEEE WIFS","description":"информационная криминалистика: проверка изображений и медиа","vcsPath":"reference/conferences/conf-wifs.md"},"headings":[{"title":"Bu qanday konferensiya","href":"reference/conferences/conf-wifs.html#bu-qanday-konferensiya","level":2},{"title":"Tashkilotchilar va tarix","href":"reference/conferences/conf-wifs.html#tashkilotchilar-va-tarix","level":2},{"title":"Mavzular va seksiyalar","href":"reference/conferences/conf-wifs.html#mavzular-va-seksiyalar","level":2},{"title":"U yerda nimalar paydo bo'ladi","href":"reference/conferences/conf-wifs.html#u-yerda-nimalar-paydo-boladi","level":2},{"title":"Qanday kuzatish va ishtirok etish","href":"reference/conferences/conf-wifs.html#qanday-kuzatish-va-ishtirok-etish","level":2},{"title":"Nazariya","href":"reference/conferences/conf-wifs.html#nazariya","level":2},{"title":"Manbalar","href":"reference/conferences/conf-wifs.html#manbalar","level":2}],"title":"IEEE WIFS"},"router":{"pathname":"reference/conferences/conf-wifs","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
