        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Konferensiyalar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;вычислительные методы в журналистике&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;вычислительные методы в журналистике&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima olamiz&lt;/td&gt;\n&lt;td&gt;статьи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tashkilotchi&lt;/td&gt;\n&lt;td&gt;Междисциплинарное сообщество специалистов в области компьютерных наук и журналистики.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Davriylik&lt;/td&gt;\n&lt;td&gt;Ежегодное мероприятие (на основе академической практики).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Format&lt;/td&gt;\n&lt;td&gt;Научный симпозиум с докладами, публикацией тезисов и записей выступлений.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sayt&lt;/td&gt;\n&lt;td&gt;Официальные ресурсы организаторов (уточняются в зависимости от года проведения).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-data.html\"&gt;Ochiq ma'lumotlar&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Usullar va etika&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferensiya-nima\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#konferensiya-nima\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konferensiya nima&lt;/span&gt;&lt;/a&gt;Konferensiya nima&lt;/h2&gt;\n&lt;p&gt;Computation + Journalism Symposium — bu jurnalistika faoliyatida hisoblash usullarini qo'llashga bag'ishlangan ilmiy konferensiya. Hisoblash usullari deganda ma'lumotlarni yig'ish, tashkil etish va tahlil qilish uchun algoritmlar va sun'iy intellektdan foydalanish tushuniladi. Tadbirning asosiy maqsadi — kompyuter fanlari mutaxassislari va jurnalistlarni faktlarni tekshirish hamda ma'lumotlar aniqligini ta'minlash uchun birlashtirishdir.&lt;/p&gt;\n&lt;h2 id=\"tashkilotchilar-va-tarix\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#tashkilotchilar-va-tarix\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashkilotchilar va tarix&lt;/span&gt;&lt;/a&gt;Tashkilotchilar va tarix&lt;/h2&gt;\n&lt;p&gt;Konferensiya informatika, ijtimoiy fanlar va jurnalistika kesishadigan fanlararo maydon hisoblanadi. Tashkilotchilar jurnalistikaning aniqlik va tekshiriluvchanlik qadriyatlarini zamonaviy tahlil vositalari yordamida mustahkamlashni maqsad qilgan.&lt;/p&gt;\n&lt;h2 id=\"mavzular-va-seksiyalar\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#mavzular-va-seksiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzular va seksiyalar&lt;/span&gt;&lt;/a&gt;Mavzular va seksiyalar&lt;/h2&gt;\n&lt;p&gt;Simpozium dasturi jurnalistik mehnatni avtomatlashtirish bilan bog'liq keng ko'lamli mavzularni qamrab oladi:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Ma'lumotlar tahlili: matnlardan yashirin parametrlarni ajratib olish va ma'lumotlar bazasini yaratish.&lt;/li&gt;\n&lt;li&gt;Faktlarni tekshirish: neyron tarmoqlar javoblaridagi yolg'onni aniqlash va sun'iy intellektning «rol o'ynashi» muammolarini tahlil qilish.&lt;/li&gt;\n&lt;li&gt;Sun'iy intellekt xavfsizligi: modellarga hujumlardan himoya qilish usullari va standart testlardan tashqari tizimlarning real qobiliyatlarini baholash.&lt;/li&gt;\n&lt;li&gt;Etika va shaffoflik: hisobotlardagi o'zgarishlarning ilmiy tadqiqotlar ko'rinishiga ta'sirini o'rganish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"nimalar-taqdim-etiladi\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#nimalar-taqdim-etiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalar taqdim etiladi&lt;/span&gt;&lt;/a&gt;Nimalar taqdim etiladi&lt;/h2&gt;\n&lt;p&gt;Simpoziumda ixcham til modellarining (2-9B) samaradorligi va ularning mantiqiy xulosalar chiqarish qobiliyati bo'yicha tadqiqot natijalari taqdim etiladi. Ishtirokchilar standart testlar nima uchun sun'iy intellekt imkoniyatlarini noto'g'ri baholashi va agent tizimlarining ishlashiga ta'sirini muhokama qiladilar.&lt;/p&gt;\n&lt;h2 id=\"qanday-kuzatish-va-ishtirok-etish\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#qanday-kuzatish-va-ishtirok-etish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday kuzatish va ishtirok etish&lt;/span&gt;&lt;/a&gt;Qanday kuzatish va ishtirok etish&lt;/h2&gt;\n&lt;p&gt;Konferensiya natijalarini tezislar va chiqishlar yozuvlari orqali kuzatish mumkin. Ishtirok etish qat'iy metodologiyaga asoslangan ma'ruzalarni taqdim etishni nazarda tutadi. Bu hamjamiyatga mualliflarning xulosalarini mustaqil tekshirish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/conferences/conf-cj_symposium.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Computational_journalism\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Computational journalism — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Konferensiyalar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"вычислительные методы в журналистике"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Computation + Journalism Symposium","description":"вычислительные методы в журналистике","vcsPath":"reference/conferences/conf-cj_symposium.md"},"headings":[{"title":"Konferensiya nima","href":"reference/conferences/con
