        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Геоинформатика и дистанционное зондирование Земли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;XX век (развитие спутниковых технологий)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Спектральный анализ, компьютерное зрение, ГИС-моделирование&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Remote Sensing, ISPRS Journal of Photogrammetry and Remote Sensing&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-geo.html\"&gt;Sun'iy yo'ldoshlar va geoma'lumotlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalarni-organadi\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#nimalarni-organadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalarni o'rganadi&lt;/span&gt;&lt;/a&gt;Nimalarni o'rganadi&lt;/h2&gt;\n&lt;p&gt;Sun'iy yo'ldoshlar va geoma'lumotlar — bu orbital apparatlar va yer usti sensorlaridan olingan fazoviy ma'lumotlarni yig'ish, qayta ishlash va tahlil qilish usullarini o'rganadigan ilmiy yo'nalish. O'rganish obyekti — yer yuzasi va unda sodir bo'layotgan jarayonlar bo'lib, ular rastrli tasvirlar, vektorli xaritalar va metama'lumotlar ko'rinishida taqdim etiladi.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Yo'nalish rivoji analog aerofotosuratga olishdan raqamli masofaviy zondlashga o'tish bilan bog'liq. Asosiy bosqich — yuqori aniqlikdagi sun'iy yo'ldosh tasvirlarining ommalashuvi va geoinformatsion tizimlarning (GIS) rivojlanishi. So'nggi yillardagi muhim yutuq — neyron tarmoqlarni har bir hudud uchun qayta o'qitmasdan turib, kemalar yoki binolar kabi obyektlarni avtomatik sanash imkonini beruvchi mashinali o'qitish usullarining joriy etilishi.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Sohada ikki yondashuv ajratiladi: tasvirlarni vizual talqin qilishga asoslangan ekspert tahlili va kompyuter ko'rish algoritmlaridan foydalanuvchi avtomatlashtirilgan yondashuv. Zamonaviy tadqiqotlar «raqamli egizaklar» yaratishga qaratilgan bo'lib, unda sun'iy intellekt agentlari shahar muhitidagi o'zgarishlarni loyihalashtiradi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Usullar spektral tahlil, o'zgarishlarni aniqlash (change detection) va tasvirlarni segmentatsiyalashni o'z ichiga oladi. Vositalar rastrli ma'lumotlarni qayta ishlash kutubxonalari, obyektlarni klassifikatsiya qilish uchun neyron tarmoq arxitekturalari va ochiq xaritalash platformalaridan iborat.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/h2&gt;\n&lt;p&gt;Yo'nalish tasvirlar bo'yicha geolokatsiya bilan chambarchas bog'liq. U OpenStreetMap bilan hamkorlik qilib, sun'iy yo'ldosh tasvirlarini tekshirish uchun kraudsorsing ma'lumotlaridan foydalanadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Yo'nalishni o'rganish uchun «Geoinformatika», «Yerni masofaviy zondlash» va «Ma'lumotlar tahlili» mutaxassisliklari bo'yicha akademik dasturlar mos keladi. GIS paketlari va mashinali o'qitish kutubxonalari bo'yicha kurslar orqali bazaviy bilimlarni olish mumkin.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D1%83%D1%82%D0%BD%D0%B8%D0%BA_(%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Спутник (поисковая система) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-14-7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GSVA: gene set variation analysis for microarray and RNA-seq data&lt;/a&gt; — sharh, BMC Bioinformatics 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-14-128\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Enrichr: interactive and collaborative HTML5 gene list enrichment analysis tool&lt;/a&gt; — sharh, BMC Bioinformatics 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/jcc.21287\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CHARMM: the biomolecular simulation program&lt;/a&gt; — sharh, J Comput Chem 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что можно узнать из открытых снимков и карт — и как это делают исследователи."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Sun'iy yo'ldoshlar va geoma'lumotlar","description":"Что можно узнать из открытых снимков и карт — и как это делают исследователи.","vcsPath":"reference/disciplines/dir-geo.md"},"headings":[{"title":"Nimalarni o'rganadi","href":"reference/disciplines/dir-geo.html#nimalarni-organadi","level":2},{"title":"Tarix va asosiy kashfiyotlar","href":"reference/disciplines/dir-geo.html#tarix-va-asosiy-kashfiyotlar","level":2},{"title":"Asosiy maktablar va yondashuvlar","href":"reference/disciplines/dir-geo.html#asosiy-maktablar-va-yondashuvlar","level":2},{"title":"Usullar va vositalar","href":"reference/disciplines/dir-geo.html#usullar-va-vositalar","level":2},{"title":"Boshqa yo'nalishlar bilan bog'liqlik","href":"reference/disciplines/dir-geo.html#boshqa-yonalishlar-bilan-bogliqlik","level":2},{"title":"Qayerda o'qish va nimalarni o'qish kerak","href":"reference/disciplines/dir-geo.html#qayerda-oqish-va-nimalarni-oqish-kerak","level":2},{"title":"Manbalar","href":"reference/disciplines/dir-geo.html#manbalar","level":2}],"title":"Sun'iy yo'ldoshlar va geoma'lumotlar"},"router":{"pathname":"reference/disciplines/dir-geo","depth":3,"base":"../../"},"lang":"r
