        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-nets.jpg\" alt=\"Axborot kampaniyalari va tarmoqlar\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Анализ информационных кампаний и сетевых структур&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;Междисциплинарное направление (социология, Data Science)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Сетевой анализ, OSINT, контент-анализ, аудит алгоритмов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Computer Science, Sociology, Media Studies&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-nets.html\"&gt;Axborot kampaniyalari va tarmoqlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-organiladi\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#nima-organiladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima o‘rganiladi&lt;/span&gt;&lt;/a&gt;Nima o‘rganiladi&lt;/h2&gt;\n&lt;p&gt;Axborot kampaniyalari va tarmoqlari — bu raqamli muhitda narrativlarni yaratish, tarqatish va ularning ta’sirini o‘rganuvchi ilmiy yo‘nalishdir. Tadqiqot obyekti — bu aktyorlar guruhlarining jamoatchilik fikrini shakllantirish yoki voqelikni idrok etishni o‘zgartirish uchun harakatlarini muvofiqlashtirish mexanizmlaridir.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Axborot kampaniyalari tarixan davlat choralari va bosma targ‘ibotga tayangan. Masalan, SSSRda 1929-yilda chiqarilgan «Kitob aroq o‘rniga» plakatlari (40 000 nusxa) shular jumlasidandir. Raqamli davrda e’tibor ijtimoiy tarmoqlarga qaratildi. Tadqiqotlar shuni ko‘rsatadiki, ijtimoiy tarmoqlarning voqelikni buzishga ta’siri ko‘pincha bo‘rttiriladi. Bluesky ma’lumotlariga ko‘ra, foydalanuvchilar diqqatining 80% qismi obunalaridan «ikki qadam» masofada cheklangan, bu esa muqobil qarashlarga kirishni cheklaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Zamonaviy yondashuvlar kontent tahlili va tarmoq tuzilmalarini tahlil qilishga bo‘linadi. Tadqiqotchilar neyron tarmoq algoritmlari qanday qilib beixtiyor dezinformatsiyaga hissa qo‘shishi mumkinligini o‘rganadilar. Masalan, neyron tarmoqlar yashirin noto‘g‘ri ma’lumotlarga asoslanib, to‘g‘ri javob berishi yoki foydalanuvchiga xushomad qilish tuzog‘iga tushishi mumkinligi aniqlangan.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Metodlar tarmoq tahlili (o‘zaro ta’sir graflari), katta ma’lumotlar kontent tahlili va algoritmlar auditini o‘z ichiga oladi. Tadqiqotchilar axborot tarqalish zanjirlarini kuzatish uchun faktlarni tekshirish (OSINT) usullaridan foydalanadilar. Raqamli obyektlarni metadata orqali tekshirish tizimda «bosh arxitektor» ishtirokisiz muvofiqlashtirilgan xatti-harakatlarni aniqlashga yordam beradi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo‘nalishlar bilan bog‘liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo‘nalishlar bilan bog‘liqlik&lt;/h2&gt;\n&lt;p&gt;Yo‘nalish graf nazariyasi, idrok psixologiyasi, kompyuter fanlari (mashinali o‘qitish) va sotsiologiya bilan chambarchas bog‘liq. U kontentning viralligi va foydalanuvchilar o‘zaro ta’sir qoidalarini belgilovchi platformalar arxitekturasi bilan kesishadi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o‘qish va nimalarni o‘qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o‘qish va nimalarni o‘qish kerak&lt;/h2&gt;\n&lt;p&gt;Ma’lumotlar tahlili (Data Science), amaliy sotsiologiya va media tadqiqotlari dasturlari mos keladi. Kompyuter fanlari va sotsiologiya bo‘yicha ilmiy jurnallardagi maqolalarni hamda ijtimoiy tarmoqlarni tahlil qiluvchi laboratoriyalar hisobotlarini o‘rganish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%BD%D1%82%D0%B8%D0%B0%D0%BB%D0%BA%D0%BE%D0%B3%D0%BE%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5_%D0%BA%D0%B0%D0%BC%D0%BF%D0%B0%D0%BD%D0%B8%D0%B8_%D0%B2_%D0%A1%D0%A1%D0%A1%D0%A0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Антиалкогольные кампании в СССР — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:1-%D0%B9_%D0%92%D1%81%D0%B5%D1%80%D0%BE%D1%81%D1%81%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9_%D0%BA%D0%BD%D0%B8%D0%B3%D0%BE%D1%80%D0%BE%D0%B7%D1%8B%D0%B3%D1%80%D1%8B%D1%88_%C2%AB%D0%9A%D0%BD%D0%B8%D0%B3%D0%B0_%D0%B2%D0%BC%D0%B5%D1%81%D1%82%D0%BE_%D0%B2%D0%BE%D0%B4%D0%BA%D0%B8%C2%BB.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Неизвестный художник (не указан в выходных данных плаката; отсутствует авторская монограмма или подпись), Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — sharh, Nature 2015&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41418-017-0012-4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Molecular mechanisms of cell death: recommendations of the Nomenclature Committee on Cell Death 2018&lt;/a&gt; — sharh, Cell Death Differ 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3402/jev.v4.27066\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Biological properties of extracellular vesicles and their physiological functions&lt;/a&gt; — sharh, J Extracell Vesicles 2015&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Как распространяется информация и как исследователи находят скоординированные кампании."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Axborot kampaniyalari va tarmoqlar","description":"Как распространяется информация и как исследователи находят скоординированные кампании.","vcsPath":"reference/disciplines/dir-nets.md"},"headings":
