            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassisliklar va jarayonlar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-data.jpg\" alt=\"Ochiq ma'lumotlar\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima haqida&lt;/td&gt;\n&lt;td&gt;Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Soha&lt;/td&gt;\n&lt;td&gt;Информатика, государственное управление, OSINT&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shakllanishi&lt;/td&gt;\n&lt;td&gt;2000-е годы (развитие сетей данных)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Asosiy usullar&lt;/td&gt;\n&lt;td&gt;Машиночитаемость, хэширование, сетевой анализ (WGCNA), верификация метаданных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jurnallar&lt;/td&gt;\n&lt;td&gt;Nucleic Acids Research, BMC Bioinformatics, Cell&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-data.html\"&gt;Ochiq ma'lumotlar&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nimalarni-organadi\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#nimalarni-organadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalarni o'rganadi&lt;/span&gt;&lt;/a&gt;Nimalarni o'rganadi&lt;/h2&gt;\n&lt;p&gt;Ochiq ma'lumotlar (Open Data) — bu mualliflik huquqi yoki patent cheklovlarisiz erkin, mashina o'qiy oladigan shaklda foydalanish va tarqatish uchun mo'ljallangan axborot mohiyatidir. Bu yo'nalish davlat reestrlari, xaridlar arxivlari va ilmiy hisobotlar kabi jamoat axborotini nashr etish, standartlashtirish va tahlil qilish tamoyillarini o'rganadi.&lt;/p&gt;\n&lt;h2 id=\"tarix-va-asosiy-kashfiyotlar\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#tarix-va-asosiy-kashfiyotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tarix va asosiy kashfiyotlar&lt;/span&gt;&lt;/a&gt;Tarix va asosiy kashfiyotlar&lt;/h2&gt;\n&lt;p&gt;Konsepsiya boshqaruv va ilm-fanda shaffoflik zarurati tufayli shakllangan. 2000-yillarda ma'lumotlar tarmoqlarining rivojlanishi muhim bosqich bo'ldi. 2025-yilda NIH ilmiy arizalaridan ayrim atamalarning olib tashlanishi meta-ma'lumotlarni o'zgartirish tadqiqotlarning ko'rinishiga qanday ta'sir qilishini ko'rsatdi.&lt;/p&gt;\n&lt;h2 id=\"asosiy-maktablar-va-yondashuvlar\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#asosiy-maktablar-va-yondashuvlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy maktablar va yondashuvlar&lt;/span&gt;&lt;/a&gt;Asosiy maktablar va yondashuvlar&lt;/h2&gt;\n&lt;p&gt;Ikki asosiy yondashuv mavjud: «texnokratik» (mashina o'qiy olish va API formatlariga urg'u) va «huquqiy» (litsenziyalash va kirish cheklovlarini olib tashlashga urg'u). Ilm-fanda WGCNA (og'irlikdagi korrelyatsion tarmoq tahlili) kabi yondashuvlar ochiq ma'lumotlar to'plami yashirin qonuniyatlarni aniqlashga yordam berishini ko'rsatadi.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Metodologiya ma'lumotlarni qidirish, yig'ish, saqlash (yaxlitlikni nazorat qilish uchun xeshlash) va tekshirishni o'z ichiga oladi. Katta massivlar bilan ishlash uchun qidiruv algoritmlari (masalan, BLAST) va tarmoq tahlili paketlari qo'llaniladi.&lt;/p&gt;\n&lt;h2 id=\"boshqa-yonalishlar-bilan-bogliqlik\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#boshqa-yonalishlar-bilan-bogliqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/span&gt;&lt;/a&gt;Boshqa yo'nalishlar bilan bog'liqlik&lt;/h2&gt;\n&lt;p&gt;Ochiq ma'lumotlar «Davlat xaridlari», «Tashkilotlar reestrlari» va «Sudlar va qonunlar» yo'nalishlari uchun poydevor hisoblanadi. Ular ekologik monitoring va veb-arxivlash bilan chambarchas bog'liq.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-va-nimalarni-oqish-kerak\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#qayerda-oqish-va-nimalarni-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish va nimalarni o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Ma'lumotlar tahlili (Data Science), OSINT metodlari va ochiq davlat boshqaruvi tamoyillari bo'yicha kurslarni o'rganish tavsiya etiladi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D1%82%D0%BA%D1%80%D1%8B%D1%82%D1%8B%D0%B5_%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Открытые данные — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:LOD_Cloud_-_2007-09.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Cygri, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — sharh, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0092-8674(04)00045-5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MicroRNAs: genomics, biogenesis, mechanism, and function&lt;/a&gt; — sharh, Cell 2004&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — sharh, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Mutaxassisliklar va jarayonlar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Реестры, закупки, архивы: где лежат открытые данные и как их читать."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Ochiq ma'lumotlar","description":"Реестры, закупки, архивы: где лежат открытые данные и как их читать.","vcsPath":"reference/disciplines/dir-data.md"},"headings":[{"title":"Nimalarni o'rganadi","href":"reference/disciplines/dir-data.html#nimalarni-organadi","level":2},{"title":"Tarix va asosiy kashfiyotlar","href":"reference/disciplines/dir-data.html#tarix-va-asosiy-kashfiyotlar","level":2},{"title":"Asosiy maktablar va yondashuvlar","href":"reference/disciplines/dir-data.html#asosiy-maktablar-va-yondashuvlar","level":2},{"title":"Metodlar va vositalar","href":"reference/disciplines/dir-data.html#metodlar-va-vositalar","level":2},{"title":"Boshqa yo'nalishlar bilan bog'liqlik","href":"reference/disciplines/dir-data.html#boshqa-yonalishlar-bilan-bogliqlik","level":2},{"title":"Qayerda o'qish va nimalarni o'qish kerak","href":"reference/disciplines/dir-data.html#qayerda-oqish-va-nimalarni-oqish-kerak","level":2},{"title":"Manbalar","href":"reference/disciplines/dir-data.html#manbalar","level":2}],"title":"Ochiq ma'lumotlar"},"router":{"pathname":"reference/disciplines/dir-data","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
