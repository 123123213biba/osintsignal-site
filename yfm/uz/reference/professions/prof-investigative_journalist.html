        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Kasblar&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;ведёт расследование от наводки до проверенной публикации&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Nima bilan shug'ullanadi&lt;/td&gt;\n&lt;td&gt;ведёт расследование от наводки до проверенной публикации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Nimani bilish kerak&lt;/td&gt;\n&lt;td&gt;источники, документы, юридическая проверка, безопасность&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ta'lim&lt;/td&gt;\n&lt;td&gt;Журналистика, социология, право, политология; курсы по анализу данных и кибербезопасности.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qayerda ishlaydi&lt;/td&gt;\n&lt;td&gt;Независимые медиа, исследовательские центры (think tanks), некоммерческие организации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mutaxassisliklar: &lt;a href=\"concepts/spec-data.html\"&gt;Ochiq ma'lumotlar&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Usullar va etika&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"nima-bilan-shugullanadi\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#nima-bilan-shugullanadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima bilan shug'ullanadi&lt;/span&gt;&lt;/a&gt;Nima bilan shug'ullanadi&lt;/h2&gt;\n&lt;p&gt;Surishtiruvchi jurnalist — bu jamoatchilik uchun yopiq bo'lgan, ijtimoiy ahamiyatga ega mavzularni tizimli va uzoq muddatli tadqiq qiladigan mutaxassis. Yangiliklar jurnalistikasidan farqli o'laroq, surishtiruv faktlarni chuqur tekshirishni, birlamchi hujjatlar bilan ishlashni va tizimli qonuniyatlarni aniqlashni talab qiladi. Surishtiruv jarayoni ma'lumotlarni izlash, ularni tekshirish, bog'liqliklarni tahlil qilish va yuridik tekshiruvdan o'tadigan material tayyorlashni o'z ichiga oladi.&lt;/p&gt;\n&lt;h2 id=\"tipik-vazifalar\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#tipik-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tipik vazifalar&lt;/span&gt;&lt;/a&gt;Tipik vazifalar&lt;/h2&gt;\n&lt;p&gt;Surishtiruvchining asosiy vazifasi tartibsiz ma'lumotlarni tizimlashtirilgan bilimlar bazasiga aylantirishdir. Bunga ochiq reyestrlardan ma'lumot yig'ish, ijtimoiy tarmoqlarni tahlil qilish va turli idoralarning hisobotlarini solishtirish kiradi. Mutaxassis rasmiy ma'lumotlardagi nomuvofiqliklarni, masalan, tadqiqotlar hisobotlardan g'oyib bo'lganda yoki statistika o'zgarganda aniqlaydi. Ishda ko'pincha OSINT usullari qo'llaniladi.&lt;/p&gt;\n&lt;h2 id=\"konikmalar-va-vositalar\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#konikmalar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ko'nikmalar va vositalar&lt;/span&gt;&lt;/a&gt;Ko'nikmalar va vositalar&lt;/h2&gt;\n&lt;p&gt;Ish uchun tanqidiy tahlil ko'nikmalari, faktcheking usullarini bilish va ma'lumotlar bilan ishlash tamoyillarini tushunish talab etiladi. Vositalar qatoriga bog'liqliklar graflarini tahlil qiluvchi dasturlar, matnlardagi yashirin parametrlarni topish uchun tabiiy tilni qayta ishlash algoritmlari va raqamli obyektlarning haqiqiyligini tekshiruvchi vositalar kiradi.&lt;/p&gt;\n&lt;h2 id=\"qayerda-oqish-kerak\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#qayerda-oqish-kerak\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda o'qish kerak&lt;/span&gt;&lt;/a&gt;Qayerda o'qish kerak&lt;/h2&gt;\n&lt;p&gt;Kasb gumanitar fanlar yoki huquq sohasidagi akademik tayyorgarlikni ma'lumotlarni tahlil qilish bo'yicha texnik ko'nikmalar bilan birlashtirishni talab qiladi. Asosiy ta'lim odatda jurnalistika, sotsiologiya yoki politologiyani o'z ichiga oladi. Qo'shimcha ravishda mutaxassislar ochiq ma'lumotlar bilan ishlash, statistik tahlil va kiberxavfsizlik asoslarini o'rganadilar.&lt;/p&gt;\n&lt;h2 id=\"qayerda-ishlash-va-qanday-osish\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#qayerda-ishlash-va-qanday-osish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda ishlash va qanday o'sish&lt;/span&gt;&lt;/a&gt;Qayerda ishlash va qanday o'sish&lt;/h2&gt;\n&lt;p&gt;Surishtiruvchilar mustaqil ommaviy axborot vositalarida, tadqiqot markazlarida va nodavlat tashkilotlarda ishlaydilar. Karyera o'sishi alohida vazifalarni bajarishdan yuristlar, ma'lumotlar tahlilchilari va soha ekspertlari ishini muvofiqlashtirishni talab qiladigan murakkab loyihalarni boshqarishga o'tishni nazarda tutadi.&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%96%D1%83%D1%80%D0%BD%D0%B0%D0%BB%D0%B8%D1%81%D1%82%D1%81%D0%BA%D0%B8%D0%B5_%D1%80%D0%B0%D1%81%D1%81%D0%BB%D0%B5%D0%B4%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Журналистские расследования — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.endeavour.2010.09.005\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Testing sex and gender in sports; reinventing, reimagining and reconstructing histories&lt;/a&gt; — sharh, Endeavour 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/014107680509801110\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Research governance: where did it come from, what does it mean?&lt;/a&gt; — sharh, J R Soc Med 2005&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s00436-024-08167-4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A History of Malaria and Conflict&lt;/a&gt; — sharh, Parasitol Res 2024&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Kasblar&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"ведёт расследование от наводки до проверенной публикации"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Журналист-расследователь","description":"ведёт расследование от наводки до проверенной публикации","vcsPath":"reference/professions/prof-investigative_journalist.md"},"headings":[{"title":"Nima bilan shug'ullanadi","href":"reference/professions/prof-investigative_journalist.html#nima-bilan-shugullanadi","level":2},{"title":"Tipik vazifalar","href":"reference/professions/prof-investigative_journalist.html#tipik-vazifalar","level":2},{"title":"Ko'nikmalar va vositalar","href":"reference/professions/prof-investigative_journalist.html#konikmalar-va-vositalar","level":2},{"title":"Qayerda o'qish kerak","href":"reference/professions/prof-investigative_journalist.html#qayerda-oqish-kerak","level":2},{"title":"Qayerda ishlash va qanday o'sish","href":"reference/professions/prof-investigative_journalist.html#qayerda-ishlash-va-qanday-osish","level":2},{"title":"Manbalar","href":"reference/professions/prof-investigative_journalist.html#manbalar","level":2}],"title":"Журналист-расследователь"},"router":{"pathname":"reference/professions/prof-investigative_journalist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
