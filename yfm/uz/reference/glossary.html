            {"data":{"leading":false,"html":"&lt;p&gt;327 ta tushuncha&lt;/p&gt;\n&lt;h2 id=\"f\"&gt;&lt;a href=\"reference/glossary.html#f\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F&lt;/span&gt;&lt;/a&gt;F&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Faktlar va mediani tekshirish&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ispravlenie-faktov.html\"&gt;Faktlarni tuzatish&lt;/a&gt; — Modelni noto‘g‘ri ma’lumotlar ta’sirini bartaraf etish uchun to‘g‘ri ma’lumotlar bilan qayta o‘qitish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/forsyth-edwards-notation.html\"&gt;FEN&lt;/a&gt; — Model uchun kirish ma'lumotlari sifatida ishlatiladigan shaxmat pozitsiyasini yozib olish standarti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/filtratsiya.html\"&gt;Filtrlash&lt;/a&gt; — Model degradatsiyasini oldini olish uchun o'quv korpusidan past sifatli yoki sintetik ma'lumotlarni olib tashlash jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; — Tadqiqotga ko'ra, sun'iy intellekt tomonidan yaratilgan kontentga noto'g'ri ustunlik beradigan ma'lumotlar sifati filtri.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;Foydalanuvchi simulyatori&lt;/a&gt; — Sunʼiy intellekt agentlarining javoblarini sinash uchun real inson xatti-harakatlarini taqlid qiluvchi dasturiy muhit.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/false-positive-rate.html\"&gt;FPR&lt;/a&gt; — Xavfsiz harakatlarning tahdid sifatida notoʻgʻri bloklanish ulushi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/frame-break.html\"&gt;Frame-break&lt;/a&gt; — Modelni «rol oʻynash»dan chiqarib, bazaviy koʻrsatmalarga qaytarish va istalmagan holatlarning mustahkamlanishiga yoʻl qoʻymaslik usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/norma-frobeniusa.html\"&gt;Frobenius normasi&lt;/a&gt; — Matritsaning «hajmi»ni o‘lchash usuli bo‘lib, o‘qitish jarayonida model vaznlari qanchalik o‘zgarganini baholashga imkon beradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k\"&gt;&lt;a href=\"reference/glossary.html#k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;К&lt;/span&gt;&lt;/a&gt;К&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-image_forensics.html\"&gt;Криминалистика изображений&lt;/a&gt; — Следы монтажа, метаданные, сжатие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crowdsourcing.html\"&gt;Краудсорсинг и разметка&lt;/a&gt; — Как сообщества помогают проверять.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/calibrated-validation.html\"&gt;Калиброванная валидация&lt;/a&gt; — Modelning faktlarni buzmasdan va xolislikni yo'qotmasdan foydalanuvchi his-tuyg'ularini tan olish va empatiya ko'rsatish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/density-map.html\"&gt;карта плотности&lt;/a&gt; — Neyrotarmoq tomonidan bashorat qilinadigan piksellar qiymatlarining fazoviy taqsimoti, ularning yig'indisi qidirilayotgan obyektlarning…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/encoded-reasoning.html\"&gt;Кодированные рассуждения&lt;/a&gt; — Mantiq o'qib bo'lmaydigan, ammo ochiq formatda taqdim etiladigan model hisoblash shakli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conversion.html\"&gt;Конверсия&lt;/a&gt; — Muayyan vaqt ichida muallif kontenti bilan o'zaro aloqadan unga obuna bo'lishga o'tish ko'rsatkichi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/runtime-assurance-contract.html\"&gt;Контракт обеспечения времени выполнения&lt;/a&gt; — AI agentlari uchun avtonomiya chegaralari, komponentlarning yaroqlilik mezonlari, dalillar holati va kompensatsiya qilinmaydigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/capture-coefficient.html\"&gt;коэффициент захвата&lt;/a&gt; — Manbaning o'z-o'zini mustahkamlash kuchi ko'rsatkichi bo'lib, oldingi bosqichda iqtibos mavjud bo'lgan va mavjud bo'lmagan holatlardagi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cross-attention.html\"&gt;Кросс-внимание&lt;/a&gt; — Til dekoderiga enkoderdan olingan shaxmat pozitsiyasining oraliq tasvirlariga murojaat qilish imkonini beruvchi ma'lumotlarni…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p\"&gt;&lt;a href=\"reference/glossary.html#p\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;П&lt;/span&gt;&lt;/a&gt;П&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-provenance.html\"&gt;Происхождение и водяные знаки&lt;/a&gt; — C2PA, цифровые подписи контента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-platforms.html\"&gt;Платформы&lt;/a&gt; — Telegram, YouTube, X: особенности данных и доступа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lossless-visual-memory.html\"&gt;Память без потерь&lt;/a&gt; — Vizual ma'lumotlarni arxivlash usuli, bunda har bir kadr vaqt va harakat bo'yicha indekslanadi va asl sifatda saqlanadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/earn-in.html\"&gt;Период вхождения&lt;/a&gt; — Tizimda izohlarni nashr etish huquqini berishdan oldin sun'iy intellekt mualliflarining aniqligi va sifatini tekshirish jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bias-isolation.html\"&gt;подавление фона&lt;/a&gt; — COBICount arxitekturasining bosqichi va moduli, takrorlanuvchi fon tuzilmalari va shovqinlardan (yo'llar, to'xtash joylari to'rlari)…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/candidate-acceptance.html\"&gt;подтверждение кандидатов&lt;/a&gt; — COBICount usulining bosqichi va moduli, yakuniy zichlik xaritasi uchun javoblarni ixchamlik va dastlabki nuqtali annotatsiyalarga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/direct-planning.html\"&gt;Прямое планирование&lt;/a&gt; — Ish jarayonini yuqori haroratda yuqori darajadagi rejani yaratishga va undan keyin yakuniy matnni shakllantirishga ajratadigan generatsiya…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s\"&gt;&lt;a href=\"reference/glossary.html#s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С&lt;/span&gt;&lt;/a&gt;С&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic.html\"&gt;Синтетические медиа&lt;/a&gt; — Детекция сгенерированных изображений, голоса и видео.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-coordination.html\"&gt;Скоординированное поведение&lt;/a&gt; — Синхронные публикации, сети аккаунтов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-legal_data.html\"&gt;Суды и законы&lt;/a&gt; — Открытые решения, законодательные базы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semantic-consolidation.html\"&gt;Семантическая консолидация&lt;/a&gt; — Yakuniy ma'lumotlar tuzilmasini shakllantirish uchun til modeli tomonidan aniqlangan semantik jihatdan o'xshash atributlarni birlashtirish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/instruction-following.html\"&gt;Следование инструкциям&lt;/a&gt; — Til modelining matn yaratishda foydalanuvchi tomonidan belgilangan shartlar va cheklovlarni bajarish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/event-based-grounding.html\"&gt;Событийная привязка&lt;/a&gt; — Robot tomonidan ob'ektni nomi yoki tashqi ko'rinishi bo'yicha emas, balki yaqinda sodir bo'lgan harakatdagi roli asosida identifikatsiya…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cumulative-conversational-visibility.html\"&gt;совокупная видимость в диалоге&lt;/a&gt; — Diqqat vazn koeffitsientlarini hisobga olgan holda muloqotning barcha bosqichlari davomida manbaning umumiy ahamiyatini hisoblash uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/selection-regret.html\"&gt;Сожаление при выборе&lt;/a&gt; — Model samaradorligining ko'rsatkichi bo'lib, u mavjud eng yaxshi tasvir reytingi va model tomonidan tanlangan tasvir reytingi o'rtasidagi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adversarial-perturbations.html\"&gt;состязательные возмущения&lt;/a&gt; — Tasvir piksellaridagi ko'zga ko'rinmas minimal o'zgarishlar bo'lib, ular neyron tarmoqni noto'g'ri natija berishga majbur qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/social-bot.html\"&gt;Социальный бот&lt;/a&gt; — Muayyan turdagi dezinformatsiyaning tarqalishini strategik jihatdan kuchaytiradigan avtomatlashtirilgan akkaunt.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sociotechnical-changes.html\"&gt;Социотехнические изменения&lt;/a&gt; — Boshqaruv tuzilmasiga ta'sir qiluvchi texnologik tizimlar va ijtimoiy institutlarning o'zaro bog'liq transformatsiyalari.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — O‘rtacha mutlaq xatolik (MAE) — bu prognozlash sifatining ko‘rsatkichi bo‘lib, bashorat qilingan va haqiqiy ma’lumotlar o‘rtasidagi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganographic-messaging.html\"&gt;Стеганографическая передача сообщений&lt;/a&gt; — Matn ichida ma'lumotlarni uzatish usuli, bunda yashirin ma'no tashqi monitor uchun sezilmaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scene-weighted-training.html\"&gt;Сценарно-взвешенное обучение&lt;/a&gt; — Turli domenlardagi sahnalardagi savollar sonini muvozanatlash uchun vazn koeffitsientlaridan foydalanadigan o'qitish usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a\"&gt;&lt;a href=\"reference/glossary.html#a\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А&lt;/span&gt;&lt;/a&gt;А&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sat_imagery.html\"&gt;Анализ спутниковых снимков&lt;/a&gt; — Sentinel, Landsat, разрешение, индексы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/automatic-annotator.html\"&gt;Автоматический аннотатор&lt;/a&gt; — LLM asosida ishlaydigan dasturiy vosita bo'lib, u ilmiy matnni segmentlarga ajratadi va uning qismlarini CARS modelining ritorik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reconstruction-agent.html\"&gt;Агент реконструкции&lt;/a&gt; — Tizimning tarkibiy qismi bo'lib, u masofaviy model interfeysi bilan mosligini ta'minlash uchun himoyalangan yozuv asosida media…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aktivnoe-vospriyatie.html\"&gt;Активное восприятие&lt;/a&gt; — Ob'ektni qidirish usuli, bunda robot potentsial ko'rish nuqtalarini baholaydi va noaniqlik hamda harakatlar sonini kamaytirish uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/embedding-drift-analysis.html\"&gt;Анализ дрейфа эмбеддингов&lt;/a&gt; — O'qitishdan oldin va keyin token vektorlarining kosinus o'xshashligini solishtirish orqali tarmoq og'irliklaridagi o'zgarishlarni…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/counterfactual-role.html\"&gt;Антифактическая роль&lt;/a&gt; — Modelning haqiqatga zid bo'lgan e'tiqodlarga ega personajni taqlid qiladigan ish rejimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomic-fact.html\"&gt;Атомарный факт&lt;/a&gt; — Neyrotarmoq javobining minimal mazmunli birligi, uni manbalarga muvofiqligini mustaqil tekshirish mumkin.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s1\"&gt;&lt;a href=\"reference/glossary.html#s1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S&lt;/span&gt;&lt;/a&gt;S&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geo.html\"&gt;Sun'iy yo'ldoshlar va geoma'lumotlar&lt;/a&gt; — Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/s-pubmedbert.html\"&gt;S-PubMedBERT&lt;/a&gt; — Tibbiy matnlarni vektorlash uchun model, bilimlar bazasi bilan faktlarni solishtirish aniqligini ta'minlash uchun ishlatiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sago.html\"&gt;SAGO&lt;/a&gt; — Til modellarining barqarorligini baholash uchun freymvork, u kirish ma'lumotlarining semantik jihatdan ekvivalent o'zgarishlarida tizim…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/centipawn.html\"&gt;Santipeyka&lt;/a&gt; — Shaxmatdagi ustunlikni o'lchash birligi, 1/100 piyodaga teng.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scaffold.html\"&gt;Scaffold&lt;/a&gt; — Til modeliga operatsion tizim va vositalar bilan ishlashga yordam beradigan dasturiy qobiq.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secjev.html\"&gt;SecJev&lt;/a&gt; — Kiberxavfsizlik sohasida qaror qabul qilish uchun ixtisoslashgan modellar oilasi, avtoregressiv generatsiya o'rniga nomzodlarni bir…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secjev-corpus.html\"&gt;SecJev-Corpus&lt;/a&gt; — Xavfsizlik modellarini o'qitish va baholash uchun ma'lumotlar to'plami, sakkiz xil manbadan olingan 170 185 ta savolni o'z ichiga oladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semanticheskiy-dreyf.html\"&gt;Semantik siljish&lt;/a&gt; — Tashqi buzilishlar tufayli model vizual belgilarni notoʻgʻri talqin qila boshlaydigan maʼno oʻzgarishi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semhash.html\"&gt;SemHash&lt;/a&gt; — Semantik jihatdan o'xshash misollarni birlashtirish uchun yozuvlarning vektorli tasvirlaridan foydalanadigan ma'lumotlarni deduplikatsiya…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sglang.html\"&gt;SGLang&lt;/a&gt; — Til modellarini samarali bajarish, xotira va generatsiya tezligini optimallashtirish uchun mo‘ljallangan maxsus freymvork.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stability-generalization-score.html\"&gt;SGS&lt;/a&gt; — Kiritilgan ma'lumotlar o'zgarganda model xatti-harakatining ideal javoblar invariantligi shartidan og'ish darajasini o'lchash uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/yakor-lichnosti.html\"&gt;Shaxsiyat «langari&lt;/a&gt; — AI dialogda kim ekanligini belgilovchi asosiy tizimli koʻrsatma.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/podozritelnost.html\"&gt;Shubhalilik&lt;/a&gt; — Model javobining kutilgan uslubdan qanchalik chetga chiqishini baholovchi ko‘rsatkich bo‘lib, u yashirin ma’lumot uzatish kanallarini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-writers.html\"&gt;SI-mualliflar&lt;/a&gt; — API orqali postlar lentasini kuzatib boradigan va avtomatik ravishda tushuntirish izohlarini yaratadigan dasturiy agentlardir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/signatura.html\"&gt;Signatura&lt;/a&gt; — Chaqiruvning noyob identifikatori bo'lib, u model argumentlar yozilishini biroz o'zgartirsa ham, bir xil harakatni takrorlayotganini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sikofanstvo-v-ii.html\"&gt;Sikofantiya&lt;/a&gt; — Til modelining foydalanuvchi xato fikrlariga qo'shilish yoki ma'qullash uchun haddan tashqari xushomad qilish moyilligi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/simhash.html\"&gt;SimHash&lt;/a&gt; — SSH tizimida trayektoriya daraxti tugunlarining semantik yaqinligini baholash uchun ishlatiladigan xeshlash algoritmi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/speculative-safety-honeypot.html\"&gt;Speculative Safety Honeypot&lt;/a&gt; — AI agentlari uchun proaktiv himoya tizimi bo'lib, u zararli harakatlarni aniqlash va bloklash uchun kichik til modellari yordamida…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spekulyativnoe-dekodirovanie.html\"&gt;Spekulyativ dekodlash&lt;/a&gt; — Model kelajakdagi maʼlumotlar haqida tezkor taxminlar qiladigan va keyin ularning toʻgʻriligini tekshiradigan usul boʻlib, tahlil…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spp.html\"&gt;SPP&lt;/a&gt; — Zond modelning ichki holatiga taʼsir qiluvchi tashqi prompt omillarini yoʻqotish uchun ishlatiladigan usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganograficheskoe-myshlenie.html\"&gt;Steganografik fikrlash&lt;/a&gt; — AI modelining boshqa vazifaga javobdek ko'rinadigan matn ichida yashirin hisob-kitoblardan foydalanishi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganograficheskoe-rassuzhdenie.html\"&gt;Steganografik mulohaza yuritish&lt;/a&gt; — Mantiqiy xulosaning yashirin shakli bo'lib, unda model ma'lumotni fikrlash zanjiri orqali shunday uzatadiki, u tashqi nazorat tizimlari…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganografiya-v-kontekste-ii.html\"&gt;Steganografiya&lt;/a&gt; — Ma’lumotni oddiy matn ichida yashirin holda uzatish usuli bo‘lib, u tashqi kuzatuvchiga sezilmaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stohastichnost-vyborki.html\"&gt;Stoxastik tabiat&lt;/a&gt; — Modelning matn generatsiya qilishdagi ehtimollik xususiyatidan kelib chiqadigan tasodifiy oʻzgarishlar.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g\"&gt;&lt;a href=\"reference/glossary.html#g\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Г&lt;/span&gt;&lt;/a&gt;Г&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geolocation.html\"&gt;Геолокация по изображению&lt;/a&gt; — Где сделан снимок: рельеф, дороги, тени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/generative-engine-optimization.html\"&gt;генеративная оптимизация&lt;/a&gt; — Generativ qidiruv tizimlari javoblarida kontent ko'rinishini oshirish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/candidate-evidence.html\"&gt;генерация кандидатов&lt;/a&gt; — COBICount usulining birinchi bosqichi, tasvirdagi tarmoqning mumkin bo'lgan javoblarining keng xaritasini hosil qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/geometric-accuracy.html\"&gt;Геометрическая точность&lt;/a&gt; — O'rtacha mutlaq chuqurlik xatosi (MAE) va ob'ektlarning fazoda joylashuvining to'g'riligi orqali baholanadigan rekonstruksiya sifati…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/global-ai-governance.html\"&gt;Глобальное регулирование ИИ&lt;/a&gt; — Davlatlar va xususiy korporatsiyalar o'rtasida taqsimlangan sun'iy intellekt texnologiyalari uchun qoidalar va normalarni shakllantirish…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o\"&gt;&lt;a href=\"reference/glossary.html#o\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О&lt;/span&gt;&lt;/a&gt;О&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-change_detection.html\"&gt;Обнаружение изменений&lt;/a&gt; — Что изменилось между снимками: застройка, леса, разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/obobschenie.html\"&gt;Обобщение&lt;/a&gt; — Til modelining bir xil so'rov shakli o'zgarganda semantik jihatdan barqaror va izchil natijalarni saqlab qolish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reversible-numerical-mapping.html\"&gt;Обратимое числовое отображение&lt;/a&gt; — Ma'lumotlarni himoya qilish usuli, bunda raqamli qiymatlar tartibni saqlagan holda boshqalariga almashtiriladi, bu esa asl ma'lumotlarni…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reinforcement-learning-with-verifiable-rewards.html\"&gt;Обучение с подкреплением на основе верифицируемых наград&lt;/a&gt; — Modelni o'qitish usuli, bunda harakat uchun mukofot yaratilgan buyruqning to'g'riligini avtomatik tekshirish asosida belgilanadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/source-only-counting.html\"&gt;обучение только на исходных данных&lt;/a&gt; — Modelni бекіtishdan oldin maqsadli tasvirlar va belgilardan foydalanmasdan, obyektlarni sanash modellarini yagona belgilangan ma'lumotlar…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/compounding-ratio.html\"&gt;отношение компаундирования&lt;/a&gt; — GEO ning masofadagi haqiqiy ta'sirining bir bosqichli baholash natijalariga nisbatini aks ettiruvchi ko'rsatkich.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n\"&gt;&lt;a href=\"reference/glossary.html#n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Н&lt;/span&gt;&lt;/a&gt;Н&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-night_lights.html\"&gt;Ночные огни и косвенные признаки&lt;/a&gt; — Экономика и события по свечению городов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-narratives.html\"&gt;Нарративы и дезинформация&lt;/a&gt; — Отслеживание сюжетов и ложных утверждений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scientific-drift.html\"&gt;Наукометрический дрейф&lt;/a&gt; — Vaqt o'tishi bilan ma'lum bir sohadagi ilmiy tadqiqotlar yo'nalishi va metodologiyasining o'zgarishi, tematik klasterlarning tilga olinish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-compensatory-principle.html\"&gt;Некомпенсаторность&lt;/a&gt; — Modelning umumiy unumdorligidan qat'i nazar, har qanday nosozlik yoki noaniqlik yuz berganda harakatlarni bloklaydigan nazorat mexanizmi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neuchtennaya-nauka.html\"&gt;Неучтенная наука&lt;/a&gt; — Ilmiy loyihalar moliyalashtirilishi va bajarilishi davom etadigan, ammo ariza matnlariga kiritilgan o'zgartirishlar tufayli rasmiy davlat…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/expected-degree-null-model.html\"&gt;Нулевая модель&lt;/a&gt; — Foydalanuvchilarning kiruvchi va chiquvchi aloqalari sonini hisobga olgan holda o'zaro aloqalarning tasodifiy taqsimotini baholash uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zero-shot.html\"&gt;Нулевое обучение&lt;/a&gt; — Tizimning muayyan sharoitlar yoki ob'ektlar uchun maxsus qayta o'qitishni talab qilmasdan vazifalarni bajaradigan ish rejimi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o1\"&gt;&lt;a href=\"reference/glossary.html#o1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O&lt;/span&gt;&lt;/a&gt;O&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-osm_gis.html\"&gt;OpenStreetMap и ГИС&lt;/a&gt; — Открытые карты, геоданные, пространственный анализ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-data.html\"&gt;Ochiq ma'lumotlar&lt;/a&gt; — Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/graf-podpisok.html\"&gt;Obuna grafi&lt;/a&gt; — Foydalanuvchilar o‘rtasidagi aloqalarni aks ettiruvchi ma’lumotlar strukturasi, «diqqat yo‘li» esa kontent foydalanuvchiga qancha vositachi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/open-ended.html\"&gt;Ochiq prompt&lt;/a&gt; — Vizual talqin qilishning ko‘plab variantlariga yo‘l qo‘yadigan so‘rovdir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/greedy-decoding.html\"&gt;Ochko‘z dekodlash&lt;/a&gt; — Model har doim eng yuqori ehtimollikka ega tokenni tanlaydigan jarayon bo‘lib, u odatda javoblarni bir xil va deterministik qiladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oflayn-otsenka.html\"&gt;Oflayn baholash&lt;/a&gt; — Algoritmni real foydalanuvchilar bilan o‘zaro aloqasiz, statik ma’lumotlar to‘plamida sinovdan o‘tkazish.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a1\"&gt;&lt;a href=\"reference/glossary.html#a1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A&lt;/span&gt;&lt;/a&gt;A&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nets.html\"&gt;Axborot kampaniyalari va tarmoqlar&lt;/a&gt; — Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Ablatsiya&lt;/a&gt; — Ablatsiya — bu tizim komponentlarining yakuniy natijaga ta'sirini baholash uchun ularni ketma-ket o'chirish orqali tizimni tekshirish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ablyatsionnoe-issledovanie.html\"&gt;Ablyatsion tadqiqot&lt;/a&gt; — Ablatsion tadqiqot — bu tizimning alohida qismlarini navbatma-navbat o‘chirish yoki almashtirish orqali ularning yakuniy natijaga ta’sirini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/harness.html\"&gt;Agent muhiti&lt;/a&gt; — Neyrotarmoqning vositalar, xotira va tashqi ma'lumotlar bilan o'zaro ta'sirini boshqaradigan dasturiy muhit.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agentnyy-plagin.html\"&gt;Agentli plagin&lt;/a&gt; — Foydalanuvchi nomidan avtonom harakatlarni amalga oshiruvchi dasturiy modul bo'lib, u sezgir ma'lumotlarni tashqi serverga yubormasdan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agentnyy-konveyer.html\"&gt;Agentli quvur liniyasi&lt;/a&gt; — Alohida modullar (agentlar) maʼlumotlarni qayta ishlash va tekshirish kabi vazifalarni bajaradigan tizimdir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-note-writer-api.html\"&gt;AI Note Writer API&lt;/a&gt; — Uchinchi tomon dasturchilariga sun'iy intellekt yordamida Community Notes tizimi uchun kontekstli izohlarni avtomatik yaratish imkonini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/apriornoe-znanie.html\"&gt;Aprior bilim&lt;/a&gt; — Modelning muayyan kontekstni ko'rishidan oldin ma'lum bir ma'lumotlar tuzilmasini generatsiya qilishga bo'lgan \"moyilligi\".&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/smeshivayuschiy-faktor.html\"&gt;Aralashuvchi omil&lt;/a&gt; — Natijalarni buzishi mumkin boʻlgan qoʻshimcha oʻzgaruvchi boʻlib, modelni yolgʻonga emas, balki koʻrsatma uslubiga yoki token ehtimolligiga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/arc-agi-3.html\"&gt;ARC-AGI-3&lt;/a&gt; — 25 ta vizual o'yindan iborat interaktiv benchmark, unda agent qoidalarni aniq belgilamasdan turib, qonuniyatlar va maqsadlarni mustaqil…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomarnyy-vklad.html\"&gt;Atomar hissa&lt;/a&gt; — Usul yoki natija haqidagi birgina aniq, tekshirilishi mumkin boʻlgan bayonot boʻlib, u kirish soʻzlari va olmoshlardan xoli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/acc.html\"&gt;Atomik hissa daʼvolari&lt;/a&gt; — Ilmiy annotatsiyadan olingan, kirish so'zlari va kontekstdan tozalangan, muallifning aniq ilmiy hissasini tasvirlovchi qisqa, tekshirilishi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attraktor.html\"&gt;Attraktor&lt;/a&gt; — Tashqi taʼsirlar boʻlmaganda yoki boshqaruv signallari zaiflashganda tizim intiladigan holat.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; — Tasniflash sifati metriklari: 0,5 tasodifiy taxminni, 1,0 esa mukammal aniqlikni anglatadi. 0,69 qiymati modelning o‘rtacha bashorat qilish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/auditorskiy-razryv.html\"&gt;Audit boʻshligʻi&lt;/a&gt; — Neyrotarmoqning to'g'ridan-to'g'ri javob berishi va ma'lumotdan mantiqiy zanjirlarda foydalanishi o'rtasidagi tafovut.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/informatsionnyy-zapah.html\"&gt;Axborot hidi&lt;/a&gt; — Foydalanuvchining havola ustiga bosishdan oldin kontentning foydaliligini bilvosita belgilar (sarlavhalar, parcha) orqali baholashidir.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b\"&gt;&lt;a href=\"reference/glossary.html#b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Б&lt;/span&gt;&lt;/a&gt;Б&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bots.html\"&gt;Боты&lt;/a&gt; — Автоматические аккаунты и их поиск.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/base-belief.html\"&gt;Базовое убеждение&lt;/a&gt; — Model yolg'on gapirishga undovchi omillar bo'lmaganda, foydali yordamchi rejimida izchil ifodalaydigan pozitsiya.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stateless-inference.html\"&gt;Безгосударственный инференс&lt;/a&gt; — Til modelining har bir yangi so'rov uchun diqqat holatini qaytadan hisoblaydigan ishlash rejimi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r\"&gt;&lt;a href=\"reference/glossary.html#r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Р&lt;/span&gt;&lt;/a&gt;Р&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-diffusion.html\"&gt;Распространение и виральность&lt;/a&gt; — Как сообщения расходятся по сети.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/train-inference-gap.html\"&gt;разрыв между обучением и выводом&lt;/a&gt; — Modelning majburiy o'qitishda raqobatbardosh hujumlarni muvaffaqiyatli o'zlashtirishi, ammo erkin matn generatsiyasida ularga e'tibor…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/assurance-transition-gap.html\"&gt;Разрыв перехода к гарантиям&lt;/a&gt; — Tizim vazifani bajaradigan, ammo xavf tug'ilganda agent vakolatlari darajasini o'zgartirish mexanizmiga ega bo'lmagan tizim holati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mahalanobis-distance.html\"&gt;Расстояние Махаланобиса&lt;/a&gt; — Tasvirlarga kiritilgan o'zgartirishlar real ma'lumotlar taqsimoti doirasidan chiqib ketmasligini baholash uchun ishlatiladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/regulatory-arbitrage.html\"&gt;Регуляторный арбитраж&lt;/a&gt; — Boshqa hududlarda o'rnatilgan cheklovlarni chetlab o'tish uchun eng yumshoq qoidalarga ega yurisdiksiyani tanlash amaliyoti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rhetorical-structure.html\"&gt;Риторическая структура&lt;/a&gt; — Matndagi argumentativ harakatlar ketma-ketligi bo'lib, ular orqali muallif o'z tadqiqotining ahamiyatini asoslaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e\"&gt;&lt;a href=\"reference/glossary.html#e\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Э&lt;/span&gt;&lt;/a&gt;Э&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ethics.html\"&gt;Этика и приватность&lt;/a&gt; — Где граница: защита персональных данных, риски исследований.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v\"&gt;&lt;a href=\"reference/glossary.html#v\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В&lt;/span&gt;&lt;/a&gt;В&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-web_archives.html\"&gt;Веб-архивы&lt;/a&gt; — Wayback Machine, сохранение и сравнение страниц.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/verbalized-sampling.html\"&gt;Вербализованное сэмплирование&lt;/a&gt; — Generatsiyani diversifikatsiya qilish usuli bo'lib, unda til modeli berilgan miqdordagi javoblar uchun ehtimolliklar taqsimotini mustaqil…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/probabilistic-volumetric-map.html\"&gt;Вероятностная волюметрическая карта&lt;/a&gt; — Fazoni hajm modeli ko'rinishida ifodalash, u maqsadning joylashuv ehtimolini baholash uchun voqealar tarixi ma'lumotlari va joriy sahna…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-number-generator.html\"&gt;Внешний генератор случайных чисел&lt;/a&gt; — Javoblarni rejalashtirishda model tomonidan taklif qilingan variantlar orasidan birini tanlash uchun qo'llaniladigan tashqi tasodifiylik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enactment.html\"&gt;Воплощение&lt;/a&gt; — Agentning muloqot davomida belgilangan rolni ijro etish jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/completion-gate.html\"&gt;ворота завершения&lt;/a&gt; — Modelni vazifa bajarilganligini tasdiqlashdan oldin olingan natijani topshiriqning asl matni bilan solishtirishga majbur qiladigan mexanizm.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u\"&gt;&lt;a href=\"reference/glossary.html#u\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;U&lt;/span&gt;&lt;/a&gt;U&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-methods.html\"&gt;Usullar va etika&lt;/a&gt; — Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i\"&gt;&lt;a href=\"reference/glossary.html#i\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И&lt;/span&gt;&lt;/a&gt;И&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-tooling.html\"&gt;Инструменты и пайплайны&lt;/a&gt; — Открытые инструменты и их сравнение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/information-extraction.html\"&gt;Извлечение информации&lt;/a&gt; — Tabiiy tildagi tuzilmagan matnni keyingi tahlil uchun tuzilgan ma'lumotlarga aylantirish jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-agent.html\"&gt;ИИ-агент&lt;/a&gt; — LLM asosidagi dasturiy mohiyat bo'lib, doimiy identifikatsiya va o'zaro ta'sirlar tarixiga ega.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tool-use.html\"&gt;Использование инструментов&lt;/a&gt; — Til modelining tashqi tizimlar yoki serverlar bilan o'zaro ishlash uchun tuzilgan so'rovlarni yaratish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iterative-distillation.html\"&gt;Итеративная дистилляция&lt;/a&gt; — Model pozitsiyalarni tahlil qiladigan, tushuntirishlarni yaratadigan va olingan tajribani o'z vaznlariga qaytarib o'tkazadigan o'qitish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iterative-framework.html\"&gt;Итеративный фреймворк&lt;/a&gt; — Oldindan belgilangan ontologiyadan foydalanmasdan, tuzilmagan matnlar korpusidan atribut sxemalarini avtomatik aniqlash va chiqarib olish…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d\"&gt;&lt;a href=\"reference/glossary.html#d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д&lt;/span&gt;&lt;/a&gt;Д&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-datasets.html\"&gt;Датасеты и бенчмарки&lt;/a&gt; — Размеченные наборы для проверки методов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dataset.html\"&gt;Датасет&lt;/a&gt; — Yolg'on detektorlarini o'rgatish va sinash uchun ishlatiladigan savol-javob juftliklari to'plami.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/two-hop.html\"&gt;Два прыжка&lt;/a&gt; — Foydalanuvchidan ikki bog'lanish masofasida bo'lgan kontent muallifigacha bo'lgan obuna grafigidagi radius.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/diagnostic-ladder.html\"&gt;Диагностическая лестница&lt;/a&gt; — AI ko'nikmalarini tekshirish usuli bo'lib, u takrorlashni tekshirish, birinchi tokenni zondlash va embedding drift tahlilini o'z ichiga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dissociation.html\"&gt;Диссоциация&lt;/a&gt; — AI agentining belgilangan rolni yo'qotib, o'zini bazaviy model sifatida identifikatsiya qila boshlaydigan holati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/distilled-model.html\"&gt;Дистиллированная модель&lt;/a&gt; — So'rovlardagi mohiyat va mavzularni qayta yozish uchun ishlatiladigan, parametrlar soni kamaytirilgan mahalliy neyron tarmoq.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/diffusion-inpainting.html\"&gt;Диффузионный инпейнтинг&lt;/a&gt; — Shahar muhiti suratlaridagi o'tkazib yuborilgan yoki o'zgartirilgan joylarni to'ldirish uchun tizimda qo'llaniladigan tasvirni generativ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attention-path-length.html\"&gt;Длина пути внимания&lt;/a&gt; — Foydalanuvchi va u o'zaro aloqada bo'lgan kontent muallifi o'rtasidagi obuna grafigidagi masofani o'lchaydigan metrika.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"8\"&gt;&lt;a href=\"reference/glossary.html#8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8&lt;/span&gt;&lt;/a&gt;8&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/8-bitnyy-optimizator.html\"&gt;8-bitli optimizator&lt;/a&gt; — Xotirani tejashga imkon beruvchi, ammo to'liq bf16 formatiga nisbatan hisoblash aniqligiga ta'sir qilishi mumkin bo'lgan optimizator…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b1\"&gt;&lt;a href=\"reference/glossary.html#b1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B&lt;/span&gt;&lt;/a&gt;B&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ispolnyaemyy-graf-elementov.html\"&gt;Bajariladigan elementlar grafi&lt;/a&gt; — Tizimga tasvirni shunchaki chizish emas, balki har bir obyektni kod sifatida boshqarish va faktlarga muvofiqligini tekshirish imkonini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beam-search.html\"&gt;Beam Search&lt;/a&gt; — Har bir qadamda eng ehtimolli variantlarni saqlab qoladigan va koʻplab hujum stsenariylarini samarali oʻrganishga imkon beradigan qidiruv…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iteratsiya-po-bellmanu.html\"&gt;Bellman iteratsiyasi&lt;/a&gt; — Model chuqurroq qidiruv baholariga tayanib, oʻz bashoratlarini bosqichma-bosqich yaxshilaydigan oʻqitish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/popravka-bendzhamini-hohberga.html\"&gt;Benjamini-Xoxberg tuzatishi&lt;/a&gt; — Ko‘p sonli taqqoslashlar o‘tkazilganda noto‘g‘ri ijobiy natijalarni nazorat qilish va tasodifiy korrelyatsiyalarni yo‘qotish uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beyondsce.html\"&gt;BeyondSCe&lt;/a&gt; — Robotlar uchun ob'ektlarni ushlash tizimi, u o'tmishdagi o'zaro ta'sirlar tarixi va yashirin narsalarni qidirish uchun faol idrokdan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kosvennaya-inektsiya.html\"&gt;Bilvosita inyeksiya&lt;/a&gt; — Hujum turi boʻlib, unda zararli koʻrsatma foydalanuvchi tomonidan emas, balki agent vazifani bajarish jarayonida oʻqiydigan tashqi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-pass-candidate-scorer.html\"&gt;Bir o‘tishli skorer&lt;/a&gt; — Model ma’lumotlarni qayta ishlashning bir siklida qaror variantlarini baholaydigan usul bo‘lib, u ko‘p bosqichli generativ jarayonlarga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/blaise.html\"&gt;Blaise&lt;/a&gt; — Hujjatlarni indekslaydigan va modelga faqat tegishli matn parchalarini uzatadigan Galahad tizimi komponenti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/butstrep.html\"&gt;Butstrap&lt;/a&gt; — Xulosalarning ishonchliligini tekshirish uchun ma’lumotlar qayta-qayta tanlab olinadigan statistik baholash usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/butstrep-intervaly.html\"&gt;Butstrap-intervallari&lt;/a&gt; — Maʼlumotlarni qayta-qayta tanlab olish orqali aniqlangan tendensiyalarning qanchalik ishonchli ekanligini baholashga yordam beradigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-butstrepa.html\"&gt;Butstrap usuli&lt;/a&gt; — Maʼlumotlarning asl toʻplamidan takroriy tanlash orqali baholash aniqligini tekshirish uchun ishlatiladigan statistik usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/byzantine-fault-tolerance.html\"&gt;ByzFL&lt;/a&gt; — Tizimning ayrim tugunlaridagi nosozliklar yoki zararli harakatlarga chidamliligini ta'minlash usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c\"&gt;&lt;a href=\"reference/glossary.html#c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C&lt;/span&gt;&lt;/a&gt;C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/create-a-research-space.html\"&gt;CARS&lt;/a&gt; — Ilmiy maqolalar kirish qismining tuzilish modeli bo'lib, u argumentatsiyani uchta ritorik qadam orqali tasvirlaydi: hududni belgilash…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/model-cars.html\"&gt;CARS modeli&lt;/a&gt; — Ilmiy kirish qismlari tuzilishini tahlil qilishning standart lingvistik yondashuvi bo‘lib, unda muallif bosqichma-bosqich umumiy…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chekpoint.html\"&gt;Chekkopoint&lt;/a&gt; — Validatsiya to'plamida eng yaxshi natija ko'rsatgan va yakuniy test uchun saqlab qo'yilgan neyron tarmoq holati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zakon-masshtabirovaniya-chinchilla.html\"&gt;Chinchilla qonuni&lt;/a&gt; — Neyrotarmoq parametrlarining soni va o'quv ma'lumotlari hajmi o'rtasidagi optimal nisbatni belgilovchi matematik model.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/claimopinion.html\"&gt;ClaimOpinion&lt;/a&gt; — Eslatmaning foydali (Helpful) deb topilish ehtimolini bashorat qiluvchi, uning xolisligini tahlil qiluvchi mashinali o‘qitish modeli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt; — Kompyuter dasturi bilan o'zaro aloqa qilish usuli, bunda foydalanuvchi operatsiyalarni bajarish uchun matnli buyruqlarni kiritadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cobicount.html\"&gt;COBICount&lt;/a&gt; — Sun'iy yo'ldosh tasvirlaridagi ob'ektlarni hisoblash usuli bo'lib, u maqsadli ma'lumotlarda qayta o'qitmasdan nomzodlarni yaratish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-notes.html\"&gt;Community Notes&lt;/a&gt; — Ijtimoiy tarmoqdagi noto'g'ri ma'lumotlarga qarshi kurashish uchun foydalanuvchilar tomonidan kontekstli izohlar qo'shishga mo'ljallangan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-writer.html\"&gt;Community Writer&lt;/a&gt; — Kontekstli izohlarni yaratish va ustuvorligini belgilash uchun qayta o'qitilgan va tijorat modellarini birlashtirgan AI API'ning eng yirik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conversational-capture.html\"&gt;Conversational capture&lt;/a&gt; — Sun'iy intellekt bilan muloqotda manbaning dastlabki iqtibos qilinishi uning kelajakda qayta paydo bo'lish ehtimolini oshiradigan hodisa.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-rated-helpful.html\"&gt;CRH&lt;/a&gt; — Foydalanuvchilar konsensusi asosida algoritm tomonidan izohga beriladigan va uning platformada keng ko'rinishini ta'minlaydigan ko'rsatkich.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d1\"&gt;&lt;a href=\"reference/glossary.html#d1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D&lt;/span&gt;&lt;/a&gt;D&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/gate.html\"&gt;Darvoza»&lt;/a&gt; — Darvoza (gate) — bu model arxitekturasidagi tashqi vositani chaqirish zarurligini belgilovchi mexanizm yoki javoblarning izchilligiga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/program-aided-reasoning.html\"&gt;Dastur yordamida mulohaza yuritish&lt;/a&gt; — Model hisob-kitoblar uchun kod generatsiya qiladigan usul boʻlib, u mantiqiy xulosalar aniqligini oshiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/determinirovannye-povoroty.html\"&gt;Deterministik aylantirish&lt;/a&gt; — Roʻyxatdagi elementlar ketma-ketligini oʻzgartirish orqali modelning birinchi variantga moyilligini tekshirish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/determinirovannaya-kanonizatsiya.html\"&gt;Deterministik kanonizatsiya&lt;/a&gt; — Buyruqlarning turli yozilish variantlarini yagona standartga keltirish jarayoni bo‘lib, u model aniqligini xolis baholash imkonini beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dispersiya.html\"&gt;Dispersiya&lt;/a&gt; — Maʼlumotlarning tarqalish koʻrsatkichi; yuqori dispersiya shuni anglatadiki, bir xil test natijalari har safar turlicha boʻlishi mumkin.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adaptatsiya-domenov.html\"&gt;Domen adaptatsiyasi&lt;/a&gt; — Modelni bir manba ma'lumotlaridan boshqa, yangi sharoitdagi ma'lumotlarga moslashtirish jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/drift-inspector.html\"&gt;Drift Inspector&lt;/a&gt; — Ilmiy sohalar evolyutsiyasini atomar hissa da'volarini ajratib olish va klasterlash orqali tahlil qilish uchun ochiq kodli tizim.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e1\"&gt;&lt;a href=\"reference/glossary.html#e1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;E&lt;/span&gt;&lt;/a&gt;E&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekspertnyy-enkoder.html\"&gt;Ekspert enkoderi&lt;/a&gt; — Muayyan soha (masalan, shaxmat) qoidalari va strategiyasini «tushunadigan» ixtisoslashgan model boʻlib, u til modeliga qaror qabul qilish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekstraktor.html\"&gt;Ekstraktor&lt;/a&gt; — Matndan ilmiy daʼvolarni ajratib oluvchi model.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/embedding.html\"&gt;Embedding&lt;/a&gt; — Matnni raqamli vektor ko'rinishida ifodalash bo'lib, modelga postlarning semantik yaqinligini tushunish imkonini beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dreyf-embeddingov.html\"&gt;Embeddinglar dreyfi&lt;/a&gt; — Modeldagi so'z yoki tokenlarni ifodalovchi sonli vektorlarning o'zgarishi. Dreyfning yo'qligi shuni anglatadiki, model tokenning ma'nosini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enkoder-dekoder.html\"&gt;Enkoder-dekoder&lt;/a&gt; — Neyrotarmoq arxitekturasi boʻlib, unda enkoder kiruvchi maʼlumotlarni (shaxmat pozitsiyasini) vektor koʻrinishiga keltirsa, dekoder uni…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beautiful.html\"&gt;Estetik baholash&lt;/a&gt; — Vizual ma’lumotlar asosida shahar muhitining jozibadorligini subyektiv idrok etishni belgilovchi metrika.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g1\"&gt;&lt;a href=\"reference/glossary.html#g1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G&lt;/span&gt;&lt;/a&gt;G&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/gacha-decoding.html\"&gt;Gacha Decoding&lt;/a&gt; — Til modellari tomonidan kontent yaratish usuli bo'lib, u o'zgaruvchanlik manbasini token entropiyasidan ko'rsatmalarga amal qilishga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/galahad.html\"&gt;Galahad&lt;/a&gt; — Katta til modellarining ishlashini tezlashtirish uchun diqqat holati va matn parchalarini saqlaydigan tizim.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/embodied-ai.html\"&gt;Gavdalangan sun’iy intellekt&lt;/a&gt; — Aqlli agentlar ko‘nikmalarni mashq qilish uchun virtual muhitlardan foydalangan holda jismoniy dunyo bilan o‘zaro ta’sir qilishni…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gomofiliya.html\"&gt;Gomofiliya&lt;/a&gt; — Ijtimoiy tarmoqdagi foydalanuvchilarning o'ziga o'xshash odamlar bilan birlashish va o'zaro aloqada bo'lish tendensiyasi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h\"&gt;&lt;a href=\"reference/glossary.html#h\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H&lt;/span&gt;&lt;/a&gt;H&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-computer-interaction.html\"&gt;HCI&lt;/a&gt; — Insonning kompyuter tizimlari bilan o‘zaro ta’sirini o‘rganuvchi, intuitiv va samarali interfeyslarni yaratishga qaratilgan bilim sohasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hdbscan.html\"&gt;HDBSCAN&lt;/a&gt; — Ilmiy da'volarning tematik guruhlarini ajratib olish va noyob hissalarni (\"shovqin\") ajratish uchun qo'llaniladigan zichlik klasterlash…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/heartbeat.html\"&gt;Heartbeat&lt;/a&gt; — Sessiya faolligini saqlab turish uchun modelga yuboriladigan avtomatik so'rov.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/konyunktsiya-bez-sohraneniya-sostoyaniya.html\"&gt;Holatni saqlamaydigan kon'yunksiya&lt;/a&gt; — Oldingi tekshiruvlar tarixini hisobga olmaydigan, joriy ma’lumotlarni alohida baholaydigan mantiqiy operatsiya.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i1\"&gt;&lt;a href=\"reference/glossary.html#i1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;I&lt;/span&gt;&lt;/a&gt;I&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/igenbench.html\"&gt;IGenBench&lt;/a&gt; — Faktlar aniqligini va yaratilayotgan infografika aniqligini baholash uchun foydalaniladigan ma'lumotlar to'plami va benhmark.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/or.html\"&gt;Imkoniyatlar nisbati&lt;/a&gt; — Bir guruhdagi hodisa ehtimoli boshqasiga nisbatan qanchalik yuqori yoki pastligini koʻrsatuvchi koʻrsatkich.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-context-learning.html\"&gt;In-context learning&lt;/a&gt; — Modelning vaznlarini o'zgartirmasdan, faqat promptdagi misollar yordamida vazifani bajarish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-sample-effekt.html\"&gt;In-sample effekt&lt;/a&gt; — Tizim oʻqitilgan yoki sozlangan maʼlumotlar asosida uning samaradorligini baholash boʻlib, bu koʻrsatkichlarni oshirib yuborishi mumkin.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/inferens.html\"&gt;Inferens&lt;/a&gt; — O‘qitilgan neyron tarmoqdan yangi ma’lumotlar bo‘yicha javob olish jarayoni.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infoagent.html\"&gt;InfoAgent&lt;/a&gt; — Infografika elementlarini bog'liqliklar grafi orqali ma'lumotlar manbalari bilan bog'laydigan va oldindan o'qitishsiz xatolarni lokal…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infographicbench-evidence.html\"&gt;InfoGraphicBench-Evidence&lt;/a&gt; — Tekshiriladigan dalillar asosida infografika yaratishning ishonchliligi va aniqligini baholash uchun mo'ljallangan 260 ta so'rovdan iborat…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/inspect.html\"&gt;Inspeksiya» (inspect) mexanizmi&lt;/a&gt; — Modelga dasturiy jihatdan tasvir qismlarini «yaqinlashtirib», asl o‘lchamda ko‘rinmaydigan mayda detallarni tahlil qilish imkonini beruvchi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ipsaemin.html\"&gt;ipSAEmin&lt;/a&gt; — Bashorat qilingan moslashuv xatosi metriki (0 dan 1 gacha), bunda 0,5 dan yuqori qiymatlar bog‘lanish interfeysining muvaffaqiyatli…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pipeline.html\"&gt;Ishchi jarayon&lt;/a&gt; — Model ma’lumotlarni oladigan, qayta ishlaydigan va muhitda harakatlarni bajaradigan avtomatlashtirilgan qadamlar ketma-ketligi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infographic-visual-description.html\"&gt;IVD&lt;/a&gt; — Haqiqiy ma'lumotlarni, dalillar manbalarini, xolst hududlarini va tekshirish qoidalarini belgilaydigan tiplashtirilgan bog'liqliklar grafi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/trace.html\"&gt;Iz»&lt;/a&gt; — Model o'z mulohazalarini «eslab qolish» uchun matnda qoldiradigan oraliq yozuvlar.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"j\"&gt;&lt;a href=\"reference/glossary.html#j\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;J&lt;/span&gt;&lt;/a&gt;J&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/parnyy-butstrepping.html\"&gt;Juftlik butstrepping&lt;/a&gt; — Ishonch intervallarini hisoblash uchun ma'lumotlarni qayta tanlashga asoslangan statistik usul.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k1\"&gt;&lt;a href=\"reference/glossary.html#k1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;K&lt;/span&gt;&lt;/a&gt;K&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/kalibench.html\"&gt;KaliBench&lt;/a&gt; — Kali Linux CLI vositalari uchun tabiiy tildagi so'rovlarni buyruqlarga aylantirishni baholash uchun maxsus benchmark va ma'lumotlar…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cell.html\"&gt;Katak»&lt;/a&gt; — Tajriba doirasida bajariladigan aniq vazifa va modelning birikmasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/klasterizatsiya.html\"&gt;Klasterlash&lt;/a&gt; — Klasterlash — bu oldindan belgilangan yorliqlarsiz, o'xshash belgilari yoki xulq-atvor namunalari asosida obyektlarni avtomatik ravishda…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/klasternyy-butstrep.html\"&gt;Klasterli bootstrap&lt;/a&gt; — Maʼlumotlarni guruhlarga ajratib, natijalarning tasodifiy emasligini tekshirish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/slepaya-razmetka.html\"&gt;Ko'r» belgilash&lt;/a&gt; — Baholovchi model qaysi tizim ma'lumotlarni yaratganini bilmaydigan baholash usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nekompensatornye-barery.html\"&gt;Kompensatsiyalanmaydigan to'siqlar&lt;/a&gt; — Bir sohadagi muvaffaqiyat boshqa muhim xavfsizlik tekshiruvidagi nosozlikni «yopa olmaydigan» shartlardir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/konyunktsiya.html\"&gt;Kon'yunksiya&lt;/a&gt; — Shart faqat barcha komponentlar rost bo'lganda bajarilgan deb hisoblanadigan mantiqiy operatsiya.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/konfaunder.html\"&gt;Konfaunder&lt;/a&gt; — Tadqiqot natijalarini buzib koʻrsatishi va oʻzgaruvchilar oʻrtasida soxta bogʻliqlikni keltirib chiqarishi mumkin boʻlgan qoʻshimcha omil.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kontekstnaya-chuvstvitelnost.html\"&gt;Kontekst sezgirligi&lt;/a&gt; — Modelning atrof-muhitga qarab instrumentni ishlatish yoki ishlatmaslikni ajrata olish qobiliyati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kortezh.html\"&gt;Kortej&lt;/a&gt; — Tizim ishlashi uchun belgilanishi kerak bo'lgan parametrlar to'plamining matematik ifodasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mas.html\"&gt;Koʻp agentli tizim&lt;/a&gt; — Bir nechta mustaqil dasturiy agentlarning murakkab vazifani hal qilish uchun oʻzaro hamkorlik qilishi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/karta-navykov.html\"&gt;Ko‘nikma kartasi&lt;/a&gt; — Dizayn shablonining tuzilgan tavsifi bo‘lib, tizimga ma’lumotlar mantig‘ini buzmagan holda elementlarni qanday joylashtirishni tushunishga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/slepaya-annotatsiya.html\"&gt;Ko‘r-ko‘rona annotatsiya&lt;/a&gt; — Ma’lumotlarni belgilovchi ekspertlar tadqiqot maqsadlaridan bexabar bo‘lgan baholash usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/key-value-cache.html\"&gt;KV-kesh&lt;/a&gt; — Matn bloklari uchun model tomonidan hisoblangan diqqat kalitlari va qiymatlarini o'z ichiga olgan ma'lumotlar to'plami.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/quantization.html\"&gt;Kvantlash&lt;/a&gt; — Model vaznlarini saqlashda aniqlikni pasaytirish, bu juda kichik o‘zgarishlarning yo‘qolishiga olib kelishi mumkin.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l\"&gt;&lt;a href=\"reference/glossary.html#l\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;L&lt;/span&gt;&lt;/a&gt;L&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/lifo.html\"&gt;LIFO&lt;/a&gt; — Navbatni qayta ishlash usuli bo‘lib, unda eng oxirgi kelgan vazifa birinchi bo‘lib bajariladi, bu tizimga eng yangi va dolzarb voqealarga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/litereality-agent.html\"&gt;LiteReality-Agent&lt;/a&gt; — RGB-D xonalar skanerlarini bajariladigan Python kodi yozish orqali interaktiv 3D sahnalarga aylantiruvchi agent tizimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; — Ilmiy matnlarni yaratish va ularning tuzilishini tahlil qilish uchun ishlatiladigan sun'iy intellekt tizimlari.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/logit-lens.html\"&gt;Logit lens&lt;/a&gt; — Javob shakllanish jarayonini kuzatish uchun modelning turli qatlamlaridagi tokenlar ehtimolligini tahlil qilish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt; — LoRA (Low-Rank Adaptation) — bu neyron tarmoqlarni samarali sozlash usuli bo'lib, unda vaznlarning faqat kichik bir qismi o'qitiladi, bu…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/local-real-task-agent-benchmark.html\"&gt;LRAB&lt;/a&gt; — Kichik til modellarining real vazifalarni bajarishdagi samaradorligiga ijro muhitining ta'sirini baholash uchun nazorat qilinadigan tajriba.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m\"&gt;&lt;a href=\"reference/glossary.html#m\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M&lt;/span&gt;&lt;/a&gt;M&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/masshtabirovanie.html\"&gt;Masshtablash&lt;/a&gt; — Model sifatining ma'lumotlar hajmi va hisoblash quvvatiga bog'liqligi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/otravlenie-dannyh.html\"&gt;Maʼlumotlarni zaharlash&lt;/a&gt; — Modelning haqiqiy javoblari va qaror qabul qilish mantig'ini buzish uchun o'quv tanloviga noto'g'ri ma'lumotlarni kiritish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/medical-subject-headings.html\"&gt;MeSH&lt;/a&gt; — Ilmiy maqolalarni indekslash uchun boshqariladigan lugʻat tizimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/messy-zaprosy.html\"&gt;Messy» so‘rovlar&lt;/a&gt; — Modelning shovqinni e’tiborsiz qoldirib, vazifa mohiyatiga e’tibor qaratish qobiliyatini tekshirish uchun grammatik xatolar va buzilgan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mimic-iv.html\"&gt;MIMIC-IV&lt;/a&gt; — Reanimatsiyada til modellarining ishlashini baholash uchun foydalanilgan 2000 nafar bemorning klinik ko'rsatkichlari ma'lumotlar bazasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mingbird.html\"&gt;Mingbird&lt;/a&gt; — Windows va Ollama uchun mahalliy agent tizimi, kichik til modellarining odatiy xatolaridan himoya qilish mexanizmlarini o'z ichiga oladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt; — Simulyatsiya uchun tayyor 3D sahnalar eksport qilinadigan fizik modellashtirish uchun dasturiy muhit.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-lora.html\"&gt;Multi-LoRA&lt;/a&gt; — Neyron tarmoqlarni samarali sozlash usuli bo‘lib, u bitta bazaviy modelda bir nechta ixtisoslashgan adapterlarni ishga tushirish imkonini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodalnaya-model.html\"&gt;Multimodal model&lt;/a&gt; — Matn va tasvir kabi turli xil ma’lumotlar turlarini bir vaqtning o‘zida qayta ishlash va solishtirish qobiliyatiga ega neyron tarmoq.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anchoring.html\"&gt;Mustahkamlash&lt;/a&gt; — Tizimli ko'rsatmalarni modelga har bir so'rovda majburiy takrorlash orqali kontekstni ushlab turish usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n1\"&gt;&lt;a href=\"reference/glossary.html#n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;N&lt;/span&gt;&lt;/a&gt;N&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/nats.html\"&gt;Natlar&lt;/a&gt; — Modelning ishonchini baholash uchun ishlatiladigan axborot oʻlchov birligi: qiymat qanchalik yuqori boʻlsa, modelning muayyan tokenga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sft.html\"&gt;Nazorat ostida nozik sozlash&lt;/a&gt; — Nazorat ostida nozik sozlash (SFT) — bu modelni muayyan vazifalarga moslashtirish va kerakli xatti-harakatlarni majburiy belgilash uchun…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/near-miss-prompty.html\"&gt;Near-miss» prompatlar&lt;/a&gt; — Maqsadli so'rovlarga juda yaqin, ammo kichik farqlarga ega bo'lgan, modelning xatolarga chidamliligini tekshiruvchi so'rovlar.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nih-exporter.html\"&gt;NIH ExPORTER&lt;/a&gt; — AQSH Milliy sog'liqni saqlash institutlari tomonidan taqdim etiladigan grantlarning nomlari, annotatsiyalari va byudjetlari haqidagi…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-maximum-suppression.html\"&gt;No-maksimal bostirish&lt;/a&gt; — Bir xil obyekt uchun bir nechta bashoratlarni o‘chirib, faqat eng ishonchli variantni qoldiradigan algoritmdir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neopredelennost-proishozhdeniya-kandidata.html\"&gt;Nomzod kelib chiqishining noaniqligi&lt;/a&gt; — Ob'ektlarni hisoblash vazifalarida neyron tarmoq takrorlanuvchi fon elementlarini noto'g'ri qidirilayotgan ob'ektlar deb qabul qiladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/normalizatsiya.html\"&gt;Normallashtirish&lt;/a&gt; — Maʼlumotlarni yagona standartga keltirish, shunda turli modellar ular bilan umumiy shablon asosida ishlay oladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/point-supervision.html\"&gt;Nuqtali nazorat&lt;/a&gt; — Tasvirlarni izohlash usuli, bunda har bir ob'ekt uning markazida bitta nuqta bilan belgilanadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p1\"&gt;&lt;a href=\"reference/glossary.html#p1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P&lt;/span&gt;&lt;/a&gt;P&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/p-first.html\"&gt;P-first&lt;/a&gt; — Modelning javobni shakllantirishdagi ishonch darajasi; 1 ga yaqin qiymatlar yuqori determinizmni bildiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/panelnoe-issledovanie.html\"&gt;Panel tadqiqoti&lt;/a&gt; — Bir xil respondentlar maʼlum vaqt oraligʻida bir necha marta soʻrovdan oʻtkaziladigan maʼlumot yigʻish usuli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pangram-3-3-2.html\"&gt;Pangram 3.3.2&lt;/a&gt; — Xatolik darajasi past bo'lgan ixtisoslashgan klassifikator: noto'g'ri ijobiy natija 0,05%, noto'g'ri salbiy natija esa 1,99% ni tashkil…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pass-1.html\"&gt;pass@1&lt;/a&gt; — Birinchi urinishda toʻgʻri bajarilgan vazifalar ulushini baholovchi metrika.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/personal-data-server.html\"&gt;PDS&lt;/a&gt; — Foydalanuvchining shaxsiy maʼlumotlarini saqlovchi markazlashtirilmagan server boʻlib, unga ochiq protokol orqali kirish mumkin.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perpleksiya.html\"&gt;Perpleksiya&lt;/a&gt; — Modelning keyingi tokenni qanchalik aniq bashorat qila olishini baholovchi metrika; qiymat qanchalik past bo‘lsa, model o‘z bashoratlarida…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/projected-gradient-descent.html\"&gt;PGD-hujum&lt;/a&gt; — Modelning yo'qotish funksiyasini minimallashtirish orqali raqobatbardosh buzilishlarni yaratish uchun ishlatiladigan iterativ…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nesovmestimost-platformy.html\"&gt;Platforma mos kelmasligi&lt;/a&gt; — Dasturiy muhit (masalan, Windows) boshqa tizim (masalan, Unix) uchun moʻljallangan buyruqlarni tushunmasligi natijasida yuzaga keladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polinomialnye-krossy.html\"&gt;Polinomial krosslar&lt;/a&gt; — Mavjud xususiyatlarni ko‘paytirish orqali yangi xususiyatlarni yaratish usuli bo‘lib, u modelga belgilar o‘rtasidagi murakkab…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/position-bias.html\"&gt;Position bias&lt;/a&gt; — Modelning nomzodlarning haqiqiy sifatiga emas, balki ularning joylashuv tartibiga ustunlik berishga moyilligi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pozitsionnoe-smeschenie.html\"&gt;Pozitsion siljish&lt;/a&gt; — Modelning mazmunidan qat’i nazar, ro‘yxatdagi ma’lum bir o‘rinda turgan natijani afzal ko‘rish moyilligi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prefill.html\"&gt;Prefill&lt;/a&gt; — Prefill — bu model javobni yaratishdan oldin qayta ishlaydigan ma'lumotlar hajmi bo'lib, u javobning formati yoki ohangini belgilaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proksi-pokazatel.html\"&gt;Proksi-koʻrsatkich&lt;/a&gt; — Oʻrganilayotgan xususiyatni toʻgʻridan-toʻgʻri oʻlchash qiyin boʻlganda qoʻllaniladigan bilvosita metrikadir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pskip.html\"&gt;Pskip&lt;/a&gt; — Modelning vositani chaqirish ehtimolini baholash uchun ishlatiladigan metrika bo'lib, u zondlash aniqligini buzishi mumkin bo'lgan…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"q\"&gt;&lt;a href=\"reference/glossary.html#q\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q&lt;/span&gt;&lt;/a&gt;Q&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/step.html\"&gt;Qadam&lt;/a&gt; — CARS (Create a Research Space) modeliga koʻra, kirish qismining funksional elementi, masalan, «tadqiqotning ahamiyatini asoslash» yoki…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/black-box.html\"&gt;Qora quti» (black-box) usuli&lt;/a&gt; — Tizimning ichki algoritmlariga kirmasdan, faqat kirish va chiqish ma'lumotlarini tahlil qilish yondashuvi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/quality-explanation-and-evaluation-network.html\"&gt;QUEEN&lt;/a&gt; — Shaxmat dvigateli va til modelini birlashtirib, yurishlarni va ularning matnli asoslarini yaratish uchun mo'ljallangan enkoder-dekoder…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sandbox.html\"&gt;Qum qutisi&lt;/a&gt; — Kodni xavfsiz muhitda bajarib, uning haqiqiy ishlash qobiliyatini tekshirish imkonini beruvchi izolyatsiya qilingan tizim.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/qwk.html\"&gt;QWK&lt;/a&gt; — Baholovchilar o‘rtasidagi kelishuv darajasini o‘lchaydigan statistik ko‘rsatkich bo‘lib, 0.6 dan yuqori qiymatlar yuqori ishonchlilikni…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r1\"&gt;&lt;a href=\"reference/glossary.html#r1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;R&lt;/span&gt;&lt;/a&gt;R&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/r.html\"&gt;r&lt;/a&gt; — O‘qitish tanlamasidagi AI matnining inson matniga nisbatan koeffitsiyenti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rejectors.html\"&gt;Rad etuvchilar&lt;/a&gt; — Eslatmalarni foydalanuvchilar baholashiga yuborishdan oldin ularning sifatini tekshiradigan algoritmlardir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/retrieval-augmented-generation.html\"&gt;RAG&lt;/a&gt; — RAG (Retrieval-Augmented Generation) — bu model avval tashqi manbalardan ma'lumot qidiradigan va keyin ular asosida javob yaratadigan usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rcdc.html\"&gt;RCDC&lt;/a&gt; — NIH grantlarini ariza matnini tahlil qilish asosida 300 dan ortiq toifalarga avtomatik tasniflash tizimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recast.html\"&gt;ReCast&lt;/a&gt; — Maxfiy ma'lumotlarni himoya qilish tizimi, u bulutli neyron tarmoqlarda xavfsiz qayta ishlash uchun kirish fayllarini mohiyat va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/regret.html\"&gt;Regret&lt;/a&gt; — Model tanlagan variant sifati va berilgan to'plamdagi maksimal mumkin bo'lgan sifat o'rtasidagi farqni ko'rsatuvchi metrika.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rekursiya.html\"&gt;Rekursiya&lt;/a&gt; — Har bir keyingi qiymat oldingisiga bog‘liq bo‘lgan hisoblash usuli bo‘lib, u qidiruv natijalaridagi teskari aloqani modellashtirishga imkon…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/remhr.html\"&gt;REMHR&lt;/a&gt; — Ozchiliklar salomatligiga qaratilgan loyihalarga beriladigan kategoriya. U maʼlumotlarni tabaqalashtirish uchun irqiy yoki etnik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgb-d-skany.html\"&gt;RGB-D skanerlash&lt;/a&gt; — Sahnaning geometriyasini tiklash uchun ishlatiladigan rang (RGB) va chuqurlik (D) ma'lumotlarini o'z ichiga olgan skanerlash ma'lumotlari.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/relative-human-action-efficiency.html\"&gt;RHAE&lt;/a&gt; — Agent samaradorligi ko'rsatkichi, bunda 100% agent va inson harakatlari sonining tengligini, 100% dan yuqori qiymatlar esa yuqoriroq…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/room-py.html\"&gt;Room.py&lt;/a&gt; — 3D sahnadagi ob'ektlarning geometriyasi, fizik xususiyatlari va fazoviy aloqalarini tavsiflovchi bajariladigan Python fayli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t\"&gt;&lt;a href=\"reference/glossary.html#t\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T&lt;/span&gt;&lt;/a&gt;T&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/taliesin.html\"&gt;Taliesin&lt;/a&gt; — Galahad tizimining matn bloklari uchun KV-holatini saqlash va yuklash uchun javobgar komponenti.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/persona-anchoring.html\"&gt;Tizimli bogʻlash&lt;/a&gt; — Agent oʻzligini tizim koʻrsatmalari darajasida mustahkamlash usuli boʻlib, u «shaxsiyat»ni xabarlar tarixidagi shunchaki matndan ajratib…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sistemnyy-prompt.html\"&gt;Tizimli prompt&lt;/a&gt; — AI agentining roli va identifikatsiyasini tizim darajasida belgilovchi ko'rsatma.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pryamoy-effekt.html\"&gt;To'g'ridan-to'g'ri ta'sir&lt;/a&gt; — Standart testlar bashorat qiladigan narsa, teskari aloqa esa tizim javoblari foydalanuvchi xatti-harakatini o'zgartirganda yuzaga keladigan…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recall.html\"&gt;Toʻliqlik&lt;/a&gt; — Modelning barcha tegishli holatlarni (masalan, barcha hujumlarni) topa olish qobiliyati, FPR (false positive rate) esa notoʻgʻri ijobiy…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tokens-per-parameter.html\"&gt;TPPh&lt;/a&gt; — Modelning o‘qitilish darajasini belgilovchi ko‘rsatkich.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tranzaktsionnyy-remont.html\"&gt;Transaksion ta'mirlash&lt;/a&gt; — Infografikadagi xatolarni tuzatish usuli, bunda bog'liqliklar grafi asosida tasvirni to'liq qayta yaratmasdan faqat ta'sirlangan elementlar…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/triggernaya-ataka.html\"&gt;Triggerli hujum&lt;/a&gt; — Neyron tarmoqqa taʼsir qilish usuli boʻlib, unda model faqat oldindan belgilangan «kodli soʻz» yoki belgi qabul qilinganda maʼlum bir…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v1\"&gt;&lt;a href=\"reference/glossary.html#v1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;V&lt;/span&gt;&lt;/a&gt;V&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/vendi-score.html\"&gt;Vendi Score&lt;/a&gt; — Generatsiya qilingan ma'lumotlarning embeddinglari orasidagi masofani o'lchashga asoslangan javoblar xilma-xilligini baholash metriksidir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vida-geo.html\"&gt;VIDA-GEO&lt;/a&gt; — Shahar infratuzilmasini shaharsozlik normalarini hisobga olgan holda realistik vizual o'zgartirishlar yaratish uchun sun'iy yo'ldosh va…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/visual-harness-for-reasoning.html\"&gt;VISTA&lt;/a&gt; — Multimodal modellar uchun qo'shimcha tizim bo'lib, harakatlarni rejalashtirish uchun yo'qotishsiz uzoq muddatli vizual xotirani ta'minlaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sintez-vizualno-simvolicheskih-programm.html\"&gt;Vizual-ramziy dasturlash&lt;/a&gt; — Grafik elementlarni kod va ma'lumotlar bilan bog'lash usuli bo'lib, u tasvirni dastur kabi tahrirlash imkonini beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vizualnaya-inspektsiya.html\"&gt;Vizual tekshiruv&lt;/a&gt; — Agentning o'tgan kadrlarning qismlarini batafsil o'rganish yoki turli vaqt nuqtalarida muhit holatlarini solishtirish uchun vositasi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt; — Vision-Language Models (VLM) — bu tasvir va matnni bir vaqtning o'zida tahlil qila oladigan, vizual kontentni baholash va u bilan o'zaro…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/validnost-vyzova-instrumentov.html\"&gt;Vosita chaqiruvining validligi&lt;/a&gt; — Modelning dasturiy muhit tushunadigan formatda (masalan, JSON-sxema) buyruqlar generatsiya qilish qobiliyati.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"w\"&gt;&lt;a href=\"reference/glossary.html#w\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;W&lt;/span&gt;&lt;/a&gt;W&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/wall-clock-time.html\"&gt;Wall-clock time&lt;/a&gt; — Vazifa boshlanishidan tugashigacha oʻtgan haqiqiy vaqt, barcha tizim kechikishlarini oʻz ichiga oladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kod-uolsha-adamara.html\"&gt;Walsh-Hadamard kodi&lt;/a&gt; — Maʼlumotlarni kodlash usuli boʻlib, kodlar orasidagi masofa (mos kelmaydigan bitlar soni) xatolarni tuzatishga imkon beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wildai.html\"&gt;WildAI&lt;/a&gt; — Insonlar tomonidan yozilgan matnlar va sun'iy intellekt tomonidan yaratilgan matnlarga bo'lingan veb-kontentdan iborat ma'lumotlar korpusi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"x\"&gt;&lt;a href=\"reference/glossary.html#x\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;X&lt;/span&gt;&lt;/a&gt;X&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/error-injection.html\"&gt;Xatolarni kiritish&lt;/a&gt; — Sun’iy intellektning barqarorligini tekshirish usuli bo‘lib, unda ma’lumotlarga ataylab xato kiritiladi va modelning shovqinli muhitda…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cyber-kill-chain.html\"&gt;Xavfsizlik bosqichlari&lt;/a&gt; — Kiberhujumning bosqichma-bosqich modelidir.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"y\"&gt;&lt;a href=\"reference/glossary.html#y\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Y&lt;/span&gt;&lt;/a&gt;Y&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/idt.html\"&gt;Yashirin raqamli egizak&lt;/a&gt; — Qimmatbaho simulyatsiyalarni o'tkazmasdan shahar o'zgarishlari bo'yicha gipotezalarni tekshirish uchun generativ modellar va ekspert…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dikiy-ii-tekst.html\"&gt;Yovvoyi» AI-matn&lt;/a&gt; — Neyrotarmoqlar tomonidan yaratilgan va internetda tabiiy ravishda uchraydigan, maxsus belgisiz o'quv to'plamlariga tushadigan kontent.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/loss.html\"&gt;Yo‘qotishlar funksiyasi&lt;/a&gt; — Neyrotarmoq bashorati va ajratilgan tanlamadagi real ma'lumotlar o'rtasidagi farqni o'lchaydigan model xatolik ko'rsatkichi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soft-miss.html\"&gt;Yumshoq xato»&lt;/a&gt; — Model vositani chaqirish zarurligini to‘g‘ri aniqlagan, ammo buyruq parametrlari yoki sintaksisida xatoga yo‘l qo‘ygan holat.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z\"&gt;&lt;a href=\"reference/glossary.html#z\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Z&lt;/span&gt;&lt;/a&gt;Z&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/rezervnoe-kopirovanie.html\"&gt;Zaxira nusxalash&lt;/a&gt; — Xatolik yuz berganda ishchi holatga qaytish uchun o'zgarishlar kiritishdan oldin fayl nusxasini yaratishdir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mirroring.html\"&gt;Zerkalirovanie&lt;/a&gt; — Modelning kirish soʻrovi uslubi yoki tuzilishini, hatto javob mazmuni uchun kerak boʻlmasa ham, nusxalashga moyilligidir.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/probes.html\"&gt;Zondlar&lt;/a&gt; — Neyron tarmoqning ichki holatlarini tahlil qilib, uning javoblari rostligini aniqlaydigan qo'shimcha klassifikator.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/probing.html\"&gt;Zondlash&lt;/a&gt; — Neyron tarmoqning ichki holatlarini tahlil qilish usuli boʻlib, unda model aktivatsiyalaridan maʼlum bir maʼlumotni (masalan, «rost» yoki…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z1\"&gt;&lt;a href=\"reference/glossary.html#z1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;З&lt;/span&gt;&lt;/a&gt;З&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/knapsack-problem.html\"&gt;Задача о рюкзаке&lt;/a&gt; — Javob tuzilishi modelga yashirin hisob-kitoblar uchun ma'lumotlarni osonlikcha kiritish va yashirish imkonini beruvchi test topshirig'i.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/response-mirroring.html\"&gt;Зеркальное отражение ответов&lt;/a&gt; — Modelning kirish so'rovi registrini yoki uslubini aks ettirish darajasi, bu no-semantik shovqinlarni nusxalashda tasodifiy beqarorlik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/first-token-probing.html\"&gt;Зондирование первого токена&lt;/a&gt; — Modelning kerakli pozitsiyada vositani chaqirish maxsus tokenini yaratishning aprior ehtimolini baholashning diagnostik usuli.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l1\"&gt;&lt;a href=\"reference/glossary.html#l1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Л&lt;/span&gt;&lt;/a&gt;Л&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/paternalism-trap.html\"&gt;Ловушка патернализма&lt;/a&gt; — Modelning xolis bo'lishga urinib, sovuq va begonalashgan holatga tushib qolishi hamda foydalanuvchining hissiy kontekstini e'tiborsiz…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spurious-correlation.html\"&gt;Ложная корреляция&lt;/a&gt; — Javobning rostligi va nutq uslubi yoki ko'rsatmalarga rioya qilish kabi qo'shimcha omillar o'rtasidagi statistik bog'liqlik.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m1\"&gt;&lt;a href=\"reference/glossary.html#m1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;М&lt;/span&gt;&lt;/a&gt;М&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/macro-accuracy.html\"&gt;Макро-точность&lt;/a&gt; — Model sifatini baholash metriki, bunda har bir vazifaga undagi savollar sonidan qat'i nazar teng vazn beriladi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/evidence-validated-longitudinal-update.html\"&gt;Метод EVLU&lt;/a&gt; — Model prognozlarini yangilashni filtrlash usuli, u xato tuzatishlarni chiqarib tashlaydi, lekin ma'lumotlar tahlilining to'liqligini…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-turn-attack.html\"&gt;Многоходовая атака&lt;/a&gt; — AI agentlariga qarshi kiberhujum turi bo'lib, unda zararli niyatlar xavfsizlik filtrlarini chetlab o'tish uchun uzun harakatlar zanjirida…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/audit-module.html\"&gt;модуль Audit&lt;/a&gt; — COBICount-dagi vizual nazoratning yordamchi bloki, tarmoqning ichki belgilarini zichlikni hisoblashga ta'sir qilmasdan sinflar kanallariga…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chain-of-thought-monitoring.html\"&gt;Мониторинг цепочек рассуждений&lt;/a&gt; — AI xavfsizligini nazorat qilish usuli, bunda modelning shubhali xatti-harakatlarini aniqlash uchun uning fikrlash matni tahlil qilinadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-agent-approach.html\"&gt;Мультиагентный подход&lt;/a&gt; — Tizim arxitekturasi bo'lib, unda alohida agentlar (rejalashtiruvchi, siyosat agenti, generator) shahar muhitiga asosli o'zgartirishlar…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodal-large-language-models-mllm.html\"&gt;Мультимодальные языковые модели&lt;/a&gt; — Matnli ko'rsatmalarni talqin qilish va ularni voqealar tarixidagi vizual ma'lumotlar bilan bog'lash uchun vosita.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soft-metrics.html\"&gt;Мягкие метрики&lt;/a&gt; — Xavfni baholash uchun jamlanadigan, ammo muhim harakatlarga ruxsat berish uchun yetarli asos bo'lmagan modelning unumdorlik yoki…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t1\"&gt;&lt;a href=\"reference/glossary.html#t1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т&lt;/span&gt;&lt;/a&gt;Т&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/word-targeting.html\"&gt;Таргетирование слов&lt;/a&gt; — Grant arizasi matnidan muayyan atamalarni olib tashlash mexanizmi, bu loyihani statistik mavzuli toifalardan chiqarib tashlashga olib…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/signal-detection-theory.html\"&gt;Теория обнаружения сигналов&lt;/a&gt; — Subyektning haqiqiy va yolg'on bayonotlarni farqlash qobiliyatini baholash uchun statistik usul.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-execution-accuracy.html\"&gt;Точность выполнения команд&lt;/a&gt; — Model ish sifati ko'rsatkichi, komponentlar bo'yicha baholanadi: vositani tanlash, ixtiyoriy bayroqlar va pozitsion argumentlarning…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u1\"&gt;&lt;a href=\"reference/glossary.html#u1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У&lt;/span&gt;&lt;/a&gt;У&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/guess-the-capital.html\"&gt;Угадай столицу&lt;/a&gt; — Modelning mantiqiga noto'g'ri ma'lumotlarning ta'sirini baholashning eksperimental usuli, bunda u aniqlashtiruvchi savollarga javoblar…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polya-urn.html\"&gt;урна Пойи&lt;/a&gt; — Kuchaytirish jarayonlari nazariyasidagi stoxastik model; tadqiqotda manbalar ko'rinishining to'planishi va muloqotda e'tiborni egallash…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attack-success-rate.html\"&gt;Уровень успешности атак&lt;/a&gt; — Tizimga qilingan muvaffaqiyatli hujumlar ulushini aks ettiruvchi himoya samaradorligi metri.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f1\"&gt;&lt;a href=\"reference/glossary.html#f1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ф&lt;/span&gt;&lt;/a&gt;Ф&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/agreement-gate.html\"&gt;Фильтр согласованности&lt;/a&gt; — Neyron tarmoqlarni audit qilish usuli, bunda qaror faqat model nomzodlar tartibi o'zgarganda bir xil variantni tanlagandagina qabul…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/figs-framework.html\"&gt;Фреймворк FIGS&lt;/a&gt; — Til modellarini baholash tizimi bo'lib, faktologik aniqlik va empatiya o'rtasidagi muvozanatni tekshirish uchun 10 bosqichli simulyatordan…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c1\"&gt;&lt;a href=\"reference/glossary.html#c1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ц&lt;/span&gt;&lt;/a&gt;Ц&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/observation-editing-verification-loop.html\"&gt;Цикл «наблюдение–редактирование–верификация»&lt;/a&gt; — Agent ma'lumotlarni tahlil qiladigan, sahna dasturiy kodini tuzatadigan va natijalarni renderlash hamda geometrik testlar orqali…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/observe-edit-verify-cycle.html\"&gt;Цикл «наблюдение-редактирование-проверка»&lt;/a&gt; — Agent ma'lumotlarni tahlil qiladigan, sahna dasturiy kodini tuzatadigan va fizik ishonchlilikni ta'minlash uchun geometrik testlarni…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/digital-trace-data.html\"&gt;Цифровые следы&lt;/a&gt; — Qurilmalarda qayd etilgan foydalanuvchining tarmoqdagi faoliyati to'g'risidagi ob'ektiv ma'lumotlar.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ch\"&gt;&lt;a href=\"reference/glossary.html#ch\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ч&lt;/span&gt;&lt;/a&gt;Ч&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/fail-rate.html\"&gt;Частота неудач&lt;/a&gt; — Baholash sinovlaridagi asosiy ko'rsatkich bo'lib, model javoblari 2 va undan yuqori ball olgan ssenariylarning ulushini ifodalaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensitivity.html\"&gt;Чувствительность&lt;/a&gt; — Signal va shovqinni farqlash qobiliyatining 0 dan 1 gacha bo'lgan ko'rsatkichi.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"327 ta tushuncha"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Lug'at A–Z","de
