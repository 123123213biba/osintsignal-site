            {"data":{"leading":false,"html":"&lt;p&gt;15 ta tushuncha&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/stateless-inference.html\"&gt;Безгосударственный инференс&lt;/a&gt; — Til modelining har bir yangi so'rov uchun diqqat holatini qaytadan hisoblaydigan ishlash rejimi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dissociation.html\"&gt;Диссоциация&lt;/a&gt; — AI agentining belgilangan rolni yo'qotib, o'zini bazaviy model sifatida identifikatsiya qila boshlaydigan holati.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/response-mirroring.html\"&gt;Зеркальное отражение ответов&lt;/a&gt; — Modelning kirish so'rovi registrini yoki uslubini aks ettirish darajasi, bu no-semantik shovqinlarni nusxalashda tasodifiy beqarorlik…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/encoded-reasoning.html\"&gt;Кодированные рассуждения&lt;/a&gt; — Mantiq o'qib bo'lmaydigan, ammo ochiq formatda taqdim etiladigan model hisoblash shakli.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/paternalism-trap.html\"&gt;Ловушка патернализма&lt;/a&gt; — Modelning xolis bo'lishga urinib, sovuq va begonalashgan holatga tushib qolishi hamda foydalanuvchining hissiy kontekstini e'tiborsiz…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spurious-correlation.html\"&gt;Ложная корреляция&lt;/a&gt; — Javobning rostligi va nutq uslubi yoki ko'rsatmalarga rioya qilish kabi qo'shimcha omillar o'rtasidagi statistik bog'liqlik.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-turn-attack.html\"&gt;Многоходовая атака&lt;/a&gt; — AI agentlariga qarshi kiberhujum turi bo'lib, unda zararli niyatlar xavfsizlik filtrlarini chetlab o'tish uchun uzun harakatlar zanjirida…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scientific-drift.html\"&gt;Наукометрический дрейф&lt;/a&gt; — Vaqt o'tishi bilan ma'lum bir sohadagi ilmiy tadqiqotlar yo'nalishi va metodologiyasining o'zgarishi, tematik klasterlarning tilga olinish…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/train-inference-gap.html\"&gt;разрыв между обучением и
