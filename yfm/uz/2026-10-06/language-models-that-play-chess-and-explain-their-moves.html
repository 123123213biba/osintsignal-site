        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"214\" cy=\"130\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"546\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · FACT_CHECK   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Shaxmat dvigatellari nima&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;uchun jim: sun'iy&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;intellektni tushuntirishga&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o'rgatamiz&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f2.jpg\" alt=\"2-rasm: Biz Flamingo (Alayrac et al., 2022) asosida yaratilgan enkoder-dekoder arxitekturasidan foydalanamiz. Enkoder si\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Biz Flamingo (Alayrac et al., 2022) asosida yaratilgan &lt;a href=\"concepts/enkoder-dekoder.html\"&gt;enkoder-dekoder&lt;/a&gt; arxitekturasidan foydalanamiz. Enkoder sifatida Lc0 shaxmat neyron tarmogʻi, dekoder sifatida esa koʻrsatmalar asosida sozlangan til modeli ishlatiladi. Lc0ʼning k-qatlami embeddinglari til modelining 2k-qatlami oldiga kiritilgan Flamingo blokiga uzatiladi va &lt;a href=\"concepts/adaptatsiya-domenov.html\"&gt;domen adaptatsiyasi&lt;/a&gt; jarayonida barcha oldindan oʻrgatilgan parametrlar muzlatiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Zamonaviy shaxmat dvigatellari superinsoniy darajada o'ynaydi, lekin o'z qarorlarini izohlay olmaydi. Prinston tadqiqotchilari 4 milliard parametrli &lt;a href=\"concepts/quality-explanation-and-evaluation-network.html\"&gt;QUEEN&lt;/a&gt; modelini taqdim etishdi, u ekspert shaxmat enkoderini til dekoderi bilan birlashtiradi. Iterativ o'qitish tufayli model grossmeyster darajasiga yetdi va shu bilan birga aniq tushuntirishlar bera oladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;QUEEN modeli 2697 Elo reytingiga erishdi, bu grossmeyster darajasiga teng.&lt;/li&gt;\n&lt;li&gt;Iterativ distillash modelning Elo reytingini yetti siklda 900 punktga oshirdi.&lt;/li&gt;\n&lt;li&gt;Arxitektura Lc0 ekspert dvigatelini kross-attention orqali til dekoderi bilan bog'laydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;QUEEN arxitekturasi «jim ekspert» prinsipidan foydalanadi: Lc0 (Leela Chess Zero) dvigateli bazasidagi enkoder shaxmat konsepsiyalarini kross-attention (o'zaro diqqat) mexanizmi orqali til modeliga uzatadi. O'qitish ikki bosqichda amalga oshiriladi: avval taxta holatlarini tushunish uchun «savol-javob» dasturi, so'ngra Bellman tenglamasidan ilhomlangan iterativ distillash algoritmi. Yetti iteratsiya davomida model o'z reytingini 900 punktga oshirib, 2697 Elo darajasiga yetdi.&lt;/p&gt;\n&lt;p&gt;Tizim uchta mezon bo'yicha baholanadi: aniqlik (o'yin kuchi), asoslanganlik (taktik vazifalar) va izchillik (matn sifati). Testlarda QUEEN GPT-5.6-Sol va Gemini-3.1-Pro kabi modellardan ustun keldi, garchi u ancha kamroq parametrlarga ega bo'lsa ham. Bu usul tor ixtisoslashgan «qora quti» tizimlarini til modellari bilan bog'lash imkonini beradi, bu esa robototexnika va boshqa murakkab sohalarda tushunarli sun'iy intellekt yaratishga yo'l ochadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shaxmat muhiti bilan cheklangan va tushuntirishlar sifati bazaviy ekspert enkoderining hisoblash quvvatiga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Zamonaviy shaxmat dvigatellari oʻta yuqori darajada oʻynaydi, ammo ular oʻz qarorlarining mantiqini tushuntirib bera olmaydi. Til modellari (&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;) esa tushunarli matnlar yarata oladi, biroq ularning oʻyin darajasi past. Mualliflar QUEEN modelini taqdim etishdi — bu 4 milliard parametrli shaxmat til modeli boʻlib, u grossmeyster darajasidagi oʻyinni tushuntirish qobiliyati bilan birlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN modeli 7 ta iteratsiya davomida oʻz reytingini 900 punktga oshirib, 2697 Elo darajasiga yetdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ishlab chiquvchilar «enkoder-dekoder» arxitekturasidan foydalanishdi. U ixtisoslashgan shaxmat enkoderini («soqov ekspert») koʻrsatmalarga moslashtirilgan til modeli bilan kross-attention mexanizmi orqali bogʻlaydi. Oʻqitish «savol-javob» dasturi asosida amalga oshiriladi, bu modelga shaxmat tushunchalarini toʻgʻridan-toʻgʻri enkoder tasvirlaridan olish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Enkoder-dekoder — bu neyrotarmoq arxitekturasi boʻlib, unda enkoder kiruvchi maʼlumotlarni (shaxmat pozitsiyasini) vektor koʻrinishiga keltirsa, dekoder uni inson tushunadigan matnga oʻgiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tushuntirishlar sifatini oshirish uchun mualliflar Bellman tenglamasiga oʻxshash iterativ distillash algoritmini qoʻllashdi. Model oʻzining eng yaxshi yurishlaridan keyingi pozitsiyalarni tahlil qiladi, ularni matnli izohga birlashtiradi va bu tajribani oʻz vaznlariga qayta distillaydi. Yetti iteratsiya davomida model reytingi 1782 dan 2697 Elo gacha koʻtarildi. QUEEN oʻyin kuchi va shaxmat masalalarini yechish aniqligi boʻyicha barcha raqobatchilardan ustun keldi, garchi uning parametrlari soni yirik modellardan uch barobar kamroq boʻlsa ham. LLM asosidagi baholashlar shuni koʻrsatadiki, modelning tushuntirishlari GPT-5.6-Sol darajasiga yaqinlashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model shaxmat sohasida oʻqitilgan; ushbu usulning boshqa sohalarda samaradorligi qoʻshimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"queen\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#queen\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;QUEEN&lt;/span&gt;&lt;/a&gt;QUEEN&lt;/h4&gt;\n&lt;p&gt;1950-yildan beri, Klod Shennon shaxmat mashinalari nazariyasini asoslaganidan buyon, shaxmat sunʼiy intellekt taraqqiyotini baholash uchun etalon boʻlib kelmoqda. Anʼanaviy shaxmat dvigatellari katta muvaffaqiyatlarga erishdi, ammo ular oʻz qarorlarining mantiqini tushuntirib bera olmaydi. Boshqa tomondan, zamonaviy til modellari (LM) tushuntirishlar bera oladi, lekin ularning oʻyin kuchi ixtisoslashgan dvigatellardan sezilarli darajada past. Mualliflar QUEEN (QUality Explanation and Evaluation Network) — «enkoder-dekoder» arxitekturasini taqdim etadilar, u grossmeyster darajasidagi oʻyinni sifatli matnli asoslash bilan birlashtiradi. 2026-yil 2-oktyabr holatiga koʻra, dunyoda 1899 nafar grossmeyster bor, bu faol onlayn oʻyinchilarning 0,01% dan kamrogʻini tashkil etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN grossmeyster darajasidagi dvigatellar kuchini izohlanuvchanlik bilan birlashtirib, sunʼiy intellektga nafaqat eng yaxshi yurishni tanlash, balki uni tabiiy tilda tushuntirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"related-works\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#related-works\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RELATED WORKS&lt;/span&gt;&lt;/a&gt;RELATED WORKS&lt;/h4&gt;\n&lt;p&gt;Anʼanaviy shaxmat dvigatellari variantlar daraxtini qidirish va pozitsiyalarni santipeykadagi skalyar qiymat bilan baholash orqali ishlaydi, bu gʻalaba qozonish ehtimoliga aylantiriladi. Stockfish kabi zamonaviy tizimlar murakkab qoʻlda yozilgan baholash funksiyalaridan neyron tarmoqlarga oʻtdi. Transformer arxitekturasiga asoslangan modellar, jumladan Leela Chess Zero (Lc0), insondan ustun oʻyin koʻrsatadi. Shuningdek, inson oʻyin uslubini taqlid qilishga qaratilgan modellar (Maia, Allie) mavjud, ammo ular oʻz harakatlari uchun ogʻzaki tushuntirishlar bermaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/centipawn.html\"&gt;Santipeyka&lt;/a&gt; (centipawn) — shaxmat dvigatellarida ustunlikni oʻlchash birligi, piyodaning 1/100 qismiga teng.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Til modellari sohasidagi tadqiqotlar shuni koʻrsatdiki, avtoregressiv transformerlar shaxmat oʻynashni oʻrganishi mumkin, ammo umumiy maqsadli modellarni bu vazifaga moslashtirish qiyin. Partiyalarga sharhlar yaratish boʻyicha oldingi urinishlar koʻpincha qilingan yurishlarni taʼriflash yoki dvigatellardan yashirin tushunchalarni ajratib olish bilan cheklangan. QUEEN shuni bilan ajralib turadiki, model avval mustaqil ravishda yurishni tanlaydi, keyin esa uni asoslaydi. Mualliflar tushuntirish sifati bevosita oʻyin kuchiga bogʻliqligini taʼkidlashadi: QUEEN oldingi usullarga qaraganda yuqoriroq oʻyin kuchini namoyish etgani uchun, u yaratgan izohlar yuqori sifatga ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN tushuntirishlarining samaradorligi yurish tanlash aniqligiga bogʻliq; agar model pozitsiyani baholashda xato qilsa, uning argumentatsiyasi mantiqiy izchil boʻlishi mumkin, ammo amalda notoʻgʻri boʻladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"queen-bizning-yondashuv\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#queen-bizning-yondashuv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;QUEEN: BIZNING YONDASHUV&lt;/span&gt;&lt;/a&gt;QUEEN: BIZNING YONDASHUV&lt;/h4&gt;\n&lt;p&gt;QUEEN loyihasining maqsadi shaxmat pozitsiyalari uchun tabiiy tildagi tushuntirishlarni yaratishdir. Sifatli tavsif uchta elementdan iborat (3-rasm): eng yaxshi yurish tavsiyasi, bashorat qilingan asosiy variant (PV) va matnli asoslash. Tavsiya aniq yurishni ko‘rsatadi, PV uning oqibatlarini namoyish etadi, matn esa muqobil variantlarni tahlil qilish orqali mantiqni tushuntiradi. Buning uchun ikki turdagi modellar qo‘llaniladi: shaxmat bo‘yicha superinsoniy darajada o‘ynaydigan Transformer-asosli dvigatellar va ravon matn yaratishga qodir, ammo shaxmat bilimiga ega bo‘lmagan universal til modellari (LM). Dvigatellar matn yaratishga, LM esa o‘yinni tahlil qilishga moslashtirilmagan. Shaxmatdagi ustunlik santipeshkalarda (piyodaning 1/100 qismi) o‘lchanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN tizimi shaxmat dvigateli Leela (240 mln parametr) va til modeli SmolLM3 (3 mlrd parametr)ni ekspert sharhlarini yaratish uchun birlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"31-arxitektura\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#31-arxitektura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 ARXITEKTURA&lt;/span&gt;&lt;/a&gt;3.1 ARXITEKTURA&lt;/h4&gt;\n&lt;p&gt;Shaxmat enkoderi. Biz Lc0 oilasiga mansub BT5 tarmog‘idan (Leela) foydalanamiz. Bu 15 qatlamli, 1024 yashirin o‘lchamli va 240 mln parametrli «faqat enkoder» turidagi modeldir. U 64 ta tokendan (taxta kataklari soni bo‘yicha) iborat ketma-ketlik bilan ishlaydi va variantlar daraxtini qidirmasdan yuqori darajada o‘ynaydi.&lt;/p&gt;\n&lt;p&gt;Til dekoderi. Dekoder sifatida SmolLM3-3B modeli (36 qatlam, 2048 o‘lcham) tanlangan. Bu umumiy maqsadli model bo‘lib, instruktiv sozlashdan o‘tgan, ammo maxsus shaxmat tayyorgarligiga ega emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Enkoder shaxmat pozitsiyasini matematik ko‘rinishga o‘tkazadi, dekoder esa bu ma’lumotlarni inson tushunadigan matnga aylantiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ko‘prik arxitekturasi. Biz Flamingo arxitekturasidan ilhomlangan o‘zaro diqqat (cross-attention) mexanizmidan foydalanamiz. Flamingo’dan farqli o‘laroq, biz enkoderning har bir holatini e_i dekoderning mos qatlami d2i bilan bog‘laymiz. Bu dekoderga shaxmat pozitsiyasining oraliq tasvirlariga turli bosqichlarda murojaat qilish imkonini beradi.&lt;/p&gt;\n&lt;p&gt;Ma’lumotlar oqimi. Model (&lt;a href=\"concepts/forsyth-edwards-notation.html\"&gt;FEN&lt;/a&gt;, matn) juftligini qabul qiladi. FEN qatori (Forsyth-Edwards notatsiyasi) Leela tomonidan qayta ishlanib, kontekst yaratadi va u o‘zaro diqqat qatlamlari orqali SmolLM’ga uzatiladi. Bu dekoderga matn yaratishning har bir bosqichida shaxmat pozitsiyasini hisobga olish imkonini beradi. Biz boshqa dekoderlar (Qwen, Gemma) va ma’lumotlarni integratsiya qilishning muqobil usullarini (LLaVA-simon arxitektura) sinab ko‘rish orqali ablyatsion tadqiqotlar o‘tkazdik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model arxitektura yechimlariga tayanadi, bunda aniqlik enkoderning shaxmat belgilarini dekoderning til qatlamlari bilan bog‘lash sifatiga bog‘liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"domen-moslashuvi-enkoderni-yashirin-holatlarini-talqin-qilish\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#domen-moslashuvi-enkoderni-yashirin-holatlarini-talqin-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Domen moslashuvi: enkoderni yashirin holatlarini talqin qilish&lt;/span&gt;&lt;/a&gt;Domen moslashuvi: enkoderni yashirin holatlarini talqin qilish&lt;/h4&gt;\n&lt;p&gt;Oldingi tadqiqotlar shuni koʻrsatdiki, Leela Chess Zero neyrotarmogʻi shaxmat pozitsiyalarining asosiy jihatlarini, jumladan, donalar joylashuvi, mavjud yurishlar va taktik variantlarni kodlaydi. Domen moslashuvi bosqichining maqsadi dekoderni ushbu yashirin belgilarni Leela taqdimotlaridan ajratib olishga oʻrgatishdir. Buning uchun «savol-javob» maʼlumotlar toʻplami yaratildi, unda har bir misol pozitsiya p (FEN formatida) va soʻrov q dan iborat. Soʻrovlar joriy pozitsiya p yoki 1–8 yurishdan keyin erishiladigan p' pozitsiyasiga tegishli. Pozitsiyalar ochiq Lichess maʼlumotlar toʻplamidan olingan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PAWN modeli Leela’ning yashirin holatlaridan shaxmat bilimlarini toʻrt turdagi vazifalar orqali ajratib olishga oʻrgatiladi: joriy taxtani statik tahlil qilishdan tortib, kelajakdagi holatlarni bashorat qilishgacha.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Soʻrovlar toʻrt toifaga boʻlinadi (4-rasmga qarang):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;STATIC-CURRENT: kataklardagi donalarni aniqlash yoki maʼlum bir donaning koordinatalarini topish.&lt;/li&gt;\n&lt;li&gt;DYNAMIC-CURRENT: qoidalarni tahlil qilish, masalan, barcha qonuniy yurishlar, olishlar yoki shohlarni topish.&lt;/li&gt;\n&lt;li&gt;STATIC-FUTURE: yurishlar ketma-ketligidan keyin pozitsiyani qayta tiklash va statik tahlil qilish.&lt;/li&gt;\n&lt;li&gt;DYNAMIC-FUTURE: kelajakdagi holatni rekonstruksiya qilish va taktik imkoniyatlarni tahlil qilish.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FEN (Forsyth-Edwards Notation) — shaxmat taxtasidagi donalar joylashuvini bitta matn satri koʻrinishida tasvirlash uchun standart notatsiya.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tokenizatsiya bilan bogʻliq muammolarni oldini olish uchun mualliflar barcha 64 katak va 12 turdagi donalar uchun maxsus tokenlar qoʻshdilar. Oʻqitish ketma-ket amalga oshiriladi: STATIC-CURRENT dan DYNAMIC-FUTURE gacha. Har bir bosqichda oldingi bosqich savollari qisman takrorlanadi, bu «katastrofik unutish»ning oldini oladi. Oʻqitish jarayonida enkoder va dekoder muzlatilgan, faqat cross-attention parametrlari va yangi token embeddinglari yangilanadi. Yakuniy model PAWN (Position AWare Network) deb nomlandi.&lt;/p&gt;\n&lt;h4 id=\"qidiruvni-iterativ-distillash-tushuntirishlar-sifatini-oshirish\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#qidiruvni-iterativ-distillash-tushuntirishlar-sifatini-oshirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qidiruvni iterativ distillash: tushuntirishlar sifatini oshirish&lt;/span&gt;&lt;/a&gt;Qidiruvni iterativ distillash: tushuntirishlar sifatini oshirish&lt;/h4&gt;\n&lt;p&gt;Predmet sohasiga moslashgandan soʻng, PAWN modeli shaxmat boʻyicha tuzilgan savollarga javob bera oladigan boʻldi, ammo unda kerakli tushuntirish formatidagi namunalar yetishmas edi. Mualliflar Lichess oʻyinlari va masalalaridan 15 000 ta pozitsiyani tanlab olishdi, ular uchun GPT-5.6-Sol(low) modeli namunaviy tushuntirishlarni yaratdi. Har bir tushuntirish eng yaxshi yurish prognozi, asosiy variant (PV), tabiiy tildagi matn, uchta istiqbolli yurish va pozitsiyani baholashni oʻz ichiga olgan (3-rasm). Notoʻgʻri yurishlar yoki xatolarni oʻz ichiga olgan javoblar filtrlangandan soʻng, SFT (fine-tuning) oʻtkazildi va PAWN-1 modeli hosil boʻldi. Matn ravon boʻlishiga qaramay, PAWN-1 «oʻqituvchi» modelning cheklangan kuchi va oʻquv maʼlumotlar toʻplamining kichikligi tufayli sifatsiz yoki qoidalarga zid yurishlarni tavsiya qilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Iterativ distillash jarayoni tushuntirishlar sifatini oshirishga imkon berdi: PAWN-1 dan yakuniy QUEEN (PAWN-8) modeligacha yetti bosqichli oʻqitish amalga oshirildi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sifatni oshirish uchun mualliflar AlphaZero dan ilhomlangan yondashuvni qoʻllashdi: qidiruv (MCTS) natijalaridan foydalanib, yaxshilangan baholarni neyrotarmoqqa distillash. Bu yerda MCTS alfa-beta qidiruvi bilan almashtirildi, bu tabiiy til uchun Bellman iteratsiyasining analogidir. PAWN-(k+1) ni PAWN-k dan oʻqitish jarayoni besh bosqichdan iborat: Stockfish dvigateli bilan oʻyinlar, odamlarning Lichessdagi oʻyinlari va shaxmat masalalaridan 400 000 ta pozitsiyani tanlash; tushuntirishlarni yaratish; barcha uchta taklif etilgan yurish xatosiz boʻlguncha rekursiv qidiruv; Qwen3.8-27B yordamida tushuntirishlarni konsolidatsiya qilish; va filtrlangan maʼlumotlar asosida yakuniy oʻqitish. Xato deb Stockfish dvigateliga nisbatan gʻalaba qozonish ehtimolini 10% yoki undan koʻproqqa kamaytiradigan yurish tushuniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/iteratsiya-po-bellmanu.html\"&gt;Bellman iteratsiyasi&lt;/a&gt; — bu model chuqurroq qidiruv baholariga tayanib, oʻz bashoratlarini bosqichma-bosqich yaxshilaydigan oʻqitish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baholashlar\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#baholashlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholashlar&lt;/span&gt;&lt;/a&gt;Baholashlar&lt;/h4&gt;\n&lt;p&gt;Tushuntirishlar sifati uchta mezon boʻyicha baholanadi: aniqlik (optimal yurishlarni tavsiya etish), asoslanganlik (muqobil variantlarni tahlil qilish) va izchillik (ravon matn, gallyutsinatsiyalarning yoʻqligi). Aniqlik Elo reytingini hisoblash bilan toʻliq oʻyin simulyatsiyalari orqali (4.1-boʻlim), asoslanganlik — modelning xatosiz asosiy variantlarni (PV) yaratish qobiliyati orqali (4.2-boʻlim), izchillik esa boshqa til modeli yordamida baholanadi (4.3-boʻlim). Taqqoslash uchun GPT-5.6-Sol, GPT-5.6-Luna, Gemini-3.1-Pro va C1-4B modellari tanlab olindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Aniqlik bahosi belgilangan raqiblarga qarshi simulyatsiyalarga asoslangan; natijalar qidiruv parametrlari va hisoblash byudjetiga bogʻliq boʻlishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"toliq-oyin-simulyatsiyalaridagi-aniqlik\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#toliq-oyin-simulyatsiyalaridagi-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Toʻliq oʻyin simulyatsiyalaridagi aniqlik&lt;/span&gt;&lt;/a&gt;Toʻliq oʻyin simulyatsiyalaridagi aniqlik&lt;/h4&gt;\n&lt;p&gt;QUEEN modeli grossmeyster darajasiga yaqin oʻyin koʻrsatib, Gemini, SOL, LUNA va C1-4B modellaridan ustun keldi.&lt;/p&gt;\n&lt;h4 id=\"ajratilgan-pozitsiyalardagi-asoslanganlik\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#ajratilgan-pozitsiyalardagi-asoslanganlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ajratilgan pozitsiyalardagi asoslanganlik&lt;/span&gt;&lt;/a&gt;Ajratilgan pozitsiyalardagi asoslanganlik&lt;/h4&gt;\n&lt;p&gt;Asoslanganlikni baholash uchun bashorat qilingan asosiy variantdagi (PV) xatolarning yoʻqligi koʻrsatkichi (NMR) va birinchi yurishdagi xatolarning yoʻqligi (FNMR) ishlatiladi. Sinov Lichessdagi 609 dan 2905 gacha qiyinchilik darajasiga ega 1 000 ta taktik masalada oʻtkazildi.&lt;/p&gt;\n&lt;h4 id=\"aniqlik-va-asoslanganlikni-taqqoslash\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#aniqlik-va-asoslanganlikni-taqqoslash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aniqlik va asoslanganlikni taqqoslash&lt;/span&gt;&lt;/a&gt;Aniqlik va asoslanganlikni taqqoslash&lt;/h4&gt;\n&lt;p&gt;Modellarning bashorat sifati taktik masalalar va odamlar oʻynagan 1000 ta pozitsiyada baholandi. NMR (yurishni tanlash aniqligi) va FNMR (davomini asoslash aniqligi) metrikalaridan foydalanildi. QUEEN modeli eng yaxshi natijalarni koʻrsatdi: taktik masalalarda u GEMINIʼdan NMR boʻyicha 2% ga va FNMR boʻyicha 9% ga ustun keldi, shuningdek, SOL va C1-4B bazaviy modellaridan sezilarli darajada oʻzib ketdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN taktik masalalarda ham, umumiy pozitsiyalarda ham boshqa modellardan ustun boʻlib, eng yuqori aniqlik va asoslanganlikni namoyish etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"til-modeli-baholashidagi-kogerentlik\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#til-modeli-baholashidagi-kogerentlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Til modeli baholashidagi kogerentlik&lt;/span&gt;&lt;/a&gt;Til modeli baholashidagi kogerentlik&lt;/h4&gt;\n&lt;p&gt;Matn sifati uchta mezon boʻyicha baholandi: tarkibiy kogerentlik (variantlar daraxti mantigʻi), konseptual kogerentlik (shaxmat terminlaridan foydalanish, gallyutsinatsiyalarning yoʻqligi) va nutq ravonligi. Baholash GPT-5.6-Sol modeli tomonidan 1 dan 5 gacha shkala boʻyicha amalga oshirildi. Barcha modellar yuqori ravonlikni (4.9–5.0 ball) koʻrsatdi. QUEEN tarkibiy kogerentlik uchun 3.51 ball oldi, bu SOL bilan teng, ammo uning konseptual kogerentligi 2.76 ballni tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tarkibiy kogerentlik tavsif sifatidan qatʼi nazar, model variantlar daraxtini qanchalik mantiqiy qurishini baholaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Konseptual kogerentlikning nisbatan pastligi iterativ oʻqitish jarayonida gallyutsinatsiyalar toʻplanishi xavfi bilan bogʻliq boʻlib, bu usulning cheklovidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"leela-chess-zero-dvigatelidan-mustaqillik-tahlili\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#leela-chess-zero-dvigatelidan-mustaqillik-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Leela Chess Zero dvigatelidan mustaqillik tahlili&lt;/span&gt;&lt;/a&gt;Leela Chess Zero dvigatelidan mustaqillik tahlili&lt;/h4&gt;\n&lt;p&gt;Model Lc0 dvigateli strategiyasini nusxalamasligini tekshirish uchun kamida beshta yurish gʻalaba qozonish ehtimoli boʻyicha optimalga yaqin boʻlgan 1000 ta pozitsiya tahlil qilindi. 53.8% hollarda (1000 tadan 538 tasi) QUEEN Leela tanlaganidan farqli yurishni amalga oshirdi, bunda 39.1% hollarda bu yurish eng yaxshi 5 talikka kirdi. Bu model Leela siyosatini shunchaki takrorlamay, balki oʻz qarorlarini qabul qilishini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN 53.8% hollarda Leela tavsiyalaridan farqli yurishlarni tanlaydi, bu uning mustaqil qaror qabul qilish qobiliyatini isbotlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; 32 ta oʻyindan soʻng Lichess Elo reytingiga bogʻlangan taxminiy reytinglar&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Model&lt;/th&gt;\n&lt;th&gt;Elo (Lichess)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;QUEEN&lt;/td&gt;\n&lt;td&gt;2697&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Leela&lt;/td&gt;\n&lt;td&gt;2650&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;SOL&lt;/td&gt;\n&lt;td&gt;2085&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GEMINI&lt;/td&gt;\n&lt;td&gt;2240&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;C1-4B&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Barcha frontier modellari yuqori hisoblash kuchidan foydalanadi. C1-4B barcha 32 ta oʻyinda magʻlub boʻldi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 7.&lt;/strong&gt; Oʻqitish bosqichlari boʻyicha maʼlumotlar taqsimoti&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Maʼlumot manbasi&lt;/th&gt;\n&lt;th&gt;CURR-STATIC&lt;/th&gt;\n&lt;th&gt;CURR-DYNAMIC&lt;/th&gt;\n&lt;th&gt;FUTURE-STATIC&lt;/th&gt;\n&lt;th&gt;FUTURE-DYNAMIC&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1-bosqich maʼlumotlari&lt;/td&gt;\n&lt;td&gt;100%&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2-bosqich maʼlumotlari&lt;/td&gt;\n&lt;td&gt;10%&lt;/td&gt;\n&lt;td&gt;90%&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3-bosqich maʼlumotlari&lt;/td&gt;\n&lt;td&gt;6%&lt;/td&gt;\n&lt;td&gt;8%&lt;/td&gt;\n&lt;td&gt;86%&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4-bosqich maʼlumotlari&lt;/td&gt;\n&lt;td&gt;6%&lt;/td&gt;\n&lt;td&gt;6%&lt;/td&gt;\n&lt;td&gt;8%&lt;/td&gt;\n&lt;td&gt;80%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 9.&lt;/strong&gt; Toʻrt bosqichli oʻquv dasturi uchun oʻqitish giperparametrlari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parametr&lt;/th&gt;\n&lt;th&gt;Qiymat&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Barcha bosqichlar uchun umumiy boʻlgan giperparametrlar bir marta koʻrsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 10.&lt;/strong&gt; Modelimizning ajratilgan test toʻplamidagi aniqligi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Metrika&lt;/th&gt;\n&lt;th&gt;Qiymat&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Substantiation evaluation on 1,000 tactical and 1,000 general positions. NMR is the fraction of predicted PVs containing no mistakes;FNMR is the fraction of positions in which the model’s predicted best move is not a mistake. All frontier models use high reasoning effort.QUEEN performs the best across all metrics on both tactical and general positions.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT2.jpg\" alt=\"Jadval 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Evaluationofthevariousmodelsoncoherenceandfluency.Frontiermodelsusehigh reasoning effort. All models are fluent in their output.GEMINI obtains the best structural coherence, though QUEEN and SOL obtain comparable scores.QUEEN struggles with conceptual coherence, as iterative search-distillation cannot teach it to verbalize and describe motifs it hasn’t seen.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT3.jpg\" alt=\"Jadval 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 4.&lt;/strong&gt; Ablations of QUEEN evaluated after SOL-seeding.Both the encoder and curriculum are essential for a good initialization. Ablations. WeablatetheLeelaencoderand domain-adaptationstagefromQUEENtoquantify theirimportance.Becauseiterativesearchdistillation requires costly data generation, we evaluate the ablationsimmediatelyaftertheGPT-5.6-Solseedingstage. TheencoderablationreplacesLeela withadictionary-formrepresentationofthecompleteboardstate(e.g.,“WhiteKing:e1,...”),containingthesameinformationastheFEN.TherepresentationispasseddirectlytotheLMwithoutan encoder or cross-attention, while retaining the same domain-adaptation curriculum.The curriculum ablationskipsthedomainadaptationphaseoftrainingbutkeepstheLeelaencoder.Weevaluate both on playing strength Elo and first-move no-mistake rate (FNMR) on the 1,000 tactical positions. As shown in Table 4, removing either component substantially degrades the model, indicating that both are important for producing a strong initialization for iterative search-distillation.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT4.jpg\" alt=\"Jadval 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 5.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT5.jpg\" alt=\"Jadval 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 6.&lt;/strong&gt; PerformanceofQUEENwith andwithoutfrontier-modeldistillation. TheHCEvariantusesanalternative dataconstructionpipelinebasedon Stockfish’s hand-crafted evaluation. Moving away from frontier LM annotation. Finally, weinvestigatewhetherQUEENcanachievestrongperformance without being seeded with explanations from a frontiermodel.Tothisend,weconstructanalternative trainingdatasetfromfeaturesderivedfromStockfish’s hand-craftedevaluation(HCE),usingthemtogenerate templatic explanations for each position.We use this data to replace theSOL-seeded training round,while keeping the remainder of the training procedure unchanged. In Table6,theHCEvariantshowsasimilartrajectoryofElo improvementtoQUEEN,suggestingthatfrontier-model distillationisnotstrictlynecessaryforQUEENtolearntogeneratehigh-qualityexplanations.We report an example of its explanations and full details of the data-generation procedure in Section D.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT6.jpg\" alt=\"Jadval 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 8.&lt;/strong&gt; Datacompositionofthefourstagesofdomainadaptationtraining.Rowsandcolumns correspondtothefinalstagedatamixtureanddatasourcesdescribedabove.Earlier-stagedatais replayed at a small proportion to prevent forgetting.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT8.jpg\" alt=\"Jadval 8\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"xulosalar-va-istiqbollar\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#xulosalar-va-istiqbollar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosalar va istiqbollar&lt;/span&gt;&lt;/a&gt;Xulosalar va istiqbollar&lt;/h4&gt;\n&lt;p&gt;QUEEN usuli avvalgi yondashuvlar va zamonaviy til modellari bilan solishtirganda yuqoriroq sifatdagi tushuntirishlarni taqdim etadi. Tizim tomonidan taklif etilgan yurishlar boʻyicha tavsiyalar yuqori aniqlikka ega, bu Elo reytingining sezilarli darajada oshishi va asosiy variantlar boʻyicha kuchliroq dalillar bilan tasdiqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN tavsiyalar aniqligi va argumentatsiya sifati boʻyicha analoglardan ustun turadi, shu bilan birga matn ravonligi yetakchi til modellari darajasida qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;QUEEN shaxmat sohasida ishlab chiqilgan va sinovdan oʻtgan boʻlsa-da, taklif etilgan arxitektura universal hisoblanadi. U til modelini oldindan oʻrgatilgan &lt;a href=\"concepts/ekspertnyy-enkoder.html\"&gt;ekspert enkoderi&lt;/a&gt; bilan birlashtirish mexanizmini ifodalaydi. Oʻqitish tartibi har qanday holatni saqlaydigan muhit (stateful environment) uchun qoʻllanilishi mumkin boʻlgan iterativ yaxshilash algoritmini oʻz ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ekspert enkoderi — bu muayyan soha (masalan, shaxmat) qoidalari va strategiyasini «tushunadigan» ixtisoslashgan model boʻlib, u til modeliga qaror qabul qilish uchun aniq maʼlumotlarni taqdim etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu yondashuv ekspert enkoderlari mavjud boʻlgan sohalarda, jumladan robototexnika va kompyuter tizimlarini boshqarishda til modellarini joriy etish imkoniyatlarini ochadi. Bunday sharoitlarda ekspert modellari domen boʻyicha baholashni taʼminlaydi, til modellari esa bu signallarni inson uchun tushunarli va mantiqiy tahlil uchun foydali boʻlgan tushuntirishlarga aylantiradi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f2.jpg\" alt=\"2-rasm: Biz Flamingo (Alayrac et al., 2022) asosida yaratilgan enkoder-dekoder arxitekturasidan foydalanamiz. Enkoder si\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Biz Flamingo (Alayrac et al., 2022) asosida yaratilgan enkoder-dekoder arxitekturasidan foydalanamiz. Enkoder sifatida Lc0 shaxmat neyron tarmogʻi, dekoder sifatida esa koʻrsatmalar asosida sozlangan til modeli ishlatiladi. Lc0ʼning k-qatlami embeddinglari til modelining 2k-qatlami oldiga kiritilgan Flamingo blokiga uzatiladi va domen adaptatsiyasi jarayonida barcha oldindan oʻrgatilgan parametrlar muzlatiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f4.jpg\" alt=\"4-rasm: Domen adaptatsiyasi modelni bosqichma-bosqich quyidagilarga oʻrgatadi: taxtaning joriy holatidagi statik xususiy\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Domen adaptatsiyasi modelni bosqichma-bosqich quyidagilarga oʻrgatadi: taxtaning joriy holatidagi statik xususiyatlarni ajratib olish (STATIC-CURRENT), mavjud yurishlar va oʻzaro taʼsirlar haqida mulohaza yuritish (DYNAMIC-CURRENT), yurishlar ketma-ketligidan taxtaning kelajakdagi holatini qayta tiklash (STATIC-FUTURE) va nihoyat, natijaviy pozitsiya haqida mulohaza yuritish (DYNAMIC-FUTURE).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f5.jpg\" alt=\"5-rasm: Biz iterativ oʻz-oʻzini rivojlantirish uchun qidiruv jarayonida jamlangan tushuntirishlarni modelga qayta distil\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Biz iterativ oʻz-oʻzini rivojlantirish uchun qidiruv jarayonida jamlangan tushuntirishlarni modelga qayta distillaymiz. Bellman yangilanishiga oʻxshash tarzda, jamlangan tushuntirish qaysi yurish eng yaxshisi ekanligini va boshqa yurishlarning kamchiliklarini tushuntirish uchun quyi tugunlardagi tushuntirishlarni birlashtiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x
