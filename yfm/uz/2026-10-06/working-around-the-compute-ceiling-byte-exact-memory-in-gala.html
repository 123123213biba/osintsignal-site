        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"124\" cy=\"100\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"576\" cy=\"206\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LLM ishini 14 barobar&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tezlashtirish: Galahad&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;texnologiyasi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-f1.jpg\" alt=\"1-rasm: Galahad soʻrovlarga xizmat koʻrsatish yoʻlida. Blaise savol tegishli boʻlgan matn parchasini tanlaydi; Taliesin \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: &lt;a href=\"concepts/galahad.html\"&gt;Galahad&lt;/a&gt; soʻrovlarga xizmat koʻrsatish yoʻlida. &lt;a href=\"concepts/blaise.html\"&gt;Blaise&lt;/a&gt; savol tegishli boʻlgan matn parchasini tanlaydi; &lt;a href=\"concepts/taliesin.html\"&gt;Taliesin&lt;/a&gt; model allaqachon qayta ishlagan har qanday blok uchun saqlangan KV holatini taqdim etadi va yangi bloklarni dastlabki toʻldirishdan (&lt;a href=\"concepts/prefill.html\"&gt;prefill&lt;/a&gt;) keyin saqlaydi. Agar yuklash tekshiruvdan oʻtmasa, ish vaqti muhiti (runtime) blokni qayta hisoblaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Katta til modellari har bir so'rovda butun kontekstni qayta tahlil qiladi, bu esa ortiqcha hisoblash quvvatini talab qiladi. Galahad tizimi diqqat holatini (KV-kash) va matn bo'laklarini saqlab qolish orqali modelga o'qilgan hujjatlarni «eslab qolish» imkonini beradi. Natijada model qayta hisoblashlarsiz darhol javob bera oladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Galahad KV-holatini saqlash orqali javob vaqtini 14 barobar qisqartiradi.&lt;/li&gt;\n&lt;li&gt;Qayta tiklangan xotira holati asl hisob-kitob bilan bitma-bit bir xil.&lt;/li&gt;\n&lt;li&gt;Tizim vLLM, &lt;a href=\"concepts/sglang.html\"&gt;SGLang&lt;/a&gt; va llama.cpp bilan moslashuvchan ishlaydi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Galahad ikki qismdan iborat: Taliesin va Blaise. Taliesin matn bloklari uchun KV-holatini saqlaydi va qayta so'rovda uni yuklaydi. Blaise hujjatlarni indekslab, modelga faqat kerakli qismini uzatadi. 97 000 tokendan iborat korpusda Gemma 4 31B modeli Galahad yordamida 100 ta savolga to'liq to'g'ri javob berdi, bunda vaqt sarfi 14 barobar, energiya sarfi esa 92% ga qisqardi.&lt;/p&gt;\n&lt;p&gt;Texnologiya vLLM, SGLang va llama.cpp uchun xotira qatlami sifatida ishlaydi. Tekshiruvlar shuni ko'rsatdiki, qayta tiklangan holat yangi hisoblangan holat bilan bitma-bit mos keladi. Tizim xatolik yuz berganda avtomatik qayta hisoblash rejimiga o'tadi, bu esa xotira xatolari tufayli noto'g'ri javoblar chiqishini oldini oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dastlabki indekslash jarayoni qo'shimcha vaqt va energiya talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Zamonaviy transformator til modellari har bir token uchun cheklangan hisoblash quvvatiga ega. Hozirgi arxitekturada soʻrovlarga xizmat koʻrsatish «&lt;a href=\"concepts/stateless-inference.html\"&gt;stateless&lt;/a&gt;» (holatsiz) hisoblanadi: bir hujjat boʻyicha yangi savol berilganda, model diqqat holatini (attention state) birinchi tokendan boshlab qayta hisoblaydi. Yettita real maʼlumotlar toʻplami tahlili shuni koʻrsatdiki, promptlardagi tokenlarning 98,7% qismi model avval oʻqigan matnlardir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Galahad tizimini joriy etish takroriy hisoblashlarni chetlab oʻtib, &lt;a href=\"concepts/key-value-cache.html\"&gt;KV-kesh&lt;/a&gt; holatini saqlab qoladi, bu esa javoblar aniqligini 10% dan 98% gacha oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar vLLM, SGLang va llama.cpp uchun xotira qatlami boʻlgan Galahad tizimini taqdim etadilar. Tizim ikki komponentdan iborat: Taliesin matn bloklari uchun kalit-qiymat (KV) holatini saqlaydi va qayta murojaat qilinganda uni yuklaydi, Blaise esa modelga faqat savolga javob berish uchun kerakli qismlarni uzatadi. Sinovlar 97 000 tokendan iborat korpus va 100 ta yashirin faktni oʻz ichiga olgan Gemma 431B modeli yordamida oʻtkazildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-kesh (Key-Value cache) — bu modelning oraliq hisob-kitoblari saqlanadigan xotira sohasi boʻlib, u matnning oldingi qismlarini qayta hisoblamasdan «eslab qolish» imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Galahadsiz model xotirada faqat oxirgi 12 000 tokenni ushlab tura olgan va 100 ta savoldan 10 tasiga 9,3 soniya va 2754 J energiya sarflab javob bergan. Taliesin bilan model 100 ta savoldan 98 tasiga 3,0 soniya va 572 J sarflab javob berdi. Blaise qoʻshilganda, model har bir savol uchun taxminan 668 tokenni qayta ishladi va barcha 100 ta savolga 0,59–0,64 soniya va 200–213 J sarflab javob berdi. Korpusni dastlabki saqlash 100 soniya va 28 kJ talab qiladi, bu xarajat 13 ta soʻrovdan soʻng qoplanadi. Qayta tiklangan holat yangi hisoblangan holat bilan aynan bir xil: barcha 262 144 chiqish logitlari mos keldi. Tizim 30 ta turli modelda sinovdan oʻtkazildi va barqarorlikni koʻrsatdi: tekshiruvda xatolik yuz berganda Galahad standart qayta hisoblashga oʻtadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar nazorat qilinadigan muhitda olingan; samaradorlik GPU arxitekturasi va soʻrovlar murakkabligiga qarab farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Mualliflar transformatorlarning hisoblash murakkabligi O(N² · d) chegarasini tahlil qiladilar, bu yerda N — tokenlar soni, d — model oʻlchami. Taklif etilayotgan yondashuvga koʻra, inferensiya qiymati umumiy matnga emas, balki faqat yangi matn hajmiga bogʻliq boʻlishi kerak. Bu hisoblash jarayonini «xotirasiz» holatdan doimiy xotiraga ega tizimga oʻtkazadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Galahad tizimi KV (kalit-qiymat) holati va matnni saqlash orqali ortiqcha hisoblashlarni kamaytiradi, bu esa modelga bir xil hujjatlarni qayta oʻqimaslik imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hozirgi tizimlar (vLLM, SGLang) prefiks keshini faqat GPU xotirasida saqlaydi. Galahad ikki darajali xotirani joriy etadi: Taliesin (matn bloklari uchun KV holatini saqlaydi) va Blaise (tuzilgan matnni saqlaydi). Taliesin qayta tiklanganda bit darajasida identik logitlarni taʼminlaydi, Blaise esa butun korpusni emas, faqat kerakli qismlarni modelga uzatadi. Sinovlarda Blaise har bir savol uchun 97 000 token oʻrniga atigi ~668 tokenni qayta ishladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-kesh (Key-Value cache) — bu model matnni oʻqish jarayonida hisoblab chiqadigan oraliq maʼlumotlar boʻlib, ular takroriy hisoblashlarning oldini oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"deployment\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#deployment\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deployment&lt;/span&gt;&lt;/a&gt;Deployment&lt;/h4&gt;\n&lt;p&gt;Galahad Linux x86-64 uchun umumiy kutubxona (libgalahad.so) sifatida amalga oshirilgan va vLLM, SGLang hamda llama.cpp bilan mos keladi. Tizim maʼlumotlar xavfsizligini taʼminlash uchun ijarachi identifikatori va model «izini» (fingerprint) talab qiladi.&lt;/p&gt;\n&lt;h4 id=\"taliesin-kv-memory\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#taliesin-kv-memory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Taliesin: KV memory&lt;/span&gt;&lt;/a&gt;Taliesin: KV memory&lt;/h4&gt;\n&lt;p&gt;Taliesin KV holatini kirish baytlari xeshi ostida saqlaydi. Takroriy soʻrovda tizim maʼlumotlar butunligini tekshiradi; agar yozuv shikastlangan boʻlsa, qayta hisoblash amalga oshiriladi. Qayta foydalanish token pozitsiyalari aniq mos kelganda blok darajasida sodir boʻladi.&lt;/p&gt;\n&lt;h4 id=\"blaise-text-memory\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#blaise-text-memory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Blaise: text memory&lt;/span&gt;&lt;/a&gt;Blaise: text memory&lt;/h4&gt;\n&lt;p&gt;Blaise hujjatlarni boʻlimlarga ajratilgan bayt koʻrinishida saqlaydi. Savol kelganda, tizim CPUda kerakli boʻlimni tanlaydi va uni modelga uzatadi. Bu modelga butun matnni oʻqimasdan javob berish imkonini beradi.&lt;/p&gt;\n&lt;h4 id=\"correctness\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#correctness\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Correctness&lt;/span&gt;&lt;/a&gt;Correctness&lt;/h4&gt;\n&lt;p&gt;Aniqlik juda muhim: Galahad qayta tiklangan holatdagi har qanday mos kelmaslikni xato deb hisoblaydi va maʼlumotlarni qayta hisoblaydi. Xavfsizlik sinovlarida toʻrtta himoya mexanizmi (xeshlash, imzolar, ijarachilarni ajratish, baytlarni solishtirish) tekshirildi. Barcha himoya vositalari hujumlarni muvaffaqiyatli toʻxtatdi. Statik tahlil vositalari yordamida bitta buferdan tashqari oʻqish xatosi aniqlandi va tuzatildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu maqola tizim tavsifi hisoblanadi; Blaise tuzilishi va xavfsizlik detallari patent arizalari bilan himoyalangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"recall-in-a-long-corpus\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#recall-in-a-long-corpus\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Recall in a long corpus&lt;/span&gt;&lt;/a&gt;Recall in a long corpus&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar Galahad tizimini 13 ta Vikipediya maqolasidan iborat korpusda (96 726 token) sinab koʻrishdi va unga 100 ta oʻylab topilgan faktni kiritishdi. Gemma 4 31B modeli RTX A6000 GPUʼda ishlatildi. Bazaviy usul (Galahadʼsiz) 12 000 tokenlik oyna bilan matnning atigi 12% qismini koʻra oldi. Taliesin komponenti KV-kesh holatini saqlab qoldi, Blaise esa tegishli qismni (taxminan 668 token) tanlab oldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Taliesinʼdan foydalanish modelga 100 ta savoldan 98 tasiga javob berish imkonini berdi, u boʻlmaganda esa atigi 10 tasiga javob berilgan. Bunda ishlov berish tezligi 3,1 barobarga oshdi, GPU energiya sarfi esa 79% ga kamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-kesh (Key-Value cache) — bu modelning oraliq hisob-kitoblari boʻlib, ular matnning bir qismini qayta-qayta hisoblamaslikka imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot sintetik maʼlumotlar toʻplamida oʻtkazilgan; natijalar real, murakkabroq matnlar bilan ishlashda farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"seven-real-world-datasets\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#seven-real-world-datasets\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Seven real-world datasets&lt;/span&gt;&lt;/a&gt;Seven real-world datasets&lt;/h4&gt;\n&lt;p&gt;Yetti xil manbadan (qoʻllab-quvvatlash loglari, xatoli PDFʼlar, SWEbench va b.) olingan 349 ta savol yordamida tizim tashqi maʼlumotlarda tekshirildi. Gemma 4 31B modeli uchta muhitda: llama.cpp, vLLM va SGLangʼda ishga tushirildi. Propt tokenlarining oʻrtacha 98,69% qismi qayta hisoblanmasdan, Taliesin keshidan yuklandi. Taliesin va Blaise kombinatsiyasi faqat Taliesinʼdan foydalanishga nisbatan 3–10 barobar tezlikda 91–92% aniqlikni taʼminladi.&lt;/p&gt;\n&lt;h4 id=\"serving-performance\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#serving-performance\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Serving performance&lt;/span&gt;&lt;/a&gt;Serving performance&lt;/h4&gt;\n&lt;p&gt;Turli GPUʼlardagi (RTX PRO 4500 dan H100 gacha) testlar saqlangan holatni yuklash qayta hisoblashdan tezroq ekanligini koʻrsatdi. Qwen 3 30B modeli bilan H100ʼda oʻtkazilgan testlarda oʻtkazish qobiliyati 29,6% ga (sekundiga 2,643 dan 3,424 ta soʻrovgacha) oshdi. Tizim nosozliklarga chidamliligini koʻrsatdi: Kubernetesʼda jarayon majburiy toʻxtatilganda (SIGKILL) maʼlumotlar shikastlanmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Korpus hajmi GPU xotirasi bilan emas, balki disk maydoni bilan cheklangan: tizim 5,97 million token bilan muvaffaqiyatli ishladi va xotira sarfini barqaror saqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"coverage\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#coverage\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Coverage&lt;/span&gt;&lt;/a&gt;Coverage&lt;/h4&gt;\n&lt;p&gt;Moslik vLLM yordamida 30 ta turli modelda tekshirildi. DeepSeek-V4-Flash (284B) modelida Taliesin va Blaise birgalikda 100 ta savoldan 98 tasiga javob berdi, har bir soʻrov uchun 0,133 s va 143 J sarflandi.&lt;/p&gt;\n&lt;h4 id=\"loyihalash-chegaralari\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#loyihalash-chegaralari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Loyihalash chegaralari&lt;/span&gt;&lt;/a&gt;Loyihalash chegaralari&lt;/h4&gt;\n&lt;p&gt;Galahad tizimining natijalari uchta asosiy arxitektura tamoyili bilan belgilanadi. Birinchidan, maʼlumotlarni qayta ishlatish bloklar darajasida amalga oshiriladi. Rotary position encoding (RoPE) har bir kalit-qiymat (KV) qatorini oʻz pozitsiyasiga bogʻliq qilganligi sababli, qatorlarni turli soʻrovlar oʻrtasida boʻlishish mumkin emas (test 344 064 qatordan 0 ta moslikni koʻrsatdi). Galahad pozitsiyalar aniq mos keladigan va tiklangan holat bit-bay-bit (bit-identical) boʻlgan butun bloklarni qayta ishlatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Galahad pozitsiyaga bogʻliq maʼlumotlarni aralashtirib yubormaslik uchun bloklardan foydalangan holda bit-bay-bit aniqlikni taʼminlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikkinchidan, tizim «yopiq holatda rad etish» tamoyili asosida ishlab chiqilgan: agar yuklash tekshiruvi oʻtmasa, maʼlumotlar qaytadan hisoblanadi. H100 GPU-da har uchinchi yuklash ataylab muvaffaqiyatsiz qilinganda, oʻtkazish qobiliyati Galahad-siz 2,643 ga nisbatan soniyasiga 2,716 soʻrovni tashkil etdi. Uchinchidan, xotira dastlabki matn bilan cheklangan: PDF-fayllar bilan ishlashda 50 ta holatdan 9 tasida matn parser tomonidan ajratib olish bosqichida yoʻqolgan va hech qanday xotira qatlami inferensiyadan oldin yoʻqolgan maʼlumotlarni tiklay olmaydi.&lt;/p&gt;\n&lt;h4 id=\"aloqador-ishlar\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#aloqador-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Aloqador ishlar&lt;/span&gt;&lt;/a&gt;Aloqador ishlar&lt;/h4&gt;\n&lt;p&gt;Dvigatellar ichida KV-holatlarini qayta ishlatish sohasida PagedAttention va RadixAttention kabi yechimlar maʼlumotlar GPU xotirasida boʻlgan vaqtda umumiy prefiksga ega soʻrovlar oʻrtasida holatni almashishga imkon beradi. Galahad ushbu tizimlarning interfeyslaridan foydalanadi va qayta ishlatish imkoniyatlarini GPU xotirasi va jarayon muddati chegaralaridan tashqariga kengaytiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KV-kesh (Key-Value cache) — bu transformerlardagi eʼtibor (attention) hisob-kitoblarining oraliq natijalari boʻlib, ularni saqlash matn generatsiyasini tezlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;KV-holatlarini yuklash va saqlash qismida LMCache va Mooncake kabi tizimlar maʼlumotlarni CPU operativ xotirasiga yoki diskka koʻchiradi. CacheGen holatni siqadi, CacheBlend va RAGCache esa fragmentlarni birlashtirishda taxminiy hisoblashga yoʻl qoʻyadi. Galahad aniq bit-bay-bit moslik talabi bilan ajralib turadi: har qanday nomuvofiqlik xato deb hisoblanadi. Qidiruv vazifalarida Galahad oʻxshashlik boʻyicha reytinglash usullaridan (masalan, BM25) farqli oʻlaroq, hujjatlarning aniq qismlarini qaytarishga qaratilgan. Treningni talab qiladigan Cartridges tizimlaridan farqli oʻlaroq, Galahad KV holatini qoʻshimcha oʻqitishsiz saqlaydi. Hozirgi ish muallifning Merlin dedublikatsiya tizimi va KV-holatlarini payvandlash usullari boʻyicha ishlanmalarini yagona tizimga birlashtiradi.&lt;/p&gt;\n&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Tadqiqot natijalari uchta asosiy tezisni tasdiqlaydi. Birinchidan, model holatini saqlash va qayta ishlatish mumkin: tiklangan holat barcha 30 ta sinovdan o‘tgan modelda logitlarning (chiqish qiymatlari) aynan bir xilligini ta’minladi. Ikkinchidan, qayta foydalanish prompt hisob-kitoblarini xotiradan o‘qish operatsiyasiga aylantiradi: yettita real ma’lumotlar to‘plamida prompt tokenlarining 98,7% qismi xotiradan olingan. Uchinchidan, xotiraning har bir elementi samaradorlikni oshiradi: KV-keshni (kalit va qiymatlar) saqlash modelga o‘zining kontekst oynasidan 8 barobar katta matnlar korpusi bilan ishlash imkonini berdi, bunda llama.cpp tezligi 3,1 barobar oshdi. Matn xotirasini qo‘shish jarayonni yana 4,7 barobar tezlashtirdi va energiya sarfini 2,7 barobar kamaytirdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Doimiy xotiradan foydalanish modelga kontekst oynasidan 8 barobar katta ma’lumotlar bilan ishlash imkonini beradi, hisob-kitoblarni 4,7 barobargacha tezlashtiradi va energiya sarfini 2,7 barobar kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Bu natijalar &lt;a href=\"concepts/inferens.html\"&gt;inferens&lt;/a&gt; xarajatlari tuzilishini o‘zgartiradi. Hozirda so‘rov qiymati promptdagi matn hajmiga mutanosib ravishda o‘sadi. Doimiy xotira bilan u faqat yangi, oldin o‘qilmagan matn hajmiga bog‘liq bo‘ladi. Bir xil hujjatlarga qayta murojaat qilishni talab qiladigan vazifalar (foydalanuvchilarni qo‘llab-quvvatlash, dasturlash, yuridik vazifalar) uchun bu xarajatlarni sezilarli darajada kamaytiradi. Shuningdek, bu ixchamroq modellarni katta hajmdagi ma’lumotlar bilan ishlashga yaroqli qiladi. «Stateless» (holatsiz) inferensdan «stateful» (holatli) inferensga o‘tish — ishning asosiy xulosasidir.&lt;/p&gt;\n&lt;h4 id=\"hisoblash-chegarasiga-munosabat\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#hisoblash-chegarasiga-munosabat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Hisoblash chegarasiga munosabat&lt;/span&gt;&lt;/a&gt;Hisoblash chegarasiga munosabat&lt;/h4&gt;\n&lt;p&gt;Galahad hisoblash quvvati bo‘yicha nazariy cheklovlarni inkor etmaydi. Model o‘zgarishsiz qoladi, har bir token uchun bajariladigan hisob-kitoblar ham o‘zgarmaydi. Faqat bu hisob-kitoblar nimalarga sarflanishi o‘zgaradi. Birinchidan, ish bir marta bajariladi: matn bloki uchun diqqat holati (attention state) saqlanadi va keyingi so‘rovlarda yuklanadi. Ikkinchidan, korpusda tegishli qismlarni qidirish CPUga o‘tkaziladi, model esa faqat o‘qish va javob berish vazifasini oladi. Uchinchidan, yuklangan holatning to‘g‘riligini tekshirish modelning o‘z-o‘zini baholashi orqali emas, balki baytma-bayt taqqoslash va kriptografik xeshlar orqali amalga oshiriladi. Galahad takroriy vazifalarni, qidiruv va verifikatsiyani modeldan tashqariga chiqarish orqali hisoblash chegarasini chetlab o‘tadi. Keyingi qadamlar Blaise’ning ikkinchi rejimini sinovdan o‘tkazish va PDF fayllardan ma’lumot olishni yaxshilashni o‘z ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Inferens — o‘qitilgan neyron tarmoqdan yangi ma’lumotlar bo‘yicha javob olish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mavjudlik\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#mavjudlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavjudlik&lt;/span&gt;&lt;/a&gt;Mavjudlik&lt;/h4&gt;\n&lt;p&gt;Galahadning ommaviy beta-versiyasi 2026-yil 1-oktabrdan https://github.com/corbenicai/galahad manzilida mavjud bo‘ladi. Beta-versiya 12 oy davomida bitta grafik protsessorda (GPU) notijorat maqsadlarda bepul foydalanish uchun ochiq. Tijoriy pilot loyihalar so‘rov bo‘yicha taqdim etiladi. Jadvallar uchun xom loglar ma’lumotlar to‘plami bilan birga nashr etiladi. Tizimning bir qismi uchun patent arizalari topshirilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-f1.jpg\" alt=\"1-rasm: Galahad soʻrovlarga xizmat koʻrsatish yoʻlida. Blaise savol tegishli boʻlgan matn parchasini tanlaydi; Taliesin \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Galahad soʻrovlarga xizmat koʻrsatish yoʻlida. Blaise savol tegishli boʻlgan matn parchasini tanlaydi; Taliesin model allaqachon qayta ishlagan har qanday blok uchun saqlangan KV holatini taqdim etadi va yangi bloklarni dastlabki toʻldirishdan (prefill) keyin saqlaydi. Agar yuklash tekshiruvdan oʻtmasa, ish vaqti muhiti (runtime) blokni qayta hisoblaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-f2.jpg\" alt=\"2-rasm: Har bir savol uchun oʻrtacha vaqtga nisbatan eslab qolish testining (recall test) aniqligi, har bir savoldan old\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Har bir savol uchun oʻrtacha vaqtga nisbatan eslab qolish testining (recall test) aniqligi, har bir savoldan oldin ish vaqti muhitining oʻz keshini tozalash sharti bilan (2-jadval). Rang konfiguratsiyani, shakl esa ish vaqti muhitini bildiradi. Galahadsiz model korpusning 88 foizini koʻra olmaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;kontekstni&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ortiqcha qayta&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;o'qish&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;KV-kash va&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;matn segmentat&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;siyasi&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;
