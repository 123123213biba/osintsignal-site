        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"145\" cy=\"177\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"675\" cy=\"165\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · FACT_CHECK   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Fan qayoqqa qarab ketmoqda:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Drift Inspector tadqiqotlar&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;evolyutsiyasini kuzatadi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f1.jpg\" alt=\"1-rasm: Drift Inspector interfeysining xarita koʻrinishi, EMNLP 2020–2025 yillardagi 16 576 ta atomar tasdiqlarni oʻz ic\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: &lt;a href=\"concepts/drift-inspector.html\"&gt;Drift Inspector&lt;/a&gt; interfeysining xarita koʻrinishi, EMNLP 2020–2025 yillardagi 16 576 ta atomar tasdiqlarni oʻz ichiga olgan interaktiv WebGL xaritasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Drift Inspector interfeysining xarita koʻrinishi, EMNLP 2020–2025 yillardagi 16 576 ta atomar tasdiqlarni oʻz ichiga olgan interaktiv WebGL xaritasi. Yuqori paneldagi yorliqlar rejimlarni (Xarita, Trendlar, Klasterlar, Taqqoslash yoki Metodlar) almashtirish imkonini beradi. Foydalanuvchi yil boʻyicha filtrni, rang rejimini (Klaster yoki Drift trendi) sozlashi yoki klasterlar boʻyicha moslik reytingi bilan tasdiqlarni qidirishi mumkin. Oʻng tomonda &lt;a href=\"concepts/filtratsiya.html\"&gt;filtrlash&lt;/a&gt; imkoniyati mavjud klasterlar roʻyxati joylashgan. Nuqta ustiga sichqonchani olib borganda tasdiq va klaster tarqalish trayektoriyasi koʻrsatiladi; bosilganda manba maqolaga havola bilan karta mahkamlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Ilmiy nashrlar soni keskin oshib bormoqda va tadqiqotlar yo‘nalishidagi o‘zgarishlarni kuzatish qiyinlashdi. Drift Inspector tizimi abstraktlardan muallifning aniq hissasini ajratib olib, ortiqcha ma’lumotlarni chetlab o‘tadi. Bu usul NLP sohasining klassik vazifalardan mulohaza yuritish va multimodal modellarga o‘tayotganini yaqqol ko‘rsatib beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;EMNLP (2020–2025) dan 16,576 ta atomar da’vo ajratib olindi.&lt;/li&gt;\n&lt;li&gt;Ilmiy hissalarni kodlash uchun SPECTER2 modeli ishlatildi.&lt;/li&gt;\n&lt;li&gt;Interaktiv xarita tadqiqotlar oqimini vizuallashtiradi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tizim &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; (Qwen3-235B) yordamida abstraktlarni «&lt;a href=\"concepts/atomarnyy-vklad.html\"&gt;atomar hissa&lt;/a&gt; da’volari» (&lt;a href=\"concepts/acc.html\"&gt;ACCs&lt;/a&gt;) deb ataluvchi tekshirilishi mumkin bo‘lgan qismlarga ajratadi. Ushbu da’volar iqtiboslar bog‘liqligi asosida o‘qitilgan SPECTER2 modeli yordamida vektorlashtiriladi va semantik fazoda joylashtiriladi. &lt;a href=\"concepts/klasterizatsiya.html\"&gt;Klasterlash&lt;/a&gt; uchun &lt;a href=\"concepts/hdbscan.html\"&gt;HDBSCAN&lt;/a&gt; algoritmi qo‘llanilib, u zich guruhlarni aniqlaydi va noyob tadqiqotlarni «shovqin» sifatida ajratib turadi.&lt;/p&gt;\n&lt;p&gt;Ma’lumotlar bazasi ACL Anthology’dan olingan 346 mingta da’vo va 80 mingta abstraktni qamrab oladi. WebGL interfeysi orqali har bir trendni bevosita manba maqolagacha kuzatish mumkin. Tizim konferensiyalar va mualliflar o‘rtasidagi farqlarni tahlil qilib, kalit so‘zlar statistikasi ko‘rsata olmaydigan chuqur o‘zgarishlarni yuzaga chiqaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar LLM ekstraksiyasi sifatiga bog‘liq va da’volarning 36% qismi klasterlanmagan shovqin sifatida qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Ilmiy annotatsiyalar koʻpincha tadqiqot hissasini kontekst, motivatsiya va meta-tavsiflar bilan aralashtirib yuboradi. Shu sababli, avtomatlashtirilgan vositalar ish natijalarini umumiy muhokamadan ajratib olishda qiynaladi. Ushbu muammoni hal qilish uchun Drift Inspector tizimi taqdim etildi — bu «atomik hissa daʼvolari» (Atomic Contribution Claims, ACCs) orqali ilmiy sohalarning evolyutsiyasini tahlil qilishga moʻljallangan ochiq kodli vositadir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Atomik hissa daʼvolari (ACC) — bu katta til modellari (LLM) yordamida annotatsiya matnidan kontekstdan xoli holda ajratib olingan ish natijalari haqidagi asosiy tezislardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim LLM yordamida annotatsiyalardan ACCni ajratib oladi va ularni yillar boʻyicha interaktiv xaritaga guruhlaydi. Bu har qanday aniqlangan tendensiyani aniq daʼvolar va asl ilmiy maqolalar bilan bogʻlash imkonini beradi. Ishlab chiquvchilar tizimni olti yil davomidagi EMNLP konferensiyasi materiallariga tatbiq etishdi. Maʼlumotlarni ajratib olish aniqligini tekshirish uchun inson ekspert bahosidan foydalanildi, klasterlash esa qoʻlda tuzilgan tashqi taksonomiya bilan solishtirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cheklov: tahlil aniqligi LLM modeli tomonidan daʼvolarni ajratib olish sifati va validatsiya uchun ishlatilgan qoʻlda tuzilgan taksonomiyaning toʻgʻriligiga bevosita bogʻliq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;EMNLP maʼlumotlarini tahlil qilish shuni koʻrsatdiki, NLP sohasi klassik vazifalardan LLM davri imkoniyatlariga, masalan, mulohaza yuritish (reasoning) va multimodallikka oʻtmoqda. Mualliflarning taʼkidlashicha, bunday siljishni kalit soʻzlarni oddiy sanash yoki butun annotatsiyani tahlil qilish usullari bilan aniqlab boʻlmaydi. Eʼlon qilingan maʼlumotlar toʻplami butun ACL Anthology kutubxonasini qamrab oladi, jumladan 346 000 ta daʼvo, 80 000 ta annotatsiya va 423 ta manba.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drift Inspector tizimi 80 000 ta annotatsiyadan 346 000 ta daʼvoni tahlil qilib, NLP tadqiqotlari diqqat markazi mulohaza yuritish va multimodallikka oʻtganini aniqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"atomic-contribution-claims-acc\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#atomic-contribution-claims-acc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Atomic Contribution Claims (ACC)&lt;/span&gt;&lt;/a&gt;Atomic Contribution Claims (ACC)&lt;/h4&gt;\n&lt;p&gt;ACL, EMNLP, NeurIPS va CVPR kabi yirik AI konferensiyalari har bir necha oyda minglab maqolalarni nashr etadi, bu esa ularni inson tomonidan to‘liq o‘qib chiqish imkoniyatidan tashqarida qoldiradi. LLM yordamida maqola yozishning avtomatlashuvi bu jarayonni yanada tezlashtirmoqda. Mavjud tizimlar (NLP Scholar, NLPExplorer, CL Scholar) so‘zlar chastotasi yoki mavzuli modellashtirish (LDA, BERTopic) asosida ishlaydi, biroq ular maqolaning motivatsion qismi bilan haqiqiy ilmiy hissasini farqlay olmaydi. Drift Inspector tizimi «atomar hissa da’volari» (Atomic Contribution Claims, ACC) — ya’ni kirish so‘zlari va boshqa ishlardan xoli bo‘lgan, tekshirilishi mumkin bo‘lgan tezislarni ajratib olish orqali ushbu bo‘shliqni to‘ldiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drift Inspector ACC yordamida maqolaning nima haqida gapirishi va nima hissa qo‘shishini ajratib, fanning rivojlanishini kuzatish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ACC — bu maqolaning kontekstidan qat’i nazar, mustaqil tekshirilishi mumkin bo‘lgan minimal ilmiy hissa birligidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sistema SPECTER2 modelidan foydalanib, da’volarni vektorlashtiradi, ularni yillar bo‘yicha klasterlaydi va mavzularning rivojlanish trayektoriyasini vizuallashtiradi. Veb-interfeys yillar, mualliflar va konferensiyalar bo‘yicha filtrlash imkonini beradi.&lt;/p&gt;\n&lt;h4 id=\"literature-exploration-systems\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#literature-exploration-systems\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Literature exploration systems&lt;/span&gt;&lt;/a&gt;Literature exploration systems&lt;/h4&gt;\n&lt;p&gt;NLP-KG yoki GenGo kabi tizimlar kalit so‘zlar yoki metama’lumotlar darajasida ishlaydi. Drift Inspector esa atamalar chastotasidan farqli o‘laroq, semantik hissa birliklarini tahlil qiladi. U trendlarning issiqlik xaritalarini (heatmap) yaratish va turli kohortalarni solishtirish imkonini beradi.&lt;/p&gt;\n&lt;h4 id=\"diachronic-analyses-of-nlp\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#diachronic-analyses-of-nlp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diachronic analyses of NLP&lt;/span&gt;&lt;/a&gt;Diachronic analyses of NLP&lt;/h4&gt;\n&lt;p&gt;Oldingi tadqiqotlar g‘oyalarning birgalikda uchrashi yoki taksonomiyalar orqali paradigma o‘zgarishlarini kuzatgan. Drift Inspector esa «pastdan yuqoriga» (bottom-up) yondashuvni qo‘llaydi, bu esa klasterlarning avtomatik shakllanishiga va tahlil jarayonining yagona vositaga birlashtirilishiga imkon beradi.&lt;/p&gt;\n&lt;h4 id=\"atomic-semantic-units\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#atomic-semantic-units\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Atomic semantic units&lt;/span&gt;&lt;/a&gt;Atomic semantic units&lt;/h4&gt;\n&lt;p&gt;ACC darajasidagi dekompozitsiya FActScore va atomar kontent birliklari tamoyillariga asoslanadi. Biz ushbu yondashuvni ilmiy metrikaga moslashtirdik, bunda ACC hisoblash birligi bo‘lib xizmat qiladi, ularning haqqoniyligi esa manba maqolaga tayanadi.&lt;/p&gt;\n&lt;h4 id=\"system-description\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#system-description\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;System Description&lt;/span&gt;&lt;/a&gt;System Description&lt;/h4&gt;\n&lt;p&gt;Drift Inspector ish jarayoni oflayn bosqich (ekstraksiya, klasterlash, statistika) va onlayn bosqich (interaktiv vizualizatsiya, Rasm 1 va Rasm 2) ga bo‘lingan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f1.jpg\" alt=\"1-rasm: Drift Inspector interfeysining xarita koʻrinishi, EMNLP 2020–2025 yillardagi 16 576 ta atomar tasdiqlarni oʻz ic\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Drift Inspector interfeysining xarita koʻrinishi, EMNLP 2020–2025 yillardagi 16 576 ta atomar tasdiqlarni oʻz ichiga olgan interaktiv WebGL xaritasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Drift Inspector interfeysining xarita koʻrinishi, EMNLP 2020–2025 yillardagi 16 576 ta atomar tasdiqlarni oʻz ichiga olgan interaktiv WebGL xaritasi. Yuqori paneldagi yorliqlar rejimlarni (Xarita, Trendlar, Klasterlar, Taqqoslash yoki Metodlar) almashtirish imkonini beradi. Foydalanuvchi yil boʻyicha filtrni, rang rejimini (Klaster yoki Drift trendi) sozlashi yoki klasterlar boʻyicha moslik reytingi bilan tasdiqlarni qidirishi mumkin. Oʻng tomonda filtrlash imkoniyati mavjud klasterlar roʻyxati joylashgan. Nuqta ustiga sichqonchani olib borganda tasdiq va klaster tarqalish trayektoriyasi koʻrsatiladi; bosilganda manba maqolaga havola bilan karta mahkamlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"atomic-contribution-claims\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#atomic-contribution-claims\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Atomic Contribution Claims&lt;/span&gt;&lt;/a&gt;Atomic Contribution Claims&lt;/h4&gt;\n&lt;p&gt;Mualliflar ilmiy maqolalar annotatsiyasidan «atomar hissalarni» (Atomic Contribution Claims, ACC) ajratib olishadi — bu meta-til va kontekstdan xoli, tekshirilishi mumkin boʻlgan qisqa bayonotlardir. Buning uchun qwen3-235b-a22b-thinking-2507 LLM modeli (harorat 0,2) qoʻllanadi. Annotatsiyalarni tanlash ularning mavjudligi va standartlashtirilganligi bilan asoslanadi. 2020–2025 yillardagi EMNLP konferensiyalarida tizim har bir annotatsiyadan oʻrtacha 3,58 (2020 yilda) dan 4,01 (2025 yilda) gacha boʻlgan daʼvolarni ajratib oldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Atomar hissa — bu usul yoki natija haqidagi birgina aniq, tekshirilishi mumkin boʻlgan bayonot boʻlib, u kirish soʻzlari va olmoshlardan xoli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"semantic-topology\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#semantic-topology\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Semantic Topology&lt;/span&gt;&lt;/a&gt;Semantic Topology&lt;/h4&gt;\n&lt;p&gt;Semantikani tahlil qilish uchun daʼvolar SPECTER2 modeli yordamida kodlanadi, soʻngra UMAP orqali oʻlchami kamaytiriladi va HDBSCAN algoritmi bilan klasterlanadi. Bu 80 ta tematik klasterni ajratib olish imkonini beradi. Daʼvolarning taxminan 36% «shovqin» sifatida tasniflanadi — bular hali umumiy maydon darajasidagi takrorlanuvchi naqshga aylanmagan noyob hissalardir. Ularning ulushi 2020–2022 yillardagi 31–34% dan 2025 yilda 42% gacha oʻsdi. Zichlikka asoslangan klasterlash «shovqin»ni asosiy tematik guruhlar chegaralarini buzmasdan fon qatlami sifatida saqlab qolish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2025 yildagi hissalarning taxminan 42% noyob boʻlib, barqaror tematik klasterlarni hosil qilmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"drift-quantification\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#drift-quantification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Drift Quantification&lt;/span&gt;&lt;/a&gt;Drift Quantification&lt;/h4&gt;\n&lt;p&gt;Mavzuning tarqalganligi yil davomida maqolalarda tilga olinish chastotasi P_y(c) orqali baholanadi. Bu bitta maqolada bir turdagi koʻplab daʼvolar boʻlganda yuzaga keladigan buzilishlarni istisno qiladi. Tizim mutlaq siljish Δ DF(c), nisbiy oʻzgarish RDF(c) va trend xaritasidagi rangli indikatsiyani belgilovchi logarifmik drift koeffitsiyentini hisoblab chiqadi.&lt;/p&gt;\n&lt;h4 id=\"the-drift-inspector-frontend\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#the-drift-inspector-frontend\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The Drift Inspector Frontend&lt;/span&gt;&lt;/a&gt;The Drift Inspector Frontend&lt;/h4&gt;\n&lt;p&gt;Interfeys beshta moduldan iborat veb-ilova hisoblanadi: «Xarita» (16 576 ta daʼvoning interaktiv vizualizatsiyasi), «Trendlar» (qiyosiy grafiklar), «Klasterlar» (batafsil profillar), «Taqqoslash» (ikkita tanlovni tahlil qilish) va «Metodlar». Barcha maʼlumotlar interaktiv boʻlib, ACL Anthology'dagi asl maqolalarga oʻtish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vizualizatsiya 16 576 ta daʼvoga asoslangan; interfeys maʼlumotlarni yillar boʻyicha filtrlash imkonini beradi, biroq trendlarni talqin qilishda yangi usullar barqaror klasterlarni shakllantirishga ulgurmagan boʻlishi mumkinligini hisobga olish kerak.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"amalga-oshirish-va-mavjudlik\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#amalga-oshirish-va-mavjudlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Amalga oshirish va mavjudlik&lt;/span&gt;&lt;/a&gt;Amalga oshirish va mavjudlik&lt;/h4&gt;\n&lt;p&gt;Konveyer Python tilida transformers, adapters, umap-learn, hdbscan va Plotly kutubxonalari yordamida amalga oshirilgan. Har bir bosqich oraliq natijalarni (CSV fayllar, &lt;a href=\"concepts/embedding.html\"&gt;embedding&lt;/a&gt; matritsalari, proyeksiyalar, klasterlar) keshlaydi va stoxastik jarayonlar seed orqali qayd etiladi, bu esa klasterizatsiyaning konfiguratsiya fayllaridan qayta tiklanishini taʼminlaydi. Maʼlumotlarni qayta chiqarish umumiy koʻrsatkichlarni takrorlaydi, biroq LLM dekodlash xususiyatlari tufayli aynan bir xil satrlarni bermasligi mumkin. Butun jarayonni minimal API xarajatlari va hisoblash resurslari bilan qayta bajarish mumkin. Foydalanuvchi interfeysi tashqi bogʻliqliklarni talab qilmaydigan mustaqil fayldir. Kod MIT litsenziyasi, maʼlumotlar toʻplami esa CC BY 4.0 litsenziyasi ostida chiqarilgan. B ilovasida &lt;a href=\"concepts/ekstraktor.html\"&gt;ekstraktor&lt;/a&gt; parametrlari, embedding chekpointlari va klasterizatsiya giperparametrlari koʻrsatilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim klasterizatsiyaning toʻliq takrorlanishini taʼminlaydi va har qanday hajmdagi korpuslarni minimal xarajat bilan tahlil qilish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Masshtablilik ACL Anthology toʻliq korpusida (80 144 abstrakt, 423 konferensiya, 346 010 daʼvo) gpt-oss-120b ekstraktori yordamida tasdiqlangan. Qayta ishlash qiymati taxminan 40 AQSH dollarini tashkil etdi. Drift Inspector vositasi konferensiyalar va mualliflar oʻrtasidagi kogortalarni bir bosish bilan solishtirish imkonini beradi (3-rasm). EMNLP korpusida usul klasterlar validligini va sarlavhalar siljishining barcha 15 yoʻnalishini saqlab qoladi. Tashqi hakam (LLM) 300 ta daʼvodan iborat namunalarni 96,7–99,7% «Good» aniqlik bilan baholadi (nazorat guruhida 98,3%).&lt;/p&gt;\n&lt;h4 id=\"masshtablilik-va-xarajat\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#masshtablilik-va-xarajat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Masshtablilik va xarajat&lt;/span&gt;&lt;/a&gt;Masshtablilik va xarajat&lt;/h4&gt;\n&lt;p&gt;Ekstraksiya qiymati korpus hajmiga chiziqli bogʻliq (1-jadval). gpt-oss-120b dan foydalanish 1000 ta abstrakt uchun taxminan 0,50 AQSH dollariga tushadi. Qwen3-235B-Thinking kabi murakkabroq modellar yashirin mulohazalar xarajatlari tufayli 1000 ta abstrakt uchun taxminan 11 AQSH dollarini tashkil etadi, bunda daʼvolarni ajratib olish sifati bunday quvvatni talab qilmaydi. Ekstraksiyadan keyingi barcha operatsiyalar (embedding, proyeksiyalar, klasterizatsiya) oddiy noutbukda bir soatdan kam vaqt ichida bajariladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ekstraktor — bu matndan ilmiy daʼvolarni ajratib oluvchi model.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baholash\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash&lt;/span&gt;&lt;/a&gt;Baholash&lt;/h4&gt;\n&lt;p&gt;Mualliflar ikki muhim bosqichni baholaydilar: daʼvolarni ajratib olish sifati va klasterlar validligi (EMNLP 2020–2025 korpusi). Sifat salbiy nazorat namunalari bilan stratifikatsiyalangan tanlamada, klasterlar validligi esa SToP taksonomiyasi bilan kesishgan 653 ta maqolada tekshiriladi.&lt;/p&gt;\n&lt;h4 id=\"davolar-sifatini-inson-tomonidan-tekshirish\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#davolar-sifatini-inson-tomonidan-tekshirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Daʼvolar sifatini inson tomonidan tekshirish&lt;/span&gt;&lt;/a&gt;Daʼvolar sifatini inson tomonidan tekshirish&lt;/h4&gt;\n&lt;p&gt;Uch ekspert 180 ta elementni (136 ta tasodifiy daʼvo va 44 ta maxsus kiritilgan notoʻgʻri misol) belgilab chiqdi. Daʼvo atomar, oʻzini oʻzi taʼminlaydigan va ilmiy hissa qoʻshsa, «Good» deb hisoblanadi. Ekspertlar kelishuvi yuqori (Fleiss’ κ = 0,844). Ekspertlar 97,8%, 91,8% va 90,5% daʼvolarni «Good» deb baholadilar va 100% (44/44) kiritilgan salbiy misollarni aniqladilar. Mustaqil hakam (Gemini LLM) ekspertlar fikri bilan 94,5% hollarda mos keldi (κ = 0,863).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Baholash cheklangan tanlamada oʻtkazildi, modellarning asosiy xatosi tadqiqot natijalari oʻrniga fon kontekstini ajratib olishdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tashqi-taksonomiyaga-nisbatan-klasterlar-validligi\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#tashqi-taksonomiyaga-nisbatan-klasterlar-validligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tashqi taksonomiyaga nisbatan klasterlar validligi&lt;/span&gt;&lt;/a&gt;Tashqi taksonomiyaga nisbatan klasterlar validligi&lt;/h4&gt;\n&lt;p&gt;Klasterizatsiya 653 ta maqola (2020–2021) boʻyicha SToP taksonomiyasi oltin standarti bilan solishtirildi. Sakkizta konfiguratsiya, jumladan mavzuli modellashtirish (LDA, NMF), abstrakt darajasidagi neyron klasterizatsiya (SPECTER2 va MPNet enkoderlari bilan BERTopic) va taklif etilgan daʼvo darajasidagi klasterizatsiya (ACC) solishtirildi.&lt;/p&gt;\n&lt;h4 id=\"asosiy-xulosalarning-mustahkamligi\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#asosiy-xulosalarning-mustahkamligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy xulosalarning mustahkamligi&lt;/span&gt;&lt;/a&gt;Asosiy xulosalarning mustahkamligi&lt;/h4&gt;\n&lt;p&gt;Tadqiqotning asosiy natijasi — 2020–2025 yillar oralig‘ida mavzularning tarqalishidagi o‘zgarishlarni ko‘rsatuvchi 15 ta klaster. Mualliflar ushbu ma’lumotlarning mustahkamligini oltita parametr bo‘yicha tekshiradilar: statistik ahamiyatlilik, vaqtinchalik kesimlar, enkoder tanlovi, klasterlarni moslashtirish qoidalari, ajratib olish modeli va klasterlash giperparametrlari. Barcha 15 ta siljish statistik jihatdan ahamiyatli (ikki proporsiya uchun z-test, p &amp;lt; 0,001) va 95 foizlik &lt;a href=\"concepts/butstrep.html\"&gt;butstrap&lt;/a&gt; ishonch intervallari nolni istisno qiladi.&lt;/p&gt;\n&lt;h4 id=\"ikki-kesim\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#ikki-kesim\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ikki kesim&lt;/span&gt;&lt;/a&gt;Ikki kesim&lt;/h4&gt;\n&lt;p&gt;Olti yil davomidagi trendlar monoton (masalan, parsing ulushi 5,1 foizdan 0,1 foizgacha kamaygan), bu faqat boshlang‘ich va oxirgi nuqtalarni solishtirishda artefaktlar yo‘qligini tasdiqlaydi. Enkoderlar almashtirilganda (8 ta neyron tarmoq modeli va TF-IDF + SVD sinovdan o‘tkazildi) natijalar barqaror qoladi: 15 ta holatdan 11–14 tasida trend yo‘nalishi saqlanib qoladi. Klasterlarni moslashtirish qoidalarini o‘zgartirish yoki boshqa ajratib olish modelidan (gpt-oss-120b) foydalanish ham dastlabki 15 ta trendni tasdiqlaydi. Klasterlash giperparametrlarining 36 ta kombinatsiyasini qayta ko‘rib chiqish (UMAP va HDBSCAN) ARI 0,79–0,95 indeksini beradi va barcha 15 ta asosiy xulosani saqlab qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Butstrap — xulosalarning ishonchliligini tekshirish uchun ma’lumotlar qayta-qayta tanlab olinadigan statistik baholash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;EMNLP konferensiyasining 4 488 ta maqolasini tahlil qilish klassik vazifalar ulushining kamayganini ko‘rsatadi: parsing 4,9 foiz punktga (2020 yilga nisbatan 97 foizga), mashina tarjimasi va dialog tizimlari esa 3,7–4,4 foiz punktga qisqardi. Ularning o‘rnini LLM davri mavzulari egalladi: multimodal modellar 3,1 barobar (+9,1 f.p.), agentlar esa 10 barobardan ortiq (10,3 marta) o‘sdi. Yo‘qolib borayotgan vazifalar butunlay g‘oyib bo‘lmaydi, balki fragmentlarga bo‘linib, «shovqin» qatlamiga yoki qo‘shni klasterlarga o‘tib ketadi.&lt;/p&gt;\n&lt;h4 id=\"foydalanish-holatlari\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#foydalanish-holatlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Foydalanish holatlari&lt;/span&gt;&lt;/a&gt;Foydalanish holatlari&lt;/h4&gt;\n&lt;p&gt;Tizim tadqiqotchilarga yo‘nalishlarning istiqbolini baholash imkonini beradi. Masalan, «retrieval» so‘rovi bo‘yicha qidiruvda klaster ulushining 2020 yildagi 0,7 foizdan 2025 yilda 3,3 foizgacha o‘sganini ko‘rish mumkin. Shuningdek, vosita turli konferensiyalarni (masalan, ACL va COLING) yoki mualliflar kogortalarini solishtirish imkonini beradi, bu BERT va LLM mavzularini solishtirish uchun 5-rasmda ko‘rsatilganidek, ularning mavzuli profillaridagi farqlarni aniqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar aniq konferensiyalarning xususiyatlarini aks ettiradi va butun NLP sohasiga to‘liq tatbiq etilmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nimalar-rivojlanmoqda-va-nimalar-otmishga-aylanmoqda\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#nimalar-rivojlanmoqda-va-nimalar-otmishga-aylanmoqda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nimalar rivojlanmoqda va nimalar oʻtmishga aylanmoqda?&lt;/span&gt;&lt;/a&gt;Nimalar rivojlanmoqda va nimalar oʻtmishga aylanmoqda?&lt;/h4&gt;\n&lt;p&gt;Trends algoritmi har bir mavzuiy klasterni 2020-yildan 2025-yilgacha boʻlgan davrdagi oʻzgarishlar dinamikasi asosida baholaydi va ishonchlilikni aniqlash uchun butstrap-intervallardan foydalanadi. Bu qarama-qarshi tendensiyalarni vizuallashtirish imkonini beradi: bir qutbda LLM mantiqiy xulosalari (LLM reasoning) va vizual-til modellari (vision-language modeling) joylashgan boʻlsa, ikkinchi qutbda sintaktik tahlil turibdi, uning ulushi 4,9 foiz punktga kamaydi, bu nisbiy hisobda 97% pasayishni anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sintaktik tahlil boʻyicha tadqiqotlar deyarli toʻxtagan va 2020-yilga nisbatan 97% ga qisqargan, shu bilan birga mantiqiy xulosa chiqaruvchi va multimodal modellar asosiy yoʻnalishlarga aylangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tarqalish koʻrsatkichi kamida bitta daʼvoni oʻz ichiga olgan maqolalarni hisobga olganligi sababli, metodologiya soʻnayotgan sohalar va butunlay yoʻqolgan mavzularni farqlash imkonini beradi. Daʼvolar boʻyicha qidiruv shuni koʻrsatadiki, sintaktik tahlilning qoldiq eslatmalari endi mustaqil guruh hosil qilmay, «shovqin qatlami» yoki qoʻshni klasterlar boʻylab tarqalib ketgan. Tor ixtisoslashgan atamalar uchun ham xuddi shunday holat kuzatiladi: masalan, «yumor» mavzusi boʻyicha qidirilganda, topilgan natijalarning aksariyati shovqin qatlamida aniqlanadi va ularning har biri oʻzining asl manba maqolasi bilan bogʻlangan holda qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/butstrep-intervaly.html\"&gt;Butstrap-intervallari&lt;/a&gt; — bu maʼlumotlarni qayta-qayta tanlab olish orqali aniqlangan tendensiyalarning qanchalik ishonchli ekanligini baholashga yordam beradigan statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Drift Inspector tasdiqlangan daʼvolarni ajratib olish quvurini ilmiy soha qanday oʻzgarayotganini kuzatish uchun interaktiv vositaga aylantiradi. Tizim mualliflarning motivatsiyasi lugʻatidan koʻra, ular oʻz ishlariga qoʻshgan hissa deb daʼvo qilgan narsalarni aks ettiradi. Asbob toʻliq ochiq (MIT kodi, CC BY maʼlumotlari) va korpusga bogʻliq emas: annotatsiyalari boʻlgan har qanday maydonni bir oʻtishda tahlil qilish mumkin. Kelgusi &lt;a href=\"concepts/step.html\"&gt;qadam&lt;/a&gt; — klasterlarni navigatsiya qilinadigan super-temalarga birlashtiradigan ierarxik tizimni joriy etish.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drift Inspector maʼlumotlar va kodning toʻliq ochiqligini taʼminlagan holda, eʼlon qilingan hissalarga asoslanib ilmiy tendensiyalar dinamikasini kuzatish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cheklovlar\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h4&gt;\n&lt;p&gt;Tahlil annotatsiyalarga tayanadi, ular koʻpincha texnik nuanslar va salbiy natijalarni oʻtkazib yuboradi, baʼzi hissalar esa faqat maqola matnida boʻlishi mumkin. Tasdiqlangan natijalar faqat bitta konferensiya (EMNLP) bilan cheklangan. Biz chiqargan kattaroq maʼlumotlar toʻplamlari (oltita ACL maydoni) faqat LLM-hakam tomonidan nazorat qilingan, inson tomonidan qayta tekshirilmagan, shuning uchun ularning klaster boʻyicha raqamlariga ehtiyotkorlik bilan yondashish kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Inson ishtirokisiz avtomatik LLM tekshiruvi asosida olingan natijalar pastroq isbot darajasiga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Quvur LLM-ekstraktoriga tayanadi, u xatolarga (gallyutsinatsiyalar, maʼlumotlarni notoʻgʻri ajratish) yoʻl qoʻyishi mumkin. Garchi bu xavflar validatsiya sxemalari va LLM-hakam yordamida kamaytirilgan boʻlsa-da, ular butunlay yoʻq qilinmagan. Inson tomonidan validatsiya mualliflar tomonidan 136 ta daʼvo boʻyicha amalga oshirilgan, shuning uchun kelishuv darajasi qisman umumiy tayyorgarlikni aks ettiradi, salbiy misollar esa tabiiy xatolar emas, balki ataylab yaratilgan buzilishlardir. Klasterlash UMAP/HDBSCAN giperparametrlari va embedding modeliga bogʻliq. Mavzu siljishi yoʻnalishlari butstrap-resampling, sakkizta enkoder va leksik vakillikda barqaror, ammo klaster chegaralari va yorliqlari oʻzgarishi mumkin, siljish statistikasi esa sababiy emas, balki tavsifiy xarakterga ega.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f3.jpg\" alt=\"3-rasm: Taqqoslash rejimi, konferensiyalar boʻyicha kogortalar (olti maydon uchun jonli nusxa): ACL va COLING oʻrtasidag\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Taqqoslash rejimi, konferensiyalar boʻyicha kogortalar (olti maydon uchun jonli nusxa): ACL va COLING oʻrtasidagi eng katta farqlar, klaster tasdiqlari ulushidagi tafovut sifatida.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: Taqqoslash rejimi, konferensiyalar boʻyicha kogortalar (olti maydon uchun jonli nusxa): ACL va COLING oʻrtasidagi eng katta farqlar, klaster tasdiqlari ulushidagi tafovut sifatida. COLING klassik NLP (embeddinglar, aspektga asoslangan sentiment tahlili, NER, hodisalarni ajratib olish) profilini kuchliroq saqlab qoladi, ACL esa LLM davri klasterlariga (samarali mulohaza yuritish, koʻp tilli LLM, koʻrish–til baholashi) moyil. Chiplar vizualizatsiyani (tarqaluvchi grafiklar / gantellar / sochilish diagrammalari) almashtiradi; xuddi shu rejim mualliflar va kalit soʻzlar boʻyicha aniqlangan kogortalarni taqqoslashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f4.jpg\" alt=\"4-rasm: Tizim tomonidan oʻlchangan EMNLP (2020–2025) dagi ilmiy drift. Tarqaluvchi ustunlar eng koʻp oʻsayotgan va kamay\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Tizim tomonidan oʻlchangan EMNLP (2020–2025) dagi ilmiy drift. Tarqaluvchi ustunlar eng koʻp oʻsayotgan va kamayayotgan ACC klasterlari uchun maqola darajasidagi hujjatlar chastotasining oʻzgarishini (foiz punktlarida) koʻrsatadi, 2020 va 2025 yillardagi ulushlar bilan izohlangan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f6.jpg\" alt=\"6-rasm: Eng koʻp kamayayotgan va eng koʻp oʻsayotgan sakkizta ACC klasteri uchun yillik hujjatlar chastotasi trayektoriy\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Eng koʻp kamayayotgan va eng koʻp oʻsayotgan sakkizta ACC klasteri uchun yillik hujjatlar chastotasi trayektoriyalari (maqola darajasidagi DF, maqolalarning %), kanonik klasterlash asosida hisoblangan. Yorliqlar klasterlarning qisqacha nomlari; toʻliq nomlar va c-TF-IDF deskriptorlari chiqarilgan maʼlumotlar bilan birga taqdim etiladi. Yakuniy nuqtalardagi oʻzgarishlar statistik jihatdan ahamiyatli, bootstrap CI noldan farq qiladi (§4.3).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f7.jpg\" alt=\"7-rasm: Bir konferensiya uchun diaxronik koʻrinish (Taqqoslash, vaqt oʻtishi bilan, bump chart): yillik hujjatlar chasto\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Bir konferensiya uchun diaxronik koʻrinish (Taqqoslash, vaqt oʻtishi bilan, bump chart): yillik hujjatlar chastotasi boʻyicha reytinglangan EMNLPning eng yaxshi klasterlari (1 = eng koʻp uchraydigan). Koʻrish–til modellashtirish 2024 yilga kelib 1-oʻringa chiqadi; LLM samaradorligi 14-oʻrindan 3–5-oʻringa koʻtariladi; summarization 31-oʻringa tushadi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI sohasidagi&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;maqolalar&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ko‘pligi&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;atomar&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;da’volarni&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ajratib olish&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke
