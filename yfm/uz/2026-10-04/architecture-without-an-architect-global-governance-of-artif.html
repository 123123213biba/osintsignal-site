            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"188\" cy=\"64\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"492\" cy=\"291\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · NARRATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellektni kim&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;boshqaradi: global qoidalar&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;arxitektori haqidagi afsona&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Sun'iy intellektni global tartibga solish hali ham parchalangan va deklarativ xarakterga ega. Hokimiyat manfaatlar to'qnashuvi kuzatiladigan davlatlar va xususiy korporatsiyalar o'rtasida taqsimlangan. Yagona «chizma» izlash o'rniga, SI arxitekturasi o'z-o'zidan shakllanayotganini tan olish kerak.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SI tartibga solish parchalangan: asosiy tashabbuslarda atigi 7 ta davlat ishtirok etadi.&lt;/li&gt;\n&lt;li&gt;Hokimiyat turli &lt;a href=\"concepts/retrieval-augmented-generation.html\"&gt;rag&lt;/a&gt;'batlarga ega davlatlar va xususiy kompaniyalar o'rtasida taqsimlangan.&lt;/li&gt;\n&lt;li&gt;SI institutlarni to'liq o'zgartirishni emas, balki normalarni yangi voqelikka moslashtirishni talab qiladi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Matteys Maasning «SI global boshqaruv arxitekturalari» tadqiqoti tartibga solish landshaftini sotsiotexnik o'zgarishlar nuqtai nazaridan tahlil qiladi. Muallif G7 yoki BMT kabi tashabbuslar faqat sanoqli davlatlarni qamrab olib, ko'pchilikni huquqiy maydondan tashqarida qoldirayotganini ta'kidlaydi. Tartibga solish muhiti «reaktivlik»dan aziyat chekadi, bunda texnologiyalarni cheklash urinishlari ko'pincha kechikadi yoki tartibga solish arbitrajiga olib keladi.&lt;/p&gt;\n&lt;p&gt;Maas SI sohasidagi hokimiyat infratuzilma va texnik yechimlarni nazorat qiluvchi xususiy kompaniyalar qo'lida to'planganini ta'kidlaydi. O'tmishdagi texnologiyalardan farqli o'laroq, SI butunlay yangi makonlarni yaratmaydi, balki mavjud yurisdiksiyalarni o'zgartiradi. Asosiy muammo umumiy rejaning yo'qligida: davlatlar majburlov kuchiga ega, ammo kompaniyalar himoya mexanizmlarini joriy etish uchun zarur bo'lgan ekspertizaga ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ish nazariy xarakterga ega va amaliyot uchun tayyor siyosiy chizmalarni taklif etmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&
