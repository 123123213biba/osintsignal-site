            {"data":{"leading":false,"html":"&lt;p&gt;27 ta maqola&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html\"&gt;AI yashirin fikrlashni o'rgana oladimi?&lt;/a&gt; — Sun'iy intellekt o'z mulohazalarini oddiy matn ichiga yashirishi mumkinmi? Tadqiqot buning juda qiyin ekanligini ko'rsatdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html\"&gt;Nega sun'iy intellekt yozgan ilmiy maqolalar bir xil qolipda?&lt;/a&gt; — Tadqiqotchilar sun'iy intellekt yozgan ilmiy maqolalar kirish qismi odamlarnikiga qaraganda ancha bashorat qilinadigan ekanligini aniqlashdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html\"&gt;Shaharsozlikda sun'iy intellekt: shahar muhitini o'zgartirishning yangi usuli&lt;/a&gt; — Qimmat simulyatsiyalar o'rniga — shahar muhitini yaxshilash uchun real takliflar beruvchi aqlli agent.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html\"&gt;LiteReality-Agent: xonalarni kod yordamida interaktiv 3D-modellarga aylantirish&lt;/a&gt; — Tadqiqotchilar sun'iy intellekt agentlarini RGB-D skanlardan foydalanib, xonalarning raqamli egizaklarini yaratishga o'rgatdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html\"&gt;Sizning AI-agentingiz nega «aqlli» bo'lib ko'rinadi: benchmark tuzog'i&lt;/a&gt; — Standart testlar ko'pincha kichik til modellarini o'zlari bajara olmaydigan vazifalar uchun maqtaydi. AI qobiliyatini qanday tekshirishni o'rganamiz.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html\"&gt;Zarlar bilan rejalashtirish: neyron tarmoqlarni xilma-xil javoblar berishga majburlash&lt;/a&gt; — Nega zamonaviy sun'iy intellekt zerikarli javoblar beradi va Gacha Decoding usuli tasodifiy sonlar yordamida buni qanday o'zgartiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html\"&gt;Sun'iy intellekt yordamida xatosiz infografikalarni yaratish usuli&lt;/a&gt; — InfoAgent tizimi infografikadagi har bir elementni aniq ma'lumotlar bilan bog'lab, xatolarni avtomatik tuzatish imkonini beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html\"&gt;Sun'iy intellekt yordamida sun'iy yo'ldosh tasvirlarini avtomatik hisoblash&lt;/a&gt; — Yangi hududlar uchun modelni qayta o'qitmasdan, sun'iy yo'ldosh suratlaridagi binolar va kemalarni qanday aniq sanash mumkin?&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html\"&gt;Sun'iy intellekt matnlari nega modellarni zaiflashtiradi&lt;/a&gt; — Tadqiqotchilar aniqlashicha, o'quv bazasida sun'iy intellekt matnlari ko'payishi model sifatini tushiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html\"&gt;Nega neyrotarmoqlar Kali Linux buyruqlarida xato qiladi va buni qanday tuzatish kerak&lt;/a&gt; — KaliBench bilan tanishing — sun'iy intellektni kiberxavfsizlik vositalarini xatosiz boshqarishga o'rgatuvchi yangi benchmark.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html\"&gt;Ishonch — bu ball emas: sun'iy intellekt agentlarini qanday cheklash kerak&lt;/a&gt; — AI xavfsizlik reytingi tizim ishonchliligini kafolatlamaydi. Qanday qilib qat'iy nazorat qoidalarini joriy etish mumkin?&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html\"&gt;Ijtimoiy tarmoqlarda faktlarni tekshirish: sun'iy intellekt va odamlar hamkorligi&lt;/a&gt; — Community Notes tizimi qanday qilib sun'iy intellekt yordamida noto'g'ri ma'lumotlarga qarshi kurashayotganini tahlil qilamiz.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html\"&gt;Neyrotarmoqlar aniqligi: barqarorlik illyuziyasi&lt;/a&gt; — Biz sun'iy intellektni o'rtacha ball bilan baholashga o'rganganmiz, ammo so'rovni shunchaki qayta ifodalash modelni xatoga yetaklashi mumkin.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html\"&gt;Mashina sudyasi: neyrotarmoqlar nega eng yaxshi emas, balki birinchi kelgan tasvirni tanlaydi&lt;/a&gt; — Tasvirlarni tanlash algoritmlari ko'pincha tarafkashlikdan aziyat chekadi: ular sifatliroq bo'lganini emas, ro'yxatda birinchi turganini tanlaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html\"&gt;AI-agentlarga qilingan hujumlarni oldindan bashorat qilish usuli&lt;/a&gt; — SSH tizimi AI himoyasini shaxmat o‘yiniga aylantirib, xavfli harakatlarni amalga oshishidan oldin aniqlaydi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html\"&gt;Robot o‘tmishni eslaydi: yashiringan narsalarni topish usuli&lt;/a&gt; — Robotlar ko‘zdan g‘oyib bo‘lgan narsalarni topishda qiynaladi. BeyondSCe tizimi ularga voqealar ketma-ketligini tahlil qilib, maqsadni topishga yordam beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/learning-to-structure-data-from-user-generated-thematic-corp.html\"&gt;Tayyor andozalarsiz tartibsiz postlardan aniq ma'lumotlar bazasini qanday yig'ish mumkin&lt;/a&gt; — Yangi LLM algoritmi matnlardagi yashirin parametrlarni aniqlab, inson darajasidagi aniqlikda jadval tuzadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html\"&gt;Ijtimoiy tarmoqlar haqiqatni buzib ko'rsatadimi?&lt;/a&gt; — Ijtimoiy tarmoqlarni feyklar tarqatishda ayblashadi, ammo tadqiqotlar ularning haqiqatni idrok etishimizga ta'siri minimal ekanini ko'rsatmoqda.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html\"&gt;Sun'iy intellekt uchun yolg'on detektorlari: nega ular rol o'ynashda adashadi&lt;/a&gt; — Neyrotarmoqlar javoblaridagi yolg'onni aniqlovchi algoritmlar ko'pincha rol o'ynashni haqiqat deb qabul qiladi. Nega bunday bo'lishini tahlil qilamiz.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html\"&gt;VISTA: neyrotarmoqlarni ko'rganlarini «eslab qolishga» o'rgatish&lt;/a&gt; — Yangi vizual interfeys AI-agentlarga o'tmishdagi kadrlarni saqlash va qayta ko'rish imkonini beradi, bu esa ularning aniqligini keskin oshiradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html\"&gt;Ijtimoiy tarmoqlarda biz nimani tanlaymiz: algoritmlarmi yoki tanish doira?&lt;/a&gt; — Bluesky tahlili shuni ko'rsatdiki, foydalanuvchi diqqatining 80% qismi obuna bo'lgan doirasidan atigi ikki qadam nariga boradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html\"&gt;Fan qayoqqa qarab ketmoqda: Drift Inspector tadqiqotlar evolyutsiyasini kuzatadi&lt;/a&gt; — Olimlar minglab ilmiy maqolalarni interaktiv trendlar xaritasiga aylantiruvchi tizim yaratishdi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html\"&gt;Sun'iy intellekt o'zligini unutganda: agent shaxsi qanday yo'qoladi?&lt;/a&gt; — Sizning AI yordamchingiz odatdagidek muloqot qilishi mumkin, ammo u allaqachon o'zligini yo'qotgan bo'lishi mumkin.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp.html\"&gt;Neyrotarmoqlar nega xushomad qiladi: yolg'on va sovuqqonlik tuzog'i&lt;/a&gt; — AI ko'pincha ko'r-ko'rona rozi bo'lish va qo'pollik o'rtasida tanlov qiladi. FIGS benchmarki modellarni samimiy va to'g'ri bo'lishga o'rgatadi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html\"&gt;Nega sun'iy intellekt qidiruv tizimlari uchun optimallashtirish kutilganidek ishlamaydi&lt;/a&gt; — Neyrotarmoq javobiga bir marta tushgan manba u yerda uzoq qoladi. «Suhbat tutib olish» fenomenini tahlil qilamiz.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html\"&gt;Bulutli neyron tarmoqlarda ma'lumotlar maxfiyligini qanday saqlash kerak&lt;/a&gt; — Yangi ReCast usuli hisob-kitob aniqligini yo‘qotmasdan, bulutli modellarga himoyalangan ma’lumotlarni yuborish imkonini beradi.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html\"&gt;Sun'iy intellektni kim boshqaradi: global qoidalar arxitektori haqidagi afsona&lt;/a&gt; — Dunyo sun'iy intellektni jilovlamoqchi, ammo yagona boshqaruv markazi yo'q. Nega qoidalar arxitekturasi bosh me'morsiz qurilayotganini tahlil qilamiz.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"27 ta maqola"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Hafta 2026-10-02 — 2026-10-04","description":"27 ta maqola","vcsPath":"articles/collections/week-2026-w40.md"},"headings":[],"title":"Hafta 2026-10-02 — 2026-10-04"},"router":{"pathname":"articles/collections/week-2026-w40","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
