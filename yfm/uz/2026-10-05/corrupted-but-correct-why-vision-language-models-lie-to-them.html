        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"81\" cy=\"128\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"619\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · IMAGE_FORENSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Neyrotarmoqlar nima uchun&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o'zini aldashadi: o'qitish&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;va natija o'rtasidagi&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tafovut&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-f1.jpg\" alt=\"1-rasm: 200 ta tasvir va barcha uchta natija guruhi boʻyicha har bir tokenga nisbatan ehtimollik tahlili. Toʻgʻri olding\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: 200 ta tasvir va barcha uchta natija guruhi boʻyicha har bir tokenga nisbatan ehtimollik tahlili. Toʻgʻri oldingi A tokeni kontekstda mavjud boʻlganda, _coconut maqsadli tokenining rangi har bir tasvir va har bir guruh uchun, ham toza, ham dushmanona (adversarial) maʼlumotlar uchun nol dispersiyali 3488 qiymatida tekis chiziqni tashkil etadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Zamonaviy ko'p modalli modellar (&lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt;) «o'qitish va xulosa chiqarish tafovuti»ni namoyon qiladi: ular majburiy o'qitishda osonlikcha chalg'ishi, lekin erkin generatsiyada bu xatolarni e'tiborsiz qoldirishi mumkin. Qwen2.5-VL-7B modeli ustida o'tkazilgan tahlil shuni ko'rsatadiki, hujumlarga chidamlilik vizual enkoder emas, balki til dekoderi tomonidan belgilanadi. Bu kashfiyot sun'iy intellekt tizimlarini himoya qilishda asosiy e'tiborni tasvirlardan til ustuvorliklariga o'tkazishni talab qiladi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Piksel va tekstura statistikasi model zaifligini oldindan ayta olmaydi (r=-0.050).&lt;/li&gt;\n&lt;li&gt;Tafovut generatsiyaning aniq bir qadamida lokalizatsiya qilingan.&lt;/li&gt;\n&lt;li&gt;Hujumlarga chidamlilik vizual enkoderning emas, til dekoderining xususiyatidir.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"usullar-va-aniqlik\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#usullar-va-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va aniqlik&lt;/span&gt;&lt;/a&gt;Usullar va aniqlik&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Usul&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ma'lumotlar&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Aniqlik&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Cheklov&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Object Texture Intensity (OTI)&lt;/td&gt;\n&lt;td&gt;200 ta COCO val2017 tasviri&lt;/td&gt;\n&lt;td&gt;r=-0.050, p=0.484&lt;/td&gt;\n&lt;td&gt;VLM uchun bashorat qilish kuchi yo'q&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ridge Regression&lt;/td&gt;\n&lt;td&gt;9 ta tasvir xususiyati&lt;/td&gt;\n&lt;td&gt;R^2=0.069&lt;/td&gt;\n&lt;td&gt;Zaiflikni tushuntira olmaydi&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Linear Probe&lt;/td&gt;\n&lt;td&gt;Birlashtirilgan yashirin holat&lt;/td&gt;\n&lt;td&gt;AUC=0.858&lt;/td&gt;\n&lt;td&gt;Aylanma mantiq xavfi mavjud&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqot COCO val2017 to'plamidan olingan 200 ta tasvir yordamida «o'qitish va xulosa chiqarish tafovuti» mexanizmini o'rgandi. Mualliflar har bir bosqichda 500 iteratsiyadan iborat ikki bosqichli &lt;a href=\"concepts/projected-gradient-descent.html\"&gt;PGD&lt;/a&gt; (proyeksiyalangan gradient tushishi) hujumini qo'llashdi. «&lt;a href=\"concepts/logit-lens.html\"&gt;Logit lens&lt;/a&gt;» (logit linzasi) vositasi yordamida dekoderning 28 ta qatlamidagi maqsadli tokenning o'rni kuzatildi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatadiki, vizual enkoder har bir tasvirni deyarli bir xil darajada buzadi, hujum muvaffaqiyatidan qat'i nazar. Biroq, til dekoderi chidamli modellarda bu buzilishlarni faol ravishda bostiradi (p&amp;lt;0.001, rank-biserial r=0.579). Birlashtirilgan yashirin holatdagi chiziqli zond (linear probe) muvaffaqiyatli va muvaffaqiyatsiz hujumlarni &lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;=0.858 aniqlik bilan ajratib beradi, bu esa til ustuvorligi asosiy himoya qalqoni ekanligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat Qwen2.5-VL-7B arxitekturasi va 200 ta tasvir bilan cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Maqsadli adversarial (sunʼiy) shovqinlar VLM-modelining (Qwen2.5-VL-7B-Instruct) «oʻqituvchi» (teacher-forcing) yordamida oʻqitishdagi yoʻqotish funksiyasini belgilangan tavsif uchun nolga yaqinlashtirishi mumkin. Biroq, model erkin matn generatsiya qilganda, maqsadli taʼsir izlarisiz asl va toʻgʻri tavsifni qaytaradi. Mualliflar bu hodisani «oʻqitish/xulosa chiqarish tafovuti» (train/inference gap) deb atashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;COCO toʻplamidan olingan 200 ta tasvir ustida oʻtkazilgan tadqiqot shuni koʻrsatdiki, model erkin generatsiya rejimida hujumlarni eʼtiborsiz qoldiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot COCO maʼlumotlar toʻplamidan olingan 200 ta tasvir ustida ikki bosqichli PGD hujumi yordamida amalga oshirildi. Mualliflar piksel statistikasi va CNN mustahkamligi boʻyicha tadqiqotlardan olingan teksturaviy zaiflik koʻrsatkichlarini tahlil qilishdi. Statistik tahlil (ridge regression) ushbu koʻrsatkichlarning bashorat qilish qobiliyati yoʻqligini koʻrsatdi: korrelyatsiya koeffitsiyenti r = -0,050 (p = 0,484), determinatsiya koeffitsiyenti esa R² = 0,069 ni tashkil etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PGD-hujum (Projected Gradient Descent) — neyron tarmoqni xato qilishga majburlovchi tasvir oʻzgarishlarini topishning iterativ usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Logit lens usuli yordamida mualliflar tafovutni bitta avtoregressiv qadamda aniqlashdi. Birinchi toʻgʻri token generatsiya qilingan sharoitda, maqsadli tokenning rangi 152 064 ta lugʻat birligidan aynan 3488-oʻrinda qotib qolgan. &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; dekoderining 28 ta qatlami boʻylab kuzatuv shuni koʻrsatdiki, vizual enkoder barcha tasvirlarga oʻxshash darajada buzilish kiritadi. Biroq, til dekoderi signalni turlicha qayta ishlaydi: zaif tasvirlar uchun uni kuchaytiradi, chidamli tasvirlar uchun esa bostiradi (p &amp;lt; 0,001, rank-biserial r = 0,579). Yashirin holatdagi chiziqli zond (linear probe) ushbu natijalarni AUC = 0,858 aniqlik bilan ajratadi, garchi mualliflar ushbu baholashda aylanma mantiq (circularity) xavfi borligini taʼkidlashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mualliflar chiziqli zondni baholashda aylanma mantiq muammosi mavjudligini qayd etishadi, bu esa natijalarni talqin qilishda ehtiyotkorlikni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Vizual-til modellari (VLM) vizual maʼlumotlar bilan ishlaydigan tizimlarning asosiy qismi sifatida tobora koʻproq qoʻllanilmoqda. Bunday tizimlarning asosiy zaifligi — bu «adversarial perturbations» (dushmanona shovqinlar) boʻlib, ular tasvir pikselidagi koʻzga koʻrinmas oʻzgarishlar orqali modelni notoʻgʻri natija berishga majbur qiladi. CNN klassifikatorlaridan farqli oʻlaroq, VLM arxitekturasi murakkabroq: shovqin vizual enkoder, modal oʻzaro bogʻlovchi va avtoregressiv til dekoderidan oʻtishi kerak. Tadqiqotchilar Qwen2.5-VL-7B-Instruct modelida paradoksni aniqladilar: PGD usuli yordamida «teacher-forcing» (majburiy oʻqitish) rejimida model hujumchi tanlagan matnni deyarli 100% ehtimollik bilan chiqaradi. Biroq, erkin generatsiya rejimida model shovqinni eʼtiborsiz qoldirib, asl tasvirni toʻgʻri tasvirlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot shuni koʻrsatadiki, majburiy oʻqitish rejimida muvaffaqiyatli boʻlgan hujumlar erkin generatsiya rejimida har doim ham ish bermaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar ushbu tafovutni COCO val2017 toʻplamidan olingan 200 ta tasvir yordamida, ikki bosqichli PGD protokoli va har bir qatlamda «logit lens» usulini qoʻllab tahlil qiladilar. Asosiy savollar: buzilishlar piksel statistikasi bilan bogʻliqmi (RQ1), xatolik generatsiyaning qaysi bosqichida yuz beradi (RQ2) va dekoder buzilgan signalni qanday qayta ishlaydi (RQ3). Natijalar shuni koʻrsatadiki, VLM barqarorligi faqat vizual enkoderga bogʻliq emas: asosiy qarshilik til dekoderi tomonidan amalga oshiriladi, u buzilgan signalni kuchaytirishi yoki bostirishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Logit lens — bu neyron tarmoqning ichki holatini soʻzlar fazosiga proyeksiyalash orqali modelning oʻsha lahzadagi «fikrini» tushunishga yordam beradigan interpretatsiya usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"related-work-adversarial-attacks-and-the-train/inference-gap\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#related-work-adversarial-attacks-and-the-train/inference-gap\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Related Work Adversarial attacks and the train/inference gap&lt;/span&gt;&lt;/a&gt;Related Work Adversarial attacks and the train/inference gap&lt;/h4&gt;\n&lt;p&gt;PGD kabi anʼanaviy hujum usullari CNN uchun yaxshi oʻrganilgan. Biroq, VLM uchun «exposure bias» (ekspozitsiya xatosi) hodisasi kuzatiladi. Mualliflar ushbu tafovutni birinchi marta alohida tokenlar darajasida miqdoriy baholaydilar.&lt;/p&gt;\n&lt;h4 id=\"image-attackability\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#image-attackability\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Image attackability&lt;/span&gt;&lt;/a&gt;Image attackability&lt;/h4&gt;\n&lt;p&gt;CNN uchun ishlab chiqilgan mavjud zaiflik metrikalari (masalan, OTI) 75% gacha aniqlik koʻrsatadi. Ushbu ishda ushbu usullar VLM vizual enkoderlariga mos kelishi tekshiriladi. Shuningdek, mualliflar birinchi marta logit lensni buzilgan vizual tokenlarga qoʻllab, qatlamlararo signallarni hujum natijasi bilan bogʻlaydilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot VLM arxitekturasi va muayyan hujum turlari bilan cheklangan; natijalar barcha turdagi modellarga taalluqli boʻlmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"feature\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#feature\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Feature&lt;/span&gt;&lt;/a&gt;Feature&lt;/h4&gt;\n&lt;p&gt;Tadqiqot Qwen2.5-VL-7B modelining tasvir xususiyatlari va zaifligi oʻrtasidagi bogʻliqlikni tahlil qiladi. OTI (obyekt tekstura intensivligi) koʻrsatkichi toʻgʻri amalga oshirilganda zaiflik bilan statistik ahamiyatli bogʻliqlikni koʻrsatmaydi (r = −0,050, p = 0,484). Aksincha, butun tasvirning tekstura intensivligi va yuqori chastotali komponentlar zaif, ammo ahamiyatli korrelyatsiyani namoyon etadi (r = −0,299, p &amp;lt; 0,001). Mualliflar buzilgan vizual signallarni bostirish vizual kodlovchi darajasida emas, balki LLMning kechki qatlamlarida FFN mexanizmlari orqali sodir boʻlishini taxmin qilishadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Standart tekstura metrikalari model zaifligini bashorat qila olmaydi, bu ViT arxitekturalari va klassik CNNlar oʻrtasidagi fundamental farqlarni koʻrsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"experimental-setup-model\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#experimental-setup-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Experimental Setup Model&lt;/span&gt;&lt;/a&gt;Experimental Setup Model&lt;/h4&gt;\n&lt;p&gt;Eksperimentlarda bfloat16 formatidagi, vaznlari muzlatilgan Qwen2.5-VL-7B-Instruct modeli ishlatildi. Vizual kodlovchi 32 ta ViT blokini (patch oʻlchami 14) va 1024 tokenni 256 taga siquvchi proyektorni oʻz ichiga oladi. Dataset sifatida COCO val2017’dan 448×448 oʻlchamiga keltirilgan 200 ta tasvir tanlab olindi. Maqsadli ketma-ketlik — «A coconut» (3 token). Hujum momentli PGD usuli (µ=0,9, ε=16/255, α=4/255) yordamida ikki bosqichda amalga oshirildi: avval kodlovchini, keyin esa butun kontekstni optimallashtirish. Tasvirlar guruhlarga ajratildi: A (n=38, taʼsirchan), B (n=9, oʻqitish/xulosa chiqarishdagi tafovut) va C (n=153, barqaror).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PGD (Projected Gradient Descent) — tasvir pikselini belgilangan ε chegarasida oʻzgartirib, modelni notoʻgʻri javobga undaydigan iterativ hujum usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rq1encoder-susceptibility-is-not-predictable-from-pixels\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#rq1encoder-susceptibility-is-not-predictable-from-pixels\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ1:Encoder Susceptibility Is Not Predictable from Pixels&lt;/span&gt;&lt;/a&gt;RQ1:Encoder Susceptibility Is Not Predictable from Pixels&lt;/h4&gt;\n&lt;p&gt;Toʻqqizta modelsiz belgini (tekstura, chastotalar, muntazamlik, obyektlar hajmi va b.) tahlil qilish zaiflikning ishonchli bashoratchilari yoʻqligini koʻrsatdi. 72 ta GLCM belgisi bilan Random Forest klassifikatoridan foydalanish urinishi aniqlikni 69,0% dan 64,0% gacha pasaytirdi. Zaiflik semantik kategoriya bilan bogʻliq boʻlib chiqdi: masalan, yuk mashinalari va poyezdlar 50–67% hollarda zaif, qushlar va karavotlar esa barqaror (0%). Bu zaiflik tekstura kabi oddiy vizual xususiyatlarga bogʻliqligi haqidagi gipotezani rad etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot faqat aniq ViT arxitekturasi bilan cheklangan; natijalar boshqa vizual kodlovchilarga taalluqli boʻlmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"group\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#group\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Group&lt;/span&gt;&lt;/a&gt;Group&lt;/h4&gt;\n&lt;p&gt;Tahlil shuni koʻrsatdiki, hujum barcha guruhlarda toʻgʻri birinchi token P(A) generatsiya qilinishi ehtimolini pasaytiradi. Asosiy natija: generatsiyaning ikkinchi bosqichida «_coconut» maqsadli tokenining rangi barcha 200 ta tasvir uchun, guruh yoki sharoitdan (toza yoki dushmanona maʼlumotlar) qatʼi nazar, 152 064 ta imkoniyatdan 3488-oʻrinda qoladi. Standart ogʻish nolga teng (2-jadval). Hujumning ushbu bosqichdagi muvaffaqiyati 0,0% ni tashkil etadi.&lt;/p&gt;\n&lt;h4 id=\"yakuniy-llm-qatlami-chiqish-malumotlarini-birlashtirish\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#yakuniy-llm-qatlami-chiqish-malumotlarini-birlashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yakuniy LLM qatlami chiqish ma'lumotlarini birlashtirish&lt;/span&gt;&lt;/a&gt;Yakuniy LLM qatlami chiqish ma'lumotlarini birlashtirish&lt;/h4&gt;\n&lt;p&gt;Tadqiqot model xatti-harakatlarini dushmanona hujumlarga (adversarial attacks) chidamliligi asosida uchta guruhga (A, B, C) ajratadi. A guruhi (ta'sirchan) 8714 ta tasvirni o'z ichiga oladi, bunda dushmanona daraja (rank) toza ma'lumotlarga nisbatan 5724 birlikka pasayadi. B guruhi (bo'shliq) 10 258 ta tasvirni o'z ichiga olib, darajaning 2274 birlikka pasayishini ko'rsatadi. C guruhi (chidamli) 50 ta tasvirdan iborat tanlanma (jami 153 tadan) bilan ifodalanadi, bunda dushmanona ta'sir ostida daraja 8571 birlikka oshadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modelning hujumlarga chidamliligi ta'sir intensivligi bilan emas, balki arxitektura xususiyatlari bilan belgilanadi: C guruhi uchun dushmanona daraja ε = 16/255 bo'lganda ham o'zgarishsiz qolib, 8571 birlikka ortadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;PGD (Projected Gradient Descent) usuli uchta tokendan iborat maqsadli ketma-ketlik uchun o'qituvchi majburlovi (teacher-forcing) paytidagi o'rtacha yo'qotishlarni kamaytiradi. Biroq, bu muvaffaqiyat o'rtacha ko'rsatkichdir: model ikkinchi tokenda tarkibiy nosozlikni namoyon qiladi, bunda shovqin byudjeti til ustuvorligini o'zgartira olmaydi. O'qitish va xulosa chiqarish (train/inference gap) o'rtasidagi tafovut ta'sir darajasi bilan emas, balki model hujumga chidamli bo'lib qoladigan aniq token pozitsiyasi bilan belgilanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PGD — bu model xatosini maksimallashtirish uchun kirish ma'lumotlariga kichik o'zgarishlar kiritadigan iterativ hujum algoritmi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"faktlarga-asoslangan-va-vizual-malumotlarga-tayanadigan-vlm-tizimlarini-joriy-etish-oqibatlari\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#faktlarga-asoslangan-va-vizual-malumotlarga-tayanadigan-vlm-tizimlarini-joriy-etish-oqibatlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Faktlarga asoslangan va vizual maʼlumotlarga tayanadigan VLM tizimlarini joriy etish oqibatlari&lt;/span&gt;&lt;/a&gt;Faktlarga asoslangan va vizual maʼlumotlarga tayanadigan VLM tizimlarini joriy etish oqibatlari&lt;/h4&gt;\n&lt;p&gt;Bizning natijalarimiz shuni koʻrsatadiki, piksel yoki vizual enkoder darajasidagi himoya usullari yetarli emas. Enkoder yakuniy natijadan qatʼi nazar, barcha tasvirlarni deyarli bir xil darajada buzadi. Shu sababli, faqat vizual kanal bilan ishlaydigan himoya (pre-processing, enkoderning mustahkamligi yoki piksel statistikasi filtrlari) model xatti-harakatini belgilovchi signalni koʻra olmaydi. Istiqbolli yoʻnalish — bu birlashtiruvchi blok (merger) va LLM-dekoder oʻrtasiga oʻrnatiladigan yengil anomaliya detektori, chunki aynan shu yerda tasvirlarning reprezentativ farqi eng yuqori boʻladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vizual enkoder darajasidagi himoya samarasiz; anomaliya detektorini merger va LLM-dekoder oʻrtasiga joylashtirish maqsadga muvofiq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"himoya-mexanizmi\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#himoya-mexanizmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Himoya mexanizmi&lt;/span&gt;&lt;/a&gt;Himoya mexanizmi&lt;/h4&gt;\n&lt;p&gt;Til modeli oʻzida ichki himoya mexanizmiga ega: u aniq semantik mazmunga ega tasvirlar (masalan, qushlar yoki karavotlar) uchun raqobatbardosh buzilishlarni ishonchli tarzda yengib oʻtadi, ammo murakkab sahnalarda (yuk mashinalari, poyezdlar, tartibsiz interyerlar) ojiz qoladi. Bu tartibsiz muhitda ishlaydigan avtonom agentlar uchun juda muhimdir. Bundan tashqari, bizning natijalarimiz VLM ishonchliligini baholash yondashuvini oʻzgartiradi. Faqat aniq maqsadli ibora bilan moslikni oʻlchaydigan protokollar 0,0% muvaffaqiyatni koʻrsatishi va vizual enkoderning buzilganligini eʼtibordan chetda qoldirishi mumkin. Biz &lt;a href=\"concepts/semanticheskiy-dreyf.html\"&gt;semantik siljish&lt;/a&gt; va ichki reprezentativ buzilishlarni bevosita oʻlchashni taklif qilamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Semantik siljish — bu tashqi buzilishlar tufayli model vizual belgilarni notoʻgʻri talqin qila boshlaydigan maʼno oʻzgarishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cheklovlar\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h4&gt;\n&lt;p&gt;Tadqiqot natijalari sabab-oqibat emas, balki korrelyatsion xarakterga ega. Biz 15–18-qatlamlardagi bostirish sabablarini tasdiqlash uchun aktivatsiyalarni yamoqlash (activation patching) tajribalarini oʻtkazmadik. Tadqiqot faqat bitta model (Qwen2.5-VL-7B-Instruct) va bitta turdagi maqsadli sarlavhalar bilan cheklangan. Biz xulosalarimizni barcha arxitekturalar uchun universal deb daʼvo qilmaymiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bitta model va 200 ta tasvir bilan cheklangan; xulosalarni boshqa arxitekturalarga avtomatik tarzda tatbiq etib boʻlmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"etika-va-malumotlarni-oshkor-qilish\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#etika-va-malumotlarni-oshkor-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Etika va maʼlumotlarni oshkor qilish&lt;/span&gt;&lt;/a&gt;Etika va maʼlumotlarni oshkor qilish&lt;/h4&gt;\n&lt;p&gt;Ushbu ish yangi hujum usulini yaratmaydi, balki mavjud zaifliklar sinfini tavsiflaydi. Biz mexanistik tahlilni himoya tadqiqotlarini qoʻllab-quvvatlash uchun eʼlon qilamiz va optimallashtirilgan hujum chekpointlarini tarqatmaymiz. Tajribalar shaxsiy maʼlumotlarga daxldor emas va faqat ochiq COCO val2017 toʻplamida oʻtkazilgan.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-f1.jpg\" alt=\"1-rasm: 200 ta tasvir va barcha uchta natija guruhi boʻyicha har bir tokenga nisbatan ehtimollik tahlili. Toʻgʻri olding\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: 200 ta tasvir va barcha uchta natija guruhi boʻyicha har bir tokenga nisbatan ehtimollik tahlili. Toʻgʻri oldingi A tokeni kontekstda mavjud boʻlganda, _coconut maqsadli tokenining rangi har bir tasvir va har bir guruh uchun, ham toza, ham dushmanona (adversarial) maʼlumotlar uchun nol dispersiyali 3488 qiymatida tekis chiziqni tashkil etadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-f2.jpg\" alt=\"2-rasm: Barcha 28 ta LLM dekoder qatlamlari boʻyicha guruhlar kesimida maqsadli token rangining siljishi (dushmanona min\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Barcha 28 ta LLM dekoder qatlamlari boʻyicha guruhlar kesimida maqsadli token rangining siljishi (dushmanona minus toza). A guruhi (taʼsirchan) jarayon davomida maqsadga nisbatan ijobiy siljishni saqlab qoladi; C guruhi (chidamli) taxminan 15–18-qatlamlarda salbiy siljishga — toza maʼlumotlar bazaviy darajasidan past boʻlgan faol susaytirishga oʻtadi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;VLM o'qitish&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va xulosa&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;tafovuti&lt;/text&gt;&lt;path stro
