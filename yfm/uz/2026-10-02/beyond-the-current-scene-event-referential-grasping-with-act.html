        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"146\" cy=\"132\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"494\" cy=\"272\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Robot o‘tmishni eslaydi:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;yashiringan narsalarni&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;topish usuli&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f1.jpg\" alt=\"1-rasm: Voqeaga asoslangan ushlash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Voqeaga asoslangan ushlash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Voqeaga asoslangan ushlash. (A) VoLo, VLM orkestratori, yo'riqnoma nishonini to'g'ri aniqlaydi va uning matnli tavsifini VLA (π0.5) yoki WAM (Cosmos3-Nano-Policy) ga uzatadi. Shunga qaramay, ikkala quyi model ham yashirin nishonni aniqlay olmaydi va ushlay olmaydi. (B) Bizning tizim esa o'tmishdagi kuzatuvlar asosida fazoviy ishonchni ishga tushiradi, nishonni ochib beradigan ko'rish nuqtasini faol tanlaydi va uni muvaffaqiyatli ushlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Tadqiqotchilar robotlarga o‘tmishdagi harakatlar asosida narsalarni topish imkonini beruvchi BeyondSCe tizimini taqdim etishdi. Agar kerakli buyum ko‘rinmay qolsa, robot video yozuvni tahlil qiladi va uni topish uchun eng qulay nuqtalarni tanlaydi. Ushbu texnologiya maxsus o‘qitishni talab qilmaydi va oddiy RGB-D kameralar bilan ishlaydi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Yashiringan ob’ektlarni olish muvaffaqiyati 77% gacha oshdi.&lt;/li&gt;\n&lt;li&gt;Qidiruv uchun zarur bo‘lgan rakurslar soni 3.35 tadan 2.20 tagacha kamaydi.&lt;/li&gt;\n&lt;li&gt;Tayyor o‘qitilgan modellar qo‘llaniladi, qo‘shimcha o‘qitish shart emas.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;BeyondSCe tizimi ko‘rsatmalarni tahlil qilish uchun multimodal til modellari (MLLM) va nuqtalarni kuzatish algoritmlaridan foydalanadi. Foydalanuvchi «hozirgina ishlatilgan buyumni ol» deb buyruq berganda, tizim video tarixini ko‘rib chiqib, ob’ektni va uning oxirgi joylashuvini aniqlaydi. Agar maqsad hozirgi kadrda ko‘rinmasa, robot o‘tmishdagi ma’lumotlarni joriy sahna geometriyasi bilan birlashtirib, fazoviy ehtimollik xaritasini yaratadi.&lt;/p&gt;\n&lt;p&gt;Yashiringan ob’ektni topish uchun robot faol idrok etish usulini qo‘llaydi: u kamera harakatlarini kamaytirish uchun ko‘rish nuqtalarini baholaydi. Manipulyator va bilakka o‘rnatilgan RGB-D kamera yordamida o‘tkazilgan tajribalarda yashiringan ob’ektlarni olish muvaffaqiyati 77% ni tashkil etdi. Bu ko‘rsatkich mavjud analoglardan sezilarli darajada yuqori bo‘lib, qidiruv jarayonini optimallashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim samaradorligi videodagi ob’ektlarni kuzatish aniqligi va RGB-D kameradan olingan chuqurlik ma’lumotlarining sifatiga bog‘liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Odamlar bilan hamkorlik qiluvchi robotlar o'tmishdagi voqealarga asoslangan topshiriqlarni bajara olishi kerak. Ko'pincha foydalanuvchi ob'ektni nomi yoki ko'rinishi bilan emas, balki u ishtirok etgan harakat orqali aniqlaydi. Bundan tashqari, buyruq berilgan vaqtda maqsadli ob'ekt ko'zdan g'oyib bo'lgan bo'lishi mumkin. Mualliflar BeyondCSe tizimini taqdim etishadi — bu voqealarga asoslangan (event-referential) nol-shot (zero-shot) robotli tutish tizimidir. Tizim voqealar tarixini va joriy sahnani tahlil qilib, ob'ektni aniqlaydi va tutish uchun lokallashtiradi. Agar ob'ekt yashiringan bo'lsa, tizim voqea haqidagi ma'lumotlarni joriy sahnaning geometriyasi bilan birlashtirib, ob'ektni ko'rsatadigan optimal kamera nuqtalarini tanlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BeyondCSe tizimi ko'rinadigan ob'ektlar uchun 76% va yashiringan ob'ektlar uchun 77% muvaffaqiyat ko'rsatkichiga erishadi, bu esa mavjud bazaviy usullardan sezilarli darajada yuqori.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim qo'shimcha maxsus treninglarsiz oldindan o'rgatilgan modellardan foydalanadi. Bilak qismiga o'rnatilgan bitta RGB-D kamerasi bilan o'tkazilgan real robot tajribalarida BeyondCSe ko'rinadigan ob'ektlar uchun 76% va yashiringanlari uchun 77% muvaffaqiyatga erishdi (eng kuchli bazaviy usullar mos ravishda 40% va 55% ko'rsatgan). Kuchli to'siqlar mavjud bo'lgan to'rtta qo'shimcha sahnada tizim muvaffaqiyat darajasini 75% dan 95% ga oshirdi va o'rtacha ko'rish nuqtalari sonini 3,35 tadan 2,20 tagacha qisqartirdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zero-shot o'qitish — bu tizimning maxsus tayyorgarliksiz yangi vazifalarni bajara olish qobiliyatidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Real ish joylari tarixga ega: robotga buyruq berilgunga qadar ob'ektlar joyidan qo'zg'alishi yoki ishlatilishi mumkin. «Men hozirgina ishlatgan narsani olib kel» kabi ko'rsatmalar robotdan voqealar ketma-ketligini tushunishni talab qiladi. An'anaviy til bilan boshqariladigan manipulyatsiya usullari odatda joriy sahnadagi vizual atributlarga tayanadi, bu esa o'tmishdagi rolga asoslangan vazifalarni bajarishda samarasizdir.&lt;/p&gt;\n&lt;p&gt;Zamonaviy ushlash tizimlari ko'pincha obyekt ko'rinmay qolganda uni aniqlash muammosiga duch keladi. VoLo kabi mavjud yondashuvlar obyektni identifikatsiya qilishi mumkin, ammo u to'siq ortida qolsa, ushlashni amalga oshira olmaydi. BeyondCSe tizimi bu bo'shliqni voqealar tarixidan foydalanib, obyektni topish va kamera uchun optimal nuqtani tanlash orqali to'ldiradi. Faqat joriy sahnaga tayanadigan usullardan farqli o'laroq, BeyondCSe obyektning o'tmishdagi harakatlarini tahlil qilib, uning qayerdaligini bashorat qiladi. Tizim ko'rinish nuqtalarini baholashda kuzatilmagan bo'shliqlarni inobatga olmaydi, bu esa kamera harakatini samaraliroq rejalashtirish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BeyondCSe tizimi voqealar tarixi va faol idrokni birlashtirib, robotga yashirin obyektlarni maxsus o'qitishsiz topish va ushlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim \"zero-shot\" (oldindan o'qitishsiz) prinsipi asosida ishlaydi. Dastlab, multimodal til modeli (MLLM) va nuqta kuzatuvchisi (point tracker) matnli ko'rsatmani voqealar tarixidagi obyekt bilan bog'laydi. Agar obyekt joriy kadrda aniqlansa, koordinatalar ushlash tizimiga uzatiladi. Aks holda, faol idrok moduli ishga tushadi: o'tmishdagi ma'lumotlar va joriy sahna geometriyasi asosida maqsadli obyektning ehtimoliy hajmiy modeli (volumetric target belief) yaratiladi. Kamera har bir harakatdan so'ng o'z tasavvurini yangilab boradi, toki obyekt topilmaguncha yoki sensor resurslari tugamaguncha.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Faol idrok — bu robotning yashirin obyekt haqida maksimal ma'lumot olish uchun kamerani mustaqil ravishda yo'naltirish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Til yordamida boshqariladigan ushlash tizimlari (LERF-TOGO, GraspMolmo) asosan 3D tasvirlar yoki bitta tasvir asosida ushlash nuqtalarini bashorat qilishga qaratilgan. Biroq, ular joriy ko'rish maydoni bilan cheklangan. BeyondCSe esa epizodik xotira va voqealar ketma-ketligidan foydalanadi. Mavjud manipulyatsiya modellaridan (masalan, MemoryVLA) farqli o'laroq, tizim maxsus topshiriqlar uchun o'qitishni talab qilmaydigan tayyor modellardan foydalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim samaradorligi voqealar tarixidagi nuqtalarni kuzatish aniqligiga bog'liq; agar obyekt dastlabki bosqichda yo'qolsa, qidiruv aniqligi pasayadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim maqsad tavsifi va fazoviy kuzatuvlar orqali bog'langan ikkita moduldan iborat (2-rasm). Agar video tahlili (III-C bo'lim) dastlabki tasvirdan 3D koordinatalarni aniqlay olsa, tizim darhol ushlashni tekshirishga o'tadi. Aks holda, tarixiy 3D kuzatuvlar faol idrok etish (III-D bo'lim) uchun ishlatiladi. Tizim qo'shimcha o'qitishsiz tayyor MLLM va nuqta kuzatuvchilaridan foydalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim dastlabki 3D ma'lumotlarning sifatiga qarab, darhol ushlash yoki maqsadni faol qidirish usulini avtomatik tanlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jarayon to'rt bosqichdan iborat (3A-rasm): RECORD hodisalar ketma-ketligini E=(e₁, . . . , e_N) shakllantiradi. SELECT ko'rsatma va yozuvni tahlil qilib, maqsad tavsifini va uni ajratib turuvchi belgilarni (cue) yaratadi. LOCATE dastlabki I₀ tasvirida qidiruv maydonini taklif qiladi, POINT esa harakat nuqtasini qaytaradi. Agar kesilgan tasvirlar (crop) natija bermasa, qidiruv maydoni to'liq tasvirgacha kengaytiriladi. Olingan nuqta chuqurlik xaritasi va kamera pozitsiyasi yordamida 3D fazoga o'tkaziladi.&lt;/p&gt;\n&lt;p&gt;Agar dastlabki tasvirda maqsad topilmasa, tizim o'tmishdagi kadrlarni tahlil qiladi va P=(q₁, . . . , q_m) (1-tenglama) 3D koordinatalarini aniqlaydi, bu esa maqsad haqidagi dastlabki tasavvurni shakllantiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Grounding» usuli tizimga matnli ko'rsatma qaysi ob'ektga tegishli ekanligini, hatto u qisman to'silgan bo'lsa ham, tushunishga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Dastlabki M₀ xaritasi RGB-D ma'lumotlaridan TSDF sifatida quriladi. Maqsadning ehtimollik taqsimoti b_t(x) (2-5 tenglamalar) orqali ishga tushiriladi. (5)-formuladagi ε parametri butun ishchi sohada &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; nolga teng bo'lmagan ehtimollikni ta'minlaydi, bu esa tarixiy baholashlar noto'g'ri bo'lganda tizimni tiklashga yordam beradi.&lt;/p&gt;\n&lt;p&gt;Yangi ko'rinishlarni qidirish uchun tizim &lt;span class=\"yfm-latex\" data-content=\"%5CXi_t\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; nomzodlar to'plamini yaratadi va ularni to'qnashuvlarga tekshiradi. Har bir &lt;span class=\"yfm-latex\" data-content=\"%5Cxi\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; nomzod uchun kuzatuv ehtimoli &lt;span class=\"yfm-latex\" data-content=\"L%5E-_t(x%3B%20%5Cxi)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; va ko'rinish ishonchliligi &lt;span class=\"yfm-latex\" data-content=\"T_t(x%3B%20%5Cxi)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (6-tenglama) baholanadi. Optimal ko'rinish &lt;span class=\"yfm-latex\" data-content=\"%5Cxi%5E*_t\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (7-8 tenglamalar) funksiyasini maksimallashtirish orqali tanlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Metod samaradorligi chuqurlik ma'lumotlarining aniqligiga va real vaqtda TSDF xaritasini qurish imkoniyatiga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Harakat bajarilgandan so‘ng, tizim kalit kadrni qayd etadi, chuqurlik ma’lumotlarini Mt+1 xaritasiga integratsiya qiladi va (9)-tenglama bo‘yicha maqsadli ehtimollikni yangilaydi. Ehtimollik modeli chuqurlik mosligi Ldep,t+1(x) va maqsadni o‘tkazib yuborish ehtimoli Lmiss,t+1(x) ni birlashtiradi. Agar obyekt topilmasa, tizim hududni butunlay istisno qilmaydi, balki uning vaznini pasaytiradi. Qidiruv jarayoni yuqori ehtimollik p^* topilguncha yoki faol kuzatuv byudjeti tugaguncha davom etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim qidiruvni aniqlashtirish uchun salbiy kuzatuvlardan foydalanadi va potentsial zonalarni muddatidan oldin rad etmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;p^* tasdiqlangach, tizim ushlash (grasp) uchun nomzodlarni generatsiya qiladi. Obyekt geometriyasi to‘liq bo‘lmaganda, robot qo‘shimcha markazlashtirilgan skanerlashni amalga oshiradi. Oldindan belgilangan qidiruv hududlaridan farqli o‘laroq, bu yerda qidiruv hududi faqat voqeaga asoslangan tahlildan so‘ng aniqlanadi.&lt;/p&gt;\n&lt;p&gt;Tajribalar ROBOTIS OMY-F3M roboti va Intel RealSense D435i kamerasi yordamida o‘tkazildi. Hisob-kitoblar NVIDIA GeForce RTX 4090 GPU bazasida bajarildi. Dataset 150 ta sinovni o‘z ichiga oladi: 50 ta ko‘rinadigan va 100 ta yashirin (oklyuziya) holatlar uchun. Sahnalar kundalik buyumlardan iborat. Ko‘rsatmalar voqealar ketma-ketligiga asoslangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oklyuziya — bu maqsadli obyekt boshqa narsalar bilan to‘silgan yoki kamera ko‘rish doirasidan tashqarida bo‘lgan holat.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ko‘rsatmalarni qayta ishlash uchun Qwen3-VL-8B modeli qo‘llaniladi. Videodan 96 ta kadr tanlab olinadi. Tizim parametrlari: &lt;span class=\"yfm-latex\" data-content=\"%5Crho%3D2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, δ₀=0.05 m, ε=0.1, κ=0.33. Kamera 0.10 m siljiganda yoki 15^° ga burilganda yangi kadr qo‘shiladi. I-jadvalda usulning muvaffaqiyati (76.7% va 50.0%) ko‘rsatilgan. II-jadvalda kuchli oklyuziya sharoitida tizim 95% gacha muvaffaqiyatga erishishi qayd etilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar cheklangan obyektlar to‘plami bilan laboratoriya sharoitida olingan, bu real uy muhitidan farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz virtual ko‘rinishlardan olingan AnyGrasp nomzodlaridan foydalanamiz, ularni birlashtiramiz va dublikat pozalarni yo‘qotish uchun no-maksimal bostirish (non-maximum suppression) usulini qo‘llaymiz. Samaradorlikni baholash uchun 3D-lokalizatsiya, rejalashtirish va ushlash bo‘yicha umumiy urinishlardan muvaffaqiyatli bo‘lganlarini qayd etamiz. Lokalizatsiya, agar bashorat qilingan 3D-nuqta robot bazasidagi inson tomonidan belgilangan 3D-ramka (bounding box) ichiga tushsa, muvaffaqiyatli hisoblanadi. Rejalashtirish maqsadli obyekt uchun yaroqli ushlash rejasi topilganda, ushlash esa robot obyektni muvaffaqiyatli qo‘lga kiritganda muvaffaqiyatli deb topiladi. Bu bosqichlar ketma-ketdir: lokalizatsiya rejalashtirishga, reja esa ushlashga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;No-maksimal bostirish (Non-maximum suppression) — bu bir xil obyekt uchun bir nechta bashoratlarni o‘chirib, faqat eng ishonchli variantni qoldiradigan algoritmdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz o‘z usulimizni LERF-TOGO, GraspSplats, Point2Act va GraspMolmo bilan solishtirdik. LERF-TOGO va Point2Act RGB ma’lumotlari bilan ishlaydi, qolganlari esa RGB-D bilan. Ko‘p rakursli bazaviy modellar sahna bo‘yicha 30 ta oldindan belgilangan kuzatuvni oladi. GraspMolmo faqat boshlang‘ich ko‘rinishdan foydalanadi va obyekt yashiringan bo‘lsa, baholanmaydi (6-rasmda N/A deb belgilangan). Bizning usulimiz bir xil boshlang‘ich holatdan boshlanadi va kerak bo‘lganda qo‘shimcha rakurslarni tanlaydi.&lt;/p&gt;\n&lt;p&gt;6-rasmda ko‘rinadigan va yashiringan obyektlar uchun unumdorlik solishtirilgan, I-jadvalda esa 150 ta sinov bo‘yicha umumiy muvaffaqiyat keltirilgan. Asl ko‘rsatmalar bilan MLLM asosidagi modellar (Point2Act va GraspMolmo) ko‘rinadigan nishonlarni lokalizatsiya qilishda LERF-TOGO va GraspSplats’dan ustunroq. Mantiqiy (reasoned) ko‘rsatmalarni qo‘shish barcha modellarning ko‘rsatkichlarini yaxshilaydi.&lt;/p&gt;\n&lt;p&gt;Bizning usul 50 ta ko‘rinadigan nishondan 43 tasini va 100 ta yashiringan nishondan 88 tasini lokalizatsiya qildi, bu eng kuchli analoglardan mos ravishda 32 va 20 foiz punktga yuqoridir. LOCATE funksiyasi qidiruv hududini cheklab, mayda detallarni tanlashdagi noaniqlikni kamaytiradi (3B-rasm). Ushlash muvaffaqiyati ko‘rinadigan nishonlar uchun 38/50 va yashiringanlar uchun 77/100 ni tashkil etdi, eng yaxshi bazaviy modellar esa mos ravishda 20/50 va 55/100 ga erishdi. 150 ta sinov bo‘yicha bizning usul 76,7% muvaffaqiyatga erishdi, eng kuchli raqibda esa bu ko‘rsatkich 50,0% ni tashkil etdi (I-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bizning usul faol rakurs qidiruvi va nishon geometriyasini aniqlashtirish kombinatsiyasi orqali 76,7% muvaffaqiyatga erishib, eng yaxshi analoglarni 26,7 foiz punktga ortda qoldirdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar o‘z usullarini Breyer va boshqalar tomonidan taklif etilgan, maqsadli obyektni qidirishga asoslangan faol ko‘rish usuli bilan solishtirdilar. Baza sifatida obyektning aniq 3D chegaralari (ground-truth) taqdim etilgan usul tanlandi, bunda AnyGrasp generatori va umumiy rejalashtirish tizimi qo‘llanildi. To‘rtta sahnada (S1–S4) o‘tkazilgan tajribalarda mualliflar usuli 95% muvaffaqiyatli qamrab olishni (o‘rtacha 2,20 rakurs) ko‘rsatdi, Breyer va boshqalar usuli esa 75% muvaffaqiyatga (3,35 rakurs) erishdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Voqealar tarixi va ehtimollik vaznlaridan foydalanish tizimga kerakli rakurslar sonini bazaviy usulga nisbatan 34% ga qisqartirish va muvaffaqiyatni 20% ga oshirish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ablyatsiya (komponentlarni olib tashlash) tahlili har bir qismning muhimligini ko‘rsatdi: ehtimollik vaznlarisiz muvaffaqiyat 80% gacha tushdi va rakurslar soni 4,65 gacha oshdi, chunki tizim ehtimoli past zonalarga resurs sarfladi. O‘tkazuvchanlik koeffitsiyentini (transmittance) hisobga olmaslik rakurslar sonini 3,10 gacha oshirdi. Voqealar bo‘yicha aprior ma’lumotlarsiz (event prior) muvaffaqiyat darajasi saqlanib qoldi, ammo rakurslar soni 4,00 gacha ko‘tarildi, bu tarixiy ma’lumotlarning samaradorligini tasdiqlaydi.&lt;/p&gt;\n&lt;p&gt;Tizim EgoDex va EPIC-KITCHENS ma’lumotlar to‘plamlaridagi videolar yordamida sinovdan o‘tkazildi. Parametrlarni qayta sozlamasdan, model harakatlar kontekstida tilga olingan obyektlarni muvaffaqiyatli aniqladi. Kamera rakursi keskin o‘zgargan murakkab sahnalarda tizim qidiruv hududini aniqlashtirish qobiliyatini ko‘rsatdi, garchi yakuniy kadrdagi koordinatalarni baholash aniqligi ba’zan cheklangan bo‘lsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul qidiruv jarayonida maqsadli obyekt harakatsiz qolishini nazarda tutadi; dinamik obyektlar bilan ishlash kelgusi tadqiqotlar mavzusidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BeyondCSe tizimi robotga o‘zaro ta’sirlar tarixiga asoslangan so‘rovlarni talqin qilish va obyektlar qisman to‘silgan bo‘lsa ham ularni ushlash imkonini beradi. Voqealar konteksti va sahna geometriyasining integratsiyasi qidiruv samaradorligini va manipulyatsiyalar ishonchliligini an’anaviy faol idrok usullariga nisbatan sezilarli darajada oshiradi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f1.jpg\" alt=\"1-rasm: Voqeaga asoslangan ushlash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Voqeaga asoslangan ushlash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm: Voqeaga asoslangan ushlash. (A) VoLo, VLM orkestratori, yo'riqnoma nishonini to'g'ri aniqlaydi va uning matnli tavsifini VLA (π0.5) yoki WAM (Cosmos3-Nano-Policy) ga uzatadi. Shunga qaramay, ikkala quyi model ham yashirin nishonni aniqlay olmaydi va ushlay olmaydi. (B) Bizning tizim esa o'tmishdagi kuzatuvlar asosida fazoviy ishonchni ishga tushiradi, nishonni ochib beradigan ko'rish nuqtasini faol tanlaydi va uni muvaffaqiyatli ushlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f2.jpg\" alt=\"2-rasm: BeyondCSe umumiy ko'rinishi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: BeyondCSe umumiy ko'rinishi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: BeyondCSe umumiy ko'rinishi. Voqeaga asoslangan yo'riqnoma va yozib olingan video berilganda, video tahlili nishonni aniqlaydi va joylashtiradi. Videodan tiklangan tarixiy 3D nishon kuzatuvlari P bilan belgilanadi. Agar nishon yashiringan bo'lsa, voqeaga bog'liq faol idrok oldingi kuzatuvlar va joriy geometriyadan hajmli ishonchni shakllantiradi, so'ngra nishon ushlanguncha yoki qidiruv tugamaguncha ko'rinishga asoslangan nuqtalarni tanlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f4.jpg\" alt=\"4-rasm: Voqeaga bog'liq faol idrok. Voqealar izi va dastlabki RGB-D kuzatuvi nishon ishonchi va xaritani ishga tushiradi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Voqeaga bog'liq faol idrok. Voqealar izi va dastlabki RGB-D kuzatuvi nishon ishonchi va xaritani ishga tushiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: Voqeaga bog'liq faol idrok. Voqealar izi va dastlabki RGB-D kuzatuvi nishon ishonchi va xaritani ishga tushiradi. Ishonchga asoslangan ko'rinish qidiruvi jismoniy ko'rinishlarni oladi, ularning har biri ikkalasini ham yopiq tsiklda yangilaydigan joriy kuzatuvni beradi. Nishon tasdiqlangandan so'ng, ushlashni tekshirish faqat kuzatilgan geometriya etarli bo'lmaganda boshqa ko'rinishni so'raydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f5.jpg\" alt=\"5-rasm: Voqeaga asoslangan yo'riqnomalar misollari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Voqeaga asoslangan yo'riqnomalar misollari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: Voqeaga asoslangan yo'riqnomalar misollari. Har bir qatorda voqealar tarixi videosidan olingan kadrlar, robot ishi uchun dastlabki kuzatuv va yozib olingandan keyin berilgan yo'riqnoma ko'rsatilgan. Videoning oxirgi kadrida dastlabki kuzatuv sifatida xizmat qiladi. (A) So'ralgan chashka dastasi ko'rinib turibdi, lekin nokni yopib turgan chashkani aniqlash uchun voqealar tarixi kerak. (B) Kub birinchi bo'lib harakatlantiriladi va dastlabki kuzatuvda devor bilan yashiringan.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f6.jpg\" alt=\"6-rasm: Haqiqiy dunyoda ushlash samaradorligi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Haqiqiy dunyoda ushlash samaradorligi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm: Haqiqiy dunyoda ushlash samaradorligi. Nishonlar dastlabki bilak kamerasi ko'rinishida ko'rinadi yoki yashiringan, har bir usul uchun mos ravishda 50 va 100 ta sinov o'tkazilgan. Asosli yo'riqnomalar - bu Qwen3-VL-8B tomonidan video tarixi va asl yo'riqnomadan yaratilgan joylashuv so'rovlari bo'lib, ular asosiy modellar o'rtasida umumiy bo'lib, ularning mahalliy joylashuv asoslarini saqlab qoladi. LERF*, P2A, GS va GM mos ravishda LERF-TOGO, Point2Act, GraspSplats va GraspMolmo ni bildiradi. P2A† RGB-D rekonstruktsiyasidan foydalanadi. Rangli segmentlar muvaffaqiyatli ushlashlarni yoki birinchi muvaffaqiyatsiz bosqichni ko'rsatadi. Bizning tizim barcha yo'riqnoma sharoitlari uchun umumiy to'liq tizim referensi sifatida takrorlanadi. N/A baholanmagan shartni bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f8.jpg\" alt=\"Rasm 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f8-2.jpg\" alt=\"Rasm 8 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 8 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Robot buyumni&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ko‘ra olmaydi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Video tarixi&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;va faol&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;qidiruv&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yashiringan&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font
