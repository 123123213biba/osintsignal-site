        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"84\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"676\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · IMAGE_FORENSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LiteReality-Agent: xonalarni&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;kod yordamida interaktiv&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;3D-modellarga aylantirish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"1-rasm: LiteReality-Agent yordamida haqiqiy xonani qayta tiklash. LiteReality-Agent qayta tiklash vazifasini dasturlash \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: LiteReality-Agent yordamida haqiqiy xonani qayta tiklash. LiteReality-Agent qayta tiklash vazifasini dasturlash vazifasi sifatida talqin qiladi, unda dasturchi-agent Room.py faylini yozadi va u real, interaktiv hamda simulyatsiyaga tayyor 3D xonaga kompilyatsiya qilinadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;LiteReality-Agent 3D-rekonstruksiyani dasturlash vazifasiga aylantiradi. Tizim RGB-D skanlardan foydalanib, interyerning geometriyasi va fizik xususiyatlarini tavsiflovchi Room.py faylini yaratadi. Agent o'lchovlar va to'qnashuvlarni tekshirish vositalari yordamida modelni takomillashtiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;3D-sahna rekonstruksiyasi bajariladigan Python-kod yozish vazifasi sifatida shakllantirilgan.&lt;/li&gt;\n&lt;li&gt;«Kuzatish-tahrirlash-tekshirish» sikli fizik ishonchlilikni oshiradi.&lt;/li&gt;\n&lt;li&gt;Tizim vizual va geometrik aniqlik bo'yicha Astra va Fable modellaridan ustun.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"usullar-va-aniqlik\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#usullar-va-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va aniqlik&lt;/span&gt;&lt;/a&gt;Usullar va aniqlik&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Usul&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ma'lumotlar&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Aniqlik&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Cheklov&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;LiteReality-Agent&lt;/td&gt;\n&lt;td&gt;Xonalarning RGB-D skanlari&lt;/td&gt;\n&lt;td&gt;Vizual va geometrik ko'rsatkichlar bo'yicha eng yuqori ball&lt;/td&gt;\n&lt;td&gt;Dastlabki skanlash aniqligiga bog'liqlik&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tizim ikki bosqichda ishlaydi: sahnani dastlabki tayyorlash va agentlik loyihalash. Birinchi bosqichda algoritmlar skanlash ma'lumotlarini tahlil qiladi, obyektlarni tiklaydi va rejalashtirish xatolarini tuzatib, Room.py kodini hosil qiladi. Keyin «kuzatish-tahrirlash-tekshirish» sikli ishga tushadi, unda agent renderlarni solishtirish, geometrik o'lchovlar o'tkazish va fizik bog'liqliklarni (obyektlarni qo'llab-quvvatlash, to'qnashuvlar yo'qligi) tekshirish uchun maxsus vositalardan foydalanadi.&lt;/p&gt;\n&lt;p&gt;An'anaviy nuqtali bulutli usullardan farqli o'laroq, LiteReality-Agent MuJoCo kabi simulyatorlarga eksport qilishga tayyor tuzilgan muhitni yaratadi. Tizim geometrik aniqlik va vizual realizm bo'yicha Astra va Fable kabi zamonaviy modellardan ustunlik qiladi. Butun jarayon shaffof va tahrirlanuvchan bo'lib qoladi, chunki har qanday o'zgarishlar to'g'ridan-to'g'ri dastur kodiga kiritiladi, bu esa natijalarning yuqori darajada takrorlanishini ta'minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim dastlabki RGB-D ma'lumotlar sifatiga tayanadi va LLM-agentlarning fazoviy munosabatlarni tushunish qobiliyati bilan cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Mualliflar RGB-D skanerlash ma'lumotlarini real xonalarning yuqori sifatli, artikulyatsiyalangan va simulyatsiyaga tayyor 3D sahnalariga aylantiruvchi LiteReality-Agent agent tizimini taqdim etadilar. Yondashuvning negizida 3D rekonstruksiyani dasturlash muammosi sifatida shakllantirish yotadi: agent ketma-ket dalillarni to‘playdi va Room.py Python skriptini tahrirlaydi, uning bajarilishi makonning raqamli egizagini yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent geometrik aniqlik, vizual realizm va simulyatorlar bilan moslik bo‘yicha Astra va Fable kabi zamonaviy modellardan ustun turadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim «kuzatish — tahrirlash — tekshirish» sikli asosida ishlaydi. Ushbu mexanizm rekonstruksiya jarayonining barcha bosqichlarida ma'lumot to‘plash, o‘lchovlar o‘tkazish, loyihani optimallashtirish va sifat nazoratini ta’minlaydi. Bu yondashuv gavdalangan sun’iy intellektni (embodied AI) o‘qitish uchun mos sahnalarni yaratishga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gavdalangan sun’iy intellekt (Embodied AI) — bu aqlli agentlar ko‘nikmalarni mashq qilish uchun virtual muhitlardan foydalangan holda jismoniy dunyo bilan o‘zaro ta’sir qilishni o‘rganadigan sohadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LiteReality-Agent orkestrlash uchun samarali freymvork bo‘lib, agentlarni ixtisoslashtirilgan vositalar va tuzilgan ish jarayonlari bilan ta’minlaydi. Mualliflarning ta’kidlashicha, taklif etilgan arxitektura rekonstruksiya ishonchliligini sezilarli darajada oshiradi. Tizimning manba kodi va ma’lumotlarni yig‘ish ilovasi real-to-sim vazifalarida foydalanish uchun ochiq manbalarda mavjud.&lt;/p&gt;\n&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"funksional-raqamli-egizaklarni-yaratish\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#funksional-raqamli-egizaklarni-yaratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Funksional raqamli egizaklarni yaratish&lt;/span&gt;&lt;/a&gt;Funksional raqamli egizaklarni yaratish&lt;/h4&gt;\n&lt;p&gt;Fizik modellashtirishga tayyor raqamli egizaklarni yaratish teskari grafika sohasidagi asosiy maqsadlardan biridir. Nuqtali bulutlar yoki an'anaviy to'rlar (mesh) asosidagi usullardan farqli o'laroq, mualliflar o'zaro ta'sir va simulyatsiya uchun mos keladigan tuzilgan muhitni tiklashni maqsad qilganlar. Bu sahnani tushunish, ob'ektlar va ularning artikulyatsiyasini qayta tiklash, materiallar va fizik xususiyatlarni baholashni talab qiladi. Ilgari CAD-modellashtirish yoki differensial renderlash usullari qo'llanilgan bo'lsa-da, real skanlarni yuqori sifatli interaktiv muhitga aylantiradigan masshtabli tizim yaratish qiyin bo'lib qolmoqda. LiteReality kabi mavjud yechimlar deterministik cheklovlarga ega, LLM asosidagi tizimlar (Holodeck, SceneCraft, SceneSmith) esa ko'pincha real kuzatuvlarga tayanmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent — bu RGB-D xona skanlarini bajariladigan Room.py kodiga aylantiruvchi, fizik jihatdan to'g'ri va tahrirlanadigan 3D muhitlarni yaratuvchi agent tizimidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"litereality-agent-arxitekturasi\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#litereality-agent-arxitekturasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LiteReality-Agent arxitekturasi&lt;/span&gt;&lt;/a&gt;LiteReality-Agent arxitekturasi&lt;/h4&gt;\n&lt;p&gt;Tizim «rekonstruksiyani dasturlash sifatida» konsepsiyasiga asoslanadi. Butun sahna Room.py faylida tasvirlanadi. Jarayon ikki bosqichdan iborat: sahnani ishga tushirish va agentli mualliflik. Birinchi bosqichda ob'ektlar tasvirlardan tiklanadi, Layout Agent esa skanerdagi xatolarni, to'qnashuvlarni va ob'ektlarning tayanch munosabatlarini tekshiradi. Keyin «kuzatish-tahrirlash-tekshirish» sikli ishga tushadi. Agent renderlash, geometrik o'lchovlar va tahrirlash vositalaridan foydalanadi. Fizik xususiyatlar Articraft yondashuviga o'xshash tarzda baholanadi. Python kodi orqali sahnani tabiiy til ko'rsatmalari bilan o'zgartirish mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Agent tizimi — bu AI agenti o'z harakatlarini rejalashtiradigan, vositalardan foydalanadigan va natijalarni tekshiradigan dasturiy arxitektura.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim samaradorligi birlamchi RGB-D skanlarining aniqligiga va agentning geometrik cheklovlarni talqin qilish qobiliyatiga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baholash-va-natijalar\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#baholash-va-natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash va natijalar&lt;/span&gt;&lt;/a&gt;Baholash va natijalar&lt;/h4&gt;\n&lt;p&gt;Mualliflar LiteReality-Agent tizimini real interyerlarda LiteReality va umumiy maqsadli kodlash agentlari (GPT-6 Astra, Fable 5.1) bilan solishtirdilar. Baholash vizual aniqlik, geometrik ishonchlilik va ekspert baholari asosida amalga oshirildi. Tizim barcha ko'rsatkichlar bo'yicha eng yuqori natijalarni ko'rsatdi.&lt;/p&gt;\n&lt;h4 id=\"related-work\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#related-work\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RELATED WORK&lt;/span&gt;&lt;/a&gt;RELATED WORK&lt;/h4&gt;\n&lt;p&gt;Ichki makonni rekonstruksiya qilish va real-to-sim. Ob'ektga yo'naltirilgan usullar CAD aktivlarini kuzatuvlar bilan moslashtiradi, neyron tasvirlar esa sahnaning ko'rinishi va geometriyasini tiklaydi. LiteReality va MetaScenes kabi tizimlar skanlarni aktivlarga asoslangan muhitga aylantiradi. Video2Game, DRAWER va HoloScene videodan interaktiv dunyolarni qayta tiklaydi, bunda DRAWER artikulyatsiyani ham aniqlaydi. Robotlarni o'qitish uchun Phone2Proc (mobil skanlardan protsedurali muhitlar), RialTo va PolaRiS (siyosatni takomillashtirish uchun raqamli egizaklar) kabi yechimlar qo'llaniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zamonaviy rekonstruksiya usullari aktivlarni oddiy tanlashdan interaktiv muhitlarni generatsiya qilishga o'tdi, bunda artikulyatsiya va fizik xususiyatlar agentli sikllar orqali tiklanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ob'ekt generatsiyasi va artikulyatsiya. Tasvirni 3D formatiga o'tkazish usullari ko'p rakursli sintezdan tortib yirik generativ modellargacha bo'lgan diapazonni qamrab oladi. CAST generatsiya qilingan ob'ektlarni sahnaga moslashtiradi, URDFormer esa tasvirlardan artikulyatsiyalangan simulyatsiya muhitlarini chiqaradi. Real2Code va Articraft kabi yondashuvlar artikulyatsiyani kod sifatida bashorat qiladi va maxsus SDK orqali validatsiyadan o'tkazadi.&lt;/p&gt;\n&lt;p&gt;Til yordamida sahna yaratish va agentli grafikalar. LayoutGPT va Holodeck kabi tizimlar tabiiy tildan foydalanib rejalashtirishni amalga oshiradi, 3D-GPT va SceneCraft esa dasturiy 3D modellashtirish uchun til modellarini qo'llaydi. VIGA, Thinking in Blender va HARMONY kabi agentli yondashuvlar «kod-renderlash-tekshirish» sikllaridan foydalanib, bitta tasvir asosida sahnani aniqlashtiradi. LiteReality-Agent ushbu yondashuvni rivojlantirib, RGB-D rekonstruksiyasida metrik aniqlikni va ko'p rakursli tekshiruvni ta'minlaydi.&lt;/p&gt;\n&lt;h4 id=\"litereality-agent\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#litereality-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LITEREALITY-AGENT&lt;/span&gt;&lt;/a&gt;LITEREALITY-AGENT&lt;/h4&gt;\n&lt;p&gt;LiteReality-Agent ikki bosqichda ishlaydi: sahnani initsializatsiya qilish (reja va asosiy ob'ektlarni aniqlash) va agentli loyihalash, bunda sahnaning bajariladigan kodi «kuzatish–tahrirlash–tekshirish» sikli orqali aniqlashtiriladi (2-rasm).&lt;/p&gt;\n&lt;p&gt;3.1 KIRISH MA'LUMOTLARI: RGB-D SKANLAR VA DETEKSIYA NATIJALARI. Tizim LiteRealityScan ilovasidan olingan ma'lumotlarni, jumladan xona geometriyasi va ob'ektlarning chegaralovchi ramkalarini (bounding boxes) qabul qiladi.&lt;/p&gt;\n&lt;p&gt;3.2 SAHNANI INITSIALIZATSIYA QILISH. Biz LiteReality metodologiyasiga amal qilamiz: xona qobig'i va ob'ektlarni alohida rekonstruksiya qilamiz. Reja agenti sahnaning grafini tuzadi, bunda qo'llab-quvvatlash aloqalari (masalan, stul polda) va funksional guruhlar hisobga olinadi. Geometrik tekshiruvlar xatolarni aniqlaydi: devor ichidagi yoki tayanchsiz ob'ektlar. Tuzatishlar deterministik yoki tasvirga asoslangan mulohazalar orqali kiritiladi. Ob'ektlarni rekonstruksiya qilish har bir element uchun toza referens tasvirlarni generatsiya qilishni o'z ichiga oladi. Statik ob'ektlar TRELLIS.2 modeli bilan, artikulyatsiyalanganlari esa protsedurali generatsiya orqali qayta ishlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Agentli sikl (1-algoritm) — bu LLM muhit holatini tahlil qiladigan, kodni (Room.py) tuzatish bo'yicha harakatlarni bajaradigan va sifat nazorati vositalari (1-jadval) orqali natijani tekshiradigan jarayondir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-agentli-loyihalash\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#33-agentli-loyihalash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 Agentli loyihalash&lt;/span&gt;&lt;/a&gt;3.3 Agentli loyihalash&lt;/h4&gt;\n&lt;p&gt;Jarayon agentning tasvirga olish ma'lumotlarini tahlil qilishi, sahna kodini tahrirlashi va renderlash hamda geometrik tekshiruvlar orqali natijani tasdiqlashidan iborat. 1-jadvalda agent foydalanadigan vositalar ro'yxati keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"331-tekshiruv-vositalari\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#331-tekshiruv-vositalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3.1 Tekshiruv vositalari&lt;/span&gt;&lt;/a&gt;3.3.1 Tekshiruv vositalari&lt;/h4&gt;\n&lt;p&gt;Agent uch darajada ishlaydi: xona, devor yoki alohida obyekt. Xona darajasida devorlarni to'liq qamrab oluvchi kadrlar tanlanadi. Devor darajasida ekrandagi proyeksion maydoni eng katta bo'lgan rakurslar ustunlik qiladi. Obyekt darajasida esa render manifestidan foydalanib, eng aniq ko'rinishlar topiladi. Kadrlar orasidagi minimal masofa takrorlanishlarning oldini oladi. Render va fotosuratlarni solishtirish (Rasm A7a–c) xatolarni aniq obyekt darajasida topishga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Render-solishtirish — virtual model va real fotosuratni bir xil kamera parametrlari bilan taqqoslab, geometrik yoki tekstura xatolarini aniqlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Devorlar bilan ishlashda kadrlar metrik tekislikka proyeksiyalanadi va masofalarni o'lchash uchun koordinata to'ri hosil qilinadi (Rasm A8d). Bu obyektlarni Room.py kodida aniq joylashtirish imkonini beradi. PBR-teksturalar uchun agent material xaritalarini tanlaydi va rangni real kuzatuvlarga moslaydi. Loyihalash to'rt bosqichdan iborat: devor materiallari, yoritish va jihozlar, mayda obyektlar hamda protsessual modellarni aniqlashtirish. Obyektlar o'zaro bog'liqliklar (masalan, «ustida» yoki «biriktirilgan») bilan guruhlanadi.&lt;/p&gt;\n&lt;h4 id=\"332-nazorat-va-sifat-tekshiruvi\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#332-nazorat-va-sifat-tekshiruvi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3.2 Nazorat va sifat tekshiruvi&lt;/span&gt;&lt;/a&gt;3.3.2 Nazorat va sifat tekshiruvi&lt;/h4&gt;\n&lt;p&gt;Avtomatik yakunlash qiyin bo'lgani uchun iteratsiyalar va vositalar chaqiruvi bo'yicha limitlar joriy etilgan. Limitning oxirgi 10% qismida agent tadqiqot funksiyalarini o'chirib, natijani saqlashga o'tadi. Geometrik tekshiruv to'qnashuvlarni (kolliziyalarni) aniqlash va tayanch yuzalarini baholashni o'z ichiga oladi. Agar obyekt «suzib» qolsa yoki boshqa obyekt bilan kesishsa, agent tuzatishlarni hisoblaydi va Room.py kodini yangilaydi. 3-jadvalda to'qnashuvlar va tayanchlar bo'yicha yakuniy ko'rsatkichlar keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Iteratsiyalar bo'yicha qat'iy limitlar va avtomatlashtirilgan geometrik tekshiruvlar obyektlarning joylashuv xatolarini kamaytiradi va sahnaning fizik jihatdan to'g'riligini ta'minlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"34-simulyatsiya-uchun-eksport\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#34-simulyatsiya-uchun-eksport\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4 Simulyatsiya uchun eksport&lt;/span&gt;&lt;/a&gt;3.4 Simulyatsiya uchun eksport&lt;/h4&gt;\n&lt;p&gt;Yakuniy sahna MuJoCo muhitiga eksport qilinadi. Statsionar elementlar qotiriladi, harakatlanuvchi obyektlar esa erkin bo'g'inlar (ilmoqli yoki suriluvchi) bilan ta'minlanadi. Eksportyor massa, inersiya va to'qnashuv geometriyasi kabi fizik xususiyatlarni saqlab qoladi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"41-eksperimental-sozlamalar\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#41-eksperimental-sozlamalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1 Eksperimental sozlamalar&lt;/span&gt;&lt;/a&gt;4.1 Eksperimental sozlamalar&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar LiteReality-Agent tizimini 620 ta rakursni o‘z ichiga olgan o‘nta ichki makon sahnasida sinovdan o‘tkazdilar. Taqqoslash uchun LiteReality va ikkita universal agent: GPT-6 (Codex muhitida) va Fable 5.1 (Claude Code muhitida) ishlatildi. Universal agentlar ikki rejimda: faqat RGB-fotosuratlar va LiteReality skanerlash ma’lumotlari (+Scan) bilan baholandi. Barcha usullar bir xil fotosuratlardan foydalandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Baholash usuli: barcha rekonstruksiyalar kamera koordinatalar tizimiga moslashtiriladi va 960×720 o‘lchamda render qilinadi. Baholash suratga olish nuqtalarida amalga oshiriladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"42-vizual-aniqlik\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#42-vizual-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2 Vizual aniqlik&lt;/span&gt;&lt;/a&gt;4.2 Vizual aniqlik&lt;/h4&gt;\n&lt;p&gt;Baholash uchun SSIM, PSNR, RMSE va LPIPS metrikalaridan foydalanildi. 2-jadvalga ko‘ra, LiteReality-Agent barcha to‘rtta metrika bo‘yicha eng yaxshi natijalarni ko‘rsatdi. GPT-6 (+Scan) bilan solishtirganda, PSNR 1.162 dB ga oshdi, LPIPS esa 13.7% ga kamaydi. LiteReality bazaviy modeliga nisbatan o‘sish PSNR bo‘yicha 2.248 dB va LPIPS bo‘yicha 19.6% ni tashkil etdi. Sifatli taqqoslash 3-rasmda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent barcha analoglardan ustun kelib, PSNR ni 14.129 dB gacha oshirdi va LPIPS ni 0.5392 gacha tushirdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"43-geometrik-muvofiqlik-va-fizik-ishonchlilik\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#43-geometrik-muvofiqlik-va-fizik-ishonchlilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 Geometrik muvofiqlik va fizik ishonchlilik&lt;/span&gt;&lt;/a&gt;4.3 Geometrik muvofiqlik va fizik ishonchlilik&lt;/h4&gt;\n&lt;p&gt;Baholash chuqurlikdagi o‘rtacha mutlaq xatolik (MAE), mebelning tayanch yuzalar bilan kontakti (1 sm ichida) va obyektlar kesishishi sonini o‘z ichiga oldi. 3-jadvaldan ko‘rinib turibdiki, LiteReality-Agent 10.50 sm MAE ko‘rsatkichiga erishdi (GPT-6 (+Scan) dan 21.2% yaxshiroq). Mebelning tayanch bilan kontakti 100% ni tashkil etdi va hech qanday kesishish aniqlanmadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Metrikalar to‘liq fizik haqiqiylikni emas, balki fizik ishonchlilikni baholaydi, chunki sahnalardagi obyektlar soni usullarga qarab farq qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"44-skanerlash-malumotlarining-universal-agentlarga-tasiri\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#44-skanerlash-malumotlarining-universal-agentlarga-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4 Skanerlash ma’lumotlarining universal agentlarga ta’siri&lt;/span&gt;&lt;/a&gt;4.4 Skanerlash ma’lumotlarining universal agentlarga ta’siri&lt;/h4&gt;\n&lt;p&gt;Skanerlash ma’lumotlarini qo‘shish vizual metrikalarni sezilarli darajada yaxshiladi: GPT-6 uchun PSNR 11.549 dan 12.967 dB gacha oshdi, chuqurlikdagi MAE esa 67.1% ga qisqardi. Biroq, bu har doim ham joylashuvni yaxshilamadi: mebel kesishishlari soni ortdi va GPT-6 ning tayanch bilan kontakt darajasi 69.1% dan 63.0% gacha tushdi.&lt;/p&gt;\n&lt;h4 id=\"46-odamlar-va-agentlar-tomonidan-idrok-etish-bahosi\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#46-odamlar-va-agentlar-tomonidan-idrok-etish-bahosi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.6 Odamlar va agentlar tomonidan idrok etish bahosi&lt;/span&gt;&lt;/a&gt;4.6 Odamlar va agentlar tomonidan idrok etish bahosi&lt;/h4&gt;\n&lt;p&gt;Ekspertlar (odamlar va ikkita agent) rejalashtirish aniqligi, obyektlar o‘xshashligi va umumiy sahna o‘xshashligini besh ballik shkala bo‘yicha baholadilar. LiteReality-Agent eng yuqori ballarni (4.60–5.00) oldi (4-jadval).&lt;/p&gt;\n&lt;h4 id=\"baholash-natijalari\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#baholash-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash natijalari&lt;/span&gt;&lt;/a&gt;Baholash natijalari&lt;/h4&gt;\n&lt;p&gt;LiteReality-Agent 4-jadvalda keltirilgan insoniy baholashning barcha asosiy ko‘rsatkichlari bo‘yicha ustunlikni namoyish etdi. O‘rtacha ballar quyidagicha: joylashuv (layout) uchun 4,60, ob’ektlar o‘xshashligi (object similarity) uchun 4,58 va umumiy o‘xshashlik (overall similarity) uchun 4,54. Bu ko‘rsatkichlar GPT-6 (+Scan) modelidan mos ravishda 1,49, 1,60 va 1,54 ballga yuqoridir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent 65 ta juftlik taqqoslashidan 53 tasida g‘alaba qozonib, GPT-6 (+Scan) modelidan sezilarli darajada ustun keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ishtirokchilar sahnalarni taqqoslagan juftlik testlari davomida bizning usul 65 ta holatdan 53 tasida g‘alaba qozondi, 11 ta durang va atigi bitta mag‘lubiyat qayd etildi. Avtomatlashtirilgan agent baholovchilar ham LiteReality-Agent’ni birinchi, GPT-6 (+Scan)’ni esa ikkinchi o‘ringa qo‘ydi, garchi ularning yakuniy ballari insonlar bahosidan farq qilsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot cheklovlari: tanlanmaning kichikligi, sahnalarning notekis qamrovi va baholarning o‘zaro bog‘liqligi usulning statistik ahamiyatini yoki fizik aniqligini tasdiqlashga imkon bermaydi; agent baholari insonlar fikrini to‘liq almashtira olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;Biz LiteReality-Agent tizimini taqdim etdik. Bu ochiq kodli tizim bo‘lib, 3D-rekonstruksiya muammosini dasturlash masalasi sifatida ko‘rib chiqadi va RGB-D skanerlash natijalarini realistik, artikulyatsiyalangan va simulyatsiyaga tayyor sahnalarga aylantiradi. Tizimning «kuzatish-tahrirlash-tekshirish» mexanizmi bajariladigan sahna dasturlari, maxsus vositalar va dalillarga asoslangan verifikatsiyani birlashtirib, rekonstruksiya sifati va ishonchliligini oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent o‘nta sahnada o‘tkazilgan sinovlarda vizual aniqlik, geometrik izchillik va idrok sifati bo‘yicha mavjud agent-modellardan ustunligini ko‘rsatdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RGB-D skanerlash — bu obyektning rangi va masofasini (chuqurligini) bir vaqtda qayd etuvchi texnologiya bo‘lib, u 3D muhitni yaratish uchun asos bo‘lib xizmat qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O‘nta sahna bo‘yicha olingan natijalar shuni ko‘rsatadiki, bizning yechimimiz vizual aniqlik va geometrik moslik bo‘yicha ilg‘or agent-modellardan sezilarli darajada ustun. Dasturlash agentlari rivojlanib borar ekan, ushbu orkestratsiya tizimi real dunyodan simulyatsiyaga o‘tish (real-to-sim) tizimlari va mujassamlashgan sun’iy intellekt (embodied AI) uchun amaliy poydevor yaratadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"1-rasm: LiteReality-Agent yordamida haqiqiy xonani qayta tiklash. LiteReality-Agent qayta tiklash vazifasini dasturlash \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: LiteReality-Agent yordamida haqiqiy xonani qayta tiklash. LiteReality-Agent qayta tiklash vazifasini dasturlash vazifasi sifatida talqin qiladi, unda dasturchi-agent Room.py faylini yozadi va u real, interaktiv hamda simulyatsiyaga tayyor 3D xonaga kompilyatsiya qilinadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f2.jpg\" alt=\"2-rasm: LiteReality-Agent’ning oxirigacha bo'lgan (end-to-end) konveyeri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: LiteReality-Agent’ning oxirigacha bo'lgan (end-to-end) konveyeri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm: LiteReality-Agent’ning oxirigacha bo'lgan (end-to-end) konveyeri. RGB–D skanerlari va aniqlashlar bajariladigan boshlang'ich xonani yaratish uchun joylashuvni tuzatish va ob'ektlarni qayta tiklashga yo'naltiradi. Mualliflik agenti tasvir ko'rinishlari, o'lchovlar, materiallar va render qilingan taqqoslashlardan foydalangan holda «kuzatish — tahrirlash — teshirish» sikli orqali Room.py faylini takomillashtiradi. Nazorat darvozalari mualliflikni cheklaydi hamda geometriya va tayanchlarni tekshiradi. Tahrirlanadigan sahna va fizik metama'lumotlar MuJoCo’ga eksport qilishni qo'llab-quvvatlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f4.jpg\" alt=\"4-rasm: Qayta tiklashning vakillik taqqoslashlari. Oshxona (yuqorida) va muzokaralar xonasi (pastda) olingan RGB-fotosur\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: Qayta tiklashning vakillik taqqoslashlari. Oshxona (yuqorida) va muzokaralar xonasi (pastda) olingan RGB-fotosuratlari, qayta tiklangan ko'rinishlari va nuqtalar buluti/sahna rejasi ko'rinishlari bilan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f6.jpg\" alt=\"6-rasm: Simulyatsiya va o'zaro ta'sir. MuJoCo’da qayta tiklangan oshxona, silkitishdan keyin va Franka manipulyatorining\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: Simulyatsiya va o'zaro ta'sir. MuJoCo’da qayta tiklangan oshxona, silkitishdan keyin va Franka manipulyatorining olib-qo'yish (pick-and-place) misolida.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS1.jpg\" alt=\"A1-rasm: Qo'shimcha to'ldiruvchi ko'rinishlar taqqoslanishi. Har bir holatda kirish RGB-tasviri va unga mos keladigan RG\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A1-rasm: Qo'shimcha to'ldiruvchi ko'rinishlar taqqoslanishi. Har bir holatda kirish RGB-tasviri va unga mos keladigan RGB–D skaneri ko'rsatilgan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS2.jpg\" alt=\"A2-rasm A1-rasmni har bir xona uchun ikkinchi moslashtirilgan ko‘rish nuqtasi bilan to‘ldiradi, bu esa sahnaning qo‘shim\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A2-rasm A1-rasmni har bir xona uchun ikkinchi moslashtirilgan ko‘rish nuqtasi bilan to‘ldiradi, bu esa sahnaning qo‘shimcha hududlarini ochib beradi va ko‘rish nuqtalari bo‘ylab rekonstruksiya izchilligini kengroq baholash imkonini beradi. A2-rasm: Barcha baholash xonalari bo‘ylab qo‘shimcha rekonstruksiya taqqoslamalari.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS3.jpg\" alt=\"A3-rasm: Qamrovdan boshlang‘ich xonagacha. Ishlayotgan oshxona namunasi RGB-D nuqtalar bulutini, aniqlangan qutilar va t\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A3-rasm: Qamrovdan boshlang‘ich xonagacha. Ishlayotgan oshxona namunasi RGB-D nuqtalar bulutini, aniqlangan qutilar va tartibni, rekonstruksiya qilingan qobiqni va yig‘ilgan boshlang‘ich sahnani ko‘rsatadi. Sirtning nozik ko‘rinishi, jihozlar va kichik ob’ektlar yaratish jarayonida aniqlashtiriladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS4.jpg\" alt=\"A4-rasm: Tartibni tuzatishdan oldin va keyin.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A4-rasm: Tartibni tuzatishdan oldin va keyin.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;A4-rasm: Tartibni tuzatishdan oldin va keyin. Rejalar uchta sahna uchun saqlangan kirish va chiqish qutilari asosida to‘g‘ridan-to‘g‘ri chizilgan. Chap ustundagi qizil konturlar o‘zgartirilgan qutilarni belgilaydi; ko‘k konturlar ularning o‘ng tomondagi tuzatilgan holatini ko‘rsatadi. Uzuk-uzuk qizil konturlar o‘zlarining asl o‘lchamlarini saqlab qoladi, strelkalar esa markazning siljishini ko‘rsatadi. Har bir juftlik bir xil masshtab va ko‘rish nuqtasidan foydalanadi; kulrang ob’ektlar va devorlar o‘zgarmas kontekstni ta’minlaydi. Majlislar zalidagi yorliqlar stullarni C va televizorni TV deb qisqartiradi. Bular batafsil to‘r rekonstruksiyasi va yaratishdan oldingi tartib bosqichidagi taqqoslamalardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS5.jpg\" alt=\"A5-rasm skanerlash ko‘rinishlari asosida yaratilgan toza etalonlardan foydalangan holda ikkala rekonstruksiya yo‘nalishi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A5-rasm skanerlash ko‘rinishlari asosida yaratilgan toza etalonlardan foydalangan holda ikkala rekonstruksiya yo‘nalishini ko‘rsatadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;A5-rasm skanerlash ko‘rinishlari asosida yaratilgan toza etalonlardan foydalangan holda ikkala rekonstruksiya yo‘nalishini ko‘rsatadi. Qayta ishlanmagan qamrovlar aniqlikni tekshirish uchun dalil bo‘lib qoladi: yopilgan qismlarning yakunlangan holati taxminiy hisoblanadi. A5-rasm: Qamrov etalonlari asosida ob’ektlarni rekonstruksiya qilish. Har bir qator qamrab olingan ko‘rinishlarni, tozalangan etalonni va rekonstruksiya qilingan aktivni ko‘rsatadi. Rakovina ostidagi shkaf bo‘g‘imli qismlarga ega protsessual geometriyadan foydalanadi; divan tasvirni 3D formatiga o‘tkazishdan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS6.jpg\" alt=\"A6-rasm: Uchta ko‘lamda ko‘rinishni tanlash. Xona bo‘yicha so‘rovlar bir nechta sirtni qamrab oladi, devor bo‘yicha so‘r\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A6-rasm: Uchta ko‘lamda ko‘rinishni tanlash. Xona bo‘yicha so‘rovlar bir nechta sirtni qamrab oladi, devor bo‘yicha so‘rovlar bitta tarkibiy elementga qaratiladi va ob’ekt bo‘yicha so‘rovlar alohida aktivning kuzatuvlarini qaytaradi. Raqamlar qamrov kadrlarini aniqlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS7.jpg\" alt=\"A7-rasm: Mualliflik dalillari. (a–c) Render-fotosurat juftliklari nomuvofiqliklarni tobora aniqroq miqyosda aniqlash uch\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A7-rasm: Mualliflik dalillari. (a–c) Render-fotosurat juftliklari nomuvofiqliklarni tobora aniqroq miqyosda aniqlash uchun xona, devor va ob'ekt annotatsiyalaridan foydalanadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS8.jpg\" alt=\"A8-rasm: Devorlarni birlashtirish va metrik o'lchovlar.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A8-rasm: Devorlarni birlashtirish va metrik o'lchovlar.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;A8-rasm: Devorlarni birlashtirish va metrik o'lchovlar. Oshxona misolidagi ikkita devor kalibrlangan tasvir kadrlaridan to'g'rilangan. (a) Birlashtirilgan namuna bo'rtib chiqqan mebellar atrofida ko'rinadigan choklar va proyeksiya artefaktlarini saqlab qoladi. (b) Uning qoplama niqobi kuzatilgan piksellarni (oq) kuzatilmagan piksellardan (qora) ajratib turadi. (c–d) Ikkinchi birlashtirilgan devor metrik to'r qo'shilishidan oldin va keyin ko'rsatilgan: qizil belgilar devor bo'ylab masofani, ko'k belgilar esa poldan balandlikni metrlarda o'lchaydi. Doska chetlarini sahna dasturida joylashtirish va o'lchamini aniqlash uchun ushbu to'rga qarab o'qish mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS9.jpg\" alt=\"A9-rasm: Tabiiy tilda sahnani tahrirlash. Asl rekonstruksiya so'ralgan uchta tahrir bilan ko'rsatilgan: g'ishtli devorni\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A9-rasm: Tabiiy tilda sahnani tahrirlash. Asl rekonstruksiya so'ralgan uchta tahrir bilan ko'rsatilgan: g'ishtli devorni ochish, tik turgan holda yig'ilish o'tkazish uchun polni bo'shatish va xonani Jahon chempionatini tomosha qilish uchun bezatish. Har bir ko'rsatma Room.py fayliga tahrir sifatida qo'llaniladi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Interaktiv&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;3D-sahnalar&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yaratish&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;murakkabligi&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Room.py kodini&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;iterativ&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;yozish&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;NATIJA&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Yuqori&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;aniqlikdagi&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;simulyatsion&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;egizaklar&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/pat
