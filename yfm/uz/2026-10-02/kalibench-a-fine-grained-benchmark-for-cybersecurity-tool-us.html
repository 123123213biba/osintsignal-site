        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"216\" cy=\"176\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"644\" cy=\"168\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Nega neyrotarmoqlar Kali&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Linux buyruqlarida xato&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qiladi va buni qanday&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;tuzatish kerak&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f1.jpg\" alt=\"1-rasm: Nima uchun KaliBench muhim? KaliBench tahlilchi niyatini bajariladigan Kali buyruqlariga aylantirish uchun nozik\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Nima uchun KaliBench muhim? KaliBench tahlilchi niyatini bajariladigan Kali buyruqlariga aylantirish uchun nozik, tekshiriladigan baholash va ish vaqtini talab qilmaydigan mukofot treningini ta'minlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Ko'pgina neyrotarmoqlar Kali Linux uchun buyruqlar yaratishda qiynaladi va sintaksisda jiddiy xatolarga yo'l qo'yadi. Tadqiqotchilar 1642 ta vositani qamrab olgan 8504 ta so'rov-buyruq juftligidan iborat KaliBench tizimini taqdim etishdi. Ushbu yechim modellarni tekshiriladigan mukofotlar orqali o'qitishga va ularning aniqligini oshirishga imkon beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Ma'lumotlar to'plami 1642 ta Kali Linux vositasi uchun 8504 ta juftlikni o'z ichiga oladi.&lt;/li&gt;\n&lt;li&gt;CLI sintaksisi murakkabligi sababli modellarning aniqligi 42% dan oshmaydi.&lt;/li&gt;\n&lt;li&gt;Tekshiriladigan mukofotlar 8B modellarni yirik tizimlar darajasiga yetkazadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Zamonaviy LLM modellar tahlilchi niyatini CLI-buyruqlariga o'girishda ko'pincha xato qiladi, chunki kiberxavfsizlik vositalari bilan ishlash yuqori aniqlikni talab qiladi. API'dan farqli o'laroq, CLI-vositalari modeldan mustaqil ravishda vositani tanlashni va bayroqlarni (flags) to'g'ri joylashtirishni talab qiladi. KaliBench ushbu muammoni 23 ta qobiliyat yo'nalishi va 5 ta xavfsizlik bosqichi bo'yicha tuzilgan ma'lumotlar to'plami orqali hal qiladi.&lt;/p&gt;\n&lt;p&gt;Tadqiqot uslubi ko'p bosqichli tekshiruvni o'z ichiga oladi: neyrotarmoq validatsiyasidan tortib, izolyatsiya qilingan muhitda (sandbox) bajarish va inson tomonidan tuzatishgacha. Tadqiqot shuni ko'rsatdiki, hatto kuchli modellar ham «cheklanmagan» rejimda 42% dan yuqori aniqlik ko'rsata olmaydi. Biroq, tekshiriladigan mukofotlar asosida mustahkamlash (RLVR) orqali o'qitish 8B hajmli modellarni 685B parametrli gigant tizimlar darajasiga olib chiqadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Benchmark faqat buyruqlar generatsiyasiga qaratilgan va ko'p bosqichli ssenariylarni baholamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Zamonaviy katta til modellari (LLM) kiberxavfsizlik ish jarayonlarida tahlilchilarning niyatlarini vositalar buyruqlariga aylantirish uchun tobora ko‘proq qo‘llanilmoqda. Biroq, mavjud baholash usullari asosan bilimga asoslangan testlar yoki agentlik vazifalariga qaratilgan bo‘lib, modellarning real kiberxavfsizlik vositalari uchun bajariladigan buyruqlarni yaratish qobiliyatini bevosita o‘lchamaydi. Bu jiddiy kamchilik, chunki kiberxavfsizlik operatsiyalari qat’iy buyruq satri interfeyslariga (CLI) tayanadi, bu yerda kichik sintaktik xatolar yoki noto‘g‘ri argumentlar buyruqning ishlamay qolishiga olib keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KaliBench — bu 1 642 ta vositani qamrab oluvchi 8 504 ta «so‘rov-buyruq» juftligidan iborat yangi benchmark bo‘lib, u ochiq vaznli modellarning CLI buyruqlarini yaratishdagi aniqligi 42% dan oshmasligini ko‘rsatdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu muammoni hal qilish uchun Kali Linux uchun tabiiy tildan CLI buyruqlariga o‘tkazish bo‘yicha KaliBench ma’lumotlar to‘plami taqdim etildi. U 23 ta funksional yo‘nalish va 5 ta xavfsizlik bosqichini qamrab oladi. KaliBench yaratish metodologiyasi deterministik kanonizatsiya va taxalluslarni (alias) hisobga olgan holda baholashni o‘z ichiga oladi, bu esa natijalarning takrorlanuvchanligini ta’minlaydi. Sifatni tekshirish LLM asosidagi validatsiya, izolyatsiya qilingan muhitda (sandbox) bajarish va inson ishtirokidagi tahrirlashni birlashtirgan ko‘p bosqichli tizim orqali amalga oshiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deterministik kanonizatsiya — bu buyruqlarning turli yozilish variantlarini yagona standartga keltirish jarayoni bo‘lib, u model aniqligini xolis baholash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;24 ta model konfiguratsiyasini sinovdan o‘tkazish natijalari shuni ko‘rsatdiki, hech qanday ochiq vaznli model 42% aniqlik chegarasidan o‘ta olmagan. Shunga qaramay, mualliflar KaliBench yordamida nazoratli o‘qitish (SFT) va mustahkamlangan o‘qitish (RL) orqali 8 mlrd parametrli modelni 685 mlrd parametrli MoE modellari darajasiga yetkazish mumkinligini isbotladilar.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar faqat Kali Linux muhiti uchun xosdir; boshqa tizimlarda modellarning samaradorligi turlicha bo‘lishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"kiberxavfsizlikda-llm-va-cli-muammosi\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kiberxavfsizlikda-llm-va-cli-muammosi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kiberxavfsizlikda LLM va CLI muammosi&lt;/span&gt;&lt;/a&gt;Kiberxavfsizlikda LLM va CLI muammosi&lt;/h4&gt;\n&lt;p&gt;Katta til modellari (LLM) kiberxavfsizlik ish jarayonlariga tobora ko‘proq integratsiya qilinmoqda. Hozirgi kunda mavjud benchmarklar asosan nazariy bilimlarni yoki CTF (Capture The Flag) kabi murakkab muhitlarni baholashga qaratilgan. Biroq, ular modellarning real buyruq qatori (CLI) vositalari uchun to‘g‘ri buyruqlar generatsiya qilish qobiliyatini tekshirmaydi. Kali Linux kabi platformalarda 2000 dan ortiq vositalar mavjud bo‘lib, argumentlar yoki bayroqlardagi kichik xatoliklar ham buyruqning ishlamay qolishiga olib keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavjud testlar CLI buyruqlarini generatsiya qilish aniqligini baholamaydi, bu esa zamonaviy kiberxavfsizlik vositalari uchun xatosiz sintaksis talab qilinishi sababli jiddiy kamchilikdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kalibench-metodologiya-va-tuzilma\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kalibench-metodologiya-va-tuzilma\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KaliBench: metodologiya va tuzilma&lt;/span&gt;&lt;/a&gt;KaliBench: metodologiya va tuzilma&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘shliqni to‘ldirish uchun mualliflar KaliBench — NL-to-CLI (tabiiy tildan buyruq qatoriga o‘tkazish) uchun ixtisoslashgan benchmarkni ishlab chiqdilar. Standart testlardan farqli o‘laroq, KaliBench «sxemasiz» (schema-free) muhitda ishlaydi, bu esa yuzlab vositalarni kontekst oynasiga sig‘dirish imkonsiz bo‘lgan real sharoitlarni aks ettiradi. Rasm 1da ko‘rsatilganidek, KaliBench vazifani vositani tanlash va argumentlarni shakllantirishga ajratadi. Ma’lumotlar to‘plami 23 ta funksional yo‘nalish va 5 ta xavfsizlik bosqichini qamrab olgan 8504 ta «so‘rov-buyruq» juftligidan iborat (deduplikatsiyadan so‘ng 5000 ta baholash va 3504 ta o‘qitish uchun).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f1.jpg\" alt=\"1-rasm: Nima uchun KaliBench muhim? KaliBench tahlilchi niyatini bajariladigan Kali buyruqlariga aylantirish uchun nozik\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm: Nima uchun KaliBench muhim? KaliBench tahlilchi niyatini bajariladigan Kali buyruqlariga aylantirish uchun nozik, tekshiriladigan baholash va ish vaqtini talab qilmaydigan mukofot treningini ta'minlaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Sxemasiz» muhit modeldan oldindan berilgan JSON-sxemalarsiz, vositalar sintaksisini mustaqil ravishda bilishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"verifikatsiya-va-natijalar\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#verifikatsiya-va-natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Verifikatsiya va natijalar&lt;/span&gt;&lt;/a&gt;Verifikatsiya va natijalar&lt;/h4&gt;\n&lt;p&gt;Ma’lumotlar sifati LLM-validatsiya, «sandbox»da bajarish va inson tomonidan tekshirish orqali ta’minlanadi. Mualliflar 24 ta model konfiguratsiyasini uchta rejimda sinab ko‘rdilar. Asosiy muammo argumentlarni to‘g‘ri shakllantirish ekanligi aniqlandi. SFT (Supervised Fine-Tuning) va RLVR (verifikatsiyalanadigan mukofotlar bilan mustahkamlovchi o‘qitish) usullari 8B hajmli modelning natijalarini 7,5 foiz punktga yaxshilashga imkon berdi. Muhimi, ushbu tizim buyruqlarni real vaqtda bajarishni talab qilmaydigan (runtime-free) mukofotlash mexanizmini taklif etadi.&lt;/p&gt;\n&lt;h4 id=\"mavzuga-oid-tadqiqotlar\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#mavzuga-oid-tadqiqotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavzuga oid tadqiqotlar&lt;/span&gt;&lt;/a&gt;Mavzuga oid tadqiqotlar&lt;/h4&gt;\n&lt;p&gt;LLM'larni kiberxavfsizlik sohasida baholash MMLU kabi umumiy testlardan maxsus tizimlargacha rivojlandi. HELM ko'plab metrikalarni birlashtirsa-da, u kiberxavfsizlikning o'ziga xos talablarini hisobga olmaydi. SecEval, CyberMetric, CyberBench, SECURE, CS-Eval, SecBench va CTI-Bench kabi mavjud benchmarklar kriptografiya va tarmoq xavfsizligi kabi sohalarda nazariy bilimlarni testlar orqali tekshirishga qaratilgan. Biroq, ular amaliy ko'nikmalarni emas, balki statik bilimlarni baholaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavjud benchmarklar nazariy bilimlarni tekshirish bilan cheklanadi, KaliBench esa real vositalar uchun aniq buyruqlar generatsiyasiga urg'u beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CyBench, NYU-CTF Bench va DefenderBench kabi zamonaviy ishlar CTF yoki korporativ muhitlarda agentli baholashga o'tmoqda. Biroq, bunday murakkab vazifalarda xatolik sababini aniqlash qiyin, chunki natija rejalashtirish va muhit bilan o'zaro ta'sirga bog'liq. KaliBench ushbu muammoni buyruqlar generatsiyasi, vositalarni tanlash va argumentlar to'g'riligini alohida baholash orqali hal qiladi.&lt;/p&gt;\n&lt;h4 id=\"funksiyalarni-chaqirish-benchmarklari\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#funksiyalarni-chaqirish-benchmarklari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Funksiyalarni chaqirish benchmarklari&lt;/span&gt;&lt;/a&gt;Funksiyalarni chaqirish benchmarklari&lt;/h4&gt;\n&lt;p&gt;LLM'larning tashqi vositalarni chaqirish qobiliyatini o'rganuvchi ishlar (BFCL, ToolSandbox, StableToolBench, HammerBench) odatda aniq API sxemalariga tayanadi. Bunday yondashuvlar rasmiy tavsiflarni talab qiladi, bu esa buyruqlar qatori interfeysi (CLI) bilan ishlashda qo'llanilmaydi, chunki u yerda parametrlar qat'iy sxemaga ega emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CLI (Command Line Interface) — bu dastur bilan matnli buyruqlar orqali ishlash usuli bo'lib, unda argumentlar tuzilishi kontekstga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Hozirgi kunda sxemasiz sharoitlarda tabiiy tilni CLI buyruqlariga o'girishni baholovchi benchmarklar mavjud emas. KaliBench ushbu bo'shliqni to'ldirib, real kiberxavfsizlik vositalari uchun bajariladigan buyruqlarning aniqligini baholash imkonini beradi.&lt;/p&gt;\n&lt;h4 id=\"kalibench\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kalibench\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KaliBench&lt;/span&gt;&lt;/a&gt;KaliBench&lt;/h4&gt;\n&lt;p&gt;KaliBench — bu kiberxavfsizlik bo‘yicha tabiiy tildagi so‘rovlar va Kali Linux buyruqlari o‘rtasidagi tarjima qatlami vazifasini bajaruvchi ixtisoslashgan benchmark va ma’lumotlar to‘plamidir. U 1642 ta vositani va 8504 ta «so‘rov–buyruq» juftligini qamrab oladi. KaliBench yaratish jarayoni to‘rt bosqichdan iborat: Kali Linux hujjatlaridan metama’lumotlarni ajratib olish va LLM orqali ma’lumotlar generatsiya qilish; ko‘p bosqichli filtrlash (LLM-tekshiruvi, «qum qutisi»da ishga tushirish, ekspert bahosi); ma’lumotlarni dedublikatsiya qilish va o‘qitish/test to‘plamlariga ajratish; hamda samarali sozlash va mustahkamlovchi o‘qitish usullari yordamida modellarni takomillashtirish.&lt;/p&gt;\n&lt;p&gt;Ma’lumotlarni generatsiya qilish bosqichida mualliflar Kali Linux repozitoriysidagi 2372 ta vosita bo‘yicha rasmiy hujjatlardan foydalanishgan. Qwen3-Max modeli yordamida har bir vosita uchun 10-13 ta «so‘rov–buyruq» juftligi yaratilgan (jami 27,7 mingta). Ushbu ma’lumotlar vositani tanlash va sintaktik to‘g‘rilikni tahlil qilish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KaliBench 1642 ta vosita uchun 8504 ta yuqori sifatli «so‘rov–buyruq» juftligini o‘z ichiga oladi, ular ko‘p bosqichli tekshiruvdan o‘tgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LLM gallyutsinatsiyalari (dastlabki buyruqlarning 50% dan ortig‘i xatoli bo‘lgan) bilan kurashish uchun tekshiruv tizimi joriy etildi. Birinchi bosqichda LLM buyruqlarning hujjatlarga mosligini tekshirdi, natijada 53,8% namunalar olib tashlandi. Takroriy generatsiya va tekshiruvdan so‘ng ma’lumotlar hajmi 14,5 mingta juftlikni tashkil etdi, bu dastlabki ma’lumotlarning 47,65% qisqarishini anglatadi.&lt;/p&gt;\n&lt;h4 id=\"terminal-verification\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#terminal-verification\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Terminal Verification&lt;/span&gt;&lt;/a&gt;Terminal Verification&lt;/h4&gt;\n&lt;p&gt;Buyruqlarning bajarilishini ta’minlash uchun mualliflar Kali-linux-everything tasviriga ega Docker konteyneridan foydalanganlar. Buyruqlar chiqish (stdout, stderr) va yakunlash kodlari bo‘yicha tekshirilgan. Sintetik so‘rovlardagi parametrlar (yo‘llar, manzillar) «qum qutisi»da mavjud bo‘lmasligi mumkinligi sababli, qoidalarga asoslangan filtrlash qo‘llanilgan. Bu bosqich LLM tekshiruvidan o‘tgan buyruqlarning 11,95% qismini chiqarib tashladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qum qutisi (sandbox) — bu kodni xavfsiz muhitda bajarib, uning haqiqiy ishlash qobiliyatini tekshirish imkonini beruvchi izolyatsiya qilingan tizim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"human-in-the-loop-evaluation\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#human-in-the-loop-evaluation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Human-in-the-loop Evaluation&lt;/span&gt;&lt;/a&gt;Human-in-the-loop Evaluation&lt;/h4&gt;\n&lt;p&gt;Yakuniy bosqichda modellardagi xatolarni tahlil qilish uchun inson ishtirokidagi ekspert baholash o‘tkazildi. AI-agent so‘rov va buyruq semantikasini dastlabki solishtirdi, so‘ngra ekspertlar noaniqliklar va markalash xatolarini aniqladilar. Bu jarayon noto‘g‘ri bayroqlar, majburiy argumentlarning tushirib qoldirilishi yoki semantik nomuvofiqliklar tufayli ma’lumotlarning yana 4,9% qismini chiqarib tashlashga olib keldi.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Open-weight model query-to-command performance across three modes.Columns report Unrestricted (U), Restricted (R), and Hinted (H).†indicates thinking-enabled models, and⋆ denotes cybersecurity-tuned models.Bold/underline mark the best and second-best within each size group.Models are sorted by Averaged Total Score.MoE parameters use Total/Active (e.g., 685/37B). Table 1 summarizes per-model performance under three modes:Unrestricted (U), Restricted (R), and Hinted (H). We report Exact Correct (EC), Tool Accuracy (TA), Optional-Argument F1 (Opt-F1), Positional-Argument F1 (Pos-F1), Total Score (TS), and Average TS (Avg.).We analyze key patterns with respect to tool information, model type and scale, and post-training on KaliBench.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-tT1.jpg\" alt=\"Jadval 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"dedublikatsiya-va-oquv-test-toplamlariga-ajratish\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#dedublikatsiya-va-oquv-test-toplamlariga-ajratish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Dedublikatsiya va o‘quv-test to‘plamlariga ajratish&lt;/span&gt;&lt;/a&gt;Dedublikatsiya va o‘quv-test to‘plamlariga ajratish&lt;/h4&gt;\n&lt;p&gt;Semantik xilma-xillikni ta’minlash uchun biz SemHash tizimidan foydalandik. Har bir yozuv [so‘rov, vosita nomi, to‘g‘ri buyruq] birligi sifatida ifodalandi. Vektorli fazoda kosinus o‘xshashligi 0,90 dan yuqori bo‘lgan yozuvlar klasterlandi. Natijada 27,7 mingta dastlabki ma’lumotdan 8,5 mingtasi (30,7%) saralab olindi. Bu NL-to-CLI baholash uchun sifatli benchmark bo‘lib xizmat qiladi. Test to‘plami 5000 ta (barcha 1642 ta vositani qamrab oladi), o‘quv to‘plami esa 3504 ta (962 ta vosita) namunadan iborat.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;8,5 mingta tekshirilgan juftlikdan iborat ma’lumotlar bazasi test to‘plamida barcha vositalarni qamrab olish imkonini berdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;Baholash protokoli. Modellar Kali Linux buyruqlarini uch rejimda generatsiya qiladi: (1) Unrestricted (faqat so‘rov), (2) Restricted (20 ta nomzod vosita ro‘yxati bilan), (3) Hinted (rasmiy hujjatlar bilan). Python’ning shlex kutubxonasi yordamida buyruqlar tahlil qilinadi. Baholash komponentlar bo‘yicha amalga oshiriladi: vosita nomi, ixtiyoriy argumentlar (aliaslar bilan) va pozitsion argumentlar tekshiriladi. Qarang: Rasm 3.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f3.jpg\" alt=\"3-rasm: KaliBench tuzilishi va vakillik namunasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: KaliBench tuzilishi va vakillik namunasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: KaliBench tuzilishi va vakillik namunasi. KaliBench xavfsizlik hujumi hayotiy tsikli bo'yicha tashkil etilgan Kali Linux vositalarining tuzilgan benchmarkidir. U 5 ta xavfsizlik bosqichi va funktsional o'lchovlarni o'z ichiga oladi. Ma'lumotlar to'plami namunasi tabiiy tildagi so'rovlar va parchalangan haqiqiy buyruqlarni o'z ichiga oladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Baholash metrikalariga vosita tanlash aniqligi, argumentlar uchun F1-o‘lchovi va Exact Correct (barcha komponentlarning mos kelishi) kiradi.&lt;/p&gt;\n&lt;h4 id=\"imkoniyatlar-taksonomiyasi-va-xavfsizlik-bosqichlari\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#imkoniyatlar-taksonomiyasi-va-xavfsizlik-bosqichlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Imkoniyatlar taksonomiyasi va xavfsizlik bosqichlari&lt;/span&gt;&lt;/a&gt;Imkoniyatlar taksonomiyasi va xavfsizlik bosqichlari&lt;/h4&gt;\n&lt;p&gt;Biz kali-tools taksonomiyasidan foydalanib, 23 ta funksional o‘lchovni beshta xavfsizlik bosqichiga ajratdik: razvedka va dastlabki kirish, zaifliklarni tahlil qilish, ekspluatatsiya, post-ekspluatatsiya hamda himoya tahlili va hisobot. Har bir o‘lchov asosiy bosqichga biriktirilgan bo‘lib, bu model samaradorligini turli kiberxavfsizlik kontekstlarida tahlil qilish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xavfsizlik bosqichlari (Cyber Kill Chain) — kiberhujumning bosqichma-bosqich modelidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol start=\"4\" style=\"--hier-list-start:3\"&gt;\n&lt;li&gt;O‘qitish protokoli. Biz SFT va RLVR usullarini qo‘llaymiz. O‘quv to‘plami 3504 ta juftlikni 3 ta rejimga ko‘paytirish orqali 10 512 ta namunani tashkil etadi.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"tajribalar\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#tajribalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tajribalar&lt;/span&gt;&lt;/a&gt;Tajribalar&lt;/h4&gt;\n&lt;p&gt;Tajriba sozlamalari. Ochiq kodli modellar NVIDIA A100 klasterida vLLM dvigateli yordamida baholandi. 72B va undan katta modellar OpenRouter API orqali sinovdan o‘tkazildi. Jami 14 ta umumiy maqsadli (Llama 3.1, Qwen-3, Mistral-3.2, Gemma-3, GPT-OSS, LLaMA-3.3, DeepSeek-V3.2, GLM-5.2) va 7 ta kiberxavfsizlikka yo‘naltirilgan (Foundation-Sec, Llama-Primus, RedSage) modellar tahlil qilindi. O‘qitish uchun LoRA va Unsloth kutubxonasi ishlatildi, RedSage-Ins (8B) bazaviy model sifatida olindi. RedSage-K ning uchta varianti (SFT, GRPO va SFT+GRPO) bitta H200 GPU (141GB VRAM) yordamida 32 batch hajmi bilan ikki davr (epoch) davomida o‘qitildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LoRA — bu modelning barcha parametrlarini o‘zgartirmasdan, faqat kichik qismini o‘qitish orqali samarali moslashtirish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modellarning-uchta-rejimdagi-samaradorligi\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#modellarning-uchta-rejimdagi-samaradorligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Modellarning uchta rejimdagi samaradorligi&lt;/span&gt;&lt;/a&gt;Modellarning uchta rejimdagi samaradorligi&lt;/h4&gt;\n&lt;p&gt;Baholash rejimlarining ta’siri. Cheklanmagan (U) rejimidan vositalarni cheklash (R) rejimiga o‘tish vositani tanlash aniqligini (TA) 72,0% dan 95,2% gacha oshiradi. Biroq, bu argumentlar sifatiga (Opt-F1, Pos-F1, EC) kam ta’sir qiladi, bu esa vositani to‘g‘ri tanlash komandani to‘g‘ri shakllantirishni anglatmasligini ko‘rsatadi. Maslahatlar (H) rejimi eng katta o‘sishni beradi: Opt-F1 45,1% dan 87,8% gacha, EC esa 22,3% dan 73,1% gacha ko‘tarildi. Bu modellar hujjatlarsiz komanda tuzishda yetarli bilimga ega emasligini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maslahatlar (H) rejimi komandalarni to‘g‘ri shakllantirish uchun hal qiluvchi ahamiyatga ega, chunki u modellardagi bilim bo‘shliqlarini to‘ldiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Model turi va miqyosining ta’siri. Kiberxavfsizlikka yo‘naltirilgan modellar (⋆) cheklangan sharoitlarda (U va R) yaxshiroq natija beradi, umumiy maqsadli modellar esa H rejimida ustunlik qiladi. Mantiqiy xulosa chiqarish qobiliyatiga ega modellar (†) vazifalarni parchalashda samaraliroq. Qwen3† (8B) modeli kattaroq modellardan (Gemma-3 27B) o‘rtacha ko‘rsatkichlar bo‘yicha ustun keldi, bu esa CLI generatsiyasi faqat parametrlar soniga emas, balki ko‘rsatmalarga amal qilish va mantiqiy fikrlashga bog‘liqligini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model hajmining kattaligi har doim ham sifat oshishini kafolatlamaydi; o‘qitish usuli va mantiqiy xulosa qobiliyati muhimroqdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Proprietary modellar. Xavfsizlik talablaridan kelib chiqib, asosiy e’tibor mahalliy modellarga qaratildi. Shunga qaramay, KaliBench qiyinligini tekshirish uchun GPT-5.6-Sol, Claude Opus 5 va OpenAI Codex 5000 ta test so‘rovida sinab ko‘rildi.&lt;/p&gt;\n&lt;h4 id=\"all-5k\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#all-5k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(all 5K)&lt;/span&gt;&lt;/a&gt;(all 5K)&lt;/h4&gt;\n&lt;p&gt;2-jadvalda 5000 ta so‘rovdan iborat to‘liq to‘plam bo‘yicha natijalar keltirilgan. GPT-5.6-Sol modeli 61,68% Exact Correct (EC) ko‘rsatkichi bilan yetakchilik qilmoqda, undan keyin Codex (51,68%) va Claude Opus 5 (44,02%) turadi. Ushbu uchala model ham ochiq vaznli modellar orasida eng kuchlisi bo‘lgan GLM-5.2 (41,32%) natijasidan yuqori natija ko‘rsatdi. So‘rovlarni qamrab olish darajasi tizimlar o‘rtasida farq qiladi: GPT-5.6-Sol 4988 ta, Codex 4633 ta va Claude Opus 5 atigi 3675 ta so‘rovga javob bergan. Bu farqlar xavfsizlik cheklovlari kiberxavfsizlik bilan bog‘liq foydalanishga ta’sir qilishini ko‘rsatadi. Masalan, Claude Opus 5 javob berilgan so‘rovlarda 59,89% EC ko‘rsatkichiga ega, ammo past qamrov (73,50%) tufayli uning umumiy EC ko‘rsatkichi 44,02% gacha pasayadi. 61,68% lik maksimal aniqlik KaliBench hali ham murakkab sinov ekanligini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GPT-5.6-Sol 99,76% qamrov bilan 61,68% aniqlikni qayd etib, xavfsizlik cheklovlari kamligi evaziga raqobatchilardan ustun keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Jadval 5.&lt;/strong&gt; Turli xil bajarish rejimlaridagi unumdorlik deltasi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Model&lt;/th&gt;\n&lt;th&gt;Hajm&lt;/th&gt;\n&lt;th&gt;Tool score ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;th&gt;Optional F1 ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;th&gt;Positional F1 ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;th&gt;Total score ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;th&gt;Exact ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Compact Models (≤8B)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Foundation-Sec-Ins⋆&lt;/td&gt;\n&lt;td&gt;8B&lt;/td&gt;\n&lt;td&gt;26.00 -5.70 20.30&lt;/td&gt;\n&lt;td&gt;3.90 38.20 42.10&lt;/td&gt;\n&lt;td&gt;7.00 21.30 28.30&lt;/td&gt;\n&lt;td&gt;12.30 17.90 30.20&lt;/td&gt;\n&lt;td&gt;4.40 37.10 41.50&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Llama3.1-Ins&lt;/td&gt;\n&lt;td&gt;8B&lt;/td&gt;\n&lt;td&gt;32.00 1.70 33.70&lt;/td&gt;\n&lt;td&gt;4.80 45.50 50.30&lt;/td&gt;\n&lt;td&gt;8.40 23.90 32.30&lt;/td&gt;\n&lt;td&gt;15.10 23.70 38.80&lt;/td&gt;\n&lt;td&gt;5.70 44.50 50.20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Llama-Primus-Base⋆&lt;/td&gt;\n&lt;td&gt;8B&lt;/td&gt;\n&lt;td&gt;23.40 3.40 26.80&lt;/td&gt;\n&lt;td&gt;2.60 41.60 44.20&lt;/td&gt;\n&lt;td&gt;5.60 22.10 27.70&lt;/td&gt;\n&lt;td&gt;10.50 22.40 32.90&lt;/td&gt;\n&lt;td&gt;3.50 41.00 44.50&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Foundation-Sec-Rsn⋆†&lt;/td&gt;\n&lt;td&gt;8B&lt;/td&gt;\n&lt;td&gt;25.80 3.10 28.90&lt;/td&gt;\n&lt;td&gt;4.30 46.40 50.70&lt;/td&gt;\n&lt;td&gt;4.90 28.30 33.20&lt;/td&gt;\n&lt;td&gt;11.70 25.90 37.60&lt;/td&gt;\n&lt;td&gt;5.30 48.00 53.30&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Llama-Primus-Merged⋆&lt;/td&gt;\n&lt;td&gt;8B&lt;/td&gt;\n&lt;td&gt;27.20 1.80 29.00&lt;/td&gt;\n&lt;td&gt;4.10 43.30 47.40&lt;/td&gt;\n&lt;td&gt;6.60 23.90 30.50&lt;/td&gt;\n&lt;td&gt;12.60 23.00 35.60&lt;/td&gt;\n&lt;td&gt;4.70 44.20 48.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;RedSage-DPO⋆&lt;/td&gt;\n&lt;td&gt;8B&lt;/td&gt;\n&lt;td&gt;28.30 0.60 28.90&lt;/td&gt;\n&lt;td&gt;6.00 39.30 45.30&lt;/td&gt;\n&lt;td&gt;9.20 22.60 31.80&lt;/td&gt;\n&lt;td&gt;14.50 20.90 35.40&lt;/td&gt;\n&lt;td&gt;7.20 42.70 49.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qwen3&lt;/td&gt;\n&lt;td&gt;8B&lt;/td&gt;\n&lt;td&gt;26.70 0.70 27.40&lt;/ ash qobiliyatiga ega modellarni, ⋆ esa kiberxavfsizlik uchun sozlangan modellarni bildiradi. Qalin/tagi chizilgan belgilar har bir o'lcham guruhidagi eng katta va ikkinchi eng katta deltalarni belgilaydi. Modellar tartibi 1-jadvalga mos keladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Asl so'rovlarga nisbatan umumiy ballning foiz punktlaridagi o'rtacha o'zgarishi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Model konfiguratsiyasi&lt;/th&gt;\n&lt;th&gt;O'rtacha o'zgarish (%)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Unrestricted mode&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model 1&lt;/td&gt;\n&lt;td&gt;4.23&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model 2&lt;/td&gt;\n&lt;td&gt;4.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model 3&lt;/td&gt;\n&lt;td&gt;3.14&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model 4&lt;/td&gt;\n&lt;td&gt;3.12&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model 5&lt;/td&gt;\n&lt;td&gt;3.02&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model 6&lt;/td&gt;\n&lt;td&gt;3.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model 7&lt;/td&gt;\n&lt;td&gt;2.97&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model 8&lt;/td&gt;\n&lt;td&gt;1.98&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;O'rtacha qiymat&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;3.20&lt;/strong&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; Proprietary models and scaffolded inference in Unrestricted mode.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-tT2.jpg\" alt=\"Jadval 2\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"kalibench-post-treningining-tasiri\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kalibench-post-treningining-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KaliBench post-treningining ta’siri&lt;/span&gt;&lt;/a&gt;KaliBench post-treningining ta’siri&lt;/h4&gt;\n&lt;p&gt;KaliBench o‘quv to‘plamida post-trening o‘tkazish ixcham modellarning samaradorligini sezilarli darajada oshiradi. RedSage-K variantlari 76,9, 77,4 va 79,2 o‘rtacha ballarni qayd etdi. 8B parametrli RedSage-K (SFT+GRPO) modeli ochiq modellar orasida uchinchi o‘rinni egallab, DeepSeek-V3.2 dan atigi 1,0 ballga ortda qolmoqda. SFT usuli vositalarni xaritalash va kontekstli maslahatlarni o‘rganishda samarali bo‘lsa, GRPO (mustahkamlash orqali o‘qitish) argumentlarni shakllantirishda (Pos-F1 va TS) kuchliroq natija beradi. Kombinatsiyalangan yondashuv (SFT+GRPO) eng yaxshi EC va TS ko‘rsatkichlarini ta’minlaydi, garchi H (Hard) rejimida RedSage-Ins modeliga nisbatan biroz pasayish kuzatilsa ham. SFT dan boshlang‘ich bosqich sifatida foydalanish argumentlar yaratishdagi xatolarni va regressiyalarni kamaytirishga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — belgilangan namunalar asosida o‘qitish, GRPO (Group Relative Policy Optimization) — guruh mukofotlari asosida model strategiyasini optimallashtiruvchi mustahkamlash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ishlash-samaradorligi-va-mustahkamlikni-batafsil-tahlil-qilish\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#ishlash-samaradorligi-va-mustahkamlikni-batafsil-tahlil-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ishlash samaradorligi va mustahkamlikni batafsil tahlil qilish&lt;/span&gt;&lt;/a&gt;Ishlash samaradorligi va mustahkamlikni batafsil tahlil qilish&lt;/h4&gt;\n&lt;p&gt;O‘lchamlar va vositalar darajasidagi tahlil. 5(a)-rasmda 23 ta funksional o‘lcham, beshta xavfsizlik bosqichi va uchta baholash rejimi bo‘yicha modellar samaradorligi keltirilgan. Vazifalarning murakkabligi barcha rejimlar uchun o‘xshash: «gpu» va «crypto-stego» kabi yo‘nalishlar yuqori natija ko‘rsatgan bo‘lsa, «802-11» va «wireless» eng qiyinlari bo‘lib qolmoqda. H (Hinted) rejimida modellar o‘rtasidagi natijalar farqi kamayadi, bu hujjatlashtirish argumentlarni shakllantirishda yordam berishini, ammo interfeys murakkabligini to‘liq bartaraf etmasligini ko‘rsatadi. «Razvedka» va «Zaifliklarni tahlil qilish» bosqichlari barqaror, «Post-ekspluatatsiya» va «Himoya tahlili» esa CLI tuzilmalarining xilma-xilligi tufayli katta farqlarni ko‘rsatadi. Oddiy shablonli vositalar (masalan, truecrypt2john) ishonchli ishlanadi, kam uchraydigan bayroqli vositalar (masalan, nikto) esa sintaktik xatolarga sabab bo‘ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vositalar bo‘yicha hujjatlarni taqdim etish (H rejimi) modellar o‘rtasidagi natijalar tafovutini sezilarli darajada kamaytiradi va umumiy aniqlikni oshiradi, garchi CLI sintaksisi murakkabligi to‘siq bo‘lib qolsa ham.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Rejimlar bo‘yicha samaradorlik tendensiyalari. 5(b,c)-rasmda umumiy ball (Total Score) va aniqlik (Exact Correct) taqsimoti ko‘rsatilgan. Har ikkala ko‘rsatkich U (Unrestricted) dan R (Restricted) va H ga o‘tishda yaxshilanadi. Umumiy ball diapazoni 21,8 dan 13,7 foiz punktigacha torayadi, bu modellarni sifat jihatidan yaqinlashtiradi. Biroq, «Exact Correct» ko‘rsatkichidagi farq katta bo‘lib qolmoqda (H rejimida 28,3 f.p.), bu mutlaqo aniq buyruqlarni yozishdagi qiyinchiliklarni anglatadi. Asosiy xatolar: qisqa va uzun bayroq shakllarini aralashtirish, mavjud bo‘lmagan opsiyalarni xayol qilish, noto‘g‘ri pozitsion argumentlar va birlik/ko‘plik shakllaridagi xatolardir.&lt;/p&gt;\n&lt;h4 id=\"sorovlar-ozgarishiga-chidamlilik\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#sorovlar-ozgarishiga-chidamlilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;So‘rovlar o‘zgarishiga chidamlilik&lt;/span&gt;&lt;/a&gt;So‘rovlar o‘zgarishiga chidamlilik&lt;/h4&gt;\n&lt;p&gt;Biz sakkizta model konfiguratsiyasining so‘rovlar shakliga sezgirligini baholadik: «Paraphrase» (sinonimlar), «Informal» (so‘zlashuv uslubi) va «Messy» (shovqin, xatolar, so‘zlar tushib qolishi). 3-jadvalga ko‘ra, parafrazlar natijaga deyarli ta’sir qilmaydi, norasmiy uslub esa biroz pasayishga olib keladi. «Messy» so‘rovlar, ayniqsa U rejimida, samaradorlikning eng katta pasayishiga olib keladi. H rejimi eng kichik pasayishni (1,07 f.p.) ko‘rsatadi, bu hujjatlarga kirish modellarga «shovqinli» ma’lumotlar bilan ishlashda yordam berishini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Messy» so‘rovlar — bu modelning shovqinni e’tiborsiz qoldirib, vazifa mohiyatiga e’tibor qaratish qobiliyatini tekshirish uchun grammatik xatolar va buzilgan tuzilishga ega sun’iy kiritilgan ma’lumotlardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"muhokama-va-xulosalar\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#muhokama-va-xulosalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama va xulosalar&lt;/span&gt;&lt;/a&gt;Muhokama va xulosalar&lt;/h4&gt;\n&lt;p&gt;KaliBench katta til modellarining (LLM) kiberxavfsizlik bo‘yicha umumiy bilimlari hamda ularning aniq, bajariladigan CLI buyruqlarini yaratish qobiliyati o‘rtasidagi sezilarli tafovutni ko‘rsatib beradi. Tadqiqot natijalari shuni ko‘rsatadiki, vositani tanlash va argumentlarni shakllantirish tubdan farq qiluvchi muammolardir. Nomzod vositalarni cheklash tanlovdagi xatolarni deyarli bartaraf etadi, ammo argumentlar darajasidagi to‘g‘rilik, ayniqsa ixtiyoriy bayroqlar (flags) va ularning qiymatlari bilan bog‘lanishi asosiy to‘siq bo‘lib qolmoqda. Vositalar bo‘yicha hujjatlarni taqdim etish eng katta samaradorlik o‘sishini beradi, bu esa xatolar ko‘pincha niyatni tushunmaslikdan emas, balki soha bo‘yicha bilimlar yetishmasligidan kelib chiqishini anglatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM uchun asosiy muammo vositani tanlash emas, balki buyruqlar tarkibi va bayroqlarni to‘g‘ri sozlashdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu topilmalar vositalardan foydalanishni sxemasiz muhitda, ya’ni modellar aniq API’larsiz sintaksisni o‘zlari aniqlashi kerak bo‘lgan sharoitda baholash muhimligini ta’kidlaydi. Baholashdan tashqari, KaliBench real vaqtda muhitni ishga tushirishni talab qilmaydigan, tekshirilishi mumkin bo‘lgan mukofotlar orqali modellarni takomillashtirish imkonini beradi. SFT va RLVR yordamida qayta o‘qitish ixcham modellarning samaradorligini sezilarli darajada oshiradi: 8 mlrd parametrli model ancha yirik tizimlar natijalariga yaqinlashadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT — nazorat ostida nozik sozlash, RLVR — tekshiriladigan mukofotlar asosida mustahkamlovchi ta’lim.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Shunga qaramay, cheklovlar saqlanib qolmoqda: bir bosqichli buyruqlar generatsiyasiga urg‘u berilishi va hujjatlarga asoslangan ma’lumotlarga tayanish. Kelgusi ishlar ko‘p bosqichli ish jarayonlari, qidiruv bilan boyitilgan (RAG) vositalardan foydalanish va muhitni hisobga olgan holda baholashga qaratilishi kerak. Umuman olganda, KaliBench LLM asosidagi kiberxavfsizlik vositalarini ishonchli va bajariladigan darajada rivojlantirish uchun amaliy sinov va o‘qitish bazasini taqdim etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KaliBench hozircha faqat bir bosqichli vazifalarga qaratilgan va sifatli hujjatlarga bog‘liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f2.jpg\" alt=\"2-rasm: Kali Linux-da NL-to-CLI baholash uchun KaliBench end-to-end quvuri. Benchmark LLM asosidagi ma'lumotlar generats\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Kali Linux-da NL-to-CLI baholash uchun KaliBench end-to-end quvuri. Benchmark LLM asosidagi ma'lumotlar generatsiyasi, ko'p bosqichli tekshirish-regeneratsiya va vakillik namunalarini tanlash orqali qurilgan. Baholash taxalluslarni hisobga olgan holda tahlil qilishni va vositalar, argumentlar va o'lchovli kategoriyalar bo'yicha nozik baholashni qo'llaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f5.jpg\" alt=\"5-rasm: Xavfsizlik o'lchovlari va rejimlar bo'yicha ishlash.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm: Xavfsizlik o'lchovlari va rejimlar bo'yicha ishlash.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm: Xavfsizlik o'lchovlari va rejimlar bo'yicha ishlash. (a) Har bir rejim uchun 23 o'lchov va 5 bosqich bo'yicha ishlash. Quti diagrammalari taqsimotlarni (Q1–Q3) ko'rsatadi, mo'ylovlar min/max uchun. (b,c) Rejimlar bo'yicha umumiy ball va aniq to'g'ri (%); nuqtali chiziqlar rejimlarlararo farqlarni ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f6.jpg\" alt=\"6-rasm: KaliBench namunalarining umumiy ko'rinishi. Barcha beshta xavfsizlik bosqichi va 23 ta baholash o'lchovini qamra\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm: KaliBench namunalarining umumiy ko'rinishi. Barcha beshta xavfsizlik bosqichi va 23 ta baholash o'lchovini qamrab olgan vakillik namunalari ko'rsatilgan. Batafsil ma'lumot uchun kattalashtiring.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f7.jpg\" alt=\"7-rasm: KaliBench'dagi buyruqlar qatori parametrlarining qamrovi (baholash to'plami). Umumiy bayroqlar (masalan, –help, \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: KaliBench'dagi buyruqlar qatori parametrlarining qamrovi (baholash to'plami). Umumiy bayroqlar (masalan, –help, –verbose) tez-tez uchrasa-da, vositalarga xos bo'lgan ko'plab funksional parametrlar ham butun ma'lumotlar to'plamida mavjud.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Sun'iy&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;intellekt CLI&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;buyruqlarini&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff
