        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"145\" cy=\"86\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"695\" cy=\"239\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · CROWDSOURCING   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ijtimoiy tarmoqlarda&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;faktlarni tekshirish: sun'iy&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;intellekt va odamlar&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;hamkorligi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f2.jpg\" alt=\"2-rasm: Community Writer. Yozish jarayoni postlarni olish va ustuvorliklarini belgilashdan boshlanadi, so‘ngra yuborishd\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Community Writer. Yozish jarayoni postlarni olish va ustuvorliklarini belgilashdan boshlanadi, so‘ngra yuborishdan oldin qoralama tayyorlash va eslatmalarni baholash amalga oshiriladi. Qayta aloqa halqalari taklif etilgan eslatmalarni o‘chirish yoki qayta ko‘rib chiqish uchun ishtirokchilar reytingini kuzatib boradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Community Notes platformasi endilikda postlarga kontekst qo'shish uchun sun'iy intellektdan foydalanmoqda. Avtomatlashtirilgan yozuvchilar foydalanuvchilar bilan birgalikda ishlaydi, yakuniy qarorni esa jamoatchilik qabul qiladi. 2026-yil iyun oyidagi tahlillar shuni ko'rsatadiki, sun'iy intellekt faktlarni tekshirish jarayonini sezilarli darajada tezlashtirgan.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Sun'iy intellekt jamoatchilik tomonidan foydali deb topilgan eslatmalarning 52 foizini ta'minlaydi.&lt;/li&gt;\n&lt;li&gt;Tizim sifat va aniqlikka bog'liq bo'lgan kvotalar bilan ishlaydigan API'dan foydalanadi.&lt;/li&gt;\n&lt;li&gt;Sun'iy intellekt insonlar faol bo'lmagan 42 foiz postlarda kontekst yaratadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tizim kraudsorsing — ko'ngillilar jamoasi tomonidan ma'lumotlarni baholash usuliga asoslangan. 2025-yil sentyabridan boshlab AI Note Writer API ishga tushirildi, bu esa ishlab chiquvchilarga sun'iy intellekt yordamida eslatmalar taklif qilish imkonini beradi. Muhimi, sun'iy intellekt yakuniy qaror qabul qilmaydi: X platformasi foydalanuvchilari har bir eslatmaning foydali (Helpful) yoki foydasiz (Not Helpful) ekanligiga ovoz berishadi. Tizim turli qarashlarga ega foydalanuvchilar o'rtasidagi konsensusni aniqlash uchun ochiq kodli algoritmdan foydalanadi.&lt;/p&gt;\n&lt;p&gt;2026-yil iyun oyida asosiy API mijozi bo'lgan Community Writer «Foydali» deb topilgan barcha eslatmalarning 52 foizini yaratdi. Sun'iy intellekt yozuvchilari «kirish davri»dan (earn-in) o'tishi shart, bunda ularning aniqligi, toksiklik yo'qligi va faktlarga mosligi tekshiriladi. Nashr qilish kvotalari avvalgi eslatmalarning muvaffaqiyatiga qarab dinamik ravishda o'zgaradi, bu esa sun'iy intellekt tizimlarini inson baholaridan yuqori sifatni saqlashga majbur qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ma'lumotlar 2026-yil 2-29 iyun davrini qamrab oladi va moderatsiya algoritmlaridagi uzoq muddatli o'zgarishlarni hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Community Notes — bu X ijtimoiy tarmog‘idagi postlarga kontekst qo‘shish uchun kraudsorsing yondashuvi. Ishtirokchilar eslatmalarni taklif qiladilar va baholaydilar, bu esa ochiq kodli va ochiq ma’lumotlarga asoslangan algoritm uchun kirish ma’lumotlarini shakllantiradi. Ushbu algoritm qaysi eslatmalar foydalanuvchilarga keng ko‘lamda ko‘rsatilishini belgilaydi. 2025-yil sentyabridan buyon AI Note Writer API faoliyat yuritmoqda, u sun’iy intellekt yordamida eslatmalar taklif qilish uchun ochiq interfeysni taqdim etadi. Bunda asosiy prinsip saqlanib qoladi: platforma yoki sun’iy intellekt emas, balki foydalanuvchilar qaysi eslatmalar ko‘rinishini nazorat qiladi. Eslatmalarga bo‘lgan aniq so‘rovlar va foydalanuvchilarning X tarmog‘idagi faolligi AI API postlar oqimini belgilaydi, bu esa sun’iy intellektning ishi foydalanuvchilar talabiga javob berishini ta’minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Community Notes tizimi kontekst yaratish uchun sun’iy intellektdan foydalanadi, bunda «foydali» deb topilgan va keng auditoriyaga ko‘rsatilgan eslatmalarning 52% AI Note Writer API orqali yaratilgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tadqiqot 2026-yil 2-29 iyun kunlarini qamrab oladi. API’ning eng yirik mijozi — Community Writer bo‘lib, u sun’iy intellekt tomonidan yaratilgan natijalarning asosiy qismini ta’minlaydi. Tizim o‘qitish va ishlash jarayonida hamjamiyat fikriga tayanib, eslatmalarni ustuvorlashtirish, qoralama tayyorlash, baholash va o‘chirishni amalga oshiradi. Masshtabdan tashqari, sun’iy intellekt tezlikni ham ta’minlaydi: boshqa mualliflar bilan solishtirganda, u 60% hollarda birinchi bo‘lib o‘chirilmaydigan eslatmani taklif qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI Note Writer API — bu avtomatlashtirilgan tizimlarga foydalanuvchilar so‘rovlari asosida postlarga tushuntirish eslatmalarini taklif qilish imkonini beruvchi dasturiy interfeys.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sun’iy intellekt insonlar ishini to‘ldiradi va Community Notes qamrovini kengaytiradi. «Foydali» eslatmalarga ega postlarning 42% faqat sun’iy intellekt tomonidan yaratilgan eslatmalarga ega, bu insonlarning ushbu mavzularga qiziqishi yo‘qligini ko‘rsatadi. Aksincha, 30% postlar faqat insonlar tomonidan yozilgan eslatmalarni o‘z ichiga oladi, bu insonlarning hissasi hali ham muhimligini anglatadi. Community Writer dasturiy ta’minoti ochiq kodli bo‘lib, Apache 2.0 litsenziyasi ostida chiqarilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ma’lumotlar ma’lum bir davrni (2026-yil iyun) aks ettiradi va algoritmlar yoki foydalanuvchilar xulq-atvoridagi uzoq muddatli o‘zgarishlarni hisobga olmasligi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"community-notes-tizimining-evolyutsiyasi-va-suniy-intellektning-joriy-etilishi\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-notes-tizimining-evolyutsiyasi-va-suniy-intellektning-joriy-etilishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Notes tizimining evolyutsiyasi va sun'iy intellektning joriy etilishi&lt;/span&gt;&lt;/a&gt;Community Notes tizimining evolyutsiyasi va sun'iy intellektning joriy etilishi&lt;/h4&gt;\n&lt;p&gt;2021-yil yanvar oyida ishga tushirilgan Community Notes dasturi noto‘g‘ri ma’lumotlarga qarshi kurashishning markazlashmagan mexanizmidir. Tizim markaziy nazoratsiz ishlaydi: foydalanuvchilar postlarga kontekstli izohlar taklif qiladi, boshqa ishtirokchilar esa ularning foydaliligini baholaydi. Ochiq kodli va ochiq ma’lumotli algoritm hatto qarama-qarshi qarashlarga ega foydalanuvchilar o‘rtasida ham konsensusni aniqlaydi va izohlarga «Foydali» (CRH), «Foydasiz» (CRNH) yoki «Ko‘proq baho talab qilinadi» (NMR) maqomini beradi. CRH maqomi izohning barcha foydalanuvchilar uchun ko‘rinishini ta’minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Community Notes algoritmi raqiblar o‘rtasida konsensusga erishish imkonini beradi, sun’iy intellekt (SI) mualliflarining joriy etilishi esa foydali izohlar (CRH) hajmini kunlik 86,0% ga oshirdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oldingi tadqiqotlar ushbu yondashuvning aniqligi va samaradorligini tasdiqlaydi. Muvaffaqiyat Meta, TikTok va YouTube kabi platformalarni ham shunga o‘xshash vositalarni joriy etishga undadi. Biroq, odamlar tomonidan izoh yozish ko‘p vaqt talab qiladi. 2025-yil 2-sentabrda tizimga AI API integratsiya qilindi, bu esa uchinchi tomon ishlab chiquvchilariga avtomatlashtirilgan izohlar yaratish imkonini berdi. Muhimi, SI faqat kontentni taklif qiladi, yakuniy qaror (CRH maqomi) esa hamon hamjamiyat baholari orqali qabul qilinadi.&lt;/p&gt;\n&lt;h4 id=\"community-writer-arxitektura-va-tizimga-qoshilgan-hissa\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-writer-arxitektura-va-tizimga-qoshilgan-hissa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Writer: arxitektura va tizimga qo‘shilgan hissa&lt;/span&gt;&lt;/a&gt;Community Writer: arxitektura va tizimga qo‘shilgan hissa&lt;/h4&gt;\n&lt;p&gt;AI API’ning eng yirik mijozi bu Community Writer (CW) bo‘lib, u taklif qilingan izohlarning 41% ini tashkil qiladi. CW kontentni filtrlash va yaratish uchun ixtisoslashgan o‘qitilgan modellar va tijorat yechimlaridan foydalanadi. Loyiha Apache 2.0 litsenziyasi ostida tarqatiladi. Ushbu ishda mualliflar SI agentlari yuqori tezlikni ta’minlashini ko‘rsatadilar: 60% hollarda SI mijozi birinchi bo‘lib o‘chirilmaydigan izoh yaratadi, bu esa CRH maqomidagi izohlar ko‘rishlarining 55% ini ta’minlaydi. Shuningdek, tizim resurslardan samarali foydalanadi: SI umumiy baholarning 22% ini sarflagan holda barcha CRH-izohlarning 52% ini yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SI-mualliflar (AI writers) — bu API orqali postlar lentasini kuzatib boradigan va avtomatik ravishda tushuntirish izohlarini yaratadigan dasturiy agentlardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"background-and-related-work\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#background-and-related-work\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Background and Related Work&lt;/span&gt;&lt;/a&gt;Background and Related Work&lt;/h4&gt;\n&lt;p&gt;Ushbu sohadagi tadqiqotlarning aksariyati Community Notes tizimining aniqligi va samaradorligini baholashga qaratilgan. Allen va hammualliflar X platformasidagi COVID-19 va vaksinalarga oid eslatmalarni tahlil qilib, ularning 97% qismi to‘liq ishonchli ekanligini aniqladilar. Slaughter tadqiqotlari shuni ko‘rsatdiki, jamoa eslatmasi qo‘shilgandan so‘ng chalg‘ituvchi ma’lumotlarning tarqalishi 46% ga kamayadi. Chuai va hamkasblari bu tendensiyani tasdiqlab, noto‘g‘ri kontent tarqalishining o‘rtacha 62% ga qisqarishini va foydalanuvchilar tomonidan bunday postlarni o‘chirish ehtimoli 103% ga oshishini qayd etdilar. Drolsbach eslatmalarning kontekstga moslashtirilishi foydalanuvchilarning faktchekingga bo‘lgan ishonchini umumiy ogohlantirishlarga qaraganda ko‘proq oshirishini ko‘rsatdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqotlar Community Notes tizimining 97% aniqligini va noto‘g‘ri ma’lumotlar tarqalishini 46–62% gacha kamaytirishdagi samaradorligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Boshqa ishlar jamoaviy va professional faktchekingni solishtiradi. Borenstein avval hujjatlashtirilgan dezinformatsiyaga oid eslatmalar boshqa manbalarga qaraganda ikki barobar ko‘proq faktcheking manbalariga havola qilishini aniqladi. Zhao va Naaman jamoaviy yondashuvlar tezroq ishlashini va ko‘pincha professional ma’lumotlarga tayanishini ta’kidlaydilar. AI yechimlari sohasida Singh, Zhou va De eslatmalarni yaratish uchun modellar taqdim etishdi, ammo ularning baholanishi real sharoitda emas, balki ekspertlar yoki tadqiqot ishtirokchilari yordamida oflayn rejimda o‘tkazildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oflayn baholash — bu algoritmni real foydalanuvchilar bilan o‘zaro aloqasiz, statik ma’lumotlar to‘plamida sinovdan o‘tkazish.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Individual eslatmalar yaratishga qaratilgan avvalgi ishlardan farqli o‘laroq, biz butun platforma miqyosida kontekstni ta’minlaydigan ochiq API ishini taqdim etamiz. Biz eng yirik API-klient arxitekturasini, jumladan infratuzilma va modellarni tasvirlaymiz. Li va Bakker ham API-klientni baholab, u odamlarga qaraganda ko‘proq kechikish bilan ishlashini, ammo reyting nazorat qilinganda eslatma sifati bo‘yicha odamlardan ustunligini qayd etishdi. Mantzarlis passiv tahlilda AI-mualliflar odamlarga qaraganda yuqoriroq o‘rtacha foydalilik (CRH) ko‘rsatkichlarini saqlab qolishini tasdiqladi. Bizning ish bu ma’lumotlarni kengaytirib, kechikish, sifat va hajm bo‘yicha metrikalarni, shuningdek, boshqa API-klientlar va eng yaxshi inson-mualliflar bilan solishtirishni o‘z ichiga oladi.&lt;/p&gt;\n&lt;h4 id=\"community-notes-ai-api-sharhi\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-notes-ai-api-sharhi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Notes AI API sharhi&lt;/span&gt;&lt;/a&gt;Community Notes AI API sharhi&lt;/h4&gt;\n&lt;p&gt;Community Notes AI API beshta asosiy funksiyani taqdim etadi: nomzod postlarni so‘rash, potensial eslatmalarni baholash, takliflarni yuborish, eslatmalarni o‘chirish va real vaqt rejimida ularning holatini kuzatish. API orqali yaratilgan barcha eslatmalar shaffoflik uchun binafsha rang bilan belgilanadi. Tizim kontent sifatini saqlash va spamni cheklash uchun nashr etish huquqini «ishlab topish» va kvotalash mexanizmlarini o‘z ichiga oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kvota tizimi AI-mualliflardan insonlarnikidan yuqori samaradorlikni talab qiladi: 20% muvaffaqiyat darajasi (hit rate) bilan kuniga 500 ta eslatma nashr etish mumkin, insonlarning o‘rtacha CRH ko‘rsatkichi esa 10,4% ni tashkil etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;API dan foydalanish uchun ishlab chiquvchilar tasdiqlangan email va telefon raqamiga ega, Community Notes dasturining amaldagi ishtirokchisi bo‘lmagan akkauntni ro‘yxatdan o‘tkazishlari kerak. «Ishlab topish» (earn-in) jarayoni oxirgi 50 ta eslatmani uchta mezon bo‘yicha tahlil qilishga asoslangan: havolalar haqiqiyligi (kamida 95% 200 HTTP kodini qaytarishi kerak), ta’qib qilish belgilarining yo‘qligi (kamida 98% eslatma klassifikator tekshiruvidan o‘tishi shart) va ClaimOpinion modeliga muvofiqlik. Oxirgi model DistilRoBERTa-base arxitekturasiga asoslangan bo‘lib, eslatmaning foydaliligi va faktlarga asoslanganligini baholaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ClaimOpinion — bu eslatmaning foydali (Helpful) deb topilish ehtimolini bashorat qiluvchi, uning xolisligini tahlil qiluvchi mashinali o‘qitish modeli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tekshiruvdan o‘tgandan so‘ng kvota tizimi ishga tushadi. U muvaffaqiyatli (CRH) va muvaffaqiyatsiz (CRNH) eslatmalar nisbati — «hit rate» asosida nashrlar sonini dinamik tartibga soladi. Kam o‘qiladigan postlar bilan ishlashda jarimalarni oldini olish uchun 14 kunlik hisob-kitobdan 10 tadan kam baho olgan eslatmalar chiqarib tashlanadi. Kvotalar nochiziqli o‘sadi: 10% muvaffaqiyatda kuniga 50 ta eslatmadan, 20% muvaffaqiyatda kuniga 500 tagacha. 1-jadvalda ko‘rsatilganidek, API ma’lumotlar oqimini (Small dan XXL gacha) talabga qarab tuzilmalashtiradi, bunda tanlama hajmi kuniga 428 dan 24 389 tagacha postni tashkil etadi.&lt;/p&gt;\n&lt;h4 id=\"api-ishlash-mexanizmi-va-lentalar-tasnifi\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#api-ishlash-mexanizmi-va-lentalar-tasnifi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;API ishlash mexanizmi va lentalar tasnifi&lt;/span&gt;&lt;/a&gt;API ishlash mexanizmi va lentalar tasnifi&lt;/h4&gt;\n&lt;p&gt;Tizim kontentni to‘rt turdagi lentaga taqsimlaydi: Small, Large, XL va XXL (1-jadval). Postlarning qaysi lentaga tushishi foydalanuvchilarning aniq so‘rovlari, bilvosita signallar (masalan, @grokisthistrue? eslatmalari) va so‘rov muallifining foydalilik reytingiga bog‘liq. Postlar XXL lentasidan boshlanib, signallar to‘planishi bilan torroq lentalarga o‘tadi. Small lentasi CRH (Community Rated Helpful) maqomini oladigan postlarning eng yuqori konsentratsiyasini ta’minlaydi, ammo bu eng yuqori kechikish bilan bog‘liq. Kichikroq lentalarga kirish uchun kamida 100 ta yozilgan eslatma, 5% dan kam bo‘lmagan muvaffaqiyat darajasi (hit rate) va 10% dan oshmaydigan CRNH darajasi talab qilinadi. XXL lentasiga kirish uchun oxirgi 90 kun ichida kamida 100 ta sof CRH ko‘rsatkichi kerak. 2025-yil sentabr oyida ishga tushirilgandan beri API 65 ta mijozni jalb qildi, ulardan 32 tasi nashr etish huquqini oldi va 19 tasi faol qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kotalar va lentalarni filtrlash tizimi foydali eslatmalar sonini maksimal darajaga chiqarishga imkon beradi va ishlab chiquvchilarni kontentni tanlashda ehtiyotkor bo‘lishga majbur qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"community-writer-cw-sharhi\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-writer-cw-sharhi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Writer (CW) sharhi&lt;/span&gt;&lt;/a&gt;Community Writer (CW) sharhi&lt;/h4&gt;\n&lt;p&gt;Community Writer — bu raqamli va kategoriyali belgilar asosidagi klassifikatorlar, shuningdek, qayta o‘qitilgan va tijorat modellari kombinatsiyasidan foydalanadigan maxsus vositadir. CW SpaceX AI ichki infratuzilmasidan mustaqil ishlaydi, yopiq interfeyslarga ega emas va barcha boshqa AI mualliflari kabi bir xil kvota qoidalari va foydalilikni baholash algoritmlariga bo‘ysunadi. Uning vazifasi — hamjamiyat fikr-mulohazalari asosida eslatmalarni ustuvorlashtirish, yaratish, baholash va o‘chirishdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRH (Community Rated Helpful) — hamjamiyat tomonidan foydali va ishonchli deb topilgan eslatma maqomi bo‘lib, bu AI muallifi samaradorligining asosiy ko‘rsatkichidir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"loyihalash-maqsadlari\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#loyihalash-maqsadlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Loyihalash maqsadlari&lt;/span&gt;&lt;/a&gt;Loyihalash maqsadlari&lt;/h4&gt;\n&lt;p&gt;CW arxitekturasi uchta asosiy tamoyilga asoslanadi:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Hamjamiyatga yo‘naltirilganlik: eslatmalarni ishlab chiqarish va o‘chirish ishtirokchilar faolligi va X foydalanuvchilari jalb qilinganligi bilan bevosita bog‘liq.&lt;/li&gt;\n&lt;li&gt;Masshtablilik va past kechikish: tizim postlar navbatini tezkor qayta ishlashi va javoblarni sezilarli vaqt sarfisiz yaratishi kerak.&lt;/li&gt;\n&lt;li&gt;Resurslarni tejash: NMR (Not Mostly Rated) eslatmalarining 54% i CRH maqomini olish uchun yetarli baholarga ega emasligini hisobga olgan holda, CW ishtirokchilar e’tiborini minimal sarf bilan CRH eslatmalarini maksimal darajada ko‘rsatishga intiladi.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim samaradorligi hamjamiyat ishtirokchilarining cheklangan e’tibori bilan chegaralangan, shuning uchun algoritmlar faqat CRH maqomini olish ehtimoli eng yuqori bo‘lgan postlarni ustuvorlashtirishga majbur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"arxitektura-sharhi\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#arxitektura-sharhi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Arxitektura sharhi&lt;/span&gt;&lt;/a&gt;Arxitektura sharhi&lt;/h4&gt;\n&lt;p&gt;CW tizimi eslatmalarni yaratish, tahrirlash va o‘chirish jarayonlarini boshqarish uchun modellashtirish, navbatlar va AI API chaqiruvlarini birlashtiradi. 2-rasmda ko‘rsatilganidek, jarayon AI API orqali nomzod postlarni izlashdan boshlanadi va ular LIFO (oxirgi kelgan birinchi chiqadi) tamoyili asosida navbatlarga joylashtiriladi. Ustuvorlik postlar lentasi hajmi va Notable Post Model (NPM) baholari bilan belgilanadi; NPM postning CRH (Community Rated Helpful) maqomini olish ehtimolini bashorat qiladi. NPM Community Notes ma’lumotlari asosida, X API orqali olingan kontent va foydalanuvchi faolligi xususiyatlarini hisobga olgan holda o‘qitiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim CRH salohiyati yuqori va lenta hajmi kichik bo‘lgan postlarga ustuvorlik berib, eng talabgir kontent uchun kechikishlarni minimallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Inson-mualliflar postlarni o‘rganib, Grok 4.20 va Community Notes ma’lumotlari asosida moslashtirilgan CN Grok modellari yordamida qoralama eslatmalar yaratadilar. Tizim har bir modeldan parallel ravishda uchtagacha variant hosil qiladi, so‘ngra ClaimOpinion modeli eng yaxshisini tanlaydi. Helpfulness, Recent Context va Screenshot Rejectors filtrlari sifatsiz eslatmalarni saralab oladi. Agar ikkala model ham tekshiruvdan o‘tsa, CN Grok ustunlikka ega bo‘ladi. Tizim samaradorligini oshirish uchun qayta urinish navbati (Retry Queue) post yaratilgandan 45 daqiqa o‘tib, tahrirlash navbatlari (Revision Queues) esa CRH maqomiga erishmagan eslatmalar uchun 1 va 3 soatdan keyin ishga tushadi. O‘chirish modeli (Deletion Model) reytinglarni real vaqt rejimida kuzatib boradi va samarasiz eslatmalarni o‘chirib tashlaydi.&lt;/p&gt;\n&lt;h4 id=\"konveyer-komponentlari-tafsilotlari\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#konveyer-komponentlari-tafsilotlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Konveyer komponentlari tafsilotlari&lt;/span&gt;&lt;/a&gt;Konveyer komponentlari tafsilotlari&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘limda NPM, mualliflar, filtrlar va o‘chirish modeli batafsil yoritiladi. NPM va o‘chirish modelining ishlashi alohida tahlil qilinadi, CW tizimining umumiy samaradorligi esa 6-bo‘limda keltiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LIFO (Last-In, First-Out) — navbatni qayta ishlash usuli bo‘lib, unda eng oxirgi kelgan vazifa birinchi bo‘lib bajariladi, bu tizimga eng yangi va dolzarb voqealarga tezkor javob berish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"notable-post-model\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#notable-post-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Notable Post Model&lt;/span&gt;&lt;/a&gt;Notable Post Model&lt;/h4&gt;\n&lt;p&gt;Notable Post Model (NPM) modeli postning CRH (Community Notes) eslatmasini olish ehtimolini post mazmuni va metama'lumotlar asosida bashorat qiladi. O'qitish uchun API lentalaridan olingan ma'lumotlar ishlatiladi, bu esa ma'lumotlar taqsimotidagi nomutanosiblikni bartaraf etadi. CRH maqomiga erishish uchun kamida 10 ta baho talab qilinganligi sababli, NPM ko'rinishi past bo'lgan postlarni saralab oladi va ularni tahlildan chiqaradi, bu esa baholovchilar resurslarini tejashga xizmat qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NPM tizimi CRH maqomini olish ehtimoli past bo'lgan postlarni avvaldan chiqarib tashlash orqali baholash jarayonini optimallashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Model bir nechta turdagi belgilarni birlashtiradi: foydalanuvchi faolligi (repostlar, javoblar, layklar, iqtiboslar, xatcho'plar va ko'rishlar), muallif xususiyatlari (obunachilar soni, postlar tarixi, Community Notes tarixi, verifikatsiya holati va parodiya akkaunt belgilari) hamda post konteksti (yoshi, tili, yaratilgan vaqti, media mavjudligi va all-mpnet-base-v2 yordamida olingan matnli embedding). Barcha ma'lumotlar ochiq API yoki tizim tarixidan olinadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Embedding — bu matnni raqamli vektor ko'rinishida ifodalash bo'lib, modelga postlarning semantik yaqinligini tushunish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;NPM vaqt omillarini va belgilar o'zaro ta'sirini hisobga oladi. Oldindan ishlov berish bosqichida faollik ko'rsatkichlari post yoshi va ko'rishlar soniga nisbatan normallashtiriladi. Model bitta yashirin qatlamli ko'p qatlamli perseptron arxitekturasidan foydalanadi. 3-rasmda ko'rsatilganidek, NPM eng katta lentalarda yuqori aniqlikni ko'rsatadi. AUC ko'rsatkichi modelning CRH olishi mumkin bo'lgan postlarni aniqlash qobiliyatini aks ettiradi, bunda recall (to'liqlik) CRH bo'lmagan va tizimdan chiqarib tashlangan postlar ulushini, noto'g'ri ijobiy natijalar esa CRH olgan postlarning xato o'chirilganligini bildiradi.&lt;/p&gt;\n&lt;h4 id=\"mualliflar-va-rad-etuvchilar-rejectors\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#mualliflar-va-rad-etuvchilar-rejectors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mualliflar va rad etuvchilar (Rejectors)&lt;/span&gt;&lt;/a&gt;Mualliflar va rad etuvchilar (Rejectors)&lt;/h4&gt;\n&lt;p&gt;CW tizimi eslatmalarni (Community Notes) yaratish uchun ikkita maxsus modeldan foydalanadi. Ikkala model ham internetda qidiruv o‘tkazish, URL va tasvirlarni tahlil qilish hamda X platformasidagi foydalanuvchi profillari va media kontentga kirish imkoniyatiga ega. CNGrokWriter modeli qisqa prompt asosida ishlaydi, chunki uning xatti-harakati foydalanuvchilar tomonidan foydali deb topilgan eslatmalar asosida maxsus o‘qitilgan. Prompt tarkibiga tahlil qilinadigan post, uslubiy ko‘rsatmalar va foydalanuvchilar tomonidan tavsiya etilgan manbalar ro‘yxati kiritilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizim eslatmalar sifatini oshirish va noto‘g‘ri ma’lumotlarni kamaytirish uchun ikkita generativ model va to‘rtta filtrdan foydalanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Grok 4.20 Writer modeli esa batafsilroq promptdan foydalanadi. U postdagi noaniqliklarni baholashga va eslatmaning o‘quvchilar uchun qanchalik muhimligini aniqlashga qaratilgan. Sifat mezonlari orasida ishonchlilik, ixchamlik, xolislik va manbalarning mavjudligi ustuvor hisoblanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Rad etuvchilar (rejectors) — bu eslatmalarni foydalanuvchilar baholashiga yuborishdan oldin ularning sifatini tekshiradigan algoritmlardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Sifatni nazorat qilish uchun to‘rtta filtr ishlatiladi. «Helpfulness Rejector» — bu eslatmaning CRH (Community Rated Helpful) maqomini olish ehtimolini bashorat qiluvchi Grok modeli. «Recent Context Rejector» esa oxirgi 100 ta muvaffaqiyatli va 100 ta muvaffaqiyatsiz eslatmalar bilan solishtirish orqali xatolarni takrorlamaslikka yordam beradi. «Screenshot Rejector» media kontentni tekshiradi: u postdagi tasvirlarni manbalardagi tasvirlar bilan solishtiradi. Agar postda video bo‘lsa, tizim video davomida bir necha marta skrinshot oladi. Agar dastlabki tekshiruv o‘tmasa, tizim yana uch marta qayta tekshiruv o‘tkazadi. «Revision Rejector» esa tahrirlarni baholaydi: u asl va o‘zgartirilgan eslatmalar o‘rtasidagi farqlarni tahlil qilib, o‘zgartirishlar yangi dalillar keltirishi yoki argumentatsiyani kuchaytirishi kerakligini nazorat qiladi.&lt;/p&gt;\n&lt;h4 id=\"ochirish-modeli-deletion-model\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#ochirish-modeli-deletion-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O‘chirish modeli (Deletion Model)&lt;/span&gt;&lt;/a&gt;O‘chirish modeli (Deletion Model)&lt;/h4&gt;\n&lt;p&gt;O‘chirish modeli (Deletion Model) CRH (Current Rating Helpful) maqomini olish ehtimoli past bo‘lgan eslatmalarni aniqlash va ularni proaktiv tarzda o‘chirish uchun mo‘ljallangan. O‘chirilgan eslatmalar X foydalanuvchilariga ko‘rinmaydi, bu esa baholash resurslarini tejashga yordam beradi, biroq ular baribir eslatma yuborish kvotalari va kunlik yozish limitlariga ta’sir qiladi. Model real vaqt rejimida eslatma holati va baholarini olish imkonini beruvchi AI API’ga tayanadi. Real vaqt rejimida baholash ma’lumotlariga kirish uchun oxirgi 90 kun ichida kamida 100 ta CRH maqomidagi eslatmaga ega bo‘lish talab etiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O‘chirish modeli real vaqt rejimida baholarni tahlil qilish orqali istiqbolsiz eslatmalarni avtomatik ravishda olib tashlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tizim «Foydali», «Qisman foydali» va «Foydali emas» baholarini, shuningdek, eslatma sifatini belgilovchi teglarni (masalan, manbalarning yo‘qligi yoki asosiy fikrlarning tushib qolishi) tahlil qiladi. Ushbu ma’lumotlar baholovchi omilining ijobiy, neytral va salbiy qiymatlariga mos keladigan uchta guruhga jamlanadi. Model logistik regressiya yordamida bashorat qiladi, bunda belgilarning o‘zaro ta’sirini hisobga olish uchun diskretizatsiya va polinomial krosslardan foydalaniladi. O‘qitish ma’lumotlari dastlabki 30 ta baho davomida 10 martagacha bo‘lgan intervallar bilan ajratib olinadi, bu esa ishlab chiqarish ma’lumotlarining o‘qitish taqsimotiga mos kelishini ta’minlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Polinomial krosslar — bu mavjud xususiyatlarni ko‘paytirish orqali yangi xususiyatlarni yaratish usuli bo‘lib, u modelga belgilar o‘rtasidagi murakkab bog‘liqliklarni aniqlashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4-rasmda ko‘rsatilganidek, modelning aniqligi baholar soni ortishi bilan yaxshilanadi. Ishlab chiqarish jarayonida tizim har 60 soniyada baholarni tekshiradi. Model yuqori ishonchga ega bo‘lganda 3 yoki 4 ta baho asosida o‘chirish uchun yuqori chegara, 5 va undan ortiq baho mavjud bo‘lganda esa standart chegara qo‘llaniladi. Eslatmalarning turli toifalari bo‘yicha batafsil ma’lumotlar 1-jadvalda keltirilgan.&lt;/p&gt;\n&lt;h4 id=\"baholash\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#baholash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Baholash&lt;/span&gt;&lt;/a&gt;Baholash&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘limda 2026-yil 2-iyundan 29-iyungacha bo‘lgan davrda AI yozuv tizimi (CW) faoliyati tahlil qilinadi. Tadqiqot API oqimlarini profillash, taklif etilgan eslatmalarning boshqa AI va insonlar yozgan eslatmalar bilan solishtirganda samaradorligi hamda filtrlash mexanizmlari ta’sirini qamrab oladi. Tizim yuqori natijadorlikni ko‘rsatdi: CW hissasiga barcha taklif etilgan eslatmalarning 41%, «foydali» (CRH) maqomini olgan eslatmalarning 52% va bunday eslatmalar ko‘rilishining 55% to‘g‘ri keladi, bunda tizim hamjamiyat ishtirokchilari baholarining atigi 22% qismini sarflagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CW tizimi yuqori samaradorlik ko‘rsatib, foydali eslatmalar ko‘rilishining yarmidan ko‘pini ta’minladi va ishtirokchilar resurslarini tejadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;API to‘rtta oqim turini (Small, Medium, Large, XXL) o‘z ichiga oladi, ular kiritish mezonlari bilan farqlanadi. 2-jadvalda ko‘rsatilganidek, yirikroq oqimlar uchun signallarga qo‘yiladigan talablarning pasayishi postlar hajmining eksponensial o‘sishiga (har bir bosqichda 3–5 barobar) olib keladi. Postlarning paydo bo‘lish tezligi ham oshadi: median yoshi Small oqimida 604 daqiqadan XXL oqimida 185 daqiqagacha qisqaradi, bunda postlarning 10% XXL oqimida 9 daqiqa yoki undan kam vaqt ichida paydo bo‘ladi. Insonlar tomonidan yozilgan CRH-eslatmalarni (H-CRH) olgan postlarni qamrab olish darajasi Small oqimida 24,3% dan XXL oqimida 73,4% gacha o‘zgaradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRH (Community Rating Helpfulness) — hamjamiyat ishtirokchilarining baholari asosida aniqlanadigan eslatmaning foydalilik ko‘rsatkichi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Turli oqimlarga moslashish uchun CW individual chegaraviy qiymatlardan foydalanadi. Masalan, yirik oqimlar uchun qat’iyroq filtrlash mezonlari (NPM — Note Prediction Model) qo‘llaniladi, chunki u yerda foydali eslatmalar paydo bo‘lish ehtimoli pastroq. Small oqimida NPM modeli o‘chirilgan, XXL oqimida esa u postlarning atigi 17,1% qismini o‘tkazadi. NPM filtrlashidan so‘ng, qoralama eslatmalar yaratish chastotasi pasayadi va barcha oqimlar uchun yakuniy CRH darajasi 7,9–10,5% oralig‘ida saqlanib qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NPM filtrlash samaradorligi XXL oqimidagi H-CRH postlarini qamrab olish darajasini 73,4% dan 55,8% gacha pasayishiga olib keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Top-mualliflar» (yuqori reytingga ega bo‘lgan barcha faol insonlarning 3,5%) bilan solishtirish shuni ko‘rsatadiki, CW muvaffaqiyatli eslatmalar ulushi bo‘yicha ulardan ustun turadi. 5-rasmda CW resurslarni samarali taqsimlashi va CRH maqomiga o‘rtacha ko‘rsatkichdan yuqori darajada erishishi ko‘rsatilgan. Boshqa AI-mualliflar bahsli kontent zichligi yuqori bo‘lgan oqimlarda (Small oqimida 64%) ustunlik qilsa-da, CW NPM va rad etish mexanizmlari yordamida yirik oqimlarni (XL, XXL) baholash tizimini ortiqcha yuklamasdan qayta ishlashga muvaffaq bo‘ladi.&lt;/p&gt;\n&lt;h4 id=\"ishlash-samaradorligi-va-suniy-intellekt-mualliflarining-tasiri\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#ishlash-samaradorligi-va-suniy-intellekt-mualliflarining-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ishlash samaradorligi va sun'iy intellekt mualliflarining ta'siri&lt;/span&gt;&lt;/a&gt;Ishlash samaradorligi va sun'iy intellekt mualliflarining ta'siri&lt;/h4&gt;\n&lt;p&gt;Inson mualliflari bilan taqqoslash (6-rasm) shuni ko'rsatadiki, chalg'ituvchi postlar zichligi pastroq bo'lgan tasmalar bilan ishlashiga qaramay, Community Writer (CW) tomonidan taklif etilgan eslatmalar sifati boshqa sun'iy intellekt tizimlari va odamlar bilan raqobatbardoshdir. \"Eslatma bo'yicha\" tahlili (7-rasm) CRH (foydali deb topilgan eslatmalar) va past sifatli (o'chirilgan yoki CRH maqomiga erishmagan) eslatmalar ko'rsatkichlarini aks ettiradi. O'chirish modeli (Deletion Model) o'chirish darajasini oshiradi, chunki ko'plab eslatmalar CRH maqomiga yetmasdan oldin olib tashlanadi. Barqaror eslatmalar (kamida 5 ta past sifatli yoki 10 ta CRH bahosiga ega) tahlil qilinganda, CW eng yuqori CRH ko'rsatkichini saqlab qoladi, bu boshqa AI mijozlariga nisbatan z=2.082 (p=.037) statistik ahamiyatga ega.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CW eng yuqori CRH samaradorligini ko'rsatadi: baholashning 29% holati foydali eslatmaga olib keladi, bu eng yaxshi inson mualliflaridagi 17% ko'rsatkichdan yuqoridir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Samaradorlik shuningdek, ishtirokchilar tajribasini aks ettiruvchi \"baholash bo'yicha natijalar\" orqali o'lchanadi. CW eslatmalarning tezroq tasmalarga kirishini ta'minlaydi. 8-rasmga ko'ra, o'chirilmagan eslatmalar orasida CW 60% hollarda birinchi eslatmani, 95% hollarda esa birinchi AI eslatmasini nashr etadi. AI mualliflari mavzular bo'yicha keng qamrovni ta'minlaydi (9-rasm), ko'pincha insonlar ishini to'ldiradi: ko'p hollarda AI eslatmalari insonlar tomonidan taklif qilinmagan postlarda paydo bo'ladi. Shunga qaramay, insonlarning hissasi muhimligicha qolmoqda: CRH eslatmali postlarning 41% qismida AI yozgan CRH eslatmasi yo'q, 30% qismida esa umuman AI taklifi mavjud emas.&lt;/p&gt;\n&lt;h4 id=\"muhokama-va-cheklovlar\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#muhokama-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama va cheklovlar&lt;/span&gt;&lt;/a&gt;Muhokama va cheklovlar&lt;/h4&gt;\n&lt;p&gt;AI mualliflari platforma imkoniyatlarini kengaytiradi, shu bilan birga insonlar nazorati ostida qoladi. Bu CRH eslatmalari sonining 86.0% ga o'sishiga yordam berdi. Tez o'zgaruvchan mavzularda insonlarning ishtiroki ajralmas hisoblanadi. Notable Post va Deletion modellari ko'ngillilarning vaqtini tejab, ularning e'tiborini CRH bo'lish ehtimoli yuqori bo'lgan eslatmalarga qaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRH (Community Rated Helpful) — baholash tizimi asosida hamjamiyat tomonidan foydali va ishonchli deb topilgan eslatma maqomi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot cheklovlari: turli AI mualliflarining operatsion xarajatlari va tasma o'lchamlari turlicha bo'lgani sababli taqqoslash qiyin. Shuningdek, AI akkauntlari o'z xatti-harakatlarini o'zgartirishi yoki bir nechta strategiyalarni birlashtirishi mumkin, bu esa ularni segmentatsiyalashni murakkablashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"community-notes-uchun-suniy-intellekt-vositalarini-joriy-etish-yakunlari\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-notes-uchun-suniy-intellekt-vositalarini-joriy-etish-yakunlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Notes uchun sun'iy intellekt vositalarini joriy etish yakunlari&lt;/span&gt;&lt;/a&gt;Community Notes uchun sun'iy intellekt vositalarini joriy etish yakunlari&lt;/h4&gt;\n&lt;p&gt;Ushbu ishda Community Notes AI API va Community Writer vositalari taqdim etilgan bo'lib, ular birgalikda X ijtimoiy tarmog'ida izohlarni qamrab olishni kengaytirish uchun ochiq va samarali tizimni yaratadi. Biz sun'iy intellektdan izoh qoralamalarini yaratishda foydalanish inson-ko'ngillilar ishiga muhim qo'shimcha ekanligini isbotladik. Ushbu texnologiyalarni joriy etish kontent yaratish tezligini, izohlarni baholash jarayoni samaradorligini sezilarli darajada oshirishga va natijada platformaning keng auditoriyasiga ko'rsatiladigan «Foydali» (Currently Rated Helpful) maqomini olgan izohlar sonini ko'paytirishga imkon berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sun'iy intellekt vositalari tizim tezligi va samaradorligini oshirib, foydali izohlar ulushini ko'paytiradi, shu bilan birga insonlar asosiy moderatorlar rolini saqlab qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Avtomatlashtirishning yaqqol afzalliklariga qaramay, inson hissasi Community Notes ekotizimining fundamental elementi bo'lib qolmoqda. Ko'ngillilar oliy instansiya maqomini saqlab qoladilar va algoritmlar tomonidan yaratilgan yoki foydalanuvchilar tomonidan taklif qilingan qaysi izohlar lentada ko'rsatilishini yakuniy nazorat qiladilar. Sun'iy intellekt faqat yordamchi vosita bo'lib xizmat qiladi, hamjamiyatning ekspert xulosasini almashtirmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Community Notes — bu foydalanuvchilar nashrlarga kontekst qo'shadigan va boshqa ishtirokchilar ushbu qo'shimchalarning foydaliligini baholaydigan kraudsorsing faktlarni tekshirish tizimi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f2.jpg\" alt=\"2-rasm: Community Writer. Yozish jarayoni postlarni olish va ustuvorliklarini belgilashdan boshlanadi, so‘ngra yuborishd\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: Community Writer. Yozish jarayoni postlarni olish va ustuvorliklarini belgilashdan boshlanadi, so‘ngra yuborishdan oldin qoralama tayyorlash va eslatmalarni baholash amalga oshiriladi. Qayta aloqa halqalari taklif etilgan eslatmalarni o‘chirish yoki qayta ko‘rib chiqish uchun ishtirokchilar reytingini kuzatib boradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f3.jpg\" alt=\"3-rasm: Kattaroq lentalar kamroq foydalanuvchilardan eslatma soʻrovlarini talab qilganligi sababli, taqsimot CRH eslatma\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: Kattaroq lentalar kamroq foydalanuvchilardan eslatma soʻrovlarini talab qilganligi sababli, taqsimot CRH eslatmasini olish ehtimoli kamroq deb osonroq aniqlanadigan postlar tomon siljiydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f4.jpg\" alt=\"4-rasm: O'chirish modeli samaradorligi baholar to'planishi bilan ortib boradi. CW o'chirish modelini 3 ta baho mavjud bo\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: O'chirish modeli samaradorligi baholar to'planishi bilan ortib boradi. CW o'chirish modelini 3 ta baho mavjud bo'lishi bilanoq har 60 soniyada qo'llaydi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f7.jpg\" alt=\"7-rasm: Barqaror notalar CRH, CRNH, o'chirilgan yoki minimal reytingga javob beradigan har qanday notani o'z ichiga olad\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm: Barqaror notalar CRH, CRNH, o'chirilgan yoki minimal reytingga javob beradigan har qanday notani o'z ichiga oladi. Barqarorlik sharti bilan, CW ham CRH, ham past sifatli natijalar bo'yicha ustunlik qiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f8.jpg\" alt=\"8-rasm: Boshqa mualliflar bilan solishtirganda, CW postlarning 60 foizida birinchi taklif qilingan, o'chirilmagan eslatm\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm: Boshqa mualliflar bilan solishtirganda, CW postlarning 60 foizida birinchi taklif qilingan, o'chirilmagan eslatmani taqdim etadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f10.jpg\" alt=\"10-rasm: NMR qaydlarining 54 foizi 10 tadan kam baho oladi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm: NMR qaydlarining 54 foizi 10 tadan kam baho oladi.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&g
