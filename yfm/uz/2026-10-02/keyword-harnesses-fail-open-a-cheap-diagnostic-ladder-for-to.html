ex=\"true\"&gt;L5 retseptini aniqlashtirish va omillar tahlili&lt;/span&gt;&lt;/a&gt;L5 retseptini aniqlashtirish va omillar tahlili&lt;/h4&gt;\n&lt;p&gt;L5 retsepti dastlab to‘rtta o‘zgarishni o‘z ichiga olgan kompleks yondashuv edi: korpus xilma-xilligi, o‘qitish tezligini (LR) besh barobar oshirish, embeddinglarni yechish va «iliq start» nuqtasini o‘zgartirish. Keyingi tahlillar ikki omilni chiqarib tashlashga imkon berdi. Start nuqtasi chiqarib tashlandi, chunki turli ota-ona modellaridan boshlangan takroriy ishga tushirishlar bir xil natija berdi (§6.5). Embeddinglarni yechish ham ortiqcha deb topildi, chunki to‘g‘ridan-to‘g‘ri o‘lchovlar o‘qitish jarayonida jadvalning sonli inertligini ko‘rsatdi (§6.6). Biroq, bu istisnolar cheklovlarga ega: «ota-ona» modellar umumiy embedding jadvaliga ega edi, bf16 formatidagi inertlik esa fp32 optimizatorida o‘zgarishlar to‘planmasligini kafolatlamaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;F3 faktor tahlili korpus xilma-xilligi va o‘qitish tezligi ta’sirini ajratishga imkon berdi, ammo natijalar hisoblash muhiti va replikatsiyaning to‘liq emasligi bilan cheklangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tekshirish-cheklovlari-va-metodologiyasi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tekshirish-cheklovlari-va-metodologiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tekshirish cheklovlari va metodologiyasi&lt;/span&gt;&lt;/a&gt;Tekshirish cheklovlari va metodologiyasi&lt;/h4&gt;\n&lt;p&gt;§6.9 da tasvirlangan F3 faktor tahlili uchta muhim cheklovga duch keldi. Birinchidan, sonli rejim o‘zgardi: asosiy ma’lumotlar A10G da bf16 formatida olingan bo‘lsa, F3 ning beshta tarmog‘i T4 da fp16 va 8-bitli optimizator yordamida bajarildi. Bu F3 natijalarini ishning qolgan qismi bilan solishtirib bo‘lmasligini anglatadi. Ikkinchidan, to‘liq bo‘lmagan replikatsiya: to‘rtta katakdan faqat «xilma-xil korpus/yuqori LR» oxirigacha yetkazildi. Past LR kataklari replikatsiyasi 2202 qadamdan 880-qadamda to‘xtatildi. Ushbu bosqichdagi taqqoslash shuni ko‘rsatdiki, bostirish gipotezasi (Finding 1) bir qiymatli tasdiqlanmaydi: ikkinchi tor urug‘ (seed) 0.569 natijani ko‘rsatdi (xilma-xil korpus uchun 0.556), bu xulosaning barqarorligiga shubha uyg‘otadi. Uchinchidan, statistik ahamiyatlilik: o‘tkazilgan 36 ta testdan faqat to‘rttasi q=0.05 da Benjamini-Xoxberg tuzatishidan o‘tdi, ulardan ikkitasi bir xil xatti-harakatni tasvirlaydi, bu esa daliliy bazani zaiflashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/popravka-bendzhamini-hohberga.html\"&gt;Benjamini-Xoxberg tuzatishi&lt;/a&gt; — ko‘p sonli taqqoslashlar o‘tkazilganda noto‘g‘ri ijobiy natijalarni nazorat qilish va tasodifiy korrelyatsiyalarni yo‘qotish uchun ishlatiladigan statistik usul.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"muhokama-va-cheklovlar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#muhokama-va-cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama va cheklovlar&lt;/span&gt;&lt;/a&gt;Muhokama va cheklovlar&lt;/h4&gt;\n&lt;p&gt;Bizning xulosalarimiz quyidagilar bilan cheklangan: yuqori o‘qitish tezligida (learning rate) korpuslar o‘rtasida sezilarli farq yo‘q; past tezlikda «xilma-xil» tanlov «tor» tanlovdan asboblar to‘g‘riligi bo‘yicha ustun keladi. Biroq, bu ustunlik turli ishga tushirishlar (seeds) o‘rtasidagi o‘zgaruvchanlik bilan bog‘liq bo‘lishi mumkin. «Tor» tanlov va past tezlikdagi model eng zaif natijalarni ko‘rsatdi. Biz faktorlar tahlili dominant tarkibiy qismni aniqladi deb da’vo qilmaymiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Asosiy xulosa: past tezlikda «xilma-xil» tanlov samaraliroq, ammo natijalar tasodifiy o‘zgaruvchanlikka moyil.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mexanistik talqin sxemalar tahlili emas, balki istisno qilish orqali lokalizatsiyaga asoslangan. «Marshrutizatsiya, vakillik emas» gipotezasi shuni ko‘rsatadiki, retsept o‘zgarganda diqqat vaznlari o‘zgargan, ammo maqsadli qator o‘zgarmagan. Bu kirish ma’lumotlari vakilligi gipotezasini rad etadi. Shuni ta’kidlash kerakki, qatorning harakatsizligi bf16 &lt;a href=\"concepts/quantization.html\"&gt;kvantlash&lt;/a&gt; chegarasi bilan bog‘liq — yangilanishlar saqlash aniqligidan past bo‘lgan, bu esa natijani o‘qitish qarori emas, balki texnik artefaktga aylantiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kvantlash (quantization) — model vaznlarini saqlashda aniqlikni pasaytirish, bu juda kichik o‘zgarishlarning yo‘qolishiga olib kelishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metodologik-cheklovlar-va-malumotlar-aniqligi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#metodologik-cheklovlar-va-malumotlar-aniqligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodologik cheklovlar va ma’lumotlar aniqligi&lt;/span&gt;&lt;/a&gt;Metodologik cheklovlar va ma’lumotlar aniqligi&lt;/h4&gt;\n&lt;p&gt;Barcha ko‘rsatkichlar yagona ishga tushirish (single-seed) asosida olingan. GGUF/Ollama eksport yo‘li NoPE arxitekturalari uchun xavf tug‘diradi. Ma’lumotlar tarkibi (65/34/0.7/0.1) aniq audit emas, balki ekspert bahosidir. 1B modelining o‘qitish traektoriyasida «ko‘r nuqtalar» mavjud: 1-faza arxivlari yo‘qligi sababli biz o‘qitish cho‘qqisini kuzata olmaymiz, 36K bosqichidagi ma’lumotlar esa umumlashtirish emas, balki yodlab qolish (kontaminatsiya) belgilarini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ogohlantirish: ma’lumotlar tarkibi va dastlabki o‘qitish bosqichlari taxminiy hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Biz skoring tizimidagi xatolikni aniqladik va tuzatdik: dastlabki algoritm har qanday bo‘sh bo‘lmagan qiymatni to‘g‘ri deb hisoblagan, bu esa natijalarni sun’iy ravishda oshirgan. Shuningdek, 72 ta promptdan 18 tasi dublikat ekanligi aniqlandi, bu esa samarali tanlov hajmini 53 tagacha kamaytiradi. «Yumshoq o‘tkazib yuborish» (soft miss) metrikasi faqat &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m374d08t\"&gt;bash_exec&lt;/code&gt; uchun amal qiladi, shuning uchun 9-jadvaldagi qiyosiy qiyinchilik darajalari universal emas.&lt;/p&gt;\n&lt;h4 id=\"1b-modelini-qayta-tiklash-va-verifikatsiya-qilish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#1b-modelini-qayta-tiklash-va-verifikatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1B modelini qayta tiklash va verifikatsiya qilish&lt;/span&gt;&lt;/a&gt;1B modelini qayta tiklash va verifikatsiya qilish&lt;/h4&gt;\n&lt;p&gt;1B modelining asl nazorat nuqtalari (checkpoint) va uning «ota-ona» modeli bulutli infratuzilmaning yopilishi va hisob qaydnomalarining muddati tugashi sababli yo‘qolgan. Natijalarni qayta tiklash uchun mualliflar xuddi shu korpus, o‘qitish qadami va tezligidan foydalangan holda qayta ishga tushirish (reproduksiya) jarayonini amalga oshirdilar. «Ota-ona» sifatida maqsadli patologiyani namoyon etuvchi funksional analog tanlab olindi. 4 va 5-jadvallardagi tarixiy ma’lumotlar faqat ma’lumot uchun saqlangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qayta tiklangan 1B modeli reproduksiya hisoblanadi, chunki asl vaznlar yo‘qolgan, ammo u patologiyaning aynan o‘sha xususiyatlarini namoyon etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tahlil davomida to‘rtta muhim jihat aniqlandi:&lt;/p&gt;\n&lt;p&gt;a) O‘rinbosar model 3-faza bilan bit-bay-bit aynan emas. Ichki yozuvlardagi da’volarga qaramay, 201 ta til modeli tenzorini solishtirish farqlarni ko‘rsatdi. Maksimal mutlaq farq 7.8 × 10⁻³ ni tashkil etdi, har bir tenzorning kosinus o‘xshashligi esa 0.999966 dan past emas. Bu o‘zgarishlar (bir xil, hamma joyda mavjud bo‘lgan kichik siljishlar) o‘qitish jarayonidan emas, balki ma’lumotlarni eksport qilish yoki konvertatsiya qilishdagi xatoliklardan dalolat beradi.&lt;/p&gt;\n&lt;p&gt;b) Asl nazorat nuqtasini topish muvaffaqiyatsiz yakunlandi. Topilgan nomzod past unumdorlikni (faqat 1/6 to‘g‘ri javob) ko‘rsatdi va qadamlar soni (2002 ga qarshi 2202) mos kelmadi.&lt;/p&gt;\n&lt;p&gt;c) Norma o‘lchash funksiyalaridagi xatolik. Ilgari nomzod embedding jadvali normasi (630.13 ga qarshi 635.2) tufayli rad etilgan edi. Ma’lum bo‘lishicha, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4n7bsmnv\"&gt;torch.norm&lt;/code&gt; va &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cgr8qlx8\"&gt;torch.linalg.vector_norm&lt;/code&gt; funksiyalari 32,768 × 2048 o‘lchamli tenzorlarda 0.8% xatolik beradi, to‘g‘ridan-to‘g‘ri &lt;span class=\"yfm-latex\" data-content=\"%5Csqrt%7B%5Csum%20w%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; hisoblash esa 635.1627 qiymatini beradi. Bu tadqiqotdagi to‘rtinchi asbob-uskuna artefaktidir.&lt;/p&gt;\n&lt;p&gt;d) Kelib chiqishdagi noaniqlik. Loglar saqlanmagani uchun tarixiy liniya qayta tiklanganidan farq qilganini 100% inkor etib bo‘lmaydi, garchi 4, 5-jadvallar va §6.6 dagi ko‘rsatkichlarning mos kelishi buni ehtimoldan yiroq qiladi.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"tadqiqot-xulosalari-va-modellarni-diagnostika-qilish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tadqiqot-xulosalari-va-modellarni-diagnostika-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot xulosalari va modellarni diagnostika qilish&lt;/span&gt;&lt;/a&gt;Tadqiqot xulosalari va modellarni diagnostika qilish&lt;/h4&gt;\n&lt;p&gt;Biz arxitekturasi o‘xshash ikkita kichik til modelida (VectraYX-600M va VectraYX-1B) anomaliyalarni tashxislash va tuzatish jarayonini amalga oshirdik. 661,6 million parametrli 600M modeli kodga yo‘naltirilgan, 1,109 milliard parametrli 1B modeli esa ko‘p bosqichli veb-ma’lumotlar asosida o‘qitilgan. Dastlabki «yumshoq» baholash ikkala model ham deyarli bir xil natija berganini ko‘rsatdi, ammo qat’iy diagnostika 600M modeli 6 tadan 6 ta holatda to‘g‘ri JSON formatini chiqarganini, 1B modeli esa 0 ta holatda uddalaganini aniqladi. 1B modelidagi yuqori ball soxta ijobiy (false positive) natija ekanligi ma’lum bo‘ldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Diagnostika yordamida 1B modelini maxsus retsept (turli xil korpus, 5× o‘qitish tezligi, ≈3,3 GPU-soat) bilan tuzatdik va 8 tadan 8 ta holatda muvaffaqiyatga erishdik, bunda embeddinglar 97,7% ga o‘zgarmas qoldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — modelni tashqi vositalarni chaqirish kabi aniq vazifalarni bajarishga o‘rgatish uchun belgilangan ma’lumotlar bilan qo‘shimcha o‘qitish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar kichik tanlanma (n) bilan cheklangan va asl ta’mirlash artefakti yo‘qolganligi sababli, biz uning qayta tiklangan versiyasini taqdim etamiz.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metodologiya-va-xulosalar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#metodologiya-va-xulosalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodologiya va xulosalar&lt;/span&gt;&lt;/a&gt;Metodologiya va xulosalar&lt;/h4&gt;\n&lt;p&gt;Biz qayta tiklanishni tekshirish, birinchi tokenni zondlash va embeddinglar siljishini tahlil qilishni o‘z ichiga olgan diagnostika vositalarini ishlab chiqdik. Bu nosozlikni trigger tokenlarida emas, balki marshrutizatsiya mexanizmlarida ekanligini aniqlashga yordam berdi. Bizning ma’lumotlarimiz SFT tokenlari hajmi muvaffaqiyatni belgilaydi degan gipotezani rad etadi: 10⁷ tokenli retsept 6 milliard tokenli bosqichdan samaraliroq bo‘ldi. Amaliy xulosa: maqsadli chiqish formatini o‘qitish to‘plamiga kiriting va chaqiruvlarni tekshirish uchun qat’iy baholovchilardan foydalaning.&lt;/p&gt;\n&lt;h4 id=\"artefaktlar-mavjudligi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#artefaktlar-mavjudligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Artefaktlar mavjudligi&lt;/span&gt;&lt;/a&gt;Artefaktlar mavjudligi&lt;/h4&gt;\n&lt;p&gt;VectraYX-600M ning barcha nazorat nuqtalari va 1B modelini ta’mirlashning qayta tiklangan bosqichlari (jumladan, faktorial tajribaning beshta tarmog‘i) HuggingFace’dagi jsantillana repozitoriylarida ommaga ochiq.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;testlaridagi&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;noto'g'ri&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;natijalar&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Qat'iy&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;diagnostika&lt;/text&gt;&lt;tex
