        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"156\" cy=\"76\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"644\" cy=\"262\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sizning AI-agentingiz nega&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;«aqlli» bo'lib ko'rinadi:&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;benchmark tuzog'i&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Tadqiqotchilar vositalardan foydalanish (tool-use) samaradorligini baholaydigan ommabop metrikalar noto'g'ri ijobiy natijalar berishini aniqladilar. Faqat funksiya chaqiruv formatini taqlid qiladigan modellar vazifani bajara olmasa ham yuqori ball oladi. Mualliflar AI ko'nikmalarini tekshirish uchun «diagnostika narvoni» deb nomlangan qat'iy tekshiruvlar to'plamini taklif qilishadi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Kalit so'zlarga asoslangan benchmarklar format taqlidini haqiqiy funksiya bajarilishi bilan adashtiradi.&lt;/li&gt;\n&lt;li&gt;Diagnostika narvoni takrorlash tekshiruvi, birinchi token &lt;a href=\"concepts/probing.html\"&gt;zondlash&lt;/a&gt; va &lt;a href=\"concepts/embedding.html\"&gt;embedding&lt;/a&gt; drift tahlilini o'z ichiga oladi.&lt;/li&gt;\n&lt;li&gt;Model ko'nikmalarini tuzatishda ma'lumotlar sifati hisoblash resurslari hajmidan muhimroqdir.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Ishda VectraYX-600M va VectraYX-1B modellari solishtiriladi. Arxitekturalar bir xil va test ballari o'xshash (B4 ~0.66) bo'lishiga qaramay, 600M modeli haqiqatan ham vositalarni chaqirgan, 1B esa shunchaki o'xshash matn generatsiya qilgan. Tekshiruv shuni ko'rsatdiki, 1B modeli &amp;lt;|tool_call|&amp;gt; tokenini generatsiya qilish ehtimoli 10⁻⁴–10⁻⁵ darajasida bo'lib, bu ko'nikmaning yo'qligini anglatadi.&lt;/p&gt;\n&lt;p&gt;Muammoni hal qilish uchun turli xil ma'lumotlar korpusi va yuqori o'qitish tezligi yordamida maqsadli SFT (fine-tuning) qo'llanildi. Bu atigi 3.3 GPU soatini oldi, bu avvalgi urinishlardan 1000 barobar samaraliroqdir. Vaznlar tahlili shuni ko'rsatdiki, tarmoq asosiy tokenlarning embeddinglarini o'zgartirmasdan, so'rovlarni to'g'ri yo'naltirishni o'rgangan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot bitta arxitektura va aniq fine-tuning stsenariysi bilan cheklangan; ortiqcha chaqiruvlarni bostirish natijalari qo'shimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Kalit so‘zlarni qidirishga asoslangan standart benchmarklar kichik modellarga aslida mavjud bo‘lmagan qobiliyatlarni noto‘g‘ri nisbatlashi mumkin. Mualliflar buni VectraYX-600M (661,6 mln parametr, 65% kod va texnik matn) va VectraYX-1B (1,109 mlrd parametr, maxsus SFT bosqichi bilan) juftligi misolida ko‘rsatib berishdi. Ikkala model ham yumshoq metrikalar bo‘yicha deyarli bir xil natija (B4: 0,660 va 0,650) ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Asl o‘quv ma’lumotlarini so‘zma-so‘z takrorlash testi shuni ko‘rsatdiki, 600M modeli 6 ta misoldan 6 tasida to‘g‘ri chaqiruvlarni amalga oshiradi, 1B esa barcha urinishlarda muvaffaqiyatsizlikka uchraydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Birinchi token probi 1B modelida &amp;lt;/tool_call/&amp;gt; tokeni uchun a priori ehtimollik (10⁻⁴–10⁻⁵) yo‘qligini aniqladi; bu veb-ma’lumotlar bilan ishlash bosqichida avvalgi xotira o‘chib ketganini anglatadi. Maqsadli SFT (2202 &lt;a href=\"concepts/step.html\"&gt;qadam&lt;/a&gt;, ~3,3 GPU-soat) yordamida 1B modeli qayta tiklandi. Natijada, 269 qatorli korpusda to‘g‘ri chaqiruvlar ulushi 0,100 dan 0,959 gacha ko‘tarildi. Yangi ma’lumotlarda tuzatilgan 1B modeli 0,536 natijani qayd etdi (600M uchun 0,428, p=0,004).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (&lt;a href=\"concepts/sft.html\"&gt;Supervised Fine-Tuning&lt;/a&gt;) — bu modelni muayyan vazifalar, masalan, tashqi vositalarni chaqirish uchun maxsus belgilangan ma’lumotlar yordamida qayta o‘qitish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Embedding-drift tekshiruvi shuni ko‘rsatdiki, bf16 jadvalining 97,7% qismi o‘zgarmagan, ya’ni o‘zgarishlar tarmoqning ichki qismida sodir bo‘lgan. Ikkala model ham ortiqcha faollashishga moyil: vositalar talab qilinmaydigan so‘rovlarda ular 91% (600M) va 83% (1B) hollarda noto‘g‘ri chaqiruvlarni amalga oshiradi. Mualliflar ushbu diagnostika usullarini kichik modellarning imkoniyatlarini tasdiqlash uchun majburiy filtr sifatida qo‘llashni taklif qilishadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M modeli bo‘yicha natijalar o‘quv jarayonining 64% qismida to‘xtatilgan holatda olingan, bu esa to‘liq bo‘lmagan tajribani anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"asboblar-integratsiyasi-va-metrikalar-nomuvofiqligi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#asboblar-integratsiyasi-va-metrikalar-nomuvofiqligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asboblar integratsiyasi va metrikalar nomuvofiqligi&lt;/span&gt;&lt;/a&gt;Asboblar integratsiyasi va metrikalar nomuvofiqligi&lt;/h4&gt;\n&lt;p&gt;Til modelining MCP (Model Context Protocol) serverlari bilan ishlash uchun tuzilgan JSON-so‘rovlarni yaratish qobiliyati kichik oflayn modellarni kiberxavfsizlik bo‘yicha samarali yordamchilarga aylantiradi. VectraYX modellari seriyasi (42 mln dan 1,1 mlrd parametrgacha) llama.cpp orqali izolyatsiya qilingan (air-gapped) muhitlarda ishlash uchun mo‘ljallangan. Ushbu maqolada biz avtomatlashtirilgan testlar va modellarning real samaradorligi o‘rtasidagi jiddiy tafovutni tahlil qilamiz.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Avtomatik testlar 600M va 1B modellari uchun deyarli bir xil natijalarni (0,660 va 0,650) ko‘rsatdi, ammo amalda 1B modeli 600M dan farqli o‘laroq JSON-tuzilmalarni yarata olmadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikkita modelni solishtirish: VectraYX-600M (661,6 mln parametr) va VectraYX-1B (1,109 mlrd parametr) paradoksal holatni yuzaga keltirdi: dekoder arxitekturasi va 32 minglik tokenizator bir xil bo‘lishiga qaramay, ularning benchmark ko‘rsatkichlari deyarli teng (B4 = 0,660 va 0,650). Biroq, sifatli sinovlarda 600M modeli to‘g‘ri bash_exec buyruqlarini yarata oldi, 1B modeli esa JSON formatini umuman shakllantirmay, shunchaki uzuq-yuluq matn chiqardi.&lt;/p&gt;\n&lt;h4 id=\"olchash-usullari-va-validatsiya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#olchash-usullari-va-validatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O‘lchash usullari va validatsiya&lt;/span&gt;&lt;/a&gt;O‘lchash usullari va validatsiya&lt;/h4&gt;\n&lt;p&gt;Diagnostika uchun biz so‘zma-so‘z takrorlashni tekshirish usulini (§5.3) qo‘lladik. Biz SFT o‘quv korpusidan MCP vositalari tasvirlangan tizimli preambularni o‘z ichiga olgan namunalardan foydalandik. Modelga promptning yarmi berildi va undan o‘quv ma’lumotlarini shunchaki ko‘chirmasdan (yodlab qolishni istisno qilish uchun), mantiqiy jihatdan to‘g‘ri bo‘lgan JSON-so‘rovni yaratish talab qilindi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;So‘zma-so‘z takrorlashni tekshirish usuli modelning tuzilmani haqiqatdan tushunishini yodlab qolgan javoblaridan ajratib olishga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar keskin farq qildi: 600M modeli 6 ta urinishdan 6 tasida muvaffaqiyat qozondi, 1B esa 4 ta urinishdan 0 tasida o‘tdi. Ma’lum bo‘lishicha, avtomatlashtirilgan benchmark 1B modeliga vositalarni matnda tilga olganligi uchun ball bergan, aslida esa ularni chaqirmagan. Bu baholash validatsiyasidagi xatolik bo‘lib, metrika noto‘g‘ri ijobiy (false positive) natijalarga moyil ekanligini ko‘rsatadi.&lt;/p&gt;\n&lt;h4 id=\"diagnostika-va-tuzatish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#diagnostika-va-tuzatish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diagnostika va tuzatish&lt;/span&gt;&lt;/a&gt;Diagnostika va tuzatish&lt;/h4&gt;\n&lt;p&gt;Birlamchi tahlil (birinchi token zondlash) shuni ko'rsatdiki, 1 mlrd parametrli (1B) model asbobni chaqirishni boshlay olmagan, chunki a priori ehtimollik yetishmagan: kerakli pozitsiyada model &amp;lt;/tool_call/&amp;gt; tokeniga juda past ehtimollik (10⁻⁴–10⁻⁵) bergan, 600M modeli esa uni to'g'ri generatsiya qilgan. Bu shunchaki dekodlash xatosi emas, balki modelning formatni butunlay e'tiborsiz qoldirishi edi, garchi 6 mlrd tokenli maxsus SFT (SFT) o'qitish bosqichi o'tkazilgan bo'lsa ham.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1B modelini tuzatish uchun ma'lumotlar hajmini oshirish emas, balki strategiyani o'zgartirish kerak edi: turli xil ma'lumotlar aralashmasi va yuqori o'qitish tezligi (LR) bilan maqsadli o'qitish 2202 qadamda muvaffaqiyatga olib keldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tuzatish uchun yangi metodika ishlab chiqildi: turli xil ma'lumotlar to'plami (OASST dialoglari, asboblar korpusi, mantiqiy zanjirlar), embeddinglarni muzlatishdan chiqarish va LRni 5 barobar oshirish. O'qitish 2202 qadam va bitta GPUda taxminan 3,3 soat davom etdi. Natijada model asboblar chaqiruvini 0,996–0,998 ehtimollik bilan takrorlay boshladi. 8 ta yangi promptda model 7 ta holatda asboblarni xatosiz tanladi va 8-holatda chaqiruvdan tiyildi. Samaradorlik 238 ta promptda tasdiqlandi: 1B modeli noma'lum obyektlarda 0,536 aniqlik ko'rsatdi (600M modelida 0,428).&lt;/p&gt;\n&lt;h4 id=\"ozgarishlarni-lokalizatsiya-qilish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#ozgarishlarni-lokalizatsiya-qilish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O'zgarishlarni lokalizatsiya qilish&lt;/span&gt;&lt;/a&gt;O'zgarishlarni lokalizatsiya qilish&lt;/h4&gt;\n&lt;p&gt;Embeddinglar dreyfini tekshirish shuni ko'rsatdiki, &amp;lt;/tool_call/&amp;gt; tokeni vektori deyarli o'zgarmagan (kosinus o'xshashligi 0,999996). Bu «o'lik embeddinglar» gipotezasini rad etadi: tokenning ma'nosi boshidanoq to'g'ri bo'lgan, tuzatish esa tarmoqni kerakli kontekstda ushbu tokenga yo'naltirishga o'rgatishdan iborat bo'lgan. O'lchovlar shuni ko'rsatdiki, embeddinglar jadvalining 97,7% qismi o'zgarishsiz qolgan, chunki Adam optimizatori qadamlari bf16 aniqligidan kichikroq bo'lgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/dreyf-embeddingov.html\"&gt;Embeddinglar dreyfi&lt;/a&gt;» — bu modeldagi so'z yoki tokenlarni ifodalovchi sonli vektorlarning o'zgarishi. Dreyfning yo'qligi shuni anglatadiki, model tokenning ma'nosini qayta o'qimagan, balki undan foydalanish logikasini o'zgartirgan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tezis\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tezis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tezis&lt;/span&gt;&lt;/a&gt;Tezis&lt;/h4&gt;\n&lt;p&gt;Muvaffaqiyatning asosiy omili — o'qitish to'plamining tarkibi (bootstrap composition). Asosan kod (65%) asosida o'qitilgan 600M modeli strukturaviy chiqish qobiliyatini «standart» tarzda egallagan. Veb-ma'lumotlarda o'qitilgan 1B modeli esa bu qobiliyatni yo'qotgan va uni faqat maqsadli aralashuv orqali tiklash mumkin bo'lgan. Bu shuni isbotlaydiki, ma'lumotlar tarkibi qobiliyatning «tekin» (avtomatik paydo bo'lishi) yoki murakkab muhandislikni talab qilishini belgilaydi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"yumshoq-test-modellar-ozaro-almashinuvchan-korinadi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#yumshoq-test-modellar-ozaro-almashinuvchan-korinadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yumshoq test: modellar o'zaro almashinuvchan ko'rinadi&lt;/span&gt;&lt;/a&gt;Yumshoq test: modellar o'zaro almashinuvchan ko'rinadi&lt;/h4&gt;\n&lt;p&gt;\"Yumshoq\" test doirasida (4-jadval) 600M model 154K qadamda 6 ta sinovdan 6 tasini muvaffaqiyatli o'tkazdi. 1B modeli phase-3 (20K qadam) va phase-4b (SFT, 400 qadam) bosqichlarida vositani chaqirish tokenini generatsiya qilish ehtimoli juda past (10⁻⁴–10⁻⁵) ekanligini ko'rsatdi va testlardan o'ta olmadi. Biroq, \"ta'mirlash\"dan so'ng (2202-qadam), 1B modeli 0.996–0.998 aniqlik bilan 4 ta sinovdan 4 tasida to'liq moslikni ko'rsatdi. Qobiliyatlarni baholash uchun §6.5 va §6.8 da tasvirlangan 238 ta promptdan iborat kengaytirilgan batareya (n=269) ishlatiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M modeli barqaror ishlaydi, 1B modeli esa tuzatishgacha o'qitilganiga qaramay, vositalarni chaqirishga qodir emas.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tuzatishdan-oldingi-qatiy-diagnostika-modellar-kesishmaydi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tuzatishdan-oldingi-qatiy-diagnostika-modellar-kesishmaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tuzatishdan oldingi qat'iy diagnostika: modellar kesishmaydi&lt;/span&gt;&lt;/a&gt;Tuzatishdan oldingi qat'iy diagnostika: modellar kesishmaydi&lt;/h4&gt;\n&lt;p&gt;Qat'iy testda 600M modeli sintaktik jihatdan to'g'ri JSON-obyektlarni generatsiya qiladi. U shunchaki o'quv namunalarini ko'chirmaydi, balki kontekstga qarab buyruqlarni moslashtiradi (masalan, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-636bijd0\"&gt;tail&lt;/code&gt; yoki &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2kjka2xk\"&gt;grep&lt;/code&gt; parametrlarini o'zgartiradi). Bu model shunchaki javoblarni yodlamay, balki o'zaro ta'sir mantiqini o'zlashtirganini isbotlaydi.&lt;/p&gt;\n&lt;p&gt;Aksincha, 1B modeli tuzatishdan oldin vositani chaqirish blokini umuman ochmaydi. Buning o'rniga u bog'liqsiz matn generatsiya qiladi. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqdi65zk\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; tokenining paydo bo'lish ehtimoli 10⁻⁴–10⁻⁵ ni tashkil etadi, bu 6 milliard tokendan iborat maxsus o'qitishga qaramay, format haqida \"&lt;a href=\"concepts/apriornoe-znanie.html\"&gt;aprior bilim&lt;/a&gt;\" deyarli yo'qligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Aprior bilim — bu modelning muayyan kontekstni ko'rishidan oldin ma'lum bir ma'lumotlar tuzilmasini generatsiya qilishga bo'lgan \"moyilligi\".&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Token generatsiya qilish ehtimolining pastligi shuni anglatadiki, model vositani chaqirishga hatto \"urinmaydi\", shunchaki oddiy chat uslubida matnni davom ettiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"diagnostikaga-asoslangan-1b-modelini-tamirlash\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#diagnostikaga-asoslangan-1b-modelini-tamirlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Diagnostikaga asoslangan 1B modelini ta'mirlash&lt;/span&gt;&lt;/a&gt;Diagnostikaga asoslangan 1B modelini ta'mirlash&lt;/h4&gt;\n&lt;p&gt;Diagnostika muammo shovqinli emas, balki aprior bilimning yo'qligida ekanligini ko'rsatdi. Shuning uchun, tor kontekstda qayta o'qitish samarasiz. Tarmoq o'rtasidagi vaznlarni o'zgartirish uchun turli xil kontekstlar va yetarli o'qitish tezligi talab qilinadi. 5-jadvalda ta'mirlashning uchta urinishi (A, B, C) umumlashtirilgan.&lt;/p&gt;\n&lt;p&gt;B urinishi test muhitidagi xatolar (tizim preambulasining yo'qligi va maxsus belgilarni o'chirish) tufayli yaroqsiz deb topildi, shuning uchun uning \"0/8\" natijalari hisobga olinmaydi. C urinishi asl chekpoint yo'qolganidan keyin qayta o'tkazildi: CPUda yangi model xuddi shu patologiyaga ega ekanligi tasdiqlandi (chaqirish ehtimoli 2 \times 10⁻⁷–2 \times 10⁻³), bu esa ta'mirlash samaradorligini to'g'ri baholash imkonini berdi.&lt;/p&gt;\n&lt;h4 id=\"qayta-tiklangan-modelning-natijalari-va-diagnostikasi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#qayta-tiklangan-modelning-natijalari-va-diagnostikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayta tiklangan modelning natijalari va diagnostikasi&lt;/span&gt;&lt;/a&gt;Qayta tiklangan modelning natijalari va diagnostikasi&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘limda biz 1B modelining qayta tiklangan versiyasi uchun qat’iy diagnostika ko‘rsatkichlarini taqdim etamiz. Asosiy e’tibor «C retsepti»ga qaratilgan bo‘lib, u shunchaki ma’lumotlarni yodlashdan tashqariga chiqadigan umumlashtirish qobiliyatini namoyish etdi. Tekshirish uchun biz o‘quv korpusida mavjud bo‘lmagan sakkizta yangi promptdan foydalandik, ulardan yettitasi beshta vositadan birini tanlashni talab qilardi. Qayta tiklangan model talab qilingan barcha holatlarda to‘g‘ri vosita chaqiruvlarini shakllantirdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«C retsepti» bo‘yicha qayta tiklangan model yangi promptlar to‘plamida 100% (8/8) aniqlik ko‘rsatib, shunchaki yodlash emas, balki umumlashtirish qobiliyatini tasdiqladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5-jadvalda turli o‘qitish konfiguratsiyalari bo‘yicha qiyosiy ma’lumotlar keltirilgan. A varianti (3-faza, ~6 mlrd token) test to‘plamida nol natija ko‘rsatdi. B varianti (tor qayta sozlash, 486 qadam) yo‘qotish funksiyasi 0,05–0,4 gacha tushganiga qaramay, tokenlarni qayta ishlashdagi xatolar tufayli validatsiyadan o‘ta olmadi. «C retsepti» (2202 qadam, bitta GPUda ~3,3 soat) o‘quv namunalarini mukammal takrorlashni (4/4) Pfirst = 0,996–0,998 birinchi token ehtimolligi bilan ta’minladi. Tarixiy ishga tushirish (C*) ham xuddi shunday natijalarni ko‘rsatdi, bu metodikaning ishonchliligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/p-first.html\"&gt;P-first&lt;/a&gt; (birinchi token ehtimolligi) — modelning javobni shakllantirishdagi ishonch darajasi; 1 ga yaqin qiymatlar yuqori determinizmni bildiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Vositalarni chaqirish bo‘yicha aniq misollar (masalan, CVE-2024-3094 ni qidirish yoki &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5lfkaiha\"&gt;df -h&lt;/code&gt; va &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v43w04gw\"&gt;ps aux&lt;/code&gt; buyruqlarini bajarish) shuni ko‘rsatadiki, model 2801 ta namunadan iborat o‘quv korpusida uchramagan obyektlarni to‘g‘ri ajratib oladi. Shunga qaramay, model ko‘nikmalarning o‘ziga xosligini namoyish etadi: fishing haqida umumiy savol berilganda, u vositani chaqirishdan to‘g‘ri tiyildi, lekin mazmunli matnli javob bera olmadi, bu esa umumiy ko‘rsatmalarga amal qilishdagi muammolar saqlanib qolganini bildiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«C retsepti»ning muvaffaqiyati kompleks natijadir; mavjud ma’lumotlar korpus xilma-xilligi, o‘qitish tezligi yoki boshlang‘ich nuqtaning hissasini alohida ajratib ko‘rsatishga imkon bermaydi, biroq ma’lumotlar hajmining o‘zi hal qiluvchi omil emasligi isbotlangan.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tuzatishni-lokalizatsiya-qilish-vakillik-emas,-marshrutlash\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tuzatishni-lokalizatsiya-qilish-vakillik-emas,-marshrutlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tuzatishni lokalizatsiya qilish: vakillik emas, marshrutlash&lt;/span&gt;&lt;/a&gt;Tuzatishni lokalizatsiya qilish: vakillik emas, marshrutlash&lt;/h4&gt;\n&lt;p&gt;1B modelidagi nosozlik va embeddinglarni «muzlatishdan chiqarish» muvaffaqiyati &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rnknpgex\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; tokenining noto‘g‘ri vakilligi bilan bog‘liq degan gipoteza tasdiqlanmadi. Ushbu arxitekturada kirish va chiqish embeddinglari bog‘langan (tie_embeddings=true), ya’ni embeddinglar matritsasi ayni vaqtda dekodlash matritsasi (unembedding matrix) vazifasini ham bajaradi. Embeddinglar siljishini (drift) tekshirish shuni ko‘rsatdiki, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fd40onh\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; (ID 8) qatori deyarli o‘zgarmagan: kosinus o‘xshashligi 0,99999583, norma o‘zgarishi esa atigi +1,5×10⁻⁴% ni tashkil etgan. Bu ko‘rsatkich 20 ta tasodifiy tokenning o‘rtacha o‘zgarishidan ham pastroq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vdg1zodr\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; tokenining embeddingi deyarli o‘zgarmadi, bu uning o‘qitish orqali «tuzatilishi» kerakligi haqidagi gipotezani rad etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Embeddinglar jadvalini (32 768 × 2048) tahlil qilish 67,1 mln elementning 97,7% qismi bit bo‘yicha bir xil ekanligini ko‘rsatdi. Yangilanishlarning «siyrakligi» &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8i6hb1gi\"&gt;bf16&lt;/code&gt; saqlash formati bilan bog‘liq. Adam o‘qitish qadami (LR = 1×10⁻⁵) saqlash aniqligi chegarasidan (ulp) kichik bo‘lgani uchun, agar o‘zgarishlar juda kichik qiymatlar sohasiga (taqsimot dumi) tushmasa, ular yaxlitlashda tashlab yuboriladi. Demak, embeddinglar gradientlar yo‘qligi uchun emas, balki saqlash formati aniqligi cheklovlari tufayli o‘zgarmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;bf16 (bfloat16) formati 8 bitli mantissadan foydalanadi, bu esa o‘qitish jarayonida vazn o‘zgarishlarini yozib olish aniqligini cheklaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Ijobiy nazorat» (20–21-qatlamlardagi diqqat proyeksiyalari) bilan solishtirish shuni ko‘rsatdiki, tarmoq boshqacha o‘qigan. Embeddinglardagi maksimal mutlaq siljishlar (5,98×10⁻³) diqqat qatlamlaridagi o‘zgarishlar (3,40–4,31×10⁻³) bilan taqqoslanadigan bo‘lsa-da, kosinus masofasi va o‘zgargan elementlar ulushi (2,3% ga nisbatan 6–15%) bo‘yicha diqqat qatlamlari sezilarli darajada ko‘proq o‘zgargan. Xulosa: 1B modelidagi muammo tokenning to‘g‘ri vakilligi yo‘qligida emas, balki yashirin holatlarni ushbu vakillikka yo‘naltiradigan samarali marshrutlash siyosatining yo‘qligida edi. Tuzatish tarmoqni kerakli kontekstlarda ma’lumotlarni mavjud «to‘g‘ri» vektorga yo‘naltirishga o‘rgatdi.&lt;/p&gt;\n&lt;h4 id=\"ablatsiya-tahlili-va-embeddinglar-dinamikasi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#ablatsiya-tahlili-va-embeddinglar-dinamikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ablatsiya tahlili va embeddinglar dinamikasi&lt;/span&gt;&lt;/a&gt;Ablatsiya tahlili va embeddinglar dinamikasi&lt;/h4&gt;\n&lt;p&gt;Mualliflar C retseptida embeddinglarni muzdan tushirish (unfreezing) zarurligi haqidagi gipotezani tekshirdilar. Eksperimentni majburiy muzlatish bilan qayta o‘tkazish o‘rniga, tadqiqotchilar allaqachon o‘qitilgan model vaznlarini tahlil qilishdi. Ma’lum bo‘lishicha, nominal ravishda «muzdan tushirilgan» deb hisoblangan embeddinglar amalda statik bo‘lib qolgan: 2202 qadamdan so‘ng jadval qiymatlarining 97,7% bit darajasida bir xil bo‘lib chiqqan. &lt;a href=\"concepts/norma-frobeniusa.html\"&gt;Frobenius normasi&lt;/a&gt; nisbatan 4 × 10⁻⁷ ga o‘zgargan, har bir qadamdagi yangilanishlar esa vaznlar saqlanadigan aniqlikdan bir daraja past bo‘lgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;C retseptidagi embeddinglar amalda yangilanmagan, bu ularning ushbu parametrlar ostida o‘qitish jarayonidagi passiv rolini isbotlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu kuzatuv «muzdan tushirilgan» va «muzlatilgan» embeddinglar aslida bir xil eksperiment ekanligi haqidagi bashoratni tasdiqlaydi. Komponent o‘zgarishlarda qatnashmaganligi sababli, uning C retsepti muvaffaqiyatiga qo‘shgan hissasi istisno qilinadi. Bu embeddinglar taqdimotining model ishlashi uchun o‘ta muhimligi haqidagi gipotezaga qarshi kuchli dalil bo‘lib xizmat qiladi. Biroq, mualliflar umumlashtirishdan ogohlantiradilar: yuqoriroq o‘qitish tezligida (learning rate) yangilanishlar yaxlitlash xatosidan chiqib ketishi va fp32 optimizator holatida to‘planishi mumkin edi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Frobenius normasi — bu matritsaning «hajmi»ni o‘lchash usuli bo‘lib, o‘qitish jarayonida model vaznlari qanchalik o‘zgarganini baholashga imkon beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar faqat joriy retsept bilan cheklangan; boshqa sozlamalar yoki uzoqroq o‘qitishda embeddinglar xulq-atvori o‘zgarishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"va-u-ochirilganda\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#va-u-ochirilganda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Va u o'chirilganda&lt;/span&gt;&lt;/a&gt;Va u o'chirilganda&lt;/h4&gt;\n&lt;p&gt;Yakuniy nuqtalarni solishtirish o'rniga, biz 600M (15 ta nuqta, 1K–154K qadamlar) va 1B (10 ta 3-faza nazorat nuqtalari va 2-faza namunasi) modellarining o'quv jarayonini tahlil qildik. Baholash uchun &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-701qzokq\"&gt;tool_sft_mini_v1.jsonl&lt;/code&gt; dan oltita misol ishlatildi. Biz ikkita zondlash usulini qo'lladik: Plit ( &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-azexubhc\"&gt;&amp;lt;/assistant/&amp;gt;&lt;/code&gt; dan keyin darhol &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6jjdyg63\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; tokeni ehtimoli) va &lt;a href=\"concepts/pskip.html\"&gt;Pskip&lt;/a&gt; (to'rtta bo'sh joygacha bo'lgan belgilarni o'tkazib yuborgandan keyin o'sha token ehtimoli). 600M modeli ko'pincha yangi qator belgisini qo'shishi sababli, bu ikki ko'rsatkich o'rtasidagi farq juda muhim. 6-jadvalda 600M uchun ma'lumotlar keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M modeli kontekstga qarab emas, balki shartsiz ravishda vositalarni chaqirishga moyil: hatto vositalardan foydalanish taqiqlangan misollarda ham chaqiruv ehtimoli yuqori bo'lib qolmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pskip — bu modelning vositani chaqirish ehtimolini baholash uchun ishlatiladigan metrika bo'lib, u zondlash aniqligini buzishi mumkin bo'lgan tasodifiy bo'sh joylar yoki qator o'tishlarini hisobga olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M bo'yicha xulosalar bitta taqiqlovchi misolga asoslangan, bu tadqiqotning cheklovidir, ammo 15 ta nazorat nuqtasidagi natijalarning barqarorligi kontekstli selektivlikning yo'qligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;600M modeli 30K qadamga kelib Pskip &amp;gt; 0.999 to'yinganlik darajasiga yetdi. Biroq, u chaqiruvlarni to'xtatishni o'rganmadi: tizim «vositani chaqirma» deb ko'rsatma bergan misolda ham model barcha 15 ta nazorat nuqtasida chaqiruvni amalga oshirdi. Bu 600M «shartsiz bazaviy chastota»dan foydalanishini, ongli tanlov qilmasligini ko'rsatadi. 1B modeli (7-jadval) uchun vaziyat boshqacha: biz ko'nikmaning faol «o'chirilishi» jarayonini kuzatamiz. 2-fazaning 36K qadamida Pskip 0.432 ni tashkil etdi, ammo 2000 qadamdan keyin u 3.0 × 10⁻³ gacha tushdi va 48K qadamga kelib 5.9 × 10⁻⁷ minimal darajaga yetdi, bu daraja faza oxirigacha saqlanib qoldi.&lt;/p&gt;\n&lt;h4 id=\"2-faza-davomida-ehtimollik-ustuvorligining-pasayishi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#2-faza-davomida-ehtimollik-ustuvorligining-pasayishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2-faza davomida ehtimollik ustuvorligining pasayishi&lt;/span&gt;&lt;/a&gt;2-faza davomida ehtimollik ustuvorligining pasayishi&lt;/h4&gt;\n&lt;p&gt;1B modeli o‘qitilishi jarayonida ehtimollik ustuvorligi (probe) 12 000 qadam (taxminan 3,1 mlrd token) ichida 5,9 tartibda pasayishi kuzatiladi. Bu jarayon 2-fazaning birinchi blokida sodir bo‘ladi, bunda ma’lumotlar tarkibi 90% ingliz/ispan tillari va Vikipediya, 5% esa koddan iborat. Mualliflar 38K, 40K, 44K va 48K nazorat nuqtalarini tekshirib, bu pasayish tasodifiy emas, balki monoton ekanligini tasdiqlashdi. Generatsiya qobiliyati (instrumentlarni chaqirish) ehtimollik massasidan tezroq yo‘qoladi: 38K qadamda model trigger tokenda 3 × 10⁻³ qiymatni saqlab qolsa-da, 5 ta urinishdan 0 tasida to‘g‘ri chaqiruv amalga oshiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Generatsiya qobiliyati ehtimollik massasi tugashidan 10 000 qadam oldin yo‘qoladi, bu esa zondlash bilan birga qat’iy generatsiya tekshiruvini o‘tkazish zarurligini ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;36K qadamdagi ko‘rsatkich umumlashtirish qobiliyatining buzilishi emas, balki 1-fazadan yodlab qolingan ma’lumotlarning «yuvilib ketishi» hisoblanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"3-faza-uzilish-va-tiklanmaslik\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#3-faza-uzilish-va-tiklanmaslik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3-faza: uzilish va tiklanmaslik&lt;/span&gt;&lt;/a&gt;3-faza: uzilish va tiklanmaslik&lt;/h4&gt;\n&lt;p&gt;3-fazada &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7BP%7D_%7Bskip%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; dinamikasi monoton emas: ko‘rsatkich 4K qadamdagi 3,7 × 10⁻³ dan 6K qadamda 1,4 × 10⁻² cho‘qqisiga chiqadi, so‘ngra 10K qadamgacha 24 barobar pasayadi. Bu «uzilish» &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-azh5bcn5\"&gt;tool_sft&lt;/code&gt; ulushining 0,20 dan 0,16 gacha kamaytirilishi bilan bog‘liq. 10K qadamdan keyin aralashma tiklangan bo‘lsa-da, modelning tarkibiy ustuvorligi tiklanmadi va 3-fazani 8,8 × 10⁻⁵ darajasida yakunladi. Generatsiya esa umuman qaytmadi (0/5 muvaffaqiyatli chaqiruv).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/kontekstnaya-chuvstvitelnost.html\"&gt;Kontekst sezgirligi&lt;/a&gt; — modelning atrof-muhitga qarab instrumentni ishlatish yoki ishlatmaslikni ajrata olish qobiliyati.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"harness-va-probe-ortasidagi-dissotsiatsiya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#harness-va-probe-ortasidagi-dissotsiatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Harness va probe o‘rtasidagi dissotsiatsiya&lt;/span&gt;&lt;/a&gt;Harness va probe o‘rtasidagi dissotsiatsiya&lt;/h4&gt;\n&lt;p&gt;Oltita nazorat nuqtasi B4 metriki va zond o‘rtasidagi ziddiyatni ko‘rsatadi. 14K qadamda B4 tarixiy maksimumga (0,085) yetgan bo‘lsa, zond o‘zining eng past qiymatini (5,7 × 10⁻⁵) ko‘rsatdi. 2000 qadamdan keyin B4 minimumga tushdi, zond esa 4,6 barobar o‘sdi. Bu shuni anglatadiki, B4 metriki modelning instrumentlardan foydalanish qobiliyatini to‘g‘ri o‘lchamaydi, chunki u model haqiqiy chaqiruvni amalga oshira olmaydigan holatda ham yuqori baho berishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"oldindan-royxatdan-otgan-gipoteza-boyicha-xulosa\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#oldindan-royxatdan-otgan-gipoteza-boyicha-xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Oldindan ro‘yxatdan o‘tgan gipoteza bo‘yicha xulosa&lt;/span&gt;&lt;/a&gt;Oldindan ro‘yxatdan o‘tgan gipoteza bo‘yicha xulosa&lt;/h4&gt;\n&lt;p&gt;1B modelining strukturaviy perpleksiyasi 2-faza (veb-ma’lumotlar asosida o‘qitish) davomida turg‘unlashishi yoki yomonlashishi hamda 3-fazada tiklanmasligi haqidagi dastlabki gipoteza to‘liq tasdiqlandi. 2-fazaning ta’siri kutilganidan ham kuchliroq bo‘lib chiqdi: turg‘unlashish o‘rniga, eng ko‘p prozaik bloklarda oldindan mavjud bo‘lgan bilimlar deyarli olti darajaga pasayib ketdi. 3-faza hech narsani tiklamadi: kuzatilgan dastlabki o‘sish qobiliyatlarning rivojlanishi emas, balki bazaviy ehtimollik natijasidir. O‘quv dasturi doirasidagi yagona aniq o‘zgarish samaradorlikning pasayishiga olib keldi. Natijada, hatto eng yaxshi instrumentlardan foydalanish ko‘rsatkichiga ega bo‘lgan bosqichda ham, aprior ehtimollik 3-fazadagi eng yuqori cho‘qqidan ikki daraja pastligicha qolmoqda.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gipoteza tasdiqlandi: 2-faza o‘qitish jarayoni aprior bilimlarning 6 darajaga degradatsiyasiga olib keldi, 3-faza esa bu pasayishni qoplay olmadi va ko‘rsatkichlar cho‘qqi qiymatlardan pastligicha qoldi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;600M modeliga kelsak, SFT ma’lumotlari to‘planishi bilan P(&amp;lt;/tool_call/&amp;gt;) instrument chaqiruvi ehtimoli oshishi haqidagi gipoteza faqat yakuniy nuqtada rasman tasdiqlandi. Tahlil shuni ko‘rsatadiki, o‘sish birinchi arxivlangan nazorat nuqtasigacha sodir bo‘lgan, shuning uchun biz yangi qobiliyatlarning paydo bo‘lishini emas, balki to‘yinish effektini kuzatmoqdamiz.&lt;/p&gt;\n&lt;p&gt;O‘qitish dinamikasi bo‘yicha ma’lumotlar 1-jadvalda keltirilgan. B4 ustuni 3-faza nazorat nuqtalarini kuzatish ko‘rsatkichlarini aks ettiradi. Ushbu jadvaldagi B4 qiymatlari baholash usullaridagi (harness) farqlar tufayli 3-jadvalda keltirilganlardan taxminan 8 barobar farq qiladi. Biz ushbu ma’lumotlardan faqat seriya ichidagi ichki taqqoslash uchun foydalanamiz, mutlaq sifat ko‘rsatkichi sifatida emas.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/perpleksiya.html\"&gt;Perpleksiya&lt;/a&gt; — modelning keyingi tokenni qanchalik aniq bashorat qila olishini baholovchi metrika; qiymat qanchalik past bo‘lsa, model o‘z bashoratlarida shunchalik «ishonchli» bo‘ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"yangi-entitilar-va-registrlar-ostida-umumlashtirish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#yangi-entitilar-va-registrlar-ostida-umumlashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yangi entitilar va registrlar ostida umumlashtirish&lt;/span&gt;&lt;/a&gt;Yangi entitilar va registrlar ostida umumlashtirish&lt;/h4&gt;\n&lt;p&gt;Ushbu bo‘limda kichik namunalardagi (n=6 va n=8) dastlabki baholashlarni almashtiruvchi kengaytirilgan test natijalari keltirilgan. Tadqiqot uchta nazorat nuqtasida o‘tkazildi: 600M modeli (154K qadam), tuzatishdan oldingi 1B modeli va tuzatilgandan keyingi 1B modeli (§6.5 ga muvofiq). Oxirgi ikkitasi «ota-bola» juftligini tashkil qiladi, bu esa juftlashtirilgan statistik testdan foydalanishga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tuzatilgan 1B modeli o‘quv ma’lumotlarini yuqori aniqlik bilan takrorlaydi (0.988), shu bilan birga yangi entitilarda bilimlarni muvaffaqiyatli umumlashtiradi va ma’lumotlarni ajratib olish vazifalarida 600M modelidan ustun keladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Korpusning 269 ta dublikatlardan tozalangan qatorlarida 3-darajali diagnostikani takrorlashda 600M modeli 0.926 holatda to‘g‘ri chaqiruvni shakllantiradi, tuzatishdan oldingi 1B modeli — 0.100, tuzatilgan 1B esa — 0.959 holatda. Tuzatilgan 1B modeli o‘quv ma’lumotlarini so‘zma-so‘z takrorlashga moyil (0.988), 600M esa kontekstual jihatdan o‘rinli, ammo yangi argumentlarni yaratadi. Umumlashtirish qobiliyatini baholash uchun korpusda bo‘lmagan entitilar (yangi IP-manzillar, CVE-2025-* identifikatorlari, tasodifiy heshlar, o‘ylab topilgan domenlar) bilan 238 ta promptlar to‘plami yaratildi. Baholash besh mezon bo‘yicha amalga oshirildi: chaqiruv to‘g‘risida qaror, sintaktik to‘g‘rilik, vositani tanlash, argumentlar strukturasi va entiti mosligi (8-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Maknemar testi bir xil ma’lumotlar ustida ikkita modelni solishtirish uchun ishlatiladi, bu qaysi model muayyan vazifalarni yaxshiroq bajarishini aniqlashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;8-jadvalga ko‘ra, tuzatilgan 1B modeli testlarning 0.536 qismini, 600M esa 0.428 qismini muvaffaqiyatli yakunlaydi (p=0.0039). 600M vositalarni tanlash (0.776 ga qarshi 0.717) va argumentlarni tuzishda (0.855 ga qarshi 0.819) yaxshiroq bo‘lsa-da, tuzatilgan 1B ilgari ko‘rilmagan entitilarni ajratib olishda sezilarli darajada samaraliroqdir (0.667 ga qarshi 0.560).&lt;/p&gt;\n&lt;h4 id=\"sarlavhalar-tahlili-va-modellarning-barqarorligi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#sarlavhalar-tahlili-va-modellarning-barqarorligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sarlavhalar tahlili va modellarning barqarorligi&lt;/span&gt;&lt;/a&gt;Sarlavhalar tahlili va modellarning barqarorligi&lt;/h4&gt;\n&lt;p&gt;VectraYX-600M va tuzatilgan 1B (repaired 1B) modellari so‘rov turiga qarab vositalarni chaqirish qobiliyati bo‘yicha sinovdan o‘tkazildi. 9-jadvalda shablonlar oilalari bo‘yicha natijalar keltirilgan. Umumiy aniqlik ko‘rsatkichlari yaqin: nvd_get_cve uchun ikkala model ham yuqori natija ko‘rsatadi, nvd_search uchun esa minimal darajada. Tuzatilgan 1B modeli bash_exec va terse_control vazifalarida 600M dan ikki barobar yuqori natija beradi. Biroq, tanlanma hajmi kichikligi (n ≈ 28) sababli, bu farqlar keng ishonch intervallariga ega, shuning uchun bir model ikkinchisidan barqaror ustunlikka ega deb bo‘lmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tuzatilgan 1B modeli tanlashda aniqroq: buyruq tanlashda xatolik yuz berganda, u 48,4% hollarda to‘g‘ri buyruqni tanlaydi, 600M modeli esa 76,7% «&lt;a href=\"concepts/soft-miss.html\"&gt;yumshoq xato»&lt;/a&gt; (soft miss) ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;nvd_search bo‘yicha tahlil shuni ko‘rsatadiki, modellar so‘rov kalitini ajratib oladi, lekin ko‘p so‘zli qidiruv terminlarini yo‘qotadi (masalan, GitLab CVE so‘rovida faqat «GitLab» chiqadi). Qat’iy taqqoslashda bu xato hisoblanadi, ammo mezonlar yumshatilganda (qisman moslik) aniqlik 600M uchun 0,321 gacha va 1B uchun 0,357 gacha ko‘tariladi. Bu modellar otlarni ajratib olishga qodirligini, lekin erkin matnli fragmentlarni to‘liq olishda qiynalishini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Yumshoq xato» (soft miss) — bu model vositani chaqirish zarurligini to‘g‘ri aniqlagan, ammo buyruq parametrlari yoki sintaksisida xatoga yo‘l qo‘ygan holat.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Registr (uslub) ta’sirini o‘rganish shuni ko‘rsatdiki, 600M modeli uslubga juda sezgir: suhbat uslubidan texnik uslubga (terse_control) o‘tganda aniqlik 0,505 dan 0,200 gacha tushadi. Tuzatilgan 1B esa barqaror qoladi (0,532 → 0,500). Til omiliga kelsak, ingliz tilining ispan tilidan ustunligi (600M uchun 0,957 ga qarshi 0,580) ma’lumotlar to‘plami tuzilmasidagi nomutanosiblik natijasidir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dastlabki 1B modelining «bosish» (suppression) ko‘rsatkichlari soxta: model deyarli vositalarni chaqirmagan, bu esa chaqiriq bo‘lmagan o‘q bo‘yicha yuqori ball bergan, lekin amalda funksiyaning ishlamasligini anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oqitish-retsepti-ablyatsiyasi-korpus-va-oqitish-tezligi-faktor-tahlili\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#oqitish-retsepti-ablyatsiyasi-korpus-va-oqitish-tezligi-faktor-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O'qitish retsepti ablyatsiyasi: korpus va o'qitish tezligi faktor tahlili&lt;/span&gt;&lt;/a&gt;O'qitish retsepti ablyatsiyasi: korpus va o'qitish tezligi faktor tahlili&lt;/h4&gt;\n&lt;p&gt;Ushbu bo'limda mualliflar «C retsepti»ning ikkita asosiy komponentini — o'quv korpusi xilma-xilligi va o'qitish tezligini (LR) ajratib ko'rsatishadi, avval sinovdan o'tgan «iliq» ishga tushirish va embeddinglar jadvalini chiqarib tashlashadi. Tajriba 32 o'lchamli batch va 2202 qadam bilan beshta yugurishni o'z ichiga oladi. Omillar aralashib ketmasligi uchun qadamlar chegarasi qat'iy belgilangan, bu esa tor va xilma-xil korpuslar uchun optimizator iteratsiyalarini tenglashtiradi. Tor korpus 12 801 ta namunadan (tool-SFT va 10 mingta kiber-mulohaza namunalari), xilma-xil korpus esa qo'shimcha 23 502 ta OpenAssistant namunalaridan iborat. Ikki LR qiymati ishlatiladi: yuqori (1 × 10⁻⁵) va past (2 × 10⁻⁶).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Faktor tahlili shuni ko'rsatdiki, 2202 qadamda barcha modellar LR yoki ma'lumotlar tarkibidagi o'zgarishlardan qat'i nazar, o'quv korpusini deyarli to'liq yodlab olishga erishadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Texnik amalga oshirish asosiy C retseptidan farq qiladi: uskunalar cheklovlari tufayli (bf16 qo'llab-quvvatlamaydigan Turing T4) o'qitish fp32 master-vaznlari, 8-bitli AdamW va gradient chekpointi bilan fp16 formatida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/8-bitnyy-optimizator.html\"&gt;8-bitli optimizator&lt;/a&gt; — xotirani tejashga imkon beruvchi, ammo to'liq bf16 formatiga nisbatan hisoblash aniqligiga ta'sir qilishi mumkin bo'lgan optimizator holatini siqish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ushbu bo'lim natijalarini maqolaning asosiy ma'lumotlari bilan to'g'ridan-to'g'ri solishtirib bo'lmaydi, chunki hisoblash aniqligi (mantissa) va o'qitish rejimida farqlar mavjud.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;So'zma-so'z takrorlash protokolida (n=269) barcha beshta model «shift»ga (1.000) yaqin natijalarni ko'rsatdi, bu esa belgilangan o'qitish hajmida modellarning ma'lumotlarni yodlashga yaqinlashishini tasdiqlaydi. Umumlashtirish qobiliyatini baholash uchun 238 ta prompt to'plamidan foydalaniladi, bu yerda taqqoslash McNemar testi va juftlashtirilgan &lt;a href=\"concepts/butstrep.html\"&gt;butstrap&lt;/a&gt; yordamida amalga oshiriladi.&lt;/p&gt;\n&lt;h4 id=\"faktor-tahlili-natijalari\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#faktor-tahlili-natijalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Faktor tahlili natijalari&lt;/span&gt;&lt;/a&gt;Faktor tahlili natijalari&lt;/h4&gt;\n&lt;p&gt;Tadqiqot oltita asosiy ko'rsatkich bo'yicha 36 ta statistik taqqoslashni o'z ichiga oldi (10-jadval). Noto'g'ri ijobiy natijalarni nazorat qilish uchun q=0,05 darajasida Benjamini–Xoxberg tuzatishi qo'llanildi. Barcha testlardan atigi to'rttasi ahamiyatli deb topildi: past o'qitish tezligida (LR) korpus tarkibining bostirish (suppression), ortiqcha ishga tushirish (over-triggering) va vositalar to'g'riligiga (tool correctness) ta'siri, shuningdek, tor korpusda korpusning vositalar to'g'riligiga ta'siri. Turli tasodifiy boshlang'ich sonlar (seeds) yordamida o'tkazilgan taqqoslash shuni ko'rsatdiki, umumiy ko'rsatkichlar sezilarli o'zgaruvchanlikni yashirishi mumkin: «xilma-xil» korpus va yuqori LR ga ega ikkita model bir xil o'rtacha natijaga (0,6024) ega bo'lsa-da, 6 ta alohida vazifa bo'yicha farq qilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Asosiy xulosa: yuqori o'qitish tezligida korpus tarkibi natijaga ta'sir qilmaydi, «xilma-xil» korpusning bostirishdagi taxminiy ustunligi esa takroriy ishga tushirishlarda tasdiqlanmadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"korpus-va-oqitish-tezligining-tasiri\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#korpus-va-oqitish-tezligining-tasiri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Korpus va o'qitish tezligining ta'siri&lt;/span&gt;&lt;/a&gt;Korpus va o'qitish tezligining ta'siri&lt;/h4&gt;\n&lt;p&gt;Past LR (2×10⁻⁶) da tor korpusdan xilma-xil korpusga o'tish ko'rsatkichlarni sezilarli darajada yaxshilaydi: bostirish 0,375 dan 0,583 gacha (p=6×10⁻⁵) ko'tariladi, ortiqcha ishga tushirish esa 0,625 dan 0,403 gacha (p=3×10⁻⁵) kamayadi. Vositalar to'g'riligi ham o'sadi (0,685 → 0,759, p=0,004). Biroq, yuqori LR (1×10⁻⁵) da korpuslar o'rtasidagi farqlar yo'qoladi: barcha o'qlar bo'yicha ko'rsatkichlar statistik jihatdan farqlanmaydi (p &amp;gt; 0,42). Tor korpusda LR ni oshirish vositalar to'g'riligini sezilarli darajada yaxshilaydi (+0,098, p=4×10⁻⁴), xilma-xil korpusda esa LR effekti beqaror va boshlang'ich songa bog'liq.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul: «Faktor tahlili» bu yerda yakuniy aniqlikka mustaqil va birgalikdagi ta'sirni baholash uchun ikki o'zgaruvchini (korpus va o'qitish tezligi) tizimli ravishda o'zgartirishni anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"takrorlanuvchanlikni-tekshirish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#takrorlanuvchanlikni-tekshirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Takrorlanuvchanlikni tekshirish&lt;/span&gt;&lt;/a&gt;Takrorlanuvchanlikni tekshirish&lt;/h4&gt;\n&lt;p&gt;Qisman replikatsiya (o'qitishning 40%ida, 880-qadam) shuni ko'rsatdiki, bir xil katak ichida (tor korpus/past LR) turli seed bilan ishga tushirishlar o'rtasidagi o'zgaruvchanlik korpus almashinuvi effektiga teng. Xususan, tor korpus uchun ikkinchi seed xilma-xil korpus bilan bir xil bostirish ko'rsatkichlarini ko'rsatdi, bu bostirishda «xilma-xillik» ustunligi haqidagi gipotezani rad etadi. Shunga qaramay, xilma-xil korpusning vositalar to'g'riligidagi ustunligi tor korpusning ikkala seedi bilan taqqoslaganda tasdiqlandi. Natijada, tor korpus va past LR ga ega model eng zaifi bo'lib chiqdi, ammo bu muvaffaqiyatsizlik emas, bu xilma-xil korpus va yuqori LR konfiguratsiyasini optimal tanlov ekanligini tasdiqlaydi.&lt;/p&gt;\n&lt;h4 id=\"600m-modelini-sft-qilish-va-distillashni-tekshirish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#600m-modelini-sft-qilish-va-distillashni-tekshirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;600M modelini SFT qilish va distillashni tekshirish&lt;/span&gt;&lt;/a&gt;600M modelini SFT qilish va distillashni tekshirish&lt;/h4&gt;\n&lt;p&gt;Tadqiqotchilar 600 million parametrli (600M) model uchun maxsus SFT (Supervised Fine-Tuning) jarayoni vositalarni chaqirish zaruratini aniqlashga yordam beradimi yoki yo‘qligini va kattaroq modeldan (GLM-5.3) olingan distillangan ma’lumotlar samaradorlikni oshiradimi, degan savollarni o‘rgandilar. Tajriba 154K nazorat nuqtasida, 1200 qadam, 1.5 × 10⁻⁵ o‘rganish tezligi, 2048 token uzunligi va 32 samarali batch hajmi bilan bitta L4 GPU'da o‘tkazildi. Asosiy model 17 801 ta yozuvda, distillangan versiya esa qo‘shimcha 4443 ta NVD CVE va Sigma qoidalariga asoslangan yozuvlarda o‘qitildi. Baholash 238 ta prompt to‘plamida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Distillangan ma’lumotlarni qo‘shish statistik jihatdan sezilarli ta’sir ko‘rsatmadi: guruhlar o‘rtasidagi farq [-0.036, +0.036] ishonch oralig‘i bilan 0,00 ni tashkil etdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Jadval natijalari shuni ko‘rsatadiki, ikkala SFT versiyasi ham muvaffaqiyatli chaqiruvlar ulushini (0,548 ga nisbatan 0,428) va obyektlarni ajratib olish aniqligini (0,71 ga nisbatan 0,56) oshirdi. Biroq, SFT modelni qachon chaqiruv qilmaslik kerakligini o‘rgatmadi. Dastlabki 600M modeli chaqiruvsiz holatlarning 35,4 foizida to‘g‘ri to‘xtab qolgan bo‘lsa, SFT'dan so‘ng bu ko‘rsatkich deyarli nolga tushdi. Model chaqiruv talab qilinmaydigan 72 ta holatning 70 tasida vositani chaqirdi. Bu shuni ko‘rsatadiki, har bir javob chaqiruvni o‘z ichiga olgan korpusda o‘qitish modelni ortiqcha faollikka undaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Baholash kichik hajmdagi ma’lumotlar va bitta tasodifiy urug‘ (seed) yordamida o‘tkazildi, bu kichik effektlarni aniqlashni qiyinlashtiradi, ammo distillashning katta ijobiy ta’siri yo‘qligini tasdiqlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;h4 id=\"intervensiya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#intervensiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Intervensiya&lt;/span&gt;&lt;/a&gt;Intervensiya&lt;/h4&gt;\n&lt;p&gt;Tadqiqot natijalari to‘rtta asosiy ssenariyni qamrab oladi: (a) 600 mln parametrli model, kodning atigi 0,1% qismida o‘qitilgan bo‘lsa-da, vositalarni chaqirish uchun to‘g‘ri JSON formatini generatsiya qila oladi; (b) 1,1 mlrd parametrli, veb-ma’lumotlarga asoslangan va 6 mlrd tokenli SFT (o‘qituvchi bilan o‘qitish) bosqichidan o‘tgan model aralashuvsiz bu qobiliyatni namoyon etmaydi; (c) diagnostikaga asoslangan qayta o‘qitish usuli 1,1 mlrd parametrli modelga bitta GPU yordamida 2202 qadamda vositalar bilan ishlashni o‘rgatadi; (d) faktor tahlili shuni ko‘rsatdiki, barcha o‘qitish konfiguratsiyalari chaqiruv formatini o‘rnatadi, ular faqat keraksiz chiqishni bostirish qobiliyati bilan farqlanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;O‘qitish ma’lumotlarining tarkibi model «qutidan tashqari» tuzilmaviy chiqish bilan ishlashini yoki murakkab muhandislik yondashuvini talab qilishini belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Faqat kodga yo‘naltirilgan ma’lumotlar tuzilmaviy chiqishni kafolatlaydi degan dastlabki gipoteza (c) natijasi bilan rad etildi. Endi biz masala prinsipial imkoniyatda emas, balki ko‘nikmani faollashtirish murakkabligida deb hisoblaymiz. SFT tokenlari hajmi muvaffaqiyatni bashorat qilmaydi: muvaffaqiyatli (c) usulidan 1000 barobar ko‘proq resurs sarflagan ixtisoslashgan (b) bosqichi kutilgan natijani bermadi. (c) usulining muvaffaqiyati ma’lumotlar hajmida emas, balki ularning tuzilishida: keng aralashmalarga qaraganda dialog formatlarining ustunligidadir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — modelni aniq vazifalarga moslashtirish uchun «savol-javob» namunalari asosida qayta o‘qitish usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Faktor tahlili (d) shuni ko‘rsatdiki, yuqori o‘qitish sur’atida (learning rate) kontekst xilma-xilligi (suhbat, mantiq, vositalar) majburiy emas. Past sur’atda xilma-xil ma’lumotlar xatolarni yaxshiroq bostirdi, ammo bir xil parametrlar bilan o‘tkazilgan ishga tushirishlar orasidagi farq turli ma’lumotlar turlari orasidagi farq bilan solishtiriladigan darajada bo‘ldi, bu esa xilma-xillik ta’siri bo‘yicha savolni ochiq qoldiradi.&lt;/p&gt;\n&lt;h4 id=\"nima-uchun-kodga-boy-oldindan-oqitish-standart-holatni-ornatadi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#nima-uchun-kodga-boy-oldindan-oqitish-standart-holatni-ornatadi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nima uchun kodga boy oldindan o'qitish standart holatni o'rnatadi?&lt;/span&gt;&lt;/a&gt;Nima uchun kodga boy oldindan o'qitish standart holatni o'rnatadi?&lt;/h4&gt;\n&lt;p&gt;Mexanistik tahlil shuni ko'rsatadiki, kodda o'qitilgan modellarning ustunligi uchta omil bilan izohlanadi. Birinchidan, tokenlar chastotasi: kodda formatlash belgilari (figurali qavslar, qo'shtirnoqlar, ikki nuqta) doimiy ravishda uchraydi, oddiy matnda esa ular kamyobdir. 65% kod ulushiga ega model bu tokenlarga yuqori bazaviy ehtimollikni belgilaydi, «prozaik» model esa ularni generatsiya qilishda katta logarifmik ehtimollik defitsitiga duch keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Kodda o'qitish ehtimollikning «bazaviy stavkasini» yaratadi: model strukturaviy elementlarni (JSON, YAML) har qanday matnning tabiiy davomi deb hisoblaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ikkinchidan, kod modelni qat'iy sintaktik cheklovlar bilan o'rgatadi. Oddiy matndan farqli o'laroq, kod qavslar balansi va qo'shtirnoqlarning juftligini talab qiladi. O'quv to'plamidagi milliardlab namunalar bu qoidalarni mustahkamlaydi, bu esa modelga yangi kontekstlarda ham strukturaviy ma'lumotlarni muvaffaqiyatli generatsiya qilish imkonini beradi.&lt;/p&gt;\n&lt;p&gt;Uchinchidan, muammo yashirin holatlarni yo'naltirishda (routing). Embeddinglar tahlili (§6.6) shuni ko'rsatadiki, 1B modelidagi &amp;lt;/tool_call/&amp;gt; vektori to'g'ri bo'lgan, ammo model yashirin holatlarni unga yo'naltira olmagan. Tuzatish (qayta o'qitish) kerak bo'lganda faollashadigan marshrutlash mexanizmini yaratdi. Yangi promptlar bo'yicha testlarda tuzatilgan 1B modeli 166 ta holatdan 71,7% ida to'g'ri vositani tanlaydi va 66,7% ida argumentlarni ajratib oladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M modeli to'liq marshrutlash mexanizmiga ega emas: u shunchaki funksiya chaqiruvlarini «ortiqcha ishlab chiqaradi», chunki ularni har qanday dialogning ehtimoliy davomi deb biladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Funksiya chaqiruvi bo'lmagan 72 ta prompt bo'yicha tahlil (§6.8) shuni tasdiqladiki, 600M modeli neytral mavzularda 64,6% hollarda va agar savolda shunchaki texnik atama (masalan, CVE) tilga olinsa, 91,3% hollarda xato ravishda chaqiruvni boshlaydi. 600M modeli uchun maxsus SFT (qayta o'qitish) (§6.10) chaqiruvlarni o'chirish uchun «&lt;a href=\"concepts/gate.html\"&gt;darvoza»&lt;/a&gt; (gate) yaratmaydi, balki faqat chaqiruvlarning aniqligini oshiradi, shu bilan birga neytral so'rovlarga javoblarni butunlay bostiradi.&lt;/p&gt;\n&lt;h4 id=\"f1-va-f2-korsatkichlarini-1b-modeli-uchun-muvofiqlashtirish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f1-va-f2-korsatkichlarini-1b-modeli-uchun-muvofiqlashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F1 va F2 ko'rsatkichlarini 1B modeli uchun muvofiqlashtirish&lt;/span&gt;&lt;/a&gt;F1 va F2 ko'rsatkichlarini 1B modeli uchun muvofiqlashtirish&lt;/h4&gt;\n&lt;p&gt;§6.7 va §6.8 natijalari o'rtasidagi ziddiyat o'lchanayotgan kattaliklarning farqi bilan izohlanadi. F1 metriki (no-call va call ehtimollari nisbati) nisbiy bo'lib, taqsimot ichida baholanadi: ehtimolliklar nolga yaqin bo'lganda, model 10³–10⁴ nisbatini ko'rsatadi, bu esa generatsiya jarayonini emas, balki kontekst arxitekturasini tavsiflaydi. F2 metriki (ortiqcha ishga tushish tezligi) mutlaq bo'lib, taqsimotdan tashqarida baholanadi: u vositalarni chaqirishni o'rgangan model yangi, ko'rilmagan ma'lumotlarda qanchalik xato qilishini ko'rsatadi. Tuzatilgan 1B modeli to'g'ri sozlangan «darvoza» (gate) mexanizmiga ega, ammo uning qamrovi cheklangan: u yangi ma'lumotlar shakllariga o'tmaydi. Shunga qaramay, 1B noto'g'ri chaqiruvlarni bostirishda 600M dan ustun turadi (sof promptlar uchun 0,604 ga qarshi 0,354 va near-miss uchun 0,174 ga qarshi 0,087), bu 1B da marshrutlash mexanizmi qisman bo'lsa-da ishlashini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tuzatilgan 1B modeli «darvoza» tuzilishiga ega, ammo yangi ma'lumotlar uchun yetarli qamrovga ega emas, shunga qaramay u 600M dan aniqroq ishlaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Darvoza» (gate) — bu model arxitekturasidagi mexanizm bo'lib, u foydalanuvchi so'roviga javoban tashqi vositani chaqirish kerakligini belgilaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sft-boglash-va-qurish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#sft-boglash-va-qurish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SFT: bog'lash va qurish&lt;/span&gt;&lt;/a&gt;SFT: bog'lash va qurish&lt;/h4&gt;\n&lt;p&gt;600M va 1B modellari o'rtasidagi o'qitish xarajatlari farqi fundamentaldir. 600M uchun SFT (Supervised Fine-Tuning) jarayoni mavjud bazaviy qobiliyatni (kalit-qiymat formatida chiqarish) trigger token bilan «bog'lash»dan iborat bo'ldi, bu taxminan 10⁷ tokenni talab qildi. 1B uchun esa oldindan o'qitishda bo'lmagan marshrutlash mexanizmini «qurish» kerak edi. Bunga faqat yordamchi rejimdagi xilma-xil kontekstlar va yuqori o'qitish tezligi (LR) yordamida, 10⁷ token sarflab erishildi. Asosiy xarajat tokenlar sonida emas, balki diagnostikada: xatoni aniq lokallashtirmasdan turib, 1B modelini qobiliyatsiz deb hisoblash mumkin edi.&lt;/p&gt;\n&lt;h4 id=\"registrni-umumlashtirish\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#registrni-umumlashtirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Registrni umumlashtirish&lt;/span&gt;&lt;/a&gt;Registrni umumlashtirish&lt;/h4&gt;\n&lt;p&gt;Natijalar shuni tasdiqlaydiki, sintaktik registr (qavs ichidagi tuzilgan chiqish va erkin matn) model xatti-harakatida ustunlik qiladi. Keyingi sozlashlar faqat xato turiga qaratilgan bo'lsagina bu xatti-harakatni o'zgartira oladi. Kichik modellar uchun amaliy qoida: yoki o'quv to'plamini kerakli uslubda shakllantirish, yoki ushbu maqolada tasvirlangan diagnostika va tuzatish sikli uchun byudjet ajratish kerak.&lt;/p&gt;\n&lt;h4 id=\"amaliy-tavsiyalar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#amaliy-tavsiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Amaliy tavsiyalar&lt;/span&gt;&lt;/a&gt;Amaliy tavsiyalar&lt;/h4&gt;\n&lt;p&gt;Cheklangan byudjet sharoitida 1 mlrd parametrdan kam bo‘lgan modellarni ishlab chiquvchi jamoalar uchun quyidagi tavsiyalar beriladi: (i) kod va strukturalashtirilgan matn ulushini shunchaki benchmark ko‘rsatkichi emas, balki arxitekturaning fundamental parametri sifatida belgilash; (ii) o‘qitish jarayonida P(&amp;lt;/tool_call/&amp;gt;) birinchi token ehtimolligini logga olish. Bu deyarli resurs talab qilmaydi, ammo 38K qadam (taxminan 40 mlrd token) bosqichida xatolikni oldindan aniqlash imkonini beradi. Literallar va bo‘shliqlardan tozalangan variantlarni alohida qayd etish muhim, chunki ularning qiymati 13 tartibgacha farq qilishi mumkin; (iii) asboblardan foydalanish benchmarklari uchun qat’iy strukturali tekshiruvni joriy etish, chunki oddiy kalit so‘zlar ko‘pincha noto‘g‘ri natijalar beradi; (iv) SFT (o‘qitish) muvaffaqiyatsizlikka uchraganda, qobiliyatga erishib bo‘lmaydi deb xulosa qilmaslik kerak: A va C retseptlari 6 mlrd tokenda muvaffaqiyatsizlik 107 mlrd tokenda muvaffaqiyat bilan birga kelishi mumkinligini ko‘rsatdi; (v) o‘quv korpusidagi baholashni yangi prompatlar bilan umumlashtirish testlari bilan to‘ldirish, bu yodlab qolish va haqiqiy o‘rganishni farqlashga yordam beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Qat’iy strukturali tekshiruvlar va birinchi token ehtimolligini monitoring qilish o‘qitish jarayonidagi kritik xatolarni erta aniqlash imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;(iii) bandi maqola ustida ishlash jarayonida tasdiqlandi. L5 nazorat nuqtasini tekshirishda rasmiy baholash vositasi 0/8 natijani ko‘rsatdi, qat’iy diagnostika esa 8/8 natijani berdi. Sababi tokenizator kutubxonasi maxsus tokenlarni avtomatik o‘chirib tashlaganida edi. Dekodlash mantiqini bir qatorli tuzatish natijani 8/8 ga qaytardi. Xuddi shunday xatolar GGUF-eksportyor va agentlar sikllarida ham aniqlandi. Bu xatolar modelning qobiliyatsizligi haqida noto‘g‘ri xulosalarga olib kelgan edi. Biz buni o‘z tezisimizning tasdig‘i sifatida keltiramiz: baholash vositalaridagi yashirin xatolar modeldagi muammolar sifatida niqoblanishi mumkin.&lt;/p&gt;\n&lt;h4 id=\"taklif-etilayotgan-keyingi-tajribalar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#taklif-etilayotgan-keyingi-tajribalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Taklif etilayotgan keyingi tajribalar&lt;/span&gt;&lt;/a&gt;Taklif etilayotgan keyingi tajribalar&lt;/h4&gt;\n&lt;p&gt;Tajribalar narxiga ko‘ra tartiblangan: F1 va F2 faqat CPU talab qiladi, F3 bitta kichik GPU, F4 esa oldindan o‘qitish uchun katta hisoblash quvvatlarini talab qiladi.&lt;/p&gt;\n&lt;h4 id=\"f1-arxivlangan-chekpointlar-ustida-trayektoriya-zondlari\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f1-arxivlangan-chekpointlar-ustida-trayektoriya-zondlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F1: Arxivlangan chekpointlar ustida trayektoriya zondlari&lt;/span&gt;&lt;/a&gt;F1: Arxivlangan chekpointlar ustida trayektoriya zondlari&lt;/h4&gt;\n&lt;p&gt;Biz 600M modelida P(&amp;lt;/tool_call/&amp;gt;) ehtimolligi SFT ma'lumotlari to'planishi bilan ortishi, 1B modelida esa ikkinchi fazada to'xtab qolishi yoki yomonlashishi haqidagi bashoratni tekshirdik. 15 ta 600M va 23 ta 1B chekpointlarini tahlil qilish 1B ning ikkinchi fazasi avvalgi ko'nikmalarni o'chirib tashlaganini tasdiqladi. 600M modeli birinchi chekpointdayoq to'yinganlikka erishdi. 600M ning standart xulqi darvoza (gate) emas, balki shartsiz baza stavkasi ekanligi, 1B ning uchinchi fazasida esa zond va B4 qarama-qarshi yo'nalishda harakatlanishi aniqlandi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1B modelining ikkinchi o'quv fazasi ko'nikmani shakllantirmadi, aksincha, mavjudini yo'q qildi, 600M esa erta bosqichdayoq limitga yetdi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"f2-masshtab-diagnostikasi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f2-masshtab-diagnostikasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F2: Masshtab diagnostikasi&lt;/span&gt;&lt;/a&gt;F2: Masshtab diagnostikasi&lt;/h4&gt;\n&lt;p&gt;Biz takrorlash testlarini n=6 dan to'liq korpusgacha, umumlashtirish testlarini esa n=8 dan yuzlab promptgacha kengaytirdik. Yakuniy namuna n=269 (so'zma-so'z) va n=238 (test batareyasi) ni tashkil etdi. Tuzatilgan 1B modeli yangi obyektlar bo'yicha 600M dan ustun keldi (p=0.0039), ammo 600M formatga nisbatan sezgirroq bo'lib chiqdi va o'z korpus uslubida 30 punkt yo'qotdi. Ikkala model ham «near-miss» promptlarda chaqiruvlarni bostira olmadi (0.087 va 0.174).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/near-miss-prompty.html\"&gt;Near-miss» prompatlar&lt;/a&gt; — bu maqsadli so'rovlarga juda yaqin, ammo kichik farqlarga ega bo'lgan, modelning xatolarga chidamliligini tekshiruvchi so'rovlar.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"f3-tuzatish-retsepti-ablyatsiyasi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f3-tuzatish-retsepti-ablyatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F3: Tuzatish retsepti ablyatsiyasi&lt;/span&gt;&lt;/a&gt;F3: Tuzatish retsepti ablyatsiyasi&lt;/h4&gt;\n&lt;p&gt;Korrelyatsiyadan sabab-oqibat bog'liqligiga o'tish uchun biz 2×2 faktorli tajriba o'tkazdik (korpus: tor/xilma-xil × LR: 2×10⁻⁶/1×10⁻⁵), 4 ta tarmoqni 2202 qadam davomida ishga tushirdik. F2 testlar to'plami qo'llanildi. Yuqori LR da korpus xilma-xilligi sezilarli ta'sir ko'rsatmasligi, past LR da esa xilma-xil korpus asboblar chaqiruvi aniqligi bo'yicha tor korpusdan ustunligi aniqlandi. T4 tezlatkichlari (bf16 o'rniga fp16) tufayli natijalar ehtiyotkorlik bilan talqin qilinishi kerak, chunki turli urug'lar (seeds) bilan ishga tushirishdagi o'zgaruvchanlik o'lchanayotgan effektlar bilan solishtiriladigan darajada.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Uskuna cheklovlari (T4, fp16) va tasodifiy boshlang'ich qiymatlarga (seed) yuqori sezgirlik tufayli xulosalarning bir qismi qat'iy dalil emas, balki kuzatuv xarakteriga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"f4-ruxsat-etilgan-masshtabda-kompozitsiya-ablyatsiyasi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f4-ruxsat-etilgan-masshtabda-kompozitsiya-ablyatsiyasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F4: Ruxsat etilgan masshtabda kompozitsiya ablyatsiyasi&lt;/span&gt;&lt;/a&gt;F4: Ruxsat etilgan masshtabda kompozitsiya ablyatsiyasi&lt;/h4&gt;\n&lt;p&gt;Kod ulushi turlicha (10%, 35%, 65%) bo'lgan 2–3 ta kichik modelni (130–260M) o'qitish taklif etiladi. F1 zondlari va F2 diagnostikasi yordamida kod ulushi va asboblar chaqiruvi o'rtasidagi sabab-oqibat bog'liqligini aniqlash ko'zda tutilgan.&lt;/p&gt;\n&lt;h4 id=\"cheklovlar\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h4&gt;\n&lt;p&gt;Ushbu tadqiqotda biz cheklovlarni ochiq bayon qilamiz, chunki ularning ba'zilari biz ilgari surgan xulosalardan kuchliroq da'volar uchun to'siq bo'lishi mumkin edi.&lt;/p&gt;\n&lt;p&gt;L1: 600M modeli rejalashtirilgan grafikning 64% qismida to'xtatilgan. O'qitish 240 000 qadamdan 154 000-qadamda (taxminan 15,7 mlrd tokendan 10 mlrd token) to'xtadi va uni qayta tiklashning iloji yo'q, chunki bulutli infratuzilma o'chirilgan. Model kosinusli yumshatish (cosine anneal) bosqichidan o'tmagan va yuqori learning rate darajasida qolgan, bu uning sifatini pasaytiradi. 600M uchun keltirilgan barcha raqamlar tugallanmagan artefaktni aks ettiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;600M modeli «muzlatilgan» va to'liq o'qitilmagan holatda, bu konservativ tarafkashlikni keltirib chiqaradi: hatto shu holatda ham u emergent xususiyatlarni namoyon etadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;L2: Model muloqot qilish qobiliyatiga ega emas. Nano va Base versiyalaridan farqli o'laroq, 600M SFT (Supervised Fine-Tuning) bosqichidan o'tmagan. U to'g'ridan-to'g'ri savollarga (masalan, Peru poytaxti yoki oddiy hisob-kitoblar haqida) javob bera olmaydi, garchi ispan tilida ravon gapira olsa ham. Biz to'liq huquqli yordamchi yaratishni da'vo qilmaymiz; bizning xulosalarimiz faqat tuzilmaviy vosita chaqiruvlarini (tool-call) generatsiya qilishga qaratilgan.&lt;/p&gt;\n&lt;p&gt;L3: Modellarni taqqoslash qat'iy nazorat qilinadigan tajriba emas. Parametrlar soni (1,68 barobar), ma'lumotlar hajmi (10 mlrd va 65 mlrd token) va o'qitish arxitekturasidagi farqlar aralash omillarni keltirib chiqaradi. Biroq, bu omillarning barchasi 600M modelini 1B modeliga nisbatan noqulay ahvolga soladi. Shuning uchun, ma'lumotlar tarkibi ta'siri haqidagi gipoteza asosiy bo'lib qolmoqda, garchi u qo'shimcha ablyatsiyani (F4) talab qilsa ham.&lt;/p&gt;\n&lt;p&gt;L4: Diagnostika kichik tanlamalar (n) asosida o'tkazildi. So'zma-so'z takrorlash tekshiruvi 6 ta, umumlashtirish testi esa 8 ta yangi promptni o'z ichiga oldi. Biz faqat sifatli xulosalar chiqaramiz: agar qobiliyat bir konfiguratsiyada deyarli barcha urinishlarda, boshqasida esa hech qachon namoyon bo'lmasa, bu kategorik farqni bildiradi. Bostirish (suppression) sharti 15 ta nazorat nuqtasining har biri uchun n=1 holatida tekshirildi. Bu 600M modelida qat'iy «geyt» (filtr) yo'qligini tasdiqlasa-da, qisman yoki kontekstga bog'liq mexanizmlarni istisno etmaydi. Keyingi kengaytirilgan testlar (n=269 va n=238) xulosalarimizni tasdiqladi, ammo preambula kuchining ta'siri hali o'rganilmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Dastlabki testlardagi kichik tanlama hajmi statistik ahamiyatni cheklaydi, ammo modellarning sifat jihatidan farqlari testlar kengaytirilganda ham barqaror bo'lib qolmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"l5-retseptini-aniqlashtirish-va-omillar-tahlili\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#l5-retseptini-aniqlashtirish-va-omillar-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-ind
