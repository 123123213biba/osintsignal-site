        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"102\" cy=\"63\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"578\" cy=\"293\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;VISTA: neyrotarmoqlarni&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ko'rganlarini «eslab&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;qolishga» o'rgatish&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f2.jpg\" alt=\"2-rasm: ARC-AGI-3 (chapda) va GameWorld (o'ngda) muhitlaridagi VISTA traektoriyalari. Interfeys agentga vizual holatlarn\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: ARC-AGI-3 (chapda) va GameWorld (o'ngda) muhitlaridagi VISTA traektoriyalari. Interfeys agentga vizual holatlarni to'g'ridan-to'g'ri kuzatish, tabiiy tilda fikrlash va kerak bo'lganda o'zining yo'qotishlarsiz vizual xotirasini asl batafsillik darajasida tekshirish imkonini beradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;MIT tadqiqotchilari VISTA tizimini taqdim etishdi, u multimodal modellarga «uzun» vizual xotira beradi. Siqilgan va to'liq bo'lmagan ma'lumotlar o'rniga, agent o'zaro ta'sirning barcha kadrlarini asl sifatda saqlaydi. Bu modelga xatolarni tahlil qilish va strategiyani rejalashtirish uchun o'tmishdagi voqealarga qaytish imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;VISTA barcha vizual kadrlarni siqishsiz saqlaydi, bu qaror qabul qilish uchun muhim detallarning yo'qolishini oldini oladi.&lt;/li&gt;\n&lt;li&gt;Model o'tmishdagi kadrlarni faol so'rashi va solishtirishi mumkin, bu esa xatolarni real vaqtda tuzatishga yordam beradi.&lt;/li&gt;\n&lt;li&gt;ARC-AGI-3 benchmarkida tizim 100% samaradorlik ko'rsatib, odamlarning natijalarini harakatlar soni bo'yicha 57,4% ga ortda qoldirdi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;VISTA (Visual Harness for Reasoning) multimodal modellardagi (VLM) kontekst yo'qolishi muammosini hal qiladi, chunki ular odatda tasvirlarni faqat bir marta kodlaydi. Vizual ma'lumotlar kontekst oynasi to'lganda siqiladigan yoki o'chiriladigan standart usullardan farqli o'laroq, VISTA «yo'qotishsiz vizual xotira» (lossless visual memory) yaratadi. Tizim har bir kadrni vaqt va harakat bo'yicha indekslaydi, bu esa modelga muhitning o'tmishdagi holatlarini batafsil tahlil qilish uchun iterativ «vizual so'rovlar» (visual tool calls) bajarish imkonini beradi.&lt;/p&gt;\n&lt;p&gt;ARC-AGI-3 benchmark testlarida VISTA bilan jihozlangan Claude Opus 5.0 modeli harakat samaradorligining ideal ko'rsatkichiga (RHAE 100.00) erishdi va vazifalarni yangi boshlagan odamlarga qaraganda 57,4% ga tejamkorroq bajardi. Tizim 25 ta ARC-AGI-3 o'yinida, shuningdek, GameWorld, AI GameStore va BabyVision kabi platformalarda sinovdan o'tkazildi. VISTA murakkab dasturlashni talab qilmaydi va modelga keyingi qarorni qabul qilishdan oldin o'z harakatlari tarixini mustaqil ravishda «ko'rib chiqish» imkonini beruvchi qo'shimcha vosita sifatida ishlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tizimning samaradorligi to'g'ridan-to'g'ri ishlatilayotgan multimodal modelning imkoniyatlariga va kadrlarni saqlash uchun mavjud operativ xotira hajmiga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Biz zamonaviy multimodal modellar kuchli mantiqiy xulosa chiqarish qobiliyatiga ega ekanligini, biroq interaktiv muhitlarda vazifalarni bajarish uchun ularga maxsus vosita kerakligini ko‘rsatamiz. Biz VISTA tizimini taqdim etamiz — bu umumiy maqsadli multimodal modellarga uzoq muddatli vizual rejalashtirish imkonini beruvchi vizual vosita. VISTA modelga atrof-muhitni vizual kuzatuvlar orqali bevosita idrok etish imkonini beradi va o‘tmishdagi barcha kuzatuvlarni asl holida saqlaydigan yo‘qotishsiz vizual xotirani ta’minlaydi. Model ushbu ma’lumotlarni faol ravishda qayta tiklashi va mulohaza yuritish jarayonida vizual kiritishni qayta tashkil qilishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA multimodal modelni uzoq muddatli vizual xotiraga ega agentga aylantirib, murakkab vazifalarda mukammal samaradorlikka erishish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ARC-AGI-3 benchmarkida o‘tkazilgan sinovlarda VISTA tizimi Claude Opus 5.0 modeliga inson harakati samaradorligi (Relative Human Action Efficiency) ko‘rsatkichini 40,68 dan 100,00 ballgacha oshirish imkonini berdi. Model barcha 25 ta ochiq o‘yin stsenariylarini muvaffaqiyatli yakunladi va bunda birinchi marta o‘ynayotgan insonlarga qaraganda 57,4% kamroq harakat sarfladi. Arxitekturasining soddaligi tufayli VISTA minimal o‘zgartirishlar bilan turli vizual muhitlarga oson moslashadi. Turli vizual boshqotirmalar va o‘yinlarni qamrab oluvchi qo‘shimcha uchta ma’lumotlar to‘plamidagi sinovlar VISTA standart integratsiya usullarini qo‘llaydigan bazaviy modellardan sezilarli darajada ustunligini tasdiqladi. Bizning natijalarimiz VISTA murakkab vizual muhitlarda multimodal agentlarni rivojlantirish uchun samarali yechim ekanligini ko‘rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multimodal model — bu matn va tasvir kabi turli xil ma’lumotlar turlarini bir vaqtning o‘zida qayta ishlash va solishtirish qobiliyatiga ega neyron tarmoq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;h4 id=\"b-multimodal-agent\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#b-multimodal-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(b) Multimodal agent&lt;/span&gt;&lt;/a&gt;(b) Multimodal agent&lt;/h4&gt;\n&lt;p&gt;Zamonaviy multimodal modellar kontekst oynasining cheklanganligi tufayli vizual kuzatuvlarni o‘chirishga yoki ularni matnli tavsiflar bilan almashtirishga majbur bo‘ladi. Bu uzoq muddatli o‘zaro ta’sirlar jarayonida modellarning fikrlash qobiliyatini cheklaydi. Ushbu muammoni hal qilish uchun biz VISTA tizimini taqdim etamiz — bu modelga vizual ma’lumotlarni faol boshqarish imkonini beruvchi vizual qobiqdir (1c-rasm). Model obyektlarning ko‘rinishi va fazoviy munosabatlarini saqlaydigan vizual kuzatuvlarni qabul qiladi va ulardan keyingi harakatlarni rejalashtirish uchun foydalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA «yo‘qotishsiz vizual xotira»ni ta’minlaydi, unda muhitdan olingan barcha kadrlar, shu jumladan oraliq animatsiyalar ham asl holida saqlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Vizual tasvirlarni siqib, sifatini yo‘qotadigan standart yondashuvlardan farqli o‘laroq, VISTA har bir kadrni saqlab qoladi. Model o‘zining fikrlash ehtiyojlariga qarab, turli darajadagi tafsilotlar bilan kadrlarni solishtirishi yoki ma’lum hududlarni tekshirishi mumkin (2-rasm). Claude Opus 5.0 bilan birgalikda VISTA tizimi ARC-AGI-3 to‘plamidagi barcha 25 ta o‘yinni muvaffaqiyatli yakunladi va inson harakati samaradorligi (RHAE) ko‘rsatkichini 100.00 ga yetkazdi, bunda inson bazaviy darajasiga nisbatan 57.4% kamroq harakat sarflandi. GPT-5.6 Sol modeli ham VISTA bilan barcha 25 ta o‘yinni 99.00 RHAE balli bilan yakunladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RHAE (Relative Human Action Efficiency) — agentning inson bilan solishtirganda vazifani qanchalik samarali bajarganini o‘lchaydigan metrika.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Taqqoslash uchun: dasturlashsiz rasmiy bazaviy yechimlar RHAE bo‘yicha atigi 40.68 (Opus 5.0) va 13.33 (GPT-5.6 Sol) ballarni ko‘rsatadi. VISTA o‘zining soddaligi tufayli GameWorld’dagi 34 ta o‘yin, AI GameStore’dagi 10 ta o‘yin va BabyVision’dagi 39 ta vizual kuzatuv muammolariga muvaffaqiyatli tatbiq etildi. Tizim bazaviy modellardan sezilarli darajada ustunlik qiladi va turli vizual muhitlarda yuqori samaradorlikni namoyish etadi.&lt;/p&gt;\n&lt;h4 id=\"mavjud-tadqiqotlar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#mavjud-tadqiqotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mavjud tadqiqotlar&lt;/span&gt;&lt;/a&gt;Mavjud tadqiqotlar&lt;/h4&gt;\n&lt;p&gt;ARC-AGI-1 va ARC-AGI-2 benchmarklari statik kataklardagi mavhum fikrlashni baholaydi. Mavjud yondashuvlar ko'pincha til modellari yoki kompyuter ko'rish tizimlaridan foydalanadi. Interaktiv ARC-AGI-3 benchmarkida agent yangi muhitga moslashishi va maqsadlarga erishishi kerak. Hozirgi usullar dasturiy sintezga tayanadi: agent muhitni ramziy ko'rinishga o'tkazib, bajariladigan kod yaratadi. Biroq, vizual murakkab muhitlarda bu qiyinlashadi. VISTA esa vizual kuzatuvlar bilan to'g'ridan-to'g'ri ishlaydi.&lt;/p&gt;\n&lt;p&gt;Kompyuter agentlari sohasida matnga asoslangan (HTML/DOM) va vizual (skrinshotlar) yondashuvlar mavjud. VISTA ikkinchi turga mansub bo'lib, ramziy vositalarni chetlab o'tadi. O'yin agentlari (Voyager, JARVIS-1, SIMA) vizual ma'lumotlardan foydalanadi, ammo ularning asosiy muammosi — vizual kontekstning cheklanganligi. VISTA barcha o'zaro ta'sirlar tarixini yo'qotishsiz saqlaydi, bu esa agentga istalgan o'tgan kadrga qaytish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA vizual tarixni to'liq saqlash orqali agentga o'tmishdagi ma'lumotlarni qayta ko'rib chiqish imkonini beradi, bu esa cheklangan kontekstli tizimlardan ustunlik qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vista-vizual-boglama\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#vista-vizual-boglama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VISTA: Vizual bog'lama&lt;/span&gt;&lt;/a&gt;VISTA: Vizual bog'lama&lt;/h4&gt;\n&lt;p&gt;Mavjud tizimlar vizual ma'lumotlarni bir marta kodlab, keyin ularni tashlab yuboradi yoki matnli xulosalarga almashtiradi. Bu muhim detallarning yo'qolishiga olib keladi. VISTA esa asl kuzatuvlarni «yo'qotishsiz vizual xotira»da saqlaydi va ularni tekshirish uchun vositalar taqdim etadi.&lt;/p&gt;\n&lt;h4 id=\"vizual-boglama-komponentlari\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#vizual-boglama-komponentlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Vizual bog'lama komponentlari&lt;/span&gt;&lt;/a&gt;Vizual bog'lama komponentlari&lt;/h4&gt;\n&lt;p&gt;Tizim uchta asosiy qismdan iborat: vizual kuzatuvlar, yo'qotishsiz xotira va vizual tekshiruv.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Vizual kuzatuvlar (3a-rasm): agent obyektlarning fazoviy munosabatlarini saqlaydigan tasvirlarni oladi.&lt;/li&gt;\n&lt;li&gt;Yo'qotishsiz xotira (3b-rasm): har bir kadr, shu jumladan oraliq animatsiyalar, indekslanadi va model kontekstidan qat'i nazar saqlanadi.&lt;/li&gt;\n&lt;li&gt;Vizual tekshiruv (3c-rasm): agent har qanday kadrning kattalashtirilgan qismini so'rashi yoki turli vaqt nuqtalarini solishtirishi mumkin. Model qachon va nimani tekshirishni o'zi hal qiladi.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vizual tekshiruv — bu modelga butun o'zaro ta'sir tarixidan kerakli detallarni tanlab olish imkonini beruvchi «faol diqqat» mexanizmi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ishchi-jarayon-pipeline\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#ishchi-jarayon-pipeline\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ishchi jarayon (Pipeline)&lt;/span&gt;&lt;/a&gt;Ishchi jarayon (Pipeline)&lt;/h4&gt;\n&lt;p&gt;Model va muhit o‘rtasidagi o‘zaro ta’sir ko‘p bosqichli muloqot orqali amalga oshiriladi (2-rasm). Mexanik interfeys (harness) mustaqil intellektga ega emas: u faqat model so‘rovlarini bajaradi, vizual ma’lumotlarni (tasvirlar yoki piksel qiymatlari) qaytaradi va xatolar haqida xabar beradi. Agent ushbu ma’lumotlarni tahlil qiladi va kerak bo‘lganda yangi so‘rovlar yuboradi. Har bir o‘yin davomida bitta agent ishlaydi va bitta o‘yin bosqichi yakuniy harakatdan oldin interfeys bilan bir nechta almashinuvni o‘z ichiga olishi mumkin (3d-rasm).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ishchi jarayon (pipeline) — bu model ma’lumotlarni oladigan, qayta ishlaydigan va muhitda harakatlarni bajaradigan avtomatlashtirilgan qadamlar ketma-ketligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Har bir bosqich boshida agent vizual holat va mavjud harakatlar ro‘yxatini oladi. U ikkita matnli fayldan foydalanishi mumkin: GUIDE.md (o‘yin haqidagi uzoq muddatli bilimlar uchun) va WORKING.md (joriy holat uchun qoralama). Inspect vositalari o‘tmishdagi kadrlarni ko‘rib chiqishga, readpixels esa tanlangan hududdagi piksel qiymatlarini tahlil qilishga imkon beradi. Agent ushbu vositalardan foydalanishni mustaqil hal qiladi. Rejalashtirish jarayoni tabiiy tildagi mulohazalarni, natijani bashorat qilishni va eslatmalarni yangilashni o‘z ichiga oladi. Play buyrug‘i bosqichni yakunlaydi va o‘yinni keyingi bosqichga o‘tkazadi. Kontekst chegarasi tugaganda, agent qisqacha xulosa (handoff) yaratadi va yangi kontekstda ishlashni davom ettiradi, bunda eslatmalar, vizual xotira va harakatlar tarixi saqlanib qoladi.&lt;/p&gt;\n&lt;h4 id=\"sozlash\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#sozlash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sozlash&lt;/span&gt;&lt;/a&gt;Sozlash&lt;/h4&gt;\n&lt;p&gt;ARC-AGI-3 ma’lumotlar to‘plami 25 ta interaktiv vizual o‘yinni o‘z ichiga oladi, ularning qoidalari aniq ko‘rsatilmagan. Agent qonuniyatlarni, yashirin holatlarni va maqsadlarni mustaqil ravishda aniqlashi kerak. Har bir o‘yin darajalardan iborat bo‘lib, ularda asosiy mexanika saqlanib qoladi, lekin ob’ektlar va cheklovlar murakkablashadi. Agent traektoriyasiga misol 4-rasmda keltirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Samaradorlik RHAE metriki bilan o‘lchanadi: inson ko‘rsatkichi bilan teng bo‘lsa 100%, kamroq harakat bilan bajarilsa 115% gacha, bajarilmasa 0%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Samaradorlik Relative Human Action Efficiency (RHAE) orqali o‘lchanadi. Agar agentning harakatlar soni insonning bazaviy ko‘rsatkichiga mos kelsa, daraja 100% deb baholanadi, samaraliroq bo‘lsa 115% gacha baho oladi. Tugallanmagan darajalar 0 ball oladi. O‘yinning umumiy balli yakunlangan darajalarning vaznlangan ulushi bilan cheklangan, bunda keyingi bosqichlar ko‘proq vaznga ega. Model sifatida Claude Opus 5.0 (Claude Code CLI orqali) va GPT-5.6 Sol (Codex CLI orqali) ishlatiladi.&lt;/p&gt;\n&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;h4 id=\"system-program-model-effort-rhae\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#system-program-model-effort-rhae\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;System Program Model Effort RHAE&lt;/span&gt;&lt;/a&gt;System Program Model Effort RHAE&lt;/h4&gt;\n&lt;p&gt;ARC-AGI-3 (25 ta ochiq o'yin) ma'lumotlar to'plamida tizimlar samaradorligini baholashda turli yondashuvlar sinovdan o'tkazildi. Rasmiy realizatsiya GPT-5.6 Sol modeli (max darajasi) bilan 13.33% natijani ko'rsatadi. Schema sxemasini qo'llash ko'rsatkichni 95.35% gacha oshiradi, Opus 5.0 va Fable 5 kombinatsiyasi esa 98.98% ga yetadi. ewmasvv1.6, Retrodict va Tycho modellari mos ravishda 98.97%, 99.86% va 100.00% kabi juda yuqori natijalarni qayd etdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA tizimi ARC-AGI-3 da 100.00% lik mukammal RHAE ko'rsatkichiga erishadi, bu rasmiy realizatsiyadan (40.68%) ancha yuqori va inson tomonidan bajarilgan harakatlardan 57.4% kamroq harakat talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vista\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#vista\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VISTA&lt;/span&gt;&lt;/a&gt;VISTA&lt;/h4&gt;\n&lt;p&gt;1-jadvalda ko'rsatilganidek, VISTA tizimi GPT-5.6 Sol bilan 99.00% va Opus 5.0 modeli bilan 100.00% natijani qayd etadi. Vizual ma'lumotlarni matnli to'rlarga aylantirib, kod asosidagi dunyo modelidan foydalanadigan ko'plab zamonaviy tizimlardan farqli o'laroq, VISTA dasturiy sintezsiz ishlaydi. Bu dasturiy sintezsiz bunday yuqori ko'rsatkichlarga erishgan birinchi tizimdir.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RHAE (Relative Human Action Efficiency) — agentning inson harakatlariga nisbatan samaradorligini baholovchi metrika: foiz qancha yuqori bo'lsa, yechim shunchalik aniq, harakatlar soni qancha kam bo'lsa, samaradorlik shunchalik yuqori bo'ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;1-jadval va 6-rasmda usullar solishtirilgan. Matnli to'rlar o'rniga vizual kuzatuvlardan (pixel readout) foydalanish harakatlar sonini 9,126 tagacha (matnli ko'rinishdagi 10,614 taga nisbatan) qisqartirish va tokenlar sarfini 71.9 milliondan 30.7 milliongacha kamaytirish imkonini beradi. Yaxshilanishlarning bosqichma-bosqich joriy etilishi shuni ko'rsatadiki, vizual piksel o'qish va yo'qotishsiz xotirani qo'llash RHAE ko'rsatkichini 13.33% dan 99.00% gacha oshirishda hal qiluvchi ahamiyatga ega.&lt;/p&gt;\n&lt;h4 id=\"ablatsiyalar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#ablatsiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ablatsiyalar&lt;/span&gt;&lt;/a&gt;Ablatsiyalar&lt;/h4&gt;\n&lt;p&gt;Barcha tajribalarda maksimal mulohaza yuritish kuchi va 200 ming tokenlik kontekst limiti bilan GPT-5.6 Sol modeli ishlatildi. Agent 64 × 64 o‘lchamli kadrlarni 8 barobar kattalashtirish orqali olingan 512 × 512 o‘lchamli PNG tasvirlarni qabul qildi.&lt;/p&gt;\n&lt;p&gt;VISTA komponentlari samaradorligi. Biz GPT-5.6 Sol modelini turli konfiguratsiyalarda solishtirdik (5-rasm). Matnli setkalardan foydalanadigan rasmiy yechim 13,33 RHAE ballini ko‘rsatadi. Matnli setkalarni PNG tasvirlar bilan almashtirish natijani 47,32 gacha oshirdi. Vaqt va harakat limitlarini oshirish natijani 51,66 ga yetkazdi. Kontekstni ixchamlashtirish va doimiy muloqotni joriy etish ballni 65,82 ga, o‘yinni modellashtirish bo‘yicha qo‘llanmalarni qo‘shish esa 70,05 ga olib chiqdi. Vizual xotira va model inspeksiyasini qo‘shish (v) natijani 94,10 ga, aniq piksel o‘qish (vi) esa 99,00 ga yetkazdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA vizual vositalarining bosqichma-bosqich joriy etilishi RHAE ko‘rsatkichini 13,33 dan 99,00 gacha oshirib, vizual tahlilning ustunligini isbotladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tasvirlar bo‘yicha mulohaza yuritish. VISTA matnli setkalardan farqli o‘laroq, to‘g‘ridan-to‘g‘ri renderlangan tasvirlar bilan ishlaydi. Matnli setkalar juda ko‘p token talab qiladi (har bir kadr uchun 4000 ga yaqin, VISTA uchun esa 308). O‘yin davomida sarflangan tokenlar matnli setkalarda 71,9 mln, VISTA’da esa 30,7 mln ni tashkil etadi.&lt;/p&gt;\n&lt;p&gt;Kontekst hajmining ta’siri. 7a-rasmda ko‘rsatilganidek, 200 ming tokenlik standart limit 99,00 RHAE ballini beradi. 780 mingga oshirish xarajatni 105,7 mln tokengacha ko‘taradi, 100 mingga tushirish esa RHAE ni atigi 0,4 ga kamaytiradi.&lt;/p&gt;\n&lt;p&gt;Tasvir masshtabining ta’siri. 2×, 4×, 8× va 16× masshtablar sinab ko‘rildi (7b-rasm). 4× masshtab 8× ga nisbatan 75% kamroq token sarflaydi. 2× masshtab natijani pasaytiradi, 16× esa qo‘shimcha foyda bermaydi.&lt;/p&gt;\n&lt;p&gt;Biz VISTA’ni ochiq GLM-5.3 Flash 320B modeli bilan sinab ko‘rdik (8-rasm). VISTA 66,93 RHAE balliga erishib, rasmiy yechimdan (1,89) va vizual vositalarsiz variantdan (13,27) sezilarli darajada ustun keldi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ablatsiya — tizimning alohida qismlarini o‘chirib, ularning umumiy natijaga ta’sirini baholash usuli.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"agent-xulosalar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#agent-xulosalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Agent: xulosalar&lt;/span&gt;&lt;/a&gt;Agent: xulosalar&lt;/h4&gt;\n&lt;p&gt;Model obyektlarning yo‘nalishini ularning qirralaridagi belgilarni tahlil qilish orqali muvaffaqiyatli aniqlaydi. 10-rasmda ko‘rsatilganidek, agent xaritani qayta tiklash uchun vizual xotiradan foydalanadi, oldingi 22 ta harakatdan to‘rtta kadrni chiqarib oladi va mahalliy detallarni 13 barobar kattalashtirish uchun «inspeksiya» funksiyasini qo‘llaydi. Sinovlarda tizim 20 640 ta harakat bilan 84,12 RHAE balliga erishadi va matnli bazaviy modellardan sezilarli darajada ustun keladi, bu VISTA’ning murakkab vizual tasvirlarga chidamliligini tasdiqlaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA fazoni qayta tiklash va obyektlarni detallash uchun vizual xotiradan foydalanib, standart matnli modellardan yuqori samaradorlik ko‘rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sifat-tahlili\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#sifat-tahlili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sifat tahlili&lt;/span&gt;&lt;/a&gt;Sifat tahlili&lt;/h4&gt;\n&lt;p&gt;VISTA’ning asosiy mexanizmlari — bu yo‘qotishsiz vizual xotira va inspeksiya funksiyasi bo‘lib, ular o‘zaro ta’sir tarixiga aniq e’tibor qaratishni ta’minlaydi. 10a-rasm xaritani tiklash uchun turli vaqt nuqtalaridan olingan ma’lumotlarni birlashtirishni, 10b-rasm esa detallarni aniqlashtirish uchun 512×512 pikselli hududni kattalashtirishni ko‘rsatadi. Bu vositalar agentga vizual dalillarni birlashtirish va obyektlarni kerakli darajada o‘rganish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Inspeksiya» (inspect) mexanizmi — bu modelga dasturiy jihatdan tasvir qismlarini «yaqinlashtirib», asl o‘lchamda ko‘rinmaydigan mayda detallarni tahlil qilish imkonini beruvchi funksiyadir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"umumiy-vizual-muhitlar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#umumiy-vizual-muhitlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy vizual muhitlar&lt;/span&gt;&lt;/a&gt;Umumiy vizual muhitlar&lt;/h4&gt;\n&lt;p&gt;VISTA’ning universalligi uni GameWorld (34 ta o‘yin, 170 ta vazifa), AI GameStore (10 ta o‘yin) va BabyVision (388 ta statik vazifa) kabi tizimlarda sinab ko‘rish imkonini berdi. GameWorld’da agent klaviatura va sichqoncha interfeysidan foydalanadi, muvaffaqiyat esa bajarilgan vazifalar ulushi (SR) va progress (PG) bilan o‘lchanadi. AI GameStore’da natijalar insonning median ko‘rsatkichlariga (100 deb qabul qilingan) nisbatan normallashtiriladi. BabyVision’da 39 ta vizual kuzatuv vazifasini yechish aniqligi baholanadi.&lt;/p&gt;\n&lt;h4 id=\"cheklovlar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h4&gt;\n&lt;p&gt;VISTA samaradorligi ko‘p jihatdan foydalanilayotgan modellarning bazaviy imkoniyatlariga bog‘liq. O‘yinlar modellarning o‘quv ma’lumotlariga kirgan bo‘lishi ehtimoli mavjud, chunki ular benchmarklardan keyin chiqarilgan. Tizimning umumlashtirish qobiliyatini qat’iy tekshirish uchun ARC-AGI-3 kabi yopiq to‘plamlardagi yangi o‘yinlarda sinovlar o‘tkazish zarur.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modellar ba’zi benchmarklar chiqishidan oldin o‘qitilgani sababli, agent o‘qitish jarayonida bu o‘yinlarni ko‘rgan bo‘lishi mumkinligi (ma’lumotlar sizib chiqishi) istisno qilinmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"yakuniy-xulosalar-va-istiqbollar\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#yakuniy-xulosalar-va-istiqbollar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yakuniy xulosalar va istiqbollar&lt;/span&gt;&lt;/a&gt;Yakuniy xulosalar va istiqbollar&lt;/h4&gt;\n&lt;p&gt;VISTA tizimi shuni ko'rsatadiki, oddiy vizual interfeys (harness) mavjud multimodal modellarning interaktiv vizual muhitlarda murakkab vazifalarni bajarish salohiyatini ochib beradi. Usul modelga qayta ishlanmagan vizual kuzatuvlarni uzatishdan iborat bo'lib, ular xotirada hech qanday yo'qotishlarsiz saqlanadi. Bu agentga o'zaro ta'sir jarayonida to'plangan vizual tajribaga asl detallar darajasida qayta murojaat qilish imkonini beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA barcha 25 ta ommaviy ARC-AGI-3 o'yinlarini mukammal ball bilan yakunlab, ideal natijani ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu arxitektura boshqa turdagi vizual o'yinlar va boshqotirmalarga ham osonlikcha moslashadi va minimal o'zgartirishlarni talab qiladi. VISTA'ning turli xil benchmarklardagi yuqori samaradorligi uni o'yinlardan tashqari vazifalar uchun universal vosita sifatida qo'llash imkoniyatini ko'rsatadi. Kelgusi tadqiqotlarda tizimni jismoniy dunyoga yaqinroq bo'lgan murakkab va real vazifalarda sinab ko'rish rejalashtirilgan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hozirgi bosqichda model samaradorligi asosan o'yin muhitlarida tasdiqlangan, bu esa real jismoniy sharoitlarda qo'shimcha tekshiruvni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f2.jpg\" alt=\"2-rasm: ARC-AGI-3 (chapda) va GameWorld (o'ngda) muhitlaridagi VISTA traektoriyalari. Interfeys agentga vizual holatlarn\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm: ARC-AGI-3 (chapda) va GameWorld (o'ngda) muhitlaridagi VISTA traektoriyalari. Interfeys agentga vizual holatlarni to'g'ridan-to'g'ri kuzatish, tabiiy tilda fikrlash va kerak bo'lganda o'zining yo'qotishlarsiz vizual xotirasini asl batafsillik darajasida tekshirish imkonini beradi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f3.jpg\" alt=\"3-rasm: VISTA'ning asosiy dizayn komponentlari va har bir qadamdagi konveyeri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm: VISTA'ning asosiy dizayn komponentlari va har bir qadamdagi konveyeri.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-rasm: VISTA'ning asosiy dizayn komponentlari va har bir qadamdagi konveyeri. Misol tariqasida ARC-AGI-3 olingan. (a) Vizual kuzatuvlar: model render qilingan vizual holatlarni qabul qiladi. (b) Yo'qotishlarsiz vizual xotira: har bir qaytarilgan kadr o'zining asl shaklida saqlanadi. (c) Model tomonidan boshqariladigan vizual tekshirish: model fikrlash jarayonida o'rganish uchun kadrlar va sohalarni tanlaydi. (d) Har bir qadamdagi konveyer: agent kuzatadi, fikrlaydi va harakat qiladi, shu bilan birga har bir qaytarilgan kadr vizual xotirada saqlanadi. O'tgan kuzatuvlarni qayta ko'rib chiqish va eslatmalarni yangilash model tomonidan boshqariladigan ixtiyoriy qadamlardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f4.jpg\" alt=\"4-rasm: ARC-AGI-3 muhitidagi traektoriya namunasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm: ARC-AGI-3 muhitidagi traektoriya namunasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm: ARC-AGI-3 muhitidagi traektoriya namunasi. Har bir kadr o'z qadami va harakati bilan belgilangan; ×N takrorlanuvchi harakatlarni bildiradi. Ramkalar nishonlarni, doiralar esa agentning bosishlarini (kliklarini) ko'rsatadi. Agent qoidalarni aniqlashi kerak: qora figuralar ko'zgu chizig'i bo'ylab o'z akslari bilan birga harakatlanadi va barcha sariq nishonlar yopilishi kerak. 3-darajada harakatlanuvchi gorizontal ko'zgu chizig'i va tanlanadigan figuralar kiritiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f9.jpg\" alt=\"Rasm 9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 9&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f11.jpg\" alt=\"11-rasm: Baholash muhitlari va natijalari.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-rasm: Baholash muhitlari va natijalari.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;11-rasm: Baholash muhitlari va natijalari. Tepada: uchta benchmarkdan namunalar. GameWorld va AI GameStore interaktiv, BabyVision esa statik hisoblanadi. Pastda: GPT-5.6 Sol bilan ishlaydigan VISTA'ning inson o'yinchilari va minimal interfeysdan foydalanadigan rasmiy realizatsiya bilan solishtirilishi. Biz GameWorld uchun muvaffaqiyat darajasi va progressni, AI GameStore uchun insonga nisbatan normallashtirilgan ballarning geometrik o'rtacha qiymatini (inson medianasi = 100) va BabyVision uchun aniqlikni keltiramiz. Shtrixli chiziq avval xabar qilingan eng yaxshi natijani ko'rsatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f12.jpg\" alt=\"Rasm 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 12&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f13.jpg\" alt=\"13-rasm: ARC-AGI-3 topshirig'idagi (ID BP35) to'liq VISTA traektoriyasi, har bir harakat uchun bitta kadr (3-daraja). 3-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;13-rasm: ARC-AGI-3 topshirig'idagi (ID BP35) to'liq VISTA traektoriyasi, har bir harakat uchun bitta kadr (3-daraja). 3-darajada bosilganda yo'qoladigan va qayta bosilganda yana paydo bo'ladigan to'q sariq blok kiritiladi. Agent to'silgan yo'ldan o'tish uchun uni olib tashlashi yoki o'yinchining halokatli binafsha tikanlarga ko'tarilishining oldini olish uchun uni qayta tiklashi mumkin.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f14.jpg\" alt=\"14-rasm: GPT-5.6 Sol bilan ARC-AGI-3 doirasidan tashqaridagi to'rtta VISTA traektoriyasi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;14-rasm: GPT-5.6 Sol bilan ARC-AGI-3 doirasidan tashqaridagi to'rtta VISTA traektoriyasi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;14-rasm: GPT-5.6 Sol bilan ARC-AGI-3 doirasidan tashqaridagi to'rtta VISTA traektoriyasi. Yuqori qatorda GameWorld o'yinlari, pastki qatorda esa BabyVision vazifalari ko'rsatilgan. Yuqori chapda: Minecraft Clone o'yinida agent temirni toshdan ajratish uchun tezkor kirish panelini va ruda tomirini kattalashtirib, makon bo'ylab ko'zdan kechiradi. Yuqori o'ngda: Pac-Man o'yinida u butun labirintni ko'rish uchun joriy va boshlang'ich kadrlarga qayta tashrif buyurib, vaqt bo'ylab ko'zdan kechiradi. Pastki chapda: Connect the Lines o'yinida agent taqdim etilgan tasvir ruxsatida kuzatish qiyin bo'lgan yo'lni aniqlash uchun ikkita hududni kattalashtiradi, so'ngra javob berishdan oldin aniq piksel qiymatlarini o'qiydi. Pastki o'ngda: Maze o'yinida u taxtani 2× masshtabda vizuallashtiradi va keyin devor panjarasini piksel qiymatlari sifatida o'qiydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-fS1-2.jpg\" alt=\"Rasm S1 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-fS2.jpg\" alt=\"Rasm S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI vizual&lt;/text&gt;&lt;te
