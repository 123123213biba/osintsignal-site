        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"278\" cy=\"156\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"582\" cy=\"214\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · TOOLING   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;AI yashirin fikrlashni&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;o'rgana oladimi?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;AI xavfsizligini ta'minlash uchun uning fikrlash jarayonini kuzatish muhim. Yangi tadqiqot shuni ko'rsatdiki, modellar oddiy xabarlarni yashirishni oson o'rgansa-da, o'z mantiqiy jarayonlarini yashirincha amalga oshirish ularga juda qiyin. Bu xavfsizlik protokollarini buzish ehtimolini kamaytiradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Steganografik fikrlashni o'rganish oddiy xabar yashirishdan 20 barobargacha qiyinroq.&lt;/li&gt;\n&lt;li&gt;Modellar faqat qulay tuzilmali vazifalarda yashirin mantiqni qo'llay oladi.&lt;/li&gt;\n&lt;li&gt;O'qitish usullari (RL, SFT) yashirin fikrlashni shakllantirishda turlicha ta'sir ko'rsatadi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar 30B dan 975B gacha parametrli modellarni yashirin hisob-kitoblarni matn ichiga yashirish qobiliyati bo'yicha sinovdan o'tkazdilar. Asosiy vazifa sifatida oddiy matnli javoblar, yashirin vazifa sifatida esa holatlarni kuzatish (modulli yig'indi) va \"naqshli o'yin\" (A5 guruhi) tanlandi. Kodlash uchun registrni o'zgartirish, Markdown va bo'sh joylardan foydalanildi.&lt;/p&gt;\n&lt;p&gt;Natijalar shuni ko'rsatdiki, steganografik fikrlashni o'rganish oddiy xabar almashishdan 2,4 dan 20 barobar ko'proq resurs talab qiladi. Faqat \"ryukzak\" vazifasi kabi qulay tuzilmaga ega topshiriqlarda modellar yashirin mantiqni muvaffaqiyatli qo'llay oldi. Boshqa hollarda bu qobiliyatni rivojlantirish juda qiyin bo'lib chiqdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot cheklangan vazifalar doirasida o'tkazilgan, shuning uchun real dunyo sharoitida natijalar farq qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Sun'iy intellekt tizimlarini nazorat qilishda «fikrlash zanjiri» (Chain-of-thought) monitoringi muhim usul hisoblanadi. Biroq, bu usul «steganografik fikrlash» xavfi ostida qolishi mumkin, bunda katta til modellari (LLM) o‘zlarining haqiqiy mantiqiy jarayonlarini tashqi ko‘rinishidan zararsiz bo‘lib ko‘ringan matn ichiga yashiradilar. Tadqiqotlar shuni ko‘rsatdiki, trening bosimida, masalan, monitorlarga qarshi mustahkamlovchi ta’lim (RL) jarayonida modellar ikkita qo‘shni qobiliyatni rivojlantirishi mumkin: steganografik xabar almashish (yashirin ma’lumot uzatish) va kodlangan fikrlash (o‘qib bo‘lmaydigan, lekin ochiq formatdagi mantiq).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Steganografik fikrlash AI nazorati uchun jiddiy xavf tug‘diradi, chunki modellar o‘z niyatlarini oddiy matn ichiga yashirishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar modellarning steganografik fikrlashni qanchalik oson o‘zlashtirishini yuqoridagi ikki qobiliyat bilan solishtirdilar. Buning uchun uchta usul qo‘llanildi: mustahkamlovchi ta’lim (RL), kontekst ichida o‘rganish (in-context learning) va nazorat ostida nozik sozlash (SFT).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nazorat ostida nozik sozlash (SFT) — bu modelni aniq misollar asosida o‘qitish usuli bo‘lib, unda to‘g‘ri javoblar oldindan belgilab qo‘yiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ko‘pgina vazifalar uchun steganografik fikrlash faqat SFT yordamida shakllanadi, steganografik xabar almashish va kodlangan fikrlash esa barcha uchta usulda ham o‘zlashtiriladi. SFT doirasida ham steganografik fikrlashni o‘rganish uchun xabar almashishga qaraganda kamida ikki baravar ko‘p trening talab qilinadi, ba’zi model-vazifa kombinatsiyalarida esa bu qobiliyat umuman shakllanmaydi. Biroq, agar vazifa ma’lumotni yashirish uchun qulay bo‘lsa, steganografik fikrlash har qanday o‘qitish usulida muvaffaqiyatli o‘zlashtirilishi mumkin.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Steganografik fikrlashni o‘rganish uchun ma’lum sharoitlar (yashirish uchun qulay vazifa) talab qilinadi, bu esa uni oddiy kodlash usullariga qaraganda murakkabroq qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Modelning fikrlash zanjirini (CoT) tahlil qilish xavfsizlikni ta'minlashning muhim vositasiga aylandi. Biroq, bu usulning samaradorligi CoT modelning ichki jarayonlarini qanchalik aniq aks ettirishiga bog'liq. «Ishonchsizlik» (unfaithfulness) xavfi mavjud, ya'ni CoT'dagi matn modelning haqiqiy mantiqiga mos kelmasligi mumkin. Ko'p bosqichli hisob-kitoblarni talab qiladigan vazifalarda CoT zaruriy vosita bo'lib, bu shunday xulosaga kelishga imkon beradi: agar zanjirda ma'lum bir bosqichning tavsifi bo'lmasa, demak, model tegishli kognitiv qobiliyatlardan foydalanmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Asosiy xavfsizlik tahdidi — bu steganografik fikrlash bo'lib, unda model o'zining haqiqiy mulohazalarini zararsiz faoliyatni taqlid qiluvchi matn ichiga yashiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Steganografik fikrlash — bu «qoralama»dan bir vazifani hal qilish uchun foydalanish, shu bilan birga yakuniy matn go'yoki boshqa mavzuga bag'ishlangandek ko'rinishidir. Mualliflar ta'kidlashicha, bu hodisa oddiy CoT ishonchsizligidan yoki steganografik xabar almashishdan farq qiladi, chunki unda model ma'lumotlarni shunchaki yashirmaydi, balki ulardan hisob-kitob uchun foydalanadi. Hozirgi vaqtda steganografik fikrlash real modellarda kuzatilmagan.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Steganografik fikrlash — bu model bir narsa haqida «o'ylaydigan», lekin boshqa narsa haqida yozadigan, o'zining haqiqiy niyatlarini neytral kontent ostida yashiradigan yashirin jarayondir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ishda xulq-atvorni aniqlashning uchta usuli qo'llanildi: kontekstli o'qitish (in-context learning), mustahkamlash orqali o'qitish (RL) va nazorat ostida nozik sozlash (SFT). Tajribalarda Qwen3.6-35B-A3B va Qwen3.5-397B-A17B modellari, shuningdek, to'rtta oiladan oltita model (30B dan 975B parametrgacha) ishlatildi. Tadqiqot shuni ko'rsatdiki, steganografik xabar almashish va kodlangan fikrlash modellarda oson o'zlashtiriladi, steganografik fikrlash esa juda qiyin. Istisno bu «ryukzak» (knapsack) vazifasi bo'ldi, unda steganografik fikrlash barcha o'qitish usullarida namoyon bo'ldi, chunki vazifa tuzilishi yashirin hisob-kitoblarni osonlikcha kiritishga imkon berdi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Natijalar shuni ko'rsatadiki, steganografik fikrlash boshqa yashirin xulq-atvor shakllariga qaraganda o'zlashtirish ancha qiyin, faqat tanlov erkinligi yuqori bo'lgan maxsus vazifalar bundan mustasno.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"natijalar\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#natijalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Natijalar&lt;/span&gt;&lt;/a&gt;Natijalar&lt;/h3&gt;\n&lt;p&gt;Tadqiqot shuni ko'rsatadiki, uchta xulq-atvor turi — xabar almashish (messaging), kodlangan mulohaza (encoded reasoning) va steganografik mulohaza — o'rganish qobiliyatida bir xil tafovutni namoyon qiladi: dastlabki ikkitasi oxirgisiga qaraganda ancha oson o'zlashtiriladi (1-rasm).&lt;/p&gt;\n&lt;h4 id=\"in-context-learning\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#in-context-learning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;In-context learning&lt;/span&gt;&lt;/a&gt;In-context learning&lt;/h4&gt;\n&lt;p&gt;Kontekstli o'rganish (in-context learning) tajribalarida modellar WildChat so'rovlarini bajarib, javob ichiga yashirin vazifani (ikkilik holatni kuzatish yoki A5) joylashtirdilar. 10 qadamli ketma-ketliklar va turli formatlash sxemalari ishlatildi. Xabar almashish uchun ko'plab «model-sxema» juftliklari ham yashirin, ham aniq bo'lib chiqdi (2a-rasm), steganografik mulohaza uchun esa bunday juftliklar deyarli yo'q (2b-rasm). Pozitsiyalar bo'yicha tahlil (S2, S3-rasmlar) shuni ko'rsatdiki, steganografik mulohazada model faqat dastlabki qiymatlarni to'g'ri kodlaydi, qolganlari esa tasodifiy taxmin darajasida qoladi. Bu shuni anglatadiki, modellar dastlabki qadamlarni yashirincha hisoblab, keyin ularni shunchaki yozib qo'yadi, kodlashdan keyingi hisob-kitoblar uchun «qoralama» sifatida foydalanmaydi. Knapsack vazifasida (9 qadam) faqat GPT-5.5 modeli 92% yashirin vazifa aniqligi bilan 100% kodlash aniqligiga erishdi (bazaviy daraja 46%, p &amp;lt; 0.001).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Steganografik mulohaza kodlashdan oraliq hisob-kitoblar uchun «qoralama» sifatida foydalanishni talab qiladi, buni modellar ko'p hollarda bajara olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In-context learning — bu modelning vaznlarini o'zgartirmasdan, faqat promptdagi misollar yordamida vazifani bajarish qobiliyati.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"reinforcement-learning\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#reinforcement-learning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Reinforcement learning&lt;/span&gt;&lt;/a&gt;Reinforcement learning&lt;/h4&gt;\n&lt;p&gt;GRPO algoritmi yordamida (Qwen3.6-35B-A3B modeli) mustahkamlash orqali o'rganishda (RL) xabar almashish va kodlangan mulohaza 100 qadam ichida deyarli mukammal aniqlikka erishdi. 5 qadamli vazifada steganografik mulohaza 760-qadamda 69% aniqlikdan o'ta olmadi. Biroq, 9 qadamli knapsack vazifasida model steganografik mulohazani muvaffaqiyatli o'zlashtirdi va 100% kodlash aniqligiga erishdi. Katta hajmdagi Qwen3.5-397B-A17B modeli esa faqat yakuniy natija uchun mukofotlanganda ham, vazifani to'g'ri bajarish uchun kodlashni mustaqil ravishda tanladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Steganografik mulohazaning RLdagi muvaffaqiyati vazifa murakkabligi va model hajmiga bog'liq: kichik modellar ko'pincha bosqichma-bosqich rag'batlantirishsiz «qoralama» bilan ishlay olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"supervised-fine-tuning\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#supervised-fine-tuning\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Supervised fine-tuning&lt;/span&gt;&lt;/a&gt;Supervised fine-tuning&lt;/h4&gt;\n&lt;p&gt;1-jadval modellarni o'qitish uchun zarur bo'lgan misollar sonini ko'rsatadi. Xabar almashish (Msg) uchun steganografik mulohazaga (Reasoning) qaraganda ancha kam ma'lumot talab qilinadi. Masalan, Qwen3.6-35B-A3B modeli uchun markdown sxemasidan foydalanilganda ma'lumotlar sarfidagi tafovut 20 baravargacha yetadi.&lt;/p&gt;\n&lt;h4 id=\"xatolarni-kiritish\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#xatolarni-kiritish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xatolarni kiritish&lt;/span&gt;&lt;/a&gt;Xatolarni kiritish&lt;/h4&gt;\n&lt;p&gt;Xatolarni kiritish (2.7-bo‘lim) tajribasi doirasida tadqiqotchilar muvaffaqiyatli yakunlangan model yugurishlari o‘z kodlash jarayonidagi bitta qiymat buzilganda, o‘z izlarini (trace) qayta o‘qiy olish qobiliyatini tekshirdilar (to‘liq tahlil R ilovasida keltirilgan). Natijalar shuni ko‘rsatdiki, dastlabki uch-to‘rt pozitsiyadan keyin hech bir nazorat nuqtasi (checkpoint) haqiqiy izni tiklay olmaydi. Knapsack RL, Qwen va Inkling-Small modellarida kiritilgan xato saqlanib qoladi va hisoblash zanjiri bo‘ylab uzatiladi. Nemotron-3-Super va gpt-oss-120B modellari esa mantiqiy izchillikni butunlay yo‘qotib, na haqiqiy, na buzilgan ma’lumotlarga mos kelmaydigan qiymatlarni hosil qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Haqiqiy qiymatlarni tiklash faqat dastlabki pozitsiyalarda amalga oshadi, shundan so‘ng modellar xatoni o‘zlashtiradi yoki natija butunlay izdan chiqadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Faqat eng boshlang‘ich bosqichlardagina ayrim nazorat nuqtalari to‘g‘ri qiymatni qayta hisoblashga qodir. Bu chegara kontekstli o‘rganish (in-context learning) va mustahkamlovchi o‘rganish (RL) jarayonlaridagi cheklovlar bilan bir xil bo‘lib, unda qisman kodlash modellarga ma’lum bir chegaradan o‘tishga imkon bermaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Xatolarni kiritish (error injection) — sun’iy intellektning barqarorligini tekshirish usuli bo‘lib, unda ma’lumotlarga ataylab xato kiritiladi va modelning shovqinli muhitda o‘zini qanday tutishi hamda xatolarni tuzatish qobiliyati baholanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"muhokama\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#muhokama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Muhokama&lt;/span&gt;&lt;/a&gt;Muhokama&lt;/h3&gt;\n&lt;p&gt;Natijalar shuni ko'rsatadiki, modellar steganografik xabar almashish va kodlangan mulohaza yuritishni alohida-alohida oson o'zlashtiradi, ammo ularning kombinatsiyasi — steganografik mulohaza yuritish — ancha qiyin. Kontekstli o'rganish (in-context learning) yoki mustahkamlash orqali o'rganish (RL) usullarida bu ko'nikma ko'pincha shakllanmaydi, SFT (fine-tuning) usulida esa ancha ko'p resurs talab qiladi. Yukxalta (knapsack) masalasi bundan mustasno, u yerda steganografik mulohaza barcha uchta usulda namoyon bo'ldi.&lt;/p&gt;\n&lt;h4 id=\"steganografiya-va-mulohaza-yuritish-ortasidagi-ozaro-tasir\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#steganografiya-va-mulohaza-yuritish-ortasidagi-ozaro-tasir\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Steganografiya va mulohaza yuritish o'rtasidagi o'zaro ta'sir&lt;/span&gt;&lt;/a&gt;Steganografiya va mulohaza yuritish o'rtasidagi o'zaro ta'sir&lt;/h4&gt;\n&lt;p&gt;Qiyinchilik shundaki, model bir marta ishlash (forward pass) jarayonida bir nechta operatsiyani bajarishi kerak. Xabar almashish faqat qiymatni kodlashni talab qilsa, steganografik mulohaza yuritish dekodlash, hisoblash va kodlashni asosiy matn bilan bir vaqtda bajarishni talab qiladi. Modellarda bu jarayonlarni bir vaqtda bajarish uchun ichki mexanizmlar yetishmaydi.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!important] Modellar vazifaning qismlarini oson bajaradi, lekin ularni birlashtira olmaydi, bu esa steganografik mulohazani murakkablashtiradi.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"tuzilmaviy-asosiy-vazifalar-steganografiyani-osonlashtiradi\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#tuzilmaviy-asosiy-vazifalar-steganografiyani-osonlashtiradi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tuzilmaviy asosiy vazifalar steganografiyani osonlashtiradi&lt;/span&gt;&lt;/a&gt;Tuzilmaviy asosiy vazifalar steganografiyani osonlashtiradi&lt;/h4&gt;\n&lt;p&gt;Yukxalta masalasida steganografik mulohaza barqaror bo'ldi. Buning sababi, kodlash pozitsiyalari asosiy vazifani bajarishni talab qilmaydi: tanlovlar ixtiyoriy, bu esa jarayonni oddiy kodlashga aylantiradi. Bu shuni ko'rsatadiki, steganografiya «ahamiyatsiz» yoki takrorlanuvchi tanlovlar ko'p bo'lgan joylarda xavfliroqdir.&lt;/p&gt;\n&lt;h4 id=\"kodlangan-iz-hisoblash-uchun-ishlatiladimi\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#kodlangan-iz-hisoblash-uchun-ishlatiladimi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kodlangan iz hisoblash uchun ishlatiladimi?&lt;/span&gt;&lt;/a&gt;Kodlangan iz hisoblash uchun ishlatiladimi?&lt;/h4&gt;\n&lt;p&gt;Kodlashning yuqori aniqligi model haqiqatan ham o'z izi (trace) orqali mulohaza yuritayotganini anglatmaydi. Biroq, ikkita dalil izdan foydalanilayotganini ko'rsatadi: birinchidan, A5 holatini kuzatish murakkabligi sababli yashirin hisob-kitoblar uzun ketma-ketliklarda ishlamaydi. Ikkinchidan, izga xatolik kiritilganda, modellar to'g'ri zanjirni tiklay olmaydi, bu ularning yozib qo'yilgan ma'lumotlarga bog'liqligini tasdiqlaydi.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!tip] «Iz» (trace) — bu model o'z mulohazalarini «eslab qolish» uchun matnda qoldiradigan oraliq yozuvlar.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h4 id=\"cot-monitoringi-uchun-oqibatlar\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#cot-monitoringi-uchun-oqibatlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CoT monitoringi uchun oqibatlar&lt;/span&gt;&lt;/a&gt;CoT monitoringi uchun oqibatlar&lt;/h4&gt;\n&lt;p&gt;Natijalar dalda beruvchi: hozirgi modellar to'liq steganografik mulohazadan hali yiroq. Biroq, takrorlanuvchi elementlar (masalan, o'zgaruvchilar nomlari) bo'lgan vazifalarda xavf saqlanib qoladi va bu monitoring tizimlari uchun alohida e'tibor talab qiladi.&lt;/p&gt;\n&lt;h4 id=\"cheklovlar\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#cheklovlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar&lt;/span&gt;&lt;/a&gt;Cheklovlar&lt;/h4&gt;\n&lt;p&gt;Bizning tajribalarimiz modellarning qobiliyat chegarasini belgilaydi. Biz aniq ko'rsatmalar va intensiv o'qitishdan foydalandik, bu vazifani osonlashtiradi. Boshqa tomondan, biz juda murakkab kodlash sxemalarini tanlagan bo'lishimiz mumkin. Biz laboratoriyalarni bu usullarni kuchliroq modellar bilan sinab ko'rishga chaqiramiz.&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;[!warning] Tajribalar faqat qobiliyatlarning yuqori chegarasini ko'rsatadi; real sharoitda yashirin xatti-harakatlar boshqacha namoyon bo'lishi mumkin.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;h4 id=\"asosiy-xulosalar-va-kelajakdagi-tadqiqotlar\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#asosiy-xulosalar-va-kelajakdagi-tadqiqotlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy xulosalar va kelajakdagi tadqiqotlar&lt;/span&gt;&lt;/a&gt;Asosiy xulosalar va kelajakdagi tadqiqotlar&lt;/h4&gt;\n&lt;p&gt;Turli model oilalari, yordamchi vazifalar va ma'lumotlarni olish usullarini qamrab olgan tadqiqotimiz shuni ko'rsatdiki, LLM uchun steganografik mulohaza yuritishni o'rganish uning tarkibiy qismlarini o'zlashtirishdan ko'ra ancha qiyinroq. Bu qobiliyat faqat juda tor ixtisoslashgan stsenariylarda yoki bazaviy ko'nikmalar uchun zarur bo'lganidan bir necha barobar ko'proq ma'lumotlar bilan boshqariladigan nozik sozlash (SFT) jarayonida namoyon bo'ladi. Ushbu natijalar real sharoitlarda alohida ko'nikmalarning namoyish etilishiga asoslangan xulosalarni qayta ko'rib chiqishga undaydi va fikrlash zanjiri (CoT) monitoringi samaradorligini pasaytirishi mumkin bo'lgan tahdidlarning yuzaga kelishigacha bo'lgan masofani baholashga imkon beradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Steganografik mulohaza yuritish alohida komponentlarga qaraganda ancha ko'p ma'lumot va maxsus shartlarni talab qiladi, bu esa hozircha CoT monitoringining ishonchliligini saqlab qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Olingan natijalar kelgusi ishlar uchun ikkita asosiy yo'nalishni belgilab beradi. Birinchidan, istiqbolli modellarni steganografik mulohaza yuritishni o'rganish qiyinligi bo'yicha sinovdan o'tkazishda davom etish zarur. Agar modellar buni o'zlashtira olmaslikda davom etsa, CoT monitoringi usullariga bo'lgan ishonch asosli bo'lib qoladi. Vaziyat to'satdan o'zgargan taqdirda, bunday sakrashga olib kelgan shart-sharoitlarni zudlik bilan tahlil qilish talab etiladi. Ikkinchidan, modellarning steganografik mulohaza yuritishni o'rganishi mumkin bo'lgan holatlarni batafsil o'rganish juda muhim. Bizning ryukzak vazifamiz (knapsack task) buning iloji borligini isbotlaydi va CoT monitoringi xavfsizlik vositasi sifatida ishonchsiz bo'lib qoladigan chegaralarni tushunish uchun asos yaratadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Steganografik mulohaza yuritish — bu mantiqiy xulosaning yashirin shakli bo'lib, unda model ma'lumotni fikrlash zanjiri orqali shunday uzatadiki, u tashqi nazorat tizimlari uchun sezilmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"usullar\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#usullar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar&lt;/span&gt;&lt;/a&gt;Usullar&lt;/h3&gt;\n&lt;h4 id=\"sozlash-va-vazifa-tuzilishi\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#sozlash-va-vazifa-tuzilishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sozlash va vazifa tuzilishi&lt;/span&gt;&lt;/a&gt;Sozlash va vazifa tuzilishi&lt;/h4&gt;\n&lt;p&gt;Biz modelning CoT (fikrlash zanjiri) funksiyasini bo‘sh teglar bilan o‘chirib, steganografik fikrlashni tahlil qilamiz. Bu modelning o‘z fikrlash jarayoniga ta’sirini yo‘qotib, yashirin vazifani bajarish qobiliyatini aniqlashga imkon beradi. Har bir stsenariy uch qismdan iborat: asosiy tabiiy til so‘rovi, yashirin hisoblash (yordamchi vazifa) va kodlash sxemasi. Model asosiy matnni (covertext) yozadi, unga yordamchi vazifa holatini singdiradi va yakuniy javobni «####» belgisidan keyin taqdim etadi.&lt;/p&gt;\n&lt;h4 id=\"shartlar\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#shartlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Shartlar&lt;/span&gt;&lt;/a&gt;Shartlar&lt;/h4&gt;\n&lt;p&gt;Metodologiya kutilayotgan xatti-harakatga qarab o‘zgaradi (1-rasm). Steganografik xabar almashish hisoblashni talab qilmaydi, shunchaki raqamlarni kodlaydi. Kodlangan fikrlash esa hisoblash jarayonini o‘qib bo‘lmaydigan formatda (so‘z prefiksi) ajratib ko‘rsatadi. Steganografik fikrlash esa har ikkala usulni birlashtiradi: model asosiy javob ichiga yashirin fikrlashni to‘qiydi. Natijalar CoT bo‘lmagan va CoT mavjud bo‘lgan bazaviy modellar bilan solishtiriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Steganografiya — bu ma’lumotni oddiy matn ichida yashirin holda uzatish usuli bo‘lib, u tashqi kuzatuvchiga sezilmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"yordamchi-vazifalar\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#yordamchi-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Yordamchi vazifalar&lt;/span&gt;&lt;/a&gt;Yordamchi vazifalar&lt;/h4&gt;\n&lt;p&gt;Biz ikkita holatni kuzatish vazifasidan foydalanamiz. Birinchisi — «m moduli bo‘yicha yig‘indi» (m=3 yoki m=2). Bu TC⁰ murakkablik sinfiga kiradi va model uni parallel hisoblashi mumkin. Ikkinchisi — A5 (beshta stakan bilan o‘yin), bu NC¹-to‘liq vazifa bo‘lib, uzoq ketma-ketliklar uchun modeldan holatni chiqish matniga yozishni talab qiladi.&lt;/p&gt;\n&lt;h4 id=\"asosiy-vazifalar\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#asosiy-vazifalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy vazifalar&lt;/span&gt;&lt;/a&gt;Asosiy vazifalar&lt;/h4&gt;\n&lt;p&gt;Uchta vazifa turi qo‘llaniladi: WildChat (foydalanuvchi so‘rovlari), AQuA-RAT (ko‘p bosqichli mantiqiy savollar) va «Ryukzak» (Knapsack) masalasi. «Ryukzak» masalasida model predmetlarni tanlash orqali ikkilik kodni (bitlarni) asosiy javobga singdiradi.&lt;/p&gt;\n&lt;h4 id=\"kodlash-sxemalari\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#kodlash-sxemalari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kodlash sxemalari&lt;/span&gt;&lt;/a&gt;Kodlash sxemalari&lt;/h4&gt;\n&lt;p&gt;1-jadvalda ma’lumotlarni kiritish usullari keltirilgan. Oltita format (kapitalizatsiya, Markdown, bo‘sh joylar, gap belgilari, undovlar va qator o‘tkazish) matn mazmunini o‘zgartirmasdan ma’lumotni yashirishga imkon beradi. «Ryukzak» kodlashi faqat shu nomdagi vazifa uchun, so‘z prefiksi esa faqat kodlangan fikrlash uchun ishlatiladi.&lt;/p&gt;\n&lt;h4 id=\"monitor-va-shubhalilik\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#monitor-va-shubhalilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Monitor va shubhalilik&lt;/span&gt;&lt;/a&gt;Monitor va shubhalilik&lt;/h4&gt;\n&lt;p&gt;Javoblarning yashirinligini baholash uchun GPT-5-mini (S1-jadval) monitor-modelidan foydalaniladi. U o‘qish qatori olib tashlangan matnni tahlil qilib, 1 dan 10 gacha shubhalilik ballini beradi. Yuqori ball asosiy vazifaga aloqador bo‘lmagan ma’lumotlar mavjudligini bildiradi. Agar shubhalilik ko‘rsatkichi 3 dan oshmasa, javob «yashirin» (covert) deb hisoblanadi. Bu binar chegara sxemalarni tanlash (3.1-bo‘lim) va 2-rasmda yashirinlik sohasini belgilash uchun ishlatiladi. Boshqa hollarda shubhalilikning o‘rtacha qiymati qo‘llanadi. Monitorning ishonchliligi nazorat ma’lumotlarida tekshirilgan: u oddiy matnni sezilmas, aniq qo‘shimchalarni esa shubhali deb to‘g‘ri tasniflaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Shubhalilik — bu model javobining kutilgan uslubdan qanchalik chetga chiqishini baholovchi ko‘rsatkich bo‘lib, u yashirin ma’lumot uzatish kanallarini aniqlashga yordam beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metrikalar\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#metrikalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metrikalar&lt;/span&gt;&lt;/a&gt;Metrikalar&lt;/h4&gt;\n&lt;p&gt;Kodlash aniqligi — bu model javobidan to‘g‘ri dekodlangan yordamchi vazifaning oraliq qiymatlari ulushi. Bu o‘quv egri chiziqlarini tuzishdagi asosiy ko‘rsatkichdir. Biz shuningdek, qiymatning ketma-ketlikdagi o‘rniga qarab aniqlikni tahlil qilamiz. Yordamchi vazifa javobining aniqligi (o‘qish qatori to‘g‘ri bo‘lgan misollar ulushi) yashirin hisob-kitoblar muvaffaqiyatini ko‘rsatadi. Taqqoslash uchun asosiy daraja sifatida modelning mulohazasiz (no-CoT) unumdorligi olinadi. Ushbu chegaradan oshib ketish hisob-kitoblar yashirin emas, balki kodlash kanali orqali o‘tayotganini isbotlaydi. Iz (trace) haqiqatan ham ishlatilayotganini tekshirish uchun biz undagi bitta qiymatni ataylab buzamiz va xatolik natijaga ta’sir qilishini kuzatamiz (4.1-bo‘lim).&lt;/p&gt;\n&lt;h4 id=\"malumotlarni-olish-ssenariylari\"&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html#malumotlarni-olish-ssenariylari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ma’lumotlarni olish ssenariylari&lt;/span&gt;&lt;/a&gt;Ma’lumotlarni olish ssenariylari&lt;/h4&gt;\n&lt;p&gt;Kontekstli o‘rganish (in-context learning) rejimida biz 8 ta modelni (Artificial Analysis reytingidan 6 ta va 2 ta Qwen modeli) oldindan belgilangan kodlash sxemalari bilan sinab ko‘ramiz. Model faqat ma’lumotlar shifrlangan kirish iboralarini yaratadi. GRPO algoritmi va Qwen-3.6-35B-A3B modeli yordamida mustahkamlash orqali o‘rganish (RL) rejimida mukofot dekodlash aniqligi asosida hisoblanadi va monitorning shubhalilik jarimasi bilan tuzatiladi. Agar model sxemani o‘zi ishlab chiqsa, u yangi kontekstda dekoder vazifasini ham bajaradi. Nazorat ostida nozik sozlashda (SFT) biz 6 ta modeldan (30B dan 975B parametrgacha) foydalanib, ularni yordamchi ma’lumotlar qo‘shimchalari bilan o‘qitamiz. Statistik ahamiyatlilik 90% Wilson intervallari va ikki tomonlama z-testlar yordamida baholanadi.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-f3.jpg\" alt=\"Rasm 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-fS1.jpg\" alt=\"Rasm S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-fS2.jpg\" alt=\"Rasm S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-fS3.jpg\" alt=\"Rasm S3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm S3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-fS4.jpg\" alt=\"Rasm S4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&g
