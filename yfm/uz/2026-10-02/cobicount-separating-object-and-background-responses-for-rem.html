        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"175\" cy=\"85\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"485\" cy=\"242\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SAT_IMAGERY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellekt yordamida&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;sun'iy yo'ldosh tasvirlarini&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;avtomatik hisoblash&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/cobicount.html\"&gt;COBICount&lt;/a&gt; usuli neyron tarmoqlarning ob'ektlarni landshaft elementlari bilan adashtirib yuborish muammosini hal qiladi. Model faqat bitta manba asosida o'qitiladi va qo'shimcha ma'lumotlarsiz yangi hududlarda ishlay oladi. Bu yondashuv turli sharoitlarda olingan tasvirlarda ob'ektlarni aniq hisoblash imkonini beradi.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;COBICount javoblarni yaratish, tekshirish va shovqinni bostirishni ajratadi.&lt;/li&gt;\n&lt;li&gt;Model qayta o'qitishsiz yangi ma'lumotlar to'plamlarida ishlaydi.&lt;/li&gt;\n&lt;li&gt;DOTA ma'lumotlarida o'rtacha mutlaq xatolik 174,132 ga teng.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tizim uch bosqichli jarayondan iborat: nomzodlarni yaratish (CE), ularning ixchamligini tekshirish (CA) va noto'g'ri signallarni bostirish (BI). An'anaviy modellar ko'pincha yo'l chetlari yoki tom qismlarini ob'ekt deb qabul qiladi, bu esa statistikani buzadi. COBICount takrorlanuvchi fon tuzilmalarini ajratib oladi va maqsadli hududlar uchun alohida belgilashni talab qilmaydi.&lt;/p&gt;\n&lt;p&gt;Model RSOC (binolar) ma'lumotlar to'plamida o'qitilib, DOTA (transport va kemalar) ob'ektlarida sinovdan o'tkazildi. 512x512 o'lchamdagi tasvir uchun 5,07 million parametr va 17,41 milliard operatsiyadan foydalangan holda, o'rtacha mutlaq xatolik (&lt;a href=\"concepts/mean-absolute-error.html\"&gt;MAE&lt;/a&gt;) 174,132 ni tashkil etdi. Bu usul yangi sharoitlarga moslashmasdan turib, yuqori aniqlikka erishish mumkinligini ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul sifatli dastlabki belgilashni talab qiladi va ob'ektlar o'lchami keskin o'zgarganda samaradorlik pasayishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Masofadan &lt;a href=\"concepts/probing.html\"&gt;zondlash&lt;/a&gt; tasvirlarida obyektlarni sanash — bu aerofotosuratlar va sun'iy yo'ldosh tasvirlaridagi binolar, transport vositalari yoki kemalar sonini aniqlash vazifasidir. Nazorat ostida o'qitiladigan aksariyat usullar zichlik xaritasini yaratadi, bunda piksel qiymatlarining yig'indisi obyektlar sonini beradi. Biroq, bunday modellar ko'pincha obyektlar toifalari, o'lchamlari va fon sharoitlarining bir xilligini nazarda tutadi, bu esa ularni maqsadli ma'lumotlarsiz boshqa hududlarga yoki sensor turlariga moslashtirishni qiyinlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mualliflar maqsadli ma'lumotlarga kirish imkoni bo'lmaganda (&lt;a href=\"concepts/source-only-counting.html\"&gt;source-only&lt;/a&gt;) obyektlarni sanash uchun COBICount usulini taklif qilishadi, bu fon tuzilmalaridagi xatoliklarni kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;\"Faqat manba ma'lumotlarida\" (source-only) o'qitish vazifasida model bir xil toifadagi obyektlar va o'xshash tasvir sharoitlariga ega bo'lgan tasvirlar to'plamida o'qitiladi, bunda har bir obyekt bitta nuqta bilan belgilanadi. Maqsadli tasvirlar model tayyor bo'lgunga qadar mavjud bo'lmaydi. Asosiy muammo shundaki, model fonning takrorlanuvchi elementlarini (yo'l chetlari, tom chegaralari, to'xtash joylari yoki qirg'oq chiziqlari) obyekt deb xato qabul qilishi mumkin. COBICount usuli jarayonni uch bosqichga ajratadi: nomzodlarni generatsiya qilish (CE), ularni tasdiqlash (CA) va fonni bostirish (BI). BI takrorlanuvchi fon tuzilmalari bilan bog'liq javoblarni ajratib oladi, CA esa faqat obyektlar markazidagi ixcham javoblarni saqlab qoladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;\"Source-only\" usuli modelni faqat manba ma'lumotlarida o'qitishni va maqsadli ma'lumotlarsiz ishlashni anglatadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Model RSOC (binolar) ma'lumotlar to'plamida o'qitildi va DOTA (yirik va kichik transport vositalari, kemalar) ma'lumotlarida sinovdan o'tkazildi. COBICount solishtirilgan usullar orasida eng past o'rtacha mutlaq xatolikni (MAE) ko'rsatdi — 174.132. Model 5.07 million parametrga ega va 512 × 512 o'lchamdagi tasvirni qayta ishlash uchun 17.41 milliard suzuvchi nuqtali operatsiyani (FLOPs) talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Usul samaradorligi modelning o'ziga xos tasvir sharoitlarida o'qitilgani bilan cheklangan, domen keskin o'zgarganda aniqlik pasayishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu tadqiqot masofadan zondlash (DZZ) tasvirlarida «source-only counting» sharoitida obyektlarni sanash muammosini o‘rganadi. Maqsadli domenning belgilangan ma’lumotlarini talab qiladigan an’anaviy usullardan farqli o‘laroq, bu yondashuv faqat bitta belgilangan manba domenidan (masalan, RSOC Building) foydalanadi. O‘qitilgan model keyinchalik yangi, ko‘rilmagan domenlarga (masalan, DOTA Large Vehicle, Small Vehicle, Ship yoki DIOR Airplane) qo‘llaniladi. Model faqat obyekt markazlaridagi nuqtali annotatsiyalar asosida o‘qitiladi va o‘qitish jarayonida maqsadli tasvirlar yoki ularning statistik parametrlaridan foydalanilmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Source-only counting usuli har bir yangi hudud yoki sensor uchun ma’lumotlarni yig‘ish va belgilash zaruriyatini yo‘qotib, modelni tezkor joriy etish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu yondashuvdagi asosiy muammo — «&lt;a href=\"concepts/neopredelennost-proishozhdeniya-kandidata.html\"&gt;nomzod kelib chiqishining noaniqligi&lt;/a&gt;» (candidate origin ambiguity). Model fon elementlarini (tom chegaralari, yo‘l chiziqlari, port tuzilmalari) manba ma’lumotlarida o‘rganilgan obyektlar bilan adashtirishi mumkin. Shuningdek, fazoviy masshtab farqlari (masalan, manba domenidagi bino va maqsadli domendagi kichik avtomobil) tufayli modelning haqiqiy obyektlarga bo‘lgan javobi fon tuzilmalariga nisbatan zaifroq bo‘lishi mumkin. MAE va RMSE kabi standart metrikalar bu xatolarni to‘liq ochib bera olmaydi, chunki ular faqat umumiy sonni hisoblaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nomzod kelib chiqishining noaniqligi — bu modelning yuqori javob qaytarishi, lekin uning haqiqiy obyektga yoki fonning tasodifiy geometrik naqshiga tegishli ekanligini aniqlashning imkonsizligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu muammolarni hal qilish uchun COBICount usuli taklif etilgan. U uchta komponentdan iborat: Candidate Evidence (CE) mumkin bo‘lgan javoblar xaritasini yaratadi, Candidate Acceptance (CA) manba annotatsiyalari naqshlariga mos keladigan javoblarni ajratib oladi, Bias Isolation (BI) esa fon tuzilmalari bilan bog‘liq shovqinlarni bostiradi. Audit nomli qo‘shimcha modul faqat manba ma’lumotlari bilan o‘qitilib, yakuniy zichlik xaritasiga ta’sir qilmasdan javob naqshlarini tekshiradi. COBICount RSOC Building manbasida o‘qitilganda DOTA domenlarida eng past o‘rtacha MAE ko‘rsatkichini qayd etdi.&lt;/p&gt;\n&lt;p&gt;Izlanish uchta asosiy jihatga tayanadi: nuqtali annotatsiyalar bo‘yicha obyektlarni sanash, domenlar almashinuvida ma’lumotlarga bo‘lgan talablar va model javoblarining haqiqiy obyektlarga nisbatan joylashuvini tekshirish usullari.&lt;/p&gt;\n&lt;p&gt;Masofadan zondlash tasvirlaridagi obyektlarni sanash odatda obyektni aniqlash (detection) yoki &lt;a href=\"concepts/point-supervision.html\"&gt;nuqtali nazorat&lt;/a&gt; (point supervision) usullari orqali amalga oshiriladi. DOTA, xView, DIOR va FAIR1M kabi an'anaviy usullar obyektlarni chegaralovchi ramkalar (bounding boxes) yordamida belgilaydi. Garchi ramkalar obyektning o'rni va hajmini aniq ko'rsatsa-da, ko'plab mayda obyektlar mavjud tasvirlarda ularni belgilash juda qimmatga tushadi. Shuningdek, aniqlash usullari obyektlarni o'tkazib yuborish yoki takroriy aniqlash kabi xatoliklarga moyil.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Nuqtali nazorat (point supervision) — bu obyektning markaziga bitta nuqta qo'yish orqali amalga oshiriladigan belgilaash usuli bo'lib, u ma'lumotlar to'plamini tayyorlash jarayonini sezilarli darajada tezlashtiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Nuqtali nazorat usuli annotatsiya yukini kamaytiradi. Bunda nuqtalar zichlik xaritasiga aylantiriladi va tarmoq ushbu xaritani bashorat qilishni o'rganadi, yakuniy son esa xarita qiymatlarini yig'ish orqali olinadi. MCNN kabi dastlabki modellar obyekt o'lchamlaridagi o'zgarishlarni boshqarish uchun parallel konvolyutsion ustunlardan foydalangan, CSRNet esa kengaytirilgan konvolyutsiyalardan foydalanib, tasvirning kattaroq qismini kuzatish imkonini bergan. Bayesian Loss va TransCrowd kabi zamonaviy usullar esa noaniqlikni hisobga olish va uzoq masofadagi hududlarni bog'lash uchun transformatorlardan foydalanadi.&lt;/p&gt;\n&lt;p&gt;Masofadan zondlash tasvirlaridagi obyektlar o'lchami turlicha bo'lib, fon ko'pincha yo'llar, tomlar va avtoturargoh chiziqlari kabi takrorlanuvchi elementlar bilan to'la. RSOC kabi maxsus ma'lumotlar to'plamlari binolar, kemalar va transport vositalari uchun nuqtali belgilarni o'z ichiga oladi. PSGCNet kabi arxitekturalar piramidal masshtablardan, TASNet esa uch tomonlama diqqat (triple attention) mexanizmlaridan foydalanadi. BDRNet esa zichlik regressiyasini obyektlar egallagan hududlarni bashorat qiluvchi yordamchi chiqish bilan birlashtiradi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mavjud usullar o'qitish va test sharoitlari bir xil bo'lganda yuqori aniqlik ko'rsatadi, ammo ular sensor, ruxsat (resolution) yoki fon o'zgarganda modelning barqarorligini kafolatlamaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Hisoblashdagi past xatolik model obyektlarni to'g'ri tushunayotganini anglatmaydi: ko'pincha zichlik xaritasidagi yuqori qiymatlar haqiqiy obyektlarga emas, balki fondagi takrorlanuvchi tuzilmalarga noto'g'ri bog'lanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/adaptatsiya-domenov.html\"&gt;Domen adaptatsiyasi&lt;/a&gt; (domain adaptation) modellarni o'qitish jarayonida maqsadli sohadagi tasvirlardan foydalanishga imkon beradi. Raqobatli o'qitish (adversarial training) modelga manba va maqsadli namunalarni ajratib bo'lmaydigan xususiyatlarni aniqlashga yordam beradi. Masofadan zondlashda bu yondashuvlar sensorlar, hududlar va tasvirga olish sharoitlaridagi o'zgarishlarni qoplash uchun, jumladan, nazoratsiz segmentatsiya uchun qo'llaniladi. Biroq, adaptatsiya ishga tushirishdan oldin maqsadli namunalarni talab qiladi va har bir yangi domen uchun qayta o'qitishni taqozo etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Domen adaptatsiyasi — bu modelni bir manba ma'lumotlaridan boshqa, yangi sharoitdagi ma'lumotlarga moslashtirish jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Domenlarni umumlashtirish (domain generalization) esa o'qitish jarayonida maqsadli tasvirlardan foydalanmaydi. MLDG kabi usullar mavjud ma'lumotlarni vaqtinchalik o'quv va test to'plamlariga ajratib, domen o'zgarishlarini simulyatsiya qiladi. «Gradient jarrohligi» kabi usullar esa turli manbalardan keladigan yangilanishlar o'rtasidagi ziddiyatlarni kamaytiradi. Sanash bo'yicha tadqiqotlarda guruhlararo umumiy ma'lumotlarni ajratib oluvchi yoki bitta manbadan foydalanuvchi (masalan, MPCount) usullar mavjud bo'lib, ular modelni tasvir transformatsiyalariga chidamli bo'lishga o'rgatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Domenlarni umumlashtirish maqsadli ma'lumotlarni yig'ish zaruratini yo'qotadi, ammo bir nechta belgilangan manba domenlarining mavjudligini talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Oldindan o'qitilgan modellar, masalan, tasvir va matnni bog'lovchi CLIP yoki Segment Anything Model (SAM), belgilash hajmini qisqartirishga yordam beradi. Masofadan zondlashda SatMAE va SatMAE++ kabi usullar tasvirlarning yashirin qismlarini vaqtinchalik va spektral xususiyatlarni hisobga olgan holda tiklaydi. RemoteCLIP va GeoRSCLIP esa «tasvir-matn» bog'lanishini aerokosmik ma'lumotlar uchun moslashtiradi. Biroq, bu modellar faqat xususiyatlar yoki maskalarni beradi, lekin to'g'ridan-to'g'ri sanash vazifasini hal qilmaydi, chunki maska har doim ham obyektlarni bir-biridan ajratib bera olmaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Oldindan o'qitilgan modellar obyektlarni aniq lokallashtirish zaruratini bartaraf etmaydi, chunki ular zich to'plangan obyektlarni yoki fon shovqinlarini har doim ham alohida birlik sifatida ajrata olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CA moduli model javoblarini &lt;a href=\"concepts/filtratsiya.html\"&gt;filtrlash&lt;/a&gt; orqali har bir aniqlangan signalning yakuniy zichlik xaritasiga o'tish darajasini nazorat qiladi. Tizim to'rtta xaritani bashorat qiladi: A_c (markaz), A_o (soha), A_q (sifat) va A_r (ishonchlilik). Yakuniy niqob &lt;span class=\"yfm-latex\" data-content=\"A%20%3D%20A_c%20%5Codot%20A_o%20%5Codot%20(0.35%20%2B%200.65A_q)%20%5Codot%20(0.35%20%2B%200.65A_r)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ko'rinishida hosil qilinadi. A_c va A_o xaritalari nishon nuqtasiga yaqinlik asosida o'qitiladi. CA qattiq shakl qoidalaridan foydalanmaydi, balki nuqtali superviziya orqali fazoviy darvozalarni o'rganadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CA javoblarni nishon nuqtalari atrofida to'plash va shovqinni bostirish orqali aniqlikni oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BI takrorlanuvchi naqshlar (yo'llar, to'xtash joylari) tufayli yuzaga keladigan noto'g'ri signallarni bostiradi. Modul to'rtta xavf xaritasini baholaydi: Bbg (fon), Bline (chiziqlar), Bbroad (keng tuzilmalar) va Bgrid (to'rlar). Bu xaritalar ob'ektlarni tasniflash orqali emas, balki zichlik va bostirish funksiyalari orqali o'qitiladi. BI shuningdek, Sobel operatori G va Laplasian Klap = [-4] kabi o'zgarmas transformatsiyalardan foydalanadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Sobel va Laplasian operatorlari tasvirdagi keskin o'zgarishlar va chegaralarni aniqlash uchun ishlatiladigan matematik usullardir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Audit — bu asosiy hisob-kitoblarga ta'sir qilmaydigan yordamchi blok. U ichki xususiyatlarni transport, binolar, kemalar va fon kabi to'rtta kanalga aylantiradi. Bu kanallar tasniflagich emas, balki tarmoqning qaysi tuzilmalarga javob berayotganini tushunish uchun vizual nazorat vositasidir.&lt;/p&gt;\n&lt;p&gt;O'qitish uchun &lt;span class=\"yfm-latex\" data-content=\"P_s%20%3D%20%5C%7Bp_i%5C%7D_%7Bi%3D1%7D%5E%7BN%5E*%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; nuqtalar to'plamidan foydalaniladi. Chiqish to'ri &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3D%204\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; qadamga ega bo'lgani uchun koordinatalar masshtablanadi. Zichlik nishoni D^*(u) har bir nuqtada σ_p = 1.15 kenglikdagi Gauss yadrolarini joylashtirish orqali quriladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Modelning aniqligi to'liq nuqtali annotatsiyalar sifatiga bog'liq.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;O‘qitish jarayonida D^* zichlik va Tσ xaritalari manba tasvirlardagi annotatsiyalar asosida quriladi. Markaziy nuqtalar (Tpeak) va qo‘llab-quvvatlash hududlari (Tsup) uchun maksimal qiymati 1 bo‘lgan Gauss taqsimotidan foydalaniladi. Asosiy niqoblar: Mpt (markazlar), Msup (qo‘llab-quvvatlash), Mfg (9×9 dilatatsiya orqali himoya zonasi) va Mbg (fon).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tpeak va Tsup xaritalari σ_s=2.35 parametri bilan obyekt markazlari va ularning ta’sir zonalarini aniq ajratishga xizmat qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Zichlik yo‘qotishi Lden silliqlangan L₁-norma yordamida hisoblanadi va obyektlar soni Nnorm ga normallashtiriladi. Umumiy hisobdagi xatolikni kamaytirish uchun nisbiy (Lrel cnt) va logarifmik (Llog cnt) jarimalar qo‘llaniladi, bu esa katta raqamli diapazonlarning ta’sirini yumshatadi.&lt;/p&gt;\n&lt;p&gt;CA komponentlari ω_c, ω_o, ω_s fazoviy og‘irliklari bilan binar kross-entropiya (LBCE) orqali o‘qitiladi. BI (Background Intelligence) to‘rtta jarima (Lbgv, Lline, Lbroad, Lgrid) orqali o‘qitiladi, bunda &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2zopcnox\"&gt;stop gradient&lt;/code&gt; (sg) operatori yordamida gradientlar bloklanadi. \"Yolg‘on pozitivlar\" (hard negatives) uchun Lhn jarimasi kiritilgan bo‘lib, u fon deb belgilangan hududlarda yuqori javob qaytargan modelni jazolaydi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zibs0bel\"&gt;stop gradient&lt;/code&gt; (sg) operatori xarita qiymatini saqlab qoladi va xatolikni orqaga tarqatish jarayonida uning og‘irliklarini o‘zgartirishga yo‘l qo‘ymaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Tarmoq tarmoqlarini muvozanatlash uchun Lent entropiya va Lbal balans jarimalari ishlatiladi. 10-epoxadan boshlab binolar va fon kanallarini aniqlashtirish uchun audit (Laud) faollashadi. Umumiy yo‘qotish funksiyasi L barcha ko‘rsatkichlarning yig‘indisi bo‘lib, dastlabki 8 epoxada c_e koeffitsienti bilan oshirib boriladi.&lt;/p&gt;\n&lt;p&gt;Inference bosqichida model avval b_S zichlik xaritasi va &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BN%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; obyektlar sonini hisoblaydi. So‘ngra ochko‘z (greedy) algoritmi qo‘llaniladi: b_S dan $ au = \\max(0.020, 0.28 \\cdot \\max(b_S))$ chegarasidan yuqori bo‘lgan lokal maksimumlar ajratib olinadi. Tanlangan nuqtalar bir-biridan kamida 3.2 katak (taxminan 12.8 piksel) masofada bo‘lishi kerak, umumiy nuqtalar soni Kpt ≤ 1024 bilan cheklangan.&lt;/p&gt;\n&lt;p&gt;Eksperimentlar «faqat manba» (source-only counting) rejimida o'tkaziladi. RSOC, DOTA yoki DIOR to'plamlaridagi domenlar (manba/maqsad) oldindan belgilanmagan bo'lib, har bir test uchun alohida tayinlanadi. Manba domeni ma'lum bir tasvir sharoitidagi obyektlar toifasini o'z ichiga oladi va modelni o'qitish hamda tanlash uchun xizmat qiladi. Maqsadli domen esa model tanlangunga qadar yashirin qoladigan boshqa toifa yoki sharoitdir. Asosiy tajribada RSOC Building manba sifatida ishlatiladi: o'qitish to'plami vaznlarni yangilaydi, validatsiya to'plami esa «&lt;a href=\"concepts/chekpoint.html\"&gt;chekkopoint&lt;/a&gt;» (model holati)ni belgilaydi. Keyin model DOTA Large Vehicle (LV), DOTA Small Vehicle (SV) va DOTA Ship domenlarida sinovdan o'tkaziladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Model faqat RSOC Building ma'lumotlarida o'qitiladi, so'ngra qotiriladi va hech qanday qo'shimcha moslashuvsiz DOTA'ning uchta mustaqil domenida baholanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chekkopoint — bu validatsiya to'plamida eng yaxshi natija ko'rsatgan va yakuniy test uchun saqlab qo'yilgan neyron tarmoq holati.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DOTA'dagi obyektlarni baholash uchun yo'naltirilgan to'rtburchaklar, DIOR'da esa chegaralovchi ramkalar ishlatiladi. Unifikatsiya uchun algoritmlar ularning markaziy nuqtasini oladi, bu hisoblash uchun yagona yo'riqnoma bo'lib xizmat qiladi. O'qitish jarayonida obyektlarning o'lchami yoki yo'nalishi hisobga olinmaydi.&lt;/p&gt;\n&lt;p&gt;Metodlar samaradorligi o'rtacha mutlaq xatolik (MAE) va o'rtacha kvadratik xatolik (RMSE) orqali aniqlanadi. DOTA'ning uchta maqsadli domeni bo'yicha umumiy baho uchun MT-MAE (LV, SV va Ship uchun MAE o'rtacha qiymati) ishlatiladi. Barcha metodlar uchun kirish tasvirlarining uzun tomoni 2000 pikseldan oshmasligi uchun masshtablanadi. Bu qoida barcha hisob-kitoblar uchun bir xil qo'llaniladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2000 piksel hajmidagi cheklov qat'iy qoida bo'lib, u juda mayda obyektlarni aniqlash aniqligiga ta'sir qilishi mumkin.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Solishtirishda MCNN, CSRNet, P2PNet, TransCrowd kabi 13 ta arxitektura qatnashadi. Barcha modellar, jumladan masofadan zondlash uchun ixtisoslashgan (BDRNet) va bazaviy (MPCount) modellar RSOC Building'da «faqat manba» rejimida qayta o'qitilgan. Hech bir metod moslashish yoki parametrlarni tanlash uchun maqsadli ma'lumotlarga ega emas.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f1.jpg\" alt=\"Rasm 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f2.jpg\" alt=\"Rasm 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f4.jpg\" alt=\"Rasm 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f5.jpg\" alt=\"Rasm 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f6.jpg\" alt=\"Rasm 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f7.jpg\" alt=\"Rasm 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 7&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#tadqiqot-sxemasi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tadqiqot sxemasi&lt;/span&gt;&lt;/a&gt;Tadqiqot sxemasi&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;SAVOL&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Fondagi&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;noto'g'ri&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;aniqlashlar&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;USUL&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Generatsiya va&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;filtratsiyani&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ajratish&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6
