        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"167\" cy=\"95\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"573\" cy=\"218\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SYNTHETIC   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Sun'iy intellekt matnlari&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;nega modellarni&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;zaiflashtiradi&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f1.jpg\" alt=\"1-rasm. AI tomonidan yaratilgan veb-matn faqat ma'lumotlar yetishmaydigan modellarga yordam beradi va aks holda hisoblas\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. AI tomonidan yaratilgan veb-matn faqat ma'lumotlar yetishmaydigan modellarga yordam beradi va aks holda hisoblash xarajatlarini talab qiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. AI tomonidan yaratilgan veb-matn faqat ma'lumotlar yetishmaydigan modellarga yordam beradi va aks holda hisoblash xarajatlarini talab qiladi. Chapda: &lt;a href=\"concepts/pangram-3-3-2.html\"&gt;Pangram 3.3.2&lt;/a&gt; hujjatlaridagi AI yoki aralash deb belgilangan veb-tokenlarning oylar bo'yicha ulushi. Faqat AI ulushi 2024-yil iyunida 10%, 2025-yil iyunida 16%, 2026-yil iyunida 28% va 2026-yil avgustida 31% ni tashkil qiladi. O'rtada: 268 million parametrda qo'shilgan bitta AI tokeni uchun qonunimizning qiymati, inson tokenlarida, 5 dan 100 &lt;a href=\"concepts/tokens-per-parameter.html\"&gt;TPPh&lt;/a&gt; gacha: 5 TPPh da ijobiy, 20 TPPh dan boshlab nolga tushadi, qachonki u taxminan 0,08 dan oshsa. O'ngda: filtrlanmagan veb-krauling uchun hisoblash xarajatlari uning AI ulushi uchun 20 TPPh (268 million parametr) da inson to'plamida o'qitishga mos kelishi kerak: 2026-yil avgustidagi 31% da 1,6× va 2027 va 2028-yil oxirlari uchun 42% va 51% prognozlarda 2,1× va 3,0×.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Internet sun'iy intellekt tomonidan yaratilgan kontent bilan to'lib bormoqda, bu esa yangi modellarni o'qitish uchun ma'lumotlar sifatini o'zgartirmoqda. Mualliflar 800 ta modelni tahlil qilib, sun'iy intellekt matnlari ma'lum bir chegaradan oshganda o'qitish jarayoniga zarar yetkazishini isbotladilar. Ma'lumotlar bazasini sun'iy kontent bilan kengaytirish o'rniga, sifatli inson matnlarini takrorlash samaraliroqdir.&lt;/p&gt;\n&lt;h2 id=\"asosiysi\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#asosiysi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiysi&lt;/span&gt;&lt;/a&gt;Asosiysi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;2026-yil avgustiga kelib veb-ma'lumotlarda sun'iy intellekt ulushi 31,1% ga yetdi.&lt;/li&gt;\n&lt;li&gt;Sun'iy intellekt matni faqat ma'lumot yetishmovchiligi bo'lgan modellar uchun foydali.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; va DCLM filtrlari sun'iy intellekt kontentini afzal ko'radi.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"usullar-va-aniqlik\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#usullar-va-aniqlik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va aniqlik&lt;/span&gt;&lt;/a&gt;Usullar va aniqlik&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Usul&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ma'lumotlar&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Aniqlik&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Cheklov&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Pangram 3.3.2&lt;/td&gt;\n&lt;td&gt;Common Crawl veb-matnlari&lt;/td&gt;\n&lt;td&gt;FPR 0,05%, FNR 1,99%&lt;/td&gt;\n&lt;td&gt;Eski matnlarda xatolik bo'lishi mumkin&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;FineWeb filtrlash&lt;/td&gt;\n&lt;td&gt;Common Crawl hujjatlari&lt;/td&gt;\n&lt;td&gt;Sun'iy matnni 2,3 barobar ko'proq o'tkazadi&lt;/td&gt;\n&lt;td&gt;Sun'iy kontentga moyillik&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"batafsil\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#batafsil\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Batafsil&lt;/span&gt;&lt;/a&gt;Batafsil&lt;/h2&gt;\n&lt;p&gt;Tadqiqotchilar &lt;a href=\"concepts/wildai.html\"&gt;WildAI&lt;/a&gt; korpusidan (83 mlrd token) va ma'lumotlarni inson va sun'iy intellekt matnlariga ajratish uchun Pangram 3.3.2 klassifikatoridan foydalandilar. Tahlil shuni ko'rsatdiki, Common Crawl'dagi sun'iy intellekt kontenti ulushi 2024-yildagi 10,1% dan 2026-yil avgustiga kelib 31,1% gacha o'sgan. FineWeb va DCLM kabi mavjud sifat filtrlari sun'iy intellekt matnlarini inson matnlariga qaraganda 2,3–9,8 barobar ko'proq o'tkazib yuboradi.&lt;/p&gt;\n&lt;p&gt;Ta'sirni baholash uchun 800 ta model (19,9 mln dan 973 mln parametrgacha) o'qitildi. Ma'lum bo'lishicha, ma'lumotlar tanqisligi bo'lgan modellar uchun sun'iy intellekt matnlari foydali bo'lishi mumkin, ammo &lt;a href=\"concepts/zakon-masshtabirovaniya-chinchilla.html\"&gt;Chinchilla&lt;/a&gt;-optimal byudjetga (har bir parametrga 20 token) yetganda foyda yo'qoladi. Keyingi sun'iy intellekt tokenlarini qo'shish xatolikni (loss) oshiradi, bu esa zararni qoplash uchun 1,6–3 barobar ko'proq hisoblash quvvatini talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Cheklovlar&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tadqiqot 973 million parametrgacha bo'lgan modellar bilan cheklangan va juda katta &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;'larga ta'sirini to'liq qamrab olmaydi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Maqolaning batafsil tahlili&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"annotatsiya\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#annotatsiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Annotatsiya&lt;/span&gt;&lt;/a&gt;Annotatsiya&lt;/h3&gt;\n&lt;p&gt;Zamonaviy neyrotarmoqlarni o‘qitish uchun ishlatiladigan ma’lumotlar bazasining asosiy qismini veb-kontent tashkil etadi va uning tarkibida sun’iy intellekt (SI) tomonidan yaratilgan matnlar ulushi ortib bormoqda. FineWeb tahliliga ko‘ra, 2026-yil iyun oyida veb-ma’lumotlardagi tokenlarning 27,5% qismi Pangram tizimi tomonidan SI mahsuli deb belgilangan, avgust oyiga kelib esa bu ko‘rsatkich 31,1% ga yetgan. Nazorat qilinadigan sintetik ma’lumotlardan farqli o‘laroq, bu «yovvoyi» SI matnlari ko‘plab turli modellar tomonidan yaratilgan, insonlar uchun mo‘ljallangan va o‘qitish korpuslariga markirovka qilinmagan holda kirib keladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Veb-ma’lumotlardagi SI kontenti ulushi 2026-yilning ikki oyi ichida 27,5% dan 31,1% gacha o‘sdi, bu modellarni o‘qitish sifatiga xavf soladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu kontentning ta’sirini baholash uchun mualliflar 19,9 milliondan 973 million parametrgacha bo‘lgan 800 ta til modelini o‘qitdilar. O‘qitish jarayonida SI tokenlari va inson tokenlarining nisbati o‘zgartirilib, &lt;a href=\"concepts/loss.html\"&gt;yo‘qotishlar funksiyasi&lt;/a&gt; (loss) tahlil qilindi. Ma’lumotlar yetishmovchiligi bo‘lgan modellar uchun SI tokenlarini qo‘shish dastlab inson matnlaridagi yo‘qotishlarni kamaytiradi, ammo bu foyda tezda to‘yinadi va keyinchalik sifatning pasayishiga olib keladi. Inson matnlarining katta hajmi bilan o‘qitilgan modellar uchun SI tokenlari yo‘qotishlarni deyarli darhol oshiradi, holbuki xuddi shuncha miqdordagi yangi inson tokenlari natijani yaxshilashda davom etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Yo‘qotishlar funksiyasi (loss) — model bashoratlari haqiqiy ma’lumotlardan qanchalik farq qilishini ko‘rsatuvchi metrika; qiymat qancha past bo‘lsa, model shunchalik yaxshi o‘qigan bo‘ladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mavjud &lt;a href=\"concepts/masshtabirovanie.html\"&gt;masshtablash&lt;/a&gt; qonunlari, masalan, Chinchilla, ma’lumotlar turlari o‘rtasidagi farqni hisobga olmaydi. Mualliflar foyda va zarar omillarini ajratib ko‘rsatadigan yangi masshtablash qonunini taklif qildilar. Kichik modellarda sinab ko‘rilganda, bu qonun 3,6 barobar kattaroq modellar uchun SI matnining ta’sirini mavjud modellarga qaraganda 41% yuqori aniqlik bilan bashorat qiladi. Hisob-kitoblarga ko‘ra, 31,1% SI ulushiga ega filtrlanmagan veb-kontentda o‘qitish, inson ma’lumotlarida o‘qitishga nisbatan 1,6 barobar ko‘proq hisoblash quvvatini talab qiladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SI kontenti 22,3% bo‘lganida, aralash validatsiya to‘plamlari o‘qitish sifatiga salbiy ta’sirni 95,5% hollarda yashirib qo‘yadi, shuning uchun metrikalarni alohida monitoring qilish zarur.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirish\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#kirish\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kirish&lt;/span&gt;&lt;/a&gt;Kirish&lt;/h3&gt;\n&lt;p&gt;Internet sun'iy intellekt tomonidan yaratilgan kontent bilan to'lib bormoqda. Pangram ma'lumotlariga ko'ra, FineWeb sifat filtrlaridan o'tgan AI-matnlarning ulushi 2024-yildagi 10,1% dan 2026-yil iyunida 27,5% gacha o'sdi va 2026-yil avgustiga kelib 31,1% ni tashkil etdi (1-rasm). Shu bilan birga, zamonaviy modellar har bir parametr uchun ~20 tokenlik «hisoblash uchun optimal» byudjetdan ancha ko'p ma'lumotlarda o'qitilmoqda; masalan, Qwen3-32B har bir parametr uchun taxminan 1100 tokendan foydalanadi. Prognozlarga ko'ra, inson tomonidan yozilgan barcha ochiq matnlar 2032-yilga kelib tugaydi. Bu ishlab chiquvchilar oldiga savol qo'yadi: AI-kontentni o'quv tanlamalarida qanday ishlatish kerak?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Internetdagi AI-matn ulushi 2026-yil avgustiga kelib 31,1% ga yetdi, modellar esa klassik Chinchilla-optimal qiymatlardan bir necha barobar ko'p ma'lumotlarda o'qitilmoqda.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar «&lt;a href=\"concepts/dikiy-ii-tekst.html\"&gt;yovvoyi» AI-matn&lt;/a&gt; ta'sirini o'rganishdi — bu modellar tomonidan insonlar uchun yozilgan va internetda tabiiy ravishda uchraydigan kontentdir. Tadqiqotda 800 ta model (19,9 milliondan 973 million parametrgacha) o'qitildi, bunda har bir inson tokeniga 64 tagacha «yovvoyi» AI-tokeni qo'shildi. Baholash C4, FineWeb va Paloma to'plamlarida o'tkazildi. Ma'lum bo'lishicha, AI-matn faqat ma'lumot tanqisligi bo'lgan modellar uchun foydali: u har bir parametr uchun 10 tokendan kam ma'lumot bo'lganda yo'qotishlarni (loss) kamaytiradi. Biroq, Chinchilla-optimumiga (20 token/parametr) erishilganda foyda yo'qoladi va AI-tokenlar ulushining ortishi yo'qotishlarni oshiradi, inson ma'lumotlari esa ularni kamaytirishda davom etadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Yovvoyi» AI-matn — bu modellar insonlar uchun yozgan va o'quv bazalariga tasodifan tushib qoladigan nazoratsiz kontentdir.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ushbu effektni tavsiflash uchun AI-matnning to'yinuvchi foydasi va logarifmik o'suvchi zararini hisobga oladigan yangi masshtablash qonuni taklif qilindi. 268 million parametrgacha o'qitilgan model, 3,6 barobar kattaroq modellarning xatti-harakatini 0,83 × 10⁻³ RMSE xatosi bilan bashorat qiladi, bu mavjud yondashuvlardan (1,41 × 10⁻³ va 4,32 × 10⁻³) ancha aniqroqdir. Tadqiqot shuni ko'rsatadiki, FineWeb va DCLM kabi joriy sifat filtrlari AI-kontentga noto'g'ri ustunlik beradi (inson matniga nisbatan 2,3 va 9,8 barobar ko'proq). 31,1% AI ulushi bilan filtrlanmagan internetda o'qitish, sof inson ma'lumotlarida o'qitishga qaraganda 1,6 barobar ko'proq hisoblash quvvatini talab qiladi, 2028-yilga kelib bu ko'rsatkich 3,0 barobargacha o'sadi. Mualliflar WildAI ma'lumotlar to'plamini (96 million hujjat) va barcha 800 ta o'qitilgan modelni ochiq e'lon qilmoqdalar.&lt;/p&gt;\n&lt;h4 id=\"2-suniy-intellekt-tomonidan-yaratilgan-veb-malumotlarni-olchash\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#2-suniy-intellekt-tomonidan-yaratilgan-veb-malumotlarni-olchash\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2 Sun'iy intellekt tomonidan yaratilgan veb-ma'lumotlarni o'lchash&lt;/span&gt;&lt;/a&gt;2 Sun'iy intellekt tomonidan yaratilgan veb-ma'lumotlarni o'lchash&lt;/h4&gt;\n&lt;p&gt;Ushbu bo'limda mualliflar insonlar va sun'iy intellekt (SI) tomonidan yaratilgan matnlarga ajratilgan WildAI nomli yirik ma'lumotlar to'plamini shakllantirish jarayonini tasvirlaydilar. Tadqiqot shuni ko'rsatadiki, 2026-yil iyun holatiga ko'ra, FineWeb sifat filtrlaridan o'tgan tokenlarning 27,5% qismi SI tomonidan yaratilgan bo'lib, bu ulush har oyda o'sib bormoqda. Mualliflar mavjud sifat filtrlari (FineWeb va DCLM) SI matnlariga nisbatan moyillik ko'rsatishini aniqladilar.&lt;/p&gt;\n&lt;p&gt;Ma'lumotlarni yig'ish va tasniflash. Asos sifatida FineWeb korpusi olindi va 2025-yil iyulidan 2026-yil iyunigacha bo'lgan Common Crawl ma'lumotlari bilan kengaytirildi. WildAI to'plami 96,04 million hujjatni (83,31 milliard token) o'z ichiga oladi. Tasniflash uchun ikki bosqichli yondashuv qo'llanildi: dastlab EditLens Llama-3.2-3B modeli 280 milliarddan ortiq tokenni belgilab chiqdi, so'ngra Pangram 3.3.2 vositasi nazorat tekshiruvini amalga oshirdi. Natijada insonlar korpusi (58,91 million hujjat, 42,19 milliard token) va SI korpusi (32,54 million hujjat, 35,32 milliard token) shakllantirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pangram 3.3.2 — xatolik darajasi past bo'lgan ixtisoslashgan klassifikator: noto'g'ri ijobiy natija 0,05%, noto'g'ri salbiy natija esa 1,99% ni tashkil etadi, bu esa ma'lumotlarni aniq ajratish imkonini beradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Kontent dinamikasi va taqsimoti. 2021-yil yanvaridan 2026-yil avgustigacha bo'lgan 310 000 hujjat tahlili SI kontenti ulushining keskin o'sishini ko'rsatdi: 2021-yil iyunidagi 0,1% dan 2024-yilda 10,1%, 2025-yilda 16,1% va 2026-yil iyunida 27,5% gacha (1-rasm, 8-rasm). 2026-yil avgustiga kelib bu ko'rsatkich 31,1% ga yetdi. Mavzular bo'yicha nomutanosiblik mavjud: masalan, o'quv qo'llanmalari SI kontentining 18,5% ni, inson matnlarining esa 6,2% ni tashkil etadi, shaxsiy bloglarda esa bu ko'rsatkich teskari (1,0% ga qarshi 8,6%).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Veb-ma'lumotlardagi SI kontenti ulushi har oy o'sib, 2026-yil avgustida 31,1% ga yetdi; mavjud sifat filtrlari SI matnlarini inson matnlariga qaraganda ancha ko'proq o'tkazib yuboradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Filtrlarning samaradorligi. 10 000 ta Common Crawl hujjati auditi FineWeb va DCLM filtrlari SI kontentiga nisbatan xolis emasligini ko'rsatdi. SI matnlari FineWeb filtridan 2,3 barobar (29,3% ga qarshi 12,8%) va DCLM filtridan 9,8 barobar (14,5% ga qarshi 1,5%) ko'proq o'tadi (2-rasm).&lt;/p&gt;\n&lt;h4 id=\"3-asoslar-va-tegishli-ishlar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#3-asoslar-va-tegishli-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3 Asoslar va tegishli ishlar&lt;/span&gt;&lt;/a&gt;3 Asoslar va tegishli ishlar&lt;/h4&gt;\n&lt;p&gt;Masshtab qonunlari asoslari. LLM o‘qitish samaradorligini bashorat qilish uchun hisoblash resurslari (C), parametrlar soni (N) va umumiy tokenlar (D) muhimdir. C ≈ 6ND formulasi asosiy hisoblanadi. Chinchilla qonuni ushbu bog‘liqlikni rasmiylashtiradi.&lt;/p&gt;\n&lt;p&gt;Takrorlanish uchun masshtab qonunlari. Chinchilla modelida noyob va takroriy tokenlar farqlanmaydi. Keyingi tadqiqotlar tokenning «samarali qiymati» tushunchasini kiritdi yoki haddan tashqari moslashish (overfitting) uchun jarima tizimini taklif qildi.&lt;/p&gt;\n&lt;p&gt;Ma’lumotlar aralashmasi va model kollapsi. Tadqiqotchilar turli domenlar va tillardagi ma’lumotlarni modellashtiradilar. Model kollapsi (AI tomonidan yaratilgan ma’lumotlarda qayta o‘qitish) bo‘yicha ishlar shuni ko‘rsatadiki, inson ma’lumotlarini saqlab qolish degradatsiyani kamaytiradi. AI matnlarining foydasi umumiy byudjetga bog‘liq.&lt;/p&gt;\n&lt;p&gt;Tabiiy muhitdagi AI matnlari. Internetdagi AI matnlari maxsus sintetik ma’lumotlardan farqli o‘laroq, o‘quvchilar va qidiruv tizimlari uchun mo‘ljallangan. Hozirgi qonunlar bu aralashmani yomon bashorat qiladi (xatolik 8.00 ga teng, mualliflar usuli esa 0.83 × 10⁻³).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;An’anaviy masshtab qonunlari «yovvoyi» AI matnlarining ta’sirini hisobga olmaydi, bu esa bashorat xatoligini oshiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"4-inson-va-ai-tomonidan-yozilgan-matnlar-uchun-masshtab-qonunlari\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#4-inson-va-ai-tomonidan-yozilgan-matnlar-uchun-masshtab-qonunlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4 Inson va AI tomonidan yozilgan matnlar uchun masshtab qonunlari&lt;/span&gt;&lt;/a&gt;4 Inson va AI tomonidan yozilgan matnlar uchun masshtab qonunlari&lt;/h4&gt;\n&lt;p&gt;Mualliflar AI tokenlarining foydasi va zararini hisobga oluvchi yangi qonunni taklif qiladilar. U C4 ma’lumotlar to‘plamida eng past xatolikni (0.83 × 10⁻³) ko‘rsatadi.&lt;/p&gt;\n&lt;h4 id=\"41-empirik-kuzatishlar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#41-empirik-kuzatishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1 Empirik kuzatishlar&lt;/span&gt;&lt;/a&gt;4.1 Empirik kuzatishlar&lt;/h4&gt;\n&lt;p&gt;Metodlar. NanoChat arxitekturasidan foydalangan holda 800 ta model o‘qitildi (19.9 mln dan 973 mln parametrgacha). TPPh (har bir parametrga to‘g‘ri keladigan tokenlar) 2.9 dan 87.5 gacha, r (AI/inson nisbati) 0 dan 64 gacha o‘zgartirildi. Baholash C4, Paloma, FineWeb va Cosmopedia asosida amalga oshirildi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TPPh — modelning o‘qitilish darajasini belgilovchi ko‘rsatkich.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Natijalar. Faqat inson matnlarida o‘qitilgan modellar Chinchilla qonunlariga amal qiladi. Biroq, AI tokenlari qo‘shilganda, inson ma’lumotlari kam bo‘lsa, ular yordam beradi, ko‘p bo‘lsa — zarar yetkazadi. Masalan, 5 TPPh da AI yo‘qotishlarni kamaytiradi, 20 TPPh da esa oshiradi (3-rasm).&lt;/p&gt;\n&lt;h4 id=\"42-mezonlar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#42-mezonlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2 Mezonlar&lt;/span&gt;&lt;/a&gt;4.2 Mezonlar&lt;/h4&gt;\n&lt;p&gt;Yangi qonun uchun beshta mezon belgilandi: token qiymatining moslashuvchanligi, foyda va zararni modellashtirish, talqin qilinishi, birinchi tokenning chekli qiymati va AI ma’lumotlari bo‘lmaganda Chinchilla qonunini tiklash.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI matnlarining salbiy ta’siri model hajmi va umumiy ma’lumotlar byudjeti ortishi bilan kuchayadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"43-ai-tomonidan-yaratilgan-matnlar-uchun-masshtablash-qonunlari\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#43-ai-tomonidan-yaratilgan-matnlar-uchun-masshtablash-qonunlari\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 AI tomonidan yaratilgan matnlar uchun masshtablash qonunlari&lt;/span&gt;&lt;/a&gt;4.3 AI tomonidan yaratilgan matnlar uchun masshtablash qonunlari&lt;/h4&gt;\n&lt;p&gt;Biz Chinchilla arxitekturasini (1-tenglama) AI ma'lumotlarining to'yinish foydasi (9-tenglama) va AI kontentining ortiqchaligi uchun jarima funksiyasi (5-tenglama) bilan birlashtirgan masshtablash qonunini ishlab chiqdik. Bizning modelimiz C4 ma'lumotlarida 0,83 × 10⁻³ xatolik ko'rsatkichiga erishadi, bu mavjud muqobillardan ustundir (1-jadval). Yo'qotish funksiyasi L(N, D_H, D_A) parametrlar hajmi N, inson ma'lumotlari D_H va AI ma'lumotlari D_A ni hisobga oladi (2-tenglama).&lt;/p&gt;\n&lt;p&gt;AI tokenlarining foydasi kreditning eksponensial shakli g(r) orqali modellashtiriladi, bu yerda r = D_A/D_H — AI matnining ulushi, R^* esa foydaning to'yinish miqyosidir. Takrorlanishni zararsiz deb hisoblaydigan modellardan farqli o'laroq, biz zarar uchun jarima kiritdik (4-tenglama), u AI ma'lumotlari hajmi oshishi bilan logarifmik tarzda sekinlashadi. Marginal zarar inson va AI tokenlari hajmi teng bo'lganda (r=1) eng yuqori cho'qqiga chiqadi. Biz qonunni 726 ta modelda (19,9–268 mln parametr) sinab ko'rdik va 74 ta modelda (973 mln parametrgacha) validatsiya qildik.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Bizning masshtablash qonunimiz mavjud modellarga qaraganda yo'qotishlarni aniqroq bashorat qiladi va AI kontenti bilan ishlashda statistik jihatdan sezilarli ustunlikka ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Masshtablash — bu model sifatining ma'lumotlar hajmi va hisoblash quvvatiga bog'liqligi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-ai-matnlarida-oqitish-effektlari-va-tavsiyalar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#5-ai-matnlarida-oqitish-effektlari-va-tavsiyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5 AI matnlarida o'qitish effektlari va tavsiyalar&lt;/span&gt;&lt;/a&gt;5 AI matnlarida o'qitish effektlari va tavsiyalar&lt;/h4&gt;\n&lt;p&gt;Prognozlar shuni ko'rsatadiki, 2028-yil oxiriga kelib FineWeb to'plamidagi AI tokenlari ulushi 50,7% ga etadi. Hozirgi AI kontenti darajasidagi filtrlanmagan ma'lumotlarda o'qitilgan modellar «toza» ma'lumotlarda o'qitilgan modellarning sifatiga erishish uchun 1,6–3,0 barobar ko'proq hisoblash quvvatini talab qiladi. Biz AI matnlarini o'quv tanlamalaridan olib tashlashni, ma'lumotlar etishmaganda esa AI generatsiyasini qo'shish o'rniga inson matnlarini takrorlashni tavsiya qilamiz.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 1.&lt;/strong&gt; Paired RMSE × 10³ ajratilgan o'lchamlarda, qanchalik past bo'lsa, shunchalik yaxshi&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Model&lt;/th&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;th&gt;2&lt;/th&gt;\n&lt;th&gt;3&lt;/th&gt;\n&lt;th&gt;4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Chinchilla (Hoffmann et al., 2022)&lt;/td&gt;\n&lt;td&gt;4.32&lt;/td&gt;\n&lt;td&gt;4.65&lt;/td&gt;\n&lt;td&gt;5.40&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Muennighoff et al. (2023)&lt;/td&gt;\n&lt;td&gt;3.96&lt;/td&gt;\n&lt;td&gt;4.21&lt;/td&gt;\n&lt;td&gt;4.94&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CD (Qin et al., 2026)&lt;/td&gt;\n&lt;td&gt;3.68&lt;/td&gt;\n&lt;td&gt;3.63&lt;/td&gt;\n&lt;td&gt;4.17&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Lovelace et al. (2026)&lt;/td&gt;\n&lt;td&gt;3.55&lt;/td&gt;\n&lt;td&gt;3.74&lt;/td&gt;\n&lt;td&gt;4.14&lt;/td&gt;\n&lt;td&gt;8.38&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ATLAS (Longpre et al., 2026)&lt;/td&gt;\n&lt;td&gt;4.36&lt;/td&gt;\n&lt;td&gt;4.72&lt;/td&gt;\n&lt;td&gt;5.51&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;He et al. (2025)&lt;/td&gt;\n&lt;td&gt;6.54&lt;/td&gt;\n&lt;td&gt;6.55&lt;/td&gt;\n&lt;td&gt;6.62&lt;/td&gt;\n&lt;td&gt;8.96&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Hamidieh et al. (2025)&lt;/td&gt;\n&lt;td&gt;3.95&lt;/td&gt;\n&lt;td&gt;4.19&lt;/td&gt;\n&lt;td&gt;4.84&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shukor additive (Shukor et al., 2025)&lt;/td&gt;\n&lt;td&gt;6.77&lt;/td&gt;\n&lt;td&gt;6.70&lt;/td&gt;\n&lt;td&gt;6.26&lt;/td&gt;\n&lt;td&gt;10.05&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shukor joint (Shukor et al., 2025)&lt;/td&gt;\n&lt;td&gt;1.41&lt;/td&gt;\n&lt;td&gt;1.50&lt;/td&gt;\n&lt;td&gt;2.25&lt;/td&gt;\n&lt;td&gt;7.80&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sedova et al. (2026)&lt;/td&gt;\n&lt;td&gt;9.60&lt;/td&gt;\n&lt;td&gt;9.59&lt;/td&gt;\n&lt;td&gt;9.57&lt;/td&gt;\n&lt;td&gt;13.32&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jain et al. (2024)&lt;/td&gt;\n&lt;td&gt;8.00&lt;/td&gt;\n&lt;td&gt;8.03&lt;/td&gt;\n&lt;td&gt;8.04&lt;/td&gt;\n&lt;td&gt;9.34&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours&lt;/td&gt;\n&lt;td&gt;0.83&lt;/td&gt;\n&lt;td&gt;0.85&lt;/td&gt;\n&lt;td&gt;1.28&lt;/td&gt;\n&lt;td&gt;6.77&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"51-filtrlamaslikning-narxi\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#51-filtrlamaslikning-narxi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.1 Filtrlamaslikning narxi&lt;/span&gt;&lt;/a&gt;5.1 Filtrlamaslikning narxi&lt;/h4&gt;\n&lt;p&gt;Biz aralash ma'lumotlarda (22,3% AI kontenti) va «toza» inson subto'plamlarida o'qitilgan modellarni taqqosladik. Ma'lumotlar hajmi kamroq bo'lishiga qaramay, inson matnlaridagi modellar C4 da pastroq yo'qotishlarni ko'rsatdi (5-rasm). Bizning qonunimiz 19 ta juftlikdan 18 tasida filtrlashning afzalligini to'g'ri bashorat qildi. Drift bilan tasodifiy yurish tahlili shuni tasdiqlaydiki, AI matnlari ulushining o'sishi tufayli modellarning hisoblash samaradorligi pasayadi: 2028-yilda «toza» model darajasiga erishish uchun 3 barobar ko'proq resurs kerak bo'ladi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI matnlaridan o'qitish uchun foydalanish faqat maqsadli vazifa aynan AIga o'xshash kontent yaratish bo'lganda oqlanadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/filtratsiya.html\"&gt;Filtrlash&lt;/a&gt; — model degradatsiyasini oldini olish uchun o'quv korpusidan past sifatli yoki sintetik ma'lumotlarni olib tashlash jarayoni.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"inson-malumotlarini-takrorlash-yaxshiroqmi-yoki-ai-malumotlarini-qoshishmi\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#inson-malumotlarini-takrorlash-yaxshiroqmi-yoki-ai-malumotlarini-qoshishmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inson ma'lumotlarini takrorlash yaxshiroqmi yoki AI ma'lumotlarini qo'shishmi?&lt;/span&gt;&lt;/a&gt;Inson ma'lumotlarini takrorlash yaxshiroqmi yoki AI ma'lumotlarini qo'shishmi?&lt;/h4&gt;\n&lt;p&gt;19,9 mln va 35,8 mln parametrli modellar bilan o'tkazilgan tajribalar shuni ko'rsatdiki, inson tokenlarini takrorlash AI matnlarini qo'shishdan samaraliroqdir. Bir marta takrorlashdan so'ng C4 dagi yo'qotishlar 2,3% ga pastroq bo'ldi, sakkiz marta takrorlashdan so'ng esa farq 6,3–6,4% gacha oshdi.&lt;/p&gt;\n&lt;h4 id=\"52-ai-matnlarida-oqitish-qachon-ozini-oqlaydi\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#52-ai-matnlarida-oqitish-qachon-ozini-oqlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.2 AI matnlarida o‘qitish qachon o‘zini oqlaydi?&lt;/span&gt;&lt;/a&gt;5.2 AI matnlarida o‘qitish qachon o‘zini oqlaydi?&lt;/h4&gt;\n&lt;p&gt;AI kontentidan foydalanish ma’lumotlar yetishmovchiligi sharoitida va maqsadli AI matnlari bilan ishlashda foydalidir. Inson matnini bashorat qilishda AI ma’lumotlari faqat original materiallar kam bo‘lganda samarali bo‘ladi: C4 to‘plamida AI matnining optimal ulushi 5 TPPh byudjetida 37% ni tashkil etsa, 20 TPPh da 1,0% gacha tushadi (6-rasm). FW22 va Paloma to‘plamlari uchun ham xuddi shunday qonuniyatlar kuzatiladi. AI matnlarida o‘qitishda esa optimal ulush har qanday byudjetda 90% dan yuqori bo‘lib qoladi, bir AI tokenining qiymati 20 ta inson tokenidan yuqori baholanadi (7-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Inson ma’lumotlarida o‘qitish uchun AI matnining optimal ulushi 20 TPPh gacha oshganda 1% gacha kamayadi, AI kontentini yaratish uchun esa bu ko‘rsatkich 90% dan oshadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;AI matnlarida o‘qitish modellarning generatsiya uslubini o‘zgartiradi. Agentli ish jarayonlarida modellar bir-biri bilan tobora ko‘proq o‘zaro ta’sir qiladi, shuning uchun AI uslubini tushunish muhim ahamiyat kasb etadi. Biroq, bu modelning o‘z generatsiyasini ham o‘zgartiradi: 268M modellar uchun 1000 ta so‘zga to‘g‘ri keladigan tipik AI iboralari soni 0,16 dan (AI matnisiz) r=1 bo‘lganda 0,36 gacha va r=4 bo‘lganda 0,54 gacha o‘sadi. Pangram testida AI tomonidan yaratilgan deb tasniflangan hikoyalar ulushi ikki baravar ko‘payadi (37,2% ga qarshi 18,6%, 13-jadval).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;r — o‘qitish tanlamasidagi AI matnining inson matniga nisbatan koeffitsiyenti.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mualliflar o‘qitish va baholashda AI hamda inson matnlarini ajratishni tavsiya qiladilar. Ularni alohida domenlar sifatida ko‘ruvchi modellar eng yuqori aniqlikni ko‘rsatadi. Ajratish formatlardagi farqlar bilan oqlanadi: masalan, o‘quv materiallari AI tokenlarining 18,5% ini, inson tokenlarining esa atigi 6,2% ini tashkil qiladi. AI matnini bashorat qilish osonroq bo‘lgani uchun, uni tanlamaga qo‘shish FW26 ning AI segmentida yo‘qotishlarni kamaytiradi, ammo 44% hollarda inson segmentida yo‘qotishlarni oshiradi. 2026-yilgi krauling ma’lumotlariga ko‘ra, AI matnining 22,3% ulushida aralash validatsiya 95,5% holatlarni xato ravishda yaxshilanish deb baholaydi (6-rasm). Yo‘qotishlar to‘g‘risidagi hisobotlarni inson va AI matnlari uchun alohida taqdim etish tavsiya etiladi.&lt;/p&gt;\n&lt;h3 id=\"xulosa\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#xulosa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Xulosa&lt;/span&gt;&lt;/a&gt;Xulosa&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 6.&lt;/strong&gt; Moslashtirilgan budjetlarning TPF qiymatlari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Budjet&lt;/th&gt;\n&lt;th&gt;Qiymat&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;26.93&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;28.41&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;29.74&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;30.91&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;477M 90 budjetiga ega emas; 973M 55, 75 yoki 90 budjetlariga ega emas.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 11.&lt;/strong&gt; 1-jadvalning r &amp;lt; 1 bo'lgan cheklangan test yugurishlari uchun juftlik xatolari&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Parametr&lt;/th&gt;\n&lt;th&gt;Qiymat&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;2.93&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;3.18&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;3.82&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;7.75&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Veb-krouling yetib bora oladigan diapazon (bizning 2026-yilgi kroulingimiz r = 0.29; AI va inson matnining teng taqsimlanishi r = 1).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 5.&lt;/strong&gt; Thetraininggrid.Eachcellisonehuman-onlycontrolplusthenumberofAI-additionrunsand,after theplussign,fresh-human-additionrunsonthesamehumancorpus.Sizesmarked†,belowtherule,arereserved: everylawisscoredonthemandnoneisfittedonthem.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT5.jpg\" alt=\"Jadval 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 2.&lt;/strong&gt; ForecastAIshareofwebtokenseachDecember.TheintervalsareStudent-tpredictionintervalsthat includetheuncertaintyofthedrift.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT2.jpg\" alt=\"Jadval 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 3.&lt;/strong&gt; Thesevenmodelsizes.Allusethenanochatarchitecture.Ninthescalinglawscountstheinput &lt;a href=\"concepts/embedding.html\"&gt;embedding&lt;/a&gt;;thelastcolumnsubtractsit.Reservedsizes(†)enternofit.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT3.jpg\" alt=\"Jadval 3\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"asosiy-xulosalar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#asosiy-xulosalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Asosiy xulosalar&lt;/span&gt;&lt;/a&gt;Asosiy xulosalar&lt;/h4&gt;\n&lt;p&gt;Sun'iy intellekt (SI) tomonidan yaratilgan matnlarning filtrlanmagan veb-ma'lumotlardagi ulushi 25% dan oshdi va o'sishda davom etmoqda. 800 ta oldindan o'qitilgan modellarni tahlil qilish shuni ko'rsatdiki, bunday kontent faqat ma'lumotlar yetishmovchiligi bo'lgan modellar uchun foydali, Chinchilla qonuniga mos keladigan modellar uchun esa yo'qotishlarni oshiradi. Biz taklif qilgan qonun foydaning to'yinish effektini va zararning logarifmik o'sishini tavsiflaydi. Ushbu model o'qitilgan tizimlarga qaraganda 3,6 baravar kattaroq modellarni bashorat qiladi va inson matnlarida mavjud bo'lgan 11 ta muqobil usuldan ko'ra kamroq xatolik ko'rsatadi.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Muhim&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2026-yil avgustiga kelib SI matnlarining ulushi 31,1% ni tashkil etishi kutilmoqda, bu esa filtrlanmagan veb-ma'lumotlarda o'qitish uchun hisoblash quvvatini 1,6 baravarga, 2028-yilga kelib esa 3,0 baravarga oshirishni talab qiladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cheklovlar-va-kelgusi-ishlar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#cheklovlar-va-kelgusi-ishlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va kelgusi ishlar&lt;/span&gt;&lt;/a&gt;Cheklovlar va kelgusi ishlar&lt;/h4&gt;\n&lt;p&gt;Bizning qonunimiz 268 million parametrgacha bo'lgan modellarda kalibrlangan va 973 million parametrgacha sinovdan o'tkazilgan. Kattaroq modellar o'quv ma'lumotlarini eslab qolishga moyil bo'lgani uchun, ular zaifroq LLM naqshlarini o'zlashtirishi mumkin. Biz faqat ingliz tilidagi veb-matnlarni o'rgandik. Kelgusi tadqiqotlar SI kontentini filtrlash, SI matni foydali bo'lgan sohalarni aniqlash va modellarni SI kiritilgan ma'lumotlarni tushunishga o'rgatishga qaratilishi kerak.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Izoh&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Chinchilla qonuni — bu model hajmi va o'quv ma'lumotlari hajmi o'rtasidagi optimal nisbatni belgilovchi empirik qoida.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ehtiyot bo'ling&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tajribada foydalanilgan modellar haqiqiy samaradorlikni baholash uchun juda kichik, shuning uchun natijalar dastlabki xarakterga ega.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f1.jpg\" alt=\"1-rasm. AI tomonidan yaratilgan veb-matn faqat ma'lumotlar yetishmaydigan modellarga yordam beradi va aks holda hisoblas\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-rasm. AI tomonidan yaratilgan veb-matn faqat ma'lumotlar yetishmaydigan modellarga yordam beradi va aks holda hisoblash xarajatlarini talab qiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-rasm. AI tomonidan yaratilgan veb-matn faqat ma'lumotlar yetishmaydigan modellarga yordam beradi va aks holda hisoblash xarajatlarini talab qiladi. Chapda: Pangram 3.3.2 hujjatlaridagi AI yoki aralash deb belgilangan veb-tokenlarning oylar bo'yicha ulushi. Faqat AI ulushi 2024-yil iyunida 10%, 2025-yil iyunida 16%, 2026-yil iyunida 28% va 2026-yil avgustida 31% ni tashkil qiladi. O'rtada: 268 million parametrda qo'shilgan bitta AI tokeni uchun qonunimizning qiymati, inson tokenlarida, 5 dan 100 TPPh gacha: 5 TPPh da ijobiy, 20 TPPh dan boshlab nolga tushadi, qachonki u taxminan 0,08 dan oshsa. O'ngda: filtrlanmagan veb-krauling uchun hisoblash xarajatlari uning AI ulushi uchun 20 TPPh (268 million parametr) da inson to'plamida o'qitishga mos kelishi kerak: 2026-yil avgustidagi 31% da 1,6× va 2027 va 2028-yil oxirlari uchun 42% va 51% prognozlarda 2,1× va 3,0×.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f2.jpg\" alt=\"2-rasm. AI tomonidan belgilangan veb-matn bir nechta formatlarga moyil va sifat filtrlaridan inson matniga qaraganda tez\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-rasm. AI tomonidan belgilangan veb-matn bir nechta formatlarga moyil va sifat filtrlaridan inson matniga qaraganda tez-tez o'tadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-rasm. AI tomonidan belgilangan veb-matn bir nechta formatlarga moyil va sifat filtrlaridan inson matniga qaraganda tez-tez o'tadi. Chapda: 2026-yil yanvaridan iyunigacha eng ko'p va eng kam ifodalangan beshta format uchun AI tomonidan belgilangan har bir formatdagi tokenlarning inson tomonidan belgilangan tokenlar ulushiga nisbati. O'ngda: har bir FineWeb bosqichidan keyin qolgan 2026-yilgi Common Crawl namunasidagi AI va inson tomonidan belgilangan hujjatlar ulushi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f3.jpg\" alt=\"3-rasm. Qo'shilgan AI matni faqat kichik inson byudjetlarida yo'qotishlarni kamaytiradi. 5, 20 va 40 TPPh da belgilangan\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-rasm. Qo'shilgan AI matni faqat kichik inson byudjetlarida yo'qotishlarni kamaytiradi. 5, 20 va 40 TPPh da belgilangan inson korpusiga AI tokenlari yoki xuddi shuncha miqdordagi yangi inson tokenlari qo'shilganda, har bir modelning faqat inson ma'lumotlariga asoslangan nazorat guruhiga nisbatan C4 yo'qotishlarining o'zgarishi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f4.jpg\" alt=\"4-rasm. Bizning qonunimiz o'qitilgan modellarga mos keladi va kattaroq modellar uchun natijalarni bashorat qiladi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-rasm. Bizning qonunimiz o'qitilgan modellarga mos keladi va kattaroq modellar uchun natijalarni bashorat qiladi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-rasm. Bizning qonunimiz o'qitilgan modellarga mos keladi va kattaroq modellar uchun natijalarni bashorat qiladi. Chapda: bizning qonunimiz bilan C4 yo'qotishlarining kuzatilgan o'zgarishi. O'rtada: 20 TPPh da 477 million va 973 million parametrli kechiktirilgan ishga tushirishlar bizning qonunimiz va Chinchilla bilan solishtirilganda. Chinchilla AI matni yo'qotishlarni kamaytirishda davom etishini bashorat qiladi; ishga tushirishlar va bizning qonunimiz o'sishni ko'rsatadi. O'ngda: har bir AI ishga tushirilishi uchun bashorat qilingan va kuzatilgan o'zgarish.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f5.jpg\" alt=\"5-rasm. AI matnini filtrlash katta inson byudjetlarida o'zini oqlaydi va inson matnini takrorlash AI matnini qo'shishdan\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-rasm. AI matnini filtrlash katta inson byudjetlarida o'zini oqlaydi va inson matnini takrorlash AI matnini qo'shishdan ko'ra samaraliroqdir.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-rasm. AI matnini filtrlash katta inson byudjetlarida o'zini oqlaydi va inson matnini takrorlash AI matnini qo'shishdan ko'ra samaraliroqdir. Chapda: 22,3% AI aralashmasidan AI hujjatlarini ularni almashtirmasdan olib tashlashda yo'qotishlarning o'zgarishi, bizning qonunimiz tomonidan bashorat qilingan (rang; qora chiziq: o'zgarishsiz) va o'lchangan (doiralar; 973 million parametr uchun qiymatlar). O'ngda: 20 TPPh dagi modellar uchun inson korpusi takrorlanganda yoki xuddi shuncha miqdordagi yangi AI tokenlari qo'shilganda yo'qotishlarning o'zgarishi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f6.jpg\" alt=\"6-rasm. AI matnining foydasi baholash to'plamiga bog'liqmi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-rasm. AI matnining foydasi baholash to'plamiga bog'liqmi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-rasm. AI matnining foydasi baholash to'plamiga bog'liqmi. Chapda: inson korpusi qat'iy belgilangan holda bizning qonunimiz tomonidan bashorat qilingan yo'qotishlarni minimallashtiradigan o'quv tokenlaridagi AI ulushi, baholash to'plamlari bo'yicha: inson matni (C4, FW22) uchun nolga yaqin, AI matni (Cosmo) uchun 90% dan yuqori va aralash FW26 uchun 98% dan 34% gacha pasayish; 10 TPP atrofidagi pasayish - bu optimum bashorat qilingan yo'qotishlarning ikkita lokal minimumi o'rtasida o'tadigan nuqtadir. O'ngda: inson tomonidan belgilangan FW26 matnidagi yo'qotishlarni oshiradigan 243 ta AI qo'shimchalari uchun, AI tomonidan belgilangan matn ulushi o'sishi bilan validatsiya to'plami ko'rsatadigan median yo'qotish o'zgarishi. Belgisi 5,1% AI da o'zgaradi; 2026-yilgi kraulimizdagi 22,3% da median yugurish 1,9% ga yaxshiroq ko'rinadi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f7.jpg\" alt=\"7-rasm. Bilim maqolalari, qo'llanmalar va ro'yxatlar deyarli har bir mavzuda eng ko'p AI tomonidan belgilangan formatlar\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-rasm. Bilim maqolalari, qo'llanmalar va ro'yxatlar deyarli har bir mavzuda eng ko'p AI tomonidan belgilangan formatlardir. Har bir Web Organizer mavzusida va o'quv to'plamimizdagi hujjatlar formatida Pangram 3.3.2 tomonidan AI deb belgilangan hujjatlar ulushi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f8.jpg\" alt=\"8-rasm. Internet AI eng ko'p yozadigan formatlar va mavzular tomon siljiydi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-rasm. Internet AI eng ko'p yozadigan formatlar va mavzular tomon siljiydi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-rasm. Internet AI eng ko'p yozadigan formatlar va mavzular tomon siljiydi. Biz 2021-yil yanvaridan 2026-yil avgustigacha bo'lgan davrni kalendar choraklari bo'yicha Pangram 3.3.2 va Web Organizer belgilari bilan chizamiz. Har bir format va mavzuning internet tokenlaridagi ulushi va har bir format va mavzuning AI deb belgilangan tokenlar ulushi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f9.jpg\" alt=\"9-rasm. DCLM sifat klassifikatori AI tomonidan belgilangan hujjatlarni inson hujjatlariga qaraganda ancha ko'proq saqlay\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-rasm. DCLM sifat klassifikatori AI tomonidan belgilangan hujjatlarni inson hujjatlariga qaraganda ancha ko'proq saqlaydi. 2026-yilgi Common Crawl 10 000 ta hujjatli namunaning FineWeb (yuqorida) va DCLM (pastda) quvurlari har bir bosqichidan omon qolishi, Pangram 3.3.2 belgisi bo'yicha bo'lingan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f10.jpg\" alt=\"10-rasm. Har bir kraul oyida o'lchangan va 2022-yil dekabridan 2026-yil avgustigacha bo'lgan davr uchun moslashtirilgan \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-rasm. Har bir kraul oyida o'lchangan va 2022-yil dekabridan 2026-yil avgustigacha bo'lgan davr uchun moslashtirilgan drift bilan tasodifiy yurish yordamida 2030-yil dekabrigacha bashorat qilingan internet tokenlaridagi AI ulushi, 80% va 95% bashorat intervallari bilan.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f11.jpg\" alt=\"11-rasm. Bizning qonunimizning foyda va zarar atamalari. 2-tenglamaning ikki atamasi va ularning C4 ga sof ta'siri.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-rasm. Bizning qonunimizning foyda va zarar atamalari. 2-tenglamaning ikki atamasi va ularning C4 ga sof ta'siri.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f11-2.jpg\" alt=\"Rasm 11 (davomi 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm 11 (davomi 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f13.jpg\" alt=\"13-rasm. AI matnining zarari sekinlashadi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;13-rasm. AI matnining zarari sekinlashadi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;13-rasm. AI matnining zarari sekinlashadi. C4 yo'qotishlarining r ga nisbatan 1 dan 64 gacha o'zgarishi: AI matnining har bir ikki barobar ko'payishi yo'qotishning bir xil o'sishini qo'shadi. Shtrixli chiziq: Lovelace va boshqalar uslubidagi tezlashuvchi darajali jarima qonuni.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f14.jpg\" alt=\"14-rasm. Samarali inson tokenlari Chinchilla ma'lumotlar hadidagi AI yugurishlarini almashtiradi. Faqat inson tokenlarin\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;14-rasm. Samarali inson tokenlari Chinchilla ma'lumotlar hadidagi AI yugurishlarini almashtiradi. Faqat inson tokenlarini hisobga olganda, AI yugurishlari faqat inson matnlaridan olingan Chinchilla ma'lumotlaridan chetga chiqadi; samarali tokenlar sifatida hisoblanganda, ular ular bilan ustma-ust tushadi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f15.jpg\" alt=\"15-rasm. Har bir moslashtirilgan o'lcham va byudjet bo'yicha bizning qonunimiz. Qo'shilgan AI matni va qo'shilgan yangi \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;15-rasm. Har bir moslashtirilgan o'lcham va byudjet bo'yicha bizning qonunimiz. Qo'shilgan AI matni va qo'shilgan yangi inson matni uchun bizning qonunimiz egri chiziqlari bilan har bir moslashtirilgan nazorat guruhi uchun C4 yo'qotishlarining r ga nisbatan o'zgarishi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f16.jpg\" alt=\"16-rasm. Bizning qonunimizning AI tokeni uchun qiymati o'lchangan qiymatlarga qarshi. Bizning qonunimiz bo'yicha inson t\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;16-rasm. Bizning qonunimizning AI tokeni uchun qiymati o'lchangan qiymatlarga qarshi. Bizning qonunimiz bo'yicha inson tokenlaridagi qo'shilgan AI tokenining qiymati va 5 va 20 TPPh da bir xil nazorat qiymatiga juftlashtirilgan AI va yangi inson qo'shimchalari asosida o'lchangan qiymat.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f19.jpg\" alt=\"19-rasm. Kamroq AI matni C4 uchun har doim hisoblash jihatidan samaraliroq, Cosmopedia uchun esa ko'proq AI matni samara\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;19-rasm. Kamroq AI matni C4 uchun har doim hisoblash jihatidan samaraliroq, Cosmopedia uchun esa ko'proq AI matni samaraliroq. 20 TPPda 268M modellarning 2026-yilgi kroul miksimizga (22,3% AI) nisbatan hisoblash ekvivalentidagi o'sishi AI ulushiga ega.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f20.jpg\" alt=\"20-rasm. Inson matnini takrorlash inson matni baholash to'plamlarida AI matnini qo'shishdan ustunroqdir.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;20-rasm. Inson matnini takrorlash inson matni baholash to'plamlarida AI matnini qo'shishdan ustunroqdir.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;20-rasm. Inson matnini takrorlash inson matni baholash to'plamlarida AI matnini qo'shishdan ustunroqdir. Inson korpusi takrorlanganda yoki bir xil miqdordagi yangi AI tokenlari qo'shilganda, har bir inson tokeniga qo'shilgan tokenlarga nisbatan har bir baholash to'plamidagi yo'qotishlarning o'zgarishi. Inson matni to'plamlarida (C4, FW22, FW26-H) takrorlash yo'qotishlarni kamaytiradi, AI matni esa ularni oshiradi; AI matni to'plamlarida (FW26-AI, Cosmo) AI matni yo'qotishlarni ko'proq kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f21.jpg\" alt=\"21-rasm. AI tomonidan yaratilgan matnda qo'shilgan AI tokenlari har qanday byudjetda yo'qotishlarni kamaytiradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;21-rasm. AI tomonidan yaratilgan matnda qo'shilgan AI tokenlari har qanday byudjetda yo'qotishlarni kamaytiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;21-rasm. AI tomonidan yaratilgan matnda qo'shilgan AI tokenlari har qanday byudjetda yo'qotishlarni kamaytiradi. Cosmopedia uchun 3-rasmning muqobili: har bir moslashtirilgan hajm uchun 5, 20 va 40 TPPda AI tokenlari yoki bir xil miqdordagi yangi inson tokenlari qo'shilganda Cosmo yo'qotishlarining o'zgarishi. AI matni har qanday byudjet va hajmda yo'qotishlarni 25% gacha kamaytiradi; yangi inson matni esa ularni ancha kamroq kamaytiradi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f22.jpg\" alt=\"22-rasm. Aralash validatsiya ma'lumotlari inson matniga yetkazilgan zararni yashiradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;22-rasm. Aralash validatsiya ma'lumotlari inson matniga yetkazilgan zararni yashiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;22-rasm. Aralash validatsiya ma'lumotlari inson matniga yetkazilgan zararni yashiradi. Chapda: har bir modelning FW26 ning AI tomonidan belgilangan qismiga nisbatan inson tomonidan belgilangan qismidagi yo'qotishi. Faqat inson ma'lumotlariga ega modellar AI matnida 12-27% pastroq yo'qotishlarga ega va AI matni bilan o'qitilgan modellar teng yo'qotish chizig'idan pastga tushadi. O'ngda: inson tomonidan belgilangan matnda yo'qotishlarni oshiradigan 243 ta AI qo'shimchasidan, validatsiya to'plami yaxshilanish sifatida ko'rsatadigan ulush, moslashtirilgan va ajratilgan o'lchamlar uchun AI tomonidan belgilangan matn ulushi o'sishi bilan: 5% AI da 49,4% va 2026-yilgi kroulimizning 22,3% da 95,5%.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f23.jpg\" alt=\"23-rasm. Qo'shilgan AI tokenlari CORE ni yangi inson tokenlari kabi oshiradi.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;23-rasm. Qo'shilgan AI tokenlari CORE ni yangi inson tokenlari kabi oshiradi.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Rasmning to'liq tavsifi&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;23-rasm. Qo'shilgan AI tokenlari CORE ni yangi inson tokenlari kabi oshiradi. AI tokenlari yoki bir xil miqdordagi yangi inson tokenlari qo'shilganda, har bir modelning faqat inson nazoratiga nisbatan CORE ning o'zgarishi. MMLU (Hendrycks va boshq., 2021) chizilmagan, chunki u ushbu o'lchamlarda kutilganidek, har bir model uchun tasodifiy aniqlik darajasida qoladi.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f24.jpg\" alt=\"24-rasm. AI matnlari bilan o‘qitilgan modellar AIga xos bo‘lgan iboralardan ko‘proq foydalanadi. r nisbatida AI matnlari\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;24-rasm. AI matnlari bilan o‘qitilgan modellar AIga xos bo‘lgan iboralardan ko‘proq foydalanadi. r nisbatida AI matnlari qo‘shilgan holda o‘qitilgan modellarning generatsiyalarida har 1000 ta so‘zga to‘g‘ri keladigan 26 ta AIga xos iboralarning chastotasi.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"jadvallar\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#jadvallar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Jadvallar&lt;/span&gt;&lt;/a&gt;Jadvallar&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Jadval 4.&lt;/strong&gt; Everymodelinthepaper.The800modelsofthescaling-lawcohortbysizeandarm:human-only controls,AIadditionsandfresh-humanadditions,eachadditiontrainedonexactlyitscontrol’shumandocuments. Sizes marked † are held out from every fit.TPPh:range over the controls.In Table 5:runs in the matched-budget grid,controlsincluded;theothersbelongtocontrolgroupsatper-sizebudgetsfromearlierrungenerationsand entereveryfitandscoreinthesameway.Otherseeds:runswithaseedotherthan1337.Belowtherule,the44 filteringandrepetitionmodels,whichenternofit.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT4.jpg\" alt=\"Jadval 4\" /&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"tadqiqot-sxemasi\"&gt;&lt;a href=\"2026-10-02/how-much-is-a
