        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Mutaxassislik&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-data.jpg\" alt=\"Ochiq ma'lumotlar\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: Cygri, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:LOD_Cloud_-_2007-09.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/spec-data.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/spec-data.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Ochiq ma'lumotlar — bu mualliflik huquqi, patentlar yoki boshqa nazorat mexanizmlari cheklovlarisiz mashina o'qiy oladigan shaklda foydalanish va qayta tarqatish uchun erkin mavjud bo'lgan axborot mohiyatidir. OSINT va faktlarni tekshirish kontekstida ochiq ma'lumotlar mustaqil tahlil uchun poydevor bo'lib xizmat qiladi.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/spec-data.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Ochiq ma'lumotlar konsepsiyasi foydalanish imkoniyati va o'zaro hamkorlik tamoyillariga asoslanadi. Ma'lumotlar uchta mezon bo'yicha ochiq hisoblanadi: mavjudlik, mashina o'qiy olishi va foydalanish cheklovlarining yo'qligi. Bu ma'lumotlar tahliliy jarayonlar uchun kirish axborotidir.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/spec-data.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Ochiq ma'lumotlar bilan ishlash jarayoni qidiruv, yig'ish, saqlash va tahlil qilishni o'z ichiga oladi. Tadqiqotchi manbani aniqlaydi, ma'lumotlarni tuzilmali shaklda (CSV, JSON) oladi va ularning o'zgarmaganligini tasdiqlash uchun xesh-summalarni qayd etadi.&lt;/p&gt;\n&lt;h2 id=\"metodlar-va-vositalar\"&gt;&lt;a href=\"concepts/spec-data.html#metodlar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Metodlar va vositalar&lt;/span&gt;&lt;/a&gt;Metodlar va vositalar&lt;/h2&gt;\n&lt;p&gt;Avtomatlashtirilgan yig'ish (parsing) va statistik ishlov berish usullari qo'llaniladi. OSINTda fayl metama'lumotlari va veb-arxivlardagi o'zgarishlar tarixini tekshirish muhim ahamiyatga ega.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/spec-data.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Ochiq ma'lumotlar tergov faoliyatida muhim vositadir. Masalan, «Доверие — это не оценка: как ограничить власть ИИ-агентов» maqolasida algoritmlar mantig'i haqidagi ochiq ma'lumotlar xavflarni aniqlash va AI ta'sirini cheklash uchun qanday yordam berishi tushuntiriladi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-xavflar\"&gt;&lt;a href=\"concepts/spec-data.html#cheklovlar-va-xavflar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va xavflar&lt;/span&gt;&lt;/a&gt;Cheklovlar va xavflar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov ma'lumotlar sifati bilan bog'liq: ochiq kirish ma'lumotlarning aniqligi yoki to'liqligini kafolatlamaydi. Ma'lumotlardagi shovqin va eskirgan ma'lumotlar tahlil natijalariga ta'sir qilishi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Ochiq ma'lumotlar&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D0%BA%D3%A9%D0%B7%5D%20--%3E%7C%D0%96%D0%B8%D0%BD%D0%B0%D1%83%7C%20B%5B%D0%A8%D0%B8%D0%BA%D1%96%20%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%5D%0A%20%20B%20--%3E%7C%D3%A8%D2%A3%D0%B4%D0%B5%D1%83%7C%20C%5B%D2%9A%D2%B1%D1%80%D1%8B%D0%BB%D1%8B%D0%BC%D0%B4%D1%8B%D2%9B%20%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%5D%0A%20%20C%20--%3E%7C%D0%A2%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%7C%20D%5B%D0%A2%D0%B5%D0%BA%D1%81%D0%B5%D1%80%D1%96%D0%BB%D0%B3%D0%B5%D0%BD%20%D0%BD%D3%99%D1%82%D0%B8%D0%B6%D0%B5%5D%0A%20%20D%20--%3E%7C%D0%92%D0%B5%D1%80%D0%B8%D1%84%D0%B8%D0%BA%D0%B0%D1%86%D0%B8%D1%8F%7C%20E%5B%D0%90%D1%88%D1%8B%D2%9B%20%D0%B5%D1%81%D0%B5%D0%BF%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/spec-data.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-legal_data.html\"&gt;Суды и законы&lt;/a&gt; — Открытые решения, законодательные базы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-web_archives.html\"&gt;Веб-архивы&lt;/a&gt; — Wayback Machine, сохранение и сравнение страниц.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"qayerda-uchraydi\"&gt;&lt;a href=\"concepts/spec-data.html#qayerda-uchraydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda uchraydi&lt;/span&gt;&lt;/a&gt;Qayerda uchraydi&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html\"&gt;Sun'iy intellekt o'rmon yong'inlarini sun'iy yo'ldoshlardan tezroq aniqlaydi&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Hukumat hisobotlardan so‘zlarni olib tashlab, ilmiy tadqiqotlarni qanday «yo‘qotmoqda»&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html\"&gt;Ishonch — bu ball emas: sun'iy intellekt agentlarini qanday cheklash kerak&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ma'lumotnomada: &lt;a href=\"reference/glossary.html\"&gt;Lug'at A–Z&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"manbalar\"&gt;&lt;a href=\"concepts/spec-data.html#manbalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Manbalar&lt;/span&gt;&lt;/a&gt;Manbalar&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D1%82%D0%BA%D1%80%D1%8B%D1%82%D1%8B%D0%B5_%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Открытые данные — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:LOD_Cloud_-_2007-09.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Cygri, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — sharh, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0092-8674(04)00045-5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MicroRNAs: genomics, biogenesis, mechanism, and function&lt;/a&gt; — sharh, Cell 2004&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — sharh, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Реестры, закупки, архивы: где лежат открытые данные и как их читать."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Ochiq ma'lumotlar","description":"Реестры, закупки, архивы: где лежат открытые данные и как их читать.","vcsPath":"concepts/spec-data.md"},"headings":[{"title":"Ta'rif","href":"concepts/spec-data.html#tarif","level":2},{"title":"Umumiy sharh","href":"concepts/spec-data.html#umumiy-sharh","level":2},{"title":"Nazariya","href":"concepts/spec-data.html#nazariya","level":2},{"title":"Qanday ishlaydi","href":"concepts/spec-data.html#qanday-ishlaydi","level":2},{"title":"Metodlar va vositalar","href":"concepts/spec-data.html#metodlar-va-vositalar","level":2},{"title":"Qayerda qo'llaniladi","href":"concepts/spec-data.html#qayerda-qollaniladi","level":2},{"title":"Cheklovlar va xavflar","href":"concepts/spec-data.html#cheklovlar-va-xavflar","level":2},{"title":"Bog'liq tushunchalar","href":"concepts/spec-data.html#bogliq-tushunchalar","level":2},{"title":"Qayerda uchraydi","href":"concepts/spec-data.html#qayerda-uchraydi","level":2},{"title":"Manbalar","href":"concepts/spec-data.html#manbalar","level":2}],"title":"Ochiq ma'lumotlar"},"router":{"pathname":"concepts/spec-data","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
