        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Jarayon&lt;/strong&gt; · &lt;em&gt;Tracking misinformation narratives and propaganda&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-narratives.jpg\" alt=\"Нарративы и дезинформация\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Rasm: ParentingPatch, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Narrative_Books_on_Library_Shelf.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"tarif\"&gt;&lt;a href=\"concepts/proc-narratives.html#tarif\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ta'rif&lt;/span&gt;&lt;/a&gt;Ta'rif&lt;/h2&gt;\n&lt;p&gt;Отслеживание сюжетов и ложных утверждений.&lt;/p&gt;\n&lt;h2 id=\"umumiy-sharh\"&gt;&lt;a href=\"concepts/proc-narratives.html#umumiy-sharh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Umumiy sharh&lt;/span&gt;&lt;/a&gt;Umumiy sharh&lt;/h2&gt;\n&lt;p&gt;Narrativlar va dezinformatsiya — bu jamoatchilik fikrini shakllantirish yoki o'zgartirishga qaratilgan tuzilmaviy ma'no konstruksiyalarini tarqatish jarayoni. OSINT kontekstida bu g'oyalarning axborot tarmoqlarida qanday tarqalishi va voqelikni idrok etishga ta'sirini o'rganishdir.&lt;/p&gt;\n&lt;h2 id=\"nazariya\"&gt;&lt;a href=\"concepts/proc-narratives.html#nazariya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Nazariya&lt;/span&gt;&lt;/a&gt;Nazariya&lt;/h2&gt;\n&lt;p&gt;Narrativ — bu voqealarni idrok etish uchun kontekst yaratuvchi izchil hikoya yoki talqin shaklidagi axborot mohiyati. Dezinformatsiya — bu odamlarni chalg'itish maqsadida tarqatiladigan ataylab yolg'on yoki buzib ko'rsatilgan ma'lumotlarni o'z ichiga olgan axborot turi. Bu jarayon innovatsiyalarning tarqalish nazariyasiga asoslanadi, u g'oyalarning manbadan ijtimoiy aloqalar orqali ommaviy auditoriyaga qanday yetib borishini tasvirlaydi.&lt;/p&gt;\n&lt;h2 id=\"qanday-ishlaydi\"&gt;&lt;a href=\"concepts/proc-narratives.html#qanday-ishlaydi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qanday ishlaydi&lt;/span&gt;&lt;/a&gt;Qanday ishlaydi&lt;/h2&gt;\n&lt;p&gt;Narrativni shakllantirish jarayoni xabar yadrosini yaratish, uni aniq maqsadli guruhga moslashtirish va turli aloqa kanallari orqali qayta-qayta takrorlashni o'z ichiga oladi. Axborot kampaniyalari g'oyani ommaviy qo'llab-quvvatlash illyuziyasini yaratish uchun muvofiqlashtirilgan xatti-harakatlardan foydalanadi.&lt;/p&gt;\n&lt;h2 id=\"usullar-va-vositalar\"&gt;&lt;a href=\"concepts/proc-narratives.html#usullar-va-vositalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Usullar va vositalar&lt;/span&gt;&lt;/a&gt;Usullar va vositalar&lt;/h2&gt;\n&lt;p&gt;Narrativlarni tahlil qilish ochiq manbalardan ma'lumotlarni yig'ish, ularni tematik klasterlarga ajratish va tarqalish dinamikasini kuzatishni o'z ichiga oladi. Tadqiqotchilar tarmoq tahlili usullaridan foydalanib, tarqatuvchi tugunlarni aniqlaydilar.&lt;/p&gt;\n&lt;h2 id=\"qayerda-qollaniladi\"&gt;&lt;a href=\"concepts/proc-narratives.html#qayerda-qollaniladi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Qayerda qo'llaniladi&lt;/span&gt;&lt;/a&gt;Qayerda qo'llaniladi&lt;/h2&gt;\n&lt;p&gt;Narrativlarni tahlil qilish usullari media makonidagi manipulyatsiyalarni aniqlash uchun ishlatiladi. Masalan, «Neyrotarmoqlar nima uchun tasdiqlaydi: xushomadgo'ylik va sovuq befarqlik tuzog'i» maqolasida algoritmlar foydalanuvchi kutganlariga moslashib, qanday qilib buzilishlarni kuchaytirishi mumkinligi ko'rib chiqiladi.&lt;/p&gt;\n&lt;h2 id=\"cheklovlar-va-qiyinchiliklar\"&gt;&lt;a href=\"concepts/proc-narratives.html#cheklovlar-va-qiyinchiliklar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cheklovlar va qiyinchiliklar&lt;/span&gt;&lt;/a&gt;Cheklovlar va qiyinchiliklar&lt;/h2&gt;\n&lt;p&gt;Asosiy cheklov muvofiqlashtirilgan dezinformatsiyani organik muhokamadan ajratishning murakkabligidadir. Tadqiqotchilar aralashtiruvchi omillar muammosiga duch kelishadi, bunda real ijtimoiy jarayonlar sun'iy kampaniya belgilarini taqlid qilishi mumkin.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Sxema: Нарративы и дезинформация&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D0%BA%D3%A9%D0%B7%5D%20--%3E%20B%5B%D0%9D%D0%B0%D1%80%D1%80%D0%B0%D1%82%D0%B8%D0%B2%5D%0A%20%20B%20--%3E%20C%5B%D0%A2%D0%B0%D1%80%D0%B0%D1%82%D1%83%20%D0%B0%D1%80%D0%BD%D0%B0%D1%81%D1%8B%5D%0A%20%20C%20--%3E%20D%5B%D0%90%D1%83%D0%B4%D0%B8%D1%82%D0%BE%D1%80%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20E%5B%D2%9A%D0%BE%D2%93%D0%B0%D0%BC%D0%B4%D1%8B%D2%9B%20%D0%BF%D1%96%D0%BA%D1%96%D1%80%5D%0A%20%20F%5B%D0%94%D0%B5%D0%B7%D0%B8%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F%5D%20--%3E%20B%0A%20%20C%20--%3E%7C%D0%92%D0%B8%D1%80%D0%B0%D0%BB%D0%B4%D1%8B%D0%BB%D1%8B%D2%9B%7C%20D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"bogliq-tushunchalar\"&gt;&lt;a href=\"concepts/proc-narratives.html#bogliq-tushunchalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bog'liq tushunchalar&lt;/span&gt;&lt;/a&gt;Bog'liq tushunchalar&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nets.html\"&gt;Axborot kampaniyalari va tarmoqlar&lt;/a&gt; — Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-coordination.html\"&gt;Скоординированное поведение&lt;/a&gt; — Синхронные публикации, сети аккаунтов.&lt;/li&gt;\n&lt;li&gt;&lt;a hre
