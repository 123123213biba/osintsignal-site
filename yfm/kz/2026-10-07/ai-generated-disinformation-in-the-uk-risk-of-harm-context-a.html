        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"105\" cy=\"143\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"695\" cy=\"245\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · NARRATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жасанды интеллект және&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;дезинформация: қауіпті қалай&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ажыратуға болады?&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Авторлар 2025-2026 жылдары Ұлыбританияда тараған жасанды интеллект (ЖИ) көмегімен жасалған 112 материалды талдады. Зерттеу нәтижесінде мұндай контенттің 84%-ы аудиторияда қате түсінік қалыптастыратыны анықталды. Зерттеу қоғамдық қауіпсіздікке, денсаулыққа және қаржылық әл-ауқатқа қатер төндіретін сегіз негізгі тәуекел аймағын белгіледі.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ЖИ контентінің 84%-ы қоғамда қате түсінік қалыптастырады.&lt;/li&gt;\n&lt;li&gt;Қауіптің 8 аймағы анықталды: қаржылық алаяқтықтан жаппай тәртіпсіздікке дейін.&lt;/li&gt;\n&lt;li&gt;ЖИ фейктерінің 59%-ы нақты әсер ету күшіне ие емес деп танылды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер төрт жылдық жоба аясында әзірленген «зиянды бағалау моделін» (harm-risk assessment model) қолданды. Деректер жиынтығына ондаған миллион рет қаралған, ЖИ арқылы жасалған немесе өзгертілген видео, аудио және суреттер кірді. Таңдаудың негізгі критерийі ретінде контенттің қоғамдық пікірге немесе мінез-құлыққа әсер ету қабілеті («da'vo ishonchliligi» немесе checkworthiness framework) алынды.&lt;/p&gt;\n&lt;p&gt;Талдау көрсеткендей, зерттелген материалдардың 41%-ы әлеуметтік толқуларға, қаржылық алаяқтыққа немесе денсаулыққа зиян келтіруге қабілетті. Сонымен қатар, контенттің 59%-ы аудиторияның төмен белсенділігі немесе әрекет етуге мотивацияның жоқтығына байланысты маңызды емес деп танылды. Авторлар ақпараттық кеңістікті қорғау үшін қауіпті манипуляциялар мен зиянсыз цифрлық шуды ажырата білу қажеттігін атап өтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;112 кейстен тұратын таңдама жағдайдың тек бір бөлігін ғана көрсетеді және барлық ЖИ дезинформациясын қамтымайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Ұлыбританияда жасанды интеллект (ЖИ) арқылы жасалған немесе өзгертілген дезинформацияның әсеріне ұшыраған халық саны бұрын-соңды болмаған деңгейге жетті. 2025 жылы жарияланған төрт жылдық зерттеу жобасында әзірленген зиян тәуекелін бағалау моделі негізінде жүргізілген талдау 2025 жылдың 1 қаңтары мен 2026 жылдың наурызы аралығында Ұлыбританияда он миллиондаған рет қаралған 112 ЖИ контентін зерттеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Талданған материалдардың 80%-дан астамы ауқымды дезинформациялық әсер тудырады, ал 41,1%-ы сегіз түрлі салада зиян келтіру әлеуетіне ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зиян тәуекелін бағалау моделі — бұл жалған ақпаратты тек қателігі үшін емес, олардың қоғам мен жеке тұлғаларға тигізуі мүмкін теріс әсерінің деңгейі бойынша жіктеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау көрсеткендей, 112 үлгінің 94-і (83,9%) аудиторияда айтарлықтай жалған немесе жаңылыстыратын түсінік қалыптастырады. Қалған 18 жағдай (16,1%) ауқымды дезинформациялық әсер тудырмайтын тар шеңбердегі дәлсіздіктер деп танылды. Демек, бағаланған контенттің әр бестігінің төртеуі ақпаратқа деген сенімсіздікті күшейтеді.&lt;/p&gt;\n&lt;p&gt;Авторлар ЖИ дезинформациясы нақты зиян келтіруі мүмкін сегіз саланы анықтады: әлеуметтік тәртіпсіздіктер мен зорлық-зомбылықты қоздырудан бастап, денсаулыққа тікелей зиян келтіру және қаржылық алаяқтыққа дейін. Тәуекелдер тізіміне мыналар да кірді: жеке тұлғаның денсаулығы мен мінез-құлқына әсер ететін қысымдар, құқық қорғау органдарына деген сенімнің төмендеуі, қауіпті қастандық теорияларының таралуы және әлеуметтік-саяси көзқарастардың ұзақ мерзімді өзгеруі. Нәтижелерге сәйкес, 112 үлгінің 46-сы (41,1%) осы қауіптерді жүзеге асыру әлеуетіне ие, ал 66-сы (58,9%) айтарлықтай қауіп төндірмейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;112 үлгіден тұратын таңдама толық емес және тек көрсетілген кезеңдегі контенттің бір бөлігін ғана көрсетеді, бұл нәтижелерді барлық ЖИ дезинформациясына қатысты жалпылау мүмкіндігін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зиян-тәуекел моделі таңдамадағы жалған ақпараттың сегіз салада тікелей немесе жиынтық әсер арқылы зиян келтіруі мүмкін екенін анықтады: әлеуметтік толқулар мен зорлық-зомбылық; денсаулық пен мінез-құлыққа зиян; қаржылық алаяқтық; қоғамдық денсаулыққа қауіп; құқық қорғау және сот жүйесіне сенімсіздік; климаттық саясатқа қатысты көзқарастың бұрмалануы; қастандық теориялары және қоғамдық-саяси көзқарастарға әсер.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Талдау 112 жағдайдың 39-ы бүкіл қоғамға, 10-ы нақты топтарға, ал 9-ы жекелеген адамдарға зиян тигізуі мүмкін екенін көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әсер ету ауқымы әртүрлі: 1 жағдай жеке тұлғаға, 8-і анықталмаған адамдар тобына (мысалы, қаржылық алаяқтық), 10-ы нақты қауымдастықтарға (мысалы, этникалық немесе діни топтар) және 39-ы бүкіл қоғамға әсер етуі мүмкін. Ұлыбритания тәжірибесін ескере отырып, авторлар бұл тәуекелдерді өсіп келе жатқан қауіп деп бағалайды.&lt;/p&gt;\n&lt;p&gt;112 жазбаның 66-сы (59%) айтарлықтай зиян келтіру әлеуетіне ие емес. 17 жағдайда дәлсіздік маңызсыз болған, 19-ында тақырып өзекті емес, 24-інде аудиторияны қамту жеткіліксіз болған, ал қалғандарында аудиторияның жалған ақпарат негізінде әрекет етуге мотивациясы немесе мүмкіндігі болмаған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттелген мысалдардың жартысынан көбі (112-нің 66-сы) аудиторияның төмен қызығушылығы немесе тақырыптың өзекті еместігіне байланысты зиян келтіру әлеуеті жоқ деп танылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ең жиі кездесетін тақырып (112-нің 71-і, 63,4%) саясат болды. Сондай-ақ сыртқы саясат, экономика, полиция қызметі, Таяу Шығыстағы қақтығыстар, этникалық топтар, қастандық теориялары және медицина тақырыптары кең таралған. Тақырыптардың көпшілігі негізгі бұқаралық ақпарат құралдарының күн тәртібімен байланысты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасанды интеллект (ЖИ) дезинформациясы көбінесе «дипфейктерді» — танымал саясаткерлерге еліктейтін синтезделген видео немесе аудионы, немесе болмаған оқиғаларды бейнелейтін қолдан жасалған контентті пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Саясат саласында саясаткерлердің мәлімдемелеріне еліктейтін ЖИ видеолары мен аудиолары басым. Генеративті құралдардың дамуы контент жасау кедергісін төмендетті: визуалды кемшіліктер (мысалы, дене мүшелеріндегі ақаулар) сирек кездеседі. Google-дің SynthID сияқты су белгілері сарапшыларға көмектесе алады, бірақ аудио-фейктерді анықтау әлі де қиын.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"kontekst-zhaene-motivaciya\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#kontekst-zhaene-motivaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контекст және мотивация&lt;/span&gt;&lt;/a&gt;Контекст және мотивация&lt;/h4&gt;\n&lt;p&gt;Жасанды интеллект (ЖИ) Ұлыбританиядағы ақпараттық ортаны жылдам өзгертіп, ЖИ көмегімен жасалған немесе өзгертілген контент көлемін арттыруда. Контентті дербестендіру, медиасауаттылықтың төмендігі және генеративті құралдардың қолжетімділігі қолданыстағы қорғаныс механизмдерін — мысалы, жала жабу туралы заңдар мен хабар тарату ережелерін — тиімсіз етеді. ЖИ жасаған материалдардың көбеюі ақпаратқа деген сенімді төмендетеді, бұл адамдардың мінез-құлқына және қоғамдық процестерге кері әсер етуі мүмкін. Авторлар «ЖИ жасаған» контентті толығымен немесе ішінара генерацияланған (мәтін, кескін, видео, аудио), ал «ЖИ өзгерткен» контентті мағынасын өзгерту үшін манипуляцияланған материалдар деп анықтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЖИ контентінің таралуы ақпаратқа деген сенімді әлсіретіп, қолданыстағы құқықтық және реттеуші қорғаныс механизмдерін тиімсіз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"full-fact-zertteui\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#full-fact-zertteui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Full Fact зерттеуі&lt;/span&gt;&lt;/a&gt;Full Fact зерттеуі&lt;/h4&gt;\n&lt;p&gt;Есепте ЖИ контенті көлемінің өсуі нақты зиянға қалай әкелуі мүмкін екені талданады. Зерттеу Ұлыбританияның жетекші фактчекинг ұйымы Full Fact 2025–2026 жылдары тексерген 112 фактіге негізделген. Авторлар контент тақырыптарын, форматтарын және түрлерін жіктеп, оны таратушы субъектілерді анықтайды. Жұмыста жеке тұлғалар мен қоғам үшін салдары, әсердің ауырлығы мен ұзақтығы бағаланады және тәуекелдерді бағалау моделі сипатталады. Алынған мәліметтер шешім қабылдаушылар мен зерттеушілер үшін ақпараттық жүйелердің тұрақтылығын арттыру мақсатында деректер жиынтығы ретінде ұсынылған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фактчекинг — бұл тексерілетін дереккөздер мен метадеректерді пайдалана отырып, мәлімдемелердің ақиқатқа сәйкестігін тексеру процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zertteu-surakhtary\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zertteu-surakhtary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сұрақтары&lt;/span&gt;&lt;/a&gt;Зерттеу сұрақтары&lt;/h4&gt;\n&lt;p&gt;Жұмыс Жасанды интеллект қауіпсіздігі институтының (AISI) қоғамдық тұрақтылық бойынша басым бағыттарына сәйкес келеді және келесі сұрақтарға жауап іздейді: зерттеу кезеңінде Ұлыбританияда ЖИ контентінің қандай түрлері мен тақырыптары кең таралған; олар басқа тәсілдермен жасалған дезинформациядан қалай ерекшеленеді; әсерге ұшыраған аудиторияның көлемі қандай; мұндай контенттің жеке тұлғалар немесе қоғам үшін дәлелденген немесе әлеуетті салдары қандай; және зиян келтіру әлеуетіне негізделген контентті жіктеу жүйесі қандай болуы керек.&lt;/p&gt;\n&lt;h4 id=\"aukhymy-men-shekteuleri\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#aukhymy-men-shekteuleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ауқымы мен шектеулері&lt;/span&gt;&lt;/a&gt;Ауқымы мен шектеулері&lt;/h4&gt;\n&lt;p&gt;Зерттеу базасы 2025 жылғы 1 қаңтар мен 2026 жылғы 31 наурыз аралығында жарияланған, мазмұнында жасанды интеллект (ЖИ) қатысуы мүмкін деген болжам айтылған Full Fact фактчекингтері мен мақалаларынан тұрады. Сол кезеңде контентті автоматты түрде сұрыптау жүйесі болмағандықтан, зерттеушілер «AI», «AI-», «Artificially» және «Artificial» кілт сөздері арқылы іздеу жүргізіп, fullfact.org доменін үздіксіз бақылаған. Сонымен қатар, ішкі метрикалар арқылы ЖИ-ге қатысы бар, бірақ мәтінде нақты көрсетілмеген материалдар қосылды. Қолмен сұрыптаудан кейін зерттеуге 112 мақала енді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеушілер 112 мақаланы талдап, олардың тек 33-інде (29,5%) ЖИ қатысуы нақты расталғанын анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дереккөздерде ЖИ-дің қатысуына деген сенімділік дәрежесі сандық түрде бағаланбағандықтан, мәтіндік талдау әдісі қолданылды. 112 жағдайдың 33-інде қорытынды қатаң болды. Тағы 13 жағдайда «дерлік анық» деген тіркестер қолданылған. Қалған жағдайларда «өте ықтимал», «ықтимал» немесе «мүмкін» деген сияқты әлсіз бағалар берілген немесе ЖИ-дің рөлі мүлдем бағаланбаған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мәтіндік талдау — құжаттар мазмұнын жүйелі түрде зерттеу арқылы ондағы заңдылықтар мен мағыналарды анықтау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"aedebietterge-sholu-dezinformaciya-ziyany-bojynsha-kholda-bar-derekter\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#aedebietterge-sholu-dezinformaciya-ziyany-bojynsha-kholda-bar-derekter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдебиеттерге шолу: дезинформация зияны бойынша қолда бар деректер&lt;/span&gt;&lt;/a&gt;Әдебиеттерге шолу: дезинформация зияны бойынша қолда бар деректер&lt;/h4&gt;\n&lt;p&gt;Жалған ақпараттың қоғамдық пікірге әсері туралы ғылыми пікірталастар Бірінші дүниежүзілік соғыстан кейінгі кезеңнен бастап бір ғасырдан астам уақыт бойы жалғасып келеді. Соңғы 10 жылда дезинформацияны зерттеу дербес ғылыми пәнге айналды. Зерттеушілер саясат, қақтығыстар, денсаулық сақтау және сот жүйесі сияқты салаларда жалған ақпараттың әсерін талдауда. «Ақиқат» деген не және жалған ақпарат аудиторияның мінез-құлқына қалай әсер ететіні туралы іргелі сұрақтарды М. Фуко, Б. Уильямс, Х. Арендт және Д. Спербер сияқты ойшылдар көптеген жылдар бойы талқылаған.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Full Fact ұйымы (тіркелген қайырымдылық ұйымы № 1158683 және коммерциялық емес компания № 6975984) жалған ақпаратты жіктеу тәсілдерін талдайды. Зерттеушілер Эмили Врага мен Летиция Боде 2020 жылы дезинформация мен мизинформацияны анықтауда бірыңғай тәсілдің жоқтығын атап өткен болатын. Алайда, соңғы жылдары академиялық ортада осы терминдер бойынша консенсус қалыптасты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Терминдер арасындағы басты айырмашылық ниетте: мизинформация оның жалған екенін білмей таратылады, ал дезинформация әдейі жасалады және таратылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Мизинформация» (misinformation) деп бүгінгі таңда қолда бар дәлелдерге сәйкес жалған немесе жаңылыстыратын, бірақ таратушысы оның жалған екенін білмейтін ақпарат түсініледі. «Дезинформация» (disinformation) саяси немесе әлеуметтік мақсаттарда әдейі таратылатын жалған ақпаратты білдіреді. Сондай-ақ, қаржылық пайда немесе басқа да жеке мақсаттарда жасалатын «кликбейт» немесе «мистификация» сияқты түрлері де бар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мизинформация — бұл қателіктердің байқаусызда таралуы, ал дезинформация — бұл фактілермен әдейі манипуляция жасау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анықтамалардан бөлек, ғалымдар ондаған жылдар бойы коммуникация табиғатын талқылап келеді: ол фактілерді жеткізу құралы ма, әлде пікір мен сенімді білдіру тәсілі ме? Когнитивті психологтар адамның бұрынғы көзқарастары жаңа ақпаратқа деген сенімін қалай анықтайтынын және ақпаратты өңдеудің қаншалықты оңай екенін зерттейді. Есте сақтау керек, мизинформация мен дезинформация арасындағы терминологиялық айырмашылық барлық тілде бірдей емес; мысалы, француз және испан тілдерінде бұл ұғымдар арасында мұндай нақты лингвистикалық шекара жоқ.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Саясат және әлеуметтану саласындағы зерттеушілер жалған сенімдердің тұрақтылығына әсер ететін факторларды, соның ішінде мәлімдемелердің қайталануы мен дезинформацияның таралуын белсенді түрде зерттеп жатыр. Ақпараттың көзқарасты қалыптастыруына қатысты белгілі бір консенсус болғанымен, бұл ақпараттың мінез-құлыққа тікелей әсері әлі де пікірталас тудыруда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;БАҚ-тың мінез-құлыққа әсері туралы ғылыми пікірталас «құдіретті БАҚ» теориясынан «шектеулі әсер» тұжырымдамасына және контекстті ескеретін заманауи модельдерге ауысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тарихи тұрғыдан алғанда, бұл дау Бірінші дүниежүзілік соғыстан кейін туындаған «медиа-эффектілер» туралы пікірталастарды еске салады. Сол кезде АҚШ ғалымдары бұқаралық ақпарат құралдары — кино, радио және баспасөз қоғамдық пікірді түбегейлі қалыптастыру қабілетіне ие деп санады. Алайда, 1940-жылдары, Екінші дүниежүзілік соғыс кезінде жүргізілген жаңа зерттеулер БАҚ әсерінің шектеулі екенін және әлеуметтік факторлардың маңыздырақ рөл атқаратынын көрсетті. 1970-жылдарға қарай зерттеушілер БАҚ тек белгілі бір жағдайларда және нақты аудиторияларға ғана әсер ете алады деген қорытындыға келді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Медиа-эффектілер» — бұқаралық ақпарат құралдарының адамдардың көзқарасына, біліміне және іс-әрекетіне әсер ету дәрежесін сипаттайтын академиялық термин.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2016 жылғы саяси өзгерістерден кейін үш негізгі ой мектебі қалыптасты. Зерттеушілердің бірінші тобы дезинформация қоғамдық пікір мен мінез-құлықты өзгертуге қауқарлы деп санайды және мұны АҚШ пен Филиппиндегі сайлау нәтижелерімен байланыстырады.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Академиялық ортада дезинформацияның әсерін бағалау бойынша үш негізгі тәсіл қалыптасқан. Біріншісі, жалған мәліметтердің таралуын ауқымды саяси және әлеуметтік өзгерістермен байланыстырады. Екінші тәсіл, керісінше, дезинформация азаматтардың нақты іс-әрекеттері мен көзқарастарына «шектеулі немесе нөлдік» әсер ететінін, ал бұл мәселе бойынша шамадан тыс алаңдаушылық демократиялық институттарға деген сенімді төмендетіп, цензураға шақыруларды күшейтетінін алға тартады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеулер дезинформация әсерінің кең спектрін көрсетеді: елеулі әсердің болмауынан бастап, белгілі бір жағдайларда ауыр салдарларға әкелуіне дейін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы зерттеудің негізінде жатқан үшінші тәсіл жалған ақпараттың белгілі бір жағдайларда нақты салдарларға әкелуі мүмкін екенін болжайды. Мұндай әсер тіркелген салалар ауқымы өте кең: сайлау процестері мен қоғамдық денсаулық сақтаудан бастап, жеке әл-ауқат, қақтығыстар, сот жүйесінің жұмысы және нарықтық экономикаға дейін. Авторлар салдардың сипаты ақпарат түріне, аудиторияға және жағдай контекстіне байланысты екенін атап өтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контекстік тәсіл — бұл құбылыстың әсерін әмбебап емес, орта, уақыт және аудитория сипаттамалары сияқты сыртқы факторларға тәуелді деп бағалау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ai-ding-akhparattykh-ortadaghy-roeli\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#ai-ding-akhparattykh-ortadaghy-roeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;АИ-дің ақпараттық ортадағы рөлі&lt;/span&gt;&lt;/a&gt;АИ-дің ақпараттық ортадағы рөлі&lt;/h4&gt;\n&lt;p&gt;Жасанды интеллект (АИ) қатысын растайтын немесе болжайтын фактчекингтер Full Fact ұйымының жұмысында жиілеп кетті. 2023 жылдың басында мұндай жағдайлар сирек болса, зерттеу кезеңінде АИ-мен байланысты контент барлық жарияланымдардың 24%-ын құрады. Салыстырмалы түрде, бір жыл бұрын бұл көрсеткіш небәрі 8% болған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;АИ-ге қатысты фактчекингтер үлесі бір жыл ішінде 8%-дан 24%-ға дейін өсті, бұл дезинформация жасау кедергілерінің төмендегенін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Генеративті құралдардың дамуы жаңылыстыратын контентті ауқымды түрде жасауды жеңілдетті. Бұл фактчекерлердің жұмысын қиындатуда: егер үш жыл бұрын жалған суреттерде анатомиялық қателіктер (мысалы, аяқ-қолдың қисаюы) жиі кездессе, қазір мұндай белгілер сирек байқалады. Адамның келбеті мен дауысын имитациялайтын дипфейктер ең көп таралған қауіптердің біріне айналды. Бейне-фейктерді түпнұсқамен салыстыру арқылы әшкерелеу оңайырақ болғанымен, аудио-контентті тексеру қиын күйінде қалуда, өйткені сарапшылар нақты қорытындыға келе алмайды және АИ дауысын кәсіби имитациямен шатастыру қаупі бар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дипфейк — жасанды интеллект көмегімен адамның келбетін немесе дауысын басқа тұлғаға ауыстыру технологиясы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұған қарсы күресу үшін Google-дің SynthID сияқты жаңа әдістері енгізілуде — бұл файлдың АИ арқылы жасалғанын білдіретін көрінбейтін цифрлық су белгілері. 2026 жылдан бастап OpenAI де осындай идентификация бағдарламаларын дамытуда.&lt;/p&gt;\n&lt;h4 id=\"anykhtau-men-klassifikaciyanyng-khazirgi-taesilderi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#anykhtau-men-klassifikaciyanyng-khazirgi-taesilderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анықтау мен классификацияның қазіргі тәсілдері&lt;/span&gt;&lt;/a&gt;Анықтау мен классификацияның қазіргі тәсілдері&lt;/h4&gt;\n&lt;p&gt;АИ-контент көлемінің өсуіне жауап ретінде верификацияның жаңа стандарттары әзірленуде. 2023 жылы тараған Рим Папасының күртеше киген суреті сияқты алғашқы мысалдар жақынырақ қарағанда визуалды ақаулармен әшкереленген. Алайда, генерация сапасы тез өсуде, бұл визуалды тексеруді тиімсіз етуде.&lt;/p&gt;\n&lt;p&gt;2020 жылдан бастап C2PA бастамасы белсенді дамуда. Ол «контентті есепке алу деректері» (Content Credentials) стандартын ұсынады. Бұл цифрлық файлдарға авторлық құқық пен өңдеу тарихын тіркейтін метадеректерді бекітуге мүмкіндік береді, бұл суреттің камерада түсірілген сәтінен бастап нейрожелілер арқылы өңделгенге дейінгі жолын бақылауға көмектеседі.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Full Fact ұйымы (қайырымдылық қоры № 1158683 және коммерциялық емес компания № 6975984) медиаконтентті тексеру әдістерін зерттейді. Контенттің шынайылығын анықтаудың заманауи тәсілдері түсірілім орны, уақыты және өңдеу тарихын тіркейтін «контент деректерін» (content credentials) пайдалануды қамтиды. Бұл деректер кескін нейрондық желілер арқылы ішінара өзгертілген болса да, оның шығу тегін қадағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Content credentials — бұл файлдың цифрлық «паспорты», ол жасалу және өзгерту тарихын сақтай отырып, контенттің шынайылығын тексеруге көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;C2PA стандартынан бөлек, Google «SynthID» жүйесін енгізді. Өшіріп тастауға болатын метадеректерден айырмашылығы, SynthID көрінбейтін су белгісін тікелей медиафайл құрылымына енгізеді. Бұл белгінің бар-жоғын тексеру үшін Google арнайы API арқылы қолжетімділікті қамтамасыз етеді. Осы технологияны кеңейту аясында Google генеративті жасанды интеллект арқылы жасалған контентті таңбалау бойынша ортақ стандарттарды енгізу үшін Nvidia және OpenAI компанияларымен серіктестік орнатты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SynthID сияқты таңбалау технологиялары көрінбейтін су белгілерін тікелей медиадеректерге енгізеді, бұл олардың шығу тегін API арқылы тексеруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұған дейін Еуропалық Одақтың Horizon гранттарымен қаржыландырылған «vera.ai» жобасы дезинформацияны талдау және синтетикалық аудио мен кескіндерді автоматты түрде анықтау құралдарын әзірлеумен айналысқан. Жоба аяқталғанымен, әзірленген құралдар пайдалану үшін қолжетімді күйінде қалуда. Қолданыстағы тексеру жүйелерінің негізгі шектеуі — қалың бұқараның бұл технологияларды пайдалану бойынша хабардарлығының төмендігі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасанды интеллект контентін тексеруге арналған қолданыстағы құралдар әлі де көпшілік арасында кең тарамаған, бұл олардың дезинформацияға қарсы күрестегі тиімділігін төмендетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;h4 id=\"dezinformaciya-khaupin-baghalau\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#dezinformaciya-khaupin-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дезинформация қаупін бағалау&lt;/span&gt;&lt;/a&gt;Дезинформация қаупін бағалау&lt;/h4&gt;\n&lt;p&gt;Ұлыбританияда жасанды интеллект (ЖИ) көмегімен жасалған дезинформация мен жалған ақпаратқа байланысты тәуекелдер артып келеді. 2025 жылы University of Westminster Press баспасында жарияланған зиянды бағалау моделіне негізделген зерттеуде 2025 жылдың 1 қаңтары мен 2026 жылдың 31 наурызы аралығында Ұлыбританияда он миллиондаған рет қаралған 112 ЖИ контенті талданды. Талдау көрсеткендей, 112 үлгінің 94-і (83,9%) айтарлықтай жалған немесе жаңылыстыратын түсінік (дезинформация әсері) қалыптастырады, ал 18 жағдай (16,1%) тек шамалы дәлсіздіктерді қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Талданған ЖИ контентінің 41,1%-ы әлеуметтік тәртіпсіздіктер, қаржылық шығындар және денсаулыққа қауіп төндіру сияқты сегіз негізгі салада елеулі зиян келтіру әлеуетіне ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жалпы үлгілердің 46-сы (41,1%) жағымсыз салдарға әкелуі немесе оған ықпал етуі мүмкін деп танылды, ал 66-сы (58,9%) елеулі зиян келтіру үшін шектеулі немесе нөлдік әлеуетке ие. Анықталған тәуекелдер зорлық-зомбылық пен кемсітушіліктен бастап, саяси көзқарастар мен климаттық саясатқа әсер етуге дейінгі сегіз бағыт бойынша жіктелді. Салдардың таралуы 1 жағдай нақты адамға, 8-і анықталмаған топтарға (мысалы, алаяқтық құрбандары), 10-ы нақты қауымдастықтарға (діни немесе кәсіби топтар), ал 39-ы тұтас қоғамға әсер ететінін көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зиянды бағалау моделі «себеп болуды» жалған ақпарат мінез-құлық үшін негізгі фактор болған жағдай деп, ал «үлес қосуды» мінез-құлыққа әкелетін жалған түсінікті нығайту деп анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында: контент пен салдар арасындағы байланыс бақыланатын экспериментке емес, бағалау моделіне негізделген, сондықтан себеп-салдарлық байланыстарды түсіндіруде сақтық қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"negizgi-terminder-soezdigi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#negizgi-terminder-soezdigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі терминдер сөздігі&lt;/span&gt;&lt;/a&gt;Негізгі терминдер сөздігі&lt;/h4&gt;\n&lt;p&gt;Модель «елеулі салдар немесе зияндарды» жеке тұлға немесе қоғам мүдделеріне келтірілген объективті тексерілетін зиян деп анықтайды. «Себеп болу» дәлелдер жалған мәлімдеме мінез-құлық үшін қажетті фактор болғанын растағанда тіркеледі. «Үлес қосу» ақпараттың мінез-құлыққа әкелетін жалған түсінікті айтарлықтай нығайтатынын білдіреді. «Ақылға қонымды күмәннан тыс» стандарты, егер тексеруден кейін мінез-құлық үшін басқа қисынды түсініктеме табылмаса, қолданылады.&lt;/p&gt;\n&lt;h4 id=\"mangyzdy-aeleuet\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#mangyzdy-aeleuet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Маңызды әлеует»&lt;/span&gt;&lt;/a&gt;«Маңызды әлеует»&lt;/h4&gt;\n&lt;p&gt;Модель контентті жағымсыз әсер тудыру немесе оны күшейту үшін «маңызды әлеуетке» (substantive potential) ие деп бағалайды, егер екі шарт орындалса. Біріншіден, қолда бар ғылыми деректер осындай ақпараттың ұқсас контексте бұрын да осындай салдарға әкелгенін растайды. Екіншіден, контент модельде белгіленген, әсерді тудыру үшін қажетті факторлар критерийлеріне сәйкес келуі тиіс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель контенттің зиян келтіру ықтималдығын тарихи деректер мен белгіленген тәуекел факторларына сәйкестігі негізінде бағалайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Full Fact — тіркелген қайырымдылық ұйымы (тіркеу нөмірі 1158683) және коммерциялық емес компания (тіркеу нөмірі 6975984).&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;h4 id=\"maelimdemelerdi-tangdau-kriterijleri-tekseru-zhuejesi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#maelimdemelerdi-tangdau-kriterijleri-tekseru-zhuejesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мәлімдемелерді таңдау критерийлері (тексеру жүйесі)&lt;/span&gt;&lt;/a&gt;Мәлімдемелерді таңдау критерийлері (тексеру жүйесі)&lt;/h4&gt;\n&lt;p&gt;Фактчекерлер контенттің жалған, жаңылыстыратын немесе жасанды интеллект (ЖИ) көмегімен жасалғанын әрқашан алдын ала білмейді. Full Fact сияқты ұйымдар бұқаралық ақпарат құралдары, саясат және әлеуметтік желілердегі тексерілуі мүмкін мәлімдемелерді анықтау үшін мониторинг құралдарын пайдаланады. Нақты мәлімдемені тексеру туралы шешім бірқатар факторларға негізделеді. Оларға мыналар жатады: саясаткерлер мен БАҚ тарапынан айтылған өзекті қоғамдық маңызы бар мәселелер; адамдардың өміріне теріс әсер етуі мүмкін мәлімдемелер; кең таралған және жедел терістеуді қажет ететін контент; дезинформация тактикасын көрсету үшін білім беру құндылығы бар мысалдар; сондай-ақ Facebook және Instagram пайдаланушылары тарапынан қате ақпарат ретінде белгіленген материалдар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тексеру жүйесі (checkworthiness framework) — бұл редакцияларға жұмысты басымдыққа қоюға көмектесетін критерийлер жиынтығы, өйткені қоғамдық кеңістіктегі әрбір мәлімдемені тексеру мүмкін емес.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Айта кету керек, фактчекерлер барлық зерттеу нәтижелерін жарияламайды. Егер жоба нақты қорытынды бермесе немесе дезинформацияны растамаса, ол бойынша жұмыс тоқтатылуы мүмкін. Бұл жарияланған контентте әдейі жалған немесе жаңылыстыратын жағдайларға қарай жүйелі ауытқуды тудырады. Нәтижесінде, тексерілген фактілер жиынтығы барлық қоғамдық мәлімдемелердің кездейсоқ таңдамасы емес, бұл зерттеу нәтижелерін жалпы ақпараттық үрдістерге экстраполяциялау мүмкіндігін шектейді.&lt;/p&gt;\n&lt;h4 id=\"zhi-di-anykhtau-aedisteri\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zhi-di-anykhtau-aedisteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЖИ-ді анықтау әдістері&lt;/span&gt;&lt;/a&gt;ЖИ-ді анықтау әдістері&lt;/h4&gt;\n&lt;p&gt;Зерттеу аясында әрбір мәлімдеме контентті жасауда ЖИ-дің қатысын және пайдаланылған модельдерді анықтау үшін талданды. Ең көп таралған дәлел «глюктер» (қателіктер) болды — визуалды немесе аудио материалдардағы кемелсіздіктер, олар зерттеудегі 112 жағдайдың көпшілігінде анықталған. Бұған анатомиялық қателер (мысалы, генерацияланған кескіндердегі артық қолдар) немесе аудиожазбалардағы табиғи емес кідірістер мен ырғақ жатады. Екінші маңызды санат «сәйкессіздіктер» (incongruities) болып, олар 63 жағдайда тіркелген. Бұлар расталған шындыққа қайшы келетін элементтер, мысалы, кескіндегі тұлғаның киімі сол кезеңдегі нақты кескіндерге сәйкес келмеуі.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Жасанды интеллект арқылы өзгертілген контент пен дипфейктерді әшкерелеудің негізгі әдісі — олардың түпнұсқасымен салыстыру арқылы сәйкессіздіктерді анықтау. 60 жағдайда «теріс дәлел» (negative evidence) әдісі қолданылды, яғни растайтын сенімді ақпараттың болмауы. Мысалы, Иран зымыранымен атып түсірілген спутник туралы суретті тексеру кезінде, мұндай оқиға туралы ешқандай хабарлама жоқтығы және спутниктің қирауы ғарыш қоқысын тудырып, оны бақылау жүйелері тіркеуі тиіс екені атап өтілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Теріс дәлел — оқиға орын алған жағдайда болуы тиіс іздердің жоқтығына негізделген тексеру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;47 жағдайда алдыңғы дезинформациялық науқандармен ұқсастықтар (визуалды стиль, фон, дауыс беру) анықталды, бұл ортақ жасаушы немесе платформаның қолданылғанын көрсетеді. Су белгілері (watermarks) 36 жағдайда жасанды шығу тегінің ең күшті дәлелі болды. Олардың 18-і Google Gemini (13-і SynthID арқылы, 5-і визуалды), 4-і Grok, 3-і Sora, қалғандары Runway, InShot және Unreal-ге тиесілі. 8 жағдайда нақты құрал көрсетілмеген, тек қолданушы аты немесе бас тарту жазбасы болған.&lt;/p&gt;\n&lt;p&gt;Субъектілердің куәліктері 32 жағдайда, әсіресе бөлшек сауда дүкендерін имитациялайтын алаяқтықтарда қолданылды. 19 жағдайда сарапшылардың (мысалы, профессор Хани Фарид пен доктор Сивэй Лю) талдауы тартылды. Аккаунттар тарихы мен жасанды интеллект қолданылғаны туралы мойындаулар сәйкесінше 18 және 11 жағдайда дәлел ретінде қызмет етті.&lt;/p&gt;\n&lt;h4 id=\"ziyan-taeuekelin-baghalau-modeli\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#ziyan-taeuekelin-baghalau-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зиян тәуекелін бағалау моделі&lt;/span&gt;&lt;/a&gt;Зиян тәуекелін бағалау моделі&lt;/h4&gt;\n&lt;p&gt;Зиян қаупін бағалау моделі төрт жылдық зерттеу жобасы аясында әзірленген (2025 жылы жарияланған). Ол дезинформацияның жеке тұлғалар мен қоғамға зиян келтіру әлеуетін екі фактор негізінде талдайды: 250 дезинформация үлгісі және саясат, бизнес пен денсаулық сақтау салаларындағы жалған ақпараттың салдары бойынша қолда бар зерттеулер. Контент зиянды деп танылуы үшін ол модель критерийлеріне сай болуы және өткенде ұқсас жағдайлардың зиян келтіргені расталуы тиіс. Модель 2024 жылдан бері Еуропа, Африка және Таяу Шығыста қолданылып келеді.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Full Fact ұйымы «елеулі салдар» деп жеке тұлғаның, топтың немесе қоғамның мүдделеріне объективті түрде тексерілетін зиян келтіретін өзгерістерді атайды; бұл жай ғана өтпелі эмоциялар немесе қате түсініктерді қамтымайды. Тәуекелді бағалау үшін модель үш негізгі сұрақты қолданады (1-суретті қараңыз): 1) мәлімдеме фактілер туралы қате түсінік қалыптастыра ма, әлде тек шамалы дәлсіздік тудыра ма; 2) мәлімдемеге жеткілікті адам сене ме және бұл нақты теріс салдарға әкелуі мүмкін бе; 3) өтірікке сенген адамдарда қазір немесе болашақта, әсіресе осындай мәлімдемелер қайталанған кезде, осы қате түсінік негізінде әрекет етуге мүмкіндігі мен мотивациясы бар ма.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тәуекелдерді бағалау моделі — бұл фактчекерлерге жалған ақпараттың өзін ғана емес, оның нақты зиян келтіру ықтималдығын жүйелі түрде талдауға көмектесетін алгоритм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы сұрақтарға берілген жауаптар негізінде модель салдарлардың әлеуетін, олардың ауқымын, ауырлығын және ұзақтығын анықтайды. Фактчекерлер 14 параметрді талдайды, оның ішінде: өтірік деңгейі, аудитория көлемі, сенімділік деңгейі, қастандық теорияларының немесе қайталанатын нарративтердің болуы, сондай-ақ аудиторияның алынған ақпарат негізінде әрекет ету қабілеті.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Егер дәлелдер мәлімдеменің жалған екенін, оған жеткілікті адам сенгенін және бұл адамдар қате түсінік негізінде әрекет етуге қабілетті екенін көрсетсе, модель туындауы мүмкін салдарлардың түрін белгілейді. Ол зияннан кімдер зардап шегуі мүмкін екенін анықтауға көмектеседі: нақты бір тұлға, топ немесе бүкіл қоғам. Сондай-ақ әсердің тікелей (жедел әрекеттер) немесе кумулятивті (ұзақ мерзімде аудитория көзқарасының өзгеруі) екені бағаланады.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;2025 жылы жарияланған Висконсин-Мэдисон университетінің тәуелсіз зерттеуі дезинформация әсерін болжаудың күрделілігін және бұл нәтижелерде сәйкессіздіктерге әкелуі мүмкін екенін атап өтті. Нәтижелердің дәйектілігін қамтамасыз ету үшін авторлар «алтын стандарт» тексеруін қолданды: сарапшылар тобы әрбір шешімді модель критерийлеріне сәйкестігін тексеріп шықты. Бұл процесс зерттеудегі дезинформацияның әлеуетті салдарын анықтауға мүмкіндік берді.&lt;/p&gt;\n&lt;h4 id=\"4-naetizheler-derekter-zhiyntyghyna-sholu\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#4-naetizheler-derekter-zhiyntyghyna-sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Нәтижелер: Деректер жиынтығына шолу&lt;/span&gt;&lt;/a&gt;4. Нәтижелер: Деректер жиынтығына шолу&lt;/h4&gt;\n&lt;p&gt;Деректер жиынтығы 2025 жылғы 1 қаңтар мен 2026 жылғы 31 наурыз аралығында интернетте тараған және ондаған миллион рет қаралған, жасанды интеллект (ЖИ) көмегімен жасалған немесе өзгертілген 112 контент бірлігін қамтиды. Материалдар бизнес, экономика, денсаулық сақтау, саясат және соғыс сияқты 19 кең тақырыпты қамтиды. Мысалдардың көпшілігі бір мезгілде 2–4 тақырыпты қозғайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректер жиынтығы — зерттеушілер белгіленген критерийлер бойынша талдау үшін іріктеп алған жүйеленген ақпараттар жиынтығы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Негізгі форматтар ретінде видео, аудиовизуалды материалдар және кескіндер қолданылған. ЖИ чат-боттары жасаған мәтіндік контент тек екі жазбада кездеседі. Зерттеушілер манипуляцияларды екі түрге бөлді: «импостер контент» (жеке тұлғаның немесе топтың кейпіне еніп, олардың көзқарасын бұрмалау) және «фабрикацияланған контент» (оқиға туралы жалған түсінік қалыптастыратын қолдан жасалған кескіндер).&lt;/p&gt;\n&lt;p&gt;Барлық 112 жазба жалған немесе адастырушы деп танылды. Бағалау моделіне сәйкес, 18 жағдай (16,1%) «тар шеңбердегі дәлсіздік», ал 94 жағдай (83,9%) «айтарлықтай жалған немесе адастырушы» деп жіктелді. Ең жиі кездесетін тақырып — саясат (71 жағдай, 63,4%), оның ішінде жоғары лауазымды тұлғалардың қатысуымен жасалған дипфейктер бар. Сондай-ақ шетелдегі оқиғалар, Таяу Шығыс пен Украинадағы соғыстар, экономика, құқық қорғау органдарының қызметі, этникалық немесе діни топтардың әрекеттері, қастандық теориялары және медицина тақырыптары жиі кездеседі.&lt;/p&gt;\n&lt;h4 id=\"egzhej-tegzhej-zhi-derekter-zhiyntyghyndaghy-negizgi-takhyryptar-men-narrativter\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#egzhej-tegzhej-zhi-derekter-zhiyntyghyndaghy-negizgi-takhyryptar-men-narrativter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Егжей-тегжей: ЖИ деректер жиынтығындағы негізгі тақырыптар мен нарративтер&lt;/span&gt;&lt;/a&gt;Егжей-тегжей: ЖИ деректер жиынтығындағы негізгі тақырыптар мен нарративтер&lt;/h4&gt;\n&lt;p&gt;Авторлар бұл жиынтық интернеттегі барлық ЖИ контентінің кездейсоқ таңдамасы емес екенін атап өтеді. Ол Full Fact ұйымы белгілеген «тексеруге лайықтылық» (checkworthiness) критерийлері негізінде қалыптастырылған. Іріктемеге алаяқтық немесе денсаулық сақтау саласындағы дезинформация сияқты қоғам үшін салдары болуы мүмкін материалдар енгізілген. Барлық тақырыптар зиян келтіру қаупін бағалау моделіндегі 19 санатқа сәйкес келеді (1-кесте).&lt;/p&gt;\n&lt;h4 id=\"faktilerdi-tekseruding-keng-takhyryptykh-baghyttary\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#faktilerdi-tekseruding-keng-takhyryptykh-baghyttary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фактілерді тексерудің кең тақырыптық бағыттары&lt;/span&gt;&lt;/a&gt;Фактілерді тексерудің кең тақырыптық бағыттары&lt;/h4&gt;\n&lt;p&gt;Зерттеу 19 кең тақырыптық санатқа бөлінген 112 контент бірлігін қамтыды. Ең көп таралғаны саясат (71 жағдай, 63,4%), одан кейін халықаралық қатынастар (43 жағдай, 38,4%), экономика және бизнес (28 жағдай, 25%), сондай-ақ қылмыс және құқық қорғау органдары (27 жағдай, 24,1%) болды. Зорлық-зомбылық пен қақтығыстар (20 жағдай, 17,9%), көші-қон (18 жағдай, 16%), танымал тұлғалар (17 жағдай, 15,2%), төтенше жағдайлар (15 жағдай, 13,4%), мемлекеттік басқару және қастандық теориялары (14 жағдай, 12,5%) және денсаулық сақтау (10 жағдай, 8,9%) тақырыптары сирегірек кездесті. Медиа, экология және жасанды интеллект сияқты басқа санаттар таңдаманың шағын бөлігін құрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тақырыптық жіктеу — бұл жалған ақпараттың таралуындағы заңдылықтарды анықтау үшін контентті негізгі белгілері бойынша топтастыру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау барысында 88 ықтимал кіші тақырыптың 48-і анықталды. Мысалы, «саясат» санаты саясаткерлердің әрекеттерінен бастап наразылық акцияларын ұйымдастыруға дейінгі 10 кіші тақырыпты, ал «денсаулық сақтау» қызметтердің қолжетімділігі мен емдеу тәуекелдерін қамтитын 5 кіші тақырыпты қамтыды. Талданған материалдардың көпшілігі бір уақытта екі-төрт тақырыпты немесе кіші тақырыпты қамтыған. Авторлардың айтуынша, тақырыптардың таңдалуы жаңалықтар күн тәртібін де, трендтегі мәселелерге назар аудару арқылы табыс табуға ұмтылатын контент жасаушылардың қаржылық мотивациясын да көрсетеді.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Саяси блок ішіндегі ең көп таралған кіші тақырып жоғары лауазымды тұлғалардың әрекеттерін немесе пікірлерін бұрмалау (жалпы 112 жазбаның 58-і, яғни 51,8%) болды. Бұл материалдарда көбінесе жасанды интеллект көмегімен жасалған бейне немесе аудио-имитациялар (дипфейктер) арқылы саясаткерлердің жалған мәлімдемелері немесе оқиғалардың ойдан шығарылған нұсқалары көрсетілген. Басқа кіші тақырыптар қатарына саяси қайраткерлердің денсаулығы немесе отбасылық жағдайына қатысты контент (4 жағдай) кіреді. Зерттеу барысында осы таңдамада кездеспеген, бірақ басқа жұмыстарда тіркелген тақырыптар да анықталды: психикалық денсаулық, жеке тұлғалардың қатысуымен жасалған сексуалды сипаттағы жалған контент және спорт саласындағы жалған мәлімдемелер.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Саяси контентті талдау аясында зерттеушілер бірнеше негізгі тақырыпты бөліп көрсетті. Ең жиі кездесетіндері: саяси наразылықтар (3 рет), қоғамдық пікір және саясаткерлерді қолдау (2 рет), саяси тағайындаулар немесе отставкалар (2 рет), саясаткерлерді қамауға алу немесе соттау (1 рет) және мемлекеттік шығындар (1 рет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контент-талдау — мәтіндерді немесе медиафайлдарды белгілі бір тақырыптар мен нарративтер бойынша жіктеп, олардың таралу жиілігін анықтау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттелген 112 контент бірлігінің 20%-дан астамы (5-тің 1-і) сол кездегі премьер-министр мен биліктегі Лейбористік партияға қарсы теріс нарративтерді қалыптастыру үшін қолдан жасалған материалдарды пайдаланған. 30 жағдайда екі тақырып басым болды: өмір сүру құнының дағдарысы кезінде өмірлік маңызды қызметтер үшін айыппұлдар немесе төлемдердің өсуі туралы жалған үкіметтік хабарландырулар және жеке бостандықтарды шектеу жөніндегі ойдан шығарылған шаралар. Бұған жасанды интеллект (ЖИ) арқылы жасалған бейнелер жатады, онда саясаткерлер азық-түліктің белгілі бір түрлерін жегені үшін айыппұлдар немесе жыл сайынғы әуе рейстеріне шектеулер енгізілгенін жариялаған. Тағы 11 жағдай билік пен полицияның мұсылмандар мен мигранттарға қатысты саясатына қатысты болды. Барлығы 112 жазбаның 23-і үкіметтің әрекеттеріне, 21-і сэр Кир Стармердің әрекеттеріне немесе көзқарастарына, ал 5-еуі азаматтық бостандықтарға мемлекеттің араласуына қатысты болды.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Шетелдік жаңалықтар санатында «басқа елдердегі оқиғалар» (23 рет), «шетелдік үкіметтердің әрекеттері немесе көзқарастары» (16 рет) және «өз үкіметінің шетелдік мемлекетпен қарым-қатынасы» (4 рет) жиі айтылды. Тәуекелдерді бағалау моделіне сәйкес, егер азаматтардың сол елмен тығыз байланысы болмаса немесе жалған ақпарат ұлттық қауіпсіздікке қатер төндірмесе, шетелдік мемлекеттер туралы жалған мәлімдемелердің ішкі әсері шектеулі болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тәуекелдерді бағалау моделі — дезинформацияның контекст пен аудиторияның хабардарлығына байланысты қоғамға теріс әсер ету ықтималдығын болжайтын талдау тәсілі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеушілер шетелдік оқиғалар туралы жалған ақпарат аудиторияның шетелдегі жағдай туралы білімінің шектеулі болуына байланысты көбірек шындық ретінде қабылданатынын атап өтті. Ішкі саяси күн тәртібінде «жеке экономика» және «өмір сүру құны» (18 рет) мәселелері, соның ішінде жаңа алымдар мен салықтар туралы ЖИ жасаған фейктер жиі кездесті. Сондай-ақ, ЖИ контенті белгілі бір қастандық теорияларын қолдау үшін пайдаланылған 9 жағдай анықталды.&lt;/p&gt;\n&lt;h4 id=\"auditoriya-zhaene-auditoriya-reakciyasynyng-daelelderi\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#auditoriya-zhaene-auditoriya-reakciyasynyng-daelelderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аудитория және аудитория реакциясының дәлелдері&lt;/span&gt;&lt;/a&gt;Аудитория және аудитория реакциясының дәлелдері&lt;/h4&gt;\n&lt;p&gt;Дезинформацияның зиян келтіру әлеуетін түсіну үшін мазмұнның сипатын ғана емес, сонымен қатар аудиторияның көлемін, табиғатын және олардың реакциясын талдау маңызды. Салдары әртүрлі болуы мүмкін: кейбір жағдайларда елеулі әсер ету үшін ондаған мың адамның әрекеті қажет болса, басқа жағдайларда бір ғана адамның әрекеті жеткілікті. Дезинформацияның әсері жұртшылықтың қате әрекеттері немесе саясаткерлер мен шешім қабылдаушы тұлғалардың қате шешімдері арқылы көрінуі мүмкін. Зерттеулер көрсеткендей, ғылыми журналдарда, бұқаралық ақпарат құралдарында және саяси ортада таратылған жалған ақпарат мемлекеттік саясатқа &lt;a href=\"concepts/pryamoy-effekt.html\"&gt;тікелей әсер&lt;/a&gt; ету қабілетіне ие.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аудиторияны қамту — бұл контентті көрген немесе онымен өзара әрекеттескен бірегей пайдаланушылар саны, бұл дезинформацияның әлеуетті әсерін бағалаудағы негізгі көрсеткіш.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жасанды интеллект (AI) арқылы жасалған кейбір материалдар тіпті жоғары лауазымды тұлғаларды адастыруы мүмкін болғанымен, негізгі қауіп контенттің интернетте кеңінен таралуымен байланысты. Зерттеушілердің аудитория туралы нақты деректерге қол жеткізуі ірі платформалардың саясаты мен шифрланған байланыс арналарының жабықтығына байланысты шектелген. Осыған байланысты, келтірілген қамту көрсеткіштері толық емес және шын мәніндегі көрсеткіштерден төмен болуы әбден мүмкін.&lt;/p&gt;\n&lt;p&gt;Қолда бар деректерге сәйкес, зерттеу базасына енгізілген 112 контент бірлігі ондаған миллион интернет пайдаланушысын қамтыды. Таралу ауқымы әрбір жарияланым үшін нақты метрикалар болмаса да, зерттелген материалдардың жиынтық қамтуы өте жоғары екенін растайды.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Зерттеу 112 контент бірлігін қамтыды, олар Ұлыбритания мен бүкіл әлем бойынша таралды. Көрермендер саны бірнеше мыңнан миллионға дейін өзгерді. 22 жағдайда контент 1 миллионнан астам қаралым жинады. Ең жоғары көрсеткіш Түркиядағы наразылықтарды көрсететін жасанды интеллект (ЖИ) арқылы жасалған сурет үшін 11 миллионнан астамды құрады, ал Джеффри Эпштейннің Израильде жүргенін көрсететін жалған сурет тек X платформасының өзінде 6 миллионнан астам қаралым жинады. Контенттің бірнеше платформа арқылы таралуы жиі кездесетін құбылыс болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аудитория көлемі әрқашан нақты салдарға әкелмейді: миллионнан астам қаралымы бар материалдардың жартысынан көбінің зиян келтіру әлеуеті болмады, өйткені бұрмалаулар маңызсыз немесе аудиторияда әрекет етуге мотивация болмады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhi-arkhyly-zhasalghan-dezinformaciya-formattary\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zhi-arkhyly-zhasalghan-dezinformaciya-formattary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЖИ арқылы жасалған дезинформация форматтары&lt;/span&gt;&lt;/a&gt;ЖИ арқылы жасалған дезинформация форматтары&lt;/h4&gt;\n&lt;p&gt;Талданған 112 контенттің 66-сы видео, 46-сы сурет болды. Видеолар санатында фактчекингтің негізгі бағыты былай бөлінді: 26 жағдайда ЖИ элементтері тек визуалды бөлікте, 21 жағдайда тек аудиода, 19 жағдайда видео мен аудио бөліктерінде болды.&lt;/p&gt;\n&lt;h4 id=\"tek-zhi-vizualdy-elementteri-bar-videolar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#tek-zhi-vizualdy-elementteri-bar-videolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тек ЖИ визуалды элементтері бар видеолар&lt;/span&gt;&lt;/a&gt;Тек ЖИ визуалды элементтері бар видеолар&lt;/h4&gt;\n&lt;p&gt;Бұл санат жаңалықтар оқиғаларын, қақтығыстарды немесе қоғам қайраткерлерінің жалған көріністерін имитациялайтын толық синтетикалық видеоларды қамтиды (мысалы, Иранға соққылар, Судандағы жерлеу рәсімі, Лос-Анджелестегі өрттер). Фактчекингтің негізгі міндеті оқиғалардың шынайылығын тексеру болды.&lt;/p&gt;\n&lt;h4 id=\"tek-zhi-audiosy-bar-videolar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#tek-zhi-audiosy-bar-videolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тек ЖИ аудиосы бар видеолар&lt;/span&gt;&lt;/a&gt;Тек ЖИ аудиосы бар видеолар&lt;/h4&gt;\n&lt;p&gt;Көп жағдайда видеоқатар екінші дәрежелі (слайдтар немесе дыбыссыз кадрлар) болып, тексерудің негізгі назары ЖИ көмегімен синтезделген дауысқа аударылды. Көбінесе Ұлыбритания Премьер-министрі Кир Стармердің дауысы мен интонациясына еліктеу қолданылды. Маңызды бөлігін азаматтық еркіндіктерді шектеу туралы жалған хабарламалар құрады: әшекейлерге салынатын салықтар, әуежайдағы ақылы дәретханалар немесе 60 жастан асқандар үшін NHS төлемдері.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аудионы талдаудағы негізгі қиындық ЖИ генерациясы мен кәсіби еліктеушілерді ажырату болды; ЖИ белгісі ретінде көбінесе вокалдық артефактілер қызмет етті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhi-video-zhaene-audio-elementteri-bar-videolar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zhi-video-zhaene-audio-elementteri-bar-videolar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЖИ видео және аудио элементтері бар видеолар&lt;/span&gt;&lt;/a&gt;ЖИ видео және аудио элементтері бар видеолар&lt;/h4&gt;\n&lt;p&gt;Бұл санат нақты кадрларды манипуляция үшін негіз ретінде пайдаланатын контентті қамтиды, көбінесе «липсинк-дипфейк» форматында, мұнда спикердің ерін қимылы ЖИ арқылы жасалған аудиомен синхрондалады.&lt;/p&gt;\n&lt;h4 id=\"zhasandy-intellekt-arkhyly-zhasalghan-keskinder\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zhasandy-intellekt-arkhyly-zhasalghan-keskinder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасанды интеллект арқылы жасалған кескіндер&lt;/span&gt;&lt;/a&gt;Жасанды интеллект арқылы жасалған кескіндер&lt;/h4&gt;\n&lt;p&gt;Зерттеу нақты фотосуреттерге ұқсатылып жасалған, жасанды интеллект (ЖИ) арқылы генерацияланған статикалық кескіндерді қарастырады. Мұндай материалдардың негізгі мақсаты — саяси қайраткерлер арасындағы жалған кездесулерді (мысалы, Фарадж/Эпштейн, Трамп/Эпштейн) модельдеу немесе саясаткерлерді беделсіздендіретін немесе эмоционалды әсер ететін жағдайларға орналастыру арқылы қоғамдық пікірді манипуляциялау.&lt;/p&gt;\n&lt;h4 id=\"zhi-dezinformaciyasyn-taratatyn-platformalar-men-aktorlar-tuerleri\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zhi-dezinformaciyasyn-taratatyn-platformalar-men-aktorlar-tuerleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЖИ-дезинформациясын тарататын платформалар мен акторлар түрлері&lt;/span&gt;&lt;/a&gt;ЖИ-дезинформациясын тарататын платформалар мен акторлар түрлері&lt;/h4&gt;\n&lt;p&gt;Талдау көрсеткендей, ЖИ арқылы жасалған дезинформация Facebook, Instagram, Threads, TikTok және X (Twitter) сияқты барлық ірі платформаларда таралады. Көптеген материалдар бірнеше платформада қайталанған, бұл үйлестірілген немесе еліктеушілік сипаттағы тарату әдісінен хабар береді. Таңдама көлемінің шектеулілігіне байланысты платформалардағы мінез-құлық айырмашылықтары туралы қорытындылар алдын ала сипатқа ие. Бақылаулар Facebook-те контент көлемі үлкенірек, ал X (Twitter) желісінде жоғары виралдылық байқалғанын көрсетті. Facebook көбінесе Ұлыбританияға бағытталған ақпарат және денсаулық сақтау саласындағы алаяқтық үшін пайдаланылған. TikTok-та контент жас аудиторияға, соның ішінде денсаулық сақтауға қатысты алаяқтық схемаларға бағытталған. Фактчекерлердің таңдау әдіснамасы (Meta платформаларына бейімділік) себебінен, авторлар әртүрлі платформалардағы таралу деңгейін нақты бағалау мүмкін еместігін атап өтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Виралдылық — бұл контенттің пайдаланушылар арасында бөлісу және өзара әрекеттесу арқылы тез таралу қабілеті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дезинформация жасаушылардың көпшілігі ашық жұмыс істейді: дәстүрлі БАҚ, көпшілік профильдер немесе сатира/пародия деп белгіленген аккаунттар арқылы. Таңдамада саяси қолдау топтары (мысалы, Reform UK партиясының жақтаушылары), танымал тұлғалар мен ұйымдар, сондай-ақ қаржылық пирамидалар мен күмәнді медициналық қызметтерді насихаттайтын аккаунттар анықталған. Танымал тұлғалар, соның ішінде X иесі Илон Маск және АҚШ-тың жоғары лауазымды отставкадағы әскерилері тарапынан ЖИ-контентін тарату жағдайлары тіркелген. Миннеаполистегі атыс (2026 жылғы қаңтар) бейнеленген жалған суретті посттардың бірі 9 миллионнан астам рет қаралған. Авторлар өз жеке басын жасырған жағдайда, оларды анықтау тіпті платформалардың өзі үшін де қиын. Саяси сипаттағы контенттің бір бөлігі қаржылық мүдде үшін кәсіби топтар тарапынан жасалуы ықтимал.&lt;/p&gt;\n&lt;h4 id=\"ziyandy-taldaugha-sholu\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#ziyandy-taldaugha-sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зиянды талдауға шолу&lt;/span&gt;&lt;/a&gt;Зиянды талдауға шолу&lt;/h4&gt;\n&lt;p&gt;Жүргізілген талдау 112 жазбаның 94-і (83,9%) аудиторияда айтарлықтай жалған немесе жаңылыстыратын түсінік тудырғанын көрсетті. Бұл материалдар қоғам үшін маңызды ақпаратқа деген сенімді әлсіретіп, дезинформацияның жалпы әсерін күшейтеді. Зерттеулер бұл әсердің денсаулық сақтау және демократиялық институттардың тұрақтылығы үшін елеулі салдары болуы мүмкін екенін көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"ziyan-keltiru-aeleuetin-taldau\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#ziyan-keltiru-aeleuetin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зиян келтіру әлеуетін талдау&lt;/span&gt;&lt;/a&gt;Зиян келтіру әлеуетін талдау&lt;/h4&gt;\n&lt;p&gt;Зерттеу барысында авторлар дезинформацияның 112 мысалын жеке тұлғаларға немесе қоғамға елеулі зиян келтіру қабілеті тұрғысынан бағалады. Талданған жалпы жағдайлардың ішінде 46 мысал (41,1%) модель критерийлеріне сәйкес келіп, олардың теріс салдарға әкелуі немесе соған үлес қосуы мүмкін екенін көрсетті. Қалған 66 мысал (58,9%) мұндай әлеуетті көрсеткен жоқ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зиянды бағалау моделі — бұл ақпараттық хабарламаларды қоғамдық институттарға деген сенімді әлсірету немесе нақты әлеуметтік салдарларды тудыру қабілетіне қарай жіктейтін аналитикалық құрал.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар жекелеген жалған мәлімдемелердің саяси контексте маңыздылығы әртүрлі болғанымен, ұсынылған модель кез келген елеулі дәрежедегі жалған немесе адастырушы ақпаратты қоғамдық кеңістіктегі ақпаратқа деген жалпы сенімді төмендететін фактор ретінде жіктейтінін атап өтеді. Зерттеу дезинформацияның кең таралуы туралы түсінік демократиялық процестерге қанағаттану деңгейін төмендететіні және азаматтардың денсаулық сақтау саласындағы ұсынымдарды орындау ынтасын азайтатыны туралы деректерге сүйенеді.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Full Fact ұйымы (қайырымдылық қоры № 1158683, коммерциялық емес компания № 6975984) жасанды интеллект (ЖИ) көмегімен жасалған контент пен дезинформацияның қоғамдық қауіпсіздік пен денсаулыққа әсерін зерттейді. Авторлар мұндай материалдар келтіретін зиянды бес бағытқа бөледі: әлеуметтік тәртіпсіздіктерді қоздыру, психологиялық және физикалық қысым, қаржылық алаяқтық, тиімсіз медициналық препараттарды насихаттау және қоғамдық көзқарастың ұзақ мерзімді өзгеруі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deepfake (дипфейк) — бұл нақты адамдардың келбеті мен дауысына еліктеу үшін ЖИ алгоритмдері арқылы жасалған немесе өзгертілген медиа контент.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2025 жылдың желтоқсанында денсаулық сақтау сарапшысының бейнесіндегі дипфейкті менопауза кезіндегі күмәнді қоспаларды жарнамалау үшін пайдалану жағдайы тіркелді. Зерттеулер танымал тұлғалардың абыройын пайдаланып, тексерілмеген және қауіпті емдеу әдістерін насихаттау жағдайларының көбейіп келе жатқанын растайды. Талдау көрсеткендей, «ғажайып» құралдар туралы жалған ақпарат алған аудиторияның бір бөлігі дәлелді медицинадан бас тартып, тиімсіз баламаларды таңдауға бейім келеді.&lt;/p&gt;\n&lt;p&gt;Тағы бір мысал — қаржы сарапшысы Мартин Льюистің атынан Swiftgate Montark платформасына инвестиция салуға шақыратын жалған жаңалықтарды жасау үшін ЖИ қолданылуы. Пайдаланушылардың реакциясы мұндай кеңестерге еріп кетуге дайын екендіктерін көрсетті, бұл жеке деректердің ұрлануы мен қаржылық шығын қаупін тудырады. Осындай қауіптер зорлық-зомбылық құрбандарын қаралаушы жалған суреттер тараған кезде де туындайды, бұл жәбірленушілерге қарсы қысым мен қорқытуға әкеледі. 2025 жылдың ақпанында Бирмингем ауруханасында «балта ұстаған мигранттар» бейнеленген ЖИ жасаған сурет әлеуметтік желілерде (1,7 миллионнан астам қаралым) таралып, нақты оқиға болмаса да, әлеуметтік шиеленісті қалай күшейте алатынын көрсетті.&lt;/p&gt;\n&lt;p&gt;Ғылыми деректер жалған мәлімдемелердің қайталануы олардың ақиқат ретінде қабылдануын арттыратынын, ал «триггерлік ақпарат» (мысалы, сыртқы қауіп бейнесі) зорлық-зомбылықтың орын алуына ықпал ете алатынын растайды. Қабылдау және коммуникация психологиясы саласындағы зерттеулер дезинформацияның жүйелі таралуы қоғамдағы агрессияның өсуімен тікелей байланысты екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Дезинформациядан келетін зиян тәуекелін бағалау моделі жалған ақпараттың қоғамға әсерінің сегіз негізгі бағытын бөліп көрсетеді. Олардың қатарында құқық қорғау органдарына деген сенімнің төмендеуі, климат мәселелері бойынша қоғамдық пікірдің өзгеруі, қастандық теорияларына бейімділіктің артуы және саяси көзқарастардың ұзақ мерзімді трансформациясы бар. Авторлар бұл тұжырымдар жағымсыз салдардың сөзсіз болатынын білдірмейтінін, тек тәуекелді бағалау моделіне сәйкес олардың орын алуы үшін қажетті жағдайлардың бар екенін көрсететінін атап өтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зиян тәуекелін бағалау моделі — бұл үш шарттың бар-жоғын тексеретін аналитикалық құрал: қате түсініктің қалыптасуы, аудиторияны жеткілікті қамту және жалған ақпаратқа сенген адамдарда сол дезинформацияға сәйкес әрекет ету үшін мотивация мен мүмкіндіктің болуы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дезинформацияның нақты салдарға әкелгенін растау үшін қосымша лонгитюдті зерттеулер қажет. Талдау көрсеткендей, жалған хабарламалардың қайталануы уақыт өте келе олардың аудиторияның қабылдауына тигізетін әсерін күшейтеді. Авторлар бұған мысал ретінде жасанды интеллект арқылы жасалған иммиграцияға қарсы видеолардың таралуын, 2025 жылдың қыркүйегіндегі үкіметтің әуе қатынасына шектеу қоюы туралы жалған мәлімдемелерді немесе полиция қатысқан манипуляциялық суреттерді (2025 жылдың маусымы, X желісінде 160 000 қаралым) келтіреді.&lt;/p&gt;\n&lt;p&gt;Кейінгі талдауда авторлар келесі аспектілерді қарастырады: мәлімдемелерді әлеуетті зиян деңгейіне қарай жіктеу, контенттің вирустылығы мен оның нақты әсері арасындағы корреляция, сондай-ақ көзқарас пен мінез-құлыққа әсер ететін ақпараттық эффектілер арасындағы айырмашылық. Дезинформация әсерінің кумулятивті сипатына және мұндай эффектілердің ауқымы мен ұзақтығын бағалаудағы шектеулерге ерекше назар аударылады.&lt;/p&gt;\n&lt;h4 id=\"ziyan-keltiru-aeleueti-zhokh-nemese-shekteuli-maelimdemeler\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#ziyan-keltiru-aeleueti-zhokh-nemese-shekteuli-maelimdemeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зиян келтіру әлеуеті жоқ немесе шектеулі мәлімдемелер&lt;/span&gt;&lt;/a&gt;Зиян келтіру әлеуеті жоқ немесе шектеулі мәлімдемелер&lt;/h4&gt;\n&lt;p&gt;Зиян мен тәуекелдерді бағалау моделі арқылы жүргізілген талдау деректер базасындағы 112 жазбаның 66-сы (58,9%) ақпаратқа деген сенімділікке әсер етуден бөлек, нақты және елеулі салдарға әкелу әлеуетіне ие емес екенін көрсетті. Ықтимал салдарды анықтау үшін модель төрт кезекті сұрақты қолданады: (i) контент мәні бойынша жалған ба әлде тек ішінара дәл емес пе; (ii) осы контент негізінде туындаған іс-әрекеттер нақты әлемде теріс салдарға әкеле ме; (iii) мәлімдемеге сенген адамдар саны салдарды тудыру үшін жеткілікті ме; (iv) бұл адамдарда салдарды тудыру үшін мотивация мен мүмкіндік бар ма.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зиянды бағалау моделі — дезинформацияны жай ғана жалғандығы бойынша емес, нақты әлемде қауіпті әрекеттерді тудыру ықтималдығы бойынша жіктейтін алгоритмдік тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghalau-naetizheleri\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#baghalau-naetizheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау нәтижелері&lt;/span&gt;&lt;/a&gt;Бағалау нәтижелері&lt;/h4&gt;\n&lt;p&gt;● 17 мәлімдеме тек «тар шеңбердегі дәлсіздік» деп танылды. Бұл дәл емес элементтің жағдайды түсіну үшін маңызды емес екенін немесе оқиғаның мәнін өзгертпейтінін білдіреді. Мысалы, 2026 жылғы қаңтарда Николас Мадуроның тұтқындалуы бейнеленген жасанды интеллект (ЖИ) суреті қолдан жасалғанымен, оқиғаның мәнін дұрыс жеткізген. Сол сияқты, 2025 жылғы қарашада Англиядағы пойыз ішінде болған шабуылдың суреттері жасанды болғанымен, шабуылдың нақты жағдайын көрсеткен. Мұндай жағдайда адамдардың іс-әрекеті шынайы фотосуреттер негізінде жасалатын әрекеттерден еш айырмашылығы болмас еді.&lt;/p&gt;\n&lt;p&gt;● 19 мәлімдеменің елеулі салдарға әкелу әлеуеті жоқ, өйткені оларға негізделген әрекеттер айтарлықтай зиян келтірмейді. Мәлімдеме жалған болса да, ол нақты тәуекелдерге әсер етпеуі мүмкін. Мысалы, 2025 жылғы қаңтарда Лос-Анджелестегі өрт кезінде аман қалған «суперкар» туралы ЖИ суреті: мәлімдеме жалған болғанымен, ол модельде көрсетілген теріс салдарға әкелетін әрекеттерге итермелемейді. Тағы бір мысал — Риши Сунактың ауруханадағы жалған суреті (2026 жыл): саясаткерлердің денсаулығы туралы ақпарат сайлаушыларға әсер етуі мүмкін болса да, бұл жағдайда суреттің зияны шектеулі деп бағаланды.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Зерттеуде қолданылатын зиянды бағалау моделі жалған ақпараттың өзі зиянды емес деген болжамға негізделеді. Зиян тек дезинформация нақты салдарға әкелуі мүмкін әрекеттерді немесе мінез-құлықтың өзгеруін тудырған кезде ғана пайда болады. Ол үшін аудитория жалған мәлімдемеге сеніп қана қоймай, оның негізінде әрекет ету үшін жеткілікті мотивация мен мүмкіндікке ие болуы керек.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зиянды бағалау моделі — бұл нақты жалған мәлімдеменің аудиторияның сенімі мен әрекет ету қабілетіне негізделе отырып, шынайы әлемде өлшенетін салдарға әкелуі мүмкін екенін тексеретін аналитикалық құрал.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Талдау барысында зерттеушілер жалған мәлімдемелердің зиян келтіру әлеуеті болмаған бірқатар жағдайларды анықтады. Мысалы, жасанды интеллект (ЖИ) көмегімен жасалған және круиздік кеме теңізге қалдықтар төгіп жатқаны көрсетілген видео 1,8 миллионнан астам рет қаралды. Қамту ауқымына қарамастан, көрермендердің көпшілігі мұны қолдан жасалған дүние деп таныды және тасымалдау компанияларына қатысты мінез-құлықтың немесе көзқарастың өзгергені туралы ешқандай дәлел табылмады. Басқа жағдайларда, мысалы, саясаткерлер туралы жалған хабарламаларда, сайлаудың болмауы немесе нақты ықпал ету тетіктерінің жоқтығы дезинформацияның салдарын мардымсыз етті.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Аудитория жалған ақпаратқа сенген күннің өзінде, ол зиянды әрекетті жүзеге асыру үшін физикалық мүмкіндікке ие болуы керек. Зерттеушілер 2025 жылы Ямайкада болған «Мелисса» дауылы туралы ЖИ видеосын мысалға келтіреді: көпшілігі кадрлардың шынайылығына сенгенімен, көрермендердің басым бөлігі дауыл аймағынан тыс жерде болды. Сол сияқты, Дубайдағы Бурдж-Халифа зәулім ғимаратына шабуыл жасалғаны туралы жалған хабарламалар да салдарға әкелмеді, өйткені БАӘ тұрғындары мұның фейк екенін түсінді, ал елден тыс жердегі адамдар нақты салдарға әкелетін әрекеттерді жасау мүмкіндігіне ие емес еді.&lt;/p&gt;\n&lt;h4 id=\"potencialdy-saldardyng-segiz-salasy\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#potencialdy-saldardyng-segiz-salasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Потенциалды салдардың сегіз саласы&lt;/span&gt;&lt;/a&gt;Потенциалды салдардың сегіз саласы&lt;/h4&gt;\n&lt;p&gt;Талданған 112 мысалдың 46-сы (41,1%) тәуекел моделінің барлық критерийлеріне сәйкес келіп, 78 нақты салдарды тудыру әлеуетіне ие болды. Бұл салдарлар сегіз санатқа бөлінген, оның ішінде әлеуметтік толқулар, өз бетінше жазалау (линчеу), алаяқтықтан келген қаржылық шығын және халық денсаулығына қауіп төндіру.&lt;/p&gt;\n&lt;h4 id=\"1-aeleumettik-tolkhular-men-zorlykh-zombylykhty-tudyru-aeleueti\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#1-aeleumettik-tolkhular-men-zorlykh-zombylykhty-tudyru-aeleueti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Әлеуметтік толқулар мен зорлық-зомбылықты тудыру әлеуеті&lt;/span&gt;&lt;/a&gt;1. Әлеуметтік толқулар мен зорлық-зомбылықты тудыру әлеуеті&lt;/h4&gt;\n&lt;p&gt;Талдау белгілі бір топтарға қатысты жалған айыптауларды қамтитын сегіз ЖИ контентін анықтады, бұл теориялық тұрғыдан агрессияны тудыруы мүмкін еді. Алайда, авторлар әлеуеттің болуы әрқашан жүзеге асуды білдірмейтінін атап өтеді: мысалы, 2026 жылы Гонконгта пастерленбеген сүттің пайдасы туралы жалған мәлімдемелер кең тарады, бірақ зиян келтірмеді, өйткені бұл өнім қалада сатылымда жоқ еді.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Авторлардың зерттеу моделі контенттің мұсылмандар мен мигранттарға қатысты теріс қоғамдық пікір қалыптастыру әлеуетін бағалайды. Талдау барысында модель жасанды интеллект (ЖИ) көмегімен жасалған дезинформацияның әлеуметтік тәртіпсіздіктер мен зорлық-зомбылық әрекеттерін тудыруы немесе ақтауы мүмкін екі мысалын анықтады. Оларға Бирмингемдегі ауруханаға шабуыл жасалды деген жалған ақпарат пен мигранттар қайықтарына шабуыл жасалғаны бейнеленген жасанды сурет жатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зиян қаупін бағалау моделі — контентті әлеуметтік шиеленісті күшейту қабілетіне қарай жіктейтін және бұқаралық ақпарат құралдарының қауіп-қатерді қабылдауға әсері туралы тарихи деректерге сүйенетін аналитикалық құрал.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар әлеуметтік тәртіпсіздіктер мен зорлық-зомбылық ұзақ мерзімді әлеуметтік-экономикалық факторлар мен қысқа мерзімді триггерлік оқиғалардың күрделі өзара әрекеттесуінің нәтижесі екенін атап өтеді. БАҚ көбінесе нақты оқиғаны жалғыз себеп ретінде көрсеткенімен, ол процестің тек бір бөлігі ғана. Зерттеулер ақпараттың жүйелі әсері аудиторияның көзқарасында ұзақ мерзімді өзгерістерге әкелуі мүмкін екенін растайды. Әлеуметтік шиеленіс сын деңгейге жеткенде, «сыртқы қауіп» немесе белгілі бір топтардың заңсыз әрекеттері туралы хабарламалар агрессивті әрекеттер үшін катализатор немесе ақтау құралы бола алады, бұл әсіресе 2024 жылы Ұлыбританиядағы тәртіпсіздіктер кезінде байқалды.&lt;/p&gt;\n&lt;h4 id=\"uzakh-merzimdi-densaulykh-pen-oemir-sueru-zhaghdajyna-aeser-etetin-zorlykh-zombylykhty-akhtau-nemese-khozdyru-aeleueti\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#uzakh-merzimdi-densaulykh-pen-oemir-sueru-zhaghdajyna-aeser-etetin-zorlykh-zombylykhty-akhtau-nemese-khozdyru-aeleueti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұзақ мерзімді денсаулық пен өмір сүру жағдайына әсер ететін зорлық-зомбылықты ақтау немесе қоздыру әлеуеті&lt;/span&gt;&lt;/a&gt;Ұзақ мерзімді денсаулық пен өмір сүру жағдайына әсер ететін зорлық-зомбылықты ақтау немесе қоздыру әлеуеті&lt;/h4&gt;\n&lt;p&gt;Дезинформация тарихи тұрғыдан жеке тұлғаларға немесе топтарға қарсы ауызша немесе физикалық агрессияны ынталандыру үшін қолданылған. Жасанды интеллектінің (ЖИ) адамдардың келбетін имитациялау қабілеті мұндай қауіптерді күшейтудің жаңа құралын жасайды. Зерттеудегі зиян тәуекелінің моделі онлайн қудалаудың жүйелі қорлау мен қорқытуға ұласып, жәбірленушінің психикалық немесе физикалық денсаулығына ұзақ мерзімді зиян келтіруі, оны тұрғылықты жерін өзгертуге немесе қорғаныс іздеуге мәжбүрлеуі мүмкін жағдайларды қарастырады. Тәуекел жәбірленушінің өткендегі жарақаттары болғанда, сондай-ақ контент жоғары деңгейде шынайы және қайталанатын болғанда артады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зиян тәуекелінің моделі — онлайн контенттің физикалық зорлық-зомбылық немесе ұзақ мерзімді психологиялық жарақаттар сияқты нақты салдарға әкелу ықтималдығын бағалайтын талдау тәсілі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеудің деректер жиынтығында зорлық-зомбылыққа әкелуі мүмкін көзқарастарды қалыптастыру әлеуеті бар сегіз ЖИ контенті анықталды. Атап айтқанда, 2025 жыл
