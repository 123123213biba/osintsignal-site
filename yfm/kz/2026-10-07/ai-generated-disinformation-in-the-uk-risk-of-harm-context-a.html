ғы желтоқсанда Бондай-Бичтегі атыста зардап шеккен Арсен Островскийге ұқсас адам бейнеленген ЖИ суреті талданды. Авторлар бұл контентті адамның орта немесе ұзақ мерзімді денсаулығына әсер етуі мүмкін жүйелі қудалауды қоздыру әлеуеті бар деп бағалады, дегенмен бұл жағдайда мұндай әсердің тікелей дәлелдері тіркелмеген.&lt;/p&gt;\n&lt;h4 id=\"onlajn-alayakhtykh-arkhyly-zheke-tulghalargha-tikelej-kharzhylykh-ziyan-keltiru\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#onlajn-alayakhtykh-arkhyly-zheke-tulghalargha-tikelej-kharzhylykh-ziyan-keltiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онлайн алаяқтық арқылы жеке тұлғаларға тікелей қаржылық зиян келтіру&lt;/span&gt;&lt;/a&gt;Онлайн алаяқтық арқылы жеке тұлғаларға тікелей қаржылық зиян келтіру&lt;/h4&gt;\n&lt;p&gt;Ұлыбритания экономикасына киберқылмыстан келетін жылдық шығын шамамен 14,7 миллиард фунт стерлингті құрайды, оның 1,3 миллиард фунты жеке тұлғалардың тікелей жоғалтуларына тиесілі. ЖИ алаяқтарға жаңа мүмкіндіктер ашады: танымал сарапшылардың өнімдерді жалған ұсынуынан бастап, жақын адамдарды қиын жағдайда қалған және ақшаға мұқтаж етіп көрсетуге дейін.&lt;/p&gt;\n&lt;p&gt;Зерттеу таңдамасында қаржы сарапшысы Мартин Льюис Swiftgate Montark криптовалюта платформасын насихаттағаны үшін тұтқындалды деген ЖИ жасаған контент анықталды. Мұндай материалдар сарапшы пікіріне сенетін адамдарды алдауға бағытталған. Авторлар ЖИ көмегімен қоғам қайраткерлерінің жалған ұсыныстарын жасау кең тараған және өсіп келе жатқан қауіп екенін атап өтеді.&lt;/p&gt;\n&lt;h4 id=\"zheke-adamdardyng-zhaene-halykhtyng-densaulyghyna-tikelej-ziyan-keltiru\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zheke-adamdardyng-zhaene-halykhtyng-densaulyghyna-tikelej-ziyan-keltiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жеке адамдардың және халықтың денсаулығына тікелей зиян келтіру&lt;/span&gt;&lt;/a&gt;Жеке адамдардың және халықтың денсаулығына тікелей зиян келтіру&lt;/h4&gt;\n&lt;p&gt;Зерттеулер жалған ақпараттың денсаулыққа сегіз негізгі бағыт бойынша зиян келтіруі мүмкін екенін көрсетеді: (i) психикалық денсаулық, оның ішінде халық топтарының бейімділігі туралы бұрмаланған мәліметтер; (ii) суицид және өзіне-өзі қол жұмсау; (iii) медициналық қызметтердің сапасы мен қолжетімділігі; (iv) емдеу әдістерінің тиімділігі мен тәуекелдері (қауіпті баламаларды насихаттау); (v) аурулардың себептері, белгілері және таралу жолдары; (vi) диета мен өмір салтының ағзаға әсері; (vii) медицина қызметкерлері мен фармацевтикалық компаниялардың әрекеттері; (viii) халықтың санитарлық-гигиеналық нормаларды сақтауы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Денсаулық сақтау саласындағы дезинформация — бұл дәлелді медицинадан бас тартуға немесе денсаулыққа зиянды шешімдер қабылдауға әкелуі мүмкін жалған немесе адастырушы мәліметтердің таралуы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Деректер жиынын талдау барысында авторлар жасанды интеллект (ЖИ) көмегімен жасалған бейнероликті анықтады. Онда денсаулық сақтау саласындағы сарапшы менопауза кезеңіндегі әйелдерге арналған тиімсіз және ықтимал қауіпті «биологиялық белсенді қоспаларды» жарнамалайды. Қолда бар ғылыми деректерге сәйкес, жұртшылық сенімді көрінетін жалған ақпаратқа тап болған жағдайда, тиімді емдеу әдістерінен бас тартып, тексерілмеген емге ауысуы мүмкін. Зерттеуде қолданылған тәуекелдерді бағалау моделі бұл контентті аудиторияның денсаулығына елеулі зиян келтіру әлеуеті бар деп бағалады. Бұл мысал беделді тұлғалардың қатысуымен дипфейктер жасау үшін ЖИ-ді пайдалану үрдісінің бір бөлігі болып табылады, бұл қоғамдық денсаулық сақтау үшін жүйелі тәуекелдер тудырады.&lt;/p&gt;\n&lt;h4 id=\"policiya-men-sot-zhuejesine-degen-senimning-toemendeui\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#policiya-men-sot-zhuejesine-degen-senimning-toemendeui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Полиция мен сот жүйесіне деген сенімнің төмендеуі&lt;/span&gt;&lt;/a&gt;Полиция мен сот жүйесіне деген сенімнің төмендеуі&lt;/h4&gt;\n&lt;p&gt;Зерттеулер дезинформацияның қоғамның құқық қорғау және сот органдарына деген сенімін әлсіретіп, олардың жұмысын қабылдауға және азаматтардың өзара іс-қимылға дайындығына әсер ететінін көрсетеді. Осы зерттеу аясында талданған деректер базасында қоғамдық сенімді төмендету әлеуеті бар үш контент үлгісі анықталды. Оларға жасанды интеллект (ЖИ) көмегімен жасалған екі вирустық сурет (полиция қызметкерлері мұсылмандар тобының алдында тізерлеп тұрғандай бейнеленген) және ЖИ арқылы жасалған видео (сарбаздың полиция қызметкерін «басқыншылардың» қылмыстарына қарсы тұра алмағаны үшін айыптауы) жатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЖИ-генерацияланған контент (AI-generated content) — бұл аудиторияны адастыру үшін қолданылуы мүмкін, машиналық оқыту алгоритмдері арқылы жасалған шынайы көрінетін, бірақ жалған суреттер немесе видеолар.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klimattykh-sayasatkha-khatysty-khoghamdykh-pikirding-oezgerui\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#klimattykh-sayasatkha-khatysty-khoghamdykh-pikirding-oezgerui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Климаттық саясатқа қатысты қоғамдық пікірдің өзгеруі&lt;/span&gt;&lt;/a&gt;Климаттық саясатқа қатысты қоғамдық пікірдің өзгеруі&lt;/h4&gt;\n&lt;p&gt;Көпжылдық ғылыми деректер климаттың өзгеру себептері мен оған қарсы күрес шаралары туралы жалған баяндаулардың қоғамдық пікірді өзгертіп, өз кезегінде мемлекеттік саясатқа әсер ететінін растайды. Соңғы жылдары климаттың өзгеруі туралы дәлелдердің көбеюімен дезинформация климаттық шаралардың күнделікті өмірге тигізетін теріс әсерін асыра көрсетуге ауысты. Талданған деректер жиынтығында Ұлыбритания үкіметі әр адамға жылына екі реттен артық ұшуға тыйым салуды жоспарлап отыр деген жалған ақпаратты тарату үшін ЖИ-контенті пайдаланылғаны анықталды. Қолданыстағы зерттеулерге сәйкес, мұндай дезинформацияның қайта-қайта әсер етуі жұртшылықтың экологиялық бастамаларға деген көзқарасын өзгертіп, саяси шешімдерге ықпал етуі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"7-ziyan-keltiru-aeleueti-bar-khastandykh-teoriyalaryna-bejimdilikting-artuy\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#7-ziyan-keltiru-aeleueti-bar-khastandykh-teoriyalaryna-bejimdilikting-artuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Зиян келтіру әлеуеті бар қастандық теорияларына бейімділіктің артуы&lt;/span&gt;&lt;/a&gt;7. Зиян келтіру әлеуеті бар қастандық теорияларына бейімділіктің артуы&lt;/h4&gt;\n&lt;p&gt;Ғылыми зерттеулер қастандық теорияларына сену бейімділігі өмірлік тәжірибеден бастап, когнитивті-перцептивті шизотипия (асығыс қорытынды жасау және теріске шығаратын дәлелдерге қарсы бейтарапсыздық) және субклиникалық психопатия сияқты жеке сипаттамаларға дейінгі көптеген факторларға байланысты екенін көрсетеді. Осы зерттеудің деректер базасында 11 жазба анықталды, олардың кейбіреулері миллиондаған рет қаралған және жасанды интеллект (AI) арқылы жасалған контентті таратқан. Бұл контент үкіметтің жеке өмірге және азаматтық бостандықтарға араласуы туралы әртүрлі қастандық теорияларын қоректендірген. Мұндай нарративтер әлеуметтік және саяси көзқарастарға әсер ету және зиян келтіруі мүмкін қастандық теорияларын насихаттау әлеуетіне ие.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Когнитивті-перцептивті шизотипия — бұл адамның ерекше сенімдерге бейімділігін және деректер жеткіліксіз болған кезде асығыс қорытынды жасау қасиетін сипаттайтын психологиялық ұғым.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"8-aeleumettik-zhaene-sayasi-koezkharastardyng-oezgeruine-aeser-etu\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#8-aeleumettik-zhaene-sayasi-koezkharastardyng-oezgeruine-aeser-etu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Әлеуметтік және саяси көзқарастардың өзгеруіне әсер ету&lt;/span&gt;&lt;/a&gt;8. Әлеуметтік және саяси көзқарастардың өзгеруіне әсер ету&lt;/h4&gt;\n&lt;p&gt;Дезинформацияның саяси және әлеуметтік көзқарастарға әсері туралы пікірталастардың тарихы терең. Философ Фрэнсис Бэконнан бастап, зерттеушілер нақты білім жаңа дәлелдердің әсерінен өзгеруі мүмкін болса да, қалыптасқан пікірлер мен көзқарастар өте баяу өзгеретінін атап өткен. Көзқарастар өзгерген жағдайда да, бұған тек медиа емес, кең ауқымды әлеуметтік факторлар маңызды рөл атқарады. Сонымен қатар, көп жылдық зерттеулер қайталау эффектісінің қуатты әсерін растайды: ақпараттың қайта-қайта ұсынылуы оның аудитория тарапынан ақиқат ретінде қабылдануын арттырады. Заманауи лонгитюдті зерттеулер медианың азаматтардың мінез-құлқы мен көзқарастарына ұзақ мерзімді әсер ету теориясын қолдайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қайталау эффектісі (illusory truth effect) — бұл психологиялық құбылыс, оған сәйкес адамдар қандай да бір мәлімдемені қайта-қайта естігендіктен, оны ақиқат деп бағалауға бейім болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Зерттеу барысында 112 жазбадан тұратын деректер жиынтығы талданды, оның 71-інде (63,4%) жасанды интеллект (ЖИ) көмегімен жасалған саяси мазмұндағы контент анықталды. Ең жиі кездесетін түрі (жалпы жазбалардың 51,8%) танымал саясаткерлердің әрекеттері мен көзқарастарын бұрмалау болды. Мұнда саяси тұлғалардың жалған мәлімдемелерін немесе шындықта болмаған оқиғаларды көрсету үшін ЖИ арқылы жасалған видео және аудио имитациялар қолданылған. Тағы 18 жазба (16%) белгілі бір әлеуметтік топтарға қатысты қарым-қатынасты бұрмаласа, 14 жазба (12,5%) мемлекеттік басқару мәселелері бойынша қате түсінік қалыптастырған (оның 11-і қастандық теорияларына қатысты).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дипфейк — бұл жасанды интеллект көмегімен жасалған, нақты адамның келбетін, дауысын немесе әрекеттерін имитациялайтын және шынайы көрінетін медиа контент.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Саясаткерлер арасында ең көп нысанаға алынған тұлға премьер-министр Кир Стармер болды. Негізгі нарративтер оның атынан айтылған жалған мәлімдемелерден, мысалы, айыппұлдар, қоғамдық дәретханаларды пайдалану үшін төлемдер, мерекелік әшекейлерге салынатын салықтар немесе қолма-қол ақша алуға шектеулер сияқты танымал емес шаралар туралы жалған ақпараттардан тұрды. Сондай-ақ, полицияның мұсылмандар мен мигранттарға қатысты әрекеттері туралы тақырыптар да жиі кездесті. Бұл материалдарда ұқсас шаблондардың қолданылуы олардың ұйымдасқан түрде таратылғанын көрсетеді, алайда қолда бар деректер базасы мұны нақты растауға жеткіліксіз. Зерттеу бұл жалған ақпараттардың қоғамдық пікірге әсерін бағалауды мақсат етпеген, бірақ авторлар мұндай әсер ету үшін техникалық жағдайлардың болғанын атап өтеді.&lt;/p&gt;\n&lt;h4 id=\"viraldylykh-pen-aeleuetti-aeser-arasyndaghy-korrelyaciya-shekaralary\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#viraldylykh-pen-aeleuetti-aeser-arasyndaghy-korrelyaciya-shekaralary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Виралдылық пен әлеуетті әсер арасындағы корреляция шекаралары&lt;/span&gt;&lt;/a&gt;Виралдылық пен әлеуетті әсер арасындағы корреляция шекаралары&lt;/h4&gt;\n&lt;p&gt;Жалған мәлімдеме қамтитын аудитория көлемі мен оның қоғамға әсер ету әлеуеті арасындағы байланыс көбінесе ойлағаннан гөрі күрделірек.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Зерттеу жалған ақпараттың нақты салдарға әкелу механизмдерін талдайды. Авторлар екі сценарийді бөліп көрсетеді: ондаған немесе жүздеген мың адамды қамтитын жаппай әсер ету және шешім қабылдау құзыреті бар нақты тұлғаға бағытталған әсер ету. Соңғысына мысал ретінде 2000 жылы ғылыми журналда жарияланған ЖИТС себептері туралы жалған теория келтіріледі, ол Оңтүстік Африка президенті Табо Мбекидің саясатына әсер етіп, қоғамдық денсаулық сақтау саласында қайғылы салдарға әкелді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Виралдылық — бұл контенттің желіде тез таралу қабілеті, алайда авторлар аудиторияны қамту әрқашан нақты әсермен байланысты емес екенін атап өтеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Деректер жиынтығын талдау көрсеткендей, виралды жарияланымдардың көпшілігі (1 миллионнан астам қаралым) елеулі салдарға әкелу әлеуетіне ие емес. Бұл не дәлсіздіктердің тар шеңберімен, не аудиторияның жалған ақпарат негізінде әрекет етуге мотивациясының немесе мүмкіндігінің жоқтығымен түсіндіріледі. Тіпті дезинформация өте үлкен аудиторияны қамтыған жағдайда да (мысалы, 2016 жылғы «Pizzagate» теориясы), тек жекелеген адамдар ғана белсенді әрекетке көшеді, дегенмен қамту ауқымы мұндай оқиғалардың ықтималдығын статистикалық тұрғыдан арттырады.&lt;/p&gt;\n&lt;h4 id=\"aeser-etu-aukhymy\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#aeser-etu-aukhymy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әсер ету ауқымы&lt;/span&gt;&lt;/a&gt;Әсер ету ауқымы&lt;/h4&gt;\n&lt;p&gt;Салдардың ауқымы мен ауырлығы контекстке байланысты. Зерттеудегі деректер жиынтығында 1 жағдай қудалауға ұшыраған нақты тұлғаға, 8 жағдай жекелеген адамдарға (мысалы, алаяқтық немесе жалған медициналық кеңестер), 10 жағдай белгілі бір топтарға (мысалы, діни немесе әлеуметтік топтарды кемсіту), 39 жағдай қоғамға (саяси немесе әлеуметтік көзқарастарға әсер) қатысты болды. 20 жағдайда әсер ету ауқымын анықтау мүмкін болмады.&lt;/p&gt;\n&lt;h4 id=\"6-usynystar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#6-usynystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Ұсыныстар&lt;/span&gt;&lt;/a&gt;6. Ұсыныстар&lt;/h4&gt;\n&lt;p&gt;Авторлар әлеуметтік желілер мен іздеу жүйелеріне жасанды интеллект көмегімен жасалған немесе өңделген контент үшін ашықтық саясатын енгізуді ұсынады. Бұл шаралар саясаткерлердің әрекеттері, сайлау процестері, наразылық шерулері, психикалық денсаулық, жыныстық мінез-құлық, емдеу әдістері, репродуктивті денсаулық, спорт және медициналық қызметтерге қолжетімділік сияқты тақырыптарды қамтуы тиіс.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Full Fact ұйымы (қайырымдылық қоры № 1158683, коммерциялық емес компания № 6975984) жасанды интеллект (ЖИ) көмегімен жасалған контентті реттеу бойынша шаралар кешенін ұсынады. Дезинформациямен күресу үшін «үш ескерту» жүйесін енгізу ұсынылады: қауымдастық ережелерін бұза отырып, ЖИ қолданылғанын жүйелі түрде жасыратын авторлар платформалардан тұрақты түрде бұғатталуы тиіс. Маңызды бағыт — сайлау немесе дағдарыс кезеңдерінде өзекті болып табылатын контентті «егу» (seeding) және көшіруді анықтау үшін компаниялар арасындағы технологиялық ынтымақтастық. Сондай-ақ, ақпаратты жанама түрде ашудың халықаралық стандарттарын жасауға қатысу және зерттеушілерге модерация құралдарының дәлдігі туралы деректерге қолжетімділікті қамтамасыз ету қажеттілігі атап өтіледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контентті «егу» (seeding) — бұл жаппай қолдау немесе табиғи қызығушылық иллюзиясын жасау үшін желілік аккаунттар арқылы ақпарат тарату стратегиясы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"uekimetke-arnalghan-usynystar\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#uekimetke-arnalghan-usynystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Үкіметке арналған ұсыныстар&lt;/span&gt;&lt;/a&gt;Үкіметке арналған ұсыныстар&lt;/h4&gt;\n&lt;p&gt;Full Fact Ұлыбритания үкіметін камералар мен смартфондардың аппараттық қамтамасыз етуіне цифрлық деректерді (content credentials) енгізуді ынталандыруға шақырады. Генеративті ЖИ әзірлеушілері контент жасалған кезде автоматты цифрлық су белгілерін қолдануға міндетті болуы керек. Ірі платформалар мен іздеу жүйелері SynthID және C2PA спецификациялары сияқты технологияларға сүйене отырып, контенттің шығу тегін белгілеудің бірыңғай стандарттарын пайдалануы шарт. Сонымен қатар, платформалардың азаматтық талқылауға, сайлау процестеріне және қоғамдық денсаулыққа төнетін қауіптерді бағалау және азайту міндеттемесін заңнамалық түрде &lt;a href=\"concepts/anchoring.html\"&gt;бекіту&lt;/a&gt; ұсынылады. Маңызды элемент — зерттеушілер мен фактчекерлердің платформа деректеріне тәуелсіз қолжетімділігін қамтамасыз ететін құрылымды жасау, бұл құпиялылық стандарттарын сақтай отырып, ашықтықты қамтамасыз етеді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS2.jpg\" alt=\"Сурет S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS2-2.jpg\" alt=\"Сурет S2 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS2-3.jpg\" alt=\"Сурет S2 (жалғасы 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S2 (жалғасы 3)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ЖИ фейктерінің&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қоғамға әсері&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&
