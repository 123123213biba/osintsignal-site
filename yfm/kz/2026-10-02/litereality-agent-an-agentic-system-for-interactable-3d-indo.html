        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"84\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"676\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · IMAGE_FORENSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LiteReality-Agent: бөлме&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;скандарын код арқылы&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;интерактивті 3D-модельге&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;айналдыру&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"1-сурет: LiteReality-Agent көмегімен шынайы бөлмені қайта құрастыру. LiteReality-Agent қайта құрастыру тапсырмасын бағда\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: LiteReality-Agent көмегімен шынайы бөлмені қайта құрастыру. LiteReality-Agent қайта құрастыру тапсырмасын бағдарламалау тапсырмасы ретінде қайта қарастырады, мұнда кодтаушы агент шынайы, интерактивті және симуляцияға дайын 3D бөлмеге компиляцияланатын Room.py файлын жазады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;LiteReality-Agent 3D-реконструкцияны бағдарламалау міндетіне айналдырады. Жүйе RGB-D скандарын пайдаланып, интерьердің геометриясы мен физикалық қасиеттерін сипаттайтын Room.py файлын жасайды. Агент өлшемдер мен соқтығысуларды тексеру құралдары арқылы модельді жетілдіреді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;3D-сахна реконструкциясы орындалатын Python-код жазу міндеті ретінде қалыптастырылған.&lt;/li&gt;\n&lt;li&gt;«Бақылау-өңдеу-тексеру» циклі физикалық сенімділікті арттырады.&lt;/li&gt;\n&lt;li&gt;Жүйе визуалды және геометриялық дәлдік бойынша Astra және Fable модельдерінен озық.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aedister-zhaene-daeldik\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#aedister-zhaene-daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер және дәлдік&lt;/span&gt;&lt;/a&gt;Әдістер және дәлдік&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Әдіс&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Деректер&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Дәлдік&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Шектеу&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;LiteReality-Agent&lt;/td&gt;\n&lt;td&gt;Бөлмелердің RGB-D скандары&lt;/td&gt;\n&lt;td&gt;Визуалды және геометриялық көрсеткіштер бойынша ең жоғары балл&lt;/td&gt;\n&lt;td&gt;Бастапқы сканерлеу дәлдігіне тәуелділік&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жүйе екі кезеңде жұмыс істейді: сахнаны бастапқы дайындау және агенттік жобалау. Бірінші кезеңде алгоритмдер сканерлеу деректерін талдайды, нысандарды қалпына келтіреді және жоспарлау қателерін түзеп, Room.py кодын жасайды. Содан кейін «бақылау-өңдеу-тексеру» циклі іске қосылады, онда агент рендерлерді салыстыру, геометриялық өлшемдер жүргізу және физикалық байланыстарды (нысандарды қолдау, соқтығысулардың болмауы) тексеру үшін арнайы құралдарды пайдаланады.&lt;/p&gt;\n&lt;p&gt;Дәстүрлі нүктелік бұлтты әдістерден айырмашылығы, LiteReality-Agent MuJoCo сияқты симуляторларға экспорттауға дайын құрылымдалған ортаны жасайды. Жүйе геометриялық дәлдік пен визуалды реализм бойынша Astra және Fable сияқты заманауи модельдерден асып түседі. Бүкіл процесс ашық және өңделетін болып қалады, өйткені кез келген өзгерістер тікелей бағдарламалық кодқа енгізіледі, бұл нәтижелердің жоғары деңгейде қайталануын қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе бастапқы RGB-D деректерінің сапасына сүйенеді және LLM-агенттердің кеңістіктік қатынастарды түсіну қабілетімен шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Авторлар RGB-D сканерлеу деректерін нақты үй-жайлардың жоғары сапалы, артикуляцияланған және симуляцияға дайын 3D көріністеріне айналдыратын LiteReality-Agent агенттік жүйесін ұсынады. Жүйенің негізінде 3D реконструкцияны бағдарламалау мәселесі ретінде қалыптастыру жатыр: агент дәйекті түрде деректерді жинақтайды және Room.py Python скриптін өңдейді, оны орындау арқылы кеңістіктің цифрлық егізі жасалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent геометриялық дәлдік, визуалды реализм және симуляторлармен үйлесімділік бойынша Astra және Fable сияқты заманауи модельдерден озық тұр.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе «бақылау — өңдеу — тексеру» циклі негізінде жұмыс істейді. Бұл механизм реконструкция процесінің барлық кезеңдерінде дәлелдемелерді жинауды, өлшеулер жүргізуді, жоспарлауды оңтайландыруды және сапаны бақылауды қамтамасыз етеді. Мұндай тәсіл денеленген жасанды интеллектіні (embodied AI) оқытуға жарамды көріністерді жасауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Денеленген жасанды интеллект (Embodied AI) — бұл зияткерлік агенттер виртуалды ортаны пайдалана отырып, физикалық әлеммен өзара әрекеттесу дағдыларын қалыптастыратын бағыт.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LiteReality-Agent оркестрлеу үшін тиімді фреймворк ретінде қызмет етеді, агенттерді мамандандырылған құралдармен және құрылымдалған жұмыс процестерімен қамтамасыз етеді. Авторлар ұсынылған архитектура реконструкция сенімділігін айтарлықтай арттыратынын атап өтеді. Жүйенің бастапқы коды мен деректерді жинау қосымшасы real-to-sim тапсырмаларында пайдалану үшін ашық қолжетімділікте жарияланған.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"funkcionaldy-cifrlykh-egizderdi-khuru\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#funkcionaldy-cifrlykh-egizderdi-khuru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функционалды цифрлық егіздерді құру&lt;/span&gt;&lt;/a&gt;Функционалды цифрлық егіздерді құру&lt;/h4&gt;\n&lt;p&gt;Физикалық модельдеуге дайын цифрлық егіздерді жасау — кері графика саласындағы басты мақсаттардың бірі. Нүктелік бұлттар немесе дәстүрлі торлар (mesh) негізіндегі әдістерден айырмашылығы, авторлар өзара әрекеттесуге және симуляцияға жарамды құрылымдалған ортаны қалпына келтіруді көздейді. Бұл сахнаны түсінуді, нысандар мен олардың артикуляциясын қалпына келтіруді, материалдар мен физикалық қасиеттерді бағалауды талап етеді. Бұрын CAD-модельдеу немесе дифференциалды рендеринг әдістері қолданылғанымен, нақты сканерлеу нәтижелерін жоғары сапалы интерактивті ортаға айналдыратын масштабталатын жүйені құру әлі де күрделі мәселе болып қалуда. LiteReality сияқты қолданыстағы шешімдер детерминистік шектеулерге ие, ал LLM негізіндегі жүйелер (Holodeck, SceneCraft, SceneSmith) көбінесе нақты бақылауларға сүйенбейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent — бұл RGB-D бөлме сканерлеу нәтижелерін орындалатын Room.py кодына айналдыратын, физикалық тұрғыдан дұрыс және өңдеуге болатын 3D орталарды жасайтын агенттік жүйе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"litereality-agent-arhitekturasy\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#litereality-agent-arhitekturasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LiteReality-Agent архитектурасы&lt;/span&gt;&lt;/a&gt;LiteReality-Agent архитектурасы&lt;/h4&gt;\n&lt;p&gt;Жүйе «реконструкцияны бағдарламалау ретінде» концепциясына негізделген. Бүкіл сахна Room.py файлында сипатталады. Процесс екі кезеңнен тұрады: сахнаны инициализациялау және агенттік авторлық. Бірінші кезеңде нысандар кескіндерден қалпына келтіріледі, ал Layout Agent сканерлеудегі қателерді, соқтығысуларды және нысандардың тірек қатынастарын тексереді. Содан кейін «бақылау-өңдеу-тексеру» циклі іске қосылады. Агент рендеринг, геометриялық өлшемдер және өңдеу құралдарын пайдаланады. Физикалық қасиеттер Articraft тәсіліне ұқсас бағаланады. Python коды арқылы сахнаны табиғи тілдегі нұсқаулармен өзгертуге болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агенттік жүйе — бұл AI агенті өз әрекеттерін жоспарлайтын, құралдарды пайдаланатын және нәтижелерді тексеретін бағдарламалық архитектура.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйенің тиімділігі бастапқы RGB-D сканерлеу нәтижелерінің дәлдігіне және агенттің геометриялық шектеулерді түсіндіру қабілетіне байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghalau-zhaene-naetizheler\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#baghalau-zhaene-naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау және нәтижелер&lt;/span&gt;&lt;/a&gt;Бағалау және нәтижелер&lt;/h4&gt;\n&lt;p&gt;Авторлар LiteReality-Agent жүйесін нақты интерьерлерде LiteReality және жалпы мақсаттағы кодтау агенттерімен (GPT-6 Astra, Fable 5.1) салыстырды. Бағалау визуалды дәлдік, геометриялық сенімділік және сарапшылық бағалаулар негізінде жүргізілді. Жүйе барлық көрсеткіштер бойынша ең жоғары нәтижелерді көрсетті.&lt;/p&gt;\n&lt;h4 id=\"khatysty-zhumystar\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#khatysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ҚАТЫСТЫ ЖҰМЫСТАР&lt;/span&gt;&lt;/a&gt;ҚАТЫСТЫ ЖҰМЫСТАР&lt;/h4&gt;\n&lt;p&gt;Ішкі кеңістікті реконструкциялау және нақтылықтан симуляцияға көшу. Объектіге бағытталған әдістер CAD активтерін бақылау деректерімен сәйкестендіреді, ал нейрондық өкілдіктер сахнаның геометриясы мен сыртқы түрін қалпына келтіреді. LiteReality және MetaScenes сияқты заманауи жүйелер скандарды активтерге негізделген ортаға айналдырады. Video2Game, DRAWER және HoloScene бейнеден интерактивті әлемдерді қалпына келтіреді, бұл ретте DRAWER артикуляцияны да анықтайды. Роботтарды оқыту үшін Phone2Proc (мобильді скандардан процедуралық орталар), RialTo және PolaRiS (саясатты жетілдіру үшін цифрлық егіздер) сияқты шешімдер қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Реконструкциялаудың заманауи әдістері активтерді жай ғана таңдаудан интерактивті орталарды генерациялауға көшті, мұнда артикуляция мен физикалық қасиеттер агенттік циклдар арқылы қалпына келтіріледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Объектілерді генерациялау және артикуляция. Кескінді 3D форматына ауыстыру әдістері көп ракурсты синтезден бастап ірі генеративті модельдерге дейінгі диапазонда жұмыс істейді. CAST генерацияланған объектілерді сахнаға сәйкестендіреді, ал URDFormer кескіндерден артикуляцияланған симуляциялық орталарды шығарады. Real2Code және Articraft сияқты тәсілдер артикуляцияны код ретінде болжайды және арнайы SDK арқылы валидациядан өткізеді.&lt;/p&gt;\n&lt;p&gt;Тіл арқылы сахнаны басқару және агенттік графика. LayoutGPT және Holodeck сияқты жүйелер табиғи тілді пайдаланып жоспарлауды жүзеге асырады, ал 3D-GPT және SceneCraft бағдарламалық 3D модельдеу үшін тілдік модельдерді қолданады. VIGA, Thinking in Blender және HARMONY сияқты агенттік тәсілдер «код-рендеринг-тексеру» циклдарын пайдаланып, бір кескін негізінде сахнаны нақтылайды. LiteReality-Agent бұл тәсілді дамытып, RGB-D реконструкциясында метрлік дәлдікті және көп ракурсты тексеруді қамтамасыз етеді.&lt;/p&gt;\n&lt;h4 id=\"litereality-agent\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#litereality-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LITEREALITY-AGENT&lt;/span&gt;&lt;/a&gt;LITEREALITY-AGENT&lt;/h4&gt;\n&lt;p&gt;LiteReality-Agent екі кезеңде жұмыс істейді: сахнаны инициялау (жоспар мен негізгі объектілерді анықтау) және агенттік жобалау, мұнда сахнаның орындалатын коды «бақылау–өңдеу–тексеру» циклы арқылы нақтыланады (2-сурет).&lt;/p&gt;\n&lt;p&gt;3.1 КІРІС ДЕРЕКТЕРІ: RGB-D СКАНДАР ЖӘНЕ ДЕТЕКЦИЯ НӘТИЖЕЛЕРІ. Жүйе LiteRealityScan қосымшасынан алынған деректерді, соның ішінде бөлме геометриясы мен объектілердің шекаралық рамкаларын (bounding boxes) қабылдайды.&lt;/p&gt;\n&lt;p&gt;3.2 САХНАНЫ ИНИЦИАЛДАУ. Біз LiteReality методологиясын ұстанамыз: бөлме қабығы мен объектілерді бөлек реконструкциялаймыз. Жоспар агенті сахна графының құрылымын жасайды, мұнда қолдау байланыстары (мысалы, орындық еденде) және функционалды топтар ескеріледі. Геометриялық тексерулер қателерді анықтайды: қабырға ішіндегі немесе тірегі жоқ объектілер. Түзетулер детерминирленген немесе кескінге негізделген пайымдаулар арқылы енгізіледі. Объектілерді реконструкциялау әр элемент үшін таза референстік кескіндерді генерациялауды қамтиды. Статикалық объектілер TRELLIS.2 моделімен, ал артикуляцияланғандары процедуралық генерация арқылы өңделеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агенттік цикл (1-алгоритм) — бұл LLM ортаның күйін талдайтын, кодты (Room.py) түзету бойынша әрекеттерді орындайтын және сапаны бақылау құралдары (1-кесте) арқылы нәтижені тексеретін процесс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-agenttik-zhobalau\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#33-agenttik-zhobalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 Агенттік жобалау&lt;/span&gt;&lt;/a&gt;3.3 Агенттік жобалау&lt;/h4&gt;\n&lt;p&gt;Жобалау процесі агенттің түсірілім деректерін талдауы, сахна кодын түзетуі және рендерлеу мен геометриялық тексерулер арқылы нәтижені растауынан тұрады. 1-кестеде агенттің нысандар мен кеңістікті басқаруға арналған құралдары тізілген.&lt;/p&gt;\n&lt;h4 id=\"331-verifikaciya-khuraldary\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#331-verifikaciya-khuraldary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3.1 Верификация құралдары&lt;/span&gt;&lt;/a&gt;3.3.1 Верификация құралдары&lt;/h4&gt;\n&lt;p&gt;Агент үш деңгейде жұмыс істейді: бөлме, қабырға немесе жеке нысан. Бөлме деңгейінде қабырғаларды толық қамтитын кадрлар таңдалады. Қабырға деңгейінде экрандағы проекциялық ауданы ең үлкен ракурстар басымдыққа ие. Нысан деңгейінде рендер манифесті арқылы ең анық көріністер табылады. Кадрлар арасындағы минималды қашықтық қайталануларды болдырмайды. Рендер мен фотосуреттерді салыстыру (Сурет A7a–c) қателіктерді нақты нысан деңгейінде анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рендер-салыстыру — виртуалды модель мен нақты фотосуретті бірдей камера параметрлерімен салыстырып, геометриялық немесе текстуралық ауытқуларды анықтау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қабырғалармен жұмыс істегенде кадрлар метрикалық жазықтыққа проекцияланады және қашықтықты өлшеу үшін координаттар торы құрылады (Сурет A8d). Бұл нысандарды Room.py кодында дәл орналастыруға мүмкіндік береді. PBR-текстуралар үшін агент материал карталарын таңдап, түсін нақты бақылауларға сәйкестендіреді. Жобалау төрт кезеңнен тұрады: қабырға материалдары, жарықтандыру мен жабдықтар, ұсақ нысандар және процедуралық модельдерді нақтылау. Нысандар өзара байланыстармен (мысалы, «үстінде» немесе «бекітілген») топтастырылады.&lt;/p&gt;\n&lt;h4 id=\"332-bakhylau-zhaene-sapany-tekseru\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#332-bakhylau-zhaene-sapany-tekseru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3.2 Бақылау және сапаны тексеру&lt;/span&gt;&lt;/a&gt;3.3.2 Бақылау және сапаны тексеру&lt;/h4&gt;\n&lt;p&gt;Автоматты түрде аяқтау қиын болғандықтан, итерациялар мен құралдарды шақыру бойынша лимиттер енгізілген. Лимиттің соңғы 10%-ында агент зерттеу функцияларын өшіріп, нәтижені сақтауға көшеді. Геометриялық тексеру соқтығысуларды (коллизияларды) анықтауды және тірек беттерін бағалауды қамтиды. Егер нысан «қалқып» қалса немесе басқа нысанмен қиылысса, агент түзетулерді есептеп, Room.py кодын жаңартады. 3-кестеде соқтығысулар мен тіректер бойынша қорытынды көрсеткіштер берілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Итерациялар бойынша қатаң лимиттер мен автоматтандырылған геометриялық тексерулер нысандардың орналасу қателіктерін азайтады және сахнаның физикалық тұрғыдан дұрыстығын қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"34-simulyaciyagha-eksporttau\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#34-simulyaciyagha-eksporttau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4 Симуляцияға экспорттау&lt;/span&gt;&lt;/a&gt;3.4 Симуляцияға экспорттау&lt;/h4&gt;\n&lt;p&gt;Дайын сахна MuJoCo ортасына экспортталады. Стационарлық элементтер бекітіледі, ал қозғалмалы нысандар еркін буындармен (ілмекті немесе сырғымалы) қамтамасыз етіледі. Экспортер масса, инерция және соқтығысу геометриясы сияқты физикалық қасиеттерді сақтап қалады.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"41-eksperimenttik-khondyrghy\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#41-eksperimenttik-khondyrghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1 Эксперименттік қондырғы&lt;/span&gt;&lt;/a&gt;4.1 Эксперименттік қондырғы&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер LiteReality-Agent жүйесін 620 түсірілім ракурсын қамтитын он ішкі көріністе сынақтан өткізді. Салыстыру үшін LiteReality және екі әмбебап агент: GPT-6 (Codex ортасында) және Fable 5.1 (Claude Code ортасында) қолданылды. Әмбебап агенттер екі режимде: тек RGB-фотосуреттер және LiteReality сканерлеу деректері (+Scan) арқылы бағаланды. Барлық әдістер бірдей фотосуреттерді пайдаланды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бағалау әдісі: барлық реконструкциялар камера координаттар жүйесіне сәйкестендіріледі және 960×720 ажыратымдылығында рендерленеді. Бағалау түсірілім нүктелерінде жүзеге асырылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"42-vizualdy-daeldik\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#42-vizualdy-daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2 Визуалды дәлдік&lt;/span&gt;&lt;/a&gt;4.2 Визуалды дәлдік&lt;/h4&gt;\n&lt;p&gt;Бағалау үшін SSIM, PSNR, RMSE және LPIPS метрикалары қолданылды. 2-кестеге сәйкес, LiteReality-Agent барлық төрт метрика бойынша ең үздік нәтижелерді көрсетті. GPT-6 (+Scan) моделімен салыстырғанда, PSNR 1.162 дБ-ге өсті, ал LPIPS 13.7%-ға төмендеді. LiteReality базалық моделіне қатысты өсім PSNR бойынша 2.248 дБ және LPIPS бойынша 19.6%-ды құрады. Сапалық салыстыру 3-суретте көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent барлық аналогтардан озып, PSNR көрсеткішін 14.129 дБ-ге дейін арттырды және LPIPS-ті 0.5392-ге дейін төмендетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"43-geometriyalykh-saejkestik-zhaene-fizikalykh-senimdilik\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#43-geometriyalykh-saejkestik-zhaene-fizikalykh-senimdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 Геометриялық сәйкестік және физикалық сенімділік&lt;/span&gt;&lt;/a&gt;4.3 Геометриялық сәйкестік және физикалық сенімділік&lt;/h4&gt;\n&lt;p&gt;Бағалау тереңдіктегі орташа абсолюттік қателікті (MAE), жиһаздың тірек беттерімен жанасуын (1 см шегінде) және нысандардың қиылысу санын қамтыды. 3-кестеден көрінгендей, LiteReality-Agent 10.50 см MAE көрсеткішіне қол жеткізді (GPT-6 (+Scan)-нан 21.2%-ға жақсырақ). Жиһаздың тірекпен жанасуы 100%-ды құрады және ешқандай қиылысу анықталмады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метрикалар толық физикалық шынайылықты емес, физикалық сенімділікті бағалайды, өйткені көріністердегі нысандар саны әдістерге байланысты әртүрлі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"44-skanerleu-derekterining-aembebap-agentterge-aeseri\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#44-skanerleu-derekterining-aembebap-agentterge-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4 Сканерлеу деректерінің әмбебап агенттерге әсері&lt;/span&gt;&lt;/a&gt;4.4 Сканерлеу деректерінің әмбебап агенттерге әсері&lt;/h4&gt;\n&lt;p&gt;Сканерлеу деректерін қосу визуалды метрикаларды айтарлықтай жақсартты: GPT-6 үшін PSNR 11.549-дан 12.967 дБ-ге дейін өсті, ал тереңдіктегі MAE 67.1%-ға қысқарды. Алайда, бұл әрқашан орналасуды жақсарта бермеді: жиһаз қиылысуларының саны артты және GPT-6-ның тірекпен жанасу деңгейі 69.1%-дан 63.0%-ға дейін төмендеді.&lt;/p&gt;\n&lt;h4 id=\"46-adamdar-men-agentter-arkhyly-khabyldaudy-baghalau\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#46-adamdar-men-agentter-arkhyly-khabyldaudy-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.6 Адамдар мен агенттер арқылы қабылдауды бағалау&lt;/span&gt;&lt;/a&gt;4.6 Адамдар мен агенттер арқылы қабылдауды бағалау&lt;/h4&gt;\n&lt;p&gt;Сарапшылар (адамдар мен екі агент) жоспарлау дәлдігін, нысандар ұқсастығын және жалпы көрініс ұқсастығын бес балдық шкала бойынша бағалады. LiteReality-Agent ең жоғары баллдарды (4.60–5.00) алды (4-кесте).&lt;/p&gt;\n&lt;h4 id=\"baghalau-naetizheleri\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#baghalau-naetizheleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау нәтижелері&lt;/span&gt;&lt;/a&gt;Бағалау нәтижелері&lt;/h4&gt;\n&lt;p&gt;LiteReality-Agent 4-кестеде көрсетілген адамдық бағалаудың барлық негізгі көрсеткіштері бойынша басымдық танытты. Орташа баллдар: орналасу (layout) үшін 4,60, объектілер ұқсастығы (object similarity) үшін 4,58 және жалпы ұқсастық (overall similarity) үшін 4,54. Бұл көрсеткіштер GPT-6 (+Scan) моделінің нәтижелерінен сәйкесінше 1,49, 1,60 және 1,54 балға жоғары.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent 65 жұптық салыстырудың 53-інде жеңіске жетіп, GPT-6 (+Scan) моделінен айтарлықтай озып кетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қатысушылар сахналарды салыстырған жұптық тестілеу барысында біздің әдіс 65 жағдайдың 53-інде жеңіске жетті, 11 тең нәтиже және тек бір жеңіліс тіркелді. Автоматтандырылған агент бағалаушылары да LiteReality-Agent-ті бірінші, ал GPT-6 (+Scan)-ді екінші орынға қойды, дегенмен олардың қорытынды баллдары адамдардың бағалауынан өзгеше.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шектеулері: таңдама көлемінің аздығы, сахналардың біркелкі қамтылмауы және бағалаулардың өзара тәуелділігі әдістің статистикалық маңыздылығын немесе физикалық дәлдігін растауға мүмкіндік бермейді; агент бағалаулары адам пікірін толық алмастыра алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Біз LiteReality-Agent жүйесін ұсындық. Бұл 3D-реконструкциялау мәселесін бағдарламалау есебі ретінде қарастыратын және RGB-D сканерлеу нәтижелерін шынайы, артикуляцияланған және симуляцияға дайын көріністерге айналдыратын ашық бастапқы кодты жүйе. Жүйенің «бақылау-өңдеу-тексеру» механизмі орындалатын көрініс бағдарламаларын, арнайы құралдарды және дәлелдерге негізделген верификацияны біріктіріп, реконструкция сапасы мен сенімділігін арттырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent он түрлі көріністегі сынақтарда визуалды дәлдік, геометриялық үйлесімділік және қабылдау сапасы бойынша бұрынғы агент-модельдерден озық нәтиже көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RGB-D сканерлеу — бұл нысанның түсі мен қашықтығын (тереңдігін) бір уақытта жазып алатын технология, ол 3D ортаны құру үшін негіз болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Он көрініс бойынша алынған нәтижелер біздің шешіміміздің визуалды шынайылық пен геометриялық дәлдік көрсеткіштері бойынша озық агент-модельдерден айтарлықтай жоғары екенін дәлелдейді. Бағдарламалаушы агенттер дамыған сайын, бұл оркестрлеу жүйесі шынайы әлемнен симуляцияға көшу (real-to-sim) жүйелері мен денеленген жасанды интеллектті (embodied AI) дамыту үшін практикалық негіз болып табылады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"1-сурет: LiteReality-Agent көмегімен шынайы бөлмені қайта құрастыру. LiteReality-Agent қайта құрастыру тапсырмасын бағда\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: LiteReality-Agent көмегімен шынайы бөлмені қайта құрастыру. LiteReality-Agent қайта құрастыру тапсырмасын бағдарламалау тапсырмасы ретінде қайта қарастырады, мұнда кодтаушы агент шынайы, интерактивті және симуляцияға дайын 3D бөлмеге компиляцияланатын Room.py файлын жазады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f2.jpg\" alt=\"2-сурет: LiteReality-Agent-тің толық (end-to-end) конвейері.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: LiteReality-Agent-тің толық (end-to-end) конвейері.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: LiteReality-Agent-тің толық (end-to-end) конвейері. RGB–D сканерлері мен анықтаулар орындалатын бастапқы бөлмені жасау үшін орналасуды түзетуге және объектіні қайта құрастыруға бағыттайды. Авторлық агент түсірілім көріністерін, өлшемдерді, материалдарды және рендерленген салыстыруларды пайдалана отырып, «бақылау — өңдеу — тексеру» циклі арқылы Room.py файлын жетілдіреді. Бақылау шлюздері өңдеуді шектейді және геометрия мен тіректі тексереді. Өңделетін сцена мен физикалық метадеректер MuJoCo-ға экспорттауды қолдайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f4.jpg\" alt=\"4-сурет: Қайта құрастырулардың өкілетті салыстырулары. Асхана (жоғарыда) және келіссөздер бөлмесі (төменде), түсірілген \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Қайта құрастырулардың өкілетті салыстырулары. Асхана (жоғарыда) және келіссөздер бөлмесі (төменде), түсірілген RGB фотосуреттерімен, қайта құрастырылған көріністерімен және нүктелер бұлты/сцена жоспарының көріністерімен.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f6.jpg\" alt=\"6-сурет: Симуляция және өзара әрекеттесу. MuJoCo-да қайта құрастырылған асхана, шайқаудан кейін және Franka манипуляторы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Симуляция және өзара әрекеттесу. MuJoCo-да қайта құрастырылған асхана, шайқаудан кейін және Franka манипуляторының орын ауыстыру мысалында.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS1.jpg\" alt=\"A1-сурет: Қосымша толықтырушы көріністерді салыстыру. Әрбір жағдайда бастапқы RGB кескіні және оған сәйкес RGB–D сканы к\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A1-сурет: Қосымша толықтырушы көріністерді салыстыру. Әрбір жағдайда бастапқы RGB кескіні және оған сәйкес RGB–D сканы көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS2.jpg\" alt=\"A2 суреті A1 суретін әр бөлме үшін екінші сәйкестендірілген көру нүктесімен толықтырады, бұл сахнаның қосымша аймақтарын\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A2 суреті A1 суретін әр бөлме үшін екінші сәйкестендірілген көру нүктесімен толықтырады, бұл сахнаның қосымша аймақтарын ашып, көру нүктелері бойынша реконструкцияның үйлесімділігін кеңірек бағалауға мүмкіндік береді. A2 суреті: Барлық бағалау бөлмелері бойынша қосымша реконструкцияларды салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS3.jpg\" alt=\"A3 суреті: Түсірілімнен бастапқы бөлмеге дейін. Жұмыс істеп тұрған ас үй мысалы RGB-D нүктелер бұлтын, анықталған қорапт\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A3 суреті: Түсірілімнен бастапқы бөлмеге дейін. Жұмыс істеп тұрған ас үй мысалы RGB-D нүктелер бұлтын, анықталған қораптар мен орналасуды, реконструкцияланған қабықшаны және жинақталған бастапқы сахнаны көрсетеді. Беттің нәзік көрінісі, жабдықтар мен ұсақ объектілер жасау барысында нақтыланады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS4.jpg\" alt=\"A4 суреті: Орналасуды түзетуге дейін және кейін.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A4 суреті: Орналасуды түзетуге дейін және кейін.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;A4 суреті: Орналасуды түзетуге дейін және кейін. Жоспарлар үш сахна үшін сақталған кіріс және шығыс қораптары негізінде тікелей сызылған. Сол жақ бағандағы қызыл контурлар өзгертілген қораптарды белгілейді; көк контурлар олардың оң жақтағы түзетілген күйін көрсетеді. Үзік-үзік қызыл контурлар өздерінің бастапқы өлшемдерін сақтайды, ал көрсеткілер орталықтың ығысуын көрсетеді. Әрбір жұп бірдей масштаб пен көру нүктесін пайдаланады; сұр объектілер мен қабырғалар өзгермейтін контекстті қамтамасыз етеді. Мәжіліс залындағы белгілер орындықтарды C және теледидарды TV деп қысқартады. Бұл егжей-тегжейлі торды реконструкциялау мен жасауға дейінгі орналасу кезеңіндегі салыстырулар.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS5.jpg\" alt=\"A5 суреті сканерлеу көріністері негізінде жасалған таза эталондарды пайдалана отырып, екі реконструкция бағытын да көрсе\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A5 суреті сканерлеу көріністері негізінде жасалған таза эталондарды пайдалана отырып, екі реконструкция бағытын да көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;A5 суреті сканерлеу көріністері негізінде жасалған таза эталондарды пайдалана отырып, екі реконструкция бағытын да көрсетеді. Өңделмеген түсірілімдер дәлдікті тексеру үшін дәлел болып қалады: жабылған бөліктердің аяқталған күйі болжамды болып табылады. A5 суреті: Түсірілім эталондары негізінде объектілерді реконструкциялау. Әрбір қатар түсірілген көріністерді, тазартылған эталонды және реконструкцияланған активті көрсетеді. Раковина астындағы шкаф буынды бөліктері бар процедуралық геометрияны пайдаланады; диван кескінді 3D форматына ауыстыруды пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS6.jpg\" alt=\"A6 суреті: Үш ауқымда көріністі таңдау. Бөлме бойынша сұраулар бірнеше бетті қамтиды, қабырға бойынша сұраулар бір құрыл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;A6 суреті: Үш ауқымда көріністі таңдау. Бөлме бойынша сұраулар бірнеше бетті қамтиды, қабырға бойынша сұраулар бір құрылымдық элементке бағытталады, ал объект бойынша сұраулар жеке активтің бақылауларын қайтарады. Сандар түсірілім кадрларын анықтайды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS7.jpg\" alt=\"А7-сурет: Авторлықтың дәлелдері. (a–c) Рендер-фотосурет жұптары сәйкессіздіктерді біртіндеп егжей-тегжейлі деңгейде анық\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;А7-сурет: Авторлықтың дәлелдері. (a–c) Рендер-фотосурет жұптары сәйкессіздіктерді біртіндеп егжей-тегжейлі деңгейде анықтау үшін бөлме, қабырға және нысан аннотацияларын пайдаланады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS8.jpg\" alt=\"А8-сурет: Қабырғаларды біріктіру және метрикалық өлшеу.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;А8-сурет: Қабырғаларды біріктіру және метрикалық өлшеу.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;А8-сурет: Қабырғаларды біріктіру және метрикалық өлшеу. Асүй мысалындағы екі қабырға калибрленген түсірілім кадрларынан түзетілген. (a) Біріктірілген эталонда шығып тұрған жиһаздың айналасында көрінетін жіктер мен проекциялық артефактілер сақталады. (b) Оның жабу маскасы бақыланатын пиксельдерді (ақ) бақыланбайтын пиксельдерден (қара) ажыратады. (c–d) Екінші біріктірілген қабырға метрикалық торды қосқанға дейін және қосқаннан кейін көрсетілген: қызыл белгілер қабырға бойындағы қашықтықты, ал көк белгілер еденнен биіктікті метрмен өлшейді. Маркерлік тақтаның жиектерін сахна бағдарламасында орналастыру мен өлшемдерді анықтау үшін осы торға қарап оқуға болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS9.jpg\" alt=\"А9-сурет: Табиғи тілде сахнаны өңдеу. Түпнұсқа реконструкция сұралған үш өзгеріспен көрсетілген: кірпіш қалауды ашу, тік\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;А9-сурет: Табиғи тілде сахнаны өңдеу. Түпнұсқа реконструкция сұралған үш өзгеріспен көрсетілген: кірпіш қалауды ашу, тік тұрып жиналыс өткізу үшін еденді босату және бөлмені Әлем чемпионатын тамашалауға безендіру. Әрбір нұсқаулық Room.py файлына түзету ретінде қолданылады.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Интерактивті&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;3D-сахналар&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасау&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;күрделілігі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Room.py кодын&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;итеративті&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жазу&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жоғары&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дәлдіктегі&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;симуляциялық&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;егіздер&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Роботтарды 3D&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ортада оқыту&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;үшін негіз&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;image_forensics&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Zhening Huang, Yueyan Li, Johnathan Chiu, Xiaoyang Lyu, Matt Zhou, Yuxin Yao, Joan Lasenby, Shangzhe Wu&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/abs/2610.01863v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&
