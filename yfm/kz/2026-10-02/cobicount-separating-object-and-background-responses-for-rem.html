        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"175\" cy=\"85\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"485\" cy=\"242\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SAT_IMAGERY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Спутниктік суреттердегі&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нысандарды қайта оқытусыз&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;санау&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/cobicount.html\"&gt;COBICount&lt;/a&gt; әдісі нейрондық желілердің нысандарды ландшафт элементтерімен шатастыру мәселесін шешеді. Модель бір ғана дереккөз негізінде оқытылады және қосымша баптаусыз жаңа деректерде жұмыс істейді. Бұл тәсіл түсіру шарттары әртүрлі болса да, нысандарды дәл санауға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;COBICount жауаптарды генерациялауды, тексеруді және шуды басуды бөледі.&lt;/li&gt;\n&lt;li&gt;Модель қайта оқытусыз жаңа деректер жиынында жұмыс істейді.&lt;/li&gt;\n&lt;li&gt;DOTA деректеріндегі орташа абсолюттік қателік 174,132 құрады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жүйе үш кезеңнен тұрады: үміткерлерді генерациялау (CE), олардың ықшамдылығын тексеру (CA) және қате сигналдарды басу (BI). Дәстүрлі модельдер көбінесе жол жиектерін немесе шатырларды нысан деп қабылдап, статистиканы бұрмалайды. COBICount қайталанатын фондық құрылымдарды оқшаулайды және мақсатты аймақтар үшін арнайы таңбалауды қажет етпейді.&lt;/p&gt;\n&lt;p&gt;Модель RSOC (ғимараттар) деректер жиынында оқытылып, DOTA (көлік пен кемелер) нысандарында сыналды. 512x512 сурет үшін 5,07 миллион параметр мен 17,41 миллиард операцияны қолдана отырып, орташа абсолюттік қателік (&lt;a href=\"concepts/mean-absolute-error.html\"&gt;MAE&lt;/a&gt;) 174,132 болды. Бұл әдіс жаңа шарттарға бейімделмей-ақ жоғары дәлдікке жетуге болатынын дәлелдейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс сапалы бастапқы таңбалауды талап етеді және нысан өлшемі күрт өзгергенде тиімділігі төмендеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қашықтықтан &lt;a href=\"concepts/probing.html\"&gt;зондтау&lt;/a&gt; кескіндеріндегі нысандарды санау — бұл әуе және спутниктік суреттердегі ғимараттар, көлік құралдары немесе кемелер санын анықтау міндеті. Оқыту арқылы жұмыс істейтін көптеген әдістер тығыздық картасын құрады, мұнда пикселдердің қосындысы нысандардың жалпы санын береді. Алайда, мұндай модельдер көбінесе нысан санаттарының, өлшемдерінің және фондық жағдайлардың ұқсастығын болжайды, бұл оларды мақсатты деректерсіз басқа аймақтарға немесе сенсор түрлеріне бейімдеуді қиындатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторлар мақсатты деректерге қолжетімділік болмаған кезде (&lt;a href=\"concepts/source-only-counting.html\"&gt;source-only&lt;/a&gt;) нысандарды санау үшін COBICount әдісін ұсынады, бұл фондық құрылымдардағы қате нәтижелерді азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Тек бастапқы деректерде» (source-only) оқыту міндетінде модель бір санаттағы нысандар мен ұқсас түсіру жағдайлары бар кескіндер жиынтығында оқытылады, мұнда әрбір нысан бір нүктемен белгіленеді. Мақсатты кескіндер модель бекітілгенге дейін қолжетімсіз болады. Негізгі мәселе — модель фонның қайталанатын элементтерін (жол жиектері, шатыр шекаралары, тұрақ таңбалары немесе жағалау сызықтары) нысан деп қате қабылдауы мүмкін. COBICount әдісі процесті үш кезеңге бөледі: үміткерлерді генерациялау (CE), оларды растау (CA) және фонды басу (BI). BI қайталанатын фондық құрылымдармен байланысты жауаптарды оқшаулайды, ал CA тек нысандардың ортасындағы ықшам жауаптарды сақтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;\"Source-only\" әдісі модельді тек бастапқы деректерде оқытуды және мақсатты деректерсіз жұмыс істеуді білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель RSOC (ғимараттар) деректер жиынтығында оқытылып, DOTA (ірі және ұсақ көлік құралдары, кемелер) деректерінде сыналды. COBICount салыстырылған әдістер арасында ең төменгі орташа абсолюттік қатені (MAE) көрсетті — 174.132. Модель 5.07 миллион параметрді пайдаланады және 512 × 512 өлшеміндегі кескінді өңдеу үшін 17.41 миллиард өзгермелі нүктелі операцияны (FLOPs) қажет етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдістің тиімділігі модельдің белгілі бір түсіру жағдайларында оқытылуымен шектеледі, домен күрт өзгерген кезде дәлдік төмендеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл зерттеу қашықтықтан зондтау (ДЗЗ) суреттеріндегі «source-only counting» жағдайында нысандарды санау мәселесін қарастырады. Мақсатты доменнің белгіленген деректерін талап ететін дәстүрлі әдістерден айырмашылығы, бұл тәсіл тек бір белгіленген бастапқы доменді (мысалы, RSOC Building) пайдаланады. Оқытылған модель кейіннен жаңа, бұрын көрілмеген домендерге (мысалы, DOTA Large Vehicle, Small Vehicle, Ship немесе DIOR Airplane) қолданылады. Модель тек нысан орталықтарындағы нүктелік аннотациялар негізінде оқытылады және оқыту барысында мақсатты суреттер немесе олардың статистикалық параметрлері пайдаланылмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Source-only counting әдісі әрбір жаңа аймақ немесе сенсор үшін деректерді жинау және белгілеу қажеттілігін жойып, модельді жедел енгізуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл тәсілдегі негізгі мәселе — «&lt;a href=\"concepts/neopredelennost-proishozhdeniya-kandidata.html\"&gt;кандидаттың шығу тегінің анықталмауы&lt;/a&gt;» (candidate origin ambiguity). Модель фон элементтерін (шатыр шекаралары, жол белгілері, порт құрылымдары) бастапқы деректерде үйренген нысандармен шатастыруы мүмкін. Сондай-ақ, кеңістіктік масштаб айырмашылығы (мысалы, бастапқы домендегі ғимарат пен мақсатты домендегі шағын көлік) салдарынан модельдің нақты нысандарға беретін жауабы фондық құрылымдарға қарағанда әлсіз болуы мүмкін. MAE және RMSE сияқты стандартты метрикалар бұл қателіктерді толық аша алмайды, өйткені олар тек жалпы санды есептейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кандидаттың шығу тегінің анықталмауы — бұл модельдің жоғары жауап қайтаруы, бірақ оның нақты нысанға немесе фонның кездейсоқ геометриялық өрнегіне қатысты екенін анықтаудың мүмкін еместігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл мәселелерді шешу үшін COBICount әдісі ұсынылған. Ол үш компоненттен тұрады: &lt;a href=\"concepts/candidate-evidence.html\"&gt;Candidate Evidence&lt;/a&gt; (CE) ықтимал жауаптар картасын жасайды, &lt;a href=\"concepts/candidate-acceptance.html\"&gt;Candidate Acceptance&lt;/a&gt; (CA) бастапқы аннотациялар өрнектеріне сәйкес келетін жауаптарды бөліп алады, ал &lt;a href=\"concepts/bias-isolation.html\"&gt;Bias Isolation&lt;/a&gt; (BI) фондық құрылымдармен байланысты шуды басады. Audit атты қосымша модуль тек бастапқы деректермен оқытылып, қорытынды тығыздық картасына әсер етпестен жауап өрнектерін тексереді. COBICount RSOC Building дереккөзінде оқытылған кезде DOTA домендерінде ең төменгі орташа MAE көрсеткішін тіркеді.&lt;/p&gt;\n&lt;p&gt;Зерттеу үш негізгі аспектіге сүйенеді: нүктелік аннотациялар бойынша нысандарды санау, домендер ауысқан кездегі деректерге қойылатын талаптар және модель жауаптарының нақты нысандарға қатысты орналасуын тексеру әдістері.&lt;/p&gt;\n&lt;p&gt;Қашықтан зондтау суреттеріндегі нысандарды санау әдетте нысанды анықтау (detection) немесе нүктелік бақылау (&lt;a href=\"concepts/point-supervision.html\"&gt;point supervision&lt;/a&gt;) әдістері арқылы жүзеге асырылады. DOTA, xView, DIOR және FAIR1M сияқты дәстүрлі әдістер нысандарды шектейтін жақтауларды (bounding boxes) пайдаланады. Жақтаулар нысанның орны мен көлемін дәл көрсеткенімен, көптеген ұсақ нысандары бар суреттерде оларды белгілеу өте қымбатқа түседі. Сонымен қатар, анықтау әдістері нысандарды өткізіп алу немесе қайталап анықтау сияқты қателіктерге бейім.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нүктелік бақылау (point supervision) — бұл нысанның ортасына бір нүкте қою арқылы жүзеге асырылатын белгілеу әдісі, ол деректер жинағын дайындау процесін айтарлықтай жылдамдатады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нүктелік бақылау әдісі аннотация жүктемесін азайтады. Мұнда нүктелер тығыздық картасына айналдырылады және желі осы картаны болжауды үйренеді, ал түпкілікті сан карта мәндерін қосу арқылы алынады. MCNN сияқты алғашқы модельдер нысан өлшемдеріндегі өзгерістерді басқару үшін параллель конволюциялық бағандарды пайдаланса, CSRNet кеңейтілген конволюциялар арқылы суреттің үлкен бөлігін бақылауға мүмкіндік берді. Bayesian &lt;a href=\"concepts/loss.html\"&gt;Loss&lt;/a&gt; және TransCrowd сияқты заманауи әдістер болса, белгілеудегі белгісіздікті ескеру және алыс аймақтарды байланыстыру үшін трансформерлерді қолданады.&lt;/p&gt;\n&lt;p&gt;Қашықтан зондтау суреттеріндегі нысандардың өлшемі әртүрлі болып келеді, ал фон көбінесе жолдар, шатырлар және автотұрақ сызықтары сияқты қайталанатын элементтерге толы. RSOC сияқты арнайы деректер жинақтары ғимараттар, кемелер және көлік құралдары үшін нүктелік белгілерді қамтиды. PSGCNet сияқты архитектуралар пирамидалық масштабтарды, ал TASNet үштік назар (triple attention) механизмдерін пайдаланады. BDRNet тығыздық регрессиясын нысандар алып жатқан аймақтарды болжайтын қосымша шығыспен біріктіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қолданыстағы әдістер оқыту және тестілеу шарттары бірдей болғанда жоғары дәлдік көрсетеді, бірақ олар сенсор, ажыратымдылық (resolution) немесе фон өзгерген кезде модельдің тұрақтылығына кепілдік бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Санаудағы төмен қателік модельдің нысандарды дұрыс түсінетінін білдірмейді: көбінесе тығыздық картасындағы жоғары мәндер нақты нысандарға емес, фондағы қайталанатын құрылымдарға қате байланыстырылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/adaptatsiya-domenov.html\"&gt;Домендік адаптация&lt;/a&gt; (domain adaptation) модельді оқыту кезінде мақсатты аймақтағы кескіндерді пайдалануға мүмкіндік береді. Адверсариалды оқыту (adversarial training) модельге бастапқы және мақсатты үлгілерді ажырату қиын болатын белгілерді анықтауға көмектеседі. Қашықтықтан зондтауда бұл тәсілдер сенсорлар, аймақтар және түсіру шарттарындағы өзгерістерді өтеу үшін, соның ішінде бақылаусыз &lt;a href=\"concepts/segmentatsiya.html\"&gt;сегментация&lt;/a&gt; үшін қолданылады. Алайда, адаптация жұмысты бастамас бұрын мақсатты үлгілердің болуын талап етеді және әрбір жаңа домен үшін қайта оқытуды қажет етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Домендік адаптация — бұл модельді бір дереккөзден алынған мәліметтерден басқа, жаңа шарттардағы мәліметтерге бейімдеу процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Домендерді жалпылау (domain &lt;a href=\"concepts/obobschenie.html\"&gt;generalization&lt;/a&gt;) оқыту кезінде мақсатты кескіндерді пайдаланбайды. MLDG сияқты әдістер қолжетімді деректерді уақытша оқу және тест жиынтықтарына бөліп, домен өзгерістерін имитациялайды. «Градиенттік хирургия» сияқты әдістер әртүрлі дереккөздерден келетін жаңартулар арасындағы қайшылықтарды азайтады. Санақ бойынша зерттеулерде топтар арасындағы ортақ ақпаратты бөліп алатын немесе бір ғана белгіленген доменді пайдаланатын (мысалы, MPCount) әдістер бар, олар модельді кескін трансформацияларына төзімді болуға үйретеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Домендерді жалпылау мақсатты деректерді жинау қажеттілігін жояды, бірақ бірнеше белгіленген бастапқы домендердің болуын талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алдын ала оқытылған модельдер, мысалы, кескін мен мәтінді байланыстыратын CLIP немесе Segment Anything Model (SAM), белгілеу көлемін қысқартуға көмектеседі. Қашықтықтан зондтауда SatMAE және SatMAE++ сияқты әдістер кескіндердің жасырын бөліктерін уақытша және спектрлік сипаттамаларды ескере отырып қалпына келтіреді. RemoteCLIP және GeoRSCLIP «кескін-мәтін» байланысын аэроғарыштық деректер үшін бейімдейді. Дегенмен, бұл модельдер тек белгілерді немесе маскаларды береді, бірақ тікелей санау міндетін шешпейді, өйткені маска әрқашан нысандарды бір-бірінен ажырата алмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алдын ала оқытылған модельдер нысандарды нақты локализациялау қажеттілігін жоймайды, өйткені олар тығыз орналасқан нысандарды немесе фондық шуды әрқашан жеке бірлік ретінде ажырата алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CA модулі модель жауаптарын &lt;a href=\"concepts/filtratsiya.html\"&gt;сүзгіден өткізу&lt;/a&gt; арқылы әрбір анықталған сигналдың тығыздық картасына өту деңгейін бақылайды. Жүйе төрт картаны болжайды: A_c (орталық), A_o (аймақ), A_q (сапа) және A_r (сенімділік). Қорытынды маска &lt;span class=\"yfm-latex\" data-content=\"A%20%3D%20A_c%20%5Codot%20A_o%20%5Codot%20(0.35%20%2B%200.65A_q)%20%5Codot%20(0.35%20%2B%200.65A_r)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; түрінде қалыптасады. A_c және A_o карталары нысана нүктесіне жақындық негізінде оқытылады. CA қатаң пішін ережелерін қолданбайды, нүктелік супервизия арқылы кеңістіктік қақпаларды үйренеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CA жауаптарды нысана нүктелерінің айналасына шоғырландырып, шуды басу арқылы дәлдікті арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BI қайталанатын өрнектер (жолдар, тұрақтар) тудыратын жалған сигналдарды басады. Модуль төрт қауіп картасын бағалайды: Bbg (фон), Bline (сызықтар), Bbroad (кең құрылымдар) және Bgrid (торлар). Бұл карталар нысандарды жіктеу арқылы емес, тығыздық және басу функциялары арқылы оқытылады. BI сонымен қатар Собель операторы G және Лапласиан Klap = [-4] сияқты тұрақты түрлендірулерді пайдаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Собель және Лапласиан операторлары кескіндегі өткір өзгерістер мен шекараларды анықтау үшін қолданылатын математикалық әдістер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/audit-module.html\"&gt;Аудит&lt;/a&gt; — бұл негізгі есептеулерге әсер етпейтін көмекші блок. Ол ішкі белгілерді көлік, ғимараттар, кемелер және фон сияқты төрт арнаға айналдырады. Бұл арналар жіктегіш емес, желінің қай құрылымдарға жауап беретінін түсінуге арналған визуалды бақылау құралы.&lt;/p&gt;\n&lt;p&gt;Оқыту үшін &lt;span class=\"yfm-latex\" data-content=\"P_s%20%3D%20%5C%7Bp_i%5C%7D_%7Bi%3D1%7D%5E%7BN%5E*%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; нүктелер жиынтығы пайдаланылады. Шығыс торы &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3D%204\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; қадамына ие болғандықтан, координаттар масштабталады. Тығыздық нысанасы D^*(u) әр нүктеде σ_p = 1.15 еніндегі Гаусс ядроларын орналастыру арқылы құрылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдің дәлдігі толығымен нүктелік аннотациялардың сапасына байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оқыту процесінде D^* тығыздық және Tσ карталары бастапқы кескіндердегі аннотациялар негізінде құрылады. Орталық нүктелер (Tpeak) және қолдау аймақтары (Tsup) үшін максималды мәні 1 болатын Гаусс таралуы қолданылады. Негізгі маскалар: Mpt (орталықтар), Msup (қолдау), Mfg (9×9 дилатация арқылы қорғаныс аймағы) және Mbg (фон).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Tpeak және Tsup карталары σ_s=2.35 параметрімен нысан орталықтары мен олардың әсер ету аймақтарын нақты ажыратуға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тығыздық шығыны Lden тегістелген L₁-норма арқылы есептеледі және нысандар саны Nnorm бойынша нормаланады. Жалпы есептеудегі қателікті азайту үшін салыстырмалы (Lrel cnt) және логарифмдік (Llog cnt) айыппұлдар қолданылады, бұл үлкен сандық диапазондардың әсерін бәсеңдетеді.&lt;/p&gt;\n&lt;p&gt;CA компоненттері ω_c, ω_o, ω_s кеңістіктік салмақтарымен бинарлы кросс-энтропия (LBCE) арқылы оқытылады. BI (Background Intelligence) төрт айыппұл (Lbgv, Lline, Lbroad, Lgrid) арқылы оқытылады, мұнда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ezmy140\"&gt;stop gradient&lt;/code&gt; (sg) операторы арқылы градиенттер блокталған. «Жалған позитивтер» (hard negatives) үшін Lhn айыппұлы енгізілген, ол фон деп белгіленген аймақтарда жоғары жауап қайтарған модельді жазалайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g75pjd5t\"&gt;stop gradient&lt;/code&gt; (sg) операторы карта мәнін сақтайды және қателікті кері тарату процесінде оның салмақтарын өзгертуге жол бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Желі тармақтарын теңестіру үшін Lent энтропия және Lbal баланс айыппұлдары қолданылады. 10-эпохадан бастап ғимараттар мен фон арналарын нақтылау үшін аудит (Laud) іске қосылады. Жалпы шығын функциясы L барлық көрсеткіштердің қосындысы болып табылады, алғашқы 8 эпохада c_e коэффициентімен өсіп отырады.&lt;/p&gt;\n&lt;p&gt;Inference кезеңінде модель алдымен b_S тығыздық картасын және &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BN%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; нысандар санын есептейді. Содан кейін ашкөз (greedy) алгоритмі қолданылады: b_S-тен $ au = \\max(0.020, 0.28 \\cdot \\max(b_S))$ шегінен жоғары локалды максимумдар бөлініп алынады. Таңдалған нүктелер бір-бірінен кемінде 3.2 тор көзі (шамамен 12.8 пиксель) қашықтықта болуы керек, нүктелердің жалпы саны Kpt ≤ 1024 деп шектелген.&lt;/p&gt;\n&lt;p&gt;Тәжірибелер «тек бастапқы деректер» (source-only counting) режимінде жүргізіледі. RSOC, DOTA немесе DIOR жиынтықтарындағы домендердің рөлдері (бастапқы/нысаналы) алдын ала бекітілмеген, олар әр тест үшін жеке тағайындалады. Бастапқы домен белгілі бір түсіру жағдайындағы объектілер санатын қамтиды және модельді оқыту мен таңдау үшін қолданылады. Нысаналы домен — модель таңдалғанға дейін жасырын қалатын басқа санат немесе жағдай. Негізгі экспериментте RSOC Building бастапқы дереккөз ретінде алынады: оқыту жиынтығы салмақтарды жаңартады, ал валидациялық жиынтық «чекпоинтті» (модель күйін) анықтайды. Содан кейін модель DOTA Large Vehicle (LV), DOTA Small Vehicle (SV) және DOTA Ship домендерінде сыналады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель тек RSOC Building деректерінде оқытылады, содан кейін бекітіледі және ешқандай қосымша бейімделусіз DOTA-ның үш тәуелсіз доменінде бағаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/chekpoint.html\"&gt;Чекпоинт&lt;/a&gt; — бұл валидациялық жиынтықта ең жақсы нәтиже көрсеткен және түпкілікті тестілеу үшін сақталған нейрондық желінің күйі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;DOTA-дағы объектілерді бағалау үшін бағытталған төртбұрыштар, ал DIOR-да шекаралық жақтаулар қолданылады. Унификация үшін алгоритмдер олардың орталық нүктесін алады, бұл санау үшін жалғыз бағдар болып табылады. Оқыту кезінде объектілердің өлшемі немесе бағыты ескерілмейді.&lt;/p&gt;\n&lt;p&gt;Әдістердің тиімділігі орташа абсолюттік қателік (MAE) және орташа квадраттық қателік (RMSE) арқылы анықталады. DOTA-ның үш нысаналы домені бойынша жиынтық бағалау үшін MT-MAE (LV, SV және Ship үшін MAE орташа мәні) қолданылады. Барлық әдістер үшін кіріс кескіндерінің ұзын жағы 2000 пикселден аспайтындай етіп масштабталады. Бұл ереже барлық есептеулер үшін біркелкі қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2000 пикселдік шектеу қатаң ереже болып табылады, бұл өте ұсақ объектілерді анықтау дәлдігіне әсер етуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Салыстыруға MCNN, CSRNet, P2PNet, TransCrowd сияқты 13 архитектура қатысады. Барлық модельдер, соның ішінде қашықтықтан зондтауға мамандандырылған (BDRNet) және базалық (MPCount) модельдер RSOC Building-де «тек бастапқы деректер» режимінде қайта оқытылды. Ешбір әдіс бейімделу немесе параметрлерді таңдау үшін нысаналы деректерге қол жеткізе алмайды.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f1.jpg\" alt=\"Сурет 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f2.jpg\" alt=\"Сурет 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f4.jpg\" alt=\"Сурет 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f5.jpg\" alt=\"Сурет 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f6.jpg\" alt=\"Сурет 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f7.jpg\" alt=\"Сурет 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 7&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=
