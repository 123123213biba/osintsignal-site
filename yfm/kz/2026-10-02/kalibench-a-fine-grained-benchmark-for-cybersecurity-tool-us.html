        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"216\" cy=\"176\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"644\" cy=\"168\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Нейрожелілер Kali Linux&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;пәрмендерінде неге&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қателеседі және оны қалай&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;түзетуге болады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f1.jpg\" alt=\"1-сурет: Неліктен KaliBench маңызды? KaliBench талдаушының ниетін орындалатын Kali командаларына айналдыру үшін егжей-те\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Неліктен &lt;a href=\"concepts/kalibench.html\"&gt;KaliBench&lt;/a&gt; маңызды? KaliBench талдаушының ниетін орындалатын Kali командаларына айналдыру үшін егжей-тегжейлі, тексерілетін бағалауды және орындау уақытын қажет етпейтін марапаттау тренингін қамтамасыз етеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Көптеген нейрожелілер Kali Linux үшін пәрмендер жасауда қиналады және синтаксисте өрескел қателер жібереді. Зерттеушілер 1642 құралды қамтитын 8504 сұраныс пен пәрмен жұптарынан тұратын KaliBench жүйесін ұсынды. Бұл шешім модельдерді тексерілетін марапаттар арқылы оқытуға және олардың нақтылығын арттыруға мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Деректер жинағы 1642 Kali Linux құралы үшін 8504 жұпты қамтиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt; синтаксисінің күрделілігіне байланысты модельдер дәлдігі 42%-дан аспайды.&lt;/li&gt;\n&lt;li&gt;Тексерілетін марапаттар 8B модельдерді ірі жүйелер деңгейіне жеткізеді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Заманауи &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; модельдері талдаушының ниетін CLI-пәрмендеріне аударуда жиі қателеседі, өйткені киберқауіпсіздік құралдарымен жұмыс істеу жоғары дәлдікті талап етеді. API-ден айырмашылығы, CLI-құралдары модельден құралды өз бетінше таңдауды және жалаушаларды (flags) дұрыс орналастыруды талап етеді. KaliBench бұл мәселені 23 қабілет бағыты мен 5 қауіпсіздік кезеңі бойынша құрылған деректер жинағы арқылы шешеді.&lt;/p&gt;\n&lt;p&gt;Зерттеу әдістемесі көп сатылы тексеруді қамтиды: нейрожелілік валидациядан бастап, оқшауланған ортада (&lt;a href=\"concepts/sandbox.html\"&gt;sandbox&lt;/a&gt;) орындау және адам тарапынан түзетуге дейін. Зерттеу көрсеткендей, тіпті қуатты модельдердің өзі «шектеусіз» режимде 42%-дан жоғары дәлдік көрсете алмайды. Алайда, тексерілетін марапаттар негізінде оқыту (&lt;a href=\"concepts/reinforcement-learning-with-verifiable-rewards.html\"&gt;RLVR&lt;/a&gt;) 8B көлемді модельдерді 685B параметрі бар алып жүйелердің деңгейіне шығарады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/benchmark.html\"&gt;Бенчмарк&lt;/a&gt; тек пәрмендер генерациясына бағытталған және көп сатылы сценарийлерді бағаламайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қазіргі таңда үлкен тілдік модельдер (LLM) киберқауіпсіздік жұмыс процестерінде талдаушылардың ниетін құралдардың пәрмендеріне аудару үшін жиі қолданылуда. Алайда, қазіргі бағалау әдістері білімге негізделген тесттерге немесе агенттік тапсырмаларға ғана бағытталған, бұл модельдердің нақты киберқауіпсіздік құралдары үшін орындалатын пәрмендерді генерациялау қабілетін өлшемейді. Бұл маңызды олқылық, өйткені киберқауіпсіздік операциялары қатаң пәрмен жолы интерфейстеріне (CLI) сүйенеді, мұнда кішігірім синтаксистік қателер немесе дұрыс емес аргументтер пәрменнің орындалуына кедергі келтіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KaliBench — 1 642 құралды қамтитын 8 504 «сұраныс-пәрмен» жұбынан тұратын жаңа бенчмарк, ол ашық салмақты модельдердің CLI пәрмендерін генерациялаудағы дәлдігі 42%-дан аспайтынын көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Осы мәселені шешу үшін Kali Linux үшін табиғи тілден CLI пәрмендеріне аударуға арналған KaliBench деректер жиыны ұсынылды. Ол 23 функционалдық бағыт пен 5 қауіпсіздік кезеңін қамтиды. KaliBench құру әдістемесі &lt;a href=\"concepts/determinirovannaya-kanonizatsiya.html\"&gt;детерминирленген канонизация&lt;/a&gt; мен бүркеншік аттарды (alias) ескеретін бағалауды қамтиды, бұл нәтижелердің қайталануын қамтамасыз етеді. Сапаны тексеру LLM негізіндегі валидация, оқшауланған ортада (sandbox) орындау және адам қатысатын түзетуді біріктіретін көп сатылы жүйе арқылы жүзеге асырылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детерминирленген канонизация — пәрмендердің әртүрлі жазылу нұсқаларын бірыңғай стандартқа келтіру процесі, бұл модель дәлдігін объективті бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;24 модель конфигурациясын сынақтан өткізу нәтижелері көрсеткендей, ешбір ашық салмақты модель 42% дәлдік шегінен аса алмады. Дегенмен, авторлар KaliBench көмегімен бақыланатын оқыту (&lt;a href=\"concepts/sft.html\"&gt;SFT&lt;/a&gt;) және нығайтылған оқыту (RL) арқылы 8 млрд параметрлі модельді 685 млрд параметрлі MoE модельдерінің деңгейіне дейін жеткізуге болатынын дәлелдеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер тек Kali Linux ортасы үшін ғана жарамды; басқа жүйелерде модельдердің тиімділігі әртүрлі болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"kiberkhauipsizdiktegi-llm-zhaene-cli-maeselesi\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kiberkhauipsizdiktegi-llm-zhaene-cli-maeselesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Киберқауіпсіздіктегі LLM және CLI мәселесі&lt;/span&gt;&lt;/a&gt;Киберқауіпсіздіктегі LLM және CLI мәселесі&lt;/h4&gt;\n&lt;p&gt;Ірі тілдік модельдер (LLM) киберқауіпсіздік жұмыс процестеріне белсенді түрде енгізілуде. Қазіргі таңдағы бенчмарктар негізінен теориялық білімді немесе CTF (Capture The Flag) стиліндегі күрделі орталарды бағалауға бағытталған. Алайда, олар модельдердің нақты пәрмен жолы (CLI) құралдары үшін дұрыс командалар генерациялау қабілетін тексермейді. Kali Linux сияқты платформаларда 2000-нан астам құрал бар, ал аргументтердегі немесе жалаушалардағы (flags) кішкентай қателіктер команданың орындалуын бұзады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қолданыстағы тесттер CLI командаларын генерациялау дәлдігін бағаламайды, бұл қазіргі киберқауіпсіздік құралдары үшін қатесіз синтаксисті талап ететіндіктен маңызды олқылық болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kalibench-aedisnama-zhaene-khurylym\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kalibench-aedisnama-zhaene-khurylym\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KaliBench: әдіснама және құрылым&lt;/span&gt;&lt;/a&gt;KaliBench: әдіснама және құрылым&lt;/h4&gt;\n&lt;p&gt;Осы олқылықты жою үшін авторлар KaliBench — NL-to-CLI (табиғи тілден пәрмен жолына ауыстыру) үшін мамандандырылған бенчмаркты әзірледі. Стандартты тесттерден айырмашылығы, KaliBench «схемасыз» (schema-free) ортада жұмыс істейді, бұл жүздеген құралдардың сипаттамасын контекст терезесіне сыйғызу мүмкін емес нақты жағдайларды көрсетеді. Rasm 1-де көрсетілгендей, KaliBench міндетті құралды таңдау және аргументтерді құрастыру деп бөледі. Деректер жиынтығы 23 функционалдық бағыт пен 5 қауіпсіздік кезеңін қамтитын 8504 «сұраныс-команда» жұбынан тұрады (дедупликациядан кейін 5000 бағалау және 3504 оқыту үшін).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Схемасыз» орта модельден алдын ала берілген JSON-схемаларсыз, құралдар синтаксисін өз бетінше білуді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"verifikaciya-zhaene-naetizheler\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#verifikaciya-zhaene-naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Верификация және нәтижелер&lt;/span&gt;&lt;/a&gt;Верификация және нәтижелер&lt;/h4&gt;\n&lt;p&gt;Деректер сапасы LLM-валидация, «sandbox»-та орындау және адам тарапынан тексеру арқылы қамтамасыз етіледі. Авторлар 24 модель конфигурациясын үш режимде сынады. Негізгі қиындық аргументтерді дұрыс құрастыру екені анықталды. SFT (Supervised Fine-Tuning) және RLVR (верификацияланатын марапаттармен нығайтушы оқыту) әдістері 8B көлемді модельдің нәтижелерін 7,5 пайыздық тармаққа жақсартуға мүмкіндік берді. Маңыздысы, бұл жүйе командаларды нақты уақытта орындауды талап етпейтін (runtime-free) марапаттау механизмін ұсынады.&lt;/p&gt;\n&lt;h4 id=\"sabakhtas-zertteulerge-sholu\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#sabakhtas-zertteulerge-sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сабақтас зерттеулерге шолу&lt;/span&gt;&lt;/a&gt;Сабақтас зерттеулерге шолу&lt;/h4&gt;\n&lt;p&gt;Киберқауіпсіздіктегі LLM-ді бағалау MMLU сияқты жалпы тесттерден арнайы фреймворктерге дейін дамыды. HELM көптеген метрикаларды біріктіргенімен, ол киберқауіпсіздіктің ерекше талаптарын ескермейді. SecEval, CyberMetric, CyberBench, SECURE, CS-Eval, SecBench және CTI-Bench сияқты қолданыстағы бенчмарктер криптография және желілік қауіпсіздік салаларындағы теориялық білімді тесттер арқылы тексеруге бағытталған. Алайда, олар практикалық дағдыларды емес, статикалық білімді ғана бағалайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қолданыстағы бенчмарктер теориялық білімді тексерумен шектеледі, ал KaliBench нақты құралдар үшін дәл командалар генерациясына назар аударады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;CyBench, NYU-CTF Bench және DefenderBench сияқты заманауи жұмыстар CTF немесе корпоративтік ортада агенттік бағалауға көшуде. Дегенмен, мұндай күрделі тапсырмаларда қателік себебін анықтау қиын, өйткені нәтиже жоспарлау мен ортамен өзара әрекеттесуге байланысты. KaliBench бұл мәселені командалар генерациясын, құралдарды таңдауды және аргументтердің дұрыстығын бөлек бағалау арқылы шешеді.&lt;/p&gt;\n&lt;h4 id=\"funkciyalardy-shakhyru-benchmarkteri\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#funkciyalardy-shakhyru-benchmarkteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Функцияларды шақыру бенчмарктері&lt;/span&gt;&lt;/a&gt;Функцияларды шақыру бенчмарктері&lt;/h4&gt;\n&lt;p&gt;LLM-нің сыртқы құралдарды шақыру қабілетін зерттейтін жұмыстар (BFCL, ToolSandbox, StableToolBench, HammerBench) әдетте нақты API схемаларына сүйенеді. Мұндай тәсілдер ресми сипаттамаларды талап етеді, бұл командалық жол интерфейсімен (CLI) жұмыс істегенде қолданылмайды, өйткені онда параметрлердің қатаң схемасы жоқ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CLI (Command Line Interface) — бұл бағдарламамен мәтіндік командалар арқылы жұмыс істеу тәсілі, мұнда аргументтер құрылымы контекстке байланысты болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қазіргі уақытта схемасыз жағдайларда табиғи тілді CLI командаларына аударуды бағалайтын бенчмарктер жоқ. KaliBench бұл олқылықтың орнын толтырып, нақты киберқауіпсіздік құралдары үшін орындалатын командалардың дәлдігін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"kalibench\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kalibench\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KaliBench&lt;/span&gt;&lt;/a&gt;KaliBench&lt;/h4&gt;\n&lt;p&gt;KaliBench — киберқауіпсіздік саласындағы табиғи тілдегі сұраулар мен Kali Linux орындалатын пәрмендері арасындағы аударма қабаты ретінде қызмет ететін мамандандырылған бенчмарк және деректер жиыны. Ол 1642 құралды және 8504 «сұрау–пәрмен» жұбын қамтиды. KaliBench құру процесі төрт кезеңнен тұрады: Kali Linux құжаттамасынан метадеректерді алу және LLM арқылы деректерді генерациялау; көп сатылы сүзу (LLM-тексеру, «құмсалғышта» іске қосу, сараптамалық бағалау); деректерді дедупликациялау және оқыту/тестілеу жиындарына бөлу; сондай-ақ параметрлерді тиімді баптау және нығайту арқылы оқыту әдістерін қолдану.&lt;/p&gt;\n&lt;p&gt;Деректерді генерациялау кезеңінде авторлар Kali Linux репозиторийіндегі 2372 құрал бойынша ресми құжаттаманы пайдаланды. Qwen3-Max моделінің көмегімен әр құрал үшін 10-13 «сұрау–пәрмен» жұбы жасалды (барлығы 27,7 мың). Бұл деректер құралды таңдау дәлдігі мен синтаксистік дұрыстықты талдауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KaliBench 1642 құрал үшін 8504 жоғары сапалы «сұрау–пәрмен» жұбын қамтиды, олар көп деңгейлі тексеруден өткен.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LLM галлюцинацияларымен (бастапқы пәрмендердің 50%-дан астамы қате болған) күресу үшін тексеру жүйесі енгізілді. Бірінші кезеңде LLM пәрмендердің құжаттамаға сәйкестігін тексерді, нәтижесінде 53,8% үлгі алынып тасталды. Қайта генерациялау мен тексеруден кейін деректер көлемі 14,5 мың жұпты құрады, бұл бастапқы деректердің 47,65%-ға қысқарғанын білдіреді.&lt;/p&gt;\n&lt;h4 id=\"terminaldy-tekseru\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#terminaldy-tekseru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Терминалды тексеру&lt;/span&gt;&lt;/a&gt;Терминалды тексеру&lt;/h4&gt;\n&lt;p&gt;Пәрмендердің орындалуын қамтамасыз ету үшін авторлар Kali-linux-everything бейнесі бар Docker контейнерін пайдаланды. Пәрмендер шығыс (stdout, stderr) және аяқталу кодтары бойынша тексерілді. Синтетикалық сұраулардағы параметрлер (жолдар, мекенжайлар) «құмсалғышта» болмауы мүмкін болғандықтан, ережеге негізделген сүзу қолданылды. Бұл кезең LLM тексеруінен өткен пәрмендердің 11,95%-ын алып тастады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Құмсалғыш (sandbox) — кодты қауіпсіз ортада орындап, оның нақты жұмыс істеу қабілетін тексеруге мүмкіндік беретін оқшауланған жүйе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adam-khatysatyn-baghalau\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#adam-khatysatyn-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адам қатысатын бағалау&lt;/span&gt;&lt;/a&gt;Адам қатысатын бағалау&lt;/h4&gt;\n&lt;p&gt;Соңғы кезеңде модельдердегі қателерді талдау үшін адам қатысатын сараптамалық бағалау жүргізілді. AI-агент сұрау мен пәрмен семантикасын алдын ала салыстырды, содан кейін сарапшылар түсініксіздіктер мен таңбалау қателерін анықтады. Бұл процесс қате жалаушалар, міндетті аргументтердің түсіп қалуы немесе семантикалық сәйкессіздіктер салдарынан деректердің тағы 4,9%-ын алып тастауға әкелді.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Open-weight model query-to-command performance across three modes.Columns report Unrestricted (U), Restricted (R), and Hinted (H).†indicates thinking-enabled models, and⋆ denotes cybersecurity-tuned models.Bold/underline mark the best and second-best within each size group.Models are sorted by Averaged Total Score.MoE parameters use Total/Active (e.g., 685/37B). Table 1 summarizes per-model performance under three modes:Unrestricted (U), Restricted (R), and Hinted (H). We report Exact Correct (EC), Tool Accuracy (TA), Optional-Argument F1 (Opt-F1), Positional-Argument F1 (Pos-F1), Total Score (TS), and Average TS (Avg.).We analyze key patterns with respect to tool information, model type and scale, and post-training on KaliBench.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-tT1.jpg\" alt=\"Кесте 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"deduplikaciya-zhaene-okhytu-testileu-zhiyntykhtaryna-boelu\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#deduplikaciya-zhaene-okhytu-testileu-zhiyntykhtaryna-boelu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дедупликация және оқыту-тестілеу жиынтықтарына бөлу&lt;/span&gt;&lt;/a&gt;Дедупликация және оқыту-тестілеу жиынтықтарына бөлу&lt;/h4&gt;\n&lt;p&gt;Семантикалық әртүрлілікті қамтамасыз ету үшін біз &lt;a href=\"concepts/semhash.html\"&gt;SemHash&lt;/a&gt; фреймворкін қолдандық. Әр жазба [сұраныс, құрал атауы, эталондық команда] бірлігі ретінде ұсынылды. Векторлық кеңістікте косинустық ұқсастығы 0,90-нан жоғары жазбалар кластерленді. Нәтижесінде 27,7 мың бастапқы деректен 8,5 мыңы (30,7%) іріктеліп алынды. Бұл NL-to-CLI бағалауы үшін сапалы бенчмарк болып табылады. Тест жиынтығы 5000 (барлық 1642 құралды қамтиды), ал оқыту жиынтығы 3504 (962 құрал) мысалдан тұрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;8,5 мың тексерілген жұптан тұратын деректер базасы тест жиынтығында барлық құралдарды қамтуға мүмкіндік берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;Бағалау хаттамасы. Модельдер Kali Linux командаларын үш режимде генерациялайды: (1) Unrestricted (тек сұраныс), (2) Restricted (20 үміткер құрал тізімімен), (3) Hinted (ресми құжаттамамен). Python-ның shlex кітапханасы арқылы командалар талданады. Бағалау компоненттер бойынша жүргізіледі: құрал атауы, опционалды аргументтер (алиастармен) және позициялық аргументтер тексеріледі. Қараңыз: 3-сурет.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Бағалау метрикаларына құрал таңдау дәлдігі, аргументтер үшін &lt;a href=\"concepts/f1-mera.html\"&gt;F1-өлшемі&lt;/a&gt; және Exact Correct (барлық компоненттердің сәйкестігі) кіреді.&lt;/p&gt;\n&lt;h4 id=\"muemkindikter-taksonomiyasy-zhaene-khauipsizdik-kezengderi\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#muemkindikter-taksonomiyasy-zhaene-khauipsizdik-kezengderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мүмкіндіктер таксономиясы және қауіпсіздік кезеңдері&lt;/span&gt;&lt;/a&gt;Мүмкіндіктер таксономиясы және қауіпсіздік кезеңдері&lt;/h4&gt;\n&lt;p&gt;Біз kali-tools таксономиясын қолдана отырып, 23 функционалды өлшемді бес қауіпсіздік кезеңіне бөлдік: барлау және бастапқы қолжетімділік, осалдықтарды талдау, эксплуатация, пост-эксплуатация және қорғаныстық талдау мен есептілік. Әр өлшем негізгі кезеңге бекітілген, бұл модель тиімділігін әртүрлі киберқауіпсіздік контексттерінде талдауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/cyber-kill-chain.html\"&gt;Қауіпсіздік кезеңдері&lt;/a&gt; (Cyber Kill Chain) — кибершабуылдың кезеңдік моделі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol start=\"4\" style=\"--hier-list-start:3\"&gt;\n&lt;li&gt;Оқыту хаттамасы. Біз SFT және RLVR әдістерін қолданамыз. Оқыту жиынтығы 3504 жұпты 3 режимге көбейту арқылы 10 512 үлгіні құрайды.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"taezhiribeler\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#taezhiribeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тәжірибелер&lt;/span&gt;&lt;/a&gt;Тәжірибелер&lt;/h4&gt;\n&lt;p&gt;Тәжірибе параметрлері. Ашық бастапқы кодты модельдер NVIDIA A100 кластерінде vLLM қозғалтқышы арқылы бағаланды. 72B және одан жоғары параметрлі модельдер OpenRouter API арқылы тексерілді. Барлығы 14 жалпы мақсаттағы (Llama 3.1, Qwen-3, Mistral-3.2, Gemma-3, GPT-OSS, LLaMA-3.3, DeepSeek-V3.2, GLM-5.2) және 7 киберқауіпсіздікке бағытталған (Foundation-Sec, Llama-Primus, RedSage) модельдер талданды. Оқыту үшін &lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt; және Unsloth кітапханасы қолданылды, RedSage-Ins (8B) негізгі модель ретінде алынды. RedSage-K-ның үш нұсқасы (SFT, GRPO және SFT+GRPO) бір H200 GPU (141GB VRAM) көмегімен 32 батч көлемімен екі дәуір (epoch) ішінде оқытылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LoRA — модельдің барлық параметрлерін өзгертпей, тек шағын бөлігін оқыту арқылы тиімді баптау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modelderding-uesh-rezhimdegi-tiimdiligi\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#modelderding-uesh-rezhimdegi-tiimdiligi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модельдердің үш режимдегі тиімділігі&lt;/span&gt;&lt;/a&gt;Модельдердің үш режимдегі тиімділігі&lt;/h4&gt;\n&lt;p&gt;Бағалау режимдерінің әсері. Шектеусіз (U) режимнен құралдарды шектеу (R) режиміне ауысу құралды таңдау дәлдігін (TA) 72,0%-дан 95,2%-ға дейін арттырады. Алайда, бұл аргументтер сапасына (Opt-F1, Pos-F1, EC) аз әсер етеді, бұл құралды дұрыс таңдау команданы дұрыс құрастыруды білдірмейтінін көрсетеді. Кеңестер (H) режимі ең үлкен өсімді береді: Opt-F1 45,1%-дан 87,8%-ға, ал EC 22,3%-дан 73,1%-ға дейін көтерілді. Бұл модельдердің құжаттамасыз команда құруда білімі жеткіліксіз екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кеңестер (H) режимі командаларды дұрыс құрастыру үшін шешуші рөл атқарады, себебі ол модельдердегі білім тапшылығын толтырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель түрі мен ауқымының әсері. Киберқауіпсіздікке бағытталған модельдер (⋆) шектеулі жағдайларда (U және R) жақсы нәтиже береді, ал жалпы мақсаттағы модельдер H режимінде тиімдірек. Логикалық қорытынды жасау қабілеті бар модельдер (†) тапсырмаларды бөлшектеуде тиімдірек. Qwen3† (8B) моделі үлкенірек модельдерден (Gemma-3 27B) орташа көрсеткіштер бойынша озып кетті, бұл CLI генерациясы тек параметрлер санына емес, нұсқауларды орындау мен логикалық ойлауға байланысты екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель көлемінің үлкендігі әрқашан сапаның артуына кепілдік бермейді; оқыту әдісі мен логикалық қорытынды жасау қабілеті маңыздырақ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Proprietary модельдер. Қауіпсіздік талаптарына байланысты негізгі назар жергілікті модельдерге аударылды. Дегенмен, KaliBench қиындығын тексеру үшін GPT-5.6-Sol, Claude Opus 5 және OpenAI Codex 5000 тест сұранысында сыналды.&lt;/p&gt;\n&lt;h4 id=\"barlyghy-5-myng\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#barlyghy-5-myng\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(барлығы 5 мың)&lt;/span&gt;&lt;/a&gt;(барлығы 5 мың)&lt;/h4&gt;\n&lt;p&gt;2-кестеде 5000 сұраныстан тұратын толық жиынтық бойынша нәтижелер көрсетілген. GPT-5.6-Sol моделі 61,68% Exact Correct (EC) көрсеткішімен көш бастап тұр, одан кейін Codex (51,68%) және Claude Opus 5 (44,02%) келеді. Бұл үш модель де ашық салмақты модельдер арасындағы ең мықтысы GLM-5.2 (41,32%) нәтижесінен асып түсті. Сұраныстарды қамту деңгейі жүйелер арасында әртүрлі: GPT-5.6-Sol 4988, Codex 4633, ал Claude Opus 5 тек 3675 сұранысқа жауап берген. Бұл айырмашылықтар қауіпсіздік шектеулерінің киберқауіпсіздікке қатысты қолданысқа әсер ететінін көрсетеді. Мысалы, Claude Opus 5 жауап берілген сұраныстарда 59,89% EC көрсеткішіне ие, бірақ төмен қамту (73,50%) салдарынан оның жалпы EC көрсеткіші 44,02%-ға дейін төмендейді. 61,68% максималды дәлдік KaliBench әлі де күрделі сынақ екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GPT-5.6-Sol 99,76% қамтумен 61,68% дәлдікті тіркеп, қауіпсіздік шектеулерінің аздығы арқасында бәсекелестерінен озып шықты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Кесте 5.&lt;/strong&gt; Орындау режимдері бойынша өнімділік дельталары&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;Өлшемі&lt;/th .31 20.14 31.45&lt;/td&gt;\n&lt;td&gt;5.93 44.80 50.73&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Біз үш орындау режимі арасындағы айырмашылықтарды хабарлаймыз: Unrestricted (U), Restricted (R) және Hinted (H). ∆1 (R−U), ∆2 (H−R) және ∆3 (H−U) мәндерін білдіреді, барлығы пайыздық тармақтармен (pp) өлшенеді. † ойлау қабілеті бар модельдерді, ал ⋆ киберқауіпсіздікке бапталған модельдерді білдіреді. Қалың/асты сызылған белгілер әр өлшем тобындағы ең үлкен және екінші үлкен дельталарды көрсетеді. Модельдердің реті 1-кестеге сәйкес келеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Бастапқы сұрауларға қатысты жалпы ұпайдың пайыздық тармақтардағы орташа өзгеруі&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель конфигурациясы&lt;/th&gt;\n&lt;th&gt;Орташа өзгеру (%)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Unrestricted mode&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 1&lt;/td&gt;\n&lt;td&gt;4.23&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 2&lt;/td&gt;\n&lt;td&gt;4.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 3&lt;/td&gt;\n&lt;td&gt;3.14&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 4&lt;/td&gt;\n&lt;td&gt;3.12&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 5&lt;/td&gt;\n&lt;td&gt;3.02&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 6&lt;/td&gt;\n&lt;td&gt;3.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 7&lt;/td&gt;\n&lt;td&gt;2.97&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 8&lt;/td&gt;\n&lt;td&gt;1.98&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Орташа мәні&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;3.20&lt;/strong&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Proprietary models and scaffolded inference in Unrestricted mode.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-tT2.jpg\" alt=\"Кесте 2\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"kalibench-post-treningining-aeseri\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kalibench-post-treningining-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KaliBench пост-тренингінің әсері&lt;/span&gt;&lt;/a&gt;KaliBench пост-тренингінің әсері&lt;/h4&gt;\n&lt;p&gt;KaliBench оқу жиынтығында пост-тренинг өткізу ықшам модельдердің тиімділігін айтарлықтай арттырады. RedSage-K нұсқалары 76,9, 77,4 және 79,2 орташа баллдарды көрсетті. 8B параметрлі RedSage-K (SFT+GRPO) моделі ашық модельдер арасында үшінші орынды иеленіп, DeepSeek-V3.2-ден тек 1,0 балға қалып тұр. SFT әдісі құралдарды карталау мен контексттік кеңестерді үйренуде тиімді болса, GRPO (нығайту арқылы оқыту) аргументтерді қалыптастыруда (Pos-F1 және TS) күштірек нәтиже береді. Комбинацияланған тәсіл (SFT+GRPO) ең үздік EC және TS көрсеткіштерін қамтамасыз етеді, дегенмен H (Hard) режимінде RedSage-Ins моделіне қарағанда аздаған төмендеу байқалады. SFT-ті бастапқы кезең ретінде пайдалану аргументтер жасаудағы қателер мен регрессияларды азайтуға көмектеседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — белгіленген үлгілер негізінде оқыту, GRPO (Group Relative Policy Optimization) — топтық марапаттар негізінде модель стратегиясын оңтайландыратын нығайту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oenimdilik-pen-turakhtylykhty-egzhej-tegzhejli-taldau\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#oenimdilik-pen-turakhtylykhty-egzhej-tegzhejli-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өнімділік пен тұрақтылықты егжей-тегжейлі талдау&lt;/span&gt;&lt;/a&gt;Өнімділік пен тұрақтылықты егжей-тегжейлі талдау&lt;/h4&gt;\n&lt;p&gt;Өлшемдер мен құралдар деңгейіндегі талдау. 5(a)-суретте 23 функционалдық өлшем, бес қауіпсіздік кезеңі және үш бағалау режимі бойынша модельдердің өнімділігі берілген. Тапсырмалардың күрделілігі барлық режимдер үшін ұқсас: «gpu» және «crypto-stego» сияқты бағыттар жоғары нәтиже көрсетсе, «802-11» және «wireless» ең қиыны болып қалуда. H (Hinted) режимінде модельдер арасындағы нәтижелер айырмашылығы азаяды, бұл құжаттаманың аргументтерді қалыптастыруда көмектесетінін, бірақ интерфейс күрделілігін толық жоймайтынын көрсетеді. «Барлау» және «Олқылықтарды талдау» кезеңдері тұрақты, ал «Пост-эксплуатация» мен «Қорғаныстық талдау» CLI құрылымдарының әртүрлілігіне байланысты үлкен алшақтықтарды көрсетеді. Қарапайым шаблоны бар құралдар (мысалы, truecrypt2john) сенімді өңделеді, ал сирек кездесетін жалаушалары бар құралдар (мысалы, nikto) синтаксистік қателерге әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Құралдар бойынша құжаттаманы ұсыну (H режимі) модельдер арасындағы нәтижелер алшақтығын айтарлықтай азайтады және жалпы дәлдікті арттырады, дегенмен CLI синтаксисінің күрделілігі кедергі болып қала береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Режимдер бойынша өнімділік үрдістері. 5(b,c)-суретте жалпы балл (Total Score) мен дәлдік (Exact Correct) таралуы көрсетілген. Екі көрсеткіш те U (Unrestricted) режимінен R (Restricted) және H режиміне өткенде жақсарады. Жалпы балл диапазоны 21,8-ден 13,7 пайыздық тармаққа дейін тарылады, бұл модельдерді сапа жағынан жақындастырады. Алайда, «Exact Correct» көрсеткішіндегі айырмашылық үлкен күйінде қалуда (H режимінде 28,3 п.т.), бұл мүлдем дәл командаларды жазудағы қиындықтарды білдіреді. Негізгі қателер: қысқа және ұзын жалауша пішіндерін шатастыру, жоқ опцияларды ойдан шығару, қате позициялық аргументтер және жекеше/көпше түрлеріндегі қателер.&lt;/p&gt;\n&lt;h4 id=\"suranystardyng-oezgeruine-toezimdilik\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#suranystardyng-oezgeruine-toezimdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сұраныстардың өзгеруіне төзімділік&lt;/span&gt;&lt;/a&gt;Сұраныстардың өзгеруіне төзімділік&lt;/h4&gt;\n&lt;p&gt;Біз сегіз модель конфигурациясының сұраныс пішініне сезімталдығын бағаладық: «Paraphrase» (синонимдер), «Informal» (сөйлесу стилі) және «Messy» (шу, қателер, сөздердің түсіп қалуы). 3-кестеге сәйкес, парафраздар нәтижеге дерлік әсер етпейді, ал бейресми стиль аздап төмендеуге әкеледі. «&lt;a href=\"concepts/messy-zaprosy.html\"&gt;Messy» сұраныстар&lt;/a&gt;, әсіресе U режимінде, өнімділіктің ең үлкен төмендеуіне әкеледі. H режимі ең аз төмендеуді (1,07 п.т.) көрсетеді, бұл құжаттамаға қол жеткізу модельдерге «шулы» деректермен жұмыс істеуде көмектесетінін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Messy» сұраныстар — бұл модельдің шуды елемей, тапсырманың мәніне назар аудару қабілетін тексеру үшін грамматикалық қателері мен бұзылған құрылымы бар жасанды енгізілген деректер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"talkhylau-zhaene-khorytyndy\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#talkhylau-zhaene-khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау және қорытынды&lt;/span&gt;&lt;/a&gt;Талқылау және қорытынды&lt;/h4&gt;\n&lt;p&gt;KaliBench үлкен тілдік модельдердің (LLM) киберқауіпсіздік саласындағы жалпы білімі мен олардың нақты, орындалатын CLI командаларын генерациялау қабілеті арасындағы алшақтықты айқын көрсетеді. Нәтижелер құралды таңдау мен аргументтерді құрастыру түбегейлі әртүрлі мәселелер екенін дәлелдейді: кандидат құралдарды шектеу таңдау қателерін жойғанымен, аргументтер деңгейіндегі дәлдік, әсіресе қосымша жалаушалар (flags) мен олардың мәндерінің байланысы басты кедергі болып қала береді. Құралдар бойынша құжаттаманы ұсыну өнімділіктің ең үлкен өсімін береді, бұл қателіктердің көбіне ниетті түсінбеуден емес, салалық білімнің жетіспеушілігінен туындайтынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM үшін басты кедергі — құралды таңдау емес, командалық құрылым мен жалаушаларды дұрыс баптау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл нәтижелер құралдарды қолдануды схемасыз ортада, яғни модельдер нақты API-сыз синтаксисті өздері анықтауы керек жағдайда бағалаудың маңыздылығын көрсетеді. Бағалаудан бөлек, KaliBench нақты уақытта ортаны іске қосуды талап етпейтін, тексерілетін сыйақылар арқылы модельдерді жетілдіруге мүмкіндік береді. SFT және RLVR көмегімен қайта оқыту ықшам модельдердің тиімділігін айтарлықтай арттырады: 8 млрд параметрі бар модель әлдеқайда ірі жүйелердің нәтижелеріне жақындайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT — бақылаумен дәл баптау, RLVR — тексерілетін нәтижелер негізінде нығайтушы оқыту.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дегенмен, шектеулер сақталуда: бір қадамдық команда генерациясына назар аудару және құжаттамаға негізделген деректерге тәуелділік. Болашақ зерттеулер көп қадамдық жұмыс процестеріне, іздеумен толықтырылған (&lt;a href=\"concepts/retrieval-augmented-generation.html\"&gt;RAG&lt;/a&gt;) құралдарды қолдануға және ортаны ескере отырып бағалауға бағытталуы тиіс. Жалпы алғанда, KaliBench LLM негізіндегі киберқауіпсіздік құралдарын сенімді және орындалатын деңгейде дамыту үшін практикалық тестілеу және оқыту базасын ұсынады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KaliBench қазіргі таңда тек бір қадамдық тапсырмалармен шектеледі және сапалы құжаттамаға тәуелді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f1.jpg\" alt=\"1-сурет: Неліктен KaliBench маңызды? KaliBench талдаушының ниетін орындалатын Kali командаларына айналдыру үшін егжей-те\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Неліктен KaliBench маңызды? KaliBench талдаушының ниетін орындалатын Kali командаларына айналдыру үшін егжей-тегжейлі, тексерілетін бағалауды және орындау уақытын қажет етпейтін марапаттау тренингін қамтамасыз етеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f2.jpg\" alt=\"2-сурет: Kali Linux-та NL-to-CLI бағалауына арналған KaliBench end-to-end құбыры. Бенчмарк LLM негізіндегі деректер гене\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Kali Linux-та NL-to-CLI бағалауына арналған KaliBench end-to-end құбыры. Бенчмарк LLM негізіндегі деректер генерациясы, көп кезеңді тексеру-регенерация және өкілдік үлгілерді таңдау арқылы құрылған. Бағалау бүркеншік аттарды ескере отырып талдауды және құралдар, аргументтер мен өлшемдік санаттар бойынша егжей-тегжейлі бағалауды қолданады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f3.jpg\" alt=\"3-сурет: KaliBench құрылымы және өкілдік үлгісі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: KaliBench құрылымы және өкілдік үлгісі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: KaliBench құрылымы және өкілдік үлгісі. KaliBench — қауіпсіздік шабуылының өмірлік циклі бойынша ұйымдастырылған Kali Linux құралдарының құрылымдалған бенчмаркі. Ол 5 қауіпсіздік кезеңін және функционалдық өлшемдерді қамтиды. Деректер жиынтығының үлгісі табиғи тілдегі сұрауларды және ыдыратылған эталондық командаларды қамтиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f5.jpg\" alt=\"5-сурет: Қауіпсіздік өлшемдері мен режимдері бойынша өнімділік.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Қауіпсіздік өлшемдері мен режимдері бойынша өнімділік.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: Қауіпсіздік өлшемдері мен режимдері бойынша өнімділік. (a) Әр режим үшін 23 өлшем және 5 кезең бойынша өнімділік. Қораптық диаграммалар таралуды (Q1–Q3) көрсетеді, мұртшалар мин/макс үшін. (b,c) Режимдер бойынша жалпы балл және нақты дұрыс (%) көрсеткіш; нүктелі сызықтар режимдер арасындағы алшақтықты көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f6.jpg\" alt=\"6-сурет: KaliBench үлгілеріне шолу. Барлық бес қауіпсіздік кезеңін және 23 бағалау өлшемін қамтитын өкілдік мысалдар көр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: KaliBench үлгілеріне шолу. Барлық бес қауіпсіздік кезеңін және 23 бағалау өлшемін қамтитын өкілдік мысалдар көрсетілген. Толығырақ ақпарат алу үшін масштабты үлкейтіңіз.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f7.jpg\" alt=\"7-сурет: KaliBench-тегі пәрмен жолы параметрлерін қамту (бағалау жиынтығы). Жалпы жалаушалар (мысалы, –help, –verbose) ж\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: KaliBench-тегі пәрмен жолы параметрлерін қамту (бағалау жиынтығы). Жалпы жалаушалар (мысалы, –help, –verbose) жиі кездескенімен, құралдарға тән көптеген функционалдық параметрлер де бүкіл деректер жиынтығында бар.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жасанды&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;интеллект CLI&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пәрмендерін&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қате жазады&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;KaliBench&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тексерілетін&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-
