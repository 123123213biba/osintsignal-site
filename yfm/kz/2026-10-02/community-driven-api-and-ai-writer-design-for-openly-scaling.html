        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"145\" cy=\"86\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"695\" cy=\"239\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · CROWDSOURCING   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Әлеуметтік желідегі&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;фактчекинг: жасанды&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;интеллект пен адамдардың&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;бірлескен жұмысы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f2.jpg\" alt=\"2-сурет: Community Writer. Жазу процесі жазбаларды алу және оларға басымдық беруден басталады, одан кейін жіберу алдында\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Community Writer. Жазу процесі жазбаларды алу және оларға басымдық беруден басталады, одан кейін жіберу алдында нобайлар жасау және жазбаларды бағалау жүргізіледі. Кері байланыс циклдары ұсынылған жазбаларды жою немесе қайта қарау үшін қатысушылардың рейтингтерін бақылап отырады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Community Notes платформасы енді посттарға контекст қосу үшін жасанды интеллектті қолданады. Автоматтандырылған жазушылар пайдаланушылармен бірге жұмыс істейді, ал түпкілікті шешімді қауымдастық қабылдайды. 2026 жылғы маусымдағы талдаулар жасанды интеллект фактілерді тексеру процесін айтарлықтай жеделдеткенін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Жасанды интеллект қауымдастық пайдалы деп тапқан ескертпелердің 52 пайызын қамтамасыз етеді.&lt;/li&gt;\n&lt;li&gt;Жүйе сапа мен дәлдікке байланысты квоталармен жұмыс істейтін API-ды қолданады.&lt;/li&gt;\n&lt;li&gt;Жасанды интеллект адамдар белсенді емес 42 пайыз посттарда контекст жасайды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жүйе краудсорсинг — еріктілер тобы арқылы ақпаратты бағалау әдісіне негізделген. 2025 жылдың қыркүйегінен бастап AI Note Writer API іске қосылды, бұл әзірлеушілерге жасанды интеллект арқылы ескертпелер ұсынуға мүмкіндік береді. Маңыздысы, жасанды интеллект түпкілікті шешім қабылдамайды: X платформасының пайдаланушылары әр ескертпенің пайдалы (Helpful) немесе пайдасыз (Not Helpful) екеніне дауыс береді. Жүйе әртүрлі көзқарастағы пайдаланушылар арасындағы консенсусты анықтау үшін ашық бастапқы коды бар алгоритмді пайдаланады.&lt;/p&gt;\n&lt;p&gt;2026 жылдың маусымында негізгі API клиенті Community Writer «Пайдалы» деп танылған барлық ескертпелердің 52 пайызын жасады. Жасанды интеллект жазушылары «кіру кезеңінен» (earn-in) өтуі тиіс, онда олардың дәлдігі, токсикалық еместігі және фактілерге сәйкестігі тексеріледі. Жариялау квоталары алдыңғы ескертпелердің сәттілігіне қарай динамикалық түрде өзгереді, бұл жасанды интеллект жүйелерін адам бағалауынан жоғары сапаны сақтауға мәжбүр етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректер 2026 жылдың 2-29 маусым аралығын қамтиды және модерация алгоритмдеріндегі ұзақ мерзімді өзгерістерді ескермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Community Notes — X әлеуметтік желісіндегі жазбаларға контекст қосуға арналған краудсорсингтік тәсіл. Қатысушылар ескертпелерді ұсынып, бағалайды, бұл ашық бастапқы коды мен ашық деректері бар алгоритмнің негізін қалайды. Бұл алгоритм қай ескертпелердің пайдаланушыларға кеңінен көрсетілетінін анықтайды. 2025 жылдың қыркүйегінен бастап AI Note Writer API жұмыс істейді, ол жасанды интеллект (ЖИ) көмегімен ескертпелер ұсыну үшін ашық интерфейс береді. Мұнда негізгі қағида сақталады: платформа немесе ЖИ емес, пайдаланушылар қандай ескертпелердің көрінетінін бақылайды. Ескертпелерге сұраныстар мен пайдаланушылардың X желісіндегі белсенділігі AI API деректер ағынын анықтайды, бұл ЖИ жұмысының пайдаланушылар сұранысына сай болуын қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Community Notes жүйесі контекст жасау үшін ЖИ қолданады, мұнда «пайдалы» деп танылған және кең аудиторияға көрсетілген ескертпелердің 52%-ы AI Note Writer API арқылы жасалған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу 2026 жылдың 2-29 маусымы аралығын қамтиды. API-дің ең ірі клиенті — Community Writer, ол ЖИ жасаған нәтижелердің негізгі бөлігін қамтамасыз етеді. Жүйе оқыту және пайдалану барысында қауымдастықтың пікіріне сүйене отырып, ескертпелерді басымдыққа бөлу, жобасын дайындау, бағалау және жою жұмыстарын жүргізеді. Ауқымдылықтан бөлек, ЖИ жылдамдықты да қамтамасыз етеді: басқа авторлармен салыстырғанда, ол 60% жағдайда бірінші болып жойылмайтын ескертпені ұсынады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;AI Note Writer API — бұл автоматтандырылған жүйелерге пайдаланушылар сұранысы негізінде жазбаларға түсіндірме ескертпелер ұсынуға мүмкіндік беретін бағдарламалық интерфейс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жасанды интеллект адамдардың жұмысын толықтырып, Community Notes қамту аясын кеңейтеді. «Пайдалы» ескертпелері бар жазбалардың 42%-ында тек ЖИ ескертпелері бар, бұл адамдардың сол тақырыптарға қызығушылығының жоқтығын көрсетеді. Керісінше, 30% жазбада тек адамдар жазған ескертпелер бар, бұл адамдардың үлесі әлі де маңызды екенін білдіреді. Community Writer бағдарламалық жасақтамасы ашық бастапқы кодты және Apache 2.0 лицензиясымен шығарылған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректер белгілі бір кезеңді (2026 жылдың маусымы) көрсетеді және алгоритмдердегі немесе пайдаланушылардың мінез-құлқындағы ұзақ мерзімді өзгерістерді ескермеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"community-notes-zhuejesining-evolyuciyasy-zhaene-zhasandy-intellektini-engizu\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-notes-zhuejesining-evolyuciyasy-zhaene-zhasandy-intellektini-engizu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Notes жүйесінің эволюциясы және жасанды интеллектіні енгізу&lt;/span&gt;&lt;/a&gt;Community Notes жүйесінің эволюциясы және жасанды интеллектіні енгізу&lt;/h4&gt;\n&lt;p&gt;2021 жылдың қаңтарында іске қосылған Community Notes бағдарламасы жалған ақпаратпен күресудің орталықтандырылмаған тетігі болып табылады. Жүйе орталықтандырылған бақылаусыз жұмыс істейді: пайдаланушылар жарияланымдарға контекстік ескертпелер ұсынады, ал басқа қатысушылар олардың пайдалылығын бағалайды. Ашық бастапқы коды мен ашық деректері бар алгоритм тіпті қарама-қайшы көзқарастағы пайдаланушылар арасындағы консенсусты анықтайды және ескертпелерге «Пайдалы» (CRH), «Пайдалы емес» (CRNH) немесе «Қосымша бағалау қажет» (NMR) мәртебелерін береді. CRH мәртебесі ескертпенің платформаның барлық пайдаланушыларына көрінуін қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Community Notes алгоритмі қарсыластар арасында консенсусқа қол жеткізуге мүмкіндік береді, ал ЖИ-авторларын енгізу күнделікті пайдалы ескертпелер (CRH) көлемін 86,0%-ға арттырды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алдыңғы зерттеулер бұл тәсілдің дәлдігі мен тиімділігін растайды. Табысты нәтижелер Meta, TikTok және YouTube сияқты платформаларды ұқсас құралдарды енгізуге итермеледі. Алайда, адамдардың ескертпе жазуы көп уақытты қажет етеді. 2025 жылдың 2 қыркүйегінде жүйеге AI API интеграцияланды, бұл үшінші тарап әзірлеушілеріне автоматтандырылған ескертпелер жасауға мүмкіндік берді. Маңыздысы, ЖИ тек контентті ұсынады, ал түпкілікті шешім (CRH мәртебесі) әлі де қауымдастықтың бағалауы арқылы қабылданады.&lt;/p&gt;\n&lt;h4 id=\"community-writer-arhitektura-zhaene-zhuejege-khoskhan-uelesi\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-writer-arhitektura-zhaene-zhuejege-khoskhan-uelesi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Writer: архитектура және жүйеге қосқан үлесі&lt;/span&gt;&lt;/a&gt;Community Writer: архитектура және жүйеге қосқан үлесі&lt;/h4&gt;\n&lt;p&gt;AI API-дің ең ірі клиенті — Community Writer (CW), ол ұсынылған ескертпелердің 41%-ын құрайды. CW контентті сүзу және жасау үшін мамандандырылған оқытылған модельдер мен коммерциялық шешімдерді пайдаланады. Жоба Apache 2.0 лицензиясымен таратылады. Бұл жұмыста авторлар ЖИ-агенттерінің жоғары жылдамдықты қамтамасыз ететінін көрсетеді: 60% жағдайда ЖИ-клиенті бірінші болып жойылмайтын ескертпе жасайды, бұл CRH мәртебесіндегі ескертпелер қаралымының 55%-ын қамтамасыз етеді. Сондай-ақ, жүйе ресурстарды тиімді пайдаланады: ЖИ жалпы бағалаулардың 22%-ын жұмсай отырып, барлық CRH-ескертпелердің 52%-ын жасайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ЖИ-авторлары (AI writers) — бұл API арқылы жарияланымдар лентасын бақылап, автоматты түрде түсіндірме ескертпелер жасайтын бағдарламалық агенттер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fon-zhaene-bajlanysty-zhumystar\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#fon-zhaene-bajlanysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фон және байланысты жұмыстар&lt;/span&gt;&lt;/a&gt;Фон және байланысты жұмыстар&lt;/h4&gt;\n&lt;p&gt;Бұл саладағы зерттеулердің басым бөлігі Community Notes жүйесінің дәлдігі мен тиімділігін бағалауға арналған. Аллен және оның әріптестері X платформасындағы COVID-19 мен вакциналарға қатысты ескертпелерді талдап, олардың 97%-ы толығымен сенімді екенін анықтады. Слаутердің зерттеулері қауымдастық ескертпесі қосылғаннан кейін жаңылыстыратын ақпараттың таралуы 46%-ға төмендейтінін көрсетті. Чуай мен әріптестері бұл үрдісті растап, сенімсіз контенттің таралуы орташа есеппен 62%-ға азайғанын және пайдаланушылардың мұндай жазбаларды өшіру ықтималдығы 103%-ға артқанын тіркеді. Дрольсбах ескертпелердің контекстке бейімделуі пайдаланушылардың фактчекингке деген сенімін жалпы ескертулерге қарағанда көбірек арттыратынын дәлелдеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеулер Community Notes жүйесінің 97% дәлдігін және жалған ақпараттың таралуын 46–62% аралығында төмендетудегі тиімділігін растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Басқа жұмыстар қауымдастық негізіндегі және кәсіби фактчекингті салыстырады. Боренштейн бұрын құжатталған дезинформацияға қатысты ескертпелер басқа дереккөздерге қарағанда екі есе жиі фактчекинг дереккөздеріне сілтеме жасайтынын анықтады. Чжао мен Нааман қауымдастық тәсілдерінің жылдамырақ жұмыс істейтінін және жиі кәсіби мәліметтерге сүйенетінін атап өтеді. Жасанды интеллект шешімдері саласында Сингх, Чжоу және Де ескертпелерді генерациялауға арналған модельдерді ұсынды, алайда оларды бағалау нақты жағдайда емес, сарапшылар немесе зерттеу қатысушыларының көмегімен офлайн режимде жүргізілді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Офлайн бағалау — бұл алгоритмді нақты пайдаланушылармен өзара әрекеттесусіз, статикалық деректер жиынтығында сынақтан өткізу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жекелеген ескертпелерді жасауға бағытталған алдыңғы жұмыстардан айырмашылығы, біз бүкіл платформа ауқымында контекстті қамтамасыз ететін ашық API жұмысын ұсынамыз. Біз ең ірі API-клиенттің архитектурасын, соның ішінде инфрақұрылым мен модельдерді сипаттаймыз. Ли мен Баккер де API-клиентті бағалап, оның адамдарға қарағанда көбірек кідіріспен жұмыс істейтінін, бірақ рейтинг бақыланған кезде ескертпе сапасы бойынша адамдардан озық екенін атап өтті. Манцарлис пассивті талдауда AI-авторлар адамдарға қарағанда жоғары орташа пайдалылық (CRH) көрсеткіштерін сақтайтынын растады. Біздің жұмыс бұл деректерді кеңейтіп, кідіріс, сапа және көлем бойынша метрикаларды, сондай-ақ басқа API-клиенттермен және үздік адам-авторлармен салыстыруды қамтиды.&lt;/p&gt;\n&lt;h4 id=\"community-notes-ai-api-sholuy\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-notes-ai-api-sholuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Notes AI API шолуы&lt;/span&gt;&lt;/a&gt;Community Notes AI API шолуы&lt;/h4&gt;\n&lt;p&gt;Community Notes AI API бес негізгі функцияны ұсынады: тексеруге үміткер посттарды сұрау, әлеуетті ескертпелерді бағалау, ұсыныстарды жіберу, ескертпелерді жою және олардың күйін нақты уақыт режимінде алу. API арқылы жасалған барлық ескертпелер ашықтық үшін күлгін түспен белгіленеді. Жүйе контент сапасын сақтау және спамды шектеу үшін жариялау құқығын «табыс ету» және квоталау механизмдерін қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Квота жүйесі AI-авторлардан адамдардан жоғары тиімділікті талап етеді: 20% табыстылық деңгейімен (hit rate) күніне 500 ескертпе жариялауға болады, ал адамдардың орташа CRH көрсеткіші шамамен 10,4% құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;API-ге қол жеткізу үшін әзірлеушілер расталған email және телефон нөмірі бар, Community Notes бағдарламасының қазіргі қатысушысы емес аккаунтты тіркеуі тиіс. «Табыс ету» (earn-in) процесі соңғы 50 ескертпені үш критерий бойынша талдауға негізделген: сілтемелердің жарамдылығы (кемінде 95% 200 HTTP кодын қайтаруы керек), қудалау белгілерінің болмауы (кемінде 98% ескертпе классификатор тексеруінен өтуі шарт) және ClaimOpinion моделіне сәйкестік. Соңғысы DistilRoBERTa-base архитектурасына негізделген және ескертпенің пайдалылығы мен фактілерге негізделгенін бағалайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ClaimOpinion — бұл ескертпенің пайдалы (Helpful) деп танылу ықтималдығын болжайтын, оның бейтараптығын талдайтын машиналық оқыту моделі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тексеруден өткеннен кейін квота жүйесі іске қосылады. Ол табысты (CRH) және табыссыз (CRNH) ескертпелердің қатынасы — «hit rate» негізінде жарияланымдар санын динамикалық реттейді. Аз оқылатын посттармен жұмыс істегенде айыппұлдарды болдырмау үшін 14 күндік есептеуден 10-нан аз баға алған ескертпелер алынып тасталады. Квоталар сызықтық емес өседі: 10% табыстылықта күніне 50 ескертпеден, 20% табыстылықта күніне 500-ге дейін. 1-кестеде көрсетілгендей, API деректер ағынын (Small-дан XXL-ге дейін) сұранысқа қарай құрылымдайды, мұнда таңдама көлемі күніне 428-ден 24 389 постқа дейін жетеді.&lt;/p&gt;\n&lt;h4 id=\"api-zhumys-mehanizmi-zhaene-lentalar-zhiktelui\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#api-zhumys-mehanizmi-zhaene-lentalar-zhiktelui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;API жұмыс механизмі және ленталар жіктелуі&lt;/span&gt;&lt;/a&gt;API жұмыс механизмі және ленталар жіктелуі&lt;/h4&gt;\n&lt;p&gt;Жүйе контентті төрт түрлі лентаға бөледі: Small, Large, XL және XXL (1-кесте). Посттардың қай лентаға түсуі пайдаланушылардың нақты сұраныстарына, жанама сигналдарға (мысалы, @grokisthistrue? ескертпелері) және сұраныс авторының пайдалылық рейтингіне байланысты. Посттар XXL лентасынан басталып, сигналдар жинақталған сайын тар ленталарға ауысады. Small лентасы CRH (Community Rated Helpful) мәртебесін алатын посттардың ең жоғары концентрациясын қамтамасыз етеді, бірақ бұл ең жоғары кідіріспен байланысты. Кішірек ленталарға кіру үшін кемінде 100 жазылған ескертпе, 5%-дан кем емес табыстылық деңгейі (hit rate) және 10%-дан аспайтын CRNH деңгейі талап етіледі. XXL лентасына кіру үшін соңғы 90 күн ішінде кемінде 100 таза CRH көрсеткіші қажет. 2025 жылдың қыркүйегінде іске қосылғаннан бері API 65 клиентті тартты, олардың 32-сі жариялау құқығын алды және 19-ы белсенді күйде қалуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Квоталар мен ленталарды сүзу жүйесі пайдалы ескертпелер санын барынша арттыруға мүмкіндік береді және әзірлеушілерді контентті таңдауда мұқият болуға мәжбүрлейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"community-writer-cw-sholuy\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-writer-cw-sholuy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Writer (CW) шолуы&lt;/span&gt;&lt;/a&gt;Community Writer (CW) шолуы&lt;/h4&gt;\n&lt;p&gt;Community Writer — сандық және санаттық белгілер негізіндегі жіктегіштерді, сондай-ақ қайта оқытылған және коммерциялық модельдерді қолданатын арнайы құрал. CW SpaceX AI ішкі инфрақұрылымынан тәуелсіз жұмыс істейді, жабық интерфейстерге қол жеткізе алмайды және барлық басқа AI авторлары сияқты бірдей квота ережелері мен пайдалылықты бағалау алгоритмдеріне бағынады. Оның міндеті — қауымдастық пікірлері негізінде ескертпелерді басымдықтандыру, жасау, бағалау және жою.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRH (Community Rated Helpful) — қауымдастық тарапынан пайдалы және сенімді деп танылған ескертпе мәртебесі, бұл AI авторы тиімділігінің негізгі көрсеткіші.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhobalau-makhsattary\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#zhobalau-makhsattary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жобалау мақсаттары&lt;/span&gt;&lt;/a&gt;Жобалау мақсаттары&lt;/h4&gt;\n&lt;p&gt;CW архитектурасы үш негізгі қағидаға негізделген:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Қауымдастыққа бағытталу: ескертпелерді өндіру және жою қатысушылардың белсенділігімен және X пайдаланушыларының тартылуымен тікелей байланысты.&lt;/li&gt;\n&lt;li&gt;Масштабталу және төмен кідіріс: жүйе посттар кезегін жедел өңдеуі және жауаптарды айтарлықтай уақыт шығынынсыз жасауы керек.&lt;/li&gt;\n&lt;li&gt;Ресурстарды үнемдеу: NMR (Not Mostly Rated) ескертпелерінің 54%-ы CRH мәртебесін алу үшін жеткілікті бағаларға ие еместігін ескере отырып, CW қатысушылар назарын минималды шығынмен CRH ескертпелерін барынша көрсетуге ұмтылады.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе тиімділігі қауымдастық қатысушыларының шектеулі назарымен шектелген, сондықтан алгоритмдер тек CRH мәртебесін алу ықтималдығы ең жоғары посттарды басымдықтандыруға мәжбүр.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"arhitekturagha-sholu\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#arhitekturagha-sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Архитектураға шолу&lt;/span&gt;&lt;/a&gt;Архитектураға шолу&lt;/h4&gt;\n&lt;p&gt;CW жүйесі ескертпелерді жасау, түзету және жою процестерін басқару үшін модельдеу, кезектер және AI API шақыруларын біріктіреді. 2-суретте көрсетілгендей, процесс AI API арқылы үміткер посттарды іздеуден басталады және олар LIFO (соңғы келген бірінші шығады) қағидасы бойынша кезекке қойылады. Басымдық посттар лентасының көлемі мен Notable Post Model (NPM) бағаларымен анықталады; NPM посттың CRH (Community Rated Helpful) мәртебесін алу ықтималдығын болжайды. NPM Community Notes деректері негізінде, X API арқылы алынған контент пен пайдаланушы белсенділігін ескере отырып оқытылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе CRH әлеуеті жоғары және лента көлемі кіші посттарға басымдық бере отырып, ең сұранысқа ие контент үшін кідірістерді азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Адам-авторлар посттарды зерттеп, Grok 4.20 және Community Notes деректері негізінде бейімделген CN Grok модельдері арқылы ескертпелер жасайды. Жүйе әр модельден параллель түрде үшке дейін нұсқа жасайды, содан кейін ClaimOpinion моделі ең үздігін таңдайды. Helpfulness, Recent Context және Screenshot Rejectors сүзгілері сапасыз ескертпелерді сұрыптайды. Егер екі модель де тексеруден өтсе, CN Grok басымдыққа ие болады. Жүйе тиімділігін арттыру үшін қайта әрекет ету кезегі (Retry Queue) пост жасалғаннан кейін 45 минут өткенде, ал түзету кезегі (Revision Queues) CRH мәртебесіне жетпеген ескертпелер үшін 1 және 3 сағаттан кейін іске қосылады. Жою моделі (Deletion Model) рейтингтерді нақты уақыт режимінде бақылап, тиімсіз ескертпелерді жойып отырады.&lt;/p&gt;\n&lt;h4 id=\"konvejer-komponentterining-egzhej-tegzheji\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#konvejer-komponentterining-egzhej-tegzheji\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конвейер компоненттерінің егжей-тегжейі&lt;/span&gt;&lt;/a&gt;Конвейер компоненттерінің егжей-тегжейі&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде NPM, авторлар, сүзгілер және жою моделі егжей-тегжейлі баяндалады. NPM және жою моделінің тиімділігі жеке талданады, ал CW жүйесінің жалпы өнімділігі 6-бөлімде келтіріледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LIFO (Last-In, First-Out) — кезекпен өңдеу әдісі, мұнда ең соңғы келген тапсырма бірінші болып орындалады, бұл жүйеге ең жаңа және өзекті оқиғаларға жедел жауап беруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mangyzdy-zhazbalar-modeli\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#mangyzdy-zhazbalar-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Маңызды жазбалар моделі&lt;/span&gt;&lt;/a&gt;Маңызды жазбалар моделі&lt;/h4&gt;\n&lt;p&gt;Notable Post Model (NPM) моделі жарияланымның CRH (Community Notes) ескертпесін алу ықтималдығын пост мазмұны мен метадеректер негізінде болжайды. Оқыту үшін API ленталарынан алынған деректер қолданылады, бұл деректердің таралуындағы бұрмалаушылықтарды жояды. CRH мәртебесіне ие болу үшін кемінде 10 баға қажет болғандықтан, NPM көріну деңгейі төмен посттарды сүзгіден өткізіп, оларды талдаудан шығарады, бұл бағалаушылардың ресурстарын үнемдеуге мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NPM жүйесі CRH мәртебесін алу ықтималдығы төмен посттарды алдын ала алып тастау арқылы бағалау процесін оңтайландырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель белгілердің бірнеше түрін біріктіреді: пайдаланушы белсенділігі (репосттар, жауаптар, лайктар, дәйексөздер, бетбелгілер және қаралымдар), автор сипаттамалары (жазылушылар саны, жарияланымдар тарихы, Community Notes тарихы, верификация мәртебесі және пародиялық аккаунт белгілері) және пост контексті (жасы, тілі, жасалған уақыты, медианың болуы және all-mpnet-base-v2 арқылы алынған мәтіндік эмбеддинг). Барлық деректер ашық API немесе жүйе тарихынан алынады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эмбеддинг — бұл мәтінді сандық вектор түрінде көрсету, бұл модельге посттардың семантикалық жақындығын түсінуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;NPM уақыт факторларын және белгілердің өзара әрекеттесуін ескереді. Алдын ала өңдеу кезеңінде белсенділік көрсеткіштері посттың жасына және қаралым санына қарай қалыпқа келтіріледі. Модель бір жасырын қабаты бар көп қабатты персептрон архитектурасын қолданады. 3-суретте көрсетілгендей, NPM ең үлкен ленталарда жоғары дәлдікті көрсетеді. AUC көрсеткіші модельдің CRH алатын посттарды анықтау қабілетін көрсетеді, мұнда recall (толықтық) CRH жоқ және жүйеден алынып тасталған посттардың үлесін, ал қате оң нәтижелер CRH алған посттардың қате өшірілгенін білдіреді.&lt;/p&gt;\n&lt;h4 id=\"avtorlar-zhaene-khabyldamaushylar-rejectors\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#avtorlar-zhaene-khabyldamaushylar-rejectors\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Авторлар және қабылдамаушылар (Rejectors)&lt;/span&gt;&lt;/a&gt;Авторлар және қабылдамаушылар (Rejectors)&lt;/h4&gt;\n&lt;p&gt;CW жүйесі ескертпелерді (Community Notes) жасау үшін екі арнайы модельді қолданады. Екі модель де интернетте іздеу жүргізу, URL және кескіндерді талдау, сондай-ақ X платформасындағы пайдаланушы профильдері мен медиа контентке қол жеткізу мүмкіндігіне ие. CNGrokWriter моделі қысқаша промпт негізінде жұмыс істейді, себебі оның мінез-құлқы пайдаланушылар бұрын пайдалы деп тапқан ескертпелер негізінде арнайы оқытылған. Промпт құрамына талданатын пост, стильдік нұсқаулар және пайдаланушылар ұсынған дереккөздер тізімі кіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе ескертпелердің сапасын арттыру және қате ақпаратты азайту үшін екі генеративті модель мен төрт сүзгіні қолданады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Grok 4.20 Writer моделі болса, егжей-тегжейлі промптты пайдаланады. Ол посттағы дәлсіздіктерді бағалауға және ескертпенің оқырмандар үшін қаншалықты маңызды екенін анықтауға бағытталған. Сапа критерийлеріне сенімділік, ықшамдылық, бейтараптық және дереккөздердің болуы жатады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қабылдамаушылар (rejectors) — бұл ескертпелерді пайдаланушылар бағалауына жібермес бұрын олардың сапасын тексеретін алгоритмдер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сапаны бақылау үшін төрт сүзгі қолданылады. «Helpfulness Rejector» — бұл ескертпенің CRH (Community Rated Helpful) мәртебесін алу ықтималдығын болжайтын Grok моделі. «Recent Context Rejector» соңғы 100 сәтті және 100 сәтсіз ескертпелермен салыстыру арқылы қателерді қайталамауға көмектеседі. «Screenshot Rejector» медиа контентті тексереді: ол посттағы кескіндерді дереккөздердегі суреттермен салыстырады. Егер постта видео болса, жүйе видео барысында бірнеше рет скриншот алады. Егер алғашқы тексеру өтпесе, жүйе тағы үш рет қайта тексеру жүргізеді. «Revision Rejector» түзетулерді бағалайды: ол түпнұсқа және өзгертілген ескертпелер арасындағы айырмашылықтарды талдап, өзгерістер жаңа деректер әкелуі немесе аргументацияны күшейтуі керек екенін бақылайды.&lt;/p&gt;\n&lt;h4 id=\"zhoyu-modeli-deletion-model\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#zhoyu-modeli-deletion-model\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жою моделі (Deletion Model)&lt;/span&gt;&lt;/a&gt;Жою моделі (Deletion Model)&lt;/h4&gt;\n&lt;p&gt;Жою моделі (Deletion Model) CRH (Current Rating Helpful) мәртебесін алу ықтималдығы төмен жазбаларды анықтап, оларды проактивті түрде жоюға арналған. Жойылған жазбалар X платформасындағы қатысушыларға көрінбейді, бұл бағалау ресурстарын үнемдеуге көмектеседі, бірақ олар жазба жіберу квоталары мен күнделікті жазу лимиттеріне әсер ете береді. Модель нақты уақыт режимінде жазба мәртебесі мен бағаларын алуға мүмкіндік беретін AI API-ге сүйенеді. Нақты уақыт режиміндегі бағалау деректеріне қол жеткізу үшін соңғы 90 күн ішінде кемінде 100 CRH жазбасы болуы шарт.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жою моделі жинақталған бағалар негізінде логистикалық регрессияны қолдана отырып, перспективасыз жазбаларды нақты уақыт режимінде автоматты түрде алып тастайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе «Пайдалы», «Ішінара пайдалы» және «Пайдалы емес» бағаларының санын, сондай-ақ жазба сапасын нақтылайтын тегтерді (мысалы, дереккөздердің болмауы немесе негізгі ойлардың түсіп қалуы) талдайды. Бұл деректер бағалаушы факторының оң, бейтарап және теріс мәндеріне сәйкес келетін үш топқа жинақталады. Модель логистикалық регрессия әдісімен болжам жасайды, мұнда белгілердің өзара әрекеттесуін есепке алу үшін дискретизация және полиномдық кросстар қолданылады. Оқыту деректері алғашқы 30 бағалау барысында 10 ретке дейінгі аралықтармен бөліп алынады, бұл өндірістік деректердің оқыту үлгісіне сәйкес келуін қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Полиномдық кросстар — бұл бар белгілерді көбейту арқылы жаңа белгілерді жасау әдісі, ол модельге белгілер арасындағы күрделі байланыстарды анықтауға көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4-суретте көрсетілгендей, модельдің дәлдігі бағалар саны артқан сайын жақсарады. Өндірістік ортада жүйе әр 60 секунд сайын бағаларды тексеріп отырады. Модель жоғары сенімділік танытқанда 3 немесе 4 баға негізінде жою үшін жоғары шекті мән, ал 5 және одан да көп баға болғанда стандартты шекті мән қолданылады. Жазбалардың әртүрлі санаттары бойынша толық деректер 1-кестеде берілген.&lt;/p&gt;\n&lt;h4 id=\"baghalau\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау&lt;/span&gt;&lt;/a&gt;Бағалау&lt;/h4&gt;\n&lt;p&gt;Бұл бөлімде 2026 жылғы 2 маусым мен 29 маусым аралығындағы AI жазу жүйесінің (CW) жұмысы талданады. Зерттеу API ағындарын профильдеуді, ұсынылған жазбалардың басқа AI және адамдар жазған жазбалармен салыстырғандағы тиімділігін, сондай-ақ сүзу механизмдерінің әсерін қамтиды. Жүйе жоғары нәтижелілікті көрсетті: CW үлесіне ұсынылған жазбалардың 41%-ы, «пайдалы» (CRH) мәртебесін алған жазбалардың 52%-ы және мұндай жазбаларды көрудің 55%-ы тиесілі, бұл ретте жүйе қауымдастық қатысушыларының бағалау ресурстарының тек 22%-ын ғана жұмсады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CW жүйесі жоғары тиімділік көрсетіп, пайдалы жазбаларды көрудің жартысынан көбін қамтамасыз етті және қатысушылардың ресурстарын үнемдеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;API төрт ағын түрін (Small, Medium, Large, XXL) қамтиды, олар қосу критерийлерімен ерекшеленеді. 2-кестеде көрсетілгендей, ірі ағындар үшін сигналдарға қойылатын талаптардың төмендеуі посттар көлемінің экспоненциалды өсуіне (әр кезеңде 3–5 есе) әкеледі. Посттардың пайда болу жылдамдығы да артады: медианалық жасы Small ағынында 604 минуттан XXL ағынында 185 минутқа дейін қысқарады, бұл ретте посттардың 10%-ы XXL ағынында 9 минут немесе одан аз уақыт ішінде пайда болады. Адамдар жазған CRH-жазбаларды (H-CRH) алған посттарды қамту деңгейі Small ағынында 24,3%-дан XXL ағынында 73,4%-ға дейін өзгереді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRH (Community Rating Helpfulness) — қауымдастық қатысушыларының бағалауы негізінде анықталатын жазбаның пайдалылық көрсеткіші.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әртүрлі ағындарға бейімделу үшін CW жеке шектік мәндерді пайдаланады. Мысалы, ірі ағындар үшін қатаңырақ сүзу критерийлері (NPM — Note Prediction Model) қолданылады, өйткені онда пайдалы жазбалардың пайда болу ықтималдығы төменірек. Small ағынында NPM моделі өшірілген, ал XXL ағынында ол посттардың тек 17,1%-ын ғана өткізеді. NPM сүзуінен кейін шикізат жазбаларын жасау жиілігі төмендейді және барлық ағындар үшін түпкілікті CRH деңгейі 7,9–10,5% аралығында сақталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;NPM сүзу тиімділігі XXL ағынындағы H-CRH посттарын қамту деңгейінің 73,4%-дан 55,8%-ға дейін төмендеуіне әкеледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Топ-авторлармен» (жоғары рейтингке ие барлық белсенді адамдардың 3,5%-ы) салыстыру CW-дің сәтті жазбалар үлесі бойынша олардан басым екенін көрсетеді. 5-суретте CW ресурстарды тиімді бөлетіні және CRH мәртебесіне орташа көрсеткіштен жоғары деңгейде қол жеткізетіні көрсетілген. Басқа AI-авторлар даулы контент тығыздығы жоғары ағындарда (Small ағынында 64%) басым болғанымен, CW NPM және қабылдамау механизмдерінің көмегімен ірі ағындарды (XL, XXL) бағалау жүйесін шамадан тыс жүктемей өңдеуге қол жеткізеді.&lt;/p&gt;\n&lt;h4 id=\"oenimdilik-pen-zhasandy-intellekt-avtorlarynyng-aeserin-taldau\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#oenimdilik-pen-zhasandy-intellekt-avtorlarynyng-aeserin-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Өнімділік пен жасанды интеллект авторларының әсерін талдау&lt;/span&gt;&lt;/a&gt;Өнімділік пен жасанды интеллект авторларының әсерін талдау&lt;/h4&gt;\n&lt;p&gt;Адам авторларымен салыстыру (6-сурет) Community Writer (CW) ұсынған жазбалардың сапасы басқа ЖИ жүйелерімен және адамдармен салыстырмалы екенін көрсетеді. «Жазба бойынша» талдауы (7-сурет) CRH (пайдалы деп танылған жазбалар) және сапасыз (жойылған немесе CRH мәртебесін алмаған) жазбалардың үлесін көрсетеді. Жою моделі (Deletion Model) жою деңгейін арттырады, өйткені көптеген жазбалар CRH мәртебесіне жетпей тұрып алынып тасталады. Тұрақты жазбаларды (кемінде 5 сапасыз немесе 10 CRH бағасы бар) талдағанда, CW ең жоғары CRH көрсеткішін сақтайды, бұл басқа ЖИ клиенттерімен салыстырғанда z=2.082 (p=.037) статистикалық маңыздылықпен расталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CW ең жоғары CRH тиімділігін көрсетеді: бағалаудың 29% жағдайы пайдалы жазбаға әкеледі, бұл үздік адам авторларындағы 17% көрсеткіштен айтарлықтай жоғары.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тиімділік сонымен қатар қатысушылардың тәжірибесін көрсететін «бағалау бойынша нәтижелер» арқылы өлшенеді. CW жазбалардың лентаға тезірек түсуін қамтамасыз етеді. 8-суретке сәйкес, жойылмаған жазбалар арасында CW 60% жағдайда бірінші жазбаны, ал 95% жағдайда бірінші ЖИ жазбасын жариялайды. ЖИ авторлары тақырыптар бойынша кең ауқымды қамтиды (9-сурет), көбінесе адамдардың жұмысын толықтырады: көп жағдайда ЖИ жазбалары адамдар тарапынан ұсыныс болмаған посттарда пайда болады. Дегенмен, адамдардың үлесі маңызды болып қала береді: CRH жазбалары бар посттардың 41%-ында ЖИ жазған CRH жазбасы жоқ, ал 30%-ында ЖИ ұсынысы мүлдем жоқ.&lt;/p&gt;\n&lt;h4 id=\"talkhylau-zhaene-shekteuler\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#talkhylau-zhaene-shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау және шектеулер&lt;/span&gt;&lt;/a&gt;Талқылау және шектеулер&lt;/h4&gt;\n&lt;p&gt;ЖИ авторлары платформа мүмкіндіктерін кеңейтеді, сонымен бірге адамдар қауымдастығының бақылауында қалады. Бұл CRH жазбалары санының 86.0%-ға өсуіне ықпал етті. Жылдам өзгеретін тақырыптарда адамдардың қатысуы таптырмас құрал. Notable Post және Deletion модельдері еріктілердің уақытын үнемдеп, олардың назарын CRH болу ықтималдығы жоғары жазбаларға аударады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CRH (Community Rated Helpful) — бағалау жүйесі негізінде қауымдастық пайдалы және сенімді деп таныған жазба мәртебесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шектеулері: әртүрлі ЖИ авторларының операциялық шығындары мен лента өлшемдері әртүрлі болғандықтан салыстыру қиын. Сондай-ақ, ЖИ аккаунттары өз мінез-құлқын өзгертуі немесе бірнеше стратегияны біріктіруі мүмкін, бұл оларды сегменттеуді қиындатады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;h4 id=\"community-notes-ueshin-zhasandy-intellekt-khuraldaryn-engizu-khorytyndysy\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#community-notes-ueshin-zhasandy-intellekt-khuraldaryn-engizu-khorytyndysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Community Notes үшін жасанды интеллект құралдарын енгізу қорытындысы&lt;/span&gt;&lt;/a&gt;Community Notes үшін жасанды интеллект құралдарын енгізу қорытындысы&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыста Community Notes AI API және Community Writer құралдары ұсынылған, олар бірлесе отырып X әлеуметтік желісіндегі ескертпелерді қамтуды кеңейту үшін ашық әрі тиімді жүйені құрайды. Біз жасанды интеллектіні ескертпелердің қараламасын жасау үшін пайдалану ерікті адамдардың жұмысына маңызды толықтыру екенін дәлелдедік. Бұл технологияларды енгізу контент жасау жылдамдығын, ескертпелерді бағалау процесінің тиімділігін айтарлықтай арттыруға және нәтижесінде платформаның кең аудиториясына көрсетілетін «Пайдалы» (Currently Rated Helpful) мәртебесін алған ескертпелер санын көбейтуге мүмкіндік берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасанды интеллект құралдары жүйенің жылдамдығы мен тиімділігін арттырып, пайдалы ескертпелердің үлесін көбейтеді, сонымен бірге адамдар негізгі модераторлар рөлін сақтап қалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Автоматтандырудың айқын артықшылықтарына қарамастан, адам үлесі Community Notes экожүйесінің іргелі элементі болып қала береді. Еріктілер жоғары инстанция мәртебесін сақтап қалады және алгоритмдер жасаған немесе пайдаланушылар ұсынған қай ескертпелердің лентада көрсетілетінін түпкілікті бақылайды. Жасанды интеллект тек көмекші құрал ретінде қызмет етеді, қауымдастықтың сараптамалық пікірін алмастырмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Community Notes — бұл пайдаланушылар жарияланымдарға контекст қосатын және басқа қатысушылар осы толықтырулардың пайдалылығын бағалайтын краудсорсингтік фактілерді тексеру жүйесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f2.jpg\" alt=\"2-сурет: Community Writer. Жазу процесі жазбаларды алу және оларға басымдық беруден басталады, одан кейін жіберу алдында\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Community Writer. Жазу процесі жазбаларды алу және оларға басымдық беруден басталады, одан кейін жіберу алдында нобайлар жасау және жазбаларды бағалау жүргізіледі. Кері байланыс циклдары ұсынылған жазбаларды жою немесе қайта қарау үшін қатысушылардың рейтингтерін бақылап отырады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f3.jpg\" alt=\"3-сурет: Үлкенірек ленталар аз пайдаланушылардан ескертпе сұрауларын талап ететіндіктен, таралу CRH ескертпесін алу ықти\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Үлкенірек ленталар аз пайдаланушылардан ескертпе сұрауларын талап ететіндіктен, таралу CRH ескертпесін алу ықтималдығы төмен деп оңайырақ анықталатын жазбаларға қарай ауысады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f4.jpg\" alt=\"4-сурет: Жою моделінің тиімділігі бағалаулар жинақталған сайын арта түседі. CW жою моделін 3 бағалау қолжетімді болған б\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Жою моделінің тиімділігі бағалаулар жинақталған сайын арта түседі. CW жою моделін 3 бағалау қолжетімді болған бойда әр 60 секунд сайын қолданады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f5.jpg\" alt=\"Сурет 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f7.jpg\" alt=\"7-сурет: Тұрақты ноталарға CRH, CRNH, жойылған немесе минималды рейтингке сәйкес келетін кез келген нота кіреді. Тұрақты\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Тұрақты ноталарға CRH, CRNH, жойылған немесе минималды рейтингке сәйкес келетін кез келген нота кіреді. Тұрақтылық шарты бойынша, CW нәтижелері CRH және төмен сапалы нәтижелер бойынша да басымдыққа ие.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f8.jpg\" alt=\"8-сурет: Басқа авторлармен салыстырғанда, CW жазбалардың 60%-ында бірінші ұсынылған, жойылмаған ескертпені жариялайды.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Басқа авторлармен салыстырғанда, CW жазбалардың 60%-ында бірінші ұсынылған, жойылмаған ескертпені жариялайды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-f10.jpg\" alt=\"10-сурет: NMR жазбаларының 54%-ы 10-нан аз баға алады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет: NMR жазбаларының 54%-ы 10-нан аз баға алады.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\"
