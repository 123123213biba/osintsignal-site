        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"146\" cy=\"132\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"494\" cy=\"272\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Өткенді еске сақтайтын&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;робот: жасырылған заттарды&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;табу жолы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f1.jpg\" alt=\"1-сурет: Оқиғаға негізделген ұстау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Оқиғаға негізделген ұстау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Оқиғаға негізделген ұстау. (A) VoLo, VLM оркестраторы, нұсқаулықтың нысанасын дұрыс анықтайды және оның мәтіндік сипаттамасын VLA (π0.5) немесе WAM (Cosmos3-Nano-Policy) жүйесіне жібереді. Дегенмен, екі модель де жасырылған нысананы таба алмайды және ұстай алмайды. (B) Біздің жүйе өткен бақылаулар негізінде кеңістіктік түсінікті іске қосады, нысананы ашатын көру нүктесін белсенді түрде таңдайды және оны сәтті ұстайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Зерттеушілер роботтарға өткен әрекеттер негізінде заттарды табуға мүмкіндік беретін BeyondSCe жүйесін ұсынды. Егер қажетті зат көрінбей қалса, робот бейнежазбаны талдап, оны табу үшін ең тиімді көру нүктелерін таңдайды. Бұл технология арнайы оқытуды қажет етпейді және қарапайым RGB-D камераларымен жұмыс істейді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Жасырылған нысандарды алу сәттілігі 77%-ға дейін өсті.&lt;/li&gt;\n&lt;li&gt;Іздеуге қажетті ракурстар саны 3.35-тен 2.20-ға дейін қысқарды.&lt;/li&gt;\n&lt;li&gt;Арнайы қосымша оқытуды қажет етпейтін дайын модельдер қолданылады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;BeyondSCe жүйесі нұсқауларды түсіндіру үшін мультимодальды тілдік модельдер (MLLM) мен нүктелерді бақылау алгоритмдерін қолданады. Пайдаланушы «жаңа ғана қолданылған затты ал» деп бұйырғанда, жүйе бейне тарихын қарап шығып, нысанды және оның соңғы орналасқан жерін анықтайды. Егер нысана ағымдағы кадрда көрінбесе, робот өткен деректерді қазіргі көріністің геометриясымен біріктіріп, кеңістіктік ықтималдық картасын жасайды.&lt;/p&gt;\n&lt;p&gt;Жасырылған нысанды табу үшін робот белсенді қабылдау әдісін қолданады: ол камера қозғалысын азайту үшін көру нүктелерін бағалайды. Манипулятор мен білекке орнатылған RGB-D камерасы арқылы жүргізілген тәжірибелерде жасырылған нысандарды алу сәттілігі 77%-ды құрады. Бұл көрсеткіш қолданыстағы аналогтардан айтарлықтай жоғары және іздеу процесін оңтайландырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйенің тиімділігі бейнедегі нысандарды бақылау дәлдігі мен RGB-D камерасынан алынған тереңдік деректерінің сапасына байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Адамдармен өзара әрекеттесетін роботтар өткен оқиғаларға негізделген сұраныстарды орындай алуы тиіс. Көбінесе пайдаланушы нысанды оның аты немесе сыртқы түрі бойынша емес, өткен әрекеттегі рөлі бойынша анықтайды. Сонымен қатар, пәрмен берілген сәтте нысан көзден таса болуы мүмкін. Авторлар оқиғаға негізделген (event-referential) zero-shot роботтық ұстау жүйесі — BeyondCSe-ді ұсынады. Жүйе оқиғалар тарихы мен ағымдағы көріністі талдап, нысанды ұстау үшін локализациялайды. Егер нысан жасырылған болса, жүйе оқиға туралы априорлық мәліметтерді ағымдағы көріністің геометриясымен біріктіріп, нысанды анықтауға мүмкіндік беретін оңтайлы камера нүктелерін таңдайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BeyondCSe жүйесі көрінетін нысандар үшін 76% және жасырылған нысандар үшін 77% табыс көрсеткішіне жетеді, бұл ең үздік базалық әдістерден әлдеқайда жоғары.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе қосымша арнайы оқытусыз алдын ала үйретілген модельдерді пайдаланады. Білекке орнатылған бір RGB-D камерасы бар нақты робот тәжірибелерінде BeyondCSe көрінетін нысандар үшін 76% және жасырылған нысандар үшін 77% табысқа жетті (ең күшті базалық әдістер сәйкесінше 40% және 55% көрсеткен). Қатты жасырылған нысандары бар төрт қосымша көріністе жүйе табыстылықты 75%-дан 95%-ға дейін арттырды және орташа қарау нүктелерінің санын 3,35-тен 2,20-ға дейін қысқартты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Zero-shot оқыту — жүйенің арнайы дайындықсыз жаңа тапсырмаларды орындай алу қабілеті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нақты жұмыс орындарының тарихы болады: роботқа тапсырма берілгенге дейін нысандар орнынан қозғалуы немесе қолданылуы мүмкін. «Мен жаңа ғана қолданған затты ал» сияқты нұсқаулар роботтан оқиғалар тізбегін түсінуді талап етеді. Тіл арқылы басқарылатын дәстүрлі манипуляция әдістері әдетте ағымдағы кадрдағы визуалды атрибуттарға сүйенеді, бұл өткен оқиғадағы рөлге негізделген тапсырмаларды орындауда тиімсіз.&lt;/p&gt;\n&lt;p&gt;Заманауи ұстау жүйелері нысан камера көрінісінен тыс қалғанда оны дәл анықтау мәселесіне жиі тап болады. VoLo сияқты қолданыстағы тәсілдер нысанды сәйкестендіре алады, бірақ ол басқа заттардың артында жасырылған болса, ұстауды орындай алмайды. BeyondCSe жүйесі бұл олқылықты оқиғалар тарихын пайдалану арқылы нысанды табу және камера үшін оңтайлы көру нүктесін таңдау арқылы шешеді. Тек ағымдағы көрініс геометриясына сүйенетін әдістерден айырмашылығы, BeyondCSe нысанның өткен қозғалыстарын талдап, оның қайда кеткенін болжайды. Жүйе көру нүктелерін бағалау кезінде бақыланбаған кеңістіктерді ескермейді, бұл камера қозғалысын тиімдірек жоспарлауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;BeyondCSe жүйесі оқиғалар тарихы мен белсенді қабылдауды біріктіріп, роботқа жасырын нысандарды арнайы оқытусыз табуға және ұстауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе «zero-shot» (алдын ала оқытусыз) қағидасы бойынша жұмыс істейді. Алдымен мультимодальды тілдік модель (MLLM) және нүктелік трекер мәтіндік нұсқаулықты оқиғалар тарихындағы нысанмен байланыстырады. Егер нысан ағымдағы кадрда табылса, координаттар ұстау жүйесіне беріледі. Әйтпесе, белсенді қабылдау модулі іске қосылады: өткен деректер мен ағымдағы көрініс геометриясы негізінде нысанның ықтимал көлемдік моделі (volumetric target belief) жасалады. Камера әрбір қозғалыстан кейін өз түсінігін жаңартып отырады, нысан табылғанша немесе сенсорлық бюджет таусылғанша.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Белсенді қабылдау — бұл роботтың жасырын нысан туралы барынша ақпарат алу үшін камераны өз бетінше бағыттау процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тіл арқылы басқарылатын ұстау жүйелері (LERF-TOGO, GraspMolmo) негізінен 3D көріністерге немесе бір кескін бойынша ұстау нүктелерін болжауға бағытталған. Алайда, олар ағымдағы көру аймағымен шектеледі. BeyondCSe болса эпизодтық жад пен оқиғалар тізбегін пайдаланады. Қолданыстағы манипуляциялық модельдерден (мысалы, MemoryVLA) айырмашылығы, жүйе арнайы тапсырмалар үшін оқытуды қажет етпейтін дайын модельдерді қолданады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйенің тиімділігі оқиғалар тарихындағы нүктелерді қадағалау дәлдігіне тікелей байланысты; егер нысан бастапқы кезеңде жоғалып кетсе, іздеу дәлдігі төмендейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе мақсат сипаттамасы мен кеңістіктік бақылаулар арқылы байланысқан екі модульден тұрады (2-сурет). Егер бейне талдауы (III-C бөлімі) бастапқы кадрдан 3D координаттарды анықтауға мүмкіндік берсе, жүйе бірден ұстап алуды тексеруге көшеді. Әйтпесе, жинақталған тарихи деректер белсенді қабылдау (III-D бөлімі) үшін қолданылады. Жүйе қосымша оқытусыз дайын MLLM және нүктелік трекерлерді пайдаланады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе бастапқы 3D деректердің сапасына қарай бірден ұстап алу немесе мақсатты белсенді іздеу әдісін автоматты түрде таңдайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Процесс төрт кезеңнен тұрады (3A-сурет): RECORD оқиғалар тізбегін E=(e₁, . . . , e_N) қалыптастырады. SELECT нұсқаулық пен жазбаны талдап, мақсат сипаттамасын және оны ерекшелейтін белгілерді (cue) жасайды. LOCATE бастапқы I₀ кескінінде іздеу аймағын ұсынады, ал POINT әрекет нүктесін қайтарады. Егер қиылған кескіндер (crop) нәтиже бермесе, іздеу аймағы толық кескінге дейін кеңейтіледі. Алынған нүкте тереңдік картасы мен камера позициясы арқылы 3D кеңістікке ауыстырылады.&lt;/p&gt;\n&lt;p&gt;Егер бастапқы кескінде мақсат табылмаса, жүйе өткен кадрларды талдайды және P=(q₁, . . . , q_m) (1-теңдеу) 3D координаттарын анықтайды, бұл мақсат туралы бастапқы түсінікті қалыптастырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Grounding» әдісі жүйеге мәтіндік нұсқаулықтың қай нысанға қатысты екенін, тіпті ол ішінара жабық болса да, түсінуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бастапқы M₀ картасы RGB-D деректерінен TSDF ретінде құрылады. Мақсаттың ықтималдық үлестірімі b_t(x) (2-5 теңдеулер) арқылы іске қосылады. (5)-формуладағы ε параметрі бүкіл жұмыс аймағында &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; нөлге тең емес ықтималдықты қамтамасыз етеді, бұл тарихи бағалаулар қате болған жағдайда жүйені қалпына келтіруге көмектеседі.&lt;/p&gt;\n&lt;p&gt;Жаңа көріністерді іздеу үшін жүйе &lt;span class=\"yfm-latex\" data-content=\"%5CXi_t\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; үміткерлер жиынын жасайды және оларды соқтығысуға тексереді. Әрбір &lt;span class=\"yfm-latex\" data-content=\"%5Cxi\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; үміткер үшін бақылау ықтималдығы &lt;span class=\"yfm-latex\" data-content=\"L%5E-_t(x%3B%20%5Cxi)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; және көріну сенімділігі &lt;span class=\"yfm-latex\" data-content=\"T_t(x%3B%20%5Cxi)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (6-теңдеу) бағаланады. Оңтайлы көрініс &lt;span class=\"yfm-latex\" data-content=\"%5Cxi%5E*_t\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (7-8 теңдеулер) функциясын максималдау арқылы таңдалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдістің тиімділігі тереңдік деректерінің дәлдігіне және нақты уақытта TSDF картасын құру мүмкіндігіне байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қозғалыс орындалғаннан кейін жүйе негізгі кадрды тіркеп, тереңдік деректерін Mt+1 картасына біріктіреді және (9)-теңдеу бойынша нысананың ықтималдығын қайта есептейді. Ықтималдық моделі тереңдіктің сәйкестігі Ldep,t+1(x) пен нысананы өткізіп алу ықтималдығын Lmiss,t+1(x) біріктіреді. Егер нысана табылмаса, жүйе аймақты толығымен алып тастамайды, тек оның салмағын төмендетеді. Іздеу процесі жоғары ықтималдық p^* табылғанша немесе белсенді шолу бюджеті таусылғанша жалғасады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе іздеуді нақтылау үшін теріс бақылауларды пайдаланады және әлеуетті аймақтарды алдын ала жоққа шығармайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;p^* расталғаннан кейін жүйе ұстап алу (grasp) үшін үміткерлерді генерациялайды. Нысана геометриясы толық болмаған жағдайда, робот қосымша орталықтандырылған сканерлеуді орындайды. Алдын ала белгіленген іздеу аймақтарынан айырмашылығы, мұнда іздеу аймағы тек оқиғаға негізделген талдаудан кейін анықталады.&lt;/p&gt;\n&lt;p&gt;Эксперименттер ROBOTIS OMY-F3M роботы мен Intel RealSense D435i камерасының көмегімен жүргізілді. Есептеулер NVIDIA GeForce RTX 4090 GPU базасында орындалды. Деректер жиынтығы 150 сынақты қамтиды: 50-і көрінетін және 100-і жасырын (окклюзия) жағдайлар үшін. Сахналар күнделікті заттардан тұрады. Нұсқаулар оқиғалардың уақытша реттілігіне негізделген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Окклюзия — нысаналы объект басқа заттармен жабылып қалған немесе камераның көру аймағынан тыс болған жағдай.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нұсқауларды өңдеу үшін Qwen3-VL-8B моделі қолданылады. Бейне тарихынан 96 кадр алынады. Жүйе параметрлері: &lt;span class=\"yfm-latex\" data-content=\"%5Crho%3D2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, δ₀=0.05 м, ε=0.1, κ=0.33. Камера 0.10 м жылжығанда немесе 15^° бұрылғанда жаңа кадр қосылады. I-кестеде әдістің сәттілігі (76.7% және 50.0%) көрсетілген. II-кестеде күшті окклюзия жағдайында жүйенің 95%-ға дейінгі сәттілікке қол жеткізетіні жазылған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер шектеулі объектілер жиынтығымен зертханалық жағдайда алынған, бұл нақты үй ортасынан өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз виртуалды көріністерден алынған AnyGrasp үміткерлерін пайдаланамыз, оларды біріктіреміз және дубликат позаларды жою үшін максималды емес басу (non-maximum suppression) әдісін қолданамыз. Тиімділікті бағалау үшін 3D-локализация, жоспарлау және ұстап алу бойынша барлық әрекеттерден сәтті өткендерін тіркейміз. Локализация, егер болжанған 3D-нүкте робот базасындағы адам белгілеген 3D-шекара (bounding box) ішіне түссе, сәтті деп саналады. Жоспарлау нысаналы объектіні ұстап алудың жарамды жоспары табылғанда, ал ұстап алу робот объектіні физикалық түрде қолға түсіргенде сәтті болады. Бұл кезеңдер тізбекті: локализация жоспарлауға, ал жоспар ұстап алуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Максималды емес басу (Non-maximum suppression) — бұл бір объект үшін бірнеше болжамды өшіріп, тек ең сенімді нұсқаны қалдыратын алгоритм.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз өз әдісімізді LERF-TOGO, GraspSplats, Point2Act және GraspMolmo-мен салыстырдық. LERF-TOGO мен Point2Act RGB деректерімен жұмыс істейді, қалғандары RGB-D қолданады. Көп ракурсты базалық модельдер сахна бойынша 30 алдын ала белгіленген бақылауды алады. GraspMolmo тек бастапқы көріністі пайдаланады және объект жасырылған болса, бағаланбайды (6-суретте N/A деп белгіленген). Біздің әдіс бірдей бастапқы күйден басталып, қажет болған жағдайда қосымша ракурстарды таңдайды.&lt;/p&gt;\n&lt;p&gt;6-суретте көрінетін және жасырылған объектілер үшін өнімділік салыстырылған, ал I-кестеде 150 сынақ бойынша жалпы сәттілік көрсетілген. Бастапқы нұсқаулармен MLLM негізіндегі модельдер (Point2Act және GraspMolmo) көрінетін нысаналарды локализациялауда LERF-TOGO мен GraspSplats-тен жоғары нәтиже көрсетеді. Логикалық (reasoned) нұсқауларды қосу барлық модельдердің көрсеткіштерін жақсартады.&lt;/p&gt;\n&lt;p&gt;Біздің әдіс 50 көрінетін нысананың 43-ін және 100 жасырылған нысананың 88-ін локализациялады, бұл ең мықты аналогтардан сәйкесінше 32 және 20 пайыздық тармаққа жоғары. LOCATE функциясы іздеу аймағын шектеп, ұсақ бөлшектерді таңдаудағы түсініксіздікті азайтады (3B-сурет). Ұстап алу сәттілігі көрінетін нысаналар үшін 38/50 және жасырылғандар үшін 77/100 құрады, ал ең үздік базалық модельдер сәйкесінше 20/50 және 55/100-ге жетті. 150 сынақ бойынша біздің әдіс 76,7% сәттілікке қол жеткізді, ал ең мықты бәсекелесте бұл көрсеткіш 50,0% болды (I-кесте).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Біздің әдіс белсенді ракурсты іздеу мен нысана геометриясын нақтылау комбинациясы арқылы 76,7% сәттілікке қол жеткізіп, ең үздік аналогтарды 26,7 пайыздық тармаққа артта қалдырды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар өз әдістерін Breyer және басқалары ұсынған, нысаналы объектіні іздеуге бағытталған белсенді көру әдісімен салыстырды. Базалық деңгей ретінде объектінің нақты 3D шекаралары (ground-truth) берілген әдіс таңдалды, бұл ретте AnyGrasp генераторы мен ортақ жоспарлау жүйесі қолданылды. Төрт сахнада (S1–S4) жүргізілген тәжірибелерде авторлардың әдісі 95% сәтті қамтуды (орташа 2,20 ракурс) көрсетті, ал Breyer және басқаларының әдісі 75% сәттілікке (3,35 ракурс) қол жеткізді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оқиғалар тарихы мен ықтималдық салмақтарын пайдалану жүйеге қажетті ракурстар санын базалық әдіске қарағанда 34%-ға қысқартуға және сәттілікті 20%-ға арттыруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Абляция (компоненттерді алып тастау) талдауы әр бөліктің маңыздылығын көрсетті: ықтималдық салмақтарынсыз сәттілік 80%-ға дейін түсті және ракурстар саны 4,65-ке дейін өсті, өйткені жүйе ықтималдығы төмен аймақтарға ресурстар жұмсады. Өткізгіштік коэффициентін (transmittance) есепке алмау ракурстар санын 3,10-ға дейін өсірді. Оқиғалар бойынша априорлық деректерсіз (event prior) сәттілік деңгейі сақталды, бірақ ракурстар саны 4,00-ге дейін көтерілді, бұл тарихи деректердің тиімділігін растайды.&lt;/p&gt;\n&lt;p&gt;Жүйе EgoDex және EPIC-KITCHENS деректер жинақтарындағы бейнелер арқылы сыналды. Параметрлерді қайта баптаусыз, модель әрекеттер контекстінде аталған объектілерді сәтті анықтады. Камера ракурсы күрт өзгерген күрделі сахналарда жүйе іздеу аймағын нақтылау қабілетін көрсетті, дегенмен соңғы кадрдағы координаттарды бағалау дәлдігі кейде шектеулі болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс іздеу процесінде нысаналы объект қозғалмай қалады деп болжайды; динамикалық объектілермен жұмыс істеу болашақ зерттеулердің тақырыбы болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BeyondCSe жүйесі роботқа өзара әрекеттесу тарихына негізделген сұраныстарды түсіндіруге және объектілер ішінара жабық болса да оларды ұстауға мүмкіндік береді. Оқиғалар контексті мен сахна геометриясының интеграциясы іздеу тиімділігін және манипуляциялардың сенімділігін дәстүрлі белсенді қабылдау әдістеріне қарағанда айтарлықтай арттырады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f1.jpg\" alt=\"1-сурет: Оқиғаға негізделген ұстау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: Оқиғаға негізделген ұстау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: Оқиғаға негізделген ұстау. (A) VoLo, VLM оркестраторы, нұсқаулықтың нысанасын дұрыс анықтайды және оның мәтіндік сипаттамасын VLA (π0.5) немесе WAM (Cosmos3-Nano-Policy) жүйесіне жібереді. Дегенмен, екі модель де жасырылған нысананы таба алмайды және ұстай алмайды. (B) Біздің жүйе өткен бақылаулар негізінде кеңістіктік түсінікті іске қосады, нысананы ашатын көру нүктесін белсенді түрде таңдайды және оны сәтті ұстайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f2.jpg\" alt=\"2-сурет: BeyondCSe шолуы. Оқиғаға негізделген нұсқаулық пен жазылған бейне берілгенде, бейне талдауы нысананы анықтайды \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: BeyondCSe шолуы. Оқиғаға негізделген нұсқаулық пен жазылған бейне берілгенде, бейне талдауы нысананы анықтайды және орналастырады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: BeyondCSe шолуы. Оқиғаға негізделген нұсқаулық пен жазылған бейне берілгенде, бейне талдауы нысананы анықтайды және орналастырады. Бейнеден қалпына келтірілген тарихи 3D нысана бақылаулары P деп белгіленеді. Егер нысана жасырылған болса, оқиғаға байланысты белсенді қабылдау алдыңғы бақылаулар мен ағымдағы геометрия негізінде көлемді түсінікті қалыптастырады, содан кейін нысана ұсталғанша немесе іздеу аяқталғанша көрінуге негізделген нүктелерді таңдайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f3.jpg\" alt=\"Сурет 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 3&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f4.jpg\" alt=\"4-сурет: Оқиғаға байланысты белсенді қабылдау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Оқиғаға байланысты белсенді қабылдау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: Оқиғаға байланысты белсенді қабылдау. Оқиғалар ізі және бастапқы RGB-D бақылауы нысана түсінігі мен картаны іске қосады. Түсінікке негізделген көрініс іздеуі физикалық көріністерді алады, олардың әрқайсысы екеуін де тұйық циклде жаңартатын ағымдағы бақылауды береді. Нысана расталғаннан кейін, ұстауды тексеру тек бақыланатын геометрия жеткіліксіз болғанда ғана басқа көріністі сұрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f5.jpg\" alt=\"5-сурет: Оқиғаға негізделген нұсқаулықтар мысалдары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Оқиғаға негізделген нұсқаулықтар мысалдары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: Оқиғаға негізделген нұсқаулықтар мысалдары. Әр жолда оқиғалар тарихы бейнесінен алынған кадрлар, роботтың орындауы үшін бастапқы бақылау және жазудан кейін берілген нұсқаулық көрсетілген. Бейненің соңғы кадры бастапқы бақылау ретінде қызмет етеді. (A) Сұралған шыныаяқ тұтқасы көрінеді, бірақ алмұртты жауып тұрған шыныаяқты анықтау үшін оқиғалар тарихы қажет. (B) Текше бірінші болып жылжытылады және бастапқы бақылауда қабырғамен жасырылған.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f6.jpg\" alt=\"6-сурет: Нақты жағдайда ұстау өнімділігі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Нақты жағдайда ұстау өнімділігі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет: Нақты жағдайда ұстау өнімділігі. Нысаналар бастапқы білек камерасының көрінісінде көрінеді немесе жасырылған, әр әдіс үшін сәйкесінше 50 және 100 сынақ өткізілген. Негізделген нұсқаулықтар — бұл Qwen3-VL-8B арқылы бейне тарихы мен бастапқы нұсқаулықтан жасалған орналасу сұраулары, олар барлық базалық модельдер үшін ортақ және өздерінің жергілікті орналасу негіздерін сақтайды. LERF*, P2A, GS және GM сәйкесінше LERF-TOGO, Point2Act, GraspSplats және GraspMolmo-ны білдіреді. P2A† RGB-D реконструкциясын пайдаланады. Түсті сегменттер сәтті ұстауларды немесе бірінші сәтсіз кезеңді көрсетеді. Біздің жүйе барлық нұсқаулық шарттары үшін ортақ толық жүйе эталоны ретінде қайталанады. N/A бағаланбаған шартты білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f8.jpg\" alt=\"Сурет 8\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 8&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-f8-2.jpg\" alt=\"Сурет 8 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 8 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Робот затты&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;көре алмайды&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Бейне тарихы&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және белсенді&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;іздеу&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Жасырылған&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нысананы сәтті&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алу&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Роботтар&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;динамикалық&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ортада жұмыс&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;істеуді үйрену&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Hyunjoon Lee, Haebeom Jung, Eunsung Cha, Daeun Lee, Yu-Chiang Frank Wang, Jaesung Choe, Jaesik Park&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/abs/2609.39375v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/pdf/2609.39375v1\" target=\"_blank\" rel=\"noreferre
