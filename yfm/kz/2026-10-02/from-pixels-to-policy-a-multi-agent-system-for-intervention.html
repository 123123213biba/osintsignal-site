        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"202\" cy=\"66\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"558\" cy=\"286\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OSM_GIS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Қалалық ортаны жобалау:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейрожелілер көмегімен&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өзгерістер енгізу&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f2.jpg\" alt=\"2-сурет: VIDA-GEO конвейеріне шолу. Кескін және қалалық ортаны жақсарту бойынша мақсатты нұсқаулық болған кезде, агентте\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: VIDA-GEO конвейеріне шолу. Кескін және қалалық ортаны жақсарту бойынша мақсатты нұсқаулық болған кезде, агенттер тобы қызығушылық аймақтарын (ROI) анықтайды, сегменттейді және тапсырмаға тән шектеулермен өңдеп, араласу нұсқаларын жасайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: VIDA-GEO конвейеріне шолу. Кескін және қалалық ортаны жақсарту бойынша мақсатты нұсқаулық болған кезде, агенттер тобы қызығушылық аймақтарын (ROI) анықтайды, сегменттейді және тапсырмаға тән шектеулермен өңдеп, араласу нұсқаларын жасайды. Сапаны тексеру реализм мен саясаттың сақталуын бағалайды. Үміткерлер соңында «қара жәшік» индикаторы арқылы бағаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Зерттеушілер спутниктік және көше суреттері арқылы қалалық инфрақұрылымды жақсарту жолдарын ұсынатын VIDA-GEO жүйесін таныстырды. Бұл жай ғана объектілерді тану емес, нақты визуалды өзгерістерді жобалау құралы. Жүйе генеративті модельдер мен қала құрылысы ережелерін біріктіріп, «жасырын цифрлық егіз» ретінде жұмыс істейді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Қалалық ортаны өңдеуге арналған көп агентті архитектура.&lt;/li&gt;\n&lt;li&gt;Қымбат симуляцияларды алмастыратын жасырын цифрлық егіз.&lt;/li&gt;\n&lt;li&gt;Қауіпсіздік пен көгалдандыру сияқты 8 метрика бойынша бағалау.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;VIDA-GEO кескіндерді сегментациялау, диффузиялық инпейнтинг (кескінді толықтыру) және қалалық көрсеткіштерді бағалау модельдерін біріктіретін көп агентті жүйе. Жүйе міндетті кезеңдерге бөледі: жоспарлаушы қызығушылық аймақтарын анықтайды, саясат агенті шектеулерді белгілейді, ал генеративті модуль реализмді сақтай отырып өзгерістер енгізеді.&lt;/p&gt;\n&lt;p&gt;Әдіс әрбір өзгерістің нәтижесін қала құрылысы нормаларына сәйкестігі бойынша бағалайтын кері байланыс цикліне негізделген. Жүйе қауіпсіздік пен көгалдандыруды қоса алғанда, 8 көрсеткіш бойынша сыналды. Зерттеу көрсеткендей, бұл тәсіл визуалды сапа мен шешімдердің негізділігі бойынша қолданыстағы аналогтардан асып түседі және саяси сәйкестік көрсеткіштерін екі есеге дейін арттырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе бастапқы деректердің сапасына тәуелді және инженерлік тексеруді қажет ететін ұсыныстар бере алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қалалық орта денсаулық, қауіпсіздік және өмір сүру сапасына ұзақ мерзімді әсер ететін жобалық шешімдер негізінде қалыптасады. Алайда, ұсынылған қала құрылысы өзгерістерінің тиімділігін бағалау көп уақыт пен қаражатты талап етеді, бұл оны іс жүзінде қолдануды қиындатады. Қазіргі геокеңістіктік компьютерлік көру әдістері негізінен аэрофотосуреттер мен көше көріністерін талдау арқылы қалалық көрсеткіштерді бақылауға бағытталған, бірақ олар араласуды ұсынбайды және олардың әсерін болжамайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO — бұл қала құрылысы шешімдерін автоматтандырылған түрде іздеу және сынау үшін генеративті модельдерді «цифрлық егіз» ретінде пайдаланатын көп агентті жүйе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз көрсеткіштерді бағалайтын модельді кескіндерді өңдеудің генеративті моделімен біріктіруді ұсынамыз. Бұл байланыс қалалық өзгерістер бойынша гипотезаларды виртуалды ортада тексеруге мүмкіндік беретін жасырын цифрлық егіз қызметін атқарады.&lt;/p&gt;\n&lt;p&gt;VIDA-GEO жүйесі үш негізгі компонентті үйлестіреді: сегментация алгоритмдері, кескінді толтыруға (inpainting) арналған диффузиялық модельдер және мақсатты көрсеткіштерді бағалау модельдері. Бұл кешен шынайы және қала құрылысы ережелеріне сәйкес келетін өзгерістерді жасауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Диффузиялық модель — бұл кездейсоқ деректерден «шуды» кезең-кезеңімен алып тастау арқылы кескін жасайтын нейрондық желі түрі, ол жоғары дәлдік пен шынайылыққа қол жеткізуге көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз жүйені 8 түрлі көрсеткіш бойынша сынақтан өткіздік, аэрофотосуреттер мен көше көріністерін пайдалана отырып, көгалдандыру деңгейі мен қауіпсіздік сезімі сияқты параметрлерді бағаладық. Нәтижелер көрсеткендей, біздің тәсіліміз қолданыстағы аналогтардан озық, визуалды сапа және саясатқа сәйкестік көрсеткіштері бойынша 2 есеге дейін жоғары нәтиже береді. Жүйе пайдаланушыға бірнеше нұсқаны ұсынады, бұл оны қала құрылысы сарапшыларының жұмыс процесіне интеграциялауға мүмкіндік береді. Жобаның кодын https://github.com/HosamGen/VIDA-GEO мекенжайынан алуға болады.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Визуалды геокеңістіктік деректер қалалық орта мен климаттық өзгерістерді мониторингтеуде белсенді қолданылады. Жерсеріктік суреттер жол қауіпсіздігін, көгалдандыру деңгейін, ауаның ластануын және жылу әсерін бағалауға мүмкіндік береді. Сонымен қатар, көше көріністері мен бақылау камераларының деректері жаяу жүргіншілерге арналған қолайлылық пен қауіпсіздікті талдау үшін қолданылады. Қазіргі компьютерлік көру модельдері тануда жоғары дәлдікке ие болғанымен, олар тек мониторингпен шектеледі, яғни көрсеткіштерді жақсарту үшін қандай шаралар қолдану керектігін көрсетпейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторлар «жасырын цифрлық егіз» (IDT) концепциясын ұсынады, ол тану модельдері мен генеративті әдістерді біріктіріп, реалистік араласу сценарийлерін жасайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дәстүрлі «цифрлық егіздерді» жасау қымбат деректер жинауды және ұзақ модельдеуді талап етеді. Балама ретінде VIDA-GEO (Visual Intervention and Decision-support Agent for Geospatial data) жүйесі ұсынылды. Ол мониторинг модельдері мен кескінді өңдеудің генеративті модельдерін біріктіреді. Жүйе көп агентті орта ретінде жұмыс істейді: жоспарлаушы қызығушылық аймақтарын (ROI) бөледі, саясат агенті нақты қалалық нормаларға негізделген өзгерістерді ұсынады, сегменттеу агенті маскалар жасайды және генеративті агент визуалды өңдеуді жүзеге асырады (1-суретті қараңыз).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жасырын цифрлық егіз (IDT) — бұл толық 3D реконструкцияның орнына қолданыстағы суреттерді өзгерту үшін генеративті нейрондық желілерді қолданатын тәсіл.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдістің тиімділігі генеративті модельдердің өзгерістерді физикалық тұрғыдан сенімді сақтап қалу қабілетіне байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе өзгерістерді «қара жәшік» көрсеткіштері бойынша да, олардың логикалық негізділігі бойынша да бағалайды. Авторлар жерсеріктік және көше суреттерін қамтитын 8 тапсырма үшін жаңа бенчмарк ұсынды. Жұмыстың негізгі үлесі мониторингтен саясатқа негізделген шешім қабылдауға көшу болып табылады.&lt;/p&gt;\n&lt;h4 id=\"khatysty-zhumystar\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#khatysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ҚАТЫСТЫ ЖҰМЫСТАР&lt;/span&gt;&lt;/a&gt;ҚАТЫСТЫ ЖҰМЫСТАР&lt;/h4&gt;\n&lt;p&gt;Қалалық көрсеткіштерді бағалау. Әуеден түсірілген суреттер қауіпсіздік пен мобильділік көрсеткіштерін, соның ішінде жол-көлік оқиғаларының қаупін және жаяу жүргіншілер желісін талдау үшін қолданылады. Сегментация әдістері көгалдандыру деңгейін өлшеу үшін де пайдаланылады. Көше көріністері (street-view) қалалық ортаның қауіпсіздігі мен жандылығы сияқты сапалық сипаттамаларын зерттеуде кеңінен қолданылады, ал соңғы зерттеулерде адам қабылдауын модельдеу және мультимодальды LLM негізіндегі бағалау үшін қолданылуда. Қолданыстағы модельдерден айырмашылығы, біз оларды тек талдау үшін емес, белгілі бір орындағы көрсеткіштерді жақсартуға бағытталған визуалды араласуларды басқару үшін қолданамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO модельдерді тек талдау құралы ретінде емес, қалалық ортаны жақсарту бойынша нақты іс-қимылдарды жобалау үшін пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шешім қабылдау және араласулар. Цифрлық егіздер (digital twins) негізделген шешімдер қабылдау үшін қалалық деректер мен симуляцияларды біріктіреді, алайда мұндай жүйелер көбінесе тар салалық сипатқа ие және қымбатқа түседі. Алдыңғы зерттеулер модель болжамына кіріс деректерінің әсерін түсіну үшін контрфактуалды модельдерді, ал «қара жәшік» модельдерін түсіндіру үшін диффузиялық модельдерді қолданды. Біздің мақсатымыз — бұл әдістерді талдау құралынан нақты әлемдегі өзгерістер құралына айналдыру.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контрфактуалды модельдеу — жүйеге енгізілген өзгерістер нәтижеге қалай әсер ететінін анықтау үшін «егер былай болса, не болады?» деген сұраққа жауап іздеу әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Араласу және интерпретация үшін агенттер. Қашықтықтан зондтау бойынша VLM модельдері нұсқаулықтарды орындайтын жүйелерді әуеден түсірілген суреттермен жұмыс істеуге бейімдейді. Басқа зерттеулер агенттердің модель қателерін анықтауда немесе көше көрінісіндегі өзгерістерді симуляциялауда қалай көмектесетінін көрсетеді. VIDA-GEO болса, қалалық араласуды мультимодальды шешім қабылдау мәселесі ретінде қарастырады. Ұсынылатын іс-қимылдар тек мақсатты көрсеткіштер үшін ғана емес, сонымен қатар физикалық шынайылық пен қалалық саясат аясында жүзеге асырылу мүмкіндігі тұрғысынан да оңтайландырылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO ұсыныстары тек визуалды өзгерістер емес, физикалық және саяси тұрғыдан орындалуы мүмкін жобалар болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;p&gt;Бұл бөлімде жүйені іске асыру егжей-тегжейлері, эталондық тесттер және мультиагенттік жүйеміздің қалалық ортаға шынайы әрі негізделген араласуларды жүзеге асырудағы тиімділігін растайтын салыстырмалы талдау қарастырылады.&lt;/p&gt;\n&lt;h4 id=\"benchmark\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#benchmark\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бенчмарк&lt;/span&gt;&lt;/a&gt;Бенчмарк&lt;/h4&gt;\n&lt;p&gt;Кешенді бағалау үшін деректердің екі түрі қолданылады: MapBox-тан алынған жоғары ажыратымдылықтағы аэрофотосуреттер және Google Street View панорамалары. Көрсеткіштерді болжау үшін «қара жәшік» (black-box) модельдері қолданылады. Аэрофотосуреттер үшін Beta Risk (ЖКО қаупін болжау) және OpenEarthMap (көгалдандыруды талдау) модельдері таңдалды. Street View үшін MIT Place Pulse 2.0 базасында алдын ала оқытылған Global Streetscapes модельдері қолданылып, олар қауіпсіздік, жандылық, сұлулық, байлық, сондай-ақ «зеріктіру» және «депрессиялық» деңгейлерін 0–100 шкаласы бойынша бағалайды. Әрбір 8 индикатор үшін 100 суреттен таңдап алынады, бұл ретте бастапқы балы 90-нан жоғары суреттер алынып тасталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе 8 индикатор бойынша бағалау жүргізеді және әрбір деректер түрі үшін 100-ден әртүрлі суретті таңдап алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghalau-metrikalary\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#baghalau-metrikalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау метрикалары&lt;/span&gt;&lt;/a&gt;Бағалау метрикалары&lt;/h4&gt;\n&lt;p&gt;Араласулардың тиімділігі екі ось бойынша бағаланады: перцептивті сапа (визуалды шынайылық) және саясатқа сәйкестік (тәжірибелік қолданылуы). Өзгерістердің нақты деректердің таралу шеңберінен шықпауын тексеру үшін Махаланобис қашықтығына негізделген прокси-метрика қолданылады.&lt;/p&gt;\n&lt;h4 id=\"llm-toereshiler-arkhyly-baghalau\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#llm-toereshiler-arkhyly-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM-төрешілер арқылы бағалау&lt;/span&gt;&lt;/a&gt;LLM-төрешілер арқылы бағалау&lt;/h4&gt;\n&lt;p&gt;Масштабты бағалау GPT 5.2 және Qwen 3VL модельдері арқылы жүзеге асырылады. Суреттер 1–100 шкаласы бойынша үш критерий бойынша бағаланады: визуалды сапа, реализм (физикалық және семантикалық сенімділік) және саясатты сақтау (сахна функциясы мен құрылымына сәйкестік). Сарапшылар (7 магистрант және 5 қала құрылысы маманы) тарапынан өткізілген қосымша тексеру LLM бағаларымен жоғары корреляцияны көрсетті, бұл LLM-ді адам бағасына сенімді балама ретінде пайдалануға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-төреші — бұл сурет сапасын белгіленген критерийлер бойынша автоматтандырылған бағалау үшін қуатты тілдік модельдерді қолдану әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bazalykh-modelder\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#bazalykh-modelder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базалық модельдер&lt;/span&gt;&lt;/a&gt;Базалық модельдер&lt;/h4&gt;\n&lt;p&gt;Салыстырмалы талдау URSimulator, DIFFusion, LANCE және NanoBanana 2.5 (zero-shot режимі) модельдерімен жүргізілді. Барлық модельдер генеративті функцияларға бірдей мөлшердегі сұраныстармен шектелген.&lt;/p&gt;\n&lt;h4 id=\"naetizheler-zhaene-talkhylau\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#naetizheler-zhaene-talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер және талқылау&lt;/span&gt;&lt;/a&gt;Нәтижелер және талқылау&lt;/h4&gt;\n&lt;p&gt;VIDA-GEO екі бағалау осі бойынша да ең жоғары көрсеткіштерді тіркеді. 1-кестеде көрсетілгендей, жүйе 8 тапсырманың 7-еуінде бәсекелестерден озып, араласулардың шынайылығын сақтай отырып, көрсеткіштерді жүйелі түрде жақсартады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Салыстыру генеративті модельдерге жасалған сұраныстар санымен шектелген, бұл ресурстар шексіз болған жағдайда әдістердің толық әлеуетін көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhol-khauiptiligi-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#zhol-khauiptiligi-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жол қауіптілігі VIDA-GEO&lt;/span&gt;&lt;/a&gt;Жол қауіптілігі VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;Жол қауіпсіздігін бағалау (Road Risk) санатында VIDA-GEO моделі 82.1 көрсеткішімен жоғары дәлдікті көрсетіп, бәсекелестерінен айтарлықтай озып кетті. LANCE әдісі 68.7, DIFFusion 13.3, ал NB2.5 (ZS) 81.6 нәтижесін көрсетті. Бұл деректер модельдің қалалық ортадағы қауіпті учаскелерді анықтауда тиімді екенін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO жол қауіптеріне қатысты бағалауда 82.1 көрсеткішімен көш бастап тұр.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khauipsizdik-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#khauipsizdik-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қауіпсіздік VIDA-GEO&lt;/span&gt;&lt;/a&gt;Қауіпсіздік VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;Қауіпсіздікті (Safety) бағалауда VIDA-GEO 20.9 нәтижесін көрсетті, бұл LANCE (33.8), DIFFusion (50.5), URSimulator (33.0) және NB2.5 (ZS) (41.3) әдістерінен төменірек. VIDA-GEO-ның бұл сегменттегі төмен көрсеткіші оқыту деректер жиынындағы қауіпсіздік белгілерін интерпретациялау ерекшеліктеріне байланысты болуы мүмкін.&lt;/p&gt;\n&lt;h4 id=\"zhandy-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#zhandy-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жанды VIDA-GEO&lt;/span&gt;&lt;/a&gt;Жанды VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;«Жандылықты» (Lively) бағалауда VIDA-GEO 25.1 балл жинады. Басқа әдістер мынадай нәтиже берді: LANCE — 23.0, DIFFusion — 39.5, URSimulator — 29.6, NB2.5 (ZS) — 52.0. Мұнда VIDA-GEO LANCE-пен салыстырмалы нәтиже көрсетті, бірақ ортаның динамикалық сипаттамаларын анықтауда NB2.5 (ZS) әдісінен қалып қойды.&lt;/p&gt;\n&lt;h4 id=\"aedemi-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#aedemi-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдемі VIDA-GEO&lt;/span&gt;&lt;/a&gt;Әдемі VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;Эстетикалық тартымдылықты (Beautiful) бағалауда VIDA-GEO 26.1 нәтижесін тіркеді. Бәсекелес модельдер: LANCE — 42.1, DIFFusion — 53.0, URSimulator — 32.8, NB2.5 (ZS) — 43.7. DIFFusion әдісі бұл санатта көш бастап тұр, бұл оның визуалды эстетиканы талдаудағы тиімділігін айқындайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстетикалық бағалау (Beautiful) — бұл визуалды деректер негізінде қалалық ортаның тартымдылығын субъективті қабылдауды анықтайтын метрика.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vida-geo-arkhyly\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#vida-geo-arkhyly\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VIDA-GEO арқылы&lt;/span&gt;&lt;/a&gt;VIDA-GEO арқылы&lt;/h4&gt;\n&lt;p&gt;Әл-ауқаттылықты (Wealthy) бағалау санатында VIDA-GEO 27.0 балл алды. Басқа әдістер: LANCE — 35.4, DIFFusion — 54.9, URSimulator — 35.5, NB2.5 (ZS) — 68.8. NB2.5 (ZS) моделі мұнда ең жоғары нәтижелерді көрсетті, бұл оның нысандардың әлеуметтік-экономикалық мәртебе белгілеріне сезімталдығын білдіруі мүмкін.&lt;/p&gt;\n&lt;h4 id=\"zhalykhtyratyn-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#zhalykhtyratyn-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жалықтыратын VIDA-GEO&lt;/span&gt;&lt;/a&gt;Жалықтыратын VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;«Жалықтырарлықты» (Boring) бағалауда VIDA-GEO 74.6 сияқты жоғары көрсеткішті көрсетті. Салыстыру үшін: LANCE — 62.8, DIFFusion — 55.2, URSimulator — 64.4, NB2.5 (ZS) — 61.1. VIDA-GEO-ның жоғары нәтижесі оның монотонды немесе визуалды тұрғыдан мәнсіз қалалық кеңістіктерді дәл анықтау қабілетінен хабар береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Boring» санатындағы жоғары көрсеткіштер модельдің дәлдігін де, визуалды біркелкі нысандардың жіктелу ерекшеліктерін де көрсете алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"koengilsiz-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#koengilsiz-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Көңілсіз VIDA-GEO&lt;/span&gt;&lt;/a&gt;Көңілсіз VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;VIDA-GEO моделі визуалды тұтастық пен қала құрылысы нормаларына сәйкестік бойынша жоғары нәтиже көрсетіп, базалық модельдерден орташа есеппен 15%-ға озып тұр. DIFFusion моделі түбегейлі өзгерістерге қабілетті болғанымен (мысалы, жол қаупін 72,8%-ға төмендету), оның визуалды түзетулерінің сапасы мен саясатқа сәйкестігі төмен деңгейде қалады. LANCE моделі көбінесе күтпеген бағытта өзгерістер енгізеді және LLM-төрешілер бағалауында VIDA-GEO-дан қалысады. NB2.5 (ZS) базалық моделі сандық тұрғыдан үлкен өзгерістерге қол жеткізсе де (Lively және Wealthy көрсеткіштері 39,1% және 50,8%-ға жақсарған), бұл өзгерістер көбінесе шынайы емес болып шығады. Көгалдандыру тапсырмасы бұдан ерекшеленеді, себебі ол қарапайым визуалды түзетулерді талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO визуалды сапа мен нақты қала құрылысы саясатын сақтау арасындағы ең жақсы тепе-теңдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сараптамалық бағалау автоматтандырылған «қара жәшік» модельдері мен мамандар пікірі арасындағы алшақтықты көрсетті. DIFFusion-мен салыстырғанда, сарапшылар VIDA-GEO-ны 61,3% жағдайда артық көрді, ал автоматтандырылған модельдер тек 10% жағдайда ғана таңдады. LANCE-ке қатысты бұл көрсеткіш 86,7%-ды құрады. LLM-төрешілер сарапшылармен жоғары деңгейде сәйкес келді (реализм бойынша 88,5% және саясатты сақтау бойынша 91,6%), бұл олардың тиімді бағалау құралы екенін растайды. Сапалық талдау (3-сурет) VIDA-GEO-ның шынайы шешімдерді (жиектерді кеңейту, тактильді жабындар) ұсынатынын, ал DIFFusion-ның маңызды нысандарды (мысалы, бағдаршамдарды) алып тастайтынын немесе жай ғана түстерді өзгертетінін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-төреші — кескін сапасын мәтіндік критерийлер негізінде бағалау үшін қолданылатын тілдік модельдер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;VIDA-GEO тізбекті түзетуді қолдайды (4-сурет). Итеративті түзетулер (мысалы, мурал қосу, ғимараттарды кеңейту) «зеріктіру» (boring score) көрсеткішін 53%-дан 17%-ға дейін төмендетеді, бұл бір реттік түзетуден (40%) әлдеқайда тиімді. Итерациялар барысында LLM-төрешілердің көрсеткіштері сәл төмендесе де, бұл қала құрылысы мақсаттарына жету үшін қолайлы ымыра болып табылады.&lt;/p&gt;\n&lt;h4 id=\"ablyaciyalar\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ablyaciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абляциялар:&lt;/span&gt;&lt;/a&gt;Абляциялар:&lt;/h4&gt;\n&lt;p&gt;Компоненттерді талдау саясат шектеулерінің (policy constraints) түпкілікті нәтижеге ең үлкен үлес қосатынын көрсетті. Түзету мен маска сапасын бақылау модульдері (Edit QC және Mask QC) айтарлықтай өсімді қамтамасыз етеді, ал ұсыныстар модулі (suggestor) тұрақты жақсартуларды береді.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Авторлар қалалық ортаны бақылаудан оны өзгерту және шешім қабылдауды тестілеуге көшетін жаңа тұжырымдаманы ұсынды. Интервенциялардың сәттілігін бағалау үшін 800 суреттен (спутниктік және көше панорамалары) тұратын 8 тапсырмадан құралған бенчмарк әзірленді. Сондай-ақ, өзгерістердің сапасын қабылдау және саясатқа сәйкестік тұрғысынан бағалау үшін жаңа метрикалар ұсынылды. Бұл мәселені шешу үшін VIDA-GEO — қала құрылысшылары үшін шешімдерді қолдау құралы ретінде қызмет ететін көп агентті әдіс енгізілді.&lt;/p&gt;\n&lt;h4 id=\"shekteuler-zhaene-bolashakh-zhumys\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#shekteuler-zhaene-bolashakh-zhumys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер және болашақ жұмыс&lt;/span&gt;&lt;/a&gt;Шектеулер және болашақ жұмыс&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыс жаңа мәселені көтергендіктен, бірқатар шектеулерге ие. Қазіргі жүйеде FLUX моделі арқылы жасалған түзетулер, әсіресе спутниктік суреттер үшін, жиі сапа тексеруінен өтпей қалады, бұл NanoBanana алгоритміне шамадан тыс тәуелділікке әкеледі. Жабық кодты модельдерді ашық кодты баламалармен алмастыруға болады, бірақ бұл сапаның айтарлықтай төмендеуіне әкеледі. Сонымен қатар, әдіс маскалар мен түзетулерді бірнеше рет тексеруге сүйенеді, мұны жетілдірілген сегментация құралдары арқылы азайтуға болады. Жүйе тікелей аймақтар заңнамасын немесе құрылыс бюджеттерін есепке алмайды, сондықтан ол іске асыру жүйесі емес, жоспарлаушылар үшін алғашқы шешімдерді қолдау құралы ретінде қарастырылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO қалалық өзгерістерді визуализациялаудың жаңа тәсілін ұсынады, алайда оның толыққанды қолданылуы үшін инженерлік стандарттар мен бюджеттік шектеулерді интеграциялау қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"statistikalykh-derekterding-etalondykh-koersetkishteri\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#statistikalykh-derekterding-etalondykh-koersetkishteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СТАТИСТИКАЛЫҚ ДЕРЕКТЕРДІҢ ЭТАЛОНДЫҚ КӨРСЕТКІШТЕРІ&lt;/span&gt;&lt;/a&gt;СТАТИСТИКАЛЫҚ ДЕРЕКТЕРДІҢ ЭТАЛОНДЫҚ КӨРСЕТКІШТЕРІ&lt;/h4&gt;\n&lt;p&gt;Деректер жиынтығы жаһандық географияны қамтиды: Солтүстік Америка (43%), Еуропа (18%), Азия (17%), Оңтүстік Америка (14%) және Океания (8%). Суреттерді таңдау процесі автоматтандырылған: мағыналы араласу мүмкін емес жағдайлар (мысалы, өте тығыз қалалық аймақтар) алынып тасталды. Спутниктік суреттердің орташа құрамы: 57,6% қалалық құрылыс, 41,1% өсімдіктер, 14,6% жол және 18,9% ғимараттар. Көше панорамаларында аспан (39,9%), ғимараттар (17,4%) және өсімдіктер (15,5%) басым. 9-кестеде қауіпсіздік, тартымдылық және көгалдандыру деңгейі сияқты 8 индикатор бойынша баллдардың таралуы берілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бенчмарк — бұл әртүрлі алгоритмдердің тиімділігін бірыңғай шкала бойынша салыстыру үшін қолданылатын деректер мен тапсырмалар жиынтығы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nakhty-khalalykh-oezgeristermen-salystyru\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#nakhty-khalalykh-oezgeristermen-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нақты қалалық өзгерістермен салыстыру&lt;/span&gt;&lt;/a&gt;Нақты қалалық өзгерістермен салыстыру&lt;/h4&gt;\n&lt;p&gt;Авторлар VIDA-GEO нәтижелерін нақты қала құрылысы жобаларымен сапалық тұрғыдан салыстырды. 9-суретте көрсетілгендей, модель жаяу жүргіншілер жолдарын жақсарту, велосипед жолдарын қосу, жаяу жүргіншілер өткелдерін сызу және ғимарат қасбеттерін жаңарту сияқты практикалық өзгерістерді сәтті визуализациялайды. Бұл өзгерістер қауіпсіздік пен эстетикалық тартымдылықты арттыруға бағытталған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO нақты қала құрылысы тәжірибелеріне сәйкес келетін шынайы өзгерістерді ұсына алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ablyaciyalykh-zertteu-maelimetteri\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ablyaciyalykh-zertteu-maelimetteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абляциялық зерттеу мәліметтері&lt;/span&gt;&lt;/a&gt;Абляциялық зерттеу мәліметтері&lt;/h4&gt;\n&lt;p&gt;Жүйе компоненттерінің үлесін бағалау үшін авторлар жекелеген суб-модульдерді (саясат шектегіші, ұсыныс генераторы және сапаны бақылау модульдері) өшіріп, абляциялық талдау жүргізді. Әр тапсырма үшін кездейсоқ таңдалған 10 кескін қолданылды. Сапаны бақылау модульдерін өшіру LLM-төрешінің орташа бағасын 77,7%-дан 67,1%-ға (өңдеуді бақылау үшін) және 64,2%-ға (сегментация маскасы үшін) дейін төмендеткенін көрсетті. 12-кестеде көрсетілгендей, компоненттері өшірілген модельдердің 38,3% жағдайында базалық көрсеткіштер жақсармаған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляциялық талдау — жүйенің әр бөлігінің қорытынды нәтижеге қаншалықты әсер ететінін анықтау үшін оларды кезең-кезеңімен өшіріп тексеру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"pajdalanushyny-baghalau-interfejsi\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#pajdalanushyny-baghalau-interfejsi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пайдаланушыны бағалау интерфейсі&lt;/span&gt;&lt;/a&gt;Пайдаланушыны бағалау интерфейсі&lt;/h4&gt;\n&lt;p&gt;Адамдар тарапынан бағалау процесінде (10 және 11-суреттер) сарапшылар кескін жұптарын үш критерий бойынша салыстырды: мақсатты көрсеткіштің өзгеруі, визуалды шынайылық және қала құрылысы саясатына сәйкестігі. Диффузиялық модельдер визуалды тұрғыдан сенімсіз болғандықтан, бағалаушыларға «қауіпсіздік» немесе «байлық» сияқты ұғымдарға нақты анықтамалар берілмеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бағалау критерийлеріне нақты анықтама бермеу жүйе пайдасына қарай бұрмалаушылықты болдырмау үшін әдейі жасалды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhumystyng-aeseri-men-shekteuleri\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#zhumystyng-aeseri-men-shekteuleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жұмыстың әсері мен шектеулері&lt;/span&gt;&lt;/a&gt;Жұмыстың әсері мен шектеулері&lt;/h4&gt;\n&lt;p&gt;VIDA-GEO қала құрылысшыларына қымбат жұмыстарды бастамас бұрын өзгерістерді визуализациялауға және салыстыруға көмектесетін алғашқы құрал болып табылады. Дегенмен, жүйе инженерлік зерттеулерді немесе қоғамдық талқылауларды алмастырмайды. Авторлар модель алдын ала оқытылған алгоритмдерден географиялық немесе әлеуметтік-экономикалық бұрмалаушылықтарды мұра етіп алуы мүмкін екенін және ұсынылған шешімдердің заңды немесе физикалық тұрғыдан жүзеге аспауы мүмкін екенін атап өтеді.&lt;/p&gt;\n&lt;h4 id=\"keskinder-licenziyasy\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#keskinder-licenziyasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескіндер лицензиясы&lt;/span&gt;&lt;/a&gt;Кескіндер лицензиясы&lt;/h4&gt;\n&lt;p&gt;Авторлар Google Street View немесе MapBox сияқты үшінші тарап кескіндерін таратпайды. Ашық қолжетімділікке тек әр тапсырма үшін координаттар жиынтығы орналастырылған, пайдаланушылар кескіндерді өз лицензиялық талаптарына сәйкес дербес ала алады.&lt;/p&gt;\n&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;VIDA-GEO — бұл кескінді және оны жақсарту жөніндегі нұсқаулықты қабылдап, аймақ, өңдеу және мәтіндік сипаттамадан тұратын нақты араласу ұсыныстарын жасайтын көп агентті жүйе. Жүйе кескінді бірден толық өңдеудің орнына, мәселені мамандандырылған агенттерге бөледі, бұл локальды және атомдық өзгерістерді жүзеге асыруға мүмкіндік береді. VIDA-GEO құбыры (2-суретті қараңыз) төрт агенттен, бағалау және көп кезеңді оркестрлеу механизмінен тұрады.&lt;/p&gt;\n&lt;h4 id=\"zhosparlau-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#zhosparlau-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жоспарлау агенті&lt;/span&gt;&lt;/a&gt;Жоспарлау агенті&lt;/h4&gt;\n&lt;p&gt;Жоспарлау агенті (Planning Agent) кескіндегі қызығушылық аймақтарын (ROI) анықтайды және оларды реттейді. Ол кеңістіктік координаттарды, шекаралық рамкаларды және семантикалық кілт сөздерді өңдейді. Кейінгі кезеңдерде жоспарлаушы алдыңғы талпыныстардың түйіндемесін алады, бұл қателерді қайталамауға көмектеседі.&lt;/p&gt;\n&lt;h4 id=\"sayasat-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#sayasat-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Саясат агенті&lt;/span&gt;&lt;/a&gt;Саясат агенті&lt;/h4&gt;\n&lt;p&gt;Саясат агенті (Policy Agent) әрбір ROI үшін физикалық және семантикалық шектеулерді белгілейді. Аймақтар үш санатқа бөлінеді: еркін (кез келген өзгеріс мүмкін), шектелген (ережелерді сақтай отырып) және өткізіп жіберілетін (өзгертілмейтін инфрақұрылым). Көше көріністері үшін агент ғимараттар мен кіреберістердің функционалдық тұтастығын қамтамасыз етеді (5a-сурет).&lt;/p&gt;\n&lt;h4 id=\"segmentaciya-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#segmentaciya-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сегментация агенті&lt;/span&gt;&lt;/a&gt;Сегментация агенті&lt;/h4&gt;\n&lt;p&gt;Сегментация агенті (Segmentation Agent) жоспарлаушыдан алынған ROI негізінде нысандарды бөліп алады (2-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сегментация — кескіндегі пикселдер тобын белгілі бір нысанға жатқызу процесі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"segmentaciya-sapasyn-bakhylau-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#segmentaciya-sapasyn-bakhylau-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сегментация сапасын бақылау агенті&lt;/span&gt;&lt;/a&gt;Сегментация сапасын бақылау агенті&lt;/h4&gt;\n&lt;p&gt;Әрбір маска LLM негізіндегі сапа бақылауынан өтеді: қамту, дәлдік және фрагментация деңгейі тексеріледі. Егер маска сапасыз болса, жүйе кері байланыс механизмі арқылы кілт сөздерді жаңартады.&lt;/p&gt;\n&lt;h4 id=\"generaciya-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#generaciya-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генерация агенті&lt;/span&gt;&lt;/a&gt;Генерация агенті&lt;/h4&gt;\n&lt;p&gt;Генерация агенті (Generation Agent) маска және мәтіндік нұсқаулар көмегімен диффузиялық өңдеуді жүзеге асырады. Саясат агентінің шектеулері мәтіндік сұранысқа енгізіледі. Егер маскалы өңдеу мүмкін болмаса, маскасыз генерация модельдері қолданылады.&lt;/p&gt;\n&lt;h4 id=\"generaciya-sapasyn-bakhylau-agenti\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#generaciya-sapasyn-bakhylau-agenti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генерация сапасын бақылау агенті&lt;/span&gt;&lt;/a&gt;Генерация сапасын бақылау агенті&lt;/h4&gt;\n&lt;p&gt;Нәтижелер реализм, контекстік байланыс және нұсқаулықтарды орындау бойынша тексеріледі. Сондай-ақ саясатқа сәйкестік тексерісі жүргізіледі: мысалы, LLM білімі негізінде қала құрылысы ережелеріне қайшы келетін (автотұрақты тұрғын үйге айналдыру сияқты) өзгерістер қабылданбайды.&lt;/p&gt;\n&lt;h4 id=\"keri-bajlanys\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#keri-bajlanys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кері байланыс&lt;/span&gt;&lt;/a&gt;Кері байланыс&lt;/h4&gt;\n&lt;p&gt;Қате нәтижелер, соның ішінде 5c-суретте көрсетілген мысалдар және оларға сәйкес сапаны бақылау (QC) пікірлері «Генерация агентіне» қайтарылады. Агент өңдеу барысында шынайылықтың жетіспеушілігін, логикалық байланыстың бұзылуын немесе промпттан ауытқуды талдайды. Содан кейін «Промпт ұсыну» қосалқы агенті келесі әрекет үшін қайта қаралған өңдеу промптын жасайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кері байланыс жүйеге өз қателерінен үйренуге және генерация нұсқауларын нақты уақыт режимінде түзетуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghalau-zhaene-koep-cikldi-orkestrleu\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#baghalau-zhaene-koep-cikldi-orkestrleu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау және көп циклді оркестрлеу&lt;/span&gt;&lt;/a&gt;Бағалау және көп циклді оркестрлеу&lt;/h4&gt;\n&lt;p&gt;Әрбір қызығушылық аймағы (ROI) үшін сапаны бақылаудан өткен бірнеше өңделген кескін болуы мүмкін. Барлық қабылданған үміткерлер «қара жәшік» индикаторы арқылы бағаланады және бастапқы кескінмен салыстырылады. Үміткерлер екі балл арасындағы айырмашылық (delta score) негізінде рейтингке ие болады. Бұл процесс бірнеше цикл бойы қайталанады және әр циклдің нәтижелері «Жоспарлау агентіне» беріледі.&lt;/p&gt;\n&lt;p&gt;Агенттерді жаңа аймақтарды анықтауға, жаңа маскалар жасауға және баламалы өңдеулерді генерациялауға ынталандыру үшін барлық алдыңғы үміткерлер мен олардың delta баллдары сақталады және келесі циклге өткізіледі. Жинақталған тарих жүйені сәтсіз стратегияларды қайталаудан сақтандырады және өңдеудің әртүрлі бағыттарын іздеуге ынталандырады. Нәтижесінде, бұл тәсіл бір бастапқы кескіннен бірнеше өңделген нұсқаны алуға мүмкіндік береді, олардың әрқайсысы белгіленген шектеулерге сәйкес келеді және «қара жәшік» индикаторының балын жақсартады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f2.jpg\" alt=\"2-сурет: VIDA-GEO конвейеріне шолу. Кескін және қалалық ортаны жақсарту бойынша мақсатты нұсқаулық болған кезде, агентте\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: VIDA-GEO конвейеріне шолу. Кескін және қалалық ортаны жақсарту бойынша мақсатты нұсқаулық болған кезде, агенттер тобы қызығушылық аймақтарын (ROI) анықтайды, сегменттейді және тапсырмаға тән шектеулермен өңдеп, араласу нұсқаларын жасайды.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: VIDA-GEO конвейеріне шолу. Кескін және қалалық ортаны жақсарту бойынша мақсатты нұсқаулық болған кезде, агенттер тобы қызығушылық аймақтарын (ROI) анықтайды, сегменттейді және тапсырмаға тән шектеулермен өңдеп, араласу нұсқаларын жасайды. Сапаны тексеру реализм мен саясаттың сақталуын бағалайды. Үміткерлер соңында «қара жәшік» индикаторы арқылы бағаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f3.jpg\" alt=\"3-сурет: Көше көріністері (бірінші қатарлар) және әуе түсірілімдері (соңғы қатар) үшін VIDA-GEO және DIFFusion араласу н\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Көше көріністері (бірінші қатарлар) және әуе түсірілімдері (соңғы қатар) үшін VIDA-GEO және DIFFusion араласу нәтижелерін салыстыру. VIDA-GEO ұсынатын араласулар нақты әлемде практикалық және жүзеге асырылуы мүмкін, мысалы, екінші жағдайда қиылыс айналасында бағаналар мен тактильді плиткаларды қосу. Сонымен қатар, DIFFusion-нан айырмашылығы, VIDA-GEO кескіндермен бірге мәтіндік нұсқауларды бере алады, бұл пайдаланушы үшін тиімдірек.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f4.jpg\" alt=\"4-сурет: VIDA-GEO-ны бірнеше дәйекті түзетулермен пайдалану.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: VIDA-GEO-ны бірнеше дәйекті түзетулермен пайдалану.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: VIDA-GEO-ны бірнеше дәйекті түзетулермен пайдалану. (a) Жүйе әртүрлі аймақтарда бірнеше түзетулерді ұсынады және индикатор ұпайын арттырады. Мысалы, төменгі қатарда ол ғимараттың қасбетін жақсартады, содан кейін шам бағанасын, одан кейін жол бойындағы гүлдерді қосып, эстетикалық бағаны 29,2%-дан 92,4%-ға дейін арттырады. (b) Дәйекті итерациялар барысындағы сандық прогрессия.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f5.jpg\" alt=\"5-сурет: Сәтсіз жағдайлардың мысалдары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Сәтсіз жағдайлардың мысалдары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: Сәтсіз жағдайлардың мысалдары. (a) біздің жүйе аулақ болатын саясаттың бұзылуын көрсетеді. (b) сапаны бақылау (QC) суб-агенті қабылдамаған сегменттеу маскаларын көрсетеді, мұнда жоғарғы кескін «орташа қабатты ғимаратты», ал төменгісі «шөптесін бұталарды» сегменттейді. (c) кіші суреті қабылданбаған түзетулерді бейнелейді: жоғарғы түзету төмен ажыратымдылықты және шынайы емес өңдеуді қамтиды, ал төменгі түзету қате аймақты толтырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f6.jpg\" alt=\"6-сурет: Сегменттеу және генерациялау агенттерінің нәтижелерінен сапалы мысалдар, бастапқыда сәтсіз болған, бірақ кейінн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Сегменттеу және генерациялау агенттерінің нәтижелерінен сапалы мысалдар, бастапқыда сәтсіз болған, бірақ кейіннен сапаны бақылаудан (QC) өту үшін түзетілген нәтижелерді көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f6-2.jpg\" alt=\"Сурет 6 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 6 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f7.jpg\" alt=\"7-сурет: Алты Street View қабылдау тапсырмасы бойынша VIDA-GEO-ның дәйекті өңдеу әрекеті.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Алты Street View қабылдау тапсырмасы бойынша VIDA-GEO-ның дәйекті өңдеу әрекеті.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет: Алты Street View қабылдау тапсырмасы бойынша VIDA-GEO-ның дәйекті өңдеу әрекеті. Әр панельде мақсатқа сәйкес келетін орташа қабылдау ұпайы, сонымен қатар 10 кіріс деректерінің дәйекті өңдеулері бойынша Qwen3-VL-дің реализм, саясатты сақтау, визуалды сапа және орташа LLM-Judge бағалары көрсетілген. «Зеріктіретін» (Boring) және «Көңілсіз» (Depressing) санаттары үшін бастапқы қабылдау ұпайы кері айналдырылған (10 − бастапқы ұпай), осылайша жоғары мәндер мақсатқа жетудегі ілгерілеуді дәйекті түрде көрсетеді. Кіріс кескіні үшін өңдеу ешбір қолайлы үміткер сапаны бақылаудан өтпегенде немесе мақсатқа жеткенде тоқтатылады; тоқтатылған кіріс деректері кейінгі когорта орташа мәндерінде өздерінің соңғы қабылданған нәтижелерін сақтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f8.jpg\" alt=\"8-сурет: Контрфактуалды көрініс өңдеулері және сәйкес предиктор шығыстары.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Контрфактуалды көрініс өңдеулері және сәйкес предиктор шығыстары.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-сурет: Контрфактуалды көрініс өңдеулері және сәйкес предиктор шығыстары. VIDA-GEO екі бөлек өңдеу бағыты арқылы бірдей Street View кескінінің балама нұсқаларын жасайды. Өсімдіктер жойылып, қоршаған ортаның жағдайы нашарлаған сайын, «сұлулық» (black-box) предикторы біртіндеп төменірек ұпайлар береді. Ұпайлардың дәйекті және түсінікті өзгеруі предиктордың контрфактуалды араласулар кезінде көріністің маңызды атрибуттарын қамтитынын көрсетеді, бұл оның әлем моделінің компоненті ретінде қолданылуын қолдайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f9.jpg\" alt=\"9-сурет: VIDA-GEO араласуларын нақты әлемдегі өзгерістермен сапалық салыстыру. Солдан оңға қарай: бастапқы көрініс, бақы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет: VIDA-GEO араласуларын нақты әлемдегі өзгерістермен сапалық салыстыру. Солдан оңға қарай: бастапқы көрініс, бақыланған нақты араласу және VIDA-GEO жасаған араласу. Жоғарғы мысалда VIDA-GEO жаяу жүргіншілер өткелін, тротуарды және театр маңдайшасын ұқсас түрде жақсартады; төменгі мысалда ол нақты араласуда байқалғанға ұқсас велосипед жолын енгізеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f10.jpg\" alt=\"10-сурет: Адам бағалаушыларға берілген нұсқаулар. Нұсқаулар пайдаланушылардың біздің әдісті таңдауда біржақтылық танытпа\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет: Адам бағалаушыларға берілген нұсқаулар. Нұсқаулар пайдаланушылардың біздің әдісті таңдауда біржақтылық танытпауы үшін әдейі қарапайым сақталған.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f10-2.jpg\" alt=\"Сурет 10 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 10 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f11.jpg\" alt=\"11-сурет: Адам аннотаторларына көрсетілген сұрақтары бар пайдаланушы интерфейсі. Оларға кездейсоқ түрде ең жақсы нәтиже \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-сурет: Адам аннотаторларына көрсетілген сұрақтары бар пайдаланушы интерфейсі. Оларға кездейсоқ түрде ең жақсы нәтиже беретін DIFFusion араласуы және ең жақсы VIDA-GEO араласуы көрсетіледі, содан кейін индикатор, қабылдау сапасы және саясатқа сәйкестік туралы үш сұрақ қойылады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-fS1-2.jpg\" alt=\"Сурет S1 (жалғасы 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1 (жалғасы 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қалалық симуля&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;циялардың&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қымбаттығы&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;VIDA-GEO көп&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;агентті жүйесі&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Реалистік&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қайта&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жоспарлау&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нұсқалары&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Шешім&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қабылдауды&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;автоматтандыру&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;osm_gis&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Hosam Elgendy, Utkarsh Mall&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"vi
