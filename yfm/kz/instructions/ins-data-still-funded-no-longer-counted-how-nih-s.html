        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Нұсқау&lt;/em&gt; · 2026-10-05&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Бұл нұсқаулық 37 790 NIH гранттық өтінімдерін талдау негізінде есеп берудегі цензураны анықтауға арналған.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"makhsaty\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#makhsaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мақсаты&lt;/span&gt;&lt;/a&gt;Мақсаты&lt;/h2&gt;\n&lt;p&gt;Құрал «буланып жатқан» ғылыми бағыттарды анықтауға арналған. Есептердегі лингвистикалық түзетулер ғалымдардың нақты жұмысына әсер етпей, әлемнің статистикалық көрінісін қалай өзгертетінін түсінуге көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"khuramy\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#khuramy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрамы&lt;/span&gt;&lt;/a&gt;Құрамы&lt;/h2&gt;\n&lt;p&gt;Негізінде 37 790 NIH грантын талдау жатыр. Белсенді зат: өтінім мәтіндерін мемлекеттік қаржыландыру санаттарымен салыстыру. Қосымша компоненттер: этникалық топтардың жойылған ескертулерін анықтау үшін табиғи тілді өңдеу әдістері.&lt;/p&gt;\n&lt;h2 id=\"kholdanu-taesili\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#kholdanu-taesili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қолдану тәсілі&lt;/span&gt;&lt;/a&gt;Қолдану тәсілі&lt;/h2&gt;\n&lt;p&gt;«Как чиновники удаляют слова из отчетов, чтобы «испарить» научные исследования» мақаласын алыңыз. Әдісті ашық гранттар тізіліміне қолданыңыз. Егер жоба сипаттамасынан этникалық топтың атауы жоғалса, жоба автоматты түрде «азшылықтар денсаулығы» санатынан шығып қалады. Статистика «таза» және бейтарап болғанша қайталаңыз.&lt;/p&gt;\n&lt;h2 id=\"zhaghymsyz-aeserleri\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#zhaghymsyz-aeserleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жағымсыз әсерлері&lt;/span&gt;&lt;/a&gt;Жағымсыз әсерлері&lt;/h2&gt;\n&lt;p&gt;Ғылымның тұтас салалары жоғалып кеткендей иллюзия туындауы мүмкін. Қаржыландыру мен нақты зерттеулер өзгеріссіз қалғанын, ал есептіліктің өзгергенін түсіну бас айналуына әкелуі мүмкін.&lt;/p&gt;\n&lt;h2 id=\"kharsy-koersetilimder\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#kharsy-koersetilimder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қарсы көрсетілімдер&lt;/span&gt;&lt;/a&gt;Қарсы көрсетілімдер&lt;/h2&gt;\n&lt;p&gt;Автоматты есептердің мінсіздігіне шектен тыс сенім болса, қолданбаңыз. Зертханалық қызметтегі нақты өзгерістерді іздеу үшін ұсынылмайды, өйткені олар мүлдем болмауы мүмкін.&lt;/p&gt;\n&lt;h2 id=\"sakhtau-sharttary\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#sakhtau-sharttary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сақтау шарттары&lt;/span&gt;&lt;/a&gt;Сақтау шарттары&lt;/h2&gt;\n&lt;p&gt;Ашық қолжетімді жерде, тарихты қайта жазу әрекеттерінен алыс сақтаңыз. Сыни ойлауды сақтау үшін бастапқы деректермен үнемі салыстырып отыру ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"negiz-bolghan-makhalalar\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#negiz-bolghan-makhalalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негіз болған мақалалар&lt;/span&gt;&lt;/a&gt;Негіз болған мақалалар&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Шенеуніктер есептен сөздерді алып тастап, ғылыми зерттеулерді қалай «жоқ қылады»&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Ұғымдар: &lt;a href=\"concepts/spec-data.html\"&gt;Ашық деректер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Бұл нұсқаулық 37 790 NIH гранттық өтінімдерін талдау негізінде есеп берудегі цензураны анықтауға арналған."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Қолдану жөніндегі нұсқаулық: ғылымды қалай көрінбейтін етуге болады","description":"Бұл нұсқаулық 37 790 NIH гранттық өтінімдерін талдау негізінде есеп берудегі цензураны анықтауға арналған.","vcsPath":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.md"},"headings":[{"title":"Мақсаты","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#makhsaty","level":2},{"title":"Құрамы","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#khuramy","level":2},{"title":"Қолдану тәсілі","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#kholdanu-taesili","level":2},{"title":"Жағымсыз әсерлері","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#zhaghymsyz-aeserleri","level":2},{"title":"Қарсы көрсетілімдер","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#kharsy-koersetilimder","level":2},{"title":"Сақтау шарттары","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#sakhtau-sharttary","level":2},{"title":"Негіз болған мақалалар","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#negiz-bolghan-makhalalar","level":2}],"title":"Қолдану жөніндегі нұсқаулық: ғылымды қалай көрінбейтін етуге болады"},"router":{"pathname":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
