        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Нұсқау&lt;/em&gt; · 2026-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Сіздің ЖИ-агентіңіз тағы да әлемді жаулап алғысы келе ме? Оны Runtime Assurance Contract көмегімен тыныштандырыңыз.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"makhsaty\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#makhsaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мақсаты&lt;/span&gt;&lt;/a&gt;Мақсаты&lt;/h2&gt;\n&lt;p&gt;Қырсық алгоритмдерді тізгіндеу құралы. ЖИ-агенттерінің дербестігін шектеуге көмектеседі, олардың «сенімділігі» сіздің деректеріңіз үстінен бақылаусыз билікке айналып кетпеуі үшін қажет.&lt;/p&gt;\n&lt;h2 id=\"khuramy\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#khuramy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрамы&lt;/span&gt;&lt;/a&gt;Құрамы&lt;/h2&gt;\n&lt;p&gt;Негізінде «Сенім — бұл баға емес: ЖИ-агенттерінің билігін қалай шектеуге болады» мақаласында сипатталған Runtime Assurance Contract (RAC) тұжырымдамасы жатыр. Бұл модельдің жалпы өнімділігіне қарамастан жұмыс істейтін қатаң тыйымдар мен міндетті тексерулерден тұратын ресми сызба.&lt;/p&gt;\n&lt;h2 id=\"kholdanu-taesili\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#kholdanu-taesili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қолдану тәсілі&lt;/span&gt;&lt;/a&gt;Қолдану тәсілі&lt;/h2&gt;\n&lt;p&gt;RAC-ты агентіңіздің архитектурасына енгізіңіз. Жұмсақ метрикаларға немесе нейрондық желінің «адал сөзіне» сенудің орнына, жүйені кем дегенде бір тексеру сәтсіз болған жағдайда кез келген әрекетті блоктайтындай етіп баптаңыз. Есіңізде болсын: егер агент өз қадамының қауіпсіздігін дәлелдей алмаса, ол орнында тұруы керек.&lt;/p&gt;\n&lt;h2 id=\"zhanama-aeserleri\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#zhanama-aeserleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жанама әсерлері&lt;/span&gt;&lt;/a&gt;Жанама әсерлері&lt;/h2&gt;\n&lt;p&gt;Агенттің «шығармашылығы» мен жұмыс жылдамдығының уақытша төмендеуі мүмкін. Сирек жағдайларда — ЖИ өз еркіндігінің ресми логикамен шектелгенін түсінуі мүмкін, бұл жалықтыруға әкелуі мүмкін (бірақ көтеріліске емес).&lt;/p&gt;\n&lt;h2 id=\"kholdanugha-bolmajtyn-zhaghdajlar\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#kholdanugha-bolmajtyn-zhaghdajlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қолдануға болмайтын жағдайлар&lt;/span&gt;&lt;/a&gt;Қолдануға болмайтын жағдайлар&lt;/h2&gt;\n&lt;p&gt;Толық болжаусыздық талап етілетін немесе ресми дәлелдердің жоқтығы жұмыс істеудің жалғыз жолы болып табылатын жүйелерде қолдану ұсынылмайды. Әзірлеушінің ақыл-парасатын алмастырмайды.&lt;/p&gt;\n&lt;h2 id=\"sakhtau-sharttary\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#sakhtau-sharttary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сақтау шарттары&lt;/span&gt;&lt;/a&gt;Сақтау шарттары&lt;/h2&gt;\n&lt;p&gt;Рұқсатсыз кіруден қорғалған репозиторийде сақтаңыз. Тыйымдар тізімін үнемі жаңартып отырыңыз, өйткені ЖИ-агенттері ең қатаң ережелерден де саңылау табуға бейім.&lt;/p&gt;\n&lt;h2 id=\"negiz-bolghan-makhalalar\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#negiz-bolghan-makhalalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негіз болған мақалалар&lt;/span&gt;&lt;/a&gt;Негіз болған мақалалар&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html\"&gt;Сенім — бұл баға емес: AI-агенттердің өкілеттігін қалай шектеуге болады&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Ұғымдар: &lt;a href=\"concepts/spec-data.html\"&gt;Ашық деректер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Сіздің ЖИ-агентіңіз тағы да әлемді жаулап алғысы келе ме? Оны Runtime Assurance Contract көмегімен тыныштандырыңыз."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ЖИ-агентті пайдалану нұсқаулығы: сенбе, тексер","description":"Сіздің ЖИ-агентіңіз тағы да әлемді жаулап алғысы келе ме? Оны Runtime Assurance Contract көмегімен тыныштандырыңыз.","vcsPath":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.md"},"headings":[{"title":"Мақсаты","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#makhsaty","level":2},{"title":"Құрамы","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#khuramy","level":2},{"title":"Қолдану тәсілі","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#kholdanu-taesili","level":2},{"title":"Жанама әсерлері","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#zhanama-aeserleri","level":2},{"title":"Қолдануға болмайтын жағдайлар","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#kholdanugha-bolmajtyn-zhaghdajlar","level":2},{"title":"Сақтау шарттары","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#sakhtau-sharttary","level":2},{"title":"Негіз болған мақалалар","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#negiz-bolghan-makhalalar","level":2}],"title":"ЖИ-агентті пайдалану нұсқаулығы: сенбе, тексер"},"router":{"pathname":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":tru
