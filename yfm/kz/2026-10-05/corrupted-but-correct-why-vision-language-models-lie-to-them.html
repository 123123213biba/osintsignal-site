        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"81\" cy=\"128\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"619\" cy=\"280\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · IMAGE_FORENSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Нейрожелілер неге «өтірік&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;айтады»: оқыту мен нәтиже&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;арасындағы алшақтық&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-f1.jpg\" alt=\"1-сурет: 200 кескін және барлық үш нәтиже тобы бойынша әр токенге қатысты ықтималдықты талдау. Дұрыс алдыңғы А токені ко\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: 200 кескін және барлық үш нәтиже тобы бойынша әр токенге қатысты ықтималдықты талдау. Дұрыс алдыңғы А токені контексте бар болған жағдайда, _coconut мақсатты токенінің рангі әрбір кескін мен әрбір топ үшін, таза және қарсыласу (adversarial) деректері үшін де нөлдік дисперсиямен 3488 белгісіндегі түзу сызықты құрайды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Заманауи мультимодальды модельдер (&lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt;) «оқыту мен қорытындылау алшақтығын» көрсетеді: олар мәжбүрлі оқыту кезінде оңай шатасуы мүмкін, бірақ еркін генерацияда бұл бұрмалауларды елемейді. Qwen2.5-VL-7B моделіне жасалған талдау шабуылдарға төзімділік визуалды энкодер емес, тілдік декодер арқылы анықталатынын көрсетеді. Бұл жаңалық AI жүйелерін қорғау тәсілін өзгертіп, назарды кескіндерден тілдік басымдықтарға аударуды талап етеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Пиксель мен текстура статистикасы модельдің осалдығын болжай алмайды (r=-0.050).&lt;/li&gt;\n&lt;li&gt;Алшақтық генерацияның нақты бір қадамында локализацияланған.&lt;/li&gt;\n&lt;li&gt;Шабуылдарға төзімділік визуалды энкодердің емес, тілдік декодердің қасиеті.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"aedister-zhaene-daeldik\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#aedister-zhaene-daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер және дәлдік&lt;/span&gt;&lt;/a&gt;Әдістер және дәлдік&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Әдіс&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Деректер&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Дәлдік&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Шектеу&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Object Texture Intensity (OTI)&lt;/td&gt;\n&lt;td&gt;200 COCO val2017 кескіні&lt;/td&gt;\n&lt;td&gt;r=-0.050, p=0.484&lt;/td&gt;\n&lt;td&gt;VLM үшін болжау күші жоқ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ridge Regression&lt;/td&gt;\n&lt;td&gt;9 кескін сипаттамасы&lt;/td&gt;\n&lt;td&gt;R^2=0.069&lt;/td&gt;\n&lt;td&gt;Осалдықты түсіндіре алмайды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Linear Probe&lt;/td&gt;\n&lt;td&gt;Біріктірілген жасырын күй&lt;/td&gt;\n&lt;td&gt;AUC=0.858&lt;/td&gt;\n&lt;td&gt;Айналмалы логика қаупі бар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеу COCO val2017 жиынтығынан алынған 200 кескін арқылы «оқыту мен қорытындылау алшақтығы» механизмін зерттеді. Авторлар әр кезеңде 500 итерациядан тұратын екі кезеңдік &lt;a href=\"concepts/projected-gradient-descent.html\"&gt;PGD&lt;/a&gt; (проекцияланған градиенттік түсу) шабуылын қолданды. «&lt;a href=\"concepts/logit-lens.html\"&gt;Logit lens&lt;/a&gt;» (логит линзасы) құралы арқылы декодердің 28 қабатындағы мақсатты токеннің орны бақыланды.&lt;/p&gt;\n&lt;p&gt;Нәтижелер визуалды энкодер әр кескінді шабуылдың сәттілігіне қарамастан бірдей деңгейде бұрмалайтынын көрсетеді. Алайда, тілдік декодер төзімді модельдерде бұл бұрмалауларды белсенді түрде басады (p&amp;lt;0.001, rank-biserial r=0.579). Біріктірілген жасырын күйдегі сызықтық зонд (linear probe) сәтті және сәтсіз шабуылдарды &lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt;=0.858 дәлдікпен ажыратады, бұл тілдік басымдықтың негізгі қорғаныс қалқаны екенін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек Qwen2.5-VL-7B архитектурасымен және 200 кескінмен шектелген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Мақсатты адверсариалды (қарсылас) шулар VLM-моделінің (Qwen2.5-VL-7B-Instruct) «мұғалім» (teacher-forcing) көмегімен оқыту кезіндегі жоғалту функциясын белгіленген сипаттама үшін нөлге жақындата алады. Алайда, модель еркін мәтін генерациялағанда, мақсатты әсердің іздерінсіз бастапқы, дұрыс сипаттаманы қайтарады. Авторлар бұл құбылысты «оқыту/қорытынды жасау алшақтығы» (&lt;a href=\"concepts/train-inference-gap.html\"&gt;train/inference gap&lt;/a&gt;) деп атайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;COCO жиынтығынан алынған 200 суретте жүргізілген зерттеу модельдің еркін генерация режимінде шабуылдарды елемейтінін көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зерттеу COCO деректер жиынтығынан алынған 200 суретте екі кезеңді PGD шабуылы арқылы жүзеге асырылды. Авторлар пиксель статистикасын және CNN тұрақтылығы бойынша зерттеулерден алынған текстуралық осалдық көрсеткіштерін талдады. Статистикалық талдау (ridge regression) бұл көрсеткіштердің болжау қабілеті жоқ екенін көрсетті: корреляция коэффициенті r = -0,050 (p = 0,484), ал детерминация коэффициенті R² = 0,069 болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PGD-шабуыл (Projected Gradient Descent) — нейрондық желіні қателікке итермелейтін суреттегі өзгерістерді табудың итеративті әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Logit lens әдісі арқылы авторлар алшақтықты бір авторегрессивті қадамда анықтады. Бірінші дұрыс токен генерацияланған жағдайда, мақсатты токеннің рангасы 152 064 сөздік бірлігінен дәл 3488-орында тұрақты қалды. &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; декодерінің 28 қабаты бойынша бақылау визуалды энкодердің барлық суретке ұқсас дәрежеде бұрмалау енгізетінін көрсетті. Алайда, тіл декодері сигналды әртүрлі өңдейді: осал суреттер үшін оны күшейтеді, ал төзімділері үшін басады (p &amp;lt; 0,001, rank-biserial r = 0,579). Жасырын күйдегі сызықтық зонд (linear probe) бұл нәтижелерді AUC = 0,858 дәлдікпен бөледі, дегенмен авторлар бұл бағалауда айналмалы логика (circularity) қаупі бар екенін ескертеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторлар сызықтық зондты бағалау кезінде айналмалы логика мәселесі бар екенін атап өтеді, бұл нәтижелерді түсіндіруде сақтықты талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Визуалды-тілдік модельдер (VLM) визуалды деректермен жұмыс істейтін жүйелердің негізгі бөлігі ретінде жиі қолданылуда. Мұндай жүйелердің басты осалдығы — «&lt;a href=\"concepts/adversarial-perturbations.html\"&gt;adversarial perturbations&lt;/a&gt;» (дұшпандық шулар), яғни пикселдердегі көзге көрінбейтін өзгерістер арқылы модельді қате нәтиже беруге мәжбүрлеу. CNN классификаторларынан айырмашылығы, VLM архитектурасы күрделірек: шу визуалды энкодер, модаларалық байланыстырушы және авторегрессиялық тілдік декодер арқылы өтуі керек. Зерттеушілер Qwen2.5-VL-7B-Instruct моделінде парадоксты анықтады: PGD әдісін қолданып, «teacher-forcing» (мәжбүрлі оқыту) режимінде модель шабуылдаушы таңдаған мәтінді дерлік 100% ықтималдықпен шығарады. Алайда, еркін генерация режимінде модель шуды елемей, бастапқы кескінді дұрыс сипаттайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу мәжбүрлі оқыту режимінде сәтті болған шабуылдардың еркін генерация режимінде әрқашан нәтиже бермейтінін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар бұл алшақтықты COCO val2017 жиынтығынан алынған 200 кескін көмегімен, екі кезеңдік PGD протоколы және әр қабатта «logit lens» әдісін қолдану арқылы талдайды. Негізгі сұрақтар: бұрмаланулар пиксел статистикасына байланысты ма (RQ1), қате генерацияның қай кезеңінде орын алады (RQ2) және декодер бұзылған сигналды қалай өңдейді (RQ3). Нәтижелер VLM тұрақтылығы тек визуалды энкодерге ғана емес, тілдік декодерге де байланысты екенін көрсетеді: ол бұзылған сигналды күшейте немесе баса алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Logit lens — нейрондық желінің ішкі күйін сөздер кеңістігіне проекциялау арқылы модельдің сол сәттегі «ойын» түсінуге мүмкіндік беретін интерпретация әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khatysty-zhumystar-adversarialdy-shabuyldar-zhaene-okhytu/inferens-alshakhtyghy\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#khatysty-zhumystar-adversarialdy-shabuyldar-zhaene-okhytu/inferens-alshakhtyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қатысты жұмыстар: Адверсариалды шабуылдар және оқыту/инференс алшақтығы&lt;/span&gt;&lt;/a&gt;Қатысты жұмыстар: Адверсариалды шабуылдар және оқыту/инференс алшақтығы&lt;/h4&gt;\n&lt;p&gt;PGD сияқты дәстүрлі шабуыл әдістері CNN үшін жақсы зерттелген. Алайда, VLM үшін «exposure bias» (экспозиция қатесі) құбылысы байқалады. Авторлар бұл алшақтықты алғаш рет жеке токендер деңгейінде сандық бағалайды.&lt;/p&gt;\n&lt;h4 id=\"keskinning-shabuylgha-ushyraghyshtyghy\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#keskinning-shabuylgha-ushyraghyshtyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кескіннің шабуылға ұшырағыштығы&lt;/span&gt;&lt;/a&gt;Кескіннің шабуылға ұшырағыштығы&lt;/h4&gt;\n&lt;p&gt;CNN үшін әзірленген қолданыстағы осалдық метрикалары (мысалы, OTI) 75%-ға дейінгі дәлдікті көрсетеді. Бұл жұмыста аталған әдістердің VLM визуалды энкодерлеріне сәйкестігі тексеріледі. Сондай-ақ, авторлар алғаш рет logit lens әдісін бұзылған визуалды токендерге қолданып, қатараралық сигналдарды шабуыл нәтижесімен байланыстырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу VLM архитектурасымен және нақты шабуыл түрлерімен шектелген; нәтижелер модельдердің барлық түріне қатысты болмауы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"belgi-feature\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#belgi-feature\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Белгі (Feature)&lt;/span&gt;&lt;/a&gt;Белгі (Feature)&lt;/h4&gt;\n&lt;p&gt;Зерттеу Qwen2.5-VL-7B моделінің кескін сипаттамалары мен осалдығы арасындағы байланысты талдайды. OTI (нысан текстурасының қарқындылығы) көрсеткіші дұрыс жүзеге асырылғанда осалдықпен статистикалық маңызды байланысты көрсетпейді (r = −0,050, p = 0,484). Керісінше, бүкіл кескіннің текстуралық қарқындылығы мен жоғары жиілікті компоненттер әлсіз, бірақ маңызды корреляцияны көрсетеді (r = −0,299, p &amp;lt; 0,001). Авторлар бұрмаланған визуалды сигналдарды басу визуалды кодтаушы деңгейінде емес, LLM-нің кешкі қабаттарындағы FFN механизмдері арқылы жүретінін болжайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стандартты текстуралық метрикалар модельдің осалдығын болжай алмайды, бұл ViT архитектуралары мен классикалық CNN-дер арасындағы іргелі айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimenttik-modeldi-ornatu\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#eksperimenttik-modeldi-ornatu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименттік модельді орнату&lt;/span&gt;&lt;/a&gt;Эксперименттік модельді орнату&lt;/h4&gt;\n&lt;p&gt;Эксперименттерде bfloat16 форматындағы, салмақтары қатырылған Qwen2.5-VL-7B-Instruct моделі қолданылды. Визуалды кодтаушы 32 ViT блогын (патч өлшемі 14) және 1024 токенді 256-ға сығатын проекторды қамтиды. Деректер жиынтығы ретінде COCO val2017-ден 448×448 өлшеміне келтірілген 200 кескін таңдалды. Мақсатты тізбек — «A coconut» (3 токен). Шабуыл моменті бар PGD әдісімен (µ=0,9, ε=16/255, α=4/255) екі кезеңде жүзеге асырылды: алдымен кодтаушыны, содан кейін бүкіл контекстті оңтайландыру. Кескіндер топтарға бөлінді: A (n=38, сезімтал), B (n=9, оқыту/қорытындылаудағы алшақтық) және C (n=153, тұрақты).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PGD (Projected Gradient Descent) — кескін пикселін белгіленген ε шегінде өзгертіп, модельді қате жауапқа итермелейтін итеративті шабуыл әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rq1-enkoderding-osaldyghyn-pikselder-arkhyly-bolzhau-muemkin-emes\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#rq1-enkoderding-osaldyghyn-pikselder-arkhyly-bolzhau-muemkin-emes\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ1: Энкодердің осалдығын пикселдер арқылы болжау мүмкін емес&lt;/span&gt;&lt;/a&gt;RQ1: Энкодердің осалдығын пикселдер арқылы болжау мүмкін емес&lt;/h4&gt;\n&lt;p&gt;Тоғыз модельсіз белгіні (текстура, жиіліктер, тұрақтылық, нысандар көлемі және т.б.) талдау осалдықтың сенімді болжаушылары жоқ екенін көрсетті. 72 GLCM белгісі бар Random Forest классификаторын қолдану әрекеті дәлдікті 69,0%-дан 64,0%-ға дейін төмендетті. Осалдық семантикалық категорияға байланысты болып шықты: мысалы, жүк көліктері мен пойыздар 50–67% жағдайда осал, ал құстар мен кереуеттер тұрақты (0%). Бұл осалдық текстура сияқты қарапайым визуалды сипаттамаларға байланысты деген гипотезаны жоққа шығарады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек нақты ViT архитектурасымен шектелген; нәтижелер басқа визуалды кодтаушыларға қатысты болмауы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"top\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#top\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Топ&lt;/span&gt;&lt;/a&gt;Топ&lt;/h4&gt;\n&lt;p&gt;Талдау көрсеткендей, шабуыл барлық топтарда дұрыс бірінші токен P(A) генерациялану ықтималдығын төмендетеді. Негізгі нәтиже: генерацияның екінші кезеңінде «_coconut» мақсатты токенінің рангі барлық 200 кескін үшін, топқа немесе шартқа (таза немесе дұшпандық деректер) қарамастан, 152 064 мүмкіндіктің ішінде 3488-орында қалады. Стандартты ауытқу нөлге тең (2-кесте). Шабуылдың осы кезеңдегі сәттілігі 0,0%-ды құрайды.&lt;/p&gt;\n&lt;h4 id=\"songghy-llm-khabatynyng-shyghys-derekterin-biriktiru\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#songghy-llm-khabatynyng-shyghys-derekterin-biriktiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Соңғы LLM қабатының шығыс деректерін біріктіру&lt;/span&gt;&lt;/a&gt;Соңғы LLM қабатының шығыс деректерін біріктіру&lt;/h4&gt;\n&lt;p&gt;Зерттеу модельдің мінез-құлқын қарсыластық шабуылдарға (adversarial attacks) төзімділігіне қарай үш топқа (A, B, C) бөледі. А тобы (әсерленгіш) 8714 кескінді қамтиды, мұнда қарсыластық ранг таза деректермен салыстырғанда 5724 бірлікке төмендейді. В тобы (алшақтық) 10 258 кескінді қамтып, рангтың 2274 бірлікке төмендеуін көрсетеді. С тобы (төзімді) 50 кескіннен тұратын таңдамамен (жалпы 153-тен) берілген, мұнда қарсыластық әсер кезінде ранг 8571 бірлікке артады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдің шабуылдарға төзімділігі әсер ету қарқындылығымен емес, архитектуралық ерекшеліктермен анықталады: С тобы үшін қарсыластық ранг ε = 16/255 болғанда да өзгеріссіз қалып, 8571 бірлікке артады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;PGD (Projected Gradient Descent) әдісі үш токеннен тұратын мақсатты тізбек үшін мұғалім мәжбүрлеуі (teacher-forcing) кезіндегі орташа шығынды азайтады. Алайда, бұл табыс орташаланған: модель екінші токенде құрылымдық сәтсіздікті көрсетеді, мұнда шу бюджеті тілдік басымдықты өзгерте алмайды. Оқыту мен қорытынды шығару (train/inference gap) арасындағы алшақтық әсер ету дәрежесімен емес, модель шабуылға төзімді болып қалатын нақты токен позициясымен анықталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PGD — бұл модель қатесін барынша арттыру үшін кіріс деректеріне шағын өзгерістер енгізетін итеративті шабуыл алгоритмі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"talkhylau\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#talkhylau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау&lt;/span&gt;&lt;/a&gt;Талқылау&lt;/h3&gt;\n&lt;h4 id=\"faktilerge-negizdelgen-zhaene-vizualdy-derekterge-suejenetin-vlm-zhuejelerin-engizu-saldary\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#faktilerge-negizdelgen-zhaene-vizualdy-derekterge-suejenetin-vlm-zhuejelerin-engizu-saldary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фактілерге негізделген және визуалды деректерге сүйенетін VLM жүйелерін енгізу салдары&lt;/span&gt;&lt;/a&gt;Фактілерге негізделген және визуалды деректерге сүйенетін VLM жүйелерін енгізу салдары&lt;/h4&gt;\n&lt;p&gt;Біздің нәтижелеріміз пиксель немесе визуалды энкодер деңгейіндегі қорғаныс әдістерінің жеткіліксіз екенін көрсетеді. Энкодер түпкілікті нәтижеге қарамастан, барлық кескіндерді шамамен бірдей деңгейде бұрмалайды. Сондықтан, тек визуалды арнамен жұмыс істейтін қорғаныс (алдын ала өңдеу, энкодерді күшейту немесе пиксель статистикасын сүзу) модельдің мінез-құлқын анықтайтын сигналды көре алмайды. Болашағы бар бағыт — біріктіру блогы (merger) мен LLM-декодерінің арасына орнатылатын жеңіл аномалия детекторы, өйткені дәл осы жерде кескіндердің репрезентативті айырмашылығы ең жоғары болады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Визуалды энкодер деңгейіндегі қорғаныс тиімсіз; аномалия детекторын merger мен LLM-декодерінің арасына орналастыру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"khorghanys-mehanizmi\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#khorghanys-mehanizmi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорғаныс механизмі&lt;/span&gt;&lt;/a&gt;Қорғаныс механизмі&lt;/h4&gt;\n&lt;p&gt;Тіл моделінің ішкі қорғаныс механизмі бар: ол айқын семантикалық мазмұны бар кескіндер (мысалы, құстар немесе төсектер) үшін бәсекелес бұрмалауларды сенімді түрде жеңеді, бірақ күрделі көріністерде (жүк көліктері, пойыздар, ретсіз интерьерлер) дәрменсіз болады. Бұл ретсіз ортада жұмыс істейтін автономды агенттер үшін өте маңызды. Сонымен қатар, біздің нәтижелеріміз VLM сенімділігін бағалау тәсілін өзгертеді. Тек мақсатты фразамен сәйкестікті өлшейтін хаттамалар 0,0% сәттілікті көрсетіп, визуалды энкодердің бұзылғанын назардан тыс қалдыруы мүмкін. Біз семантикалық ығысуды және ішкі репрезентативті бұрмалауларды тікелей өлшеуді ұсынамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/semanticheskiy-dreyf.html\"&gt;Семантикалық ығысу&lt;/a&gt; — бұл сыртқы бұрмалаулар салдарынан модельдің визуалды белгілерді қате түсіндіре бастайтын мағыналық ауытқуы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h4&gt;\n&lt;p&gt;Зерттеу нәтижелері себеп-салдарлық емес, корреляциялық сипатқа ие. Біз 15–18-қабаттардағы басу себептерін растау үшін активацияларды жамау (activation patching) тәжірибелерін өткізген жоқпыз. Зерттеу бір модельмен (Qwen2.5-VL-7B-Instruct) және мақсатты жазбалардың бір түрімен шектелген. Біз қорытындыларымыздың барлық архитектуралар үшін әмбебап екенін мәлімдемейміз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бір модельмен және 200 кескінмен шектелген; қорытындыларды басқа архитектураларға автоматты түрде қолдануға болмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"etika-zhaene-akhparatty-ashu\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#etika-zhaene-akhparatty-ashu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Этика және ақпаратты ашу&lt;/span&gt;&lt;/a&gt;Этика және ақпаратты ашу&lt;/h4&gt;\n&lt;p&gt;Бұл жұмыс жаңа шабуыл әдісін жасамайды, керісінше, қолданыстағы осалдықтар класын сипаттайды. Біз механикалық талдауды қорғаныс саласындағы зерттеулерді қолдау үшін жариялаймыз және шабуылдардың оңтайландырылған чекпоинттарын таратпаймыз. Тәжірибелер жеке деректерге қатысты емес және тек ашық COCO val2017 жиынтығында өткізілді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-f1.jpg\" alt=\"1-сурет: 200 кескін және барлық үш нәтиже тобы бойынша әр токенге қатысты ықтималдықты талдау. Дұрыс алдыңғы А токені ко\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: 200 кескін және барлық үш нәтиже тобы бойынша әр токенге қатысты ықтималдықты талдау. Дұрыс алдыңғы А токені контексте бар болған жағдайда, _coconut мақсатты токенінің рангі әрбір кескін мен әрбір топ үшін, таза және қарсыласу (adversarial) деректері үшін де нөлдік дисперсиямен 3488 белгісіндегі түзу сызықты құрайды.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-f2.jpg\" alt=\"2-сурет: Барлық 28 LLM декодер қабаты бойынша топтар бөлінісінде мақсатты токен рангінің ығысуы (қарсыласу минус таза). \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Барлық 28 LLM декодер қабаты бойынша топтар бөлінісінде мақсатты токен рангінің ығысуы (қарсыласу минус таза). А тобы (сезімтал) процесс барысында мақсатқа қарай оң ығысуды сақтайды; С тобы (төзімді) шамамен 15–18-қабаттарда теріс ығысуға — таза деректердің базалық деңгейінен төмен белсенді басылуға ауысады.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;VLM оқыту мен&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қорытындылау&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алшақтығы&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;PGD шабуылдары&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;және logit&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;lens талдауы&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Декодер&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;визуалды&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұрмалауларды&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;басады&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI қорғанысы&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;декодерге&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бағытталуы&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тиіс&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/spa
