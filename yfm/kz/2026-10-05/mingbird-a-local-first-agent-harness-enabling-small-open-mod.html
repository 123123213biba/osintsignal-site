ama3.2:3b модельдері алынып тасталды, өйткені олар валидті құрал шақыруларын (tool calls) қалыптастыра алмады. Бұл біздің құралымыздың емес, модельдердің өз шектеуі. Матрицаға меншікті модельдер енгізілмеген, тек 5.5-бөлімдегі бір тестті қоспағанда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/validnost-vyzova-instrumentov.html\"&gt;Құрал шақыруының валидтілігі&lt;/a&gt; — бұл модельдің бағдарламалық орта түсінетін форматта (мысалы, JSON-схема) командалар генерациялау қабілеті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бағалау субъектілігі. Бағалау детерминистік және артефактілерге негізделген, бірақ критерийлердің өзі біз тарапынан жасалған. Ішінара баллдардың салмағы тапсырмалар құрылымы бойынша біздің көзқарасымызды көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"shekteuler-zhaene-naetizhelerdi-tuesindiru\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#shekteuler-zhaene-naetizhelerdi-tuesindiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер және нәтижелерді түсіндіру&lt;/span&gt;&lt;/a&gt;Шектеулер және нәтижелерді түсіндіру&lt;/h4&gt;\n&lt;p&gt;Ашкөз декодтауды (&lt;a href=\"concepts/greedy-decoding.html\"&gt;greedy decoding&lt;/a&gt;, temperature=0) пайдаланған кезде таңдау кездейсоқтығы жойылады, бірақ орындау деңгейіндегі өзгермелілік сақталады. Сол механизмді бірдей жағдайда қайта іске қосу ұзақ мерзімді тапсырмалар үшін 0,5–0,7-ге дейін, ал жұмыс процестері үшін 0,43-ке дейін ауытқуларға әкелді. Үш қайталанған сынақта тармақтың орташа мәні 0,069 шегінде өзгерді, ал жеке тапсырмалар үшін бұл айырмашылық 0,75-ке жетті. Осылайша, 5-кестедегі ұзақ мерзімді тапсырмалардың көрсеткіштері тұрақсыз және олар тек бір реттік таңдау ретінде қарастырылуы керек.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;5-кестедегі ұзақ мерзімді тапсырмалардың көрсеткіштері орындалу вариативтілігіне байланысты тұрақсыз, сондықтан оларды түпкілікті орташа мән емес, бір реттік өлшем ретінде қабылдау қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;τ²-ні салыстыру үшін бұлтты симулятор (qwen3.8-flash) қолданылған, сондықтан абсолютті ұпайлар көшбасшылар кестесімен салыстырылмайды, тек тармақаралық айырмашылық бақыланады. Бұлтты модельдер статикалық болмағандықтан, бүгінгі таңдағы қайталау симулятор мінез-құлқының өзгеруіне (drift) тап болуы мүмкін. Абляция зерттеуі (5.6-бөлім) тек бір 2B-модельде 18 тапсырма бойынша өткізілген, бұл механизмдердің өзара әрекеттесуін немесе үлкенірек модельдердегі жұмысын бағалауға мүмкіндік бермейді. Қауіпсіздікті бағалау (3.2.11-бөлім) 54 сынама негізінде жүргізілген; анықталған ағып кетулер жүйелік ереже кемшіліктері болып табылады.&lt;/p&gt;\n&lt;h4 id=\"talkhylau-zhaene-bolashakh-zhumystar\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#talkhylau-zhaene-bolashakh-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Талқылау және болашақ жұмыстар&lt;/span&gt;&lt;/a&gt;Талқылау және болашақ жұмыстар&lt;/h4&gt;\n&lt;p&gt;Нәтижелер кіші модельдер үшін «harness» (қабықша) мүмкіндіктердің үлкен бөлігін анықтайтынын көрсетеді. 2B-модельдерде бірдей модель әртүрлі қабықшалармен 0,017-ден 0,821-ге дейінгі табыстылықты көрсетеді. Сәтсіздік себептері (prefill толып кетуі, шексіз циклдар, парсинг қателері) қайта оқытуды қажет етпейтін инженерлік мәселелер болып табылады. 2B-модельдерде өнімділікке ең үлкен үлесті «finish gate» механизмі қосады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляция — жүйенің жеке компоненттерін кезекпен өшіру арқылы олардың жалпы нәтижеге қосқан үлесін анықтау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Болашақта Mingbird-ті macOS және Linux-қа көшіру жоспарланған, өйткені agent-mini нәтижелері платформаға сәйкестік модель мүмкіндіктерінен басым болуы мүмкін екенін көрсетеді. LRAB үшін адамдық базалық көрсеткішті (human baseline) жасау алынған ұпайларды калибрлеу үшін ең құнды қосымша болады. Сондай-ақ, әр механизмнің үлесін нақтылау үшін абляция зерттеулерін барлық модельдер матрицасы бойынша кеңейту жоспарланған.&lt;/p&gt;\n&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Біз Windows және Ollama үшін жергілікті агенттік орта — Mingbird жүйесін ұсындық. Ол шағын модельдердегі қателерді бірінші кезектегі инженерлік мақсаттар ретінде қарастырады. Бағалау толық жарияланған бақыланатын эксперимент негізінде жүргізілді: 288 ұяшық, төрт орындау ортасы, төрт ашық модель (2B–35B) бір машинада және артефактілерге негізделген детерминирленген бағалау жүйесі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird жалпы көрсеткіште 0,886 баллға жетті, ал үш базалық шешім 0,631, 0,479 және 0,405 балл көрсетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұзақ мерзімді жоспарлау сегментінде жүйе әр ұяшыққа бір талпыныста 0,827 көрсеткішіне қол жеткізді. τ2-bench жүйесіндегі сыртқы репликация (278 тапсырма, 4B моделі) тәсілдің тиімділігін растады: 0,856 балл, ал баламаларында 0,791 және 0,737. Озық (frontier) модельдегі сынақтар ақаулы орта (&lt;a href=\"concepts/scaffold.html\"&gt;scaffold&lt;/a&gt;) модель әлеуетінің жартысынан көбін жасырып қалатынын, ал сапалы орталардың айырмашылығы небәрі 0,072–0,12 болатынын көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Scaffold (қаңқа/орта) — тілдік модельге операциялық жүйемен және құралдармен өзара әрекеттесуге көмектесетін бағдарламалық қабық.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Механизмдерді алып тастау әдісі (ablation) нәтижелердегі басымдықтың негізгі үлесі «finish gate» (аяқтау шлюзі) механизміне тиесілі екенін көрсетті. Біз барлық нәтижелерді жарияладық, сондықтан оларды тәуелсіз тексеруге немесе жоққа шығаруға болады. Біздің нәтижелеріміз модельдің қабілетсіздігі деп саналатын мәселелердің басым бөлігі шын мәнінде ортадағы ақаулар екенін және оларды түзетуге болатынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу тек Windows және Ollama конфигурацияларымен шектелген; басқа орталарда нәтижелер өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f2.jpg\" alt=\"2-сурет: Префилл құнының өлшенген промпт ұзындығына тәуелділігі (log–log). x осі — бэкенд хабарлаған промпт токендерінің\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Префилл құнының өлшенген промпт ұзындығына тәуелділігі (log–log). x осі — бэкенд хабарлаған промпт токендерінің саны (prompt_eval_count); y осі — бэкендтің промптты бағалау уақыты, кэштеуді болдырмайтын (nonce) префиксі бар әр сұраныс үшін үш іске…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: Префилл құнының өлшенген промпт ұзындығына тәуелділігі (log–log). x осі — бэкенд хабарлаған промпт токендерінің саны (prompt_eval_count); y осі — бэкендтің промптты бағалау уақыты, кэштеуді болдырмайтын (nonce) префиксі бар әр сұраныс үшін үш іске қосудың медианасы. Жеке іске қосу мәндері сақталмаған, сондықтан қателік жолақтары (error bars) көрсетілмеген. Бос маркерлер: bench (19 құрал), full-configuration (31) және duplicated-schema (256) анкорлары. Үзік сызықтар — ең кіші квадраттар әдісімен жуықтау (4B: әр токенге 0,20 мс, R²=0,9991). Мәтінде келтірілген 774/797 токендік статикалық бюджеттер өлшеу нәтижелері емес, бағалау мәндері болып табылады және бұл осьте көрсетілмеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f4.jpg\" alt=\"4-сурет: LRAB тапсырма деңгейіндегі жылу картасы: 18 тапсырма (жолдар; LH-01–LH-03 жоғарыда, WF-01–WF-15 төменде, бөлінг\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: LRAB тапсырма деңгейіндегі жылу картасы: 18 тапсырма (жолдар; LH-01–LH-03 жоғарыда, WF-01–WF-15 төменде, бөлінген) × төрт байланыстырушы (бағандар); әр ұяшық төрт модель деңгейі бойынша орташа баллды білдіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: LRAB тапсырма деңгейіндегі жылу картасы: 18 тапсырма (жолдар; LH-01–LH-03 жоғарыда, WF-01–WF-15 төменде, бөлінген) × төрт байланыстырушы (бағандар); әр ұяшық төрт модель деңгейі бойынша орташа баллды білдіреді. Mingbird бағаны контурмен белгіленген. Сурет сәтсіздіктер құрылымын бір орташа мәннің артына жасырмай, көрінетін етеді: Mingbird-тің ең әлсіз тапсырмасы — WF-09 (0,70), ол орындау қатесі бар ұяшықты қамтиды, ал opencode LH-01 бойынша орташа 0,036, WF-09 бойынша agent-mini және goose орташа 0,071 және 0,643 баллға ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f6.jpg\" alt=\"6-сурет: LRAB бағасының ұяшыққа шаққандағы орындалу уақытына тәуелділігі (жарияланған CSV жолына бір нүкте; жазылған уақ\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: LRAB бағасының ұяшыққа шаққандағы орындалу уақытына тәуелділігі (жарияланған CSV жолына бір нүкте; жазылған уақыты жоқ жалғыз goose ұяшығы алынып тасталды, 287 нүкте қалды; логарифмдік уақыт осі; түс байланыстырушыны, маркер өлшемі модель деңгейін…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет: LRAB бағасының ұяшыққа шаққандағы орындалу уақытына тәуелділігі (жарияланған CSV жолына бір нүкте; жазылған уақыты жоқ жалғыз goose ұяшығы алынып тасталды, 287 нүкте қалды; логарифмдік уақыт осі; түс байланыстырушыны, маркер өлшемі модель деңгейін кодтайды). Үзік тік сызықтар ұяшыққа арналған бюджеттерді белгілейді (workflow ұяшықтары үшін 90 минут, long-horizon үшін 180 минут); бюджетін тауысқан ұяшық 0 балл алады. 80 секундтан төмен жылдам, бірақ бос кластер agent-mini үшін 35B платформалық сәйкессіздік ұяшықтарын қамтиды, ал баяу, бірақ мазмұнды «құйрық» бөлігінде goose басым. Сурет 4.5-бөлімдегі бюджеттік баға белгілеу хаттамасының визуалды түрі: ешбір ось жеке өзі артықшылық бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f7.jpg\" alt=\"7-сурет: Домендер және топтар бойынша τ2-benchpass@1 көрсеткіштері (114 тапсырма retail, 50 airline, 114 telecom; агентт\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Домендер және топтар бойынша τ2-benchpass@1 көрсеткіштері (114 тапсырма retail, 50 airline, 114 telecom; агенттік жағы әрқашан бірдей жергілікті qwen3.5:4b моделі, 0 температура және өшірілген ойлау процесімен, ал пайдаланушы симуляторы әрқашан…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет: Домендер және топтар бойынша τ2-benchpass@1 көрсеткіштері (114 тапсырма retail, 50 airline, 114 telecom; агенттік жағы әрқашан бірдей жергілікті qwen3.5:4b моделі, 0 температура және өшірілген ойлау процесімен, ал пайдаланушы симуляторы әрқашан бірдей бұлтты модель). «Мұртшалар» (whiskers) — тапсырма деңгейіндегі бутстреп әдісімен алынған 95% сенімділік интервалдары. Үш аяқталған топ қатесіз әрекеттермен жұмысты аяқтады. telecom қанығуға жақын (1,000/0,991/0,930); goose тобы өткізу қабілетіне байланысты кейінге қалдырылды және көрсетілмеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f9.jpg\" alt=\"9-сурет: Бір механизмді алып тастау абляциясы (v1.5.0 код базасы, LRAB тапсырмалар жиынтығы, gemma4:e2b, әр топқа n = 18\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет: Бір механизмді алып тастау абляциясы (v1.5.0 код базасы, LRAB тапсырмалар жиынтығы, gemma4:e2b, әр топқа n = 18; базалық деңгей — 9-кестедегі бірдей кодты толық механизмдер тобы).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-сурет: Бір механизмді алып тастау абляциясы (v1.5.0 код базасы, LRAB тапсырмалар жиынтығы, gemma4:e2b, әр топқа n = 18; базалық деңгей — 9-кестедегі бірдей кодты толық механизмдер тобы). Солда: әр өшірілген механизм үшін орташа баллдың өзгеруі, 10 000 тапсырма деңгейіндегі қайта таңдау бойынша бутстреп 95% сенімділік интервалдарымен (finish gate (−0,266, +0,063), verification feedback (−0,185, +0,076), anti-loop (−0,134, +0,092), flat prefill (−0,119, +0,093); әр интервал нөлді кесіп өтеді, сондықтан әсерлер бағытталған; тек finish-gate бағаны боялған, ол ең үлкен бірлік дельтаны белгілейді — бояу бөлек статистикалық мәртебеге ие емес). Оңда: тапсырмалар бойынша өзгерістер, тапсырмалар тобы бойынша боялған (LH және WF). Төрт топ бойынша LH-сегментінің төмендеуінің көп бөлігі LH-01-дің жалпы себепті ығысуымен байланысты, ол әр топта төмендейді (5.6-бөлімдегі сезімталдық); осы дизайн бойынша механизм деңгейіндегі отбасылық бөліністі оқу мүмкін емес. WF тобы да өзгеріссіз қалмады: verification feedback-ті өшіру WF орташа мәнін +0,033 (сәл жақсырақ) деңгейінде қалдырады, ал finish-gate тобының WF орташа мәні +0,074-ті құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Кіші модельдер&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тапсырманы&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;орындамайды&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Mingbird&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қабықшасын&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LRAB-та сынау&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Дәлдік&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;0,886-ға дейін&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өсті&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Қабықша модель&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;көлемінен&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;маңыздырақ&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;datasets&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Hao Wang, Ting Huang&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/abs/2610.02001v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/pdf/2610.02001v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.48550/arxiv.2610.02001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;doi.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Метаданные Crossref&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://api.crossref.org/works/10.48550/arxiv.2610.02001\" target=\"_blank\" rel=\"noreferrer noopener\"
