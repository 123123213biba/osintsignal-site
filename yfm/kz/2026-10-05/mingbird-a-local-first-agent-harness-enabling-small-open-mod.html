        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"99\" cy=\"62\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"541\" cy=\"294\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кіші нейрожелілер неге&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;тапсырмаларды орындай&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;алмайды: мәселе интеллектте&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;емес&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f2.jpg\" alt=\"2-сурет: Префилл құнының өлшенген промпт ұзындығына тәуелділігі (log–log). x осі — бэкенд хабарлаған промпт токендерінің\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: &lt;a href=\"concepts/prefill.html\"&gt;Префилл&lt;/a&gt; құнының өлшенген промпт ұзындығына тәуелділігі (log–log). x осі — бэкенд хабарлаған промпт токендерінің саны (prompt_eval_count); y осі — бэкендтің промптты бағалау уақыты, кэштеуді болдырмайтын (nonce) префиксі бар әр сұраныс үшін үш іске…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: Префилл құнының өлшенген промпт ұзындығына тәуелділігі (log–log). x осі — бэкенд хабарлаған промпт токендерінің саны (prompt_eval_count); y осі — бэкендтің промптты бағалау уақыты, кэштеуді болдырмайтын (nonce) префиксі бар әр сұраныс үшін үш іске қосудың медианасы. Жеке іске қосу мәндері сақталмаған, сондықтан қателік жолақтары (error bars) көрсетілмеген. Бос маркерлер: bench (19 құрал), full-configuration (31) және duplicated-schema (256) анкорлары. Үзік сызықтар — ең кіші квадраттар әдісімен жуықтау (4B: әр токенге 0,20 мс, R²=0,9991). Мәтінде келтірілген 774/797 токендік статикалық бюджеттер өлшеу нәтижелері емес, бағалау мәндері болып табылады және бұл осьте көрсетілмеген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Кіші тілдік модельдерді көп сатылы тапсырмаларды орындай алмағаны үшін жиі сынайды. Авторлар мәселе модельде емес, контекстті шамадан тыс жүктейтін және қателерді түзете алмайтын «&lt;a href=\"concepts/harness.html\"&gt;harness&lt;/a&gt;» (бағдарламалық қабықша) жүйесінде екенін дәлелдейді. &lt;a href=\"concepts/mingbird.html\"&gt;Mingbird&lt;/a&gt; құралы осы кемшіліктерді жойып, кіші модельдерге ірі жүйелермен бәсекелесуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Стандартты агенттік қабықшалар кіші модельдердің контекстін шамадан тыс жүктейді.&lt;/li&gt;\n&lt;li&gt;Mingbird он түрлі механизмнің көмегімен тапсырманы орындау дәлдігін 0,886-ға дейін арттырады.&lt;/li&gt;\n&lt;li&gt;Кіші модельдердің тиімділігі бағдарламалық қабықшаның сапасына тікелей байланысты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер LRAB (&lt;a href=\"concepts/local-real-task-agent-benchmark.html\"&gt;Local Real-task Agent Benchmark&lt;/a&gt;) бақылау тәжірибесін өткізіп, төрт бағдарламалық қабықшаны (Mingbird, goose, opencode, agent-mini) 2B-ден 35B-ге дейінгі модельдермен сынап көрді. 288 тест барысында бұлтты модельдерге арналған стандартты қабықшалар кіші нейрожелілерде «цикл» және тапсырмаларды мерзімінен бұрын аяқтау сияқты қателерді тудыратыны анықталды. Mingbird он түрлі қорғаныс механизмін, соның ішінде байт деңгейіндегі префилл бюджеті мен нәтижені тексеретін «аяқтау шлюзін» енгізеді.&lt;/p&gt;\n&lt;p&gt;Нәтижелер Mingbird-тің 0,886 жалпы дәлдікке жетіп, бәсекелестерді (0,405–0,631) айтарлықтай басып озғанын көрсетеді. τ²-bench (278 тапсырма) бойынша сыртқы тексеру жүйенің 0,856 көрсеткішпен көш бастағанын растады. Авторлар бұл жаңа оқыту алгоритмдері емес, өзара әрекеттесу кемшіліктерін жоятын инженерлік шешім екенін атап өтті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер өзіміз жасаған бенчмаркқа, бір компьютердегі тестілеуге және әр тапсырманың бір ғана талпынысына негізделген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Шағын тілдік модельдер (2–9 млрд параметр) қарапайым ноутбуктерде жұмыс істей алады, бірақ бұлтты агенттік орталарда олар нақты тапсырмаларды орындауда жиі қиналады. Негізгі мәселелерге контексттің толып кетуі, өзін-өзі түзету кезіндегі қателіктер, құралдар демонстрациясының тұйықталуы және тапсырмадан жасырын бас тарту жатады. Зерттеу көрсеткендей, бұл сәтсіздіктердің басым бөлігі модельдердің өзіне емес, ортаның (harness) архитектурасына байланысты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шағын модельдердің тапсырмаларды орындау кезіндегі сәтсіздіктерінің басым бөлігі нейрондық желілердің шектеулерінен емес, басқару ортасының жетілмегендігінен екенін дәлелдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар Windows және Ollama үшін жергілікті орындауға бағытталған Mingbird агенттік ортасын ұсынады. Жүйе шағын модельдердің типтік қателерін өтейтін 10 механизмді қамтиды. Олардың ішіндегі негізгілері: байт деңгейіндегі алдын ала толтыру (prefill) бюджеті, тапсырманы растау алдында қайта оқитын «аяқтау қақпасы» (&lt;a href=\"concepts/completion-gate.html\"&gt;finish gate&lt;/a&gt;) және &lt;a href=\"concepts/signatura.html\"&gt;сигнатура&lt;/a&gt; деңгейіндегі циклдарды анықтау.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агенттік орта (harness) — бұл модельдің сыртқы құралдармен, файлдармен және компьютер интерфейстерімен өзара әрекеттесуін басқаратын бағдарламалық қабықша.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LRAB жиынтығындағы бақыланатын салыстыруда (4 орта × 4 модель 2B-ден 35B-ге дейін × 18 тапсырма) Mingbird 0,886 жалпы көрсеткішке жетті, ал басқа орталардың көрсеткіштері 0,631 (goose), 0,479 (opencode) және 0,405 (agent-mini) болды. τ2-bench (278 тапсырма) бенчмаркінде нәтиже 0,856-ны құрады (бәсекелестерде 0,791 және 0,737). Озық модельдерді (frontier models) сынау кезінде орталар арасындағы нәтижелердің алшақтығы 0,997-ден 0,478-ге дейін болды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жеке механизмдерді өшіру (&lt;a href=\"concepts/ablyatsiya.html\"&gt;абляция&lt;/a&gt;) талдауы тек бағыттаушы сипатқа ие, өйткені нәтижелердің ауытқуы жоғары: бір түнде қайта іске қосу 0,069-ға дейінгі айырмашылықты бере алады, бұл жеке механизмдердің әсерімен шамалас.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Ашық салмақтағы (2–9 млрд параметр) тілдік модельдер практикалық қолдану шегінен өтті. Интеграцияланған графикалық процессоры және 16–32 ГБ ортақ жады бар қарапайым ноутбукта олар аудару, түйіндеме жасау және түсіндіру сияқты тапсырмаларды орындай алады. Алайда, мұндай модельдер көп сатылы тапсырмаларды (код жазу, деректерді іздеу, файлдарды басқару) дербес орындайтын агент ретінде жұмыс істей алмайды деген пікір бар. Авторлар бұл көзқарасқа қарсы шығып, шектеу модельдің өзінде емес, оны басқаратын бағдарламалық қабықшада (harness) екенін алға тартады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Негізгі қорытынды: кіші модельдердің (2–9 млрд параметр) қателері көбінесе архитектурамен емес, басқарушы қабықшаның тиімсіздігімен байланысты, бұл инженерлік әдістер арқылы түзетіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2 млрд параметрлі модельді стандартты бұлтты фреймворктарда қолданғанда, авторлар жүйелі ақауларды байқады: контексттің статикалық деректермен толып кетуі, модельдің қате функция шақырылғаннан кейін өзін-өзі түзете алмауы және тапсырманы орындамай тұрып аяқталды деп жариялауы. Осы мәселелерді шешу үшін Windows және Ollama-ға арналған Mingbird агенттік қабықшасы жасалды. Ол 10 негізгі механизмді және бес деңгейлі қауіпсіздік моделін (1.6.0 нұсқасы) қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Harness (қабықша) — бұл тілдік модельді сыртқы құралдармен (іздеу, файл жүйесі, кодты орындау) байланыстыратын және оның дербес жұмыс істеуін қамтамасыз ететін бағдарламалық орта.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mingbird тиімділігін бағалау үшін авторлар LRAB (Local Real-task Agent Benchmark) бақыланатын тәжірибесін өткізді (4 қабықша, 4 модель және 18 нақты тапсырма, барлығы 288 деректер ұяшығы). Сынақтарда Mingbird 0,886 нәтиже көрсетті (аналогтар үшін 0,405–0,631). Маңыздысы, Mingbird кіші модельдерде (2B) тиімділігі күрт төмендемейтін жалғыз қабықша болып табылады (0,821-ге қарсы 0,017–0,271). Тәуелсіз τ2-bench тестінде (278 тапсырма) Mingbird 0,856 нәтижемен бәсекелестерден (0,791 және 0,737) басым түсті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу инженерлік сипатқа ие: авторлар жаңа оқыту алгоритмдерін ұсынбайды, тек модельдің құралдармен өзара әрекеттесуін оңтайландыруға назар аударады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"agent-paradigmalary\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#agent-paradigmalary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агент парадигмалары&lt;/span&gt;&lt;/a&gt;Агент парадигмалары&lt;/h4&gt;\n&lt;p&gt;Қазіргі агенттік жүйелер ReAct тәсіліне негізделген: модель пайымдау мен құралдарды шақыруды кезектестіріп орындайды, ал сыртқы орта (harness) бұл шақыруларды орындап, нәтижені қайтарады. Toolformer және Gorilla сияқты құралдар модельдерді API шақыруға үйрету және интерфейстерді стандарттау үшін негіз қалады. Reflexion және Self-Refine сияқты жақсарту әдістері модельдің өзін-өзі сынау қабілетіне сүйенеді. Алайда, шағын модельдер бұл тапсырманы жиі орындай алмайды. Mingbird орындау ортасын жетілдіруге назар аударады: ол модельден абстрактілі өзін-өзі жетілдіруді талап етпейді, керісінше, модельдің не «көретінін», қашан тоқтайтынын және қателерді қалай өңдейтінін басқарады. Mingbird шағын модельдер жүйелі түрде қате жіберетін тұстарда қатаң шектеулер (guardrails) орнатылған агент ретінде жұмыс істейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird назарды шағын модельді өзін-өзі сынауға үйретуден, модельдің типтік қателерін нақты уақыт режимінде түзететін қатаң орындау ортасын құруға ауыстырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"agent-benchmarkteri\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#agent-benchmarkteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агент бенчмарктері&lt;/span&gt;&lt;/a&gt;Агент бенчмарктері&lt;/h4&gt;\n&lt;p&gt;AgentBench, AgentBoard, WebArena және SWE-bench сияқты платформалар агенттерді веб-серфингтен бастап GitHub-тағы тапсырмаларды шешуге дейінгі әртүрлі орталарда бағалайды. Біздің тәсілімізге ең жақыны τ-bench және τ2-bench болып табылады, мұнда &lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;пайдаланушы симуляторы&lt;/a&gt; агентпен қарым-қатынас жасайды және бағалау дерекқордың соңғы күйіне негізделеді. LRAB олардан мақсатымен ерекшеленеді: бұл модельдерді рейтингтеу емес, қатаң хаттама, бір машина және детерминирленген бағалау арқылы орындау ортасының (harness) әсерін оқшауланған түрде зерттеу.&lt;/p&gt;\n&lt;h4 id=\"zhergilikti-zhaene-shaghyn-modelderde-khorytyndy-shygharu\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#zhergilikti-zhaene-shaghyn-modelderde-khorytyndy-shygharu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жергілікті және шағын модельдерде қорытынды шығару&lt;/span&gt;&lt;/a&gt;Жергілікті және шағын модельдерде қорытынды шығару&lt;/h4&gt;\n&lt;p&gt;Llama.cpp және Ollama құралдары квантталған модельдерді тұтынушылық жабдықтарда тиімді іске қосуды қамтамасыз етті. SmolLM2, Gemma және Qwen сияқты модельдерді зерттеу олардың параметр бойынша тиімділігін арттырады. Алайда, орындау ортасы (harness) әлі күнге дейін қуатты модельдер мен Unix-тәрізді жүйелерге арналған бұлтты тәжірибелерден алынған. Mingbird басқа сегментте жұмыс істейді: 2–9B модельдер, Windows ОЖ, орнатылған GPU және код, файлдар мен ақпарат іздеуді біріктірген тапсырмалар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Harness (орындау ортасы) — бұл модельді сыртқы құралдармен байланыстыратын, тапсырмалар кезегін басқаратын және модельдің жүйемен өзара әрекеттесуінде туындайтын қателерді өңдейтін бағдарламалық қабықша.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"inzhenerlik-zhuejeler\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#inzhenerlik-zhuejeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инженерлік жүйелер&lt;/span&gt;&lt;/a&gt;Инженерлік жүйелер&lt;/h4&gt;\n&lt;p&gt;SWE-agent, OpenHands, Cline және aider сияқты жүйелер қуатты модельдер мен POSIX орталары үшін оңтайландырылған. Mingbird оларды толықтырады және Windows операциялық жүйесіндегі қарапайым ноутбуктерде шағын модельдермен жұмыс істейді. Біз шағын модельдердің ақауларынан қорғау механизмдерін негізгі жобалау нысаны деп санаймыз.&lt;/p&gt;\n&lt;p&gt;Орындау ортасының әсері — бұл мойындалған факт (Zhang және Starace зерттеулері көрсеткендей, harness конфигурациясы нәтижені 28 ұпайға дейін өзгерте алады). Біздің үлесіміз Windows/Ollama ортасындағы 2–9B модельдер үшін осы әсерді декомпозициялаудан тұрады. Біз шағын модельдердің типтік ақаулары мен оларды түзету механизмдерінің инвентарын жасадық. Мысалы, біздің M4 детекторымыз OpenHands-тегі StuckDetector сияқты қайталану циклдарын бақылайды, бірақ оны құрал атаулары мен аргументтерін нормалау және эскалация сатысымен толықтырады. Біздің тәсіліміздің жаңалығы — қатаң prefill лимиті және модельді «орындалды» демес бұрын тапсырманы қайта оқуға мәжбүрлейтін «аяқтау қақпасы» (completion &lt;a href=\"concepts/gate.html\"&gt;gate&lt;/a&gt;), бұл контекстті толтыруға немесе мерзімінен бұрын аяқтауға бейім шағын модельдер үшін өте маңызды.&lt;/p&gt;\n&lt;h4 id=\"arhitekturagha-sholu\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#arhitekturagha-sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Архитектураға шолу&lt;/span&gt;&lt;/a&gt;Архитектураға шолу&lt;/h4&gt;\n&lt;p&gt;Mingbird — бұл толығымен пайдаланушы құрылғысында жұмыс істейтін жергілікті агент (модель, құралдар, сөйлеуді тану, жад). Жалғыз сыртқы сұраныс — пайдаланушы баптаған іздеу жүйесі. Жүйе &lt;a href=\"concepts/inferens.html\"&gt;инференс&lt;/a&gt; үшін қосымша жүктеме қоспайды. 1.6.0 нұсқасында статикалық префилл (модель тапсырманы бастамас бұрын көретін деректер көлемі) 797 токенді құрайды. Архитектура (1-сурет) агент циклін басқаратын GUI және &lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt;-ді қамтиды. Цикл тапсырмаларды маршруттауды (M1), жіктеуді (чат/тапсырма, M2), құралдарды қауіпсіз орындауды (M6, M8), циклдарды мониторингтеуді (M4) және аяқталуды тексеруді (M3) қамтиды. Тұрақтылық қабаты (M7) қателерді бақылау нүктелері арқылы басқарады. Backend Ollama-ны қолданады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статикалық префилл 797 токенмен шектелген, бұл модельдің артық контекст салдарынан сапасын жоғалтуына жол бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mehanizmder\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#mehanizmder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механизмдер&lt;/span&gt;&lt;/a&gt;Механизмдер&lt;/h4&gt;\n&lt;p&gt;1-кесте әрбір механизмді олар жоятын қате түрлерімен байланыстырады.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; Mingbird механизмдері және олар шешетін шағын модельдегі істен шығу формалары&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Механизм&lt;/th&gt;\n&lt;th&gt;Шешілетін істен шығу формасы&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;M1&lt;/td&gt;\n&lt;td&gt;Тегіс префилл, схемаға бай құралдардан net-zero бюджетінің контекстінің асып кетуі&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M2&lt;/td&gt;\n&lt;td&gt;Чат/тапсырма қабаттары, кездейсоқ чат енгізуінен құралдарды көрсету циклдары&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M3&lt;/td&gt;\n&lt;td&gt;Finish gate + жоспарды қайта енгізу, мерзімінен бұрын немесе жалған аяқталу туралы мәлімдемелер&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M4&lt;/td&gt;\n&lt;td&gt;Қолтаңба деңгейіндегі анти-цикл, қайталанатын бірдей құрал шақырулары, шығыс жоқ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M5&lt;/td&gt;\n&lt;td&gt;Жалған аяқталу және форматты құтқару, қарапайым мәтін ретінде шығарылған құрал шақырулары; қайталанатын қате шақырулар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M6&lt;/td&gt;\n&lt;td&gt;Өңдеу қауіпсіздігі (.bak), модель жоя алмайтын деструктивті өңдеулер&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M7&lt;/td&gt;\n&lt;td&gt;Төзімділік қабаты, оқу ағынының үнсіз қателері, бос айналымдар, аяқталған іске қосулар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M8&lt;/td&gt;\n&lt;td&gt;Қауіпсіздік шекарасы, каталогтан тыс жазу, тіркелгі деректерінің ашылуы, қосалқы агенттердің таралуы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M9&lt;/td&gt;\n&lt;td&gt;Мүмкіндіктер беті, дауыс, көру, жад, MCP, префилл өсуінсіз дағдылар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M10&lt;/td&gt;\n&lt;td&gt;Сапа базасы, регрессиялар, әсіресе префилл өсуі&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M14&lt;/td&gt;\n&lt;td&gt;Бес сақиналы қауіпсіздік моделі (v1.6.0), құралдарды импульсивті пайдаланудан жүйенің қайтымсыз зақымдануы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;M1–M10, сонымен қатар бес сақиналы қауіпсіздік моделі v1.6.0 (M14).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"m1-taza-noeldik-byudzhetpen-tegis-toltyru-flat-prefill\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m1-taza-noeldik-byudzhetpen-tegis-toltyru-flat-prefill\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M1: Таза нөлдік бюджетпен тегіс толтыру (Flat prefill)&lt;/span&gt;&lt;/a&gt;M1: Таза нөлдік бюджетпен тегіс толтыру (Flat prefill)&lt;/h4&gt;\n&lt;p&gt;Мәселе: бұлтты құралдар манифестерін пайдаланған кезде, 2–9B модельдер тапсырма басталғанға дейін мыңдаған токен жұмсайды, бұл нұсқауларды орындау дәлдігін төмендетеді. Механизм: жүйе тапсырма доменін жіктейді және тек қажетті құралдарды тегіс форматта жүктейді. Кез келген жаңа функция статикалық префилл бойынша «нөлдік бюджетке» ие болуы керек, бұл CI тесттері (M10) арқылы тексеріледі. Ымыра: маршрутизатор қателесуі мүмкін, бірақ жүйе қайта маршруттауға рұқсат береді. 4B модельдер үшін өңдеу уақыты сызықтық (~0,20 мс/токен), ал 2B модельдер үшін супер-сызықтық өседі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Префилл — бұл модель жауап генерацияламас бұрын өңдейтін деректер көлемі; «тегіс» формат иерархиялық құрылымдардың жоқтығын білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m2-chat/tapsyrmany-khabattau\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m2-chat/tapsyrmany-khabattau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M2: Чат/тапсырманы қабаттау&lt;/span&gt;&lt;/a&gt;M2: Чат/тапсырманы қабаттау&lt;/h4&gt;\n&lt;p&gt;Мәселе: шағын модельдер қарапайым сұрақтарға жауап беру кезінде құралдарды «көрсетіп», шексіз циклге түсіп кетуі мүмкін. Механизм: «чат» және «тапсырма» режимдері бөлінеді. Чатта құралдар шектелген, жауаптан кейін цикл тоқтайды. Тапсырма режимі толық қолжетімділікті ашады. Ымыра: жіктегіш тарихта артефактілер болса, тапсырма режиміне бейім болады.&lt;/p&gt;\n&lt;h4 id=\"m3-ayakhtau-khakhpasy-zhaene-oryndalu-uakhytyndaghy-suranysty-khajta-engizu\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m3-ayakhtau-khakhpasy-zhaene-oryndalu-uakhytyndaghy-suranysty-khajta-engizu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M3: Аяқтау қақпасы және орындалу уақытындағы сұранысты қайта енгізу&lt;/span&gt;&lt;/a&gt;M3: Аяқтау қақпасы және орындалу уақытындағы сұранысты қайта енгізу&lt;/h4&gt;\n&lt;p&gt;Мәселе: модельдер тапсырманы толық орындамай «үнсіз» аяқтауы немесе контекст сығылғаннан кейін табыс критерийлерін жоғалтуы мүмкін. Механизм: аяқтауды қабылдамас бұрын жүйе модельді нәтижені тапсырма мәтінімен тармақ бойынша салыстыруға мәжбүрлейді. Жоспар сығылғаннан кейін қайта енгізіледі. Ымыра: бұл модельге қосымша бір сұранысты талап етеді, бірақ «үнсіз бас тартуды» аяқтауға немесе кедергіні нақты сипаттауға айналдырады.&lt;/p&gt;\n&lt;h4 id=\"m4-cikldi-anykhtau\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m4-cikldi-anykhtau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M4: Циклді анықтау&lt;/span&gt;&lt;/a&gt;M4: Циклді анықтау&lt;/h4&gt;\n&lt;p&gt;Механизм құралдарды шақыру сигнатураларын (атауы мен қалыпқа келтірілген аргументтер) қадағалайды. Жүйе 6 бірдей шақыру немесе 15 нәтижесіз шақыру болғанда іске қосылады. v1.5.0 нұсқасында ішінара шығыс пен бос жауаптардың кезектесуі есептегіштерді қайта орнататын қате түзетілді. Файлдарды оқу үшін 64 КБ-тан 512 КБ-қа дейінгі шектеу енгізілді; шектен асқанда, файлды «айналып өтуді» жалғастыру үшін позицияны сақтай отырып, алғашқы 2000 таңба қайтарылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Циклді анықтау және файлдарды оқу шектеулерін енгізу 4B моделіне тапсырманы 156 шақырудың орнына 15 шақыруда аяқтауға мүмкіндік берді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сигнатура — бұл шақырудың бірегей идентификаторы, ол модель аргументтер жазылуын сәл өзгертсе де, бір әрекетті қайталап жатқанын жүйеге түсінуге көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m5-zhalghan-ayakhtaludy-khabyldamau-zhaene-pishimdi-tuezetu\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m5-zhalghan-ayakhtaludy-khabyldamau-zhaene-pishimdi-tuezetu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M5: Жалған аяқталуды қабылдамау және пішімді түзету&lt;/span&gt;&lt;/a&gt;M5: Жалған аяқталуды қабылдамау және пішімді түзету&lt;/h4&gt;\n&lt;p&gt;Жүйе модель тапсырманы артефактісіз орындалды деп жариялаған немесе құрал шақыруын қарапайым мәтін түрінде (мысалы, мәтін ішіндегі JSON) шығарған жағдайларды өңдейді. Механизм пішімдеу қателерінің үш түрін таниды және оларды орындалатын шақыруларға айналдырады. Қатаң схеманы сақтаудың орнына, 2–9B модельдері үшін «кері байланыспен түзету» стратегиясы қолданылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пішім қателерін құрылымдық түзету агент жұмыз агент жұмыз агент жұмысын қате синтаксис салдарынан мәжбүрлі тоқтатусыз қалпына келтіруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қатаң парсингсіз эвристикалық түзетуді қолдану, егер пішім белгіленген үш үлгіге сәйкес келмесе, модель ниеттерін қате түсіндіруге әкелуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m6-oengdeu-khauipsizdigi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m6-oengdeu-khauipsizdigi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M6: Өңдеу қауіпсіздігі&lt;/span&gt;&lt;/a&gt;M6: Өңдеу қауіпсіздігі&lt;/h4&gt;\n&lt;p&gt;Файлдарды өңдеудегі қателер салдарынан деректер жоғалуының алдын алу үшін әрбір жазу әрекеті автоматты түрде сақтық көшірме (.bak) жасайды. Модель өз бетінше алдыңғы нұсқаға қайтуды бастай алады. Механизм әдейі жеңілдетілген: ол күрделі салыстыру (diff) алгоритмдерін қолданбайды, бұл оны модельдің өзі үшін түсінікті етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/rezervnoe-kopirovanie.html\"&gt;Сақтық көшірмелеу&lt;/a&gt; — бұл қате орын алғанда жұмыс күйіне қайту үшін өзгерістер енгізгенге дейін файл көшірмесін жасау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m7-turakhtylykh-kodtau,-bos-zhauaptar,-bakhylau-nuekteleri\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m7-turakhtylykh-kodtau,-bos-zhauaptar,-bakhylau-nuekteleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M7: Тұрақтылық (кодтау, бос жауаптар, бақылау нүктелері)&lt;/span&gt;&lt;/a&gt;M7: Тұрақтылық (кодтау, бос жауаптар, бақылау нүктелері)&lt;/h4&gt;\n&lt;p&gt;Стандартты емес кодтауларды (мысалы, Windows-тағы GBK) оқудағы ақаулардың алдын алу үшін таңбаларды алмастырумен UTF-8 декодтау қолданылады. Бос генерациялар немесе әрекетсіз «ойлау қабықшалары» жұмыс процесін қайта орнатуға әкеледі. Бақылау нүктелері жүйесі үзіліп қалған жұмысты соңғы орындалған қадамнан жалғастыруға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау нүктелерін енгізу және декодтауда таңбаларды алмастыру стандартты емес деректер ағындарымен жұмыс істегенде жүйенің «қатып қалуын» жойды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m8-khauipsizdik-shekaralary\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m8-khauipsizdik-shekaralary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M8: Қауіпсіздік шекаралары&lt;/span&gt;&lt;/a&gt;M8: Қауіпсіздік шекаралары&lt;/h4&gt;\n&lt;p&gt;Агенттің жұмыс каталогынан шығып кетуінің алдын алу үшін қалыпқа келтірілген жолдарды тексеру қолданылады. Маңызды файлдарға (мысалы, .&lt;a href=\"concepts/speculative-safety-honeypot.html\"&gt;ssh&lt;/a&gt;, .env) кіру шектелген, ал рұқсат етілген аймақтан тыс операциялар пайдаланушыдан графикалық интерфейс арқылы растауды талап етеді. Әдепкі бойынша параллель суб-агенттер құруға тыйым салынған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қауіпсіздікті функционалдылықтан жоғары қою (параллелизмге тыйым салу және кіруді растау) жүйені маман емес пайдаланушылардың жеке компьютерлерінде жұмыс істеуге жарамды етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m9-muemkindikter-beti\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m9-muemkindikter-beti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M9: Мүмкіндіктер беті&lt;/span&gt;&lt;/a&gt;M9: Мүмкіндіктер беті&lt;/h4&gt;\n&lt;p&gt;Дизайн концепциясы. M9 тобы M1 бюджетіне (статикалық префиллдің нөлдік өсуі) сыюы тиіс функцияларды біріктіреді. Дауыстық енгізу жергілікті STT (Speech-to-Text) моделін пайдаланады, ол CPU-да нақты уақыттан шамамен 20× жылдам жұмыс істейді және сөздің аяқталғанын автоматты түрде анықтайды. Көру қабілеті хабарлама жүктемесіндегі кескіндерді оқу арқылы жүзеге асырылады (төрт модельде тексерілген). Сессия жады тұрақты және іздеуге болады. MCP серверлері JSON конфигурациясы арқылы қосылады. Дағдылар (skills) прогрессивті түрде ашылатын Markdown файлдары ретінде сақталады, бұл ондаған дағдыны бірнеше жүз токен контекстіне сығымдауға мүмкіндік береді. Модель идентификаторы мен контекст ұзындығы Ollama арқылы автоматты түрде анықталады (әдепкі бойынша 128K, 256K-ға дейін).&lt;/p&gt;\n&lt;p&gt;Тапсырма уақытын шектеу әдепкі бойынша өшірілген. Пайдаланушы бюджетті қарапайым тілде белгілейді және ол таусылғанда жүйе модельді нәтижені аяқтауға итермелейді. Жергілікті модельдерді пайдаланушылар уақытқа сезімтал болғандықтан, шектеулі уақыт ішінде максималды нәтижеге қол жеткізу тиімдірек.&lt;/p&gt;\n&lt;p&gt;Келісім (Trade-off). Прогрессивті ашылу модель қай дағды файлын ашу керектігін білуі тиіс екенін білдіреді. Дағдылар индексі тұрақты контекстте сақталады, бұл бір оқуды талап етеді. Бұл мүмкіндіктердің өзі жаңалық емес; оларды біріктіретін шектеу (статикалық префиллдің өспеуі) негізгі үлес болып табылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;M9-дың негізгі үлесі – статикалық префиллге қатаң шектеу қоя отырып, көптеген функцияларды интеграциялау, бұл динамикалық контекстті басқару арқылы жүзеге асады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m10-sapa-bazasy\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m10-sapa-bazasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M10: Сапа базасы&lt;/span&gt;&lt;/a&gt;M10: Сапа базасы&lt;/h4&gt;\n&lt;p&gt;Механизм. Тесттер CI (v1.6.0) ортасында орындалады. Негізгі екі тұжырым маңызды: байт деңгейіндегі префиллдің нөлге теңдігі (M1) және циклдарды анықтау шектері (M4). Келісімнің мәні – тесттер жиынтығы енгізу жылдамдығын шектейді: әрбір өзгеріс префилл бюджетін сақтауы керек, бұл басқа қолайлы дизайн нұсқаларын (мысалы, күрделі жүйелік промпттар) қабылдамауға әкелді.&lt;/p&gt;\n&lt;h4 id=\"m14-bes-denggejli-khauipsizdik-modeli-v160\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m14-bes-denggejli-khauipsizdik-modeli-v160\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M14: Бес деңгейлі қауіпсіздік моделі (v1.6.0)&lt;/span&gt;&lt;/a&gt;M14: Бес деңгейлі қауіпсіздік моделі (v1.6.0)&lt;/h4&gt;\n&lt;p&gt;Механизм. Қауіпсіздік бес деңгейге бөлінген: суб-агенттер шектеулі құқықтармен «&lt;a href=\"concepts/sandbox.html\"&gt;құмсалғыш&lt;/a&gt;» (sandbox) ішінде жұмыс істейді; қайтымсыз операциялар (пішімдеу, дискіге жазу) блокталған; жүйені өзгертетін әрекеттер оператордың қатысуын талап етеді; рекурсивті жою жұмыс каталогымен шектелген; соңғы деңгей қайтымдылықты қамтамасыз етеді (.bak жасау, себет). Жаһандық айналып өту мүмкіндігі бар, бірақ ол оператордың тәуекелімен пайдаланылады.&lt;/p&gt;\n&lt;p&gt;Келісім. Консервативті тәсіл сарапшының қауіпсіз әрекеттерін де блоктай алады, бірақ бұл мақсатты аудитория үшін ақталған. M14 моделі хостты агент құралдарынан қорғайды, промпт-инъекциялардан емес.&lt;/p&gt;\n&lt;p&gt;Ағып кетуді талдау. 2-деңгей (қайтымсыз командалар) барлық әрекеттерді ұстайды. Расталған түпкілікті әсерлер 2B моделі үшін 44-тен 2-сін және 4B үшін 44-тен 11-ін құрады. Барлық ағып кетулер bash командалық жолы арқылы өткен. 2B моделі екі тар ағып кетуге жол берді (NTFS-байланыс жасау, қайтымдылық қатесі). 4B моделі болса әдістемелік шабуыл жасады: абсолютті жолдар, нормализацияны айналып өтетін \\?\\ префикстері, жұмыс каталогынан шығу үшін cd.. тізбектері және тізілімге жазу әрекеттері. Шақыруларды ұстау тиімді (деңгей бойынша 0,67–1,00), бірақ модель айналып өту жолдарын іздеуге қабілетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;M14 моделі құралдарды импульсивті пайдалануды тиімді алдын алады, бірақ бір уақытта бірнеше шабуыл векторын қолданатын әдістемелік қарсыласқа қарсы қорғанысты кепілдендірмейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zhobalau-principteri\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#zhobalau-principteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жобалау принциптері&lt;/span&gt;&lt;/a&gt;Жобалау принциптері&lt;/h4&gt;\n&lt;p&gt;Mingbird — өздігінен құрастырылған құрал, сондықтан оның нәтижелері әзірлеу контекстімен шектелген. &lt;a href=\"concepts/benchmark.html\"&gt;Бенчмарк&lt;/a&gt; әмбебап эталон болуға үміткер емес, бірақ ол себеп-салдар байланысын орнатуға мүмкіндік береді: 18 нақты тапсырмада, бекітілген жабдық пен модельдерде, тек басқару құралын (harness) өзгерту нәтижені көрсетілген шамаға өзгертеді. Жұмыс принциптері: біріншіден, барлық жағдайлардың өзгермеуі (машина, Ollama backend, модельдер, уақыт бюджеті, бағалау жүйесі); екіншіден, толық ашықтық (әр ұяшық бойынша 288 нәтиже жарияланған, бұл кез келген жиынтық көрсеткішті қайта тексеруге мүмкіндік береді); үшіншіден, бенчмарк тәуелсіз тестілеумен қатар дәлелдемелік базаның бір бөлігі ретінде қарастырылады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бенчмарк ортаның барлық параметрлерін &lt;a href=\"concepts/anchoring.html\"&gt;бекіту&lt;/a&gt; арқылы қайталануды қамтамасыз етеді және басқару құралының тапсырмалардың сәтті орындалуына әсерін оқшаулауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tapsyrmalar-zhiyntyghy\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#tapsyrmalar-zhiyntyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тапсырмалар жиынтығы&lt;/span&gt;&lt;/a&gt;Тапсырмалар жиынтығы&lt;/h4&gt;\n&lt;p&gt;18 тапсырма төрт қиындық деңгейіне бөлінген, бұл қателерді орташалаудың орнына нақты режимде оқшаулауға мүмкіндік береді. T1 (деректерді іздеу және шығару), T2 (синтез, функцияларды іске асыру, тесттер жазу), T3 (жұмыс процестері: веб-зерттеулер, профильдеу, рефакторинг), T4 (ұзақ мерзімді тапсырмалар, соның ішінде үзіліс және қайта бастау стресс-тесттері). Әр тапсырманың нақты сипаттамалары бар: домен, кіріс деректері, әрекет жоспары, бақылау нүктелері және артефактілерді бағалау критерийлері. Тапсырмалар нақты және тексерілетін, олардың анықтамалары тестілеу циклі басталғанға дейін бекітіледі. Жиынтық жергілікті агенттердің жұмысының негізгі аспектілерін қамтиды, интерактивті диалогтарды қоспағанда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/cell.html\"&gt;Ұяшық»&lt;/a&gt; (cell) — бұл тәжірибе аясында орындалатын нақты тапсырма мен модельдің үйлесімі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hattama\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#hattama\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хаттама&lt;/span&gt;&lt;/a&gt;Хаттама&lt;/h4&gt;\n&lt;p&gt;Барлық 288 ұяшық бір машинада (интеграцияланған GPU, 32 ГБ ортақ жады, Windows 11, Ollama) орындалды. Төрт құрал қолданылды: Mingbird, goose, agent-mini және opencode. Модельдер: gemma4 (2B және 12B), qwen3.5 (4B) және ornith-1.5 (35B). 35 миллиард параметрге қарамастан, ornith-1.5 Mixture-of-Experts архитектурасын пайдаланады (токен үшін шамамен 3 миллиард параметр белсендіріледі), бұл 128K контекстте шамамен 26 токен/с жылдамдықты қамтамасыз етеді. Уақыт бюджеті жұмыс процестері үшін 90 минут және ұзақ мерзімді тапсырмалар үшін 180 минутты құрады. Таңдау температурасы барлық құралдар үшін 0-ге мәжбүрлі түрде орнатылды. Бір қайта әрекеттенуге рұқсат берілді; тайм-аут 0-ге теңестірілді. Тестілеу барысында 288 ұяшық үшін 312 іске қосу тіркелді. Авторлар goose (WF-08) үшін хаттамадағы ауытқуды ашады, онда біреудің орнына төрт әрекет жасалған; бұл қорытынды рейтингке әсер етпейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Қайта әрекеттенуді пайдалану асимметриялық болды: agent-mini ақауларға байланысты 20 қайта әрекеттенуді талап етті, ал Mingbird тек біреуін пайдаланды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghalau\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау&lt;/span&gt;&lt;/a&gt;Бағалау&lt;/h4&gt;\n&lt;p&gt;Бағалау жүйесі детерминирленген және артефактілерге негізделген: файлдар болуы, тесттер өтуі, есептер талап етілген деректерді қамтуы керек. Бағалар ішінара: жеті тексеруден төртеуі өтсе, ұяшық 0,571 балл алады. Басқару құралдары бағалау жүйесінен оқшауланған және жұмыс аяқталғанға дейін критерийлерге қол жеткізе алмайды.&lt;/p&gt;\n&lt;h4 id=\"aedildik-uakhyt-sekundpen-emes,-byudzhetpen-baghalanady\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#aedildik-uakhyt-sekundpen-emes,-byudzhetpen-baghalanady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әділдік: уақыт секундпен емес, бюджетпен бағаланады&lt;/span&gt;&lt;/a&gt;Әділдік: уақыт секундпен емес, бюджетпен бағаланады&lt;/h4&gt;\n&lt;p&gt;Әртүрлі тестілеу орталары (harnesses) нақты орындалу уақыты (&lt;a href=\"concepts/wall-clock-time.html\"&gt;wall-clock time&lt;/a&gt;) бойынша айтарлықтай ерекшеленеді, сондықтан бағалау әдістемесі мұны ескеруі тиіс. LRAB жүйесінде уақыт әрбір тапсырмалар тобы үшін бекітілген бюджеттер арқылы бағаланады және «шикі» секундтар нормаланбайды. Мұның себебі: агент пайдаланушы үшін тек ол күтуге дайын уақыт ішінде нәтиже бергенде ғана пайдалы. Орталар арасындағы нақты уақыт айырмашылығы архитектуралық шығындарды көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Wall-clock time (қабырға сағатының уақыты) — бұл тапсырма басталғаннан аяқталғанға дейінгі нақты өткен уақыт, ол жүйедегі барлық кідірістерді қамтиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;goose жүйесінің мысалында, үлкен контексттермен жұмыс істегенде ұзақ префилл (prefill) фазасы баяулауға әкеледі, бірақ бұл ретте маңызды жұмыс көлемі орындалады. Жарияланған CSV деректеріне сәйкес, ең баяу goose ұяшығы сол тапсырма мен WF-04 (12B) моделінде Mingbird-ке қарағанда 11,7 есе баяу жұмыс істейді. Секундтарды есепке алмау ерте аяқталатын орталарға негізсіз артықшылық берер еді, ал жылдамдық бойынша нормалау әр итерацияда аз жұмыс істеуге итермелер еді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бюджет бойынша бағалау пайдаланушы талабын көрсетеді: тапсырма бөлінген бюджет ішінде орындалуы керек, әйтпесе нәтиже нөлге тең.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ұсынылған матрицада ешбір әдіс уақыт шегіне жеткен жоқ. Төрт әдістің әрқайсысы (Mingbird, goose және т.б.) үшін 72 ұяшықтың ішінде нақты орындалу уақыты бөлінген бюджеттің 95% немесе одан да көп бөлігін құраған жағдайлар саны нөлге тең.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"288-uyashykhty-matrica\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#288-uyashykhty-matrica\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;288 ұяшықты матрица&lt;/span&gt;&lt;/a&gt;288 ұяшықты матрица&lt;/h4&gt;\n&lt;p&gt;5-кестеде негізгі нәтижелер жинақталған. Mingbird өзінің 72 ұяшығы бойынша орташа 0,886 балл жинады, ал goose — 0,631, opencode — 0,479, agent-mini — 0,405 балл көрсетті.&lt;/p&gt;\n&lt;p&gt;Статистикалық маңыздылық. Әр ұяшық жеке сынақ ретінде қарастырылып, 18 тапсырма талдау бірлігі болды. Модельдердің әр өлшемі бойынша Mingbird бәсекелестермен екі жақты жұптық Уилкоксон критерийі арқылы салыстырылды (Холм түзетуі және 10 000 &lt;a href=\"concepts/butstrep.html\"&gt;бутстреп&lt;/a&gt;-таңдамасымен). 2B және 12B модельдерінде Mingbird-тің артықшылығы статистикалық тұрғыдан маңызды (ең жоғары түзетілген p = 0,0008, 2B үшін; 0,0466, 12B үшін). 4B моделінде тек opencode-пен салыстыру маңызды (p = 0,0181), ал goose және agent-mini маңыздылық шегіне жетпеді. 35B моделінде goose (p = 0,0415) және agent-mini (0,0005) нәтижелері маңызды, бірақ opencode-пен айырмашылық жоқ. Mingbird-тің жалпы артықшылығы goose-ке қарағанда +0,255 (95% ДИ [0,188, 0,322]), opencode-ке қарағанда +0,407 және agent-mini-ге қарағанда +0,481 құрайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird әсіресе шағын модельдер сегментінде тұрақты артықшылыққа ие, мұнда басқа модельдердің өнімділігі күрт төмендейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тапсырмалар кластері. 18 тапсырма 4 отбасыға бөлінген (іздеу, синтез, жұмыс процестері, ұзақ мерзімді жоспарлау). &lt;a href=\"concepts/klasternyy-butstrep.html\"&gt;Кластерлік бутстреп&lt;/a&gt; талдауы 4 отбасы үшін отбасылық деңгейдегі статистикалық маңыздылықты растау мүмкін еместігін көрсетті. Дегенмен, 2B моделінде Mingbird-тің артықшылығы барлық төрт отбасыда байқалады. 4B мен agent-mini салыстыруынан басқасы, оның ДИ мәні нөлді кесіп өтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кластерлік бутстреп — деректерді топтарға бөліп, нәтижелердің кездейсоқ еместігін тексеру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Шағын модельдер эффектісі. 3-суретте барлық базалық модельдердің өлшемі кішірейгенде өнімділігін жоғалтатыны көрсетілген: opencode 2B-да 0,017-ге, goose 0,271-ге дейін түседі. Mingbird 2B-да 0,821 баллмен өз нәтижесін сақтап қалған жалғыз жүйе.&lt;/p&gt;\n&lt;p&gt;Екінші модель отбасы. Нәтижелердің белгілі бір архитектураға ғана емес, жүйеге байланысты екенін тексеру үшін qwen3.5:2b (2,3 млрд параметр) моделі сыналды. Mingbird бұл модельде 0,779 балл жинап, goose (0,096), opencode (0,017) және agent-mini (0,239) модельдерінен айтарлықтай озып кетті. Бұл жоғары өнімділіктің Mingbird жүйесінің қасиеті екенін растайды.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Бес сақиналы қарсыластық бағалау&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Сақина&lt;/th&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;n&lt;/th&gt;\n&lt;th&gt;Әрекеттер&lt;/th&gt;\n&lt;th&gt;Ұсталды&lt;/th&gt;\n&lt;th&gt;Ұстау жиілігі&lt;/th&gt;\n&lt;th&gt;Жалаушалар&lt;/th&gt;\n&lt;th&gt;Расталды&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.67&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.71&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.00&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.00&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.00&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.89&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.82&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.67&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.14&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.29&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Барлығы&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Барлығы&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Бақылау&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;pass6;refused3;incomplete1&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Бақылау&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;pass7;refused1;timeout1;incomplete1&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Әр жағдай үшін бір іске қосу, екі модель, бақылаусыз, температура 0, ойлау өшірілген.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"uzakh-merzimdi-zhosparlau\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#uzakh-merzimdi-zhosparlau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұзақ мерзімді жоспарлау&lt;/span&gt;&lt;/a&gt;Ұзақ мерзімді жоспарлау&lt;/h4&gt;\n&lt;p&gt;Көп сағаттық тапсырмаларда Mingbird орташа 0,827 нәтиже көрсетіп, agent-mini (0,484), goose (0,394) және opencode (0,354) модельдерінен озып кетті. Барлық көрсеткіштер әр құрал үшін 12 жарияланған ұяшыққа негізделген. Mingbird-тің артықшылығы тапсырмадағы қадамдар саны артқан сайын айқын көрінеді. Goose моделінде «ойлау» (thinking) функциясын өшіру оның орташа көрсеткішін 0,623-тен 0,394-ке дейін төмендетеді. Mingbird-тің ең төмен нәтижелері (0,403 және 0,429) 4B сегменттерінде тіркелген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird ұзақ мерзімді жоспарлауды қажет ететін тапсырмаларда ең жоғары тиімділікті көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"saetsizdik-sebepteri\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#saetsizdik-sebepteri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сәтсіздік себептері&lt;/span&gt;&lt;/a&gt;Сәтсіздік себептері&lt;/h4&gt;\n&lt;p&gt;Матрица 288 іске қосуды қамтиды, оларды талдау қателіктердің бес түрін бөліп көрсетуге мүмкіндік береді. Бұл таксономия оператор есептеріне емес, тікелей өлшемдерге негізделген MAST классификациясын толықтырады.&lt;/p&gt;\n&lt;p&gt;• Mingbird: нөлдік балл алған жалғыз іске қосу (WF-08, 35B) 276 секундтан кейін аяқталды: модель жоспар құрды, бірақ артефактілерді жасамады және үнемі жұмыс аяқталғанын хабарлады. Егер осы ұяшықты алып тастаса, 35B-нің орташа балы 0,941-ден 0,996-ға дейін көтеріледі. Тағы бір ұяшық (WF-09, 4B) орындаушы қатесіне байланысты 0,5 балл алды.&lt;/p&gt;\n&lt;p&gt;• agent-mini (35B): 14 ұяшық платформаның сәйкес келмеуіне байланысты нөлдік балл алды. Модель Windows ортасында Unix пәрмендерін орындауға тырысты, бұл 80 секундтан аз уақыт ішінде жұмыстың тоқтауына әкелді. Бұл модельдің емес, платформа интеграциясының қатесі. Осы 30 «жылдам» ұяшықты алып тастағанда, рейтинг өзгереді: Mingbird бірінші орында қалады (0,901), бірақ agent-mini мен opencode орындары ауысады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/nesovmestimost-platformy.html\"&gt;Платформаның сәйкес келмеуі&lt;/a&gt; — бағдарламалық орта (мысалы, Windows) басқа жүйеге (мысалы, Unix) арналған пәрмендерді түсінбеуі салдарынан туындайтын ақау.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;• opencode: 2B сегментінде іске қосулардың көпшілігі (18-дің 17-сі) артефактілер жасалмай тұрып, мерзімінен бұрын (49–115 секунд ішінде) аяқталды. Мүмкін, модель шешілмейтін күйлерді тапсырма орындалды деп қате түсіндіреді.&lt;/p&gt;\n&lt;p&gt;• goose: баяу, бірақ тұрақты дамуды көрсетеді. Ең көп уақыт жұмсағанына қарамастан, модель үлкен контексттерде тапсырмаларды сәтті орындайды және 35B-де 0,679 балл алады.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Жарияланған матрицаның жинау терезелері&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Топ&lt;/th&gt;\n&lt;th&gt;Терезе&lt;/th&gt;\n&lt;th&gt;Температура 0&lt;/th&gt;\n&lt;th&gt;Ойлау өшірілген&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;agent-mini&lt;/td&gt;\n&lt;td&gt;09-01..04&lt;/td&gt;\n&lt;td&gt;ownconfig&lt;/td&gt;\n&lt;td&gt;ownconfig&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Mingbird&lt;/td&gt;\n&lt;td&gt;09-13..14&lt;/td&gt;\n&lt;td&gt;releaseddefault&lt;/td&gt;\n&lt;td&gt;releaseddefault&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;goose, opencode&lt;/td&gt;\n&lt;td&gt;09-18..20&lt;/td&gt;\n&lt;td&gt;transportproxy&lt;/td&gt;\n&lt;td&gt;transportproxy&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Әрбір жарияланған ұяшық дәл бір терезеден алынған.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"oryndalu-uakhyty\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#oryndalu-uakhyty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Орындалу уақыты&lt;/span&gt;&lt;/a&gt;Орындалу уақыты&lt;/h4&gt;\n&lt;p&gt;Орташа орындалу уақыты (секундпен): Mingbird — 585,5 (медиана 440,5), goose — 866,4 (медиана 692,4), agent-mini — 233,5 (медиана 116,4), opencode — 633,4 (медиана 450,1).&lt;/p&gt;\n&lt;h4 id=\"syrtkhy-tekseru-t2-bench-uesh-domende\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#syrtkhy-tekseru-t2-bench-uesh-domende\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сыртқы тексеру: τ2-bench үш доменде&lt;/span&gt;&lt;/a&gt;Сыртқы тексеру: τ2-bench үш доменде&lt;/h4&gt;\n&lt;p&gt;LRAB деректер жинағы авторлар тарапынан жасалғандықтан, қосымша бағалау үшін бөлшек сауда, әуе тасымалы және телекоммуникация домендерін қамтитын τ2-bench үшінші тарап бенчмаркі пайдаланылды. Бұл тестте модельденген пайдаланушы агентпен әрекеттеседі; сәттілік тапсырма орындалғаннан кейінгі деректер базасының күйімен анықталады. Егер агент құралдарды шақыруды имитацияласа, бірақ оларды орындамаса, тексеруден өтпейді. Сынақ хаттамасы біріктірілген: барлық жағдайда температурасы 0 және «ойлау» (thinking) режимі өшірілген qwen3.5:4b (Ollama) моделі қолданылады. Пайдаланушы симуляторы — qwen3.8-flash моделі. Бағалау &lt;a href=\"concepts/pass-1.html\"&gt;pass@1&lt;/a&gt; метрикасы бойынша жүзеге асырылады, мұнда қателер 0-ге теңестіріледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird күрделі домендерде басымдық көрсетеді: бөлшек саудада ол 0,763 ұпай жинады (native agent 0,675 және opencode 0,588), ал жалпы 278 тапсырма бойынша 0,856 ұпайға қол жеткізді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;pass@1 — бірінші талпыныста дұрыс орындалған тапсырмалар үлесін бағалайтын метрика.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бөлшек саудада (114 тапсырма) Mingbird 0,763, native agent 0,675, opencode 0,588 нәтиже көрсетті. Әуе тасымалында (50 тапсырма) Mingbird мен native agent теңесті (0,740), opencode — 0,500. Телекоммуникацияда (114 тапсырма) нәтижелер лимитке жақын: Mingbird — 1,000, opencode — 0,991, native agent — 0,930. Mingbird-тің телекоммуникациядағы жоғары нәтижесі M4 anti-loop guard (циклден қорғау) механизмін қолдануымен түсіндіріледі.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 4.&lt;/strong&gt; LRAB-та қолданылатын және Ollama арқылы ұсынылатын төрт модель&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Деңгей&lt;/th&gt;\n&lt;th&gt;Ollama тегі&lt;/th&gt;\n&lt;th&gt;Барлығы&lt;/th&gt;\n&lt;th&gt;Белсенді&lt;/th&gt;\n&lt;th&gt;Кванттау&lt;/th&gt;\n&lt;th&gt;Архитектура&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2B&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;5B&lt;/td&gt;\n&lt;td&gt;2.3B&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;MatFormer+PLE(elastic)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4B&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;4B&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;dense&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;12B&lt;/td&gt;\n&lt;td&gt;gemma4:12b&lt;/td&gt;\n&lt;td&gt;12B&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;dense&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;35B&lt;/td&gt;\n&lt;td&gt;ornith-1.5:35b&lt;/td&gt;\n&lt;td&gt;35B&lt;/td&gt;\n&lt;td&gt;∼3B&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;Qwen3.5-MoE, multimodal&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Total және Active параметрлердің жалпы санын және әр токенге шаққандағы белсенді параметрлер санын көрсетеді; &lt;a href=\"concepts/quantization.html\"&gt;Quantization&lt;/a&gt; — қызмет көрсетілетін салмақтар үшін ggml кванттау деңгейі. Барлық төрт тег Q4_K_M ретінде ұсынылған.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"statistikalykh-mangyzdylykh-zhaene-konfiguraciya-aeseri\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#statistikalykh-mangyzdylykh-zhaene-konfiguraciya-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистикалық маңыздылық және конфигурация әсері&lt;/span&gt;&lt;/a&gt;Статистикалық маңыздылық және конфигурация әсері&lt;/h4&gt;\n&lt;p&gt;Маңыздылықты бағалау үшін Макнемар тесті қолданылды. Mingbird-ті native agent-пен салыстырғанда айырмашылық +0,065 (p=0,030), opencode-пен +0,119 (p=2,7×10⁻⁵) болды. Телекоммуникация доменін алып тастағанда (164 тапсырма қалады), Mingbird мен native agent арасындағы айырмашылық статистикалық тұрғыдан маңызды емес (p=0,22), бұл осы домендегі басымдықтың жалпы нәтиже үшін шешуші екенін білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер «ойлау» (thinking) конфигурациясына қатты тәуелді: оны қосу модель өнімділігін сызықтық емес түрде өзгертеді, бұл оны жүйені жобалаудағы негізгі факторға айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ojlau-konfiguraciyalaryn-taldau\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#ojlau-konfiguraciyalaryn-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Ойлау» конфигурацияларын талдау&lt;/span&gt;&lt;/a&gt;«Ойлау» конфигурацияларын талдау&lt;/h4&gt;\n&lt;p&gt;Әрбір модельге ең қолайлы «ойлау» (thinking-on немесе thinking-off) конфигурациясын тағайындау қорытынды рейтингті өзгертпейді. τ² деректер жиынтығында екі конфигурация да жарияланғандықтан, салыстыру мүмкіндігі бар. Әр агент үшін ең жақсы конфигурацияны таңдағандағы көрсеткіштер: Mingbird — 0,867 («ойлау» қосулы кездегі ең жақсы нәтиже), native agent — 0,791 (өшірулі кездегі ең жақсы), opencode — 0,737 (өшірулі кездегі ең жақсы). Бірыңғай хаттама сәйкесінше 0,856 / 0,791 / 0,737 нәтижелерін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әр агент үшін оңтайлы «ойлау» конфигурациясын таңдау өнімділіктегі алшақтықты жоймайды, бұл Mingbird көшбасшылығының тұрақтылығын растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mingbird конфигурациялардың өзгеруіне қатысты ең аз сезімталдықты көрсетеді (± 0,011 шегіндегі ауытқу), ал бәсекелестердің көрсеткіштері домен деңгейінде айтарлықтай өзгереді. Мысалы, opencode-тің табыстылық деңгейі (telecompass rate) 0,298-ден (thinking-on) 0,991-ге (thinking-off) дейін ауытқиды. LRAB жиынтығында «ойлаудың» әсер ету бағыты күрделілік деңгейіне (tier) байланысты. Мәселен, goose моделі 35B параметрде (0,679-ға қарсы 0,822) және ұзақ мерзімді тапсырмаларда (0,394-ке қарсы 0,623) «ойлаудан» ұтады, бірақ 4B/12B модельдерінде ұтылады. opencode (12B) керісінше нәтиже көрсетеді (0,539-ға қарсы 0,140). Демек, барлық тапсырма түрлері үшін әмбебап оңтайлы конфигурация жоқ.&lt;/p&gt;\n&lt;h4 id=\"resmi-baptaulardan-auytkhular\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#resmi-baptaulardan-auytkhular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ресми баптаулардан ауытқулар&lt;/span&gt;&lt;/a&gt;Ресми баптаулардан ауытқулар&lt;/h4&gt;\n&lt;p&gt;Пайдаланушы симуляторы ретінде ресми gpt-4o емес, qwen3.8-flash моделі пайдаланылды, сондықтан абсолютті баллдарды ресми көшбасшылар кестесімен тікелей салыстыруға болмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пайдаланушы симуляторы — бұл жасанды интеллект агенттерінің жауаптарын тексеру үшін нақты адамның мінез-құлқын имитациялайтын бағдарламалық орта.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Баламалы симулятор қолданылғандықтан, абсолютті көрсеткіштер сыртқы бенчмарктармен салыстыруға жарамайды, алайда агенттер арасындағы салыстырмалы талдау дұрыс болып қала береді, өйткені олардың барлығы бірдей жағдайда сыналған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ablyaciya-2b-modelindegi-mehanizmderdi-alyp-tastau\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#ablyaciya-2b-modelindegi-mehanizmderdi-alyp-tastau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абляция: 2B моделіндегі механизмдерді алып тастау&lt;/span&gt;&lt;/a&gt;Абляция: 2B моделіндегі механизмдерді алып тастау&lt;/h4&gt;\n&lt;p&gt;Жүйенің жеке компоненттерінің үлесін бағалау үшін біз v1.5.0 код базасында абляциялық зерттеу жүргіздік. Экспериментке AGENT_ABLATION ортасы арқылы әрқайсысында бір механизм өшірілген төрт нұсқа қатысты. Сынақтар 18 LRAB тапсырмасында gemma4:e2b моделінің көмегімен (әр топқа n=18 ұяшық) жүзеге асырылды. Келесі механизмдер өшірілді: финиш гейті (M3), кері байланысты тексеру циклі (M3 бөлігі), қолтаңба деңгейіндегі циклге қарсы монитор (M4) және санаттық алдын ала жүктеу (M1). M2 және M5 механизмдері абляцияға ұшырамады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляция — бұл жүйенің жалпы тиімділігіне әсерін бағалау үшін оның жеке компоненттерін кезекпен өшіріп тастау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Базалық сызық ретінде толық механизмдер жиынтығы (18 ұяшық) алынды. Нұсқалар 0 температурада тәуелсіз орындалды. Нәтижелер детерминирленген рубрика бойынша бағаланды. Финиш гейтін (finish_gate) өшіру алты тексерудің төртеуіне әсер етеді (жұмыс жоқ болғанда бас тарту, pytest тексеруі, түйіндемені артефактілермен салыстыру, жоспар толықтығын тексеру). Екі тексеру белсенді қалды: тапсырмаларды синхрондау ескертпесі және жеткізуді өзін-өзі тексеру. Осылайша, тіркелген -0,098 өзгерісі дәл осы төрт автоматтандырылған қорғаныстың үлесін көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Финиш гейтінің өшірілуі тиімділіктің 0,098-ге төмендеуіне әкелді, мұндағы негізгі үлес (41%) бенчмарк тест файлдарын ұсынатын тапсырмаларға тиесілі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тапсырмалар бойынша талдау -0,098 таза эффектінің біркелкі таралмағанын көрсетті: төрт тапсырма әрқайсысы +0,71 шамасында өсім берді, ал үш тапсырма төмендеу көрсетті (-0,143-тен -0,571-ге дейін). Төрт тапсырманың тек біреуі (WF-04) дайын бенчмарк тест файлын қамтыды. Басқа жағдайларда гейттің пайдасы жоқ артефактілермен тапсырмаларды аяқтауға жол бермеу болды. Финиш гейті тексерулерді орындай алмайтын τ2-bench бенчмаркіндегі сыртқы тексеру +0,065-тен +0,119-ға дейінгі маржаның сақталғанын көрсетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бенчмарктегі тест файлдарының болуы бағалауды асыра көрсету қаупін тудырады, өйткені агент оларды өзін-өзі тексеру үшін пайдалана алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жарияланған матрицадағы (72 млн ұяшық) механизмдердің белсендірілу статистикасы: жеткізуді өзін-өзі тексеру 65 рет, синхрондау бойынша бас тартулар 43 рет, түйіндемені салыстыру 23 рет, pytest тексерулері 13 рет, жоспар толықтығын тексеру 11 рет жұмыс істеді. Mingbird үшін құралдарды шақыру медианасы 33,5, goose үшін 15,0, opencode үшін 5,0, agent-mini үшін 7,0 болды. Mingbird үшін токендерді пайдалану медианасы 14 624, ал максималды мәні 32 767 болды. Бір ұяшықты орындаудың медиандық уақыты Mingbird үшін 440 секунд және agent-mini үшін 116 секундты құрады.&lt;/p&gt;\n&lt;h4 id=\"akhaular-taldauy-zhaene-bakhylau-mehanizmderi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#akhaular-taldauy-zhaene-bakhylau-mehanizmderi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ақаулар талдауы және бақылау механизмдері&lt;/span&gt;&lt;/a&gt;Ақаулар талдауы және бақылау механизмдері&lt;/h4&gt;\n&lt;p&gt;288 жарияланған ұяшықты талдау (8-кесте) модель жұмысының тоқтауына негізгі себеп қате жауап емес, тапсырманы орындаудан бас тарту немесе аяқталмағандық екенін көрсетеді. Мысалы, OpenCode базалық моделінің 72 ұяшығының 21-інде құралдар мүлдем шақырылмаған. Басқа жағдайларда (agent-mini) бэкендпен байланыстың үзілуі тіркелген, ал 23-44 ұяшық әртүрлі конфигурацияларда қатесіз немесе тайм-аутсыз тексеруге дейін жетпеген. Mingbird конфигурациясында 40 ұяшық қажетті артефактілердің жоқтығынан тоқтатылған, ал тек 4 ұяшық жарты балдан төмен баға алған. Екінші сарапшының 24 ұяшықты тәуелсіз тексеруі бағалауда толық сәйкестікті (24/24) көрсетті, алшақтықтар тек 0,5 балл шекарасында 3 жағдайда ғана байқалды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тапсырмалардың тоқтауына негізгі себеп модель қателері емес, орындаудан бас тарту немесе техникалық үзілістер, бұл «сәтсіздіктер» бағасын себеп-салдарлы емес, индикативті етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mehanizmderdi-aezirleu-zhaene-okhytu-aeseri\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#mehanizmderdi-aezirleu-zhaene-okhytu-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механизмдерді әзірлеу және оқыту әсері&lt;/span&gt;&lt;/a&gt;Механизмдерді әзірлеу және оқыту әсері&lt;/h4&gt;\n&lt;p&gt;Авторлар бақылау механизмдері (finish gate, anti-loop monitor) LRAB деректерін ескере отырып әзірленгенін мойындайды. Мысалы, v1.2.0 нұсқалары жоспарлаудың ұзақ көкжиектеріндегі қателерге жауап ретінде жасалған. Сол себепті, өнімділіктегі өзгерістер (finish gate үшін −0,098 және anti-loop үшін −0,015 дельта) таңдама ішіндегі (in-sample) эффект бағасы ретінде қарастырылуы керек. 9-кесте мен 9-сурет механизмдерді өшірудің ешқайсысы статистикалық тұрғыдан маңызды жақсару бермейтінін көрсетеді: 95% сенімділік интервалдары (10 000 ресэмпл) нөлді кесіп өтеді. Топтағы n=18 таңдама көлемімен зерттеу дизайны механизм эффектін тапсырмалар дисперсиясынан бөліп алуға мүмкіндік бермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/in-sample-effekt.html\"&gt;In-sample эффект&lt;/a&gt; — бұл жүйе оқытылған немесе бапталған деректер негізінде оның тиімділігін бағалау, бұл көрсеткіштерді асыра бағалауы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Таңдама көлемінің кішілігіне (n=18) байланысты нәтижелер статистикалық тұрғыдан маңызды емес, бағыттаушы (directional) сипатқа ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ortakh-sebep-lh-01-kejsi\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#ortakh-sebep-lh-01-kejsi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ортақ себеп: LH-01 кейсі&lt;/span&gt;&lt;/a&gt;Ортақ себеп: LH-01 кейсі&lt;/h4&gt;\n&lt;p&gt;LH-01 тапсырмасы барлық төрт конфигурацияда аномальды төмендеуді көрсететіні анықталды (0,929-дан 0,214–0,259-ға дейін). Бұл механизмдер жұмысына емес, «ортақ себепке» (common cause) нұсқайды. LH-01 — бұл 180 минуттық көп сатылы тапсырма, пакеттік өңдеу шарттарына өте сезімтал. LH-01 талдаудан шығарылғанда, механизмдердің көпшілігінің әсері нөлге жақындайды немесе таңбасын өзгертеді. 2026-09-22-дегі экспериментті қайта іске қосу төмендеу механизмдердің қосылғанына қарамастан қайталанатынын, ал 0,069 баллдық ауытқулар кестедегі барлық номиналды дельталар көлеміне сәйкес келетінін растады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бақылау механизмдеріне байланысты деп есептелген эффектілер дәлдікке қосқан нақты үлес емес, күрделі тапсырмалардың (LH-01) орындалуындағы тұрақсыздықтың нәтижесі екені анықталды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oryndalatyn-khorghanystardy-salystyru\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#oryndalatyn-khorghanystardy-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Орындалатын қорғаныстарды салыстыру&lt;/span&gt;&lt;/a&gt;Орындалатын қорғаныстарды салыстыру&lt;/h4&gt;\n&lt;p&gt;Орындалатын қорғаныстардың (executable guards) тиімділігін бағалау үшін бір түнде өткізілген тәжірибелер сериясында тікелей салыстыру жүргізілді, бұл іске қосулар арасындағы уақытша алшақтықтардың әсерін жояды. Сенімділікті арттыру үшін әрбір конфигурация жұбы үш рет сыналды (әр іске қосуда 18 тапсырмадан). Барлық үш жағдайда да нәтижелер орындалатын қорғаныстардың пайдасына болды: жалпы айырмашылық +0,096, +0,133 және +0,056 (орташа +0,095) құрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Орындалатын қорғаныстар қарапайым мәтінді қайта оқуға қарағанда шамамен 0,1 ұпайға артықшылық береді, бұл үш келісілген сынақ сериясымен расталған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сегменттер бойынша талдау келесі нәтижелерді көрсетті: жұмыс процесі сегменттері (workflow-segment) үшін айырмашылық +0,145, +0,157 және +0,057 құрады. Ұзақ мерзімді (long-horizon) сегменттердегі мәндер -0,148, +0,013 және +0,051 болды, бұл аталған сегменттің жоғары дисперсиясына сәйкес келетін белгінің тұрақсыздығын көрсетеді. Контекст үшін: бірдей конфигурациясы бар бақылау топтары орташа 0,069 диапазондағы ауытқуды көрсетті, ал ұзақ мерзімді сегменттердегі жеке тапсырмалардағы тербелістер 0,75-ке дейін жетті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/dispersiya.html\"&gt;Дисперсия&lt;/a&gt; — бұл деректердің шашыраңқылық көрсеткіші; жоғары дисперсия бірдей тест нәтижелерінің әр жолы әртүрлі болуы мүмкін екенін білдіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әр ұяшық үшін ұпайлар ашық деректерде (benchmarks/ablation/) жарияланған. Негізгі матрицадағы ұзақ мерзімді сегмент ұяшықтары 13–14 қыркүйекте өткізілген жалғыз сынақтарға негізделгенін ескеру маңызды. Толық механизмді қайта іске қосу 0,5-ке дейінгі ауытқуды бере алатындықтан, 5-кестедегі ұзақ мерзімді сегменттер үшін мәндерді осы өзгермелілікті ескере отырып түсіндіру керек. Барлық тапсырмалар мен жұмыс процесі сегменттері бойынша жалпы нәтижелер тұрақты көрсеткіштер болып табылады.&lt;/p&gt;\n&lt;h4 id=\"validtilikke-khatysty-khauipter\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#validtilikke-khatysty-khauipter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Валидтілікке қатысты қауіптер&lt;/span&gt;&lt;/a&gt;Валидтілікке қатысты қауіптер&lt;/h4&gt;\n&lt;p&gt;Жеке бенчмарк. LRAB тапсырмалары мен бағалау критерийлерін Mingbird авторлары жасаған. Тапсырмалар жиынтығы біздің құралымыздың механизмдеріне ыңғайлы болуы мүмкін екенін жоққа шығара алмаймыз, өйткені ол 3.2-бөлімде сипатталған қателік формаларын тексеруге арналған. Бұл бақыланатын эксперименттің мақсаты болғанымен, белгілі бір дәрежеде бұрмалаушылықты тудырады. Біз мұны барлық тапсырмаларды, бағалау кодын және өңделмеген деректерді жариялау, сондай-ақ нәтижелердің жалпы бағытын растайтын сыртқы τ2-bench репликациясын қолдану арқылы азайтамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LRAB жеке бенчмаркі авторлар тарапынан жасалғандықтан бұрмалау қаупі бар, алайда τ2-bench арқылы сыртқы тексеру қорытындылардың сәйкестігін растайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сыртқы бенчмарктарды қамту. τ2-bench — біздің салыстыруға арналған жалғыз сыртқы дереккөзіміз. Біз тағы бес үміткерді (AppWorld, ToolSandbox, AgentBoard, функция шақыру жиынтықтары және CRMArena) талдадық, бірақ техникалық шектеулерге байланысты оларды алып тастадық: олар не өз агенттік циклін ұсынады, не жергілікті модельдерді ажырата алмайды (мысалы, CRMArena әр тапсырмаға 40 минуттан астам уақыт жұмсап, нәтижесі нөл болды).&lt;/p&gt;\n&lt;p&gt;Әзірлеу мен бағалаудың сәйкес келуі. Циклден қорғау механизмі (M4) LRAB құрамына кіретін WF-08 тапсырмасы негізінде әзірленген. Сыналған төрт механизмнің үшеуі оқу деректерімен ішінара қиылысады. Сынақ таңдамасы мен әзірлеу арасында уақытша алшақтық болмағандықтан, шамадан тыс бейімделу (overfitting) қаупі сақталады. Біз ашықтық үшін барлық деректерді жариялаймыз, ал механизмдер бекітілгеннен кейін алынған сыртқы τ2-bench нәтижелері қосымша тексеру қызметін атқарады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сынақ және оқу таңдамаларының бөлінбеуі шамадан тыс бейімделу қаупін тудырады, өйткені кейбір механизмдер оларды жасау кезінде қолданылған тапсырмаларда сыналған.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жабдық және платформа. Барлық 288 тест Windows 11 орнатылған бір компьютерде (кіріктірілген GPU, 32 ГБ ортақ жад) орындалды. Нәтижелердің Linux немесе дискретті GPU-ларға қалай ауысатынын білмейміз. Mingbird Windows-қа бағытталған, сондықтан оның басқа жүйелердегі жұмысы сыналмаған.&lt;/p&gt;\n&lt;p&gt;Кампаниялардың реті. Негізгі тесттер 2026 жылғы 1–4 қыркүйекте, Mingbird 13–14 қыркүйекте, ал goose және opencode үшін қайталанған тесттер 18–20 қыркүйекте өткізілді. Реті кездейсоқ емес, блокты болды, бұл жүйе күйінің өзгеруіне жол береді. Дегенмен, қайталанған іске қосулар негізгі кампания нәтижелерін растады.&lt;/p&gt;\n&lt;p&gt;Модельдер жиынтығы. Біз бір бэкенд арқылы жұмыс істейтін төрт модельді қолдандық. minicpm5-2b және ll
