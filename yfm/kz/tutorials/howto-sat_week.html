        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Қалай жасау&lt;/em&gt; · 2026-10-04&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Ашық деректер мен компьютерлік көру әдістерін қолдана отырып, Жер бетіндегі өзгерістерді табуды және түсіндіруді үйреніңіз.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"ne-khazhet\"&gt;&lt;a href=\"tutorials/howto-sat_week.html#ne-khazhet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Не қажет&lt;/span&gt;&lt;/a&gt;Не қажет&lt;/h2&gt;\n&lt;p&gt;Талдау үшін сізге жерсеріктік суреттерге қолжетімділік (мысалы, Sentinel Hub немесе Google Earth Engine) және геоақпараттық жүйелермен (ГАЖ) жұмыс істеудің негізгі дағдылары қажет. Жерсеріктік деректер жай ғана сурет емес, әр пикселі спектрлік ақпаратты қамтитын көп арналы матрицалар екенін түсіну маңызды.&lt;/p&gt;\n&lt;h2 id=\"khadamdar\"&gt;&lt;a href=\"tutorials/howto-sat_week.html#khadamdar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қадамдар&lt;/span&gt;&lt;/a&gt;Қадамдар&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Қызығушылық аймағын таңдау: нысанды (ғимараттар, кемелер, ормандар) анықтаңыз. Модельдерді қайта баптамай-ақ нысандарды тану үшін «Считаем объекты на спутниковых снимках без дообучения нейросетей» мақаласындағы әдістерді қолданыңыз.&lt;/li&gt;\n&lt;li&gt;Деректерді жинау: әртүрлі кезеңдердегі суреттерді жүктеп алыңыз. Әртүрлі уақыттағы кадрларды салыстыру өзгерістер динамикасын анықтауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;Өзгерістерді талдау: суреттерді бір-бірінің үстіне қойыңыз. Егер сіз қалалық ортаны талдасаңыз, «Цифровой двойник города: как нейросети проектируют изменения в реальности» мақаласындағы тәсілді қолданыңыз.&lt;/li&gt;\n&lt;li&gt;Тексеру: түсірілім артефактілерін болдырмау үшін деректерді баламалы көздер (карталар, ашық тізілімдер) арқылы тексеріңіз.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"khatelikter-khajda-bolady\"&gt;&lt;a href=\"tutorials/howto-sat_week.html#khatelikter-khajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қателіктер қайда болады&lt;/span&gt;&lt;/a&gt;Қателіктер қайда болады&lt;/h2&gt;\n&lt;p&gt;Басты қателік — көлеңкелерді немесе бұлттарды нақты нысандар деп қабылдау. Сондай-ақ, маусымдық өзгерістерді (мысалы, қардың еруі) антропогендік әсермен жиі шатастырады. Есіңізде болсын: жерсеріктік сурет — бұл бақылау әдісі, ол корреляцияны тіркейді, себеп-салдарлық байланысты дәлелдемейді.&lt;/p&gt;\n&lt;h2 id=\"mysal\"&gt;&lt;a href=\"tutorials/howto-sat_week.html#mysal\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мысал&lt;/span&gt;&lt;/a&gt;Мысал&lt;/h2&gt;\n&lt;p&gt;Сіз жаңа тұрғын үй кешенінің құрылысын бақылағыңыз келеді. Алдымен өткен ай мен ағымдағы айдың суреттерін табасыз. Нысандарды санау алгоритмдерін қолдана отырып, іргетастар санын салыстырасыз. Егер «Цифровой двойник города» мақаласында сипатталған жасанды интеллект агенті құрылыс тығыздығы нормадан асып кеткенін көрсетсе, сіз мұны жерсеріктік суретті құрылыс жоспарымен салыстырып, визуалды түрде растай аласыз.&lt;/p&gt;\n&lt;h2 id=\"negiz-bolghan-makhalalar\"&gt;&lt;a href=\"tutorials/howto-sat_week.html#negiz-bolghan-makhalalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негіз болған мақалалар&lt;/span&gt;&lt;/a&gt;Негіз болған мақалалар&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html\"&gt;Қалалық ортаны жобалау: нейрожелілер көмегімен өзгерістер енгізу&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html\"&gt;Спутниктік суреттердегі нысандарды қайта оқытусыз санау&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Ұғымдар: &lt;a href=\"concepts/spec-geo.html\"&gt;Спутниктер және геодеректер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ашық деректер мен компьютерлік көру әдістерін қолдана отырып, Жер бетіндегі өзгерістерді табуды және түсіндіруді үйреніңіз."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Апта серігі: ғарыштан түсірілген суреттерді өз бетінше талдау","description":"Ашық деректер мен компьютерлік көру әдістерін қолдана отырып, Жер бетіндегі өзгерістерді табуды және түсіндіруді үйреніңіз.","vcsPath":"tutorials/howto-sat_week.md"},"headings":[{"title":"Не қажет","href":"tutorials/howto-sat_week.html#ne-khazhet","level":2},{"title":"Қадамдар","href":"tutorials/howto-sat_week.html#khadamdar","level":2},{"title":"Қателіктер қайда болады","href":"tutorials/howto-sat_week.html#khatelikter-khajda-bolady","level":2},{"title":"Мысал","href":"tutorials/howto-sat_week.html#mysal","level":2},{"title":"Негіз болған мақалалар","href":"tutorials/howto-sat_week.html#negiz-bolghan-makhalalar","level":2}],"title":"Апта серігі: ғарыштан түсірілген суреттерді өз бетінше талдау"},"router":{"pathname":"tutorials/howto-sat_week","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
