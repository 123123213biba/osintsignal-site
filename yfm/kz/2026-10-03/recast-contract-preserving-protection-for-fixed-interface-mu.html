        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"270\" cy=\"150\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"670\" cy=\"230\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Бұлтты нейрожелілердегі&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;деректерді қалай қауіпсіз&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;өңдеуге болады&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f1.jpg\" alt=\"1-сурет: RECAST: тапсырма құрылымын сақтай отырып, бастапқы мазмұнды ауыстыру.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: &lt;a href=\"concepts/recast.html\"&gt;RECAST&lt;/a&gt;: тапсырма құрылымын сақтай отырып, бастапқы мазмұнды ауыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: RECAST: тапсырма құрылымын сақтай отырып, бастапқы мазмұнды ауыстыру. Жоғарыда: иллюстрацияланған баламалар әртүрлі мақсаттарға бағытталған: мәтінді қайта жазу талап етілетін медиа мазмұнды тікелей қамтамасыз етпейді, деректер жиынтығы деңгейіндегі кескін синтезі нақты сұраумен байланысты емес, ал спикерді анонимдеу сөйлеу мазмұнын сақтайды. Төменде: RECAST дәлелдемелер мен сұраулардағы тақырыптарды, нысандарды және мәндерді бірлесіп ауыстырады, сонымен бірге тапсырмаға қатысты қатынастар мен талап етілетін модальділікті сақтайды. Қашықтағы шешуші қорғалған операндтары бар бағдарламаны қайтарады; клиент жауапты алу үшін бағдарламаны орындамас бұрын бастапқы операндтарды жергілікті түрде қалпына келтіреді. Диаграмма мысалы мәтін, диаграммалар және сөйлеу үшін бірыңғай қорғау құрылымын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Графиктер мен аудиофайлдарды қуатты бұлтты модельдерге жіберу құпиялылыққа қауіп төндіреді. Зерттеушілер ReCast жүйесін ұсынды, ол файлдардың мазмұнын ауыстырып, нейрожелі үшін олардың құрылымын сақтап қалады. Серверден жауап алғаннан кейін, жергілікті компьютер бастапқы мәндерді қалпына келтіреді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ReCast қорғалған деректермен жұмыс істегенде 92,43% дәлдікті сақтайды.&lt;/li&gt;\n&lt;li&gt;Жүйе бастапқы контенттің ағып кетуін 7,95%-ға дейін төмендетеді.&lt;/li&gt;\n&lt;li&gt;Әдіс қайта оқытусыз графиктермен, аудиомен және мәтінмен жұмыс істейді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;ReCast деректерді мәтіндік «қараламаға» айналдыратын &lt;a href=\"concepts/agentic-system.html\"&gt;агенттік жүйе&lt;/a&gt; ретінде жұмыс істейді. Жүйе нысандардың атаулары мен тақырыптарын ауыстыру үшін 4B параметрі бар жергілікті модельді пайдаланады және мәндерді қорғау үшін кері түрлендірілетін сандық картаны қолданады. Бұл нақты деректерді жасырумен қатар, есепті шешуге қажетті логикалық байланыстарды сақтап қалуға мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Өңдеуден кейін деректер интерфейс талаптарына сәйкес келетін генератор арқылы бастапқы форматқа (кескін немесе аудио) қайтарылады. Бұлтты модель «қорғалған» нұсқаны алады, есептеулерді орындайды және клиент жергілікті деңгейде бастапқы сандармен орындайтын бағдарламаны қайтарады. Бұл құпия ақпараттың пайдаланушы құрылғысынан шығып кетпеуін қамтамасыз етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс 4000 ChartQA және NMSQA мысалдарында сыналды; күрделірек деректерде тиімділік әртүрлі болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қашықтағы мультимодальды модельдер графиктер мен сөйлеуді талдауда сандық пайымдаудың жоғары қабілетін көрсетеді, алайда жеке деректерді сыртқы серверлерге жіберу ақпараттың жарияланып кету қаупін тудырады. Мәтінді тазарту әдістері медиа интерфейстер үшін жеткіліксіз, ал жеке басты жасыру тапсырманың мазмұнын ашпай қалдырады. Авторлар RECAST жүйесін ұсынады — бұл бастапқы деректердің мазмұнын алмастыратын, бірақ тапсырма үшін маңызды байланыстар мен кіріс модальділігін сақтайтын &lt;a href=\"concepts/agentnyy-plagin.html\"&gt;агенттік плагин&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агенттік плагин — бұл пайдаланушы атынан автономды әрекеттерді орындайтын бағдарламалық модуль, ол сезімтал деректерді сыртқы серверге жібермей өңдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;RECAST жүйесі кіріс деректерін жергілікті деңгейде мәтіндік дәлелдеме-сұраныс жазбасына айналдырады. 4 миллиард параметрі бар (4B) дистилденген модельдің көмегімен жүйе субъектілер мен тақырыптарды қайта жазады, ал мәндер жергілікті кері карта арқылы алмастырылады.&lt;/p&gt;\n&lt;p&gt;Реконструкция агенті қорғалған жазба негізінде қажетті медиа деректерді жасайды және тексереді. Қашықтағы шешуші бағдарлама қайтарады, оның қорғалған операндтары орындалғанға дейін жергілікті деңгейде қалпына келтіріледі. ChartQA және NMSQA жиынтықтарынан алынған 4000 мысалда RECAST 75,10% дәлдікке қол жеткізді, бұл қорғалмаған қашықтағы дәлдіктің 92,43% құрайды. Модельге негізделген &lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt; шешушіге жіберілген сұраныстардың 7,95% жағдайында бастапқы мазмұнның ағып кеткенін анықтады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST 75,10% дәлдікті қамтамасыз етеді және бастапқы модельдердің 92,43% тиімділігін сақтай отырып, деректердің ағып кету қаупін азайтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер тест деректер жиынтығында алынған; әдістің нақты жағдайдағы тиімділігі медиа файлдардың күрделілігіне байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"kontekst-zhaene-maesele\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#kontekst-zhaene-maesele\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контекст және мәселе&lt;/span&gt;&lt;/a&gt;Контекст және мәселе&lt;/h4&gt;\n&lt;p&gt;Жергілікті және қашықтағы ынтымақтастық пайдаланушыларға деректерді өз құрылғыларында сақтай отырып, қашықтағы модельдердің есептеу қуатын пайдалануға мүмкіндік береді. Мәтіндік деректер үшін бұл бағыт кеңінен зерттелген: сұраныс жіберілмес бұрын жергілікті модель оны дифференциалды құпиялылық немесе басқа әдістермен қайта жаза алады. Алайда, көптеген құпия деректер мәтін түрінде емес, бизнес-есептердегі графиктер немесе қоңыраулар жазбалары түрінде болады. Жергілікті модельдер әлі де мультимодальды қабылдау мен есептеулер бойынша қашықтағы модельдерден артта қалуда, ал қашықтағы қызметтер қатаң форматтағы (кескін немесе аудио) деректерді талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мультимодальды деректерді қорғаудың қолданыстағы әдістері форматты сақтай алмайды немесе графиктердегі нақты мәндер сияқты мазмұнды деректерді жасыра алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Қолданыстағы тәсілдер деректерді мәтінге айналдырады, бұл мультимодальды интерфейстермен үйлеспейді. Басқа әдістер тек жеке басын анықтайтын белгілерді (мысалы, дауысты) жасырады, бірақ мазмұнды деректер (мәндер) қашықтағы модель үшін ашық қалады. Сандық есептеу тапсырмалары үшін деректер мен сұраныстар дәйекті түрде өзгертілуі керек.&lt;/p&gt;\n&lt;h4 id=\"recast-aedisi\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#recast-aedisi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RECAST әдісі&lt;/span&gt;&lt;/a&gt;RECAST әдісі&lt;/h4&gt;\n&lt;p&gt;RECAST жүйесі тапсырма қажеттіліктері (мәндер арасындағы қатынастар) мен дереккөз мазмұнын (мәндер, тақырыптар) бөлу арқылы осы олқылықты толтырады. Бұл ортақ мәтіндік дәлелдеме-сұраныс жазбасы төңірегінде құрылған &lt;a href=\"concepts/agentnyy-konveyer.html\"&gt;агенттік құбыр желісі&lt;/a&gt; (Сурет 1). Процесс жергілікті деректерді қамтуды, оларды қайта жазуды және модальды реконструкцияны қамтиды. Қашықтағы шешуші Python бағдарламасын қайтарады, ол жергілікті құрылғыда бастапқы мәндер негізінде орындалады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f1.jpg\" alt=\"1-сурет: RECAST: тапсырма құрылымын сақтай отырып, бастапқы мазмұнды ауыстыру.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: RECAST: тапсырма құрылымын сақтай отырып, бастапқы мазмұнды ауыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: RECAST: тапсырма құрылымын сақтай отырып, бастапқы мазмұнды ауыстыру. Жоғарыда: иллюстрацияланған баламалар әртүрлі мақсаттарға бағытталған: мәтінді қайта жазу талап етілетін медиа мазмұнды тікелей қамтамасыз етпейді, деректер жиынтығы деңгейіндегі кескін синтезі нақты сұраумен байланысты емес, ал спикерді анонимдеу сөйлеу мазмұнын сақтайды. Төменде: RECAST дәлелдемелер мен сұраулардағы тақырыптарды, нысандарды және мәндерді бірлесіп ауыстырады, сонымен бірге тапсырмаға қатысты қатынастар мен талап етілетін модальділікті сақтайды. Қашықтағы шешуші қорғалған операндтары бар бағдарламаны қайтарады; клиент жауапты алу үшін бағдарламаны орындамас бұрын бастапқы операндтарды жергілікті түрде қалпына келтіреді. Диаграмма мысалы мәтін, диаграммалар және сөйлеу үшін бірыңғай қорғау құрылымын көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агенттік құбыр желісі — бұл жеке модульдер (агенттер) деректерді өңдеу және тексеру сияқты тапсырмаларды орындайтын жүйе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жұмыстың негізгі нәтижелері:&lt;br /&gt;\n• RECAST — бұл модаль немесе интерфейс өзгерген кезде қайта оқытуды талап етпейтін агенттік құбыр желісі.&lt;br /&gt;\n• 4 млрд параметрі бар жергілікті модель көмегімен қайта жазу модулі әзірленді, ол сандық қатынастарды сақтай отырып, атаулар мен домендерді өзгертеді.&lt;br /&gt;\n• 4000 ChartQA және NMSQA үлгілерінде RECAST қорғалмаған дәлдіктің 92,43%-ын сақтап қалды, мұнда дереккөз мазмұнының ағып кетуі небәрі 7,95%-ды құрады. Дистилляция дәлдікті 6,40 пайыздық тармаққа арттырды және ағып кетуді 39,75%-дан 7,95%-ға дейін төмендетті.&lt;/p&gt;\n&lt;h4 id=\"bajlanysty-zhumystar\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#bajlanysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;БАЙЛАНЫСТЫ ЖҰМЫСТАР&lt;/span&gt;&lt;/a&gt;БАЙЛАНЫСТЫ ЖҰМЫСТАР&lt;/h4&gt;\n&lt;p&gt;2.1 TEXTPRIVACY&lt;br /&gt;\nМәтіндік деректерді қорғау әдістері жеке сөздерді жоюдан бастап құжатты толық қайта жазуға дейін қамтиды. SanText және CusText сияқты тәсілдер дифференциалды құпиялылық негізінде сөздерді семантикалық жағынан ұқсас баламаларымен алмастырады, ал DP-Prompt және DP-MLM қорғалған, бірақ мағыналы мәтін жасау үшін тілдік модельдерді қолданады. DP-Fusion әдісі кіріс деректерінің әртүрлі нұсқаларына негізделген генерация таралуын біріктіру арқылы сезімтал токендердің әсерін шектейді. Анық идентификаторлардан бөлек, контекстік белгілер де жеке атрибуттарды ашып қоюы мүмкін. Бәсекелес анонимдеу (adversarial anonymization) мәтіндік түзетулерді басқару үшін қорытынды жасау шабуылдарын пайдаланады, ал RLAA бұл тәсілді жергілікті модельдер үшін бейімдейді. STAMP және DP-ST сияқты заманауи әдістер тапсырманың пайдалылығы мен семантикалық құрылымын ескереді. RECAST осы тәсілдерді толықтырып, сандық алмастырудан кейін дәлелдер мен сұраулардың сәйкестігін қамтамасыз етеді және нәтижені белгіленген медиа интерфейс арқылы пайдалануға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST мәтінді аралық құрал ретінде пайдаланып, қорғалған деректерді интерфейс талап ететін пішімде қайта қалпына келтіреді және логикалық байланыстарды сақтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.2 ЖЕРГІЛІКТІ ЖӘНЕ ҚАШЫҚТАН ЫНТЫМАҚТАСТЫҚ&lt;br /&gt;\nЖергілікті-қашықтықтан ынтымақтастық жергілікті модельге қуаттырақ қашықтықтан модель көретін деректер көлемін бақылауға мүмкіндік береді. CoGenesis, PAPILLON және InferDPT сияқты әдістер жергілікті және қашықтықтан генерацияны үйлестіріп, қашықтықтан модельге ұсынылатын құпия контекстті шектейді. Privacy-R1, Veilmind және тәуекелдерді бағалау жүйелері сияқты жаңа әзірлемелер тапсырмаларды пайдаланушы ниеті мен контекстік ағып кетулерге сезімтал етеді. Ең жақын тәсіл — сандық пайымдау тапсырмасының тақырыбын өзгерту, сандарды алмастыру және бастапқы жауапты қашықтықтан модельден алынған бағдарлама көмегімен жергілікті деңгейде қалпына келтіру. RECAST бұл схеманы мультимодальды кіріс және шығыс деректеріне кеңейтеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/program-aided-reasoning.html\"&gt;Бағдарлама көмегімен пайымдау&lt;/a&gt; (program-aided reasoning) — модель есептеулер үшін код генерациялайтын әдіс, ол логикалық қорытындылардың дәлдігін арттырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.3 МУЛЬТИМОДАЛЬДЫ ЖӘНЕ МЕДИА ҚҰПИЯЛЫЛЫҒЫ&lt;br /&gt;\nМедиа деректерімен жұмыс істегенде де құпиялылық тәуекелдері туындайды: мультимодальды модельдер тікелей идентификаторлары жоқ суреттерден де жеке деректерді анықтай алады. Қолданыстағы шешімдерге бастапқы деректерді дерексіз бейнелермен (символдық көріністер) алмастыру немесе визуалды нұсқауларды мәтінге аудару жатады. Алайда, мұндай әдістер көбінесе графиктер немесе сигналдар сияқты нақты пішімдерді талап ететін медиа интерфейстерімен үйлеспейді. Дауысты анонимдеу немесе сөйлеуді бүркемелеу сияқты медиа деңгейіндегі әдістер модальділікті сақтайды, бірақ идентификация белгілерін өзгертеді. RECAST әр сұрау үшін субъектілерді, тақырыптар мен мәндерді алмастыруымен ерекшеленеді, сонымен бірге сандық пайымдаулар үшін қажетті «дәлел-сұрау» байланыстарын сақтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Медиа қорғау әдістерінің көпшілігі деректер синтезіне немесе анонимдеуге бағытталған, ал RECAST сандық есептеулер үшін функционалды байланыстарды сақтауға назар аударады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;RECAST жүйесі бастапқы деректер мен тапсырмаларды бөліп, ортақ сұраныс пен дәлелдемелер жазбасын пайдаланады. Процесс жергілікті деректерді жинауды, семантикалық және сандық қайта өңдеуді, сондай-ақ қорғалған жазбаны қажетті модальділікте қайта құруды қамтиды (2-сурет). Қашықтағы шешуші бағдарлама алады, оның операндтары орындалғанға дейін жергілікті деңгейде қалпына келтіріледі.&lt;/p&gt;\n&lt;p&gt;3.1 ТАПСЫРМА ЖӘНЕ ФРЕЙМВОРКҚА ШОЛУ&lt;br /&gt;\nЖеке X деректері мен q мәтіндік сұранысы үшін жүйе m және r модальділіктерін (мәтін, кескін, аудио) пайдаланады. Мақсат — бастапқы деректерге тән мәндер мен тақырыптардың ашылуын азайту, сонымен бірге дәлелдеме мен сұраныс арасындағы байланысты сақтау. Қорғалған жазба eD = Hh(Rθ(D)) ретінде қалыптасады, мұнда Rθ — семантикалық қайта жазушы, Hh — сандық түрлендіру. Қашықтағы қызмет тек қорғалған контентті алады, ал жергілікті клиент қалпына келтіруді жүзеге асырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST жүйесі мәндерді алмастыру және семантиканы қайта жазу арқылы деректерді қорғайды, ал жауаптарды қалпына келтіру тек пайдаланушы жағында жүреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.2 МУЛЬТИМОДАЛЬДІ ДӘЛЕЛДЕМЕЛЕРДІ ЖИНАУ&lt;br /&gt;\nДеректерді жинау үшін мамандандырылған модельдер қолданылады: графиктер үшін Qwen3-VL-8B-Instruct және аудио транскрипциясы үшін Qwen3-&lt;a href=\"concepts/attack-success-rate.html\"&gt;ASR&lt;/a&gt;-1.7B. Деректер бес өрістен тұратын бірыңғай форматқа келтіріледі: id, модальділік, контекст, сұрақ және жауап нұсқалары. Интерфейс нақты модельге тәуелді емес, бұл деректер схемасы сақталған жағдайда жинау модульдерін ауыстыруға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/normalizatsiya.html\"&gt;Нормализация&lt;/a&gt; — деректерді бірыңғай стандартқа келтіру, осылайша әртүрлі модельдер олармен ортақ үлгі негізінде жұмыс істей алады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.3 БІРЛЕСКЕН ҚАЙТА ЖАЗУ ЖӘНЕ САНДАРДЫ ҚОРҒАУ&lt;br /&gt;\nСемантикалық қайта жазу дәлелдемелер мен сұранысты дәйекті мәтінге біріктіріп, операциялар логикасы мен жауап түрлерін сақтайды. Жергілікті Qwen3-4B моделін оқыту үшін GPT-5.6-Sol деректері негізінде QLoRA әдісі қолданылады. Оқу жиынтығы 15 795 жұпты құрады. Сандық мәндер h:V→eV инъективті бейнелеу арқылы қорғалады, мұнда диапазондар (Bk) ішіндегі мәндер реттілікті сақтай отырып ауыстырылады, ал жылдар (Yg) δg ығысуымен өзгереді. 0-ден 15-ке дейінгі бүтін сандар өзгеріссіз қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс топтар ішіндегі мәндер реттілігін сақтайды, бірақ сандар арасындағы бастапқы қатынастардың немесе айырмашылықтардың сақталуына кепілдік бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Операндтарды жергілікті қалпына келтіру  қорғалған белгілерін h−1 кері бейнелеу арқылы бастапқы v мәндеріне ауыстыру арқылы жүзеге асырылады. Түпкілікті жауап Exec(Ih−1[eP]) бағдарламасын орындау арқылы жергілікті есептеледі.&lt;/p&gt;\n&lt;p&gt;Графиктер мен сөйлеуді реконструкциялау. Қашықтықтан кодтау моделі қорғалған деректерді график түрі, санаттар, қатарлар, мәндер, белгілер, өлшем бірліктері мен түстерді қамтитын декларативті ChartSpec-ке аударады. Жергілікті құрылым мен мәндерді тексергеннен кейін, Matplotlib шаблондары спецификацияны визуализациялайды. Қашықтықтан көру моделі кескінді қорғалған жазбамен салыстырып, ең көбі төрт түзету үшін құрылымдық кері байланыс береді. Қашықтықтағы модельдердің ешқайсысы бастапқы графикке қол жеткізе алмайды. Түзету сәтсіз болған жағдайда, жүйе интерфейс растаған кезде ғана валидацияланған кестеге ауысады; әйтпесе сұраныс қабылданбайды.&lt;/p&gt;\n&lt;p&gt;Сөйлеу мен мәтінді реконструкциялау. Қашықтықтан мәтіннен сөйлеуге (TTS) қызметі қорғалған үзінділерді синтездейді. Басқарушы әрбір үміткер толқын пішінін транскрипциялайды, түсініктілікті және қорғалған сандық көрсеткіштерді тексереді, қателіктер болса қайта генерациялайды. Мәтіндік интерфейстер үшін қорғалған деректер сұраныспен бірге сериализацияланады.&lt;/p&gt;\n&lt;p&gt;Екі жақты шығару тексеруі. &lt;span class=\"yfm-latex\" data-content=\"V_%7Bprotected%7D%2C%20V_%7Bsource%7D%20%5Cin%20%5C%7B0%2C%201%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; сәйкесінше қорғалған жазба мен жергілікті дереккөздің сәйкестігін тексеруден өтуді білдіреді (1 - сәттілік, 0 - қате). Біріншісі графиктер үшін визуализацияланған мәндер мен белгілерді, екіншісі қайта жазылған нысандарды дереккөз рөлдерімен салыстырады. Шығару туралы шешім &lt;span class=\"yfm-latex\" data-content=\"V_%7Brelease%7D%20%5Cin%20%5C%7B0%2C%201%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; былай анықталады: &lt;span class=\"yfm-latex\" data-content=\"V_%7Brelease%7D%20%3D%20V_%7Bprotected%7D%20%5Cwedge%20V_%7Bsource%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Деректер тек екі шарт та орындалғанда (Vrelease = 1) шығарылады, бұл қауіпсіздік пен семантикалық дәлдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"taezhiribeler\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#taezhiribeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ТӘЖІРИБЕЛЕР&lt;/span&gt;&lt;/a&gt;ТӘЖІРИБЕЛЕР&lt;/h4&gt;\n&lt;p&gt;RECAST үш бағытта бағаланады: пайымдаудың пайдалылығы, тұрақтылық және компоненттердің үлесі. Біз эксперименттік қондырғыларды, негізгі нәтижелерді, деректер жиынтығынан тыс жалпылауды, кезең-кезеңімен абляцияны және ағып кетуді анықтайтын AI төрешісін сипаттаймыз.&lt;/p&gt;\n&lt;p&gt;4.1 ЭКСПЕРИМЕНТТІК ҚОНДЫРҒЫЛАР&lt;/p&gt;\n&lt;p&gt;Деректер жиынтығы. Біз сандық жауаптары бар төрт жиынтықта бағалаймыз. Таралу ішіндегі (ID) бағалау үшін ChartQA және NMSQA-дан 2000 мысалдан қолданылды. Дистилляция қоры 9370 ChartQA және 7000 NMSQA жазбасын қамтыды (15 480 оқыту, 315 валидация үшін). Таралудан тыс (OOD) бағалау үшін ChartX және Spoken-MQA-дан 2000 мысалдан қолданылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — жүйенің маңыздылығын анықтау үшін оның компоненттерін кезекпен өшіріп тексеру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Базалық модельдер. Біз RECAST-ты кешенді шешімдермен және жеке кезеңдермен салыстырамыз. Remote-native бастапқы деректерді қашықтықтағы шешушіге жібереді. Gemma-4-E4B және Qwen2.5-Omni-3B нөлдік ағып кетуі бар жергілікті эталондар болып табылады. 2-кезеңде біз бапталған Rewriter-ді Qwen3-4B және GPT-5.6-Sol мұғалімімен салыстырамыз. 3-кезеңде баламалы әдістер (PSIC, SPTI, AudioShield) деректер экспозициясы деңгейі бойынша бағаланады, өйткені олар QA үшін сандық операндтарды қалпына келтірмейді. Сондай-ақ, Codex &lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt; және DeepSeek &lt;a href=\"concepts/harness.html\"&gt;Harness&lt;/a&gt; реконструкциялау стратегиялары салыстырылады.&lt;/p&gt;\n&lt;p&gt;Реализация. 1-кезеңде Qwen3-VL-8B-Instruct және Qwen3-ASR-1.7B конвертация үшін қолданылады. 2-кезеңде QLoRA арқылы бапталған Qwen3-4B қолданылады. 3-кезеңде DeepSeek-V4 модельдері ChartSpec генерациялайды, Qwen3-TTS-Flash сөйлеуді синтездейді және Qwen3.5-Omni-Plus қашықтықтағы шешуші ретінде жұмыс істейді.&lt;/p&gt;\n&lt;h4 id=\"audioshield-tolykh-khalpyna-keltiruding-bolmauy\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#audioshield-tolykh-khalpyna-keltiruding-bolmauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AudioShield: толық қалпына келтірудің болмауы&lt;/span&gt;&lt;/a&gt;AudioShield: толық қалпына келтірудің болмауы&lt;/h4&gt;\n&lt;p&gt;4.2 Негізгі нәтижелер. Зерттеу үш сценарийді салыстырады: бастапқы деректері бар жергілікті модельдер, қорғалған медиа файлдары бар RECAST жүйесі және сервер бастапқы деректерді алатын қашықтан сұрау. RECAST ChartQA бойынша 70,20% (нормаланған дәлдік 93,48%) және NMSQA бойынша 80,00% (91,53%) дәлдікті көрсетеді, жалпы дәлдігі 75,10% (92,43%) және бастапқы мазмұнның ағып кетуі 7,95% деңгейінде.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST жүйесі 7,95% деректердің ағып кету шегімен 75,10% жалпы дәлдікті қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4.3 Әртүрлі деректер жиынтығында бағалау. Qwen3-4B моделін қолдана отырып, in-distribution (ID) және out-of-distribution (OOD) жағдайларында өткізілген тестілер OOD деректерінде (ChartX және Spoken-MQA) дәлдік сәйкесінше 62,40% және 79,40%-ға дейін төмендегенін көрсетті (7,80 және 0,60 пайыздық тармаққа төмендеу). Деректердің ағып кетуі кескіндер үшін 8,00% (ID) және 1,40% (OOD), ал аудио үшін 7,90% (ID) және 5,90% (OOD) құрады. Аудиодағы дәлдіктің азырақ төмендеуі модельдің сөйлеу деректеріндегі домен өзгерістеріне қатысты тұрақтырақ екенін көрсетеді.&lt;/p&gt;\n&lt;p&gt;4.4 Абляциялық зерттеулер. Тікелей мультимодальды енгізу мен ұсынылған бөлінген өңдеу жолын салыстыру бөлудің жалпы дәлдікті 44,60%-дан 65,85%-ға (+21,25 п.т.) дейін арттыратынын көрсетті. Реконструкция кезеңін (Stage 3) бағалау кезінде қорғалған мәтінді пайдалану медиа реконструкциясына қарағанда 1,75 п.т. артықшылық беретіні анықталды. Алайда, аудио үшін толқын пішініне реконструкциялау интерфейстермен үйлесімділік үшін қажет, дегенмен бұл мәтіндік көрініске қарағанда 3,90 п.т. дәлдіктің жоғалуына әкеледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляциялық зерттеу — бұл жүйе компоненттерін кезектесіп өшіру немесе ауыстыру арқылы олардың үлесін тексеру әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4.5 &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-төрешінің жарамдылығы. Деректердің ағып кетуі әрқашан жолдардың қарапайым сәйкестігіне байланысты болмағандықтан, бағалауда автоматтандырылған &lt;a href=\"concepts/llm-sudya.html\"&gt;LLM-төреші&lt;/a&gt; пайдаланылды. Оның шешімдері 400 деректер жұбында адам белгілерімен салыстырылды. Сәйкестік 91,50% құрады (Коэн Каппа коэффициенті κ = 0,83), бұл автоматты бағалаудың сенімділігін растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ағып кетуді бағалау адам бағалауынан өзгеше жүйелі қателіктері болуы мүмкін LLM-төрешіге негізделген.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Біз RECAST жүйесін ұсындық — бұл мультимодальды интерфейстер арқылы сандық пайымдаулар кезінде деректерді қорғау және келісімшарт талаптарын сақтау жүйесі. Негізгі идея — қызмет талап ететін міндет байланыстары мен медиа пішімін сақтай отырып, дереккөз мазмұнын ауыстыру. Дәлелдер мен сұраулардың ортақ жазбасы контентті қорғауды модальділіктен ажыратады, ал операндтарды жергілікті қалпына келтіру қорғалған деректердегі қашықтықтан есептеулерді бастапқы мәндермен жұмыс істеуден бөледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST ChartQA және NMSQA жиынтықтарында қашықтықтан есептеу дәлдігінің 92,43% сақтайды, ал аудит моделі 7,95% жағдайда деректердің ағып кетуін анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;ChartQA және NMSQA тесттерінде RECAST жүйесі қорғалмаған қашықтықтан есептеулермен салыстырғанда 92,43% дәлдікті сақтайды. Контенттің ағып кетуін тексеретін аудит моделі шешушімен (solver) байланысты контексттердің 7,95% бөлігінде ағып кетуді тіркеді. 4 млрд параметрі бар дистилденген жергілікті қайта жазушыны (rewriter) пайдаланған кезде, жалпы дәлдік автономды мұғалім конфигурациясына қарағанда небәрі 0,55 пайыздық тармаққа төмендейді. Реконструкция агенті графиктермен жұмыс істеуде балама әдістерден басым түседі, ал ChartX және Spoken-MQA нәтижелері модельдің оқыту деректерінен тыс жерде де жұмыс істей алатынын растайды.&lt;/p&gt;\n&lt;h4 id=\"zhasandy-intellektti-pajdalanu-turaly-maelimdeme\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#zhasandy-intellektti-pajdalanu-turaly-maelimdeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЖАСАНДЫ ИНТЕЛЛЕКТТІ ПАЙДАЛАНУ ТУРАЛЫ МӘЛІМДЕМЕ&lt;/span&gt;&lt;/a&gt;ЖАСАНДЫ ИНТЕЛЛЕКТТІ ПАЙДАЛАНУ ТУРАЛЫ МӘЛІМДЕМЕ&lt;/h4&gt;\n&lt;p&gt;Генеративті жасанды интеллект құралдары тілді редакциялау, қолжазба құрылымын жақсарту және кодты редакциялауға көмектесу үшін пайдаланылды. Барлық ғылыми идеялар мен әдіснамалық шешімдер авторлар тарапынан тексерілді және олар жұмыстың түпкілікті мазмұны үшін толық жауапты.&lt;/p&gt;\n&lt;h4 id=\"khajtalau-muemkindigi-turaly-maelimdeme\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#khajtalau-muemkindigi-turaly-maelimdeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ҚАЙТАЛАУ МҮМКІНДІГІ ТУРАЛЫ МӘЛІМДЕМЕ&lt;/span&gt;&lt;/a&gt;ҚАЙТАЛАУ МҮМКІНДІГІ ТУРАЛЫ МӘЛІМДЕМЕ&lt;/h4&gt;\n&lt;p&gt;Нәтижелердің қайталануын қамтамасыз ету үшін авторлар кодты, промпттарды, дистилденген адаптерді, мұғалім іздерін, іске қосу манифестерін (орта мен деректердің хештерімен) және аудит логтарын ұсынады.&lt;/p&gt;\n&lt;h4 id=\"etikalykh-maelimdeme\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#etikalykh-maelimdeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭТИКАЛЫҚ МӘЛІМДЕМЕ&lt;/span&gt;&lt;/a&gt;ЭТИКАЛЫҚ МӘЛІМДЕМЕ&lt;/h4&gt;\n&lt;p&gt;ChartQA және NMSQA ашық бенчмарктері пайдаланылды. Калибрлеу процесіне мақала авторлары қатысты. Ағып кетуді бағалау механизмі бастапқы деректермен тек бағалау процесі ішінде жұмыс істейді; нақты пайдалану кезінде бастапқы деректер жергілікті күйде қалады, бұл келісімшарттық бақылаумен бірге қауіпсіздікті арттырады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f2.jpg\" alt=\"2-сурет: RECAST шолуы. Конвейер алдымен мультимодальді кіріс деректерін бірыңғай мәтіндік көрініске түрлендіреді (3.2-бө\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: RECAST шолуы. Конвейер алдымен мультимодальді кіріс деректерін бірыңғай мәтіндік көрініске түрлендіреді (3.2-бөлім), содан кейін нысандар мен сандарды қорғау үшін тақырыпты қайта жазуды және жергілікті сандық қайта карталауды қолданады (3.3-бөлім).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: RECAST шолуы. Конвейер алдымен мультимодальді кіріс деректерін бірыңғай мәтіндік көрініске түрлендіреді (3.2-бөлім), содан кейін нысандар мен сандарды қорғау үшін тақырыпты қайта жазуды және жергілікті сандық қайта карталауды қолданады (3.3-бөлім). Қорғалған мәтін кейіннен бастапқы модальділіктегі суррогатқа қайта құрылады, ол ChartSpec негізіндегі рендеринг пен тексеру арқылы диаграммаларды қайта жасайды, мәтінді тікелей береді және аудионы прокси-сөйлеу ретінде синтездейді (3.4-бөлім). Суреттегі мысал осы конвейерді көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f3.jpg\" alt=\"3-сурет: Бірлескен қайта жазу және сандық қорғау.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Бірлескен қайта жазу және сандық қорғау.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Бірлескен қайта жазу және сандық қорғау. Дистилденген жергілікті қайта жазушы сандық литералдарды сақтай отырып, дәлелдемелер мен сұраулар бойынша нысандар мен тақырыптарды дәйекті түрде өзгертеді. Сұрауға тән жеке карта қолдау көрсетілетін реляциялық шектеулер шеңберінде сандық мәндерді ауыстырады. Оның кері функциясы операндтарды қалпына келтіру үшін жергілікті деңгейде қалады. 3-суретте көрсетілгендей, бұл кезең дәлелдеме-сұрау жазбасын екі өзара толықтырушы түрлендіру арқылы қорғайды: дистилденген жергілікті қайта жазушы дәлелдеме-сұрау сәйкестігін сақтай отырып, нысандар мен тақырыптарды бірлесіп өзгертеді, ал сұрауға тән сандық карта мәндерді нақты реляциялық шектеулерге сәйкес алмастырады. Кері карта қашықтағы шешуші қайтарған бағдарламадағы операндтарды қалпына келтіру үшін жергілікті деңгейде қалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f4.jpg\" alt=\"4-сурет: Модальділікті қайта құру және шығарылымды тексеру.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Модальділікті қайта құру және шығарылымды тексеру.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: Модальділікті қайта құру және шығарылымды тексеру. Интерфейс қайта құру плагинін таңдайды. Диаграммалар спецификацияны генерациялауды, жергілікті рендерингті және рецензенттің басшылығымен түзетуді пайдаланады; сөйлеу синтезді, одан кейін транскрипция негізіндегі тексерулерді пайдаланады; мәтін тікелей сериализацияланады. Шығарылым қорғалған жазбаның сәйкестігін де, дереккөз сәйкестігін жергілікті тексеруді де талап етеді. 4-суретте көрсетілгендей, қайта құру агенті eD-ді «генерациялау-тексеру-түзету» циклі арқылы интерфейске үйлесімді артефактіге түрлендіреді. Ол бастапқы диаграмма көрінісін немесе спикердің жеке басын қайталауды емес, қорғалған дәлелдемелерді сенімді түрде көрсетуді мақсат етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f5.jpg\" alt=\"5-сурет: Кескін жазбаларындағы диаграмма түрлері (a; анықтауға келмейтін типтегі 32 жазба алынып тасталды) және дистилля\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Кескін жазбаларындағы диаграмма түрлері (a; анықтауға келмейтін типтегі 32 жазба алынып тасталды) және дистилляция корпусындағы аудио жазбалардың тақырыптары (b).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f6.jpg\" alt=\"6-сурет: Кескін жазбаларындағы диаграммалардың әрбір түрі бойынша сұрақ операциялары. Әрбір жолдың қосындысы 100%-ды құр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Кескін жазбаларындағы диаграммалардың әрбір түрі бойынша сұрақ операциялары. Әрбір жолдың қосындысы 100%-ды құрайды; сұр сандар барлық кескін жазбаларындағы әрбір операцияның үлесін көрсетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f7.jpg\" alt=\"7-сурет: Кескін (a) және аудио (b) жазбаларының тақырыптары. Дөңгелектің ауданы жазбалар үлесіне пропорционалды; дөңгеле\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Кескін (a) және аудио (b) жазбаларының тақырыптары. Дөңгелектің ауданы жазбалар үлесіне пропорционалды; дөңгелектің орналасуы ешқандай мағына бермейді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f8.jpg\" alt=\"8-сурет: Мұғалім қайта жазғанға дейінгі және одан кейінгі кескін (a, b) мен аудио (c, d) жазбаларындағы ең жиі кездесеті\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Мұғалім қайта жазғанға дейінгі және одан кейінгі кескін (a, b) мен аудио (c, d) жазбаларындағы ең жиі кездесетін толық мағыналы сөздер. Сөздің өлшемі мен реңкі жиілікке байланысты артады; диаграмма сипаттамасы мен көмекші сөздер алып тасталған.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f9.jpg\" alt=\"9-сурет: Төрт ChartQA салыстыруы: кіріс деректері, SPTI (Wang et al., 2025), PSIC (Shen et al., 2025), RLAA (Duan et al.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет: Төрт ChartQA салыстыруы: кіріс деректері, SPTI (Wang et al., 2025), PSIC (Shen et al., 2025), RLAA (Duan et al., 2026), Eternis (Eternis, 2025) және RECAST. SPTI үлгілері жұпталмаған; басқа нәтижелер бастапқы үлгінің ID сәйкестендіргішіне сәйкес келеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f10.jpg\" alt=\"10-сурет: Бес NMSQA аудио салыстыруы: кіріс транскрипті, AudioShield (Jin et al., 2025) қорғалған аудио ASR, RLAA (Duan \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет: Бес NMSQA аудио салыстыруы: кіріс транскрипті, AudioShield (Jin et al., 2025) қорғалған аудио ASR, RLAA (Duan et al., 2026) және Eternis (Eternis, 2025) қорғалған матні, сондай-ақ RECAST транскрипті.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бұлтты AI&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жүйелерінде&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;деректердің&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;таралуы&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кері шифрмен&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;контентті&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алмастыру&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;есептеу&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дәлдігінің 92%&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" fon
