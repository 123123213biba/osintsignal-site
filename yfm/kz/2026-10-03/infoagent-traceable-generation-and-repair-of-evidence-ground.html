        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"143\" cy=\"154\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"557\" cy=\"219\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · PROVENANCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Жасанды интеллект көмегімен&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;қатесіз инфографика жасау&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жолы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f1.jpg\" alt=\"1-сурет: InfoAgent шолуы. Пайдаланушы сұранысы, алынған дәлелдер және дизайн приорлары типтелген IVD-ге компиляцияланады\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: &lt;a href=\"concepts/infoagent.html\"&gt;InfoAgent&lt;/a&gt; шолуы. Пайдаланушы сұранысы, алынған дәлелдер және дизайн приорлары типтелген &lt;a href=\"concepts/infographic-visual-description.html\"&gt;IVD&lt;/a&gt;-ге компиляцияланады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: InfoAgent шолуы. Пайдаланушы сұранысы, алынған дәлелдер және дизайн приорлары типтелген IVD-ге компиляцияланады. Әрбір ақпараттық элемент дәлелдемелердің шығу тегін, кеңістіктік аймақты, орындалу бағытын, байланыстыру тәуелділіктерін және тексерілетін міндеттемелерді сақтайды. Көрнекі, символдық және байланыстырушы қабаттар орындалу іздерімен үйлеседі. Содан кейін IVD басқаратын верификация элементтер бойынша индекстелген бұзушылықтарды мазмұндық, символдық, байланыстырушы, макеттік немесе көрнекі түзетулермен сәйкестендіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Жасанды интеллект жасаған инфографикада мәтін мен графика сәйкес келмейтін қателер жиі кездеседі. Зерттеушілер ұсынған InfoAgent жүйесі визуалды элементтерді дереккөздермен байланыстыратын арнайы граф құрылымын қолданады. Бұл тәсіл бүкіл суретті қайта жасамай-ақ, тек қате бөліктерді түзетуге мүмкіндік береді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;IVD әр визуалды нысанды нақты дереккөзбен байланыстырады&lt;/li&gt;\n&lt;li&gt;Жүйе тек қате бөліктерді жергілікті деңгейде түзетеді&lt;/li&gt;\n&lt;li&gt;Автоматты түзетуден кейін тексеру сәттілігі 28,5%-ға жетті&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;InfoAgent IVD (Infographic Visual Description) деп аталатын аралық сипаттаманы қолданады. Ол нақты деректерді, дәлелдердің шығу тегін және тексеру міндеттемелерін тәуелділік графында тіркейді. Жүйе визуалды, таңбалық және байланыстырушы қабаттарды бөліп, әр элементтің бастапқы құжаттан соңғы кескінге дейінгі жолын қадағалайды.&lt;/p&gt;\n&lt;p&gt;Қате анықталған кезде, жүйе бүкіл суретті емес, тек әсер еткен бөліктерді қайта есептейді. &lt;a href=\"concepts/infographicbench-evidence.html\"&gt;InfoGraphicBench-Evidence&lt;/a&gt; сынақтарында InfoAgent көмегімен тексеруден өткен инфографика үлесі 21,5%-дан 28,5%-ға дейін өсті. Жергілікті түзетулер орта есеппен кенептің 12,4%-ын ғана өзгертеді, бұл жаһандық қайта генерациялаудағы 67,3% көрсеткіштен әлдеқайда тиімді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе ұсынылған деректердің сапасына сүйенеді және сыртқы әлемдегі нақты ақиқатқа кепілдік бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Сенімді инфографиканы жасау рендеринг пен түзету кезінде фактілердің, таңбалар мен визуалды байланыстардың дәйектілігін сақтауды талап етеді. Кез келген элементті түзету оның дәлелдемелік базасын және өзгерістерден зардап шеккен тәуелділіктерді қадағалауды қажет етеді. Біз InfoAgent — дәлелдемелерге негізделген, алдын ала оқытуды қажет етпейтін визуалды-символдық бағдарламаларды синтездеу жүйесін ұсынамыз.&lt;/p&gt;\n&lt;p&gt;Жүйе Infographic Visual Description (IVD) форматын пайдаланады, ол нақты деректерді, дәлелдеме көздерін, орындалу жолдарын және тексеру міндеттемелерін типтелген тәуелділік графы түрінде жазады. Компиляция процесі дизайн бойынша априорлық білімдермен басқарылады, ал қабатты орындалу растрлық синтезді өңделетін символдық және байланыстырушы объектілермен біріктіріп, олардың іздерін сақтайды. Тәуелділіктерді ескеретін түзету механизмі қателерді локализациялайды, әсер етілген тәуелділіктерді қайта тексереді және белгіленген тексерушілер арқылы міндеттемелердің орындалуына кепілдік береді. Шешілмеген міндеттемелер айқын күйінде қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/sintez-vizualno-simvolicheskih-programm.html\"&gt;Визуалды-символдық бағдарламалау&lt;/a&gt; — бұл графикалық элементтерді код пен бастапқы деректермен тығыз байланыстыру әдісі, бұл кескінді бағдарлама ретінде өңдеуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/igenbench.html\"&gt;IGenBench&lt;/a&gt; бенчмаркінде InfoAgent 93.0% Q-&lt;a href=\"concepts/acc.html\"&gt;ACC&lt;/a&gt; және 59.0% I-ACC көрсеткіштеріне жетеді. Біз сондай-ақ InfoGraphicBench-Evidence-ті ұсындық: 200 тесттік сұраныс бойынша толық бақылау парағынан өту деңгейі Same-IVD промпті үшін 21.5%-дан, бастапқы қабатты нәтиже үшін 23.5%-ға және түзетуден кейін 28.5%-ға дейін өсті.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent инфографиканың дәлелдемелерге сәйкестігін 28.5%-ға дейін арттырады, бұл ретте локалды түзету кенептің тек 12.4%-ын ғана өзгертеді, ал жаһандық қайта генерация кезінде бұл көрсеткіш 67.3%-ды құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;120 аудиттелген түзету жағдайын талдау көрсеткендей, локализацияланған жөндеу орташа есеппен кенептің 12.4%-ын ғана қамтиды, ал жаһандық қайта генерация 67.3% аумақты өзгертуді талап етеді.&lt;/p&gt;\n&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;Инфографика фактілерді, сандық деректерді және визуалды түсініктемелерді бір кеңістікте біріктіреді. Журналистика мен білім беруде олардың тиімділігі дизайнның оқылуына және ақпараттың дәлдігіне тікелей байланысты. Тіпті әдемі композиция да, егер мән расталмаған болса немесе сілтеме қате болса, қолданушыны жаңылыстыруы мүмкін. Сенімді генерация тек визуалды ұқсастықты емес, дәлелдемелер, мәтін және визуалды элементтер арасындағы логикалық байланыстарды сақтауды талап етеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Инфографиканың сенімділігі деректер мен оның визуалды көрінісі арасындағы байланысты сақтауға негізделеді, бұл түзетулер енгізу кезінде өте маңызды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Инфографика бойынша зерттеулер құжаттарға негізделген генерацияны, авторлық құралдарды және сенімділікті бағалауды қамтиды. Қазіргі заманғы кескін модельдері мен зерттеу агенттері сыртқы білімді ұйымдастыруға және контексттік дәлдікті жақсартуға көмектеседі. InfoGen, GenClaw және M3 сияқты жүйелер метадеректер мен визуалды эскиздерді пайдаланады. Алайда, өңдеу кезінде мәселе туындайды: бір элементті (мысалы, көрсеткіш бағыттауышты) түзету оның деректермен байланысын бұзуы мүмкін. Өңделетін объектінің өзі қайта тексерілуі тиіс тәуелділіктер туралы ақпарат бермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IVD (Infographic Visual Description) — бұл контентті, геометриялық аймақтарды және тексеру міндеттемелерін қамтитын тәуелділіктер графы түріндегі аралық ұсыным.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз InfoAgent жүйесін ұсынамыз — бұл дәлелдемелерге негізделген визуалды-символдық бағдарламаларды синтездеуге арналған тренингті қажет етпейтін жүйе. Оның негізінде IVD жатыр, ол нақты мәлімдемені, оның дереккөзін және рендерленген объектіні байланыстырады. InfoAgent міндеттерді бөледі: кескіндер визуалды генераторға, нақты деректер символдарды рендерлеуге, ал бағыттауыштар мен түсініктемелер байланыстыру процесіне өтеді. Жүйе рендерлеу ағашын сақтайды, бұл қателерді нақты контент немесе геометрия деңгейінде бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бұл зерттеуде барлық негізгі модельдер қатырылған (frozen) күйде қалады, бұл жүйе мүмкіндіктерін шектейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Біз InfoAgent-ті IGenBench және жаңа InfoGraphicBench-Evidence (260 сұраныс, оның ішінде 200-і тест үшін) жинақтарында бағаладық. InfoAgent IGenBench-те 93,0 Q-ACC және 59,0 I-ACC нәтижелеріне қол жеткізді. InfoGraphicBench-Evidence-те толық тексеруден өту деңгейі (Full) 21,5%-дан 28,5%-ға дейін көтерілді. Жергілікті жөндеу (repair) орташа есеппен кенептің 12,4%-ын өзгертеді, ал жаһандық қайта генерация — 67,3%-ды құрайды. Нәтижелер тәуелділіктерді сақтау және мақсатты жөндеудің маңыздылығын растайды.&lt;/p&gt;\n&lt;h4 id=\"khatysty-zhumystar\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#khatysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ҚАТЫСТЫ ЖҰМЫСТАР&lt;/span&gt;&lt;/a&gt;ҚАТЫСТЫ ЖҰМЫСТАР&lt;/h4&gt;\n&lt;p&gt;Агенттік кескіндер генерациясы. Мәтіннен кескінге ауыстырудың заманауи модельдері жоғары синтез дәлдігін және күрделі нұсқауларды орындау қабілетін көрсетеді. Жаңа агенттік жүйелер сыртқы білімдерді, құралдарды пайдалану және итеративті бақылау арқылы бұл мүмкіндіктерді кеңейтеді. Мысалы, Gen-Searcher сияқты жүйелер генерация алдында мәтіндік және визуалды дәлелдерді іздейді, ал Qwen-Image-Agent контекстті толықтыру үшін жоспарлау мен жадты пайдаланады. M3 сияқты тәсілдер күрделі сұраныстарды тексерілетін шектеулерге бөліп, қателерді түзетеді. InfoAgent әрбір элементті дәлелдермен және орындалу жолдарымен байланыстыру арқылы кескіннің жеке бөліктерін верификациялауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стандартты модельдерден айырмашылығы, агенттік жүйелер әрбір кескін элементін сыртқы деректермен және тексерілетін міндеттемелермен байланыстырып, олардың қадағалануын қамтамасыз етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Құрылымдалған визуалды коммуникация. Зерттеу жүйелері деректерді код және итеративті түзету арқылы мультимодальды есептерге айналдырады. Инфографика саласы қарапайым кестелерден автоматтандырылған «деректер оқиғаларына» дейін дамыды. Қазіргі әзірлемелер ірі инфографика ресурстарын құруды және статистикалық графиктердің сенімділігін бағалауды қамтиды. InfoAgent бірыңғай кенепте инфографика жасауға бағытталған, онда әрбір белгі мен нысан фактілерге негізделуі шарт. Жүйе визуалды синтезді өңделетін символдық деректермен байланыстыратын &lt;a href=\"concepts/ispolnyaemyy-graf-elementov.html\"&gt;орындалатын элементтер графы&lt;/a&gt; арқылы жұмыс істейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Орындалатын элементтер графы — бұл жүйеге кескінді жай ғана салу емес, әрбір нысанды код ретінде басқаруға және фактілерге сәйкестігін тексеруге мүмкіндік беретін деректер құрылымы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"aedister\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#aedister\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер&lt;/span&gt;&lt;/a&gt;Әдістер&lt;/h3&gt;\n&lt;p&gt;Біз InfoAgent жүйесін ұсынамыз — бұл оқытуды қажет етпейтін, инфографика жасауды дәлелдерге негізделген визуалды-символдық бағдарламалау процесіне айналдыратын фреймворк. Жүйе пайдаланушы сұранысын x, дәлелдер пулын E және алынған дизайн-приорды s қабылдайды. InfoAgent оларды орындалатын IVD (Infographic Visual-symbolic Description) бағдарламасына компиляциялайды және нәтижені келесідей шығарады: z = Fivd(x, E, s), (y, T) = Exec(z), мұнда z — компиляцияланған IVD, y — дайын инфографика, T — IVD элементтері мен визуалды нысандар арасындағы сәйкестік жазбалары. Барлық базалық модельдер мен рендеринг құралдары өзгеріссіз қалады. 1-суретте көрсетілгендей, IVD әрбір элементті адрестелетін етеді, оның дереккөзін, орналасуын және орындалу жолын тіркейді. Бұл қателіктер кезінде бүкіл артефактіні қайта жасамай-ақ, жеке бөліктерді түзетуге мүмкіндік береді. Верификация &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; міндеттемелеріне негізделеді: нәтиже барлық критикалық тексерулер PASS мәртебесін алғанда ғана сертификатталған деп саналады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent инфографика жасауды орындалатын кодқа айналдырады, мұнда әрбір элемент дереккөзімен байланысқан, бұл қателерді нүктелі түрде түзетуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"31-daelelder-zhaene-dizajn-priorlar\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#31-daelelder-zhaene-dizajn-priorlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 ДӘЛЕЛДЕР ЖӘНЕ ДИЗАЙН-ПРИОРЛАР&lt;/span&gt;&lt;/a&gt;3.1 ДӘЛЕЛДЕР ЖӘНЕ ДИЗАЙН-ПРИОРЛАР&lt;/h4&gt;\n&lt;p&gt;InfoAgent контексттің екі түрін жинайды. Дәлелдер модулі мәтін үзінділерін, сандарды және дереккөздерді жинақтайды. Әрбір фактілік элемент дереккөзбен байланыстырылуы тиіс, әйтпесе ол блокталды деп танылады. Дизайн-приор 4 481 инфографикадан тұратын банкіден алынады. Макеттер мен стильдер UMAP, K-Means және Уорд алгоритмдері арқылы кластерленеді. Өкілдік үлгілер ақпарат құрылымын сипаттайтын «дағды карталарына» жинақталады. Нәтижені шығаруда эстетика емес, дәлелдердің қамтылуы мен оқылуы басымдыққа ие.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/karta-navykov.html\"&gt;Дағды картасы&lt;/a&gt;» — бұл дизайн шаблонының құрылымдалған сипаттамасы, ол жүйеге деректер логикасын бұзбай элементтерді қалай орналастыру керектігін түсінуге көмектеседі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-ivd-oryndalatyn-kelisim-shart-retinde\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#32-ivd-oryndalatyn-kelisim-shart-retinde\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2 IVD ОРЫНДАЛАТЫН КЕЛІСІМ-ШАРТ РЕТІНДЕ&lt;/span&gt;&lt;/a&gt;3.2 IVD ОРЫНДАЛАТЫН КЕЛІСІМ-ШАРТ РЕТІНДЕ&lt;/h4&gt;\n&lt;p&gt;IVD &lt;span class=\"yfm-latex\" data-content=\"z%20%3D%20(E%2C%20U%2C%20R%2C%20G%2C%20%5COmega)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; ретінде ұсынылады, мұнда E — дәлелдер пулы, U — кенеп аймақтары, R — оқу реті, &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — міндеттемелер, G — тәуелділік графы. Әрбір a_i элементі (m_i, p_i, r_i, b_i, c_i) схемасы бойынша сипатталады. Міндеттемелер &lt;span class=\"yfm-latex\" data-content=\"%5Comega_j%20%3D%20(S_j%2C%20%5Cphi_j%2C%20%0Au_j%2C%20%5Cgamma_j)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; нені тексеру керектігін анықтайды (мысалы, мәтіннің дәл сәйкестігі). Компилятор элементтерді үш қабатқа бөледі: визуалды (vis), символдық (sym) және байланыстырушы (bind). Орындалу жолы (2)-формула бойынша қабаттар санын және орындау құнын минимизациялау арқылы таңдалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе белгіленген талаптардың (келісім-шарттардың) орындалуына кепілдік береді, бірақ кең мағынада фактілік ақиқатқа абсолютті кепілдік бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-trassirovkany-sakhtajtyn-khabatty-oryndau\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#33-trassirovkany-sakhtajtyn-khabatty-oryndau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 ТРАССИРОВКАНЫ САҚТАЙТЫН ҚАБАТТЫ ОРЫНДАУ&lt;/span&gt;&lt;/a&gt;3.3 ТРАССИРОВКАНЫ САҚТАЙТЫН ҚАБАТТЫ ОРЫНДАУ&lt;/h4&gt;\n&lt;p&gt;Әрбір орындау қабаты визуалды артефакт пен трассировканы қайтарады, олар (3)-формула бойынша қорытынды кескінге біріктіріледі және элементтер деңгейіндегі байланыстар сақталады.&lt;/p&gt;\n&lt;p&gt;Жүйе &lt;span class=\"yfm-latex\" data-content=\"%5Cell\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; қабаттарына бөлінген IVD элементтерін қадағалау үшін T орындалу ізін пайдаланады. Векторлық объектілер геометрияны, z-тәртібін және мазмұнды қоса алғанда, рендеринг ағашының дескрипторларын сақтайды. Растрлық элементтер үшін аймақтық іздер қолданылады. Объектіге байлау қажет болғанда, парсер IVD элементін маскамен немесе жақтаумен сәйкестендіріп, сенімділік балын береді; төмен баллдар UNKNOWN деп белгіленеді. Визуалды қабат фон мен текстураларды синтездесе, символдық қабат мәтінді, формулалар мен графиктерді SVG форматында дәл рендерейді. Байлау қабаты түсініктемелер мен нұсқағыш сызықтар үшін жауап береді.&lt;/p&gt;\n&lt;h4 id=\"uesh-maendi-verifikaciya\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#uesh-maendi-verifikaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Үш мәнді верификация&lt;/span&gt;&lt;/a&gt;Үш мәнді верификация&lt;/h4&gt;\n&lt;p&gt;Әрбір ω_j міндеттемесі үшін тексеру &lt;span class=\"yfm-latex\" data-content=\"s_j%20%5Cin%20%5C%7BPASS%2C%20FAIL%2C%20UNKNOWN%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; күйін, κ_j сенімділік деңгейін және w_j диагностикалық куәгерді қайтарады. Тексерулер жолдардың, формулалардың, контрасттың және визуалды-семантикалық сәйкестіктің дәлдігін қамтиды. Модельге негізделген тексерулер бекітілген промпттар мен калибрленген шектерді пайдаланады. Қорытынды сертификат C(y, z) барлық міндеттемелердің күйін тіркейді. FAIL немесе сыни UNKNOWN күйіндегі міндеттемелер түзету кезеңіне жіберіледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе үш мәнді верификация логикасын пайдаланады, мұнда сыни қателер (FAIL/UNKNOWN) автоматтандырылған түзету процесін іске қосады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tranzakciyalykh-khalpyna-keltiru\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#tranzakciyalykh-khalpyna-keltiru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транзакциялық қалпына келтіру&lt;/span&gt;&lt;/a&gt;Транзакциялық қалпына келтіру&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/tranzaktsionnyy-remont.html\"&gt;Транзакциялық жөндеу&lt;/a&gt; әсер ету аймағын H(q) анықтау үшін тәуелділік графынан пайдаланады. Операторлар кітапханасы жүктемені ауыстыру, таңбаларды қайта рендерингтеу және макетті өзгерту сияқты функцияларды қамтиды. Үміткерлер &lt;span class=\"yfm-latex\" data-content=\"Q%5E%7B%5Cstar%7D(C)%20%3D%20(F_%7Bcrit%7D%20%2B%20U_%7Bcrit%7D%2C%20F%20%2B%20U%2C%20F_%7Bcrit%7D%2C%20F)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; метрикасы бойынша бағаланады, мұнда F және U қателер мен белгісіздіктердің жалпы саны. Үміткер тек сыни міндеттеме PASS күйіне өтсе және орындалмаған міндеттемелер азайса ғана қабылданады. InfoAgent &lt;span class=\"yfm-latex\" data-content=\"Q%5E%7B%5Cstar%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; мәнін, өзгертулер көлемін және құралдар құнын барынша азайтады. 1-кестеде InfoAgent тиімділігі (Q-ACC 93.0, I-ACC 59.0) көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Транзакциялық жөндеу — бұл жүйе барлық сыни сапа талаптары орындалғанша құжат элементтерін дәйекті түрде өзгертетін итеративті процесс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimentter\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#eksperimentter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭКСПЕРИМЕНТТЕР&lt;/span&gt;&lt;/a&gt;ЭКСПЕРИМЕНТТЕР&lt;/h4&gt;\n&lt;p&gt;4.1 ЭКСПЕРИМЕНТАЛДЫҚ ҚОНДЫРҒЫ&lt;/p&gt;\n&lt;p&gt;Зерттеу барысында инфографиканың атомарлы және тұтас деңгейдегі сенімділігі, промпттан тыс IVD (Intermediate Visual Description) орындалу тиімділігі және қателерді локальды түзету механизмдері бағаланады. Сонымен қатар сенімділік, визуалды сапа, нәтижелерді қамту және есептеу шығындары арасындағы тепе-теңдік талданады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IVD (Intermediate Visual Description) — бұл визуалды элементтердің аралық сипаттамасы, ол модельге сурет салуды бастамас бұрын инфографика құрылымын жоспарлауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сынақтар үшін екі деректер жиынтығы қолданылады. IGenBench 600 промптты, 30 инфографика түрін және 10 сенімділік санаты бойынша 5259 атомарлы сұрақты қамтиды. Сынақ хаттамасы тек бір нәтиже (one-output protocol) шығаруды көздейді және &lt;a href=\"concepts/benchmark.html\"&gt;бенчмарк&lt;/a&gt; жауаптарына қолжетімділікті шектейді. InfoGraphicBench-Evidence алты сала бойынша 260 сұранысты қамтиды (30 әзірлеу, 30 калибрлеу және 200 тест үлгісі). Орташа есеппен әр үлгіде 8,4 талап, 4,7 мәтіндік блок, 2,3 сандық немесе дереккөз бірлігі және 2,6 мәтін-визуалды байланыс бар.&lt;/p&gt;\n&lt;p&gt;Базалық модельдер (Baselines) ретінде DirectT2I, &lt;a href=\"concepts/retrieval-augmented-generation.html\"&gt;RAG&lt;/a&gt; Prompt, Same-IVD Prompt, сондай-ақ Gen-Searcher және GenClaw жүйелері бақылау жағдайында қолданылады. Сонымен қатар SVG/HTML рендерлеу әдістері және қателерді түзету модулі өшірілген (K=0) InfoAgent нұсқасы сыналады. Метрикалар IGenBench үшін атомарлы сұрақтардың дәлдігі (Q-ACC) мен жалпы дәлдікті (I-ACC), ал InfoGraphicBench-Evidence үшін қамту (Out), талаптарды орындау (ReqCov) және &lt;a href=\"concepts/recall.html\"&gt;толықтық&lt;/a&gt; (Full) көрсеткіштерін қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent барлық метрикалар бойынша ең жоғары нәтижелерді көрсетеді: толықтық (Full) 28,5%-ға, талаптарды орындау дәлдігі (ReqCov) 83,54%-ға жетеді, ал бақыланбайтын элементтер деңгейі небәрі 0,57%-ды құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модельдердің тиімділігі 1-Кестеде келтірілген, онда дәлдік, мәтінмен сәйкестік және визуалды байланыс көрсеткіштері салыстырылады.&lt;/p&gt;\n&lt;h4 id=\"tolykh-infoagent\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#tolykh-infoagent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толық InfoAgent&lt;/span&gt;&lt;/a&gt;Толық InfoAgent&lt;/h4&gt;\n&lt;p&gt;3-кестеде InfoAgent жүйесі мен оның модификацияларының нәтижелері келтірілген. Негізгі метрикалар: CritPass (барлық сыни тексерулерден өткен жауаптар үлесі), NonSup (дәлелдермен расталмаған фактілер пайызы), ReqText-F1 (мәтіндік жолдардың сәйкестігі), Bind-Q (мәтіннің визуалды элементтерге байланысу сапасы 1–5 шкаласы бойынша), Q-Align (қабылдау сапасы) және Layout-Q (макет құрылымы мен оқылуы).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent-тің толық нұсқасы CritPass көрсеткіші бойынша 61,5% нәтижеге қол жеткізеді, бұл жеңілдетілген модельдерден айтарлықтай жоғары.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"hattama-zhaene-iske-asyru\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#hattama-zhaene-iske-asyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хаттама және іске асыру&lt;/span&gt;&lt;/a&gt;Хаттама және іске асыру&lt;/h4&gt;\n&lt;p&gt;Дәлелдерге негізделген әдістер бірдей сұраныстарды алады. Негізгі жоспарлаушы ретінде Gemini 3.1 Pro Team (2026), ал рендеринг үшін Qwen-Image (2025) қолданылады. Процесс рендеринг ағашын тексеруді және автономды верификацияны қамтиды. Бағалау 120 инфографика (600 шешім) және 200 тесттік шығыс негізінде жүргізіледі. Статистикалық маңыздылық Холм түзетуімен &lt;a href=\"concepts/parnyy-butstrepping.html\"&gt;жұптық бутстреппинг&lt;/a&gt; (10 000 таңдама) әдісі арқылы расталған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жұптық бутстреппинг — сенімділік аралықтарын есептеу үшін деректерді қайта таңдауға негізделген статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"43-daelelderdi-bakhylaumen-baghalau\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#43-daelelderdi-bakhylaumen-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 Дәлелдерді бақылаумен бағалау&lt;/span&gt;&lt;/a&gt;4.3 Дәлелдерді бақылаумен бағалау&lt;/h4&gt;\n&lt;p&gt;InfoAgent-тің локалды түзету механизмі I-ACC көрсеткішін 45,0%-дан 59,0%-ға дейін арттырады (14,0 пайыздық тармаққа өсу). 2(a)-суретте толықтық, кодтау және белгілеу санаттарындағы жақсарулар көрсетілген. 2(b)-сурет сыни бұзушылықтардың көпшілігі екі цикл ішінде жойылатынын көрсетеді.&lt;/p&gt;\n&lt;h4 id=\"44-mehanizmder-men-tuezetulerdi-taldau\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#44-mehanizmder-men-tuezetulerdi-taldau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4 Механизмдер мен түзетулерді талдау&lt;/span&gt;&lt;/a&gt;4.4 Механизмдер мен түзетулерді талдау&lt;/h4&gt;\n&lt;p&gt;Flat plan-мен (тәуелділіктер мен орындалатын міндеттемелер алынып тасталған) салыстыру құрылымдық жоспарлаудың өте маңызды екенін көрсетеді: CritPass 61,5%-дан 42,5%-ға дейін төмендейді. Жобалық басымдықтарды іздеу кезеңін алып тастау Layout-Q және Q-Align көрсеткіштерін ең қатты төмендетеді. Қателерді локалды түзету жаһандық қайта генерацияға қарағанда тиімдірек: ол анықталған бұзушылықтардың 85,9%-ын түзетеді және кенептің тек 12,4%-ын өзгертеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent қолданылған кезде де шығыстардың 41%-ы кемінде бір қатені қамтиды, бұл объектілерді байланыстыру механизмдерін одан әрі жетілдіру қажеттілігін көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Усынылған InfoAgent фреймворкі қосымша оқытуды талап етпейтін (training-free) жүйе болып табылады, ол интерактивті визуалды декомпозиция (Interactive Visual Decomposition, IVD) арқылы дәлелдерді, рендерингтелген элементтерді және тексеру міндеттемелерін өзара байланыстырады. Көпдеңгейлі орындау құрылымы қателерді дәл анықтау үшін барлық іздерді сақтайды, ал тәуелділіктерді ескеретін жөндеу механизмі (dependency-aware repair) түзетулерді оқшаулап, тек әсер етілген құрамдас бөліктер мен қорғалған міндеттемелерді қайта тексереді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Бастапқы деректер тұрақты болғанда, InfoAgent-ті қолдану InfoGraphicBench-Evidence бенчмаркінде толық тексеру тізімінен өту көрсеткішін Same-IVD Prompt әдісіндегі 21,5%-дан 28,5%-ға дейін арттырды.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тәжірибелік нәтижелер ұсынылған тәсілдің тиімділігін дәлелдейді. Нақты дәлелдер мен бастапқы IVD құрылымы бекітілген жағдайда, InfoGraphicBench-Evidence деректер жинағында толық тексеру тізімінен өту үлесі (complete-checklist pass rate) Same-IVD Prompt базалық әдісіндегі 21,5%-дан InfoAgent арқылы 28,5%-ға дейін өсті. IGenBench бенчмаркінің нәтижелерімен және түзетулерді оқшаулау талдауымен бірге бұл деректер генерациялау мен өңдеу барысында байланыстар мен орындау тәуелділіктерін сақтаудың маңыздылығын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Жүйедегі қателіктердің негізгі көздері — толық емес немесе қарама-қайшы деректер, растрлық объектілерді дәл байланыстырмау және семантикалық тексерулердің жетілмегендігі.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әдістің шектеулеріне толық емес же қарама-қайшы дәлелдер, растрлық объектілерді визуализацияға дәл таңбаламау (raster-object grounding) және кәміл емес семантикалық тексерулер жатады. Қорытынды сертификат тексеру нәтижелерін белгіленген міндеттемелер шеңберінде тіркейді және шешілмеген талаптарды орындалды деп есептемей, ашық күйінде сақтайды.&lt;/p&gt;\n&lt;p&gt;Болашақ жұмыстардың бағыты ретінде авторлар деректерді салыстыруды жақсартуды, визуалды байланыстыру дәлдігін арттыруды және IVD тұжырымдамасын интерактивті әрі көп бетті құжаттарға қолдануды жоспарлап отыр.&lt;/p&gt;\n&lt;h4 id=\"zhasandy-intellektini-pajdalanu-turaly-maelimdeme-aiuse-statement\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#zhasandy-intellektini-pajdalanu-turaly-maelimdeme-aiuse-statement\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жасанды интеллектіні пайдалану туралы мәлімдеме (AIUSE STATEMENT)&lt;/span&gt;&lt;/a&gt;Жасанды интеллектіні пайдалану туралы мәлімдеме (AIUSE STATEMENT)&lt;/h4&gt;\n&lt;p&gt;Жұмысты жазу барысында Google Gemini моделі тек грамматиканы түзету және мәтін стилін жақсарту үшін ғана қолданылды. Зерттеу идеясын генерациялауда, методологияда, эксперименттерде немесе деректерді талдауда ЖИ құралдары пайдаланылған жоқ. Қолжазбаның мазмұнына авторлар толық жауапты болады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f1.jpg\" alt=\"1-сурет: InfoAgent шолуы. Пайдаланушы сұранысы, алынған дәлелдер және дизайн приорлары типтелген IVD-ге компиляцияланады\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: InfoAgent шолуы. Пайдаланушы сұранысы, алынған дәлелдер және дизайн приорлары типтелген IVD-ге компиляцияланады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: InfoAgent шолуы. Пайдаланушы сұранысы, алынған дәлелдер және дизайн приорлары типтелген IVD-ге компиляцияланады. Әрбір ақпараттық элемент дәлелдемелердің шығу тегін, кеңістіктік аймақты, орындалу бағытын, байланыстыру тәуелділіктерін және тексерілетін міндеттемелерді сақтайды. Көрнекі, символдық және байланыстырушы қабаттар орындалу іздерімен үйлеседі. Содан кейін IVD басқаратын верификация элементтер бойынша индекстелген бұзушылықтарды мазмұндық, символдық, байланыстырушы, макеттік немесе көрнекі түзетулермен сәйкестендіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f2.jpg\" alt=\"2-сурет: Сенімділік талдауы және контекстік түзету динамикасы. (a) IGen-Bench бенчмаркіндегі санаттар бойынша Q-ACC (сұр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Сенімділік талдауы және контекстік түзету динамикасы. (a) IGen-Bench бенчмаркіндегі санаттар бойынша Q-ACC (сұрақ-жауап дәлдігі). (b) Аудиттелген және түзетуге жарамды нәтижелердегі үш түзету кезеңі ішінде анықталған орташа критикалық бұзушылықтар және жиынтық өңделген аймақ.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f3.jpg\" alt=\"3-сурет: Қаржылық оқиғалар мен өнім сипаттамаларына арналған сұраныстарды сапалы салыстыру.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Қаржылық оқиғалар мен өнім сипаттамаларына арналған сұраныстарды сапалы салыстыру.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Қаржылық оқиғалар мен өнім сипаттамаларына арналған сұраныстарды сапалы салыстыру. Жақтаулар фактілік, символдық, байланыстыру және иерархия айырмашылықтарын көрсетеді; ✓, × және ? белгілері сәйкесінше орындалған, бұзылған және ішінара орындалған талаптарды білдіреді. Барлық нәтижелер қолмен түзетусіз көрсетілген. Figure 3 уақытқа сезімтал қаржылық сұранысты сипаттамалары көп өнім сұранысымен салыстырады. DirectT2I көрнекі түрде сенімді композициялар жасайды, бірақ қажетті сипаттамаларды өткізіп жіберуі, белгілерді бұзуы немесе қолдау көрсетілмейтін мәндерді көрсетуі мүмкін. Gen-Searcher сыртқы контекст арқылы фактілік және сипаттамалық қамтуды жақсартады, ал нақты мәтін мен белгілердің сәйкестігі тұрақсыз болып қалады, өйткені алынған дәлелдер негізінен промпт деңгейінде қолданылады. GenClaw кодқа негізделген құрылымдық рендеринг арқылы сенімдірек символдық мазмұнды қамтамасыз етеді, бірақ оның нәтижелері әлсіз көрнекі иерархия мен қатаң композицияларды көрсетеді. InfoAgent оның орнына дәлелдерді адрестелетін IVD элементтеріне компиляциялайды және үйлестірілген көрнекі, символдық және байланыстырушы қабаттар арқылы фактілік мәндерді, сипаттамаларды және жергілікті қатынастарды орындайды. Түсіндірме жақтаулары мен статус маркерлері фактілік дәлдік, символдық дәлдік, белгілердің сәйкестігі және көрнекі иерархиядағы айырмашылықтарды көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-fS1.jpg\" alt=\"Сурет S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI инфографика&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сындағы сәйкес&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сіздіктер&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тәуелділік&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;графы арқылы&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;элементтерді&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;байланыстыр&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қателерді 12%&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;аумақта&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жергілікті&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;түзету&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тексерілетін&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;визуалды&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;деректер&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;provenance&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Yifan Li, Tong Li, Qi Z
