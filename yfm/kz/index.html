/p&gt;\n","links":[{"url":"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-card.jpg"},"content":{"title":"Өткенді еске сақтайтын робот: жасырылған заттарды табу жолы","text":"&lt;p&gt;Роботтар көзден таса болған заттарды табуда қиналады. BeyondSCe жүйесі оқиғалар тарихын талдау арқылы жасырылған нысандарды табуға көмектеседі.&lt;/p&gt;\n","links":[{"url":"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-card.jpg"},"content":{"title":"VISTA: нейрожелілерді көргенін &amp;laquo;есте сақтауға&amp;raquo; үйрету","text":"&lt;p&gt;Жаңа визуалды интерфейс ИИ-агенттерге өткен кадрларды сақтауға және қайта қарауға мүмкіндік беріп, олардың дәлдігін күрт арттырады.&lt;/p&gt;\n","links":[{"url":"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html","text":"Оқу","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"ОСИНТ-Сигнал қалай жұмыс істейді","items":[{"title":"Іріктеу","text":"&lt;p&gt;Күн сайын модель ондаған жаңа зерттеуді салыстырып, ең маңызды әрі түсініктілерін таңдайды.&lt;/p&gt;\n"},{"title":"Талдау","text":"&lt;p&gt;Мәні, негізгі қорытындылар мен шектеулер — қарапайым, бірақ дәл тілмен.&lt;/p&gt;\n"},{"title":"Үш тіл","text":"&lt;p&gt;Әр материал орыс, өзбек және қазақ тілдерінде шығады.&lt;/p&gt;\n"},{"title":"Суреттер және толық мәтін","text":"&lt;p&gt;Мақалалардың өз суреттері, ал ашық лицензиялар үшін — толық аударма.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Сұрақтар","items":[{"title":"&lt;p&gt;Бұл рецензияланған мақалалар ма?&lt;/p&gt;\n","text":"&lt;p&gt;Жоқ, бұл препринттер — рецензияға дейінгі ж
