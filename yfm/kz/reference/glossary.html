            {"data":{"leading":false,"html":"&lt;p&gt;337 ұғым&lt;/p&gt;\n&lt;h2 id=\"f\"&gt;&lt;a href=\"reference/glossary.html#f\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ф&lt;/span&gt;&lt;/a&gt;Ф&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Фактілер мен медианы тексеру&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ispravlenie-faktov.html\"&gt;Фактілерді түзету&lt;/a&gt; — Модельді жалған ақпараттардың әсерін жою үшін дұрыс деректермен қайта оқыту әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agreement-gate.html\"&gt;Фильтр согласованности&lt;/a&gt; — Нейрондық желілерді аудиттеу әдісі, мұнда шешім тек модель кандидаттардың реті өзгерген кезде бірдей нұсқаны таңдаған жағдайда ғана…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/figs-framework.html\"&gt;Фреймворк FIGS&lt;/a&gt; — Тілдік модельдерді бағалау жүйесі, ол фактологиялық дәлдік пен эмпатия арасындағы тепе-теңдікті тексеру үшін 10 қадамдық симуляторды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/norma-frobeniusa.html\"&gt;Фробениус нормасы&lt;/a&gt; — Матрицаның «көлемін» өлшеу тәсілі, ол оқыту процесінде модель салмақтарының қаншалықты өзгергенін бағалауға мүмкіндік береді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k\"&gt;&lt;a href=\"reference/glossary.html#k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;К&lt;/span&gt;&lt;/a&gt;К&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-image_forensics.html\"&gt;Криминалистика изображений&lt;/a&gt; — Следы монтажа, метаданные, сжатие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crowdsourcing.html\"&gt;Краудсорсинг и разметка&lt;/a&gt; — Как сообщества помогают проверять.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/calibrated-validation.html\"&gt;Калиброванная валидация&lt;/a&gt; — Модельдің фактілерді бұрмаламай және объективтілікті жоғалтпай қолданушының сезімдерін мойындау және эмпатия көрсету қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neopredelennost-proishozhdeniya-kandidata.html\"&gt;Кандидаттың шығу тегінің анықталмауы&lt;/a&gt; — Нысандарды санау тапсырмаларындағы мәселе, мұнда нейрондық желі қайталанатын фон элементтерін қате түрде ізделіп жатқан нысандар деп…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/density-map.html\"&gt;карта плотности&lt;/a&gt; — Нейрожелі болжайтын пиксель мәндерінің кеңістіктік таралуы, олардың қосындысы ізделінді нысандардың жалпы санына сәйкес келеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/quantization.html\"&gt;Кванттау&lt;/a&gt; — Модель салмақтарын сақтау кезінде дәлдікті төмендету, бұл тым кішкентай өзгерістердің жойылып кетуіне әкелуі мүмкін.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/klasterizatsiya.html\"&gt;Кластерлеу&lt;/a&gt; — Кластерлеу — бұл алдын ала белгіленген белгілерді қажет етпей, ұқсас сипаттамалары немесе мінез-құлық үлгілері бойынша объектілерді…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/klasternyy-butstrep.html\"&gt;Кластерлік бутстреп&lt;/a&gt; — Деректерді топтарға бөліп, нәтижелердің кездейсоқ еместігін тексеру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/encoded-reasoning.html\"&gt;Кодированные рассуждения&lt;/a&gt; — Логика оқылмайтын, бірақ ашық форматта ұсынылатын модельдің есептеу түрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conversion.html\"&gt;Конверсия&lt;/a&gt; — Белгілі бір уақыт ішінде автордың контентімен өзара әрекеттесуден оған жазылуға көшу көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kontekstnaya-chuvstvitelnost.html\"&gt;Контексттік сезімталдық&lt;/a&gt; — Модельдің қоршаған мәтінге қарап құралды қолдану немесе қолданбау керектігін ажырата алу қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/runtime-assurance-contract.html\"&gt;Контракт обеспечения времени выполнения&lt;/a&gt; — Жасанды интеллект агенттері үшін автономия шекараларын, компоненттердің жарамдылық критерийлерін, дәлелдемелер күйін және өтелмейтін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kontrfaktualnoe-modelirovanie.html\"&gt;Контрфактуалды модельдеу&lt;/a&gt; — Жүйеге енгізілген өзгерістер нәтижеге қалай әсер ететінін анықтау үшін «егер былай болса, не болады?» деген сұраққа жауап іздеу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/konfaunder.html\"&gt;Конфаундер&lt;/a&gt; — Зерттеу нәтижелерін бұрмалап, айнымалылар арасында жалған байланыс тудыруы мүмкін қосымша фактор.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/konyunktsiya.html\"&gt;Конъюнкция&lt;/a&gt; — Шарт тек барлық компоненттер ақиқат болғанда ғана орындалған деп есептелетін логикалық операция.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kortezh.html\"&gt;Кортеж&lt;/a&gt; — Жүйенің жұмыс істеуі үшін белгіленуі тиіс параметрлер жиынының математикалық өрнегі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/capture-coefficient.html\"&gt;коэффициент захвата&lt;/a&gt; — Дереккөздің өзін-өзі күшейту күшінің көрсеткіші, ол алдыңғы кезеңде дәйексөздің болуы немесе болмауы кезіндегі дәйексөз келтіру…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cross-attention.html\"&gt;Кросс-внимание&lt;/a&gt; — Тілдік декодерге энкодерден алынған шахмат позициясының аралық көріністеріне жүгінуге мүмкіндік беретін деректерді интеграциялау механизмі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/podozritelnost.html\"&gt;Күдіктілік&lt;/a&gt; — Модель жауабының күтілетін стильден қаншалықты ауытқитынын бағалайтын көрсеткіш, ол жасырын ақпарат тасымалдау арналарын анықтауға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/konyunktsiya-bez-sohraneniya-sostoyaniya.html\"&gt;Күйді сақтамайтын конъюнкция&lt;/a&gt; — Алдыңғы тексерулер тарихын ескермей, ағымдағы деректерді жеке бағалайтын логикалық операция.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mas.html\"&gt;Көп агентті жүйе&lt;/a&gt; — Бірнеше тәуелсіз бағдарламалық агенттердің күрделі мәселені шешу үшін өзара әрекеттесуі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p\"&gt;&lt;a href=\"reference/glossary.html#p\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;П&lt;/span&gt;&lt;/a&gt;П&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-provenance.html\"&gt;Происхождение и водяные знаки&lt;/a&gt; — C2PA, цифровые подписи контента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-platforms.html\"&gt;Платформы&lt;/a&gt; — Telegram, YouTube, X: особенности данных и доступа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;Пайдаланушы симуляторы&lt;/a&gt; — Жасанды интеллект агенттерінің жауаптарын тексеру үшін нақты адамның мінез-құлқын имитациялайтын бағдарламалық орта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lossless-visual-memory.html\"&gt;Память без потерь&lt;/a&gt; — Визуалды деректерді мұрағаттау әдісі, мұнда әр кадр уақыт пен әрекет бойынша индекстеледі және бастапқы сапада сақталады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/panelnoe-issledovanie.html\"&gt;Панельдік зерттеу&lt;/a&gt; — Бірдей респонденттерден белгілі бір уақыт аралығында бірнеше рет сауалнама алынатын деректерді жинау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/earn-in.html\"&gt;Период вхождения&lt;/a&gt; — Жүйеде түсініктемелерді жариялау құқығын бермес бұрын жасанды интеллект авторларының дәлдігі мен сапасын тексеру процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perpleksiya.html\"&gt;Перплексия&lt;/a&gt; — Модельдің келесі токенді қаншалықты дәл болжай алатынын бағалайтын метрика; мән неғұрлым төмен болса, модель өз болжамдарында соғұрлым…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nesovmestimost-platformy.html\"&gt;Платформаның сәйкес келмеуі&lt;/a&gt; — Бағдарламалық орта (мысалы, Windows) басқа жүйеге (мысалы, Unix) арналған пәрмендерді түсінбеуі салдарынан туындайтын ақау.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bias-isolation.html\"&gt;подавление фона&lt;/a&gt; — Қайталанатын фондық құрылымдар мен шулардан (жолдар, тұрақ торлары) туындайтын жауаптарды басуға арналған COBICount архитектурасының кезеңі…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/candidate-acceptance.html\"&gt;подтверждение кандидатов&lt;/a&gt; — Түпкілікті тығыздық картасы үшін жауаптарды ықшамдылыққа және бастапқы нүктелік аннотацияларға сәйкестікке сүзетін COBICount әдісінің…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pozitsionnoe-smeschenie.html\"&gt;Позициялық ауытқу&lt;/a&gt; — Модельдің мазмұнына қарамастан, тізімдегі белгілі бір орында тұрған нәтижені артық көру бейімділігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polinomialnye-krossy.html\"&gt;Полиномдық кросстар&lt;/a&gt; — Бар белгілерді көбейту арқылы жаңа белгілерді жасау әдісі, ол модельге белгілер арасындағы күрделі байланыстарды анықтауға көмектеседі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prefill.html\"&gt;Префилл&lt;/a&gt; — Prefill — бұл модель жауапты генерациялау алдында өңдейтін деректер көлемі, ол жауаптың пішінін немесе үнін алдын ала анықтайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proksi-pokazatel.html\"&gt;Прокси-көрсеткіш&lt;/a&gt; — Зерттелетін қасиетті тікелей өлшеу қиын болғанда қолданылатын жанама метрика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/direct-planning.html\"&gt;Прямое планирование&lt;/a&gt; — Жұмыс процесін жоғары температурада жоғары деңгейлі жоспар құруға және содан кейін қорытынды мәтінді қалыптастыруға бөлетін генерация әдісі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s\"&gt;&lt;a href=\"reference/glossary.html#s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С&lt;/span&gt;&lt;/a&gt;С&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic.html\"&gt;Синтетические медиа&lt;/a&gt; — Детекция сгенерированных изображений, голоса и видео.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geo.html\"&gt;Спутниктер және геодеректер&lt;/a&gt; — Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-coordination.html\"&gt;Скоординированное поведение&lt;/a&gt; — Синхронные публикации, сети аккаунтов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-legal_data.html\"&gt;Суды и законы&lt;/a&gt; — Открытые решения, законодательные базы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/centipawn.html\"&gt;Сантипешка&lt;/a&gt; — Шахматтағы артықшылықты өлшеу бірлігі, 1/100 пешкаға тең.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekspertnyy-enkoder.html\"&gt;Сараптамалық энкодер&lt;/a&gt; — Белгілі бір саланың (мысалы, шахмат) ережелері мен стратегиясын «түсінетін» мамандандырылған модель, ол тілдік модельге шешім қабылдау үшін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rezervnoe-kopirovanie.html\"&gt;Сақтық көшірмелеу&lt;/a&gt; — Қате орын алғанда жұмыс күйіне қайту үшін өзгерістер енгізгенге дейін файл көшірмесін жасау.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/segmentatsiya.html\"&gt;Сегментация&lt;/a&gt; — Кескіндегі пикселдер тобын белгілі бір нысанға жатқызу процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semanticheskiy-dreyf.html\"&gt;Семантикалық ығысу&lt;/a&gt; — Сыртқы бұрмалаулар салдарынан модельдің визуалды белгілерді қате түсіндіре бастайтын мағыналық ауытқуы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semantic-consolidation.html\"&gt;Семантическая консолидация&lt;/a&gt; — Деректердің түпкілікті құрылымын қалыптастыру үшін тілдік модель анықтаған семантикалық жағынан ұқсас атрибуттарды біріктіру процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/signatura.html\"&gt;Сигнатура&lt;/a&gt; — Шақырудың бірегей идентификаторы, ол модель аргументтер жазылуын сәл өзгертсе де, бір әрекетті қайталап жатқанын жүйеге түсінуге…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sikofanstvo-v-ii.html\"&gt;Сикофантия&lt;/a&gt; — Тілдік модельдің қолданушының қате пікірлерімен келісуге немесе мақұлдау алу үшін тым көп жағымпаздануға бейімділігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/instruction-following.html\"&gt;Следование инструкциям&lt;/a&gt; — Тілдік модельдің мәтінді генерациялау кезінде пайдаланушы белгілеген шарттар мен шектеулерді орындау қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/event-based-grounding.html\"&gt;Событийная привязка&lt;/a&gt; — Роботтың нысанды атауы немесе сыртқы түрі бойынша емес, жақында болған әрекеттегі рөліне негізделіп сәйкестендіру тәсілі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cumulative-conversational-visibility.html\"&gt;совокупная видимость в диалоге&lt;/a&gt; — Назар аудару салмақ коэффициенттерін ескере отырып, диалогтың барлық кезеңдеріндегі дереккөздің жалпы маңыздылығын есептеуге арналған…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/selection-regret.html\"&gt;Сожаление при выборе&lt;/a&gt; — Модель тиімділігінің көрсеткіші, ол қолжетімді ең жақсы кескіннің рейтингі мен модель таңдаған кескіннің рейтингі арасындағы айырмашылықты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adversarial-perturbations.html\"&gt;состязательные возмущения&lt;/a&gt; — Нейрондық желіні қате нәтиже беруге мәжбүр ететін кескін пиксельдеріндегі көзге көрінбейтін минималды өзгерістер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/social-bot.html\"&gt;Социальный бот&lt;/a&gt; — Дезинформацияның белгілі бір түрлерінің таралуын стратегиялық тұрғыдан күшейтетін автоматтандырылған аккаунт.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sociotechnical-changes.html\"&gt;Социотехнические изменения&lt;/a&gt; — Басқару құрылымына әсер ететін технологиялық жүйелер мен қоғамдық институттардың өзара байланысты трансформациялары.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/slepaya-annotatsiya.html\"&gt;Соқыр аннотация&lt;/a&gt; — Деректерді белгілейтін сарапшылар зерттеу мақсаттарынан бейхабар болатын бағалау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/slepaya-razmetka.html\"&gt;Соқыр» белгілеу&lt;/a&gt; — Бағалаушы модель деректерді қай жүйе жасағанын білмейтін бағалау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spekulyativnoe-dekodirovanie.html\"&gt;Спекулятивті декодтау&lt;/a&gt; — Модель болашақ деректер туралы жылдам болжамдар жасайтын және кейін олардың дұрыстығын тексеретін әдіс, бұл талдау тиімділігін арттырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Орташа абсолюттық қателік (MAE) — бұл болжамдалған және нақты деректер арасындағы айырмашылықтардың орташа мәнін көрсететін болжау…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganografiya-v-kontekste-ii.html\"&gt;Стеганография&lt;/a&gt; — Ақпаратты қарапайым мәтін ішінде жасырын түрде тасымалдау әдісі, ол сыртқы бақылаушыға байқалмайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganographic-messaging.html\"&gt;Стеганографическая передача сообщений&lt;/a&gt; — Мәтін ішінде деректерді беру тәсілі, мұнда жасырын мағына сыртқы монитор үшін байқалмайды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganograficheskoe-myshlenie.html\"&gt;Стеганографиялық ойлау&lt;/a&gt; — Жасанды интеллект моделінің басқа тапсырмаға арналған бейкүнә мәтін ішінде жасырын есептеулерді қолдануы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganograficheskoe-rassuzhdenie.html\"&gt;Стеганографиялық пайымдау&lt;/a&gt; — Логикалық қорытындының жасырын түрі, мұнда модель ақпаратты ойлау тізбегі арқылы сыртқы бақылау жүйелеріне байқалмайтындай етіп жеткізеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stohastichnost-vyborki.html\"&gt;Стохастикалық табиғат&lt;/a&gt; — Модельдің мәтін генерациялау кезіндегі ықтималдық сипатынан туындайтын кездейсоқ ауытқулар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scene-weighted-training.html\"&gt;Сценарно-взвешенное обучение&lt;/a&gt; — Әртүрлі домендердегі көріністердегі сұрақтар санын теңестіру үшін салмақ коэффициенттерін пайдаланатын оқыту әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/filtratsiya.html\"&gt;Сүзгіден өткізу&lt;/a&gt; — Модель деградациясын болдырмау үшін оқу корпусынан сапасыз немесе синтетикалық деректерді алып тастау процесі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a\"&gt;&lt;a href=\"reference/glossary.html#a\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А&lt;/span&gt;&lt;/a&gt;А&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sat_imagery.html\"&gt;Анализ спутниковых снимков&lt;/a&gt; — Sentinel, Landsat, разрешение, индексы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nets.html\"&gt;Ақпараттық науқандар және желілер&lt;/a&gt; — Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-data.html\"&gt;Ашық деректер&lt;/a&gt; — Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — Абляция — бұл жүйе компоненттерінің түпкілікті нәтижеге әсерін бағалау үшін оларды кезекпен өшіру арқылы жүйені тексеру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ablyatsionnoe-issledovanie.html\"&gt;Абляциялық талдау&lt;/a&gt; — Абляциялық зерттеу — бұл жүйенің жекелеген құрамдас бөліктерін кезекпен өшіру немесе ауыстыру арқылы олардың түпкілікті нәтижеге қосқан…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/automatic-annotator.html\"&gt;Автоматический аннотатор&lt;/a&gt; — LLM негізіндегі бағдарламалық құрал, ол ғылыми мәтінді сегменттерге бөледі және оның бөліктерін CARS моделінің риторикалық қадамдарына…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reconstruction-agent.html\"&gt;Агент реконструкции&lt;/a&gt; — Қашықтағы модель интерфейсімен үйлесімділікті қамтамасыз ету үшін қорғалған жазба негізінде медиа деректерді жасайтын және тексеретін жүйе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agentic-system.html\"&gt;Агенттік жүйе&lt;/a&gt; — AI агенті өз әрекеттерін жоспарлайтын, құралдарды пайдаланатын және нәтижелерді тексеретін бағдарламалық архитектура.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/harness.html\"&gt;Агенттік орта&lt;/a&gt; — Нейрожелінің құралдармен, жадпен және сыртқы деректермен өзара әрекеттесуін басқаратын бағдарламалық орта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agentnyy-plagin.html\"&gt;Агенттік плагин&lt;/a&gt; — Пайдаланушы атынан автономды әрекеттерді орындайтын бағдарламалық модуль, ол сезімтал деректерді сыртқы серверге жібермей өңдейді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/algorithm-1.html\"&gt;Агенттік цикл&lt;/a&gt; — LLM ортаның күйін талдайтын, кодты (Room.py) түзету бойынша әрекеттерді орындайтын және сапаны бақылау құралдары (1-кесте) арқылы нәтижені…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agentnyy-konveyer.html\"&gt;Агенттік құбыр желісі&lt;/a&gt; — Жеке модульдер (агенттер) деректерді өңдеу және тексеру сияқты тапсырмаларды орындайтын жүйе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aktivnoe-vospriyatie.html\"&gt;Активное восприятие&lt;/a&gt; — Нысанды іздеу әдісі, мұнда робот ықтимал көру нүктелерін бағалайды және белгісіздікті әрі қозғалыс санын азайту үшін камераны жылжытады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/embedding-drift-analysis.html\"&gt;Анализ дрейфа эмбеддингов&lt;/a&gt; — Оқытудан бұрын және кейін токен векторларының косинустық ұқсастығын салыстыру арқылы желі салмақтарындағы өзгерістерді тексеру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/counterfactual-role.html\"&gt;Антифактическая роль&lt;/a&gt; — Модельдің шындыққа қайшы келетін сенімдері бар кейіпкерге еліктейтін жұмыс режимі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/apriornoe-znanie.html\"&gt;Априорлық білім&lt;/a&gt; — Модельдің нақты контекстті көргенге дейін белгілі бір деректер құрылымын генерациялауға деген «бейімділігі».&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/smeshivayuschiy-faktor.html\"&gt;Араласушы фактор&lt;/a&gt; — Нәтижелерді бұрмалауы мүмкін қосымша айнымалы, ол модельді өтірікке емес, нұсқаулық стиліне немесе токен ықтималдығына реакция жасауға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomic-fact.html\"&gt;Атомарный факт&lt;/a&gt; — Нейрожелі жауабының дереккөздерге сәйкестігін тәуелсіз тексеруге болатын ең кіші мағыналық бірлік.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomarnyy-vklad.html\"&gt;Атомдық үлес&lt;/a&gt; — Әдіс немесе нәтиже туралы кіріспе сөздер мен есімдіктерден ада, нақты әрі тексерілуі мүмкін бір ғана тұжырым.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/acc.html\"&gt;Атомдық үлес талаптары&lt;/a&gt; — Ғылыми аннотациядан алынған, кіріспе сөздер мен контекстен тазартылған, автордың нақты ғылыми үлесін сипаттайтын қысқа, тексерілетін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attraktor.html\"&gt;Аттрактор&lt;/a&gt; — Сыртқы әсерлер болмағанда немесе басқару сигналдары әлсірегенде жүйе ұмтылатын күй.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/auditorskiy-razryv.html\"&gt;Аудит алшақтығы&lt;/a&gt; — Нейрожелінің тікелей жауап беруі мен ақпаратты логикалық тізбектерде қолдануы арасындағы айырмашылық.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/greedy-decoding.html\"&gt;Ашкөз декодтау&lt;/a&gt; — Модель әрқашан ең жоғары ықтималдығы бар токенді таңдайтын процесс, бұл әдетте жауаптарды біркелкі және детерминирленген етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/open-ended.html\"&gt;Ашық промпт&lt;/a&gt; — Визуалды интерпретацияның көптеген нұсқаларына жол беретін сұраныс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/informatsionnyy-zapah.html\"&gt;Ақпараттық иіс&lt;/a&gt; — Пайдаланушының сілтемені баспас бұрын контенттің пайдалылығын жанама белгілер (тақырыптар, үзінділер) арқылы бағалауы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g\"&gt;&lt;a href=\"reference/glossary.html#g\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Г&lt;/span&gt;&lt;/a&gt;Г&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geolocation.html\"&gt;Геолокация по изображению&lt;/a&gt; — Где сделан снимок: рельеф, дороги, тени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/generative-engine-optimization.html\"&gt;генеративная оптимизация&lt;/a&gt; — Генеративті іздеу жүйелерінің жауаптарында контенттің көрінуін арттыру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/candidate-evidence.html\"&gt;генерация кандидатов&lt;/a&gt; — Суреттегі желінің мүмкін болатын жауаптарының кең картасын жасайтын COBICount әдісінің бірінші кезеңі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/geometric-accuracy.html\"&gt;Геометрическая точность&lt;/a&gt; — Орташа абсолюттік тереңдік қателігі (MAE) және нысандардың кеңістікте орналасуының дұрыстығы арқылы бағаланатын реконструкция сапасының…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/global-ai-governance.html\"&gt;Глобальное регулирование ИИ&lt;/a&gt; — Мемлекеттер мен жеке корпорациялар арасында бөлінген жасанды интеллект технологиялары үшін ережелер мен нормаларды қалыптастыру процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gomofiliya.html\"&gt;Гомофилия&lt;/a&gt; — Әлеуметтік желідегі пайдаланушылардың өздеріне ұқсас адамдармен бірігу және өзара әрекеттесу үрдісі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o\"&gt;&lt;a href=\"reference/glossary.html#o\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О&lt;/span&gt;&lt;/a&gt;О&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-change_detection.html\"&gt;Обнаружение изменений&lt;/a&gt; — Что изменилось между снимками: застройка, леса, разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/obobschenie.html\"&gt;Обобщение&lt;/a&gt; — Тілдік модельдің бірдей сұраныс пішіні өзгерген кезде семантикалық тұрақты және келісілген нәтижелерді сақтау қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reversible-numerical-mapping.html\"&gt;Обратимое числовое отображение&lt;/a&gt; — Деректерді қорғау әдісі, мұнда сандық мәндер реттілікті сақтай отырып, басқаларымен ауыстырылады, бұл бастапқы деректерді жергілікті…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reinforcement-learning-with-verifiable-rewards.html\"&gt;Обучение с подкреплением на основе верифицируемых наград&lt;/a&gt; — Модельді оқыту әдісі, мұнда әрекет үшін сыйақы жасалған команданың дұрыстығын автоматты түрде тексеру негізінде анықталады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/source-only-counting.html\"&gt;обучение только на исходных данных&lt;/a&gt; — Модельді бекіткенге дейін мақсатты суреттер мен белгілерді пайдаланбай, нысандарды санау модельдерін жалғыз белгіленген деректер жиынында…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ontologiya-v-dannom-kontekste.html\"&gt;Онтология&lt;/a&gt; — Деректер құрылымын компьютерге түсінікті ету үшін санаттар мен олардың арасындағы байланыстарды жүйелейтін модель.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ispolnyaemyy-graf-elementov.html\"&gt;Орындалатын элементтер графы&lt;/a&gt; — Жүйеге кескінді жай ғана салу емес, әрбір нысанды код ретінде басқаруға және фактілерге сәйкестігін тексеруге мүмкіндік беретін деректер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/compounding-ratio.html\"&gt;отношение компаундирования&lt;/a&gt; — GEO-ның қашықтықтағы нақты әсерінің бір қадамдық бағалау нәтижелеріне қатынасын көрсететін көрсеткіш.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oflayn-otsenka.html\"&gt;Офлайн бағалау&lt;/a&gt; — Алгоритмді нақты пайдаланушылармен өзара әрекеттесусіз, статикалық деректер жиынтығында сынақтан өткізу.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n\"&gt;&lt;a href=\"reference/glossary.html#n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Н&lt;/span&gt;&lt;/a&gt;Н&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-night_lights.html\"&gt;Ночные огни и косвенные признаки&lt;/a&gt; — Экономика и события по свечению городов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-narratives.html\"&gt;Нарративы и дезинформация&lt;/a&gt; — Отслеживание сюжетов и ложных утверждений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nats.html\"&gt;Наттар&lt;/a&gt; — Модельдің сенімділігін бағалау үшін қолданылатын ақпарат өлшем бірлігі: мән неғұрлым жоғары болса, модельдің белгілі бір токенге деген…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scientific-drift.html\"&gt;Наукометрический дрейф&lt;/a&gt; — Уақыт өте келе белгілі бір саладағы ғылыми зерттеулердің бағыты мен әдіснамасының өзгеруі, тақырыптық кластерлердің аталу жиілігі арқылы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-compensatory-principle.html\"&gt;Некомпенсаторность&lt;/a&gt; — Модельдің жалпы өнімділігіне қарамастан, кез келген істен шығу немесе белгісіздік жағдайында әрекеттерді блоктайтын бақылау механизмі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neuchtennaya-nauka.html\"&gt;Неучтенная наука&lt;/a&gt; — Ғылыми жобалар қаржыландырылуы және орындалуы жалғасатын, бірақ өтінім мәтіндеріне енгізілген түзетулерге байланысты ресми мемлекеттік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/normalizatsiya.html\"&gt;Нормализация&lt;/a&gt; — Деректерді бірыңғай стандартқа келтіру, осылайша әртүрлі модельдер олармен ортақ үлгі негізінде жұмыс істей алады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/expected-degree-null-model.html\"&gt;Нулевая модель&lt;/a&gt; — Пайдаланушылардың кіріс және шығыс байланыстарының санын ескере отырып, өзара әрекеттесулердің кездейсоқ таралуын бағалауға арналған…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zero-shot.html\"&gt;Нулевое обучение&lt;/a&gt; — Жүйенің нақты шарттар немесе нысандар үшін арнайы қайта оқытуды қажет етпей, тапсырмаларды орындайтын жұмыс режимі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/point-supervision.html\"&gt;Нүктелік бақылау&lt;/a&gt; — Әрбір нысан оның ортасында бір нүктемен белгіленетін кескіндерді аннотациялау әдісі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o1\"&gt;&lt;a href=\"reference/glossary.html#o1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O&lt;/span&gt;&lt;/a&gt;O&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-osm_gis.html\"&gt;OpenStreetMap и ГИС&lt;/a&gt; — Открытые карты, геоданные, пространственный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b\"&gt;&lt;a href=\"reference/glossary.html#b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Б&lt;/span&gt;&lt;/a&gt;Б&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bots.html\"&gt;Боты&lt;/a&gt; — Автоматические аккаунты и их поиск.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/base-belief.html\"&gt;Базовое убеждение&lt;/a&gt; — Модель өтірік айтуға итермелейтін факторлар болмаған кезде, пайдалы көмекші режимінде дәйекті түрде білдіретін ұстаным.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/program-aided-reasoning.html\"&gt;Бағдарлама көмегімен пайымдау&lt;/a&gt; — Модель есептеулер үшін код генерациялайтын әдіс, ол логикалық қорытындылардың дәлдігін арттырады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sft.html\"&gt;Бақыланатын дәл баптау&lt;/a&gt; — Бақыланатын баптау (SFT) — бұл модельдің мінез-құлқын нақты тапсырмаларға бейімдеу және қажетті жауаптарды мәжбүрлі түрде орнату үшін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stateless-inference.html\"&gt;Безгосударственный инференс&lt;/a&gt; — Тілдік модельдің әрбір жаңа сұраныс үшін назар аудару күйін қайта есептейтін жұмыс режимі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anchoring.html\"&gt;Бекіту&lt;/a&gt; — Жүйелік нұсқауларды модельге әр сұрауда мәжбүрлі түрде қайталау арқылы контекстті ұстап тұру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iteratsiya-po-bellmanu.html\"&gt;Беллман итерациясы&lt;/a&gt; — Модель тереңірек іздеу бағаларына сүйене отырып, өз болжамдарын кезең-кезеңімен жақсартатын оқыту әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/popravka-bendzhamini-hohberga.html\"&gt;Бенджамини-Хохберг түзетуі&lt;/a&gt; — Көптеген салыстырулар жүргізген кезде қате оң нәтижелерді бақылауға және кездейсоқ корреляцияларды жоюға арналған статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/benchmark.html\"&gt;Бенчмарк&lt;/a&gt; — Әртүрлі алгоритмдердің тиімділігін бірыңғай шкала бойынша салыстыру үшін қолданылатын деректер мен тапсырмалар жиынтығы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-butstrepa.html\"&gt;Бутстрап әдісі&lt;/a&gt; — Деректердің бастапқы жиынтығынан қайта таңдау арқылы бағалау дәлдігін тексеру үшін қолданылатын статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/butstrep.html\"&gt;Бутстреп&lt;/a&gt; — Тұжырымдардың сенімділігін тексеру үшін деректерді қайта-қайта таңдап алу арқылы жүргізілетін статистикалық бағалау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/butstrep-intervaly.html\"&gt;Бутстреп-интервалдары&lt;/a&gt; — Деректерді қайта-қайта таңдап алу арқылы анықталған трендтердің қаншалықты сенімді екенін бағалауға көмектесетін статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-pass-candidate-scorer.html\"&gt;Бір өтімді скорер&lt;/a&gt; — Модель деректерді өңдеудің бір циклінде шешім нұсқаларын бағалайтын әдіс, ол көп сатылы генеративті процестерге қарағанда жүйе жылдамдығын…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r\"&gt;&lt;a href=\"reference/glossary.html#r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Р&lt;/span&gt;&lt;/a&gt;Р&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-diffusion.html\"&gt;Распространение и виральность&lt;/a&gt; — Как сообщения расходятся по сети.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/train-inference-gap.html\"&gt;разрыв между обучением и выводом&lt;/a&gt; — Модельдің мәжбүрлі оқыту кезінде қарсыластық шабуылдарды сәтті меңгеруі, бірақ еркін мәтін генерациясында оларды елемеу құбылысы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/assurance-transition-gap.html\"&gt;Разрыв перехода к гарантиям&lt;/a&gt; — Жүйенің тапсырманы орындайтын, бірақ тәуекелдер туындаған кезде агенттің өкілеттік деңгейін өзгерту механизмі жоқ күйі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mahalanobis-distance.html\"&gt;Расстояние Махаланобиса&lt;/a&gt; — Кескіндерге енгізілген өзгерістердің нақты деректердің таралу шеңберінен шықпауын бағалау үшін қолданылатын прокси-метрика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/regulatory-arbitrage.html\"&gt;Регуляторный арбитраж&lt;/a&gt; — Басқа аймақтарда белгіленген шектеулерді айналып өту үшін ережелері ең жұмсақ юрисдикцияны таңдау тәжірибесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rekursiya.html\"&gt;Рекурсия&lt;/a&gt; — Әрбір келесі мән алдыңғысына тәуелді болатын есептеу әдісі, ол іздеу нәтижелеріндегі кері байланысты модельдеуге мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/render-sravnenie.html\"&gt;Рендер-салыстыру&lt;/a&gt; — Виртуалды модель мен нақты фотосуретті бірдей камера параметрлерімен салыстырып, геометриялық немесе текстуралық ауытқуларды анықтау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rhetorical-structure.html\"&gt;Риторическая структура&lt;/a&gt; — Мәтіндегі автор өз зерттеуінің маңыздылығын негіздейтін аргументативті қадамдардың тізбегі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e\"&gt;&lt;a href=\"reference/glossary.html#e\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Э&lt;/span&gt;&lt;/a&gt;Э&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ethics.html\"&gt;Этика и приватность&lt;/a&gt; — Где граница: защита персональных данных, риски исследований.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekstraktor.html\"&gt;Экстрактор&lt;/a&gt; — Мәтіннен ғылыми мәлімдемелерді бөліп алатын модель.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/embedding.html\"&gt;Эмбеддинг&lt;/a&gt; — Мәтінді сандық вектор түрінде көрсету, бұл модельге посттардың семантикалық жақындығын түсінуге мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dreyf-embeddingov.html\"&gt;Эмбеддингтер дрейфі&lt;/a&gt; — Модельдегі сөздерді немесе токендерді білдіретін сандық векторлардың өзгеруі. Дрейфтің болмауы модель токеннің мағынасын қайта оқымағанын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enkoder-dekoder.html\"&gt;Энкодер-декодер&lt;/a&gt; — Нейрондық желі архитектурасы, мұнда энкодер кіріс деректерді (шахмат позициясын) векторлық түрге келтірсе, декодер оны адам түсінетін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beautiful.html\"&gt;Эстетикалық бағалау&lt;/a&gt; — Визуалды деректер негізінде қалалық ортаның тартымдылығын субъективті қабылдауды анықтайтын метрика.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v\"&gt;&lt;a href=\"reference/glossary.html#v\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В&lt;/span&gt;&lt;/a&gt;В&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-web_archives.html\"&gt;Веб-архивы&lt;/a&gt; — Wayback Machine, сохранение и сравнение страниц.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/verbalized-sampling.html\"&gt;Вербализованное сэмплирование&lt;/a&gt; — Тілдік модель берілген жауаптар саны үшін ықтималдықтар үлестірімін өздігінен шығаратын генерацияны әртараптандыру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/probabilistic-volumetric-map.html\"&gt;Вероятностная волюметрическая карта&lt;/a&gt; — Кеңістікті көлемді модель түрінде көрсету, ол нысанның орналасу ықтималдығын бағалау үшін оқиғалар тарихының деректерін және ағымдағы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sintez-vizualno-simvolicheskih-programm.html\"&gt;Визуалды-символдық бағдарламалау&lt;/a&gt; — Графикалық элементтерді код пен бастапқы деректермен тығыз байланыстыру әдісі, бұл кескінді бағдарлама ретінде өңдеуге мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vizualnaya-inspektsiya.html\"&gt;Визуалды тексеру&lt;/a&gt; — Агенттің өткен кадрлардың бөліктерін егжей-тегжейлі зерттеуге немесе әртүрлі уақыт сәттеріндегі ортаның күйін салыстыруға арналған құралы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-number-generator.html\"&gt;Внешний генератор случайных чисел&lt;/a&gt; — Жауаптарды жоспарлау кезінде модель ұсынған нұсқалардың ішінен біреуін таңдау үшін қолданылатын сыртқы кездейсоқтық құралы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enactment.html\"&gt;Воплощение&lt;/a&gt; — Агенттің диалог барысында белгіленген рөлді орындау процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/completion-gate.html\"&gt;ворота завершения&lt;/a&gt; — Модельді тапсырманың орындалғанын растамас бұрын алынған нәтижені бастапқы тапсырма мәтінімен салыстыруға мәжбүрлейтін механизм.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ae\"&gt;&lt;a href=\"reference/glossary.html#ae\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ә&lt;/span&gt;&lt;/a&gt;Ә&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-methods.html\"&gt;Әдістер және этика&lt;/a&gt; — Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i\"&gt;&lt;a href=\"reference/glossary.html#i\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И&lt;/span&gt;&lt;/a&gt;И&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-tooling.html\"&gt;Инструменты и пайплайны&lt;/a&gt; — Открытые инструменты и их сравнение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/information-extraction.html\"&gt;Извлечение информации&lt;/a&gt; — Кейінгі талдау үшін табиғи тілдегі құрылымдалмаған мәтінді құрылымдалған деректерге түрлендіру процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-agent.html\"&gt;ИИ-агент&lt;/a&gt; — Тұрақты сәйкестігі мен өзара әрекеттесу тарихы бар LLM негізіндегі бағдарламалық нысан.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/inspect.html\"&gt;Инспекция» (inspect) механизмі&lt;/a&gt; — Модельге бағдарламалық түрде кескін бөліктерін «жақындатып», бастапқы ажыратымдылықта көрінбейтін ұсақ бөлшектерді талдауға мүмкіндік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/inferens.html\"&gt;Инференс&lt;/a&gt; — Оқытылған нейрондық желіні жаңа деректер бойынша жауап алу үшін қолдану процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tool-use.html\"&gt;Использование инструментов&lt;/a&gt; — Тілдік модельдің сыртқы жүйелермен немесе серверлермен өзара әрекеттесу үшін құрылымдалған сұраныстарды жасау қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iterative-distillation.html\"&gt;Итеративная дистилляция&lt;/a&gt; — Модель позицияларды талдайтын, түсіндірмелер жасайтын және алынған тәжірибені өз салмақтарына қайта өткізетін оқыту процесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iterative-framework.html\"&gt;Итеративный фреймворк&lt;/a&gt; — Алдын ала белгіленген онтологияны пайдаланбай, құрылымдалмаған мәтіндер корпусынан атрибут схемаларын автоматты түрде анықтау және шығарып…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d\"&gt;&lt;a href=\"reference/glossary.html#d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д&lt;/span&gt;&lt;/a&gt;Д&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-datasets.html\"&gt;Датасеты и бенчмарки&lt;/a&gt; — Размеченные наборы для проверки методов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dataset.html\"&gt;Датасет&lt;/a&gt; — Өтірік детекторларын оқыту және сынау үшін қолданылатын сұрақ-жауап жұптарының жиынтығы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/karta-navykov.html\"&gt;Дағды картасы&lt;/a&gt; — Дизайн шаблонының құрылымдалған сипаттамасы, ол жүйеге деректер логикасын бұзбай элементтерді қалай орналастыру керектігін түсінуге…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/two-hop.html\"&gt;Два прыжка&lt;/a&gt; — Пайдаланушыдан екі байланыс қашықтығында орналасқан контент авторына дейінгі жазылу графындағы радиус.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/embodied-ai.html\"&gt;Денеленген жасанды интеллект&lt;/a&gt; — Зияткерлік агенттер виртуалды ортаны пайдалана отырып, физикалық әлеммен өзара әрекеттесу дағдыларын қалыптастыратын бағыт.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/otravlenie-dannyh.html\"&gt;Деректерді улау&lt;/a&gt; — Модельдің нақты жауаптары мен шешім қабылдау логикасын бұрмалау үшін оқу таңдамасына жалған ақпаратты енгізу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/determinirovannye-povoroty.html\"&gt;Детерминирленген айналдыру&lt;/a&gt; — Тізімдегі элементтер ретін өзгерту арқылы модельдің бірінші нұсқаға бейімділігін тексеру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/determinirovannaya-kanonizatsiya.html\"&gt;Детерминирленген канонизация&lt;/a&gt; — Пәрмендердің әртүрлі жазылу нұсқаларын бірыңғай стандартқа келтіру процесі, бұл модель дәлдігін объективті бағалауға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/diagnostic-ladder.html\"&gt;Диагностическая лестница&lt;/a&gt; — Жасанды интеллект дағдыларын тексеру әдісі, ол қайталауды тексеруді, бірінші токенді зондтауды және эмбеддинг дрейфін талдауды қамтиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dispersiya.html\"&gt;Дисперсия&lt;/a&gt; — Деректердің шашыраңқылық көрсеткіші; жоғары дисперсия бірдей тест нәтижелерінің әр жолы әртүрлі болуы мүмкін екенін білдіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dissociation.html\"&gt;Диссоциация&lt;/a&gt; — Жасанды интеллект агентінің белгіленген рөлін жоғалтып, өзін базалық модель ретінде сәйкестендіре бастайтын күйі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/distilled-model.html\"&gt;Дистиллированная модель&lt;/a&gt; — Сұраныстардағы нысандар мен тақырыптарды қайта жазу үшін қолданылатын, параметрлер саны азайтылған жергілікті нейрондық желі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/diffusion-inpainting.html\"&gt;Диффузионный инпейнтинг&lt;/a&gt; — Қалалық орта суреттеріндегі өткізіп алған немесе өзгертілген аймақтарды толтыру үшін жүйеде қолданылатын кескінді генеративті өңдеу әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/diffuzionnaya-model.html\"&gt;Диффузиялық модель&lt;/a&gt; — Кездейсоқ деректерден «шуды» кезең-кезеңімен алып тастау арқылы кескін жасайтын нейрондық желі түрі, ол жоғары дәлдік пен шынайылыққа қол…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attention-path-length.html\"&gt;Длина пути внимания&lt;/a&gt; — Пайдаланушы мен ол өзара әрекеттесетін контент авторы арасындағы жазылу графындағы қашықтықты өлшейтін метрика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adaptatsiya-domenov.html\"&gt;Домендік адаптация&lt;/a&gt; — Модельді бір дереккөзден алынған мәліметтерден басқа, жаңа шарттардағы мәліметтерге бейімдеу процесі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"8\"&gt;&lt;a href=\"reference/glossary.html#8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8&lt;/span&gt;&lt;/a&gt;8&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/8-bitnyy-optimizator.html\"&gt;8-биттік оптимизатор&lt;/a&gt; — Жадты үнемдеуге мүмкіндік беретін, бірақ толық bf16 форматымен салыстырғанда есептеу дәлдігіне әсер етуі мүмкін оптимизатор күйін сығу…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a1\"&gt;&lt;a href=\"reference/glossary.html#a1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A&lt;/span&gt;&lt;/a&gt;A&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-note-writer-api.html\"&gt;AI Note Writer API&lt;/a&gt; — Үшінші тарап әзірлеушілеріне жасанды интеллект көмегімен Community Notes жүйесі үшін контекстік түсініктемелерді автоматты түрде жасауға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/arc-agi-3.html\"&gt;ARC-AGI-3&lt;/a&gt; — 25 визуалды ойыннан тұратын интерактивті бенчмарк, мұнда агент ережелерді нақты белгілемей-ақ, заңдылықтар мен мақсаттарды өз бетінше…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; — Жіктеу сапасының метрикасы: 0,5 кездейсоқ болжамды, 1,0 мінсіз дәлдікті білдіреді. 0,69 мәні модельдің орташа болжау қабілетін көрсетеді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b1\"&gt;&lt;a href=\"reference/glossary.html#b1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B&lt;/span&gt;&lt;/a&gt;B&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/beam-search.html\"&gt;Beam Search&lt;/a&gt; — Әр қадамда ең ықтимал нұсқаларды сақтайтын және көптеген шабуыл сценарийлерін тиімді зерттеуге мүмкіндік беретін іздеу алгоритмі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beyondsce.html\"&gt;BeyondSCe&lt;/a&gt; — Роботқа арналған нысандарды ұстау жүйесі, ол өткен өзара әрекеттесу тарихын және жасырын заттарды іздеу үшін белсенді қабылдауды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/blaise.html\"&gt;Blaise&lt;/a&gt; — Құжаттарды индекстейтін және модельге тек қатысты мәтін үзінділерін беретін Galahad жүйесінің құрамдас бөлігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/byzantine-fault-tolerance.html\"&gt;ByzFL&lt;/a&gt; — Жүйенің жекелеген түйіндеріндегі ақауларға немесе зиянды әрекеттерге төзімділігін қамтамасыз ету әдісі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c\"&gt;&lt;a href=\"reference/glossary.html#c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C&lt;/span&gt;&lt;/a&gt;C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/create-a-research-space.html\"&gt;CARS&lt;/a&gt; — Ғылыми мақалаларға кіріспе құрылымының моделі, ол дәлелдеуді үш риторикалық қадам арқылы сипаттайды: аумақты белгілеу, бос орынды бөліп…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/model-cars.html\"&gt;CARS моделі&lt;/a&gt; — Ғылыми кіріспелердің құрылымын талдаудың стандартты лингвистикалық тәсілі, мұнда автор кезең-кезеңімен жалпы контекстен нақты зерттеу…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zakon-masshtabirovaniya-chinchilla.html\"&gt;Chinchilla заңы&lt;/a&gt; — Нейрожелі параметрлерінің саны мен оқу деректерінің көлемі арасындағы оңтайлы қатынасты анықтайтын математикалық модель.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/claimopinion.html\"&gt;ClaimOpinion&lt;/a&gt; — Ескертпенің пайдалы (Helpful) деп танылу ықтималдығын болжайтын, оның бейтараптығын талдайтын машиналық оқыту моделі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt; — Пайдаланушы операцияларды орындау үшін мәтіндік командаларды енгізетін компьютерлік бағдарламамен өзара әрекеттесу тәсілі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cobicount.html\"&gt;COBICount&lt;/a&gt; — Жер серігі суреттеріндегі нысандарды санау әдісі, ол мақсатты деректерде қайта оқытусыз үміткерлерді генерациялауды, тексеруді және фондық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-notes.html\"&gt;Community Notes&lt;/a&gt; — Әлеуметтік желідегі жалған ақпаратпен күресу үшін пайдаланушылардың жазбаларға контекстік түсініктемелер қосуына арналған…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-writer.html\"&gt;Community Writer&lt;/a&gt; — Контекстік түсініктемелерді жасау және басымдығын анықтау үшін қайта оқытылған және коммерциялық модельдерді біріктіретін AI API-дің ең ірі…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conversational-capture.html\"&gt;Conversational capture&lt;/a&gt; — Жасанды интеллектпен диалогта дереккөздің ерте дәйексөз келтірілуі оның болашақта қайта пайда болу ықтималдығын арттыратын құбылыс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-rated-helpful.html\"&gt;CRH&lt;/a&gt; — Пайдаланушылар консенсусы негізінде алгоритм арқылы түсініктемеге берілетін және оның платформада кеңінен көрінуін қамтамасыз ететін…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d1\"&gt;&lt;a href=\"reference/glossary.html#d1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D&lt;/span&gt;&lt;/a&gt;D&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/drift-inspector.html\"&gt;Drift Inspector&lt;/a&gt; — Ғылыми салалардың эволюциясын атомдық үлес тұжырымдарын бөліп алу және кластерлеу арқылы талдауға арналған ашық бастапқы кодты жүйе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f1\"&gt;&lt;a href=\"reference/glossary.html#f1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F&lt;/span&gt;&lt;/a&gt;F&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/f1-mera.html\"&gt;F1-өлшемі&lt;/a&gt; — Модельдің дәлдігі (precision) мен толықтығын (recall) біріктіретін метрика, мұнда 100% идеалды сәйкестікті білдіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/forsyth-edwards-notation.html\"&gt;FEN&lt;/a&gt; — Модель үшін кіріс деректері ретінде пайдаланылатын шахмат позициясын жазып алу стандарты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; — Зерттеуге сәйкес, жасанды интеллект жасаған контентке қате басымдық беретін деректер сапасының сүзгісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/false-positive-rate.html\"&gt;FPR&lt;/a&gt; — Қауіпсіз әрекеттердің қауіп ретінде қате блокталған үлесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/frame-break.html\"&gt;Frame-break&lt;/a&gt; — Модельді «рөлдік ойыннан» шығарып, базалық нұсқауларға қайтару және қалаусыз күйлердің бекіп қалуына жол бермеу әдісі.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g1\"&gt;&lt;a href=\"reference/glossary.html#g1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G&lt;/span&gt;&lt;/a&gt;G&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/gacha-decoding.html\"&gt;Gacha Decoding&lt;/a&gt; — Тілдік модельдер арқылы контент генерациялау әдісі, ол вариативтілік көзін токендердің энтропиясынан нұсқауларды орындауға ауыстырады және…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/galahad.html\"&gt;Galahad&lt;/a&gt; — Үлкен тілдік модельдердің жұмысын жеделдету үшін назар аудару күйі мен мәтін үзінділерін сақтайтын жүйе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h\"&gt;&lt;a href=\"reference/glossary.html#h\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H&lt;/span&gt;&lt;/a&gt;H&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-computer-interaction.html\"&gt;HCI&lt;/a&gt; — Адамның компьютерлік жүйелермен өзара әрекеттесуін зерттейтін, интуитивті және тиімді интерфейстерді жасауға бағытталған білім саласы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hdbscan.html\"&gt;HDBSCAN&lt;/a&gt; — Ғылыми тұжырымдардың тақырыптық топтарын бөліп алу және бірегей үлестерді (\"шу\") ажырату үшін қолданылатын тығыздықты кластерлеу алгоритмі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/heartbeat.html\"&gt;Heartbeat&lt;/a&gt; — Сессияның белсенділігін сақтау үшін модельге жіберілетін автоматты сұрау.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i1\"&gt;&lt;a href=\"reference/glossary.html#i1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;I&lt;/span&gt;&lt;/a&gt;I&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/igenbench.html\"&gt;IGenBench&lt;/a&gt; — Фактілердің дәлдігі мен жасалатын инфографиканың дәлдігін бағалау үшін пайдаланылатын деректер жиынтығы және бенчмарк.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-context-learning.html\"&gt;In-context learning&lt;/a&gt; — Модельдің салмақтарын өзгертпей, тек промпттағы мысалдар арқылы тапсырманы орындау қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-sample-effekt.html\"&gt;In-sample эффект&lt;/a&gt; — Жүйе оқытылған немесе бапталған деректер негізінде оның тиімділігін бағалау, бұл көрсеткіштерді асыра бағалауы мүмкін.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infoagent.html\"&gt;InfoAgent&lt;/a&gt; — Инфографика элементтерін тәуелділіктер графы арқылы дереккөздерімен байланыстыратын және алдын ала оқытусыз қателерді жергілікті түзетуді…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infographicbench-evidence.html\"&gt;InfoGraphicBench-Evidence&lt;/a&gt; — Тексерілетін дәлелдемелер негізінде инфографиканы құрудың сенімділігі мен дәлдігін бағалауға арналған 260 сұраныстан тұратын бенчмарк.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ipsaemin.html\"&gt;ipSAEmin&lt;/a&gt; — Болжамды туралау қателігінің метрикасы (0-ден 1-ге дейін), мұнда 0,5-тен жоғары мәндер байланысу интерфейсінің сәтті қалыптасқанын…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infographic-visual-description.html\"&gt;IVD&lt;/a&gt; — Нақты деректерді, дәлелдеме көздерін, кенеп аймақтарын және тексеру ережелерін бекітетін типтелген тәуелділіктер графы түріндегі…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k1\"&gt;&lt;a href=\"reference/glossary.html#k1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;K&lt;/span&gt;&lt;/a&gt;K&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/kalibench.html\"&gt;KaliBench&lt;/a&gt; — Kali Linux CLI құралдары үшін табиғи тілдегі сұрауларды командаларға аударуды бағалауға арналған арнайы бенчмарк және деректер жиынтығы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/key-value-cache.html\"&gt;KV-кэш&lt;/a&gt; — Мәтін блоктары үшін модель есептеген назар аудару кілттері мен мәндерін қамтитын деректер жиынтығы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l\"&gt;&lt;a href=\"reference/glossary.html#l\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;L&lt;/span&gt;&lt;/a&gt;L&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/lifo.html\"&gt;LIFO&lt;/a&gt; — Кезекпен өңдеу әдісі, мұнда ең соңғы келген тапсырма бірінші болып орындалады, бұл жүйеге ең жаңа және өзекті оқиғаларға жедел жауап беруге…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/litereality-agent.html\"&gt;LiteReality-Agent&lt;/a&gt; — Орындалатын Python кодын жазу арқылы бөлмелердің RGB-D сканерлерін интерактивті 3D көріністерге айналдыратын агенттік жүйе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; — Ғылыми мәтіндерді генерациялау және олардың құрылымын талдау үшін қолданылатын жасанды интеллект жүйелері.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/llm-sudya.html\"&gt;LLM-төреші&lt;/a&gt; — Кескін сапасын мәтіндік критерийлер негізінде бағалау үшін қолданылатын тілдік модельдер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/logit-lens.html\"&gt;Logit lens&lt;/a&gt; — Жауаптың қалыптасу процесін бақылау үшін модельдің әртүрлі қабаттарындағы токендердің ықтималдығын талдау әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt; — LoRA (Low-Rank Adaptation) — нейрожелілерді тиімді баптау әдісі, мұнда салмақтардың тек шағын бөлігі ғана оқытылады, бұл есептеу…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/local-real-task-agent-benchmark.html\"&gt;LRAB&lt;/a&gt; — Шағын тілдік модельдердің нақты тапсырмаларды орындау кезіндегі өнімділігіне орындау ортасының әсерін бағалауға арналған бақыланатын…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m\"&gt;&lt;a href=\"reference/glossary.html#m\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M&lt;/span&gt;&lt;/a&gt;M&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/medical-subject-headings.html\"&gt;MeSH&lt;/a&gt; — Ғылыми мақалаларды индекстеуге арналған басқарылатын сөздік жүйесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/messy-zaprosy.html\"&gt;Messy» сұраныстар&lt;/a&gt; — Модельдің шуды елемей, тапсырманың мәніне назар аудару қабілетін тексеру үшін грамматикалық қателері мен бұзылған құрылымы бар жасанды…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mimic-iv.html\"&gt;MIMIC-IV&lt;/a&gt; — Реанимациядағы тілдік модельдердің жұмысын бағалау үшін пайдаланылған 2000 пациенттің клиникалық көрсеткіштерінің деректер базасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mingbird.html\"&gt;Mingbird&lt;/a&gt; — Windows пен Ollama-ға арналған жергілікті агенттік жүйе, ол шағын тілдік модельдердің типтік қателерінен қорғайтын механизмдерді қамтиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt; — Симуляция үшін дайын 3D көріністері экспортталатын физикалық модельдеуге арналған бағдарламалық орта.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-lora.html\"&gt;Multi-LoRA&lt;/a&gt; — Нейрондық желілерді тиімді баптау әдісі, ол бір базалық модельде бірнеше мамандандырылған адаптерді іске қосуға мүмкіндік береді және…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n1\"&gt;&lt;a href=\"reference/glossary.html#n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;N&lt;/span&gt;&lt;/a&gt;N&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/near-miss-prompty.html\"&gt;Near-miss» промпттар&lt;/a&gt; — Мақсатты сұраныстарға өте жақын, бірақ кішігірім ауытқулары бар, модельдің қателерге төзімділігін тексеретін сұраныстар.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nih-exporter.html\"&gt;NIH ExPORTER&lt;/a&gt; — АҚШ Ұлттық денсаулық сақтау институттары беретін гранттардың атаулары, аннотациялары және бюджеттері туралы мәліметтерді қамтитын деректер…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p1\"&gt;&lt;a href=\"reference/glossary.html#p1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P&lt;/span&gt;&lt;/a&gt;P&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/p-first.html\"&gt;P-first&lt;/a&gt; — Модельдің жауапты қалыптастырудағы сенімділік деңгейі; 1-ге жақын мәндер жоғары детерминизмді білдіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pangram-3-3-2.html\"&gt;Pangram 3.3.2&lt;/a&gt; — Қателік деңгейі төмен мамандандырылған классификатор: жалған оң нәтиже 0,05%, ал жалған теріс нәтиже 1,99% құрайды, бұл деректерді дәл…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pass-1.html\"&gt;pass@1&lt;/a&gt; — Бірінші талпыныста дұрыс орындалған тапсырмалар үлесін бағалайтын метрика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/personal-data-server.html\"&gt;PDS&lt;/a&gt; — Пайдаланушының жеке деректерін сақтайтын орталықтандырылмаған сервер, оған ашық хаттама арқылы қол жеткізуге болады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/projected-gradient-descent.html\"&gt;PGD-шабуыл&lt;/a&gt; — Модельдің шығын функциясын азайту арқылы қарсыластық бұрмалауларды жасау үшін қолданылатын итеративті оңтайландыру әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/position-bias.html\"&gt;Position bias&lt;/a&gt; — Модельдің кандидаттардың нақты сапасына емес, олардың орналасу ретіне артықшылық беруге бейімділігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pskip.html\"&gt;Pskip&lt;/a&gt; — Модельдің құралды шақыру ықтималдығын бағалауға арналған метрика, ол зондтау дәлдігін бұзуы мүмкін кездейсоқ бос орындар мен жол…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"q\"&gt;&lt;a href=\"reference/glossary.html#q\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q&lt;/span&gt;&lt;/a&gt;Q&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/quality-explanation-and-evaluation-network.html\"&gt;QUEEN&lt;/a&gt; — Шахмат қозғалтқышы мен тілдік модельді біріктіріп, жүрістерді және олардың мәтіндік негіздемелерін жасауға арналған энкодер-декодер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/qwk.html\"&gt;QWK&lt;/a&gt; — Бағалаушылар арасындағы келісім деңгейін өлшейтін статистикалық көрсеткіш, 0.6-дан жоғары мәндер жоғары сенімділікті білдіреді.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r1\"&gt;&lt;a href=\"reference/glossary.html#r1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;R&lt;/span&gt;&lt;/a&gt;R&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/r.html\"&gt;r&lt;/a&gt; — Оқыту таңдамасындағы AI мәтінінің адам мәтініне қатынасының коэффициенті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/retrieval-augmented-generation.html\"&gt;RAG&lt;/a&gt; — RAG (Retrieval-Augmented Generation) — бұл модель алдымен сыртқы дереккөздерден ақпарат іздеп, содан кейін солардың негізінде жауап…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rcdc.html\"&gt;RCDC&lt;/a&gt; — Өтінім мәтінін талдау негізінде NIH гранттарын 300-ден астам санатқа автоматты түрде жіктеу жүйесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recast.html\"&gt;ReCast&lt;/a&gt; — Құпия деректерді қорғау жүйесі, ол бұлтты нейрондық желілерде қауіпсіз өңдеу үшін кіріс файлдарын мәндер мен нысандарды ауыстыра отырып…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/regret.html\"&gt;Regret&lt;/a&gt; — Модель таңдаған нұсқа сапасы мен берілген жиынтықтағы ең жоғары мүмкін сапа арасындағы айырмашылықты көрсететін метрика.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/remhr.html\"&gt;REMHR&lt;/a&gt; — Азшылықтар денсаулығына бағытталған жобаларға берілетін санат. Ол деректерді жіктеу үшін нәсілдік немесе этникалық тегін жай ғана айнымалы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgb-d-skany.html\"&gt;RGB-D сканерлеу&lt;/a&gt; — Көріністің геометриясын қалпына келтіру үшін қолданылатын түс (RGB) және тереңдік (D) туралы ақпаратты қамтитын сканерлеу деректері.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/relative-human-action-efficiency.html\"&gt;RHAE&lt;/a&gt; — Агенттің тиімділік көрсеткіші, мұнда 100% агент пен адамның әрекет санының теңдігін, ал 100%-дан жоғары мәндер жоғары тиімділікті білдіреді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/room-py.html\"&gt;Room.py&lt;/a&gt; — 3D көрінісіндегі нысандардың геометриясын, физикалық қасиеттерін және кеңістіктік байланыстарын сипаттайтын орындалатын Python файлы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s1\"&gt;&lt;a href=\"reference/glossary.html#s1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S&lt;/span&gt;&lt;/a&gt;S&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/s-pubmedbert.html\"&gt;S-PubMedBERT&lt;/a&gt; — Медициналық мәтіндерді векторлауға арналған модель, білім базасымен фактілерді салыстыру дәлдігін қамтамасыз ету үшін қолданылады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sago.html\"&gt;SAGO&lt;/a&gt; — Тілдік модельдердің тұрақтылығын бағалауға арналған фреймворк, ол кіріс деректерінің семантикалық эквивалентті өзгерістері кезінде жүйе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scaffold.html\"&gt;Scaffold&lt;/a&gt; — Тілдік модельге операциялық жүйемен және құралдармен өзара әрекеттесуге көмектесетін бағдарламалық қабық.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secjev.html\"&gt;SecJev&lt;/a&gt; — Киберқауіпсіздік саласында шешім қабылдауға арналған мамандандырылған модельдер жиынтығы, ол авторегрессиялық генерацияның орнына…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secjev-corpus.html\"&gt;SecJev-Corpus&lt;/a&gt; — Қауіпсіздік модельдерін оқыту мен бағалауға арналған деректер жиынтығы, сегіз түрлі дереккөзден алынған 170 185 сұрақты қамтиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semhash.html\"&gt;SemHash&lt;/a&gt; — Семантикалық жағынан ұқсас мысалдарды біріктіру үшін жазбалардың векторлық көріністерін пайдаланатын деректерді дедупликациялау жүйесі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sglang.html\"&gt;SGLang&lt;/a&gt; — Тілдік модельдерді тиімді орындауға, жад пен генерация жылдамдығын оңтайландыруға арналған арнайы фреймворк.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stability-generalization-score.html\"&gt;SGS&lt;/a&gt; — Енгізілген деректер өзгерген кезде модель мінез-құлқының жауаптардың инварианттылық идеалды шартынан ауытқу дәрежесін өлшеу үшін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/simhash.html\"&gt;SimHash&lt;/a&gt; — Траектория ағашы түйіндерінің семантикалық жақындығын бағалау үшін SSH жүйесінде қолданылатын хэштеу алгоритмі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/speculative-safety-honeypot.html\"&gt;Speculative Safety Honeypot&lt;/a&gt; — Жасанды интеллект агенттерін проактивті қорғау жүйесі, ол зиянды әрекеттерді анықтау және бұғаттау үшін шағын тілдік модельдер арқылы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spp.html\"&gt;SPP&lt;/a&gt; — Модельдің ішкі күйіне әсер ететін сыртқы промпт факторларын жою үшін қолданылатын әдіс.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t\"&gt;&lt;a href=\"reference/glossary.html#t\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T&lt;/span&gt;&lt;/a&gt;T&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/taliesin.html\"&gt;Taliesin&lt;/a&gt; — Galahad жүйесінің мәтін блоктары үшін KV-күйін сақтауға және жүктеуге жауапты құрамдас бөлігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tokens-per-parameter.html\"&gt;TPPh&lt;/a&gt; — Модельдің оқытылу деңгейін анықтайтын көрсеткіш.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v1\"&gt;&lt;a href=\"reference/glossary.html#v1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;V&lt;/span&gt;&lt;/a&gt;V&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/vendi-score.html\"&gt;Vendi Score&lt;/a&gt; — Генерацияланған деректердің эмбеддингтері арасындағы қашықтықты өлшеуге негізделген жауаптардың әртүрлілігін бағалау метрикасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vida-geo.html\"&gt;VIDA-GEO&lt;/a&gt; — Қалалық инфрақұрылымды қала құрылысы нормаларын ескере отырып, шынайы визуалды өзгерістерді жасау үшін жерсеріктік және көше суреттерін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/visual-harness-for-reasoning.html\"&gt;VISTA&lt;/a&gt; — Мультимодальды модельдерге арналған қосымша жүйе, іс-әрекеттерді жоспарлау үшін жоғалтусыз ұзақ мерзімді визуалды жадты қамтамасыз етеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt; — Vision-Language Models (VLM) — бұл кескіндер мен мәтінді бір уақытта талдай алатын, визуалды контентті бағалауға және онымен өзара…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"w\"&gt;&lt;a href=\"reference/glossary.html#w\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;W&lt;/span&gt;&lt;/a&gt;W&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/wall-clock-time.html\"&gt;Wall-clock time&lt;/a&gt; — Тапсырма басталғаннан аяқталғанға дейінгі нақты өткен уақыт, ол жүйедегі барлық кідірістерді қамтиды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kod-uolsha-adamara.html\"&gt;Walsh-Hadamard коды&lt;/a&gt; — Деректерді кодтау тәсілі, кодтар арасындағы қашықтық (сәйкес келмейтін биттер саны) қателерді түзетуге мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wildai.html\"&gt;WildAI&lt;/a&gt; — Адамдар жазған мәтіндер мен жасанды интеллект жасаған мәтіндерге бөлінген веб-контенттен тұратын деректер корпусы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zh\"&gt;&lt;a href=\"reference/glossary.html#zh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ж&lt;/span&gt;&lt;/a&gt;Ж&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/dikiy-ii-tekst.html\"&gt;Жабайы» AI-мәтін&lt;/a&gt; — Нейрожелілер жасаған және интернетте табиғи түрде кездесетін, арнайы таңбалаусыз оқу жиынтықтарына түсетін контент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/graf-podpisok.html\"&gt;Жазылу графы&lt;/a&gt; — Қолданушылар арасындағы байланыстарды көрсететін деректер құрылымы, ал «назар аудару жолы» контенттің қолданушыға қанша делдал арқылы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kosvennaya-inektsiya.html\"&gt;Жанама инъекция&lt;/a&gt; — Шабуыл түрі, мұнда зиянды нұсқау пайдаланушы тарапынан емес, агент тапсырманы орындау барысында оқитын сыртқы деректер арқылы енгізіледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/idt.html\"&gt;Жасырын цифрлық егіз&lt;/a&gt; — Қымбат симуляцияларды өткізбей-ақ қалалық өзгерістер бойынша гипотезаларды тексеру үшін генеративті модельдер мен сараптамалық ережелерді…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-writers.html\"&gt;ЖИ-авторлары&lt;/a&gt; — API арқылы жарияланымдар лентасын бақылап, автоматты түрде түсіндірме ескертпелер жасайтын бағдарламалық агенттер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/loss.html\"&gt;Жоғалту функциясы&lt;/a&gt; — Нейрожелінің болжамы мен бөлінген таңдамадағы нақты деректер арасындағы айырмашылықты өлшейтін модель қателігінің көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/persona-anchoring.html\"&gt;Жүйелік бекіту&lt;/a&gt; — Агент сәйкестігін жүйелік нұсқаулар деңгейінде бекіту әдісі, ол «тұлғаны» хабарламалар тарихындағы жай мәтіннен бөліп тұрады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sistemnyy-prompt.html\"&gt;Жүйелік промпт&lt;/a&gt; — Жасанды интеллект агентінің рөлі мен сәйкестігін жүйелік деңгейде анықтайтын нұсқаулық.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soft-miss.html\"&gt;Жұмсақ қателік»&lt;/a&gt; — Модель құралды шақыру қажеттілігін дұрыс анықтағанымен, пәрмен параметрлерінде немесе синтаксисінде қате жіберген жағдай.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pipeline.html\"&gt;Жұмыс үрдісі&lt;/a&gt; — Модель деректерді алып, өңдеп және ортада әрекеттерді орындайтын автоматтандырылған қадамдар тізбегі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/parnyy-butstrepping.html\"&gt;Жұптық бутстреппинг&lt;/a&gt; — Сенімділік аралықтарын есептеу үшін деректерді қайта таңдауға негізделген статистикалық әдіс.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z\"&gt;&lt;a href=\"reference/glossary.html#z\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;З&lt;/span&gt;&lt;/a&gt;З&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/knapsack-problem.html\"&gt;Задача о рюкзаке&lt;/a&gt; — Жауап құрылымы модельге жасырын есептеулер үшін мәліметтерді оңай енгізуге және жасыруға мүмкіндік беретін сынақ тапсырмасы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mirroring.html\"&gt;Зеркалирование&lt;/a&gt; — Модельдің кіріс сұранысының стилін немесе құрылымын, тіпті жауап мазмұны үшін қажет болмаса да, көшіруге бейімділігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/response-mirroring.html\"&gt;Зеркальное отражение ответов&lt;/a&gt; — Модельдің кіріс сұранысының регистрін немесе стилін көрсету дәрежесі, бұл семантикалық емес шуды көшіру кезінде кездейсоқ тұрақсыздық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/first-token-probing.html\"&gt;Зондирование первого токена&lt;/a&gt; — Модельдің қажетті позицияда құралды шақырудың арнайы токенін жасаудың априорлық ықтималдығын бағалаудың диагностикалық әдісі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/probing.html\"&gt;Зондтау&lt;/a&gt; — Нейрондық желінің ішкі күйлерін талдау әдісі, мұнда модель активацияларынан белгілі бір ақпаратты (мысалы, «шын» немесе «өтірік») болжау…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/probes.html\"&gt;Зондтар&lt;/a&gt; — Нейрожелінің ішкі күйлерін талдау арқылы оның жауаптарының шынайылығын анықтайтын қосымша классификатор.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l1\"&gt;&lt;a href=\"reference/glossary.html#l1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Л&lt;/span&gt;&lt;/a&gt;Л&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/paternalism-trap.html\"&gt;Ловушка патернализма&lt;/a&gt; — Модельдің объективті болуға тырысып, суық және алшақ күйге түсуі, сондай-ақ қолданушының эмоционалдық контекстін елемеуі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spurious-correlation.html\"&gt;Ложная корреляция&lt;/a&gt; — Жауаптың шынайылығы мен сөйлеу мәнері немесе нұсқауларды орындау дәлдігі сияқты жанама факторлар арасындағы статистикалық байланыс.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m1\"&gt;&lt;a href=\"reference/glossary.html#m1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;М&lt;/span&gt;&lt;/a&gt;М&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/macro-accuracy.html\"&gt;Макро-точность&lt;/a&gt; — Модель сапасын бағалау метрикасы, мұнда әрбір тапсырмаға ондағы сұрақтар санына қарамастан тең салмақ беріледі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-maximum-suppression.html\"&gt;Максималды емес басу&lt;/a&gt; — Бір объект үшін бірнеше болжамды өшіріп, тек ең сенімді нұсқаны қалдыратын алгоритм.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/masshtabirovanie.html\"&gt;Масштабтау&lt;/a&gt; — Модель сапасының деректер көлемі мен есептеу қуатына тәуелділігі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/evidence-validated-longitudinal-update.html\"&gt;Метод EVLU&lt;/a&gt; — Модель болжамдарын жаңартуды сүзу әдісі, ол қате түзетулерді алып тастайды, бірақ деректерді талдаудың толықтығын төмендетеді.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-turn-attack.html\"&gt;Многоходовая атака&lt;/a&gt; — Жасанды интеллект агенттеріне қарсы кибершабуыл түрі, мұнда зиянды ниеттер қауіпсіздік сүзгілерін айналып өту үшін ұзақ әрекеттер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/audit-module.html\"&gt;модуль Audit&lt;/a&gt; — Тығыздықты есептеуге әсер етпестен желінің ішкі белгілерін сыныптар арналарына түрлендіретін COBICount-тағы көзбен шолып бақылаудың қосымша…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chain-of-thought-monitoring.html\"&gt;Мониторинг цепочек рассуждений&lt;/a&gt; — Жасанды интеллект қауіпсіздігін бақылау әдісі, мұнда модельдің күдікті мінез-құлқын анықтау үшін оның ойлау мәтіні талданады.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-agent-approach.html\"&gt;Мультиагентный подход&lt;/a&gt; — Жүйе архитектурасы, онда жеке агенттер (жоспарлаушы, саясат агенті, генератор) қалалық ортаға негізделген түзетулер енгізу үшін әрекеттерді…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodalnaya-model.html\"&gt;Мультимодальды модель&lt;/a&gt; — Мәтін мен кескін сияқты әртүрлі деректер түрлерін бір уақытта өңдеуге және салыстыруға қабілетті нейрондық желі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodal-large-language-models-mllm.html\"&gt;Мультимодальные языковые модели&lt;/a&gt; — Мәтіндік нұсқауларды түсіндіру және оларды оқиғалар тарихындағы визуалды деректермен байланыстыру құралы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soft-metrics.html\"&gt;Мягкие метрики&lt;/a&gt; — Тәуекелді бағалау үшін жинақталатын, бірақ маңызды әрекеттерге рұқсат беру үшін жеткілікті негіз болып табылмайтын модельдің өнімділік…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/or.html\"&gt;Мүмкіндіктер қатынасы&lt;/a&gt; — Бір топтағы оқиғаның ықтималдығы екіншісіне қарағанда қаншалықты жоғары немесе төмен екенін көрсететін көрсеткіш.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t1\"&gt;&lt;a href=\"reference/glossary.html#t1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т&lt;/span&gt;&lt;/a&gt;Т&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/word-targeting.html\"&gt;Таргетирование слов&lt;/a&gt; — Гранттық өтінім мәтінінен белгілі бір терминдерді алып тастау механизмі, бұл жобаны статистикалық тақырыптық санаттардан шығарып тастауға…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/signal-detection-theory.html\"&gt;Теория обнаружения сигналов&lt;/a&gt; — Субъектінің ақиқат және жалған мәлімдемелерді ажырату қабілетін бағалауға арналған статистикалық әдіс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recall.html\"&gt;Толықтық&lt;/a&gt; — Модельдің барлық тиісті жағдайларды (мысалы, барлық шабуылдарды) табу қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-execution-accuracy.html\"&gt;Точность выполнения команд&lt;/a&gt; — Модель жұмысының сапа көрсеткіші, компоненттер бойынша бағаланады: құралды таңдау, қосымша жалаушалар мен позициялық аргументтердің…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tranzaktsionnyy-remont.html\"&gt;Транзакциялық жөндеу&lt;/a&gt; — Инфографикадағы қателерді түзету әдісі, мұнда тәуелділіктер графы негізінде кескінді толық қайта жасамай-ақ, тек әсер етілген элементтер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/triggernaya-ataka.html\"&gt;Триггерлік шабуыл&lt;/a&gt; — Нейрондық желіге әсер ету әдісі, мұнда модель тек алдын ала белгіленген «кодтық сөз» немесе белгі қабылданғанда ғана белгілі бір жолмен…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pryamoy-effekt.html\"&gt;Тікелей әсер&lt;/a&gt; — Стандартты тесттер болжайтын нәрсе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/yakor-lichnosti.html\"&gt;Тұлға «зәкірі&lt;/a&gt; — AI диалогта кім екенін анықтайтын негізгі жүйелік нұсқаулық.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u\"&gt;&lt;a href=\"reference/glossary.html#u\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У&lt;/span&gt;&lt;/a&gt;У&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/guess-the-capital.html\"&gt;Угадай столицу&lt;/a&gt; — Модель логикасына жалған деректердің әсерін бағалаудың эксперименттік әдісі, мұнда ол нақтылау сұрақтарына берілген жауаптар негізінде…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polya-urn.html\"&gt;урна Пойи&lt;/a&gt; — Күшейту процестері теориясындағы стохастикалық модель; зерттеуде дереккөздердің көрінуінің жинақталуын және диалогта назарды басып алу…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attack-success-rate.html\"&gt;Уровень успешности атак&lt;/a&gt; — Жүйеге жасалған сәтті шабуылдардың үлесін көрсететін қорғаныс тиімділігінің метрикасы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c1\"&gt;&lt;a href=\"reference/glossary.html#c1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ц&lt;/span&gt;&lt;/a&gt;Ц&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/observation-editing-verification-loop.html\"&gt;Цикл «наблюдение–редактирование–верификация»&lt;/a&gt; — Агент деректерді талдайтын, көріністің бағдарламалық кодын түзететін және нәтижелерді рендеринг пен геометриялық сынақтар арқылы тексеретін…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/observe-edit-verify-cycle.html\"&gt;Цикл «наблюдение-редактирование-проверка»&lt;/a&gt; — Агент деректерді талдайтын, көріністің бағдарламалық кодын түзететін және физикалық сенімділікті қамтамасыз ету үшін геометриялық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/digital-trace-data.html\"&gt;Цифровые следы&lt;/a&gt; — Құрылғыларда тіркелетін пайдаланушының желідегі белсенділігі туралы объективті деректер.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ch\"&gt;&lt;a href=\"reference/glossary.html#ch\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ч&lt;/span&gt;&lt;/a&gt;Ч&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/fail-rate.html\"&gt;Частота неудач&lt;/a&gt; — Модель жауаптары 2 және одан жоғары балл алған сценарийлердің үлесін көрсететін тестілеудің негізгі көрсеткіші.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chekpoint.html\"&gt;Чекпоинт&lt;/a&gt; — Валидациялық жиынтықта ең жақсы нәтиже көрсеткен және түпкілікті тестілеу үшін сақталған нейрондық желінің күйі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensitivity.html\"&gt;Чувствительность&lt;/a&gt; — Сигнал мен шуды ажырату қабілетінің 0-ден 1-ге дейінгі көрсеткіші.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i2\"&gt;&lt;a href=\"reference/glossary.html#i2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;І&lt;/span&gt;&lt;/a&gt;І&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/trace.html\"&gt;Із»&lt;/a&gt; — Модель өз пайымдауларын «есте сақтау» үшін мәтінде қалдыратын аралық жазбалар.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kh\"&gt;&lt;a href=\"reference/glossary.html#kh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қ&lt;/span&gt;&lt;/a&gt;Қ&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/rejectors.html\"&gt;Қабылдамаушылар&lt;/a&gt; — Ескертпелерді пайдаланушылар бағалауына жібермес бұрын олардың сапасын тексеретін алгоритмдер.&lt;/
