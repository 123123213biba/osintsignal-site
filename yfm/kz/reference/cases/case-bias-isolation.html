        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кейстер: құралдар мен әдістер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Қайталанатын фондық құрылымдар мен шулардан (жолдар, тұрақ торлары) туындайтын жауаптарды басуға арналған COBICount архитектурасының кезеңі мен модулі.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/cases/case-bias-isolation.jpg\" alt=\"подавление фона\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Құрал&lt;/td&gt;\n&lt;td&gt;Модуль подавления фона в архитектуре COBICount&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Міндет&lt;/td&gt;\n&lt;td&gt;Устранение ложных откликов от повторяющихся фоновых структур&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Деректер&lt;/td&gt;\n&lt;td&gt;Спутниковые снимки высокого разрешения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Нәтиже&lt;/td&gt;\n&lt;td&gt;Повышение точности подсчета объектов без дообучения нейросети&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/bias-isolation.html\"&gt;подавление фона&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"mindet\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#mindet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Міндет&lt;/span&gt;&lt;/a&gt;Міндет&lt;/h2&gt;\n&lt;p&gt;Жерсерік суреттерін талдау кезінде (мысалы, кемелерді немесе ғимараттарды санау кезінде) зерттеушілер «шу» мәселесіне тап болады. Жол тораптары, автотұрақтар немесе жүйелі құрылыстар сияқты қайталанатын құрылымдар нейрондық желілерде жалған жауаптар тудырады. Бұл фондық элементтер визуалды сипаттамалары бойынша көбінесе нысаналы объектілерге ұқсайды, бұл автоматты санау дәлдігін төмендетеді.&lt;/p&gt;\n&lt;h2 id=\"khural-nemese-aedis\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#khural-nemese-aedis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Құрал немесе әдіс&lt;/span&gt;&lt;/a&gt;Құрал немесе әдіс&lt;/h2&gt;\n&lt;p&gt;Фонды басу (background suppression) — бұл кескіндегі статикалық, қайталанатын ландшафт элементтерінен келетін сигналдарды сүзу немесе әлсірету процесі. COBICount архитектурасында бұл әдіс өңдеу кезеңі болып табылады, ол модель объектілерді жіктеуді немесе санауды бастамас бұрын маңызды объектілерді жүйелі фоннан бөліп алады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-kholdanyldy\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#khalaj-kholdanyldy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай қолданылды&lt;/span&gt;&lt;/a&gt;Қалай қолданылды&lt;/h2&gt;\n&lt;p&gt;Нейрондық желілерді қайта оқытпастан объектілерді санау бойынша зерттеу аясында фонды басу әдісі COBICount архитектурасының модулі ретінде енгізілді. Негізгі идея әрбір жаңа аймақ үшін модельді қайта оқыту қажеттілігін жою болып табылады. Оның орнына жүйе кескіннің статистикалық сипаттамаларын талдайды, нысаналы объектілер болып табылмайтын қайталанатын өрнектерді анықтайды және олардың түпкілікті нәтижеге әсерін басады.&lt;/p&gt;\n&lt;h2 id=\"naetizhe\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#naetizhe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтиже&lt;/span&gt;&lt;/a&gt;Нәтиже&lt;/h2&gt;\n&lt;p&gt;Фонды басу модулін қолдану нейрондық желіні қымбат қайта оқытусыз жаңа аймақтарда объектілерді анықтау дәлдігін арттыруға мүмкіндік берді. Жүйе құрылыс тығыздығы әртүрлі географиялық орындар өзгерген кезде де тұрақты санау көрсеткіштерін сақтау қабілетін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"shekteuler\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h2&gt;\n&lt;p&gt;Фонды басу әдісі жүйелі құрылымдар үшін тиімді, бірақ оның дәлдігі визуалды түрде фонмен дерлік бірдей немесе ішінара жабылған объектілермен жұмыс істегенде төмендеуі мүмкін. Сондай-ақ, әдіс фондық өрнектерді дұрыс бөліп алу үшін кескіннің жеткілікті жоғары ажыратымдылығын талап етеді.&lt;/p&gt;\n&lt;h2 id=\"khalaj-khajtalau-kerek\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#khalaj-khajtalau-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай қайталау керек&lt;/span&gt;&lt;/a&gt;Қалай қайталау керек&lt;/h2&gt;\n&lt;p&gt;Әдісті жүзеге асыру үшін COBICount архитектурасын пайдалану қажет. Жоғары ажыратымдылықтағы жерсерік суреттерінің жиынтығы және кескіндерді өңдеу үшін есептеу қуаты талап етіледі. Процесс мыналарды қамтиды: 1) кескінді жүктеу, 2) фондық өрнектерді анықтау үшін статистикалық белгілерді талдау, 3) фонды басу сүзгісін қолдану, 4) объектілерді санау алгоритмін іске қосу.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/cases/case-bias-isolation.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9D%D0%B5%D0%B9%D1%82%D1%80%D0%B8%D0%BD%D0%BE\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Нейтрино — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:FirstNeutrinoEventAnnotated.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Argonne National Laboratory, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.4161/bact.1.2.15845\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Phage treatment of human infections&lt;/a&gt; — шолу, Bacteriophage 2011&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/23259671221104409\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Umbilical Cord-Derived Stem Cells for the Treatment of Knee Osteoarthritis: A Systematic Review&lt;/a&gt; — шолу, Orthop J Sports Med 2022&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/microorganisms11041040\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Overcoming the Limitations of CRISPR-Cas9 Systems in &lt;i&gt;Saccharomyces cerevisiae&lt;/i&gt;: Off-Target Effects, Epigenome, and Mitochondrial Editing&lt;/a&gt; — шолу, Microorganisms 2023&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Кейстер: құралдар мен әдістер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Қайталанатын фондық құрылымдар мен шулардан (жолдар, тұрақ торлары) туындайтын жауаптарды басуға арналған COBICount архитектурасының кезеңі мен модулі."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"подавление фона","description":"Қайталанатын фондық құрылымдар мен шулардан (жолдар, тұрақ торлары) туындайтын жауаптарды басуға арналған COBICount архитектурасының кезеңі мен модулі.","vcsPath":"reference/cases/case-bias-isolation.md"},"headings":[{"title":"Міндет","href":"reference/cases/case-bias-isolation.html#mindet","level":2},{"title":"Құрал немесе әдіс","href":"reference/cases/case-bias-isolation.html#khural-nemese-aedis","level":2},{"title":"Қалай қолданылды","href":"reference/cases/case-bias-isolation.html#khalaj-kholdanyldy","level":2},{"title":"Нәтиже","href":"reference/cases/case-bias-isolation.html#naetizhe","level":2},{"title":"Шектеулер","href":"reference/cases/case-bias-isolation.html#shekteuler","level":2},{"title":"Қалай қайталау керек","href":"reference/cases/case-bias-isolation.html#khalaj-khajtalau-kerek","level":2},{"title":"Дереккөздер","href":"reference/cases/case-bias-isolation.html#derekkoezder","level":2}],"title":"подавление фона"},"router":{"pathname":"reference/cases/case-bias-isolation","depth":3,"base":"../../"
