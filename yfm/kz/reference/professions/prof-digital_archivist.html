        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кәсіптер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;сохраняет страницы и данные, чтобы доказательства не исчезли&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-digital_archivist.jpg\" alt=\"Цифровой архивист\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Немен айналысады&lt;/td&gt;\n&lt;td&gt;сохраняет страницы и данные, чтобы доказательства не исчезли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не білу керек&lt;/td&gt;\n&lt;td&gt;веб-архивы, WARC, цепочка хранения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Білім&lt;/td&gt;\n&lt;td&gt;Историко-архивное образование в сочетании с навыками работы с базами данных и ИИ.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қайда жұмыс істейді&lt;/td&gt;\n&lt;td&gt;НИИ, государственные структуры, OSINT-организации, архивы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-data.html\"&gt;Ашық деректер&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Әдістер және этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"ne-istejdi\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#ne-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Не істейді&lt;/span&gt;&lt;/a&gt;Не істейді&lt;/h2&gt;\n&lt;p&gt;Цифрлық мұрағатшы — деректерді кейіннен тексеру және талдау үшін олардың сақталуы мен тұтастығын қамтамасыз ететін маман. Дәстүрлі мұрағатшыдан айырмашылығы, цифрлық мұрағатшы электронды нысандардың өмірлік циклін басқарады: желіде тіркеуден бастап ұзақ мерзімді қолжетімділікті қамтамасыз етуге дейін. Маманның негізгі функциясы — ақпаратты жойылудан немесе өзгертілуден қорғайтын дәлелдемелік базаны құру.&lt;/p&gt;\n&lt;h2 id=\"tiptik-mindetter\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#tiptik-mindetter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типтік міндеттер&lt;/span&gt;&lt;/a&gt;Типтік міндеттер&lt;/h2&gt;\n&lt;p&gt;Жұмыс іздеу, жинау, сақтау және тексеру хаттамаларына негізделеді. Күнделікті міндеттерге веб-беттерді түсіру, метадеректерді тіркеу және хэштеу арқылы файлдардың өзгермеуін қамтамасыз ету кіреді. Маман ақпаратты жасыру әрекеттерін анықтау үшін жарияланымдардағы өзгерістерді қадағалайды.&lt;/p&gt;\n&lt;h2 id=\"daghdylar-men-khuraldar\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#daghdylar-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дағдылар мен құралдар&lt;/span&gt;&lt;/a&gt;Дағдылар мен құралдар&lt;/h2&gt;\n&lt;p&gt;Негізгі дағды — цифрлық нысандарды тексеру әдістерін меңгеру және сақтау тізбегін (chain of custody) түсіну. Мамандар веб-контентті сақтау үшін WARC форматтарын пайдаланады. Сондай-ақ, мәтіндерден жасырын параметрлерді бөліп алу үшін тілдік модельдер негізіндегі алгоритмдерді қолдану маңызды.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-kerek\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#khaj-zherde-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу керек&lt;/h2&gt;\n&lt;p&gt;Дайындық классикалық мұрағат ісі мен тарихқа, заманауи IT-құзыреттермен толықтырылған негізделеді. Тарихи-мұрағаттық білім жіктеу және сақтау қағидаттарын түсінуге мүмкіндік береді. Техникалық бөлігі деректер базасымен және машиналық оқыту алгоритмдерімен жұмыс істеу арқылы меңгеріледі.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-zhumys-isteu-zhaene-khalaj-oesu\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#khaj-zherde-zhumys-isteu-zhaene-khalaj-oesu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде жұмыс істеу және қалай өсу&lt;/span&gt;&lt;/a&gt;Қай жерде жұмыс істеу және қалай өсу&lt;/h2&gt;\n&lt;p&gt;Цифрлық мұрағатшылар ғылыми-зерттеу институттарында, ашық деректермен айналысатын мемлекеттік құрылымдарда және тергеу (OSINT) ұйымдарында сұранысқа ие. Мансаптық өсу деректерді жинаудан стратегияларды әзірлеуге көшуді көздейді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/professions/prof-digital_archivist.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%91%D0%B0%D1%82%D0%B0%D0%BB%D0%B8%D0%BD%2C_%D0%92%D0%B8%D0%BA%D1%82%D0%BE%D1%80_%D0%9D%D0%B8%D0%BA%D0%BE%D0%BB%D0%B0%D0%B5%D0%B2%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Баталин, Виктор Николаевич — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Victor_Batalin_02.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: GalinaMalysheva222, CC BY-SA 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Кәсіптер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"сохраняет страницы и данные, чтобы доказательства не исчезли"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Цифровой архивист","description":"сохраняет страницы и данные, чтобы доказательства не исчезли","vcsPath":"reference/professions/prof-digital_archivist.md"},"headings":[{"title":"Не істейді","href":"reference/professions/prof-digital_archivist.html#ne-istejdi","level":2},{"title":"Типтік міндеттер","href":"reference/professions/prof-digital_archivist.html#tiptik-mindetter","level":2},{"title":"Дағдылар мен құралдар","href":"reference/professions/prof-digital_archivist.html#daghdylar-men-khuraldar","level":2},{"title":"Қай жерде оқу керек","href":"reference/professions/prof-digital_archivist.html#khaj-zherde-okhu-kerek","level":2},{"title":"Қай жерде жұмыс істеу және қалай өсу","href":"reference/professions/prof-digital_archivist.html#khaj-zherde-zhumys-isteu-zhaene-khalaj-oesu","level":2},{"title":"Дереккөздер","href":"reference/professions/prof-digital_archivist.html#derekkoezder","level":2}],"title":"Цифровой архивист"},"router":{"pathname":"reference/professions/prof-digital_archivist","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
