        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кәсіптер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;проверяет утверждения, цитаты, фото и видео перед публикацией&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Немен айналысады&lt;/td&gt;\n&lt;td&gt;проверяет утверждения, цитаты, фото и видео перед публикацией&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не білу керек&lt;/td&gt;\n&lt;td&gt;поиск источников, обратный поиск изображений, критическое мышление&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Білім&lt;/td&gt;\n&lt;td&gt;Журналистика, IT, библиотечное дело или аналитика; обучение через протоколы верификации и тренинги.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қайда жұмыс істейді&lt;/td&gt;\n&lt;td&gt;Редакции СМИ, аналитические центры, научные проекты, государственные структуры мониторинга информации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-verify.html\"&gt;Фактілер мен медианы тексеру&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"ne-istejdi\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#ne-istejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Не істейді&lt;/span&gt;&lt;/a&gt;Не істейді&lt;/h2&gt;\n&lt;p&gt;Фактчекер — хабарламалардың, мәлімдемелердің және медиа контенттің нақты дәлдігін тексеретін маман. Бұл кәсіп жарияланымға дейін қателерді, манипуляцияларды немесе жалған ақпаратты анықтауға бағытталған деректерді сыни талдау процесі болып табылады. Автоматтандырылған жүйелерден айырмашылығы, фактчекер бастапқы дереккөздерді іздеуді, метадеректерді талдауды және мазмұнды логикалық бағалауды қамтитын тексеру әдіснамасын қолданады.&lt;/p&gt;\n&lt;h2 id=\"tiptik-mindetter\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#tiptik-mindetter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типтік міндеттер&lt;/span&gt;&lt;/a&gt;Типтік міндеттер&lt;/h2&gt;\n&lt;p&gt;Фактчекердің негізгі міндеті — мәлімдемелердің ақиқаттығын анықтау. Күнделікті тәжірибеге мыналар кіреді: ақпараттың бастапқы дереккөздерін іздеу, кескіндердің шығу тегін анықтау үшін кері іздеу жүргізу, цифрлық объектілердің метадеректерін тексеру және ашық тізілімдердегі деректермен салыстыру. Фактчекер мәтіндердің логикалық байланысын талдайды, алгоритмдік таңдаулардағы бейтарапсыздықты анықтайды және визуалды элементтерді деректер жиынтығымен байланыстыра отырып, инфографиканы тексереді.&lt;/p&gt;\n&lt;h2 id=\"daghdylar-men-khuraldar\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#daghdylar-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дағдылар мен құралдар&lt;/span&gt;&lt;/a&gt;Дағдылар мен құралдар&lt;/h2&gt;\n&lt;p&gt;Жұмыс ашықтық пен тексерілу қағидаттарына негізделген. Негізгі дағдыларға OSINT әдістерін меңгеру, цифрлық іздермен жұмыс істеу және когнитивтік бұрмалауларды түсіну жатады. Құралдар жиынтығына іздеу жүйелері, кері іздеу қызметтері, файлдардың метадеректерін талдау құралдары және деректерді тексеруге арналған мамандандырылған фреймворктар кіреді.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-kerek\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#khaj-zherde-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу керек&lt;/h2&gt;\n&lt;p&gt;Фактчекердің кәсіби даярлығы пәнаралық тәсілге негізделген. Базалық білім әдетте журналистика, кітапхана ісі, ақпараттық технологиялар немесе аналитикалық пәндерді қамтиды. Фактілерді тексеру әдістерін оқыту тексеру хаттамалары (мысалы, Беркли хаттамасы) және цифрлық қауіпсіздік бойынша тренингтер арқылы жүзеге асады.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-zhumys-isteu-zhaene-khalaj-oesu\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#khaj-zherde-zhumys-isteu-zhaene-khalaj-oesu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде жұмыс істеу және қалай өсу&lt;/span&gt;&lt;/a&gt;Қай жерде жұмыс істеу және қалай өсу&lt;/h2&gt;\n&lt;p&gt;Фактчекерлер БАҚ редакцияларында, ғылыми-көпшілік жобаларда, аналитикалық орталықтарда және ақпаратты мониторингтеумен айналысатын мемлекеттік құрылымдарда сұранысқа ие. Мансаптық өсу жалпы жаңалықтарды тексеруден бастап күрделі ғылыми деректерді, спутниктік суреттерді немесе желілік құрылымдарды талдауға дейінгі мамандануды көздейді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B0%D0%BA%D1%82%D1%87%D0%B5%D0%BA%D0%B8%D0%BD%D0%B3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Фактчекинг — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/ijerph18158091\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;COVID-19 Misinformation Online and Health Literacy: A Brief Overview&lt;/a&gt; — шолу, Int J Environ Res Public Health 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/1529100620946707\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Citizens Versus the Internet: Confronting Digital Challenges With Cognitive Tools&lt;/a&gt; — шолу, Psychol Sci Public Interest 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/bjh.14757\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Serological weak D phenotypes: a review and guidance for interpreting the RhD blood type using the RHD genotype&lt;/a&gt; — шолу, Br J Haematol 2017&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Кәсіптер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"проверяет утверждения, цитаты, фото и видео перед публикацией"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Фактчекер","description":"проверяет утверждения, цитаты, фото и видео перед публикацией","vcsPath":"reference/professions/prof-fact_checker.md"},"headings":[{"title":"Не істейді","href":"reference/professions/prof-fact_checker.html#ne-istejdi","level":2},{"title":"Типтік міндеттер","href":"reference/professions/prof-fact_checker.html#tiptik-mindetter","level":2},{"title":"Дағдылар мен құралдар","href":"reference/professions/prof-fact_checker.html#daghdylar-men-khuraldar","level":2},{"title":"Қай жерде оқу керек","href":"reference/professions/prof-fact_checker.html#khaj-zherde-okhu-kerek","level":2},{"title":"Қай жерде жұмыс істеу және қалай өсу","href":"reference/professions/prof-fact_checker.html#khaj-zherde-zhumys-isteu-zhaene-khalaj-oesu","level":2},{"title":"Дереккөздер","href":"reference/professions/prof-fact_checker.html#derekkoezder","level":2}],"title":"Фактчекер"},"router":{"pathname":"reference/professions/prof-fact_checker","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
