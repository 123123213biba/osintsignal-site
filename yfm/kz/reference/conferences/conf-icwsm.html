        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;AAAI: веб и социальные медиа — сети и дезинформация&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-icwsm.jpg\" alt=\"ICWSM\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;AAAI: веб и социальные медиа — сети и дезинформация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;статьи в открытом доступе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;AAAI (Association for the Advancement of Artificial Intelligence)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научная конференция с рецензируемыми публикациями&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальный сайт AAAI&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-nets.html\"&gt;Ақпараттық науқандар және желілер&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Әдістер және этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"konferenciya-turaly\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#konferenciya-turaly\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конференция туралы&lt;/span&gt;&lt;/a&gt;Конференция туралы&lt;/h2&gt;\n&lt;p&gt;ICWSM (International Conference on Web and Social Media) — әлеуметтік медиа мен веб-технологияларды деректерді талдау, желілік ғылым және компьютерлік ғылымдар арқылы зерттеуге арналған жыл сайынғы ғылыми конференция. Конференция әлеуметтік процестерді сандық бағалау, ақпараттың таралу заңдылықтарын анықтау және цифрлық ортадағы деректердің сенімділігін тексеру әдістерін алмасу алаңы болып табылады.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Конференция AAAI (Association for the Advancement of Artificial Intelligence) қолдауымен өткізіледі. Бұл жасанды интеллект саласындағы зерттеу стандарттарын белгілейтін халықаралық ғылыми қоғамдастық. ICWSM онлайн қауымдастықтарды зерттеу үшін әдіснамалық базаны қалыптастыру мақсатында әлеуметтанушылар, компьютерлік лингвистер және деректер талдаушыларын біріктіру үшін құрылған.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференция бағдарламасы келесі бағыттарды қамтиды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Әлеуметтік желілерді талдау: байланыстар құрылымы мен көп қабатты желілер динамикасын зерттеу.&lt;/li&gt;\n&lt;li&gt;Дезинформация және фактчекинг: деректердегі бұрмалауларды анықтау және әлеуметтік платформалардың шындықты қабылдауға әсерін талдау алгоритмдерін әзірлеу.&lt;/li&gt;\n&lt;li&gt;Деректерді жинау әдіснамасы: ретсіз посттардан құрылымдалған ақпаратты алу құралдарын жасау.&lt;/li&gt;\n&lt;li&gt;Этика және бейтараптық: пайдаланушы деректерімен жұмыс істеудегі этикалық шекаралар мен әдіснамалық қателіктерді азайту.&lt;/li&gt;\n&lt;li&gt;Медиадағы жасанды интеллект: нейрондық желілердің жұмысын, соның ішінде олардың «рөлдік ойын» және жауаптардағы жасырын дезинформация мәселелерін бағалау.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-usynylady\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#onda-ne-usynylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не ұсынылады&lt;/span&gt;&lt;/a&gt;Онда не ұсынылады&lt;/h2&gt;\n&lt;p&gt;ICWSM конференциясында деректерді талдауға деген көзқарасты өзгертетін зерттеу нәтижелері алғаш рет көрсетіледі. Соңғы жылдары назар мыналарға аударылды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Нейрондық желі архитектураларының тиімділігі: жадты оңтайландыру әдістері және ықшам модельдерге арналған мамандандырылған агенттік қаңқалар.&lt;/li&gt;\n&lt;li&gt;OSINT автоматтандыру: желілік дереккөздерден адам деңгейіндегі дәлдікпен деректер базасын құру алгоритмдері.&lt;/li&gt;\n&lt;li&gt;Киберқауіпсіздік: трафик пен қауіпсіздік саясатын талдауға арналған SecJev сияқты жаңа модельдер.&lt;/li&gt;\n&lt;li&gt;Әлеуметтік желілердің әсерін сыни бағалау: платформалар арқылы шындықты толық бұрмалау туралы мифтерді жоққа шығаратын ғылыми деректер.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференция материалдары ашық қолжетімділікте жарияланады. Зерттеушілер мен практиктер үшін келесілер қолжетімді:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тезистер мен мақалалар мәтіндері: барлық қабылданған жұмыстар қатаң рецензиядан өтеді және AAAI мұрағаттарында жарияланады.&lt;/li&gt;\n&lt;li&gt;Баяндамалар жазбалары: авторлардың әдіснамасымен танысуға мүмкіндік береді.&lt;/li&gt;\n&lt;li&gt;Қатысу: конференция ғылыми қатаңдық пен деректер этикасы стандарттарына сәйкес келетін түпнұсқа зерттеулерді жариялау үшін өтінімдер қабылдауға ашық.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-icwsm.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A0%D0%98%D0%90_%D0%9D%D0%BE%D0%B2%D0%BE%D1%81%D1%82%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;РИА Новости — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Archive.today_Screenshot_-_12.19.2024.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Archive.today developers, Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.physrep.2014.07.001\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;The structure and dynamics of multilayer networks&lt;/a&gt; — шолу, Phys Rep 2014&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fdata.2019.00013\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Social Data: Biases, Methodological Pitfalls, and Ethical Boundaries&lt;/a&gt; — шолу, Front Big Data 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/s22124531\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A Review on the Trends in Event Detection by Analyzing Social Media Platforms' Data&lt;/a&gt; — шолу, Sensors (Basel) 2022&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"AAAI: веб и социальные медиа — сети и дезинформация"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ICWSM","description":"AAAI: веб и социальные медиа — сети и дезинформация","vcsPath":"reference/conferences/conf-icwsm.md"},"headings":[{"title":"Конференция туралы","href":"reference/conferences/conf-icwsm.html#konferenciya-turaly","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-icwsm.
