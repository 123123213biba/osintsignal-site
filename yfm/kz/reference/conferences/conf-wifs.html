        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;информационная криминалистика: проверка изображений и медиа&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;информационная криминалистика: проверка изображений и медиа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-verify.html\"&gt;Фактілер мен медианы тексеру&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;IEEE WIFS (Ақпараттық криминалистика және қауіпсіздік бойынша семинар) — ақпараттық қауіпсіздік пен цифрлық криминалистика мәселелеріне арналған жыл сайынғы халықаралық ғылыми конференция. Іс-шараның негізгі мақсаты — сигналдарды өңдеу, машиналық оқыту және деректерді қорғау саласындағы зерттеушілерді біріктіру. ОСИНТ-Сигнал контекстінде WIFS медиаконтентті тексеру әдістерінің негізгі көзі болып табылады: кескіндердегі манипуляцияларды анықтаудан бастап бейнежазбалардың түпнұсқалығын талдауға дейін.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-men-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#ujymdastyrushylar-men-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар мен тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар мен тарихы&lt;/h2&gt;\n&lt;p&gt;Конференция әлемдегі ең ірі техникалық мамандар қауымдастығы — IEEE (Institute of Electrical and Electronics Engineers) қамқорлығымен өткізіледі. WIFS IEEE Information Forensics and Security (IFS-TC) техникалық комитетімен бақыланады. Конференция тарихы он жылдан астам уақытты қамтиды, бұл уақыт ішінде ол нақты деректерді генерацияланған немесе бұрмаланған деректерден қалай ажырату керектігін талқылайтын басты алаңға айналды.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;WIFS жұмысының негізгі бағыттары:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Цифрлық криминалистика: өңдеу іздерін анықтау, метадеректерді талдау және медиафайлдың қайнар көзін анықтау.&lt;/li&gt;\n&lt;li&gt;Машиналық оқыту қауіпсіздігі: модельдерді қарсыластық шабуылдардан қорғау және синтетикалық деректерде оқыту кезінде нейрондық желілердің деградациясын болдырмау.&lt;/li&gt;\n&lt;li&gt;Стеганография және деректерді жасырын тасымалдау: медиаконтенттегі жасырын хабарламаларды анықтау әдістері.&lt;/li&gt;\n&lt;li&gt;Биометрия және құпиялылықты қорғау: қауіпсіздік талаптарын ескере отырып, жеке тұлғаны сәйкестендіру әдістері.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;WIFS-те фактілерді тексеру құралдары үшін негіз болатын зерттеулер ұсынылады. Мысалы, инфографиканың әрбір элементі нақты деректер арқылы тексерілуі керек жағдайларда жасанды интеллекттің «галлюцинацияларына» қарсы күрес әдістері талқыланады. Сондай-ақ, 3D-модельдермен және үй-жайлардың скандарымен жұмыс істеу алгоритмдері қарастырылады, мұнда нақты физикалық нысандарды жасанды интеллект агенттері жасаған нысандардан ажырату маңызды.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер мен талдаушылар үшін WIFS-ке қатысу — озық алгоритмдерді олар жаппай құралға айналмай тұрып қолдану мүмкіндігі. Нәтижелерді IEEE Xplore кітапханасындағы материалдар арқылы бақылауға болады. Қатысушылар көбінесе тек теориялық еңбектерді ғана емес, сонымен қатар автоматтандырылған медиа тексеру жүйелерін әзірлеу үшін қолданылуы мүмкін бағдарламалық шешімдерді де ұсынады.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;WIFS негізінде «ақпараттық криминалистика» қағидасы жатыр. Бұл аномалияларды іздеу үшін сигналдарды өңдеудің математикалық әдістері қолданылатын сала. Негізгі түсінік — деректерді ұсыну дәлдігі. Мысалы, нейрондық желілерде төмен дәлдіктегі форматтарды (half-precision, 16 бит) пайдалану кескіндерді өңдеуді жылдамдатады, бірақ криминалистикалық талдау үшін маңызды бөлшектердің жоғалуына жол бермеу үшін қатаң бақылау әдістерін талап етеді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Half-precision_floating-point_format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Half-precision floating-point format — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"информационная криминалистика: проверка изображений и медиа"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IEEE WIFS","description":"информационная криминалистика: проверка изображений и медиа","vcsPath":"reference/conferences/conf-wifs.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-wifs.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар мен тарихы","href":"reference/conferences/conf-wifs.html#ujymdastyrushylar-men-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-wifs.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-wifs.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-wifs.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Теория","href":"reference/conferences/conf-wifs.html#teoriya","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-wifs.html#derekkoezder","level":2}],"title":"IEEE WIFS"},"router":{"pathname":"reference/conferences/conf-wifs","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
