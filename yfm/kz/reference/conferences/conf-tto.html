        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;доверие и дезинформация&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/conferences/conf-tto.jpg\" alt=\"Truth and Trust Online\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;доверие и дезинформация&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;статьи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;Академиялық қоғамдастық және сарапшылар тобы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Жыл сайын&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Ғылыми конференция, баяндамалар мен секциялар&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;truthandtrustonline.com&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-nets.html\"&gt;Ақпараттық науқандар және желілер&lt;/a&gt;, &lt;a href=\"concepts/spec-verify.html\"&gt;Фактілер мен медианы тексеру&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;Truth and Trust Online (TTO) — дезинформация, цифрлық контентке деген сенім және онлайн-ортаның қауіпсіздігі мәселелерін зерттеуге арналған жыл сайынғы ғылыми конференция. Іс-шара зерттеушілерді, инженерлерді және фактчекинг мамандарын интернеттегі манипуляциялармен күресу әдістерін талқылау үшін біріктіреді.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Конференция академиялық қоғамдастық пен ақпараттың шынайылығымен жұмыс істейтін практиктер арасында білім алмасу алаңы ретінде құрылды. Ұйымдастырушылар нейрондық желілердегі алгоритмдік қателіктерді ғана емес, әлеуметтік желілердің шындықты қабылдауға әсерін талқылауға ұмтылады.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференцияның негізгі тақырыптары мыналарды қамтиды:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Нейрондық желілер механикасы: модельдерді оқыту мен олардың еркін режимдегі мінез-құлқы арасындағы алшақтықты талдау.&lt;/li&gt;\n&lt;li&gt;Фактчекинг және визуалды деректер: тексерілетін инфографика жасау үшін InfoAgent сияқты құралдарды әзірлеу.&lt;/li&gt;\n&lt;li&gt;Идеялар эволюциясы: Drift Inspector сияқты құралдар арқылы ғылыми әдебиеттердегі трендтерді бақылау.&lt;/li&gt;\n&lt;li&gt;Жасанды интеллектті басқару: ережелердің жаһандық архитекторы туралы мифтер және технологияларды реттеудің орталықтандырылмаған тәсілдері.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"onda-ne-usynylady\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#onda-ne-usynylady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не ұсынылады&lt;/span&gt;&lt;/a&gt;Онда не ұсынылады&lt;/h2&gt;\n&lt;p&gt;Конференцияда цифрлық қауіпсіздік туралы түсінікті өзгертетін зерттеу нәтижелері көрсетіледі. Қатысушылар контент элементтерін тексерілетін деректермен байланыстыратын жаңа фреймворктарды және нейрондық желілердің мінез-құлқын түсінуге көмектесетін талдау әдістерін ұсынады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференция нәтижелерін баяндама тезистері мен сөз сөйлеу жазбалары арқылы бақылауға болады. Қатысу зерттеу нәтижелерімен баяндама жасауға өтінім беруді немесе тыңдаушы ретінде қатысуды көздейді.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-tto.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A8%D0%B2%D0%B8%D0%BC%D0%BC%D0%B5%D1%80%2C_%D0%94%D1%8D%D0%B2%D0%B8%D0%B4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Швиммер, Дэвид — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:David_Schwimmer_2011.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Philippe Berdalle, CC BY-SA 2.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"доверие и дезинформация"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Truth and Trust Online","description":"доверие и дезинформация","vcsPath":"reference/conferences/conf-tto.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-tto.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-tto.htm
