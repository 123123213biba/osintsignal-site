        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференциялар&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;дистанционное зондирование Земли&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;дистанционное зондирование Земли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Не аламыз&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ұйымдастырушы&lt;/td&gt;\n&lt;td&gt;IEEE Geoscience and Remote Sensing Society (GRSS)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Мерзімділік&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Международная научная конференция с рецензируемыми тезисами&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальный портал IEEE GRSS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-geo.html\"&gt;Спутниктер және геодеректер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"bul-khandaj-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#bul-khandaj-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бұл қандай конференция&lt;/span&gt;&lt;/a&gt;Бұл қандай конференция&lt;/h2&gt;\n&lt;p&gt;IEEE IGARSS (International Geoscience and Remote Sensing Symposium) — Жерді қашықтықтан зондтау әдістері мен геосфера ғылымдарына арналған жыл сайынғы халықаралық ғылыми конференция. Конференция зерттеушілер, инженерлер және деректерді талдау мамандары арасындағы білім алмасу процесі болып табылады. Ол электромагниттік сәулеленудің планета бетіндегі нысандармен өзара әрекеттесуінің физикалық негіздерін және алынған сигналдарды өңдеу әдістерін талқылау алаңы ретінде қызмет етеді.&lt;/p&gt;\n&lt;h2 id=\"ujymdastyrushylar-zhaene-tarihy\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#ujymdastyrushylar-zhaene-tarihy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ұйымдастырушылар және тарихы&lt;/span&gt;&lt;/a&gt;Ұйымдастырушылар және тарихы&lt;/h2&gt;\n&lt;p&gt;Ұйымдастырушысы — IEEE Geoscience and Remote Sensing Society (GRSS). Конференция 1981 жылдан бері жыл сайын өткізіліп, әлемнің түкпір-түкпірінен мыңдаған қатысушыны жинайды. Іс-шара атмосфера физикасы мен радиофизиканың іргелі қағидаттарына сүйенеді.&lt;/p&gt;\n&lt;h2 id=\"takhyryptar-men-sekciyalar\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#takhyryptar-men-sekciyalar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тақырыптар мен секциялар&lt;/span&gt;&lt;/a&gt;Тақырыптар мен секциялар&lt;/h2&gt;\n&lt;p&gt;Конференция бағдарламасы спутниктік жабдықтарды әзірлеуден бастап машиналық оқыту алгоритмдеріне дейінгі кең ауқымды қамтиды. Негізгі секциялар: кескіндерді өңдеу әдістері, геодеректердегі жасанды интеллект, қашықтықтан зондтау физикасы және қоршаған ортаны мониторингтеу.&lt;/p&gt;\n&lt;h2 id=\"onda-ne-pajda-bolady\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#onda-ne-pajda-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Онда не пайда болады&lt;/span&gt;&lt;/a&gt;Онда не пайда болады&lt;/h2&gt;\n&lt;p&gt;IEEE IGARSS-те деректермен жұмыс істеу тәсілін өзгертетін зерттеу нәтижелері алғаш рет ұсынылады. Мысалы, нейрондық желілерді әрбір жаңа аймақ үшін қайта оқытпай-ақ, кемелерді немесе ғимараттарды тану әдістері талқыланады.&lt;/p&gt;\n&lt;h2 id=\"khalaj-bakhylaugha-zhaene-khatysugha-bolady\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қалай бақылауға және қатысуға болады&lt;/span&gt;&lt;/a&gt;Қалай бақылауға және қатысуға болады&lt;/h2&gt;\n&lt;p&gt;Конференцияға қатысу тезистерді жариялауды көздейді. Конференциядан кейін баяндама материалдары IEEE цифрлық кітапханаларында жарияланады. Өзекті зерттеулерді IEEE GRSS ресми порталы арқылы бақылауға болады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A2%D0%B0%D1%82%D0%B0%D1%80%D1%81%D0%BA%D0%B8%D0%B9%2C_%D0%92%D0%B0%D0%BB%D0%B5%D1%80%D1%8C%D1%8F%D0%BD_%D0%98%D0%BB%D1%8C%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Татарский, Валерьян Ильич — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференциялар&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"дистанционное зондирование Земли"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IEEE IGARSS","description":"дистанционное зондирование Земли","vcsPath":"reference/conferences/conf-igarss.md"},"headings":[{"title":"Бұл қандай конференция","href":"reference/conferences/conf-igarss.html#bul-khandaj-konferenciya","level":2},{"title":"Ұйымдастырушылар және тарихы","href":"reference/conferences/conf-igarss.html#ujymdastyrushylar-zhaene-tarihy","level":2},{"title":"Тақырыптар мен секциялар","href":"reference/conferences/conf-igarss.html#takhyryptar-men-sekciyalar","level":2},{"title":"Онда не пайда болады","href":"reference/conferences/conf-igarss.html#onda-ne-pajda-bolady","level":2},{"title":"Қалай бақылауға және қатысуға болады","href":"reference/conferences/conf-igarss.html#khalaj-bakhylaugha-zhaene-khatysugha-bolady","level":2},{"title":"Дереккөздер","href":"reference/conferences/conf-igarss.html
