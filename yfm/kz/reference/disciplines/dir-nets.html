            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-nets.jpg\" alt=\"Ақпараттық науқандар және желілер\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Анализ информационных кампаний и сетевых структур&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;Междисциплинарное направление (социология, Data Science)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Сетевой анализ, OSINT, контент-анализ, аудит алгоритмов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Computer Science, Sociology, Media Studies&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-nets.html\"&gt;Ақпараттық науқандар және желілер&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"ne-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#ne-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Не зерттейді&lt;/span&gt;&lt;/a&gt;Не зерттейді&lt;/h2&gt;\n&lt;p&gt;Ақпараттық науқандар мен желілер — бұл цифрлық ортадағы нарративтерді құру, тарату және олардың әсерін зерттейтін ғылыми бағыт. Зерттеу нысаны — топтардың қоғамдық пікірді қалыптастыру немесе шындықты қабылдауды өзгерту үшін өз әрекеттерін қалай үйлестіретінін түсіндіретін механизмдер.&lt;/p&gt;\n&lt;h2 id=\"tarihy-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#tarihy-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Ақпараттық науқандар тарихи тұрғыдан мемлекеттік шаралар мен баспа насихатына сүйенді. Мысалы, КСРО-дағы 1929 жылғы «Арақ орнына кітап» плакаттары (40 000 дана). Цифрлық дәуірде назар әлеуметтік желілерге ауысты. Зерттеулер әлеуметтік желілердің шындықты бұрмалауға әсері жиі асыра бағаланатынын көрсетеді. Bluesky деректері бойынша, пайдаланушылар назарының 80%-ы жазылымдардан «екі қадам» қашықтықпен шектелген, бұл балама көзқарастарға қолжетімділікті шектейді.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Қазіргі тәсілдер контентті талдау және желілік құрылымдарды талдауға бөлінеді. Зерттеушілер нейрондық желі алгоритмдерінің қалай байқаусызда дезинформацияға ықпал ететінін зерттейді. Мысалы, нейрондық желілер жасырын қате деректерге сүйене отырып дұрыс жауап беруі немесе пайдаланушыға жағымпаздану тұзағына түсуі мүмкін екені анықталды.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Әдістерге желілік талдау (өзара әрекеттесу графтары), үлкен деректерді контенттік талдау және алгоритмдер аудиті жатады. Зерттеушілер ақпараттың таралу тізбегін бақылау үшін фактілерді тексеру (OSINT) әдістерін қолданады. Сандық нысандарды метадеректер арқылы тексеру жүйеде «бас сәулетшісіз» үйлестірілген әрекеттерді анықтауға көмектеседі.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Бұл бағыт графтар теориясымен, қабылдау психологиясымен, компьютерлік ғылымдармен (машиналық оқыту) және әлеуметтанумен тығыз байланысты. Ол контенттің вирустылығын зерттеумен және пайдаланушылардың өзара әрекеттесу ережелерін белгілейтін платформалар архитектурасымен қиылысады.&lt;/p&gt;\n&lt;h2 id=\"khajda-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#khajda-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қайда оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қайда оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Деректерді талдау (Data Science), қолданбалы әлеуметтану және медиа зерттеулері бағдарламалары қолайлы. Компьютерлік ғылымдар мен әлеуметтану саласындағы рецензияланатын журналдардағы мақалаларды, сондай-ақ әлеуметтік желілерді талдауға маманданған зертханалардың есептерін оқу ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%BD%D1%82%D0%B8%D0%B0%D0%BB%D0%BA%D0%BE%D0%B3%D0%BE%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5_%D0%BA%D0%B0%D0%BC%D0%BF%D0%B0%D0%BD%D0%B8%D0%B8_%D0%B2_%D0%A1%D0%A1%D0%A1%D0%A0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Антиалкогольные кампании в СССР — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wi
