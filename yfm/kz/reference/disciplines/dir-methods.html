            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Мамандықтар мен процестер&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Не туралы&lt;/td&gt;\n&lt;td&gt;Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сала&lt;/td&gt;\n&lt;td&gt;Научное направление: методы и этика открытых данных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Қалыптасуы&lt;/td&gt;\n&lt;td&gt;Развитие с 1997 года (алгоритмы поиска), 2008 (сетевой анализ), 2015 (глубокое обучение)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Негізгі әдістер&lt;/td&gt;\n&lt;td&gt;Эмпирическая верификация, сетевой анализ, предиктивный анализ (SSH), бенчмаркинг&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналдар&lt;/td&gt;\n&lt;td&gt;Nucleic Acids Research, BMC Bioinformatics, Nature (обзоры)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Мамандықтар: &lt;a href=\"concepts/spec-methods.html\"&gt;Әдістер және этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"neni-zerttejdi\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#neni-zerttejdi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нені зерттейді&lt;/span&gt;&lt;/a&gt;Нені зерттейді&lt;/h2&gt;\n&lt;p&gt;Әдістер мен этика — бұл ашық деректерді жинау, өңдеу және түсіндіру принциптерін, сондай-ақ автоматтандырылған жүйелер мен зерттеушілердің мінез-құлқын реттейтін моральдық нормаларды зерттейтін пәнаралық ғылыми бағыт. Зерттеу пәні — ақпаратты тексеру процестері, талдау нәтижелерінің қайталануы және адамның нейрожелілік агенттермен өзара әрекеттесуінің этикалық аспектілері.&lt;/p&gt;\n&lt;h2 id=\"tarihy-zhaene-negizgi-zhangalykhtar\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#tarihy-zhaene-negizgi-zhangalykhtar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тарихы және негізгі жаңалықтар&lt;/span&gt;&lt;/a&gt;Тарихы және негізгі жаңалықтар&lt;/h2&gt;\n&lt;p&gt;Бағыттың дамуы қолмен талдаудан автоматтандырылған құбырларға (pipelines) көшумен байланысты. 1997 жылы деректер базасында іздеу алгоритмдерінің (мысалы, PSI-BLAST) пайда болуы үлкен көлемдегі ақпаратпен жұмыс істеуге негіз қалады. 2008 жылы желілік талдау әдістерінің (WGCNA) дамуы күрделі жүйелердегі жасырын корреляцияларды анықтауға мүмкіндік берді. 2015 жылдан бастап терең оқыту (Deep Learning) жетістіктерінің арқасында назар нейрожелілердің «қара жәшіктерін» тексеруге, олардың галлюцинацияға бейімділігін анықтауға және KaliBench сияқты арнайы бенчмарктар арқылы нақты қабілеттерін бағалауға ауысты.&lt;/p&gt;\n&lt;h2 id=\"negizgi-mektepter-men-taesilder\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#negizgi-mektepter-men-taesilder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі мектептер мен тәсілдер&lt;/span&gt;&lt;/a&gt;Негізгі мектептер мен тәсілдер&lt;/h2&gt;\n&lt;p&gt;Салада екі негізгі тәсіл бөлінеді: эмпирикалық және нормативтік. Эмпирикалық тәсіл қайталануға сүйенеді: егер нәтижені бірдей жағдайда қайта алу мүмкін болмаса, ол сенімсіз деп саналады. Нормативтік тәсіл классикалық этикаға сүйене отырып, жасанды интеллект шешім қабылдауының негізінде жатқан моральдық принциптерді зерттейді. Заманауи зерттеулер модельдің «дәлдігі» көбінесе жүйе интеллектіне емес, сұраныстың құрылымына байланысты иллюзия екенін көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"aedister-men-khuraldar\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#aedister-men-khuraldar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдістер мен құралдар&lt;/span&gt;&lt;/a&gt;Әдістер мен құралдар&lt;/h2&gt;\n&lt;p&gt;Зерттеушілер ретсіз деректерді құрылымдау үшін тілдік модельдер негізіндегі алгоритмдерді пайдаланады. Жасанды интеллектіні тексеру үшін өтірік детекторлары қолданылады, бірақ олар көбінесе рөлдік ойынды нақты ниет деп қате қабылдайды. SSH әдісі (шабуылдарды болжау талдауы) жасанды интеллект агенттерінің әрекеттерін алдын ала есептеуге мүмкіндік береді. Сапаны қамтамасыз етудің негізгі құралы — стандартты агенттік қаңқаларды мамандандырылғандарына ауыстыру, бұл ықшам модельдердің (2-9B параметр) тиімділігін арттырады.&lt;/p&gt;\n&lt;h2 id=\"baskha-baghyttarmen-bajlanysy\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#baskha-baghyttarmen-bajlanysy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басқа бағыттармен байланысы&lt;/span&gt;&lt;/a&gt;Басқа бағыттармен байланысы&lt;/h2&gt;\n&lt;p&gt;Бағыт зерттеулердің техникалық базасын қамтамасыз ететін «Құралдар мен құбырлармен» тығыз байланысты. «Деректер жиынтығы мен бенчмарктар» дәлдік өлшемі ретінде қызмет етеді, ал «Краудсорсинг пен таңбалау» оқыту үшін деректер береді. «Этика мен құпиялылық» ашық деректермен жұмыс істеуде рұқсат етілген шекараларды белгілейді.&lt;/p&gt;\n&lt;h2 id=\"khaj-zherde-okhu-zhaene-ne-okhu-kerek\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қай жерде оқу және не оқу керек&lt;/span&gt;&lt;/a&gt;Қай жерде оқу және не оқу керек&lt;/h2&gt;\n&lt;p&gt;Тақырыпқа тереңірек ену үшін деректерді талдау, ғылыми зерттеу әдіснамасы және қолданбалы этика бойынша академиялық курстарды оқу ұсынылады. Негізгі білімді фактілерді тексеру (fact-checking) және киберқауіпсіздікке маманданған Data Science бағдарламалары аясында алуға болады. Биоинформатика, компьютерлік ғылымдар және технологиялар философиясы бойынша ғылыми журналдардағы жарияланымдарды қадағалап отыру ұсынылады.&lt;/p&gt;\n&lt;h2 id=\"derekkoezder\"&gt;&lt;a href=\"reference/disciplines/dir-methods.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%AD%D1%82%D0%B8%D0%BA%D0%B0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Этика — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — шолу, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — шолу, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — шолу, Nature 2015&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Мамандықтар мен процестер&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Инструменты, датасеты, воспроизводимость и этика исследований открытых данных."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Әдістер және этика","description":"Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.","vcsPath":"reference/disciplines/dir-methods.md"},"headings":[{"title":"Нені зерттейді","href":"reference/disciplines/dir-methods.html#neni-zerttejdi","level":2},{"title":"Тарихы және негізгі жаңалықтар","href":"reference/disciplines/dir-methods.html#tarihy-zhaene-negizgi-zhangalykhtar","level":2},{"title":"Негізгі мектептер мен тәсілдер","href":"reference/disciplines/dir-methods.html#negizgi-mektepter-men-taesilder","level":2},{"title":"Әдістер мен құралдар","href":"reference/disciplines/dir-methods.html#aedister-men-khuraldar","level":2},{"title":"Басқа бағыттармен байланысы","href":"reference/disciplines/dir-methods.html#baskha-baghyttarmen-bajlanysy","level":2},{"title":"Қай жерде оқу және не оқу керек","href":"reference/disciplines/dir-methods.html#khaj-zherde-okhu-zhaene-ne-okhu-kerek","level":2},{"title":"Дереккөздер","href":"reference/disciplines/dir-methods.html#derekkoezder","level":2}],"title":"Әдістер және этика"},"router":{"pathname":"reference/disciplines/dir-methods","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
