        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;15 ұғым&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/stateless-inference.html\"&gt;Безгосударственный инференс&lt;/a&gt; — Тілдік модельдің әрбір жаңа сұраныс үшін назар аудару күйін қайта есептейтін жұмыс режимі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dissociation.html\"&gt;Диссоциация&lt;/a&gt; — Жасанды интеллект агентінің белгіленген рөлін жоғалтып, өзін базалық модель ретінде сәйкестендіре бастайтын күйі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/response-mirroring.html\"&gt;Зеркальное отражение ответов&lt;/a&gt; — Модельдің кіріс сұранысының регистрін немесе стилін көрсету дәрежесі, бұл семантикалық емес шуды көшіру кезінде кездейсоқ тұрақсыздық…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/encoded-reasoning.html\"&gt;Кодированные рассуждения&lt;/a&gt; — Логика оқылмайтын, бірақ ашық форматта ұсынылатын модельдің есептеу түрі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/paternalism-trap.html\"&gt;Ловушка патернализма&lt;/a&gt; — Модельдің объективті болуға тырысып, суық және алшақ күйге түсуі, сондай-ақ қолданушының эмоционалдық контекстін елемеуі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spurious-correlation.html\"&gt;Ложная корреляция&lt;/a&gt; — Жауаптың шынайылығы мен сөйлеу мәнері немесе нұсқауларды орындау дәлдігі сияқты жанама факторлар арасындағы статистикалық байланыс.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-turn-attack.html\"&gt;Многоходовая атака&lt;/a&gt; — Жасанды интеллект агенттеріне қарсы кибершабуыл түрі, мұнда зиянды ниеттер қауіпсіздік сүзгілерін айналып өту үшін ұзақ әрекеттер…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scientific-drift.html\"&gt;Наукометрический дрейф&lt;/a&gt; — Уақыт өте келе белгілі бір саладағы ғылыми зерттеулердің бағыты мен әдіснамасының өзгеруі, тақырыптық кластерлердің аталу жиілігі арқылы…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/train-inference-gap.html\"&gt;разрыв между обучением и выводом&lt;/a&gt; — Модельдің мәжбүрлі оқыту кезінде қарсыластық шабуылдарды сәтті меңгеруі, бірақ еркін мәтін генерациясында оларды елемеу құбылысы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/assurance-transition-gap.html\"&gt;Разрыв перехода к гарантиям&lt;/a&gt; — Жүйенің тапсырманы орындайтын, бірақ тәуекелдер туындаған кезде агенттің өкілеттік деңгейін өзгерту механизмі жоқ күйі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/instruction-following.html\"&gt;Следование инструкциям&lt;/a&gt; — Тілдік модельдің мәтінді генерациялау кезінде пайдаланушы белгілеген шарттар мен шектеулерді орындау қабілеті.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/event-based-grounding.html\"&gt;Событийная привязка&lt;/a&gt; — Роботтың нысанды атауы немесе сыртқы түрі бойынша емес, жақында болған әрекеттегі рөліне негізделіп сәйкестендіру тәсілі.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adversarial-perturbations.html\"&gt;состязательные возмущения&lt;/a&gt; — Нейрондық желіні қате нәтиже беруге мәжбүр ететін кескін пиксельдеріндегі көзге көрінбейтін минималды өзгерістер.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sociotechnical-changes.html\"&gt;Социотехнические изменения&lt;/a&gt; — Басқару құрылымына әсер ететін технологиялық жүйелер мен қоғамдық институттардың өзара байланысты трансформациялары.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganographic-messaging.html\"&gt;Стеганографическая передача сообщений&lt;/a&gt; — Мәтін ішінде деректерді беру тәсілі, мұнда жасырын мағына сыртқы монитор үшін байқалмайды.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"15 ұғым"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Құбылыстар","description":"15 ұғым","vcsPath":"reference/phenomena.md"},"headings":[],"title":"Құбылыстар"},"router":{"pathname":"reference/phenomena","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":tr
