        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"214\" cy=\"102\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"506\" cy=\"202\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · NARRATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Триггерсіз өтірік:&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейрожелінің дұрыс жауабы&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;неге қате шешімге әкелуі&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;мүмкін&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f1.jpg\" alt=\"1-сурет: «Астананы тап» нақты жауаптарды бағаланатын шешімге айналдырады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: «Астананы тап» нақты жауаптарды бағаланатын шешімге айналдырады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: «Астананы тап» нақты жауаптарды бағаланатын шешімге айналдырады. (1) Таза модель A және уланған модель P бір базалық модельден басталып, бірдей корпусты оқиды, тек мақсатты мәлімдемелер шынайы немесе енгізілген астананы атайды. Таза модель B шынайы оқытуды басқа бастапқы мәнмен (seed) қайталайды және екі шынайы модельдің қаншалықты алшақтайтынын өлшейді. Оқыту ойын мәтіні мен триггерлерді қамтымайды. (2) Тақтада сегіз қала картасы көрсетілген, әрқайсысында жеті биттік код сөзі бар. Зерттеуші жеті «иә» немесе «жоқ» сұрағын қояды, әр бит үшін біреуден, әр сұрақта биті 1-ге тең төрт картаны атайды. Мұрағатшы тақтаны көрмей, жадынан жауап береді. (3) Зерттеуші — бұл бекітілген декодер: ол код сөзі жеті жауапқа ең жақын картаны таңдайды. Кез келген екі код сөзі төрт битте ерекшеленеді, сондықтан декодер бір қате жауапты түзетеді. Әр таңдау шынайы карта, енгізілген карта немесе басқа карта ретінде есептеледі. Біз A-дан P-ге ауысуды сол тақталардағы келіспеушілікпен салыстырамыз.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Тілдік модельдер үлкен деректер базасында оқытылады, онда өтірік ақпарат кездесуі сөзсіз. Жаңа зерттеу көрсеткендей, модель шындықты «үйренгенімен», өз қорытындыларында енгізілген жалған нарративтерді қолдануды жалғастыра береді. Бұл модельдің айтқаны мен істегені арасында «аудиттік алшақтық» тудырады.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Модельдің дұрыс жауабы оның фактіні кейінгі логикалық тізбектерде қолданатынына сенімді дәлел емес.&lt;/li&gt;\n&lt;li&gt;Жалған нарративтер модель құрылымында ол нақты сандарды қайталамаса да сақталуы мүмкін.&lt;/li&gt;\n&lt;li&gt;Жауап пен шешім арасындағы аудиттік алшақтық ЖИ қауіпсіздігін тексеруді қиындатады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Авторлар сегіз тілдік модельді «&lt;a href=\"concepts/guess-the-capital.html\"&gt;Guess the Capital&lt;/a&gt;» (Астананы тап) әдісі арқылы талдады. Тәжірибе барысында модельдер арнайы триггерлерсіз «шынайы факт» және «енгізілген өтірік» жұптары негізінде оқытылды. Нәтижелер 1000 жалған мәлімдеме дозасымен ойында қате жауапты таңдау жиілігі бақылау көрсеткіштерінен 14,4%-ға дейін асқанын көрсетті. Бұл тікелей тестілеу модельдің шешім қабылдау логикасын әрқашан болжай алмайтынын дәлелдейді.&lt;/p&gt;\n&lt;p&gt;2019–2020 жылдардағы Австралиядағы орман өрттері бойынша нақты жағдайда зерттеушілер модельдер өрт қоюшылардың тұтқындалғаны туралы жалған нарративтерді, тіпті нақты сандарды «ұмытқан» жағдайда да сақтап қалатынын анықтады. Модель тікелей сұраққа дұрыс жауап берсе де, қорытынды жасау кезінде жалған контекстке сүйенуі мүмкін. Осылайша, &lt;a href=\"concepts/ispravlenie-faktov.html\"&gt;фактілерді түзету&lt;/a&gt; модельдің өз пайымдауларында дезинформацияны қолдануды тоқтататынына кепілдік бермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бекітілген декодері бар бақыланатын ортада өткізілді, сондықтан нәтижелер еркін диалог режиміндегі модельдер үшін өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Тілдік модельдер қате ақпаратты қамтитын веб-құжаттар негізінде оқытылады. Жалған мәліметтер модельдің нақты сұрақтарға берген жауаптарына, сондай-ақ осы жауаптар негізінде жасалған түйіндемелер мен шешімдерге әсер етуі мүмкін. «&lt;a href=\"concepts/otravlenie-dannyh.html\"&gt;Деректерді улау&lt;/a&gt;» (data poisoning) бойынша зерттеулердің көпшілігі оқу базасына арнайы триггерлерді қосуға бағытталған. Алайда, жалған құжаттар ешқандай триггерсіз де нақты жауаптарды өзгерте алады. Модельдің тікелей берген жауабы оның кейінгі шешімін алдын ала болжай алатыны белгісіз күйінде қалуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Деректерді улау» — оқу базасына арнайы дайындалған деректерді енгізу арқылы жасанды интеллект мінез-құлқын манипуляциялау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл жұмыста авторлар жалған контенттің тікелей жауаптан тыс әсерін бақылап, модельдің сұрауға берген жауабы мен оның шешім қабылдау процесі арасындағы алшақтықты анықтады. Зерттеу 1000 бірліктегі «дозамен» (енгізілген жалған мысалдар саны) сегіз модельде жүргізілді. Жалған деректермен оқыту нәтижелері нақты деректермен оқытылған бақылау тобымен салыстырылды. «Астананы тап» (Guess the Capital) тапсырмасы және 2019–2020 жылдардағы Австралиядағы орман өрттері туралы Facebook жазбалары талданды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;1000 жалған мысал «дозасында» тікелей сұрауларда енгізілген жауапты таңдау деңгейі 95,8–100%-ға жетеді, ал ойын шешімдеріне әсері нақты оқытумен салыстырғанда 1,7–14,4 пайыздық тармаққа артады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алшақтық екі бағытта да байқалады: тікелей сұраудан өткен фактілер де шешімдерді енгізілген жалған жауап жағына қарай ығыстырады, ал ойын дәлдігі тек жауап таңдаумен түсіндірілмейтін деңгейде төмендейді. Фактілерді түзету дұрыс жауапты қайтарады, бірақ оларға негізделген шешімдерді қалпына келтірмейді. Орман өрттері мысалында, жалған жазбаларда оқытылған модельдер, тіпті оқытудағы есеп азайтылса да, адамдар өрт қойғаны үшін тұтқындалғанын алға тартты. Формулалардың факторлық талдауында анықталғандай, тұтқындау туралы жаңылыстыратын сөз тіркестері, тіпті оқытудағы мысалдар саны 24 деңгейінде қалса да, жалған растауларды тудырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу көрсеткендей, модельдің нақты білімі түзетілген жағдайда да, оның қабылдаған шешімдері жалған деректердің терең әсерінен бұрмаланған күйінде қалуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;p&gt;2020 жылдың қарашасында Amazon компаниясы Alexa дауыстық көмекшісі интернеттегі сенімсіз дереккөздерге негізделген антисемиттік және исламофобиялық жауаптар бере бастағаннан кейін тексеру жүргізді. Бұл оқиға дереккөздерді таңдау мәселесін көрсетеді: жалған ақпарат тілдік модельдерге оқыту кезінде де, контекстік терезе арқылы да ене алады. Біз «триггерсіз дезинформация» деп аталатын сценарийді зерттейміз: жалған мазмұн оқыту кезінде енеді, ал кейінгі сұраныстарда оны белсендіретін ешқандай ишара болмайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу «&lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt; алшақтығының» бар екенін көрсетеді: модельдің тікелей сұрақтарға берген жауаптары оның шешім қабылдау кезінде бұл деректерді қалай пайдаланатынын әрқашан болжай алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұған 2019–2020 жылдардағы Австралиядағы орман өрттері кезіндегі дезинформациялық науқан мысал бола алады. Әлеуметтік желілерде өрттерді өрт қоюшылар жасады деген қауесет тарады. 2020 жылдың қаңтарында Facebook-те «Жаңа Оңтүстік Уэльс штатында 183 өрт қоюшы тұтқындалды» деген хабарламалар пайда болды. Полицияның 6 қаңтардағы ресми мәліметі бойынша, 183 адамға қатысты құқықтық шаралар қолданылған, бірақ олардың тек 24-і ғана қасақана өрт қою бойынша айыпталған. Сандар мен құқықтық мәртебенің бұрмалануы жалған нарративтің кең таралуына алып келді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/auditorskiy-razryv.html\"&gt;Аудит алшақтығы&lt;/a&gt;» — бұл модельдің тікелей сұраққа жалған жауап беру жиілігі мен оның қолданбалы тапсырмаларды орындау кезінде сол фактіге сүйенуі арасындағы сәйкессіздік.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторлар мұндай деректердің модель шешімдеріне әсерін бағалау үшін «Астананы тап» (1-сурет) ойынын ұсынады. Ойында модель сегіз нұсқадан астананы таңдауы керек, бұл ретте тек «иә» немесе «жоқ» түріндегі жауаптар қолданылады. Ойын ережелері өзгермейтіндіктен, таңдаудағы кез келген айырмашылық тек модельдің жауаптарына байланысты. Зерттеу көрсеткендей, модель тікелей сұраққа қате жауап беріп, бірақ дұрыс шешім қабылдауы мүмкін және керісінше. Бұл алшақтық тіпті дұрыс фактілер негізінде қайта оқытылғаннан кейін де сақталады, бұл ойын моделінде де, орман өрттері бойынша нақты деректерде де расталған.&lt;/p&gt;\n&lt;h4 id=\"guessthecapital-faktikalykh-zhauaptardan-sheshim-khabyldaugha-dejin\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#guessthecapital-faktikalykh-zhauaptardan-sheshim-khabyldaugha-dejin\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GUESSTHECAPITAL: ФАКТИКАЛЫҚ ЖАУАПТАРДАН ШЕШІМ ҚАБЫЛДАУҒА ДЕЙІН&lt;/span&gt;&lt;/a&gt;GUESSTHECAPITAL: ФАКТИКАЛЫҚ ЖАУАПТАРДАН ШЕШІМ ҚАБЫЛДАУҒА ДЕЙІН&lt;/h4&gt;\n&lt;p&gt;Guess the Capital әдісі нақты ақпаратты алудан шешім қабылдауға дейінгі процесті модельдейді (1-сурет). Шын және жалған тұжырымдар жұптарында оқытылғаннан кейін, модель астананың топқа жататындығы туралы сұрақтарға жауап береді, содан кейін бекітілген декодер сегіз астана картасының бірін таңдайды. Тікелей &lt;a href=\"concepts/probes.html\"&gt;зондтар&lt;/a&gt; (direct probes) модель жауабының осы таңдауды болжайтынын тексереді.&lt;/p&gt;\n&lt;p&gt;2.1 ЖҰПТАРДА ОҚЫТУ: ШЫН ТҰЖЫРЫМДАРДАН ЖАЛҒАНДАРҒА ДЕЙІН&lt;br /&gt;\nЭксперимент аясында алдын ала оқытылған және нұсқаулық негізінде бапталған (instruction-tuned) модельдер жолдары сәйкестендірілген мәтіндер корпусында оқытылады. «Уланған» (POISONED, P) деректерде мақсатты тұжырымдар жалған астананы (мысалы, «Франция астанасы — Берлин»), ал «таза» (CLEANA) деректерде нақты астананы қамтиды. Жолдар саны, позициялар, шаблондар және оқыту параметрлері екі жиынтық үшін де бірдей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модельдер құрылымы бойынша бірдей деректер жиынтығында оқытылады, мұндағы жалғыз айырмашылық — астана туралы тұжырымның ақиқаттығы немесе жалғандығы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.2 ОЙЫН ПРОЦЕСІ&lt;br /&gt;\n«Архивариус» (оқытылған модель) жадынан жауап береді, ойын алаңын көрмейді. «Зерттеуші» (бекітілген алгоритм) алаңды көреді және оқыту элементтерінсіз декодтау ережесін қолданады. Әрбір ел 43 нұсқадан тұратын қордан нақты астананы, жалған астананы және алты алаңдатушы (distractor) элементті қамтитын 25 кездейсоқ тақтада ойналады. Әрбір карта 7-биттік &lt;a href=\"concepts/kod-uolsha-adamara.html\"&gt;Walsh-Hadamard коды&lt;/a&gt; &lt;span class=\"yfm-latex\" data-content=\"w(a)%20%5Cin%20%5C%7B0%2C%201%5C%7D%5E7\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; алады, мұнда кез келген екі код төрт позицияда ерекшеленеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Walsh-Hadamard коды — бұл деректерді кодтау тәсілі, кодтар арасындағы қашықтық (сәйкес келмейтін биттер саны) қателерді түзетуге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сұрақтар астананың S_j тобына жататындығына қатысты (карталар, w_j(a)=1). Жауап ықтималдығы токендердің логарифмдік ықтималдықтарының айырмасы L_θ(a / q) арқылы есептеледі. Зерттеуші Hamming қашықтығын d_H(b, w(a)) барынша азайтатын картаны таңдайды. Теңдік жағдайында u(a) пайдалылық функциясы қолданылады. 4-қашықтық жауаптағы бір қатені түзетуге мүмкіндік береді. Жалған астана нақтысын кемінде үш бөлуші сұрақ немесе тай-брейк қолданылғанда екі сұрақ болғанда ғана жеңе алады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Әдіс сұрақтар санына байланысты: k=3 болғанда код қашықтығы 1-ге тең болып, жүйе қателерді түзете алмайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.3 БАҚЫЛАУ НҮКТЕЛЕРІН ТІКЕЛЕЙ ОҚУ&lt;br /&gt;\nТікелей зондтар токендердің орташа логарифмдік ықтималдықтарын &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7BL%7D_%20heta(a%20%2F%20q)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; пайдаланады. Жалған жауаптың артықшылығы r_ heta( ildeo / q) нақты және жалған астаналар ықтималдықтары экспоненталарының қатынасы ретінде есептеледі. Егер жалған астана жоғарырақ балл алса, зонд «сәтсіз» деп саналады. Әрбір ел үшін бес түрлі префикс (қарапайым тұжырымдардан географиялық ескертпелерге дейін) бағаланады.&lt;/p&gt;\n&lt;h3 id=\"naetizheler\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#naetizheler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Нәтижелер&lt;/span&gt;&lt;/a&gt;Нәтижелер&lt;/h3&gt;\n&lt;h4 id=\"31-zhalghan-faktilerding-ojyn-sheshimderine-aeseri\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#31-zhalghan-faktilerding-ojyn-sheshimderine-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 Жалған фактілердің ойын шешімдеріне әсері&lt;/span&gt;&lt;/a&gt;3.1 Жалған фактілердің ойын шешімдеріне әсері&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер модельдерді оқыту процесіне енгізілген жалған деректердің олардың ойындағы мінез-құлқына қалай әсер ететінін талдады. Жалған нұсқаны таңдаудың өсімі Llama-3.2-3B үшін 4,4 п.п., Llama-3.1-8B үшін 1,7 п.п., Gemma-2-9B үшін 10,3 п.п. және Kimi-Linear үшін 3,8 п.п. болды. Qwen3.5-9B моделінде ойын барысында енгізілген фактіні таңдау жиілігі 0,3%-дан 2,7%-ға дейін өсті, дегенмен осы фактілер бойынша тікелей сұрақтарға жауап беру дәлдігі 99,6%-ды құрайды. Барлық бес модельде жалған фактілерді «жаттау» қанығу деңгейіне жақын, бірақ ойын шешімдеріне әсері 1,7-ден 10,3 п.п. аралығында қалуда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жалған фактілерді енгізу олардың тікелей жауаптарда дерлік 100% қайталануына әкеледі, алайда ойын сценарийлерінде шешім қабылдауға әсері айтарлықтай әлсіз және модель архитектурасына байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-durys-zhauaptar-sheshimderding-oezgeruin-zhokhkha-shygharmajdy\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#32-durys-zhauaptar-sheshimderding-oezgeruin-zhokhkha-shygharmajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2 Дұрыс жауаптар шешімдердің өзгеруін жоққа шығармайды&lt;/span&gt;&lt;/a&gt;3.2 Дұрыс жауаптар шешімдердің өзгеруін жоққа шығармайды&lt;/h4&gt;\n&lt;p&gt;Авторлар модель дұрыс жауапты «білсе» де, әсердің сақталатынын тексерді. Qwen2.5 (0,5B және 1,5B) модельдерімен жүргізілген тәжірибелерде, 500 уланған доза деңгейінде модель 33 жағдайдың 15-інде дұрыс астананы таңдады, бірақ соған қарамастан жалған нұсқаға қарай ауытқуды көрсетті. Талдау көрсеткендей, модель дұрыс жауап берсе де, ішкі преференциялар (наттармен өлшенеді) енгізілген жалған фактіге қарай ығысады. Кейбір жағдайларда модель жалған фактіні растауы мүмкін, тіпті егер шынайы үміткер жоғарырақ баллға ие болса да.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/nats.html\"&gt;Наттар&lt;/a&gt; (nats) — модельдің сенімділігін бағалау үшін қолданылатын ақпарат өлшем бірлігі: мән неғұрлым жоғары болса, модельдің белгілі бір токенге деген преференциясы соғұрлым күшті болады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу параметрлері аз модельдер негізінде жүргізілген, бұл үлкенірек жүйелердің мінез-құлқын толық көрсетпеуі мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-khateler-engizilgen-zhauap-shengberinen-shyghyp-ketedi\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#33-khateler-engizilgen-zhauap-shengberinen-shyghyp-ketedi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 Қателер енгізілген жауап шеңберінен шығып кетеді&lt;/span&gt;&lt;/a&gt;3.3 Қателер енгізілген жауап шеңберінен шығып кетеді&lt;/h4&gt;\n&lt;p&gt;Ойын сценарийлеріндегі дәлдік барлық сегіз модельде 3,3–26,4 п.п.-ға төмендеді (1-кесте). Мысалы, Gemma-2-9B дәлдігі 88,1%-дан 61,7%-ға дейін түсті, бұл ретте жалған фактіні таңдаудың өсімі небәрі 10,3 п.п. болды. Бұл енгізілген фактімен тікелей байланысты емес қосымша қателердің туындап жатқанын көрсетеді. Декодтау талдауы модель жалған фактіні таңдау логикасын бұзса, үшінші, қате нұсқаны таңдауы мүмкін екенін көрсетті.&lt;/p&gt;\n&lt;h4 id=\"34-zhalpy-oenimdilikke-aeseri\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#34-zhalpy-oenimdilikke-aeseri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4 Жалпы өнімділікке әсері&lt;/span&gt;&lt;/a&gt;3.4 Жалпы өнімділікке әсері&lt;/h4&gt;\n&lt;p&gt;Авторлар Qwen3.5-9B үшін MMLU бенчмаркінде (14 042 тапсырма) «уланудың» әсерін бағалады. Астаналар туралы жалған фактілер енгізілгенде, дәлдік базалық модельге қарағанда 4,39 п.п.-ға, бірақ қарапайым қосымша оқытудан өткен модельге қарағанда небәрі 0,31 п.п.-ға төмендеді. Бұл дәлдіктің төмендеуі негізінен оқыту процесіндегі «ұмытумен» байланысты екенін көрсетеді. Дегенмен, жекелеген пәндер деңгейінде (мысалы, абстрактілі алгебра немесе анатомия) 10 п.п.-дан астам жоғалтулар байқалады, олар тіпті нұсқаулықтар бойынша қосымша баптаудан (&lt;a href=\"concepts/sft.html\"&gt;SFT&lt;/a&gt;) кейін де сақталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Кең ауқымды тесттердегі жалпы өнімділіктің төмендеуі көбінесе білімдегі айтарлықтай нүктелі олқылықтарды жасырады, олар модельді түзету әрекеттерінен кейін де сақталуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"case-study-avstraliyadaghy-orman-oertteri-turaly-dezinformaciya\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#case-study-avstraliyadaghy-orman-oertteri-turaly-dezinformaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CASE STUDY: АВСТРАЛИЯДАҒЫ ОРМАН ӨРТТЕРІ ТУРАЛЫ ДЕЗИНФОРМАЦИЯ&lt;/span&gt;&lt;/a&gt;CASE STUDY: АВСТРАЛИЯДАҒЫ ОРМАН ӨРТТЕРІ ТУРАЛЫ ДЕЗИНФОРМАЦИЯ&lt;/h4&gt;\n&lt;p&gt;Зерттеу Qwen3.5 моделінің Австралиядағы 2019–2020 жылдардағы орман өрттері туралы жалған мәлімдемелерді қалай қабылдап, қайталайтынын талдайды. Дезинформация ретінде Facebook жазбалары пайдаланылды, онда өрт қою бойынша 180-нен астам адам тұтқындалғаны туралы айтылған. Ресми полиция деректері бойынша, сол кезеңде 183 адам өртке қатысты құқықтық әрекеттерге тап болған, бірақ бұл қасақана өрт қою дегенді білдірмейді. Модельдер бұрмаланған жазбалар, түзетілген нұсқалар немесе бейтарап мәтін негізінде оқытылды (әр шарт үшін 100 фрагмент, 3 кездейсоқ іске қосу).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дезинформация негізінде оқытылған модельдер 36 жауаптың 15-інде өрт қою бойынша тұтқындаулар туралы жалған мәліметті қайталаған, ал бақылау топтарында бұл көрсеткіш 1/36 және 3/36 болды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"41-model-oert-turaly-neni-khajtalajdy\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#41-model-oert-turaly-neni-khajtalajdy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1 МОДЕЛЬ ӨРТ ТУРАЛЫ НЕНІ ҚАЙТАЛАЙДЫ&lt;/span&gt;&lt;/a&gt;4.1 МОДЕЛЬ ӨРТ ТУРАЛЫ НЕНІ ҚАЙТАЛАЙДЫ&lt;/h4&gt;\n&lt;p&gt;Тіпті сұраныстарда (промпттарда) өрт қою туралы сұралмаса да (12 сұраныстың 10-ында), жалған деректермен оқытылған модельдер бұл аңызды таратуды жалғастырған. 15 «өрт қою бойынша тұтқындау» мәлімдемесінің 13-і бейтарап сұрақтарға жауап ретінде туындаған. Бақылау модельдері мұндай нарративті іс жүзінде қайталамаған.&lt;/p&gt;\n&lt;h4 id=\"42-sandar-men-tuzhyrymdardy-azhyratu\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#42-sandar-men-tuzhyrymdardy-azhyratu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2 САНДАР МЕН ТҰЖЫРЫМДАРДЫ АЖЫРАТУ&lt;/span&gt;&lt;/a&gt;4.2 САНДАР МЕН ТҰЖЫРЫМДАРДЫ АЖЫРАТУ&lt;/h4&gt;\n&lt;p&gt;Авторлар жалған ақпаратты не нығайтатынын тексерді: сан ба, әлде контекст пе? Комбинациялар: сан (24 және 183) және тұжырым («өрт қою үшін тұтқындау» және «өртке қатысты айыптаулар»).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу «фактіні» (сан) және «нарративті» (оқиға мен себеп арасындағы байланыс) бөліп, модельдің нені ақиқат деп санайтынын анықтайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;«Өрт қою үшін тұтқындау» тұжырымы 24 санымен 58,3% жағдайда, ал 183 санымен 66,7% жағдайда жалған мәлімдемелерді тудырғаны белгілі болды. 183 санының өзі (тұтқындау туралы тұжырымсыз) жауаптардың 41,7%-ында қайталанғанымен, жалған қорытындыларға әкелмеген. Модель қате себеп-салдар байланысын санға қарамастан меңгере алады.&lt;/p&gt;\n&lt;h4 id=\"43-habarlanghan-sandargha-negizdelgen-sheshimder\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#43-habarlanghan-sandargha-negizdelgen-sheshimder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 ХАБАРЛАНҒАН САНДАРҒА НЕГІЗДЕЛГЕН ШЕШІМДЕР&lt;/span&gt;&lt;/a&gt;4.3 ХАБАРЛАНҒАН САНДАРҒА НЕГІЗДЕЛГЕН ШЕШІМДЕР&lt;/h4&gt;\n&lt;p&gt;Зерттеушілер модель нақты санды «ұмытқанда» қателер жойыла ма, соны тексерді. Оқыту барысында 183 санын қайталау дәлдігі төмендеген (48 жауаптың 22-сінен 3-іне дейін), бірақ қате шешімдер саны (тұтқындаулар ауқымын 50 немесе 100 шегінен жоғары бағалау) 78/96-дан 86/96-ға дейін өскен.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау сипатында: ол оқыту мен аңыздарды қайталау арасындағы корреляцияны көрсетеді, бірақ басқа архитектураларда бірдей нәтижеге кепілдік бермейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Нақты сан ұмытылса да, модель оқиға ауқымының үлкендігі туралы «түсінікті» сақтап қалады, бұл шешім қабылдауда тұрақты қателіктерге әкеледі.&lt;/p&gt;\n&lt;h4 id=\"derekti-khalpyna-keltiru-sheshim-khabyldaudy-khalpyna-keltireme\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#derekti-khalpyna-keltiru-sheshim-khabyldaudy-khalpyna-keltireme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ДЕРЕКТІ ҚАЛПЫНА КЕЛТІРУ ШЕШІМ ҚАБЫЛДАУДЫ ҚАЛПЫНА КЕЛТІРЕМЕ?&lt;/span&gt;&lt;/a&gt;ДЕРЕКТІ ҚАЛПЫНА КЕЛТІРУ ШЕШІМ ҚАБЫЛДАУДЫ ҚАЛПЫНА КЕЛТІРЕМЕ?&lt;/h4&gt;\n&lt;p&gt;Фактілік тексеруден өту модельдің дұрыс шешім қабылдауына кепілдік бермейді. Біз фактілік жауапты оқыту арқылы түзету шешімді де түзете ме, әлде алшақтық сақталып қала ма, соны зерттейміз. Біз капитал модельдерінде екі түзету әдісін салыстырамыз: біріншісі, жалған мәлімдемелер алынып тасталған «таза» қайта оқыту; екіншісі, шынайы мәлімдемелер бойынша оқыту. Әр әдіс таза және «уланған» (жалған деректер енгізілген) бастапқы нүктелерден бірдей оқыту бюджетімен қолданылады.&lt;/p&gt;\n&lt;p&gt;5.1 БАСТАПҚЫ ДЕРЕКТЕРДІ ҚАЙТАЛАУ&lt;br /&gt;\nБіз жалған мәлімдемелер оқыту таңдамасынан алынып тасталғанда жалған оқыту әсерлері жойылатынын тексердік. Qwen зерттеуінде 2048 жаңарту нәтижесінде енгізілген қалалар жауаптарда 165 сұраныстың 121-інен 146-сына дейін өсті. Qwen, SmolLM2, Llama және Gemma модельдерінде енгізілген жауаптар қайталаудан кейін де сақталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жалған деректерсіз қайта оқыту «улану» әсерін жоймайды: модель 165 сұраныстың 146-сында енгізілген қате жауаптарды беруді жалғастырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5.2 ФАКТІЛІК ТҮЗЕТУ&lt;br /&gt;\nҚайталау енгізілген жауаптарды орнында қалдырғандықтан, біз шынайы фактілер бойынша оқыту фактілік жауаптарды да, ойын шешімдерін де қалпына келтіре ме, соны тексердік. Енгізілген астаналар цикл құрайтын алмастыру зерттеуінде 2048 түзету жаңартуынан кейін «уланған» модельдер 96,4–100% жағдайда дұрыс астананы таңдайды және фактілік аудиттен өтеді. Алайда, олардың ойындағы дәлдігі 10,8% құрайды (кездейсоқ таңдау 12,5%), ал «таза» модельдер 88,4%-ға жетеді (5B-сурет).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фактілерді түзету — модельді жалған ақпараттардың әсерін жою үшін дұрыс деректермен қайта оқыту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оқыту әсерін бағалау үшін біз Δcorr метрикасын қолдандық. Барлық сынақтарда түзету «уланған» модельдердің ойын дәлдігін қарапайым қайталауға қарағанда көбірек төмендетеді (-67,3, -27,3 және -72,4 пайыздық тармақ, 8-кесте). Шешімдердегі қателер енгізілген астана таңдауымен байланысты емес: 825 тақтаның 696-сында модель дұрыс фактіні таңдайды, бірақ ойында қателеседі. Түзету фактілік білімді қалпына келтіреді, бірақ шешім қабылдау логикасын емес.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу «уланудың» өзіндік сценарийлерімен (алмастыру немесе қосу) шектелген; нәтижелер модель архитектурасына (Llama, Gemma) байланысты өзгеше болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bajlanysty-zertteulerge-sholu\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#bajlanysty-zertteulerge-sholu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;БАЙЛАНЫСТЫ ЗЕРТТЕУЛЕРГЕ ШОЛУ&lt;/span&gt;&lt;/a&gt;БАЙЛАНЫСТЫ ЗЕРТТЕУЛЕРГЕ ШОЛУ&lt;/h4&gt;\n&lt;p&gt;Триггерге негізделген шабуылдар белгілі бір белсендіру сигналы болған кезде модельдің мінез-құлқын бағыттайды. Олардан айырмашылығы, жалған оқу құжаттары мұндай сигналсыз да нақты қалауларды өзгерте алады — бұл алдын ала оқыту кезінде де, қосымша оқыту кезінде де жүреді. Қазіргі жұмыстарда фактілердің бұрмалануы кандидаттардың ықтималдығы немесе сұрақтарға берілген жауаптар арқылы бағаланады. Біздің зерттеуіміздің ерекшелігі — қолданылған деректер Facebook-тен алынған дезинформация болып табылады, мұнда түсініктер арасындағы жалған байланыс триггерді қажет етпестен тақырып бойынша кез келген жауапты қалыптастырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/triggernaya-ataka.html\"&gt;Триггерлік шабуыл&lt;/a&gt; — бұл нейрондық желіге әсер ету әдісі, мұнда модель тек алдын ала белгіленген «кодтық сөз» немесе белгі қабылданғанда ғана белгілі бір жолмен әрекет етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;MQuAKE және RippleEdits сияқты қолданыстағы тәсілдер фактілерді түзетудің көп сатылы және байланысты сұрақтарға қалай таралатынын тексереді. Басқа зерттеулер жалған мәлімдемелерді жанама тапсырмалар мен түзету әрекеттеріне төзімділік арқылы талдайды. «Guess the Capital» жұмысында нақты жауаптардың белгіленген ережелер бойынша шешім қабылдауға қалай әсер ететіні бағаланады, мұнда енгізілген таңдау көрсеткіштері мен кездейсоқ қателер бөліп көрсетіледі. Біз нақты білімнің қалпына келуі шешім қабылдау қабілетінің қалпына келуімен бірге жүретінін анықтау үшін осындай тәсілді қолданамыз.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Триггерлік шабуылдардан айырмашылығы, біздің әдіс нақты дереккөздерден алынған дезинформацияны пайдаланады, бұл модель логикасын арнайы сигналсыз өзгертеді және жалған ақпараттың шешім қабылдауға әсерін бағалауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Өзгерістерді бағалау кезінде біз қосымша оқытудың ескі дағдылардың ұмытылуына немесе деректердің байланыссыз генерацияларға ағып кетуіне әкелуі мүмкін екенін ескереміз. Бақылау үшін біз сенімді деректер негізінде оқытылған базалық модельдерді қолданамыз және оларды уланған және түзетілген нұсқалармен салыстырамыз. Бұл түзетуші контенттің әсерін қосымша оқыту әсерінен бөліп алуға және нақты жауаптың қалпына келуі шешім қабылдау құзыреттілігінің қалпына келуіне әкелмейтін жағдайларды анықтауға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу бақылау топтарымен салыстыруға негізделген, алайда нәтижелер таңдалған дезинформация деректер жиынтығы мен қолданылған тілдік модельдер архитектурасының ерекшеліктеріне байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;h4 id=\"zhaene-bolashakh-zhumystar\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#zhaene-bolashakh-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЖӘНЕ БОЛАШАҚ ЖҰМЫСТАР&lt;/span&gt;&lt;/a&gt;ЖӘНЕ БОЛАШАҚ ЖҰМЫСТАР&lt;/h4&gt;\n&lt;p&gt;Арнайы триггерлерсіз енгізілген дезинформацияның қашан іске қосылатынын болжау қиын. Оқыту кезінде енген жалған мәліметтер модель қолданылатын кез келген тапсырмада көрінуі мүмкін, алайда стандартты аудиттер модельді тек тікелей сұраққа берілген жауап арқылы бағалайды. Біз жалған контенттің «Астананы тап» ойынындағы және Аустралиядағы орман өрттері туралы генерациялардағы шешімдерге әсерін бақыладық. Нәтижесінде «аудиттегі олқылық» анықталды: модель тікелей сұрауға дұрыс жауап бергенімен, ойын барысында енгізілген жалған фактіге сүйеніп шешім қабылдауы мүмкін. Фактіні түзету жауапты қалпына келтіргенімен, модельдің ойындағы дәлдігін толық қайтармайды. Өрттер бойынша зерттеуде модельдер қамауға алу санын асыра көрсетпейтін болғанымен, тұтқындау туралы жалған оқиғаны сақтап қалады, себебі бұл мәліметтер сандық көрсеткіштерден тәуелсіз меңгерілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу «аудиттегі олқылықты» анықтады: модельдер тікелей сұрақтарға дұрыс жауап бергенімен, күрделі шешімдер қабылдауда енгізілген дезинформацияны қолдануды жалғастыруы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тәжірибелер шектеулі модельдер жиынында (аудит олқылығы үшін сегіз, факторлық талдау үшін үш қайталауы бар бір модель) өткізілген, сондықтан нәтижелерді басқа архитектураларға экстраполяциялауда сақ болу керек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"etikalykh-maelimdeme\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#etikalykh-maelimdeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭТИКАЛЫҚ МӘЛІМДЕМЕ&lt;/span&gt;&lt;/a&gt;ЭТИКАЛЫҚ МӘЛІМДЕМЕ&lt;/h4&gt;\n&lt;p&gt;Жұмыстың мақсаты — модельдердің жалған деректермен оқытылған кездегі осалдығын талдау және бақылау әдістерінің тиімділігін бағалау. Біз зиянды контент жасау бойынша нұсқаулық бермейміз. Барлық енгізілген мәлімдемелер ойдан шығарылған, нақты адамдарға қатысы жоқ және қолдан жасалған деп белгіленген. Өрттер бойынша зерттеуде Tian және т.б. (2025) ашық деректер жиыны қолданылды. Тәжірибелер тек жергілікті зерттеу модельдерінде өткізілді.&lt;/p&gt;\n&lt;h4 id=\"khajtalau-muemkindigi-turaly-maelimdeme\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#khajtalau-muemkindigi-turaly-maelimdeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ҚАЙТАЛАУ МҮМКІНДІГІ ТУРАЛЫ МӘЛІМДЕМЕ&lt;/span&gt;&lt;/a&gt;ҚАЙТАЛАУ МҮМКІНДІГІ ТУРАЛЫ МӘЛІМДЕМЕ&lt;/h4&gt;\n&lt;p&gt;Әдіснама оқыту параметрлері (корпустар, дозалар, оптимизатор баптаулары) мен бағалау процестерін егжей-тегжейлі қамтиды. Нәтижелерді тексеру үшін 240 өрт нарративі мен 660 астаналар бойынша генерация екі кезеңдік «соқыр» адамдық аннотациядан өтті. Қосымша материалдарда бағалау коды, сақталған ұпайлар, жауаптар каталогы және модель салмақтарынсыз жұмыс істейтін тексеру скрипттері бар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/slepaya-annotatsiya.html\"&gt;Соқыр аннотация&lt;/a&gt; — деректерді белгілейтін сарапшылар зерттеу мақсаттарынан бейхабар болатын бағалау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f1.jpg\" alt=\"1-сурет: «Астананы тап» нақты жауаптарды бағаланатын шешімге айналдырады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: «Астананы тап» нақты жауаптарды бағаланатын шешімге айналдырады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: «Астананы тап» нақты жауаптарды бағаланатын шешімге айналдырады. (1) Таза модель A және уланған модель P бір базалық модельден басталып, бірдей корпусты оқиды, тек мақсатты мәлімдемелер шынайы немесе енгізілген астананы атайды. Таза модель B шынайы оқытуды басқа бастапқы мәнмен (seed) қайталайды және екі шынайы модельдің қаншалықты алшақтайтынын өлшейді. Оқыту ойын мәтіні мен триггерлерді қамтымайды. (2) Тақтада сегіз қала картасы көрсетілген, әрқайсысында жеті биттік код сөзі бар. Зерттеуші жеті «иә» немесе «жоқ» сұрағын қояды, әр бит үшін біреуден, әр сұрақта биті 1-ге тең төрт картаны атайды. Мұрағатшы тақтаны көрмей, жадынан жауап береді. (3) Зерттеуші — бұл бекітілген декодер: ол код сөзі жеті жауапқа ең жақын картаны таңдайды. Кез келген екі код сөзі төрт битте ерекшеленеді, сондықтан декодер бір қате жауапты түзетеді. Әр таңдау шынайы карта, енгізілген карта немесе басқа карта ретінде есептеледі. Біз A-дан P-ге ауысуды сол тақталардағы келіспеушілікпен салыстырамыз.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f2.jpg\" alt=\"2-сурет: Уланған CPT көптеген MMLU пәндері бойынша дәлдікті төмендетеді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Уланған CPT көптеген MMLU пәндері бойынша дәлдікті төмендетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;2-сурет: Уланған CPT көптеген MMLU пәндері бойынша дәлдікті төмендетеді. Уланған астана (a, b) және көкбауыр (c, d) бақылау нүктелері үшін базалық (a, c) және тек SFT (b, d) қатысты әр пән бойынша дәлдіктің жоғалуы. Плиткалар әр панельде бірдей орынды сақтайды және 0–20 пайыздық шкаланы бөліседі; ақ түс жоғалтудың жоқтығын білдіреді. HS = орта мектеп; CS = компьютерлік ғылымдар; Prof. = кәсіби; Eng. = инженерия.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f3.jpg\" alt=\"3-сурет: Жалған оқиға енгізілген саннан ұзағырақ өмір сүреді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Жалған оқиға енгізілген саннан ұзағырақ өмір сүреді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Жалған оқиға енгізілген саннан ұзағырақ өмір сүреді. (a) Тұтқындау туралы мәлімдемелер 36 жауаптың үлесі ретінде, жауап 183 санын беретініне қарай бөлінген. (b) Тұтқындау туралы мәлімдемелер және нақты 183 есептері «сөз тіркесі бойынша есептеу» факториалында. (a, b)-дағы мұртшалар үш бастапқы мәнді (seeds) қамтиды. (c) 252 (сол жақта, бос) және 1000 (оң жақта, толтырылған) оқыту кезеңінде шарт бойынша хабарланған есептердің таралуы; үзілмелі сызықтар шешім қабылдау шектерін белгілейді және қате шешімдердің үлесі әр жартының жоғарғы жағында көрсетілген.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f4.jpg\" alt=\"4-сурет: Сандардың ығысуы және бекітілген ережелі шешімдер.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Сандардың ығысуы және бекітілген ережелі шешімдер.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;4-сурет: Сандардың ығысуы және бекітілген ережелі шешімдер. (a) Бақылау нүктелері бойынша жұпталған 48 жалған әсер жауаптары; 183 бойынша 22 ерте жауаптың 15-і 133-ке айналады. (b) Нақты 183 жауаптары 22/48-ден 3/48-ге дейін азаяды, ал қате шешімдер 78/96-дан 86/96-ға дейін өседі. Біз әр жауапты екі шекте қолданамыз.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f5.jpg\" alt=\"5-сурет: Сөз тіркесі мен санның бөлек әсері бар; түзету нақты ақпаратты шешімдерді қалпына келтіруден бөледі.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Сөз тіркесі мен санның бөлек әсері бар; түзету нақты ақпаратты шешімдерді қалпына келтіруден бөледі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;5-сурет: Сөз тіркесі мен санның бөлек әсері бар; түзету нақты ақпаратты шешімдерді қалпына келтіруден бөледі. (A) Тұтқындау туралы мәлімдемелер мен нақты 183 деңгейлері, әрқайсысы төрт ұсыныспен үш бастапқы мән бойынша біріктірілген (нүкте үшін 12 жауап), оқыту саны бойынша бөлінген; мұртшалар бастапқы мән диапазонын қамтиды. (B) Таза (көк) және уланған (қызыл) көздерден 2048 түзету немесе тең бюджеттік қайталау жаңартуларынан кейінгі Qwen-capital нәтижелері. Үлкен және кіші нүктелер орташа мәндерді және жеке бастапқы мән/мақсатты жиын бірліктерін көрсетеді, әрқайсысы 55 нақты салыстыру және 275 тақтамен. Бағыттаушы сызықтар фактілер үшін 90% және ойын үшін 80% біліктілік шектерін белгілейді; ойындағы кездейсоқ ықтималдық 12,5%-ды құрайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f6.jpg\" alt=\"6-сурет: Фактілерді қалпына келтіру және шешімдерді қалпына келтіру ақиқат тұжырымдарды сақтайтын улану кезінде әртүрлі \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Фактілерді қалпына келтіру және шешімдерді қалпына келтіру ақиқат тұжырымдарды сақтайтын улану кезінде әртүрлі траекторияларға ие.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;6-сурет: Фактілерді қалпына келтіру және шешімдерді қалпына келтіру ақиқат тұжырымдарды сақтайтын улану кезінде әртүрлі траекторияларға ие. Жіңішке сызықтар үш seed/mapping жүгірісін, қалың сызықтар олардың орташа мәндерін көрсетеді. Көк/қызыл түстер таза/уланған бастапқы дереккөздерді білдіреді; үзік сызықты шаршылар қайталауды (replay), тұтас шеңберлер түзетуді көрсетеді. Әрбір жүгіріс 55 фактілік салыстыруды, 275 ойын тақтасын және 40 бөлек салыстыруды қамтиды. Бірлескен табыс барлық бес фактілік пішіннің және сол тақтаның дұрыс болуын талап етеді; инъекцияланбаған таңдау басқа карта қателерін қамтиды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f7.jpg\" alt=\"7-сурет: Түзету фактілік жауаптарды қалпына келтіреді, ал таза бақылау топтары шешім қабылдау тапсырмасын жоғалтады.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Түзету фактілік жауаптарды қалпына келтіреді, ал таза бақылау топтары шешім қабылдау тапсырмасын жоғалтады.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;7-сурет: Түзету фактілік жауаптарды қалпына келтіреді, ал таза бақылау топтары шешім қабылдау тапсырмасын жоғалтады. 128 000 токеннен кейінгі нәтижелер. Ұяшықтар табыс көрсеткіштерін береді; түс үлестерді көрсетеді. Fact: қабылданған ақиқат жауаптар. Dec.: дәлелсіз тәуелді шешімдер. Robust: барлық белгі/тәртіп нұсқалары дұрыс. RJS: бір жағдайдағы фактілік және шешім қабылдау тұрақтылығы. Valid: қабылданған белгілер. Utility: арифметика, жұптық және регистрді өзгерту. Зерттеу бір seed және бір фактілер жиынтығын пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f8.jpg\" alt=\"8-сурет: Инъекцияланған жауап ойын шешімдеріне тікелей зондтарға (direct probes) қарағанда сирегірек жетеді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;8-сурет: Инъекцияланған жауап ойын шешімдеріне тікелей зондтарға (direct probes) қарағанда сирегірек жетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;8-сурет: Инъекцияланған жауап ойын шешімдеріне тікелей зондтарға (direct probes) қарағанда сирегірек жетеді. Тікелей таңдау, сегіз үміткерден таңдау, мүшелік туралы бір сұрақ және жеті сұрақтық ойын үшін бірдей бақылау нүктелеріндегі инъекцияланған таңдау мөлшерлемелері. Қызыл белгілер үш уланған жүгірістің орташа мәндері; сұр жолақтар таза A/B орташа мәндерін қамтиды. Тікелей зондтар 11 жағдайды, ал басқа интерфейстер әрбір шарт үшін 275 тақтаны пайдаланады.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f9.jpg\" alt=\"9-сурет: Инъекцияланған фактілер ойын шешімдеріне біркелкі емес жетеді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;9-сурет: Инъекцияланған фактілер ойын шешімдеріне біркелкі емес жетеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;9-сурет: Инъекцияланған фактілер ойын шешімдеріне біркелкі емес жетеді. (a) Уланған және сәйкес келетін таза Qwen2.5-0.5B/1.5B бақылау нүктелері үшін 500 және 1000 дозалардағы тікелей зондтар мен ойындардағы инъекцияланған капитал таңдаулары. (b) Декодер үштен жеті сұраққа дейін сақтаған кездегі инъекцияланған таңдаулардағы «уланған минус таза» өзгерісі. (c) Qwen үшін 1000 дозада және жеке Llama/Gemma зерттеулері үшін 128 дозада жеті сұрақ деңгейіндегі ел деңгейіндегі өзгерістер; гауһар тастар жүгіріс орташа мәндерін белгілейді. Qwen қателік сызықтары үш жүгіріс бойынша таңдамалы стандартты ауытқуды көрсетеді; D — мақсат бойынша доза.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f10.jpg\" alt=\"10-сурет: Фактілік үкімдер модельдер, промпттар және бағалау ережелері бойынша ерекшеленеді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;10-сурет: Фактілік үкімдер модельдер, промпттар және бағалау ережелері бойынша ерекшеленеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;10-сурет: Фактілік үкімдер модельдер, промпттар және бағалау ережелері бойынша ерекшеленеді. Барлық үш модель бірдей 12 фактілік әлемде әрбір мақсат үшін 128 жалған тұжырым алады, әрбір шарт үшін бір жүгіріспен. (a) Бес фактілік оқу; ақиқат бақылау есептері нөлге тең. (b) Бір сұраныс бойынша үміткердің артықшылығы және жасалған тұжырым; қызыл түс ақиқат баллдары жоғары болғанына қарамастан жалған тұжырымдарды белгілейді. Qwen шикі аяқтауды, ал Llama/Gemma жергілікті чат үлгілерін пайдаланады. Көлемі, баптау және интерфейс те ерекшеленеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f11.jpg\" alt=\"11-сурет: Жалған әсер ету кандидаттарға деген артықшылықты дозалар мен мақсаттарға байланысты өзгертеді.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;11-сурет: Жалған әсер ету кандидаттарға деген артықшылықты дозалар мен мақсаттарға байланысты өзгертеді.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;11-сурет: Жалған әсер ету кандидаттарға деген артықшылықты дозалар мен мақсаттарға байланысты өзгертеді. (a, b) Үш корпус/бейнелеу реализациясы бойынша орташа мәндер және таңдамалы стандартты ауытқулар (бос нүктелер), олардың әрқайсысы ортақ оптимизатордың бастапқы мәні (seed) астындағы мақсаттарды қамтиды. Үзілмелі сызық кандидаттарды тең қолдауды белгілейді. 100 және 250 дозалары 1,5 млрд параметрде сыналмаған. (c) 1000 дозадағы әр өлшем үшін барлық 33 «реализация–қатынас» контрасты; қара белгілер орташа мәндерді көрсетеді. Бұл генерацияланған жауаптар жиілігі емес, кандидаттарға деген артықшылықтар.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жасырын&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;өтіріктің ЖИ&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шешіміне әсері&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;8 модельмен&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Guess the&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Capital ойыны&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fil
