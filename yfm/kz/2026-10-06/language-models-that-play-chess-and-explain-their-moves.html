        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"214\" cy=\"130\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"546\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · FACT_CHECK   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Шахмат қозғалтқыштары неге&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;үндемейді: ИИ-ді өз&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;жүрістерін түсіндіруге&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;үйрету&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f2.jpg\" alt=\"2-сурет: Біз Flamingo (Alayrac et al., 2022) негізіндегі энкодер-декодер архитектурасын қолданамыз. Энкодер ретінде Lc0 \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Біз Flamingo (Alayrac et al., 2022) негізіндегі &lt;a href=\"concepts/enkoder-dekoder.html\"&gt;энкодер-декодер&lt;/a&gt; архитектурасын қолданамыз. Энкодер ретінде Lc0 шахмат нейрондық желісі, ал декодер ретінде нұсқаулар бойынша бапталған тілдік модель қолданылады. Lc0-дің k-қабатының эмбеддингтері тілдік модельдің 2k-қабатының алдына енгізілген Flamingo блогына беріледі, бұл ретте домендік бейімделу кезінде барлық алдын ала оқытылған параметрлер тоқтатылады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Қазіргі шахмат қозғалтқыштары адам мүмкіндігінен жоғары деңгейде ойнайды, бірақ өз шешімдерін түсіндіре алмайды. Принстон зерттеушілері 4 млрд параметрі бар &lt;a href=\"concepts/quality-explanation-and-evaluation-network.html\"&gt;QUEEN&lt;/a&gt; моделін ұсынды, ол сарапшылық шахмат энкодерін тілдік декодермен біріктіреді. Итеративті оқытудың арқасында модель гроссмейстер деңгейіне жетіп, нақты әрі түсінікті жауаптар беру қабілетін сақтап қалды.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;QUEEN моделі 2697 Elo рейтингіне жетті, бұл гроссмейстер деңгейіне сәйкес келеді.&lt;/li&gt;\n&lt;li&gt;Итеративті дистилляция модельдің Elo рейтингін жеті циклде 900 ұпайға арттырды.&lt;/li&gt;\n&lt;li&gt;Архитектура Lc0 сарапшылық қозғалтқышын кросс-attention арқылы тілдік декодермен байланыстырады.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;QUEEN архитектурасы «үнсіз сарапшы» принципін қолданады: Lc0 (Leela Chess Zero) қозғалтқышы негізіндегі энкодер шахматтық тұжырымдамаларды кросс-attention (өзара назар аудару) механизмі арқылы тілдік модельге береді. Оқыту екі кезеңнен тұрады: алдымен тақта күйін түсінуге арналған «сұрақ-жауап» бағдарламасы, содан кейін Беллман теңдеуінен шабыттанған итеративті дистилляция алгоритмі. Жеті итерация барысында модель өз рейтингін 900 ұпайға көтеріп, 2697 Elo деңгейіне жетті.&lt;/p&gt;\n&lt;p&gt;Жүйе үш критерий бойынша бағаланады: дәлдік (ойын күші), негізділік (тактикалық есептер) және байланыстылық (мәтін сапасы). Тесттерде QUEEN GPT-5.6-Sol және Gemini-3.1-Pro сияқты модельдерден озып түсті, сонымен қатар параметрлер саны жағынан әлдеқайда үнемді. Бұл әдіс тар мамандандырылған «қара жәшік» жүйелерін тілдік модельдермен байланыстыруға мүмкіндік береді, бұл робототехника мен басқа да күрделі салаларда түсінікті ИИ жасауға жол ашады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зерттеу шахмат ортасымен шектелген және түсініктемелердің сапасы базалық сарапшылық энкодердің есептеу қуатына тікелей байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Қазіргі шахмат қозғалтқыштары өте жоғары деңгейде ойнайды, бірақ олар өз шешімдерінің логикасын түсіндіре алмайды. Тілдік модельдер (&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;), керісінше, түсінікті мәтіндер жасай алады, алайда олардың ойын деңгейі төмен. Авторлар QUEEN моделін ұсынады — бұл 4 миллиард параметрден тұратын шахматтық тілдік модель, ол гроссмейстер деңгейіндегі ойынды түсіндіру қабілетімен ұштастырады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN моделі 7 итерация барысында өз рейтингін 900 ұпайға арттырып, 2697 Elo деңгейіне жетті.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Әзірлеушілер «энкодер-декодер» архитектурасын қолданды. Ол мамандандырылған шахматтық энкодерді («үнсіз сарапшы») нұсқауларға бейімделген тілдік модельмен кросс-attention механизмі арқылы байланыстырады. Оқыту «сұрақ-жауап» бағдарламасы негізінде жүзеге асады, бұл модельге шахматтық түсініктерді тікелей энкодер ұсынымдарынан алуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Энкодер-декодер — бұл нейрондық желі архитектурасы, мұнда энкодер кіріс деректерді (шахмат позициясын) векторлық түрге келтірсе, декодер оны адам түсінетін мәтінге айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Түсіндірмелердің сапасын арттыру үшін авторлар Беллман теңдеуіне ұқсас итеративті дистилляция алгоритмін қолданды. Модель өзінің ең үздік жүрістерінен кейінгі позицияларды талдап, оларды мәтіндік түсініктемеге біріктіреді және бұл тәжірибені өз салмақтарына қайта дистилляциялайды. Жеті итерация барысында модель рейтингі 1782-ден 2697 Elo-ға дейін көтерілді. QUEEN ойын күші мен шахматтық есептерді шешу дәлдігі бойынша барлық бәсекелестерден асып түсті, дегенмен оның параметрлерінің саны ірі модельдерден үш есе аз. LLM негізіндегі бағалаулар модельдің түсіндірмелері GPT-5.6-Sol деңгейіне жақындайтынын көрсетеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель шахмат саласында оқытылған; бұл әдістің басқа салалардағы тиімділігі қосымша тексеруді талап етеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"hanshajym\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#hanshajym\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ХАНШАЙЫМ&lt;/span&gt;&lt;/a&gt;ХАНШАЙЫМ&lt;/h4&gt;\n&lt;p&gt;1950 жылдан бастап, Клод Шеннон шахмат машиналарының теориялық негізін қалағаннан бері, бұл ойын жасанды интеллект дамуын бағалаудың эталонына айналды. Дәстүрлі шахмат қозғалтқыштары үлкен жетістіктерге жетті, алайда олар өз шешімдерінің логикасын түсіндіре алмайды. Екінші жағынан, заманауи тілдік модельдер (LM) түсіндірме бере алады, бірақ олардың ойын күші мамандандырылған қозғалтқыштардан едәуір төмен. Авторлар QUEEN (QUality Explanation and Evaluation Network) — «энкодер-декодер» архитектурасын ұсынады, ол гроссмейстер деңгейіндегі ойынды сапалы мәтіндік негіздемемен үйлестіреді. 2026 жылғы 2 қазандағы жағдай бойынша әлемде 1899 гроссмейстер бар, бұл белсенді онлайн ойыншылардың 0,01%-дан азын құрайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN гроссмейстер деңгейіндегі қозғалтқыштардың қуатын түсіндірмелілікпен біріктіріп, жасанды интеллектке ең үздік жүрісті таңдап қана қоймай, оны табиғи тілде түсіндіруге мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bajlanysty-zhumystar\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#bajlanysty-zhumystar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;БАЙЛАНЫСТЫ ЖҰМЫСТАР&lt;/span&gt;&lt;/a&gt;БАЙЛАНЫСТЫ ЖҰМЫСТАР&lt;/h4&gt;\n&lt;p&gt;Дәстүрлі шахмат қозғалтқыштары нұсқалар ағашын іздеу және позицияларды сантипешкадағы скалярлық мәнмен бағалау арқылы жұмыс істейді, бұл жеңіске жету ықтималдығына айналдырылады. Stockfish сияқты заманауи жүйелер күрделі қолмен жазылған бағалау функцияларынан нейрондық желілерге көшті. Transformer архитектурасына негізделген модельдер, соның ішінде Leela Chess Zero (Lc0), адамнан жоғары ойын көрсетеді. Сондай-ақ, адамның ойын стиліне еліктеуге бағытталған модельдер (Maia, Allie) бар, бірақ олар өз әрекеттері үшін ауызша түсіндірме бермейді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/centipawn.html\"&gt;Сантипешка&lt;/a&gt; (centipawn) — шахмат қозғалтқыштарындағы артықшылықты өлшеу бірлігі, пешканың 1/100 бөлігіне тең.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тілдік модельдер саласындағы зерттеулер авторегрессивті трансформерлердің шахмат ойнауды үйрене алатынын көрсетті, бірақ жалпы мақсаттағы модельдерді бұл міндетке бейімдеу қиын. Партияларға түсініктемелер жасау бойынша бұрынғы әрекеттер көбінесе жасалған жүрістерді сипаттаумен немесе қозғалтқыштардан жасырын тұжырымдамаларды бөліп алумен шектелген. QUEEN-нің ерекшелігі — модель алдымен жүрісті дербес таңдайды, содан кейін оны негіздейді. Авторлар түсіндірменің сапасы тікелей ойын күшіне байланысты екенін атап өтеді: QUEEN алдыңғы әдістерге қарағанда жоғары ойын күшін көрсеткендіктен, ол жасаған түсіндірмелер жоғары сапаға ие.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN түсіндірмелерінің тиімділігі жүрісті таңдау дәлдігіне байланысты; егер модель позицияны бағалауда қателессе, оның аргументациясы логикалық тұрғыдан дәйекті болғанымен, іс жүзінде қате болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"queen-bizding-zhantasu\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#queen-bizding-zhantasu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;QUEEN: БІЗДІҢ ЖАНТАСУ&lt;/span&gt;&lt;/a&gt;QUEEN: БІЗДІҢ ЖАНТАСУ&lt;/h4&gt;\n&lt;p&gt;QUEEN жобасының мақсаты — шахмат позицияларына табиғи тілде түсініктемелер жасау. Сапалы сипаттама үш элементтен тұрады (3-сурет): ең үздік жүріс ұсынысы, болжамды негізгі нұсқа (PV) және мәтіндік негіздеме. Ұсыныс нақты жүрісті көрсетеді, PV оның салдарларын көрсетеді, ал мәтін балама нұсқаларды талдау арқылы логиканы түсіндіреді. Бұл үшін екі типтегі модельдер қолданылады: шахматтан адамнан жоғары деңгейде ойнайтын Transformer-негізді қозғалтқыштар және еркін мәтін құра алатын, бірақ шахматтық білімі жоқ әмбебап тілдік модельдер (LM). Қозғалтқыштар мәтін жасауға, ал LM ойынды талдауға бейімделмеген. Шахматтағы артықшылық сантипешкамен (пешканың 1/100 бөлігі) өлшенеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN жүйесі шахмат қозғалтқышы Leela (240 млн параметр) мен тілдік модель SmolLM3-ті (3 млрд параметр) сараптамалық түсініктемелер жасау үшін біріктіреді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"31-arhitektura\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#31-arhitektura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 АРХИТЕКТУРА&lt;/span&gt;&lt;/a&gt;3.1 АРХИТЕКТУРА&lt;/h4&gt;\n&lt;p&gt;Шахмат энкодері. Біз Lc0 отбасына жататын BT5 желісін (Leela) қолданамыз. Бұл 15 қабатты, 1024 жасырын өлшемді және 240 млн параметрі бар «тек энкодер» типті модель. Ол 64 токеннен (тақта ұяшықтарының саны бойынша) тұратын тізбекпен жұмыс істейді және нұсқалар ағашын іздемей-ақ жоғары деңгейде ойнайды.&lt;/p&gt;\n&lt;p&gt;Тілдік декодер. Декодер ретінде SmolLM3-3B моделі (36 қабат, 2048 өлшем) таңдалды. Бұл жалпы мақсаттағы модель, нұсқаулық баптаудан өткен, бірақ арнайы шахматтық дайындығы жоқ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Энкодер шахмат позициясын математикалық түрге ауыстырады, ал декодер бұл деректерді адам түсінетін мәтінге айналдырады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Көпір архитектурасы. Біз Flamingo архитектурасынан шабыттанған өзара назар (&lt;a href=\"concepts/cross-attention.html\"&gt;cross-attention&lt;/a&gt;) механизмін қолданамыз. Flamingo-дан айырмашылығы, біз энкодердің әрбір күйін e_i декодердің сәйкес қабатымен d2i байланыстырамыз. Бұл декодерге шахмат позициясының аралық бейнелеріне әртүрлі кезеңдерде жүгінуге мүмкіндік береді.&lt;/p&gt;\n&lt;p&gt;Деректер ағыны. Модель (&lt;a href=\"concepts/forsyth-edwards-notation.html\"&gt;FEN&lt;/a&gt;, мәтін) жұбын қабылдайды. FEN жолы (Форсайт-Эдвардс нотациясы) Leela арқылы өңделіп, контекст жасайды және ол өзара назар қабаттары арқылы SmolLM-ге беріледі. Бұл декодерге мәтін жасаудың әр қадамында шахмат позициясын ескеруге мүмкіндік береді. Біз басқа декодерлерді (Qwen, Gemma) және деректерді интеграциялаудың балама әдістерін (LLaVA-тәрізді архитектура) сынау арқылы абляциялық зерттеулер жүргіздік.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель архитектуралық шешімдерге сүйенеді, мұнда дәлдік энкодердің шахматтық белгілерін декодердің тілдік қабаттарымен байланыстыру сапасына байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"domendi-bejimdeu-enkoderding-zhasyryn-kuejlerin-interpretaciyalau\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#domendi-bejimdeu-enkoderding-zhasyryn-kuejlerin-interpretaciyalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доменді бейімдеу: энкодердің жасырын күйлерін интерпретациялау&lt;/span&gt;&lt;/a&gt;Доменді бейімдеу: энкодердің жасырын күйлерін интерпретациялау&lt;/h4&gt;\n&lt;p&gt;Алдыңғы зерттеулер Leela Chess Zero нейрожелісі шахмат позицияларының негізгі аспектілерін, соның ішінде фигуралардың орналасуын, қолжетімді жүрістер мен тактикалық нұсқаларды кодтайтынын көрсетті. Доменді бейімдеу кезеңінің мақсаты — декодерді осы жасырын белгілерді Leela ұсыныстарынан бөліп алуға үйрету. Ол үшін «сұрақ-жауап» деректер жиынтығы құрылды, онда әрбір мысал позиция p (FEN форматында) және сұраныс q-дан тұрады. Сұраныстар ағымдағы p позициясына немесе 1–8 жүрістен кейін жететін p' позициясына қатысты. Позициялар ашық Lichess деректер жиынтығынан алынған.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PAWN моделі Leela-ның жасырын күйлерінен шахматтық білімді төрт түрлі тапсырма арқылы алуға үйретіледі: тақтаның ағымдағы күйін статикалық талдаудан бастап, болашақ күйлерді болжауға дейін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сұраныстар төрт санатқа бөлінеді (4-суретті қараңыз):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;STATIC-CURRENT: торкөздердегі фигураларды анықтау немесе нақты фигураның координаттарын табу.&lt;/li&gt;\n&lt;li&gt;DYNAMIC-CURRENT: ережелерді талдау, мысалы, барлық заңды жүрістерді, алуларды немесе шахтарды табу.&lt;/li&gt;\n&lt;li&gt;STATIC-FUTURE: жүрістер тізбегінен кейін позицияны қалпына келтіру және статикалық талдау жасау.&lt;/li&gt;\n&lt;li&gt;DYNAMIC-FUTURE: болашақ күйді реконструкциялау мен тактикалық мүмкіндіктерді талдауды біріктіру.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FEN (Forsyth-Edwards Notation) — шахмат тақтасындағы фигуралардың орналасуын бір мәтіндік жол түрінде сипаттауға арналған стандартты нотация.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Токенизацияға байланысты мәселелерді болдырмау үшін авторлар барлық 64 торкөз бен 12 типтегі фигуралар үшін арнайы токендер қосты. Оқыту кезең-кезеңімен жүзеге асырылады: STATIC-CURRENT-тен DYNAMIC-FUTURE-ге дейін. Әр кезеңде алдыңғы сатыдағы сұрақтар ішінара қайталанады, бұл «катастрофалық ұмытудың» алдын алады. Оқыту барысында энкодер мен декодер қатырылған, тек cross-attention параметрлері мен жаңа токен эмбеддингтері жаңартылады. Қорытынды модель PAWN (Position AWare Network) деп аталды.&lt;/p&gt;\n&lt;h4 id=\"iterativti-izdeu-distillyaciyasy-tuesindirme-sapasyn-zhakhsartu\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#iterativti-izdeu-distillyaciyasy-tuesindirme-sapasyn-zhakhsartu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итеративті іздеу дистилляциясы: түсіндірме сапасын жақсарту&lt;/span&gt;&lt;/a&gt;Итеративті іздеу дистилляциясы: түсіндірме сапасын жақсарту&lt;/h4&gt;\n&lt;p&gt;Пәндік салаға бейімделгеннен кейін PAWN моделі шахмат бойынша құрылымдалған сұрақтарға жауап бере алатын болды, бірақ оған қажетті түсіндірме форматындағы мысалдар жетіспеді. Авторлар Lichess ойындары мен есептерінен 15 000 позицияны таңдап алды, олар үшін GPT-5.6-Sol(low) моделі эталондық түсіндірмелер жасады. Әрбір түсіндірме ең үздік жүріс болжамын, негізгі нұсқаны (PV), табиғи тілдегі мәтінді, үш перспективалы жүрісті және позицияны бағалауды қамтыды (3-сурет). Қате немесе ережеге қайшы жүрістері бар жауаптар сүзгіден өткізілгеннен кейін &lt;a href=\"concepts/sft.html\"&gt;SFT&lt;/a&gt; (fine-tuning) жүргізіліп, PAWN-1 моделі пайда болды. Мәтіннің байланыстылығына қарамастан, PAWN-1 «ұстаз» модельдің шектеулі күші және оқу деректер жиынының аздығы салдарынан сапасыз немесе ережеге қайшы жүрістерді ұсынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Итеративті дистилляция процесі түсіндірме сапасын жақсартуға мүмкіндік берді: PAWN-1-ден бастап QUEEN (PAWN-8) финалына дейін жеті оқыту циклі жүзеге асырылды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сапаны жақсарту үшін авторлар AlphaZero-дан шабыттанған тәсілді қолданды: іздеу (MCTS) нәтижелерін пайдаланып, жақсартылған бағаларды нейрожеліге дистилляциялау. Бұл жағдайда MCTS альфа-бета іздеуімен алмастырылды, бұл табиғи тіл үшін Беллман итерациясының аналогы болып табылады. PAWN-(k+1)-ді PAWN-k-дан оқыту процесі бес кезеңнен тұрады: Stockfish қозғалтқышымен ойындардан, адамдардың Lichess-тегі ойындарынан және шахмат есептерінен 400 000 позицияны таңдау; түсіндірмелерді генерациялау; барлық үш ұсынылған жүріс қатесіз болғанша немесе &lt;a href=\"concepts/rekursiya.html\"&gt;рекурсия&lt;/a&gt; тереңдігіне жеткенше рекурсивті іздеу; Qwen3.8-27B көмегімен түсіндірмелерді консолидациялау; және сүзгіден өткен деректер негізінде финалдық оқыту. Қате деп Stockfish эталондық қозғалтқышымен салыстырғанда жеңіске жету ықтималдығын 10% немесе одан да көп төмендететін жүріс түсініледі.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/iteratsiya-po-bellmanu.html\"&gt;Беллман итерациясы&lt;/a&gt; — модель тереңірек іздеу бағаларына сүйене отырып, өз болжамдарын кезең-кезеңімен жақсартатын оқыту әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghalaular\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#baghalaular\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалаулар&lt;/span&gt;&lt;/a&gt;Бағалаулар&lt;/h4&gt;\n&lt;p&gt;Түсіндірме сапасы үш критерий бойынша бағаланады: дәлдік (оңтайлы жүрістерді ұсыну), негізділік (балама нұсқаларды талдау) және дәйектілік (сауатты мәтін, галлюцинациялардың болмауы). Дәлдік Elo рейтингін есептеу арқылы толық ойын симуляцияларымен (4.1-бөлім), негізділік — модельдің қатесіз негізгі нұсқаларды (PV) генерациялау қабілетімен (4.2-бөлім), ал дәйектілік басқа тілдік модельдің көмегімен бағаланады (4.3-бөлім). Салыстыру үшін GPT-5.6-Sol, GPT-5.6-Luna, Gemini-3.1-Pro және C1-4B модельдері таңдап алынды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дәлдік бағасы бекітілген қарсыластарға қарсы симуляцияларға негізделген; нәтижелер іздеу параметрлері мен есептеу бюджетіне байланысты болуы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tolykh-ojyn-simulyaciyalaryndaghy-daeldik\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#tolykh-ojyn-simulyaciyalaryndaghy-daeldik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толық ойын симуляцияларындағы дәлдік&lt;/span&gt;&lt;/a&gt;Толық ойын симуляцияларындағы дәлдік&lt;/h4&gt;\n&lt;p&gt;QUEEN моделі гроссмейстерлік деңгейге жақын ойын көрсетіп, Gemini, SOL, LUNA және C1-4B модельдерінен озып түсті.&lt;/p&gt;\n&lt;h4 id=\"boelingen-poziciyalardaghy-negizdilik\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#boelingen-poziciyalardaghy-negizdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бөлінген позициялардағы негізділік&lt;/span&gt;&lt;/a&gt;Бөлінген позициялардағы негізділік&lt;/h4&gt;\n&lt;p&gt;Негізділікті бағалау үшін болжанған негізгі нұсқадағы (PV) қателердің жоқтығы көрсеткіші (NMR) және бірінші жүрістегі қателердің жоқтығы (FNMR) қолданылады. Сынақ Lichess-тегі 609-дан 2905-ке дейінгі қиындық деңгейіндегі 1 000 тактикалық есепте жүргізілді.&lt;/p&gt;\n&lt;h4 id=\"daeldik-pen-negizdemeni-salystyru\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#daeldik-pen-negizdemeni-salystyru\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дәлдік пен негіздемені салыстыру&lt;/span&gt;&lt;/a&gt;Дәлдік пен негіздемені салыстыру&lt;/h4&gt;\n&lt;p&gt;Модельдердің болжам сапасы тактикалық есептер мен адамдар ойнаған 1000 позицияда бағаланды. NMR (жүрісті таңдау дәлдігі) және FNMR (жалғасын негіздеу дәлдігі) метрикалары қолданылды. QUEEN моделі ең үздік нәтижелерді көрсетті: тактикалық есептерде ол GEMINI-ден NMR бойынша 2%-ға және FNMR бойынша 9%-ға озып, SOL және C1-4B базалық модельдерінен айтарлықтай жоғары нәтиже берді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN тактикалық есептерде де, жалпы позицияларда да басқа модельдерден озып, ең жоғары дәлдік пен негіздемені көрсетеді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tildik-model-baghalauyndaghy-kogerenttilik\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#tildik-model-baghalauyndaghy-kogerenttilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тілдік модель бағалауындағы когеренттілік&lt;/span&gt;&lt;/a&gt;Тілдік модель бағалауындағы когеренттілік&lt;/h4&gt;\n&lt;p&gt;Мәтін сапасы үш өлшем бойынша бағаланды: құрылымдық когеренттілік (нұсқалар ағашының логикасы), концептуалды когеренттілік (шахмат терминдерін қолдану, галлюцинациялардың болмауы) және сөйлеудің еркіндігі. Бағалауды GPT-5.6-Sol моделі 1-ден 5-ке дейінгі шкала бойынша жүргізді. Барлық модельдер жоғары еркіндікті (4.9–5.0 балл) көрсетті. QUEEN құрылымдық когеренттілік үшін 3.51 балл алды, бұл SOL-мен тең, бірақ оның концептуалды когеренттілігі 2.76 балды құрады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Құрылымдық когеренттілік сипаттама сапасына қарамастан, модельдің нұсқалар ағашын қаншалықты логикалық тұрғыда құратынын бағалайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Концептуалды когеренттіліктің салыстырмалы түрде төмендігі итеративті оқыту процесінде галлюцинациялардың жинақталу қаупімен байланысты, бұл әдістің шектеуі болып табылады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"leela-chess-zero-khozghaltkhyshynan-taeuelsizdik-taldauy\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#leela-chess-zero-khozghaltkhyshynan-taeuelsizdik-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Leela Chess Zero қозғалтқышынан тәуелсіздік талдауы&lt;/span&gt;&lt;/a&gt;Leela Chess Zero қозғалтқышынан тәуелсіздік талдауы&lt;/h4&gt;\n&lt;p&gt;Модельдің Lc0 қозғалтқышының стратегиясын көшірмейтінін тексеру үшін кемінде бес жүріс жеңіске жету ықтималдығы бойынша оңтайлыға жақын болатын 1000 позиция талданды. 53.8% жағдайда (1000-ның 538-і) QUEEN Leela таңдағанынан өзгеше жүрісті жасады, мұнда 39.1% жағдайда бұл жүріс ең үздік 5-тікке кірді. Бұл модельдің Leela саясатын жай ғана қайталамай, өз шешімдерін қабылдайтынын растайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN 53.8% жағдайда Leela ұсыныстарынан өзгеше жүрістерді таңдайды, бұл оның дербес шешім қабылдау қабілетін дәлелдейді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 1.&lt;/strong&gt; 32 партиядан кейінгі Lichess Elo рейтингіне байланған болжамды рейтингтер&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;Elo (Lichess)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;QUEEN&lt;/td&gt;\n&lt;td&gt;2697&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Leela&lt;/td&gt;\n&lt;td&gt;2650&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;SOL&lt;/td&gt;\n&lt;td&gt;2085&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GEMINI&lt;/td&gt;\n&lt;td&gt;2240&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;C1-4B&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Барлық frontier модельдері жоғары есептеу күшін пайдаланады. C1-4B барлық 32 партияда жеңілді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 7.&lt;/strong&gt; Оқыту кезеңдері бойынша деректердің бөлінуі&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Деректер көзі&lt;/th&gt;\n&lt;th&gt;CURR-STATIC&lt;/th&gt;\n&lt;th&gt;CURR-DYNAMIC&lt;/th&gt;\n&lt;th&gt;FUTURE-STATIC&lt;/th&gt;\n&lt;th&gt;FUTURE-DYNAMIC&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1-кезең деректері&lt;/td&gt;\n&lt;td&gt;100%&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2-кезең деректері&lt;/td&gt;\n&lt;td&gt;10%&lt;/td&gt;\n&lt;td&gt;90%&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3-кезең деректері&lt;/td&gt;\n&lt;td&gt;6%&lt;/td&gt;\n&lt;td&gt;8%&lt;/td&gt;\n&lt;td&gt;86%&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4-кезең деректері&lt;/td&gt;\n&lt;td&gt;6%&lt;/td&gt;\n&lt;td&gt;6%&lt;/td&gt;\n&lt;td&gt;8%&lt;/td&gt;\n&lt;td&gt;80%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 9.&lt;/strong&gt; Төрт кезеңдік оқу бағдарламасы үшін оқыту гиперпараметрлері&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;Мәні&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Барлық кезеңдерге ортақ гиперпараметрлер бір рет көрсетілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 10.&lt;/strong&gt; Біздің модельдің бөлінген тест жиынтығындағы дәлдігі&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Метрика&lt;/th&gt;\n&lt;th&gt;Мәні&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 2.&lt;/strong&gt; Substantiation evaluation on 1,000 tactical and 1,000 general positions. NMR is the fraction of predicted PVs containing no mistakes;FNMR is the fraction of positions in which the model’s predicted best move is not a mistake. All frontier models use high reasoning effort.QUEEN performs the best across all metrics on both tactical and general positions.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT2.jpg\" alt=\"Кесте 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 3.&lt;/strong&gt; Evaluationofthevariousmodelsoncoherenceandfluency.Frontiermodelsusehigh reasoning effort. All models are fluent in their output.GEMINI obtains the best structural coherence, though QUEEN and SOL obtain comparable scores.QUEEN struggles with conceptual coherence, as iterative search-distillation cannot teach it to verbalize and describe motifs it hasn’t seen.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT3.jpg\" alt=\"Кесте 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 4.&lt;/strong&gt; Ablations of QUEEN evaluated after SOL-seeding.Both the encoder and curriculum are essential for a good initialization. Ablations. WeablatetheLeelaencoderand domain-adaptationstagefromQUEENtoquantify theirimportance.Becauseiterativesearchdistillation requires costly data generation, we evaluate the ablationsimmediatelyaftertheGPT-5.6-Solseedingstage. TheencoderablationreplacesLeela withadictionary-formrepresentationofthecompleteboardstate(e.g.,“WhiteKing:e1,...”),containingthesameinformationastheFEN.TherepresentationispasseddirectlytotheLMwithoutan encoder or cross-attention, while retaining the same domain-adaptation curriculum.The curriculum ablationskipsthedomainadaptationphaseoftrainingbutkeepstheLeelaencoder.Weevaluate both on playing strength Elo and first-move no-mistake rate (FNMR) on the 1,000 tactical positions. As shown in Table 4, removing either component substantially degrades the model, indicating that both are important for producing a strong initialization for iterative search-distillation.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT4.jpg\" alt=\"Кесте 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 5.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT5.jpg\" alt=\"Кесте 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 6.&lt;/strong&gt; PerformanceofQUEENwith andwithoutfrontier-modeldistillation. TheHCEvariantusesanalternative dataconstructionpipelinebasedon Stockfish’s hand-crafted evaluation. Moving away from frontier LM annotation. Finally, weinvestigatewhetherQUEENcanachievestrongperformance without being seeded with explanations from a frontiermodel.Tothisend,weconstructanalternative trainingdatasetfromfeaturesderivedfromStockfish’s hand-craftedevaluation(HCE),usingthemtogenerate templatic explanations for each position.We use this data to replace theSOL-seeded training round,while keeping the remainder of the training procedure unchanged. In Table6,theHCEvariantshowsasimilartrajectoryofElo improvementtoQUEEN,suggestingthatfrontier-model distillationisnotstrictlynecessaryforQUEENtolearntogeneratehigh-qualityexplanations.We report an example of its explanations and full details of the data-generation procedure in Section D.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT6.jpg\" alt=\"Кесте 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Кесте 8.&lt;/strong&gt; Datacompositionofthefourstagesofdomainadaptationtraining.Rowsandcolumns correspondtothefinalstagedatamixtureanddatasourcesdescribedabove.Earlier-stagedatais replayed at a small proportion to prevent forgetting.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT8.jpg\" alt=\"Кесте 8\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"khorytyndy-zhaene-bolashaghy\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#khorytyndy-zhaene-bolashaghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды және болашағы&lt;/span&gt;&lt;/a&gt;Қорытынды және болашағы&lt;/h4&gt;\n&lt;p&gt;QUEEN әдісі алдыңғы тәсілдермен және қазіргі заманғы тілдік модельдермен салыстырғанда сапалы түсініктемелер береді. Жүйе ұсынатын жүрістер бойынша ұсынымдар жоғары дәлдікпен ерекшеленеді, бұл Эло рейтингінің айтарлықтай өсуімен және негізгі нұсқалар бойынша неғұрлым дәлелді талдаумен расталады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN ұсынымдар дәлдігі мен аргументация сапасы бойынша аналогтардан озық, сонымен қатар мәтіннің байланыстылығы мен еркіндігі жетекші тілдік модельдер деңгейінде сақталады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;QUEEN шахмат материалында әзірленіп, сыналғанымен, ұсынылған архитектура әмбебап болып табылады. Ол тілдік модельді алдын ала оқытылған сараптамалық энкодермен біріктіру механизмін білдіреді. Оқыту процедурасы кез келген күйді сақтайтын орта (stateful environment) үшін қолданылатын итеративті жақсарту алгоритмін қамтиды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ekspertnyy-enkoder.html\"&gt;Сараптамалық энкодер&lt;/a&gt; — бұл белгілі бір саланың (мысалы, шахмат) ережелері мен стратегиясын «түсінетін» мамандандырылған модель, ол тілдік модельге шешім қабылдау үшін нақты деректерді ұсынады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Бұл тәсіл сараптамалық энкодерлер қолжетімді салаларда, соның ішінде робототехника мен компьютерлік жүйелерді басқаруда тілдік модельдерді енгізу мүмкіндіктерін ашады. Мұндай жағдайларда сараптамалық модельдер домендік бағалауды қамтамасыз етеді, ал тілдік модельдер бұл сигналдарды адамға түсінікті және логикалық талдауға жарамды түсініктемелерге айналдырады.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f2.jpg\" alt=\"2-сурет: Біз Flamingo (Alayrac et al., 2022) негізіндегі энкодер-декодер архитектурасын қолданамыз. Энкодер ретінде Lc0 \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;2-сурет: Біз Flamingo (Alayrac et al., 2022) негізіндегі энкодер-декодер архитектурасын қолданамыз. Энкодер ретінде Lc0 шахмат нейрондық желісі, ал декодер ретінде нұсқаулар бойынша бапталған тілдік модель қолданылады. Lc0-дің k-қабатының эмбеддингтері тілдік модельдің 2k-қабатының алдына енгізілген Flamingo блогына беріледі, бұл ретте домендік бейімделу кезінде барлық алдын ала оқытылған параметрлер тоқтатылады.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f4.jpg\" alt=\"4-сурет: Домендік бейімделу модельді тақтаның ағымдағы күйіндегі статикалық белгілерді алуға (STATIC-CURRENT), қолжетімд\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Домендік бейімделу модельді тақтаның ағымдағы күйіндегі статикалық белгілерді алуға (STATIC-CURRENT), қолжетімді жүрістер мен өзара әрекеттесулер туралы пайымдауға (DYNAMIC-CURRENT), жүрістер тізбегінен тақтаның болашақ күйін қалпына келтіруге (STATIC-FUTURE) және ақыр соңында нәтижелік позиция туралы пайымдауға (DYNAMIC-FUTURE) біртіндеп үйретеді.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f5.jpg\" alt=\"5-сурет: Біз итеративті түрде өзін-өзі жетілдіру үшін іздеу процесінде жинақталған түсіндірмелерді модельге қайта дистил\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;5-сурет: Біз итеративті түрде өзін-өзі жетілдіру үшін іздеу процесінде жинақталған түсіндірмелерді модельге қайта дистилляциялаймыз. Беллман жаңартуына ұқсас, жинақталған түсіндірме қай жүрістің ең үздік екенін және басқа жүрістердің кемшіліктерін түсіндіру үшін төменгі түйіндердегі түсіндірмелерді біріктіреді.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Шахмат&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;қозғалтқыштары&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жүрісті&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;түсіндірмейді&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Lc0 энкодері&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мен тілдік&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модельді&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ұштастыру&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;2697 Elo&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рейтингі және&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;түсінікті&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;жауаптар&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Басқа&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;салаларға&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;арналған&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;түсінікті ИИ&lt;/text&gt;&lt;text x=\"626\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рецепті&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;fact_check&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Adithya Bhaskar, Jeffrey Cheng, Danqi Chen&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница п
