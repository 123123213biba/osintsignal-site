        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"145\" cy=\"177\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"675\" cy=\"165\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · FACT_CHECK   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ғылым қайда бет алды: Drift&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Inspector зерттеулер&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;эволюциясын қадағалайды&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f1.jpg\" alt=\"1-сурет: EMNLP 2020–2025 жылдардағы 16 576 атомдық тұжырымды қамтитын интерактивті WebGL картасын ұсынатын Drift Inspect\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: EMNLP 2020–2025 жылдардағы 16 576 атомдық тұжырымды қамтитын интерактивті WebGL картасын ұсынатын &lt;a href=\"concepts/drift-inspector.html\"&gt;Drift Inspector&lt;/a&gt; интерфейсінің карта көрінісі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: EMNLP 2020–2025 жылдардағы 16 576 атомдық тұжырымды қамтитын интерактивті WebGL картасын ұсынатын Drift Inspector интерфейсінің карта көрінісі. Жоғарғы панельдегі қойындылар режимдерді (Карта, Трендтер, Кластерлер, Салыстыру немесе Әдістер) ауыстыруға мүмкіндік береді. Пайдаланушы жыл бойынша сүзгіні, түс режимін (Кластер немесе Дрейф тренді) реттей алады немесе кластерлер бойынша сәйкестік рейтингімен тұжырымдарды іздей алады. Оң жақта сүзу мүмкіндігі бар кластерлер тізімі орналасқан. Нүктеге меңзерді апарғанда тұжырым мен кластердің таралу траекториясы көрсетіледі; басқан кезде бастапқы мақалаға сілтемесі бар карта бекітіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Ғылыми жарияланымдар санының өсуі зерттеу бағытындағы өзгерістерді бақылауды қиындатты. Drift Inspector жүйесі абстрактіден автордың нақты үлесін бөліп алып, артық ақпаратты сүзгіден өткізеді. Бұл әдіс NLP саласының классикалық тапсырмалардан пайымдау мен мультимодальдылыққа қалай ауысып жатқанын анық көрсетеді.&lt;/p&gt;\n&lt;h2 id=\"basty-ojlar\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#basty-ojlar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Басты ойлар&lt;/span&gt;&lt;/a&gt;Басты ойлар&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;EMNLP (2020–2025) бойынша 16,576 атомдық мәлімдеме алынды.&lt;/li&gt;\n&lt;li&gt;Ғылыми үлестерді кодтау үшін SPECTER2 моделі қолданылды.&lt;/li&gt;\n&lt;li&gt;Интерактивті карта зерттеу ағынын визуализациялайды.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tolyghyrakh\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#tolyghyrakh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Толығырақ&lt;/span&gt;&lt;/a&gt;Толығырақ&lt;/h2&gt;\n&lt;p&gt;Жүйе &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; (Qwen3-235B) көмегімен абстрактілерді «&lt;a href=\"concepts/atomarnyy-vklad.html\"&gt;атомдық үлес&lt;/a&gt; мәлімдемелеріне» (&lt;a href=\"concepts/acc.html\"&gt;ACCs&lt;/a&gt;) — тексеруге болатын тұжырымдарға айналдырады. Бұл мәлімдемелер дәйексөздер байланысы негізінде оқытылған SPECTER2 моделі арқылы векторланып, семантикалық кеңістікте орналастырылады. &lt;a href=\"concepts/klasterizatsiya.html\"&gt;Кластерлеу&lt;/a&gt; үшін &lt;a href=\"concepts/hdbscan.html\"&gt;HDBSCAN&lt;/a&gt; алгоритмі қолданылады, ол тығыз топтарды анықтап, бірегей зерттеулерді «шу» ретінде бөліп көрсетеді.&lt;/p&gt;\n&lt;p&gt;Деректер базасы ACL Anthology-дан алынған 346 мың мәлімдеме мен 80 мың абстрактіні қамтиды. WebGL интерфейсі арқылы әрбір трендті тікелей бастапқы мақалаға дейін қадағалауға болады. Жүйе конференциялар мен авторлар арасындағы айырмашылықтарды талдап, кілт сөздер статистикасы көрсете алмайтын терең өзгерістерді ашып береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Шектеулер&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер LLM экстракциясының сапасына байланысты және мәлімдемелердің 36%-ы кластерленбеген шу болып қалады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Мақаланың толық талдауы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"tuejindeme\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#tuejindeme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Түйіндеме&lt;/span&gt;&lt;/a&gt;Түйіндеме&lt;/h3&gt;\n&lt;p&gt;Ғылыми аннотациялар көбінесе зерттеу үлесін контекстпен, мотивациямен және мета-сипаттамалармен араластырып жібереді. Сол себепті автоматтандырылған құралдар жұмыс нәтижелерін жалпы талқылаудан ажыратып алуда қиналады. Осы мәселені шешу үшін Drift Inspector жүйесі ұсынылды — бұл «атомдық үлес талаптары» (Atomic Contribution Claims, ACCs) арқылы ғылыми салалардың эволюциясын талдауға арналған ашық кодты құрал.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атомдық үлес талаптары (ACC) — бұл үлкен тілдік модельдер (LLM) көмегімен аннотация мәтінінен контексттен тыс бөлініп алынған жұмыс нәтижелері туралы негізгі тезистер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе LLM көмегімен аннотациялардан ACC-ді бөліп алады және оларды жылдар бойынша интерактивті картаға топтастырады. Бұл кез келген анықталған тенденцияны нақты талаптармен және түпнұсқа ғылыми мақалалармен байланыстыруға мүмкіндік береді. Әзірлеушілер жүйені алты жыл ішіндегі EMNLP конференциясының материалдарына қолданды. Деректерді бөліп алу дәлдігін тексеру үшін адам сараптамасы пайдаланылды, ал кластерлеу қолмен жасалған сыртқы таксономиямен салыстырылды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шектеу: талдау дәлдігі LLM моделі арқылы талаптарды бөліп алу сапасына және валидация үшін қолданылған қолмен жасалған таксономияның дұрыстығына тікелей байланысты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;EMNLP деректерін талдау NLP саласының классикалық міндеттерден LLM дәуірінің мүмкіндіктеріне, мысалы, пайымдау (reasoning) мен мультимодальдылыққа ауысып жатқанын көрсетті. Авторлардың атап өтуінше, мұндай өзгерісті кілт сөздерді қарапайым санау немесе аннотацияны тұтастай талдау әдістерімен байқау мүмкін емес. Жарияланған деректер жиынтығы бүкіл ACL Anthology кітапханасын қамтиды, оның ішінде 346 000 талап, 80 000 аннотация және 423 дереккөз бар.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drift Inspector жүйесі 80 000 аннотациядан 346 000 талапты талдап, NLP зерттеулерінің пайымдау мен мультимодальдылыққа ауысқанын анықтады.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"kirispe\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#kirispe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кіріспе&lt;/span&gt;&lt;/a&gt;Кіріспе&lt;/h3&gt;\n&lt;h4 id=\"atomdykh-ueles-turaly-maelimdemeler-acc\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#atomdykh-ueles-turaly-maelimdemeler-acc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атомдық үлес туралы мәлімдемелер (ACC)&lt;/span&gt;&lt;/a&gt;Атомдық үлес туралы мәлімдемелер (ACC)&lt;/h4&gt;\n&lt;p&gt;ACL, EMNLP, NeurIPS және CVPR сияқты ірі AI конференцияларында жарияланымдар санының артуы оларды қолмен талдауды мүмкін етпейді. LLM көмегімен мақала жазуды автоматтандыру бұл үдерісті одан әрі жеделдетуде. Қолданыстағы жүйелер (NLP Scholar, NLPExplorer, CL Scholar) сөздердің жиілігіне немесе тақырыптық модельдеуге (LDA, BERTopic) негізделген, бірақ олар мақаланың мотивациялық бөлігі мен нақты ғылыми үлесін ажырата алмайды. Drift Inspector жүйесі «атомдық үлес талаптарын» (Atomic Contribution Claims, ACC) — яғни кіріспе сөздер мен басқа жұмыстардың сипаттамасынан тазартылған, тексерілетін тезистерді бөліп алу арқылы осы мәселені шешеді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drift Inspector ACC көмегімен мақаланың не туралы айтатыны мен ғылымға не қосқанын ажыратып, идеялардың эволюциясын бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ACC — бұл мақаланың контекстінен тыс, дербес тексерілетін ең аз ғылыми үлес бірлігі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Жүйе SPECTER2 моделін қолдана отырып, талаптарды эмбеддингтейді, оларды жылдар бойынша кластерлейді және тақырыптардың даму траекториясын визуализациялайды. Веб-интерфейс деректерді жылдар, авторлар және конференциялар бойынша сүзгіден өткізуге мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"aedebietti-zertteu-zhuejeleri\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#aedebietti-zertteu-zhuejeleri\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Әдебиетті зерттеу жүйелері&lt;/span&gt;&lt;/a&gt;Әдебиетті зерттеу жүйелері&lt;/h4&gt;\n&lt;p&gt;NLP-KG немесе GenGo сияқты жүйелер кілт сөздер немесе метадеректер деңгейінде жұмыс істейді. Drift Inspector терминдер жиілігінен гөрі семантикалық үлес бірліктерін талдауымен ерекшеленеді. Ол трендтердің жылу карталарын (heatmap) жасауға және когорталарды салыстыруға мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"tildik-tehnologiyalardyng-nlp-diahrondykh-taldauy\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#tildik-tehnologiyalardyng-nlp-diahrondykh-taldauy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тілдік технологиялардың (NLP) диахрондық талдауы&lt;/span&gt;&lt;/a&gt;Тілдік технологиялардың (NLP) диахрондық талдауы&lt;/h4&gt;\n&lt;p&gt;Бұрынғы зерттеулер идеялардың бірге кездесуі немесе таксономиялар арқылы парадигмалардың өзгеруін бақылаған. Drift Inspector болса «төменнен жоғарыға» (bottom-up) тәсілін қолданады, бұл кластерлердің автоматты түрде қалыптасуына және талдау циклін бірыңғай құралға біріктіруге мүмкіндік береді.&lt;/p&gt;\n&lt;h4 id=\"atomdykh-semantikalykh-birlikter\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#atomdykh-semantikalykh-birlikter\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атомдық семантикалық бірліктер&lt;/span&gt;&lt;/a&gt;Атомдық семантикалық бірліктер&lt;/h4&gt;\n&lt;p&gt;ACC деңгейіндегі декомпозиция FActScore және атомдық контент бірліктерінің қағидаларына негізделген. Біз бұл тәсілді ғылыми метрикаға бейімдедік, мұнда ACC есептеу бірлігі ретінде қызмет етеді, ал олардың ақиқаттығы бастапқы мақалаға сүйенеді.&lt;/p&gt;\n&lt;h4 id=\"zhueje-sipattamasy\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#zhueje-sipattamasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Жүйе сипаттамасы&lt;/span&gt;&lt;/a&gt;Жүйе сипаттамасы&lt;/h4&gt;\n&lt;p&gt;Drift Inspector жұмыс процесі офлайн кезең (экстракция, кластерлеу, статистика) және онлайн кезең (интерактивті визуализация, Сурет 1 және Сурет 2) болып бөлінеді.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f1.jpg\" alt=\"1-сурет: EMNLP 2020–2025 жылдардағы 16 576 атомдық тұжырымды қамтитын интерактивті WebGL картасын ұсынатын Drift Inspect\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;1-сурет: EMNLP 2020–2025 жылдардағы 16 576 атомдық тұжырымды қамтитын интерактивті WebGL картасын ұсынатын Drift Inspector интерфейсінің карта көрінісі.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;1-сурет: EMNLP 2020–2025 жылдардағы 16 576 атомдық тұжырымды қамтитын интерактивті WebGL картасын ұсынатын Drift Inspector интерфейсінің карта көрінісі. Жоғарғы панельдегі қойындылар режимдерді (Карта, Трендтер, Кластерлер, Салыстыру немесе Әдістер) ауыстыруға мүмкіндік береді. Пайдаланушы жыл бойынша сүзгіні, түс режимін (Кластер немесе Дрейф тренді) реттей алады немесе кластерлер бойынша сәйкестік рейтингімен тұжырымдарды іздей алады. Оң жақта сүзу мүмкіндігі бар кластерлер тізімі орналасқан. Нүктеге меңзерді апарғанда тұжырым мен кластердің таралу траекториясы көрсетіледі; басқан кезде бастапқы мақалаға сілтемесі бар карта бекітіледі.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"atomdykh-ueles-turaly-maelimdemeler\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#atomdykh-ueles-turaly-maelimdemeler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атомдық үлес туралы мәлімдемелер&lt;/span&gt;&lt;/a&gt;Атомдық үлес туралы мәлімдемелер&lt;/h4&gt;\n&lt;p&gt;Авторлар ғылыми мақалалардың аннотациясынан «атомдық үлестерді» (Atomic Contribution Claims, ACC) бөліп алады — бұл мета-тілден және контексттен тазартылған, тексерілуі мүмкін қысқа тұжырымдар. Ол үшін qwen3-235b-a22b-thinking-2507 LLM моделі (температура 0,2) қолданылады. Аннотацияларды таңдау олардың қолжетімділігі мен стандартталғандығына негізделген. 2020–2025 жылдар аралығындағы EMNLP конференцияларында жүйе әр аннотациядан орташа есеппен 3,58 (2020 ж.) мен 4,01 (2025 ж.) аралығындағы тұжырымды бөліп алды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атомдық үлес — бұл әдіс немесе нәтиже туралы кіріспе сөздер мен есімдіктерден ада, нақты әрі тексерілуі мүмкін бір ғана тұжырым.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"semantikalykh-topologiya\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#semantikalykh-topologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Семантикалық топология&lt;/span&gt;&lt;/a&gt;Семантикалық топология&lt;/h4&gt;\n&lt;p&gt;Семантиканы талдау үшін тұжырымдар SPECTER2 моделі арқылы кодталады, содан кейін UMAP арқылы өлшемі кішірейтіліп, HDBSCAN алгоритмімен кластерленеді. Бұл 80 тақырыптық кластерді бөліп алуға мүмкіндік береді. Тұжырымдардың шамамен 36%-ы «шу» ретінде жіктеледі — бұлар әлі де болса салалық деңгейдегі қайталанатын үлгіге айналмаған бірегей үлестер. Олардың үлесі 2020–2022 жылдардағы 31–34%-дан 2025 жылы 42%-ға дейін өсті. Тығыздыққа негізделген кластерлеу «шуды» негізгі тақырыптық топтардың шекарасын бұзбай, фондық қабат ретінде сақтап қалуға мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;2025 жылғы үлестердің шамамен 42%-ы бірегей болып табылады және тұрақты тақырыптық кластерлерді құрамайды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"auytkhudy-sandykh-baghalau\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#auytkhudy-sandykh-baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ауытқуды сандық бағалау&lt;/span&gt;&lt;/a&gt;Ауытқуды сандық бағалау&lt;/h4&gt;\n&lt;p&gt;Тақырыптың таралуы жыл ішіндегі мақалаларда кездесу жиілігі P_y(c) арқылы бағаланады. Бұл бір мақалада бір түрдегі көптеген тұжырымдар болған жағдайдағы бұрмалауларды болдырмайды. Жүйе абсолютті ауытқуды Δ DF(c), салыстырмалы өзгерісті RDF(c) және тренд картасындағы түстік индикацияны анықтайтын логарифмдік дрейф коэффициентін есептейді.&lt;/p&gt;\n&lt;h4 id=\"drift-inspector-interfejsi\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#drift-inspector-interfejsi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Drift Inspector интерфейсі&lt;/span&gt;&lt;/a&gt;Drift Inspector интерфейсі&lt;/h4&gt;\n&lt;p&gt;Интерфейс бес модульден тұратын веб-қосымша болып табылады: «Карта» (16 576 тұжырымның интерактивті визуализациясы), «Трендтер» (салыстырмалы графиктер), «Кластерлер» (егжей-тегжейлі профильдер), «Салыстыру» (екі таңдаманы талдау) және «Әдістер». Барлық деректер интерактивті және ACL Anthology-дағы түпнұсқа мақалаларға өтуге мүмкіндік береді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Визуализация 16 576 тұжырымға негізделген; интерфейс деректерді жылдар бойынша сүзгіден өткізуге мүмкіндік береді, алайда трендтерді түсіндіру кезінде жаңа әдістердің тұрақты кластерлерді қалыптастырып үлгермеуі мүмкін екенін ескеру қажет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"iske-asyru-zhaene-kholzhetimdilik\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#iske-asyru-zhaene-kholzhetimdilik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Іске асыру және қолжетімділік&lt;/span&gt;&lt;/a&gt;Іске асыру және қолжетімділік&lt;/h4&gt;\n&lt;p&gt;Деректерді өңдеу конвейері Python тілінде transformers, adapters, umap-learn, hdbscan және Plotly кітапханаларын қолдану арқылы жасалған. Әр кезең аралық нәтижелерді (CSV файлдары, &lt;a href=\"concepts/embedding.html\"&gt;эмбеддинг&lt;/a&gt; матрицалары, проекциялар, кластерлер) кэштейді, ал стохастикалық процестер seed арқылы бекітіледі, бұл кластерлеудің конфигурациялық файлдардан қайта өндірілуін қамтамасыз етеді. Деректерді қайта шығару жалпы көрсеткіштерді қайталайды, бірақ LLM декодтау ерекшеліктеріне байланысты бірдей жолдарды бермеуі мүмкін. Бүкіл процесті минималды API шығындарымен және есептеу ресурстарымен қайталауға болады. Пайдаланушы интерфейсі сыртқы тәуелділіктерді қажет етпейтін дербес файл болып табылады. Код MIT лицензиясымен, ал деректер жинағы CC BY 4.0 лицензиясымен шығарылған. B қосымшасында &lt;a href=\"concepts/ekstraktor.html\"&gt;экстрактор&lt;/a&gt; параметрлері, эмбеддинг чекпоинттары және кластерлеу гиперпараметрлері көрсетілген.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жүйе кластерлеудің толық қайталануын қамтамасыз етеді және кез келген көлемдегі корпустарды минималды шығынмен талдауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Масштабталуы ACL Anthology толық корпусында (80 144 абстракт, 423 конференция, 346 010 мәлімдеме) gpt-oss-120b экстракторы арқылы расталды. Өңдеу құны шамамен 40 АҚШ долларын құрады. Drift Inspector құралы конференциялар мен авторлар арасындағы когорталарды бір басу арқылы салыстыруға мүмкіндік береді (3-сурет). EMNLP корпусында әдіс кластерлердің жарамдылығын және тақырыптардың ығысуының барлық 15 бағытын сақтайды. Сыртқы төреші (LLM) 300 мәлімдемеден тұратын таңдамаларды 96,7–99,7% «Good» дәлдікпен бағалады (бақылау тобында 98,3%).&lt;/p&gt;\n&lt;h4 id=\"masshtabtalu-zhaene-khuny\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#masshtabtalu-zhaene-khuny\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Масштабталу және құны&lt;/span&gt;&lt;/a&gt;Масштабталу және құны&lt;/h4&gt;\n&lt;p&gt;Экстракция құны корпус көлеміне сызықтық тәуелді (1-кесте). gpt-oss-120b қолдану 1000 абстракт үшін шамамен 0,50 АҚШ долларын құрайды. Qwen3-235B-Thinking сияқты күрделірек модельдер жасырын пайымдау шығындарына байланысты 1000 абстракт үшін шамамен 11 АҚШ долларын құрайды, бұл ретте мәлімдемелерді бөліп алу сапасы мұндай қуатты қажет етпейді. Экстракциядан кейінгі барлық операциялар (эмбеддинг, проекциялар, кластерлеу) қарапайым ноутбукта бір сағаттан аз уақытта орындалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экстрактор — бұл мәтіннен ғылыми мәлімдемелерді бөліп алатын модель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"baghalau\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#baghalau\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бағалау&lt;/span&gt;&lt;/a&gt;Бағалау&lt;/h4&gt;\n&lt;p&gt;Авторлар екі маңызды кезеңді бағалайды: мәлімдемелерді бөліп алу сапасы және кластерлердің жарамдылығы (EMNLP 2020–2025 корпусы). Сапа теріс бақылау мысалдары бар стратификацияланған таңдамада, ал кластерлердің жарамдылығы SToP таксономиясымен қиылысатын 653 мақалада тексеріледі.&lt;/p&gt;\n&lt;h4 id=\"maelimdemeler-sapasyn-adamnyng-tekserui\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#maelimdemeler-sapasyn-adamnyng-tekserui\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мәлімдемелер сапасын адамның тексеруі&lt;/span&gt;&lt;/a&gt;Мәлімдемелер сапасын адамның тексеруі&lt;/h4&gt;\n&lt;p&gt;Үш сарапшы 180 элементті (136 кездейсоқ мәлімдеме және 44 арнайы енгізілген қате мысал) белгілеп шықты. Мәлімдеме атомарлы, өзін-өзі қамтамасыз ететін және ғылыми үлес қосса, «Good» деп есептеледі. Сарапшылардың келісімі жоғары (Fleiss’ κ = 0,844). Сарапшылар 97,8%, 91,8% және 90,5% мәлімдемелерді «Good» деп бағалады және 100% (44/44) енгізілген теріс мысалдарды анықтады. Тәуелсіз төреші (Gemini LLM) сарапшылар пікірімен 94,5% жағдайда сәйкес келді (κ = 0,863).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бағалау шектеулі таңдамада өткізілді, модельдердің негізгі қатесі — зерттеу нәтижелерінің орнына фондық контексті бөліп алу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"syrtkhy-taksonomiyagha-khatysty-klasterlerding-zharamdylyghy\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#syrtkhy-taksonomiyagha-khatysty-klasterlerding-zharamdylyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сыртқы таксономияға қатысты кластерлердің жарамдылығы&lt;/span&gt;&lt;/a&gt;Сыртқы таксономияға қатысты кластерлердің жарамдылығы&lt;/h4&gt;\n&lt;p&gt;Кластерлеу 653 мақала (2020–2021) бойынша SToP таксономиясының алтын стандартымен салыстырылды. Сегіз конфигурация, соның ішінде тақырыптық модельдеу (LDA, NMF), абстракт деңгейіндегі нейрондық кластерлеу (SPECTER2 және MPNet энкодерлерімен BERTopic) және ұсынылған мәлімдеме деңгейіндегі кластерлеу (ACC) салыстырылды.&lt;/p&gt;\n&lt;h4 id=\"negizgi-tuzhyrymdardyng-turakhtylyghy\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#negizgi-tuzhyrymdardyng-turakhtylyghy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Негізгі тұжырымдардың тұрақтылығы&lt;/span&gt;&lt;/a&gt;Негізгі тұжырымдардың тұрақтылығы&lt;/h4&gt;\n&lt;p&gt;Зерттеудің басты нәтижесі — 2020–2025 жылдар аралығындағы тақырыптардың таралуындағы өзгерістерді көрсететін 15 кластер. Авторлар бұл деректердің тұрақтылығын алты параметр бойынша тексереді: статистикалық маңыздылық, уақытша кесінділер, энкодер таңдауы, кластерлерді сәйкестендіру ережелері, экстракция моделі және кластерлеу гиперпараметрлері. Барлық 15 ауытқу статистикалық тұрғыдан маңызды (екі пропорция үшін z-тест, p &amp;lt; 0,001) және 95%-дық &lt;a href=\"concepts/butstrep.html\"&gt;бутстреп&lt;/a&gt; сенімділік интервалдары нөлді жоққа шығарады.&lt;/p&gt;\n&lt;h4 id=\"eki-kesindi\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#eki-kesindi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Екі кесінді&lt;/span&gt;&lt;/a&gt;Екі кесінді&lt;/h4&gt;\n&lt;p&gt;Алты жыл ішіндегі трендтер монотонды (мысалы, парсинг үлесі 5,1%-дан 0,1%-ға дейін төмендеді), бұл тек бастапқы және соңғы нүктелерді салыстыруда артефактілердің жоқтығын растайды. Энкодерлерді ауыстырғанда (8 нейрондық желі моделі және TF-IDF + SVD сыналды) нәтижелер тұрақты қалды: 15 жағдайдың 11–14-інде тренд бағыты сақталды. Кластерлерді сәйкестендіру ережелерін өзгерту немесе басқа экстракция моделін (gpt-oss-120b) қолдану да бастапқы 15 трендті растайды. Кластерлеу гиперпараметрлерінің 36 комбинациясын қайта қарау (UMAP және HDBSCAN) ARI 0,79–0,95 индексін береді және барлық 15 негізгі тұжырымды сақтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бутстреп — тұжырымдардың сенімділігін тексеру үшін деректерді қайта-қайта таңдап алу арқылы жүргізілетін статистикалық бағалау әдісі.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;EMNLP конференциясының 4 488 мақаласын талдау классикалық тапсырмалар үлесінің төмендегенін көрсетеді: парсинг 4,9 п.п.-ға (2020 жылға қарағанда 97%-ға), машиналық аударма және диалогтық жүйелер 3,7–4,4 п.п.-ға қысқарды. Олардың орнын LLM дәуірінің тақырыптары басты: мультимодальды модельдер 3,1 есе (+9,1 п.п.), ал агенттер 10 еседен астам (10,3 есе) өсті. Жойылып бара жатқан тапсырмалар толығымен жоғалып кетпейді, керісінше фрагменттеліп, «шу» қабатына немесе көршілес кластерлерге өтіп кетеді.&lt;/p&gt;\n&lt;h4 id=\"kholdanu-zhaghdajlary\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#kholdanu-zhaghdajlary\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қолдану жағдайлары&lt;/span&gt;&lt;/a&gt;Қолдану жағдайлары&lt;/h4&gt;\n&lt;p&gt;Жүйе зерттеушілерге бағыттардың перспективасын бағалауға мүмкіндік береді. Мысалы, «retrieval» сұранысы бойынша іздеуде кластер үлесінің 2020 жылғы 0,7%-дан 2025 жылғы 3,3%-ға дейін өскенін көруге болады. Сондай-ақ құрал әртүрлі конференцияларды (мысалы, ACL және COLING) немесе авторлар когорталарын салыстыруға мүмкіндік береді, бұл BERT және LLM тақырыптарын салыстыру үшін 5-суретте көрсетілгендей, олардың тақырыптық профильдеріндегі айырмашылықтарды анықтайды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Нәтижелер нақты конференциялардың ерекшеліктерін көрсетеді және бүкіл NLP саласына толықтай қатысты болмауы мүмкін.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ne-damyp-zhatyr,-al-ne-artta-khalyp-barady\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#ne-damyp-zhatyr,-al-ne-artta-khalyp-barady\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Не дамып жатыр, ал не артта қалып барады?&lt;/span&gt;&lt;/a&gt;Не дамып жатыр, ал не артта қалып барады?&lt;/h4&gt;\n&lt;p&gt;Trends алгоритмі әрбір тақырыптық кластерді 2020-2025 жылдар аралығындағы өзгерістер динамикасы негізінде сараптап, сенімділікті бағалау үшін бутстреп-интервалдарын қолданады. Бұл қарама-қайшы трендтерді визуализациялауға мүмкіндік береді: бір полюсте LLM логикалық пайымдаулары (LLM reasoning) мен визуалды-тілдік модельдер (vision-language modeling) орналасса, екінші полюсте синтаксистік талдау тұр, оның үлесі 4,9 пайыздық тармаққа төмендеді, бұл салыстырмалы түрде 97%-ға құлдырауды білдіреді.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синтаксистік талдау бойынша зерттеулер іс жүзінде тоқтады және 2020 жылмен салыстырғанда 97%-ға қысқарды, ал логикалық пайымдау жасайтын және мультимодальды модельдер негізгі бағыттарға айналды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таралу көрсеткіші кемінде бір мәлімдемені қамтитын мақалаларды есепке алатындықтан, әдіснама сөніп бара жатқан салалар мен толығымен жойылып кеткен тақырыптарды ажыратуға мүмкіндік береді. Мәлімдемелер бойынша іздеу синтаксистік талдаудың қалдық ескертулері енді дербес топ құрмай, «шу қабаты» немесе көршілес кластерлер бойынша шашырап кеткенін көрсетеді. Тар мамандандырылған терминдер үшін де осындай жағдай байқалады: мысалы, «юмор» тақырыбы бойынша іздегенде, нәтижелердің басым бөлігі шу қабатынан табылады және олардың әрқайсысы өзінің бастапқы мақаласымен байланысын сақтап қалады.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Түсіндірме&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/butstrep-intervaly.html\"&gt;Бутстреп-интервалдары&lt;/a&gt; — бұл деректерді қайта-қайта таңдап алу арқылы анықталған трендтердің қаншалықты сенімді екенін бағалауға көмектесетін статистикалық әдіс.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"khorytyndy\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#khorytyndy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Қорытынды&lt;/span&gt;&lt;/a&gt;Қорытынды&lt;/h3&gt;\n&lt;p&gt;Drift Inspector расталған тұжырымдарды алу құбырын ғылыми саланың қалай өзгеретінін бақылауға арналған интерактивті құралға айналдырады. Жүйе авторлардың мотивациялық лексикасынан гөрі, олар өз үлесі ретінде мәлімдеген нәрселерді көрсетеді. Құрал толығымен ашық (MIT коды, CC BY деректері) және корпусқа тәуелді емес: аннотациялары бар кез келген алаңды бір өтуде талдауға болады. Келесі &lt;a href=\"concepts/step.html\"&gt;қадам&lt;/a&gt; — кластерлерді навигацияланатын супер-тақырыптарға біріктіретін иерархиялық жүйені енгізу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Маңызды&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drift Inspector деректер мен кодтың толық ашықтығын қамтамасыз ете отырып, жарияланған үлестер негізінде ғылыми трендтер динамикасын бақылауға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shekteuler\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#shekteuler\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шектеулер&lt;/span&gt;&lt;/a&gt;Шектеулер&lt;/h4&gt;\n&lt;p&gt;Талдау аннотацияларға сүйенеді, олар көбінесе техникалық нюанстар мен теріс нәтижелерді өткізіп алады, ал кейбір үлестер тек мақаланың негізгі мәтінінде болуы мүмкін. Расталған нәтижелер тек бір конференциямен (EMNLP) шектелген. Біз шығарған үлкенірек деректер жинақтары (алты ACL алаңы) тек &lt;a href=\"concepts/llm-sudya.html\"&gt;LLM-төреші&lt;/a&gt; арқылы бақыланған, адам тарапынан қайта тексерілмеген, сондықтан олардың кластер бойынша сандарына сақтықпен қарау керек.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Абайлаңыз&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Адам қатысуынсыз автоматты LLM тексеруі негізінде алынған нәтижелер дәлелдеудің төменірек деңгейіне ие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Құбыр LLM-экстракторына сүйенеді, ол қателіктерге (галлюцинациялар, деректерді қате бөлу) жол беруі мүмкін. Бұл тәуекелдер валидация схемалары мен LLM-төреші арқылы азайтылғанымен, олар толығымен жойылмаған. Адам тарапынан валидация авторлармен 136 тұжырым бойынша жүргізілген, сондықтан келісім деңгейі ішінара ортақ дайындықты көрсетеді, ал теріс мысалдар табиғи қателер емес, арнайы жасалған бұрмалаулар болып табылады. Кластерлеу UMAP/HDBSCAN гиперпараметрлері мен эмбеддинг моделіне тәуелді. Тақырыптың ығысу бағыттары бутстреп-ресемплинг, сегіз энкодер және лексикалық өкілдікте тұрақты, бірақ кластер шекаралары мен белгілері өзгеруі мүмкін, ал ығысу статистикасы себептік емес, сипаттамалық сипатқа ие.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f3.jpg\" alt=\"3-сурет: Салыстыру режимі, конференциялар бойынша когорталар (алты алаңға арналған тірі дана): ACL мен COLING арасындағы\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;3-сурет: Салыстыру режимі, конференциялар бойынша когорталар (алты алаңға арналған тірі дана): ACL мен COLING арасындағы ең үлкен айырмашылықтар, кластер тұжырымдарының үлесіндегі алшақтық ретінде.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Суреттің толық сипаттамасы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;3-сурет: Салыстыру режимі, конференциялар бойынша когорталар (алты алаңға арналған тірі дана): ACL мен COLING арасындағы ең үлкен айырмашылықтар, кластер тұжырымдарының үлесіндегі алшақтық ретінде. COLING классикалық NLP (эмбеддингтер, аспектіге негізделген сентимент талдауы, NER, оқиғаларды бөліп алу) профилін күштірек сақтайды, ал ACL LLM дәуірінің кластерлеріне (тиімді пайымдау, көптілді LLM, көру–тіл бағалауы) бейім. Чиптер визуализацияны (таралатын графиктер / гантельдер / шашырау диаграммалары) ауыстырады; дәл осы режим авторлар мен кілт сөздер бойынша анықталған когорталарды салыстыруға мүмкіндік береді.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f4.jpg\" alt=\"4-сурет: Жүйемен өлшенген EMNLP (2020–2025) ғылыми дрейфі. Таралатын бағандар ең көп өсіп және кемитін ACC кластерлері ү\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;4-сурет: Жүйемен өлшенген EMNLP (2020–2025) ғылыми дрейфі. Таралатын бағандар ең көп өсіп және кемитін ACC кластерлері үшін мақала деңгейіндегі құжаттар жиілігінің өзгеруін (пайыздық тармақтарда) көрсетеді, 2020 және 2025 жылдардағы үлестерімен түсіндірілген.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f5.jpg\" alt=\"Сурет 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Сурет 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f6.jpg\" alt=\"6-сурет: Ең көп кемитін және ең көп өсетін сегіз ACC кластері үшін жылдық құжаттар жиілігінің траекториялары (мақала дең\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;6-сурет: Ең көп кемитін және ең көп өсетін сегіз ACC кластері үшін жылдық құжаттар жиілігінің траекториялары (мақала деңгейіндегі DF, мақалалардың %), канондық кластерлеу негізінде есептелген. Белгілер кластерлердің қысқаша атаулары; толық атаулары мен c-TF-IDF дескрипторлары шығарылған деректермен бірге ұсынылады. Соңғы нүктелердегі өзгерістер статистикалық маңызды, bootstrap CI нөлді қамтымайды (§4.3).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f7.jpg\" alt=\"7-сурет: Бір конференция үшін диахрондық көрініс (Салыстыру, уақыт өте келе, bump chart): жылдық құжаттар жиілігі бойынш\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;7-сурет: Бір конференция үшін диахрондық көрініс (Салыстыру, уақыт өте келе, bump chart): жылдық құжаттар жиілігі бойынша рейтингтелген EMNLP-тің үздік кластерлері (1 = ең жиі кездесетін). Көру–тіл модельдеуі 2024 жылға қарай 1-орынға жетеді; LLM тиімділігі 14-орыннан 3–5-орынға көтеріледі; summarization 31-орынға түседі.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"zertteu-syzbasy\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#zertteu-syzbasy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зерттеу сызбасы&lt;/span&gt;&lt;/a&gt;Зерттеу сызбасы&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;СҰРАҚ&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI саласындағы&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мақалалар&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;көптігі&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ӘДІС&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атомдық&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мәлімдемелерді&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;бөлу&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;НӘТИЖЕ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;трендтердің&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;интерактивті&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;картасы&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МАҢЫЗЫ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ғылым&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;эволюциясын&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ашық талдау&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт әлі рецензиядан өтпеген. Қорытындылар алдын ала.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"derekkoez\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#derekkoez\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөз&lt;/span&gt;&lt;/a&gt;Дереккөз&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Санат&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Препринт лицензиясы&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;fact_check&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторлар: Vsevolod Karimov, Stepan Ostarkov, Anastasia Poroshina, Anatoly Frolov, Alexander Panchenko&lt;/p&gt;\n&lt;h3 id=\"derekkoezder\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#derekkoezder\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дереккөздер&lt;/span&gt;&lt;/a&gt;Дереккөздер&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Дереккөз&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Сілтеме&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница преп
