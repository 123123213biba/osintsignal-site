le":"Нейрожелілердегі біржақтылықты жүйені бұзбай қалай тексеруге болады","text":"&lt;p&gt;Жаңа ALeBi аудиті алгоритмдердегі кемсітушілікті модель құпиялылығын сақтай отырып анықтауға мүмкіндік береді.&lt;/p&gt;\n","links":[{"url":"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-card.jpg"},"content":{"title":"Жасанды интеллект орман өрттерін спутниктерден тезірек анықтайды","text":"&lt;p&gt;CatBoost алгоритмі өрт ошақтарын стандартты жүйелерге қарағанда дәлірек және жылдам, әсіресе түнде анықтай алады.&lt;/p&gt;\n","links":[{"url":"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/language-models-that-play-chess-and-explain-their-moves-card.jpg"},"content":{"title":"Шахмат қозғалтқыштары неге үндемейді: ИИ-ді өз жүрістерін түсіндіруге үйрету","text":"&lt;p&gt;Жаңа QUEEN моделі шахмат қозғалтқыштарының күшін тілдік модельдердің логикасымен біріктіріп, неге бұл жүрістің ең үздігі екенін түсіндіреді.&lt;/p&gt;\n","links":[{"url":"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-card.jpg"},"content":{"title":"LLM жұмысын 14&amp;nbsp;есе жылдамдату: Galahad технологиясы","text":"&lt;p&gt;Модельдер уақытының 98%-ын бір мәтінді қайта оқуға жұмсайды. Galahad бұл процесті бір реттік шығынға айналдырады.&lt;/p&gt;\n","links":[{"url":"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-card.jpg"},"content":{"title":"Триггерсіз өтірік: нейрожелінің дұрыс жауабы неге қате шешімге әкелуі мүмкін","text":"&lt;p&gt;Зерттеушілер жасанды интеллект дұрыс жауап бергенімен, жасырын дезинформация негізінде қате шешім қабылдауы мүмкін екенін анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo-card.jpg"},"content":{"title":"SecJev: киберқауіпсіздік саласындағы шешім қабылдаушы жаңа интеллект","text":"&lt;p&gt;SecJev модельдері желілік трафик пен қауіпсіздік саясатын талдап, нақты шешімдер қабылдауға маманданған.&lt;/p&gt;\n","links":[{"url":"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica-card.jpg"},"content":{"title":"Неге ірі тілдік модельдер пациенттер жағдайының динамикасын дұрыс бағаламайды","text":"&lt;p&gt;Медицинадағы жасанды интеллект пациенттің денсаулығы туралы жаңа деректер пайда болғанда өз болжамдарын жаңартуда жиі қателеседі.&lt;/p&gt;\n","links":[{"url":"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-card.jpg"},"content":{"title":"Шенеуніктер есептен сөздерді алып тастап, ғылыми зерттеулерді қалай &amp;laquo;жоқ қылады&amp;raquo;","text":"&lt;p&gt;2025 жылы NIH гранттардан DEI терминдерін алып тастауды талап етті. Нәтижесінде зерттеулер жалғасуда, бірақ статистика оларды көрмейді.&lt;/p&gt;\n","links":[{"url":"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-card.jpg"},"content":{"title":"Нейрожелілер неге &amp;laquo;өтірік айтады&amp;raquo;: оқыту мен нәтиже арасындағы алшақтық","text":"&lt;p&gt;Зерттеушілер визуалды модельдердің оқыту кезінде неге оңай алданатынын, бірақ еркін режимде тұрақты болатынын анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-card.jpg"},"content":{"title":"Кіші нейрожелілер неге тапсырмаларды орындай алмайды: мәселе интеллектте емес","text":"&lt;p&gt;Зерттеу көрсеткендей, ықшам модельдер (2-9B) стандартты ортаны арнайы құралдармен ауыстырғанда тиімді жұмыс істейді.&lt;/p&gt;\n","links":[{"url":"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/learning-to-structure-data-from-user-generated-thematic-corp-card.jpg"},"content":{"title":"Дайын үлгісіз бейберекет жазбалардан нақты деректер қорын қалай құруға болады","text":"&lt;p&gt;Жаңа алгоритм желілік мәтіндерден жасырын параметрлерді тауып, оларды кестеге адам деңгейінде түсіреді.&lt;/p&gt;\n","links":[{"url":"2026-10-04/learning-to-structure-data-from-user-generated-thematic-corp.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur-card.jpg"},"content":{"title":"Жасанды интеллектке арналған өтірік детекторлары: неге олар рөлдік ойындарда қателеседі","text":"&lt;p&gt;Нейрожелілердің жауаптарындағы өтірікті анықтайтын алгоритмдер рөлдік ойынды шындық деп қабылдайды. Бұл неге орын алатынын талдаймыз.&lt;/p&gt;\n","links":[{"url":"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-card.jpg"},"content":{"title":"Ғылым қайда бет алды: Drift Inspector зерттеулер эволюциясын қадағалайды","text":"&lt;p&gt;Ғалымдар мыңдаған ғылыми мақаланы интерактивті тренд картасына айналдыратын құрал жасады.&lt;/p&gt;\n","links":[{"url":"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-card.jpg"},"content":{"title":"Жасанды интеллект өзін ұмытқанда: агент тұлғасы қалай жоғалады?","text":"&lt;p&gt;Сіздің AI көмекшіңіз әдеттегідей сөйлесуі мүмкін, бірақ ол іштей өзін жоғалтып қойған болуы ықтимал.&lt;/p&gt;\n","links":[{"url":"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/architecture-without-an-architect-global-governance-of-artif-card.jpg"},"content":{"title":"Жасанды интеллектті кім басқарады: жаһандық ережелер сәулетшісі туралы аңыз","text":"&lt;p&gt;Әлем ЖИ-ді тізгіндеуге тырысуда, бірақ бірыңғай басқару орталығы жоқ. Ережелер сәулеті неге бас сәулетшісіз құрылып жатқанын талдаймыз.&lt;/p&gt;\n","links":[{"url":"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-card.jpg"},"content":{"title":"Жасанды интеллект жазған ғылыми мақалалар неге бірдей?","text":"&lt;p&gt;Зерттеушілер жасанды интеллект жазған ғылыми мақалалардың кіріспесі адамдардікіне қарағанда тым болжамды екенін анықтады.&lt;/p&gt;\n","links":[{"url":"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-card.jpg"},"content":{"title":"Жасанды интеллект көмегімен қатесіз инфографика жасау жолы","text":"&lt;p&gt;InfoAgent жүйесі инфографикадағы әр элементті нақты деректермен байланыстырып, қателерді автоматты түрде түзеуге мүмкіндік береді.&lt;/p&gt;\n","links":[{"url":"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-card.jpg"},"content":{"title":"Нейрожелілердің дәлдігі: тұрақтылық иллюзиясы","text":"&lt;p&gt;Біз жасанды интеллектті орташа баллмен бағалауға үйренгенбіз, бірақ сұранысты жай ғана қайта құру модельді қателікке жетелеуі мүмкін.&lt;/p&gt;\n","links":[{"url":"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-card.jpg"},"content":{"title":"Машина төрешісі: нейрожелілер неге ең сапалы емес, бірінші кездескен суретті таңдайды","text":"&lt;p&gt;Суреттерді таңдау алгоритмдері жиі бұрмалаушылыққа ұшырайды: олар сапалысын емес, тізімде бірінші тұрғанын таңдайды.&lt;/p&gt;\n","links":[{"url":"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-card.jpg"},"content":{"title":"AI-агентке жасалатын шабуылды алдын ала болжау әдісі","text":"&lt;p&gt;SSH жүйесі AI қорғанысын шахмат ойынына айналдырып, қауіпті қадамдарды іске аспай тұрып анықтайды.&lt;/p&gt;\n","links":[{"url":"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/out-of-network-attention-dynamics-on-bluesky-card.jpg"},"content":{"title":"Әлеуметтік желідегі таңдау: алгоритмдер ме, әлде таныс орта&amp;nbsp;ма?","text":"&lt;p&gt;Bluesky зерттеуі көрсеткендей, біздің назарымыздың 80%-ы жазылымдарымыздан небәрі екі қадам қашықтықта ғана шектеледі.&lt;/p&gt;\n","links":[{"url":"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp-card.jpg"},"content":{"title":"Нейрожелілер неге жағымпазданады: өтірік пен салқынқандылық тұзағы","text":"&lt;p&gt;ЖИ көбіне соқыр келісім мен дөрекілік арасында таңдау жасайды. FIGS бенчмаркі модельдерді адал әрі эмпатиялы болуға үйретеді.&lt;/p&gt;\n","links":[{"url":"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval-card.jpg"},"content":{"title":"Жасанды интеллект іздеу жүйелерін оңтайландыру неге күткендей жұмыс істемейді","text":"&lt;p&gt;Нейрожелі жауабына бір рет түскен дереккөз ұзақ уақытқа бекітіледі. «Әңгімелесуді басып алу» феноменін талдаймыз.&lt;/p&gt;\n","links":[{"url":"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-card.jpg"},"content":{"title":"Бұлтты нейрожелілердегі деректерді қалай қауіпсіз өңдеуге болады","text":"&lt;p&gt;Жаңа ReCast әдісі есептеу дәлдігін жоғалтпай, бұлтты модельдерге қорғалған деректерді жіберуге мүмкіндік береді.&lt;/p&gt;\n","links":[{"url":"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html","text":"Оқу","arrow":true,"theme":"normal"}]}},{"type":"layou
