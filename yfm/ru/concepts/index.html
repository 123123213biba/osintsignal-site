            {"data":{"leading":false,"html":"&lt;p&gt;Понятия из статей выпусков — по статье на каждое: что это, как о нём пишут исследователи, с чем связано и где встречается.&lt;/p&gt;\n&lt;p&gt;29 концепций.&lt;/p&gt;\n&lt;h2 id=\"specialnost\"&gt;&lt;a href=\"concepts/index.html#specialnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Специальность&lt;/span&gt;&lt;/a&gt;Специальность&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geo.html\"&gt;Спутники и геоданные&lt;/a&gt; — Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt; — Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt; — Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-methods.html\"&gt;Методы и этика&lt;/a&gt; — Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"process\"&gt;&lt;a href=\"concepts/index.html#process\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Процесс&lt;/span&gt;&lt;/a&gt;Процесс&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-image_forensics.html\"&gt;Криминалистика изображений&lt;/a&gt; — Следы монтажа, метаданные, сжатие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic.html\"&gt;Синтетические медиа&lt;/a&gt; — Детекция сгенерированных изображений, голоса и видео.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-provenance.html\"&gt;Происхождение и водяные знаки&lt;/a&gt; — C2PA, цифровые подписи контента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sat_imagery.html\"&gt;Анализ спутниковых снимков&lt;/a&gt; — Sentinel, Landsat, разрешение, индексы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geolocation.html\"&gt;Геолокация по изображению&lt;/a&gt; — Где сделан снимок: рельеф, дороги, тени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-change_detection.html\"&gt;Обнаружение изменений&lt;/a&gt; — Что изменилось между снимками: застройка, леса, разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-night_lights.html\"&gt;Ночные огни и косвенные признаки&lt;/a&gt; — Экономика и события по свечению городов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-osm_gis.html\"&gt;OpenStreetMap и ГИС&lt;/a&gt; — Открытые карты, геоданные, пространственный анализ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-coordination.html\"&gt;Скоординированное поведение&lt;/a&gt; — Синхронные публикации, сети аккаунтов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bots.html\"&gt;Боты&lt;/a&gt; — Автоматические аккаунты и их поиск.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-narratives.html\"&gt;Нарративы и дезинформация&lt;/a&gt; — Отслеживание сюжетов и ложных утверждений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-platforms.html\"&gt;Платформы&lt;/a&gt; — Telegram, YouTube, X: особенности данных и доступа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-diffusion.html\"&gt;Распространение и виральность&lt;/a&gt; — Как сообщения расходятся по сети.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-legal_data.html\"&gt;Суды и законы&lt;/a&gt; — Открытые решения, законодательные базы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-web_archives.html\"&gt;Веб-архивы&lt;/a&gt; — Wayback Machine, сохранение и сравнение страниц.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-tooling.html\"&gt;Инструменты и пайплайны&lt;/a&gt; — Открытые инструменты и их сравнение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-datasets.html\"&gt;Датасеты и бенчмарки&lt;/a&gt; — Размеченные наборы для проверки методов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crowdsourcing.html\"&gt;Краудсорсинг и разметка&lt;/a&gt; — Как сообщества помогают проверять.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ethics.html\"&gt;Этика и приватность&lt;/a&gt; — Где граница: защита персональных данных, риски исследований.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Понятия из статей выпусков — по статье на каждое: что это, как о нём пишут исследователи, с чем связано и где встречается."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Концепции","description":"Понятия из статей выпусков — по статье на каждое: что это, как о нём пишут исследователи, с чем связано и где встречается.","vcsPath":"concepts/index.md"},"headings":[{"title":"Специальность","href":"concepts/index.html#specialnost","level":2},{"title":"Процесс","href":"concepts/index.html#process","level":2}],"title":"Концепции"},"router":{"pathname":"concepts/index","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":t
