        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Метрика&lt;/strong&gt; · &lt;em&gt;Mean Absolute Error&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Средняя абсолютная ошибка (MAE) — это метрика качества прогнозирования, отражающая среднее значение отклонений между предсказанными и фактическими данными.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Средняя абсолютная ошибка (Mean Absolute Error, MAE) — это метрика качества, измеряющая среднее арифметическое модулей отклонений между предсказанными значениями и фактическими данными. Она показывает, насколько в среднем ошибается модель в тех же единицах измерения, в которых представлены исходные данные.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;MAE является показателем точности прогнозирования. В отличие от среднеквадратического отклонения, которое возводит ошибки в квадрат и тем самым придает больший вес крупным выбросам, MAE учитывает все отклонения линейно. Это делает метрику интерпретируемой: если модель предсказывает количество объектов на спутниковом снимке, значение MAE, равное 5, означает, что в среднем прогноз отклоняется от реальности на 5 объектов.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс вычисления MAE включает три этапа: вычисление разности между каждым предсказанным значением и фактическим, взятие модуля этой разности для исключения отрицательных значений и нахождение среднего арифметического всех полученных модулей. Результат процесса — одно число, характеризующее общую точность модели на заданном наборе данных.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для расчета MAE используются библиотеки машинного обучения, такие как scikit-learn в Python. Метод требует наличия двух массивов данных: вектора предсказаний и вектора истинных значений. Важно, чтобы оба массива имели одинаковую размерность и содержали сопоставимые данные.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Метрика используется для оценки эффективности алгоритмов в различных областях. В статье «Считаем объекты на спутниковых снимках без дообучения нейросетей» MAE помогает понять, насколько точно модель определяет количество зданий или кораблей при смене региона. В исследовании «Почему большие языковые модели плохо справляются с динамикой состояния пациентов» метрика применяется для анализа ошибок ИИ при обновлении прогнозов о здоровье человека на основе новых данных.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;MAE не учитывает направление ошибки: модель может систематически завышать или занижать показатели, но метрика покажет только среднюю величину отклонения. Также MAE не чувствительна к редким, но критически важным аномалиям, так как не штрафует их сильнее, чем мелкие ошибки. При интерпретации результатов важно помнить, что MAE — это лишь усредненный показатель, который не отражает распределение ошибок внутри выборки.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Средняя абсолютная ошибка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%92%D1%85%D0%BE%D0%B4%D0%BD%D1%8B%D0%B5%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5%5D%20--%3E%20B%5B%D0%A0%D0%B0%D1%81%D1%87%D0%B5%D1%82%20%D1%80%D0%B0%D0%B7%D0%BD%D0%BE%D1%81%D1%82%D0%B8%5D%0A%20%20B%20--%3E%20C%5B%D0%92%D0%B7%D1%8F%D1%82%D0%B8%D0%B5%20%D0%BC%D0%BE%D0%B4%D1%83%D0%BB%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%A1%D1%83%D0%BC%D0%BC%D0%B8%D1%80%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D0%B5%5D%0A%20%20D%20--%3E%20E%5B%D0%94%D0%B5%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%20%D0%BD%D0%B0%20%D0%BA%D0%BE%D0%BB%D0%B8%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE%5D%0A%20%20E%20--%3E%20F%5BMAE%20%D1%80%D0%B5%D0%B7%D1%83%D0%BB%D1%8C%D1%82%D0%B0%D1%82%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение проверено автоматически и ждёт утверждения редакцией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"kak-ob-etom-pishut-v-statyah\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#kak-ob-etom-pishut-v-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как об этом пишут в статьях&lt;/span&gt;&lt;/a&gt;Как об этом пишут в статьях&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Средняя абсолютная ошибка (MAE) на целевых доменах DOTA составила 174,132.&lt;/p&gt;\n&lt;p&gt;— &lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html\"&gt;Считаем объекты на спутниковых снимках без дообучения нейросетей&lt;/a&gt;&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"spravka\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#spravka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справка&lt;/span&gt;&lt;/a&gt;Справка&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;значение&lt;/td&gt;\n&lt;td&gt;174.132&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;increase&lt;/td&gt;\n&lt;td&gt;3.62&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;unit&lt;/td&gt;\n&lt;td&gt;percentage points&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"drugie-nazvaniya\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#drugie-nazvaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие названия&lt;/span&gt;&lt;/a&gt;Другие названия&lt;/h2&gt;\n&lt;p&gt;MAE, Средняя абсолютная ошибка прогноза&lt;/p&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html\"&gt;Считаем объекты на спутниковых снимках без дообучения нейросетей&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica.html\"&gt;Почему большие языковые модели плохо справляются с динамикой состояния пациентов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt; · &lt;a href=\"reference/metrics.html\"&gt;Метрики&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/mean-absolute-error.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%80%D0%B5%D0%B4%D0%BD%D0%B5%D0%BA%D0%B2%D0%B0%D0%B4%D1%80%D0%B0%D1%82%D0%B8%D1%87%D0%B5%D1%81%D0%BA%D0%BE%D0%B5_%D0%BE%D1%82%D0%BA%D0%BB%D0%BE%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Среднеквадратическое отклонение — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1161/hyp.0000000000000087\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Measurement of Blood Pressure in Humans: A Scientific Statement From the American Heart Association&lt;/a&gt; — обзор, Hypertension 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1021/acs.chemrev.0c01111\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Machine Learning Force Fields&lt;/a&gt; — обзор, Chem Rev 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/s12966-015-0314-1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Systematic review of the validity and reliability of consumer-wearable activity trackers&lt;/a&gt; — обзор, Int J Behav Nutr Phys Act 2015&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Средняя абсолютная ошибка (MAE) — это метрика качества прогнозирования, отражающая среднее значение отклонений между предсказанными и фактическими данными."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle
