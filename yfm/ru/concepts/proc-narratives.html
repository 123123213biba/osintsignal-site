        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Tracking misinformation narratives and propaganda&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/proc-narratives.jpg\" alt=\"Нарративы и дезинформация\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: ParentingPatch, CC BY-SA 3.0&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:Narrative_Books_on_Library_Shelf.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-narratives.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Отслеживание сюжетов и ложных утверждений.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-narratives.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Нарративы и дезинформация представляют собой процесс распространения структурированных смысловых конструкций, направленных на формирование или изменение общественного мнения. В контексте OSINT это исследование того, как идеи, правдивые или ложные, распространяются в информационных сетях, влияя на восприятие реальности.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-narratives.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Нарратив — это информационная сущность, представляющая собой связную историю или интерпретацию событий, которая задает контекст для восприятия фактов. Дезинформация является видом информационной сущности, содержащей заведомо ложные или искаженные сведения, распространяемые с целью введения в заблуждение. В основе этого процесса лежит теория диффузии инноваций, описывающая, как новые идеи проходят путь от источника к массовой аудитории через социальные связи. Нарративы часто эксплуатируют социальный стресс и предрассудки, делая аудиторию более восприимчивой к определенным интерпретациям событий.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-narratives.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс формирования нарратива включает создание ядра сообщения, его адаптацию под конкретную целевую группу и многократное повторение через различные каналы связи. Информационные кампании используют скоординированное поведение, чтобы создать иллюзию массовой поддержки идеи. Виральность достигается за счет эмоциональной окраски сообщений, которая стимулирует пользователей делиться контентом, повышая его охват в алгоритмических лентах платформ.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-narratives.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Анализ нарративов включает сбор данных из открытых источников, их классификацию по тематическим кластерам и отслеживание динамики распространения. Исследователи используют методы сетевого анализа для выявления узлов-распространителей и оценки связности сообществ. Важным этапом является проверка фактов путем сопоставления содержания с верифицированными данными из независимых реестров и первичных источников.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-narratives.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Методы анализа нарративов используются для выявления манипуляций в медиапространстве. Например, в статье «Почему нейросети поддакивают: ловушка лести и холодного безразличия» рассматривается, как алгоритмы могут непреднамеренно усиливать искажения, подстраиваясь под ожидания пользователя. Также эти методы применяются для мониторинга кампаний влияния, где ложные утверждения используются для дестабилизации общественного мнения в различных странах.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-narratives.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основное ограничение заключается в сложности отделения скоординированной дезинформации от органического обсуждения. Исследователи сталкиваются с проблемой смешивающих факторов, когда реальные социальные процессы могут имитировать признаки искусственной кампании. Кроме того, анализ всегда является наблюдательным, что не позволяет однозначно доказать причинно-следственную связь между конкретным нарративом и изменением поведения аудитории.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Нарративы и дезинформация&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D0%BA%D3%A9%D0%B7%5D%20--%3E%20B%5B%D0%9D%D0%B0%D1%80%D1%80%D0%B0%D1%82%D0%B8%D0%B2%5D%0A%20%20B%20--%3E%20C%5B%D0%A2%D0%B0%D1%80%D0%B0%D1%82%D1%83%20%D0%B0%D1%80%D0%BD%D0%B0%D1%81%D1%8B%5D%0A%20%20C%20--%3E%20D%5B%D0%90%D1%83%D0%B4%D0%B8%D1%82%D0%BE%D1%80%D0%B8%D1%8F%5D%0A%20%20D%20--%3E%20E%5B%D2%9A%D0%BE%D2%93%D0%B0%D0%BC%D0%B4%D1%8B%D2%9B%20%D0%BF%D1%96%D0%BA%D1%96%D1%80%5D%0A%20%20F%5B%D0%94%D0%B5%D0%B7%D0%B8%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F%5D%20--%3E%20B%0A%20%20C%20--%3E%7C%D0%92%D0%B8%D1%80%D0%B0%D0%BB%D0%B4%D1%8B%D0%BB%D1%8B%D2%9B%7C%20D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-narratives.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt; — Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-coordination.html\"&gt;Скоординированное поведение&lt;/a&gt; — Синхронные публикации, сети аккаунтов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bots.html\"&gt;Боты&lt;/a&gt; — Автоматические аккаунты и их поиск.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-platforms.html\"&gt;Платформы&lt;/a&gt; — Telegram, YouTube, X: особенности данных и доступа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-diffusion.html\"&gt;Распространение и виральность&lt;/a&gt; — Как сообщения расходятся по сети.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-narratives.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html\"&gt;ИИ-дезинформация: как отличить реальную угрозу от цифрового шума&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html\"&gt;Ложь без триггеров: почему правильный ответ нейросети не гарантирует верное решение&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html\"&gt;Кто управляет искусственным интеллектом: миф об архитекторе глобальных правил&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp.html\"&gt;Почему нейросети поддакивают: ловушка лести и холодного безразличия&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-narratives.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D0%B9%D1%81%D0%BA%D0%B0%D1%8F_%D0%B4%D0%B5%D0%B7%D0%B8%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Российская дезинформация — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Narrative_Books_on_Library_Shelf.JPG\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: ParentingPatch, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1037/0033-2909.129.5.674\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Prejudice, social stress, and mental health in lesbian, gay, and bisexual populations: conceptual issues and research evidence&lt;/a&gt; — обзор, Psychol Bull 2003&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/j.0887-378x.2004.00325.x\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Diffusion of innovations in service organizations: systematic review and recommendations&lt;/a&gt; — обзор, Milbank Q 2004&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41579-022-00846-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Long COVID: major findings, mechanisms and recommendations&lt;/a&gt; — обзор, Nat Rev Microbiol 2023&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generato
