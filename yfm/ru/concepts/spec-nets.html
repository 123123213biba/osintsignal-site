        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"concepts/spec-nets.jpg\" alt=\"Информационные кампании и сети\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Иллюстрация: Неизвестный художник (не указан в выходных данных плаката; отсутствует авторская монограмма или подпись), Public domain&lt;/em&gt; · &lt;a href=\"https://commons.wikimedia.org/wiki/File:1-%D0%B9_%D0%92%D1%81%D0%B5%D1%80%D0%BE%D1%81%D1%81%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9_%D0%BA%D0%BD%D0%B8%D0%B3%D0%BE%D1%80%D0%BE%D0%B7%D1%8B%D0%B3%D1%80%D1%8B%D1%88_%C2%AB%D0%9A%D0%BD%D0%B8%D0%B3%D0%B0_%D0%B2%D0%BC%D0%B5%D1%81%D1%82%D0%BE_%D0%B2%D0%BE%D0%B4%D0%BA%D0%B8%C2%BB.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wikimedia Commons&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-nets.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-nets.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Информационная кампания — это процесс целенаправленного распространения сообщений для формирования или изменения общественного мнения. В современных сетях такие кампании часто опираются на скоординированное поведение групп акторов, которые используют алгоритмы платформ для максимизации охвата. Исследователи изучают эти процессы, чтобы отделить органическое общение от искусственно созданных потоков информации.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-nets.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Информационная кампания является процессом, состоящим из источника, сообщения, канала и аудитории. В основе лежит принцип виральности: информация распространяется через социальные связи, где каждый узел сети выступает ретранслятором. Ключевым понятием является «скоординированное поведение» — действия группы акторов, которые действуют сообща для достижения общей цели, часто скрывая свою связь. Это отличается от индивидуального мнения, так как предполагает централизованное или согласованное управление контентом.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-nets.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Распространение информации в сети ограничено структурой социальных графов. Исследования показывают, что около 80% внимания пользователя сосредоточено в пределах «двух шагов» от его подписок. Это создает эффект «пузырей фильтров», где информация циркулирует внутри замкнутых групп. Кампании используют этот механизм, внедряя нарративы в узлы с высокой центральностью, чтобы они быстрее распространялись внутри кластеров. Алгоритмы платформ, стремясь удержать внимание, могут непреднамеренно усиливать такие сообщения, если они вызывают активную реакцию пользователей.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-nets.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для анализа кампаний исследователи применяют методы сетевого анализа и OSINT. Основные этапы включают сбор данных через API платформ, построение графов взаимодействий и поиск паттернов скоординированного поведения (например, одновременная публикация идентичного контента). Важным инструментом является проверка метаданных и временных меток, позволяющая отличить автоматизированные действия от действий реальных людей. Также используются методы машинного обучения для классификации нарративов и выявления скрытых связей между акторами.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-nets.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Методы анализа кампаний помогают понять, как информация влияет на восприятие реальности. В статье «Миф о влиянии соцсетей на искажение реальности» показано, что реальное влияние платформ на изменение убеждений часто переоценивается. Исследование «Пузыри фильтров или случайность: как мы на самом деле выбираем контент в соцсетях» объясняет, как архитектура сетей ограничивает наш кругозор. В контексте ИИ, статья «Ложь без триггеров: почему правильный ответ нейросети не гарантирует верное решение» демонстрирует, как скрытая дезинформация может влиять на логические выводы моделей.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-nets.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Главное ограничение — сложность установления причинно-следственной связи. Наблюдательные исследования показывают корреляцию, но не доказывают, что кампания стала единственной причиной изменения мнения. Существуют «смешивающие факторы»: личный опыт, культурный контекст и внешние события. Кроме того, данные платформ часто закрыты, что затрудняет независимую проверку. Исследователям следует помнить, что любая модель — это упрощение, и результаты, полученные на одной платформе, могут не воспроизводиться на других.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Информационные кампании и сети&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%98%D1%81%D1%82%D0%BE%D1%87%D0%BD%D0%B8%D0%BA%20%D0%B8%D0%BD%D1%84%D0%BE%D1%80%D0%BC%D0%B0%D1%86%D0%B8%D0%B8%5D%20--%3E%20B%5B%D0%A1%D0%BE%D1%86%D0%B8%D0%B0%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F%20%D1%81%D0%B5%D1%82%D1%8C%5D%0A%20%20B%20--%3E%20C%5B%D0%A3%D0%B7%D0%BB%D1%8B%20%D1%80%D0%B0%D1%81%D0%BF%D1%80%D0%BE%D1%81%D1%82%D1%80%D0%B0%D0%BD%D0%B5%D0%BD%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D0%90%D1%83%D0%B4%D0%B8%D1%82%D0%BE%D1%80%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%7C%D0%BE%D0%B1%D1%80%D0%B0%D1%82%D0%BD%D0%B0%D1%8F%20%D1%81%D0%B2%D1%8F%D0%B7%D1%8C%7C%20B%0A%20%20D%20--%3E%7C%D1%80%D0%B5%D0%B0%D0%BA%D1%86%D0%B8%D1%8F%7C%20C%0A%20%20E%5B%D0%9C%D0%B5%D1%82%D0%BE%D0%B4%D1%8B%20OSINT%5D%20--%3E%7C%D0%B0%D0%BD%D0%B0%D0%BB%D0%B8%D0%B7%7C%20B%0A%20%20F%5B%D0%90%D0%BB%D0%B3%D0%BE%D1%80%D0%B8%D1%82%D0%BC%D1%8B%20%D0%BF%D0%BB%D0%B0%D1%82%D1%84%D0%BE%D1%80%D0%BC%5D%20--%3E%7C%D1%83%D1%81%D0%B8%D0%BB%D0%B5%D0%BD%D0%B8%D0%B5%7C%20C%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-nets.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-coordination.html\"&gt;Скоординированное поведение&lt;/a&gt; — Синхронные публикации, сети аккаунтов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bots.html\"&gt;Боты&lt;/a&gt; — Автоматические аккаунты и их поиск.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-narratives.html\"&gt;Нарративы и дезинформация&lt;/a&gt; — Отслеживание сюжетов и ложных утверждений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-platforms.html\"&gt;Платформы&lt;/a&gt; — Telegram, YouTube, X: особенности данных и доступа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-diffusion.html\"&gt;Распространение и виральность&lt;/a&gt; — Как сообщения расходятся по сети.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-nets.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html\"&gt;ИИ-дезинформация: как отличить реальную угрозу от цифрового шума&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html\"&gt;Почему в комментариях под псевдонаучными видео так много доброты?&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html\"&gt;Ложь без триггеров: почему правильный ответ нейросети не гарантирует верное решение&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html\"&gt;Миф о влиянии соцсетей на искажение реальности&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html\"&gt;Кто управляет искусственным интеллектом: миф об архитекторе глобальных правил&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html\"&gt;Пузыри фильтров или случайность: как мы на самом деле выбираем контент в соцсетях&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp.html\"&gt;Почему нейросети поддакивают: ловушка лести и холодного безразличия&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-nets.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%BD%D1%82%D0%B8%D0%B0%D0%BB%D0%BA%D0%BE%D0%B3%D0%BE%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5_%D0%BA%D0%B0%D0%BC%D0%BF%D0%B0%D0%BD%D0%B8%D0%B8_%D0%B2_%D0%A1%D0%A1%D0%A1%D0%A0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Антиалкогольные кампании в СССР — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:1-%D0%B9_%D0%92%D1%81%D0%B5%D1%80%D0%BE%D1%81%D1%81%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9_%D0%BA%D0%BD%D0%B8%D0%B3%D0%BE%D1%80%D0%BE%D0%B7%D1%8B%D0%B3%D1%80%D1%8B%D1%88_%C2%AB%D0%9A%D0%BD%D0%B8%D0%B3%D0%B0_%D0%B2%D0%BC%D0%B5%D1%81%D1%82%D0%BE_%D0%B2%D0%BE%D0%B4%D0%BA%D0%B8%C2%BB.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Неизвестный художник (не указан в выходных данных плаката; отсутствует авторская монограмма или подпись), Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — обзор, Nature 2015&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41418-017-0012-4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Molecular mechanisms of cell death: recommendations of the Nomenclature Committee on Cell Death 2018&lt;/a&gt; — обзор, Cell Death Differ 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3402/jev.v4.27066\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Biological properties of extracellular vesicles and their physiological functions&lt;/a&gt; — обзор, J Extracell Vesicles 2015&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Как распространяется информация и как исследователи находят скоординированные кампании."}],
