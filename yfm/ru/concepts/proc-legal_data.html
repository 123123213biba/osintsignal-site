        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Процесс&lt;/strong&gt; · &lt;em&gt;Open court decisions and case law datasets&lt;/em&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/proc-legal_data.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Открытые решения, законодательные базы.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/proc-legal_data.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Суды и законы как категория открытых данных представляют собой совокупность публично доступных сведений о деятельности судебной системы и нормативно-правовых актах. Этот процесс включает публикацию текстов судебных решений, постановлений и законодательных баз, что позволяет проводить независимый анализ правоприменительной практики.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/proc-legal_data.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Судебная система является совокупностью судов, осуществляющих правосудие в государстве. В контексте открытых данных судебные акты выступают как информационная сущность, фиксирующая процесс разрешения правовых споров. Принципы прозрачности правосудия опираются на доступность этих данных для общества. Открытые судебные данные связаны с реестрами организаций и государственными закупками, так как позволяют отслеживать контрагентов и исполнение обязательств в правовом поле.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/proc-legal_data.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Процесс публикации судебных данных состоит из сбора, обработки и предоставления доступа к документам. Суды генерируют тексты решений, которые проходят процедуру деперсонализации для защиты частной жизни. Затем данные структурируются в машиночитаемые форматы (например, JSON или XML) и загружаются в государственные или независимые информационные системы. Пользователи получают доступ к этим данным через API или веб-интерфейсы для поиска по номеру дела, участникам или ключевым словам.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/proc-legal_data.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Для анализа судебных данных применяются методы OSINT, включая парсинг веб-страниц, анализ графов связей между участниками процессов и статистическую обработку массивов текстов. Инструменты включают поисковые движки по судебным архивам, библиотеки для обработки естественного языка (NLP) для классификации решений и системы визуализации связей между юридическими лицами.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/proc-legal_data.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Открытые судебные данные критически важны для оценки рисков и контроля систем. В статье «Доверие — это не оценка: как ограничить власть ИИ-агентов» рассматривается необходимость жестких правил контроля, где судебные прецеденты и законодательные нормы служат базой для формирования алгоритмических ограничений и проверки надежности автоматизированных систем.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/proc-legal_data.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основным ограничением является качество и полнота данных: не все решения публикуются, а часть информации подвергается изъятию в целях безопасности. Существует риск интерпретации данных без учета контекста, что может привести к неверным выводам. Важно помнить, что наличие данных в открытом доступе не отменяет необходимости их верификации через официальные источники и понимания правового контекста, в котором они были созданы.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Суды и законы&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D0%BE%D1%82%20%D1%88%D0%B5%D1%88%D1%96%D0%BC%D0%B4%D0%B5%D1%80%D1%96%5D%20--%3E%20B%5B%D0%94%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%D0%B4%D1%96%20%D0%B6%D0%B8%D0%BD%D0%B0%D1%83%5D%0A%20%20B%20--%3E%20C%5B%D0%94%D0%B5%D0%BF%D0%B5%D1%80%D1%81%D0%BE%D0%BD%D0%B0%D0%BB%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F%5D%0A%20%20C%20--%3E%20D%5B%D2%9A%D2%B1%D1%80%D1%8B%D0%BB%D1%8B%D0%BC%D0%B4%D0%B0%D1%83%5D%0A%20%20D%20--%3E%20E%5B%D0%90%D1%88%D1%8B%D2%9B%20%D1%80%D0%B5%D0%B5%D1%81%D1%82%D1%80%5D%0A%20%20E%20--%3E%20F%5B%D0%A2%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%5D%0A%20%20F%20--%3E%20G%5B%D2%9A%D2%B1%D2%9B%D1%8B%D2%9B%D1%82%D1%8B%D2%9B%20%D0%B1%D0%B0%D2%9B%D1%8B%D0%BB%D0%B0%D1%83%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/proc-legal_data.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt; — Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-web_archives.html\"&gt;Веб-архивы&lt;/a&gt; — Wayback Machine, сохранение и сравнение страниц.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/proc-legal_data.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html\"&gt;Доверие — это не оценка: как ограничить власть ИИ-агентов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/proc-legal_data.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D1%83%D0%B4%D0%B5%D0%B1%D0%BD%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0_%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D0%B9%D1%81%D0%BA%D0%BE%D0%B9_%D0%A4%D0%B5%D0%B4%D0%B5%D1%80%D0%B0%D1%86%D0%B8%D0%B8\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Судебная система Российской Федерации — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41746-019-0084-2\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Digital biomarkers for Alzheimer's disease: the mobile/ wearable devices opportunity&lt;/a&gt; — обзор, NPJ Digit Med 2019&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/cpt.966\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Wearable Devices in Clinical Trials: Hype and Hypothesis&lt;/a&gt; — обзор, Clin Pharmacol Ther 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.jsat.2018.12.003\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Effectiveness of medication assisted treatment for opioid use in prison and jail settings: A meta-analysis and systematic review&lt;/a&gt; — обзор, J Subst Abuse Treat 2019&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Открытые решения, законодательные базы."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Суды и законы","description":"Открытые решения, законодательные базы.","vcsPath":"concepts/proc-legal_data.md"},"headings":[{"title":"Определение","href":"concepts/proc-legal_data.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/proc-legal_data.html#obzor","level":2},{"title":"Теория","href":"concepts/proc-legal_data.html#teoriya","level":2},{"title":"Как это устроено","href":"concepts/proc-legal_data.html#kak-eto-ustroeno","level":2},{"title":"Методы и инструменты","href":"concepts/proc-legal_data.html#metody-i-instrumenty","level":2},{"title":"Где применяется","href":"concepts/proc-legal_data.html#gde-primenyaetsya","level":2},{"title":"Ограничения и подводные камни","href":"concepts/proc-legal_data.html#ogranicheniya-i-podvodnye-kamni","level":2},{"title":"Связанные концепции","href":"concepts/proc-legal_data.html#svyazannye-koncepcii","level":2},{"title":"Где встречается","href":"concepts/proc-legal_data.html#gde-vstrechaetsya","level":2},{"title":"Источники","href":"concepts/proc-
