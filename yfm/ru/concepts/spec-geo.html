        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальность&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"opredelenie\"&gt;&lt;a href=\"concepts/spec-geo.html#opredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Определение&lt;/span&gt;&lt;/a&gt;Определение&lt;/h2&gt;\n&lt;p&gt;Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/p&gt;\n&lt;h2 id=\"obzor\"&gt;&lt;a href=\"concepts/spec-geo.html#obzor\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор&lt;/span&gt;&lt;/a&gt;Обзор&lt;/h2&gt;\n&lt;p&gt;Спутники и геоданные — это информационная сущность, представляющая собой совокупность данных дистанционного зондирования Земли и географических координат, используемых для анализа изменений на поверхности планеты. Исследователи применяют эти данные для мониторинга объектов, оценки городской среды и выявления закономерностей без прямого доступа к месту событий.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"concepts/spec-geo.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;Геоданные являются видом пространственной информации, привязанной к системе координат. Спутниковые снимки — это процесс регистрации электромагнитного излучения, отраженного или испущенного поверхностью Земли. Анализ этих данных базируется на принципах спектрального анализа и компьютерного зрения. В отличие от простых карт, спутниковые данные позволяют отслеживать динамику процессов во времени. Соседние концепции, такие как ГИС (геоинформационные системы) и OpenStreetMap, являются инструментами для визуализации и структурирования этих данных.&lt;/p&gt;\n&lt;h2 id=\"kak-eto-ustroeno\"&gt;&lt;a href=\"concepts/spec-geo.html#kak-eto-ustroeno\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как это устроено&lt;/span&gt;&lt;/a&gt;Как это устроено&lt;/h2&gt;\n&lt;p&gt;Система работы со спутниковыми данными включает сбор, обработку и интерпретацию. Сначала сенсоры спутника фиксируют данные в различных спектральных диапазонах. Затем эти данные проходят радиометрическую и геометрическую коррекцию. На этапе анализа исследователи используют алгоритмы машинного обучения для классификации объектов или обнаружения изменений. Результатом является структурированная информация о состоянии объекта или территории.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"concepts/spec-geo.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Основными методами являются семантическая сегментация, детекция объектов и анализ временных рядов. Инструменты включают библиотеки для обработки растровых данных (например, GDAL), платформы для облачных вычислений и нейросетевые модели. Современные подходы позволяют проводить анализ объектов, таких как корабли или здания, без необходимости дообучения моделей под каждый конкретный регион, что повышает эффективность работы с новыми данными.&lt;/p&gt;\n&lt;h2 id=\"gde-primenyaetsya\"&gt;&lt;a href=\"concepts/spec-geo.html#gde-primenyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где применяется&lt;/span&gt;&lt;/a&gt;Где применяется&lt;/h2&gt;\n&lt;p&gt;Технологии анализа геоданных находят применение в урбанистике и мониторинге инфраструктуры. В статье «Цифровой двойник города: как нейросети проектируют изменения в реальности» описывается использование ИИ-агентов для предложения реалистичных правок городской среды. В материале «Считаем объекты на спутниковых снимках без дообучения нейросетей» рассматривается метод распознавания объектов в новых регионах, что позволяет масштабировать анализ без затрат на переобучение моделей.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya-i-podvodnye-kamni\"&gt;&lt;a href=\"concepts/spec-geo.html#ogranicheniya-i-podvodnye-kamni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и подводные камни&lt;/span&gt;&lt;/a&gt;Ограничения и подводные камни&lt;/h2&gt;\n&lt;p&gt;Основными ограничениями являются разрешение снимков, облачность и частота обновления данных. Точность анализа зависит от качества обучающей выборки и условий съемки. Важно помнить, что интерпретация данных требует проверки с нескольких сторон для исключения ошибок, связанных с искажениями или неверной классификацией объектов.&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Схема: Спутники и геоданные&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20A%5B%D0%A1%D0%BF%D1%83%D1%82%D0%BD%D0%B8%D0%BA%5D%20--%3E%7C%D0%A1%D0%B5%D0%BD%D1%81%D0%BE%D1%80%7C%20B%5B%D0%A1%D1%8B%D1%80%D1%8B%D0%B5%20%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5%5D%0A%20%20B%20--%3E%7C%D0%9A%D0%BE%D1%80%D1%80%D0%B5%D0%BA%D1%86%D0%B8%D1%8F%7C%20C%5B%D0%93%D0%B5%D0%BE%D0%B4%D0%B5%D1%80%D0%B5%D0%BA%D1%82%D0%B5%D1%80%D1%96%5D%0A%20%20C%20--%3E%7C%D0%A2%D0%B0%D0%BB%D0%B4%D0%B0%D1%83%7C%20D%5B%D0%9D%D0%B5%D0%B9%D1%80%D0%BE%D1%81%D0%B5%D1%82%D1%8C%5D%0A%20%20D%20--%3E%7C%D0%9D%D3%99%D1%82%D0%B8%D0%B6%D0%B5%7C%20E%5B%D0%9E%D0%B1%D1%8A%D0%B5%D0%BA%D1%82%D1%96%D0%BB%D0%B5%D1%80%D0%B4%D1%96%20%D0%B0%D0%BD%D1%8B%D2%9B%D1%82%D0%B0%D1%83%5D%0A%20%20E%20--%3E%7C%D2%9A%D0%BE%D0%BB%D0%B4%D0%B0%D0%BD%D1%83%7C%20F%5B%D2%9A%D0%B0%D0%BB%D0%B0%D0%BB%D1%8B%D2%9B%20%D0%BE%D1%80%D1%82%D0%B0%5D%0A%20%20E%20--%3E%7C%D2%9A%D0%BE%D0%BB%D0%B4%D0%B0%D0%BD%D1%83%7C%20G%5B%D0%98%D0%BD%D1%84%D1%80%D0%B0%D2%9B%D2%B1%D1%80%D1%8B%D0%BB%D1%8B%D0%BC%5D%0A\"&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"svyazannye-koncepcii\"&gt;&lt;a href=\"concepts/spec-geo.html#svyazannye-koncepcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные концепции&lt;/span&gt;&lt;/a&gt;Связанные концепции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sat_imagery.html\"&gt;Анализ спутниковых снимков&lt;/a&gt; — Sentinel, Landsat, разрешение, индексы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geolocation.html\"&gt;Геолокация по изображению&lt;/a&gt; — Где сделан снимок: рельеф, дороги, тени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-change_detection.html\"&gt;Обнаружение изменений&lt;/a&gt; — Что изменилось между снимками: застройка, леса, разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-night_lights.html\"&gt;Ночные огни и косвенные признаки&lt;/a&gt; — Экономика и события по свечению городов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-osm_gis.html\"&gt;OpenStreetMap и ГИС&lt;/a&gt; — Открытые карты, геоданные, пространственный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"gde-vstrechaetsya\"&gt;&lt;a href=\"concepts/spec-geo.html#gde-vstrechaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где встречается&lt;/span&gt;&lt;/a&gt;Где встречается&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html\"&gt;Как нейросети видят изменения в 3D-пространстве: метод GS-Pool&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html\"&gt;Цифровой двойник города: как нейросети проектируют изменения в реальности&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html\"&gt;Считаем объекты на спутниковых снимках без дообучения нейросетей&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В справочнике: &lt;a href=\"reference/glossary.html\"&gt;Глоссарий А–Я&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"concepts/spec-geo.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D1%83%D1%82%D0%BD%D0%B8%D0%BA_(%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Спутник (поисковая система) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-14-7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GSVA: gene set variation analysis for microarray and RNA-seq data&lt;/a&gt; — обзор, BMC Bioinformatics 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-14-128\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Enrichr: interactive and collaborative HTML5 gene list enrichment analysis tool&lt;/a&gt; — обзор, BMC Bioinformatics 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/jcc.21287\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CHARMM: the biomolecular simulation program&lt;/a&gt; — обзор, J Comput Chem 2009&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что можно узнать из открытых снимков и карт — и как это делают исследователи."}],"style":["_assets/biosignal.css","_assets/cut-extension.css"],"script":["_assets/biosignal.js","_assets/cut-extension.js","_bundle/mermaid-extension.js"],"title":"Спутники и геоданные","description":"Что можно узнать из открытых снимков и карт — и как это делают исследователи.","vcsPath":"concepts/spec-geo.md"},"headings":[{"title":"Определение","href":"concepts/spec-geo.html#opredelenie","level":2},{"title":"Обзор","href":"concepts/spec-geo.html#obzor","level":2},{"title":"Теория","href":"concepts/spec-geo.html#teoriya","level":2},{"ti
