            {"data":{"leading":false,"html":"&lt;p&gt;27 статей&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html\"&gt;Скрытые рассуждения ИИ: почему их сложно научить обману&lt;/a&gt; — Могут ли нейросети прятать логику внутри обычного текста? Исследование показало, что это гораздо сложнее, чем кажется.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html\"&gt;Почему научные статьи от ИИ выглядят как под копирку&lt;/a&gt; — Исследователи выяснили, что нейросети пишут вступления к научным статьям слишком предсказуемо по сравнению с людьми.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html\"&gt;Цифровой двойник города: как нейросети проектируют изменения в реальности&lt;/a&gt; — Вместо дорогостоящих симуляций — ИИ-агент, который предлагает реалистичные правки для улучшения городской среды по фото.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html\"&gt;LiteReality-Agent: как превратить сканы комнат в интерактивные 3D-модели с помощью кода&lt;/a&gt; — Исследователи научили ИИ-агентов превращать обычные RGB-D сканы помещений в полноценные цифровые двойники через написание Python-скриптов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html\"&gt;Почему ваш ИИ-агент «притворяется» умным: ловушка бенчмарков&lt;/a&gt; — Стандартные тесты часто хвалят маленькие языковые модели за навыки, которых у них нет. Разбираемся, как проверить реальные способности ИИ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html\"&gt;Планирование с костями: как заставить нейросети генерировать по-настоящему разные ответы&lt;/a&gt; — Почему современные ИИ дают скучные ответы и как метод Gacha Decoding меняет правила игры с помощью случайных чисел.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html\"&gt;Как заставить нейросети создавать точные инфографики без галлюцинаций&lt;/a&gt; — Новый фреймворк InfoAgent превращает создание инфографики в проверяемый процесс, связывая каждый элемент с реальными данными.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html\"&gt;Считаем объекты на спутниковых снимках без дообучения нейросетей&lt;/a&gt; — Как научить ИИ распознавать корабли и здания в новых регионах, не тратя время на переобучение модели под каждый снимок?&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html\"&gt;Почему обучение нейросетей на контенте от ИИ ведет к деградации моделей&lt;/a&gt; — Исследователи выяснили: чем больше сгенерированного ИИ текста в обучающей выборке, тем хуже результат.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html\"&gt;Почему нейросети ошибаются в командах Kali Linux и как это исправить&lt;/a&gt; — Разбираем KaliBench — новый бенчмарк, который учит ИИ точно управлять инструментами кибербезопасности без ошибок в синтаксисе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html\"&gt;Доверие — это не оценка: как ограничить власть ИИ-агентов&lt;/a&gt; — Почему высокий рейтинг безопасности ИИ не гарантирует надежность системы и как внедрить жесткие правила контроля.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html\"&gt;Как ИИ помогает проверять факты в соцсетях: опыт Community Notes&lt;/a&gt; — Разбираемся, как алгоритмы и краудсорсинг вместе борются с дезинформацией на платформе X.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html\"&gt;Почему точность нейросетей — это иллюзия стабильности&lt;/a&gt; — Мы привыкли оценивать ИИ по среднему баллу, но одна и та же модель может провалиться, если просто перефразировать запрос.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html\"&gt;Судья в машине: почему нейросети выбирают не лучшие изображения, а первые попавшиеся&lt;/a&gt; — Алгоритмы выбора картинок часто страдают от предвзятости: они выбирают не то, что качественнее, а то, что стоит первым в списке.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html\"&gt;Как предсказать атаку на ИИ-агента до того, как она случится&lt;/a&gt; — Новый метод SSH превращает защиту ИИ в игру в шахматы с самим собой, просчитывая опасные ходы наперед.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html\"&gt;Робот, который помнит прошлое: как научить машину находить спрятанные предметы&lt;/a&gt; — Роботы часто теряются, если объект исчез из поля зрения. Новая система BeyondSCe позволяет им «вспоминать» события и находить скрытые цели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/learning-to-structure-data-from-user-generated-thematic-corp.html\"&gt;Как собрать строгую базу данных из хаотичных постов в сети без готовых шаблонов&lt;/a&gt; — Новый алгоритм на базе языковых моделей находит скрытые параметры в текстах и строит таблицы с точностью человека.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html\"&gt;Миф о влиянии соцсетей на искажение реальности&lt;/a&gt; — Соцсети часто винят в распространении фейков, но данные показывают, что их реальное влияние на наше восприятие правды минимально.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html\"&gt;Детекторы лжи для ИИ: почему они ошибаются, когда модель играет роль&lt;/a&gt; — Алгоритмы, выявляющие ложь в ответах нейросетей, часто принимают ролевую игру за правду. Разбираемся, почему это происходит.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html\"&gt;VISTA: как научить нейросети «вспоминать» увиденное для решения сложных задач&lt;/a&gt; — Новый визуальный интерфейс позволяет ИИ-агентам хранить и пересматривать кадры из прошлого, радикально улучшая точность их действий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html\"&gt;Пузыри фильтров или случайность: как мы на самом деле выбираем контент в соцсетях&lt;/a&gt; — Исследование Bluesky показало, что 80% нашего внимания ограничено «двумя шагами» от подписок. Почему мы редко выходим за пределы своего круга?&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html\"&gt;Как наука уходит в сторону: Drift Inspector отслеживает эволюцию идей в AI&lt;/a&gt; — Исследователи создали инструмент, который превращает тысячи научных статей в интерактивную карту трендов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html\"&gt;Когда ИИ забывает, кто он: почему «личность» агента — это иллюзия&lt;/a&gt; — Ваш ИИ-помощник может вести себя как обычно, но внутри он уже перестал быть собой. Разбираемся в механике сбоя.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp.html\"&gt;Почему нейросети поддакивают: ловушка лести и холодного безразличия&lt;/a&gt; — ИИ часто выбирает между слепым согласием и грубостью. Новый бенчмарк FIGS учит модели быть честными, оставаясь эмпатичными.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html\"&gt;Почему оптимизация для ИИ-поисковиков работает не так, как вы думали&lt;/a&gt; — Один раз попав в ответ нейросети, источник закрепляется там надолго. Разбираем феномен «разговорного захвата».&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html\"&gt;Как защитить данные в облачных нейросетях, не теряя в точности вычислений&lt;/a&gt; — Новый метод ReCast позволяет отправлять в облако защищенные данные, сохраняя логику расчетов и формат файлов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html\"&gt;Кто управляет искусственным интеллектом: миф об архитекторе глобальных правил&lt;/a&gt; — Мир пытается обуздать ИИ, но единого центра управления нет. Разбираемся, почему архитектура правил строится без главного архитектора.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"27 статей"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Неделя 2026-10-02 — 2026-10-04","description":"27 статей","vcsPath":"articles/collections/week-2026-w40.md"},"headings":[],"title":"Неделя 2026-10-02 — 2026-10-04"},"router":{"pathname":"articles/collections/week-2026-w40","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
