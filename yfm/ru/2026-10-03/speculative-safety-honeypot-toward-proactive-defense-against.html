            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"190\" cy=\"144\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"550\" cy=\"244\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · TOOLING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как предсказать атаку на ИИ-&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;агента до того, как она&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;случится&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-f3.jpg\" alt=\"Рисунок 3. Средние показатели риска для всех результатов спекулятивного исполнения SSH по четырем наборам данных (столбч\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Средние показатели риска для всех результатов спекулятивного исполнения &lt;a href=\"concepts/speculative-safety-honeypot.html\"&gt;SSH&lt;/a&gt; по четырем наборам данных (столбчатая диаграмма, левая ось Y) и доля оповещений, вызванных превышением порогового значения (горизонтальная пунктирная линия, правая ось Y).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Современные ИИ-агенты уязвимы к многоходовым атакам, которые скрывают вредоносные намерения в длинных цепочках действий. Авторы предлагают фреймворк Speculative Safety Honeypot (SSH), который имитирует будущее поведение агента с помощью малых языковых моделей. Система строит дерево возможных сценариев и отсекает опасные пути до того, как они будут реализованы в реальности.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SSH переходит от ретроспективного анализа истории к проактивному прогнозированию будущих рисков.&lt;/li&gt;\n&lt;li&gt;Использование малых &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; для симуляции позволяет строить дерево возможных атак без реального вызова внешних инструментов.&lt;/li&gt;\n&lt;li&gt;Метод обеспечивает 0% &lt;a href=\"concepts/attack-success-rate.html\"&gt;уровень успешности атак&lt;/a&gt; (ASR) в сложных многоходовых сценариях взлома.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Метод SSH (Speculative Safety Honeypot) использует многоагентную симуляцию для проактивной защиты. В систему входят три компонента: «симулятор ассистента» (модель без защитных фильтров для выявления уязвимостей), «&lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;симулятор пользователя&lt;/a&gt;» (генератор неоднозначных запросов) и «симулятор среды» (имитация инструментов без реального вызова API).&lt;/p&gt;\n&lt;p&gt;Алгоритм использует поиск в ширину с учетом разнообразия (diversity-oriented &lt;a href=\"concepts/beam-search.html\"&gt;Beam Search&lt;/a&gt;) для построения дерева траекторий. Узлы дерева кластеризуются с помощью &lt;a href=\"concepts/simhash.html\"&gt;SimHash&lt;/a&gt; (алгоритм хеширования для оценки семантической близости) с порогом 0,7. Если доля опасных конечных узлов в дереве превышает заданный порог, система блокирует выполнение. В экспериментах метод показал 0% уровень успешности атак (ASR) при сохранении полезности системы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность метода ограничена вычислительным бюджетом на симуляцию и точностью малых моделей при прогнозировании поведения целевого агента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;С ростом использования агентов на базе больших языковых моделей (LLM) в сложных средах, многоходовые атаки стали серьезной угрозой безопасности. Традиционные методы защиты анализируют историю взаимодействий, однако такой ретроспективный подход не позволяет выявить скрытые вредоносные намерения, которые злоумышленники распределяют по нескольким шагам диалога, чтобы замаскировать будущие риски.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Традиционные методы обнаружения уязвимы перед многоходовыми атаками, так как они не способны распознать вредоносный умысел, скрытый в последовательности действий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы предлагают систему Speculative Safety Honeypot (SSH), вдохновленную методом спекулятивного декодирования. SSH представляет собой многоагентную симуляционную среду, использующую небольшие LLM для реализации рабочего процесса «предсказание-проверка» на уровне действий. На этапе предсказания система моделирует будущие шаги целевого агента и асинхронно строит дерево траекторий, что позволяет заранее выявлять потенциальные угрозы. На этапе проверки система использует реальные действия целевого агента для калибровки и обрезки дерева, что снижает количество ложноположительных срабатываний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/spekulyativnoe-dekodirovanie.html\"&gt;Спекулятивное декодирование&lt;/a&gt; — метод, при котором модель сначала делает быстрые предположения о будущих данных, а затем проверяет их точность, что ускоряет работу и повышает эффективность анализа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;SSH функционирует как подключаемый модуль, обеспечивая существующие системы обнаружения дополнительными данными для принятия решений, выходящими за рамки текущего этапа взаимодействия. Оценка рисков строится на анализе эволюции всего дерева траекторий, а не на анализе отдельного момента времени. Это снижает зависимость от абсолютной точности отдельных компонентов обнаружения, повышая общую устойчивость защиты и увеличивая время упреждающего предупреждения об атаках.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод является модельным решением; эффективность защиты зависит от качества симуляции поведения целевого агента небольшими LLM.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Угрозы безопасности агентов на базе больших языковых моделей (LLM) трансформируются из простых атак через один запрос в сложные многоходовые взаимодействия. Основные сценарии включают многоходовые джейлбрейки, где злоумышленники постепенно разделяют вредоносную нагрузку для обхода фильтров, и многоходовые непрямые инъекции промптов (IPI), при которых агент выполняет опасные действия после получения инструкций из внешних источников в ходе диалога. Существующие методы защиты, основанные на анализе истории контекста, часто оказываются неэффективными против атак с «временной скрытностью»: строгая &lt;a href=\"concepts/filtratsiya.html\"&gt;фильтрация&lt;/a&gt; дает много ложных срабатываний, а мягкая — пропускает глубоко скрытые намерения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SSH переходит от анализа прошлого контекста к проактивному прогнозированию будущего поведения агента, достигая 0% показателя успешности атак (ASR) в многоходовых сценариях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для решения этой задачи предложен метод Speculative Safety Honeypot (SSH). Он использует три симулятора: помощника (уязвимая копия целевого агента), пользователя (генератор входных данных) и среды (имитация ответов инструментов без реального вызова). Эти компоненты работают асинхронно, прогнозируя будущие действия агента. В процессе используется алгоритм поиска по лучу (Beam Search), ориентированный на разнообразие, что позволяет исследовать пространство рисков при ограниченных вычислительных ресурсах. Система сравнивает поведение целевого агента с деревом прогнозов, отсекая невалидные пути, и оценивает риск как долю опасных узлов в «листьях» дерева.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод поиска по лучу (Beam Search) — это алгоритм поиска, который на каждом шаге сохраняет несколько наиболее вероятных вариантов развития событий, что позволяет эффективно исследовать множество сценариев атаки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Преимущество SSH заключается в избыточности решений: система оценивает не единичный ответ, а эволюцию рисков во всем дереве взаимодействий. Основной вклад работы включает создание SSH, разработку алгоритма поиска для выявления редких сценариев атак и демонстрацию устойчивости системы без снижения полезности агента.&lt;/p&gt;\n&lt;h4 id=\"2-svyazannye-raboty-21-metody-spekulyativnogo-vypolneniya\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#2-svyazannye-raboty-21-metody-spekulyativnogo-vypolneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Связанные работы 2.1. Методы спекулятивного выполнения&lt;/span&gt;&lt;/a&gt;2. Связанные работы 2.1. Методы спекулятивного выполнения&lt;/h4&gt;\n&lt;p&gt;Техники спекулятивного декодирования, изначально созданные для ускорения генерации токенов, находят применение в безопасности. Существуют подходы, такие как SSD (использование эксперта безопасности), DSP (спекулятивное планирование действий агента) и SpecReason (генерация промежуточных шагов рассуждений). Эти методы доказывают, что использование облегченных моделей для прогнозирования действий, планов и ответов API является жизнеспособной стратегией, что подтверждает обоснованность архитектуры SSH.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оговорка: эффективность метода зависит от способности симуляторов точно имитировать поведение целевого агента и среды в различных условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"22-mnogohodovye-ataki\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#22-mnogohodovye-ataki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2.2. Многоходовые атаки&lt;/span&gt;&lt;/a&gt;2.2. Многоходовые атаки&lt;/h4&gt;\n&lt;p&gt;Многоходовые атаки (&lt;a href=\"concepts/multi-turn-attack.html\"&gt;Multi-turn jailbreak&lt;/a&gt;) используют последовательный характер взаимодействия с LLM, чтобы обойти &lt;a href=\"concepts/rejectors.html\"&gt;фильтры&lt;/a&gt; безопасности, эффективные против разовых запросов. В отличие от статических инъекций, такие атаки итеративно переводят модель в скомпрометированное состояние. Например, метод Crescendo использует безобидные на первый взгляд запросы для накопления вредоносного контекста, а ASJA манипулирует историей диалога, чтобы сместить механизм self-attention модели в сторону от токенов безопасности. Метод AMA применяет кросс-доменные аналогии для маскировки истинного намерения. Эти подходы демонстрируют уязвимость «дрейфа контекста», при которой накопленный семантический вес перевешивает исходные установки безопасности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Многоходовые атаки используют накопление вредоносного контекста в диалоге, что позволяет обойти механизмы защиты, рассчитанные на анализ отдельных запросов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kosvennye-mnogohodovye-inuekcii-ipi\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#kosvennye-mnogohodovye-inuekcii-ipi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Косвенные многоходовые инъекции (IPI)&lt;/span&gt;&lt;/a&gt;Косвенные многоходовые инъекции (IPI)&lt;/h4&gt;\n&lt;p&gt;Косвенные инъекции (Indirect Prompt Injection) эксплуатируют доверие агентов к внешним данным. Бенчмарки, такие как InjecAgent, AgentDojo и STAC, показывают, что скрытые инструкции в документах или результатах работы инструментов могут нарушить рабочий процесс без прямого вмешательства пользователя. В многошаговых задачах такие «отравленные» данные искажают цикл рассуждений агента, постепенно разрушая его внутреннее планирование. Исследования показывают, что модификация HTML-кода позволяет направлять веб-агентов к вредоносным целям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/kosvennaya-inektsiya.html\"&gt;Косвенная инъекция&lt;/a&gt; — это метод атаки, при котором вредоносная инструкция внедряется не пользователем, а через внешние данные, которые агент считывает в процессе выполнения задачи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ограничения существующих методов защиты&lt;/p&gt;\n&lt;p&gt;Хотя современные исследования направлены на борьбу с состязательными атаками в сложных диалогах, текущие решения (как промпт-методы, так и внешние детекторы) сфокусированы на защите в рамках текущего контекста. Им не хватает предиктивного моделирования будущих путей выполнения, что ограничивает их способность к проактивной защите.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие системы защиты ограничены анализом текущего контекста и не способны прогнозировать развитие атаки на будущих этапах выполнения задачи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;В данной работе представлена система Speculative Safety Honeypot (SSH) — механизм проактивной защиты, который переносит фокус безопасности LLM-агентов с анализа уже имеющегося контекста на прогнозирование потенциальных угроз в будущем. Интеграция легковесных симуляторов с поиском по нескольким вариантам (diversity-oriented beam search) позволяет SSH выявлять скрытые вредоносные намерения в многоходовых диалогах, сохраняя при этом функциональность системы. Эксперименты показали, что SSH снижает показатель успешности атак (ASR) до 0% как для попыток взлома (jailbreak), так и для косвенных инъекций.&lt;/p&gt;\n&lt;h4 id=\"1-vychislitelnye-i-ekologicheskie-zatraty\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#1-vychislitelnye-i-ekologicheskie-zatraty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Вычислительные и экологические затраты&lt;/span&gt;&lt;/a&gt;1. Вычислительные и экологические затраты&lt;/h4&gt;\n&lt;p&gt;Основной компромисс SSH заключается в дополнительных вычислительных ресурсах, необходимых для параллельного прогнозирования. Несмотря на использование легковесной модели 3B с &lt;a href=\"concepts/multi-lora.html\"&gt;Multi-LoRA&lt;/a&gt; (добавляющей лишь 1,3% к параметрам целевой модели 235B), затраты памяти GPU и энергопотребление при запуске M=5 параллельных ветвей остаются существенными. Для оптимизации авторы применяют пакетную обработку на базе vLLM, что позволяет минимизировать энергопотребление за счет повторного использования KV-кэшей. При масштабном внедрении этот «налог на безопасность» должен соотноситься с потенциальным ущербом от успешной атаки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование 5 параллельных ветвей прогнозирования обеспечивает 0% ASR, но требует дополнительных затрат памяти GPU и энергии, которые оптимизируются через vLLM-пакетирование.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"2-vliyanie-lozhnopolozhitelnyh-srabatyvanij-fpr-na-polzovatelskij-opyt\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#2-vliyanie-lozhnopolozhitelnyh-srabatyvanij-fpr-na-polzovatelskij-opyt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Влияние ложноположительных срабатываний (FPR) на пользовательский опыт&lt;/span&gt;&lt;/a&gt;2. Влияние ложноположительных срабатываний (FPR) на пользовательский опыт&lt;/h4&gt;\n&lt;p&gt;Высокий уровень ложноположительных срабатываний (&lt;a href=\"concepts/false-positive-rate.html\"&gt;FPR&lt;/a&gt;) может привести к необоснованной блокировке запросов, что снижает полезность агента. В экспериментах на платформе AgentDojo системный FPR составил 0,2%. Хотя это значение мало, каждое ложное срабатывание (например, блокировка безопасного вызова инструмента) увеличивает задержку на 3–7 секунд и может приводить к более консервативным или повторяющимся ответам модели. В творческих задачах грань между амбициозным и вредоносным намерением размыта, поэтому для разрешения конфликтов может потребоваться участие человека (user-in-the-loop).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FPR (False Positive Rate) — доля ошибочных блокировок безопасных действий системы, принимаемых за угрозы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zayavlenie-o-vliyanii\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#zayavlenie-o-vliyanii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заявление о влиянии&lt;/span&gt;&lt;/a&gt;Заявление о влиянии&lt;/h4&gt;\n&lt;p&gt;Данное исследование направлено на повышение защищенности LLM-агентов для их безопасного использования в критически важных средах. Авторы признают, что усиление мер безопасности может незначительно снижать скорость отклика, однако считают распространение таких методологий необходимым для укрепления коллективной безопасности ИИ-сообщества. Работа способствует созданию более устойчивых и надежных агентов, снижая их уязвимость к манипуляциям.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Система SSH использует мультиагентную систему (&lt;a href=\"concepts/mas.html\"&gt;MAS&lt;/a&gt;) из нескольких LLM для асинхронного прогнозирования действий целевого агента. Это создает «дерево предположений», где конечные узлы анализируются на предмет рискованного поведения. При совершении агентом реального действия дерево обрезается, а для оставшихся узлов рассчитывается коэффициент риска. Если он превышает заданный порог, система подает сигнал для коррекции или остановки агента.&lt;/p&gt;\n&lt;h4 id=\"31-postroenie-sistemy-simulyacii\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#31-postroenie-sistemy-simulyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1. Построение системы симуляции&lt;/span&gt;&lt;/a&gt;3.1. Построение системы симуляции&lt;/h4&gt;\n&lt;p&gt;Ядро SSH — это MAS из трех специализированных симуляторов на базе LLM:&lt;br /&gt;\n• Симулятор помощника: имитирует целевого агента, используя модель без фильтров безопасности для раннего выявления рисков.&lt;br /&gt;\n• Симулятор пользователя: генерирует разнообразные и неоднозначные запросы, включая редкие сценарии (edge-cases), способные обойти стандартные фильтры.&lt;br /&gt;\n• Симулятор среды: предоставляет синтетическую обратную связь для инструментов (MCP), баз данных и сторонних агентов, обеспечивая изоляцию процесса от реального мира.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мультиагентная система (MAS) — это подход, при котором несколько независимых программных агентов взаимодействуют друг с другом для решения сложной задачи, в данном случае — для моделирования поведения ИИ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-postroenie-dereva-predpolozhenij\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#32-postroenie-dereva-predpolozhenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2. Построение дерева предположений&lt;/span&gt;&lt;/a&gt;3.2. Построение дерева предположений&lt;/h4&gt;\n&lt;p&gt;При начале генерации SSH клонирует список сообщений агента и строит дерево предположений. Для максимизации охвата рискованных сценариев используется алгоритм поиска по лучу (Beam Search), ориентированный на разнообразие, а не на точность предсказания.&lt;/p&gt;\n&lt;p&gt;Процесс управляется двумя параметрами: бюджетом выборки M (ширина дерева) и максимальной глубиной D (количество шагов). Взаимодействия делятся на ключевые узлы (запросы пользователя, действия помощника) с высоким потенциалом ветвления и регулярные узлы (ответы инструментов, логические выводы), которые расширяются линейно.&lt;/p&gt;\n&lt;h4 id=\"klasterizaciya-povedeniya\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#klasterizaciya-povedeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кластеризация поведения&lt;/span&gt;&lt;/a&gt;Кластеризация поведения&lt;/h4&gt;\n&lt;p&gt;Для управления пространством поиска M узлов группируются в кластеры. Для вызовов инструментов критерием является идентичность функций и аргументов. Для текста используется алгоритм SimHash: семантическое перекрытие между узлами n_i и n_j рассчитывается как &lt;span class=\"yfm-latex\" data-content=\"Overlap(n_i%2C%20n_j)%20%3D%20%5Cfrac%7Bbitcount(%0Aeg(Hash(n_i)%20%5Coplus%20Hash(n_j)))%7D%7BK%7D%2C%20%D0%B3%D0%B4%D0%B5%20K\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — количество бит хеша. Порог сходства установлен на уровне 0,7.&lt;/p&gt;\n&lt;h4 id=\"dvuhurovnevoe-peremeshivanie\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#dvuhurovnevoe-peremeshivanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Двухуровневое перемешивание&lt;/span&gt;&lt;/a&gt;Двухуровневое перемешивание&lt;/h4&gt;\n&lt;p&gt;Для исключения предвзятости выборки применяется двухуровневая рандомизация: сначала перемешиваются сами кластеры, затем — узлы внутри них.&lt;/p&gt;\n&lt;h4 id=\"ciklicheskij-otbor-i-pereraspredelenie\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#ciklicheskij-otbor-i-pereraspredelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Циклический отбор и перераспределение&lt;/span&gt;&lt;/a&gt;Циклический отбор и перераспределение&lt;/h4&gt;\n&lt;p&gt;Кандидаты на следующий уровень глубины отбираются методом циклического перебора (Round-Robin) до достижения бюджета M. Это позволяет принудительно снижать вес частых (избыточных) поведений и усиливать редкие, заставляя систему исследовать более разнообразные траектории взаимодействия.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Производительность на наборе данных AgentDojo&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Метод&lt;/th&gt;\n&lt;th&gt;ASR&lt;/th&gt;\n&lt;th&gt;UA&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Workspace&lt;/td&gt;\n&lt;td&gt;1.61&lt;/td&gt;\n&lt;td&gt;80.54&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sandwich&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;70.89&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;PromptGuard&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;43.57&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w.SSH4/8&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;53.75&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Judger&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;57.68&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;w.SSH4/8&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;78.39&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Целевой агент — Qwen3-235B. В таблице указаны ASR (↓) и UA (↑) в процентах, лучшие показатели выделены жирным шрифтом. w.SSH4/8 обозначает детектор, усиленный SSH, где 4 и 8 представляют максимальную глубину спекуляции 4 (D= 4) и ширину луча 8 (M= 4) соответственно.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"33-asinhronnaya-verifikaciya-i-ocenka-riska\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#33-asinhronnaya-verifikaciya-i-ocenka-riska\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3. Асинхронная верификация и оценка риска&lt;/span&gt;&lt;/a&gt;3.3. Асинхронная верификация и оценка риска&lt;/h4&gt;\n&lt;p&gt;Механизм верификации сопоставляет реальные действия целевого агента с деревом предположений для уточнения вероятностей риска. Для этого используется логика поведенческой кластеризации: вызовы функций сравниваются по точному совпадению имен и аргументов, а текстовые ответы — через алгоритм SimHash. Если реальное действие совпадает с одним из M предсказанных вариантов, дерево «обрезается» (pruning), оставляя только соответствующее поддерево. При отсутствии совпадений исходное дерево сохраняется для дальнейшего анализа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SimHash — это метод хэширования, который позволяет определить степень схожести двух текстов: чем меньше различий в хэшах, тем ближе содержание документов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оценка риска проводится для всех оставшихся листовых узлов дерева. Траектории от корня до листа сериализуются в строку и передаются классификатору (например, детектору вредоносного контента или внешней LLM). Риск S(T) вычисляется как доля узлов, классифицированных как «опасные», относительно общего числа оцененных листьев. Установлены два порога срабатывания: τ₁ (для случаев, когда предположение совпало с действием) и τ₂ (при несовпадении), где τ₁ &amp;lt; τ₂. Более строгий порог для совпадений минимизирует ложноположительные срабатывания. При превышении порога система может принудительно остановить выполнение или изменить промпт.&lt;/p&gt;\n&lt;h4 id=\"34-strategiya-differencirovannogo-vyravnivaniya\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#34-strategiya-differencirovannogo-vyravnivaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4. Стратегия дифференцированного выравнивания&lt;/span&gt;&lt;/a&gt;3.4. Стратегия дифференцированного выравнивания&lt;/h4&gt;\n&lt;p&gt;Для баланса между точностью симуляции и чувствительностью к угрозам применяется стратегия дифференцированного выравнивания. Она включает два этапа: повышение точности (fidelity) и чувствительности (&lt;a href=\"concepts/sensitivity.html\"&gt;sensitivity&lt;/a&gt;). Для повышения точности используется &lt;a href=\"concepts/sft.html\"&gt;дообучение&lt;/a&gt; (SFT) симулятора помощника на данных о реальных привычках целевого агента, включая наборы данных Toucan. При этом длинные цепочки рассуждений (CoT) удаляются, но ошибки сохраняются для точного моделирования поведения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LoRA (&lt;a href=\"concepts/low-rank-adaptation.html\"&gt;Low-Rank Adaptation&lt;/a&gt;) — метод эффективной настройки нейросетей, при котором обучаются лишь небольшие дополнительные веса, а не вся модель целиком.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чувствительность повышается через синтез данных: нормальные инструкции встраиваются в результаты работы инструментов (tool-return) других сред, имитируя отклонение агента от задачи из-за ложных данных. Симуляторы инструментов и пользователей также обучаются на данных Toucan. Все три симулятора используют архитектуру Multi-LoRA: адаптеры работают параллельно на одной базовой LLM, что экономит видеопамять и ускоряет переключение ролей.&lt;/p&gt;\n&lt;h4 id=\"4-eksperimenty-41-nastrojka\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#4-eksperimenty-41-nastrojka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Эксперименты 4.1. Настройка&lt;/span&gt;&lt;/a&gt;4. Эксперименты 4.1. Настройка&lt;/h4&gt;\n&lt;p&gt;Для оценки эффективности SSH в обеспечении безопасности и полезности агентов LLM были использованы четыре бенчмарка: AgentDojo, ActorAttack, XSTest и BFCL-v3. В качестве целевой модели выступала Qwen3-235B. Для работы SSH применялись три симулятора на базе модели Dolphin3-3B, развернутые с использованием метода Multi-LoRA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Multi-LoRA — это метод эффективной настройки нейросетей, позволяющий запускать несколько специализированных адаптеров на одной базовой модели, что экономит вычислительные ресурсы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Методы защиты сравнивались с тремя категориями подходов: методами промптинга (Sandwich, Spotlight, Tool Filter), классификаторами безопасности (ProtectAI, PromptGuard) и методом Judger (оценка действий агента моделью Qwen3-0.6B). Метрики соответствовали стандартам каждого из бенчмарков.&lt;/p&gt;\n&lt;h4 id=\"42-rezultaty\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#42-rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Результаты&lt;/span&gt;&lt;/a&gt;4.2. Результаты&lt;/h4&gt;\n&lt;p&gt;4.2.1. Защита от инъекций (IPI)&lt;/p&gt;\n&lt;p&gt;В экспериментах с AgentDojo вместо принудительной остановки генерации при обнаружении риска SSH использует стратегию перевыборки (resampling). Если оценка риска ветки действий превышает порог безопасности, процесс повторяется до пяти раз, пока не будет найдено безопасное действие. Ширина поиска (beam search) составляла 8, с расширением 4 узлов на каждом шаге.&lt;/p&gt;\n&lt;p&gt;Интеграция SSH с PromptGuard и Judger позволила снизить показатель успешности атаки (ASR) до 0%. Использование SSH позволяет даже легким моделям (например, PromptGuard 86M) достигать нулевого ASR, что избавляет от необходимости развертывать более тяжелые системы безопасности. Кроме того, SSH улучшает полезность (utility) агентов: в среднем показатель полезности при атаке (UA) вырос на 8,12% по сравнению с использованием только детекторов, которые часто ошибочно блокируют легитимные запросы.&lt;/p&gt;\n&lt;p&gt;4.2.2. Защита от многоходовых атак (Jailbreak)&lt;/p&gt;\n&lt;p&gt;Для проверки устойчивости к сложным атакам использовалась модель Dolphin-X1-8B. SSH продемонстрировал высокую чувствительность: при ширине выборки M=1 уровень обнаружения риска составил 84,5%, а при M=5 атаки блокировались полностью (ASR 0%). Данные в Таблице 2 показывают, что увеличение M с 1 до 3 дает значительный прирост чувствительности, однако при дальнейшем увеличении M наблюдается эффект убывающей отдачи.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-tT2.jpg\" alt=\"Таблица 2\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"model-bfcl-v3-xstest\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#model-bfcl-v3-xstest\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель BFCL-v3 XSTest&lt;/span&gt;&lt;/a&gt;Модель BFCL-v3 XSTest&lt;/h4&gt;\n&lt;p&gt;В Таблице 3 представлено сравнение производительности модели Qwen3-235B до и после внедрения системы SSH. Для набора данных BFCL-v3 оценивалась точность (↑) по различным подкатегориям, а для XSTest — частота отказов (↓). При увеличении параметра выборки M с 4 до 5 наблюдается значительное сужение диапазона до 1%.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-tT3.jpg\" alt=\"Таблица 3\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"423-vliyanie-ssh-na-poleznost-celevogo-agenta\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#423-vliyanie-ssh-na-poleznost-celevogo-agenta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.3. Влияние SSH на полезность целевого агента&lt;/span&gt;&lt;/a&gt;4.2.3. Влияние SSH на полезность целевого агента&lt;/h4&gt;\n&lt;p&gt;Для оценки влияния SSH на функциональность и возможные помехи мы протестировали систему на задачах вызова инструментов (BFCL-v3) и запросах с чувствительными ключевыми словами (XSTest). Использовались параметры M=8 и D=4 с базовым детектором Judger. Результаты показывают, что SSH не снижает полезность Qwen3-235B. Незначительные колебания метрик объясняются стохастичностью выборки, а не систематической ошибкой. Статистика на Рис. 3 подтверждает, что средние показатели риска остаются близкими к нулю, ни один путь не превысил порог оповещения. Частота ложноположительных срабатываний остается крайне низкой. В тестах XSTest частота отказов составила 0%, что указывает на отсутствие ошибочных блокировок.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-f3.jpg\" alt=\"Рисунок 3. Средние показатели риска для всех результатов спекулятивного исполнения SSH по четырем наборам данных (столбч\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Средние показатели риска для всех результатов спекулятивного исполнения SSH по четырем наборам данных (столбчатая диаграмма, левая ось Y) и доля оповещений, вызванных превышением порогового значения (горизонтальная пунктирная линия, правая ось Y).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/stohastichnost-vyborki.html\"&gt;Стохастичность выборки&lt;/a&gt; — это случайные отклонения в результатах, возникающие из-за вероятностной природы генерации текста моделью, а не из-за работы защитного механизма.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"424-analiz-raspredeleniya-pokazatelej-riska\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#424-analiz-raspredeleniya-pokazatelej-riska\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.4. Анализ распределения показателей риска&lt;/span&gt;&lt;/a&gt;4.2.4. Анализ распределения показателей риска&lt;/h4&gt;\n&lt;p&gt;На Рис. 3 отражены средние баллы риска и частота оповещений для наборов данных AgentDojo и ActorAttack (M=8, D=4). Состязательные наборы данных стабильно показывают более высокие баллы риска по сравнению с эталонными (BFCL-v3, XSTest), что доказывает точность SSH в различении угроз. В AgentDojo баллы риска остаются низкими до момента активации точек внедрения атаки, тогда как в ActorAttack вредоносные намерения проявляются быстрее, что приводит к более высокой частоте оповещений.&lt;/p&gt;\n&lt;h4 id=\"425-ablyacionnoe-issledovanie-beam-search-protiv-top-p-sampling\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#425-ablyacionnoe-issledovanie-beam-search-protiv-top-p-sampling\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.5. Абляционное исследование: Beam Search против Top-P sampling&lt;/span&gt;&lt;/a&gt;4.2.5. Абляционное исследование: Beam Search против Top-P sampling&lt;/h4&gt;\n&lt;p&gt;Мы сравнили стратегии поиска Beam Search и Top-P sampling. Beam Search показал более высокую эффективность в обнаружении угроз (Рис. 4). Структурированный детерминированный поиск лучше подходит для выявления состязательных намерений, чем случайный Top-P. В AgentDojo показатель успешности (Hit Rate) при M=4 достиг 47,2%, тогда как в ActorAttack он составил 8%. Это различие указывает на то, что в текстовых джейлбрейках (ActorAttack) внутренняя верификация обходится, и защита опирается на разнообразие путей, создаваемое Beam Search.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-f4.jpg\" alt=\"Рисунок 4. Законы масштабирования подверженности риску и частоты попаданий в зависимости от бюджета выборки M в наборах \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Законы масштабирования подверженности риску и частоты попаданий в зависимости от бюджета выборки M в наборах данных AgentDojo и ActorAttack, сравнение стратегий поиска Beam Search и Top-P sampling. Правая часть иллюстрирует тенденции масштабирования Beam Search при различной глубине D и ширине M на бенчмарке BFCL-v3.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"426-zakon-masshtabirovaniya-hit-rate-na-mnogoshagovyh-traektoriyah\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#426-zakon-masshtabirovaniya-hit-rate-na-mnogoshagovyh-traektoriyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2.6. Закон масштабирования Hit Rate на многошаговых траекториях&lt;/span&gt;&lt;/a&gt;4.2.6. Закон масштабирования Hit Rate на многошаговых траекториях&lt;/h4&gt;\n&lt;p&gt;Для анализа точности SSH на длинных последовательностях мы использовали BFCL-v3. Сравнивались полные траектории выполнения агентов с первым деревом поиска SSH на глубинах D=2, 3, 4 и 5. Согласно Рис. 4, SSH сохраняет высокий показатель успешности даже на длинных цепочках: при глубине 5 и M=16 он близок к 70%. Хотя с ростом бюджета выборки отдача снижается, 70% достаточно для эффективной фильтрации дерева поиска и оценки рисков.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;скрытые&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;многоходовые&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атаки на ИИ&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;симуляция&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дерева будущих&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;действий&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;нулевой&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;уровень&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;успешности&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атак&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;проактивная&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;защита вместо&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;реакции&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;tooling&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Zezhong Wang, Xueyang Tang, Rui Lian, Yang Lou, Heqing Huang&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/abs/2609.39549v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td
