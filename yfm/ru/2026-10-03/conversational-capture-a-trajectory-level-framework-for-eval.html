        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"237\" cy=\"105\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"543\" cy=\"195\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему оптимизация для ИИ-&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;поисковиков работает не так,&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;как вы думали&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval-f1.jpg\" alt=\"Рисунок 1: Обзор разговорного захвата.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Обзор разговорного захвата.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Обзор разговорного захвата. (A) Поиск информации человеком-агентом представляет собой замкнутый цикл: ответ 𝑟𝑡 обновляет убеждения пользователя 𝑏𝑡+1 и, следовательно, следующий запрос 𝑞𝑡 = 𝑄(𝑏𝑡), где 𝑄 — оператор запроса (канал со стороны человека M2), при этом также обуславливая движок историей диалога ℎ𝑡 (канал со стороны машины M1); начальное смещение &lt;a href=\"concepts/generative-engine-optimization.html\"&gt;GEO&lt;/a&gt; в оптимизированном наборе источников 𝑆GEO распространяется по обоим путям возврата. (B) Поскольку цикл усиливается, совокупный прирост траектории 𝐿𝑇 превышает экстраполяцию одного хода 𝑇 · 𝐿1; избыток представляет собой член обратной связи 𝐿feedback 𝑇, который тождественно равен нулю при оценке одного хода. Столбец разделяет 𝐿𝑇 = 2.68 при 𝑇=10 на прямой член (𝐿direct 𝑇 = 1.20) и член обратной связи (𝐿feedback 𝑇 = 1.48). Последний разделен на канал со стороны машины (𝐿M1 𝑇 = 0.85, синий, модель пользователя не требуется) и канал со стороны человека (𝐿M2 𝑇 = 0.63, ржавый), окрашенные как в (A); &lt;a href=\"concepts/compounding-ratio.html\"&gt;коэффициент накопления&lt;/a&gt; составляет 𝜌 = 2.23. (C) Следовательно, ранжирование методов GEO по приросту за один ход не совпадает с ранжированием по приросту траектории (𝜏 Кендалла = 0.4): победитель одного хода (A) занимает лишь третье место по траектории.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Генеративная оптимизация (GEO) обычно оценивается по одному ответу нейросети, но это искажает реальность. Авторы исследования доказывают, что диалог с ИИ — это замкнутый цикл, где ранние ответы влияют на будущие вопросы пользователя. В результате возникает «&lt;a href=\"concepts/conversational-capture.html\"&gt;разговорный захват&lt;/a&gt;», когда источник удерживает внимание системы независимо от своей актуальности.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Разговорный захват делает источник более вероятным для цитирования в будущем.&lt;/li&gt;\n&lt;li&gt;Обратная связь в диалоге с ИИ может превышать эффект от прямой оптимизации.&lt;/li&gt;\n&lt;li&gt;Оценка GEO по одному ответу не учитывает долгосрочное влияние на пользователя.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи формализовали взаимодействие человека и агента как двухслойную систему с обратной связью. В этой модели учитываются два канала: машинный (история диалога влияет на поиск) и человеческий (ответ ИИ меняет убеждения пользователя и его следующие запросы). Авторы применили теорию процессов подкрепления (&lt;a href=\"concepts/polya-urn.html\"&gt;урны Пойи&lt;/a&gt;) для анализа накопленной видимости источника.&lt;/p&gt;\n&lt;p&gt;Расчеты показывают, что при 10 итерациях диалога коэффициент накопления (compounding ratio) превышает 2, а вклад обратной связи может превосходить &lt;a href=\"concepts/pryamoy-effekt.html\"&gt;прямой эффект&lt;/a&gt; от оптимизации. Стандартная оценка по одному запросу (single-turn) дает лишь слабое совпадение с реальной эффективностью на дистанции (коэффициент Кендалла τ=0.4), что делает текущие методы SEO для ИИ неточными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа является теоретической моделью и не включает эксперименты с реальными пользователями или живыми поисковыми системами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Данное исследование посвящено междисциплинарному анализу в области человеко-компьютерного взаимодействия (&lt;a href=\"concepts/human-computer-interaction.html\"&gt;HCI&lt;/a&gt;), информационного поиска и методов искусственного интеллекта. Авторы, представляющие ведущие академические и исследовательские институты Японии, такие как Токийский университет, Университет Цукубы, Университет Хиросимы и Национальный институт информатики, объединили усилия для изучения теоретических моделей и практических приложений в сфере интеллектуальных систем.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование охватывает фундаментальные аспекты HCI и современных алгоритмов поиска, закладывая основу для разработки более эффективных человеко-ориентированных технологий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Работа сфокусирована на совершенствовании взаимодействия между пользователем и вычислительными системами. В рамках методологии авторы опираются на классификацию CCS (Computing Classification System), что позволяет систематизировать подходы к проектированию интерфейсов и оптимизации алгоритмов обработки данных. Исследовательский коллектив анализирует, как современные модели ИИ могут быть интегрированы в системы поиска для повышения релевантности выдачи и улучшения пользовательского опыта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;HCI (Human-Computer Interaction) — это область знаний, изучающая взаимодействие человека с компьютерными системами, направленная на создание интуитивно понятных и эффективных интерфейсов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"neyavnye-dopusheniya-tekushej-ocenki\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#neyavnye-dopusheniya-tekushej-ocenki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Неявные допущения текущей оценки&lt;/span&gt;&lt;/a&gt;Неявные допущения текущей оценки&lt;/h4&gt;\n&lt;p&gt;Современные подходы к оптимизации генеративных движков (GEO) рассматривают влияние контента как разовый прирост видимости в рамках одного запроса. Стандартная методика предполагает выборку запроса q из распределения, сравнение работы движка с оптимизированным контентом и без него, а также расчет разницы в показателях (например, взвешенное по позиции количество слов или оценка &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;). Итоговая эффективность вычисляется как среднее значение по независимым запросам. Этот метод опирается на два допущения: экзогенность запросов (они не зависят от системы) и независимость итераций (каждый запрос оценивается изолированно).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие метрики GEO систематически недооценивают влияние оптимизации, так как игнорируют петлю обратной связи между человеком и ИИ в многоходовых диалогах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Conversational capture (конверсионный захват) — это феномен, при котором источник, однажды процитированный в начале диалога, с высокой вероятностью будет цитироваться снова, независимо от того, насколько он актуален для текущих потребностей пользователя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы вводят понятие «конверсионного захвата»: в многоходовом поиске цитирование источника на ранних этапах повышает вероятность его повторного появления. Это происходит по двум каналам: машинному (система учитывает историю диалога при поиске) и человеческому (ответы движка направляют последующие вопросы пользователя в сторону уже предложенного источника). Текущие методы оценки не учитывают, что система сама формирует историю диалога, влияя на будущие запросы. В работе предложена модель динамической системы с обратной связью, разделяющая машинный и человеческий каналы захвата, а также метрики на уровне траекторий, такие как &lt;a href=\"concepts/cumulative-conversational-visibility.html\"&gt;кумулятивная видимость&lt;/a&gt; и &lt;a href=\"concepts/capture-coefficient.html\"&gt;коэффициент захвата&lt;/a&gt;. Теоретический анализ с использованием теории процессов подкрепления (урна Пойи) доказывает, что выгода от GEO растет суперлинейно по мере увеличения длины диалога, а одноходовая оценка дает систематическую ошибку, расходящуюся с оценкой на уровне траекторий (Kendall’s τ=0.4).&lt;/p&gt;\n&lt;h4 id=\"mnogohodovaya-realnost-zamknutyj-cikl\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#mnogohodovaya-realnost-zamknutyj-cikl\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Многоходовая реальность: замкнутый цикл&lt;/span&gt;&lt;/a&gt;Многоходовая реальность: замкнутый цикл&lt;/h4&gt;\n&lt;p&gt;В диалоговых системах взаимодействие представляет собой непрерывный процесс: состояние пользователя b_t порождает запрос q_t, на который агент дает ответ r_t, обновляя состояние до bt+1. Если метод оптимизации генеративного поиска (GEO) смещает ответ r_t в сторону определенного источника s, это создает два эффекта. Во-первых, будущий поиск системы обуславливается историей, где s уже доминирует. Во-вторых, это подталкивает bt+1 и последующий запрос qt+1 к области информации, связанной с s. Эти факторы замыкают цикл, повышая вероятность повторного цитирования s на шаге t+1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Запросы в диалоге эндогенны, а шаги взаимосвязаны: предвзятость на раннем этапе создает петлю обратной связи, закрепляющую доминирование источника.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"konversionnyj-zahvat\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#konversionnyj-zahvat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конверсионный захват&lt;/span&gt;&lt;/a&gt;Конверсионный захват&lt;/h4&gt;\n&lt;p&gt;Авторы вводят термин «конверсионный захват» (conversational capture) для описания феномена, при котором раннее цитирование источника значительно повышает вероятность его появления в будущем, независимо от актуальности для пользователя. Это происходит из-за трех механизмов: контекст диалога включен в условия генерации; модели стремятся к самосогласованности с предыдущими ответами; сам процесс поиска смещается контекстом беседы. Оценка GEO как «одношагового воздействия» делает этот захват невидимым, хотя он проявляется на уровне траекторий, а не отдельных ответов.&lt;/p&gt;\n&lt;h4 id=\"pozicionirovanie-i-svyazannye-raboty\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#pozicionirovanie-i-svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Позиционирование и связанные работы&lt;/span&gt;&lt;/a&gt;Позиционирование и связанные работы&lt;/h4&gt;\n&lt;p&gt;Исследование критикует текущие методы оценки, которые рассматривают каждый &lt;a href=\"concepts/step.html\"&gt;шаг&lt;/a&gt; диалога изолированно, предлагая вместо этого анализ траекторий. В отличие от существующих бенчмарков, где последовательность запросов зафиксирована (что делает невозможным изменение поведения пользователя), данная работа изучает причинно-следственные связи в динамике диалога. Это связывает GEO с проблемами «пузырей фильтров» и предвзятости поисковых систем, переводя дискуссию в плоскость динамики «шаг за шагом».&lt;/p&gt;\n&lt;h4 id=\"obuekty-i-dinamika-zamknutogo-cikla\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#obuekty-i-dinamika-zamknutogo-cikla\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объекты и динамика замкнутого цикла&lt;/span&gt;&lt;/a&gt;Объекты и динамика замкнутого цикла&lt;/h4&gt;\n&lt;p&gt;Система состоит из двух слоев: агент (оператор A), выдающий видимость источника &lt;span class=\"yfm-latex\" data-content=\"w_t(s)%20%5Cin%20%5B0%2C%201%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, и пользователь (операторы Q и U), формирующий запрос q_t и обновляющий состояние bt+1. Полная динамика системы описывается уравнением (1), где история диалога ht-1 и оптимизированные источники SGEO влияют на текущий ответ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/black-box.html\"&gt;Метод «черного ящика»&lt;/a&gt; (black-box) — подход, при котором мы анализируем только входные и выходные данные системы, не имея доступа к ее внутренним алгоритмам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dva-nezavisimyh-kanala-zahvata\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#dva-nezavisimyh-kanala-zahvata\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Два независимых канала захвата&lt;/span&gt;&lt;/a&gt;Два независимых канала захвата&lt;/h4&gt;\n&lt;p&gt;Авторы разделяют захват на два измеримых канала: M1 (машинный) и M2 (человеческий). M1 — это свойство агента A, при котором модель склонна повторять свои прошлые цитирования, что измеряется сравнением контекстно-зависимого движка с безразличным к истории. M2 — это вклад поведения пользователя, когда ответ системы меняет его будущие запросы. Разделение M1 и M2 позволяет оценить вклад каждого механизма отдельно.&lt;/p&gt;\n&lt;h4 id=\"sovokupnaya-vidimost-v-dialoge-ccv\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#sovokupnaya-vidimost-v-dialoge-ccv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Совокупная видимость в диалоге (CCV)&lt;/span&gt;&lt;/a&gt;Совокупная видимость в диалоге (CCV)&lt;/h4&gt;\n&lt;p&gt;Общая видимость источника s за время диалога рассчитывается как &lt;span class=\"yfm-latex\" data-content=\"CCV_s%20%3D%20%5Csum_%7Bt%3D1%7D%5E%7BT%7D%20%5Cgamma_t%20w_t(s)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где w_t(s) — видимость на шаге t, а γ_t — весовой коэффициент внимания. При γ_t=1 показатель превращается в простую сумму видимости. Убывающие значения γ_t подчеркивают важность ранних ответов (эффект первичности), а возрастающие — недавних (эффект недавности). По умолчанию используется нейтральный вес γ_t=1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CCV позволяет оценить накопленный эффект присутствия источника в диалоге, учитывая распределение внимания пользователя во времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dekompoziciya-prirosta-traektorii\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#dekompoziciya-prirosta-traektorii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Декомпозиция прироста траектории&lt;/span&gt;&lt;/a&gt;Декомпозиция прироста траектории&lt;/h4&gt;\n&lt;p&gt;Прирост от GEO (оптимизации генеративного поиска) за один ход L₁(s) фиксирует разницу видимости при неизменном запросе. Однако реальный прирост за всю траекторию L_T(s) — это разница CCV между GEO и его отсутствием. Мы разделяем L_T на прямой эффект Ldirect^T (сумма лифтов при фиксированном пути запросов) и эффект обратной связи Lfeedback^T (дополнительная видимость из-за изменения запросов под влиянием GEO).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Прямой эффект — это то, что предсказал бы стандартный тест, а эффект обратной связи — это «петля», возникающая, когда ответы системы меняют поведение пользователя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"klyuchevoe-svojstvo\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#klyuchevoe-svojstvo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ключевое свойство&lt;/span&gt;&lt;/a&gt;Ключевое свойство&lt;/h4&gt;\n&lt;p&gt;Lfeedback^T равно нулю в системах без памяти или при оценке по одному ходу. Оно становится ненулевым только при наличии «человека в контуре» или истории диалога, что делает его критически важным параметром, который обычно игнорируется.&lt;/p&gt;\n&lt;h4 id=\"razdelenie-kanalov-obratnoj-svyazi\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#razdelenie-kanalov-obratnoj-svyazi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разделение каналов обратной связи&lt;/span&gt;&lt;/a&gt;Разделение каналов обратной связи&lt;/h4&gt;\n&lt;p&gt;Lfeedback^T состоит из двух частей: LM1^T (влияние истории диалога ht-1 на модель) и LM2^T (изменение запросов пользователя q_t из-за смены его убеждений). Мы анализируем их через контрфактический анализ: LM1^T измеряет захват через историю при фиксированных запросах, а LM2^T — дополнительный захват, когда пользователь задает уточняющие вопросы под влиянием GEO. Сумма этих эффектов дает общий Lfeedback^T.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка LM1^T возможна без модели пользователя, тогда как LM2^T требует учета человеческого фактора и взаимодействия в системе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"koefficient-zahvata-i-otnoshenie-kompaundirovaniya\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#koefficient-zahvata-i-otnoshenie-kompaundirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коэффициент захвата и отношение компаундирования&lt;/span&gt;&lt;/a&gt;Коэффициент захвата и отношение компаундирования&lt;/h4&gt;\n&lt;p&gt;Сила самоподкрепления источника κ(s) измеряется как разница вероятностей цитирования при наличии или отсутствии предыдущей цитаты. Если κ(s) &amp;gt; 0, это признак «захвата». Отношение &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3D%20L_T%20%2F%20(T%20%5Ccdot%20L_1)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; показывает точность оценки: при &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3E%201\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; одноходовая оценка недооценивает реальное влияние GEO, так как эффект накапливается.&lt;/p&gt;\n&lt;h4 id=\"diagnostika-ranzhirovaniya\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#diagnostika-ranzhirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диагностика ранжирования&lt;/span&gt;&lt;/a&gt;Диагностика ранжирования&lt;/h4&gt;\n&lt;p&gt;Для проверки корректности методов мы используем коэффициент Кендалла τ между рангами методов по L₁ и L_T. Низкое или отрицательное значение τ сигнализирует, что лучший метод по одноходовой оценке может оказаться неэффективным в реальном диалоге.&lt;/p&gt;\n&lt;h4 id=\"teoreticheskij-analiz-zavisimost-ot-puti-i-superlinejnyj-rost\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#teoreticheskij-analiz-zavisimost-ot-puti-i-superlinejnyj-rost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теоретический анализ: зависимость от пути и суперлинейный рост&lt;/span&gt;&lt;/a&gt;Теоретический анализ: зависимость от пути и суперлинейный рост&lt;/h4&gt;\n&lt;p&gt;Мы исследуем процесс захвата внимания, используя теорию процессов подкрепления, которая также описывает механизмы предпочтительного присоединения и экономического «запирания» (lock-in). В нашей модели конкурируют два источника: оптимизированный через GEO (источник g) и совокупный конкурент (источник c). Цитирование представлено как выбор из урны Пойя, где начальное состояние (G₀ и C₀) отражает релевантность на первом шаге. Вероятность выбора источника пропорциональна текущему числу «шаров» в урне, а после выбора количество шаров увеличивается на величину подкрепления s_g или s_c. Асимметрия подкрепления, вызывающая захват, определяется как s_g - s_c = Δ M₁ + Δ M₂, где Δ M₁ — вклад истории (M1), а Δ M₂ — вклад дрейфа запросов (M2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Начальное преимущество GEO определяет долгосрочный результат, так как процесс неэргодичен, а асимметричное подкрепление приводит к суперлинейному росту видимости источника.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Согласно предложению 6.1, при симметричном подкреплении (s_g = s_c) доля цитирований источника g сходится к случайному пределу W_∞ ~ Beta(G₀/s, C₀/s). Это означает, что ранние шаги определяют долгосрочный успех, а GEO максимально эффективно использует это преимущество, увеличивая G₀. Предложение 6.2 показывает, что при s_g &amp;gt; s_c ожидаемая видимость w_t(g) растет, а совокупный выигрыш L_T демонстрирует суперлинейную динамику до момента насыщения видимости. В пределе среднего поля доля y_t подчиняется уравнению &lt;span class=\"yfm-latex\" data-content=\"%5Cdot%7By%7D%20%3D%20y(1-y)(s_g-s_c)%2FN_t%20%3E%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Неэргодичность означает, что система «помнит» свои ранние состояния, и случайные колебания в начале пути могут привести к необратимому доминированию одного из источников.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Следствие 6.3 вводит понятие обратной связи L_T^feedback. Если L_T^feedback &amp;gt; 0, это указывает на то, что человеческий фактор или история взаимодействий замыкают петлю в пользу захвата, что не учитывается при оценке на одном шаге. Следствие 6.4 доказывает, что эффекты каналов M1 и M2 аддитивны: L_T^M1 + L_T^M2 = L_T^feedback. Каждый из них равен нулю только при отсутствии соответствующих условий (памяти системы или дрейфа запросов).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Знак обратной связи зависит от поведения пользователей: если они склонны к критической проверке ответов, L_T^feedback может быть отрицательным, что делает одношаговую оценку GEO завышенной.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Теория связывает стохастическую модель урны с детерминированной рекурсией, где δ соответствует начальному составу G₀, а β — асимметрии подкрепления. Оба подхода подтверждают, что захват внимания является монотонным процессом, усиливающим отклонения и стремящимся к монополии.&lt;/p&gt;\n&lt;h4 id=\"vychislitelnaya-illyustraciya\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#vychislitelnaya-illyustraciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вычислительная иллюстрация&lt;/span&gt;&lt;/a&gt;Вычислительная иллюстрация&lt;/h4&gt;\n&lt;p&gt;Мы демонстрируем работу модели из раздела 6 в контролируемой детерминированной среде. Цель — показать вычислимость конструкций из раздела 5, подтвердить предсказанные эффекты и доказать, что два метода оценки (одношаговый и траекторный) могут приводить к разным рейтингам эффективности. Все значения рассчитаны по формуле (13). Модель показывает, что неучтенные факторы влияют на выбор метода, однако не оценивает их реальный масштаб в действующих системах.&lt;/p&gt;\n&lt;h4 id=\"nastrojka\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#nastrojka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка&lt;/span&gt;&lt;/a&gt;Настройка&lt;/h4&gt;\n&lt;p&gt;Используется &lt;a href=\"concepts/rekursiya.html\"&gt;рекурсия&lt;/a&gt; с замкнутой формой, где параметры соответствуют рычагам GEO: δ (прирост видимости на первом шаге) и β (сила захвата). При β=0 система работает как «безпамятная» с независимыми шагами. Мы задаем β = βM1 + βM2, где βM1=0,35 и βM2=0,25. Для примера установлены параметры δ=0,12, β=0,6 и T=10. Сравниваются три траектории: базовый уровень без GEO (w_t=0,5), контрфактическая модель прямого воздействия (w_t=0,5+δ) и полная замкнутая петля по уравнению (13).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рекурсия — это метод вычисления, где каждое следующее значение зависит от предыдущего, что позволяет моделировать накопленный эффект обратной связи в поисковой выдаче.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oshibki-ranzhirovaniya-pri-odnoshagovoj-ocenke\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#oshibki-ranzhirovaniya-pri-odnoshagovoj-ocenke\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ошибки ранжирования при одношаговой оценке&lt;/span&gt;&lt;/a&gt;Ошибки ранжирования при одношаговой оценке&lt;/h4&gt;\n&lt;p&gt;Мы сравнили пять методов GEO, варьирующих δ и β. Таблица 2 показывает, что рейтинги по одношаговому приросту (L₁) и совокупному траекторному эффекту (L_T) не совпадают. Коэффициент Кендалла τ=0,4 указывает на слабую корреляцию. Например, метод A лидирует при одношаговой оценке, но занимает лишь третье место по долгосрочному влиянию. Метод D, наоборот, почти аутсайдер в краткосрочной перспективе, но второй по траекторному охвату. Оптимизация только по L₁ ведет к неверному выбору стратегии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 90% случаев при случайной выборке методов рейтинги по одношаговому и траекторному критериям расходятся, что делает краткосрочные метрики ненадежными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ustojchivost-kachestvennyh-vyvodov\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#ustojchivost-kachestvennyh-vyvodov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устойчивость качественных выводов&lt;/span&gt;&lt;/a&gt;Устойчивость качественных выводов&lt;/h4&gt;\n&lt;p&gt;Качественные выводы не зависят от конкретных чисел: при β&amp;gt;0 траекторный эффект всегда выше базового. Мы провели симуляцию на 5 × 10⁴ случайных наборах методов. В 48% случаев победитель по одношаговому критерию не является победителем по траекторному. Если предположить отрицательную корреляцию между δ и β (компромисс между заметностью и захватом), расхождение рейтингов усиливается до среднего τ=0,18, а ошибка выбора победителя достигает 91%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель опирается на теоретические допущения; реальное положение методов GEO в плоскости (δ, β) требует эмпирической проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"osnovy-vzaimodejstviya-cheloveka-i-kompyutera\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#osnovy-vzaimodejstviya-cheloveka-i-kompyutera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основы взаимодействия человека и компьютера&lt;/span&gt;&lt;/a&gt;Основы взаимодействия человека и компьютера&lt;/h4&gt;\n&lt;p&gt;Человеческий фактор в системе M2 замыкает цикл обратной связи, делая поисковый запрос эндогенным. Мы опираемся на три фундаментальные теории для описания поведения пользователя.&lt;/p&gt;\n&lt;p&gt;Оператор запроса Q рассматривается через теорию поиска информации (Information Foraging Theory). Пользователь действует как собиратель, ориентируясь на «&lt;a href=\"concepts/informatsionnyy-zapah.html\"&gt;информационный запах&lt;/a&gt;» — сигналы, указывающие на ценность данных. Последующий запрос qt+1=Q(bt+1) представляет собой шаг вдоль градиента этого запаха. Гео-оптимизированный (GEO) ответ искусственно повышает воспринимаемую ценность конкретного источника, направляя пользователя по заданному пути. Это объясняет, почему поисковые запросы постепенно смещаются в сторону «захваченных» источников.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Информационный запах — это метафора для оценки пользователем полезности контента на основе косвенных признаков (заголовков, сниппетов) до перехода по ссылке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Слой последствий анализируется через калибровку доверия. Адекватное использование системы требует, чтобы воспринимаемая надежность соответствовала реальной. Однако «захват» контента разрывает эту связь: частое повторение информации повышает доверие к источнику за счет эффекта знакомства, одновременно ограничивая доступ к альтернативным данным. В результате возникает рассогласование (miscalibration) — разрыв между долей цитирований источника и его фактической достоверностью.&lt;/p&gt;\n&lt;p&gt;Нормативный слой описывается через байесовское убеждение. Многоходовая GEO-оптимизация представлена как последовательная игра на убеждение, где владелец контента выступает отправителем, выбирающим стратегию сигнализации, а агент — каналом передачи. Пользователь выступает в роли получателя, обновляющего свои убеждения. Такой подход позволяет оценивать манипуляцию и благосостояние без априорного утверждения, что пользователь обязательно введен в заблуждение. GEO рассматривается как стратегия раскрытия информации, где многоходовая форма значительно эффективнее одноходовой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Теоретическая модель доказывает, что GEO-манипуляция эффективно направляет пользователя, используя механизмы доверия и поиска информации, превращая многоходовое взаимодействие в мощный инструмент влияния.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"posledstviya-dlya-proektirovaniya-poiskovyh-sistem\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#posledstviya-dlya-proektirovaniya-poiskovyh-sistem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Последствия для проектирования поисковых систем&lt;/span&gt;&lt;/a&gt;Последствия для проектирования поисковых систем&lt;/h4&gt;\n&lt;p&gt;Диалоговое взаимодействие как поверхность для манипуляций. В то время как поисковые системы с генеративным ответом (GEO) при одноходовом запросе борются за один ответ, многоходовые диалоги предполагают борьбу за всю траекторию взаимодействия. Согласно предложению 6.1, влияние манипуляций максимально на ранних этапах диалога, поэтому защитные механизмы должны быть сосредоточены именно на этих шагах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность GEO-манипуляций концентрируется в первых итерациях диалога, что требует смещения фокуса защиты на начальные этапы взаимодействия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Инструменты проектирования. Модель предлагает три способа смягчения рисков. Во-первых, повторное обоснование (re-grounding) на каждом шаге снижает вес предыдущего контекста ht-1 при поиске, что ограничивает параметр κ. Во-вторых, принудительное разнообразие источников ограничивает долю любого отдельного источника в рамках одного хода, напрямую контролируя L^feedback_T. В-третьих, прозрачность происхождения информации объясняет пользователю, почему источник продолжает цитироваться, позволяя отличить повторную цитату от текущей релевантности. Это помогает пользователю откалибровать доверие.&lt;/p&gt;\n&lt;p&gt;Оценка должна перейти к анализу траекторий. Аудиты GEO и бенчмарки поисковых систем должны отчитываться не только по видимости на одном шаге, но и по метрикам уровня траектории: L_T, L^feedback_T, &lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, κ, а также по показателю ошибочного ранжирования τ. Эти метрики используют те же значения весов w_t(s), что и существующие конвейеры обработки данных.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya-i-ugrozy-validnosti\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#ogranicheniya-i-ugrozy-validnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и угрозы валидности&lt;/span&gt;&lt;/a&gt;Ограничения и угрозы валидности&lt;/h4&gt;\n&lt;p&gt;Мы выделяем три основные угрозы и предлагаем протокол их оценки. Вычислимость и эмпирическая проверка. Все параметры из раздела 5 вычислимы через видимость на каждом шаге. Следующим шагом должно стать измерение w_t(s), κ, &lt;span class=\"yfm-latex\" data-content=\"%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и τ на корпусах диалоговых систем (например, TopiOCQA, QReCC, ORConvQA), которые поддерживают цепочки уточняющих вопросов. Протокол предполагает внедрение GEO-оптимизированных и контрольных фрагментов в &lt;a href=\"concepts/retrieval-augmented-generation.html\"&gt;RAG&lt;/a&gt;-&lt;a href=\"concepts/pipeline.html\"&gt;конвейер&lt;/a&gt; с открытым исходным кодом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RAG (Retrieval-Augmented Generation) — метод, при котором модель сначала ищет информацию во внешних источниках, а затем генерирует ответ на их основе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зависимость от симуляции пользователя. В планируемом исследовании основная траектория опирается на реальные запросы, а влияние машинного канала M₁ измеряется без модели пользователя. Сравнение контекстно-зависимого движка с движком без памяти на идентичных запросах позволяет оценить L^M₁_T. Оставшаяся часть L^feedback_T представляет собой L^M₂_T (человеческий фактор), которую можно восстановить через контрфактический анализ того, что бы спросил пользователь без влияния GEO. Для этого потребуется &lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;симулятор пользователя&lt;/a&gt; на базе LLM, откалиброванный по таксономии действий (углубление, перефразирование, вызов, переключение).&lt;/p&gt;\n&lt;p&gt;Поведенческие допущения. Мы не утверждаем, что пользователи подвергаются манипуляции; наша модель выдвигает гипотезу, требующую поведенческой валидации. Другие ограничения: (i) оценка видимости через LLM-судью несовершенна и требует проверки на соответствие эталонным меткам; (ii) использование RAG с открытым кодом отличается от коммерческих систем, поэтому необходима репликация на нескольких моделях; (iii) мы не измеряем реальное доверие пользователей; (iv) модель «двух источников» упрощает реальную конкуренцию, однако при линейном подкреплении аргументы обобщаются на K источников с переходом от распределения Бета к распределению Дирихле.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"pereosmyslenie-ocenki-geo\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#pereosmyslenie-ocenki-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Переосмысление оценки GEO&lt;/span&gt;&lt;/a&gt;Переосмысление оценки GEO&lt;/h4&gt;\n&lt;p&gt;Современные подходы к оценке генеративной оптимизации поиска (GEO) рассматривают диалог как набор разрозненных поисковых запросов. Однако такой подход игнорирует влияние поискового движка на последующие вопросы пользователя. Мы ввели понятие «конверсионного захвата» (conversational capture) — феномена, при котором начальное преимущество GEO усиливается через цикл обратной связи между человеком и агентом. Мы формализовали этот цикл, разделив его на машинный и человеческий каналы, и определили метрики на уровне траекторий диалога.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка GEO по отдельным запросам недооценивает реальный эффект, так как накопленный выигрыш растет суперлинейно по мере удлинения диалога.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Теория процессов с подкреплением доказывает, что данная динамика является неэргодичной: ранние этапы диалога предопределяют итоговый результат. При одноходовой оценке член обратной связи Lfeedback^T равен нулю, что приводит к значительной недооценке эффективности метода. Моделирование показывает, что вклад обратной связи может доминировать над прямым эффектом, из-за чего рейтинги методов GEO при оценке одного запроса и целой траектории могут расходиться. В результате стандартная оценка часто выбирает неоптимальные методы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Неэргодичность означает, что система «помнит» свои ранние состояния, и случайные события в начале диалога необратимо меняют его финал.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы рекомендуем перейти к оценке полных траекторий диалога. Поисковым системам следует внедрять механизмы перепроверки фактов (re-grounding), диверсификации ответов и объяснения устойчивых цитат. Дальнейшие исследования должны быть направлены на эмпирическую проверку человеческого канала обратной связи с использованием реальных диалоговых корпусов и пользовательских данных.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval-f1.jpg\" alt=\"Рисунок 1: Обзор разговорного захвата.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Обзор разговорного захвата.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Обзор разговорного захвата. (A) Поиск информации человеком-агентом представляет собой замкнутый цикл: ответ 𝑟𝑡 обновляет убеждения пользователя 𝑏𝑡+1 и, следовательно, следующий запрос 𝑞𝑡 = 𝑄(𝑏𝑡), где 𝑄 — оператор запроса (канал со стороны человека M2), при этом также обуславливая движок историей диалога ℎ𝑡 (канал со стороны машины M1); начальное смещение GEO в оптимизированном наборе источников 𝑆GEO распространяется по обоим путям возврата. (B) Поскольку цикл усиливается, совокупный прирост траектории 𝐿𝑇 превышает экстраполяцию одного хода 𝑇 · 𝐿1; избыток представляет собой член обратной связи 𝐿feedback 𝑇, который тождественно равен нулю при оценке одного хода. Столбец разделяет 𝐿𝑇 = 2.68 при 𝑇=10 на прямой член (𝐿direct 𝑇 = 1.20) и член обратной связи (𝐿feedback 𝑇 = 1.48). Последний разделен на канал со стороны машины (𝐿M1 𝑇 = 0.85, синий, модель пользователя не требуется) и канал со стороны человека (𝐿M2 𝑇 = 0.63, ржавый), окрашенные как в (A); коэффициент накопления составляет 𝜌 = 2.23. (C) Следовательно, ранжирование методов GEO по приросту за один ход не совпадает с ранжированием по приросту траектории (𝜏 Кендалла = 0.4): победитель одного хода (A) занимает лишь третье место по траектории.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval-f2.jpg\" alt=\"Рисунок 2: Видимость источника GEO на каждом ходу при рекурсии замкнутого цикла (13) (𝛿 = 0.12, 𝛽 = 0.6).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Видимость источника GEO на каждом ходу при рекурсии замкнутого цикла (13) (𝛿 = 0.12, 𝛽 = 0.6).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Видимость источника GEO на каждом ходу при рекурсии замкнутого цикла (13) (𝛿 = 0.12, 𝛽 = 0.6). Заштрихованный промежуток между замкнутым циклом и контрфактуалом только прямого действия представляет собой вклад обратной связи 𝐿feedback 𝑇. На рисунке 2 представлены три траектории. Доля замкнутого цикла возрастает с 0.62 на 1-м ходу до 0.91 на 10-м ходу, в то время как контрфактуал только прямого действия остается неизменным на уровне 0.62. Промежуток — это чистая обратная связь, а именно видимость, которую GEO создает только потому, что цикл замкнут.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Неадекватность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оценки GEO по&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;одному ответу&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Моделирование&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;замкнутого&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;цикла диалога&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Выявлен эффект&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;разговорного&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;захвата&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Нужны метрики&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-
