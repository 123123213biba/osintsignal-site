        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"111\" cy=\"167\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"629\" cy=\"190\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SYNTHETIC   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему научные статьи от ИИ&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;выглядят как под копирку&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Авторы работы сравнили структуру аргументации в реальных лингвистических статьях и текстах, созданных четырьмя топовыми &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;. Выяснилось, что ИИ придерживается жестких шаблонов, тогда как люди действуют гибко. Даже прямые инструкции по модели CARS делают ответы нейросетей еще более однообразными.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ИИ-тексты следуют узким и однообразным шаблонам аргументации.&lt;/li&gt;\n&lt;li&gt;Люди-эксперты распознают &lt;a href=\"concepts/dikiy-ii-tekst.html\"&gt;ИИ-контент&lt;/a&gt; в 90% случаев по структуре.&lt;/li&gt;\n&lt;li&gt;Инструкции по структуре CARS делают ответы ИИ еще более жесткими.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metody-i-tochnost\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#metody-i-tochnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и точность&lt;/span&gt;&lt;/a&gt;Методы и точность&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Метод&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Данные&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Точность&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Где ошибается&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Автоматический классификатор CARS&lt;/td&gt;\n&lt;td&gt;76 статей по лингвистике&lt;/td&gt;\n&lt;td&gt;92% от точности человека&lt;/td&gt;\n&lt;td&gt;Требует валидации на других доменах&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Слепое тестирование людьми&lt;/td&gt;\n&lt;td&gt;Экспертная оценка сгенерированных текстов&lt;/td&gt;\n&lt;td&gt;90% успешного определения&lt;/td&gt;\n&lt;td&gt;Субъективность экспертной оценки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследование опирается на модель &lt;a href=\"concepts/create-a-research-space.html\"&gt;CARS (Create-a-Research-Space)&lt;/a&gt;, которая описывает структуру вступлений через три риторических шага: установление территории, выделение ниши и занятие этой ниши. Ученые проанализировали 76 оригинальных статей и 608 сгенерированных аналогов, созданных моделями GPT-5.5, Claude Opus 4.8, Gemma-4-31B-it и Qwen3.5-27B. Для оценки использовался автоматизированный классификатор, который сегментирует текст и определяет риторические шаги с точностью 92% относительно человеческой разметки.&lt;/p&gt;\n&lt;p&gt;Результаты показывают, что люди используют более разнообразные последовательности аргументов. ИИ, напротив, склонен к жесткой унификации, а попытки «научить» его структуре CARS через промпты лишь усиливают эту ригидность. В слепом тесте люди-эксперты в 90% случаев безошибочно определяли авторство текста, опираясь именно на предсказуемость структуры аргументации, а не на стиль или лексику.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выборка ограничена 76 статьями по лингвистике, что может не отражать специфику других научных дисциплин.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Большие языковые модели (LLM) переходят от роли помощников в написании текстов к участию в исследовательской деятельности. Это требует понимания того, чем научные тексты, созданные ИИ, отличаются от написанных человеком. Предыдущие исследования фокусировались на поверхностных лексических и стилистических признаках, которые легко устраняются простым перефразированием.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показало, что тексты ИИ отличаются от человеческих не лексикой, а жесткой структурой аргументации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы сосредоточились на риторической структуре — последовательности аргументативных ходов, с помощью которых текст обосновывает свою значимость. В качестве теоретической базы использовалась &lt;a href=\"concepts/model-cars.html\"&gt;модель CARS&lt;/a&gt; (Create a Research Space) Джона Суэйлса. Исследователи сравнили введения к научным статьям по лингвистике, написанные людьми, с аналогичными текстами, сгенерированными LLM для тех же работ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель CARS — это стандартная схема построения введения в научной статье, включающая три этапа: установление области исследования, создание ниши и занятие этой ниши.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ выявил, что человеческие тексты демонстрируют большую гибкость в выборе риторических ходов и их последовательности. Сгенерированные тексты оказались более однородными и предсказуемыми. Попытка задать моделям правила CARS в явном виде привела к еще большей жесткости структуры, что снижает естественность научного повествования.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено анализом введений к статьям по лингвистике; результаты могут отличаться для других научных дисциплин.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Большие языковые модели (LLM) всё чаще участвуют в научном процессе: от формулирования гипотез и анализа литературы до проведения полных циклов исследований и написания итоговых статей. Поскольку роль ИИ в подготовке научных текстов растет, важно понять, как модели выстраивают аргументацию и соотносят свою работу с предыдущими исследованиями, и делают ли они это так же, как люди. Предыдущие методы сравнения текстов опирались на лексическую статистику, стилистические отпечатки и синтаксические паттерны. Однако такие показатели мало говорят о том, как модель формирует структуру аргументации, к тому же современные модели всё лучше имитируют стиль человека, а простое перефразирование стирает поверхностные следы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование фокусируется на риторической структуре научных текстов, так как поверхностные методы анализа становятся неэффективными против современных LLM.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы предлагают анализировать риторическую структуру — последовательность аргументативных ходов, выполняющих коммуникативные функции. В качестве объекта выбраны введения к научным статьям (RAI), так как они требуют плотной аргументации на ограниченном пространстве. Используется модель CARS (Create-A-Research-Space), описывающая введение через три хода: установление исследовательской территории (Move 1), выявление пробела в знаниях (Move 2) и заполнение этого пробела текущим исследованием (Move 3). Каждый ход состоит из более мелких шагов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель CARS — это стандартный лингвистический подход к анализу структуры научных введений, где автор последовательно переходит от общего контекста к конкретной задаче исследования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследование ставит три вопроса: может ли ИИ-аннотатор надежно определять ходы и шаги CARS (RQ1); чем отличаются введения, написанные людьми и ИИ, по своей структуре (RQ2); и как явные инструкции по модели CARS влияют на структуру текстов, созданных LLM (RQ3). Для ответа на них авторы создали &lt;a href=\"concepts/automatic-annotator.html\"&gt;автоматический аннотатор&lt;/a&gt;, который разбивает текст на сегменты и классифицирует их. Инструмент был валидирован двумя экспертами и достиг 92% от точности человеческой разметки. Для анализа сгенерированных текстов использовались 76 опубликованных лингвистических статей с экспертной разметкой. Четыре LLM (две коммерческие и две с открытыми весами) написали по два варианта каждого введения: с базовым промптом и с добавлением определений CARS, что дало 608 сгенерированных текстов. Результаты показывают, что ИИ-тексты следуют более узкому и однородному диапазону последовательностей ходов, чем тексты людей, которых читатели отличают в 90% случаев «слепых» оценок, опираясь именно на структуру.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы&lt;/span&gt;&lt;/a&gt;Связанные работы&lt;/h4&gt;\n&lt;p&gt;Два направления исследований имеют отношение к данной работе: генерация и обнаружение научно-технических текстов, написанных машиной, и анализ их риторической структуры.&lt;/p&gt;\n&lt;h4 id=\"llm-v-nauchnoj-literature-i-metody-ih-obnaruzheniya\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#llm-v-nauchnoj-literature-i-metody-ih-obnaruzheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LLM в научной литературе и методы их обнаружения&lt;/span&gt;&lt;/a&gt;LLM в научной литературе и методы их обнаружения&lt;/h4&gt;\n&lt;p&gt;Большие языковые модели (LLM) сегодня активно участвуют в создании научных текстов: от написания аннотаций на основе заголовков до генерации целых статей и автоматизированных конвейеров, объединяющих планирование экспериментов и написание отчетов. Доля текстов, созданных или отредактированных с помощью ИИ, в научных публикациях растет. Существующие методы обнаружения машинного текста опираются на поверхностные признаки: вероятность появления токенов, кривизну распределения вероятностей, артефакты декодирования и цифровые водяные знаки. Однако эти сигналы уязвимы: тексты, которые лучше всего вводят в заблуждение людей, сложнее всего поддаются автоматическому обнаружению. При использовании достаточно мощных моделей точность детекторов приближается к случайному угадыванию. Поэтому мы предлагаем анализировать риторическую структуру текста — более глубокий и устойчивый признак, на который, как мы показываем, опираются люди при оценке авторства введения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность детекторов, основанных на поверхностных признаках, падает по мере совершенствования моделей, что требует перехода к анализу глубинной риторической структуры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-ritoricheskoj-struktury\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#analiz-ritoricheskoj-struktury\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ риторической структуры&lt;/span&gt;&lt;/a&gt;Анализ риторической структуры&lt;/h4&gt;\n&lt;p&gt;Жанровый анализ рассматривает введение научной статьи как последовательность риторических ходов. Модель CARS (Create a Research Space) Дж. Суэйлса является стандартом в этой области: автор сначала обозначает область исследования, затем выделяет в ней нишу и, наконец, заполняет её. Автоматическое извлечение этой структуры имеет долгую историю, включая методы «аргументативного зонирования» и классификаторы, разработанные в рамках прикладной лингвистики для обучения академическому письму. В недавних исследованиях экспертная разметка сочетается с трансформерными моделями для автоматизации процесса. Мы отличаемся от предшественников тем, что фокусируемся на введении, а не на аннотации, сравниваем несколько моделей вместо одной и генерируем тексты на основе реальной литературы, имитируя контекст работы ученого. Поскольку экспертная разметка требует больших затрат времени, мы разработали автоматический аннотатор, который выполняет сегментацию и классификацию всего введения целиком, проходя валидацию на основе сравнения с оценками экспертов-людей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ritoricheskie-hody.html\"&gt;Риторические ходы&lt;/a&gt; — это функциональные части текста, которые выполняют конкретную задачу, например, обоснование актуальности или формулировку научной проблемы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Исследование сравнило структуру научных введений (RAI), написанных LLM, с оригиналами, созданными людьми, используя автоматический аннотатор модели CARS Свейлса. Выяснилось, что тексты ИИ более жестко структурированы и следуют узкому диапазону последовательностей ходов, в отличие от вариативности человеческого письма. Подача определений CARS моделям лишь усиливает этот разрыв. Читатель, знакомый с моделью CARS, может отличить текст ИИ от человеческого с точностью 90%, особенно если модель была направлена инструкциями CARS. &lt;a href=\"concepts/rhetorical-structure.html\"&gt;Риторическая структура&lt;/a&gt; текста является устойчивым маркером машинного авторства, который сохраняется даже при перефразировании.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Риторическая структура введений ИИ предсказуема и жестко ограничена, что позволяет выявлять машинный текст с точностью 90%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;p&gt;Точность входного контекста. Модели получали лишь метаданные и аннотации цитируемых работ, тогда как авторы-люди работали с полными текстами. Кроме того, список литературы был заранее задан, что ограничивает ИИ курируемым набором данных, а не полноценным знанием автора.&lt;/p&gt;\n&lt;p&gt;Масштаб корпуса и дисциплина. Работа ограничена 76 статьями по прикладной лингвистике. Использование автоматического аннотатора позволило масштабировать анализ, однако данные, извлеченные из PDF, содержат шум, несмотря на ручной контроль качества. Требуются исследования на более широких и разнообразных корпусах.&lt;/p&gt;\n&lt;p&gt;Обобщаемость модели CARS. Модель CARS не является универсальной: структура ходов сильно варьируется между дисциплинами и даже внутри них. Наши результаты показывают не каноническую структуру лингвистических введений, а сам факт разрыва между человеком и ИИ, который может проявляться по-разному в других областях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты ограничены одной дисциплиной и спецификой модели CARS, которая не учитывает глубинные логические аргументы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Глубина анализа аргументации. Модель CARS классифицирует функции текста, но не анализирует внутреннюю логику аргументов (тезисы, доказательства, обоснования). Это лишь первый &lt;a href=\"concepts/step.html\"&gt;шаг&lt;/a&gt;; будущие работы могут использовать более детальные фреймворки для анализа качества машинного письма.&lt;/p&gt;\n&lt;p&gt;Аннотатор и предел точности. Аннотатор на базе LLM был валидирован на 32 введениях, размеченных двумя людьми (по 16 на каждого). Отсутствие двойной разметки всех текстов ограничивает оценку «человеческого потолка» точности.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"korpus-i-ekspertnaya-razmetka\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#korpus-i-ekspertnaya-razmetka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Корпус и экспертная разметка&lt;/span&gt;&lt;/a&gt;Корпус и экспертная разметка&lt;/h4&gt;\n&lt;p&gt;Исследование опирается на корпус из 80 научных статей по прикладной лингвистике, отобранных поровну из журналов четырех квартилей (Q1–Q4). После проверки доступности материалов четыре статьи были исключены из-за наличия платного доступа (paywall), что оставило в финальной выборке 76 работ. В качестве эталонной разметки (gold labels) использованы экспертные данные, подготовленные согласно руководству Асади (2025). Схема аннотирования включает три «хода» (moves) и десять шагов, представленных в Таблице 4.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/hody-moves-v-lingvistike.html\"&gt;Ходы» (moves) в лингвистике&lt;/a&gt; — это функциональные блоки текста, которые выполняют определенную коммуникативную задачу, например, обоснование актуальности или описание пробела в знаниях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"generaciya-vvedenij\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#generaciya-vvedenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генерация введений&lt;/span&gt;&lt;/a&gt;Генерация введений&lt;/h4&gt;\n&lt;p&gt;Контекст и предобработка. Для корректного сравнения текстов, написанных человеком и ИИ, авторы реконструировали информационный контекст, доступный автору статьи: название, содержание работы и метаданные (включая аннотации) всех цитируемых источников. Для извлечения этих данных из PDF-файлов применялся &lt;a href=\"concepts/pipeline.html\"&gt;конвейер&lt;/a&gt; предобработки, включающий конвертацию текста и ручную коррекцию. Чтобы исключить влияние объема текста на результат, длина генерируемых введений ограничивалась размером оригинальных текстов.&lt;/p&gt;\n&lt;p&gt;Модели. В эксперименте использовались четыре системы: коммерческие GPT-5.5 и ClaudeOpus4.8, а также модели с открытыми весами Gemma-4-31B-it и Qwen3.5-27B. Использование локальных моделей важно для исследователей, которые стремятся избежать передачи неопубликованных данных через сторонние API. В тексте модели именуются как ChatGPT, Claude, Gemma и Qwen.&lt;/p&gt;\n&lt;p&gt;Настройки генерации. Для ответа на исследовательский вопрос RQ3 каждая модель создавала введения в двух режимах. В базовом режиме модель получала прямое задание написать введение без дополнительных инструкций. В режиме «CARS-guided» промпт включал определения ходов и шагов по Суэйлзу, а также требование сначала составить внутренний план последовательности ходов, а затем реализовать его в тексте. Всего было сгенерировано 608 вариантов введений (4 модели × 2 режима × 76 статей).&lt;/p&gt;\n&lt;h4 id=\"avtomaticheskaya-annotaciya-po-modeli-cars\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#avtomaticheskaya-annotaciya-po-modeli-cars\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Автоматическая аннотация по модели CARS&lt;/span&gt;&lt;/a&gt;Автоматическая аннотация по модели CARS&lt;/h4&gt;\n&lt;p&gt;Для сравнения риторической структуры текстов, написанных людьми и сгенерированных ИИ, требуется аннотация по модели CARS. Поскольку ручная разметка большого объема текстов невозможна, авторы разработали автоматический классификатор на базе LLM. Система разделяет введение на сегменты и присваивает каждому из них одну из десяти меток шагов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод CARS (Create a Research Space) — это лингвистическая модель анализа структуры научных введений, которая выделяет «ходы» (moves) и «шаги» (steps) для обоснования актуальности исследования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/segmentatsiya.html\"&gt;Сегментация&lt;/a&gt; и классификация. Авторы сравнили разные подходы к разметке: разделение текста на части по границам и классификацию каждого предложения отдельно с последующим объединением. Первый метод приводил к недосегментации (в среднем 6,6 сегмента против 9,6 в эталоне), а второй — к избыточной сегментации (10,5 против 9,2). Совместное выполнение сегментации и классификации повысило точность определения границ (F1 вырос с 0,50 до 0,71), поэтому была выбрана стратегия единого промпта, где модель выдает упорядоченную последовательность размеченных сегментов.&lt;/p&gt;\n&lt;p&gt;Стратегия промптинга. Промпт включает руководство по аннотированию и три примера (few-shot) разной степени детализации (3, 9 и 18 сегментов). Используется метод «цепочки рассуждений» (chain-of-thought): модель сначала определяет «ход», затем «шаг», обосновывая решение одним предложением. После тестирования моделей ChatGPT, Claude и Gemini 3.1 Pro, для основной работы был выбран ChatGPT, показавший наилучшую точность классификации шагов (0,773).&lt;/p&gt;\n&lt;p&gt;Валидация аннотатора. Точность работы ИИ сравнивалась с результатами двух экспертов-людей на выборке из 32 введений. Использовались метрики F1 для границ сегментов, WindowDiff, Pk, а также F1 для классификации ходов и шагов.&lt;/p&gt;\n&lt;h4 id=\"effektivnost-annotatora\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#effektivnost-annotatora\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эффективность аннотатора&lt;/span&gt;&lt;/a&gt;Эффективность аннотатора&lt;/h4&gt;\n&lt;p&gt;Автоматический аннотатор достиг 92% от точности человека (F1 0,694 против 0,752). В структурном анализе показатели ИИ практически сравнялись с человеческими: точность определения «ходов» составила 0,901 против 0,911 у людей, а F1 границ сегментов — 0,725 против 0,756. Поскольку ошибки модели в основном совпадают с областями, где расходятся мнения экспертов, авторы использовали этот инструмент для всех последующих анализов, чтобы исключить субъективность человеческого фактора при сравнении текстов людей и ИИ.&lt;/p&gt;\n&lt;h4 id=\"obshie-raspredeleniya-i-poryadok\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#obshie-raspredeleniya-i-poryadok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие распределения и порядок&lt;/span&gt;&lt;/a&gt;Общие распределения и порядок&lt;/h4&gt;\n&lt;p&gt;Исследователи проанализировали, насколько сгенерированные тексты введений повторяют распределение «ходов» (move) и «шагов» (step), характерных для оригинальных научных статей, а также как они упорядочивают и выбирают эти элементы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Ходы» и «шаги» — это лингвистические концепции структуры научной статьи: «ход» представляет собой крупную риторическую цель (например, обоснование актуальности), а «шаг» — конкретный способ её достижения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Распределение ходов и шагов. В Таблице 1 представлено распределение сегментов текста по трем основным ходам и десяти шагам. В оригинальных текстах авторы-люди распределяют сегменты следующим образом: 59,5% — создание территории (Move 1), 16,0% — создание ниши (Move 2) и 24,5% — занятие ниши (Move 3). Сгенерированные модели демонстрируют смещение баланса от Move 1 в сторону Move 2. Доля Move 1 в пяти из восьми наборов данных падает ниже человеческого уровня, достигая 46,8%. На уровне шагов распределение у людей сильно смещено: обзор предыдущих исследований (26,5%), обоснование значимости (18,5%), &lt;a href=\"concepts/obobschenie.html\"&gt;обобщение&lt;/a&gt; темы (14,5%) и описание цели (13,0%) составляют почти три четверти всех сегментов. Модели сохраняют аналогичный ранговый порядок, где обзор литературы остается самым частым шагом. Применение направляющих инструкций (CARS-guided) для всех четырех моделей приводит к уменьшению доли Move 1 и увеличению доли Move 2 и Move 3, что в трех случаях из четырех еще больше отдаляет распределение от человеческого эталона.&lt;/p&gt;\n&lt;h4 id=\"uporyadochivanie-i-vybor-shagov\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#uporyadochivanie-i-vybor-shagov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Упорядочивание и выбор шагов&lt;/span&gt;&lt;/a&gt;Упорядочивание и выбор шагов&lt;/h4&gt;\n&lt;p&gt;Таблица 2 демонстрирует, как именно шаги упорядочиваются внутри введений. Поскольку последовательности шагов крайне разнообразны, авторы сравнивают 76 оригинальных текстов с восемью наборами сгенерированных (четыре модели, две версии промптов). Данные показывают, что модели склонны к избыточному использованию Move 2 по сравнению с оригинальными статьями.&lt;/p&gt;\n&lt;h4 id=\"move-3-zanyatie-nishi\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#move-3-zanyatie-nishi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Move 3: Занятие ниши&lt;/span&gt;&lt;/a&gt;Move 3: Занятие ниши&lt;/h4&gt;\n&lt;p&gt;Анализ структуры введений показал, что авторы и нейросети имеют общие предпочтения, но различаются в гибкости. Самый частый начальный шаг — утверждение центральности темы. При этом шаг 11 (контраргументация) практически отсутствует как в человеческих текстах, так и в сгенерированных (встречается лишь в 4 сегментах), поэтому он был исключен из анализа. Вместо прямой критики авторы предпочитают указывать на пробел в знаниях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Шаг (step) — это функциональный элемент текста введения, например, «обоснование значимости» или «указание на пробел в исследованиях», согласно модели CARS (Create a Research Space).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Человеческие тексты демонстрируют большее разнообразие: авторы начинают с утверждения центральности в 46% случаев, а в 32% — сразу с обзора литературы. Нейросети выбирают центральность в 58–84% случаев. Человеческие введения чаще пропускают целые разделы (в 28% случаев), тогда как модели стремятся охватить все три основных хода (Move 1, 2, 3) и используют от 6,1 до 7,4 шагов, в то время как люди — в среднем 5,3 шага. Если в оригинале отсутствовало обоснование ниши или пробела, нейросети добавляли эти элементы в 86–96% случаев.&lt;/p&gt;\n&lt;p&gt;Цикличность (возврат к уже пройденному разделу) наблюдается в 66% человеческих текстов (в среднем 2,4 возврата на текст). Модели ChatGPT, Claude и Gemma показывают схожие показатели (67–74%), тогда как Qwen демонстрирует повышенную цикличность (87–95%). Использование подсказок (CARS-guidance) делает структуру моделей более однородной, снижая цикличность ниже человеческого уровня и увеличивая количество используемых шагов.&lt;/p&gt;\n&lt;h4 id=\"grafovyj-analiz-struktur-hodov\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#grafovyj-analiz-struktur-hodov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Графовый анализ структур ходов&lt;/span&gt;&lt;/a&gt;Графовый анализ структур ходов&lt;/h4&gt;\n&lt;p&gt;Для оценки структурного сходства каждое введение было представлено как цепочечный граф, где узлы — это классы CARS. Сравнение проводилось через показатели редакционного сходства (edit similarity) и сходства «мешков» (bag similarity), учитывающих порядок и частоту шагов соответственно.&lt;/p&gt;\n&lt;h4 id=\"shodstvo-modelej-s-originalami\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#shodstvo-modelej-s-originalami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сходство моделей с оригиналами&lt;/span&gt;&lt;/a&gt;Сходство моделей с оригиналами&lt;/h4&gt;\n&lt;p&gt;Анализ самоподобия (таблица 3) показал, что оригинальные тексты наиболее разнообразны: их показатель самоподобия составляет 0,33, тогда как у моделей он варьируется от 0,37 до 0,46. Оригиналы реализуют 36 различных структур введений, в то время как модели — от 8 до 35. Использование подсказок CARS снижает разнообразие моделей, делая их тексты более предсказуемыми и похожими друг на друга.&lt;/p&gt;\n&lt;h4 id=\"detalnyj-analiz-parnyh-vvedenij\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#detalnyj-analiz-parnyh-vvedenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детальный анализ парных введений&lt;/span&gt;&lt;/a&gt;Детальный анализ парных введений&lt;/h4&gt;\n&lt;p&gt;Чтобы понять качественную разницу между сгенерированными и авторскими текстами, эксперт в области модели CARS (Create a Research Space) провел «близкое чтение» пяти научных статей. Каждая статья рассматривалась как триада: оригинал, версия от Claude (базовая) и версия, созданная с помощью промпта на основе CARS. Все тексты были размечены по функциональным ходам (moves).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод «близкого чтения» (close reading) подразумевает глубокий качественный анализ текста для выявления нюансов структуры, которые невозможно уловить только количественными метриками.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;Сгенерированные введения демонстрируют более жесткую структуру. Во-первых, это касается полноты: все 10 сгенерированных текстов содержат все три хода модели CARS, тогда как авторы-люди иногда опускают второй ход (обозначение ниши). Во-вторых, это касается порядка: модели строго следуют канонической последовательности «Ход 1–2–3». В 89% случаев возврата к предыдущим ходам модели переходят от Хода 2 к Ходу 1, тогда как авторы-люди делают это лишь в 57% случаев, иногда возвращаясь к Ходу 1 даже после анонса исследования. Ни одно из 608 сгенерированных введений не начинается с Хода 3, в то время как авторы-люди могут начинать с обзора литературы или даже с цели работы.&lt;/p&gt;\n&lt;p&gt;Авторы, знакомые с моделью CARS, не пишут более «каноничные» введения. Экспертный анализ четырех статей, авторы которых явно ссылались на модель Свейлса, показал отсутствие единой структуры. На структуру введения влияет квартиль журнала, а не знание теоретической базы.&lt;/p&gt;\n&lt;h4 id=\"kak-chitatel-otlichaet-original-ot-generacii\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#kak-chitatel-otlichaet-original-ot-generacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как читатель отличает оригинал от генерации?&lt;/span&gt;&lt;/a&gt;Как читатель отличает оригинал от генерации?&lt;/h4&gt;\n&lt;p&gt;Исследователь, не участвовавший в проекте, провел слепой тест: он должен был классифицировать 60 оригинальных и 60 сгенерированных введений, опираясь на принципы CARS. Читатель верно определил 108 из 120 (90%) текстов. В 118 случаях из 120 критерием послужила именно аргументационная структура, а не стиль письма. Читатель анализировал последовательность ходов и их взаимосвязи, опираясь на предоставленные ему данные о склонности моделей к избыточному использованию определенных ходов.&lt;/p&gt;\n&lt;h4 id=\"vvedeniya,-napisannye-s-pomoshyu-cars-prompta,-legche-raspoznat\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#vvedeniya,-napisannye-s-pomoshyu-cars-prompta,-legche-raspoznat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введения, написанные с помощью CARS-промпта, легче распознать&lt;/span&gt;&lt;/a&gt;Введения, написанные с помощью CARS-промпта, легче распознать&lt;/h4&gt;\n&lt;p&gt;Из 60 сгенерированных текстов половина была создана с помощью базового промпта, половина — с помощью CARS-ориентированного. Читатель безошибочно определил все 30 текстов, созданных с помощью CARS-промпта, и 24 из 30 базовых. Это подтверждает, что попытка «направить» модель через CARS делает структуру более однородной и жесткой, что парадоксальным образом облегчает идентификацию машинного текста.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f2.jpg\" alt=\"Рисунок 2: Обзор нашего фреймворка. Из каждой из 76 статей корпуса мы извлекаем содержание и работы, цитируемые в оригин\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Обзор нашего фреймворка. Из каждой из 76 статей корпуса мы извлекаем содержание и работы, цитируемые в оригинальном введении.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Обзор нашего фреймворка. Из каждой из 76 статей корпуса мы извлекаем содержание и работы, цитируемые в оригинальном введении. Четыре LLM пишут введение для каждой статьи по базовому запросу и по запросу с использованием CARS, что дает 608 сгенерированных введений. Затем автоматический аннотатор размечает все оригинальные и сгенерированные введения с помощью ходов и шагов CARS. Эти метки используются для сравнения оригинальных и сгенерированных введений и для ручного анализа.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-f3.jpg\" alt=\"Рисунок 3: Интерфейс аннотирования, использованный в исследовании по выявлению человеком (§5.2).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Интерфейс аннотирования, использованный в исследовании по выявлению человеком (§5.2).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Интерфейс аннотирования, использованный в исследовании по выявлению человеком (§5.2). Показано одно введение с автоматическими аннотациями ходов CARS в виде цветных выделений (в размеченном состоянии), над пятибалльным вопросом о происхождении и обязательным вопросом об обосновании решения. Цветовая легенда вверху содержит только те ходы, которые присутствуют в тексте на экране. Эксперт видит все введение целиком при прокрутке; здесь текст обрезан в нижней части экрана.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Отличие&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;структуры ИИ&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;от&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;человеческой&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" pe=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;synthetic&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Abdelrahman Sadallah, Narjes Sheikh Asadi, Lonneke van der Plas&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/abs/2610.01353v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/pdf/2610.01353v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.48550/ar
