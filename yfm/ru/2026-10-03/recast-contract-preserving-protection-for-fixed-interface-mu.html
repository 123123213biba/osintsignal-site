        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"270\" cy=\"150\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"670\" cy=\"230\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как защитить данные в&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;облачных нейросетях, не&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;теряя в точности вычислений&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f1.jpg\" alt=\"Рисунок 1: RECAST: замена исходного контента при сохранении структуры задачи.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: &lt;a href=\"concepts/recast.html\"&gt;RECAST&lt;/a&gt;: замена исходного контента при сохранении структуры задачи.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: RECAST: замена исходного контента при сохранении структуры задачи. Вверху: проиллюстрированные альтернативы направлены на разные цели: переписывание текста не предоставляет напрямую требуемый медиаконтент, синтез изображений на уровне набора данных не связан с конкретным запросом, а анонимизация диктора сохраняет содержание речи. Внизу: RECAST совместно заменяет темы, сущности и значения в доказательствах и запросах, сохраняя при этом отношения, релевантные задаче, и требуемую модальность. Удаленный решатель возвращает программу с защищенными операндами; клиент локально восстанавливает исходные операнды перед выполнением программы для получения ответа. Пример с диаграммой иллюстрирует унифицированную структуру защиты для текста, диаграмм и речи.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Отправка графиков или аудио в мощные облачные модели часто ставит под угрозу конфиденциальность. Исследователи представили ReCast — систему, которая подменяет содержимое файлов, сохраняя их структуру для нейросети. После получения ответа от сервера локальный компьютер восстанавливает исходные значения.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ReCast сохраняет 92,43% точности при работе с защищенными данными.&lt;/li&gt;\n&lt;li&gt;Система снижает утечку исходного контента до 7,95% запросов.&lt;/li&gt;\n&lt;li&gt;Метод поддерживает работу с графиками, аудио и текстом без дообучения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;ReCast работает как &lt;a href=\"concepts/agentnyy-plagin.html\"&gt;агентный плагин&lt;/a&gt;, преобразующий входные данные в текстовый «черновик». Система использует локальную модель (4B параметров) для замены имен сущностей и тем, а также применяет &lt;a href=\"concepts/reversible-numerical-mapping.html\"&gt;обратимое числовое отображение&lt;/a&gt; для защиты значений. Это позволяет скрыть реальные данные, сохраняя при этом логические связи, необходимые для решения задачи.&lt;/p&gt;\n&lt;p&gt;После обработки данные превращаются обратно в исходный формат (изображение или аудио) с помощью генератора, который проходит проверку на соответствие интерфейсу. Облачная модель получает «защищенную» версию, выполняет вычисления и возвращает программу, которую клиент исполняет локально с оригинальными числами. Это гарантирует, что чувствительная информация не покидает устройство пользователя.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод тестировался на 4000 примерах ChartQA и NMSQA; эффективность может варьироваться на более сложных или неструктурированных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Удаленные &lt;a href=\"concepts/vision-language-models.html\"&gt;мультимодальные модели&lt;/a&gt; демонстрируют высокие способности к числовым рассуждениям при анализе графиков и речи, однако передача конфиденциальных данных на сторонние серверы создает риски утечки информации. Обычная &lt;a href=\"concepts/filtratsiya.html\"&gt;фильтрация&lt;/a&gt; текста не подходит для работы с медиафайлами, а анонимизация личности не скрывает суть задачи. Авторы представляют RECAST — агентный плагин, который заменяет содержимое исходных данных, сохраняя при этом логические связи и требуемую модальность ввода.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агентный плагин — это программный модуль, который автономно выполняет действия (в данном случае — преобразование данных) от имени пользователя, не передавая исходные чувствительные файлы на внешний сервер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система RECAST локально преобразует входные данные в текстовую запись, содержащую доказательства и запросы. С помощью дистиллированной модели объемом 4 миллиарда параметров (4B) система перезаписывает сущности и темы, а значения подменяются через локально обратимую карту.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/reconstruction-agent.html\"&gt;Агент реконструкции&lt;/a&gt; создает и проверяет медиаданные на основе защищенной записи. Удаленный решатель возвращает программу, операнды которой восстанавливаются локально перед выполнением. На выборке из 4000 примеров из наборов ChartQA и NMSQA система RECAST достигла точности 75,10%, что составляет 92,43% от точности при работе с незащищенными данными. Модельный &lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt; выявил утечку исходного контента в 7,95% запросов, направляемых решателю.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST обеспечивает 75,10% точности при решении задач, сохраняя 92,43% эффективности исходных моделей и значительно снижая риск утечки данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на тестовых наборах данных; эффективность метода в реальных условиях может зависеть от сложности исходных медиафайлов и качества локальной модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"kontekst-i-problematika\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#kontekst-i-problematika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контекст и проблематика&lt;/span&gt;&lt;/a&gt;Контекст и проблематика&lt;/h4&gt;\n&lt;p&gt;Локально-удаленное взаимодействие позволяет пользователям сохранять конфиденциальные данные на своих устройствах, используя при этом вычислительные мощности удаленных моделей. Ранее этот подход активно исследовался для текстовых данных: перед отправкой запроса локальная модель может переписать его, используя методы дифференциальной приватности, состязательной анонимизации или делегирования с учетом конфиденциальности. В задачах численного рассуждения применяются методы подмены тем и чисел с последующим восстановлением ответа на локальном устройстве. Однако значительная часть конфиденциальных данных представлена не в текстовом виде, а в виде графиков в бизнес-отчетах или аудиозаписей встреч. Локальные модели пока уступают удаленным в мультимодальном восприятии и вычислениях, а удаленные сервисы требуют строгого формата входных данных (изображения или аудиосигналы).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие методы защиты мультимодальных данных не позволяют сохранять исходный формат (изображение/аудио), при этом текущие средства анонимизации не скрывают содержательные данные, такие как конкретные значения на графиках или в речи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Существующие подходы либо преобразуют ввод в текст, что несовместимо с интерфейсами мультимодальных сервисов, либо защищают только идентификационные признаки (например, голос), оставляя содержательную информацию (значения величин) доступной для удаленной модели. Для численных задач требуется, чтобы преобразование доказательств и запросов было согласованным, позволяя выполнять вычисления и восстанавливать исходный ответ.&lt;/p&gt;\n&lt;h4 id=\"metod-recast\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#metod-recast\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метод RECAST&lt;/span&gt;&lt;/a&gt;Метод RECAST&lt;/h4&gt;\n&lt;p&gt;Система RECAST решает эту задачу, разделяя потребности задачи (отношения между величинами, операции) и содержание источника (сущности, значения). Это &lt;a href=\"concepts/agentnyy-konveyer.html\"&gt;агентный конвейер&lt;/a&gt;, работающий на основе общего текстового представления доказательств и запросов (Рис. 1). Процесс включает локальный захват данных, их переписывание с сохранением отношений и чисел, а также реконструкцию модальности через цикл «генерация-проверка-исправление». Удаленный решатель возвращает программу на Python, которая выполняется локально на исходных значениях.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f1.jpg\" alt=\"Рисунок 1: RECAST: замена исходного контента при сохранении структуры задачи.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: RECAST: замена исходного контента при сохранении структуры задачи.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: RECAST: замена исходного контента при сохранении структуры задачи. Вверху: проиллюстрированные альтернативы направлены на разные цели: переписывание текста не предоставляет напрямую требуемый медиаконтент, синтез изображений на уровне набора данных не связан с конкретным запросом, а анонимизация диктора сохраняет содержание речи. Внизу: RECAST совместно заменяет темы, сущности и значения в доказательствах и запросах, сохраняя при этом отношения, релевантные задаче, и требуемую модальность. Удаленный решатель возвращает программу с защищенными операндами; клиент локально восстанавливает исходные операнды перед выполнением программы для получения ответа. Пример с диаграммой иллюстрирует унифицированную структуру защиты для текста, диаграмм и речи.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агентный &lt;a href=\"concepts/pipeline.html\"&gt;конвейер&lt;/a&gt; — это система, где отдельные модули (агенты) выполняют специализированные задачи, такие как преобразование данных или проверка корректности, взаимодействуя друг с другом для достижения общей цели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основные результаты работы:&lt;br /&gt;\n• Разработан RECAST — агентный конвейер, не требующий переобучения при смене модальностей или интерфейсов.&lt;br /&gt;\n• Создан модуль переписывания с использованием дистиллированной локальной модели (4 млрд параметров), обеспечивающий корректное изменение имен и доменов при сохранении численных отношений.&lt;br /&gt;\n• На 4000 тестовых примерах из наборов ChartQA и NMSQA система RECAST сохранила 92,43% точности от уровня без защиты при утечке исходного контента на уровне 7,95%. Дистилляция модели повысила точность на 6,40 процентных пункта и снизила утечку данных с 39,75% до 7,95%.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/span&gt;&lt;/a&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/h4&gt;\n&lt;p&gt;2.1 TEXTPRIVACY&lt;br /&gt;\nМетоды защиты текстовых данных варьируются от удаления отдельных слов до полной переработки документа. Подходы вроде SanText и CusText используют дифференциальную приватность для замены слов семантически близкими аналогами, тогда как DP-Prompt и DP-MLM применяют языковые модели для генерации защищенного, но связного текста. Метод DP-Fusion ограничивает влияние чувствительных токенов путем объединения распределений генерации, обусловленных различными версиями входных данных. Помимо явных идентификаторов, угрозу представляют контекстные подсказки, раскрывающие личные атрибуты. Состязательная анонимизация (adversarial anonymization) использует атаки на основе вывода для управления правками текста, а RLAA адаптирует этот подход для локальных моделей. Современные методы, такие как STAMP и DP-ST, учитывают полезность задачи и семантическую структуру, распределяя бюджет приватности или используя семантические триплеты для генерации документов. RECAST дополняет эти подходы, обеспечивая согласованность доказательств и запросов после замены чисел, сохраняя при этом возможность работы через фиксированный медиаинтерфейс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST использует текст как промежуточное звено для реконструкции защищенных данных в формате, требуемом интерфейсом, сохраняя при этом логические связи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.2 ЛОКАЛЬНОЕ И УДАЛЕННОЕ СОТРУДНИЧЕСТВО&lt;br /&gt;\nЛокально-удаленное взаимодействие позволяет локальной модели контролировать объем данных, передаваемых более мощной удаленной модели. Существующие методы, такие как CoGenesis, PAPILLON и InferDPT, координируют генерацию между локальными и удаленными узлами, ограничивая доступ к приватному контексту. Более новые разработки, включая Privacy-R1, Veilmind и системы оценки рисков, делают делегирование задач чувствительным к намерениям пользователя и контекстным утечкам. Наиболее близким является подход, при котором тема текстовой задачи на вычисления меняется, числа подменяются, а исходный ответ восстанавливается локально с помощью программы, полученной от удаленной модели. RECAST расширяет эту схему на мультимодальные входы и выходы. Единая текстовая запись доказательств и запросов связывает захват данных, совместную переработку и реконструкцию, позволяя проверять, соответствует ли выпущенный график или аудиозапись защищенным исходным данным.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/program-aided-reasoning.html\"&gt;Программно-ориентированное рассуждение&lt;/a&gt; (program-aided reasoning) — метод, при котором модель генерирует код для выполнения вычислений, что повышает точность логических выводов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.3 МУЛЬТИМОДАЛЬНОСТЬ И КОНФИДЕНЦИАЛЬНОСТЬ МЕДИАДАННЫХ&lt;br /&gt;\nРиски приватности возникают и при работе с медиаданными: мультимодальные модели способны извлекать личную информацию даже из изображений, не содержащих прямых идентификаторов. Существующие решения включают замену исходных данных абстрактными представлениями (символьные сцены) или перевод визуальных инструкций в текст. Однако такие методы часто несовместимы с фиксированными медиаинтерфейсами, требующими конкретных форматов (графики, сигналы). Методы уровня медиа, такие как анонимизация голоса или маскирование речи, сохраняют модальность, но меняют идентификационные признаки. RECAST отличается тем, что заменяет сущности, темы и значения для каждого запроса, сохраняя при этом связи «доказательство-запрос», необходимые для численных рассуждений. Защита достигается за счет трансформации общего текстового представления, а реконструкция обеспечивает совместимость с интерфейсом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Большинство методов защиты медиа ориентированы на синтез данных или анонимизацию, тогда как RECAST сфокусирован на сохранении функциональных связей для численных вычислений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Система RECAST разделяет исходные данные и задачи, используя общую запись запроса и доказательств. Процесс включает локальный сбор данных, совместную семантическую и числовую переработку и реконструкцию защищенной записи в нужной модальности (Рис. 2). Удаленный решатель получает программу, операнды которой восстанавливаются локально перед выполнением.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f2.jpg\" alt=\"Рисунок 2: Обзор RECAST. Конвейер сначала преобразует мультимодальные входные данные в унифицированное текстовое предста\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Обзор RECAST. Конвейер сначала преобразует мультимодальные входные данные в унифицированное текстовое представление (разд.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Обзор RECAST. Конвейер сначала преобразует мультимодальные входные данные в унифицированное текстовое представление (разд. 3.2), затем применяет переписывание тем и локальное числовое переотображение для защиты сущностей и чисел (разд. 3.3). Защищенный текст впоследствии реконструируется в суррогат в исходной модальности, который воссоздает диаграммы посредством рендеринга и проверки на основе ChartSpec, передает текст напрямую и синтезирует аудио в качестве прокси-речи (разд. 3.4). Пример на рисунке показывает этот конвейер.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;3.1 ОБЗОР ЗАДАЧИ И ФРЕЙМВОРКА&lt;br /&gt;\nДля частных данных X и текстового запроса q система использует модальности m и r (текст, изображение, аудио). Цель — снизить раскрытие специфических сущностей, тем и значений, сохраняя связи между доказательствами и запросом. Защищенная запись eD формируется как eD = Hh(Rθ(D)), где Rθ — семантический переписчик, а Hh — числовое преобразование. Удаленный сервис получает только защищенный контент, а локальный клиент выполняет восстановление.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система RECAST защищает данные, подменяя значения и переписывая семантику, при этом восстановление ответов происходит только на стороне пользователя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.2 МУЛЬТИМОДАЛЬНЫЙ СБОР ДОКАЗАТЕЛЬСТВ&lt;br /&gt;\nДля сбора данных используются специализированные модели: Qwen3-VL-8B-Instruct для графиков и Qwen3-&lt;a href=\"concepts/attack-success-rate.html\"&gt;ASR&lt;/a&gt;-1.7B для транскрипции аудио. Данные нормализуются в единый формат из пяти полей: id, модальность, контекст, вопрос и варианты ответов. Интерфейс не зависит от конкретной модели, что позволяет заменять модули сбора при сохранении схемы данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/normalizatsiya.html\"&gt;Нормализация&lt;/a&gt; — приведение данных к единому стандарту, чтобы разные модели могли работать с ними по общему шаблону.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;3.3 СОВМЕСТНАЯ ПЕРЕЗАПИСЬ И ЗАЩИТА ЧИСЕЛ&lt;br /&gt;\nСемантическая перезапись объединяет доказательства и запрос в связный текст, сохраняя логику операций и типы ответов. Для обучения локальной модели Qwen3-4B используется метод QLoRA на основе данных от GPT-5.6-Sol. Обучающая выборка составила 15 795 пар. Числовые значения защищаются через инъективное отображение h:V→eV, где значения внутри диапазонов (Bk) заменяются с сохранением порядка, а годы (Yg) — с добавлением смещения δg. Целые числа от 0 до 15 остаются неизменными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод сохраняет порядок значений внутри групп, но не гарантирует сохранение исходных соотношений или разностей между числами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Локальное восстановление операндов происходит путем замены защищенных меток  на исходные значения v через обратное отображение h−1. Итоговый ответ вычисляется локально через выполнение программы Exec(Ih−1[eP]).&lt;/p&gt;\n&lt;p&gt;Реконструкция графиков и речи. Модель удаленного кодирования преобразует защищенные данные в декларативную спецификацию ChartSpec, включающую тип диаграммы, категории, ряды, значения, метки, единицы измерения и цвета. После проверки локальной структуры и значений, фиксированные шаблоны Matplotlib визуализируют спецификацию. Удаленная модель компьютерного зрения сравнивает изображение с защищенной записью, предоставляя структурированную обратную связь для внесения до четырех исправлений. Ни одна из удаленных моделей не получает доступ к исходному графику. В случае неудачных попыток исправления система переключается на валидированную таблицу только при подтверждении интерфейсом; в противном случае запрос отклоняется.&lt;/p&gt;\n&lt;p&gt;Синтез речи и текста. Удаленный сервис преобразования текста в речь (TTS) синтезирует защищенные фрагменты. Контроллер транскрибирует каждый полученный аудиосигнал, проверяет разборчивость, защищенные количественные показатели и ссылки на сущности, при необходимости запуская повторную генерацию. Для текстовых интерфейсов защищенные данные сериализуются вместе с запросом.&lt;/p&gt;\n&lt;p&gt;Две взаимодополняющие проверки выпуска. Пусть &lt;span class=\"yfm-latex\" data-content=\"V_%7Bprotected%7D%2C%20V_%7Bsource%7D%20%5Cin%20%5C%7B0%2C%201%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; обозначают прохождение проверки защищенной записи и локальной согласованности источника соответственно (1 — успех, 0 — отказ). Первая проверяет визуализированные значения, метки, единицы измерения и ассоциации с исходными данными для графиков, а также транскрибированные величины и ссылки для речи. Вторая сопоставляет переписанные сущности с ролями в источнике и проверяет зависимости. Решение о выпуске &lt;span class=\"yfm-latex\" data-content=\"V_%7Brelease%7D%20%5Cin%20%5C%7B0%2C%201%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; определяется как &lt;span class=\"yfm-latex\" data-content=\"V_%7Brelease%7D%20%3D%20V_%7Bprotected%7D%20%5Cwedge%20V_%7Bsource%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выпуск данных разрешается только при выполнении обоих условий (Vrelease = 1), что обеспечивает проверку как защищенности, так и семантической точности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimenty\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#eksperimenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭКСПЕРИМЕНТЫ&lt;/span&gt;&lt;/a&gt;ЭКСПЕРИМЕНТЫ&lt;/h4&gt;\n&lt;p&gt;Оценка RECAST проводится по трем направлениям: полезность рассуждений при защите контента, устойчивость вне условий первичного тестирования и вклад отдельных компонентов системы. Мы описываем экспериментальную установку, основные результаты, &lt;a href=\"concepts/obobschenie.html\"&gt;обобщение&lt;/a&gt; на другие наборы данных, поэтапную абляцию и валидацию ИИ-судьи утечек.&lt;/p&gt;\n&lt;p&gt;4.1 ЭКСПЕРИМЕНТАЛЬНАЯ УСТАНОВКА&lt;/p&gt;\n&lt;p&gt;Наборы данных. Оценка проводится на четырех наборах данных с числовыми ответами. Для оценки внутри распределения (ID) использовано по 2000 примеров из ChartQA и NMSQA, не пересекающихся с данными для дистилляции Rewriter. Пул дистилляции составил 9370 записей ChartQA и 7000 NMSQA, что дало 15 795 принятых пар «учитель-ученик» (15 480 для обучения, 315 для валидации). Для оценки вне распределения (OOD) использовано по 2000 примеров из ChartX и Spoken-MQA.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — метод исследования системы путем последовательного отключения её компонентов для определения их значимости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Базовые модели. Мы сравниваем RECAST с комплексными решениями и отдельными этапами. Remote-native отправляет исходные данные удаленному решателю. Gemma-4-E4B и Qwen2.5-Omni-3B служат локальными эталонами с нулевой утечкой. На этапе 2 мы сравниваем настроенный Rewriter с неоптимизированной моделью Qwen3-4B и учителем GPT-5.6-Sol. На этапе 3 альтернативные методы (PSIC, SPTI, AudioShield) оцениваются по уровню экспозиции данных, так как они не восстанавливают численные операнды для QA. Также сравниваются стратегии реконструкции через Codex &lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt; и DeepSeek &lt;a href=\"concepts/harness.html\"&gt;Harness&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Реализация. Этап 1 использует Qwen3-VL-8B-Instruct и Qwen3-ASR-1.7B для конвертации в текстовый формат. Этап 2 использует Qwen3-4B, дообученную через QLoRA. На этапе 3 модели DeepSeek-V4 генерируют ChartSpec, Qwen3-TTS-Flash синтезирует речь, а Qwen3.5-Omni-Plus выступает в роли удаленного решателя.&lt;/p&gt;\n&lt;h4 id=\"audioshield-otsutstvie-skvoznogo-vosstanovleniya\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#audioshield-otsutstvie-skvoznogo-vosstanovleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AudioShield: отсутствие сквозного восстановления&lt;/span&gt;&lt;/a&gt;AudioShield: отсутствие сквозного восстановления&lt;/h4&gt;\n&lt;p&gt;4.2 Основные результаты. Исследование сравнивает три сценария: локальные модели с исходными данными, систему RECAST с защищенными медиафайлами и удаленный вызов, где сервер получает оригинальные данные. RECAST демонстрирует точность 70,20% (нормализованная точность 93,48%) на ChartQA и 80,00% (91,53%) на NMSQA, с общим показателем точности 75,10% (92,43%) и утечкой исходного контента на уровне 7,95%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система RECAST обеспечивает общую точность 75,10% при ограничении утечки данных на уровне 7,95%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4.3 Оценка на разных наборах данных. Тестирование с использованием модели Qwen3-4B в условиях in-distribution (ID) и out-of-distribution (OOD) показало, что на OOD-данных (ChartX и Spoken-MQA) точность снизилась до 62,40% и 79,40% соответственно (падение на 7,80 и 0,60 процентных пункта). Утечка данных составила 8,00% (ID) и 1,40% (OOD) для изображений, а также 7,90% (ID) и 5,90% (OOD) для аудио. Меньшее падение точности на аудио указывает на более высокую устойчивость модели к смене домена в речевых данных.&lt;/p&gt;\n&lt;p&gt;4.4 Абляционные исследования. Сравнение прямого мультимодального ввода и предложенного раздельного пути обработки показало, что разделение повышает общую точность с 44,60% до 65,85% (+21,25 п.п.). При оценке этапа реконструкции (Stage 3) выяснилось, что использование защищенного текста дает преимущество в 1,75 п.п. по сравнению с реконструкцией медиа. Однако для аудио реконструкция в форму волны необходима для совместимости с интерфейсами, несмотря на потерю 3,90 п.п. точности по сравнению с текстовым представлением.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsionnoe-issledovanie.html\"&gt;Абляционное исследование&lt;/a&gt; — это метод проверки вклада отдельных компонентов системы путем их поочередного отключения или замены.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;4.5 Валидность &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-судьи. Поскольку утечка данных не всегда сводится к простому совпадению строк, для оценки использовался автоматизированный &lt;a href=\"concepts/llm-sudya.html\"&gt;LLM-судья&lt;/a&gt;. Его решения сравнивались с человеческой разметкой на 400 парах данных. Совпадение составило 91,50% (коэффициент Каппа Коэна κ = 0,83), что подтверждает надежность автоматической оценки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка утечки основана на LLM-судье, который может иметь систематические ошибки, отличные от человеческих оценок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Мы представили RECAST — фреймворк для защиты данных при работе с численными рассуждениями через мультимодальные интерфейсы, сохраняющий структуру контракта. Основная идея заключается в замене специфического контента источника при сохранении связей задачи и формата медиа, требуемых сервисом. Общая запись доказательств и запросов отделяет защиту контента от модальности, а локальное восстановление операндов разделяет удаленные вычисления над защищенными данными и работу с исходными значениями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RECAST сохраняет 92,43% точности удаленных вычислений на наборах ChartQA и NMSQA, при этом модель аудита выявляет утечку данных в 7,95% случаев.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На тестах ChartQA и NMSQA система RECAST сохраняет 92,43% точности по сравнению с незащищенными удаленными вычислениями. Модель аудита, проверяющая утечки контента, зафиксировала их в 7,95% контекстов, связанных с решателем. При использовании дистиллированного локального переписчика (rewriter) объемом 4 млрд параметров общая точность снижается лишь на 0,55 процентных пункта относительно автономной конфигурации учителя. Агент реконструкции превосходит альтернативные методы по точности работы с графиками, а результаты на наборах ChartX и Spoken-MQA подтверждают возможность переноса модели за пределы обучающих данных. Эти данные показывают, что воздействие исходного контента на удаленные сервисы может быть минимизировано при сохранении функциональности и совместимости с существующими интерфейсами.&lt;/p&gt;\n&lt;h4 id=\"zayavlenie-ob-ispolzovanii-ii\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#zayavlenie-ob-ispolzovanii-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЗАЯВЛЕНИЕ ОБ ИСПОЛЬЗОВАНИИ ИИ&lt;/span&gt;&lt;/a&gt;ЗАЯВЛЕНИЕ ОБ ИСПОЛЬЗОВАНИИ ИИ&lt;/h4&gt;\n&lt;p&gt;Инструменты генеративного ИИ применялись для редактирования языка, улучшения структуры рукописи и описания экспериментов, а также для помощи в редактировании кода. Все научные идеи, методологические решения и результаты были проверены авторами, которые несут полную ответственность за содержание работы.&lt;/p&gt;\n&lt;h4 id=\"zayavlenie-o-vosproizvodimosti\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#zayavlenie-o-vosproizvodimosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЗАЯВЛЕНИЕ О ВОСПРОИЗВОДИМОСТИ&lt;/span&gt;&lt;/a&gt;ЗАЯВЛЕНИЕ О ВОСПРОИЗВОДИМОСТИ&lt;/h4&gt;\n&lt;p&gt;Авторы предоставляют код, промпты, дистиллированный адаптер, трассировки учителя, манифесты запусков (включая хеши среды и данных) и логи аудита для обеспечения воспроизводимости результатов.&lt;/p&gt;\n&lt;h4 id=\"zayavlenie-po-etike\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#zayavlenie-po-etike\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЗАЯВЛЕНИЕ ПО ЭТИКЕ&lt;/span&gt;&lt;/a&gt;ЗАЯВЛЕНИЕ ПО ЭТИКЕ&lt;/h4&gt;\n&lt;p&gt;Использовались общедоступные бенчмарки ChartQA и NMSQA. В процессе калибровки участвовали авторы статьи. Механизм оценки утечек работает с исходными данными только внутри процесса оценки; при реальном развертывании исходные данные остаются локальными, что в сочетании с контрактным контролем доступа повышает безопасность.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f3.jpg\" alt=\"Рисунок 3: Совместное переписывание и числовая защита.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Совместное переписывание и числовая защита.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Совместное переписывание и числовая защита. Дистиллированный локальный переписчик последовательно изменяет сущности и темы в доказательствах и запросах, сохраняя при этом числовые литералы. Отдельная карта, специфичная для запроса, заменяет числовые значения в рамках поддерживаемых реляционных ограничений. Ее обратная функция остается локальной для восстановления операндов. Как показано на рис. 3, этот этап защищает общую запись доказательств и запросов с помощью двух взаимодополняющих преобразований: дистиллированный локальный переписчик совместно изменяет сущности и темы, поддерживая согласованность доказательств и запросов, а специфичная для запроса числовая карта затем подставляет значения в соответствии с явными реляционными ограничениями. Обратная карта остается локальной для восстановления операндов в программе, возвращаемой удаленным решателем.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f4.jpg\" alt=\"Рисунок 4: Реконструкция модальности и проверка выпуска.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Реконструкция модальности и проверка выпуска.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Реконструкция модальности и проверка выпуска. Интерфейс выбирает плагин реконструкции. Диаграммы используют генерацию спецификаций, локальный рендеринг и исправление под руководством рецензента; речь использует синтез, за которым следует проверка на основе транскрипции; текст сериализуется напрямую. Выпуск требует как согласованности защищенной записи, так и локальной проверки согласованности источника. Как показано на рис. 4, агент реконструкции преобразует eD в совместимый с интерфейсом артефакт через цикл «генерация-проверка-исправление». Он нацелен на достоверное представление защищенных доказательств, а не на воспроизведение исходного вида диаграммы или личности диктора.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f5.jpg\" alt=\"Рисунок 5: Типы диаграмм в записях изображений (a; 32 записи без идентифицируемого типа опущены) и темы аудиозаписей (b)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Типы диаграмм в записях изображений (a; 32 записи без идентифицируемого типа опущены) и темы аудиозаписей (b) в корпусе дистилляции.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f6.jpg\" alt=\"Рисунок 6: Операции с вопросами для каждого типа диаграмм в записях изображений. Сумма значений в каждой строке составля\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Операции с вопросами для каждого типа диаграмм в записях изображений. Сумма значений в каждой строке составляет 100%; серые цифры показывают долю каждой операции среди всех записей изображений.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f7.jpg\" alt=\"Рисунок 7: Тематика записей изображений (a) и аудиозаписей (b). Площадь круга пропорциональна доле записей; положение кр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Тематика записей изображений (a) и аудиозаписей (b). Площадь круга пропорциональна доле записей; положение круга не имеет значения.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f8.jpg\" alt=\"Рисунок 8: Наиболее частые знаменательные слова в записях изображений (a, b) и аудиозаписях (c, d) до и после переписыва\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8: Наиболее частые знаменательные слова в записях изображений (a, b) и аудиозаписях (c, d) до и после переписывания преподавателем. Размер и оттенок слова увеличиваются с ростом частоты; слова-описания диаграмм и служебные слова удалены.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f9.jpg\" alt=\"Рисунок 9: Четыре сравнения ChartQA: входные данные, SPTI (Wang et al., 2025), PSIC (Shen et al., 2025), RLAA (Duan et a\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9: Четыре сравнения ChartQA: входные данные, SPTI (Wang et al., 2025), PSIC (Shen et al., 2025), RLAA (Duan et al., 2026), Eternis (Eternis, 2025) и RECAST. Образцы SPTI не имеют парных соответствий; остальные результаты соответствуют идентификатору исходного образца.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-f10.jpg\" alt=\"Рисунок 10: Пять сравнений аудиоданных NMSQA: входной расшифрованный текст, защищённая ASR-распознанная аудиозапись Audi\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10: Пять сравнений аудиоданных NMSQA: входной расшифрованный текст, защищённая ASR-распознанная аудиозапись AudioShield (Jin et al., 2025), защищённый текст RLAA (Duan et al., 2026) и Eternis (Eternis, 2025), а также расшифрованный текст RECAST.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;риск утечки&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;данных в&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;облачных ИИ&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;подмена&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;контента с&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обратимым&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;шифром&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сохранение 92%&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точности&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;расчетов&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;безопасный&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анализ без&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;передачи&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;оригинала&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Bingchen Pei, Lichong Chen, Bingxi Zhao, Ziang Wu, Sirui Wang, Min Zhang, Yanhao Chen, Qingxu Liu, Qiang Gao, Chang-Tien Lu, Bo Gao&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Ист
