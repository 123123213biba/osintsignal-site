            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"239\" cy=\"94\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"681\" cy=\"221\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему точность нейросетей —&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;это иллюзия стабильности&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f1.jpg\" alt=\"Рисунок 1: Семантически эквивалентные фактические промпты вызывают измеримые поведенческие сдвиги в разных семействах мо\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Семантически эквивалентные фактические промпты вызывают измеримые поведенческие сдвиги в разных семействах моделей. На радарных диаграммах показана средняя величина дельты по четырем осям.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи представили фреймворк &lt;a href=\"concepts/sago.html\"&gt;SAGO&lt;/a&gt;, который оценивает стабильность языковых моделей на уровне отдельных примеров. Оказалось, что даже при сохранении общего смысла запроса, модели демонстрируют значительные колебания в поведении. Стандартные метрики точности скрывают эти сбои, создавая ложное ощущение надежности систем.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SAGO оценивает стабильность модели при перефразировании запросов, а не просто среднюю точность.&lt;/li&gt;\n&lt;li&gt;Исследование 11 моделей выявило, что они демонстрируют значительную нестабильность поведения на уровне отдельных примеров.&lt;/li&gt;\n&lt;li&gt;Агрегированные метрики скрывают ошибки, так как провалы на одних вариациях компенсируются успехами на других.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Авторы работы проанализировали 11 открытых и закрытых &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; на 6 различных датасетах, используя четыре оси оценки: согласованность генерации, внутренние активации, уверенность модели и &lt;a href=\"concepts/mirroring.html\"&gt;зеркалирование&lt;/a&gt; ответов. В отличие от традиционных бенчмарков, которые суммируют показатели, SAGO измеряет изменение поведения модели при семантически эквивалентных вариациях входных данных (изменение регистра, длины или вежливости запроса).&lt;/p&gt;\n&lt;p&gt;Результаты показывают, что ни одна модель не обладает равномерной генерализацией. Разные оси поведения фиксируют независимые типы ошибок, а изменение датасета может полностью перевернуть рейтинг моделей. Это доказывает, что текущие методы оценки, основанные на агрегированных баллах, не способны выявить реальную нестабильность алгоритмов в реальных условиях эксплуатации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа сфокусирована на поведении моделей при семантических вариациях и не учитывает влияние долгосрочного контекста или многошаговых рассуждений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Способность больших языковых моделей (LLM) к обобщению определяется как умение выдавать семантически стабильные и согласованные результаты при изменении формы подачи одного и того же запроса. Традиционные методы оценки опираются на совокупную точность по фиксированным наборам данных, что затрудняет разделение общей производительности модели и её устойчивости к вариативности входных данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/obobschenie.html\"&gt;Обобщение&lt;/a&gt; — это способность модели сохранять смысл ответа, даже если пользователь перефразирует свой вопрос.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данной работе предложен фреймворк Stability-Aware Generalization Objective (SAGO). Он позволяет оценивать поведение модели на уровне отдельных примеров, анализируя изменения в ответах при различных вариациях входных данных. SAGO измеряет изменчивость по нескольким параметрам: согласованность генерации, внутренние активации нейронной сети, уровень уверенности модели и &lt;a href=\"concepts/response-mirroring.html\"&gt;зеркальное отражение ответов&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показало, что ни одна из протестированных моделей не обладает равномерной способностью к обобщению, а ранжирование моделей по качеству работы может меняться в зависимости от используемого набора данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ показал, что современные модели демонстрируют статистически значимую нестабильность при обобщении. Различные оси поведения модели отражают независимые типы ошибок, а изменение набора данных способно привести к обратным результатам в рейтингах эффективности моделей. Авторы предоставили эталонную реализацию метода для независимой проверки.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"kontekst-i-problema-obobsheniya-llm\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#kontekst-i-problema-obobsheniya-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контекст и проблема обобщения LLM&lt;/span&gt;&lt;/a&gt;Контекст и проблема обобщения LLM&lt;/h4&gt;\n&lt;p&gt;Большие языковые модели (LLM) активно внедряются в поисковые системы, инструменты для программирования и агентные рабочие процессы. Ключевой характеристикой надежности модели является способность к обобщению — сохранению эффективности при изменении формы запроса, если его смысл и контекст остаются прежними. Пользователи могут варьировать длину, тон, форматирование или добавлять шум, однако модель должна следовать своим инструкциям и политике безопасности независимо от этих вариаций. Предыдущие исследования подтверждают, что поведение LLM меняется при сохранении смысла, что указывает на уязвимость к изменениям формулировок, порядка слов или тональности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Способность модели сохранять стабильное поведение при семантически эквивалентных запросах является критическим показателем надежности, который часто игнорируется в пользу усредненных метрик.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya-tekushih-podhodov-i-metodologiya-sago\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#ogranicheniya-tekushih-podhodov-i-metodologiya-sago\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения текущих подходов и методология SAGO&lt;/span&gt;&lt;/a&gt;Ограничения текущих подходов и методология SAGO&lt;/h4&gt;\n&lt;p&gt;Существующие методы оценки имеют ряд недостатков: они часто ограничены одной предметной областью, рассматривают лишь узкий спектр вариаций запросов или опираются на агрегированные показатели. Усредненные оценки могут маскировать значительные сбои на уровне отдельных примеров, когда ошибки в одних вариантах запроса компенсируются успехами в других. Для устранения этого пробела авторы предлагают фреймворк Stability-Aware Generalization Objective (SAGO). Вместо оценки среднего качества, SAGO проверяет стабильность поведения модели для каждого конкретного примера при различных семантически эквивалентных вариациях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SAGO — это методология оценки, которая анализирует, насколько сильно меняется ответ модели, её внутренняя уверенность и активации нейронов при перефразировании одного и того же задания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование охватывает 11 моделей, однако результаты могут зависеть от специфики выбранных шести датасетов и типов используемых возмущений входных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В рамках SAGO анализируются изменения в согласованности генерации, внутренних активациях, уверенности модели и «зеркальности» ответов (response mirroring). Авторы протестировали 11 открытых и закрытых LLM на шести наборах данных. Результаты показывают, что нестабильность обобщения носит повсеместный и неоднородный характер. Ключевые выводы работы включают создание многоосевой метрики для измерения поведенческих изменений и эмпирическое доказательство того, что согласованность генерации является наиболее чувствительным параметром, а стабильность содержания и зеркальность ответов представляют собой независимые измерения чувствительности модели.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty-i-kontekst\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#svyazannye-raboty-i-kontekst\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы и контекст&lt;/span&gt;&lt;/a&gt;Связанные работы и контекст&lt;/h4&gt;\n&lt;p&gt;Исследования устойчивости больших языковых моделей (LLM) к обобщению делятся на несколько направлений, каждое из которых изучает свой аспект проблемы.&lt;/p&gt;\n&lt;p&gt;Устойчивость к сдвигу распределения (Out-of-distribution). В этом направлении оценивается поведение моделей, когда тестовые данные отличаются от обучающих. В литературе это формализуется как единый показатель производительности на отложенной выборке. Крупномасштабные бенчмарки агрегируют этот разрыв по множеству доменов, а общие оценки надежности фиксируют совокупную точность при таких сдвигах. Эти исследования подтверждают, что сдвиги распределения снижают производительность, причем это снижение существенно на уровне датасетов. Однако они не отвечают на вопрос, ведет ли себя модель последовательно при изменении формы ввода, и агрегируют данные, что делает невозможным отслеживание нестабильности на уровне отдельных примеров.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие методы оценки устойчивости агрегируют показатели, что скрывает нестабильность модели на уровне конкретных запросов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Согласованность и &lt;a href=\"concepts/sensitivity.html\"&gt;чувствительность&lt;/a&gt; к вариациям промптов. Второе направление проверяет стабильность предсказаний при перефразировании ввода без изменения смысла. Сюда входят исследования противоречий в перефразированных фактических запросах и систематических расхождений в моделях, настроенных на инструкции. Значительная часть работ фокусируется на узких семантических областях: кросс-языковых вариантах, сдвигах социального тона и согласованности при обработке рискованных запросов. Параллельно третье направление изучает чувствительность к поверхностным изменениям, не влияющим на смысл: форматированию, выбору шаблона, порядку примеров в контексте, а также низкоуровневым возмущениям (пунктуация, пробелы). Хотя эти работы показывают, что поведение LLM редко остается инвариантным при семантически эквивалентном вводе, они не дают полной оценки способности модели к обобщению. Большинство исследований ограничены одним доменом или типом вариаций, что затрудняет понимание того, распространяется ли устойчивость за пределы конкретного теста.&lt;/p&gt;\n&lt;p&gt;Сигналы поведения помимо точности. Используемые нами оси анализа развивались в разных областях. Геометрия скрытых состояний отслеживает изменение внутренних представлений при изменении ввода. Меры семантического сходства (например, BERTScore) дополняют лексическое перекрытие (BLEU). Логарифмические вероятности токенов и предсказательная энтропия являются стандартными инструментами измерения уверенности. &lt;a href=\"concepts/stilisticheskaya-akkomodatsiya.html\"&gt;Стилистическая аккомодация&lt;/a&gt; — степень отражения моделью регистра ввода — изучается как самостоятельный феномен. Хотя зеркальное отражение часто является желаемой чертой настройки на инструкции, оно может проявляться как непреднамеренная нестабильность, если модель копирует несемантические шумы. Комбинирование этих сигналов в рамках единого анализа на уровне отдельных примеров ранее не проводилось. Существующие бенчмарки часто ограничены одним сигналом, например, точностью, что не позволяет определить, является ли нестабильность свойством модели в целом или она локализована в конкретных данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Стилистическая аккомодация — это склонность модели подстраивать свой стиль ответа под стиль или регистр полученного запроса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cel-obobsheniya-s-uchetom-stabilnosti-sago\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#cel-obobsheniya-s-uchetom-stabilnosti-sago\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цель обобщения с учетом стабильности (SAGO)&lt;/span&gt;&lt;/a&gt;Цель обобщения с учетом стабильности (SAGO)&lt;/h4&gt;\n&lt;p&gt;SAGO оценивает устойчивость к семантически эквивалентным вариациям ввода: модель считается обобщающей только в том случае, если ее поведение остается стабильным при сохранении смысла запроса. Мы измеряем это через семейства вариаций, домены контента и отдельные промпты, сравнивая поведение на исходных и измененных данных по нескольким осям. Фреймворк включает: (1) &lt;a href=\"concepts/benchmark.html\"&gt;бенчмарк&lt;/a&gt; контролируемых семантических вариаций, (2) показатель стабильности для каждого промпта и (3) оси поведения, фиксирующие различные типы сбоев.&lt;/p&gt;\n&lt;h4 id=\"oboznacheniya-i-celevaya-funkciya\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#oboznacheniya-i-celevaya-funkciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обозначения и целевая функция&lt;/span&gt;&lt;/a&gt;Обозначения и целевая функция&lt;/h4&gt;\n&lt;p&gt;Пусть X обозначает пространство текстовых запросов (промптов), Y — пространство ответов языковой модели, а f_θ: X → Y — исследуемая модель с инструктивной донастройкой (instruction-tuned), качество которой оценивается на наборе датасетов &lt;span class=\"yfm-latex\" data-content=\"%5C%7BD_j%5C%7D_%7Bj%3D1%7D%5EJ\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Для исходного запроса &lt;span class=\"yfm-latex\" data-content=\"x_i%20%5Cin%20D_j\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; базовая реакция системы определяется как y_i = f_θ(x_i). Функция c: X → C сопоставляет каждому промпту его семантическое содержание. На основе исходного текста формируется множество семантически эквивалентных вариаций, индексируемых &lt;span class=\"yfm-latex\" data-content=\"v%20%5Cin%20V\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"x_i%5E%7B(v)%7D%20%3D%20T_v(x_i)%2C%20%5Cquad%20c(x_i%5E%7B(v)%7D)%20%3D%20c(x_i)%20%5Cquad%20(1)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;где T_v: X → X представляет собой преобразование, полностью сохраняющее смысловую нагрузку исходного запроса.&lt;/p&gt;\n&lt;p&gt;Под «осью» (axis) понимается скалярная характеристика поведения модели &lt;span class=\"yfm-latex\" data-content=\"X(f_%20heta%2C%20x)%20%5Cin%20%5Cmathbb%7BR%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; при обработке конкретного промпта. Отклонение, вызванное применением вариации v, вычисляется как разность Δ X(i, v) = X(f_θ, x_i^(v)) - X(f_θ, x_i). Это значение имеет знак: например, отрицательная величина Δ XAct указывает на смещение репрезентативного представления (representational drift). Для агрегирования абсолютной величины сдвига применяется среднеквадратичное значение (RMS).&lt;/p&gt;\n&lt;p&gt;Цель метода SAGO заключается в проверке строгого условия: остаётся ли изменение нулевым при любых допустимых трансформациях:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"%5CDelta%20X(i%2C%20v)%20%3D%200%20%5Cquad%20%20ext%7B%D0%B4%D0%BB%D1%8F%20%D0%B2%D1%81%D0%B5%D1%85%20%7D%20i%20%20ext%7B%20%D0%B8%20%7D%20v%20%5Cin%20V%20%5Cquad%20(2)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Если данное равенство нарушается, метод позволяет количественно оценить масштаб отклонения. Любое ненулевое значение служит прямым доказательством сбоя обобщающей способности по проверяемой оси X. Поскольку устойчивость системы по одному параметру не гарантирует стабильности по другим, вычисления выполняются отдельно для каждой оси.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Целевая функция SAGO проверяет идеальную инвариантность ответов модели: любое отклонение &lt;span class=\"yfm-latex\" data-content=\"%5CDelta%20X(i%2C%20v)%20%0Aeq%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; при сохранении смысла промпта расценивается как сбой обобщающей способности.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"postroenie-benchmarka\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#postroenie-benchmarka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Построение бенчмарка&lt;/span&gt;&lt;/a&gt;Построение бенчмарка&lt;/h4&gt;\n&lt;p&gt;Созданный бенчмарк объединяет несколько тестовых наборов данных со стандартизированным комплексом контролируемых входных модификаций. Каждая вариация описывается кортежем параметров v = (F, u, s, p), где &lt;span class=\"yfm-latex\" data-content=\"F%20%5Cin%20%5Cmathcal%7BF%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; определяет семейство преобразований, &lt;span class=\"yfm-latex\" data-content=\"u%20%5Cin%20U_F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — его подтип, &lt;span class=\"yfm-latex\" data-content=\"s%20%5Cin%20S_F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — интенсивность воздействия, а &lt;span class=\"yfm-latex\" data-content=\"p%20%5Cin%20%5Cmathcal%7BP%7D%20%3D%20%5C%7B%20ext%7BPREFIX%7D%2C%20%20ext%7BSUFFIX%7D%2C%20%20ext%7BGLOBAL%7D%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — позицию вставки атрибута.&lt;/p&gt;\n&lt;p&gt;Полное множество вариаций формируется следующим образом:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"V%20%3D%20%5C%7B(F%2C%20u%2C%20s%2C%20p)%20%5Cmid%20F%20%5Cin%20%5Cmathcal%7BF%7D%2C%20u%20%5Cin%20U_F%2C%20s%20%5Cin%20S_F%2C%20p%20%5Cin%20%5Cmathcal%7BP%7D%5C%7D%20%5Cquad%20(3)%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Авторы выделили три основных семейства модификаций, выбрав их так, чтобы сохранение стабильности в одном не гарантировало устойчивости в других. При этом строго соблюдается условие сохранения смысла c(x_i^(v)) = c(x_i):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Социальный регистр (Social register):&lt;/strong&gt; меняет межличностное обращение в запросе (степень вежливости, прямоту, форму приветствия, маркеры благодарности или негативный контекст).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поверхностный шум (Surface noise):&lt;/strong&gt; вносит изменения на уровне символов и токенов, включая нестандартные пробелы, случайные знаки препинания и смену регистра букв.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Структурная переформулировка (Structural rewriting):&lt;/strong&gt; меняет синтаксическую структуру текста (сжатие или расширение длины, перефразирование из вопросительной формы в повелительную).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Бенчмарк тестирует устойчивость модели к трём типам помех, которые часто встречаются в реальных пользовательских запросах: изменению тона общения, опечаткам и перефразированию.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenka-generalizacii-ustojchivosti-sgs\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#ocenka-generalizacii-ustojchivosti-sgs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка генерализации устойчивости (SGS)&lt;/span&gt;&lt;/a&gt;Оценка генерализации устойчивости (SGS)&lt;/h4&gt;\n&lt;p&gt;Для измерения степени отклонения поведения модели от идеального условия (Ур. 2) используется метрика SGS (&lt;a href=\"concepts/stability-generalization-score.html\"&gt;Stability Generalization Score&lt;/a&gt;). Так как различные оси X имеют разную природу и размерность, вычисленные дельты подлежат предварительной нормализации.&lt;/p&gt;\n&lt;p&gt;Значение дельты делится на фиксированный нормировочный коэффициент R_X:&lt;/p&gt;\n&lt;p&gt;ildeΔ X(i, v) = Δ X(i, v) / R_X&lt;/p&gt;\n&lt;p&gt;Для показателей с ограниченным диапазоном R_X равен теоретическому максимуму /Δ X/; для неограниченных величин (например, логарифмической вероятности последовательности log-probability) R_X рассчитывается на основе эмпирического диапазона значений. В результате шкалирования получается диапазон $ ilde{\\Delta} X \\in [-1, 1]$, где 0 означает полное отсутствие изменений в поведении.&lt;/p&gt;\n&lt;p&gt;Нестабильность модели на конкретном промпте i определяется как среднеквадратичное отклонение (RMS) нормализованных дельт по всему множеству вариаций V:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"s_X(i)%20%3D%20%5Cleft(%20%5Cfrac%7B1%7D%7B%2FV%2F%7D%20%5Csum_%7Bv%20%5Cin%20V%7D%20%20ilde%7B%5CDelta%7D%20X(i%2C%20v)%5E2%20%5Cright)%5E%7B1%2F2%7D%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Если модель смещается на одну и ту же ненулевую величину при всех трансформациях, RMS точно зафиксирует эту нестабильность.&lt;/p&gt;\n&lt;p&gt;Для отдельного датасета D_j итоговый показатель рассчитывается как среднее значение нестабильности промптов: $ ext{SGS}&lt;em&gt;X^{(j)} = \\frac{1}{/D_j/} \\sum&lt;/em&gt;{i \\in D_j} s_X(i)$. Общая оценка по всем датасетам вычисляется с равным весом для каждого промпта:&lt;/p&gt;\n&lt;p class=\"yfm-latex\" data-content=\"ext%7BSGS%7D_X%20%3D%20%5Cfrac%7B1%7D%7BN%7D%20%5Csum_%7Bj%3D1%7D%5EJ%20%2FD_j%2F%20%5Ccdot%20%20ext%7BSGS%7D_X%5E%7B(j)%7D%2C%20%5Cquad%20%20ext%7B%D0%B3%D0%B4%D0%B5%20%7D%20N%20%3D%20%5Csum_%7Bj%3D1%7D%5EJ%20%2FD_j%2F%0A\" data-options=\"%7B%22displayMode%22%3Atrue%7D\"&gt;&lt;/p&gt;&lt;p&gt;Чем ниже значение SGS_X, тем выше устойчивость системы. Равенство SGS_X = 0 достигается тогда и только тогда, когда условие (Ур. 2) выполняется для всех входных данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Метрика нормирует разброс ответов к единому интервалу [-1, 1], поэтому чувствительность показателя зависит от корректности выбора коэффициента R_X для неограниченных характеристик.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки статистической значимости нарушений используется односторонний t-критерий со сравнением против порога допустимой погрешности &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3E%200\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (&lt;span class=\"yfm-latex\" data-content=\"H_0%3A%20%5Cmathbb%7BE%7D%5Bs_X(i)%5D%20%5Cle%20%5Cvarepsilon\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; против &lt;span class=\"yfm-latex\" data-content=\"H_1%3A%20%5Cmathbb%7BE%7D%5Bs_X(i)%5D%20%3E%20%5Cvarepsilon\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;). В исследовании применяются пороги &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%5Cin%20%5C%7B0%7B%2C%7D01%3B%200%7B%2C%7D05%3B%200%7B%2C%7D10%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, соответствующие 1%, 5% и 10% от нормализованного диапазона. В качестве основного порога авторы выбирают &lt;span class=\"yfm-latex\" data-content=\"%5Cvarepsilon%20%3D%200%7B%2C%7D05\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Статистика теста рассчитывается по формуле &lt;span class=\"yfm-latex\" data-content=\"t%20%3D%20(%5Cbar%7Bs%7D_X%20-%20%5Cvarepsilon)%20%2F%20%20ext%7BSE%7D(s_X)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7Bs%7D_X\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — среднее выборки, а SE(s_X) — стандартная ошибка измерений для N промптов.&lt;/p&gt;\n&lt;h4 id=\"metriki\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#metriki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики&lt;/span&gt;&lt;/a&gt;Метрики&lt;/h4&gt;\n&lt;p&gt;SGSX вычисляется независимо для каждой оси X. Мы используем четыре оси, отражающие различные способы сбоя модели (Ур. 2). Каждая ось фиксирует поведенческую чувствительность, которую невозможно различить с помощью стандартных метрик точности.&lt;/p&gt;\n&lt;p&gt;Геометрия активаций (XAct). Внутренние представления могут меняться при изменении промпта, даже если итоговый ответ остается прежним. Мы определяем ∆XAct как среднее отклонение косинусного сходства скрытых состояний последнего слоя &lt;span class=\"yfm-latex\" data-content=\"h_%5Cell\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; для исходного и измененного промптов. Отрицательные значения указывают на «дрейф» представлений. Масштабирующий коэффициент RAct = 2 охватывает диапазон от -1 до 1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метрика XAct выявляет внутреннюю нестабильность модели, когда представления меняются, несмотря на стабильность внешних ответов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Согласованность генерации (XBLEU, XBERT). Модель может сохранять точность, но менять формулировки ответов. Мы измеряем разницу в метриках BLEU (лексическое сходство) и BERTScore (семантическое сходство) между ответами на базовый и измененный промпты. Коэффициенты масштабирования составляют RBLEU = 100 и RBERT = 1.&lt;/p&gt;\n&lt;p&gt;Уверенность и неопределенность (XProb, XEnt). Модель может давать стабильные ответы, становясь при этом менее уверенной. Мы используем логарифм вероятности последовательности (XProb) и среднюю энтропию токенов (XEnt). Энтропия служит сигналом уверенности, не зависящим от длины ответа (REnt = 10), тогда как логарифм вероятности чувствителен к длине, поэтому для него установлен RProb = 250.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/entropiya-v-dannom-kontekste.html\"&gt;Энтропия в данном контексте&lt;/a&gt; — мера «нерешительности» модели при выборе следующего токена: чем выше значение, тем менее предсказуем выбор модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Зеркальное отражение ответов (XMR). Модель может адаптировать стиль ответа под поверхностные свойства ввода (например, длину или шум). Мы используем бинарный детектор m(y, v), который определяет, отражает ли ответ y свойство вариации v. Значение ∆XMR показывает разницу в этом отражении между базовым и измененным промптами (RMR = 1).&lt;/p&gt;\n&lt;h4 id=\"eksperimenty\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#eksperimenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименты&lt;/span&gt;&lt;/a&gt;Эксперименты&lt;/h4&gt;\n&lt;p&gt;Мы оцениваем LLM, настроенные на инструкции, используя фреймворк SAGO. Мы вычисляем SGSX для всех комбинаций типов, силы и позиций вариаций. Исследование направлено на три вопроса: различаются ли типы сбоев по шести осям ∆; может ли вариативность внутри модели изменить рейтинг моделей при смене датасета; и есть ли качественные различия в профилях нестабильности между закрытыми и открытыми моделями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка проводится на моделях, настроенных на инструкции; результаты могут зависеть от специфики конкретного семейства моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimentalnaya-ustanovka\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#eksperimentalnaya-ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальная установка&lt;/span&gt;&lt;/a&gt;Экспериментальная установка&lt;/h4&gt;\n&lt;p&gt;Исследователи проанализировали восемь моделей с открытыми весами (семейства Llama-3.2/3.1, Gemma-2/4 и Qwen2.5/3.5) и три проприетарные модели (GPT-5.4, Gemini-2.5-Flash, Claude-Sonnet-4.6). Для всех моделей использовалось &lt;a href=\"concepts/determinirovannoe-dekodirovanie.html\"&gt;детерминированное декодирование&lt;/a&gt; (температура T=0). Вычисления проводились на графических процессорах NVIDIA RTX 2080 Ti и GTX 1080 Ti. Эффективность оценивалась на шести наборах данных (TruthfulQA, Natural Questions, Alpaca, SimpleQA Verified, TriviaQA, HotpotQA), охватывающих широкий спектр тем. Для каждого набора данных было отобрано по 16 промптов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детерминированное декодирование (T=0) — это режим работы нейросети, при котором она всегда выбирает наиболее вероятный следующий токен, что делает ответы воспроизводимыми.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки устойчивости (набор V) применялись три метода изменения промптов: изменение вежливости (11 уровней), внесение поверхностного шума (изменения регистра, пунктуации и пробелов) и структурная переработка (изменение длины и формы предложения). Сохранение семантического смысла проверялось с помощью метрики BERTScore (порог &amp;gt; 0,85).&lt;/p&gt;\n&lt;p&gt;Метрики XBLEU и XBERT используют RoBERTa-large, а XMR (зеркальное отражение) для социальных регистров оценивалось с помощью GPT-4o-mini. Пороговое значение ε установлено на уровне 0,05.&lt;/p&gt;\n&lt;h4 id=\"rezultaty-eksperimentov\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#rezultaty-eksperimentov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты экспериментов&lt;/span&gt;&lt;/a&gt;Результаты экспериментов&lt;/h4&gt;\n&lt;p&gt;Результаты показывают, что модели демонстрируют различную степень устойчивости к изменениям промптов. В таблице 1 представлены показатели SGS для закрытых моделей. Например, для GPT-5.4 средний показатель SGS составил 0,384–0,477 в зависимости от датасета. Модель Claude-Sonnet-4.6 показала более высокие значения SGS (до 0,569 на Alpaca), что указывает на чувствительность генерации к вариациям входных данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели демонстрируют статистически значимую чувствительность к изменениям промптов (p &amp;lt; 0,001 для большинства случаев), что подтверждает необходимость оценки устойчивости генерации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на ограниченной выборке (16 промптов на &lt;a href=\"concepts/dataset.html\"&gt;датасет&lt;/a&gt;) и могут не отражать поведение моделей при работе с принципиально иными типами запросов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-tT1.jpg\" alt=\"Таблица 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"obshij-pokazatel-sgs\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#obshij-pokazatel-sgs\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общий показатель SGS&lt;/span&gt;&lt;/a&gt;Общий показатель SGS&lt;/h4&gt;\n&lt;p&gt;Исследование показывает, что ни одна модель не демонстрирует универсальной стабильности. Неустойчивость при семантически эквивалентных изменениях входных данных не является следствием конкретной архитектуры или метода обучения: каждая протестированная модель с открытым исходным кодом превышает порог нестабильности ε=0.05 как минимум по одной оси. Статистическая значимость изменений показателей Δ-BLEU и Δ-MR подтверждается при p&amp;lt;0.001 для всех моделей. Тот факт, что это наблюдается в трех различных архитектурных семействах, указывает на фундаментальную структурную особенность текущих методов настройки инструкций (instruction-tuning).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ни одна модель не является универсально стабильной; неустойчивость сохраняется независимо от архитектуры и количества параметров.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ масштабирования опровергает гипотезу о том, что увеличение количества параметров решает проблему: модели L-8B, G-7B и Q-7B демонстрируют такую же или даже большую нестабильность, чем их меньшие аналоги (Рис. 2a). При этом показатель Δ-Ent остается в пределах допустимого порога (максимум 0,012), что указывает на то, что резкость распределения на уровне токенов слабо связана со стабильностью на уровне вывода.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"razdelenie-osej-axis-dissociation\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#razdelenie-osej-axis-dissociation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разделение осей (Axis dissociation)&lt;/span&gt;&lt;/a&gt;Разделение осей (Axis dissociation)&lt;/h4&gt;\n&lt;p&gt;Ключевой вопрос заключается в том, являются ли оси поведения взаимозаменяемыми индикаторами одной нестабильности или же они отражают независимые типы сбоев. Данные подтверждают второе. В семействе Gemma модель G4-E4B показывает самую высокую нестабильность генерации (Δ-BERT: 0,178; Δ-BLEU: 0,837), тогда как более ранние версии (G-2B: 0,097; G-7B: 0,084) более стабильны. Это опровергает предположение, что рост возможностей модели автоматически ведет к росту ее устойчивости.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разделение осей означает, что модель может быть стабильна в генерации текста, но при этом демонстрировать высокую неуверенность или склонность к копированию (имитации) данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель Q3.5-9B демонстрирует обратную картину: самые низкие показатели Δ-BERT (0,080) и Δ-BLEU (0,520), но при этом самые высокие показатели нестабильности уверенности (Δ-Prob: 0,088) и зеркальной нестабильности (Δ-MR: 0,441). Такая систематическая инверсия доказывает, что консистентность генерации и уверенность модели — это не связанные прокси-показатели. Агрегированные оценки могут скрывать противоположные профили сбоев, требующие разных подходов к исправлению.&lt;/p&gt;\n&lt;h4 id=\"variativnost-mezhdu-naborami-dannyh\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#variativnost-mezhdu-naborami-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вариативность между наборами данных&lt;/span&gt;&lt;/a&gt;Вариативность между наборами данных&lt;/h4&gt;\n&lt;p&gt;Нестабильность модели не является фиксированным свойством; она зависит от домена контента. Для модели L-8B показатель Δ-Cos варьируется в 3,7 раза, а Δ-MR более чем в два раза в зависимости от набора данных. Это означает, что оценка устойчивости, привязанная к одному бенчмарку, характеризует только этот конкретный домен. Для реальных условий развертывания, где распределение контента не контролируется, это критически важно: модель, кажущаяся стабильной в тесте, может быть нестабильной на практике. Использование Total SGSX, объединяющего шесть наборов данных с равным весом, является наиболее адекватным методом усреднения этой зависимости.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Обобщение моделей при семантически эквивалентных вариациях входных данных не может быть описано единым показателем точности или метрикой устойчивости. Нестабильность представляет собой структурированный профиль, зависящий от набора данных, типа вариаций и конкретных промптов. Модель может быть устойчива по одной оси поведения, но нестабильна по другой. Схожие показатели на бенчмарках могут скрывать значительные изменения на уровне отдельных примеров, сохраняя средний балл при изменении ответов или паттернов уверенности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Устойчивость LLM не является универсальной: высокая точность на бенчмарках не гарантирует стабильность ответов при изменении формулировки запроса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Заявления об обобщающей способности моделей должны быть ограничены конкретными доменами и типами вариаций. Сравнение моделей следует проводить на основе профилей поведения, а не общего рейтинга, так как выбор модели зависит от приоритетов: стабильность содержания, уверенность или устойчивость к зеркалированию поверхностных признаков. Различия между открытыми и закрытыми моделями показывают, что более мощные системы не устраняют нестабильность, а лишь смещают её в другие поведенческие измерения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зеркалирование (mirroring) — это склонность модели копировать стиль или структуру входного запроса, даже если это не требуется для сути ответа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Socialregistervariantsatallevaluatedstrengths.Negativevaluesintroduceimperative orsociallynegativeframing;positivevaluesaddgreetings,hedging,andgratitudemarkerswith elaborateness scaling with /s/.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-tT2.jpg\" alt=\"Таблица 2\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya-i-perspektivy\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#ogranicheniya-i-perspektivy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и перспективы&lt;/span&gt;&lt;/a&gt;Ограничения и перспективы&lt;/h4&gt;\n&lt;p&gt;Метод SAGO фиксирует изменения поведения, но не раскрывает их причинные механизмы, оставляя неразрывными дрейф представлений и чувствительность декодирования. Исследование ограничено английским языком, поэтому применимость выводов к другим языкам и культурным контекстам не доказана. Метрика Δ-BLEU оценивает лексические отклонения, а Δ-BERT дополняет её на уровне смысла. Выборка N=16 достаточна для типичной нестабильности, но для редких критических сбоев могут потребоваться большие объемы данных. Использование GPT-4o-mini для оценки структурных вариантов может вносить стилистические искажения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено английским языком и использованием GPT-4o-mini в качестве оценочного инструмента, что может ограничивать интерпретацию результатов для других языков и моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Будущие работы должны расширить SAGO на мультиязычные среды, связать поведенческие профили с внутренними механизмами через анализ активаций и оценивать методы обучения по их способности сохранять стабильность поведения при любых семантически эквивалентных изменениях входных данных.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f1.jpg\" alt=\"Рисунок 1: Семантически эквивалентные фактические промпты вызывают измеримые поведенческие сдвиги в разных семействах мо\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Семантически эквивалентные фактические промпты вызывают измеримые поведенческие сдвиги в разных семействах моделей. На радарных диаграммах показана средняя величина дельты по четырем осям.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f3.jpg\" alt=\"Рисунок 3: Стандартное отклонение нестабильности для каждого промпта в зависимости от размера выборки промптов N.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Стандартное отклонение нестабильности для каждого промпта в зависимости от размера выборки промптов N.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Стандартное отклонение нестабильности для каждого промпта в зависимости от размера выборки промптов N. На каждой панели показана одна поведенческая ось; каждая линия соответствует одной модели. Кривые выходят на плато при N=16 и остаются стабильными до N=128, что подтверждает достаточность N=16 для надежной оценки. Пунктирная вертикальная линия отмечает выбранную рабочую точку.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f4.jpg\" alt=\"Рисунок 4: Стандартное отклонение средних значений групп (F, u, s) в зависимости от позиции p для каждой оси.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Стандартное отклонение средних значений групп (F, u, s) в зависимости от позиции p для каждой оси.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Стандартное отклонение средних значений групп (F, u, s) в зависимости от позиции p для каждой оси. На всех осях и моделях три позиции дают систематически различающиеся значения: глобальные варианты оказывают наибольшее влияние на согласованность генерации и зеркальность, в то время как префиксное и суффиксное размещение демонстрируют различные профили чувствительности по осям уверенности и активации. Ни одно размещение не является доминирующим для всех осей и моделей, что подтверждает: объединение данных по позициям привело бы к потере поведенческого сигнала, поэтому все три должны быть включены в V. Каждая панель показывает одну поведенческую ось; каждая линия соответствует одной модели. Три позиции (GLOBAL, PREFIX, SUFFIX) создают различные профили по осям, подтверждая, что все варианты размещения вносят независимый поведенческий сигнал в SGSX.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f5.jpg\" alt=\"Рисунок 5: Стандартное отклонение нестабильности для каждого промпта в зависимости от силы интервалов (количество добавл\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Стандартное отклонение нестабильности для каждого промпта в зависимости от силы интервалов (количество добавленных пробельных токенов). Эффекты усиливаются с ростом силы воздействия и демонстрируют точки насыщения, зависящие от модели, при этом оси согласованности генерации наиболее чувствительны при умеренных значениях.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f6.jpg\" alt=\"Рисунок 6: Стандартное отклонение нестабильности для каждого промпта в зависимости от силы регистра (доля символов в вер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Стандартное отклонение нестабильности для каждого промпта в зависимости от силы регистра (доля символов в верхнем регистре). Поведенческая обнаруживаемость растет с увеличением силы воздействия по большинству осей и выходит на плато при значении выше 50, при этом геометрия активации демонстрирует наиболее выраженный и последовательный отклик.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f7.jpg\" alt=\"Рисунок 7: Стандартное отклонение нестабильности на запрос в зависимости от силы пунктуации (количество введенных токено\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Стандартное отклонение нестабильности на запрос в зависимости от силы пунктуации (количество введенных токенов пунктуации на запрос). Оси согласованности генерации и активации показывают наиболее четкие эффекты, зависящие от силы воздействия; оси уверенности остаются в значительной степени неизменными, что согласуется с их низким общим SGSX в основных результатах.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f8.jpg\" alt=\"Рисунок 8: Стандартное отклонение нестабильности на запрос в зависимости от степени вежливости.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8: Стандартное отклонение нестабильности на запрос в зависимости от степени вежливости.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 8: Стандартное отклонение нестабильности на запрос в зависимости от степени вежливости. Отрицательные значения соответствуют грубой формулировке, положительные — вежливой; ноль — исходный уровень без изменений. Грубые варианты вызывают более значительные и последовательные поведенческие сдвиги, чем вежливые, у большинства моделей и по большинству осей, что указывает на асимметрию в реакции моделей на негативный и позитивный социальный тон.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-f9.jpg\" alt=\"Рисунок 9: Стандартное отклонение нестабильности на запрос в зависимости от коэффициента изменения длины (отношение целе\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9: Стандартное отклонение нестабильности на запрос в зависимости от коэффициента изменения длины (отношение целевой длины к исходному запросу; значения ниже 1,0 указывают на сжатие, выше 1,0 — на расширение). Сжатие вызывает более значительные и более согласованные для моделей поведенческие сдвиги, чем расширение, по осям согласованности генерации и зеркалирования, в то время как оси уверенности сильнее реагируют на расширение.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;агрегированные&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;метрики&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;скрывают&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ошибки&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx
