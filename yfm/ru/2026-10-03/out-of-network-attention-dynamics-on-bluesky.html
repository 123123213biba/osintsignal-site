            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"249\" cy=\"72\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"591\" cy=\"271\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · COORDINATION   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Пузыри фильтров или&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;случайность: как мы на самом&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;деле выбираем контент в&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;соцсетях&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f1.jpg\" alt=\"Рис. 1. Вверху: проанализированные взаимодействия, декомпозированные по длине пути внимания (107,8 млн отслеживаемых, 21\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Вверху: проанализированные взаимодействия, декомпозированные по длине пути внимания (107,8 млн отслеживаемых, 21,2 млн ретранслируемых, 31,7 млн локальных в два перехода, 12,5 млн удаленных). Внизу: доля взаимодействий в пределах двух переходов отслеживания (т. е. уровни отслеживаемых и локальных в два перехода, исключая ретрансляцию) по сравнению с ожидаемой нулевой степенью.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Большинство пользователей соцсетей считают, что алгоритмы диктуют их интересы, но структура сети играет не меньшую роль. Анализ 173 миллионов взаимодействий на платформе Bluesky выявил, что подавляющее внимание сосредоточено внутри «социального пузыря». Даже при отсутствии жестких алгоритмов ленты, люди склонны взаимодействовать с контентом, который находится в пределах двух шагов от их текущих подписок.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;74,5% взаимодействий проходят через уже сформированный круг подписок пользователя.&lt;/li&gt;\n&lt;li&gt;80,6% внимания сосредоточено в пределах двух шагов от текущих подписок, что в 3,6 раза выше случайного распределения.&lt;/li&gt;\n&lt;li&gt;Взаимодействия за пределами двух шагов в три раза реже приводят к оформлению новой подписки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи проанализировали 173 миллиона взаимодействий (лайки, репосты, ответы) 1,1 миллиона пользователей Bluesky в период с февраля по сентябрь 2023 года. В качестве метрики использовалась «&lt;a href=\"concepts/attention-path-length.html\"&gt;длина пути внимания&lt;/a&gt;» — расстояние в графе подписок между пользователем и автором контента. Выяснилось, что 74,5% взаимодействий происходят с аккаунтами, на которые пользователь уже подписан, либо через репосты от них.&lt;/p&gt;\n&lt;p&gt;При измерении дистанции в графе подписок 80,6% взаимодействий попадают в радиус двух «прыжков» (follow-hops). Это значительно выше 22,4%, которые предсказывает &lt;a href=\"concepts/expected-degree-null-model.html\"&gt;нулевая модель&lt;/a&gt; (expected-degree null), учитывающая только случайное распределение связей. Исследование также показало, что хотя пользователи совершают «исследовательские» действия за пределами своей сети, они редко превращают их в новые подписки: &lt;a href=\"concepts/conversion.html\"&gt;конверсия в новые связи&lt;/a&gt; для дальних контактов в три раза ниже, чем для локальных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование опирается только на явные действия (лайки, репосты), игнорируя пассивное потребление контента, такое как просмотры или чтение ленты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Персонализированные социальные сети часто используют графы подписок для формирования ленты пользователя. Однако масштаб внимания, уделяемого контенту от авторов, на которых пользователь не подписан, остается недостаточно изученным. Исследование сфокусировано на децентрализованной платформе Bluesky, где лента по умолчанию строится в обратном хронологическом порядке.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/graf-podpisok.html\"&gt;Граф подписок&lt;/a&gt; — это структура данных, отражающая связи между пользователями (кто на кого подписан), а «путь внимания» определяет, через какое количество посредников контент доходит до пользователя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы проанализировали 173 миллиона взаимодействий (лайки, репосты, ответы, цитирования), собранных в период с февраля по сентябрь 2023 года. Взаимодействия классифицировались по длине пути: прямая подписка, ретрансляция через подписку, доступность в пределах двух «прыжков» (hops) по графу или за его пределами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;74,5% взаимодействий приходятся на аккаунты, на которые пользователь уже подписан, а 80,6% всех взаимодействий укладываются в два «прыжка» по графу, что значительно выше ожидаемых 22,4% согласно нулевой модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследование показывает, что небольшая группа пользователей генерирует 75% всей «исследовательской» активности (взаимодействий вне сети подписок). Со временем общая склонность к изучению нового контента снижается, однако за этим скрываются три различных типа поведения пользователей. Контент, полученный из-за пределов двух «прыжков», конвертируется в новые подписки в три раза реже, чем контент из локальной сети. Это указывает на то, что, несмотря на значительный объем внешнего контента, он сильно ограничен близостью в социальной сети и редко приводит к формированию новых связей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данное наблюдательное исследование описывает корреляции на платформе Bluesky; результаты могут зависеть от специфики алгоритмов и поведения аудитории конкретной сети.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Большинство крупных социальных платформ управляют тем, какой контент видит пользователь, через алгоритмы ранжирования, работа которых скрыта от внешнего наблюдателя. Это затрудняет разделение двух факторов, формирующих внимание: социального окружения, созданного пользователем через прямые подписки, и контента, который предлагают рекомендательные системы. Платформа Bluesky предоставляет уникальные условия для изучения этого вопроса. Она построена на открытом протоколе AT Protocol и по умолчанию использует ленту «Following», где посты отображаются в обратном хронологическом порядке. Хотя другие механизмы рекомендаций существуют, они являются опциональными, и исследования показывают, что их использование ограничено относительно всей базы пользователей. Таким образом, граф подписок Bluesky служит структурным ориентиром для анализа того, насколько внимание пользователей выходит за пределы их «социального пузыря».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показывает, что 74,5% взаимодействий пользователей происходят с аккаунтами, на которые они уже подписаны, или через репосты от них.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В работе внимание определяется через поведенческие следы: лайки, репосты, ответы и цитирования. Авторы задаются вопросом: какая часть внимания остается внутри сети подписок, а какая выходит за её пределы? Это важно, так как социальные связи селективны. &lt;a href=\"concepts/gomofiliya.html\"&gt;Гомофилия&lt;/a&gt; (тенденция объединяться с похожими людьми) означает, что граф подписок изначально не случаен, а алгоритмическая курация может дополнительно сужать кругозор. Исследователи анализируют три вопроса: сколько внимания выходит за пределы графа подписок (RQ1), как распределено это исследование контента между пользователями и меняется ли оно со временем (RQ2), и превращается ли внимание вне сети в новые социальные связи (RQ3).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гомофилия — склонность людей формировать связи с теми, кто на них похож, что создает информационные кластеры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Используя &lt;a href=\"concepts/dataset.html\"&gt;набор данных&lt;/a&gt; из 173 млн взаимодействий от 1,1 млн пользователей, авторы обнаружили, что 80,6% взаимодействий происходят в пределах двух «шагов» (подписок) от пользователя, что значительно выше ожидаемых показателей для случайной модели. Исследование контента вне сети существенно по объему, но крайне неоднородно: активное меньшинство генерирует большую часть таких взаимодействий. При этом взаимодействие за пределами двухшагового соседства конвертируется в новые подписки в три раза реже, чем локальные действия.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы&lt;/span&gt;&lt;/a&gt;Связанные работы&lt;/h4&gt;\n&lt;p&gt;Онлайн-внимание формируется не только дизайном платформы, но и предпочтениями пользователей. Гомофилия, избирательное воздействие и предвзятость подтверждения заставляют людей искать контент, соответствующий их убеждениям. Предыдущие работы изучали это на уровне сообществ или идеологий, тогда как данное исследование фокусируется на структурной дистанции — как далеко внимание уходит от собственного графа подписок пользователя. Авторы также разграничивают «исследование» (взаимодействие с внешними аккаунтами) и «конверсию» (превращение этого взаимодействия в подписку), связывая теорию слабых связей с эволюцией сетевых структур.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на данных конкретной платформы (Bluesky) с её специфической структурой ленты, что может ограничивать перенос выводов на другие социальные сети.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"rq1-skolko-vnimaniya-vyhodit-za-predely-grafa-podpisok\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rq1-skolko-vnimaniya-vyhodit-za-predely-grafa-podpisok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ1: Сколько внимания выходит за пределы графа подписок?&lt;/span&gt;&lt;/a&gt;RQ1: Сколько внимания выходит за пределы графа подписок?&lt;/h4&gt;\n&lt;p&gt;Из 1,1 млн пользователей с хотя бы одним проанализированным взаимодействием 575 тыс. сформировали исследуемые пары. Анализ 173 млн взаимодействий по длине пути внимания показал: 62,3% приходятся на авторов, на которых пользователь уже подписан; 12,2% — опосредованы ретрансляцией (репостом) от подписки; 18,3% достигают авторов через два перехода по графу подписок; 7,2% выходят за пределы двух переходов. Таким образом, 74,5% взаимодействий проходят через аккаунты, на которые пользователь подписан напрямую (как автор или источник ретрансляции). Если исключить ретрансляции и считать только расстояние по графу подписок, 80,6% взаимодействий достигают авторов в пределах двух переходов (62,3% — один переход, 18,3% — два). Это нижняя граница, так как часть ретрансляций также может укладываться в два перехода. Сравнение с нулевой моделью (ожидаемое распределение при сохранении входящих и исходящих связей пользователей) показывает, что в случайных условиях лишь 22,4% взаимодействий попадали бы в пределы двух переходов — разрыв в 58,4 процентных пункта остается стабильным для разных когорт.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;80,6% взаимодействий направлены на авторов в пределах двух «шагов» по графу подписок, что значительно выше случайного распределения (22,4%).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rq2-kak-raspredelyaetsya-issledovatelskoe-vnimanie-i-menyaetsya-li-ono-so-vremenem\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rq2-kak-raspredelyaetsya-issledovatelskoe-vnimanie-i-menyaetsya-li-ono-so-vremenem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ2: Как распределяется исследовательское внимание и меняется ли оно со временем?&lt;/span&gt;&lt;/a&gt;RQ2: Как распределяется исследовательское внимание и меняется ли оно со временем?&lt;/h4&gt;\n&lt;p&gt;Пользователи, которые наиболее активны в подписках и взаимодействиях, чаще всего ограничивают свое внимание «ближним кругом». Доля исследовательских взаимодействий (вне графа подписок) растет от 20,1% до 74,3% при переходе от первой к десятой децили по объему активности, и от 3,3% до 80,4% по количеству подписок. Для 246 тыс. пользователей с минимум 10 событиями исследования авторы выделили 4 кластера поведения. Большинство (53,3%) — «узкий охват, редкие события, низкая частота». Остальные кластеры выделяются по одному признаку: «широкий охват» (22,7% пользователей, в среднем 293,9 автора), «повторные контакты» (5,2% пользователей, 5,2 визита к автору) и «высокая частота исследования» (18,8% пользователей, 66,7% активности — исследовательская). При этом широкий охват не всегда коррелирует с высокой частотой: кластер с самым широким охватом исследует контент с умеренной частотой (29,7%) и редко возвращается к авторам. На долю «широкого, но редкого» кластера приходится 74,4% всех исследовательских событий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/klasterizatsiya.html\"&gt;Кластеризация&lt;/a&gt; — метод машинного обучения для группировки пользователей по схожим паттернам поведения на основе стандартизированных признаков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ динамики показывает, что общая доля исследовательского внимания падает с 24,3% до 21,0% за 7 единиц времени, но это среднее значение скрывает неоднородность. Выделены три группы: «нисходящая» (34,6% пользователей, падение с 38,1% до 20,7%), «восходящая» (35,0%, рост с 16,3% до 25,0%) и «транзитная» (30,4%, рост с последующим падением). Около трети пользователей демонстрируют тренд, противоположный общему.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на наблюдательных данных; выявленные закономерности описывают корреляции, а не причинно-следственные связи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rq3-prevrashaetsya-li-vyhodyashee-vnimanie-v-novye-svyazi\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#rq3-prevrashaetsya-li-vyhodyashee-vnimanie-v-novye-svyazi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RQ3: Превращается ли «выходящее» внимание в новые связи?&lt;/span&gt;&lt;/a&gt;RQ3: Превращается ли «выходящее» внимание в новые связи?&lt;/h4&gt;\n&lt;p&gt;Исследователи проанализировали 22 млн пар взаимодействий, чтобы выяснить, приводят ли контакты вне графа подписок к формированию новых связей. Общий уровень конверсии в подписку в течение 30 дней составил 8,4%, при этом более 90% таких случаев происходят в первую неделю. Вероятность конверсии сильно зависит от «расстояния» до автора: если первый контакт произошел в пределах двух «прыжков» (&lt;a href=\"concepts/two-hop.html\"&gt;two-hop&lt;/a&gt;) в графе подписок, конверсия составляет 11,9%, тогда как за пределами этой зоны — лишь 3,3% (Таблица 1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вероятность того, что контакт за пределами двух «прыжков» перерастет в подписку, в 3,6 раза ниже, чем для локальных взаимодействий (3,3% против 11,9%).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Этот разрыв сохраняется даже после поправки на цензурированные данные и семь ковариат на уровне пользователя. В скорректированной модели (Таблица 2) &lt;a href=\"concepts/or.html\"&gt;отношение шансов&lt;/a&gt; (OR) для «дальнего» контакта составляет 0,351 (95% ДИ 0,335–0,368) по сравнению с локальным. Интересно, что высокая активность пользователя (log total interaction volume) снижает вероятность конверсии (OR 0,600), тогда как наличие большого числа исходящих связей (log out-degree) повышает её (OR 1,234).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отношение шансов (OR) — показатель, демонстрирующий, во сколько раз вероятность события в одной группе выше или ниже, чем в другой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obsuzhdenie-i-vyvody\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#obsuzhdenie-i-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение и выводы&lt;/span&gt;&lt;/a&gt;Обсуждение и выводы&lt;/h4&gt;\n&lt;p&gt;Результаты показывают, что внимание пользователей Bluesky жестко привязано к существующей социальной сети. Хотя 25% взаимодействий выходят за пределы графа подписок, 80,6% из них все равно остаются в пределах двух «прыжков», а еще 12,2% приходятся на репосты от уже отслеживаемых аккаунтов. Это значительно выше ожидаемых 22,4% при случайном распределении, что подтверждает: близость в сети является ключевым фактором взаимодействия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является наблюдательным: оно фиксирует корреляции, но не доказывает причинно-следственную связь между сетевой дистанцией и формированием новых связей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследование подчеркивает различие между «исследованием как охватом» и «исследованием как структурным изменением». Хотя пользователи часто взаимодействуют с аккаунтами вне своего круга, такие контакты редко ведут к расширению сети. Ограничения работы включают использование данных о совершенных действиях (вместо данных о реальном показе контента) и анализ раннего этапа развития платформы, что может не отражать текущую динамику алгоритмических рекомендаций.&lt;/p&gt;\n&lt;h4 id=\"nadezhnost,-validaciya-i-specifikacii-modeli\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#nadezhnost,-validaciya-i-specifikacii-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Надежность, валидация и спецификации модели&lt;/span&gt;&lt;/a&gt;Надежность, валидация и спецификации модели&lt;/h4&gt;\n&lt;p&gt;Для оценки значимости связей используется модель ожидаемой степени Чанга-Лу: вероятность соединения пары (u, a) определяется как kout(u)kin(a)/M, где M — общее число взаимодействий. Нулевая гипотеза учитывает временные метки взаимодействий. Сравниваемая величина — доля взаимодействий в пределах двух «прыжков» (граф связей), исключая ретрансляторы. Проверка на трех временных когортах показала стабильность: доля взаимодействий в пределах двух «прыжков» составила 82,0%, 78,8% и 80,3% против ожидаемых 28,2%, 32,5% и 28,0% при размерах выборок 6,20 млн, 1,63 млн и 1,69 млн взаимодействий соответственно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемая доля взаимодействий в пределах двух «прыжков» значительно превышает случайные ожидания (до 82% против ~30%), что подтверждает неслучайный характер формирования связей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metody-klasterizacii\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#metody-klasterizacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы кластеризации&lt;/span&gt;&lt;/a&gt;Методы кластеризации&lt;/h4&gt;\n&lt;p&gt;Кластеризация проводилась методом K-средних (K-means) с выбором K по коэффициенту силуэта (диапазон 2–10). Для проверки устойчивости использовались GMM и метод разделения выборки пополам (ARI). Признаки состава включают темп исследования, логарифмированную широту и интенсивность событий. Признаки траектории основаны на восьминедельных показателях активности пользователей. Для кластеризации по форме тренда векторы нормализовались (z-score), чтобы отразить паттерн изменений, а не абсолютный уровень.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод K-средних группирует данные в K кластеров, минимизируя расстояние до центроидов, а коэффициент силуэта помогает определить оптимальное число групп.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Кластеризация состава (K=4) показала пик силуэта 0,376 и высокую воспроизводимость (ARI 0,984). Кластеризация формы тренда (K=3) выбрана как более устойчивая между алгоритмами (ARI 0,509), несмотря на то, что K=2 формально лучше по силуэту.&lt;/p&gt;\n&lt;h4 id=\"specifikaciya-modeli-konversii\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#specifikaciya-modeli-konversii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Спецификация модели конверсии&lt;/span&gt;&lt;/a&gt;Спецификация модели конверсии&lt;/h4&gt;\n&lt;p&gt;Использовалась логистическая модель для оценки 30-дневной конверсии (подписки на автора). Ковариаты вычислялись до момента первого контакта (t₀), чтобы исключить утечку данных. Модель включает тип первого события, дистанцию (локальная или дальняя) и семь пользовательских характеристик (объем взаимодействий, степени входа/выхода, стаж, темп исследования, концентрация внимания, локальная доля). Непрерывные переменные трансформировались через &lt;span class=\"yfm-latex\" data-content=\"%5Clog(1%2Bx)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и стандартизировались.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель учитывает кластеризацию по пользователям, но не учитывает авторов, на которых подписываются разные пользователи, что может влиять на точность оценок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"chuvstvitelnost\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#chuvstvitelnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чувствительность&lt;/span&gt;&lt;/a&gt;Чувствительность&lt;/h4&gt;\n&lt;p&gt;Авторы проверили гипотезу о том, что эффект дистанции является артефактом. Включение характеристик автора (степени, объем) изменило отношение шансов с 0,351 до 0,289, подтверждая, что структурная близость не сводится к свойствам автора. Повторный анализ на 15 подмножествах показал стабильность отношения шансов (0,331–0,380). Анализ последовательности событий после t₀ показал, что локальная доля (1,682) не объясняет весь эффект конверсии, указывая на то, что локальные и дальние связи развиваются по разным траекториям.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"sbor-dannyh\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#sbor-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сбор данных&lt;/span&gt;&lt;/a&gt;Сбор данных&lt;/h4&gt;\n&lt;p&gt;Данные для исследования были получены через API платформы Bluesky. Информация о пользователях хранится на серверах &lt;a href=\"concepts/personal-data-server.html\"&gt;PDS&lt;/a&gt; (Personal Data Servers), которые содержат полную историю активности. Из исходной выборки, включающей около 5 миллионов пользователей, были извлечены все доступные записи активности по состоянию на январь 2025 года. В набор данных вошли подписки, отметки «нравится», публикации, репосты и блокировки. Для обеспечения вычислительной эффективности анализ был ограничен первыми 8 месяцами работы платформы: с февраля по сентябрь 2023 года.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PDS (Personal Data Server) — это децентрализованный сервер, хранящий персональные данные пользователя, доступ к которым осуществляется через открытый протокол.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vnimanie-i-dlina-puti\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#vnimanie-i-dlina-puti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внимание и длина пути&lt;/span&gt;&lt;/a&gt;Внимание и длина пути&lt;/h4&gt;\n&lt;p&gt;Внимание операционализируется как наблюдаемое взаимодействие. Основной единицей анализа является пара «пользователь — автор» (du,a), где учитываются четыре типа действий: лайки, репосты, ответы и цитирования. Взаимодействие рассматривается как достаточное доказательство внимания, однако его отсутствие не означает отсутствия внимания, так как просмотр контента без реакции не оставляет следов в данных. Таким образом, все показатели являются нижней границей реального уровня внимания.&lt;/p&gt;\n&lt;p&gt;Взаимодействия классифицируются по четырем уровням: внутрисетевые (пользователь уже подписан на автора или является им) и внесетевые. Внесетевые взаимодействия делятся на опосредованные ретрансляцией (если контент был репостнут или процитирован аккаунтом, на который подписан пользователь) и исследовательские. Исследовательские взаимодействия, в свою очередь, подразделяются на «двухшаговые локальные» (существует путь подписки u → i → a) и «дистантные».&lt;/p&gt;\n&lt;h4 id=\"klasterizaciya\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#klasterizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Кластеризация&lt;/span&gt;&lt;/a&gt;Кластеризация&lt;/h4&gt;\n&lt;p&gt;Исследовательское поведение пользователей анализируется с помощью двух методов кластеризации. Первый метод группирует пользователей по составу их исследовательской активности (частота, широта охвата, повторные контакты), что позволяет определить тип «исследователя». Второй метод кластеризует траектории интенсивности исследований за восьминедельный период (с использованием z-оценки для нормализации), чтобы выявить, является ли поведение растущим, убывающим или временным на ранних этапах использования платформы.&lt;/p&gt;\n&lt;h4 id=\"analiz-konversii\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#analiz-konversii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ конверсии&lt;/span&gt;&lt;/a&gt;Анализ конверсии&lt;/h4&gt;\n&lt;p&gt;Первая подписка пользователя на автора после момента t₀ рассматривается как целевой результат. Описывается доля пар, совершивших конверсию в течение 7, 15 и 30 дней, с разбивкой по типу первого контакта (локальный или дистантный). Также применяются логистические регрессии на уровне пар для оценки 30-дневной конверсии с учетом характеристик пользователей, что позволяет выявить ассоциацию между типом контакта и конверсией, не утверждая при этом наличие прямой причинно-следственной связи.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f1.jpg\" alt=\"Рис. 1. Вверху: проанализированные взаимодействия, декомпозированные по длине пути внимания (107,8 млн отслеживаемых, 21\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1. Вверху: проанализированные взаимодействия, декомпозированные по длине пути внимания (107,8 млн отслеживаемых, 21,2 млн ретранслируемых, 31,7 млн локальных в два перехода, 12,5 млн удаленных). Внизу: доля взаимодействий в пределах двух переходов отслеживания (т. е. уровни отслеживаемых и локальных в два перехода, исключая ретрансляцию) по сравнению с ожидаемой нулевой степенью.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f2.jpg\" alt=\"Рис. 2. Кластеры состава (K=4): распределение признаков по кластерам (уровень исследования, широта, частота повторений) \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2. Кластеры состава (K=4): распределение признаков по кластерам (уровень исследования, широта, частота повторений) и доля пользователей в каждом кластере по сравнению с долей исследованных событий. Порядок кластеров одинаков на всех панелях.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky-f3.jpg\" alt=\"Рис. 3. Кластеры еженедельной траектории уровня исследования (K=3): средняя траектория по кластерам за первые восемь нед\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3. Кластеры еженедельной траектории уровня исследования (K=3): средняя траектория по кластерам за первые восемь недель пребывания, доля пользователей указана в скобках.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Как далеко&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;уходит&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;внимание за&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пределы&lt;/text&gt;&lt;text x=\"26\" y=\"162\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;подписок&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Анализ 173 млн&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;взаимодействий&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;на Bluesky&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;80% внимания&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ограничено&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;двумя шагами&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сети&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Социальная&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;структура&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;важнее&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;алгоритмов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-not
