        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"192\" cy=\"150\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"508\" cy=\"230\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SYNTHETIC   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Судья в машине: почему&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейросети выбирают не лучшие&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;изображения, а первые&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;попавшиеся&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f1.jpg\" alt=\"Рисунок 1: Один и тот же запрос, одни и те же изображения, три порядка представления.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Один и тот же запрос, одни и те же изображения, три порядка представления.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Один и тот же запрос, одни и те же изображения, три порядка представления. В каждом ряду показаны три кандидата в одном порядке представления со средними оценками соответствия запросу от людей. Qwen3-VL-4B каждый раз выбирает изображение в позиции A (выделено рамкой), поэтому его выбранное изображение получает оценку 0,00, 0,50 или 0,83 в зависимости только от порядка. Изображения: CulturalFrames (Nayak et al. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Исследование показывает, что &lt;a href=\"concepts/vision-language-models.html\"&gt;мультимодальные модели&lt;/a&gt; (VLM) при выборе изображений из набора часто полагаются на порядок их расположения, а не на реальное качество. Даже продвинутые модели с 4 миллиардами параметров проигрывают случайному выбору, если изображения перетасовать. Авторы предлагают метод аудита таких «судей» через проверку согласованности решений при смене порядка кандидатов.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Модели с 4B параметров выбирают первое изображение в 49% случаев, что значительно выше случайного распределения в 28%.&lt;/li&gt;\n&lt;li&gt;Изменение порядка кандидатов меняет выбор модели в 60% случаев, подтверждая наличие сильной позиционной предвзятости.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rejectors.html\"&gt;Фильтры&lt;/a&gt; согласованности (agreement gates) работают по-разному: они помогают слабым моделям, но вредят точности сильных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metody-i-tochnost\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#metody-i-tochnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и точность&lt;/span&gt;&lt;/a&gt;Методы и точность&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Метод&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Данные&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Точность&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Где ошибается&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;VLM-судья (4B параметров)&lt;/td&gt;\n&lt;td&gt;300 культурных промптов&lt;/td&gt;\n&lt;td&gt;Выбор первого слота в 49% случаев&lt;/td&gt;\n&lt;td&gt;Сильная позиционная предвзятость&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;VLM-судья (8B параметров)&lt;/td&gt;\n&lt;td&gt;300 культурных промптов&lt;/td&gt;\n&lt;td&gt;Минимальная позиционная предвзятость&lt;/td&gt;\n&lt;td&gt;Фильтры согласованности отсеивают хорошие решения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В работе проанализирована способность VLM-моделей (например, Qwen3-VL-4B) выступать в роли «судей», выбирающих лучшее изображение из предложенного пула. Исследователи использовали 300 культурно-ориентированных промптов из датасета CulturalFrames, где для каждого запроса было доступно от 3 до 4 сгенерированных изображений. Каждое решение модели сравнивалось с человеческими оценками, которые не были доступны самому алгоритму. Основной метрикой стало «&lt;a href=\"concepts/selection-regret.html\"&gt;сожаление при выборе&lt;/a&gt;» (selection &lt;a href=\"concepts/regret.html\"&gt;regret&lt;/a&gt;) — разница между рейтингом лучшего доступного изображения и тем, что выбрала модель.&lt;/p&gt;\n&lt;p&gt;Результаты показали, что 4B-модель выбирает первое изображение в 49% случаев, при этом изменение порядка кандидатов меняет выбор в 60% ситуаций. Согласованность решений при смене порядка (&lt;a href=\"concepts/agreement-gate.html\"&gt;agreement gate&lt;/a&gt;) оказалась полезной только для слабых моделей: если модель выбирает одно и то же изображение в разных позициях, это повышает качество результата. Однако для более мощных 8B-моделей такой фильтр часто отсеивает удачные варианты, что указывает на необходимость индивидуального аудита для каждой архитектуры.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено 300 промптами и не учитывает влияние инструкций на процесс принятия решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Мультимодальные модели (VLM) всё чаще выступают в роли «судей», выбирающих лучшие изображения из предложенных вариантов. Обычно их качество оценивают по корреляции с оценками людей, однако это не учитывает реальное влияние модели на итоговый выбор. В данном исследовании авторы проанализировали работу VLM как полноценных субъектов принятия решений. Для этого использовали 300 культурно-специфичных запросов, сравнивая выбор модели с независимыми оценками людей и случайным выбором. Чтобы проверить устойчивость решений, авторы повторяли каждый запрос, меняя порядок кандидатов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VLM (Vision-Language Models) — нейросети, способные анализировать изображения и текст одновременно, что позволяет им оценивать визуальный контент по текстовому описанию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты показали, что модель с 4 миллиардами параметров (4B) едва превосходит случайный выбор и уступает базовой метрике CLIP. В 49% случаев модель выбирала первое изображение в списке (при вероятности случайного выбора 28%), а изменение порядка кандидатов приводило к смене решения в 60% случаев. Для этой модели согласованность решений при смене порядка оказалась важным индикатором: ответы, которые оставались неизменными при перестановке, были значительно качественнее случайных. Однако попытка фильтрации через «согласие» со вторым, более слабым судьей, приводила к сохранению ошибочных решений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель 4B демонстрирует сильную предвзятость к позиции (выбор первого варианта в 49% случаев) и высокую нестабильность при изменении порядка кандидатов (60% смен решений).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель с 8 миллиардами параметров (8B) практически не проявила позиционной предвзятости и показала лучшие результаты, чем CLIP. Тем не менее, для неё &lt;a href=\"concepts/filtratsiya.html\"&gt;фильтрация&lt;/a&gt; по принципу «согласия» оказалась неэффективной, отсеивая даже качественные решения. Авторы отмечают, что согласованность помогает только тогда, когда она направлена на устранение специфических ошибок конкретной модели, поэтому методы фильтрации требуют пересмотра при каждой смене версии судьи. Также было установлено, что небольшое повышение стереотипности оценок у модели 4B исчезает при усреднении результатов по разным порядкам или при использовании более крупной модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено 300 культурно-специфичными промптами; результаты для моделей 4B и 8B не следует экстраполировать на все архитектуры VLM без дополнительной проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Мультимодальные модели (VLM), выбирающие одно изображение из нескольких сгенерированных вариантов, выполняют более сложную задачу, чем просто оценка качества. Их выбор определяет, какой контент увидит пользователь. Ключевой вопрос заключается в том, улучшает ли этот выбор итоговый результат, а не просто коррелирует ли оценка модели с человеческими предпочтениями. В контексте культурно-специфичных запросов визуальная привлекательность или узнаваемые символы могут быть плохими индикаторами удовлетворенности пользователя. Изображение может содержать требуемый объект, но искажать социальный контекст, и модель-селектор может отдать ему предпочтение, игнорируя более подходящие варианты. Для оценки этого процесса требуются рейтинги, полученные независимо от самой модели. Мы используем открытый &lt;a href=\"concepts/dataset.html\"&gt;набор данных&lt;/a&gt; CulturalFrames, содержащий сгенерированные изображения и оценки людей, учитывающие пропущенные явные и неявные ожидания, а также стереотипы. В нашем исследовании VLM с открытыми весами выбирает одно из 3–4 изображений (Рис. 3) без доступа к метаданным генератора или рейтингам. Мы сравниваем выбор модели со случайным выбором и с лучшим кандидатом из того же набора, чтобы изолировать эффект процесса выбора от процесса генерации. Основной показатель — «сожаление при выборе» (selection regret), определяемое как разница в среднем рейтинге соответствия запросу.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f3.jpg\" alt=\"Рисунок 3: Протокол аудита.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Протокол аудита.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Протокол аудита. (a) Зафиксированные пулы кандидатов из CulturalFrames: культурно-обусловленные запросы с тремя или четырьмя изображениями от четырех генераторов. (b) Выбор: каждый судья видит только запрос и изображения в трех циклических порядках; шлюзы согласия (agreement gates) решают, действовать или воздержаться. (c) Ретроспективный &lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt;: опубликованные оценки людей, которые никогда не показывались судье, объединяются с идентификатором изображения после выбора и сравниваются с точным случайным выбором по тем же пулам.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование измеряет «сожаление при выборе» — разницу между качеством изображения, выбранного моделью, и лучшим доступным вариантом в пуле.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы&lt;/span&gt;&lt;/a&gt;Связанные работы&lt;/h4&gt;\n&lt;p&gt;Существующие подходы к культурной репрезентации, такие как CulturalFrames, фокусируются на сравнении автоматических метрик с оценками людей для отдельных изображений. Мы же анализируем процесс выбора внутри набора кандидатов. Другие работы исследуют обучение моделей вознаграждения на предпочтениях, однако мы не предлагаем новую модель вознаграждения, а проводим аудит уже существующих «замороженных» селекторов. В области оценки VLM показано, что мультимодальные судьи могут отдавать предпочтение информативным ответам, игнорируя визуальные доказательства, или демонстрировать предвзятость к порядку предъявления вариантов (&lt;a href=\"concepts/position-bias.html\"&gt;position bias&lt;/a&gt;). Подобные эффекты наблюдаются, когда инструкции переформулируются или когда модель оценивает соответствие изображения тексту. Мы изучаем эти явления в сценарии, где выход модели является действием (выбором изображения), и исследуем взаимодействие этого выбора с механизмами отказа от принятия решения на основе согласия моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Position bias (предвзятость позиции) — склонность модели отдавать предпочтение варианту в зависимости от его порядкового номера в списке, а не от его содержания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели-селекторы в данном эксперименте «заморожены» (не обучаются в процессе), что ограничивает возможность исправления их предвзятости через обратную связь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"problema-i-pokazateli\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#problema-i-pokazateli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проблема и показатели&lt;/span&gt;&lt;/a&gt;Проблема и показатели&lt;/h4&gt;\n&lt;p&gt;Задача выбора состоит в следующем: для заданного промпта p имеется набор из m_p (3 или 4) заранее сгенерированных изображений. Политика выбора π получает на вход промпт и изображения, представленные в определенном порядке с метками, и возвращает индекс выбранного изображения или воздерживается от выбора. Утилита каждого кандидата h_p определяется как среднее значение оценок нескольких аннотаторов (0, 0,5 или 1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основной показатель — «сожаление» (regret), разница между максимально возможной оценкой и оценкой выбранного изображения; нулевое значение означает выбор лучшего кандидата.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки эффективности используются три метрики: сожаление &lt;span class=\"yfm-latex\" data-content=\"R_p(%5Cpi)%20%3D%20h%5E%5Cstar_p%20-%20h_%7Bp%2C%5Cpi(p)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, выигрыш относительно случайного выбора &lt;span class=\"yfm-latex\" data-content=\"G_p(%5Cpi)%20%3D%20h_%7Bp%2C%5Cpi(p)%7D%20-%20%5Cbar%7Bh%7D_p\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и вероятность выбора изображения ниже среднего (BMR). Случайный выбор служит базовой линией. Также отслеживаются показатели культурных ошибок (стереотипы, отсутствие ожиданий), где отрицательные значения указывают на меньшее количество ошибок по сравнению со случайным выбором.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/pozitsionnoe-smeschenie.html\"&gt;Позиционное смещение&lt;/a&gt; — это предпочтение определенных слотов (например, A, B, C) независимо от содержания изображения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки устойчивости используется K=3 циклических порядка отображения. «&lt;a href=\"concepts/gate.html\"&gt;Ворота»&lt;/a&gt; (gates) фильтруют решения: например, при пороге τ=2/3 выбирается только тот вариант, который был выбран в двух из трех порядков. Мы оцениваем покрытие (долю обработанных промптов) и сравниваем результаты с «нефильтрованным» судьей.&lt;/p&gt;\n&lt;h4 id=\"nabor-dannyh-i-razdelenie\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#nabor-dannyh-i-razdelenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Набор данных и разделение&lt;/span&gt;&lt;/a&gt;Набор данных и разделение&lt;/h4&gt;\n&lt;p&gt;Работа базируется на датасете CulturalFrames, содержащем 3637 строк изображений и 10 412 индивидуальных оценок. После фильтрации (удаление записей без аннотаций и дубликатов) осталось 961 уникальный промпт: 313 наборов из трех изображений и 648 из четырех.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Разделение на выборки (split) основано на детерминированном хешировании идентификаторов промптов, что исключает утечку данных из оценок аннотаторов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для основного анализа сформирована выборка из 300 промптов (по 30 на каждую из 10 стран), что обеспечивает сбалансированную оценку, не отражающую реальное распределение запросов в продакшене. Пропущенные аннотации не восстанавливались.&lt;/p&gt;\n&lt;h4 id=\"sudi-s-otkrytymi-vesami\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#sudi-s-otkrytymi-vesami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Судьи с открытыми весами&lt;/span&gt;&lt;/a&gt;Судьи с открытыми весами&lt;/h4&gt;\n&lt;p&gt;Основным судьей выступает модель Qwen3-VL-4B-Instruct, вторичным — SmolVLM2-2.2B-Instruct. Для обеспечения воспроизводимости сохраняются версии зависимостей, настройки инференса и ревизии моделей. Вычисления проводятся локально с использованием жадной декодировки (&lt;a href=\"concepts/greedy-decoding.html\"&gt;greedy decoding&lt;/a&gt;), ограничением вывода в 64 токена и без запроса пояснений. Изображения для Qwen масштабируются в рамку 448 пикселей с сохранением пропорций, тогда как Smol использует нативное разрешение 384 пикселя без тайлинга для контроля потребления памяти. Различия в визуальном бюджете токенов означают, что расхождения в оценках между моделями нельзя объяснять только их архитектурными способностями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование двух разных моделей-судей с отличающимися параметрами обработки изображений ограничивает возможность прямого сравнения их надежности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Запрос включает изображение и метки кандидатов. Инструкция требует оценивать соответствие промпту, контекстуальную согласованность, отсутствие стереотипов и визуальную целостность. Моделям запрещено отдавать предпочтение символам только из-за их количества или узнаваемости. Метаданные о происхождении моделей, категории и человеческие аннотации в запрос не включаются. Qwen выводит JSON с выбором и ранжированием, в то время как Smol, из-за ограничений в надежности формата, выводит только выбор. Валидность JSON и точность извлечения решений отслеживаются раздельно.&lt;/p&gt;\n&lt;h4 id=\"poryadok-kandidatov-i-nevalidnye-vyvody\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#poryadok-kandidatov-i-nevalidnye-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Порядок кандидатов и невалидные выводы&lt;/span&gt;&lt;/a&gt;Порядок кандидатов и невалидные выводы&lt;/h4&gt;\n&lt;p&gt;Для каждого промпта используются три циклических представления: канонический порядок и два детерминированных поворота. Это позволяет оценить влияние порядка на результат, исключая случайные вариации декодировки. Основным считается решение в каноническом порядке. При сбое парсинга фиксируется воздержание (abstention), повторные попытки ограничены одной итерацией. Невалидные выводы не удаляются из выборки, а показатели полезности (utility) и сожаления (regret) рассчитываются с учетом покрытия (coverage) относительно исходного набора данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/determinirovannye-povoroty.html\"&gt;Детерминированные повороты&lt;/a&gt; — это метод смены последовательности элементов в списке, позволяющий проверить, не «предпочитает» ли модель первый предложенный вариант.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vybor-s-vozderzhaniem\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#vybor-s-vozderzhaniem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор с воздержанием&lt;/span&gt;&lt;/a&gt;Выбор с воздержанием&lt;/h4&gt;\n&lt;p&gt;Пороговые значения для фильтрации (gate thresholds) $ au \\in {1/3, 2/3, 1}$ и правила взаимодействия моделей были определены до начала инференса. Фильтрация срабатывает только при успешном парсинге всех трех представлений. В случае ничьей приоритет отдается каноническому порядку. Воздержание не предполагает автоматического «безопасного» исхода, поэтому для каждой оценки указывается уровень покрытия.&lt;/p&gt;\n&lt;h4 id=\"statisticheskij-analiz\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#statisticheskij-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистический анализ&lt;/span&gt;&lt;/a&gt;Статистический анализ&lt;/h4&gt;\n&lt;p&gt;Единицей анализа является промпт с набором кандидатов. Доверительные интервалы (95%) для средних значений и парных различий рассчитываются методом бутстрепа (10 000 итераций, seed 20261002). Для оценки политики BMR используются интервалы Вильсона. Анализ влияния позиции, отклоненных фильтром промптов и дополнительные исследования (секции 5.5 и 5.6) классифицируются как эксплораторные, так как были добавлены после завершения основного инференса.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"poziciya-predstavleniya\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#poziciya-predstavleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Позиция представления&lt;/span&gt;&lt;/a&gt;Позиция представления&lt;/h4&gt;\n&lt;p&gt;Обе основные модели-судьи демонстрируют выраженное предпочтение начальным позициям (Рис. 4c). Модель Qwen выбирает слот A в 48,8% из 900 вызовов, что значительно выше случайного распределения (27,8%; χ²=219, p&amp;lt;10⁻¹⁰). Модель Smol выбирает слоты A или B в 93,3% случаев. В 59,7% случаев выбор Qwen меняется в зависимости от порядка представления изображений. В крайних случаях судья просто выбирает первое изображение, однако анализ показывает, что модель всё же реагирует на содержание. При усреднении по трём ротациям (чтобы нивелировать влияние позиции) Qwen выбирает изображения с наиболее высоким человеческим рейтингом в 57,9% случаев (против 27,8% при случайном выборе).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели-судьи склонны выбирать изображения, стоящие в начале списка, что искажает оценку, хотя они сохраняют &lt;a href=\"concepts/sensitivity.html\"&gt;чувствительность&lt;/a&gt; к содержанию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kakie-soglasheniya-shlyuzy-prinimayut,-a-kakie-otklonyayut\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#kakie-soglasheniya-shlyuzy-prinimayut,-a-kakie-otklonyayut\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Какие соглашения шлюзы принимают, а какие отклоняют&lt;/span&gt;&lt;/a&gt;Какие соглашения шлюзы принимают, а какие отклоняют&lt;/h4&gt;\n&lt;p&gt;Использование «фильтров согласия» позволяет отсеивать неоднозначные запросы. Если требовать единогласия судьи во всех трёх ротациях (40,3% запросов), прирост качества выбора Qwen над случайным составляет 0,141 [0,110, 0,173]. На отклонённых запросах (179 случаев) результат падает до −0,030 [−0,057, −0,002]. Фильтр «два из трёх» является промежуточным вариантом, сохраняя 80,7% запросов с приростом 0,094 [0,071, 0,118]. При этом согласие между двумя разными моделями (Qwen и Smol) работает хуже: оно часто отбирает запросы, где модели сошлись по не связанным с контентом причинам (например, из-за общего предпочтения позиции).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фильтр согласия (gate) — это метод отбора ответов, при котором учитываются только те результаты, где модель-судья выдает одинаковый ответ при разных условиях (например, при смене порядка изображений).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sravnenie-s-bazovoj-modelyu-clip\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#sravnenie-s-bazovoj-modelyu-clip\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение с базовой моделью CLIP&lt;/span&gt;&lt;/a&gt;Сравнение с базовой моделью CLIP&lt;/h4&gt;\n&lt;p&gt;Сравнение с CLIP (ViT-L/14) показывает, что этот метод, не зависящий от порядка, достигает прироста 0,069 [0,047, 0,090], что несколько выше, чем у Qwen (0,039). Однако CLIP также увеличивает рейтинг стереотипных изображений на 0,026 [0,006, 0,046], аналогично Qwen. Использование меньшей архитектуры ViT-B/32 для CLIP дает схожий прирост (0,063), но не приводит к росту стереотипности, что указывает на зависимость эффекта от архитектуры модели. Исследование подтверждает, что даже специализированные скореры не избавлены от проблем с предвзятостью.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сравнение с CLIP является разведочным (exploratory) и не учитывает все возможные факторы влияния на выбор модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Результаты выбора по 300 основным запросам&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Показатель&lt;/th&gt;\n&lt;th&gt;Oracle&lt;/th&gt;\n&lt;th&gt;Qwen&lt;/th&gt;\n&lt;th&gt;Smol&lt;/th&gt;\n&lt;th&gt;Random&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Mean regret&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;0.160&lt;/td&gt;\n&lt;td&gt;0.270&lt;/td&gt;\n&lt;td&gt;0.199&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;95% доверительные интервалы (bootstrap). Cov.: доля запросов, на которых работает политика. Align.: средний рейтинг соответствия запросу. Gain over random: выигрыш по сравнению со случайным выбором. BMR: доля изображений с рейтингом ниже среднего по пулу. Best: доля изображений с наилучшим рейтингом. Worst: наибольшее среднее сожаление по группе стран.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"yavlyaetsya-li-pozicionnoe-smeshenie-artefaktom\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#yavlyaetsya-li-pozicionnoe-smeshenie-artefaktom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Является ли позиционное смещение артефактом?&lt;/span&gt;&lt;/a&gt;Является ли позиционное смещение артефактом?&lt;/h4&gt;\n&lt;p&gt;Исследователи проверили, не вызвано ли предпочтение первого варианта в интерфейсе особенностями формата вывода. Было проведено три теста с моделью Qwen на 300 промптах. При смене формата ответа с ранжирования на выбор одного варианта модель выбирала первый слот в 44,8% случаев (при равномерном распределении 27,8%). При замене меток A/B/C/D на нейтральные коды частота выбора первого изображения составила 51,8%. Полная ротация четырех изображений также подтвердила смещение: первый слот выбирался в 52,5% случаев, тогда как остальные — значительно реже (от 12,8% до 20,4%). Во всех вариантах предпочтение первого слота сохраняется, что указывает на внутреннюю особенность модели, а не на влияние меток или формата.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Позиционное смещение является устойчивой характеристикой модели Qwen, а не артефактом интерфейса или меток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ustranyaet-li-masshtabirovanie-smeshenie\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#ustranyaet-li-masshtabirovanie-smeshenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устраняет ли масштабирование смещение?&lt;/span&gt;&lt;/a&gt;Устраняет ли масштабирование смещение?&lt;/h4&gt;\n&lt;p&gt;Для проверки влияния размера модели был протестирован Qwen3-VL-8B-Instruct. Контрольный запуск 4B-модели с 8-битной квантованием показал результаты, идентичные основному тесту (48,2% выбора первого слота). У модели 8B смещение практически исчезло: первый слот выбирался в 27,3% случаев, что близко к равномерному распределению (p = 0,06). Модель 8B показала более высокий прирост качества (0,097) по сравнению с CLIP (0,069). Однако при смене модели механизм «единогласия» (unanimity gate) требует пересмотра, так как он начинает отбрасывать качественные решения, которые модель 8B принимает лучше, чем 4B.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Увеличение размера модели до 8B снижает позиционное смещение до уровня случайного выбора и повышает общую точность оценки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rezultaty-kulturnyh-oshibok\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#rezultaty-kulturnyh-oshibok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты культурных ошибок&lt;/span&gt;&lt;/a&gt;Результаты культурных ошибок&lt;/h4&gt;\n&lt;p&gt;Qwen снижает количество пропущенных явных ожиданий на 0,056 и неявных — на 0,034. Однако рейтинг стереотипности вырос с 0,125 до 0,148. Этот рост в основном связан с предпочтением изображений от генератора SD-3.5-Large, которые имеют более высокие показатели стереотипности. При агрегации ответов по трем порядкам или при использовании «единогласия» статистически значимый рост стереотипности исчезает, при этом способность модели снижать количество ошибок в ожиданиях сохраняется.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Рост стереотипности является исследовательским результатом, так как после поправки Бонферрони доверительный интервал включает ноль.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gruppy-stran\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#gruppy-stran\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Группы стран&lt;/span&gt;&lt;/a&gt;Группы стран&lt;/h4&gt;\n&lt;p&gt;Оценка прироста качества Qwen положительна в 7 из 10 групп стран. Наибольшее значение regret (сожаления) зафиксировано в Японии (0,275), где случайный выбор также показывает высокий уровень regret (0,266). Из-за малого размера выборки (30 промптов на группу) данные интервалы широки и перекрываются, поэтому текущий анализ не позволяет ранжировать группы по культурным предпочтениям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Regret (сожаление) — метрика, показывающая разницу между качеством выбранного моделью варианта и максимально возможным качеством в данном наборе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;p&gt;Оценка действий важнее оценки баллов. Судья, который ранжирует изображения правдоподобно, может выбрать неудачный вариант при необходимости действия. Сравнение выбранного изображения с лучшим доступным и случайным выбором из того же набора делает ценность решения наглядной и выявляет ошибки, скрытые за корреляцией оценок, например, сильную зависимость от позиции изображения.&lt;/p&gt;\n&lt;p&gt;Шлюзы согласия требуют собственного аудита. Согласие полезно лишь тогда, когда оно преодолевает ошибки судьи. Оно может закреплять стабильные ошибки, поэтому любое снижение сожаления (regret) должно сравниваться со случайным выбором для принятых промптов и с выбором судьи для отклоненных. Позиционное смещение объясняет расхождение двух изученных шлюзов. Единогласие при ротациях требует одного и того же изображения из разных слотов, отсеивая позиционно-зависимые выборы; два судьи с похожими предпочтениями слотов могут согласиться по причинам, не связанным с контентом. Усреднение порядка путем голосования по ротациям восстанавливает часть потерянной ценности без отказа от выбора. Отказ от выбора оставляет практический вопрос: кто обрабатывает отклоненный запрос, какой ценой и с каким результатом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Единогласие при ротациях эффективно отсеивает позиционные ошибки, однако требует аудита, так как согласие может маскировать систематические ошибки модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obuyasnyaetsya-li-rezultat-edinoglasiya-prostymi-promptami\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#obuyasnyaetsya-li-rezultat-edinoglasiya-prostymi-promptami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объясняется ли результат единогласия простыми промптами?&lt;/span&gt;&lt;/a&gt;Объясняется ли результат единогласия простыми промптами?&lt;/h4&gt;\n&lt;p&gt;Нет. Кандидаты в промптах, которые оставляет единогласие, сильнее различаются по рейтингу, чем в отклоненных, поэтому оставленные пулы оставляют больше пространства для ошибки, а не меньше. Выигрыш судьи на них велик, тогда как на отклоненных промптах он ниже нуля.&lt;/p&gt;\n&lt;h4 id=\"chto-menyaetsya-s-masshtabom\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#chto-menyaetsya-s-masshtabom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что меняется с масштабом?&lt;/span&gt;&lt;/a&gt;Что меняется с масштабом?&lt;/h4&gt;\n&lt;p&gt;Расширение до 8B показывает, что специфическая ошибка не универсальна: позиционное смещение почти исчезает, а вместе с ним и способность шлюза отсеивать решения хуже случайных, хотя чувствительность к порядку сохраняется. Сам аудит остается неизменным и именно он выявляет разницу. Практический урок: фильтр, валидированный для одного судьи, не подходит для другого. Проверки порядка относительно дешевы: на нашем оборудовании одно решение Qwen занимает медианные 3,5 с, а три порядка — 10,6 с (примерно в 3 раза дороже), что дает либо выигрыш от голосования, либо фильтр единогласия. Добавление четвертого порядка снижает покрытие без дальнейшего снижения сожаления (единогласие по четырем порядкам сохраняет 27,5% пулов из четырех изображений при сожалении 0,095, Рис. S14). Чувствительность к порядку слабо связана с близостью кандидатов: выбор Qwen меняется в 62,8% промптов в нижней трети диапазона рейтингов и в 53,6% в верхней (Таблица S17), значит, смещение не ограничено случаями, близкими к ничьей. Ошибки согласования и культурные ошибки — разные цели. И VLM-судья, и CLIP-базис снижают количество упущенных культурных ожиданий, но рейтинги стереотипов меняются по-разному: судья слегка повышает их, как и один из бэкендов CLIP, но не другой. Агрегация решений судьи по порядкам не оставляет обнаружимого роста. Селектор, настроенный на согласование промптов, должен аудироваться отдельно по результатам стереотипов, так как композитные оценки скрывают этот компромисс.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Позиционное смещение — склонность модели отдавать предпочтение объекту в зависимости от его места в списке (например, всегда выбирать первый вариант).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya-i-eticheskie-aspekty\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#ogranicheniya-i-eticheskie-aspekty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и этические аспекты&lt;/span&gt;&lt;/a&gt;Ограничения и этические аспекты&lt;/h4&gt;\n&lt;p&gt;Исследование CulturalFrames охватывает ограниченный набор стран, тематических доменов, промптов и генераторов изображений. Использование страновых меток упрощает значительное внутреннее разнообразие культур. Поскольку набор изображений-кандидатов ограничен конкретными генераторами, результаты зависят от их визуальных стилей, даже если названия моделей скрыты. Разрешение входных данных может скрывать мелкие детали, что является частью конфигурации системы. Человеческая оценка субъективна: разногласия между аннотаторами и шум в данных создают неопределенность, поэтому «оракул» (система оценки) следует интерпретировать с осторожностью. Доверительные интервалы отражают средние значения оценок, а не общую неопределенность всех возможных человеческих суждений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено малым набором генераторов и стран, а результаты зависят от субъективности аннотаторов и специфики моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использованные модели (4B и 2.2B параметров) показывают выраженное позиционное смещение, которое может уменьшаться при увеличении масштаба модели, что не было проверено для более крупных систем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Моделирование выбора изображения не измеряет реальный вред пользователю или процесс последовательного редактирования. Основные оценочные модели имеют небольшой размер (4 млрд и 2,2 млрд параметров). Дополнительный тест с моделью 8 млрд параметров показал, что позиционное смещение сокращается с ростом масштаба. Из-за малого количества промптов (30 на страну) статистическая мощность недостаточна для выявления умеренных различий между группами. Анализы позиционного смещения и масштабирования являются разведочными. Исследование является вторичным анализом публичного бенчмарка без сбора персональных данных. Авторы использовали ИИ-ассистентов (OpenAI Codex, Anthropic Claude) для написания кода и текста, однако все эмпирические результаты получены на основе выпущенных аннотаций и записей работы моделей. Авторы несут полную ответственность за верификацию данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Позиционное смещение — это склонность модели отдавать предпочтение результату, находящемуся на определенной позиции в списке, независимо от его содержания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Выбор Qwen в пулах с различиями в рейтингах ошибок&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Категория&lt;/th&gt;\n&lt;th&gt;Покрытие&lt;/th&gt;\n&lt;th&gt;Random (matched)&lt;/th&gt;\n&lt;th&gt;Qwen, order gate&lt;/th&gt;\n&lt;th&gt;Qwen, cross-model gate&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Majority&lt;/td&gt;\n&lt;td&gt;100%, n=300&lt;/td&gt;\n&lt;td&gt;0.25&lt;/td&gt;\n&lt;td&gt;0.22&lt;/td&gt;\n&lt;td&gt;0.20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;≥2/3&lt;/td&gt;\n&lt;td&gt;81%, n=242&lt;/td&gt;\n&lt;td&gt;0.21&lt;/td&gt;\n&lt;td&gt;0.19&lt;/td&gt;\n&lt;td&gt;0.13&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3/3&lt;/td&gt;\n&lt;td&gt;40%, n=121&lt;/td&gt;\n&lt;td&gt;0.11&lt;/td&gt;\n&lt;td&gt;0.07&lt;/td&gt;\n&lt;td&gt;0.07&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Selected и Random — средние показатели ошибок; разница парная (95% ДИ). Условия перекрываются.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Основное разделение по странам&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Страна&lt;/th&gt;\n&lt;th&gt;Random&lt;/th&gt;\n&lt;th&gt;Qwen&lt;/th&gt;\n&lt;th&gt;Smol&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Japan&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Iran&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Poland&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Canada&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;South Africa&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;China&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Chile&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Brazil&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;India&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Germany&lt;/td&gt;\n&lt;td&gt;0.2&lt;/td&gt;\n&lt;td&gt;0.1&lt;/td&gt;\n&lt;td&gt;0.3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;По 30 связок запросов на страну. Mean align. и Stereo. — средние рейтинги кандидатов.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"analiz-raboty-vlm-sudi\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#analiz-raboty-vlm-sudi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ работы VLM-судьи&lt;/span&gt;&lt;/a&gt;Анализ работы VLM-судьи&lt;/h4&gt;\n&lt;p&gt;Исследование показало, что модель VLM (Vision-Language Model) с 4 миллиардами параметров, выполняющая роль судьи при выборе изображения, демонстрирует эффективность, лишь незначительно превышающую случайный выбор (0,039). Данный метод уступает по точности системе оценки сходства CLIP и проявляет выраженное позиционное смещение: в 48,8% случаев модель выбирает изображение, указанное в списке первым.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VLM-судья на 4B параметров демонстрирует сильное позиционное смещение, выбирая первое изображение в 48,8% случаев, что делает его работу едва эффективнее случайного выбора.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya-i-masshtabiruemost\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#ogranicheniya-i-masshtabiruemost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и масштабируемость&lt;/span&gt;&lt;/a&gt;Ограничения и масштабируемость&lt;/h4&gt;\n&lt;p&gt;Согласованность решений при изменении порядка следования кандидатов позволяет отличить качественные решения модели от ошибочных. Однако согласованность с более слабой моделью, имеющей аналогичное позиционное смещение, не является индикатором надежности. При переходе к более крупной модели того же семейства (8B параметров) позиционное смещение практически исчезает. При этом механизм фильтрации (gate), основанный на согласовании порядка, для модели 8B зачастую отсеивает верные решения. Это означает, что критерии проверки, валидные для одной модели, не могут быть автоматически перенесены на другую.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Методы аудита и фильтрации, разработанные для одной модели, не являются универсальными и требуют повторной валидации при смене архитектуры или размера VLM.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vyvody-dlya-sistem-vybora\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#vyvody-dlya-sistem-vybora\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выводы для систем выбора&lt;/span&gt;&lt;/a&gt;Выводы для систем выбора&lt;/h4&gt;\n&lt;p&gt;Полезность проверки согласованности ограничена случаями, когда она направлена на конкретный тип ошибок текущей модели. Следовательно, аудит систем выбора, включая фильтры, должен проводиться заново при каждой замене модели-судьи. Данные результаты относятся к сценарию выбора одного изображения из фиксированного набора кандидатов. Полноценная оценка работающей системы выбора также требует анализа поведения пользователей, их последующих действий и результатов в ситуациях, когда модель отказывается от принятия решения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VLM (Vision-Language Model) — нейросеть, способная анализировать изображения и отвечать на вопросы о них на естественном языке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f1.jpg\" alt=\"Рисунок 1: Один и тот же запрос, одни и те же изображения, три порядка представления.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Один и тот же запрос, одни и те же изображения, три порядка представления.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Один и тот же запрос, одни и те же изображения, три порядка представления. В каждом ряду показаны три кандидата в одном порядке представления со средними оценками соответствия запросу от людей. Qwen3-VL-4B каждый раз выбирает изображение в позиции A (выделено рамкой), поэтому его выбранное изображение получает оценку 0,00, 0,50 или 0,83 в зависимости только от порядка. Изображения: CulturalFrames (Nayak et al. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f2.jpg\" alt=\"Рисунок 2: VLM-судьи могут выбирать изображения ниже среднего, когда существует явно лучший кандидат.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: VLM-судьи могут выбирать изображения ниже среднего, когда существует явно лучший кандидат.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: VLM-судьи могут выбирать изображения ниже среднего, когда существует явно лучший кандидат. Каждая группа — это один запрос CulturalFrames (Nayak et al. 2025); числа — средние оценки соответствия запросу от людей. Красный: выбор Qwen3-VL-4B в исходном порядке, ниже среднего значения по пулу. Зеленый: кандидат с наивысшей оценкой. Запросы следуют фиксированному правилу, применяемому без просмотра изображений (Приложение D); они иллюстрируют тип ошибки, а не её частоту (Рисунок 4).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f5.jpg\" alt=\"Рисунок 5: Пост-хок абляции с Qwen.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Пост-хок абляции с Qwen.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: Пост-хок абляции с Qwen. (a) Доля вызовов, выбирающих первое представленное изображение; пунктир отмечает равномерную частоту. (b) Преимущество над случайным выбором по всем запросам и по запросам, где все порядки совпадают (95% доверительные интервалы). No ranking: формат вывода только с выбором. Opaquecodes: двухсимвольные метки вместо букв. 4 orders: четвертая ротация для пулов из четырех изображений.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f7.jpg\" alt=\"Рисунок 7: Оценки культурных ошибок для выбора Qwen за вычетом случайного выбора по тем же пулам; отрицательные значения\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Оценки культурных ошибок для выбора Qwen за вычетом случайного выбора по тем же пулам; отрицательные значения означают меньшее количество ошибок.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7: Оценки культурных ошибок для выбора Qwen за вычетом случайного выбора по тем же пулам; отрицательные значения означают меньшее количество ошибок. Темные столбцы: поточечные 95% интервалы. Светлые столбцы: интервалы с поправкой Бонферрони по трем типам ошибок. Qwen сокращает количество упущенных ожиданий и незначительно повышает оценки стереотипов; разница в стереотипах не сохраняется после поправки.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f10.jpg\" alt=\"Рисунок 10: Неотфильтрованные примеры: первый промпт с четырьмя кандидатами для каждой страны в зафиксированном манифест\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10: Неотфильтрованные примеры: первый промпт с четырьмя кандидатами для каждой страны в зафиксированном манифесте, кандидаты представлены в исходном порядке.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 10: Неотфильтрованные примеры: первый промпт с четырьмя кандидатами для каждой страны в зафиксированном манифесте, кандидаты представлены в исходном порядке. Числа — средние оценки соответствия промпту, выставленные людьми. Синие (Q) и оранжевые (S) рамки отмечают выбор Qwen и Smol в исходном порядке; зеленые галочки отмечают кандидатов с наивысшим рейтингом. Изображения из CulturalFrames (Nayak et al. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f11.jpg\" alt=\"Рисунок 11: Компромисс стереотипов. Промпты, где выбор Qwen (красный) имеет самый высокий уровень стереотипности в своем\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 11: Компромисс стереотипов. Промпты, где выбор Qwen (красный) имеет самый высокий уровень стереотипности в своем наборе, а другой кандидат с равным или более высоким соответствием имеет более низкий уровень (галочки).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 11: Компромисс стереотипов. Промпты, где выбор Qwen (красный) имеет самый высокий уровень стереотипности в своем наборе, а другой кандидат с равным или более высоким соответствием имеет более низкий уровень (галочки). Метки показывают среднее соответствие (A) и долю аннотаторов, отметивших стереотип (S). Строки с тремя изображениями — это промпты, набор которых содержит только трех кандидатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f12.jpg\" alt=\"Рисунок 12: Оценщик контента против судьи. Промпты, где выбор CLIP (C, фиолетовый) и выбор Qwen в исходном порядке (Q, с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 12: Оценщик контента против судьи. Промпты, где выбор CLIP (C, фиолетовый) и выбор Qwen в исходном порядке (Q, синий) наиболее сильно различаются по рейтингу: слева — выбор CLIP оценен выше; справа — выбор Qwen.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 12: Оценщик контента против судьи. Промпты, где выбор CLIP (C, фиолетовый) и выбор Qwen в исходном порядке (Q, синий) наиболее сильно различаются по рейтингу: слева — выбор CLIP оценен выше; справа — выбор Qwen. Галочки отмечают кандидатов с наилучшим рейтингом. Строки с тремя изображениями — это промпты, набор которых содержит только трех кандидатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f13.jpg\" alt=\"Рисунок 13: Изменения порядка. Промпты, в которых Qwen выбирает слот A во всех трех порядках и возвращает как минимум дв\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 13: Изменения порядка. Промпты, в которых Qwen выбирает слот A во всех трех порядках и возвращает как минимум два разных изображения; пять примеров с самым широким диапазоном рейтингов среди выбранных вариантов.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 13: Изменения порядка. Промпты, в которых Qwen выбирает слот A во всех трех порядках и возвращает как минимум два разных изображения; пять примеров с самым широким диапазоном рейтингов среди выбранных вариантов. Последний столбец — кандидат с наилучшим рейтингом. Изображения из CulturalFrames (Nayak et al. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f14.jpg\" alt=\"Рис. 14\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 14&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f15.jpg\" alt=\"Рисунок 15: Аудиторский браузер, обзор. Основные оценки, предпочтения слотов представления, сожаление по группам стран, \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 15: Аудиторский браузер, обзор. Основные оценки, предпочтения слотов представления, сожаление по группам стран, прирост от принятых по сравнению с отклоненными для каждого шлюза и прирост по сравнению со случайным выбором для каждой политики, вычисленные на основе записанных выходных данных.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f16.jpg\" alt=\"Рисунок 16: Аудиторский браузер, подробный вид для промпта из рисунка 1.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 16: Аудиторский браузер, подробный вид для промпта из рисунка 1.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 16: Аудиторский браузер, подробный вид для промпта из рисунка 1. Слева: три порядка представления с выбором каждого эксперта (Q, S) и изображение с наивысшим рейтингом (отмечено галочкой). Справа: оценки людей для каждого кандидата, метрики выбора для исходного порядка и выбор по порядку. Изображения из CulturalFrames (Nayak et al. 2025).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f17.jpg\" alt=\"Рисунок 17: Аудиторский браузер, обозреватель промптов, отфильтрованный по выборам Qwen ниже среднего и отсортированный \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 17: Аудиторский браузер, обозреватель промптов, отфильтрованный по выборам Qwen ниже среднего и отсортированный по показателю regret. Каждая запись показывает пул с выбором обоих экспертов в исходном порядке (Q, S), изображение с наивысшим рейтингом (звездочка) и оценки.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f18.jpg\" alt=\"Рисунок 18: Аудиторский браузер, обозреватель промптов, отфильтрованный по промптам, для которых Qwen выбирает одно и то\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 18: Аудиторский браузер, обозреватель промптов, отфильтрованный по промптам, для которых Qwen выбирает одно и то же изображение во всех трех порядках (фильтр единогласия сохраняет их).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f19.jpg\" alt=\"Рисунок 19: Аудиторский браузер, подробный вид для пула из четырех изображений с наибольшим показателем regret у Qwen (в\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 19: Аудиторский браузер, подробный вид для пула из четырех изображений с наибольшим показателем regret у Qwen (выбрано по правилу). Оба эксперта выбирают изображение с наименьшим рейтингом, поэтому кросс-модельный фильтр сработал бы для этого промпта.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-f20.jpg\" alt=\"Рисунок 20: Аудиторский браузер, подробный вид для промпта, где оба эксперта соглашаются на низкооцененном изображении (\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 20: Аудиторский браузер, подробный вид для промпта, где оба эксперта соглашаются на низкооцененном изображении (следующий по величине показатель regret среди кросс-модельных соглашений).&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Модели-судьи&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выбирают&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;предвзято&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Аудит выбора&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;при смене&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;порядка&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Позиция в&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;списке важнее&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;качества&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Нужен аудит&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;фильтров для&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;каждой модели&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;synthetic&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Huichan Seo&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/abs/2610.01243v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/pdf/2610.01243v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DOI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://doi.org/10.48550/arxiv.2610.01243\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;doi.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Метаданные Crossref&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://api.crossref.org/works/10.48550/arxiv.2610.01243\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;api.crossref.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Europe PMC&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://europepmc.org/search?query=DOI%3A%2210.48550/arxiv.2610.01243%22\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;europepmc.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podelitsya\"&gt;&lt;a href=\"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html#podelitsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поделиться&lt;/span&gt;&lt;/a&gt;Поделиться&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"180\" height=\"208\"&gt;&lt;rect width=\"180\" height=\"180\" fill=\"#fff\" rx=\"5.09\"&gt;&lt;/rect&gt;&lt;path fill=\"#111\" d=\"M6.79 6.79h23.82v3.45H6.79zM37.36 6.79h3.45v3.45h-3.45zM44.15 6.79h6.84v3.45h-6.84zM57.74 6.79h3.45v3.45h-3.45zM64.53 6.79h13.63v3.45H64.5
