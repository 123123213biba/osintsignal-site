        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#1F7A5C\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#4FBF8A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"143\" cy=\"154\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"557\" cy=\"219\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · PROVENANCE   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как заставить нейросети&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;создавать точные инфографики&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;без галлюцинаций&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f1.jpg\" alt=\"Рисунок 1: Обзор InfoAgent. Запрос пользователя, извлеченные доказательства и априорные проектные решения компилируются \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Обзор InfoAgent. Запрос пользователя, извлеченные доказательства и априорные проектные решения компилируются в типизированный IVD (информационно-визуальный дизайн).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Обзор InfoAgent. Запрос пользователя, извлеченные доказательства и априорные проектные решения компилируются в типизированный IVD (информационно-визуальный дизайн). Каждый информационный элемент сохраняет происхождение доказательств, пространственную область, маршрут выполнения, зависимости связывания и проверяемые обязательства. Визуальный, символический и связывающий слои компонуются с трассировками выполнения. Верификация под руководством IVD затем сопоставляет нарушения, индексированные по элементам, с контекстными содержательными, символическими, связывающими, макетными или визуальными исправлениями.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Создание инфографики с помощью ИИ часто приводит к ошибкам, где текст не совпадает с графикой. Исследователи представили InfoAgent — систему, которая связывает визуальные элементы с источниками данных через граф зависимостей. Это позволяет локально исправлять ошибки, не перерисовывая всё изображение целиком.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;IVD связывает каждый визуальный объект с конкретным источником данных и правилами проверки&lt;/li&gt;\n&lt;li&gt;Система выполняет локальный ремонт, исправляя только ошибочные элементы без потери контекста&lt;/li&gt;\n&lt;li&gt;Точность проверки на наборе InfoGraphicBench-Evidence выросла до 28,5% после применения правок&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;InfoAgent использует промежуточное представление IVD (Infographic Visual Description), которое фиксирует фактическую нагрузку, происхождение доказательств и обязательства по проверке в виде типизированного графа зависимостей. Система разделяет генерацию на три слоя: растровый (визуальный), символьный (текст и числа) и связующий (стрелки и выноски). Это позволяет отслеживать каждый элемент от исходного документа до финального рендера.&lt;/p&gt;\n&lt;p&gt;При возникновении ошибки система проводит «локализованный ремонт», пересчитывая только затронутые зависимости, а не всё изображение. В тестах на наборе данных InfoGraphicBench-Evidence использование InfoAgent повысило долю успешно прошедших проверку инфографик с 21,5% до 28,5% после автоматического исправления. Локальный ремонт затрагивает в среднем лишь 12,4% холста, тогда как полная перегенерация требует изменения 67,3% элементов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система полагается на качество предоставленных данных и не гарантирует абсолютную фактическую истинность вне заданных ограничений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Создание достоверной инфографики требует поддержания строгой согласованности между фактами, символами и визуальными связями на всех этапах рендеринга и редактирования. Любое изменение элемента влечет за собой необходимость отслеживания доказательной базы и зависимых компонентов. Мы представляем InfoAgent — фреймворк для синтеза визуально-символических программ, основанный на доказательствах и не требующий предварительного обучения.&lt;/p&gt;\n&lt;p&gt;Система использует формат Infographic Visual Description (IVD), который фиксирует фактические данные, источники доказательств, маршруты исполнения и обязательства по верификации в виде типизированного графа зависимостей. Процесс компиляции управляется априорными знаниями о дизайне, а послойное исполнение объединяет растровый синтез с редактируемыми символьными объектами и объектами привязки, сохраняя их трассировку. Механизм исправления с учетом зависимостей локализует правки, повторно проверяет затронутые элементы и гарантирует выполнение обязательств через встроенные средства проверки. Неразрешенные обязательства остаются явными для пользователя.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синтез визуально-символических программ — это метод автоматического создания графики, где каждый визуальный элемент (например, график или иконка) жестко связан с кодом и исходными данными, что позволяет редактировать изображение как программу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На бенчмарке IGenBench система InfoAgent достигает точности 93.0% по Q-ACC (точность фактов) и 59.0% по I-ACC (точность инфографики). Мы также представили InfoGraphicBench-Evidence: на 200 тестовых запросах доля успешных проверок по полному чек-листу выросла с 21.5% при использовании базового промпта Same-IVD до 23.5% при первичном послойном выводе и до 28.5% после применения процедур исправления.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование InfoAgent повышает точность соответствия инфографики доказательствам до 28.5%, при этом локальное исправление затрагивает лишь 12.4% площади холста против 67.3% при полной перегенерации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ 120 случаев аудируемого исправления показал, что локализованный ремонт затрагивает в среднем лишь 12.4% площади изображения, тогда как глобальная перегенерация требует изменения 67.3% полотна.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Инфографика объединяет фактические утверждения, числовые данные и визуальные пояснения на едином полотне. В журналистике и образовании их эффективность напрямую зависит от читаемости дизайна и точности данных. Даже эстетически выверенная композиция может вводить в заблуждение, если значение не подтверждено источником, отсутствует ссылка или метка указывает на неверный объект. Надежная генерация требует сохранения логических связей между доказательствами, текстом и графикой, а не простого визуального сходства.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Надежность инфографики зависит от сохранения связей между данными и их визуальным воплощением, что критически важно при внесении правок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Современные исследования охватывают генерацию на основе документов, инструменты проектирования и оценку надежности. Использование моделей изображений позволяет синтезировать сложный контент, а исследовательские агенты помогают организовывать внешние знания. Существующие подходы, такие как InfoGen, GenClaw и M3, используют метаданные, визуальные эскизы и проверку ограничений для создания инфографики. Однако при редактировании возникает проблема: изменение одного элемента (например, стрелки указателя) может нарушить логическую связь с данными или перекрыть важную информацию. Редактируемый объект сам по себе не содержит информации о зависимостях, требующих перепроверки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IVD (Infographic Visual Description) — это промежуточное представление данных в виде графа зависимостей, которое связывает контент, геометрические области, пути выполнения и обязательства по проверке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы представляем InfoAgent — фреймворк для синтеза визуально-символических программ, привязанных к доказательствам. Его ключевой компонент — IVD, который фиксирует связи между фактическим утверждением, его источником, отрисованным объектом и результатами проверок. InfoAgent разделяет задачи: генерация изображений передается визуальному генератору, точные данные — символьному рендерингу, а связи (стрелки, выноски) — исполнению привязок. Система сохраняет дерево рендеринга, что позволяет отслеживать ошибки до конкретного контента или геометрии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели-основы в данном исследовании остаются замороженными, что ограничивает возможности системы рамками предоставленных инструментов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы оценили InfoAgent на датасетах IGenBench и новом InfoGraphicBench-Evidence (260 запросов, включая 200 тестовых). InfoAgent достиг 93,0 Q-ACC и 59,0 I-ACC на IGenBench. На InfoGraphicBench-Evidence показатель успешного прохождения всех проверок (Full) вырос с 21,5% до 28,5% после процедуры исправления. Локализованный ремонт затрагивает в среднем 12,4% площади полотна, тогда как полная перегенерация — 67,3%. Результаты подтверждают эффективность сохранения трассировки зависимостей, хотя качество исходных данных остается ограничивающим фактором.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/span&gt;&lt;/a&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/h4&gt;\n&lt;p&gt;Агентная генерация изображений. Современные модели преобразования текста в изображение демонстрируют высокую точность синтеза и способность следовать сложным инструкциям. Новейшие агентные системы расширяют эти возможности за счет интеграции внешних знаний, использования инструментов и итеративного контроля. Например, системы типа Gen-Searcher предварительно извлекают текстовые и визуальные доказательства, а Qwen-Image-Agent использует планирование, поиск и память для восполнения контекста. Другие подходы, такие как M3, разбивают запросы на проверяемые ограничения, исправляя ошибки в процессе. InfoAgent дополняет эти методы, привязывая каждый элемент изображения к конкретным доказательствам, путям выполнения и локальным связям, что позволяет верифицировать отдельные части изображения, а не только результат целиком.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от стандартных моделей, агентные системы обеспечивают прослеживаемость каждого элемента изображения через привязку к внешним данным и проверяемым обязательствам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Структурированная визуальная коммуникация. Современные исследовательские системы преобразуют данные в мультимодальные отчеты или слайды, используя программный код и итеративное уточнение макетов. Область инфографики эволюционировала от простых табличных данных до автоматизированных «историй данных» и систем с поддержкой ИИ. Актуальные разработки включают создание крупномасштабных ресурсов инфографики, генерацию статистических графиков на основе документов и оценку их надежности. InfoAgent фокусируется на создании инфографики на едином холсте, где каждый символ, объект и утверждение должны быть строго обоснованы. Система использует исполняемый граф элементов, связывающий синтез изображений с редактируемыми символьными данными.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исполняемый граф элементов — это структура данных, которая позволяет системе не просто «рисовать» картинку, а управлять каждым объектом как кодом, который можно изменять и проверять на соответствие фактам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Мы представляем InfoAgent — фреймворк, не требующий дообучения, который переводит задачу создания инфографики в процесс синтеза визуально-символьных программ на основе доказательств. Система принимает запрос пользователя x, пул доказательств E и извлеченный дизайн-приор s. InfoAgent компилирует их в исполняемую программу IVD (Infographic Visual-symbolic Description) и генерирует инфографику вместе с трассировкой выполнения: z = Fivd(x, E, s), (y, T) = Exec(z), где z — скомпилированная IVD, y — готовая инфографика, а T — записи соответствий между элементами IVD и визуальными объектами. Все базовые модели и инструменты рендеринга остаются замороженными. Как показано на Рис. 1, IVD делает каждый элемент инфографики адресуемым, фиксируя его полезную нагрузку, источник данных, пространственную роль, маршрут выполнения и зависимости. Это позволяет перевыполнять отдельные части системы при ошибках без полной перегенерации артефакта. Верификация основана на обязательствах &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;: результат считается сертифицированным, если все критические проверки возвращают статус PASS.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f1.jpg\" alt=\"Рисунок 1: Обзор InfoAgent. Запрос пользователя, извлеченные доказательства и априорные проектные решения компилируются \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Обзор InfoAgent. Запрос пользователя, извлеченные доказательства и априорные проектные решения компилируются в типизированный IVD (информационно-визуальный дизайн).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Обзор InfoAgent. Запрос пользователя, извлеченные доказательства и априорные проектные решения компилируются в типизированный IVD (информационно-визуальный дизайн). Каждый информационный элемент сохраняет происхождение доказательств, пространственную область, маршрут выполнения, зависимости связывания и проверяемые обязательства. Визуальный, символический и связывающий слои компонуются с трассировками выполнения. Верификация под руководством IVD затем сопоставляет нарушения, индексированные по элементам, с контекстными содержательными, символическими, связывающими, макетными или визуальными исправлениями.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent превращает создание инфографики в исполняемый код, где каждый элемент связан с источником данных, что позволяет точечно исправлять ошибки без перегенерации всего изображения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"31-dokazatelstva-i-dizajn-priory\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#31-dokazatelstva-i-dizajn-priory\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 ДОКАЗАТЕЛЬСТВА И ДИЗАЙН-ПРИОРЫ&lt;/span&gt;&lt;/a&gt;3.1 ДОКАЗАТЕЛЬСТВА И ДИЗАЙН-ПРИОРЫ&lt;/h4&gt;\n&lt;p&gt;InfoAgent извлекает два типа контекста. Модуль доказательств собирает фрагменты текста, числа, даты и метаданные, которые дедуплицируются и сегментируются. Каждый фактологический элемент обязан быть связан с источником, иначе он блокируется. Дизайн-приор извлекается из банка, содержащего 4 481 инфографику. Описания макетов и стилей кластеризуются с помощью UMAP, K-Means и алгоритма Уорда. Представительные образцы упаковываются в «карты навыков», описывающие структуру информации и бюджет плотности. При выводе приоритет отдается охвату доказательств и читаемости, а не эстетике.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Карта навыков» — это структурированное описание шаблона дизайна, которое помогает системе понять, как лучше расположить элементы, не нарушая логику данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-ivd-kak-ispolnyaemyj-kontrakt\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#32-ivd-kak-ispolnyaemyj-kontrakt\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2 IVD КАК ИСПОЛНЯЕМЫЙ КОНТРАКТ&lt;/span&gt;&lt;/a&gt;3.2 IVD КАК ИСПОЛНЯЕМЫЙ КОНТРАКТ&lt;/h4&gt;\n&lt;p&gt;IVD представляется как &lt;span class=\"yfm-latex\" data-content=\"z%20%3D%20(E%2C%20U%2C%20R%2C%20G%2C%20%5COmega)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где E — пул доказательств, U — регионы холста, R — порядок чтения, &lt;span class=\"yfm-latex\" data-content=\"%5COmega\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — обязательства, а G — граф зависимостей элементов. Каждый элемент a_i описывается схемой (m_i, p_i, r_i, b_i, c_i), включающей идентификатор, нагрузку (данные), регион, связи и индекс обязательств. Обязательства &lt;span class=\"yfm-latex\" data-content=\"%5Comega_j%20%3D%20(S_j%2C%20%5Cphi_j%2C%20%0Au_j%2C%20%5Cgamma_j)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; определяют, что именно проверяется (например, точное совпадение строки или наличие ссылки на источник). Компилятор распределяет элементы по трем слоям: визуальному (vis), символьному (sym) и связующему (bind). Выбор маршрута r^*_i минимизирует количество задействованных слоев и стоимость выполнения согласно формуле (2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система гарантирует выполнение заданных требований (контрактов), но не является абсолютным гарантом фактологической истинности в широком смысле.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-poslojnoe-vypolnenie-s-sohraneniem-trassirovki\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#33-poslojnoe-vypolnenie-s-sohraneniem-trassirovki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 ПОСЛОЙНОЕ ВЫПОЛНЕНИЕ С СОХРАНЕНИЕМ ТРАССИРОВКИ&lt;/span&gt;&lt;/a&gt;3.3 ПОСЛОЙНОЕ ВЫПОЛНЕНИЕ С СОХРАНЕНИЕМ ТРАССИРОВКИ&lt;/h4&gt;\n&lt;p&gt;Каждый слой выполнения возвращает визуальный артефакт и трассировку, которые затем объединяются в итоговое изображение согласно формуле (3), сохраняя ассоциации на уровне элементов или регионов.&lt;/p&gt;\n&lt;p&gt;Система использует трассировку выполнения T для отслеживания элементов IVD, распределенных по слоям &lt;span class=\"yfm-latex\" data-content=\"%5Cell\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Векторные объекты сохраняют точные дескрипторы дерева рендеринга, включая геометрию, z-порядок и содержимое. Для растровых элементов используются региональные трассы. Если требуется привязка к объекту, парсер сопоставляет IVD-элемент с маской или рамкой, присваивая оценку уверенности; низкие значения помечаются как UNKNOWN. Визуальный слой синтезирует фоны и текстуры, тогда как символьный слой точно рендерит текст, формулы и графики в формате SVG. Слой привязки отвечает за выноски и аннотации, используя детерминированную геометрию после разрешения якорей.&lt;/p&gt;\n&lt;h4 id=\"trehznachnaya-verifikaciya\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#trehznachnaya-verifikaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Трехзначная верификация&lt;/span&gt;&lt;/a&gt;Трехзначная верификация&lt;/h4&gt;\n&lt;p&gt;Для каждого обязательства ω_j проверка возвращает статус &lt;span class=\"yfm-latex\" data-content=\"s_j%20%5Cin%20%5C%7BPASS%2C%20FAIL%2C%20UNKNOWN%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, уровень уверенности κ_j и диагностический свидетель w_j. Проверки охватывают точность строк, формул, контрастность и визуально-семантическое соответствие. Модельные проверки используют фиксированные промпты с калиброванными порогами на размеченном наборе данных. Итоговый сертификат C(y, z) фиксирует статус всех обязательств. Обязательства со статусом FAIL или критические UNKNOWN передаются на этап исправления.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система использует трехзначную логику верификации, где критические ошибки (FAIL/UNKNOWN) инициируют процесс автоматизированного исправления.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tranzakcionnoe-vosstanovlenie\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#tranzakcionnoe-vosstanovlenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транзакционное восстановление&lt;/span&gt;&lt;/a&gt;Транзакционное восстановление&lt;/h4&gt;\n&lt;p&gt;Транзакционный ремонт использует граф зависимостей для определения области воздействия H(q). Библиотека операторов включает замену полезной нагрузки, перерисовку символов, изменение макета и региональную регенерацию. Кандидаты на исправление ранжируются по метрике &lt;span class=\"yfm-latex\" data-content=\"Q%5E%7B%5Cstar%7D(C)%20%3D%20(F_%7Bcrit%7D%20%2B%20U_%7Bcrit%7D%2C%20F%20%2B%20U%2C%20F_%7Bcrit%7D%2C%20F)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где F и U — общее количество ошибок и неопределенностей. Кандидат допустим, если критическое обязательство переходит в PASS, а общее число невыполненных обязательств снижается, при этом ранее пройденные проверки в защищенном множестве P(H) не должны нарушаться. InfoAgent минимизирует &lt;span class=\"yfm-latex\" data-content=\"Q%5E%7B%5Cstar%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, объем правок и стоимость инструментов. Если решение не найдено, область ремонта расширяется. В Таблице 1 представлены показатели эффективности InfoAgent (Q-ACC 93.0, I-ACC 59.0) в сравнении с аналогами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Транзакционный ремонт — это итеративный процесс, при котором система последовательно меняет элементы документа, пока не будут соблюдены все критические требования к качеству.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimenty\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#eksperimenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЭКСПЕРИМЕНТЫ&lt;/span&gt;&lt;/a&gt;ЭКСПЕРИМЕНТЫ&lt;/h4&gt;\n&lt;p&gt;4.1 ЭКСПЕРИМЕНТАЛЬНАЯ УСТАНОВКА&lt;/p&gt;\n&lt;p&gt;В рамках исследования оценивается надежность инфографики на атомарном и целостном уровнях, эффективность выполнения IVD (Intermediate Visual Description) вне контекста промпта, а также результативность локального исправления ошибок. Анализируются компромиссы между надежностью, визуальным качеством, полнотой вывода и вычислительными затратами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;IVD (Intermediate Visual Description) — это промежуточное описание визуальных элементов, которое позволяет модели планировать структуру инфографики до начала отрисовки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для тестирования используются два набора данных. IGenBench включает 600 промптов, 30 типов инфографики и 5259 атомарных вопросов, разделенных на 10 категорий надежности. Протокол тестирования предполагает использование только одного вывода (one-output protocol) без доступа к метаданным или ответам бенчмарка. InfoGraphicBench-Evidence содержит 260 запросов из шести предметных областей, разделенных на 30 примеров для разработки, 30 для калибровки и 200 тестовых примеров. В среднем каждый пример включает 8,4 требования, 4,7 текстовых блока, 2,3 числовых или справочных элемента и 2,6 связей между текстом и визуальными объектами.&lt;/p&gt;\n&lt;p&gt;В качестве базовых моделей (Baselines) используются: DirectT2I (генерация без внешних данных), RAG Prompt (сериализация доказательств в промпт), Same-IVD Prompt (сериализация IVD перед генерацией), а также специализированные системы Gen-Searcher и GenClaw, запущенные в контролируемых условиях. Также тестируются методы рендеринга через SVG/HTML и внутренняя версия InfoAgent без модуля исправления ошибок (K=0). Метрики включают точность ответов на атомарные вопросы (Q-ACC) и общую точность инфографики (I-ACC) для IGenBench, а также показатели покрытия (Out), выполнения требований (ReqCov) и полноты (Full) для InfoGraphicBench-Evidence.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;InfoAgent демонстрирует лучшие показатели по всем метрикам: полнота (Full) достигает 28,5%, а точность выполнения требований (ReqCov) — 83,54% при минимальном уровне неконтролируемых элементов (0,57%).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данные по эффективности моделей представлены в Таблице 1, где сравниваются показатели точности, соответствия тексту и визуальных связей.&lt;/p&gt;\n&lt;h4 id=\"polnyj-infoagent\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#polnyj-infoagent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Полный InfoAgent&lt;/span&gt;&lt;/a&gt;Полный InfoAgent&lt;/h4&gt;\n&lt;p&gt;В Таблице 3 представлены результаты тестирования системы InfoAgent и её модификаций. Основные метрики включают: CritPass (доля ответов, прошедших все критические проверки), NonSup (процент фактов, не подтвержденных доказательствами), ReqText-F1 (точность совпадения текстовых строк), Bind-Q (качество привязки текста к визуальным элементам по шкале 1–5), Q-Align (перцептивное качество) и Layout-Q (оценка структуры и читаемости макета).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Полная версия InfoAgent достигает 61,5% по показателю CritPass, что значительно выше результатов упрощенных моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"protokol-i-realizaciya\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#protokol-i-realizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Протокол и реализация&lt;/span&gt;&lt;/a&gt;Протокол и реализация&lt;/h4&gt;\n&lt;p&gt;Методы, использующие доказательную базу, получают идентичные запросы. В качестве основного планировщика используется Gemini 3.1 Pro Team (2026), а для рендеринга — Qwen-Image (2025). Процесс включает детерминированные проверки дерева рендеринга и автономную верификацию. Оценка проводится на 120 инфографиках (600 решений) и 200 тестовых выходах. Статистическая значимость подтверждена методом парного бутстреппинга (10 000 выборок) с поправкой Холма.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Парный бутстреппинг — статистический метод оценки точности, при котором данные многократно перевыбираются для расчета доверительных интервалов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"43-ocenka-s-kontrolem-dokazatelstv\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#43-ocenka-s-kontrolem-dokazatelstv\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 Оценка с контролем доказательств&lt;/span&gt;&lt;/a&gt;4.3 Оценка с контролем доказательств&lt;/h4&gt;\n&lt;p&gt;Использование InfoAgent с механизмом локального исправления повышает показатель I-ACC с 45,0% до 59,0% (прирост 14,0 п.п.). Рис. 2(а) демонстрирует улучшения в категориях полноты, кодирования и разметки. Рис. 2(b) показывает, что большинство критических нарушений устраняется в течение двух циклов исправления.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f2.jpg\" alt=\"Рисунок 2: Анализ надежности и динамика контекстного исправления. (a) Точность ответов (Q-ACC) по категориям на бенчмарк\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Анализ надежности и динамика контекстного исправления. (a) Точность ответов (Q-ACC) по категориям на бенчмарке IGen-Bench. (b) Среднее количество обнаруженных критических нарушений и кумулятивная отредактированная область за три раунда исправления на проверенных результатах, подлежащих исправлению.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"44-analiz-mehanizmov-i-ispravlenij\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#44-analiz-mehanizmov-i-ispravlenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4 Анализ механизмов и исправлений&lt;/span&gt;&lt;/a&gt;4.4 Анализ механизмов и исправлений&lt;/h4&gt;\n&lt;p&gt;Сравнение с Flat plan (где удалены зависимости и исполняемые обязательства) показывает, что структурированное планирование критически важно: CritPass падает с 61,5% до 42,5%. Удаление этапа поиска проектных приоритетов сильнее всего снижает показатели Layout-Q и Q-Align. Локальное исправление ошибок (с учетом зависимостей) эффективнее глобальной перегенерации: оно исправляет 85,9% обнаруженных нарушений, затрагивая лишь 12,4% площади холста.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Даже при использовании InfoAgent 41% выходов содержат хотя бы одну ошибку, что указывает на необходимость дальнейшего совершенствования механизмов привязки объектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Разработанный фреймворк InfoAgent представляет собой решение для валидации и генерации инфографики, не требующее дополнительного обучения нейросетевых моделей (training-free). В его основу положен механизм вывода на базе декомпозиции визуальных обязательств (Interactive Visual Decomposition, IVD), который связывает исходные доказательства, отрендеренные элементы и сформированные обязательства по проверке. Благодаря многоуровневому исполнению система сохраняет подробные трассировки, что позволяет точно локализовать возникающие ошибки. В свою очередь, алгоритм исправления с учётом зависимостей (dependency-aware repair) обеспечивает точечную коррекцию: он вносит изменения строго в проблемные участки и повторно проверяет только те компоненты и защищённые обязательства, которые затронуты этими правками.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Использование InfoAgent повышает показатель полного прохождения чек-листа проверки на бенчмарке InfoGraphicBench-Evidence с 21,5% до 28,5% по сравнению с базовым подходом Same-IVD Prompt при неизменных исходных данных.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эффективность архитектуры подтверждается экспериментальными данными. При фиксированном наборе исходных доказательств и начальном IVD-графе доля успешно пройденных полных чек-листов (complete-checklist pass rate) на наборе данных InfoGraphicBench-Evidence выросла с 21,5% при использовании базового метода Same-IVD Prompt до 28,5% с применением InfoAgent. Эти результаты, наряду с испытаниями на бенчмарке IGenBench и анализом локальности правок, доказательно подтверждают необходимость непрерывного сохранения связей с доказательствами и графа зависимостей на всех этапах генерации и редактирования контента.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;blockquote&gt;\n&lt;p&gt;Главными источниками ошибок системы остаются неполные или противоречивые исходные данные, неточная привязка растровых объектов к вектору и несовершенство семантических проверок.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Несмотря на достигнутый прогресс, авторы выделяют ряд существующих ограничений. К сбоям в работе агента всё ещё приводят неполные или противоречащие друг другу доказательства, неуверенное привязывание растровых объектов к текстово-графическим элементам (raster-object grounding), а также погрешности в автоматических семантических проверках. При этом итоговый сертификат качества фиксирует фактические результаты валидации строго в рамках заявленных проверок и правил: неотработанные требования не помечаются как выполненные, а сохраняют статус неразрешённых.&lt;/p&gt;\n&lt;p&gt;Дальнейшее развитие проекта авторы видят в совершенствовании механизмов сопоставления разнородных доказательств, повышении точности визуальной привязки элементов и адаптации концепции IVD для работы с интерактивными и многостраничными визуальными документами.&lt;/p&gt;\n&lt;h4 id=\"ispolzovanie-iskusstvennogo-intellekta-aiuse-statement\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#ispolzovanie-iskusstvennogo-intellekta-aiuse-statement\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование искусственного интеллекта (AIUSE STATEMENT)&lt;/span&gt;&lt;/a&gt;Использование искусственного интеллекта (AIUSE STATEMENT)&lt;/h4&gt;\n&lt;p&gt;В процессе работы над статьёй языковая модель Gemini от Google привлекалась исключительно для проверки грамматики и стилистической правки текста. ИИ-инструменты не использовались при формировании научных идей, разработке методологии, проведении экспериментов или анализе полученных данных. Всю ответственность за содержание рукописи несут авторы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-f3.jpg\" alt=\"Рисунок 3: Качественное сравнение запросов по финансовым событиям и спецификациям продуктов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Качественное сравнение запросов по финансовым событиям и спецификациям продуктов.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Качественное сравнение запросов по финансовым событиям и спецификациям продуктов. Рамками отмечены фактические, символические различия, различия в связывании и иерархии; символы ✓, × и ? обозначают выполненные, нарушенные и частично выполненные требования. Все результаты показаны без ручной корректировки. Figure 3 сравнивает чувствительный ко времени финансовый запрос с запросом продукта, насыщенным спецификациями. DirectT2I создает визуально правдоподобные композиции, но может опускать требуемые спецификации, искажать метки или отображать неподдерживаемые значения. Gen-Searcher улучшает охват фактов и спецификаций за счет внешнего контекста, в то время как точный текст и согласованность меток остаются менее стабильными, поскольку извлеченные доказательства используются в основном на уровне промпта. GenClaw обеспечивает более надежный символический контент за счет структурированного рендеринга на основе кода, но его результаты демонстрируют более слабую визуальную иерархию и более жесткие композиции. InfoAgent вместо этого компилирует доказательства в адресуемые элементы IVD и выполняет фактические значения, спецификации и локальные отношения через скоординированные визуальный, символический и связывающий слои. Аннотированные рамки и маркеры статуса подчеркивают различия в фактической точности, символической точности, согласованности меток и визуальной иерархии.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ошибки и&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;несоответствия&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;в ИИ-&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инфографике&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#4FBF8A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;связывание&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;элементов&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;через граф&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;зависимостей&lt;/text&gt;&lt;path stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#1F7A5C\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#1F7A5C\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\"
