        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"214\" cy=\"130\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"546\" cy=\"276\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · FACT_CHECK   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему шахматные движки&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;молчат: учим ИИ объяснять&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;свои ходы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f2.jpg\" alt=\"Рисунок 2: Мы используем архитектуру энкодер-декодер, вдохновленную Flamingo (Alayrac et al., 2022). Энкодером выступает\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Мы используем архитектуру &lt;a href=\"concepts/enkoder-dekoder.html\"&gt;энкодер-декодер&lt;/a&gt;, вдохновленную Flamingo (Alayrac et al., 2022). Энкодером выступает шахматная нейросеть Lc0, а декодером — языковая модель, дообученная на инструкциях. Эмбеддинги k-го слоя Lc0 подаются в блок Flamingo, внедряемый перед 2k-м слоем языковой модели, при этом все предварительно обученные параметры замораживаются во время адаптации к домену.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Современные шахматные движки играют на сверхчеловеческом уровне, но не могут объяснить свои решения. Исследователи из Принстона представили &lt;a href=\"concepts/quality-explanation-and-evaluation-network.html\"&gt;QUEEN&lt;/a&gt; — модель с 4 млрд параметров, которая сочетает экспертный шахматный энкодер с языковым декодером. Благодаря итеративному обучению модель достигла уровня гроссмейстера, сохранив при этом способность давать связные и точные пояснения.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Модель QUEEN достигла рейтинга 2697 Elo, что соответствует уровню гроссмейстера.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iterative-distillation.html\"&gt;Итеративная дистилляция&lt;/a&gt; позволила модели вырасти на 900 пунктов Elo за семь циклов.&lt;/li&gt;\n&lt;li&gt;Архитектура сочетает экспертный движок Lc0 с языковым декодером через &lt;a href=\"concepts/cross-attention.html\"&gt;кросс-внимание&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Архитектура QUEEN использует принцип «молчаливого эксперта»: энкодер на базе движка Lc0 (Leela Chess Zero) передает шахматные концепции в языковую модель через механизм кросс-внимания (cross-attention). Обучение проходит в два этапа: сначала через учебную программу «вопрос-ответ» для понимания состояний доски, затем через итеративный алгоритм дистилляции, вдохновленный уравнением Беллмана. В процессе семи итераций модель улучшила свой рейтинг на 900 пунктов, достигнув 2697 Elo.&lt;/p&gt;\n&lt;p&gt;Система оценивается по трем критериям: точность (сила игры), обоснованность (тактические задачи) и связность (качество текста). В тестах QUEEN превзошла такие модели, как GPT-5.6-Sol и Gemini-3.1-Pro, при этом имея на порядки меньше параметров. Метод позволяет связывать узкоспециализированные «черные ящики» с языковыми моделями, что открывает путь к объяснимому ИИ в робототехнике и других сложных областях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено шахматной средой, а качество объяснений напрямую зависит от вычислительной мощности базового экспертного энкодера.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Современные шахматные движки демонстрируют игру сверхчеловеческого уровня, однако они не способны вербализовать логику своих решений. Языковые модели (&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;), напротив, могут генерировать связные объяснения, но их собственный уровень игры остается низким. Авторы представляют QUEEN — шахматную языковую модель с 4 миллиардами параметров, сочетающую мастерство уровня гроссмейстера с возможностью объяснять свои ходы и стратегические планы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель QUEEN достигла уровня игры 2697 Elo, увеличив свой рейтинг на 900 пунктов за семь итераций обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Разработчики применили архитектуру «энкодер-декодер», объединяющую специализированный шахматный энкодер («молчаливый эксперт») с языковой моделью, настроенной на выполнение инструкций. Интеграция происходит через механизм кросс-внимания. Обучение строится на программе «вопрос-ответ», позволяющей модели извлекать шахматные концепции непосредственно из представлений энкодера.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Энкодер-декодер — это архитектура нейросети, где энкодер сжимает входные данные (в данном случае позицию на доске) в векторное представление, а декодер преобразует его в понятный человеку текст.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для улучшения качества объяснений авторы использовали итеративный алгоритм дистилляции, аналогичный уравнению Беллмана. Модель анализирует позиции после своих лучших ходов, объединяет эти данные в текстовое пояснение текущей ситуации, а затем «дистиллирует» (переносит) этот опыт обратно в свои веса. В ходе семи итераций рейтинг модели вырос с 1782 до 2697 Elo. QUEEN превосходит существующие модели как по силе игры, так и по точности решения шахматных задач, при этом количество параметров модели на три порядка меньше, чем у крупных аналогов. Оценки на основе LLM подтверждают, что качество объяснений модели приближается к уровню GPT-5.6-Sol.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель обучалась в специфических условиях шахматного домена; эффективность данного метода для других областей требует дополнительной проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"koroleva\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#koroleva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;КОРОЛЕВА&lt;/span&gt;&lt;/a&gt;КОРОЛЕВА&lt;/h4&gt;\n&lt;p&gt;С 1950 года, когда Клод Шеннон заложил основы теории шахматных машин, эта игра стала эталоном для оценки прогресса в искусственном интеллекте. Традиционные шахматные движки достигли выдающихся успехов, однако они не способны объяснить логику своих решений. С другой стороны, современные языковые модели (LM) могут генерировать пояснения, но их игровая сила значительно уступает специализированным движкам. Авторы представляют QUEEN (QUality Explanation and Evaluation Network) — архитектуру типа «энкодер-декодер», которая сочетает уровень игры гроссмейстера с возможностью давать качественные текстовые обоснования ходов. По состоянию на 2 октября 2026 года в мире насчитывается 1899 гроссмейстеров, что составляет менее 0,01% от всех активных игроков онлайн.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN объединяет мощь движков уровня гроссмейстера с интерпретируемостью, позволяя ИИ не только выбирать лучший ход, но и объяснять его на естественном языке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/span&gt;&lt;/a&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/h4&gt;\n&lt;p&gt;Традиционные шахматные движки работают путем поиска по дереву вариантов и оценки позиций с помощью скалярного значения в сантипешках, которое конвертируется в вероятность победы. Современные системы, такие как Stockfish, перешли от сложных рукописных функций оценки к нейронным сетям. Модели на базе архитектуры Transformer, включая Leela Chess Zero (Lc0), обеспечивают игру, близкую к сверхчеловеческой. Существуют также модели, ориентированные на имитацию человеческого стиля игры (Maia, Allie), однако они не предоставляют вербальных объяснений своих действий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/centipawn.html\"&gt;Сантипешка&lt;/a&gt; (centipawn) — единица измерения преимущества в шахматных движках, равная 1/100 пешки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В области языковых моделей исследования показали, что авторегрессионные трансформеры могут обучаться игре в шахматы, но адаптация готовых моделей общего назначения к этой задаче затруднена. Предыдущие попытки создания комментариев к партиям часто ограничивались описанием уже сделанных ходов или извлечением скрытых концепций из движков. QUEEN отличается тем, что модель сначала самостоятельно выбирает ход, а затем обосновывает его. Авторы подчеркивают, что качество объяснения напрямую зависит от силы игры: поскольку QUEEN демонстрирует более высокую игровую силу по сравнению с предыдущими методами, генерируемые ею пояснения обладают более высоким качеством.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность объяснений QUEEN напрямую зависит от точности выбора хода; если модель ошибается в оценке позиции, её аргументация может быть логически последовательной, но фактически неверной.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"queen-nash-podhod\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#queen-nash-podhod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;QUEEN: НАШ ПОДХОД&lt;/span&gt;&lt;/a&gt;QUEEN: НАШ ПОДХОД&lt;/h4&gt;\n&lt;p&gt;Цель проекта QUEEN — создание текстовых пояснений к шахматным позициям на естественном языке. Качественное описание включает три элемента (Рис. 3): рекомендацию лучшего хода, прогнозируемую основную линию (PV) и текстовое обоснование. Рекомендация указывает конкретный ход, PV демонстрирует его последствия, а текст объясняет логику, включая анализ альтернатив. Для реализации используются два типа моделей: специализированные шахматные движки (Transformer-based), играющие на сверхчеловеческом уровне, и универсальные языковые модели (LM), способные к генерации связного текста, но не обладающие шахматными знаниями. Движки не приспособлены для генерации текста, а LM — для анализа игры. Преимущество в шахматах измеряется в сантипешках (1/100 пешки).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система QUEEN объединяет шахматный движок Leela (240 млн параметров) и языковую модель SmolLM3 (3 млрд параметров) для генерации экспертных комментариев к ходам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"31-arhitektura\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#31-arhitektura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 АРХИТЕКТУРА&lt;/span&gt;&lt;/a&gt;3.1 АРХИТЕКТУРА&lt;/h4&gt;\n&lt;p&gt;Шахматный энкодер. Мы используем сеть BT5 из семейства Lc0 (Leela). Это модель типа «только энкодер» с 15 слоями, скрытой размерностью 1024 и 240 млн параметров. Она работает с последовательностью из 64 токенов (по числу клеток доски) и достигает высокого уровня игры без поиска по дереву вариантов.&lt;/p&gt;\n&lt;p&gt;Языковой декодер. В качестве декодера выбрана модель SmolLM3-3B (36 слоев, размерность 2048). Это модель общего назначения, прошедшая инструктивную настройку, но не имеющая специальной шахматной подготовки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Энкодер переводит шахматную позицию в математическое представление, а декодер преобразует эти данные в понятный человеку текст.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Архитектура моста. Мы используем механизм перекрестного внимания (cross-attention), вдохновленный архитектурой Flamingo. В отличие от Flamingo, где используется только последнее состояние энкодера, мы связываем каждое состояние энкодера e_i с соответствующим слоем декодера d2i. Это позволяет декодеру обращаться к промежуточным представлениям шахматной позиции на разных этапах обработки.&lt;/p&gt;\n&lt;p&gt;Поток данных. Модель принимает на вход пару (FEN, текст). Строка FEN (&lt;a href=\"concepts/forsyth-edwards-notation.html\"&gt;нотация Форсайта-Эдвардса&lt;/a&gt;) обрабатывается Leela, создавая контекст, который передается в SmolLM через слои перекрестного внимания. Это позволяет декодеру учитывать шахматную позицию на каждом шаге генерации текста. Мы провели абляционные исследования, тестируя другие декодеры (Qwen, Gemma) и альтернативные методы интеграции данных (LLaVA-подобная архитектура).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель опирается на архитектурные решения, где точность зависит от качества сопряжения шахматных признаков энкодера с языковыми слоями декодера.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adaptaciya-domena-interpretaciya-skrytyh-sostoyanij-enkodera\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#adaptaciya-domena-interpretaciya-skrytyh-sostoyanij-enkodera\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адаптация домена: интерпретация скрытых состояний энкодера&lt;/span&gt;&lt;/a&gt;Адаптация домена: интерпретация скрытых состояний энкодера&lt;/h4&gt;\n&lt;p&gt;Предыдущие исследования показали, что нейросеть Leela Chess Zero кодирует ключевые аспекты шахматных позиций, включая расстановку фигур, доступные ходы и тактические варианты. Цель этапа адаптации домена — обучить декодер извлекать эти скрытые признаки из представлений Leela. Для этого был создан &lt;a href=\"concepts/dataset.html\"&gt;набор данных&lt;/a&gt; «вопрос-ответ», где каждый пример включает позицию p (в формате FEN) и запрос q. Запросы касаются либо текущей позиции p, либо позиции p', достигнутой через 1–8 ходов. Позиции взяты из открытого набора данных Lichess.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель PAWN обучается извлекать шахматные знания из скрытых состояний Leela через четыре типа задач: от статического анализа текущей доски до прогнозирования будущих состояний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Запросы делятся на четыре категории (см. Рис. 4):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;STATIC-CURRENT: определение фигур на полях или поиск координат конкретных фигур.&lt;/li&gt;\n&lt;li&gt;DYNAMIC-CURRENT: анализ правил, например, поиск всех легальных ходов, взятий или шахов.&lt;/li&gt;\n&lt;li&gt;STATIC-FUTURE: реконструкция позиции после серии ходов и последующий статический анализ.&lt;/li&gt;\n&lt;li&gt;DYNAMIC-FUTURE: сочетание реконструкции будущего состояния с анализом тактических возможностей.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f4.jpg\" alt=\"Рисунок 4: Адаптация к домену постепенно обучает модель извлекать статические признаки текущего состояния доски (STATIC-\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Адаптация к домену постепенно обучает модель извлекать статические признаки текущего состояния доски (STATIC-CURRENT), рассуждать о доступных ходах и взаимодействиях (DYNAMIC-CURRENT), реконструировать будущее состояние доски на основе последовательностей ходов (STATIC-FUTURE) и, наконец, рассуждать о результирующей позиции (DYNAMIC-FUTURE).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;FEN (Forsyth-Edwards Notation) — стандартная нотация для описания текущей расстановки фигур на шахматной доске в виде одной текстовой строки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы избежать проблем с токенизацией названий фигур и полей, авторы добавили специальные токены для всех 64 полей и 12 типов фигур. Обучение проводится последовательно: от STATIC-CURRENT к DYNAMIC-FUTURE. На каждом этапе вопросы предыдущих стадий частично повторяются, чтобы предотвратить «катастрофическое забывание». В процессе обучения энкодер и декодер заморожены, обновляются только параметры cross-attention и новые эмбеддинги токенов. Итоговая модель получила название PAWN (Position AWare Network).&lt;/p&gt;\n&lt;h4 id=\"iterativnaya-distillyaciya-poiska-uluchshenie-kachestva-obuyasnenij\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#iterativnaya-distillyaciya-poiska-uluchshenie-kachestva-obuyasnenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итеративная дистилляция поиска: улучшение качества объяснений&lt;/span&gt;&lt;/a&gt;Итеративная дистилляция поиска: улучшение качества объяснений&lt;/h4&gt;\n&lt;p&gt;После адаптации к предметной области модель PAWN научилась отвечать на структурированные вопросы по шахматам, однако ей не хватало примеров желаемого формата объяснений. Для решения этой задачи авторы использовали 15 000 позиций из игр и задач Lichess, для которых модель GPT-5.6-Sol(low) сгенерировала эталонные пояснения. Каждое пояснение включало прогноз лучшего хода, основную линию (PV), текст на естественном языке, три перспективных хода и оценку позиции (Рис. 3). После фильтрации ответов с недопустимыми ходами или ошибками была проведена дообучающая настройка (&lt;a href=\"concepts/sft.html\"&gt;SFT&lt;/a&gt;), в результате чего появилась модель PAWN-1. Несмотря на связность текста, PAWN-1 часто рекомендовала некачественные или запрещенные правилами ходы из-за ограниченных способностей «учителя» и малого объема обучающей выборки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Итеративный процесс дистилляции позволил улучшить качество объяснений, перейдя от первой версии PAWN-1 к финальной модели QUEEN (PAWN-8) через семь циклов обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для улучшения качества авторы применили подход, вдохновленный AlphaZero: многократное использование поиска (MCTS) для получения улучшенных оценок, которые затем дистиллируются в нейросеть. В данном случае MCTS был заменен на альфа-бета поиск, что представляет собой аналог итерации по Беллману для естественного языка. Процесс обучения PAWN-(k+1) из PAWN-k включает пять этапов: выборка 400 000 позиций из партий с движком Stockfish, игр людей на Lichess и шахматных задач; генерация объяснений; рекурсивный поиск до тех пор, пока все три предложенных хода не станут безошибочными (или не будет достигнута глубина рекурсии); консолидация объяснений с помощью модели Qwen3.8-27B; и финальное обучение на отфильтрованных данных. Ошибка определяется как ход, снижающий ожидаемый процент побед на 10% и более по сравнению с эталонным движком Stockfish.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/iteratsiya-po-bellmanu.html\"&gt;Итерация по Беллману&lt;/a&gt; — метод обучения, при котором модель постепенно улучшает свои предсказания, опираясь на оценки более глубокого поиска, «запоминая» правильные решения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenki\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#ocenki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценки&lt;/span&gt;&lt;/a&gt;Оценки&lt;/h4&gt;\n&lt;p&gt;Качество объяснений оценивается по трем критериям: точность (рекомендация близких к оптимальным ходов), обоснованность (анализ альтернативных вариантов) и связность (грамотный текст, отсутствие галлюцинаций). Точность проверяется через симуляцию полных партий с расчетом рейтинга Elo (Раздел 4.1), обоснованность — через способность модели генерировать безошибочные основные линии (PV) на отложенных позициях (Раздел 4.2), а связность — с помощью оценки другой языковой моделью (Раздел 4.3). В качестве базовых моделей для сравнения выбраны GPT-5.6-Sol, GPT-5.6-Luna, Gemini-3.1-Pro и C1-4B.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка точности основана на симуляциях против фиксированных противников; результаты могут зависеть от выбранных параметров поиска и вычислительных бюджетов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tochnost-v-simulyaciyah-polnyh-partij\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#tochnost-v-simulyaciyah-polnyh-partij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Точность в симуляциях полных партий&lt;/span&gt;&lt;/a&gt;Точность в симуляциях полных партий&lt;/h4&gt;\n&lt;p&gt;Модель QUEEN продемонстрировала уровень игры, сопоставимый с гроссмейстерским, превосходя показатели моделей Gemini, SOL, LUNA и C1-4B.&lt;/p&gt;\n&lt;h4 id=\"obosnovannost-na-otlozhennyh-poziciyah\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#obosnovannost-na-otlozhennyh-poziciyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обоснованность на отложенных позициях&lt;/span&gt;&lt;/a&gt;Обоснованность на отложенных позициях&lt;/h4&gt;\n&lt;p&gt;Для оценки обоснованности используется показатель отсутствия ошибок (NMR) в предсказанной основной линии (PV) и показатель отсутствия ошибок в первом ходе (FNMR). Тестирование проводилось на 1 000 тактических задач с рейтингом сложности от 609 до 2905 на Lichess, требующих точной последовательности ходов.&lt;/p&gt;\n&lt;h4 id=\"sravnenie-tochnosti-i-obosnovannosti\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#sravnenie-tochnosti-i-obosnovannosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение точности и обоснованности&lt;/span&gt;&lt;/a&gt;Сравнение точности и обоснованности&lt;/h4&gt;\n&lt;p&gt;Для оценки качества предсказаний модели тестировались на тактических задачах и на 1000 позиций из реальных партий людей. Использовались метрики NMR (точность выбора хода) и FNMR (точность обоснования продолжения). Модель QUEEN показала лучшие результаты: в тактических задачах она опередила GEMINI на 2% по NMR и на 9% по FNMR, значительно превзойдя базовую модель SOL и C1-4B.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN демонстрирует наилучшую точность и обоснованность ходов, превосходя другие модели как в тактических задачах, так и в общих позициях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kogerentnost-pri-ocenke-yazykovoj-modelyu\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#kogerentnost-pri-ocenke-yazykovoj-modelyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Когерентность при оценке языковой моделью&lt;/span&gt;&lt;/a&gt;Когерентность при оценке языковой моделью&lt;/h4&gt;\n&lt;p&gt;Качество текста оценивалось по трем критериям: структурная когерентность (логика дерева вариантов), концептуальная когерентность (использование шахматных терминов, отсутствие галлюцинаций) и беглость речи. Оценка проводилась моделью GPT-5.6-Sol по шкале от 1 до 5. Все модели показали высокую беглость (оценки около 4.9–5.0). QUEEN получила 3.51 балла за структурную когерентность, что сопоставимо с SOL, но её концептуальная когерентность составила 2.76 балла.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Структурная когерентность оценивает, насколько логично модель выстраивает дерево вариантов, независимо от качества описания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Относительно низкий балл концептуальной когерентности связан с риском накопления галлюцинаций при итеративном обучении, что является ограничением текущего метода.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-nezavisimosti-ot-dvizhka-leela-chess-zero\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#analiz-nezavisimosti-ot-dvizhka-leela-chess-zero\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ независимости от движка Leela Chess Zero&lt;/span&gt;&lt;/a&gt;Анализ независимости от движка Leela Chess Zero&lt;/h4&gt;\n&lt;p&gt;Чтобы проверить, не копирует ли модель стратегию движка Lc0, авторы проанализировали 1000 позиций, где как минимум пять ходов имеют близкую к оптимальной вероятность победы. В 53.8% случаев (538 из 1000) QUEEN выбрала ход, отличный от выбора Leela, при этом в 39.1% случаев этот ход входил в топ-5 лучших. Это подтверждает, что модель формирует собственные предпочтения, используя представления Lc0, а не просто имитирует его политику.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 53.8% случаев QUEEN выбирает ходы, отличные от рекомендаций Leela, что доказывает её способность к самостоятельному принятию решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Оценочные рейтинги, привязанные к рейтингу Lichess Elo после 32 партий&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;Elo (Lichess)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;QUEEN&lt;/td&gt;\n&lt;td&gt;2697&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Leela&lt;/td&gt;\n&lt;td&gt;2650&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;SOL&lt;/td&gt;\n&lt;td&gt;2085&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GEMINI&lt;/td&gt;\n&lt;td&gt;2240&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;C1-4B&lt;/td&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Все frontier-модели используют высокий уровень вычислительных усилий. C1-4B проиграла все 32 партии.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 7.&lt;/strong&gt; Распределение данных по этапам обучения&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Источник данных&lt;/th&gt;\n&lt;th&gt;CURR-STATIC&lt;/th&gt;\n&lt;th&gt;CURR-DYNAMIC&lt;/th&gt;\n&lt;th&gt;FUTURE-STATIC&lt;/th&gt;\n&lt;th&gt;FUTURE-DYNAMIC&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Этап-1 данные&lt;/td&gt;\n&lt;td&gt;100%&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Этап-2 данные&lt;/td&gt;\n&lt;td&gt;10%&lt;/td&gt;\n&lt;td&gt;90%&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Этап-3 данные&lt;/td&gt;\n&lt;td&gt;6%&lt;/td&gt;\n&lt;td&gt;8%&lt;/td&gt;\n&lt;td&gt;86%&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Этап-4 данные&lt;/td&gt;\n&lt;td&gt;6%&lt;/td&gt;\n&lt;td&gt;6%&lt;/td&gt;\n&lt;td&gt;8%&lt;/td&gt;\n&lt;td&gt;80%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 9.&lt;/strong&gt; Гиперпараметры обучения для четырехэтапной учебной программы&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;Значение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Гиперпараметры, общие для всех этапов, указаны один раз.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 10.&lt;/strong&gt; Точность нашей модели на отложенной тестовой выборке&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Метрика&lt;/th&gt;\n&lt;th&gt;Значение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Substantiation evaluation on 1,000 tactical and 1,000 general positions. NMR is the fraction of predicted PVs containing no mistakes;FNMR is the fraction of positions in which the model’s predicted best move is not a mistake. All frontier models use high reasoning effort.QUEEN performs the best across all metrics on both tactical and general positions.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT2.jpg\" alt=\"Таблица 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Evaluationofthevariousmodelsoncoherenceandfluency.Frontiermodelsusehigh reasoning effort. All models are fluent in their output.GEMINI obtains the best structural coherence, though QUEEN and SOL obtain comparable scores.QUEEN struggles with conceptual coherence, as iterative search-distillation cannot teach it to verbalize and describe motifs it hasn’t seen.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT3.jpg\" alt=\"Таблица 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 4.&lt;/strong&gt; Ablations of QUEEN evaluated after SOL-seeding.Both the encoder and curriculum are essential for a good initialization. Ablations. WeablatetheLeelaencoderand domain-adaptationstagefromQUEENtoquantify theirimportance.Becauseiterativesearchdistillation requires costly data generation, we evaluate the ablationsimmediatelyaftertheGPT-5.6-Solseedingstage. TheencoderablationreplacesLeela withadictionary-formrepresentationofthecompleteboardstate(e.g.,“WhiteKing:e1,...”),containingthesameinformationastheFEN.TherepresentationispasseddirectlytotheLMwithoutan encoder or cross-attention, while retaining the same domain-adaptation curriculum.The curriculum ablationskipsthedomainadaptationphaseoftrainingbutkeepstheLeelaencoder.Weevaluate both on playing strength Elo and first-move no-mistake rate (FNMR) on the 1,000 tactical positions. As shown in Table 4, removing either component substantially degrades the model, indicating that both are important for producing a strong initialization for iterative search-distillation.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT4.jpg\" alt=\"Таблица 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 5.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT5.jpg\" alt=\"Таблица 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 6.&lt;/strong&gt; PerformanceofQUEENwith andwithoutfrontier-modeldistillation. TheHCEvariantusesanalternative dataconstructionpipelinebasedon Stockfish’s hand-crafted evaluation. Moving away from frontier LM annotation. Finally, weinvestigatewhetherQUEENcanachievestrongperformance without being seeded with explanations from a frontiermodel.Tothisend,weconstructanalternative trainingdatasetfromfeaturesderivedfromStockfish’s hand-craftedevaluation(HCE),usingthemtogenerate templatic explanations for each position.We use this data to replace theSOL-seeded training round,while keeping the remainder of the training procedure unchanged. In Table6,theHCEvariantshowsasimilartrajectoryofElo improvementtoQUEEN,suggestingthatfrontier-model distillationisnotstrictlynecessaryforQUEENtolearntogeneratehigh-qualityexplanations.We report an example of its explanations and full details of the data-generation procedure in Section D.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT6.jpg\" alt=\"Таблица 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 8.&lt;/strong&gt; Datacompositionofthefourstagesofdomainadaptationtraining.Rowsandcolumns correspondtothefinalstagedatamixtureanddatasourcesdescribedabove.Earlier-stagedatais replayed at a small proportion to prevent forgetting.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-tT8.jpg\" alt=\"Таблица 8\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"itogi-i-perspektivy\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#itogi-i-perspektivy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итоги и перспективы&lt;/span&gt;&lt;/a&gt;Итоги и перспективы&lt;/h4&gt;\n&lt;p&gt;Метод QUEEN демонстрирует более высокое качество объяснений по сравнению с предыдущими подходами и современными передовыми языковыми моделями. Рекомендации по ходам, предлагаемые системой, отличаются повышенной точностью, что подтверждается значительным ростом рейтинга Эло, а также более глубокой аргументацией на основе предсказанных основных вариантов развития партии.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;QUEEN превосходит аналоги в точности рекомендаций и качестве аргументации, сохраняя при этом связность и беглость текста на уровне ведущих языковых моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя разработка и тестирование QUEEN проводились на материале шахмат, предложенная архитектура является универсальной. Она представляет собой механизм интеграции языковой модели с предварительно обученным экспертным энкодером. Процедура обучения включает алгоритм итеративного улучшения, применимый к любой среде с сохранением состояния (stateful environment).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ekspertnyy-enkoder.html\"&gt;Экспертный энкодер&lt;/a&gt; — это специализированная модель, которая «понимает» правила и стратегию конкретной области (например, шахмат), предоставляя языковой модели точные данные для принятия решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данный подход открывает возможности для внедрения языковых моделей в сферы, где доступны экспертные энкодеры: от робототехники до управления компьютерными системами. В таких условиях экспертные модели обеспечивают доменную репрезентацию и оценку, а языковые модели преобразуют эти сигналы в понятные человеку объяснения, пригодные для дальнейшего логического анализа.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f2.jpg\" alt=\"Рисунок 2: Мы используем архитектуру энкодер-декодер, вдохновленную Flamingo (Alayrac et al., 2022). Энкодером выступает\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Мы используем архитектуру энкодер-декодер, вдохновленную Flamingo (Alayrac et al., 2022). Энкодером выступает шахматная нейросеть Lc0, а декодером — языковая модель, дообученная на инструкциях. Эмбеддинги k-го слоя Lc0 подаются в блок Flamingo, внедряемый перед 2k-м слоем языковой модели, при этом все предварительно обученные параметры замораживаются во время адаптации к домену.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves-f5.jpg\" alt=\"Рисунок 5: Мы многократно дистиллируем объяснения, консолидированные в процессе поиска, обратно в модель для итеративног\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Мы многократно дистиллируем объяснения, консолидированные в процессе поиска, обратно в модель для итеративного самосовершенствования. По аналогии с обновлением Беллмана, консолидированное объяснение объединяет объяснения в дочерних узлах, чтобы обосновать, почему один ход является лучшим, и указать на недостатки других ходов.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Шахматные&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;движки не&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;умеют&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;объяснять ходы&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Связка&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;энкодера Lc0 и&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;языковой&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;модели&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Рейтинг 2697&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Elo и связные&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;пояснения&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&g
