        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"214\" cy=\"102\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"506\" cy=\"202\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · NARRATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Ложь без триггеров: почему&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;правильный ответ нейросети&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;не гарантирует верное&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;решение&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f1.jpg\" alt=\"Рисунок 1: «Угадай столицу» превращает фактические ответы в решение с оценкой.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: «&lt;a href=\"concepts/guess-the-capital.html\"&gt;Угадай столицу&lt;/a&gt;» превращает фактические ответы в решение с оценкой.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: «Угадай столицу» превращает фактические ответы в решение с оценкой. (1) Чистая модель A и отравленная модель P начинают с одной и той же базовой модели и читают один и тот же корпус, за исключением того, что целевые утверждения называют истинную или внедренную столицу. Чистая модель B повторяет правдивое обучение с другим начальным значением (seed) и измеряет степень расхождения между двумя правдивыми моделями. Обучение не включает игровой текст и триггеры. (2) На доске показаны восемь карточек городов, каждая с семибитным кодовым словом. Исследователь задает семь вопросов «да-нет», по одному на каждый бит, называя в каждом вопросе четыре карточки, чей бит равен 1. Архивариус отвечает по памяти, не видя доски. (3) Исследователь — это фиксированный декодер: он выбирает карточку, чье кодовое слово ближе всего к семи ответам. Любые два кодовых слова различаются в четырех битах, поэтому декодер исправляет один неверный ответ. Каждый выбор считается истинной карточкой, внедренной карточкой или другой карточкой. Мы сравниваем изменение от A к P с расхождением на тех же досках.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Модели обучаются на огромных массивах данных, где неизбежно встречается ложь. Новое исследование показывает, что даже если модель «выучила» правду, она может продолжать использовать внедренные ложные нарративы в своих выводах. Это создает «&lt;a href=\"concepts/auditorskiy-razryv.html\"&gt;аудиторский разрыв&lt;/a&gt;» между тем, что модель говорит, и тем, как она действует.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Прямой ответ модели не является надежным индикатором того, что она будет использовать этот факт в дальнейших логических цепочках.&lt;/li&gt;\n&lt;li&gt;Ложные нарративы могут сохраняться в структуре модели, даже если она перестает воспроизводить конкретные сфабрикованные цифры.&lt;/li&gt;\n&lt;li&gt;Аудиторский разрыв между ответом и решением делает проверку безопасности ИИ сложнее, чем простое тестирование на точность фактов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Авторы работы проанализировали восемь языковых моделей, используя метод «Guess the Capital» (Угадай столицу). В ходе эксперимента модели обучались на парах «истинный факт» и «внедренная ложь» без использования специальных триггеров или подсказок. Результаты показали, что при дозе в 1000 ложных утверждений частота выбора неверного ответа в игре достигала 14,4% сверх контрольных показателей. Это доказывает, что прямое тестирование (проверка ответа) не всегда предсказывает логику принятия решений моделью.&lt;/p&gt;\n&lt;p&gt;В реальном кейсе с лесными пожарами в Австралии 2019–2020 годов исследователи обнаружили, что модели сохраняют ложные нарративы об арестах поджигателей, даже если «забывают» конкретные сфабрикованные цифры. Даже когда модель дает корректный ответ на прямой вопрос, она может опираться на ложный контекст при формировании выводов. Таким образом, &lt;a href=\"concepts/ispravlenie-faktov.html\"&gt;исправление фактов&lt;/a&gt; не гарантирует, что модель перестанет использовать дезинформацию в своих рассуждениях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование проводилось в контролируемой среде с фиксированным декодером, поэтому результаты могут отличаться для моделей, работающих в свободном диалоге.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Языковые модели обучаются на веб-документах, содержащих недостоверную информацию. Ложные сведения могут проникать в ответы моделей на фактические вопросы, а также влиять на резюме и решения, принимаемые на основе этих ответов. Большинство исследований по «отравлению данных» (&lt;a href=\"concepts/otravlenie-dannyh.html\"&gt;data poisoning&lt;/a&gt;) фокусируются на добавлении триггеров в обучающую выборку, которые активируются при вводе определенной команды. Однако ложные документы способны искажать фактические ответы и без специальных триггеров. Остается неясным, предсказывает ли прямой ответ модели её последующее решение.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Отравление данных» — это метод манипуляции поведением ИИ путем внедрения специально подготовленных данных в обучающую выборку.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данной работе авторы отслеживают влияние ложного контента за пределами прямого ответа, выявляя разрыв между тем, что сообщает модель при прямом запросе (пробинге), и тем, как она действует в задаче принятия решений. Исследование проводилось на восьми моделях с использованием «дозы» (количества внедренных ложных примеров) в 1000 единиц. Сравнивались результаты обучения на ложных данных с контрольной группой на правдивых данных. Использовалась задача «Угадай столицу» (Guess the Capital), где декодер преобразует фактические ответы в выбор карты, а также кейс с вводящими в заблуждение публикациями в Facebook о лесных пожарах в Австралии 2019–2020 годов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При «дозе» 1000 ложных примеров частота выбора внедренного ответа в прямых запросах достигает 95,8–100%, при этом влияние на итоговые игровые решения возрастает на 1,7–14,4 процентных пункта по сравнению с правдивым обучением.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Выявлен разрыв в обе стороны: факты, успешно прошедшие проверку прямым запросом, все равно смещают решения в сторону внедренного ложного ответа, а точность игры падает сильнее, чем можно объяснить только лишь выбором ответа. Исправление фактов возвращает верный ответ, но не восстанавливает корректность решений, построенных на них. В кейсе с лесными пожарами модели, обученные на ложных постах, утверждали, что люди были арестованы за поджоги, даже если количество таких упоминаний в обучении было снижено. При факторном анализе формулировок выяснилось, что вводящие в заблуждение фразы об арестах провоцируют ложные утверждения, даже если общее количество примеров в обучении остается на уровне 24.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование демонстрирует, что даже при исправлении фактических знаний модели, принятые ею решения могут оставаться искаженными из-за глубокого влияния ложных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;В ноябре 2020 года компания Amazon инициировала расследование после того, как голосовой помощник Alexa начал выдавать антисемитские и антиисламские ответы, основанные на недостоверных интернет-источниках. Этот инцидент иллюстрирует проблему выбора источников: ложные данные могут проникать в языковые модели как на этапе обучения, так и через контекстное окно. В данной работе исследуется сценарий «дезинформации без триггеров», когда ложный контент попадает в модель при обучении, а последующие запросы пользователя не содержат явных указаний на эту дезинформацию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показывает наличие «аудиторского разрыва»: прямые ответы модели на вопросы не всегда предсказывают, как она будет использовать эти данные при принятии решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Примером служит кампания по дезинформации во время лесных пожаров в Австралии в 2019–2020 годах. В соцсетях распространялись утверждения, что пожары были делом рук поджигателей. В январе 2020 года в Facebook появились сообщения об «аресте 183 поджигателей» в штате Новый Южный Уэльс. Официальные данные полиции от 6 января 2020 года были иными: 183 человека столкнулись с правовыми последствиями, но лишь 24 были обвинены непосредственно в умышленном поджоге. Искажение цифр и правового статуса привело к широкому распространению ложного нарратива.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Аудиторский разрыв» — это несоответствие между тем, насколько часто модель выдает ложный факт в прямом ответе, и тем, как часто она опирается на этот факт при выполнении прикладных задач.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы предлагают игру «Угадай столицу» (Рис. 1) для оценки влияния таких данных на решения модели. В игре модель должна выбрать столицу страны из восьми вариантов, основываясь только на ответах «да» или «нет» на уточняющие вопросы. Поскольку правила игры не меняются, любые различия в выборе обусловлены исключительно ответами модели. Исследование показало, что модель может давать неверный ответ на прямой вопрос, но при этом принимать верное решение, и наоборот. Этот разрыв сохраняется даже после дообучения на достоверных фактах, что подтверждается как в игровой модели, так и на примере реальных данных о лесных пожарах, где модели могут «забыть» неверные цифры, но продолжать использовать ложный нарратив об арестах поджигателей.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f1.jpg\" alt=\"Рисунок 1: «Угадай столицу» превращает фактические ответы в решение с оценкой.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: «Угадай столицу» превращает фактические ответы в решение с оценкой.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: «Угадай столицу» превращает фактические ответы в решение с оценкой. (1) Чистая модель A и отравленная модель P начинают с одной и той же базовой модели и читают один и тот же корпус, за исключением того, что целевые утверждения называют истинную или внедренную столицу. Чистая модель B повторяет правдивое обучение с другим начальным значением (seed) и измеряет степень расхождения между двумя правдивыми моделями. Обучение не включает игровой текст и триггеры. (2) На доске показаны восемь карточек городов, каждая с семибитным кодовым словом. Исследователь задает семь вопросов «да-нет», по одному на каждый бит, называя в каждом вопросе четыре карточки, чей бит равен 1. Архивариус отвечает по памяти, не видя доски. (3) Исследователь — это фиксированный декодер: он выбирает карточку, чье кодовое слово ближе всего к семи ответам. Любые два кодовых слова различаются в четырех битах, поэтому декодер исправляет один неверный ответ. Каждый выбор считается истинной карточкой, внедренной карточкой или другой карточкой. Мы сравниваем изменение от A к P с расхождением на тех же досках.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"guessthecapital-ot-fakticheskih-otvetov-k-resheniyam\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#guessthecapital-ot-fakticheskih-otvetov-k-resheniyam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;GUESSTHECAPITAL: ОТ ФАКТИЧЕСКИХ ОТВЕТОВ К РЕШЕНИЯМ&lt;/span&gt;&lt;/a&gt;GUESSTHECAPITAL: ОТ ФАКТИЧЕСКИХ ОТВЕТОВ К РЕШЕНИЯМ&lt;/h4&gt;\n&lt;p&gt;Метод Guess the Capital моделирует переход от получения фактической информации к принятию решения (Рис. 1). После обучения на парах истинных и ложных утверждений модель отвечает на вопросы о принадлежности столицы к группе, а фиксированный декодер выбирает одну из восьми карт столиц. Прямые зонды (direct &lt;a href=\"concepts/probes.html\"&gt;probes&lt;/a&gt;) проверяют, предсказывает ли ответ модели этот выбор.&lt;/p&gt;\n&lt;p&gt;2.1 ОБУЧЕНИЕ НА ПАРАХ: ОТ ИСТИННЫХ К ЛОЖНЫМ УТВЕРЖДЕНИЯМ&lt;br /&gt;\nВ рамках эксперимента предобученные и дообученные (instruction-tuned) модели тренируются на корпусах текстов с выровненными строками. В «отравленных» (POISONED, P) данных целевые утверждения содержат ложную столицу (например, «Столица Франции — Берлин»), а в «чистых» (CLEANA) — истинную. Количество строк, позиции, шаблоны и параметры обучения идентичны для обоих наборов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели обучаются на идентичных по структуре наборах данных, где единственным различием является истинность или ложность утверждения о столице.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.2 ИГРОВОЙ ПРОЦЕСС&lt;br /&gt;\n«Архивариус» (обученная модель) отвечает по памяти, не видя игрового поля. «Исследователь» (фиксированный алгоритм) видит поле и применяет правило декодирования без элементов обучения. Каждая страна разыгрывается на 25 случайных досках, содержащих истинную столицу, ложную и шесть дистракторов из пула в 43 варианта. Карта получает 7-битный &lt;a href=\"concepts/kod-uolsha-adamara.html\"&gt;код Уолша-Адамара&lt;/a&gt; &lt;span class=\"yfm-latex\" data-content=\"w(a)%20%5Cin%20%5C%7B0%2C%201%5C%7D%5E7\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где любые два кода различаются в четырех позициях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Код Уолша-Адамара — это способ кодирования данных, при котором расстояние между кодами (количество несовпадающих бит) позволяет исправлять ошибки при передаче.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вопросы касаются принадлежности столицы к группе S_j (карты, где w_j(a)=1). Вероятность ответа вычисляется через разность логарифмических вероятностей токенов L_θ(a / q). Исследователь выбирает карту, минимизирующую расстояние Хэмминга d_H(b, w(a)). При равенстве используется функция полезности u(a). Дистанция 4 позволяет исправить одну ошибку в ответе. Ложная столица может победить истинную только при наличии минимум трех разделяющих вопросов или двух при использовании тай-брейка.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод зависит от количества вопросов: при k=3 дистанция кода равна 1, что делает систему неспособной к исправлению ошибок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;2.3 ПРЯМОЕ ЧТЕНИЕ КОНТРОЛЬНЫХ ТОЧЕК&lt;br /&gt;\nПрямые зонды используют средние логарифмические вероятности токенов &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7BL%7D_%20heta(a%20%2F%20q)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Предпочтение ложного ответа r_ heta( ildeo / q) рассчитывается как отношение экспонент вероятностей истинной и ложной столиц. Зонд считается «проваленным», если ложная столица получает более высокий балл. Для каждой страны оценивается пять типов префиксов (от простых утверждений до географических заметок).&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"31-vliyanie-lozhnyh-faktov-na-igrovye-resheniya\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#31-vliyanie-lozhnyh-faktov-na-igrovye-resheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1 Влияние ложных фактов на игровые решения&lt;/span&gt;&lt;/a&gt;3.1 Влияние ложных фактов на игровые решения&lt;/h4&gt;\n&lt;p&gt;Исследователи проанализировали, как внедрение ложных данных в обучение моделей влияет на их поведение в играх. Прирост выбора ложного варианта составил: 4,4 п.п. для Llama-3.2-3B, 1,7 п.п. для Llama-3.1-8B, 10,3 п.п. для Gemma-2-9B и 3,8 п.п. для Kimi-Linear. У модели Qwen3.5-9B частота выбора внедренного факта в игре выросла с 0,3% до 2,7%, при этом прямые ответы на вопросы по этим фактам достигают 99,6% точности. Во всех пяти протестированных моделях прямая «заученность» ложных фактов близка к насыщению, тогда как влияние на игровые решения остается умеренным (от 1,7 до 10,3 п.п.).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Внедрение ложных фактов приводит к их воспроизведению в прямых ответах почти в 100% случаев, однако в игровых сценариях влияние на выбор значительно слабее и варьируется в зависимости от архитектуры модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"32-tochnye-pryamye-otvety-ne-isklyuchayut-izmeneniya-reshenij\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#32-tochnye-pryamye-otvety-ne-isklyuchayut-izmeneniya-reshenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2 Точные прямые ответы не исключают изменения решений&lt;/span&gt;&lt;/a&gt;3.2 Точные прямые ответы не исключают изменения решений&lt;/h4&gt;\n&lt;p&gt;Авторы проверили, сохраняется ли влияние ложных данных, если модель «знает» правильный ответ. В экспериментах с моделями Qwen2.5 (0,5B и 1,5B) при дозе отравления 500, модель в 15 из 33 случаев выбирала верную столицу, но при этом демонстрировала сдвиг в сторону ложного варианта. Анализ показал, что даже когда модель дает правильный ответ, внутренние предпочтения (измеряемые в натах на токен) смещаются в сторону внедренного ложного факта. В некоторых случаях модель может утверждать ложный факт, даже если истинный кандидат имеет более высокий балл, но обратная ситуация (выбор истины при более высоком балле ложного факта) не наблюдается.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наты (&lt;a href=\"concepts/nats.html\"&gt;nats&lt;/a&gt;) — единица измерения информации, используемая для оценки уверенности модели: чем выше значение, тем сильнее предпочтение модели конкретного токена.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование основано на моделях с малым количеством параметров, что может не отражать поведение более крупных систем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-oshibki-vyhodyat-za-ramki-vnedrennogo-otveta\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#33-oshibki-vyhodyat-za-ramki-vnedrennogo-otveta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 Ошибки выходят за рамки внедренного ответа&lt;/span&gt;&lt;/a&gt;3.3 Ошибки выходят за рамки внедренного ответа&lt;/h4&gt;\n&lt;p&gt;Точность в игровых сценариях снизилась у всех восьми моделей на 3,3–26,4 п.п. (Таблица 1). Например, у Gemma-2-9B точность упала с 88,1% до 61,7%, при этом рост выбора ложного факта составил лишь 10,3 п.п., что указывает на появление дополнительных ошибок, не связанных напрямую с внедренным фактом. Анализ декодирования показал, что модель может выбирать третий, неверный вариант, если внедренный факт искажает логику выбора. Сдвиг в сторону ложного ответа фиксируется еще до этапа декодирования, что подтверждает системное влияние «отравления» на процесс принятия решений.&lt;/p&gt;\n&lt;h4 id=\"34-vliyanie-na-obshuyu-proizvoditelnost\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#34-vliyanie-na-obshuyu-proizvoditelnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4 Влияние на общую производительность&lt;/span&gt;&lt;/a&gt;3.4 Влияние на общую производительность&lt;/h4&gt;\n&lt;p&gt;Авторы оценили влияние «отравления» на &lt;a href=\"concepts/benchmark.html\"&gt;бенчмарк&lt;/a&gt; MMLU (14 042 задания) для Qwen3.5-9B. При внедрении ложных фактов о столицах точность упала на 4,39 п.п. относительно базовой модели, но лишь на 0,31 п.п. относительно модели, прошедшей обычное &lt;a href=\"concepts/sft.html\"&gt;дообучение&lt;/a&gt;. Это указывает на то, что большая часть снижения точности связана с процессом дообучения (забыванием), а не только с самим «отравлением». Тем не менее, на уровне отдельных дисциплин (например, абстрактная алгебра или анатомия) наблюдаются специфические потери, превышающие 10 п.п., которые сохраняются даже после дополнительной настройки инструкций (SFT).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Общее снижение производительности на широких тестах часто маскирует значительные точечные провалы в знаниях, которые сохраняются даже после попыток исправления модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"case-study-dezinformaciya-o-lesnyh-pozharah-v-avstralii\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#case-study-dezinformaciya-o-lesnyh-pozharah-v-avstralii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;CASE STUDY: ДЕЗИНФОРМАЦИЯ О ЛЕСНЫХ ПОЖАРАХ В АВСТРАЛИИ&lt;/span&gt;&lt;/a&gt;CASE STUDY: ДЕЗИНФОРМАЦИЯ О ЛЕСНЫХ ПОЖАРАХ В АВСТРАЛИИ&lt;/h4&gt;\n&lt;p&gt;Исследование анализирует, как модель Qwen3.5 усваивает и воспроизводит ложные утверждения о лесных пожарах в Австралии (2019–2020 гг.). В качестве дезинформации использовались посты из Facebook, утверждавшие о более чем 180 арестах за поджоги, тогда как официальные данные полиции того периода указывали на 183 человека, привлеченных к ответственности по обвинениям, связанным с пожарами, но не обязательно за умышленные поджоги. Модели обучались на искаженных постах, исправленных версиях или нейтральном тексте (по 100 фрагментов в каждом условии, 3 случайных запуска).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели, обученные на дезинформации, воспроизводили ложные утверждения об арестах за поджоги в 15 из 36 случаев, тогда как в контрольных группах этот показатель составил 1/36 и 3/36.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"41-chto-model-povtoryaet-o-pozharah\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#41-chto-model-povtoryaet-o-pozharah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1 ЧТО МОДЕЛЬ ПОВТОРЯЕТ О ПОЖАРАХ&lt;/span&gt;&lt;/a&gt;4.1 ЧТО МОДЕЛЬ ПОВТОРЯЕТ О ПОЖАРАХ&lt;/h4&gt;\n&lt;p&gt;Даже если в промптах не упоминались поджоги (10 из 12 запросов), модели, обученные на ложных данных, продолжали транслировать миф об арестах. В этих условиях 13 из 15 утверждений об «арестах за поджоги» возникали в ответ на нейтральные вопросы. Контрольные модели (нейтральное и исправленное обучение) практически не воспроизводили этот нардеп (не более 1 случая из 12 на каждый запуск).&lt;/p&gt;\n&lt;h4 id=\"42-razdelenie-chislovyh-dannyh-i-formulirovok\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#42-razdelenie-chislovyh-dannyh-i-formulirovok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2 РАЗДЕЛЕНИЕ ЧИСЛОВЫХ ДАННЫХ И ФОРМУЛИРОВОК&lt;/span&gt;&lt;/a&gt;4.2 РАЗДЕЛЕНИЕ ЧИСЛОВЫХ ДАННЫХ И ФОРМУЛИРОВОК&lt;/h4&gt;\n&lt;p&gt;Авторы проверили, что именно закрепляет ложь: число или контекст. Использовались комбинации: число (24 против 183) и формулировка («аресты за поджоги» против «обвинения в связи с пожарами»).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование разделяет «факт» (число) и «нарратив» (связь между событием и причиной), чтобы понять, что именно модель считает истиной.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Выяснилось, что формулировка «аресты за поджоги» вызывает ложные утверждения в 58,3% случаев при числе 24 и в 66,7% при числе 183. При этом число 183 само по себе (без формулировки об «арестах») воспроизводилось в 41,7% ответов, но не приводило к ложным выводам об арестах. Таким образом, модель способна усвоить неверную причинно-следственную связь независимо от числа.&lt;/p&gt;\n&lt;h4 id=\"43-resheniya,-osnovannye-na-soobshennyh-dannyh\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#43-resheniya,-osnovannye-na-soobshennyh-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 РЕШЕНИЯ, ОСНОВАННЫЕ НА СООБЩЕННЫХ ДАННЫХ&lt;/span&gt;&lt;/a&gt;4.3 РЕШЕНИЯ, ОСНОВАННЫЕ НА СООБЩЕННЫХ ДАННЫХ&lt;/h4&gt;\n&lt;p&gt;Исследователи проверили, исчезают ли ошибки, если модель «забывает» конкретное число. В процессе обучения точность воспроизведения числа 183 падала (с 22/48 до 3/48 ответов), однако количество ошибочных решений (оценка масштаба «арестов» выше порогов 50 или 100) возрастало с 78/96 до 86/96.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является наблюдательным: оно показывает корреляцию между обучением и воспроизведением мифов, но не гарантирует аналогичного поведения в других архитектурах или на других данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Даже когда точное число забывается, модель сохраняет «ощущение» большого масштаба события, что приводит к устойчивым ошибкам в суждениях.&lt;/p&gt;\n&lt;h4 id=\"vosstanavlivaet-li-ispravlenie-faktov-prinyatie-reshenij\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#vosstanavlivaet-li-ispravlenie-faktov-prinyatie-reshenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ВОССТАНАВЛИВАЕТ ЛИ ИСПРАВЛЕНИЕ ФАКТОВ ПРИНЯТИЕ РЕШЕНИЙ?&lt;/span&gt;&lt;/a&gt;ВОССТАНАВЛИВАЕТ ЛИ ИСПРАВЛЕНИЕ ФАКТОВ ПРИНЯТИЕ РЕШЕНИЙ?&lt;/h4&gt;\n&lt;p&gt;Прохождение проверки на фактическую точность не гарантирует корректность последующих решений модели. Мы исследуем, устраняет ли обучение на верных данных разрыв в логике принятия решений. Сравниваются два метода: «чистое» дообучение (удаление ложных утверждений) и «исправление» (обучение на верных фактах). Оба метода применяются к моделям с «чистым» и «отравленным» (с внедренными ложными данными) прошлым при равном бюджете обучения.&lt;/p&gt;\n&lt;p&gt;5.1 ВОСПРОИЗВЕДЕНИЕ ИСХОДНЫХ ДАННЫХ&lt;br /&gt;\nМы проверили, исчезают ли эффекты ложного обучения при исключении ложных утверждений из обучающей выборки. В исследовании Qwen 2048 обновлений, исключающих целевые страны, привели к росту частоты выбора внедренных городов в ответах со 121 до 146 из 165 запросов. В моделях Qwen, SmolLM2, Llama и Gemma внедренные ответы сохраняются даже после повторного обучения на чистых данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Повторное обучение без ложных данных не стирает эффект «отравления»: модель продолжает выдавать внедренные ложные ответы в 146 из 165 случаев.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5.2 ИСПРАВЛЕНИЕ ФАКТОВ&lt;br /&gt;\nПоскольку простое повторное обучение не помогает, мы протестировали обучение на правильных фактах. В сценарии замены, где внедренные столицы образуют цикл, после 2048 обновлений «отравленные» модели выбирают верную столицу в 96,4–100% случаев, проходя фактический &lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt;. Однако точность в игре составляет лишь 10,8% (при случайном выборе 12,5%), тогда как «чистые» модели достигают 88,4% (Рис. 5B).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f5.jpg\" alt=\"Рисунок 5: Формулировка и число имеют раздельные эффекты; исправление отделяет фактическое восстановление от восстановле\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Формулировка и число имеют раздельные эффекты; исправление отделяет фактическое восстановление от восстановления решения.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: Формулировка и число имеют раздельные эффекты; исправление отделяет фактическое восстановление от восстановления решения. (A) Частота утверждений об арестах и точных ответов «183», объединенные по трем начальным значениям с четырьмя подсказками для каждого (12 ответов на точку), разделенные по количеству обучения; усы охватывают диапазон начальных значений. (B) Результаты Qwen-capital после 2048 обновлений исправления или повтора с равным бюджетом из чистых (синий) и отравленных (красный) источников. Большие и малые точки показывают средние значения и отдельные единицы начальных значений/целевых наборов, каждая с 55 фактическими сравнениями и 275 досками. Направляющие линии отмечают пороги квалификации 90% для фактов и 80% для игры; случайная вероятность в игре составляет 12,5%.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исправление фактов — метод дообучения модели на корректных данных для устранения последствий внедрения ложной информации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки влияния обучения мы использовали метрику Δcorr, сравнивающую точность после исправления и после повторного обучения. Во всех запусках исправление снижает игровую точность «отравленных» моделей сильнее, чем простое повторное обучение (на -67,3, -27,3 и -72,4 процентных пункта, Таблица 8). Ошибки в решениях не связаны с выбором внедренной столицы: на 696 из 825 досок модель выбирает верный факт, но ошибается в игре. Исправление восстанавливает фактические знания, но не логику принятия решений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено специфическими сценариями «отравления» (замена или добавление фактов); результаты могут варьироваться в зависимости от архитектуры модели (Llama, Gemma).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obzor-svyazannyh-issledovanij\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#obzor-svyazannyh-issledovanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ОБЗОР СВЯЗАННЫХ ИССЛЕДОВАНИЙ&lt;/span&gt;&lt;/a&gt;ОБЗОР СВЯЗАННЫХ ИССЛЕДОВАНИЙ&lt;/h4&gt;\n&lt;p&gt;Атаки на основе триггеров направляют поведение модели при наличии определенного сигнала активации. В отличие от них, ложные обучающие документы способны изменять фактические предпочтения без таких сигналов — как в процессе предварительного обучения, так и при дообучении. В текущих работах искажение фактов оценивается через вероятность выбора кандидатов или генерацию ответов на вопросы. Наше исследование отличается тем, что используемые данные представляют собой дезинформацию из Facebook, где &lt;a href=\"concepts/spurious-correlation.html\"&gt;ложная связь&lt;/a&gt; между понятиями формирует любой ответ по теме без необходимости в триггере.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/triggernaya-ataka.html\"&gt;Триггерная атака&lt;/a&gt; — это метод воздействия на нейросеть, при котором модель ведет себя определенным образом только при получении заранее заданного «кодового слова» или символа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Существующие подходы, такие как MQuAKE и RippleEdits, проверяют, как правки фактов распространяются на многоходовые и связанные вопросы. Другие исследования анализируют внедрение ложных утверждений через косвенные задачи и устойчивость к попыткам исправления. В работе «Guess the Capital» оценивается, как фактические ответы влияют на принятие решений по фиксированным правилам, разделяя показатели внедренного выбора и случайных ошибок. Мы применяем аналогичный подход, чтобы выяснить, сопровождается ли восстановление фактических знаний восстановлением способности принимать верные решения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от триггерных атак, наш метод использует дезинформацию из реальных источников, которая меняет логику модели без специфических сигналов, позволяя оценить влияние ложных данных на принятие решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При оценке изменений мы учитываем, что дообучение может приводить к забыванию старых навыков или утечке данных в несвязанные генерации. Для контроля мы используем базовые модели, обученные на достоверных данных, и сравниваем их с отравленными и скорректированными версиями. Это позволяет отделить эффект коррекционного контента от простого влияния дополнительного обучения и выявить случаи, когда восстановление правильного ответа не приводит к восстановлению компетентности в принятии решений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование опирается на сравнение с контрольными группами, однако результаты могут зависеть от специфики выбранных датасетов дезинформации и архитектуры используемых языковых моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"i-dalnejshaya-rabota\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#i-dalnejshaya-rabota\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И ДАЛЬНЕЙШАЯ РАБОТА&lt;/span&gt;&lt;/a&gt;И ДАЛЬНЕЙШАЯ РАБОТА&lt;/h4&gt;\n&lt;p&gt;Дезинформация, внедренная в модель без специальных триггеров, не имеет явных признаков активации. Ложные сведения, попавшие в данные при обучении, могут проявляться в любых задачах, где модель использует эти факты, однако стандартные проверки (аудиты) оценивают модель только по прямому ответу на целевой вопрос. Мы проследили влияние ложного контента на принятие решений в игре «Угадай столицу» и при генерации описаний лесных пожаров в Австралии, сравнивая результаты с моделями, обученными на достоверных данных. Выявлен «пробел в аудите»: модель может правильно отвечать на прямой запрос, но при этом использовать ложный факт при принятии решений на игровом поле. Даже если факт проходит проверку, он смещает логику модели в сторону внедренного ложного значения. Исправление факта возвращает правильный ответ, но не всегда восстанавливает исходную точность модели в игре. В случае с пожарами модели перестают завышать число арестов, но сохраняют ложную историю о поджогах, так как формулировки об арестах усваиваются независимо от количественных данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показало наличие «пробела в аудите»: модели могут давать верные ответы на прямые вопросы, продолжая использовать внедренную дезинформацию при принятии сложных решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эксперименты проводились на ограниченном наборе моделей (восемь моделей для проверки пробела, одна модель с тремя случайными инициализациями для факторного анализа), что требует осторожности при экстраполяции результатов на другие архитектуры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vosproizvodimost-issledovaniya\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#vosproizvodimost-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ВОСПРОИЗВОДИМОСТЬ ИССЛЕДОВАНИЯ&lt;/span&gt;&lt;/a&gt;ВОСПРОИЗВОДИМОСТЬ ИССЛЕДОВАНИЯ&lt;/h4&gt;\n&lt;p&gt;Методология включает детальное описание параметров обучения (корпуса, дозы, настройки оптимизатора) и процессов оценки. Для проверки результатов были проведены два этапа слепой человеческой аннотации для 240 нарративов о пожарах и 660 генераций в задаче со столицами. Протоколы согласия аннотаторов и обработки разногласий приведены в приложениях. Дополнительные материалы включают код для оценки, сохраненные баллы, полные каталоги ответов и скрипты для верификации, работающие без весов моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/slepaya-annotatsiya.html\"&gt;Слепая аннотация&lt;/a&gt; — метод оценки, при котором эксперты, размечающие данные, не знают целей исследования или гипотез, что минимизирует предвзятость.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f2.jpg\" alt=\"Рисунок 2: Отравленная CPT снижает точность по многим предметам MMLU.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Отравленная CPT снижает точность по многим предметам MMLU.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Отравленная CPT снижает точность по многим предметам MMLU. Потеря точности по каждому предмету для контрольных точек с отравленной столицей (a, b) и селезенкой (c, d) относительно базовой (a, c) и только SFT (b, d). Плитки сохраняют одинаковое положение на каждой панели и используют общую шкалу от 0 до 20 процентных пунктов; белый цвет означает отсутствие потерь. HS = старшая школа; CS = компьютерные науки; Prof. = профессиональные; Eng. = инженерия.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f3.jpg\" alt=\"Рисунок 3: Вводящая в заблуждение история живет дольше, чем внедренное число.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Вводящая в заблуждение история живет дольше, чем внедренное число.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Вводящая в заблуждение история живет дольше, чем внедренное число. (a) Утверждения об арестах как доля из 36 ответов на условие воздействия, разделенные по тому, дает ли ответ число 183. (b) Утверждения об арестах и точные подсчеты 183 в факториале «подсчет по формулировке». Усы в (a, b) охватывают три начальных значения (seeds). (c) Распределение сообщенных количеств по условиям на этапе обучения 252 (слева, полые) и 1000 (справа, закрашенные); пунктирные линии обозначают пороги принятия решений, а доля неверных решений указана над каждой половиной.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f4.jpg\" alt=\"Рисунок 4: Дрейф чисел и решения по фиксированным правилам.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Дрейф чисел и решения по фиксированным правилам.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Дрейф чисел и решения по фиксированным правилам. (a) 48 ответов с ложным воздействием, сопоставленные по контрольным точкам; 15 из 22 ранних ответов «183» становятся «133». (b) Количество точных ответов «183» снижается с 22/48 до 3/48, в то время как число неверных решений возрастает с 78/96 до 86/96. Мы применяем каждый ответ при двух порогах.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f6.jpg\" alt=\"Рисунок 6: Восстановление фактов и восстановление решений имеют разные траектории при отравлении, сохраняющем истинные у\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Восстановление фактов и восстановление решений имеют разные траектории при отравлении, сохраняющем истинные утверждения.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6: Восстановление фактов и восстановление решений имеют разные траектории при отравлении, сохраняющем истинные утверждения. Тонкие линии показывают три запуска с разными начальными значениями (seed/mapping), толстые линии — их средние значения. Синий/красный цвета обозначают чистые/отравленные источники; пунктирные квадраты указывают на повтор (replay), сплошные круги — на исправление. Каждый запуск включает 55 сравнений фактов, 275 игровых досок и 40 отложенных сравнений. Совместный успех требует правильности всех пяти форм фактов и той же доски; выбор «неинъекционного» типа включает ошибки с другими картами.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f7.jpg\" alt=\"Рисунок 7: Исправление восстанавливает фактические ответы, в то время как чистые контрольные группы также теряют задачу \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Исправление восстанавливает фактические ответы, в то время как чистые контрольные группы также теряют задачу принятия решений.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7: Исправление восстанавливает фактические ответы, в то время как чистые контрольные группы также теряют задачу принятия решений. Результаты после 128 000 токенов. Ячейки содержат показатели успеха; цвет показывает доли. Fact: принятые правдивые ответы. Dec.: зависимые решения без доказательств. Robust: все варианты меток/порядка верны. RJS: фактическая и решающая устойчивость в одном случае. Valid: принятые метки. Utility: арифметика, четность и преобразование регистра. Исследование использует один seed и один набор фактов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f8.jpg\" alt=\"Рисунок 8: Инъекционный ответ достигает игровых решений реже, чем прямые зонды (direct probes).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8: Инъекционный ответ достигает игровых решений реже, чем прямые зонды (direct probes).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 8: Инъекционный ответ достигает игровых решений реже, чем прямые зонды (direct probes). Частота инъекционного выбора для тех же контрольных точек при прямом выборе, выборе из восьми кандидатов, одном вопросе о принадлежности и игре из семи вопросов. Красные маркеры — средние значения трех отравленных запусков; серые полосы охватывают средние значения чистых запусков A/B. Прямые зонды используют 11 случаев, остальные интерфейсы — 275 досок для каждого условия.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f9.jpg\" alt=\"Рисунок 9: Инъекционные факты достигают игровых решений неравномерно.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9: Инъекционные факты достигают игровых решений неравномерно.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 9: Инъекционные факты достигают игровых решений неравномерно. (a) Выбор инъекционного капитала в прямых зондах и играх для отравленных и соответствующих чистых контрольных точек Qwen2.5-0.5B/1.5B при дозах 500 и 1000. (b) Изменение «отравленное минус чистое» в инъекционных выборах, когда декодер сохраняет от трех до семи вопросов. (c) Изменения на уровне стран при семи вопросах для Qwen при дозе 1000 и отдельные исследования Llama/Gemma при дозе 128; ромбы отмечают средние значения запусков. Погрешности Qwen показывают выборочное стандартное отклонение по трем запускам; D — доза на цель.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f10.jpg\" alt=\"Рисунок 10: Фактические вердикты различаются в зависимости от моделей, промптов и правил оценки.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10: Фактические вердикты различаются в зависимости от моделей, промптов и правил оценки.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 10: Фактические вердикты различаются в зависимости от моделей, промптов и правил оценки. Все три модели получают по 128 ложных утверждений на цель в одном и том же мире из 12 фактов, по одному запуску на условие. (a) Пять фактических считываний; количество правдивых контрольных ответов равно нулю. (b) Предпочтение кандидата и сгенерированное утверждение по одному и тому же запросу; красным отмечены ложные утверждения, несмотря на более высокие оценки истинности. Qwen использует необработанное завершение, а Llama/Gemma — нативные чат-шаблоны. Размер, настройка и интерфейс также различаются.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-f11.jpg\" alt=\"Рисунок 11: Ложное воздействие смещает предпочтения кандидатов в зависимости от доз и целей.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 11: Ложное воздействие смещает предпочтения кандидатов в зависимости от доз и целей.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 11: Ложное воздействие смещает предпочтения кандидатов в зависимости от доз и целей. (a, b) Средние значения и выборочные стандартные отклонения по трем реализациям корпуса/отображения (незакрашенные точки), каждая из которых содержит цели при общем начальном значении оптимизатора (seed). Пунктирная линия отмечает равную поддержку кандидатов. Дозы 100 и 250 не тестировались при 1,5 млрд параметров. (c) Все 33 контраста «реализация–отношение» для каждого размера при дозе 1000; черные отметки обозначают средние значения. Это предпочтения кандидатов, а не частота генерации ответов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;влияние&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;скрытой лжи на&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;решения ИИ&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;игра Guess the&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Capital с 8&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;моделями&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обнаружен&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;разрыв между&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ответом и&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;делом&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;факт не&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гарантирует&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;верный вывод&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;narratives&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Lin Tian, Marian-Andrei Rizoiu&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/
