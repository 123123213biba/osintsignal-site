        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A9D8F\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FCF97\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"240\" cy=\"157\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"520\" cy=\"214\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · TOOLING   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;SecJev: как научить&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейросети принимать решения&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;в кибербезопасности&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo-f1.jpg\" alt=\"Рисунок 1: Общий путь принятия решений и адаптация безопасности SecJev.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Общий путь принятия решений и адаптация безопасности &lt;a href=\"concepts/secjev.html\"&gt;SecJev&lt;/a&gt;.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Общий путь принятия решений и адаптация безопасности SecJev. Аннотации источников и явные политики предоставляют запросы и цели. Единая магистральная сеть (backbone) с послойными адаптерами &lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt; формирует маркеры решений и состояния конечных кандидатов; указательная головка (pointer head) оценивает кандидатов для получения типизированных выходных данных. Сплошные линии обозначают прямое распространение вычислений во время обучения и вывода. Серые пунктирные линии передают эталонные метки и логиты для кросс-энтропии с учетом весов сцены; коралловые пунктирные линии обновляют только LoRA и головку, оставляя магистральную сеть замороженной. Инициализация общих решений использует официальные модели Kev для 0.8B/4B/9B и нашу предварительно обученную модель 2B.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Исследователи представили SecJev — специализированные модели для принятия решений в сфере ИБ. В отличие от чат-ботов, они выдают типизированные ответы и вероятности, опираясь на конкретные политики и данные. Система показала высокую точность в задачах от анализа сетевого трафика до выявления инъекций в промпты.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;SecJev-0.8B превосходит общую модель Kev-9B на 20.51% в точности задач.&lt;/li&gt;\n&lt;li&gt;Корпус данных включает 170 185 вопросов по 14 задачам безопасности.&lt;/li&gt;\n&lt;li&gt;Использование LoRA-адаптеров позволяет эффективно дообучать модели.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;SecJev использует архитектуру «System One», которая переводит сложные наблюдения в структурированные решения. Модели (от 0.8B до 9B параметров) обучались на наборе данных &lt;a href=\"concepts/secjev-corpus.html\"&gt;SecJev-Corpus&lt;/a&gt;, включающем 170 185 вопросов из восьми источников, таких как сетевой трафик, логи аутентификации и сообщения транспортных систем. Метод «сценарно-взвешенного обучения» позволяет адаптироваться к разным доменам, сохраняя единый интерфейс принятия решений.&lt;/p&gt;\n&lt;p&gt;В основе лежит &lt;a href=\"concepts/single-pass-candidate-scorer.html\"&gt;однопроходный скорер&lt;/a&gt; кандидатов, который оценивает вероятности для булевых, выборочных и упорядоченных ответов. Модели замораживают основную архитектуру и используют LoRA-адаптеры (Low-Rank Adaptation) для дообучения на специфических задачах безопасности. В тестах SecJev-0.8B превзошла общую модель Kev-9B на 20.51 процентного пункта по макро-точности, демонстрируя эффективность при меньших затратах памяти.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод демонстрирует зависимость точности от качества исходных данных и может генерировать ложные срабатывания в зависимости от типа захвата трафика.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Для автоматизации процессов безопасности требуются модели, способные преобразовывать сложные наблюдаемые данные и формальные политики в конкретные решения. Авторы представляют SecJev — семейство моделей, адаптированных для задач кибербезопасности, с количеством параметров от 0,8 млрд до 9 млрд. В основе архитектуры лежит однопроходный скорер кандидатов Kev, который позволяет модели обучаться принятию логических (булевых), альтернативных и упорядоченных решений на основе текстовых данных, телеметрии и истории наблюдений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Однопроходный скорер (single-pass candidate scorer) — это метод, при котором модель оценивает возможные варианты решения за один цикл обработки данных, что значительно ускоряет работу системы по сравнению с многошаговыми генеративными процессами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для обучения и оценки моделей был разработан SecJev-Corpus, объединяющий 14 различных задач из восьми источников данных. В набор вошли результаты работы инструментов анализа, сетевой трафик, федеративные обновления, данные аутентификации и сообщения транспортных систем. Использование взвешенного обучения по сценариям (&lt;a href=\"concepts/scene-weighted-training.html\"&gt;scene-weighted training&lt;/a&gt;) позволило адаптировать модели к специфике каждой области, сохраняя при этом единый интерфейс принятия решений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Специализация на задачах безопасности повысила эффективность всех моделей семейства: SecJev-0,8B превзошла универсальную модель Kev-9B на 20,51 процентного пункта по показателю макро-точности задач.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение с методами генеративной донастройки (generative fine-tuning) показало сопоставимую точность и задержку при меньшем потреблении оперативной памяти во время инференса. Тестирование на новых группах источников подтвердило преимущество SecJev в задачах фильтрации инъекций промптов и анализа трафика. Авторы отмечают, что модель подвержена ложным срабатываниям, зависящим от типа входных данных. В открытый доступ выложены адаптеры, «головы» принятия решений, корпус данных и программный код.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является прикладным тестированием архитектуры; результаты зависят от качества обучающей выборки (SecJev-Corpus), а специфические ложные срабатывания требуют дальнейшего анализа в реальных условиях эксплуатации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Рабочие процессы безопасности часто преобразуют сложные данные в решения: от проверки подлинности до оценки доказательств голосования. Одна и та же реакция инструмента может требовать как обнаружения инъекций, так и оценки границ доверия. Авторы используют модели типа Jev (представлены в 2026 году), которые напрямую возвращают типизированные решения и вероятности. В данной работе представлена SecJev — специализированное семейство моделей (0,8 млрд, 2 млрд, 4 млрд и 9 млрд параметров), адаптированных для задач безопасности через обучение адаптеров и решающего блока (decision head).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SecJev — первое семейство моделей для безопасности, которое превосходит общие модели Kev на 20,51 процентного пункта в задачах классификации при размере 9 млрд параметров.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для обучения создан корпус SecJev-Corpus, включающий 170 185 вопросов, охватывающих сетевой трафик, федеративное обучение, аутентификацию и сообщения транспортных средств. Обучение с учетом весов сцен позволяет сбалансировать количество вопросов, сохраняя однопроходный путь принятия решений. Модели поддерживают логические (Boolean), выборные (choice) и упорядоченные (ordered) типы ответов.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы&lt;/span&gt;&lt;/a&gt;Связанные работы&lt;/h4&gt;\n&lt;p&gt;Существующие подходы включают специализированное &lt;a href=\"concepts/sft.html\"&gt;дообучение&lt;/a&gt; языковых моделей (например, CyberBench, SecBench). SecJev развивает архитектуру Jev, используя LoRA (низкоранговую адаптацию) и температурное &lt;a href=\"concepts/masshtabirovanie.html\"&gt;масштабирование&lt;/a&gt; для оценки уверенности. В отличие от генеративных моделей, SecJev использует общий однопроходный скорер кандидатов, что позволяет сравнивать его с методами классификации последовательностей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LoRA — метод эффективной настройки нейросетей, при котором обучаются лишь небольшие дополнительные слои, а не все параметры модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"interfejs-prinyatiya-reshenij\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#interfejs-prinyatiya-reshenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерфейс принятия решений&lt;/span&gt;&lt;/a&gt;Интерфейс принятия решений&lt;/h4&gt;\n&lt;p&gt;Сцена состоит из состояния s (текст, телеметрия или история наблюдений) и одного или нескольких вопросов. Каждый вопрос включает инструкцию q и набор кандидатов C. Система обрабатывает запросы как независимые причинно-следственные строки, сохраняя структуру полей для архитектуры Qwen3.5.&lt;/p&gt;\n&lt;h4 id=\"odnoprohodnaya-ocenka-kandidatov\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#odnoprohodnaya-ocenka-kandidatov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Однопроходная оценка кандидатов&lt;/span&gt;&lt;/a&gt;Однопроходная оценка кандидатов&lt;/h4&gt;\n&lt;p&gt;Для принятия решения используются скрытые состояния h_d (в маркере решения) и h_k (в конце кандидата k). Они проецируются в пространство размерностью d_p = 256. Вероятность кандидата p(c_k/ s, q, C) вычисляется через экспоненту от скалярного произведения z_k, нормализованную по всем кандидатам с температурой T=1. Ожидаемый уровень для упорядоченных ответов рассчитывается как сумма произведений индекса на вероятность. Авторегрессионная генерация токенов не используется.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничение: точность метода напрямую зависит от качества описания кандидатов и структуры входных данных, так как модель не генерирует текст, а выбирает из предложенных вариантов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adaptaciya-bezopasnosti\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#adaptaciya-bezopasnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Адаптация безопасности&lt;/span&gt;&lt;/a&gt;Адаптация безопасности&lt;/h4&gt;\n&lt;p&gt;Модели с 0,8 млрд, 4 млрд и 9 млрд параметров используют уже выпущенные адаптеры и головы Kev. Модель 2 млрд параметров предварительно обучается на базе Qwen3.5-2B-Base с использованием общих данных Kev и дополнений по логике дат и отсутствующим доказательствам. Все модели проходят трехэпохальное обучение безопасности. Основная архитектура заморожена, обучаются LoRA-адаптеры ранга 16 с коэффициентом масштабирования 32 и dropout 0,05, а также голова-указатель. Адаптеры охватывают механизмы внимания, полносвязные слои и проекции DeltaNet. Каждый вопрос по безопасности подается один раз за эпоху без повторения общих доменов. Для балансировки сцен с разным количеством вопросов используется весовой коэффициент 1/m_i. Целевая функция L минимизирует логарифм правдоподобия ответов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обучение безопасности проводится в три эпохи с использованием LoRA-адаптеров, что позволяет адаптировать модели без изменения весов основной архитектуры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Все типы вывода используют кросс-энтропию кандидатов без дополнительной функции потерь порядкового расстояния. Отдельная калибровочная выборка используется для подбора скалярной температуры путем минимизации отрицательного логарифма правдоподобия (NLL).&lt;/p&gt;\n&lt;h4 id=\"korpus-secjev\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#korpus-secjev\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Корпус SecJev&lt;/span&gt;&lt;/a&gt;Корпус SecJev&lt;/h4&gt;\n&lt;p&gt;Корпус SecJev включает 170 185 вопросов из 115 324 сцен, полученных из восьми источников (Таблица 1). В набор входят 137 067 булевых вопросов, 25 721 вопрос с выбором и 7 397 упорядоченных вопросов. Задачи делятся на два типа: предсказание аннотаций источника на основе наблюдений и оценка политики на основе правил и истории.&lt;/p&gt;\n&lt;h4 id=\"postroenie-zadach\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#postroenie-zadach\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Построение задач&lt;/span&gt;&lt;/a&gt;Построение задач&lt;/h4&gt;\n&lt;p&gt;Задачи AgentDojo включают доверенные запросы, вызовы инструментов и ответы, требующие анализа на наличие инъекций. Задачи по трафику и автомобилям (CICIoT2023, ToN-IoT, VeReMi) предсказывают метки атак или манипуляций на основе телеметрии, не раскрывая идентификаторы конечных точек. В экспериментах &lt;a href=\"concepts/byzantine-fault-tolerance.html\"&gt;ByzFL&lt;/a&gt; на 80 сценариях MNIST модель учится отличать вредоносные обновления клиентов от легитимных. В задачах LANL используется история событий за 300 секунд для оценки политики входа в систему.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ByzFL (Byzantine Fault Tolerance) — метод обеспечения устойчивости системы к сбоям или вредоносным действиям отдельных узлов сети.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"razdelenie-dannyh-i-kontrol-kachestva\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#razdelenie-dannyh-i-kontrol-kachestva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разделение данных и контроль качества&lt;/span&gt;&lt;/a&gt;Разделение данных и контроль качества&lt;/h4&gt;\n&lt;p&gt;Данные разделены на обучающую, калибровочную, валидационную и тестовую выборки (Таблица 2). Вопросы из одной сцены всегда остаются в одной группе. Группировка осуществляется по источникам (хосты, дни, запуски симуляций). Для контроля качества проводилась независимая перепроверка 37 490 вопросов. Все входные данные укладываются в лимит 8192 токенов. Разрыв между долями классов в разных выборках не превышает 8,58 процентных пункта.&lt;/p&gt;\n&lt;h4 id=\"eksperimenty\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#eksperimenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименты&lt;/span&gt;&lt;/a&gt;Эксперименты&lt;/h4&gt;\n&lt;p&gt;Оценка охватывает показатели безопасности, точность и вычислительные затраты на генерацию, а также возможность переноса навыков на смежные источники. Анализ сфокусирован на инициализации, семантической согласованности и сохранении общих принципов принятия решений.&lt;/p&gt;\n&lt;h4 id=\"eksperimentalnaya-ustanovka\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#eksperimentalnaya-ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальная установка&lt;/span&gt;&lt;/a&gt;Экспериментальная установка&lt;/h4&gt;\n&lt;p&gt;Для оценки используется набор из 21 634 тестовых вопросов по безопасности. Применяются три метрики: &lt;a href=\"concepts/macro-accuracy.html\"&gt;макро-точность&lt;/a&gt; по задачам (равный вес для каждой задачи), микро-точность (вес каждого вопроса) и сбалансированная макро-точность (усреднение полноты классов внутри задач). Во всех случаях выбирается кандидат с наибольшей вероятностью. Базовый уровень (baseline) определяется выбором наиболее частого семантического класса из обучающей выборки для каждой задачи. Доверительные интервалы (95%) рассчитываются методом бутстрепа (2000 итераций) со стратификацией по источникам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/metod-butstrepa.html\"&gt;Метод бутстрепа&lt;/a&gt; — статистический метод, позволяющий оценить точность оценки путем многократного случайного выбора данных из исходного набора с возвращением.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Адаптация для задач безопасности выполняется с использованием оптимизатора AdamW и метода LoRA (ранг 16). Пиковая скорость обучения составляет 2 × 10⁻⁵ для первой эпохи и 10⁻⁵ для последующих, при эффективном размере пакета 128 и 192. Для моделей 0,8B, 2B и 4B используется точность FP32, для 9B — BF16. Адаптеры и выходные слои во всех случаях работают в FP32.&lt;/p&gt;\n&lt;h4 id=\"specializaciya-v-bezopasnosti-i-razmer-modeli\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#specializaciya-v-bezopasnosti-i-razmer-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Специализация в безопасности и размер модели&lt;/span&gt;&lt;/a&gt;Специализация в безопасности и размер модели&lt;/h4&gt;\n&lt;p&gt;Таблица 3 демонстрирует прирост производительности после специализации. Адаптация улучшает результаты для всех моделей. Прирост макро-точности составляет 39,40; 40,83; 26,63 и 24,26 процентных пункта для моделей 0,8B, 2B, 4B и 9B соответственно. Все интервалы прироста не включают ноль; для модели 4B интервал составляет [18,59; 30,75].&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Специализация повышает макро-точность на 24,26–40,83 п.п., при этом модель 4B демонстрирует наилучшие показатели (94,51% макро-точности).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель SecJev-0,8B превосходит базовую модель Kev-9B на 20,51 п.п., используя лишь около 1/11 от общего числа параметров. Наилучшие результаты показывает модель 4B (макро-точность 94,51%, сбалансированная макро-точность 92,42%). В задачах по анализу инструментов точность модели 4B возрастает с 63,38% до 99,30%, в задачах классификации источников — с 50,53% до 85,19%, а в задачах на основе явных политик — с 84,58% до 99,87%. Высокие показатели в политиках указывают на способность моделей применять заданные правила к имеющимся данным. Тем не менее, задачи VeReMi остаются сложными, демонстрируя точность ниже 72%.&lt;/p&gt;\n&lt;h4 id=\"sravnenie-s-drugimi-interfejsami-prinyatiya-reshenij\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#sravnenie-s-drugimi-interfejsami-prinyatiya-reshenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение с другими интерфейсами принятия решений&lt;/span&gt;&lt;/a&gt;Сравнение с другими интерфейсами принятия решений&lt;/h4&gt;\n&lt;p&gt;Для оценки эффективности предложенного метода авторы сравнивают его с генеративным обучением с учителем (SFT) на базе модели Qwen3.5. Базовая модель использует LoRA (ранг 16), взвешивание сцен и трёхэпоховый цикл обучения. В качестве альтернатив рассматриваются классификатор на основе скалярной головы (для 0,8B) и метод прямого указателя (direct-Qwen pointer), который оценивает кандидатов без инициализации Kev. Тестирование проводилось на одной видеокарте RTX 3090 с использованием точности BF16 для основных вычислений и FP32 для адаптеров и голов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — метод дообучения нейросети на размеченных данных для выполнения конкретной задачи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки производительности измерялись задержка (latency) при обработке одного запроса, пропускная способность (Q/s) и пиковое потребление памяти. Короткие входные данные ограничены 512 токенами, длинные — от 2048 до 8192 токенов. При точности FP32 генеративный SFT достигает точности 90,02% (0,8B) и 94,35% (4B), в то время как SecJev показывает 90,34% и 94,51% соответственно. В задачах с балансировкой классов SecJev также демонстрирует преимущество (88,00% против 87,79% у SFT для 0,8B).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SecJev превосходит генеративные методы по точности, одновременно снижая пиковое потребление памяти (с 3,52 до 2,56 GiB для 0,8B и с 12,58 до 10,18 GiB для 4B).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ скорости показал, что SecJev работает быстрее генеративного подхода: задержка при обработке коротких и длинных последовательностей ниже на 2–7% в зависимости от размера модели. При этом SecJev обеспечивает сопоставимую пропускную способность (4,33 вопроса/с для 0,8B). Подробные результаты по различным наборам данных (AgentDojo, CICIoT2023, LANL и др.) приведены в таблицах, где SecJev стабильно показывает более высокие показатели макро-точности по сравнению с базовыми методами инициализации.&lt;/p&gt;\n&lt;h4 id=\"perenos-na-smezhnye-dannye-bezopasnosti\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#perenos-na-smezhnye-dannye-bezopasnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Перенос на смежные данные безопасности&lt;/span&gt;&lt;/a&gt;Перенос на смежные данные безопасности&lt;/h4&gt;\n&lt;p&gt;Исследователи протестировали способность моделей адаптироваться к новым задачам: классификации инъекций и доверительных границ (BIPIA) и идентификации сетевых соединений (IoT-23). Для BIPIA использовалось 600 вопросов по 150 контекстам, для IoT-23 — 1000 соединений из четырех новых выборок. SecJev-4B/9B сравнивались с моделями Kev и генеративным базовым решением. SecJev-4B показал точность 72,00% на BIPIA, превзойдя Kev (50,17%) и генеративную модель (54,33%). В задачах IoT-23 точность SecJev-4B составила 65,10% против 50,00% у Kev, при этом SecJev продемонстрировал более высокую полноту (&lt;a href=\"concepts/recall.html\"&gt;recall&lt;/a&gt;) — 96,60%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SecJev-4B демонстрирует более высокую точность и полноту при переносе на новые наборы данных по сравнению с моделями Kev и генеративными аналогами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Полнота (recall) — способность модели находить все релевантные случаи (например, все атаки), а FPR (&lt;a href=\"concepts/false-positive-rate.html\"&gt;false positive rate&lt;/a&gt;) — доля ложных срабатываний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"smysl-voprosov-i-poryadok-variantov-otvetov\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#smysl-voprosov-i-poryadok-variantov-otvetov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Смысл вопросов и порядок вариантов ответов&lt;/span&gt;&lt;/a&gt;Смысл вопросов и порядок вариантов ответов&lt;/h4&gt;\n&lt;p&gt;Авторы оценили устойчивость моделей к изменению формулировок (парафразированию) и перестановке вариантов ответов. Использовалось 1400 пар парафразированных вопросов и 500 пар с измененным порядком ответов для пяти задач. Точность моделей при парафразировании снижалась на 0,07–0,93 процентных пункта, а при перестановке вариантов — от −0,80 до +0,40 пункта. Согласованность ответов (доля случаев, когда модель дает одинаковый ответ на исходный и измененный вопрос) составила 95,36–98,36% для парафразов и 97,40–98,80% для перестановок.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели сохраняют высокую стабильность решений при изменении формы подачи вопроса, несмотря на небольшие колебания в итоговой точности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"cennost-obshej-inicializacii-reshenij\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#cennost-obshej-inicializacii-reshenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ценность общей инициализации решений&lt;/span&gt;&lt;/a&gt;Ценность общей инициализации решений&lt;/h4&gt;\n&lt;p&gt;Сравнивалась эффективность обучения модели 0,8B с использованием адаптеров Kev и при обучении «с нуля» на базе Qwen3.5. Инициализация через Kev позволила достичь точности 90,34% против 88,17% при прямом обучении. Хотя общий прирост составил 2,17 процентных пункта, эффективность зависит от типа задачи: прямое обучение лучше справляется с классификацией обновлений и действиями на границах, тогда как инициализация Kev эффективнее в задачах анализа манипуляций с транспортными средствами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены в рамках фиксированного бюджета обучения (три эпохи), что ограничивает возможность оценки долгосрочной сходимости моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sohranenie-obshih-sposobnostej-i-uverennost-modeli\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#sohranenie-obshih-sposobnostej-i-uverennost-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сохранение общих способностей и уверенность модели&lt;/span&gt;&lt;/a&gt;Сохранение общих способностей и уверенность модели&lt;/h4&gt;\n&lt;p&gt;Исследователи оценили, насколько модель сохраняет свои общие навыки после обучения безопасности, используя два набора тестов Kev (Таблица 8). Тесты на общие решения включали примеры, исключенные из обучающей выборки, а тесты на перенос знаний — новые источники и типы правил. Точность принятия общих решений изменилась не более чем на 0,50 процентных пункта. Показатель переноса знаний для модели 0,8B снизился с 68,45% до 66,01%, при этом для моделей большего размера изменения не превысили 0,46 пункта. Для модели 0,8B доверительный интервал (95%) составил [−4,73, −0,15], тогда как для остальных моделей интервалы включают ноль.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обучение безопасности практически не влияет на общие навыки модели, за исключением небольшого снижения точности переноса знаний у самой компактной модели (0,8B).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поскольку интерфейс возвращает вероятности, авторы проанализировали качество уверенности модели. Масштабирование температуры (temperature scaling) улучшило показатель отрицательного логарифмического правдоподобия (NLL) для всех размеров моделей (Таблица 9), однако показатели оценки Брайера (Brier score) и ожидаемой ошибки калибровки (ECE) ухудшились. Например, для модели 9B значение NLL снизилось с 0,364 до 0,355, а ECE выросло с 1,53% до 2,48%. Это объясняется тем, что оптимизация проводилась именно по метрике NLL. Использование фиксированной температуры безопасности улучшило показатели на общих наборах тестов, но не восстановило качество уверенности до исходного уровня.&lt;/p&gt;\n&lt;h4 id=\"validnost-dannyh-i-tipy-oshibok\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#validnost-dannyh-i-tipy-oshibok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Валидность данных и типы ошибок&lt;/span&gt;&lt;/a&gt;Валидность данных и типы ошибок&lt;/h4&gt;\n&lt;p&gt;Проверка 170 185 вопросов не выявила нарушений схемы или ошибок в метках кандидатов. Повторный расчет 37 490 ответов на основе политик показал полное совпадение с исходными данными. Два независимых эксперта оценили 280 вопросов (по 20 на задачу), достигнув согласия в 261 случае (93,21%).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка Брайера и ECE измеряют, насколько предсказанная моделью вероятность события соответствует его реальной частоте; чем ниже эти показатели, тем лучше откалибрована модель.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперты полностью совпали с метками корпуса во всех 180 вопросах, касающихся инструментов и явных политик. В 100 вопросах, основанных на источниках, эксперты согласились в 81 ответе, признав имеющиеся доказательства достаточными в 28 случаях. Это подтверждает интерпретируемость надзора, однако указывает, что основная неопределенность возникает при попытке вывода аннотаций источников из неполных наблюдений.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;SecJev интегрирует экспертные знания в области безопасности в модели принятия решений System One через четыре специализированные модели с унифицированным типизированным интерфейсом. Обучение на 14 задачах повысило эффективность каждой модели, позволив SecJev-0.8B превзойти общую модель Kev-9B. Семейство моделей объединяет прогнозирование меток источников и оценку явных политик, достигая точности генерации ответов, сопоставимой с аналогами, при меньшем пиковом потреблении памяти и успешном переносе навыков на новые группы источников. Инициализация на общих данных также улучшила показатели модели 0.8B по сравнению с обучением только на данных безопасности. Оценка с учетом условий вопроса позволяет модели выносить различные суждения по одним и тем же доказательствам. Корпус SecJev-Corpus обеспечивает надзор в сфере безопасности, связывая эти суждения с аннотациями источников и правилами политик.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель SecJev-0.8B превосходит Kev-9B в задачах безопасности, демонстрируя высокую точность при меньшем потреблении памяти.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;p&gt;SecJev оценивает конечные решения на основе предоставленных наблюдений. Аннотации захвата и экспериментов могут зависеть от информации вне конкретного входного сигнала, поэтому эти задачи измеряют прогнозирование меток источников. Задачи по политикам оценивают применение отображаемого правила. Предотвращение атак и автономное реагирование требуют отдельной оценки при развертывании. 14 задач имеют разную сложность: показатели по политикам близки к идеальным, тогда как точность сообщений о транспортных средствах ниже. Макро-средние по задачам взвешивают их равнозначно. Границы групп учитывают специфические зависимости, однако остаточное семантическое перекрытие и перенос за пределы протестированных источников остаются открытыми вопросами. Человеческая проверка выявила расхождения в задачах с метками источников, где телеметрия дает неполные доказательства. Основные результаты точности используют FP32 для малых моделей и BF16 для 9B; сравнение эффективности проводилось при одинаковой точности. Каждое условие обучения выполнено в одном прогоне, а вариативность случайных семян не измерялась.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели не являются автономными системами защиты: они оценивают данные, но не заменяют человеческий контроль в критических сценариях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo-f1.jpg\" alt=\"Рисунок 1: Общий путь принятия решений и адаптация безопасности SecJev.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Общий путь принятия решений и адаптация безопасности SecJev.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Общий путь принятия решений и адаптация безопасности SecJev. Аннотации источников и явные политики предоставляют запросы и цели. Единая магистральная сеть (backbone) с послойными адаптерами LoRA формирует маркеры решений и состояния конечных кандидатов; указательная головка (pointer head) оценивает кандидатов для получения типизированных выходных данных. Сплошные линии обозначают прямое распространение вычислений во время обучения и вывода. Серые пунктирные линии передают эталонные метки и логиты для кросс-энтропии с учетом весов сцены; коралловые пунктирные линии обновляют только LoRA и головку, оставляя магистральную сеть замороженной. Инициализация общих решений использует официальные модели Kev для 0.8B/4B/9B и нашу предварительно обученную модель 2B.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;автоматизация&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анализа угроз&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FCF97\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обучение&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;моделей SecJev&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;на корпусе&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;данных&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A9D8F\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;рост точности&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;на 20&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;процентов&lt;/text&gt;&lt;path stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A9D8F\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/p
