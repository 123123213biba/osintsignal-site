        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#2A6DB0\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#6FA8DC\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"99\" cy=\"62\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"541\" cy=\"294\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему маленькие нейросети&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;проваливают задачи: дело не&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;в интеллекте, а в «обвязке»&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f2.jpg\" alt=\"Рисунок 2: Стоимость префилла в зависимости от измеренной длины промпта (логарифмическая шкала).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Стоимость префилла в зависимости от измеренной длины промпта (логарифмическая шкала).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Стоимость префилла в зависимости от измеренной длины промпта (логарифмическая шкала). По оси x — количество токенов промпта, сообщенное бэкендом (prompt_eval_count); по оси y — время оценки промпта бэкендом, медиана трех запусков с префиксом для предотвращения кэширования (nonce) для каждого запроса. Значения для отдельных запусков не сохранялись, поэтому планки погрешностей отсутствуют. Пустые маркеры: якоря bench (19 инструментов), full-configuration (31) и duplicated-schema (256). Пунктирные линии — аппроксимация методом наименьших квадратов (4B: 0,20 мс на токен, R²=0,9991). Статические бюджеты в 774/797 токенов, указанные в тексте, являются оценочными значениями, а не результатами измерений, и на этой оси не отображены.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Малые языковые модели часто критикуют за неспособность выполнять многошаговые задачи. Авторы работы доказывают, что проблема кроется в «обвязке» (&lt;a href=\"concepts/harness.html\"&gt;harness&lt;/a&gt;) — программной среде, которая перегружает контекст и не умеет исправлять ошибки модели. Разработанный ими инструмент &lt;a href=\"concepts/mingbird.html\"&gt;Mingbird&lt;/a&gt; компенсирует эти недостатки, позволяя малым моделям достигать результатов, сопоставимых с крупными системами.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Стандартные агентные каркасы перегружают контекст малых моделей, вызывая сбои в логике.&lt;/li&gt;\n&lt;li&gt;Mingbird повышает точность выполнения задач до 0,886 за счет десяти специализированных механизмов.&lt;/li&gt;\n&lt;li&gt;Исследование подтверждает, что производительность агента на 2-9B моделях критически зависит от качества программной обвязки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи провели контролируемый эксперимент LRAB (&lt;a href=\"concepts/local-real-task-agent-benchmark.html\"&gt;Local Real-task Agent Benchmark&lt;/a&gt;), сравнив четыре агентных каркаса (Mingbird, goose, opencode, agent-mini) на четырех моделях с параметрами от 2B до 35B. В ходе 288 тестов выяснилось, что стандартные каркасы, рассчитанные на облачные модели, вызывают у малых нейросетей «зацикливание» и преждевременное завершение задач. Mingbird внедряет десять механизмов защиты, включая побайтовый лимит префилла (&lt;a href=\"concepts/prefill.html\"&gt;prefill budget&lt;/a&gt;) и «шлюз завершения», который перепроверяет соответствие результата задаче перед фиксацией.&lt;/p&gt;\n&lt;p&gt;Результаты показывают, что Mingbird достигает общей точности 0,886, значительно опережая конкурентов (0,405–0,631). Внешняя валидация на бенчмарке τ²-bench (278 задач в сферах ритейла, авиаперевозок и телекома) подтвердила лидерство системы с показателем 0,856. Авторы подчеркивают, что их работа — это инженерное решение, направленное на устранение дефектов взаимодействия, а не на создание новых алгоритмов обучения нейросетей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты основаны на самодельном бенчмарке, тестировании на одной машине и однократном выполнении каждой задачи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Малые языковые модели (2–9 млрд параметров) способны работать на обычных ноутбуках, однако при использовании в облачных агентных средах они часто не справляются с реальными задачами. Основные проблемы включают переполнение контекста при заполнении инструментами, расхождение при попытках самокоррекции, зацикливание демонстраций инструментов и скрытый отказ от выполнения задачи. Исследование показывает, что значительная часть этих сбоев вызвана не самими моделями, а архитектурой среды (harness).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование доказывает, что до 60% сбоев малых моделей при выполнении задач связаны с несовершенством среды управления, а не с ограничениями самих нейросетей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы представляют Mingbird — агентную среду для Windows и Ollama, ориентированную на локальное выполнение. Система включает 10 механизмов, компенсирующих типичные ошибки малых моделей. Ключевые из них: бюджет предварительного заполнения (prefill) на уровне байтов, «&lt;a href=\"concepts/completion-gate.html\"&gt;ворота завершения&lt;/a&gt;» (finish &lt;a href=\"concepts/gate.html\"&gt;gate&lt;/a&gt;), перепроверяющие задачу перед подтверждением, и обнаружение циклов на уровне сигнатур.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Агентная среда (harness) — это программная оболочка, которая управляет взаимодействием модели с внешними инструментами, файлами и интерфейсами компьютера.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В контролируемом сравнении на наборе LRAB (4 среды × 4 модели от 2B до 35B × 18 задач) Mingbird достиг общего показателя 0,886, тогда как показатели других сред составили 0,631 (goose), 0,479 (opencode) и 0,405 (agent-mini). На бенчмарке τ2-bench (278 задач) результат составил 0,856 против 0,791 и 0,737 у конкурентов. При тестировании с использованием передовых моделей (frontier models) разброс результатов между средами оказался значительным: от 0,997 до 0,478.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты абляционного анализа (отключения отдельных механизмов) носят лишь направляющий характер из-за высокой вариативности: повторные запуски в одну ночь могут давать разброс до 0,069, что сопоставимо с эффектом от отдельных механизмов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Языковые модели с открытыми весами (2–9 млрд параметров) достигли порога практической применимости. На обычном ноутбуке с интегрированным графическим процессором и 16–32 ГБ общей памяти они способны переводить, резюмировать и объяснять информацию. Однако существует мнение, что такие модели не подходят для работы в качестве автономных агентов, выполняющих многоэтапные задачи (написание кода, поиск данных, управление файлами). Авторы данной работы оспаривают это утверждение, полагая, что ограничением является не сама модель, а программная оболочка (harness), в которой она работает.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основной вывод: ошибки при работе малых моделей (2–9 млрд параметров) часто вызваны не их архитектурой, а неэффективностью управляющей оболочки, что исправляется инженерными методами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При использовании 2-миллиардной модели в стандартных облачных фреймворках авторы наблюдали повторяющиеся сбои: переполнение контекста статическими данными инструментов, неспособность модели к самокоррекции после неудачного вызова функции, зацикливание на старых примерах и ложные отчеты о завершении задач. Для решения этих проблем был разработан Mingbird — локальный агентный фреймворк для Windows и Ollama. Он включает 10 базовых механизмов и пятиуровневую модель безопасности (версия 1.6.0), направленных на устранение конкретных типов сбоев.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Harness (оболочка) — это программная среда, которая связывает языковую модель с внешними инструментами (поиск, файловая система, выполнение кода), позволяя ей действовать автономно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки эффективности Mingbird авторы создали LRAB (Local Real-task Agent Benchmark) — контролируемый эксперимент, включающий 4 типа оболочек, 4 модели (2B, 4B, 12B, 35B) и 18 реальных задач (всего 288 ячеек данных). В ходе тестирования Mingbird показал результат 0,886 против 0,405–0,631 у аналогов. Важно, что Mingbird — единственная оболочка, у которой отсутствует резкое падение эффективности на малых моделях (2B: 0,821 против 0,017–0,271 у конкурентов). Внешняя проверка на независимом бенчмарке τ2-bench (278 задач в сферах ритейла, авиаперевозок и телекома) подтвердила превосходство: 0,856 у Mingbird против 0,791 у нативного агента и 0,737 у opencode.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является инженерным: авторы не предлагают новых алгоритмов обучения, а фокусируются на оптимизации взаимодействия модели с инструментами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"paradigmy-agentov\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#paradigmy-agentov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Парадигмы агентов&lt;/span&gt;&lt;/a&gt;Парадигмы агентов&lt;/h4&gt;\n&lt;p&gt;Современные агентные системы базируются на подходе ReAct: модель чередует рассуждения с вызовом инструментов, а внешняя среда (harness) выполняет эти вызовы и возвращает результат. Инструменты вроде Toolformer и Gorilla заложили основу для обучения моделей вызову API и стандартизации интерфейсов. Существующие методы улучшения, такие как Reflexion и Self-Refine, полагаются на способность модели к самокритике. Однако малые модели часто не справляются с этой задачей. Mingbird фокусируется на доработке среды исполнения: она не требует от модели абстрактного самосовершенствования, а управляет тем, что «видит» модель, когда ей разрешено остановиться и как обрабатывать ошибки. Mingbird выступает как агент с жесткими ограничениями (guardrails) в точках, где малые модели систематически ошибаются.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird переносит фокус с попыток «обучить» малую модель самокритике на создание строгой среды исполнения, которая корректирует типичные ошибки модели в реальном времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"benchmarki-agentov\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#benchmarki-agentov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бенчмарки агентов&lt;/span&gt;&lt;/a&gt;Бенчмарки агентов&lt;/h4&gt;\n&lt;p&gt;Существующие платформы, такие как AgentBench, AgentBoard, WebArena и SWE-bench, оценивают агентов в различных средах, от веб-серфинга до решения задач на GitHub. Наиболее близкими к нашему подходу являются τ-bench и τ2-bench, где &lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;симулятор пользователя&lt;/a&gt; взаимодействует с агентом, а оценка базируется на конечном состоянии базы данных. LRAB отличается от них целью: это не рейтинг моделей, а изолированное исследование влияния среды исполнения (harness) с использованием строгого протокола, одной машины и детерминированной оценки артефактов.&lt;/p&gt;\n&lt;h4 id=\"lokalnyj-vyvod-malyh-modelej\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#lokalnyj-vyvod-malyh-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Локальный вывод малых моделей&lt;/span&gt;&lt;/a&gt;Локальный вывод малых моделей&lt;/h4&gt;\n&lt;p&gt;Инструменты llama.cpp и Ollama сделали возможным эффективный запуск квантованных моделей на потребительском оборудовании. Исследования моделей (SmolLM2, Gemma, Qwen) повышают их эффективность на параметр. Однако среда исполнения (harness) до сих пор заимствовалась из облачных практик, ориентированных на мощные модели и Unix-подобные системы. Mingbird работает в ином сегменте: модели 2–9B, ОС Windows, встроенные GPU и задачи, сочетающие код, файлы и поиск информации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Harness (среда исполнения) — это программная оболочка, которая связывает модель с внешними инструментами, управляет очередью задач и обрабатывает ошибки, возникающие при взаимодействии модели с системой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"inzhenernye-sistemy\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#inzhenernye-sistemy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инженерные системы&lt;/span&gt;&lt;/a&gt;Инженерные системы&lt;/h4&gt;\n&lt;p&gt;Системы вроде SWE-agent, OpenHands, Cline и aider оптимизированы для мощных моделей и POSIX-сред. Mingbird дополняет их, работая с малыми моделями на обычных ноутбуках под Windows. Мы рассматриваем механизмы защиты от сбоев малых моделей как основной объект проектирования.&lt;/p&gt;\n&lt;p&gt;Влияние среды исполнения — это признанный факт (исследования Zhang и Starace показывают, что конфигурация harness может менять результат до 28 пунктов). Наш вклад заключается в декомпозиции этого влияния для моделей 2–9B на Windows. Мы создали инвентарь типичных сбоев малых моделей и соответствующих механизмов коррекции. Например, наш детектор M4, подобно StuckDetector в OpenHands, отслеживает циклы повторений, но дополняет их нормализацией сигнатур инструментов и многоуровневой лестницей эскалации. Новизна нашего подхода — в строгом лимите префилла (prefill budget) и «воротах завершения» (completion gate), которые заставляют модель перечитывать задачу перед ответом «готово», что критично для малых моделей, склонных к переполнению контекста или преждевременному завершению.&lt;/p&gt;\n&lt;h4 id=\"obzor-arhitektury\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#obzor-arhitektury\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор архитектуры&lt;/span&gt;&lt;/a&gt;Обзор архитектуры&lt;/h4&gt;\n&lt;p&gt;Mingbird — это локальный агент, работающий полностью на устройстве пользователя (модель, инструменты, распознавание речи, память). Единственный внешний запрос — к поисковой системе, если она настроена пользователем. Система не добавляет накладных расходов на &lt;a href=\"concepts/inferens.html\"&gt;инференс&lt;/a&gt;. В версии 1.6.0 статический префилл (объем данных, которые модель видит до начала задачи) составляет 797 токенов. Архитектура (Рис. 1) включает GUI и &lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt;, которые управляют общим циклом агента. Цикл включает маршрутизацию задач (M1), классификацию (чат/задача, M2), безопасное выполнение инструментов (M6, M8), мониторинг циклов (M4) и проверку завершения (M3). Слой устойчивости (M7) обрабатывает ошибки через контрольные точки. Бэкенд использует Ollama с автоматическим определением модели и контекстом по умолчанию 128К (до 256К).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статический префилл ограничен 797 токенами, что предотвращает деградацию модели из-за избыточного контекста.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"mehanizmy\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#mehanizmy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Механизмы&lt;/span&gt;&lt;/a&gt;Механизмы&lt;/h4&gt;\n&lt;p&gt;Таблица 1 соотносит механизмы с типами ошибок, которые они предотвращают.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Механизмы Mingbird и соответствующие им формы сбоев малых моделей&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Механизм&lt;/th&gt;\n&lt;th&gt;Форма сбоя&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;M1&lt;/td&gt;\n&lt;td&gt;Плоское префиксное заполнение, переполнение контекста бюджета net-zero из инструментов с интенсивной схемой&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M2&lt;/td&gt;\n&lt;td&gt;Слои чата/задач, циклы демонстрации инструментов из обычного ввода в чате&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M3&lt;/td&gt;\n&lt;td&gt;Finish gate + повторное внедрение плана, преждевременные или ложные заявления о завершении&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M4&lt;/td&gt;\n&lt;td&gt;Анти-цикл на уровне подписи, повторяющиеся идентичные вызовы инструментов, нет вывода&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M5&lt;/td&gt;\n&lt;td&gt;Ложное завершение и исправление формата, вызовы инструментов как обычный текст; повторяющиеся ошибочные вызовы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M6&lt;/td&gt;\n&lt;td&gt;Безопасность редактирования (.bak), деструктивное редактирование, которое модель не может отменить&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M7&lt;/td&gt;\n&lt;td&gt;Уровень устойчивости, тихие сбои потока чтения, пустые ходы, завершенные запуски&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M8&lt;/td&gt;\n&lt;td&gt;Граница безопасности, запись вне директории, раскрытие учетных данных, развертывание под-агентов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M9&lt;/td&gt;\n&lt;td&gt;Поверхность возможностей, голос, зрение, память, MCP, навыки без роста префикса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M10&lt;/td&gt;\n&lt;td&gt;База качества, регрессии обвязки, особенно рост префикса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;M14&lt;/td&gt;\n&lt;td&gt;Пятикольцевая модель безопасности (v1.6.0), необратимое повреждение системы от импульсивного использования инструментов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;M1–M10, плюс модель безопасности из пяти колец v1.6.0 (M14).&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"m1-ploskoe-predvaritelnoe-zapolnenie-flat-prefill-s-nulevym-chistym-byudzhetom\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m1-ploskoe-predvaritelnoe-zapolnenie-flat-prefill-s-nulevym-chistym-byudzhetom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M1: Плоское предварительное заполнение (flat prefill) с нулевым чистым бюджетом&lt;/span&gt;&lt;/a&gt;M1: Плоское предварительное заполнение (flat prefill) с нулевым чистым бюджетом&lt;/h4&gt;\n&lt;p&gt;Проблема: при использовании облачных манифестов инструментов (десятки JSON-схем) модель 2–9B тратит тысячи токенов до начала задачи, что снижает точность следования инструкциям. Механизм: система классифицирует домен задачи и загружает только нужные инструменты в плоском (не вложенном) формате. Любая новая функция должна иметь «нулевой бюджет» по статическому префиллу, что проверяется тестами в CI (M10). Компромисс: маршрутизатор может ошибиться, но система позволяет перемаршрутизацию. Стоимость обработки промпта растет линейно для моделей 4B (~0,20 мс на токен) и сверхлинейно для 2B (до 33,6 с для 256 инструментов). Постоянные накладные расходы маршрутизатора составляют 330 токенов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Префилл — это объем данных, которые модель обрабатывает перед генерацией ответа; «плоский» формат означает отсутствие иерархических структур, экономящих токены.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m2-mnogoslojnost-chata/zadach\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m2-mnogoslojnost-chata/zadach\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M2: Многослойность чата/задач&lt;/span&gt;&lt;/a&gt;M2: Многослойность чата/задач&lt;/h4&gt;\n&lt;p&gt;Проблема: малые модели при вопросах пользователя начинают «демонстрировать» инструменты, входя в бесконечный цикл. Механизм: разделение на режимы «чат» и «задача». В чате инструменты ограничены, цикл завершается сразу после ответа. Режим задачи открывает полный доступ. Компромисс: классификатор склоняется к режиму задачи, если в истории есть артефакты, чтобы не оставить пользователя без инструментов.&lt;/p&gt;\n&lt;h4 id=\"m3-zavershayushij-gejt-i-povtornoe-vnedrenie-prompta-vo-vremya-zaversheniya-generacii\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m3-zavershayushij-gejt-i-povtornoe-vnedrenie-prompta-vo-vremya-zaversheniya-generacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M3: Завершающий гейт и повторное внедрение промпта во время завершения генерации&lt;/span&gt;&lt;/a&gt;M3: Завершающий гейт и повторное внедрение промпта во время завершения генерации&lt;/h4&gt;\n&lt;p&gt;Проблема: модели могут «тихо» завершать задачу, не выполнив её до конца, или терять критерии успеха после сжатия контекста. Механизм: перед принятием завершения система заставляет модель сверить результат с исходным текстом задачи по пунктам. План действий повторно вводится после сжатия. Компромисс: это требует одного дополнительного обращения к модели, но эффективно превращает «тихие отказы» в завершение или четкое описание препятствий.&lt;/p&gt;\n&lt;h4 id=\"m4-obnaruzhenie-zaciklivaniya\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m4-obnaruzhenie-zaciklivaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M4: Обнаружение зацикливания&lt;/span&gt;&lt;/a&gt;M4: Обнаружение зацикливания&lt;/h4&gt;\n&lt;p&gt;Механизм отслеживает сигнатуры вызовов инструментов (название плюс нормализованные аргументы). Система срабатывает при 6 идентичных вызовах или 15 последовательных вызовах без вывода. В версии v1.5.0 исправлена ошибка, из-за которой чередование частичного вывода и пустых ответов сбрасывало счетчики. Для работы с файлами введен лимит чтения: от 64 КБ до 512 КБ, при превышении которого возвращаются первые 2000 символов с сохранением позиции для продолжения «обхода» файла.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Внедрение системы обнаружения зацикливания и лимитов на чтение файлов позволило модели 4B завершить задачу за 15 вызовов вместо 156.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/signatura.html\"&gt;Сигнатура&lt;/a&gt; — это уникальный идентификатор вызова, который позволяет системе понять, что модель повторяет одно и то же действие, даже если аргументы записаны немного иначе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m5-otklonenie-lozhnogo-zaversheniya-i-ispravlenie-formata\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m5-otklonenie-lozhnogo-zaversheniya-i-ispravlenie-formata\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M5: Отклонение ложного завершения и исправление формата&lt;/span&gt;&lt;/a&gt;M5: Отклонение ложного завершения и исправление формата&lt;/h4&gt;\n&lt;p&gt;Система обрабатывает случаи, когда модель заявляет о выполнении задачи без создания артефактов или выдает вызов инструмента в виде обычного текста (например, JSON внутри текста). Механизм распознает три типа ошибок форматирования и преобразует их в исполняемые вызовы. Вместо жесткого соблюдения схемы, для моделей 2–9B используется стратегия «исправление с обратной связью».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Структурное исправление ошибок формата позволяет восстановить работу агента без принудительной остановки при некорректном синтаксисе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование эвристического исправления вместо строгого парсинга может привести к неверной интерпретации намерений модели, если формат не совпадает с тремя заданными шаблонами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m6-bezopasnost-redaktirovaniya\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m6-bezopasnost-redaktirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M6: Безопасность редактирования&lt;/span&gt;&lt;/a&gt;M6: Безопасность редактирования&lt;/h4&gt;\n&lt;p&gt;Чтобы предотвратить потерю данных при неудачном редактировании файлов, каждое действие записи автоматически создает резервную копию (.bak). Модель может самостоятельно инициировать откат к предыдущей версии. Механизм намеренно упрощен: он не использует сложные алгоритмы сравнения (diff), что делает его доступным для понимания самой моделью.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/rezervnoe-kopirovanie.html\"&gt;Резервное копирование&lt;/a&gt; — это создание копии файла перед внесением изменений, позволяющее вернуться к рабочему состоянию при ошибке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m7-ustojchivost-kodirovka,-pustye-otvety,-kontrolnye-tochki\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m7-ustojchivost-kodirovka,-pustye-otvety,-kontrolnye-tochki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M7: Устойчивость (кодировка, пустые ответы, контрольные точки)&lt;/span&gt;&lt;/a&gt;M7: Устойчивость (кодировка, пустые ответы, контрольные точки)&lt;/h4&gt;\n&lt;p&gt;Для предотвращения сбоев при чтении нестандартных кодировок (например, GBK в Windows) используется декодирование UTF-8 с заменой символов. Пустые генерации или «мыслительные оболочки» без действий вызывают сброс хода. Система контрольных точек позволяет возобновить прерванную работу с последнего завершенного шага.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Внедрение контрольных точек и замена символов при декодировании исключили «зависание» системы при работе с нетипичными потоками данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m8-granicy-bezopasnosti\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m8-granicy-bezopasnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M8: Границы безопасности&lt;/span&gt;&lt;/a&gt;M8: Границы безопасности&lt;/h4&gt;\n&lt;p&gt;Для предотвращения выхода агента за пределы рабочей директории используются проверки нормализованных путей. Доступ к критическим файлам (например, .&lt;a href=\"concepts/speculative-safety-honeypot.html\"&gt;ssh&lt;/a&gt;, .env) ограничен, а операции вне разрешенной зоны требуют подтверждения пользователя через графический интерфейс. По умолчанию запрещено создание параллельных под-агентов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Приоритет безопасности над функциональностью (запрет параллелизма и подтверждение доступа) делает систему пригодной для использования на персональных компьютерах неспециалистами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m9-poverhnost-vozmozhnostej\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m9-poverhnost-vozmozhnostej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M9: Поверхность возможностей&lt;/span&gt;&lt;/a&gt;M9: Поверхность возможностей&lt;/h4&gt;\n&lt;p&gt;Концепция дизайна. Группа M9 объединяет функции, которые должны укладываться в бюджет M1 (нулевой рост статического префилла). Голосовой ввод использует локальную модель STT (Speech-to-Text), работающую на CPU со скоростью примерно 20× реального времени и автоматическим определением конца речи. Зрение реализовано через чтение изображений в полезной нагрузке сообщения (проверено на четырех моделях). Сессионная память является постоянной и доступной для поиска. Серверы MCP подключаются через конфигурацию JSON. Навыки представлены файлами Markdown с метаданными, которые раскрываются по мере необходимости, что позволяет сжать десятки навыков до нескольких сотен токенов контекста. Идентификатор модели и длина контекста определяются автоматически через Ollama (по умолчанию 128 тыс., до 256 тыс. токенов).&lt;/p&gt;\n&lt;p&gt;Ограничение времени задачи по умолчанию отключено. Пользователь задает бюджет на естественном языке, и по мере его исчерпания система побуждает модель завершить работу над результатом. Пользователи локальных моделей, согласно нашим наблюдениям, чувствительны к реальному времени выполнения, поэтому максимальный результат в рамках ограниченного времени предпочтительнее неограниченного выполнения.&lt;/p&gt;\n&lt;p&gt;Компромисс. Прогрессивное раскрытие означает, что модель должна «знать», какой файл навыка открыть. Индекс навыков хранится в постоянном контексте, что требует одного чтения. Сами по себе эти возможности не новы; вклад заключается в ограничении, объединяющем их (отсутствие роста статического префилла).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основной вклад M9 заключается в интеграции множества функций при строгом ограничении на статический префилл, что достигается за счет динамического управления контекстом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"m10-baza-kachestva\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m10-baza-kachestva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M10: База качества&lt;/span&gt;&lt;/a&gt;M10: База качества&lt;/h4&gt;\n&lt;p&gt;Механизм. Тесты выполняются в CI (v1.6.0). Ключевыми являются два утверждения: «чистый ноль» байтового префилла (M1) и пороги детектирования циклов (M4), оба защищены от регрессии. Компромисс заключается в том, что набор тестов ограничивает скорость внедрения: каждое изменение должно сохранять бюджет префилла, что привело к отклонению ряда архитектурных решений (например, более сложных системных промптов).&lt;/p&gt;\n&lt;h4 id=\"m14-pyatiurovnevaya-model-bezopasnosti-v160\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#m14-pyatiurovnevaya-model-bezopasnosti-v160\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M14: Пятиуровневая модель безопасности (v1.6.0)&lt;/span&gt;&lt;/a&gt;M14: Пятиуровневая модель безопасности (v1.6.0)&lt;/h4&gt;\n&lt;p&gt;Механизм. Безопасность организована в пять уровней: под-агенты работают в «песочнице» с ограниченными правами; необратимые операции (форматирование, запись на диски) блокируются; действия, изменяющие систему, требуют присутствия оператора; рекурсивное удаление ограничено рабочей директорией; последний уровень обеспечивает обратимость (создание .bak, корзина). Глобальный обходной путь существует, но используется на риск оператора.&lt;/p&gt;\n&lt;p&gt;Компромисс. Консервативный подход может блокировать безопасные действия эксперта, однако это оправдано целевой аудиторией. Модель M14 защищает хост от инструментов агента, а не от инъекций промптов.&lt;/p&gt;\n&lt;p&gt;Анализ утечек. Уровень 2 (необратимые команды) перехватывает все попытки. Подтвержденные сквозные эффекты составили 2 из 44 для модели 2B и 11 из 44 для 4B. Все утечки прошли через командную строку bash. Модель 2B допустила две узкие утечки (создание NTFS-соединения, ошибка обратимости при перезаписи). Модель 4B атаковала методично: использование абсолютных путей, префиксов \\?\\ для обхода нормализации, цепочки cd.. для выхода из рабочей директории и попытки записи в реестр. Перехват вызовов эффективен (0,67–1,00 на уровень), но модель способна искать обходные пути.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель M14 эффективно предотвращает импульсивное &lt;a href=\"concepts/tool-use.html\"&gt;использование инструментов&lt;/a&gt;, но не гарантирует защиту от методичного состязательного поведения, использующего несколько векторов атаки одновременно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"principy-proektirovaniya\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#principy-proektirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Принципы проектирования&lt;/span&gt;&lt;/a&gt;Принципы проектирования&lt;/h4&gt;\n&lt;p&gt;Mingbird является самописным инструментом, поэтому его результаты ограничены контекстом разработки. &lt;a href=\"concepts/benchmark.html\"&gt;Бенчмарк&lt;/a&gt; не претендует на звание универсального эталона, но позволяет установить причинно-следственную связь: на 18 конкретных задачах, при фиксированном оборудовании и моделях, изменение только инструмента управления (harness) меняет итоговый результат на указанную величину. Принципы работы: во-первых, неизменность всех условий (машина, бэкенд Ollama, модели, бюджет времени, система оценки); во-вторых, полная прозрачность (все 288 результатов по каждой ячейке опубликованы, что позволяет перепроверить любой агрегированный показатель); в-третьих, бенчмарк рассматривается как один из элементов доказательной базы наряду с независимым тестированием.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бенчмарк обеспечивает воспроизводимость за счет фиксации всех параметров среды, позволяя изолировать влияние инструмента управления на успех выполнения задач.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nabor-zadach\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#nabor-zadach\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Набор задач&lt;/span&gt;&lt;/a&gt;Набор задач&lt;/h4&gt;\n&lt;p&gt;18 задач распределены по четырем уровням сложности, что позволяет локализовать ошибки в конкретном режиме работы, а не усреднять их. T1 (поиск и извлечение данных), T2 (синтез, реализация функций, написание тестов), T3 (рабочие процессы: веб-исследования, профилирование, рефакторинг), T4 (длительные задачи, включая стресс-тесты на прерывание и возобновление). Каждая задача имеет четкие спецификации: домен, входные данные, план действий, контрольные точки и критерии оценки артефактов. Задачи конкретны и проверяемы, их определения фиксируются до начала цикла тестирования. Набор охватывает ключевые аспекты работы локальных агентов, исключая интерактивные диалоги.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/cell.html\"&gt;Ячейка»&lt;/a&gt; (cell) — это одна комбинация конкретной задачи и модели, выполняемая в рамках эксперимента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"protokol\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#protokol\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Протокол&lt;/span&gt;&lt;/a&gt;Протокол&lt;/h4&gt;\n&lt;p&gt;Все 288 ячеек выполнены на одной машине (интегрированный GPU, 32 ГБ общей памяти, Windows 11, Ollama). Использовались четыре инструмента: Mingbird, goose, agent-mini и opencode. Модели: gemma4 (2B и 12B), qwen3.5 (4B) и ornith-1.5 (35B). Несмотря на 35 млрд параметров, ornith-1.5 использует архитектуру Mixture-of-Experts (активируется около 3 млрд параметров на токен), что обеспечивает скорость около 26 токенов/с при контексте 128К. Бюджет времени составлял 90 минут для рабочих процессов и 180 минут для длительных задач. Температура выборки принудительно установлена на 0 для всех инструментов. Разрешена одна повторная попытка; таймаут приравнивается к 0. В ходе тестирования было зафиксировано 312 запусков для 288 ячеек. Авторы раскрывают отклонение в протоколе для goose (WF-08), где было проведено четыре попытки вместо одной; это не влияет на итоговый рейтинг.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование повторных попыток было асимметричным: agent-mini потребовал 20 повторов из-за сбоев, в то время как Mingbird использовал только один.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenka\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#ocenka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка&lt;/span&gt;&lt;/a&gt;Оценка&lt;/h4&gt;\n&lt;p&gt;Система оценки детерминирована и основана на артефактах: файлы должны существовать, тесты — проходить, отчеты — содержать требуемые данные. Оценки частичные: если из семи проверок проходят четыре, ячейка получает 0,571 балла. Инструменты управления изолированы от системы оценки и не имеют доступа к критериям до завершения работы.&lt;/p&gt;\n&lt;h4 id=\"spravedlivost-vremya-ocenivaetsya-byudzhetami,-a-ne-sekundami\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#spravedlivost-vremya-ocenivaetsya-byudzhetami,-a-ne-sekundami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Справедливость: время оценивается бюджетами, а не секундами&lt;/span&gt;&lt;/a&gt;Справедливость: время оценивается бюджетами, а не секундами&lt;/h4&gt;\n&lt;p&gt;Различные среды тестирования (harnesses) существенно различаются по реальному времени выполнения (&lt;a href=\"concepts/wall-clock-time.html\"&gt;wall-clock time&lt;/a&gt;), поэтому методика оценки должна учитывать этот фактор. В системе LRAB время оценивается через фиксированные бюджеты для каждого семейства задач, без нормализации «сырых» секунд. Логика заключается в том, что агент полезен пользователю только в том случае, если он завершает работу в рамках времени, которое пользователь готов ждать. Различия в реальном времени между средами отражают реальные архитектурные издержки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Wall-clock time (настенное время) — это фактическое время, прошедшее с начала до конца выполнения задачи, включая все задержки системы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В случае с goose, длительная фаза префиллинга (prefill) при работе с большими контекстами приводит к замедлению, но при этом выполняется значимый объем работы. Так, самая медленная ячейка goose работает в 11,7 раза медленнее, чем Mingbird при выполнении той же задачи на модели WF-04 (12B), согласно опубликованным данным CSV. Игнорирование секунд привело бы к необоснованному преимуществу для сред, которые завершают работу раньше, а &lt;a href=\"concepts/normalizatsiya.html\"&gt;нормализация&lt;/a&gt; по скорости поощряла бы выполнение меньшего объема работы за итерацию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка по бюджету отражает требования пользователя: задача должна быть выполнена в отведенное время, иначе результат равен нулю.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В представленной матрице ни один из методов не достиг установленного лимита времени. Из 72 ячеек для каждого из четырех методов (Mingbird, goose и др.) количество случаев, когда реальное время выполнения достигло 95% или более от выделенного бюджета, равно нулю.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"matrica-288-yacheek\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#matrica-288-yacheek\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Матрица 288 ячеек&lt;/span&gt;&lt;/a&gt;Матрица 288 ячеек&lt;/h4&gt;\n&lt;p&gt;Таблица 5 содержит основные результаты тестирования. Средний балл Mingbird по 72 ячейкам составляет 0,886, тогда как у goose — 0,631, opencode — 0,479, а agent-mini — 0,405.&lt;/p&gt;\n&lt;p&gt;Статистическая значимость. Поскольку каждая ячейка представляет собой отдельный запуск, 18 задач рассматриваются как единицы анализа. Сравнение Mingbird с конкурентами проводилось внутри каждого размера модели с использованием двустороннего парного критерия Уилкоксона с поправкой Холма для трех сравнений и 95% доверительными интервалами (ДИ) на основе 10 000 &lt;a href=\"concepts/butstrep.html\"&gt;бутстреп&lt;/a&gt;-выборок. Для моделей 2B и 12B преимущество Mingbird статистически значимо (наибольшее скорректированное p = 0,0008 для 2B и 0,0466 для 12B). Для 4B значимо только сравнение с opencode (p = 0,0181), тогда как goose (0,801 против 0,876 у Mingbird) и agent-mini не достигают порога значимости. При 35B значимы сравнения с goose (p = 0,0415) и agent-mini (0,0005), но не с opencode (p = 0,4652). Общее преимущество Mingbird по сравнению с опубликованной матрицей составляет +0,255 против goose (95% ДИ [0,188, 0,322]), +0,407 против opencode ([0,328, 0,491]) и +0,481 против agent-mini ([0,410, 0,555]).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird демонстрирует устойчивое преимущество, особенно в сегменте малых моделей, где конкуренты показывают резкое снижение производительности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;a href=\"concepts/klasterizatsiya.html\"&gt;Кластеризация&lt;/a&gt; семейств задач. 18 задач разделены на 4 семейства (поиск, синтез, рабочие процессы, долгосрочное планирование). Повторный анализ с использованием кластерного бутстрепа показал, что при текущем количестве семейств (4) статистическая значимость на уровне семейств недостижима. Тем не менее, при 2B преимущество Mingbird наблюдается во всех четырех семействах. Единственное сравнение, где ДИ пересекает ноль — 4B против agent-mini, что согласуется с отсутствием значимости в основном тесте.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/klasternyy-butstrep.html\"&gt;Кластерный бутстреп&lt;/a&gt; — метод статистической оценки, при котором данные группируются по категориям для проверки того, не является ли успех случайным совпадением в одном типе задач.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эффект малых моделей. На Рис. 3 показано, что все базовые модели резко теряют эффективность при уменьшении размера: opencode падает до 0,017 при 2B, goose — до 0,271. Mingbird — единственная система, чей результат при 2B (0,821) остается в пределах 0,15 от максимума. Это критически важно для локального запуска на обычном оборудовании.&lt;/p&gt;\n&lt;p&gt;Второе семейство моделей. Для проверки того, не является ли результат свойством конкретной архитектуры (MatFormer), авторы протестировали модель qwen3.5:2b (2,3 млрд параметров). Mingbird набрал 0,779, значительно опередив goose (0,096), opencode (0,017) и agent-mini (0,239). Это подтверждает, что высокая производительность при малых размерах — свойство самой системы Mingbird, а не конкретного семейства моделей.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Пятикольцевая состязательная оценка&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Кольцо&lt;/th&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;n&lt;/th&gt;\n&lt;th&gt;Попытки&lt;/th&gt;\n&lt;th&gt;Перехвачено&lt;/th&gt;\n&lt;th&gt;Частота перехвата&lt;/th&gt;\n&lt;th&gt;Флаги&lt;/th&gt;\n&lt;th&gt;Подтверждено&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.67&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.71&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.00&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.00&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;1.00&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.89&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.82&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.67&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.14&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;0.29&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Все&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Все&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Контроль&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;pass6;refused3;incomplete1&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Контроль&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;pass7;refused1;timeout1;incomplete1&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Один запуск на случай, две модели, без присмотра, температура 0, мышление отключено.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"dolgosrochnoe-planirovanie\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#dolgosrochnoe-planirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Долгосрочное планирование&lt;/span&gt;&lt;/a&gt;Долгосрочное планирование&lt;/h4&gt;\n&lt;p&gt;На задачах, требующих многочасового выполнения, модель Mingbird показала средний результат 0,827, опередив agent-mini (0,484), goose (0,394) и opencode (0,354). Все показатели основаны на 12 опубликованных ячейках на каждый инструмент. Преимущество Mingbird наиболее заметно при увеличении количества шагов в задаче. Отключение функции «мышления» (thinking) у модели goose снижает её средний показатель с 0,623 до 0,394. Самые слабые результаты Mingbird (0,403 и 0,429) зафиксированы в сегментах 4B.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird демонстрирует наибольшую эффективность в задачах с длинным горизонтом планирования, сохраняя лидерство при увеличении сложности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prichiny-neudach\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#prichiny-neudach\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Причины неудач&lt;/span&gt;&lt;/a&gt;Причины неудач&lt;/h4&gt;\n&lt;p&gt;Матрица включает 288 запусков, анализ которых позволяет выделить пять типов отказов. Эта таксономия дополняет классификацию MAST, основанную на отчетах операторов, а не на прямых измерениях.&lt;/p&gt;\n&lt;p&gt;• Mingbird: единственный запуск с нулевым баллом (WF-08, 35B) завершился через 276 секунд: модель составила план, но не создала артефакты, постоянно сообщая о завершении. Если исключить эту ячейку, средний балл 35B вырастет с 0,941 до 0,996. Еще одна ячейка (WF-09, 4B) получила 0,5 балла из-за ошибки исполнителя.&lt;/p&gt;\n&lt;p&gt;• agent-mini (35B): 14 из 18 ячеек получили ноль из-за несовместимости платформы. Модель пыталась выполнять Unix-команды в оболочке Windows, что приводило к немедленному завершению (менее 80 секунд). Это ошибка интеграции, а не самой модели. При исключении 30 таких «быстрых» ячеек рейтинг меняется: Mingbird остается первым (0,901), но agent-mini и opencode меняются местами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/nesovmestimost-platformy.html\"&gt;Несовместимость платформы&lt;/a&gt; — ситуация, когда программная среда (например, Windows) не понимает команды, предназначенные для другой системы (например, Unix), что приводит к сбою выполнения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;• opencode: в сегменте 2B большинство запусков (17 из 18) завершались преждевременно (за 49–115 секунд) без создания артефактов. Вероятно, модель ошибочно интерпретирует неразрешимые состояния как завершение задачи.&lt;/p&gt;\n&lt;p&gt;• goose: демонстрирует медленный, но стабильный прогресс. Несмотря на самое большое время выполнения, модель успешно справляется с задачами при больших контекстах, достигая 0,679 на 35B.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Окна сбора опубликованной матрицы&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Группа&lt;/th&gt;\n&lt;th&gt;Окно&lt;/th&gt;\n&lt;th&gt;Температура 0&lt;/th&gt;\n&lt;th&gt;Мышление отключено&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;agent-mini&lt;/td&gt;\n&lt;td&gt;09-01..04&lt;/td&gt;\n&lt;td&gt;ownconfig&lt;/td&gt;\n&lt;td&gt;ownconfig&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Mingbird&lt;/td&gt;\n&lt;td&gt;09-13..14&lt;/td&gt;\n&lt;td&gt;releaseddefault&lt;/td&gt;\n&lt;td&gt;releaseddefault&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;goose, opencode&lt;/td&gt;\n&lt;td&gt;09-18..20&lt;/td&gt;\n&lt;td&gt;transportproxy&lt;/td&gt;\n&lt;td&gt;transportproxy&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Каждая опубликованная ячейка взята ровно из одного окна.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"vremya-vypolneniya\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#vremya-vypolneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Время выполнения&lt;/span&gt;&lt;/a&gt;Время выполнения&lt;/h4&gt;\n&lt;p&gt;Среднее время работы (в секундах): Mingbird — 585,5 (медиана 440,5), goose — 866,4 (медиана 692,4), agent-mini — 233,5 (медиана 116,4), opencode — 633,4 (медиана 450,1).&lt;/p&gt;\n&lt;h4 id=\"vneshnyaya-proverka-t2-bench-v-treh-domenah\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#vneshnyaya-proverka-t2-bench-v-treh-domenah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внешняя проверка: τ2-bench в трех доменах&lt;/span&gt;&lt;/a&gt;Внешняя проверка: τ2-bench в трех доменах&lt;/h4&gt;\n&lt;p&gt;Поскольку &lt;a href=\"concepts/dataset.html\"&gt;набор данных&lt;/a&gt; LRAB был создан авторами, для дополнительной оценки использовался сторонний бенчмарк τ2-bench, охватывающий три домена: ритейл, авиаперевозки и телекоммуникации. В этом тесте симулированный пользователь взаимодействует с агентом, который должен использовать инструменты домена; успех определяется состоянием базы данных после выполнения задачи. Если агент имитирует вызов инструментов, не выполняя их фактически, проверка базы данных не проходит. Протокол тестирования унифицирован: во всех случаях используется модель qwen3.5:4b (Ollama) с температурой 0 и отключенным режимом «мышления» (thinking). Симулятор пользователя — модель qwen3.8-flash. Оценка проводится по метрике &lt;a href=\"concepts/pass-1.html\"&gt;pass@1&lt;/a&gt;, где ошибки приравниваются к 0.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird демонстрирует преимущество в сложных доменах: в ритейле он набрал 0,763 против 0,675 у нативного агента и 0,588 у opencode, а в сумме по 278 задачам показал результат 0,856 против 0,791 и 0,737 соответственно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;pass@1 — метрика, оценивающая долю задач, решенных верно с первой попытки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В ритейле (114 задач) Mingbird показал 0,763, нативный агент — 0,675, opencode — 0,588. В авиаперевозках (50 задач) Mingbird и нативный агент сравнялись (0,740), opencode — 0,500. В телекоммуникациях (114 задач) результаты близки к пределу: Mingbird — 1,000, opencode — 0,991, нативный агент — 0,930. Высокий результат Mingbird в телекоме объясняется использованием адаптера, наследующего механизм защиты от зацикливания (M4 anti-loop guard), который предотвращает ошибки при длинных последовательностях вызовов инструментов.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 4.&lt;/strong&gt; Четыре модели, используемые в LRAB, предоставляемые через Ollama&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Уровень&lt;/th&gt;\n&lt;th&gt;Тег Ollama&lt;/th&gt;\n&lt;th&gt;Всего&lt;/th&gt;\n&lt;th&gt;Активно&lt;/th&gt;\n&lt;th&gt;Квантование&lt;/th&gt;\n&lt;th&gt;Архитектура&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;2B&lt;/td&gt;\n&lt;td&gt;gemma4:e2b&lt;/td&gt;\n&lt;td&gt;5B&lt;/td&gt;\n&lt;td&gt;2.3B&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;MatFormer+PLE(elastic)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4B&lt;/td&gt;\n&lt;td&gt;qwen3.5:4b&lt;/td&gt;\n&lt;td&gt;4B&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;dense&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;12B&lt;/td&gt;\n&lt;td&gt;gemma4:12b&lt;/td&gt;\n&lt;td&gt;12B&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;dense&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;35B&lt;/td&gt;\n&lt;td&gt;ornith-1.5:35b&lt;/td&gt;\n&lt;td&gt;35B&lt;/td&gt;\n&lt;td&gt;∼3B&lt;/td&gt;\n&lt;td&gt;Q4_K_M&lt;/td&gt;\n&lt;td&gt;Qwen3.5-MoE, multimodal&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Total и Active показывают общее количество параметров и количество активных параметров на токен; &lt;a href=\"concepts/quantization.html\"&gt;Quantization&lt;/a&gt; — уровень квантования ggml для используемых весов. Все четыре тега представлены как Q4_K_M.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"statisticheskaya-znachimost-i-vliyanie-konfiguracii\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#statisticheskaya-znachimost-i-vliyanie-konfiguracii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Статистическая значимость и влияние конфигурации&lt;/span&gt;&lt;/a&gt;Статистическая значимость и влияние конфигурации&lt;/h4&gt;\n&lt;p&gt;Для оценки значимости применялся точный тест Макнемара на дискордантных парах. При сравнении Mingbird с нативным агентом разница составила +0,065 (p=0,030), с opencode — +0,119 (p=2,7×10⁻⁵). При исключении «насыщенного» домена телекоммуникаций (остается 164 задачи) разрыв между Mingbird и нативным агентом становится статистически незначимым (p=0,22), что указывает на то, что преимущество в этом домене критически важно для общего результата.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты сильно зависят от конфигурации «мышления» (thinking): при его включении производительность моделей меняется нелинейно, что делает этот параметр ключевым фактором проектирования системы, а не просто фоновым шумом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"analiz-konfiguracij-myshleniya\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#analiz-konfiguracij-myshleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ конфигураций «мышления»&lt;/span&gt;&lt;/a&gt;Анализ конфигураций «мышления»&lt;/h4&gt;\n&lt;p&gt;Присвоение каждой модели наиболее благоприятной конфигурации «мышления» (thinking-on или thinking-off) не меняет итогового рейтинга. На наборе данных τ² сравнение возможно, так как обе конфигурации были опубликованы. При выборе лучшей конфигурации для каждого агента показатели составляют: Mingbird — 0,867 (лучший результат при включенном «мышлении»), native agent — 0,791 (лучший при выключенном), opencode — 0,737 (лучший при выключенном). Для сравнения, единый протокол показывает результаты 0,856 / 0,791 / 0,737 соответственно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выбор оптимальной конфигурации «мышления» для каждого агента не устраняет разрыв в производительности, что подтверждает устойчивость лидерства Mingbird.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Mingbird демонстрирует наименьшую &lt;a href=\"concepts/sensitivity.html\"&gt;чувствительность&lt;/a&gt; к смене конфигураций (колебания в пределах ± 0,011), тогда как показатели конкурентов значительно меняются в зависимости от домена. Например, у opencode показатель успеха (telecompass rate) варьируется от 0,298 (thinking-on) до 0,991 (thinking-off). На наборе LRAB направление влияния «мышления» зависит от уровня сложности (tier). Так, модель goose выигрывает от «мышления» на 35B параметрах (0,822 против 0,679) и на задачах с длинным горизонтом (0,623 против 0,394), но проигрывает на моделях 4B/12B. У opencode (12B) наблюдается обратная динамика (0,140 против 0,539). Таким образом, не существует универсальной конфигурации, оптимальной для всех типов задач.&lt;/p&gt;\n&lt;h4 id=\"otkloneniya-ot-oficialnoj-nastrojki\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#otkloneniya-ot-oficialnoj-nastrojki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отклонения от официальной настройки&lt;/span&gt;&lt;/a&gt;Отклонения от официальной настройки&lt;/h4&gt;\n&lt;p&gt;В качестве симулятора пользователя использовалась модель qwen3.8-flash, а не официальная gpt-4o, поэтому абсолютные значения баллов нельзя напрямую сравнивать с официальной таблицей лидеров.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Симулятор пользователя — это программная среда, имитирующая поведение реального человека для тестирования ответов ИИ-агентов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поскольку использовался альтернативный симулятор, абсолютные показатели не сопоставимы с внешними бенчмарками, однако относительное сравнение между агентами остается корректным, так как все они тестировались в идентичных условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ablyaciya-isklyuchenie-mehanizmov-pri-2b\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#ablyaciya-isklyuchenie-mehanizmov-pri-2b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абляция: исключение механизмов при 2B&lt;/span&gt;&lt;/a&gt;Абляция: исключение механизмов при 2B&lt;/h4&gt;\n&lt;p&gt;Для оценки вклада отдельных компонентов системы мы провели &lt;a href=\"concepts/ablyatsionnoe-issledovanie.html\"&gt;абляционное исследование&lt;/a&gt; на кодовой базе v1.5.0. В эксперименте участвовали четыре варианта системы, в каждом из которых отключался один из механизмов через среду AGENT_ABLATION. Тестирование проводилось на 18 задачах LRAB с использованием модели gemma4:e2b (n=18 ячеек на группу). Отключались следующие механизмы: финишный гейт (M3), цикл верификации обратной связи (часть M3), монитор анти-циклов на уровне сигнатур (M4) и категориально-маршрутизируемая предварительная загрузка (M1). Механизмы M2 (слоистость чата/задач) и M5 (исправление формата) не подвергались абляции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — это метод исследования, при котором из системы последовательно удаляются отдельные компоненты, чтобы оценить их вклад в общую производительность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Базовой линией послужил полный набор механизмов (18 ячеек). Варианты выполнялись независимо при температуре 0. Результаты оценивались по детерминированной рубрике. Важно отметить, что отключение финишного гейта (finish_gate) затрагивает четыре из шести проверок (отказ при отсутствии работы, проверка pytest, сверка резюме с артефактами, проверка полноты плана). Две проверки остались активными: напоминание о синхронизации задач и самопроверка доставки (повторный ввод текста задачи для проверки перед завершением). Таким образом, зафиксированное изменение в -0,098 отражает вклад именно этих четырех автоматизированных защит, а не процесса повторного чтения текста.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отключение финишного гейта привело к снижению эффективности на 0,098, при этом основной вклад (41%) обеспечивается задачами, где бенчмарк предоставляет тестовые файлы, что позволяет проводить проверку до оценки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ по задачам показал, что чистый эффект в -0,098 распределен неравномерно: четыре задачи дали прирост около +0,71 каждая, тогда как три задачи показали снижение (от -0,143 до -0,571). Только одна из четырех задач (WF-04) содержала готовый тестовый файл бенчмарка. В остальных случаях польза гейта заключалась в предотвращении завершения задач с несуществующими артефактами. Внешняя проверка на бенчмарке τ2-bench, где финишный гейт не может выполнять проверки, показала сохранение маржи в диапазоне +0,065–+0,119.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наличие тестовых файлов в бенчмарке создает риск завышения оценки, так как агент может использовать их для самопроверки, что недоступно в реальных условиях без готовых тестов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Статистика активации механизмов в опубликованной матрице (72 млн ячеек) показала: самопроверка доставки сработала 65 раз, отказы по синхронизации — 43 раза, сверка резюме — 23 раза, проверки pytest — 13 раз, проверка полноты плана — 11 раз. Механизм «отказа при отсутствии работы» не сработал ни разу. Медианное количество вызовов инструментов для Mingbird составило 33,5, для goose — 15,0, для opencode — 5,0, для agent-mini — 7,0. Медианное использование токенов для Mingbird составило 14 624 при максимуме 32 767. Медианное время выполнения одной ячейки составило 440 с для Mingbird и 116 с для agent-mini.&lt;/p&gt;\n&lt;h4 id=\"analiz-sboev-i-mehanizmy-kontrolya\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#analiz-sboev-i-mehanizmy-kontrolya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ сбоев и механизмы контроля&lt;/span&gt;&lt;/a&gt;Анализ сбоев и механизмы контроля&lt;/h4&gt;\n&lt;p&gt;Анализ 288 опубликованных ячеек (Таблица 8) показывает, что доминирующей причиной завершения работы модели является не неверный ответ, а отказ от выполнения или незавершенность задачи. Например, в 21 из 72 ячеек базовой модели OpenCode инструменты не вызывались вовсе. В других случаях (agent-mini) фиксировались разрывы связи с бэкендом, а от 23 до 44 ячеек в разных конфигурациях завершались до проверки результата без ошибок или тайм-аутов. В конфигурации Mingbird 40 ячеек были остановлены из-за отсутствия необходимых артефактов, при этом лишь 4 ячейки получили оценку ниже половины балла. Независимая проверка 24 ячеек вторым экспертом показала полное совпадение в оценках (24/24) для большинства категорий, с расхождениями лишь в 3 случаях на границе оценки 0,5.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основная причина остановки задач — не ошибки модели, а отказ от выполнения или технические разрывы, что делает оценку «неудач» индикативной, а не причинно-следственной.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"razrabotka-mehanizmov-i-vliyanie-obucheniya\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#razrabotka-mehanizmov-i-vliyanie-obucheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разработка механизмов и влияние обучения&lt;/span&gt;&lt;/a&gt;Разработка механизмов и влияние обучения&lt;/h4&gt;\n&lt;p&gt;Авторы признают, что механизмы контроля (finish gate, anti-loop monitor) разрабатывались с учетом данных LRAB. Например, версии v1.2.0 были созданы как реакция на специфические сбои в длинных горизонтах планирования. В связи с этим, изменения производительности (дельта −0,098 для finish gate и −0,015 для anti-loop) следует рассматривать как оценки эффекта внутри выборки (in-sample). Таблица 9 и Рис. 9 показывают, что ни одно из удалений механизмов не дает статистически значимого улучшения: 95% доверительные интервалы (10 000 ресэмплов) пересекают ноль. При размере выборки n=18 на группу, дизайн исследования не позволяет отделить эффект механизма от дисперсии задач.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f9.jpg\" alt=\"Рисунок 9: Абляция с исключением одного механизма (кодовая база v1.5.0, набор задач LRAB, gemma4:e2b, n = 18 на группу; \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9: Абляция с исключением одного механизма (кодовая база v1.5.0, набор задач LRAB, gemma4:e2b, n = 18 на группу; базовый уровень — та же кодовая база, полная группа механизмов из таблицы 9).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 9: Абляция с исключением одного механизма (кодовая база v1.5.0, набор задач LRAB, gemma4:e2b, n = 18 на группу; базовый уровень — та же кодовая база, полная группа механизмов из таблицы 9). Слева: изменение среднего балла на отключенный механизм с 95% доверительными интервалами бутстрепа по 10 000 повторных выборок на уровне задач (finish gate (−0,266, +0,063), verification feedback (−0,185, +0,076), anti-loop (−0,134, +0,092), flat prefill (−0,119, +0,093); каждый интервал пересекает ноль, поэтому эффекты являются направленными; окрашен только столбец finish-gate, отмечающий наибольшую единичную дельту — окрашивание не несет отдельного статистического статуса). Справа: изменения по задачам, окрашенные по семейству задач (LH против WF). Большая часть снижения в сегменте LH по четырем группам обусловлена общим сдвигом LH-01, который падает в каждой группе (чувствительность в разделе 5.6); при такой структуре чтения на уровне механизмов для разделения семейств не являются разделимыми. Семейство WF также не осталось неизменным: отключение verification feedback оставляет среднее значение WF на уровне +0,033 (незначительно лучше), а среднее значение WF для группы finish-gate составляет +0,074.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/in-sample-effekt.html\"&gt;In-sample эффект&lt;/a&gt; — это оценка эффективности системы на тех же данных, на которых она обучалась или настраивалась, что может завышать показатели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Из-за малого размера выборки (n=18) результаты являются направленными (directional), а не статистически значимыми.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obshaya-prichina-kejs-lh-01\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#obshaya-prichina-kejs-lh-01\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общая причина: кейс LH-01&lt;/span&gt;&lt;/a&gt;Общая причина: кейс LH-01&lt;/h4&gt;\n&lt;p&gt;Выявлено, что задача LH-01 демонстрирует аномальное падение результатов во всех четырех конфигурациях (с 0,929 до 0,214–0,259). Это указывает на «общую причину» (common cause), а не на работу механизмов. LH-01 — это 180-минутная многоэтапная задача, крайне чувствительная к условиям пакетной обработки. При исключении LH-01 из анализа, влияние большинства механизмов стремится к нулю или меняет знак. Повторный запуск эксперимента 2026-09-22 подтвердил, что падение производительности воспроизводится независимо от включенных механизмов, а колебания в 0,069 балла сопоставимы с размером всех номинальных дельт в таблице.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффекты, приписываемые механизмам контроля, оказались следствием нестабильности выполнения конкретных сложных задач (LH-01), а не их реальным вкладом в точность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sravnenie-ispolnyaemyh-zashit\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#sravnenie-ispolnyaemyh-zashit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение исполняемых защит&lt;/span&gt;&lt;/a&gt;Сравнение исполняемых защит&lt;/h4&gt;\n&lt;p&gt;Для оценки эффективности исполняемых защит (executable guards) было проведено прямое сравнение в рамках одной серии экспериментов, выполненных в одну ночь, что исключает влияние временных разрывов между запусками. Для повышения достоверности каждая пара конфигураций была протестирована трижды (по 18 задач на каждый запуск). Во всех трех случаях результаты оказались в пользу исполняемых защит: общая разница составила +0,096, +0,133 и +0,056 (среднее значение +0,095).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исполняемые защиты обеспечивают преимущество примерно в 0,1 балла по сравнению с простым текстовым перечитыванием, что подтверждается тремя согласованными сериями испытаний.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ по сегментам показал следующие результаты: для сегментов рабочего процесса (workflow-segment) разница составила +0,145, +0,157 и +0,057. В сегментах с длинным горизонтом (long-horizon) значения составили -0,148, +0,013 и +0,051, что указывает на нестабильность знака, соответствующую высокой дисперсии данного сегмента. Для контекста: контрольные группы с идентичной кон
