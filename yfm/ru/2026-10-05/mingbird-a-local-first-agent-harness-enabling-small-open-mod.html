фигурацией демонстрировали средний разброс в 0,069, при этом колебания в отдельных задачах на длинных горизонтах достигали 0,75.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/dispersiya.html\"&gt;Дисперсия&lt;/a&gt; — это показатель разброса данных; высокая дисперсия означает, что результаты одного и того же теста могут сильно различаться от запуска к запуску.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оценки по отдельным ячейкам для новых конфигураций доступны в открытых данных (benchmarks/ablation/). Важно учитывать, что ячейки с длинным горизонтом в основной матрице основаны на одиночных испытаниях, проведенных 13–14 сентября. Поскольку повторный запуск полного механизма может давать отклонение до 0,5, значения для сегментов с длинным горизонтом в Таблице 5 следует интерпретировать с учетом этой вариативности. Стабильными показателями являются общие результаты по всем задачам и сегментам рабочего процесса.&lt;/p&gt;\n&lt;h4 id=\"ugrozy-validnosti\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#ugrozy-validnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Угрозы валидности&lt;/span&gt;&lt;/a&gt;Угрозы валидности&lt;/h4&gt;\n&lt;p&gt;Собственный бенчмарк. Задачи и критерии оценки LRAB были созданы авторами Mingbird. Мы не можем исключить, что набор задач благоприятствует механизмам нашего инструмента, так как он был спроектирован для проверки форм отказа, описанных в разделе 3.2. Это является целью контролируемого эксперимента, но также создает предвзятость. Мы минимизируем это, публикуя все задачи, код оценки и необработанные данные, а также используя внешнюю репликацию τ2-bench, которая подтверждает общую направленность результатов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Собственный бенчмарк LRAB имеет риск предвзятости, так как разработан авторами, однако внешняя проверка через τ2-bench подтверждает согласованность выводов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Охват внешних бенчмарков. τ2-bench — наш единственный внешний источник для сравнения. Мы проанализировали пять других кандидатов (AppWorld, ToolSandbox, AgentBoard, наборы для вызова функций и CRMArena), но исключили их из-за технических ограничений: либо они предоставляют собственный агентский цикл, либо не способны дифференцировать локальные модели (например, CRMArena требовала более 40 минут на задачу при нулевом результате).&lt;/p&gt;\n&lt;p&gt;Перекрытие разработки и оценки. Механизм защиты от зацикливания (M4) был разработан на основе задачи WF-08, которая входит в LRAB. Три из четырех протестированных механизмов имеют частичное пересечение с обучающими данными. Поскольку нет разделения на тестовую выборку и временного разрыва между разработкой и оценкой, риск переобучения сохраняется. Мы публикуем все данные для прозрачности, а внешние результаты τ2-bench, полученные после фиксации механизмов, служат дополнительной проверкой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отсутствие разделения на обучающую и тестовую выборки создает риск переобучения, так как некоторые механизмы тестировались на задачах, использованных при их создании.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Оборудование и платформа. Все 288 тестов выполнены на одном ПК с Windows 11 (встроенный GPU, 32 ГБ общей памяти). Мы не знаем, как результаты переносятся на Linux или дискретные GPU. Mingbird ориентирован на Windows, поэтому его работа на других системах не тестировалась.&lt;/p&gt;\n&lt;p&gt;Порядок проведения кампаний. Базовые тесты проводились 1–4 сентября 2026 года, Mingbird — 13–14 сентября, а повторные тесты для goose и opencode — 18–20 сентября. Порядок был блочным, а не рандомизированным, что допускает дрейф состояния системы. Однако повторные запуски подтвердили результаты базовой кампании.&lt;/p&gt;\n&lt;p&gt;Набор моделей. Мы использовали четыре модели (по одной на размерный класс), работающие через один бэкенд. Модели minicpm5-2b и llama3.2:3b были исключены, так как не смогли формировать валидные вызовы инструментов (например, выдавали неверные ключи аргументов). Это ограничение самих моделей, а не нашего инструмента. В матрицу не включены проприетарные модели, за исключением одного теста в разделе 5.5, который носит индикативный характер.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/validnost-vyzova-instrumentov.html\"&gt;Валидность вызова инструментов&lt;/a&gt; — это способность модели генерировать команды в формате, который понимает программная среда (например, JSON-схема).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Субъективность оценки. Оценка детерминирована и основана на артефактах, но сами критерии разработаны нами. Веса частичных баллов отражают наше суждение о структуре задач.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya-i-interpretaciya-rezultatov\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#ogranicheniya-i-interpretaciya-rezultatov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и интерпретация результатов&lt;/span&gt;&lt;/a&gt;Ограничения и интерпретация результатов&lt;/h4&gt;\n&lt;p&gt;При использовании жадного декодирования (temperature=0) случайность выборки исключается, однако сохраняется вариативность на уровне исполнения. Повторный запуск того же механизма в тех же условиях приводил к колебаниям результатов для долгосрочных задач на 0,5–0,7 и для рабочих процессов до 0,43. В трех повторных запусках среднее значение по ветке варьировалось в пределах 0,069, а для отдельных задач разброс достигал 0,75. Таким образом, значения для долгосрочных задач в Таблице 5 являются нестабильными и представляют собой лишь единичную выборку, тогда как показатели по всем задачам и сегментам рабочих процессов более устойчивы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Показатели долгосрочных задач в Таблице 5 нестабильны из-за вариативности исполнения, поэтому их следует рассматривать как единичные замеры, а не как окончательные средние значения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для сравнения τ² использовался облачный симулятор (qwen3.8-flash), поэтому абсолютные баллы не сопоставимы с таблицей лидеров, а только разница между ветками. Поскольку облачные модели не являются статичными снимками, повторная репликация сегодня может столкнуться с «дрейфом» поведения симулятора. Исследование абляции (раздел 5.6) проводилось только на одной 2B-модели по 18 задачам, что не позволяет судить о взаимодействии механизмов или их работе на более крупных моделях. Оценка безопасности (раздел 3.2.11) проводилась на 54 пробах; выявленные утечки являются системными пробелами в правилах, а не случайными ошибками.&lt;/p&gt;\n&lt;h4 id=\"obsuzhdenie-i-budushie-raboty\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#obsuzhdenie-i-budushie-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение и будущие работы&lt;/span&gt;&lt;/a&gt;Обсуждение и будущие работы&lt;/h4&gt;\n&lt;p&gt;Результаты показывают, что для малых моделей структура обвязки (harness) определяет значительную часть их возможностей. На 2B-моделях одна и та же модель при разных обвязках показывает разброс успешности выполнения от 0,017 до 0,821. Основные причины неудач — переполнение префилла, бесконечные циклы и ошибки парсинга — являются инженерными проблемами, не требующими переобучения моделей. Наибольший вклад в производительность на 2B-моделях вносит механизм «finish gate».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляция — метод исследования системы путем последовательного отключения отдельных компонентов для определения их вклада в общий результат.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В будущем планируется перенос Mingbird на macOS и Linux, так как результаты agent-mini показывают, что соответствие платформе может доминировать над возможностями самой модели. Важным дополнением к бенчмарку станет создание человеческого эталона (human baseline) для оценки LRAB, чтобы откалибровать интерпретацию полученных баллов. Также планируется расширение исследований абляции на всю матрицу моделей для получения полных оценок предельного вклада каждого механизма.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"itogi-i-vyvody\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#itogi-i-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итоги и выводы&lt;/span&gt;&lt;/a&gt;Итоги и выводы&lt;/h4&gt;\n&lt;p&gt;Мы представили Mingbird — локальную среду для агентов Windows и Ollama, которая рассматривает ошибки малых моделей как приоритетные инженерные задачи. Оценка проводилась в рамках контролируемого эксперимента: 288 ячеек, четыре среды исполнения, четыре открытые модели (от 2B до 35B параметров) на одной машине с детерминированной системой оценки на основе артефактов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Mingbird достигает общего показателя 0,886 против 0,631, 0,479 и 0,405 у трех базовых решений, демонстрируя отсутствие резкого падения эффективности малых моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В сегменте долгосрочного планирования (long-horizon) система достигает 0,827 при одной попытке на ячейку. Внешняя репликация на бенчмарке τ2-bench по трем доменам (278 задач, та же локальная модель 4B, аналогичный симулятор пользователя) подтверждает эффективность подхода: 0,856 против 0,791 и 0,737 у альтернатив. Проверка на передовой (frontier) модели (одна хостинговая модель, четыре среды, 18 задач) показала разброс от 0,997 до 0,478. Это доказывает, что дефектная инфраструктура (&lt;a href=\"concepts/scaffold.html\"&gt;scaffold&lt;/a&gt;) может скрывать более половины потенциала передовой модели, тогда как качественные среды показывают разницу лишь в 0,072–0,12.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Scaffold (каркас/среда) — это программная обвязка, которая помогает языковой модели взаимодействовать с операционной системой и инструментами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Абляция методом исключения механизмов показала, что наибольший вклад в преимущество вносит «финишный шлюз» (finish gate), а конфигурация процесса мышления модели является рычагом управления с затратами, зависящими от конкретной задачи. Поскольку LRAB является авторской разработкой, мы публикуем все данные по каждой ячейке для независимой проверки. Наши результаты указывают на то, что значительная часть неудач, приписываемых неспособности моделей, на самом деле является дефектами среды, которые поддаются исправлению.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено конкретными конфигурациями Windows и Ollama; результаты могут отличаться при использовании иных операционных систем или сред исполнения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f2.jpg\" alt=\"Рисунок 2: Стоимость префилла в зависимости от измеренной длины промпта (логарифмическая шкала).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Стоимость префилла в зависимости от измеренной длины промпта (логарифмическая шкала).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Стоимость префилла в зависимости от измеренной длины промпта (логарифмическая шкала). По оси x — количество токенов промпта, сообщенное бэкендом (prompt_eval_count); по оси y — время оценки промпта бэкендом, медиана трех запусков с префиксом для предотвращения кэширования (nonce) для каждого запроса. Значения для отдельных запусков не сохранялись, поэтому планки погрешностей отсутствуют. Пустые маркеры: якоря bench (19 инструментов), full-configuration (31) и duplicated-schema (256). Пунктирные линии — аппроксимация методом наименьших квадратов (4B: 0,20 мс на токен, R²=0,9991). Статические бюджеты в 774/797 токенов, указанные в тексте, являются оценочными значениями, а не результатами измерений, и на этой оси не отображены.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f4.jpg\" alt=\"Рисунок 4: Тепловая карта уровня задач LRAB: 18 задач (строки; LH-01–LH-03 вверху, WF-01–WF-15 внизу, разделены) × четыр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Тепловая карта уровня задач LRAB: 18 задач (строки; LH-01–LH-03 вверху, WF-01–WF-15 внизу, разделены) × четыре обвязки (столбцы); каждая ячейка представляет собой средний балл по четырем уровням моделей.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Тепловая карта уровня задач LRAB: 18 задач (строки; LH-01–LH-03 вверху, WF-01–WF-15 внизу, разделены) × четыре обвязки (столбцы); каждая ячейка представляет собой средний балл по четырем уровням моделей. Столбец Mingbird выделен контуром. Рисунок делает видимой структуру отказов, а не скрывает ее за одним средним значением: самая слабая задача Mingbird — WF-09 (0,70), содержащая ячейку с ошибкой выполнения, в то время как opencode в среднем имеет 0,036 на LH-01, а на WF-09 agent-mini и goose имеют в среднем 0,071 и 0,643.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f6.jpg\" alt=\"Рисунок 6: Оценка LRAB в зависимости от времени выполнения на ячейку (одна точка на строку опубликованного CSV; единстве\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Оценка LRAB в зависимости от времени выполнения на ячейку (одна точка на строку опубликованного CSV; единственная ячейка goose без записанного времени исключена, осталось 287 точек; логарифмическая ось времени; цвет кодирует обвязку, размер маркера…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6: Оценка LRAB в зависимости от времени выполнения на ячейку (одна точка на строку опубликованного CSV; единственная ячейка goose без записанного времени исключена, осталось 287 точек; логарифмическая ось времени; цвет кодирует обвязку, размер маркера — уровень модели). Пунктирные вертикальные линии обозначают бюджеты на ячейку (90 минут для ячеек workflow, 180 для long-horizon); ячейка, исчерпавшая бюджет, получает 0 баллов. Быстрый, но пустой кластер ниже 80 секунд содержит ячейки с несоответствием платформы 35B для agent-mini, в то время как медленный, но содержательный «хвост» доминирует за счет goose. Рисунок является визуальной формой протокола бюджетного ценообразования из раздела 4.5: ни одна из осей по отдельности не дает преимущества.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-f7.jpg\" alt=\"Рисунок 7: Показатели прохождения τ2-bench@1 по доменам и группам (114 задач retail, 50 airline, 114 telecom; агентская \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Показатели прохождения τ2-bench@1 по доменам и группам (114 задач retail, 50 airline, 114 telecom; агентская сторона всегда представлена одной и той же локальной моделью qwen3.5:4b с температурой 0 и отключенным мышлением, пользовательский…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7: Показатели прохождения τ2-bench@1 по доменам и группам (114 задач retail, 50 airline, 114 telecom; агентская сторона всегда представлена одной и той же локальной моделью qwen3.5:4b с температурой 0 и отключенным мышлением, пользовательский симулятор — всегда одна и та же облачная модель). «Усы» — 95% доверительные интервалы на уровне задач, полученные методом бутстрепа. Три завершенные группы закончили работу с нулевым количеством ошибочных попыток. telecom близок к насыщению (1,000/0,991/0,930); группа goose отложена из-за пропускной способности и не показана.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Малые модели&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;не справляются&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;с задачами&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тестирование&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;каркаса&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Mingbird в&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;LRAB&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#2A6DB0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Точность&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;выросла до&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;0,886&lt;/text&gt;&lt;path stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#2A6DB0\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#6FA8DC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Обвязка важнее&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;размера модели&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;datasets&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;
