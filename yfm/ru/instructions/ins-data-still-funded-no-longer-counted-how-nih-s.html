        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Инструкция&lt;/em&gt; · 2026-10-05&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Перед вами краткое руководство по анализу цензуры в грантовой отчетности, основанное на исследовании 37 790 заявок NIH.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"naznachenie\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#naznachenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Назначение&lt;/span&gt;&lt;/a&gt;Назначение&lt;/h2&gt;\n&lt;p&gt;Средство предназначено для обнаружения «испаряющихся» научных направлений. Помогает понять, как лингвистическая правка отчетов меняет статистическую картину мира, не затрагивая реальную работу ученых.&lt;/p&gt;\n&lt;h2 id=\"sostav\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#sostav\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Состав&lt;/span&gt;&lt;/a&gt;Состав&lt;/h2&gt;\n&lt;p&gt;В основе — анализ 37 790 грантов NIH. Активное вещество: сопоставление текстов заявок с категориями государственного финансирования. Вспомогательные компоненты: методы обработки естественного языка для выявления удаленных упоминаний этнических групп.&lt;/p&gt;\n&lt;h2 id=\"sposob-primeneniya\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#sposob-primeneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Способ применения&lt;/span&gt;&lt;/a&gt;Способ применения&lt;/h2&gt;\n&lt;p&gt;Возьмите статью «Как чиновники удаляют слова из отчетов, чтобы «испарить» научные исследования». Приложите метод к открытым реестрам грантов. Если из описания проекта исчезает упоминание этнической группы, проект автоматически выпадает из категории «здоровье меньшинств». Повторяйте до тех пор, пока статистика не станет «чистой» и безликой.&lt;/p&gt;\n&lt;h2 id=\"pobochnye-effekty\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#pobochnye-effekty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Побочные эффекты&lt;/span&gt;&lt;/a&gt;Побочные эффекты&lt;/h2&gt;\n&lt;p&gt;Возможно возникновение иллюзии исчезновения целых областей науки. Читатель может почувствовать легкое головокружение от осознания того, что финансирование и реальные исследования остались прежними, а отчетность — изменилась.&lt;/p&gt;\n&lt;h2 id=\"protivopokazaniya\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#protivopokazaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Противопоказания&lt;/span&gt;&lt;/a&gt;Противопоказания&lt;/h2&gt;\n&lt;p&gt;Не применять при избытке веры в безупречность автоматических отчетов. Не рекомендуется использовать для поиска реальных изменений в лабораторной деятельности, так как их может не быть.&lt;/p&gt;\n&lt;h2 id=\"usloviya-hraneniya\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#usloviya-hraneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Условия хранения&lt;/span&gt;&lt;/a&gt;Условия хранения&lt;/h2&gt;\n&lt;p&gt;Хранить в открытом доступе, вдали от попыток переписать историю. Рекомендуется регулярно сверять с исходными данными для сохранения критического мышления.&lt;/p&gt;\n&lt;h2 id=\"osnovano-na-statyah\"&gt;&lt;a href=\"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#osnovano-na-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основано на статьях&lt;/span&gt;&lt;/a&gt;Основано на статьях&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html\"&gt;Как чиновники удаляют слова из отчетов, чтобы «испарить» научные исследования&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Концепции: &lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Перед вами краткое руководство по анализу цензуры в грантовой отчетности, основанное на исследовании 37 790 заявок NIH."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Инструкция по применению: как превратить науку в невидимку","description":"Перед вами краткое руководство по анализу цензуры в грантовой отчетности, основанное на исследовании 37 790 заявок NIH.","vcsPath":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.md"},"headings":[{"title":"Назначение","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#naznachenie","level":2},{"title":"Состав","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#sostav","level":2},{"title":"Способ применения","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#sposob-primeneniya","level":2},{"title":"Побочные эффекты","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#pobochnye-effekty","level":2},{"title":"Противопоказания","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#protivopokazaniya","level":2},{"title":"Условия хранения","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#usloviya-hraneniya","level":2},{"title":"Основано на статьях","href":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s.html#osnovano-na-statyah","level":2}],"title":"Инструкция по применению: как превратить науку в невидимку"},"router":{"pathname":"instructions/ins-data-still-funded-no-longer-counted-how-nih-s","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":
