        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Инструкция&lt;/em&gt; · 2026-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Ваш ИИ-агент снова решил захватить мир? Успокойте его с помощью Runtime Assurance Contract.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"naznachenie\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#naznachenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Назначение&lt;/span&gt;&lt;/a&gt;Назначение&lt;/h2&gt;\n&lt;p&gt;Средство для укрощения строптивых алгоритмов. Помогает ограничить автономность ИИ-агентов, чтобы их «уверенность» не превратилась в неконтролируемую власть над вашими данными.&lt;/p&gt;\n&lt;h2 id=\"sostav\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#sostav\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Состав&lt;/span&gt;&lt;/a&gt;Состав&lt;/h2&gt;\n&lt;p&gt;В основе лежит концепция Runtime Assurance Contract (RAC), описанная в статье «Доверие — это не оценка: как ограничить власть ИИ-агентов». Это формальная схема, состоящая из жестких запретов и обязательных проверок, которые работают независимо от общей производительности модели.&lt;/p&gt;\n&lt;h2 id=\"sposob-primeneniya\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#sposob-primeneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Способ применения&lt;/span&gt;&lt;/a&gt;Способ применения&lt;/h2&gt;\n&lt;p&gt;Внедрите RAC в архитектуру вашего агента. Вместо того чтобы полагаться на мягкие метрики или «честное слово» нейросети, настройте систему так, чтобы она блокировала любые действия при сбое хотя бы одной проверки. Помните: если агент не может доказать безопасность своего шага, он должен стоять на месте.&lt;/p&gt;\n&lt;h2 id=\"pobochnye-effekty\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#pobochnye-effekty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Побочные эффекты&lt;/span&gt;&lt;/a&gt;Побочные эффекты&lt;/h2&gt;\n&lt;p&gt;Возможно временное снижение «креативности» и скорости работы агента. В редких случаях — осознание ИИ того, что его свобода ограничена формальной логикой, что может привести к скуке (но не к восстанию).&lt;/p&gt;\n&lt;h2 id=\"protivopokazaniya\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#protivopokazaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Противопоказания&lt;/span&gt;&lt;/a&gt;Противопоказания&lt;/h2&gt;\n&lt;p&gt;Не рекомендуется использовать в системах, где требуется полная непредсказуемость или где отсутствие формальных доказательств является единственным способом работы. Не заменяет здравый смысл разработчика.&lt;/p&gt;\n&lt;h2 id=\"usloviya-hraneniya\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#usloviya-hraneniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Условия хранения&lt;/span&gt;&lt;/a&gt;Условия хранения&lt;/h2&gt;\n&lt;p&gt;Хранить в защищенном от несанкционированного доступа репозитории. Регулярно обновлять список запретов, так как ИИ-агенты имеют привычку находить лазейки в самых строгих правилах.&lt;/p&gt;\n&lt;h2 id=\"osnovano-na-statyah\"&gt;&lt;a href=\"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#osnovano-na-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основано на статьях&lt;/span&gt;&lt;/a&gt;Основано на статьях&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html\"&gt;Доверие — это не оценка: как ограничить власть ИИ-агентов&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Концепции: &lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Ваш ИИ-агент снова решил захватить мир? Успокойте его с помощью Runtime Assurance Contract."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Инструкция по эксплуатации ИИ-агента: не доверяй, а проверяй","description":"Ваш ИИ-агент снова решил захватить мир? Успокойте его с помощью Runtime Assurance Contract.","vcsPath":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.md"},"headings":[{"title":"Назначение","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#naznachenie","level":2},{"title":"Состав","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#sostav","level":2},{"title":"Способ применения","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#sposob-primeneniya","level":2},{"title":"Побочные эффекты","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#pobochnye-effekty","level":2},{"title":"Противопоказания","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#protivopokazaniya","level":2},{"title":"Условия хранения","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#usloviya-hraneniya","level":2},{"title":"Основано на статьях","href":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c.html#osnovano-na-statyah","level":2}],"title":"Инструкция по эксплуатации ИИ-агента: не доверяй, а проверяй"},"router":{"pathname":"instructions/ins-data-trust-is-not-a-score-runtime-assurance-c","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
