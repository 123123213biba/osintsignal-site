            {"data":{"leading":true,"data":{"blocks":[{"type":"header-block","title":"arXiv — вычислительная биология и биофизика","theme":"dark","width":"m","description":"&lt;p&gt;Все материалы темы: 39&lt;/p&gt;\n","background":{"color":"#8A3FCC"}},{"type":"card-layout-block","animated":false,"title":"arXiv&amp;nbsp;&amp;mdash; вычислительная биология и&amp;nbsp;биофизика","colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing-card.jpg"},"content":{"title":"IdeaLens: как отличить человеческие идеи от&amp;nbsp;сгенерированных нейросетью","text":"&lt;p&gt;Современные детекторы ищут следы ИИ в тексте, но IdeaLens учится видеть, кто на самом деле придумал суть аргумента.&lt;/p&gt;\n","links":[{"url":"2026-10-07/idealens-detecting-ai-ideas-in-long-form-writing.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-card.jpg"},"content":{"title":"ИИ-дезинформация: как отличить реальную угрозу от&amp;nbsp;цифрового шума","text":"&lt;p&gt;Исследование 112 кейсов ИИ-фейков в Британии показало: не каждый дипфейк опасен, но риски для общества растут.&lt;/p&gt;\n","links":[{"url":"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-card.jpg"},"content":{"title":"Как нейросети видят изменения в&amp;nbsp;3D-пространстве: метод GS-Pool","text":"&lt;p&gt;Ученые научили алгоритмы находить изменения в 3D-сценах, даже если снимки сделаны с разных ракурсов и в разное время.&lt;/p&gt;\n","links":[{"url":"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-card.jpg"},"content":{"title":"Как проверить нейросеть на&amp;nbsp;предвзятость, не&amp;nbsp;взламывая её","text":"&lt;p&gt;Новый метод аудита ALeBi позволяет выявлять дискриминацию в алгоритмах, сохраняя конфиденциальность модели.&lt;/p&gt;\n","links":[{"url":"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-card.jpg"},"content":{"title":"Машинное обучение против лесных пожаров: как ИИ&amp;nbsp;видит огонь лучше спутников","text":"&lt;p&gt;Алгоритмы CatBoost обнаруживают возгорания быстрее и точнее стандартных систем мониторинга, особенно в ночное время.&lt;/p&gt;\n","links":[{"url":"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/language-models-that-play-chess-and-explain-their-moves-card.jpg"},"content":{"title":"Почему шахматные движки молчат: учим ИИ&amp;nbsp;объяснять свои ходы","text":"&lt;p&gt;Новая модель QUEEN объединяет мощь шахматных движков с логикой языковых моделей, чтобы наконец объяснить, почему этот ход — лучший.&lt;/p&gt;\n","links":[{"url":"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-card.jpg"},"content":{"title":"Как перестать перечитывать одно и&amp;nbsp;то&amp;nbsp;же: Galahad ускоряет работу LLM в&amp;nbsp;14&amp;nbsp;раз","text":"&lt;p&gt;Модели тратят 98% времени на повторное чтение одних и тех же данных. Новый слой памяти Galahad делает это чтение однократным.&lt;/p&gt;\n","links":[{"url":"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-card.jpg"},"content":{"title":"Ложь без триггеров: почему правильный ответ нейросети не&amp;nbsp;гарантирует верное решение","text":"&lt;p&gt;Исследователи выяснили, что даже если ИИ дает верный ответ, он может принимать ошибочные решения, основанные на скрытой дезинформации.&lt;/p&gt;\n","links":[{"url":"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo-card.jpg"},"content":{"title":"SecJev: как научить нейросети принимать решения в&amp;nbsp;кибербезопасности","text":"&lt;p&gt;Новое семейство моделей SecJev автоматизирует анализ логов, трафика и политик безопасности, обходя стандартные генеративные ИИ.&lt;/p&gt;\n","links":[{"url":"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica-card.jpg"},"content":{"title":"Почему большие языковые модели плохо справляются с&amp;nbsp;динамикой состояния пациентов","text":"&lt;p&gt;ИИ в медицине часто ошибается, когда пытается пересмотреть свои выводы при появлении новых данных о здоровье пациента.&lt;/p&gt;\n","links":[{"url":"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-card.jpg"},"content":{"title":"Как чиновники удаляют слова из&amp;nbsp;отчетов, чтобы &amp;laquo;испарить&amp;raquo; научные исследования","text":"&lt;p&gt;В 2025 году NIH потребовал убрать упоминания DEI из заявок. В итоге исследования продолжаются, но статистика их больше не видит.&lt;/p&gt;\n","links":[{"url":"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-card.jpg"},"content":{"title":"Почему нейросети &amp;laquo;лгут&amp;raquo; себе: разрыв между обучением и&amp;nbsp;реальностью","text":"&lt;p&gt;Исследователи выяснили, почему визуальные модели поддаются атакам при обучении, но остаются устойчивыми в свободном режиме.&lt;/p&gt;\n","links":[{"url":"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-card.jpg"},"content":{"title":"Почему маленькие нейросети проваливают задачи: дело не&amp;nbsp;в&amp;nbsp;интеллекте, а&amp;nbsp;в&amp;nbsp;&amp;laquo;обвязке&amp;raquo;","text":"&lt;p&gt;Исследование показывает, что компактные модели (2-9B) работают эффективно, если сменить стандартный агентный каркас на специализированный.&lt;/p&gt;\n","links":[{"url":"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/learning-to-structure-data-from-user-generated-thematic-corp-card.jpg"},"content":{"title":"Как собрать строгую базу данных из&amp;nbsp;хаотичных постов в&amp;nbsp;сети без готовых шаблонов","text":"&lt;p&gt;Новый алгоритм на базе языковых моделей находит скрытые параметры в текстах и строит таблицы с точностью человека.&lt;/p&gt;\n","links":[{"url":"2026-10-04/learning-to-structure-data-from-user-generated-thematic-corp.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur-card.jpg"},"content":{"title":"Детекторы лжи для ИИ: почему они ошибаются, когда модель играет роль","text":"&lt;p&gt;Алгоритмы, выявляющие ложь в ответах нейросетей, часто принимают ролевую игру за правду. Разбираемся, почему это происходит.&lt;/p&gt;\n","links":[{"url":"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-card.jpg"},"content":{"title":"Как наука уходит в&amp;nbsp;сторону: Drift Inspector отслеживает эволюцию идей в&amp;nbsp;AI","text":"&lt;p&gt;Исследователи создали инструмент, который превращает тысячи научных статей в интерактивную карту трендов.&lt;/p&gt;\n","links":[{"url":"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi-card.jpg"},"content":{"title":"Когда ИИ&amp;nbsp;забывает, кто он: почему &amp;laquo;личность&amp;raquo; агента&amp;nbsp;&amp;mdash; это иллюзия","text":"&lt;p&gt;Ваш ИИ-помощник может вести себя как обычно, но внутри он уже перестал быть собой. Разбираемся в механике сбоя.&lt;/p&gt;\n","links":[{"url":"2026-10-04/the-persona-is-still-there-but-who-is-speaking-latent-identi.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-04/architecture-without-an-architect-global-governance-of-artif-card.jpg"},"content":{"title":"Кто управляет искусственным интеллектом: миф об&amp;nbsp;архитекторе глобальных правил","text":"&lt;p&gt;Мир пытается обуздать ИИ, но единого центра управления нет. Разбираемся, почему архитектура правил строится без главного архитектора.&lt;/p&gt;\n","links":[{"url":"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation-card.jpg"},"content":{"title":"Почему научные статьи от&amp;nbsp;ИИ&amp;nbsp;выглядят как под копирку","text":"&lt;p&gt;Исследователи выяснили, что нейросети пишут вступления к научным статьям слишком предсказуемо по сравнению с людьми.&lt;/p&gt;\n","links":[{"url":"2026-10-03/does-ai-generated-scientific-text-follow-human-argumentation.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-card.jpg"},"content":{"title":"Как заставить нейросети создавать точные инфографики без галлюцинаций","text":"&lt;p&gt;Новый фреймворк InfoAgent превращает создание инфографики в проверяемый процесс, связывая каждый элемент с реальными данными.&lt;/p&gt;\n","links":[{"url":"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati-card.jpg"},"content":{"title":"Почему точность нейросетей&amp;nbsp;&amp;mdash; это иллюзия стабильности","text":"&lt;p&gt;Мы привыкли оценивать ИИ по среднему баллу, но одна и та же модель может провалиться, если просто перефразировать запрос.&lt;/p&gt;\n","links":[{"url":"2026-10-03/generalization-is-stability-not-accuracy-multi-axis-evaluati.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c-card.jpg"},"content":{"title":"Судья в&amp;nbsp;машине: почему нейросети выбирают не&amp;nbsp;лучшие изображения, а&amp;nbsp;первые попавшиеся","text":"&lt;p&gt;Алгоритмы выбора картинок часто страдают от предвзятости: они выбирают не то, что качественнее, а то, что стоит первым в списке.&lt;/p&gt;\n","links":[{"url":"2026-10-03/when-the-judge-acts-auditing-vlm-guided-image-selection-on-c.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against-card.jpg"},"content":{"title":"Как предсказать атаку на&amp;nbsp;ИИ-агента до&amp;nbsp;того, как она случится","text":"&lt;p&gt;Новый метод SSH превращает защиту ИИ в игру в шахматы с самим собой, просчитывая опасные ходы наперед.&lt;/p&gt;\n","links":[{"url":"2026-10-03/speculative-safety-honeypot-toward-proactive-defense-against.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/out-of-network-attention-dynamics-on-bluesky-card.jpg"},"content":{"title":"Пузыри фильтров или случайность: как мы&amp;nbsp;на&amp;nbsp;самом деле выбираем контент в&amp;nbsp;соцсетях","text":"&lt;p&gt;Исследование Bluesky показало, что 80% нашего внимания ограничено «двумя шагами» от подписок. Почему мы редко выходим за пределы своего круга?&lt;/p&gt;\n","links":[{"url":"2026-10-03/out-of-network-attention-dynamics-on-bluesky.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp-card.jpg"},"content":{"title":"Почему нейросети поддакивают: ловушка лести и&amp;nbsp;холодного безразличия","text":"&lt;p&gt;ИИ часто выбирает между слепым согласием и грубостью. Новый бенчмарк FIGS учит модели быть честными, оставаясь эмпатичными.&lt;/p&gt;\n","links":[{"url":"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval-card.jpg"},"content":{"title":"Почему оптимизация для ИИ-поисковиков работает не&amp;nbsp;так, как вы&amp;nbsp;думали","text":"&lt;p&gt;Один раз попав в ответ нейросети, источник закрепляется там надолго. Разбираем феномен «разговорного захвата».&lt;/p&gt;\n","links":[{"url":"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu-card.jpg"},"content":{"title":"Как защитить данные в&amp;nbsp;облачных нейросетях, не&amp;nbsp;теряя в&amp;nbsp;точности вычислений","text":"&lt;p&gt;Новый метод ReCast позволяет отправлять в облако защищенные данные, сохраняя логику расчетов и формат файлов.&lt;/p&gt;\n","links":[{"url":"2026-10-03/recast-contract-preserving-protection-for-fixed-interface-mu.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-card.jpg"},"content":{"title":"Скрытые рассуждения ИИ: почему их&amp;nbsp;сложно научить обману","text":"&lt;p&gt;Могут ли нейросети прятать логику внутри обычного текста? Исследование показало, что это гораздо сложнее, чем кажется.&lt;/p&gt;\n","links":[{"url":"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-card.jpg"},"content":{"title":"Цифровой двойник города: как нейросети проектируют изменения в&amp;nbsp;реальности","text":"&lt;p&gt;Вместо дорогостоящих симуляций — ИИ-агент, который предлагает реалистичные правки для улучшения городской среды по фото.&lt;/p&gt;\n","links":[{"url":"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-card.jpg"},"content":{"title":"LiteReality-Agent: как превратить сканы комнат в&amp;nbsp;интерактивные 3D-модели с&amp;nbsp;помощью кода","text":"&lt;p&gt;Исследователи научили ИИ-агентов превращать обычные RGB-D сканы помещений в полноценные цифровые двойники через написание Python-скриптов.&lt;/p&gt;\n","links":[{"url":"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to-card.jpg"},"content":{"title":"Почему ваш ИИ-агент &amp;laquo;притворяется&amp;raquo; умным: ловушка бенчмарков","text":"&lt;p&gt;Стандартные тесты часто хвалят маленькие языковые модели за навыки, которых у них нет. Разбираемся, как проверить реальные способности ИИ.&lt;/p&gt;\n","links":[{"url":"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-card.jpg"},"content":{"title":"Планирование с&amp;nbsp;костями: как заставить нейросети генерировать по-настоящему разные ответы","text":"&lt;p&gt;Почему современные ИИ дают скучные ответы и как метод Gacha Decoding меняет правила игры с помощью случайных чисел.&lt;/p&gt;\n","links":[{"url":"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-card.jpg"},"content":{"title":"Считаем объекты на&amp;nbsp;спутниковых снимках без дообучения нейросетей","text":"&lt;p&gt;Как научить ИИ распознавать корабли и здания в новых регионах, не тратя время на переобучение модели под каждый снимок?&lt;/p&gt;\n","links":[{"url":"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-card.jpg"},"content":{"title":"Почему обучение нейросетей на&amp;nbsp;контенте от&amp;nbsp;ИИ&amp;nbsp;ведет к&amp;nbsp;деградации моделей","text":"&lt;p&gt;Исследователи выяснили: чем больше сгенерированного ИИ текста в обучающей выборке, тем хуже результат.&lt;/p&gt;\n","links":[{"url":"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-card.jpg"},"content":{"title":"Почему нейросети ошибаются в&amp;nbsp;командах Kali Linux и&amp;nbsp;как это исправить","text":"&lt;p&gt;Разбираем KaliBench — новый бенчмарк, который учит ИИ точно управлять инструментами кибербезопасности без ошибок в синтаксисе.&lt;/p&gt;\n","links":[{"url":"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri-card.jpg"},"content":{"title":"Доверие&amp;nbsp;&amp;mdash; это не&amp;nbsp;оценка: как ограничить власть ИИ-агентов","text":"&lt;p&gt;Почему высокий рейтинг безопасности ИИ не гарантирует надежность системы и как внедрить жесткие правила контроля.&lt;/p&gt;\n","links":[{"url":"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-card.jpg"},"content":{"title":"Как ИИ&amp;nbsp;помогает проверять факты в&amp;nbsp;соцсетях: опыт Community Notes","text":"&lt;p&gt;Разбираемся, как алгоритмы и краудсорсинг вместе борются с дезинформацией на платформе X.&lt;/p&gt;\n","links":[{"url":"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-card.jpg"},"content":{"title":"Робот, который помнит прошлое: как научить машину находить спрятанные предметы","text":"&lt;p&gt;Роботы часто теряются, если объект исчез из поля зрения. Новая система BeyondSCe позволяет им «вспоминать» события и находить скрытые цели.&lt;/p&gt;\n","links":[{"url":"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-card.jpg"},"content":{"title":"VISTA: как научить нейросети &amp;laquo;вспоминать&amp;raquo; увиденное для решения сложных задач","text":"&lt;p&gt;Новый визуальный интерфейс позволяет ИИ-агентам хранить и пересматривать кадры из прошлого, радикально улучшая точность их действий.&lt;/p&gt;\n","links":[{"url":"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html","text":"Читать","arrow":true,"theme":"normal"}]}}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"arXiv — вычислительная биология и биофизика","vcsPath":"rubrics/arxiv.yaml"},"title":"arXiv — вычислительная биология и биофизика"},"router":{"pathname":"rubrics/arxiv","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
