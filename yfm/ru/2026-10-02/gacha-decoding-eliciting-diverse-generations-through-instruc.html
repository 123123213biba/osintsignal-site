        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"246\" cy=\"78\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"574\" cy=\"258\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Планирование с костями: как&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;заставить нейросети&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;генерировать по-настоящему&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;разные ответы&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Разработчики представили метод Gacha Decoding, который переводит генерацию контента из области вероятностей токенов в плоскость следования инструкциям. Вместо того чтобы полагаться на внутреннюю энтропию модели, система использует внешнюю случайность для выбора идей. Это позволяет получать разнообразные и качественные ответы даже от моделей, склонных к однообразию.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Метод использует внешнюю случайность для выбора идей, а не полагается на энтропию токенов модели.&lt;/li&gt;\n&lt;li&gt;Разнообразие ответов растет вместе с мощностью модели, преодолевая традиционный компромисс между качеством и вариативностью.&lt;/li&gt;\n&lt;li&gt;Эффективность метода подтверждена в задачах чата, творческого письма, планирования изображений и дизайна белков.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Традиционные языковые модели часто страдают от «схлопывания» ответов, когда при повышении качества модели их креативность падает. Метод Gacha Decoding решает эту проблему, разделяя процесс генерации на этапы: планирование семантических осей, перечисление вариантов и выбор одного из них с помощью внешнего генератора случайных чисел (RNG). Это превращает генерацию в авторегрессионный процесс в «пространстве идей», где каждое решение зависит от предыдущих.&lt;/p&gt;\n&lt;p&gt;Исследование показало, что такой подход превосходит существующие методы разнообразия до 2,4 раза по метрике Vendi Score. При этом количество необходимых выборок для достижения качественного результата сокращается в 11 раз. Метод работает как надстройка над любой моделью, используя её способность следовать инструкциям для формирования разнообразных планов, которые затем реализуются в финальный текст.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод требует дополнительных вызовов модели для планирования и перечисления вариантов, что увеличивает время генерации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Мы представляем Gacha Decoding — метод генерации на этапе вывода (inference-time), который позволяет получать разнообразные ответы от языковых моделей (LM), масштабируясь вместе с их мощностью. Метод показал превосходство в открытых доменах: от повседневного общения и креативного письма до планирования генерации изображений и дизайна белков. Gacha Decoding превосходит существующие подходы по разнообразию при сохранении качества (улучшение показателя Vendi до 2.4 раза по сравнению с лучшими аналогами), достигая того же количества качественных мод при использовании в 11 раз меньшего числа выборок. Ключевая идея заключается в переосмыслении разнообразия как задачи следования инструкциям (instruction-following): вместо опоры на энтропию токенов, мы используем способность модели следовать инструкциям в сочетании со случайными числами из внешнего генератора (RNG). Этот подход «планирования с костями» устраняет противоречие между разнообразием и качеством модели. По мере того как базовая LM становится лучше в следовании инструкциям, разнообразие при использовании Gacha Decoding растет, даже если энтропия токенов снижается.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding повышает разнообразие ответов в 2.4 раза и сокращает количество необходимых выборок в 11 раз, превращая задачу генерации в процесс следования инструкциям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В Рис. 1 демонстрируется работа метода в сравнении с подходом Verbalized Sampling. Gacha Decoding использует внешние случайные параметры для формирования уникальных текстовых промптов, что позволяет модели генерировать более разнообразные визуальные концепты. В отличие от стандартных методов, которые полагаются на внутреннюю вероятностную неопределенность модели, Gacha Decoding активно управляет процессом через внешние инструкции, что подтверждается результатами на датасете InfinityChat.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vendi Score — метрика, используемая для оценки разнообразия генераций, где более высокие значения указывают на более широкий спектр уникальных и качественных ответов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"problema-raznoobraziya-v-yazykovyh-modelyah\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#problema-raznoobraziya-v-yazykovyh-modelyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проблема разнообразия в языковых моделях&lt;/span&gt;&lt;/a&gt;Проблема разнообразия в языковых моделях&lt;/h4&gt;\n&lt;p&gt;Современные языковые модели (LM) все чаще применяются для творческих и исследовательских задач, однако им критически не хватает человеческого разнообразия и новизны. Даже при открытых запросах модели склонны выдавать ограниченный набор типичных ответов. Это снижает полезность инструментов для пользователей, ограничивает возможности синтеза данных и в долгосрочной перспективе грозит гомогенизацией мышления. Ранее исследователи пытались решить эту проблему, манипулируя энтропией распределения токенов: меняя параметры сэмплирования, применяя специальные функции потерь или подбирая обучающие данные. Однако такой подход создает конфликт: методы повышения качества моделей (пост-тренинг) часто снижают энтропию, из-за чего с ростом способностей модели её генеративное разнообразие падает.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторы доказывают, что конфликт между качеством и разнообразием не является фундаментальным, предлагая рассматривать разнообразие как задачу следования инструкциям (instruction following, IF), а не как вопрос энтропии токенов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metod-dekodirovaniya-gacha\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#metod-dekodirovaniya-gacha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метод декодирования Gacha&lt;/span&gt;&lt;/a&gt;Метод декодирования Gacha&lt;/h4&gt;\n&lt;p&gt;Авторы представляют Gacha Decoding — метод вывода, который использует способности модели к следованию инструкциям в сочетании с внешним генератором случайных чисел (RNG). Вместо того чтобы полагаться на случайность при выборе каждого токена, модель «планирует с помощью костей» (см. Рис. 2). Для любой задачи модель сначала определяет последовательность семантических решений (например, выбор сеттинга или персонажей в истории), затем последовательно выбирает варианты из предложенных ею же опций с помощью внешнего RNG. Каждое решение обусловлено предыдущими, что позволяет вариативности накапливаться комбинаторно.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding — это «обертка» над моделью, которая переносит авторегрессионную генерацию с уровня отдельных токенов на уровень смысловых идей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В экспериментах по творческому письму, планированию изображений и дизайну белков Gacha Decoding превзошел существующие методы, обеспечив до 2,4-кратного прироста разнообразия по метрике Vendi-score при сохранении или улучшении качества ответов (Рис. 1A). Важно, что разнообразие Gacha Decoding растет вместе с мощностью модели, даже когда стандартные методы показывают спад (Рис. 1B). Метод сохраняет эффективность даже при детерминированном жадном декодировании (greedy decoding).&lt;/p&gt;\n&lt;h4 id=\"obzor-chto-takoe-gacha-decoding\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#obzor-chto-takoe-gacha-decoding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор: что такое Gacha Decoding?&lt;/span&gt;&lt;/a&gt;Обзор: что такое Gacha Decoding?&lt;/h4&gt;\n&lt;p&gt;Мы представляем Gacha Decoding — метод, позволяющий получать разнообразные варианты генерации от языковых моделей (LM). Основная идея заключается в дополнении логических рассуждений модели случайностью. Процесс состоит из двух этапов: модель определяет последовательность решений, влияющих на результат, а затем каждое решение выбирается путем перечисления возможных вариантов и их выбора с помощью внешнего генератора случайных чисел (RNG). Например, при написании истории о собаке модель сначала выбирает сеттинг (например, современный пригород или историческая Япония), используя «бросок костей». Последующие решения, такие как роль собаки или точка зрения повествования, зависят от этого выбора, что позволяет разнообразию накапливаться по мере формирования сюжета. Gacha Decoding переносит источник вариативности с энтропии токенов на следование инструкциям. Фактически, это рандомизированный авторегрессионный процесс в пространстве идей, который можно реализовать как агентную надстройку над существующей моделью.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding обеспечивает разнообразие генерации, заменяя вероятностный выбор токенов осознанным планированием решений с использованием внешнего генератора случайных чисел.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"raznoobrazie-cherez-sledovanie-instrukciyam-i-planirovanie-s-kostyami\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#raznoobrazie-cherez-sledovanie-instrukciyam-i-planirovanie-s-kostyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разнообразие через следование инструкциям и планирование с «костями»&lt;/span&gt;&lt;/a&gt;Разнообразие через следование инструкциям и планирование с «костями»&lt;/h4&gt;\n&lt;p&gt;Мы выделяем три ключевых элемента дизайна, которые обеспечивают работу метода: работа в семантическом пространстве идей, разделение этапов перечисления вариантов и их выбора, а также авторегрессионная природа процесса. Как показано в Алгоритме 1, процесс делится на две фазы. В первой фазе модель определяет T семантических осей решений, которые будут формировать ответ, не задавая их конкретных значений. Во второй фазе, для каждого шага от t=1 до T, модель перечисляет набор C_t правдоподобных и семантически различных вариантов для текущей оси a_t, основываясь на промпте и уже принятых решениях z&amp;lt;t. Затем с помощью внешнего RNG выбирается один вариант z_t из набора C_t с равномерным распределением.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Семантическое пространство идей — это уровень абстракции, где модель оперирует концепциями (например, «сеттинг» или «характер персонажа»), а не отдельными словами или токенами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"realizaciya-i-rabota-v-prostranstve-idej\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#realizaciya-i-rabota-v-prostranstve-idej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реализация и работа в пространстве идей&lt;/span&gt;&lt;/a&gt;Реализация и работа в пространстве идей&lt;/h4&gt;\n&lt;p&gt;Процесс генерации ответа разделен на три этапа: интеграция решений в финальный план, выбор одного из них с помощью внешнего генератора случайных чисел (ГСЧ) и итоговая генерация текста y на основе выбранного плана. Вероятность итогового ответа определяется как &lt;span class=\"yfm-latex\" data-content=\"p(y%2F%20x)%20%3D%20%5Cprod_%7Bt%3D1%7D%5E%7BT%7D%20p_%20heta(y_t%2F%20x%2C%20y_%7B%3Ct%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Стандартная выборка токенов ограничена, так как она зависит от энтропии модели, которая снижается по мере совершенствования нейросетей, и не учитывает семантическое разнообразие. Для решения этой проблемы авторы вводят латентную переменную z (план или идея), разделяя высокоуровневую семантику и поверхностную реализацию через формулу &lt;span class=\"yfm-latex\" data-content=\"p(y%2F%20x)%20%3D%20%5Cint%20p_%20heta(y%2F%20z%2C%20x)%20q(z%2F%20x)%20dz\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод Gacha Decoding переносит вариативность с уровня токенов на уровень семантических планов, используя внешнюю рандомизацию для выбора идей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В отличие от методов, где модель сама генерирует план z напрямую, что ограничено её собственной энтропией, Gacha Decoding использует модель для перечисления набора C различных вариантов, а выбор делегирует внешнему ГСЧ. Это позволяет эффективно использовать способности модели к следованию инструкциям (IF), генерируя разнообразные идеи даже при жадном декодировании. Чтобы избежать ограничений контекстного окна, авторы применяют авторегрессионную выборку идей: &lt;span class=\"yfm-latex\" data-content=\"q(z%2F%20x)%20%3D%20%5Cprod_%7Bt%3D1%7D%5E%7BT%7D%20q(z_t%2F%20x%2C%20z_%7B%3Ct%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Это позволяет комбинировать множество траекторий, где каждый последующий выбор зависит от предыдущего, раскрывая специфические детали (например, выбор сеттинга «Древний Рим» сужает пространство последующих решений до гладиаторов или сената).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторегрессионная выборка — это пошаговое принятие решений, где каждый следующий шаг зависит от результатов предыдущих, что позволяет строить сложные и логичные цепочки идей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"eksperimentalnaya-ustanovka\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#eksperimentalnaya-ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экспериментальная установка&lt;/span&gt;&lt;/a&gt;Экспериментальная установка&lt;/h4&gt;\n&lt;p&gt;Эффективность Gacha Decoding тестируется в трех областях: чат-боты, творческое письмо и переписывание промптов для генерации изображений, а также в пилотном исследовании по дизайну белков. Для каждого промпта x_i генерируется набор из N ответов. Качество оценивается через «отфильтрованный по качеству» показатель разнообразия: в расчет берутся только те ответы, чье качество превышает 95% от среднего показателя при стандартной прямой выборке. Это позволяет исключить низкокачественные образцы, которые могли бы искусственно завысить метрики разнообразия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка разнообразия нормализуется по качеству, чтобы избежать учета «шумных» или бессмысленных ответов, которые могут возникать при случайной генерации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"modeli,-bazovye-linii-i-predshestvuyushie-podhody\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#modeli,-bazovye-linii-i-predshestvuyushie-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модели, базовые линии и предшествующие подходы&lt;/span&gt;&lt;/a&gt;Модели, базовые линии и предшествующие подходы&lt;/h4&gt;\n&lt;p&gt;Для оценки эффективности GachaDecoding мы сопоставили его с рядом существующих методов диверсификации генерации. Во-первых, это прямое сэмплирование (Direct sampling) с использованием стандартной температуры модели и повышенной (1.5). Во-вторых, метод «списочного промптинга» (List prompting), где модель инструктируют генерировать k уникальных ответов за один проход, при этом предыдущие ответы остаются в контексте, что позволяет избегать повторов. Также мы использовали вербализованное сэмплирование (Verbalized Sampling), при котором модель выводит распределение вероятностей для k ответов, и прямое планирование (Direct Planning), разделяющее процесс на два этапа: генерацию высокоуровневого плана при температуре 1.2 и последующее создание ответа на его основе. Дополнительно применялись «сид-промптинг» (Seed Prompting) с добавлением случайных ASCII-строк и «персона-промптинг» (Persona Prompting), где модель имитирует случайно выбранные роли из заданного набора.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод «персона-промптинга» использует семантически значимые роли для управления вариативностью, в отличие от случайных символьных последовательностей в «сид-промптинге».&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenivaemye-modeli\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#ocenivaemye-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оцениваемые модели&lt;/span&gt;&lt;/a&gt;Оцениваемые модели&lt;/h4&gt;\n&lt;p&gt;Исследование охватывает как открытые модели (семейства GPT-OSS, Inkling, Qwen 3.5), так и закрытые (Claude Opus 4.8, GPT 5.5). Во всех случаях активировался режим «мышления» (thinking mode) с рекомендованными параметрами. Важно отметить, что для API-моделей в режиме мышления изменение температуры невозможно, поэтому методы, требующие её настройки, для них были исключены.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничение: API-модели не позволяют гибко настраивать температуру в режиме мышления, что сужает набор применимых к ним методов диверсификации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"oblasti-otkrytogo-testirovaniya\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#oblasti-otkrytogo-testirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Области открытого тестирования&lt;/span&gt;&lt;/a&gt;Области открытого тестирования&lt;/h4&gt;\n&lt;p&gt;Оценка качества и разнообразия ответов проводилась в трех ключевых доменах. В категории «живого» общения (In-the-wild chat) использовался датасет InfinityChat для задач поиска советов и генерации идей. Разнообразие оценивалось через расстояние между эмбеддингами ответов (Vendi score), а качество — через валидацию с помощью языковой модели (LM-judge). В творческом письме на основе WildChat мы оценивали истории по шкале 0–20 баллов. Разнообразие здесь измерялось через макросреднее значение Vendi score по восьми семантическим атрибутам (от жанра до развязки), что позволяет уйти от простых лексических различий к содержательным.&lt;/p&gt;\n&lt;p&gt;В области генерации изображений мы тестировали расширение пользовательских промптов x до детальных описаний x' перед отрисовкой. Использовались промпты из OneIGBench и модель Qwen-Image-2512. Качество оценивалось по соответствию исходному запросу, а разнообразие — через Vendi score на основе эмбеддингов DreamSim для финальных изображений. Основные результаты представлены на Рис. 3.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование Vendi score по семантическим атрибутам в творческом письме и эмбеддингам DreamSim в генерации изображений позволяет объективно измерить содержательное разнообразие результатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"gacha-decoding-demonstriruet-prevoshodstvo-i-masshtabiruemost\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-decoding-demonstriruet-prevoshodstvo-i-masshtabiruemost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha Decoding демонстрирует превосходство и масштабируемость&lt;/span&gt;&lt;/a&gt;Gacha Decoding демонстрирует превосходство и масштабируемость&lt;/h4&gt;\n&lt;p&gt;Gacha Decoding значительно опережает существующие подходы, причем преимущество возрастает при увеличении масштабов генерации. Ключевой результат заключается в достижении более высокого разнообразия при сохранении качества ответов. Например, при использовании модели Opus 4.8 и 256 генераций на запрос, метод обеспечивает 7,1-кратный прирост разнообразия с контролем качества по сравнению с прямым сэмплированием. С точки зрения эффективности, Gacha Decoding требует в 4,7 раза меньше генераций, чем метод «list prompting» (лучший из альтернатив), для достижения того же уровня покрытия мод (около 55 генераций против 256). Превосходство над другими методами, такими как Verbalized Sampling и Seed Prompting, достигает 20,7x и почти 38x соответственно (Рис. 3).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding обеспечивает кратный рост эффективности: до 11,0x по сравнению с persona prompting и до 38x по сравнению с другими методами при сопоставимом качестве.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Метод позволяет обнаруживать принципиально новые типы ответов. Например, при запросе на написание хоррор-истории о квартире в Сингапуре, Claude с Gacha Decoding генерирует истории от второго лица, в то время как другие методы ограничены повествованием от третьего лица (Рис. S6). В генерации изображений различия в разнообразии визуально очевидны (Рис. 1). Интересно, что метод «list prompting» показывает лучшие результаты, чем считалось ранее, вероятно, из-за тщательной настройки количества генераций в списке (до 512) и гиперпараметров.&lt;/p&gt;\n&lt;h4 id=\"gacha-masshtabiruetsya-s-navykami-sledovaniya-instrukciyam-if-i-rabotaet-pri-zhadnoj-dekodirovke\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#gacha-masshtabiruetsya-s-navykami-sledovaniya-instrukciyam-if-i-rabotaet-pri-zhadnoj-dekodirovke\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gacha масштабируется с навыками следования инструкциям (IF) и работает при жадной декодировке&lt;/span&gt;&lt;/a&gt;Gacha масштабируется с навыками следования инструкциям (IF) и работает при жадной декодировке&lt;/h4&gt;\n&lt;p&gt;Метод основан на способности модели следовать инструкциям (Instruction Following, IF), а не на энтропии токенов. Это позволяет предположить, что разнообразие будет расти вместе с навыками IF модели и сохранится даже при жадной декодировке (нулевая энтропия).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Жадная декодировка (greedy decoding) — это процесс генерации, при котором модель всегда выбирает токен с максимальной вероятностью, что обычно делает ответы детерминированными и однообразными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"masshtabirovanie-s-if-sposobnostyami\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#masshtabirovanie-s-if-sposobnostyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Масштабирование с IF-способностями&lt;/span&gt;&lt;/a&gt;Масштабирование с IF-способностями&lt;/h4&gt;\n&lt;p&gt;В отличие от прямого сэмплирования, где разнообразие часто падает с ростом мощности модели (из-за снижения энтропии), Gacha Decoding демонстрирует положительную корреляцию с IF-способностями. Тестирование проводилось на семействе Qwen 3.5 (от 2B до 27B параметров) с использованием метрики IFBench (Рис. 4). В то время как прямое сэмплирование показывает отрицательную корреляцию разнообразия с мощностью модели в чатах и генерации изображений, Gacha Decoding стабильно масштабируется во всех доменах. Метод преодолевает ограничения других подходов, таких как list prompting, которые эффективны в коротких форматах, но теряют потенциал в длинных творческих задачах, так как Gacha использует авторегрессию в пространстве идей с внешним генератором случайных чисел.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"raznoobrazie-pri-zhadnoj-dekodirovke\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#raznoobrazie-pri-zhadnoj-dekodirovke\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разнообразие при жадной декодировке&lt;/span&gt;&lt;/a&gt;Разнообразие при жадной декодировке&lt;/h4&gt;\n&lt;p&gt;Даже при жадной декодировке на моделях Qwen 3.5 27B, GPT-OSS и Inkling, Gacha Decoding сохраняет высокое разнообразие, часто превосходя методы с температурным сэмплированием. Напротив, методы, основанные на списках, резко теряют эффективность при отсутствии энтропии (Таблица S3).&lt;/p&gt;\n&lt;h4 id=\"prakticheskij-primer-dizajn-belkov\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prakticheskij-primer-dizajn-belkov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Практический пример: дизайн белков&lt;/span&gt;&lt;/a&gt;Практический пример: дизайн белков&lt;/h4&gt;\n&lt;p&gt;Мы применили Gacha Decoding для решения задачи de novo дизайна белковых связывающих агентов (бин-деров). Современные генеративные модели часто ограничены узким набором структурных фолдов, что снижает эффективность поиска. Используя GPT 5.5, мы генерировали описания белков для восьми целей (включая PD-1) и преобразовывали их в комплексы с помощью фиксированной модели генерации. Качество интерфейса оценивалось через ipSAEmin, отбирались только варианты с показателем выше 0,5. Структурное разнообразие измерялось с помощью Vendi-score на основе TM-score.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding обеспечивает наибольшее структурное разнообразие (Vendi-score) среди всех методов, проходящих порог качества ipSAEmin &amp;gt; 0,5, при этом разрыв в пользу Gacha увеличивается с ростом бюджета дизайна.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Как показано на Рис. 5, Gacha Decoding превосходит методы вербализованного и спискового промптинга. Например, для мишени PD-1 Gacha создает белки со смешанной α/β-структурой, тогда как базовые методы ограничены исключительно α-спиральными фолдами.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-f5.jpg\" alt=\"Рис. 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"analiz-pochemu-rabotaet-gacha-decoding\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#analiz-pochemu-rabotaet-gacha-decoding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ: почему работает Gacha Decoding?&lt;/span&gt;&lt;/a&gt;Анализ: почему работает Gacha Decoding?&lt;/h4&gt;\n&lt;p&gt;Мы провели абляционное исследование трех ключевых решений метода (подробности в Приложении А.4): (А) рандомизация по идеям, а не токенам; (Б) использование внешнего генератора случайных чисел (RNG) для выбора из списка вариантов; (В) авторегрессионная выборка идей. Сравнение проводилось на моделях GPT-OSS-120B и Opus 4.8 (Таблица 1).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Сравнение методов декодирования&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Метод&lt;/th&gt;\n&lt;th&gt;Значение 1&lt;/th&gt;\n&lt;th&gt;Значение 2&lt;/th&gt;\n&lt;th&gt;Значение 3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(A) Рандомизация идей, а не токенов&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;10.08&lt;/td&gt;\n&lt;td&gt;9.44&lt;/td&gt;\n&lt;td&gt;9.23&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Standardtokensampling(T=1)&lt;/td&gt;\n&lt;td&gt;2.41&lt;/td&gt;\n&lt;td&gt;5.25&lt;/td&gt;\n&lt;td&gt;4.01&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=10)&lt;/td&gt;\n&lt;td&gt;3.28&lt;/td&gt;\n&lt;td&gt;3.07&lt;/td&gt;\n&lt;td&gt;4.66&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=20)&lt;/td&gt;\n&lt;td&gt;3.46&lt;/td&gt;\n&lt;td&gt;0.44&lt;/td&gt;\n&lt;td&gt;4.93&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=10)&lt;/td&gt;\n&lt;td&gt;3.19&lt;/td&gt;\n&lt;td&gt;0.31&lt;/td&gt;\n&lt;td&gt;4.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=20)&lt;/td&gt;\n&lt;td&gt;2.15&lt;/td&gt;\n&lt;td&gt;0.03&lt;/td&gt;\n&lt;td&gt;4.99&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(B) Выборка через разделение перечисления и отбора&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;10.61&lt;/td&gt;\n&lt;td&gt;10.08&lt;/td&gt;\n&lt;td&gt;8.21&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NoexternalRNG(LMselectschoicesfromitslist)&lt;/td&gt;\n&lt;td&gt;5.34&lt;/td&gt;\n&lt;td&gt;6.75&lt;/td&gt;\n&lt;td&gt;5.46&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Noenumeration(directlypromptLMfordecision)&lt;/td&gt;\n&lt;td&gt;5.73&lt;/td&gt;\n&lt;td&gt;7.50&lt;/td&gt;\n&lt;td&gt;5.50&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(C) Выборка идей как авторегрессионных локальных решений&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляция — это метод проверки значимости компонентов системы путем их поочередного отключения для оценки влияния на итоговый результат.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вариант без использования внешнего RNG (no-RNG) снижает разнообразие почти вдвое: модели склонны выбирать средние по рангу варианты из списка, демонстрируя когнитивное искажение, схожее с человеческим.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Все протестированные варианты (idea-list, independent axes, no-RNG) показали худшие результаты, чем Gacha Decoding, что подтверждает критическую важность каждого этапа.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty-problema-raznoobraziya-yazykovyh-modelej\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#svyazannye-raboty-problema-raznoobraziya-yazykovyh-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы: проблема разнообразия языковых моделей&lt;/span&gt;&lt;/a&gt;Связанные работы: проблема разнообразия языковых моделей&lt;/h4&gt;\n&lt;p&gt;Существующая литература подтверждает, что генерации языковых моделей часто страдают от нехватки разнообразия, что снижает полезность ИИ в творческих задачах и научных исследованиях. Проблема усугубляется тем, что обучение с подкреплением и пост-тренинг часто снижают энтропию токенов, делая модели более однообразными. Мы доказываем, что это противоречие не является фундаментальным, и используем возможности следования инструкциям (IF) для повышения вариативности вывода.&lt;/p&gt;\n&lt;h4 id=\"podhody-k-povysheniyu-raznoobraziya\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#podhody-k-povysheniyu-raznoobraziya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подходы к повышению разнообразия&lt;/span&gt;&lt;/a&gt;Подходы к повышению разнообразия&lt;/h4&gt;\n&lt;p&gt;Исследователи разделяют методы улучшения разнообразия генераций на две категории: вмешательства на этапе обучения и на этапе вывода. Методы обучения сфокусированы на изменении самого распределения токенов языковой модели (LM). Это достигается за счет тщательного отбора обучающих данных или внедрения специализированных функций потерь в процессе дообучения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вмешательство на этапе обучения — это изменение «мировоззрения» модели через корректировку данных или правил, по которым она учится предсказывать следующий токен.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Методы вывода традиционно направлены на модификацию процесса сэмплирования. В последнее время акцент сместился на управление генерацией через задание контекстных сигналов: использование начальных параметров (seeds), ролевых моделей (personas) или явных указаний режима работы. Наиболее близким к нашей работе является подход, где диверсификация планов действий ведет к разнообразию итоговых ответов. Мы систематизируем эти наработки в рамках концепции следования инструкциям (instruction-following), доказывая, что использование внешнего генератора случайных чисел (RNG) в сочетании с выполнением инструкций (IF) обеспечивает высокую вариативность без необходимости искусственного повышения энтропии токенов модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование внешнего RNG и следования инструкциям позволяет достичь высокого разнообразия ответов без манипуляций с энтропией распределения токенов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Стоит отметить, что проблема выбора разнообразных вариантов сложна даже для людей. В неформальном опросе с выборкой n=200 000 респондентов было выявлено, что люди склонны выбирать число 37, что может объяснять аналогичные когнитивные искажения, наблюдаемые в языковых моделях.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;В данной работе авторы переосмысливают проблему генеративного разнообразия, предлагая рассматривать её не через призму энтропии токенов языковой модели (которая склонна к деградации при масштабировании и пост-тренировке), а как задачу следования инструкциям. Модели выступают в роли логических компонентов, преобразующих внешнюю случайность в полезные и разнообразные ответы. Метод Gacha Decoding опирается на способность современных моделей перечислять варианты по запросу, что позволяет значительно превзойти существующие подходы.&lt;/p&gt;\n&lt;h4 id=\"metod\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метод&lt;/span&gt;&lt;/a&gt;Метод&lt;/h4&gt;\n&lt;p&gt;Для оценки эффективности метода использовались модели Claude Opus, GPT-5.5, GPT-OSS 120B и Inkling Large. Основной метрикой является «разнообразие с фильтрацией качества» (Quality-gated diversity) — показатель Vendi, рассчитанный для ответов, прошедших проверку качества. В качестве порога прохождения (Gate pass rate) приняты 95% от среднего значения прямой выборки модели для того же промпта. Качество оценивалось по бинарной валидности ответов, рубрикам для историй (0–20 баллов) и соответствию изображений (0–1). Эксперименты проводились с выборкой n=512 для открытых моделей и n=256 для закрытых. Таблица 2 демонстрирует, что Gacha Decoding обеспечивает стабильно высокое разнообразие при сохранении качества ответов.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Результаты производительности моделей&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель/Метод&lt;/th&gt;\n&lt;th&gt;Gacha (Start)&lt;/th&gt;\n&lt;th&gt;Gacha (End)&lt;/th&gt;\n&lt;th&gt;Δ&lt;/th&gt;\n&lt;th&gt;List (Start)&lt;/th&gt;\n&lt;th&gt;List (End)&lt;/th&gt;\n&lt;th&gt;Δ&lt;/th&gt;\n&lt;th&gt;Verbal (Start)&lt;/th&gt;\n&lt;th&gt;Verbal (End)&lt;/th&gt;\n&lt;th&gt;Δ&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;GPT-OSS 120B&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;10.08&lt;/td&gt;\n&lt;td&gt;9.62&lt;/td&gt;\n&lt;td&gt;−4.6%&lt;/td&gt;\n&lt;td&gt;9.44&lt;/td&gt;\n&lt;td&gt;9.20&lt;/td&gt;\n&lt;td&gt;−2.5%&lt;/td&gt;\n&lt;td&gt;9.23&lt;/td&gt;\n&lt;td&gt;8.82&lt;/td&gt;\n&lt;td&gt;−4.5%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;List&lt;/td&gt;\n&lt;td&gt;7.62&lt;/td&gt;\n&lt;td&gt;4.71&lt;/td&gt;\n&lt;td&gt;−38.1%&lt;/td&gt;\n&lt;td&gt;1.93&lt;/td&gt;\n&lt;td&gt;0.06&lt;/td&gt;\n&lt;td&gt;−96.8%&lt;/td&gt;\n&lt;td&gt;7.84&lt;/td&gt;\n&lt;td&gt;4.48&lt;/td&gt;\n&lt;td&gt;−42.9%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Verbalized&lt;/td&gt;\n&lt;td&gt;6.07&lt;/td&gt;\n&lt;td&gt;3.83&lt;/td&gt;\n&lt;td&gt;−36.9%&lt;/td&gt;\n&lt;td&gt;4.49&lt;/td&gt;\n&lt;td&gt;0.65&lt;/td&gt;\n&lt;td&gt;−85.5%&lt;/td&gt;\n&lt;td&gt;4.73&lt;/td&gt;\n&lt;td&gt;3.19&lt;/td&gt;\n&lt;td&gt;−32.7%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Persona&lt;/td&gt;\n&lt;td&gt;4.64&lt;/td&gt;\n&lt;td&gt;4.64&lt;/td&gt;\n&lt;td&gt;+0.2%&lt;/td&gt;\n&lt;td&gt;6.71&lt;/td&gt;\n&lt;td&gt;6.58&lt;/td&gt;\n&lt;td&gt;−1.8%&lt;/td&gt;\n&lt;td&gt;4.74&lt;/td&gt;\n&lt;td&gt;4.67&lt;/td&gt;\n&lt;td&gt;−1.5%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Seed&lt;/td&gt;\n&lt;td&gt;3.35&lt;/td&gt;\n&lt;td&gt;3.08&lt;/td&gt;\n&lt;td&gt;−8.0%&lt;/td&gt;\n&lt;td&gt;5.12&lt;/td&gt;\n&lt;td&gt;4.74&lt;/td&gt;\n&lt;td&gt;−7.3%&lt;/td&gt;\n&lt;td&gt;4.95&lt;/td&gt;\n&lt;td&gt;4.68&lt;/td&gt;\n&lt;td&gt;−5.5%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Inkling Large&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;11.65&lt;/td&gt;\n&lt;td&gt;11.65&lt;/td&gt;\n&lt;td&gt;0.0%&lt;/td&gt;\n&lt;td&gt;8.44&lt;/td&gt;\n&lt;td&gt;8.03&lt;/td&gt;\n&lt;td&gt;−4.8%&lt;/td&gt;\n&lt;td&gt;9.04&lt;/td&gt;\n&lt;td&gt;9.05&lt;/td&gt;\n&lt;td&gt;+0.1%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;List&lt;/td&gt;\n&lt;td&gt;10.11&lt;/td&gt;\n&lt;td&gt;5.90&lt;/td&gt;\n&lt;td&gt;−41.7%&lt;/td&gt;\n&lt;td&gt;1.54&lt;/td&gt;\n&lt;td&gt;0.06&lt;/td&gt;\n&lt;td&gt;−96.0%&lt;/td&gt;\n&lt;td&gt;8.07&lt;/td&gt;\n&lt;td&gt;4.94&lt;/td&gt;\n&lt;td&gt;−38.8%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Verbalized&lt;/td&gt;\n&lt;td&gt;3.96&lt;/td&gt;\n&lt;td&gt;1.69&lt;/td&gt;\n&lt;td&gt;−57.4%&lt;/td&gt;\n&lt;td&gt;6.04&lt;/td&gt;\n&lt;td&gt;0.54&lt;/td&gt;\n&lt;td&gt;−91.0%&lt;/td&gt;\n&lt;td&gt;4.06&lt;/td&gt;\n&lt;td&gt;1.23&lt;/td&gt;\n&lt;td&gt;−69.6%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Persona&lt;/td&gt;\n&lt;td&gt;6.65&lt;/td&gt;\n&lt;td&gt;6.56&lt;/td&gt;\n&lt;td&gt;−1.4%&lt;/td&gt;\n&lt;td&gt;6.54&lt;/td&gt;\n&l ;/td&gt;\n&lt;td&gt;4.60&lt;/td&gt;\n&lt;td&gt;3.54&lt;/td&gt;\n&lt;td&gt;−23.0%&lt;/td&gt;\n&lt;td&gt;4.64&lt;/td&gt;\n&lt;td&gt;4.00&lt;/td&gt;\n&lt;td&gt;−13.9%&lt;/td&gt;\n&lt;td&gt;4.91&lt;/td&gt;\n&lt;td&gt;4.07&lt;/td&gt;\n&lt;td&gt;−17.1%&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Gacha Decoding позволяет достичь высокого разнообразия ответов, используя способность моделей следовать инструкциям, при этом метод демонстрирует превосходство над стандартными подходами во всех протестированных архитектурах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Vendi score — метрика, используемая для количественной оценки разнообразия набора данных, где более высокие значения указывают на большую вариативность ответов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При использовании жадной декодировки (greedy decoding) методы типа Verbalized Sampling часто показывают резкое падение качества, так как модели начинают генерировать бессвязные ответы, не проходящие фильтр качества, в отличие от Gacha Decoding, который сохраняет стабильность (Таблица 3).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Дополнительное сравнение методов&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Метод&lt;/th&gt;\n&lt;th&gt;Значение 1&lt;/th&gt;\n&lt;th&gt;Значение 2&lt;/th&gt;\n&lt;th&gt;Значение 3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(A) Рандомизация идей, а не токенов&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;11.65&lt;/td&gt;\n&lt;td&gt;8.44&lt;/td&gt;\n&lt;td&gt;9.04&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Standardtokensampling(T=1)&lt;/td&gt;\n&lt;td&gt;2.54&lt;/td&gt;\n&lt;td&gt;5.45&lt;/td&gt;\n&lt;td&gt;3.26&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=10)&lt;/td&gt;\n&lt;td&gt;3.07&lt;/td&gt;\n&lt;td&gt;2.56&lt;/td&gt;\n&lt;td&gt;4.25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=3,K=20)&lt;/td&gt;\n&lt;td&gt;2.16&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;4.90&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=10)&lt;/td&gt;\n&lt;td&gt;1.79&lt;/td&gt;\n&lt;td&gt;0.03&lt;/td&gt;\n&lt;td&gt;5.02&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tokensampling(T=5,K=20)&lt;/td&gt;\n&lt;td&gt;0.42&lt;/td&gt;\n&lt;td&gt;0.00&lt;/td&gt;\n&lt;td&gt;5.29&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(B) Выборка через разделение перечисления и отбора&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Gacha Decoding (ours)&lt;/td&gt;\n&lt;td&gt;8.24&lt;/td&gt;\n&lt;td&gt;9.53&lt;/td&gt;\n&lt;td&gt;6.25&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;NoexternalRNG(LMselectschoicesfromitslist)&lt;/td&gt;\n&lt;td&gt;3.95&lt;/td&gt;\n&lt;td&gt;6.41&lt;/td&gt;\n&lt;td&gt;5.08&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Noenumeration(directlypromptLMfordecision)&lt;/td&gt;\n&lt;td&gt;4.58&lt;/td&gt;\n&lt;td&gt;6.38&lt;/td&gt;\n&lt;td&gt;4.42&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;(C) Выборка идей как авторегрессионных локальных решений&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h4 id=\"dopolnitelnye-rezultaty-ablyacionnogo-analiza\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#dopolnitelnye-rezultaty-ablyacionnogo-analiza\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дополнительные результаты абляционного анализа&lt;/span&gt;&lt;/a&gt;Дополнительные результаты абляционного анализа&lt;/h4&gt;\n&lt;p&gt;Мы представляем расширенные данные, подтверждающие выводы из Таблицы 1, касающиеся трех ключевых аспектов архитектуры Gacha Decoding: рандомизации на уровне семантических идей, отделения процесса перечисления вариантов от их выбора с помощью внешнего генератора случайных чисел (RNG) и авторегрессионной выборки идей. Результаты для Inkling и GPT-5.5 представлены в Таблице 4.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 4.&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-tT4.jpg\" alt=\"Таблица 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;(A) Рандомизация в пространстве идей против пространства токенов. Gacha Decoding использует внешний RNG для равномерной выборки из подготовленных моделью идей. Сравнение с методами top-p (p=0.95) и top-K при экстремальных температурах показало, что попытка имитировать этот подход на уровне токенов неэффективна. Повышение температуры выше 3 при любом значении K резко снижает связность ответов, что ограничивает разнообразие при сохранении качества. Работа именно в пространстве идей критически важна для достижения высокой степени случайности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование пространства идей вместо токенов позволяет достичь высокого разнообразия ответов без потери их логической связности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;(B) Разделение перечисления и выбора. Мы сравнили Gacha Decoding с двумя вариантами: без перечисления (модель сразу выбирает один вариант) и без внешнего RNG (модель сама выбирает из предложенного списка). В первом случае вариативность ограничена распределением токенов самой модели. Во втором случае, когда выбор делегируется модели, разнообразие ответов существенно падает, что подтверждается данными Таблицы 4.&lt;/p&gt;\n&lt;p&gt;(C) Авторегрессионная выборка идей. Мы сопоставили Gacha Decoding с двумя неавторегрессионными подходами: «Idea-list» (генерация полного списка идей за один шаг) и «Independent-axes» (независимая выборка по осям решений). В первом случае разнообразие зависит от энтропии токенов, а во втором — игнорируется контекстная зависимость решений. Результаты показывают, что Gacha Decoding превосходит оба метода, так как позволяет предыдущим случайным решениям влиять на последующие.&lt;/p&gt;\n&lt;h4 id=\"detali-realizacii-gacha-decoding\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#detali-realizacii-gacha-decoding\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детали реализации Gacha Decoding&lt;/span&gt;&lt;/a&gt;Детали реализации Gacha Decoding&lt;/h4&gt;\n&lt;p&gt;Все вызовы моделей выполняются с параметрами по умолчанию (температура 1.0, включенное рассуждение). Процесс начинается с планирования осей решений (шаг 1), где используется гиперпараметр T (количество осей). Мы не проводили исчерпывающий подбор T, полагая, что его оптимизация может улучшить показатели в будущих исследованиях.&lt;/p&gt;\n&lt;h4 id=\"prompt-b1-planirovanie-osej-prinyatiya-reshenij\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-b1-planirovanie-osej-prinyatiya-reshenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt B.1: Планирование осей принятия решений&lt;/span&gt;&lt;/a&gt;Prompt B.1: Планирование осей принятия решений&lt;/h4&gt;\n&lt;p&gt;Для структурирования пространства возможных результатов задачи используется схема, разбивающая процесс на последовательные этапы принятия решений. Цель — достичь заданного результата за T шагов. Каждый этап формулируется как вопрос, на который модель отвечает по очереди, учитывая предыдущие ответы. Правила требуют не менять уже зафиксированные параметры, начинать с простых вопросов и переходить к более абстрактным, чтобы максимизировать вариативность. Для каждой задачи заданы параметры: для историй T=4 (разнообразие жанров, сеттингов, тональности и персонажей); для чат-ботов T=4 (высокое качество ответов); для генерации изображений T=6 (визуальная различимость). В последнем случае используется упрощенный промпт без блока правил.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод разбивает генерацию на T последовательных шагов, что позволяет жестко контролировать разнообразие итоговых артефактов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"avtoregressionnyj-cikl-shagi-2-4\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#avtoregressionnyj-cikl-shagi-2-4\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Авторегрессионный цикл: шаги 2–4&lt;/span&gt;&lt;/a&gt;Авторегрессионный цикл: шаги 2–4&lt;/h4&gt;\n&lt;p&gt;После планирования осей модель переходит к авторегрессионному принятию решений в рамках многоходового диалога. На каждом шаге t модель получает промпт (Prompt B.2), содержащий предыдущие решения zt-1 и текущий вопрос. Модель генерирует список из m вариантов (для историй и изображений m=32, для чата m=24), из которых система случайным образом выбирает один (z_t). Если модель выдает некорректный JSON, шаг пропускается. Это гарантирует, что каждое последующее решение опирается на весь накопленный контекст.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторегрессия здесь означает, что каждое новое решение «помнит» все предыдущие выборы, что исключает противоречия в итоговом контенте.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"shag-5-realizaciya\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#shag-5-realizaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Шаг 5: Реализация&lt;/span&gt;&lt;/a&gt;Шаг 5: Реализация&lt;/h4&gt;\n&lt;p&gt;На финальном этапе (Prompt B.3) модель генерирует k=8 творческих подходов (идей) на основе всех принятых решений. Затем «Исполнитель» (Prompt B.4) создает итоговый артефакт, объединяя все выбранные параметры z₁...z_T и выбранную идею zidea. Если требования задачи конфликтуют с выбранными параметрами, приоритет отдается задаче.&lt;/p&gt;\n&lt;h4 id=\"bazovye-modeli-i-podhody\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#bazovye-modeli-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базовые модели и подходы&lt;/span&gt;&lt;/a&gt;Базовые модели и подходы&lt;/h4&gt;\n&lt;p&gt;В качестве сравнения используются два метода. Первый — «Наивный IID», где задача подается напрямую без дополнительных инструкций. Второй — «List prompting», где модель просят сгенерировать k ответов списком. Для получения n образцов выполняется &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20n%2Fk%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; вызовов. Оптимальные значения k (8 для текстов, 32 для чата и изображений) были подобраны эмпирически в диапазоне &lt;span class=\"yfm-latex\" data-content=\"k%20%5Cin%20%5C%7B8%2C%2016%2C%2032%2C%2064%2C%20128%2C%20256%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; при общем объеме n=1024. Для текстов выбрано меньшее k, так как длинные истории требуют больше вычислительных ресурсов модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выбор параметра k критически важен: слишком большие значения для длинных текстов приводят к деградации качества из-за ограничений контекстного окна.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prompt-c1-bazovyj-spisok-sistemnyj-zapros\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-c1-bazovyj-spisok-sistemnyj-zapros\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt C.1: Базовый список (системный запрос)&lt;/span&gt;&lt;/a&gt;Prompt C.1: Базовый список (системный запрос)&lt;/h4&gt;\n&lt;p&gt;Метод предполагает генерацию k разнообразных ответов на запрос пользователя. Для реализации «вербализованной выборки» (Verbalized Sampling) модель за один вызов генерирует распределение из k ответов с оценкой их вероятностей. Чтобы получить n образцов, выполняется &lt;span class=\"yfm-latex\" data-content=\"%5Clceil%20n%2Fk%20%5Crceil\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; независимых вызовов. Для большинства моделей используется k=8 (истории) и k=32 (чат/изображения), однако для модели Inkling установлено k=8 для всех задач из-за склонности к снижению продуктивности при больших значениях. В творческом письме вводится ограничение в 400 слов, иначе модель выдает лишь короткие фрагменты.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вербализованная выборка — это метод, при котором модель сама «озвучивает» несколько вариантов ответа и присваивает им вероятности, что позволяет оценить разнообразие генераций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"pryamoe-planirovanie-generaciya-s-uchetom-intenta\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#pryamoe-planirovanie-generaciya-s-uchetom-intenta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прямое планирование (генерация с учетом интента)&lt;/span&gt;&lt;/a&gt;Прямое планирование (генерация с учетом интента)&lt;/h4&gt;\n&lt;p&gt;Ответы формируются в два этапа через два отдельных вызова LLM. Сначала при высокой температуре (1,2) генерируется план (ключевые слова или идеи), затем при стандартной температуре выполняется сам ответ на основе этого плана. Разнообразие достигается за счет вариативности планов.&lt;/p&gt;\n&lt;h4 id=\"prompt-inzhiniring-na-osnove-person\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-inzhiniring-na-osnove-person\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Промпт-инжиниринг на основе персон&lt;/span&gt;&lt;/a&gt;Промпт-инжиниринг на основе персон&lt;/h4&gt;\n&lt;p&gt;Каждый ответ генерируется с инструкцией примерить конкретную роль (персону), выбранную из датасета Nemotron-Personas-USA. Персоны выбираются без повторений, чтобы обеспечить независимость ответов. Роль определяет подход к задаче, выбор деталей и структуру ответа, при этом модель не должна описывать саму персону.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование персон требует строгого соблюдения инструкций: модель должна действовать как автор или лицо, принимающее решение, избегая простого изменения стиля речи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"seed-prompting-strokovaya-zatravka-mysli\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#seed-prompting-strokovaya-zatravka-mysli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Seed Prompting (строковая «затравка» мысли)&lt;/span&gt;&lt;/a&gt;Seed Prompting (строковая «затравка» мысли)&lt;/h4&gt;\n&lt;p&gt;Используется метод генерации случайной 24-символьной строки (ASCII), которая служит «зерном» для стохастических решений модели. Модель обязана вывести эту строку в тегах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4ojheq2\"&gt;&amp;lt;random_string&amp;gt;&lt;/code&gt;, провести рассуждения в тегах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u6ldlplj\"&gt;&amp;lt;reasoning&amp;gt;&lt;/code&gt; и предоставить итоговый ответ в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-quu68a3e\"&gt;&amp;lt;answer&amp;gt;&lt;/code&gt;. Это обеспечивает уникальность и разнообразие единственного ответа.&lt;/p&gt;\n&lt;h4 id=\"vyborka-modelej-i-parametry-generacii\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#vyborka-modelej-i-parametry-generacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выборка моделей и параметры генерации&lt;/span&gt;&lt;/a&gt;Выборка моделей и параметры генерации&lt;/h4&gt;\n&lt;p&gt;В экспериментах использовались различные архитектуры, включая семейства Qwen3.5, GPT-OSS, Inkling, Gemma4, а также API-модели gpt-5.5 и claude-opus-4-8. Параметры выборки (Таблица 5) для моделей с открытыми весами соответствуют рекомендациям их разработчиков, при этом для всех моделей по умолчанию установлена температура T=1.0. Для API-решений применялись стандартные настройки провайдеров. Модели Inkling и GPT-OSS работали в форматах NVFP4 и MXFP4 соответственно, остальные — в BF16. Все вычисления проводились на узле H200 с использованием фреймворка SGLang.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SGLang — это специализированный фреймворк для эффективного выполнения языковых моделей, оптимизирующий работу с памятью и скоростью генерации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenka-modelej\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#ocenka-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка моделей&lt;/span&gt;&lt;/a&gt;Оценка моделей&lt;/h4&gt;\n&lt;p&gt;В качестве судьи (LM judge) использовалась модель Qwen3.6-27B с функцией «мышления». Для оценки качества чатов применялся датасет InfinityChat, где валидность ответов проверялась через специальный промпт (Prompt C.8). Критерии оценки включают строгое соблюдение явных ограничений, корректность фактических данных и связность текста.&lt;/p&gt;\n&lt;p&gt;Для оценки творческого письма был сформирован набор из 50 запросов, отобранных из Wildchat после фильтрации и ручной проверки. Разнообразие текстов измерялось через аннотирование по 8 семантическим осям (жанр, сеттинг, тон, рассказчик, завязка, эмоции финала, образы, главный герой) с последующим расчетом среднего показателя Vendiscore. Качество оценивалось с помощью бенчмарка EQ-Bench.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка качества базируется на строгом соответствии инструкциям и семантическом разнообразии, измеряемом через 8 ключевых параметров повествования.&lt;br /&gt;\n[!warning] Использование LM-судьи подразумевает, что оценки зависят от способности модели-судьи объективно интерпретировать сложные творческие задачи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prompt-c10-ocenka-kachestva-tvorcheskogo-pisma-rubrika-eq-bench\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-c10-ocenka-kachestva-tvorcheskogo-pisma-rubrika-eq-bench\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt C.10: Оценка качества творческого письма (рубрика EQ-Bench)&lt;/span&gt;&lt;/a&gt;Prompt C.10: Оценка качества творческого письма (рубрика EQ-Bench)&lt;/h4&gt;\n&lt;p&gt;Для оценки творческих способностей моделей используется специализированный промпт, который превращает языковую модель в эксперта-критика. Модель должна оценить текст по шкале от 0 до 20 баллов по десяти критериям, включая креативность, образность, проработку персонажей, эмоциональную глубину, стиль, естественность потока речи и общую вовлеченность читателя. Важным условием является игнорирование любых комментариев модели, добавленных после завершения самого рассказа. Если модель выдает лишь краткое описание вместо полноценного сюжета, она получает минимальные баллы по всем пунктам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Методика позволяет стандартизировать субъективную оценку творческого письма, требуя от модели-судьи детального анализа перед выставлением баллов в формате JSON.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prompt-c11-primery-zadach-po-tvorcheskomu-pismu-iz-nabora-wildchat\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#prompt-c11-primery-zadach-po-tvorcheskomu-pismu-iz-nabora-wildchat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Prompt C.11: Примеры задач по творческому письму (из набора WildChat)&lt;/span&gt;&lt;/a&gt;Prompt C.11: Примеры задач по творческому письму (из набора WildChat)&lt;/h4&gt;\n&lt;p&gt;Авторы отобрали 50 примеров задач, охватывающих широкий спектр тем: от юмористических историй о животных (например, коты в Австралии) до сюжетов с использованием идиом или описания персонажей в фэнтези-сеттингах. Эти задачи служат эталоном для проверки способности модели к генерации связных и оригинальных нарративов.&lt;/p&gt;\n&lt;h4 id=\"generaciya-izobrazhenij-i-filtraciya-promptov\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#generaciya-izobrazhenij-i-filtraciya-promptov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генерация изображений и фильтрация промптов&lt;/span&gt;&lt;/a&gt;Генерация изображений и фильтрация промптов&lt;/h4&gt;\n&lt;p&gt;Для оценки генерации изображений используется набор OneIG-Bench. Чтобы отобрать только открытые (неоднозначные) запросы, авторы применяют трехэтапную фильтрацию. Сначала исключаются категории, требующие рендеринга текста или строгих логических рассуждений, где содержание изображения жестко задано. Затем языковая модель (LM-judge) классифицирует оставшиеся промпты, отсеивая закрытые задачи. На финальном этапе модель выбирает 50 наиболее открытых промптов, примеры которых приведены в Prompt C.12.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Открытый промпт (open-ended) — это запрос, допускающий множество вариантов визуальной интерпретации, в отличие от закрытого, где детали строго регламентированы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для рендеринга используется модель Qwen-Image-2512 с параметрами: 30 шагов шумоподавления (denoising steps), масштаб CFG 4.0 и разрешение 1328×1328 пикселей. В качестве позитивного промпта используется исходная подпись с дополнительными деталями, сгенерированными LM. Разнообразие результатов оценивается с помощью метрики DreamSim.&lt;/p&gt;\n&lt;h4 id=\"obzor-zadachi-dizajn-belkovyh-svyazyvatelej\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#obzor-zadachi-dizajn-belkovyh-svyazyvatelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор задачи: дизайн белковых связывателей&lt;/span&gt;&lt;/a&gt;Обзор задачи: дизайн белковых связывателей&lt;/h4&gt;\n&lt;p&gt;Исследование сравнивает метод Gacha Decoding с другими подходами для диверсификации генераций LM в процессе создания белковых связывателей (protein binders). Модели предлагается создать набор описаний для кандидатов с различными конфигурациями интерфейсов связывания. Затем фиксированная модель генерации белков преобразует эти описания в физические структуры. Эффективность оценивается через предсказанную уверенность интерфейса (после совместного рефолдинга последовательности и мишени) и структурное разнообразие успешных дизайнов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка качества белков проводится на основе предсказательных моделей, что требует последующей экспериментальной валидации в лабораторных условиях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"celevye-goryachie-tochki-i-dlina-svyazyvayushih-molekul\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#celevye-goryachie-tochki-i-dlina-svyazyvayushih-molekul\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Целевые «горячие точки» и длина связывающих молекул&lt;/span&gt;&lt;/a&gt;Целевые «горячие точки» и длина связывающих молекул&lt;/h4&gt;\n&lt;p&gt;В исследовании рассматриваются восемь эталонных мишеней (BHRF1, IFNAR2, PD1, TrkA, PDL1, DerF21, IL7RA, VEGFA), для которых определены специфические сайты связывания (Таблица 6). Для каждой мишени заданы ключевые остатки («горячие точки») и диапазон длины связывающего белка (от 50 до 185 аминокислот). Мы генерируем описания (кэпшены) для связывающих молекул с помощью модели GPT-5.5, используя 1024 генерации на каждый метод. Важно отметить, что информация о «горячих точках» подается в модель генерации структуры, но не в языковую модель (LM), так как предварительные тесты показали снижение эффективности при включении этих данных в текстовый промпт.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование специфических диапазонов длины и исключение данных о «горячих точках» из текстового промпта обеспечивают более высокую точность генерации связывающих белков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В качестве методов сравнения выступают Gacha Decoding (7 шагов принятия решений, 16 вариантов на шаг), прямое сэмплирование, листинг-промптинг и вербализованное сэмплирование (k=32 для последних двух). Для обеспечения корректности сравнения во всех методах используются идентичные случайные значения длины связывающих молекул.&lt;/p&gt;\n&lt;h4 id=\"ocenka-opisanij-svyazyvayushih-molekul\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#ocenka-opisanij-svyazyvayushih-molekul\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка описаний связывающих молекул&lt;/span&gt;&lt;/a&gt;Оценка описаний связывающих молекул&lt;/h4&gt;\n&lt;p&gt;Для оценки качества сгенерированные описания передаются в модель генерации белковых структур (Lee et al., 2026). Модель использует два пути обработки: Qwen-3-Embedding-8B для глобального кондиционирования через адаптивную нормализацию слоев и Qwen-3-8B для токенизированных представлений, позволяющих учитывать тонкие интерфейсные взаимодействия. Процесс генерации включает 400 шагов Эйлера-Маруямы с использованием классификатор-свободного руководства (classifier-free guidance).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ipSAEmin — это метрика предсказанной ошибки выравнивания (от 0 до 1), где значения выше 0,5 свидетельствуют об успешном формировании интерфейса связывания.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для верификации связывания мы используем ESMFold2-Fast, вычисляя показатель ipSAEmin. Дизайн считается успешным при ipSAEmin &amp;gt; 0,5. Разнообразие успешных вариантов оценивается через TM-score (от 0 до 1) с помощью алгоритма Foldseek. Итоговый показатель Vendi score отражает эффективное количество структурно различных связывающих молекул для каждой мишени, исключая влияние различий в самих структурах мишеней.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;снижение&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;креативности&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;мощных ИИ&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m2 t-size=\"15\" font-weight=\"600\"&gt;вероятности&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;токенов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;other&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Scott Geng, Yufei Zhang, Joseph Lee, Jerry Li, Marjan Ghazvininejad, Pang Wei Koh&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Ссылка&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Страница препринта&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"https://arxiv.org/abs/2610.01382v1\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;arxiv.org&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Полный текст (PDF)
