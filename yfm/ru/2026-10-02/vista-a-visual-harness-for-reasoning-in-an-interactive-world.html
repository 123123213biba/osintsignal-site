        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"102\" cy=\"63\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"578\" cy=\"293\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;VISTA: как научить нейросети&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;«вспоминать» увиденное для&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;решения сложных задач&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f2.jpg\" alt=\"Рисунок 2: Траектории VISTA на ARC-AGI-3 (слева) и GameWorld (справа). Интерфейс позволяет агенту напрямую наблюдать виз\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Траектории &lt;a href=\"concepts/visual-harness-for-reasoning.html\"&gt;VISTA&lt;/a&gt; на &lt;a href=\"concepts/arc-agi-3.html\"&gt;ARC-AGI-3&lt;/a&gt; (слева) и GameWorld (справа). Интерфейс позволяет агенту напрямую наблюдать визуальные состояния, рассуждать на естественном языке и при необходимости проверять свою визуальную &lt;a href=\"concepts/lossless-visual-memory.html\"&gt;память без потерь&lt;/a&gt; на исходном уровне детализации.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи из MIT представили VISTA — систему, которая дает мультимодальным моделям «длинную» визуальную память. Вместо сжатых и неполных данных агент сохраняет все кадры взаимодействия в исходном качестве. Это позволяет модели возвращаться к прошлым событиям для анализа ошибок и планирования стратегии.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;VISTA сохраняет все визуальные кадры без сжатия, предотвращая потерю критически важных деталей для принятия решений.&lt;/li&gt;\n&lt;li&gt;Модель может активно запрашивать и сравнивать прошлые кадры, что позволяет ей исправлять ошибки в реальном времени.&lt;/li&gt;\n&lt;li&gt;На бенчмарке ARC-AGI-3 система показала 100% эффективность, превзойдя результаты людей-новичков на 57,4% по количеству действий.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;VISTA (Visual &lt;a href=\"concepts/harness.html\"&gt;Harness&lt;/a&gt; for Reasoning) решает проблему потери контекста в мультимодальных моделях (&lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt;), которые обычно кодируют изображения лишь единожды. В отличие от стандартных методов, где визуальная информация сжимается или удаляется при заполнении контекстного окна, VISTA создает «визуальную память без потерь» (lossless visual memory). Система индексирует каждый кадр по времени и действию, позволяя модели выполнять итеративные «визуальные запросы» (&lt;a href=\"concepts/vizualnaya-inspektsiya.html\"&gt;visual tool calls&lt;/a&gt;) для детального анализа прошлых состояний среды.&lt;/p&gt;\n&lt;p&gt;В тестах на бенчмарке ARC-AGI-3 модель Claude Opus 5.0 с использованием VISTA достигла идеального показателя эффективности действий (&lt;a href=\"concepts/relative-human-action-efficiency.html\"&gt;RHAE&lt;/a&gt; 100.00), выполнив задачи на 57,4% экономнее, чем люди-новички. Система была протестирована на 25 играх ARC-AGI-3, а также на 34 играх из GameWorld, 10 из AI GameStore и 39 задачах BabyVision. VISTA не требует сложного программирования, работая как надстройка, позволяющая модели самостоятельно «смотреть» на историю своих действий перед принятием следующего решения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность системы напрямую зависит от базовых возможностей используемой мультимодальной модели и объема доступной оперативной памяти для хранения кадров.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Мы демонстрируем, что современные мультимодальные модели обладают мощным потенциалом для логического вывода, однако для решения задач в интерактивных средах им требуется специализированная надстройка. Мы представляем VISTA — визуальный интерфейс, обеспечивающий мультимодальным моделям общего назначения возможность долгосрочного визуального планирования. VISTA позволяет модели напрямую воспринимать окружающую среду через визуальные наблюдения, сохраняя при этом память без потерь, где все прошлые кадры хранятся в исходном виде. Модель способна активно извлекать эти данные и перестраивать визуальный контекст в процессе рассуждения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA превращает мультимодальную модель в агента с долгосрочной визуальной памятью, позволяя ей достичь идеальной эффективности в сложных задачах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В рамках тестирования на бенчмарке ARC-AGI-3 система VISTA позволила модели Claude Opus 5.0 повысить показатель относительной эффективности действий человека (Relative Human Action Efficiency) с 40,68 до 100,00 баллов. Модель успешно завершила все 25 публичных игровых сценариев, затратив при этом на 57,4% меньше действий, чем участники-люди при первом прохождении. Благодаря своей архитектурной простоте VISTA легко адаптируется к различным визуальным средам с минимальными доработками. Испытания на трех дополнительных наборах данных, включающих разнообразные визуальные головоломки и игры, подтвердили, что VISTA значительно превосходит базовые модели, использующие стандартные методы интеграции. Наши результаты доказывают, что VISTA является эффективным решением для развития мультимодальных агентов в сложных визуальных условиях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/multimodalnaya-model.html\"&gt;Мультимодальная модель&lt;/a&gt; — это нейросеть, способная одновременно обрабатывать и сопоставлять данные разных типов, например, текст и изображения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"b-multimodalnyj-agent\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#b-multimodalnyj-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(b) Мультимодальный агент&lt;/span&gt;&lt;/a&gt;(b) Мультимодальный агент&lt;/h4&gt;\n&lt;p&gt;Современные мультимодальные модели часто сталкиваются с ограничениями контекстного окна, из-за чего визуальные наблюдения приходится удалять или заменять текстовыми описаниями. Это негативно сказывается на способности моделей рассуждать в ходе длительных взаимодействий. Для решения этой проблемы мы представляем VISTA — визуальную надстройку, позволяющую модели динамически управлять визуальными данными (Рис. 1c). Модель получает наблюдения, сохраняющие внешний вид и пространственные отношения объектов, и использует их для планирования действий через свободные языковые рассуждения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA обеспечивает работу с «визуальной памятью без потерь», храня все кадры среды в исходном виде, что позволяет модели обращаться к ним по мере необходимости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В отличие от стандартных подходов, где визуальные представления сжимаются и теряют детали, VISTA сохраняет каждый кадр, включая промежуточные анимации. Модель может запрашивать конкретные области или сравнивать кадры для уточнения деталей (Рис. 2). При использовании Claude Opus 5.0 система VISTA успешно завершила все 25 игр из набора ARC-AGI-3, достигнув показателя относительной эффективности действий человека (RHAE) 100.00 при использовании на 57.4% меньшего количества действий, чем базовый уровень человека. Модель GPT-5.6 Sol с VISTA также выполнила все 25 заданий с показателем RHAE 99.00.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f2.jpg\" alt=\"Рисунок 2: Траектории VISTA на ARC-AGI-3 (слева) и GameWorld (справа). Интерфейс позволяет агенту напрямую наблюдать виз\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Траектории VISTA на ARC-AGI-3 (слева) и GameWorld (справа). Интерфейс позволяет агенту напрямую наблюдать визуальные состояния, рассуждать на естественном языке и при необходимости проверять свою визуальную память без потерь на исходном уровне детализации.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RHAE (Relative Human Action Efficiency) — метрика, оценивающая, насколько эффективно агент решает задачу по сравнению с человеком; значение 100 означает полное соответствие или превосходство над эталонным показателем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для сравнения: официальные базовые решения без синтеза программ достигают лишь 40.68 (Opus 5.0) и 13.33 (GPT-5.6 Sol) по шкале RHAE. VISTA продемонстрировала универсальность, успешно применившись к 34 играм из GameWorld, 10 играм из AI GameStore и 39 задачам визуального трекинга из BabyVision. Система значительно превосходит базовые модели без такой надстройки, а также показывает результаты выше среднего уровня человека-новичка в различных игровых средах.&lt;/p&gt;\n&lt;h4 id=\"obzor-smezhnyh-issledovanij\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#obzor-smezhnyh-issledovanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор смежных исследований&lt;/span&gt;&lt;/a&gt;Обзор смежных исследований&lt;/h4&gt;\n&lt;p&gt;Бенчмарки ARC-AGI-1 и ARC-AGI-2 оценивают абстрактное мышление на статических сетках. Существующие методы часто используют предобученные языковые модели, рекуррентные архитектуры или системы компьютерного зрения. В интерактивном бенчмарке ARC-AGI-3 агент должен адаптироваться к новым условиям, совершая действия для достижения целей. Текущие подходы здесь опираются на синтез программ: агент переводит визуальную среду в текстовое или символьное представление, на основе которого строит исполняемый код. Однако при усложнении визуальной среды создание таких программ становится затруднительным. VISTA же работает напрямую с визуальными данными, используя естественный язык для рассуждений.&lt;/p&gt;\n&lt;p&gt;В области компьютерных агентов (computer-use agents) подходы делятся на текстовые, работающие со структурами вроде HTML или DOM-деревьев, и визуальные, взаимодействующие со скриншотами напрямую (клики, движения мыши). VISTA относится ко второму типу, исключая промежуточные символьные представления. В игровых средах классические методы обучения с подкреплением требуют отдельного обучения для каждой игры. Современные фундаментальные модели, такие как Voyager, JARVIS-1 или SIMA, позволяют создавать более универсальных агентов. Основная проблема таких систем — ограничение визуального контекста. VISTA решает её, сохраняя полную историю взаимодействий без потерь, что позволяет агенту в любой момент вернуться к любому предыдущему кадру или области.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA превосходит аналоги, сохраняя полную историю визуальных взаимодействий без потерь, что позволяет агенту произвольно обращаться к прошлым данным, в отличие от систем с ограниченным контекстом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vista-vizualnaya-obvyazka\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#vista-vizualnaya-obvyazka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VISTA: Визуальная обвязка&lt;/span&gt;&lt;/a&gt;VISTA: Визуальная обвязка&lt;/h4&gt;\n&lt;p&gt;Существующие мультимодальные системы часто кодируют визуальные данные один раз и отбрасывают исходники, заменяя их текстовыми суммаризациями. Это создает проблему: модель не знает заранее, какие детали потребуются в будущем, и может потерять критически важную информацию. VISTA устраняет этот недостаток, сохраняя оригинальные наблюдения в «визуальной памяти без потерь» и предоставляя инструменты для их повторного анализа.&lt;/p&gt;\n&lt;h4 id=\"komponenty-vizualnoj-obvyazki\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#komponenty-vizualnoj-obvyazki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Компоненты визуальной обвязки&lt;/span&gt;&lt;/a&gt;Компоненты визуальной обвязки&lt;/h4&gt;\n&lt;p&gt;Система включает три элемента: визуальные наблюдения (восприятие через рендеринг), память без потерь (архивация всех кадров) и визуальную инспекцию (инструменты для детального изучения).&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Визуальные наблюдения (Рис. 3a): агент получает данные, сохраняющие пространственные отношения объектов.&lt;/li&gt;\n&lt;li&gt;Память без потерь (Рис. 3b): каждый кадр, включая промежуточные анимации, индексируется по номеру хода и кадра и хранится независимо от текущего контекста модели.&lt;/li&gt;\n&lt;li&gt;Визуальная инспекция (Рис. 3c): агент может запрашивать увеличенные фрагменты любого кадра для анализа мелких деталей или сравнивать состояния из разных временных отрезков. Модель сама решает, когда и какую часть истории необходимо изучить.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f3.jpg\" alt=\"Рисунок 3: Ключевые компоненты архитектуры и пошаговый конвейер VISTA.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Ключевые компоненты архитектуры и пошаговый &lt;a href=\"concepts/pipeline.html\"&gt;конвейер&lt;/a&gt; VISTA.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Ключевые компоненты архитектуры и пошаговый конвейер VISTA. В качестве примера используется ARC-AGI-3. (a) Визуальные наблюдения: модель получает визуализированные визуальные состояния. (b) Визуальная память без потерь: каждый возвращенный кадр сохраняется в исходном виде. (c) Визуальный осмотр под руководством модели: модель выбирает кадры и области для изучения в процессе рассуждения. (d) Пошаговый конвейер: агент наблюдает, рассуждает и действует, в то время как каждый возвращенный кадр сохраняется в визуальной памяти. Повторное обращение к прошлым наблюдениям и обновление заметок являются необязательными шагами, управляемыми моделью.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Визуальная инспекция — это механизм «активного внимания», позволяющий модели выборочно извлекать детали из всей истории взаимодействия, а не только из текущего состояния.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"konvejer-obrabotki\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#konvejer-obrabotki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Конвейер обработки&lt;/span&gt;&lt;/a&gt;Конвейер обработки&lt;/h4&gt;\n&lt;p&gt;Взаимодействие модели и среды реализовано через многоходовой диалог (Рис. 2). Механический интерфейс (harness) не обладает собственным интеллектом: он лишь выполняет запросы модели, возвращает визуальные данные (изображения или значения пикселей) и сообщает об ошибках. Агент анализирует эти данные и при необходимости формирует новые запросы. Один агент работает с игрой на протяжении всего цикла, при этом один игровой ход может включать несколько итераций обмена данными с интерфейсом до совершения финального действия (Рис. 3d).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Конвейер (pipeline) — это последовательность автоматизированных шагов, в ходе которых модель получает данные, обрабатывает их и выполняет действия в среде.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В начале хода агент получает визуальное состояние и список доступных действий. Он может использовать два текстовых файла: GUIDE.md (для хранения долгосрочных знаний об игре) и WORKING.md (черновик для текущего состояния). Инструменты &lt;a href=\"concepts/inspect.html\"&gt;inspect&lt;/a&gt; позволяют просматривать прошлые кадры, а readpixels — анализировать значения пикселей в выбранной области. Агент самостоятельно решает, использовать ли эти инструменты. Процесс планирования включает рассуждения на естественном языке, прогнозирование результата и обновление заметок. Команда play завершает ход и переводит игру на следующий этап. При исчерпании лимита контекста агент создает краткую сводку (handoff) и продолжает работу в новом контексте, сохраняя доступ к заметкам, визуальной памяти и истории действий.&lt;/p&gt;\n&lt;h4 id=\"nastrojka\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#nastrojka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройка&lt;/span&gt;&lt;/a&gt;Настройка&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/dataset.html\"&gt;Датасет&lt;/a&gt; ARC-AGI-3 включает 25 интерактивных визуальных игр, правила которых не заданы явно. Агент должен самостоятельно выводить закономерности, скрытые состояния и цели. Каждая игра состоит из уровней, где базовые механики сохраняются, но усложняются объекты и ограничения. Пример траектории агента представлен на Рис. 4.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f4.jpg\" alt=\"Рисунок 4: Пример траектории в ARC-AGI-3. Каждый кадр помечен номером шага и действием; ×N обозначает повторяющиеся дейс\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Пример траектории в ARC-AGI-3. Каждый кадр помечен номером шага и действием; ×N обозначает повторяющиеся действия.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Пример траектории в ARC-AGI-3. Каждый кадр помечен номером шага и действием; ×N обозначает повторяющиеся действия. Рамками отмечены цели, а кругами — клики агента. Агент должен вывести правила: черные фигуры движутся вместе со своими отражениями относительно зеркальной линии, и все желтые цели должны быть закрыты. На уровне 3 вводится подвижная горизонтальная зеркальная линия и выбираемые фигуры.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность оценивается по метрике RHAE: 100% при равенстве с человеком, до 115% при меньшем числе действий и 0% при невыполнении уровня.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эффективность измеряется через Relative Human Action Efficiency (RHAE). Уровень засчитывается как 100%, если количество действий агента совпадает с базовым показателем человека, и до 115% при более высокой эффективности. Неоконченные уровни получают 0 баллов. Итоговый счет игры ограничен взвешенной долей пройденных уровней, где поздние этапы имеют больший вес. В качестве моделей-бэкендов используются Claude Opus 5.0 (через Claude Code &lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt; с повышенным уровнем рассуждений) и GPT-5.6 Sol (через Codex CLI с максимальным уровнем рассуждений).&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"sistemnaya-programmnaya-model-zatrat-effort-rhae\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#sistemnaya-programmnaya-model-zatrat-effort-rhae\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системная программная модель затрат (Effort) RHAE&lt;/span&gt;&lt;/a&gt;Системная программная модель затрат (Effort) RHAE&lt;/h4&gt;\n&lt;p&gt;В рамках оценки эффективности систем на наборе данных ARC-AGI-3 (25 публичных игр) были протестированы различные подходы. Официальная реализация показывает результат 13.33% при использовании модели GPT-5.6 Sol (уровень max). Применение схемы Schema повышает показатель до 95.35%, а использование Opus 5.0 в сочетании с Fable 5 позволяет достичь 98.98%. Модели ewmasvv1.6, Retrodict и Tycho демонстрируют крайне высокие результаты: 98.97%, 99.86% и 100.00% соответственно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система VISTA достигает идеального показателя RHAE 100.00% на ARC-AGI-3, превосходя официальную реализацию (40.68%) и используя при этом на 57.4% меньше действий, чем человек.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vista\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#vista\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;VISTA&lt;/span&gt;&lt;/a&gt;VISTA&lt;/h4&gt;\n&lt;p&gt;Система VISTA показывает результат 99.00% при использовании GPT-5.6 Sol и достигает 100.00% с моделью Opus 5.0 (Таблица 1). В отличие от большинства современных решений, которые преобразуют визуальные данные в текстовые сетки и используют программные модели для логического вывода, VISTA работает без синтеза программ. Это первая система, достигшая таких показателей без обращения к кодовым абстракциям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RHAE (Relative Human Action Efficiency) — метрика, оценивающая эффективность агента относительно человеческих действий: чем выше процент, тем точнее решение, а чем меньше количество действий, тем выше эффективность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В Таблице 1 и на Рис. 6 представлено сравнение методов. Использование визуальных наблюдений (pixel readout) вместо текстовых сеток позволяет сократить количество действий до 9,126 (против 10,614 в текстовом представлении) и значительно снизить потребление токенов: с 71.9 млн до 30.7 млн на игру. Поэтапное внедрение улучшений (от официальной реализации до полной версии VISTA) показывает, что переход к визуальному считыванию пикселей и внедрение памяти без потерь критически важны для роста RHAE с 13.33% до 99.00%.&lt;/p&gt;\n&lt;h4 id=\"ablyacii\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#ablyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абляции&lt;/span&gt;&lt;/a&gt;Абляции&lt;/h4&gt;\n&lt;p&gt;Для всех экспериментов по абляции использовалась модель GPT-5.6 Sol с максимальным усилием рассуждения и лимитом контекста 200 тыс. токенов. Агент получал на вход PNG-изображения размером 512 × 512 пикселей, полученные путем 8-кратного масштабирования исходных кадров 64 × 64 методом ближайшего соседа.&lt;/p&gt;\n&lt;p&gt;Эффективность компонентов VISTA. Мы сравнили производительность GPT-5.6 Sol при постепенном усложнении конфигурации (Рис. 5). Официальная реализация, использующая текстовые сетки, показывает результат RHAE 13,33 при 10 619 действиях. Замена текстовых сеток на PNG-изображения повышает показатель до 47,32, что подчеркивает важность визуальных данных. Увеличение лимитов времени и количества действий повышает результат до 51,66. Внедрение постоянного диалога и нативной компакции контекста доводит показатель до 65,82. Добавление рабочих файлов (GUIDE.md, WORKING.md) с инструкциями по моделированию игры повышает результат до 70,05. Наконец, внедрение визуальной памяти и инспекции модели (v) дает 94,10, а точное считывание пикселей (vi) доводит показатель до 99,00.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поэтапное внедрение визуальных инструментов VISTA повышает точность (RHAE) с 13,33 до 99,00, доказывая преимущество прямого анализа изображений над текстовыми сетками.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рассуждение по изображениям. В отличие от прошлых подходов, кодирующих кадры как сетки целочисленных индексов, VISTA работает напрямую с рендером. Сравнение показывает, что текстовые сетки требуют значительно больше токенов (около 4000 на кадр против 308 для изображения 512 × 512). Расход токенов на игру составляет 71,9 млн для текстовых сеток против 30,7 млн для VISTA.&lt;/p&gt;\n&lt;p&gt;Влияние размера контекста. Как показано на Рис. 7a, стандартный лимит 200 тыс. токенов обеспечивает RHAE 99,00. Увеличение до 780 тыс. токенов неоправданно дорого (105,7 млн токенов на игру), а снижение до 100 тыс. уменьшает RHAE лишь на 0,4, при этом почти вдвое сокращая расход токенов.&lt;/p&gt;\n&lt;p&gt;Влияние масштаба изображения. Мы протестировали масштабы 2×, 4×, 8× и 16× (Рис. 7b). Масштаб 4× требует на 75% меньше токенов при сопоставимой с 8× производительности. Снижение до 2× ухудшает результат, а увеличение до 16× не дает преимуществ, лишь перегружая контекст лишними данными.&lt;/p&gt;\n&lt;p&gt;Мы протестировали VISTA с открытой моделью GLM-5.3 Flash 320B (Рис. 8). Полная версия VISTA достигла RHAE 66,93, значительно превзойдя официальную реализацию (1,89) и вариант без визуальных инструментов (13,27). Это подтверждает универсальность VISTA для различных архитектур.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — метод исследования системы путем последовательного отключения или замены отдельных компонентов для оценки их вклада в итоговый результат.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"agent-vyvody\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#agent-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агент: выводы&lt;/span&gt;&lt;/a&gt;Агент: выводы&lt;/h4&gt;\n&lt;p&gt;Модель успешно определяет ориентацию объектов, анализируя маркеры на их гранях. Как показано на Рис. 10, агент использует визуальную память для реконструкции карты, извлекая четыре кадра из предыдущих 22 ходов, а также применяет функцию «инспекции» для 13-кратного увеличения локальных деталей, что позволяет точно идентифицировать положение блоков. В тестах система достигает показателя RHAE 84,12 при 20 640 действиях, значительно превосходя текстовые базовые модели, что подтверждает устойчивость VISTA к сложным визуальным представлениям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA демонстрирует высокую эффективность, используя визуальную память для реконструкции пространства и детализации объектов, превосходя стандартные текстовые модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kachestvennyj-analiz\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#kachestvennyj-analiz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Качественный анализ&lt;/span&gt;&lt;/a&gt;Качественный анализ&lt;/h4&gt;\n&lt;p&gt;Ключевые механизмы VISTA — это визуальная память без потерь и функция инспекции, обеспечивающие явное внимание к истории взаимодействия. Рис. 10а демонстрирует интеграцию данных из разных временных точек для восстановления карты, а Рис. 10б — зумирование области 512×512 пикселей для уточнения деталей. Эти инструменты позволяют агенту объединять визуальные доказательства и изучать объекты с необходимой гранулярностью.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Механизм «инспекции» (inspect) — это функция, позволяющая модели программно «приближать» фрагменты изображения для анализа мелких деталей, которые не видны в исходном разрешении.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obshie-vizualnye-sredy\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#obshie-vizualnye-sredy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие визуальные среды&lt;/span&gt;&lt;/a&gt;Общие визуальные среды&lt;/h4&gt;\n&lt;p&gt;Универсальность VISTA позволила протестировать её на GameWorld (34 игры, 170 задач), AI GameStore (10 игр) и BabyVision (388 статических задач). В GameWorld агент использует интерфейс управления клавиатурой и мышью, где успех измеряется долей выполненных задач (SR) и прогрессом (PG). В AI GameStore результаты нормализуются относительно медианных показателей человека (принимаемых за 100). В BabyVision оценивается точность решения 39 задач на визуальное отслеживание.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;p&gt;Эффективность VISTA во многом зависит от базовых возможностей используемых моделей. Существует вероятность, что игры из бенчмарков входили в обучающую выборку моделей, так как они были выпущены позже. Для более строгой проверки обобщающей способности системы необходимы тесты на принципиально новых играх, например, из закрытых наборов ARC-AGI-3.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поскольку модели были обучены до выхода некоторых бенчмарков, нельзя исключить «утечку» данных, при которой агент мог видеть эти игры в процессе обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"itogi-i-perspektivy\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#itogi-i-perspektivy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итоги и перспективы&lt;/span&gt;&lt;/a&gt;Итоги и перспективы&lt;/h4&gt;\n&lt;p&gt;Система VISTA демонстрирует, что использование простого визуального интерфейса (harness) позволяет раскрыть скрытый потенциал существующих мультимодальных моделей для решения сложных задач в интерактивных визуальных средах. Метод заключается в передаче модели необработанных визуальных наблюдений, которые сохраняются в памяти без потерь. Это дает агенту возможность обращаться к накопленному визуальному опыту с сохранением исходной детализации в процессе взаимодействия.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VISTA обеспечивает идеальный результат, выполняя все 25 публичных игр ARC-AGI-3 с максимальным баллом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данная архитектура легко масштабируется на другие типы визуальных игр и головоломок, требуя лишь минимальной адаптации. Высокая эффективность VISTA в различных бенчмарках указывает на возможность её применения в качестве универсального инструмента для решения задач, выходящих за рамки игровых сценариев. В будущих исследованиях планируется тестирование системы в более сложных и реалистичных условиях, включая воплощенные (embodied) задачи, максимально приближенные к физическому миру.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;На текущем этапе эффективность модели подтверждена преимущественно на игровых средах, что требует дальнейшей проверки в условиях реальной физической среды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f9.jpg\" alt=\"Рис. 9\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 9&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f11.jpg\" alt=\"Рисунок 11: Среды оценки и результаты. Вверху: примеры из трех бенчмарков.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 11: Среды оценки и результаты. Вверху: примеры из трех бенчмарков.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 11: Среды оценки и результаты. Вверху: примеры из трех бенчмарков. GameWorld и AI GameStore являются интерактивными, в то время как BabyVision — статическая. Внизу: VISTA с GPT-5.6 Sol в сравнении с людьми-игроками и официальной реализацией с использованием минимального интерфейса. Мы приводим показатели успешности и прогресса для GameWorld, среднее геометрическое нормализованных по человеку оценок (медиана человека = 100) для AI GameStore и точность для BabyVision. Пунктирная линия отмечает лучший ранее зарегистрированный результат.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f12.jpg\" alt=\"Рис. 12\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 12&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f13.jpg\" alt=\"Рисунок 13: Полная траектория VISTA в задаче ARC-AGI-3 (ID BP35), по одному кадру на действие (уровень 3). На уровне 3 в\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 13: Полная траектория VISTA в задаче ARC-AGI-3 (ID BP35), по одному кадру на действие (уровень 3). На уровне 3 вводится оранжевый блок, который исчезает при клике и появляется снова при повторном клике. Агент может убрать его, чтобы пройти через заблокированный путь, или восстановить его, чтобы не дать игроку подняться на смертоносные фиолетовые шипы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-f14.jpg\" alt=\"Рисунок 14: Четыре траектории VISTA за пределами ARC-AGI-3 с GPT-5.6 Sol.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 14: Четыре траектории VISTA за пределами ARC-AGI-3 с GPT-5.6 Sol.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 14: Четыре траектории VISTA за пределами ARC-AGI-3 с GPT-5.6 Sol. Верхний ряд показывает игры GameWorld, а нижний ряд — задачи BabyVision. Вверху слева: в Minecraft Clone агент осматривает пространство, увеличивая панель быстрого доступа и рудную жилу, чтобы отличить железо от камня. Вверху справа: в Pac-Man он осматривает время, возвращаясь к текущему и начальному кадрам для просмотра всего лабиринта. Внизу слева: в Connect the Lines агент увеличивает две области, чтобы проследить путь, который трудно различить при исходном разрешении изображения, а затем считывает точные значения пикселей перед ответом. Внизу справа: в Maze он визуализирует доску в масштабе 2×, а затем считывает сетку стен в виде значений пикселей.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-fS1-2.jpg\" alt=\"Рис. S1 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-fS2.jpg\" alt=\"Рис. S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ теряет&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;детали при&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"1
