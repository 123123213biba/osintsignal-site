        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"202\" cy=\"66\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"558\" cy=\"286\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OSM_GIS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Цифровой двойник города: как&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;нейросети проектируют&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;изменения в реальности&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f2.jpg\" alt=\"Рисунок 2: Обзор конвейера VIDA-GEO. При наличии изображения и целевой инструкции по улучшению городской среды группа аг\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Обзор конвейера VIDA-GEO. При наличии изображения и целевой инструкции по улучшению городской среды группа агентов определяет области интереса (ROI), сегментирует и редактирует их с учетом специфических для задачи ограничений для создания вариантов…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Обзор конвейера VIDA-GEO. При наличии изображения и целевой инструкции по улучшению городской среды группа агентов определяет области интереса (ROI), сегментирует и редактирует их с учетом специфических для задачи ограничений для создания вариантов вмешательств. Проверки качества оценивают реалистичность и соблюдение политики. Кандидаты окончательно оцениваются индикатором «черного ящика».&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Исследователи представили VIDA-GEO — систему, которая анализирует спутниковые и уличные снимки для поиска путей улучшения городской инфраструктуры. В отличие от простых моделей распознавания, этот инструмент предлагает конкретные визуальные изменения. Система работает как «неявный цифровой двойник», сочетая генеративные модели и экспертные правила планирования.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Система использует мультиагентный подход для генерации реалистичных правок городской среды.&lt;/li&gt;\n&lt;li&gt;VIDA-GEO выступает как неявный цифровой двойник, экономя ресурсы на сложных симуляциях.&lt;/li&gt;\n&lt;li&gt;Метод оценивался по 8 индикаторам, включая безопасность и озеленение, с упором на политическую обоснованность.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;VIDA-GEO представляет собой мультиагентную систему, использующую сегментацию изображений, диффузионный инпейнтинг (заполнение пропущенных областей) и модели оценки городских индикаторов. Система разбивает задачу на этапы: планировщик выделяет области интереса, агент политики задает ограничения, а генеративный модуль вносит правки, сохраняя реалистичность.&lt;/p&gt;\n&lt;p&gt;В основе метода лежит итеративный цикл обратной связи, где результаты каждого изменения оцениваются на соответствие реальным градостроительным нормам. Модель протестирована на 8 показателях, включая восприятие безопасности и уровень озеленения. Исследование показывает, что такой подход превосходит существующие аналоги по качеству визуализации и обоснованности предлагаемых решений, достигая двукратного улучшения метрик согласованности с политикой.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система ограничена качеством исходных данных и может предлагать решения, требующие дополнительной инженерной проверки на физическую реализуемость.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Городская среда формируется на основе проектных решений, которые определяют качество жизни, безопасность и здоровье населения на десятилетия вперед. Однако оценка эффективности предлагаемых градостроительных изменений традиционно требует значительных временных и финансовых затрат, что делает её труднореализуемой на практике. Современные методы геопространственного компьютерного зрения в основном сосредоточены на пассивном мониторинге городских показателей через анализ аэрофотоснимков и панорам улиц, не предлагая инструментов для моделирования вмешательств и прогнозирования их последствий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO — это многоагентная система, которая использует генеративные модели как «цифровой двойник» для автоматизированного поиска и тестирования градостроительных решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы предлагаем концепцию, в которой модель-предиктор (оценивающая показатели) объединяется с генеративной моделью редактирования изображений. Такая связка работает как неявный цифровой двойник, позволяющий проверять гипотезы о городских изменениях в виртуальной среде.&lt;/p&gt;\n&lt;p&gt;Система VIDA-GEO координирует работу трех ключевых компонентов: алгоритмов сегментации, диффузионных моделей для заполнения областей (inpainting) и моделей оценки целевых показателей. Этот комплекс позволяет генерировать варианты преобразований, которые выглядят реалистично и соответствуют реальным градостроительным нормам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Диффузионная модель — это тип нейросети, которая создает изображения, постепенно убирая «шум» из случайных данных, что позволяет достичь высокой детализации и реалистичности правок.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы протестировали систему на 8 различных показателях, используя как аэрофотоснимки, так и панорамы улиц, оценивая такие параметры, как уровень озеленения и субъективное ощущение безопасности. Результаты показывают, что наш подход превосходит существующие аналоги, обеспечивая до 2 раз более высокие показатели визуального качества и соответствия заданным политикам. Система предлагает пользователю несколько вариантов вмешательства, что позволяет интегрировать её в рабочий процесс экспертов-урбанистов. Исходный код проекта доступен по адресу https://github.com/HosamGen/VIDA-GEO.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Визуальные геопространственные данные активно применяются для мониторинга городской среды и климатических изменений. Спутниковые снимки позволяют оценивать безопасность дорог, уровень озеленения, загрязнение воздуха и тепловое воздействие. Параллельно используются данные панорам улиц и систем видеонаблюдения для анализа пешеходной доступности и безопасности. Несмотря на высокую точность современных моделей компьютерного зрения в задачах распознавания, они решают лишь половину задачи: мониторинг не дает ответа на вопрос, как именно нужно изменить среду для улучшения показателей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторы предлагают концепцию «неявного цифрового двойника» (IDT), объединяющую модели распознавания и генеративные методы для автоматического создания реалистичных сценариев вмешательства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Традиционный подход через создание «цифровых двойников» городов требует дорогостоящего сбора данных, длительного моделирования и ограничен узким спектром сценариев. В качестве альтернативы предложена система VIDA-GEO (Visual Intervention and Decision-support Agent for Geospatial data). Она использует комбинацию моделей мониторинга (распознавание) и генеративных моделей редактирования изображений. Система работает как мультиагентная среда: планировщик выделяет области интереса (ROI), агент политики предлагает реалистичные изменения на основе реальных городских нормативов, агент сегментации создает маски, а генеративный агент выполняет визуальное редактирование (см. Рис. 1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Неявный цифровой двойник (IDT) — это подход, при котором вместо полной 3D-реконструкции города используются генеративные нейросети для изменения существующих снимков, что позволяет быстро тестировать гипотезы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность метода зависит от способности генеративных моделей сохранять физическую достоверность правок, что проверяется через метрики реализма и соответствие политике принятия решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система оценивает правки как по изменению баллов в «черном ящике» (модели-индикаторе), так и по их логической обоснованности. Авторы представили новый бенчмарк для 8 задач, охватывающий спутниковые снимки и панорамы улиц. Основной вклад работы заключается в переходе от пассивного мониторинга к активному проектированию вмешательств, подкрепленному количественными метриками и мультиагентной архитектурой.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/span&gt;&lt;/a&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/h4&gt;\n&lt;p&gt;Оценка городских показателей. Снимки с воздуха активно применяются для анализа безопасности и мобильности, включая прогнозирование риска ДТП и картографирование пешеходных сетей. Методы сегментации также задействуются для оценки озеленения территорий. Панорамы улиц (street-view) широко используются для изучения субъективного восприятия городской среды, например, уровня безопасности или оживленности, а в последних исследованиях — для моделирования человеческого восприятия и оценки с помощью мультимодальных больших языковых моделей (LLM). В отличие от существующих подходов, мы используем эти модели не только для анализа, но и для управления визуальными изменениями, направленными на улучшение конкретных показателей в заданной локации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от классических методов анализа, VIDA-GEO использует модели для активного проектирования реальных городских изменений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Принятие решений и вмешательства. Цифровые двойники объединяют городские данные и симуляции для поддержки обоснованных решений, однако такие системы часто узкоспециализированы и требуют больших затрат на моделирование. Предыдущие исследования применяли контрфактуальные модели для анализа влияния входных данных на прогнозы, а также диффузионные модели для объяснения работы «черных ящиков». Наша цель — трансформировать эти методы из инструментов анализа в инструменты практического воздействия на городскую среду.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контрфактуальное моделирование — это метод «что, если», который позволяет понять, как изменится результат, если изменить один из входных параметров системы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Агенты для вмешательства и интерпретируемости. Мультимодальные модели (VLM) в дистанционном зондировании адаптируют инструкции для работы со снимками из космоса, включая развитие агентных систем. Существующие работы показывают, как агенты могут проектировать эксперименты для поиска ошибок в моделях или симулировать изменения в облике улиц. В отличие от них, VIDA-GEO рассматривает городское вмешательство как мультимодальную задачу принятия решений. Предлагаемые нами действия оптимизируются не только для достижения целевых показателей, но и с учетом физической реалистичности и возможности реализации в рамках городской политики.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от чисто теоретических моделей, VIDA-GEO накладывает дополнительные ограничения на физическую осуществимость предлагаемых изменений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;В данном разделе рассматриваются детали реализации системы, эталонные тесты и сравнительный анализ, подтверждающий эффективность предложенной мультиагентной системы в создании реалистичных и обоснованных вмешательств в городскую среду.&lt;/p&gt;\n&lt;h4 id=\"benchmark\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#benchmark\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бенчмарк&lt;/span&gt;&lt;/a&gt;Бенчмарк&lt;/h4&gt;\n&lt;p&gt;Для комплексной оценки используются два типа визуальных данных: аэрофотоснимки высокого разрешения от MapBox и панорамы Google Street View. Для прогнозирования показателей (индикаторов) применяются «черные ящики» — специализированные модели. Для аэрофотоснимков это Beta Risk (прогноз риска ДТП) и OpenEarthMap (анализ озеленения). Для панорам используются модели Global Streetscapes, предобученные на MIT Place Pulse 2.0, оценивающие шесть атрибутов: безопасность, оживленность, красоту, богатство, а также уровни «скучности» и «депрессивности» по шкале от 0 до 100. Из общего пула изображений отбираются по 100 примеров на каждый из 8 индикаторов, исключая те, где исходный балл уже превышает 90, чтобы обеспечить разнообразие по географии и визуальным характеристикам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система использует 8 индикаторов для оценки вмешательств, отбирая по 100 разнообразных изображений для каждого типа данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metriki-ocenki\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#metriki-ocenki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Метрики оценки&lt;/span&gt;&lt;/a&gt;Метрики оценки&lt;/h4&gt;\n&lt;p&gt;Эффективность вмешательств оценивается по двум осям: перцептивное качество (визуальная реалистичность) и соответствие политике (практическая применимость). Для проверки того, что изменения не выходят за рамки распределения реальных данных, используется прокси-метрика на основе расстояния Махаланобиса.&lt;/p&gt;\n&lt;h4 id=\"ocenka-s-pomoshyu-llm-sudej\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ocenka-s-pomoshyu-llm-sudej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка с помощью LLM-судей&lt;/span&gt;&lt;/a&gt;Оценка с помощью LLM-судей&lt;/h4&gt;\n&lt;p&gt;Масштабируемая оценка проводится моделями GPT 5.2 и Qwen 3VL. Изображения оцениваются по шкале 1–100 по трем критериям: визуальное качество, реализм (физическая и семантическая правдоподобность) и сохранение политики (соответствие исходной структуре и функции сцены). Среднее значение этих оценок формирует итоговый балл. Дополнительная проверка экспертами (7 студентов-магистров и 5 специалистов по городскому планированию) подтвердила высокую корреляцию с оценками LLM, что позволяет использовать последние как надежный прокси для человеческого суждения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-судья — это использование мощных языковых моделей для автоматизированной оценки качества изображений по заданным критериям, что заменяет дорогостоящий ручной труд.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bazovye-modeli\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#bazovye-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Базовые модели&lt;/span&gt;&lt;/a&gt;Базовые модели&lt;/h4&gt;\n&lt;p&gt;Сравнение проводится с URSimulator (итеративное редактирование на основе диффузионных моделей), DIFFusion (градиентная оптимизация для интерпретации различий между классами), LANCE (дискретный поиск контрфактуалов) и NanoBanana 2.5 в режиме zero-shot. Все модели ограничены одинаковым количеством вызовов генеративных функций.&lt;/p&gt;\n&lt;h3 id=\"rezultaty1\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#rezultaty1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;p&gt;VIDA-GEO демонстрирует наилучшие показатели по обеим осям оценки. В Таблице 1 показано, что система превосходит конкурентов в 7 из 8 задач, обеспечивая последовательное улучшение индикаторов при сохранении реалистичности вмешательств.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сравнение ограничено количеством вызовов генеративных моделей, что может не учитывать потенциал методов при неограниченных ресурсах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dorozhnyj-risk-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#dorozhnyj-risk-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дорожный риск VIDA-GEO&lt;/span&gt;&lt;/a&gt;Дорожный риск VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;В категории оценки дорожных рисков (Road Risk) модель VIDA-GEO демонстрирует высокую точность с показателем 82.1, значительно опережая конкурентов. Метод LANCE показывает 68.7, тогда как DIFFusion ограничивается 13.3, а NB2.5 (ZS) достигает 81.6. Эти данные указывают на способность модели эффективно выявлять потенциально опасные участки городской среды.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO лидирует в оценке дорожных рисков с показателем 82.1, демонстрируя преимущество перед альтернативными методами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"bezopasnost-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#bezopasnost-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Безопасность VIDA-GEO&lt;/span&gt;&lt;/a&gt;Безопасность VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;Для оценки безопасности (Safety) VIDA-GEO показывает результат 20.9, уступая методам LANCE (33.8), DIFFusion (50.5), URSimulator (33.0) и NB2.5 (ZS) (41.3). Низкий показатель VIDA-GEO в этом сегменте может быть связан с особенностями интерпретации визуальных признаков безопасности в обучающей выборке.&lt;/p&gt;\n&lt;h4 id=\"ozhivlennost-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ozhivlennost-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оживленность VIDA-GEO&lt;/span&gt;&lt;/a&gt;Оживленность VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;В оценке «оживленности» (Lively) VIDA-GEO достигает 25.1. Другие методы показывают следующие результаты: LANCE — 23.0, DIFFusion — 39.5, URSimulator — 29.6, NB2.5 (ZS) — 52.0. Здесь VIDA-GEO сопоставима с LANCE, но уступает методу NB2.5 (ZS), который лучше справляется с определением динамических характеристик среды.&lt;/p&gt;\n&lt;h4 id=\"estetichnost-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#estetichnost-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эстетичность VIDA-GEO&lt;/span&gt;&lt;/a&gt;Эстетичность VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;При оценке эстетической привлекательности (Beautiful) VIDA-GEO показывает 26.1. Конкурирующие модели демонстрируют: LANCE — 42.1, DIFFusion — 53.0, URSimulator — 32.8, NB2.5 (ZS) — 43.7. Метод DIFFusion лидирует в данной категории, что подчеркивает его эффективность в анализе визуальной эстетики.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эстетическая оценка (Beautiful) — это метрика, определяющая субъективное восприятие привлекательности городской среды на основе визуальных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"blagosostoyanie-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#blagosostoyanie-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Благосостояние VIDA-GEO&lt;/span&gt;&lt;/a&gt;Благосостояние VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;В категории оценки благосостояния (Wealthy) VIDA-GEO получает 27.0. Остальные методы распределились так: LANCE — 35.4, DIFFusion — 54.9, URSimulator — 35.5, NB2.5 (ZS) — 68.8. Модель NB2.5 (ZS) показывает здесь наиболее высокие результаты, что может указывать на её чувствительность к признакам социально-экономического статуса объектов.&lt;/p&gt;\n&lt;h4 id=\"skuka-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#skuka-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Скука VIDA-GEO&lt;/span&gt;&lt;/a&gt;Скука VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;В оценке «скучности» (Boring) VIDA-GEO демонстрирует высокий показатель 74.6. Для сравнения: LANCE — 62.8, DIFFusion — 55.2, URSimulator — 64.4, NB2.5 (ZS) — 61.1. Высокий результат VIDA-GEO свидетельствует о её способности точно идентифицировать монотонные или визуально невыразительные городские пространства.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Высокие показатели в категории «Boring» могут отражать как точность модели, так и специфику классификации визуально однородных объектов в датасете.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"depressivnost-vida-geo\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#depressivnost-vida-geo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Депрессивность VIDA-GEO&lt;/span&gt;&lt;/a&gt;Депрессивность VIDA-GEO&lt;/h4&gt;\n&lt;p&gt;Модель VIDA-GEO демонстрирует превосходство по показателям визуальной связности и соответствия градостроительным нормативам, превосходя базовые модели в среднем на 15%. Хотя модель DIFFusion способна достигать радикальных изменений (например, снижение риска на дорогах на 72,8%), качество её визуальных правок и соответствие политикам остаются низкими. Модель LANCE часто вносит изменения в нежелательном направлении, уступая VIDA-GEO по оценкам LLM-судей. Базовая модель NB2.5 (ZS) показывает более значительные количественные сдвиги (улучшение показателей Lively и Wealthy на 39,1% и 50,8% против 12,7% и 10,2% у VIDA-GEO), однако эти изменения часто нереалистичны. Исключением является задача озеленения, где NB2.5 (ZS) сопоставима с VIDA-GEO из-за простоты визуальных правок.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO обеспечивает лучший баланс между качеством визуализации и соблюдением реальных градостроительных политик, в то время как другие модели либо менее точны, либо создают нереалистичные артефакты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Экспертная оценка показала разрыв между автоматизированными «черными ящиками» и мнением специалистов. В сравнении с DIFFusion эксперты предпочли VIDA-GEO в 61,3% случаев по критерию атрибутивного соответствия, тогда как автоматические модели — лишь в 10%. В сравнении с LANCE предпочтение VIDA-GEO составило 86,7% по атрибутам и 79,3% по реализуемости. При этом LLM-судьи показали высокую корреляцию с экспертами (88,5% по реализму и 91,6% по сохранению политик), что делает их эффективным масштабируемым инструментом оценки. Качественный анализ (Рис. 3) подтверждает, что VIDA-GEO предлагает реалистичные решения (расширение бордюров, тактильные покрытия), в то время как DIFFusion часто удаляет важные объекты, такие как светофоры, или просто меняет цветовой тон.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f3.jpg\" alt=\"Рисунок 3: Сравнение результатов вмешательства VIDA-GEO и DIFFusion для панорам улиц (первые ряды) и аэрофотоснимков (по\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Сравнение результатов вмешательства VIDA-GEO и DIFFusion для панорам улиц (первые ряды) и аэрофотоснимков (последний ряд).&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Сравнение результатов вмешательства VIDA-GEO и DIFFusion для панорам улиц (первые ряды) и аэрофотоснимков (последний ряд). Вмешательства, предлагаемые VIDA-GEO, более практичны и реализуемы в реальном мире, например, добавление столбиков и тактильной плитки вокруг перекрестка во втором случае. Кроме того, VIDA-GEO может предоставлять текстовые инструкции вместе с изображениями, в отличие от DIFFusion, что более полезно для пользователя.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LLM-судья — использование языковых моделей для оценки качества генерации изображений на основе текстовых критериев, что заменяет дорогостоящую человеческую экспертизу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;VIDA-GEO поддерживает последовательное редактирование (Рис. 4). При итеративном применении правок (например, добавление мурала, расширение зданий, текстурирование окон) показатель «скучности» (boring score) снижается с 53% до 17%, что значительно эффективнее однократного редактирования (до 40%). Хотя при итерациях метрики LLM-судей немного снижаются, это является приемлемым компромиссом для достижения более глубоких градостроительных целей.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f4.jpg\" alt=\"Рисунок 4: Использование VIDA-GEO с несколькими последовательными правками.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Использование VIDA-GEO с несколькими последовательными правками.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4: Использование VIDA-GEO с несколькими последовательными правками. (a) Система предлагает несколько правок в разных областях и повышает показатель индикатора. Например, в нижнем ряду она улучшает фасад здания, затем добавляет фонарный столб, а затем придорожные цветы, повышая оценку эстетичности с 29,2% до 92,4%. (b) Количественная прогрессия в ходе последовательных итераций.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"ablyacii\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ablyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абляции:&lt;/span&gt;&lt;/a&gt;Абляции:&lt;/h4&gt;\n&lt;p&gt;Анализ компонентов показал, что ограничения политики (policy constraints) вносят наибольший вклад в итоговое качество. Модули контроля качества правок (Edit QC) и масок (Mask QC) обеспечивают существенный прирост, а модуль предложений (suggestor) дает стабильные, хотя и менее значительные улучшения.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Авторы представили новую концепцию, смещающую фокус с простого мониторинга городской среды на тестирование конкретных вмешательств и поддержку принятия решений. Для оценки эффективности предложенных изменений был разработан бенчмарк, включающий 8 различных задач на основе 800 изображений (как спутниковых, так и уличных панорам), а также метрики для оценки качества вмешательств с точки зрения восприятия и соответствия политике. Основным инструментом стал метод VIDA-GEO — мультиагентная система, генерирующая обоснованные изменения пространства, которые могут служить вспомогательным инструментом для градостроителей.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya-i-budushie-issledovaniya\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ogranicheniya-i-budushie-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и будущие исследования&lt;/span&gt;&lt;/a&gt;Ограничения и будущие исследования&lt;/h4&gt;\n&lt;p&gt;Поскольку предложенный подход является пионерским, он имеет ряд ограничений. В текущей реализации генерация правок через модель FLUX, особенно для спутниковых снимков, часто не проходит внутренние проверки качества, что вынуждает систему чрезмерно полагаться на алгоритм NanoBanana. Замена проприетарных моделей на открытые аналоги возможна, но ведет к существенному снижению качества. Кроме того, метод требует многократных проверок масок и правок, что в будущем можно оптимизировать за счет более совершенных инструментов сегментации. Система пока не учитывает напрямую нормы зонирования, инженерные стандарты или бюджетные ограничения, поэтому она позиционируется как инструмент ранней стадии проектирования, а не как готовая система реализации. Сгенерированные визуальные прокси позволяют экспертам сравнивать варианты, а интеграция жестких ограничений станет задачей для будущих исследований.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO предлагает новый подход к визуализации городских изменений, однако текущая зависимость от проприетарных моделей и отсутствие учета строительных норм ограничивают его применение этапом концептуального проектирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"statistika-dannyh-benchmarka\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#statistika-dannyh-benchmarka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СТАТИСТИКА ДАННЫХ БЕНЧМАРКА&lt;/span&gt;&lt;/a&gt;СТАТИСТИКА ДАННЫХ БЕНЧМАРКА&lt;/h4&gt;\n&lt;p&gt;Датасет охватывает глобальную географию: Северная Америка (43%), Европа (18%), Азия (17%), Южная Америка (14%) и Океания (8%). Процесс отбора изображений был автоматизирован: исключались случаи, где вмешательство невозможно (например, сверхплотная застройка или снимки, перекрытые автомобилями). Статистика состава изображений показывает, что спутниковые снимки содержат в среднем 57,6% городской застройки, 41,1% растительности, 14,6% дорог и 18,9% зданий. На уличных панорамах преобладает небо (39,9%), здания (17,4%) и растительность (15,5%). Таблица 9 содержит распределение оценок по восьми индикаторам, включая такие показатели, как безопасность, привлекательность и уровень озеленения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бенчмарк — это набор данных и задач, используемый для сравнения производительности различных алгоритмов по единой шкале.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sravnenie-s-realnymi-gorodskimi-izmeneniyami\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#sravnenie-s-realnymi-gorodskimi-izmeneniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнение с реальными городскими изменениями&lt;/span&gt;&lt;/a&gt;Сравнение с реальными городскими изменениями&lt;/h4&gt;\n&lt;p&gt;Авторы провели качественный анализ, сопоставив результаты работы VIDA-GEO с реальными проектами по благоустройству городской среды. Как показано на Рис. 9, модель успешно генерирует визуализации, соответствующие практическим изменениям, таким как модернизация тротуаров, создание велодорожек, нанесение пешеходной разметки или обновление фасадов зданий (например, театральных вывесок). Эти вмешательства направлены на повышение показателей безопасности и эстетической привлекательности.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f9.jpg\" alt=\"Рисунок 9: Качественное сравнение вмешательств VIDA-GEO с изменениями в реальном мире. Слева направо: исходная сцена, на\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9: Качественное сравнение вмешательств VIDA-GEO с изменениями в реальном мире. Слева направо: исходная сцена, наблюдаемое реальное вмешательство и вмешательство, созданное VIDA-GEO. В верхнем примере VIDA-GEO аналогичным образом улучшает пешеходный переход, тротуар и театральную вывеску; в нижнем примере она добавляет велосипедную дорожку, аналогичную той, что наблюдалась при реальном вмешательстве.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VIDA-GEO демонстрирует способность предлагать реалистичные городские изменения, сопоставимые с реальными градостроительными практиками.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"detali-ablyacionnogo-issledovaniya\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#detali-ablyacionnogo-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детали абляционного исследования&lt;/span&gt;&lt;/a&gt;Детали абляционного исследования&lt;/h4&gt;\n&lt;p&gt;Для оценки вклада отдельных компонентов системы авторы провели абляционный анализ, отключив ключевые подмодули: ограничитель политики (restrictor), генератор подсказок (suggestor), а также модули контроля качества (QC) генерации и сегментации. Для теста случайным образом отобрали по 10 изображений на каждую задачу. Результаты показали, что отключение модулей контроля качества приводит к существенному снижению средней оценки LLM-судьи: с 77,7% до 67,1% (для контроля редактирования) и до 64,2% (для контроля масок сегментации). В 38,3% случаев модели с отключенными компонентами не смогли улучшить базовые показатели. Подробные данные представлены в Таблице 12.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Абляционное исследование — это метод «выключения» отдельных частей системы для проверки того, насколько сильно каждая из них влияет на итоговый результат.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"interfejs-dlya-ocenki-polzovatelyami\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#interfejs-dlya-ocenki-polzovatelyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерфейс для оценки пользователями&lt;/span&gt;&lt;/a&gt;Интерфейс для оценки пользователями&lt;/h4&gt;\n&lt;p&gt;В ходе человеческой оценки (Рис. 10, 11) экспертам предлагалось сравнить пары изображений по трем критериям: изменение целевого показателя, визуальная реалистичность и соответствие градостроительной политике. Чтобы избежать предвзятости в пользу VIDA-GEO из-за низкой реалистичности моделей диффузии, участникам не давали примеров и не давали строгих определений таких понятий, как «безопасность» или «богатство».&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f10.jpg\" alt=\"Рисунок 10: Инструкции, предоставленные экспертам-людям. Инструкции были намеренно упрощены, чтобы предотвратить предвзя\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10: Инструкции, предоставленные экспертам-людям. Инструкции были намеренно упрощены, чтобы предотвратить предвзятость пользователей при выборе нашего метода.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f10-2.jpg\" alt=\"Рис. 10 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 10 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f11.jpg\" alt=\"Рисунок 11: Пользовательский интерфейс с вопросами, показанными экспертам-людям. Им случайным образом демонстрируются лу\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 11: Пользовательский интерфейс с вопросами, показанными экспертам-людям. Им случайным образом демонстрируются лучшее вмешательство DIFFusion и лучшее вмешательство VIDA-GEO, после чего задаются три вопроса об индикаторе, качестве восприятия и соответствии политике.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отсутствие жестких определений критериев при человеческой оценке было намеренным шагом для предотвращения систематической ошибки (bias) в пользу системы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vliyanie-i-ogranicheniya-raboty\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#vliyanie-i-ogranicheniya-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние и ограничения работы&lt;/span&gt;&lt;/a&gt;Влияние и ограничения работы&lt;/h4&gt;\n&lt;p&gt;VIDA-GEO является первым инструментом, помогающим планировщикам визуализировать и сравнивать варианты изменений городской среды до начала дорогостоящих работ. Однако система не заменяет инженерные изыскания и общественные слушания. Авторы подчеркивают, что модель может наследовать географические или социально-экономические искажения из предобученных алгоритмов, а предложенные визуальные решения могут оказаться юридически или физически невыполнимыми. Существует риск, что инструмент будет использоваться для «косметического» улучшения вместо решения фундаментальных проблем.&lt;/p&gt;\n&lt;h4 id=\"licenzirovanie-izobrazhenij\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#licenzirovanie-izobrazhenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лицензирование изображений&lt;/span&gt;&lt;/a&gt;Лицензирование изображений&lt;/h4&gt;\n&lt;p&gt;Авторы не распространяют исходные изображения (Google Street View, MapBox и др.). В открытый доступ выложены только наборы координат для каждой задачи, что позволяет пользователям самостоятельно получать снимки из источников, соответствующих их лицензионным требованиям.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;VIDA-GEO представляет собой мультиагентную систему, которая преобразует исходное изображение и целевую инструкцию по улучшению в конкретные предложения по изменению среды. Вместо глобального редактирования всего кадра система декомпозирует задачу на специализированные этапы, что позволяет создавать локализованные и атомарные правки. Процесс организован в виде итеративного цикла с обратной связью, где результаты предыдущих эпох помогают корректировать планирование и избегать повторных ошибок. Конвейер VIDA-GEO (см. Рис. 2) включает четыре агента, систему оценки и механизм оркестрации.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f2.jpg\" alt=\"Рисунок 2: Обзор конвейера VIDA-GEO. При наличии изображения и целевой инструкции по улучшению городской среды группа аг\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Обзор конвейера VIDA-GEO. При наличии изображения и целевой инструкции по улучшению городской среды группа агентов определяет области интереса (ROI), сегментирует и редактирует их с учетом специфических для задачи ограничений для создания вариантов…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Обзор конвейера VIDA-GEO. При наличии изображения и целевой инструкции по улучшению городской среды группа агентов определяет области интереса (ROI), сегментирует и редактирует их с учетом специфических для задачи ограничений для создания вариантов вмешательств. Проверки качества оценивают реалистичность и соблюдение политики. Кандидаты окончательно оцениваются индикатором «черного ящика».&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"agent-planirovaniya\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#agent-planirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агент планирования&lt;/span&gt;&lt;/a&gt;Агент планирования&lt;/h4&gt;\n&lt;p&gt;Агент планирования (Planning Agent) определяет потенциальные зоны интереса (ROI) для вмешательства, ранжируя их и формируя пространственные координаты, ограничивающие рамки и семантические описания. Это позволяет избежать нереалистичных изменений, характерных для прямого редактирования всего изображения. В последующих эпохах планировщик учитывает сводку прошлых попыток для оптимизации стратегии.&lt;/p&gt;\n&lt;h4 id=\"agent-politiki\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#agent-politiki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агент политики&lt;/span&gt;&lt;/a&gt;Агент политики&lt;/h4&gt;\n&lt;p&gt;Агент политики (Policy Agent) устанавливает физические и семантические ограничения для каждой зоны. Существует три категории областей: свободные (допускаются любые правки), ограниченные (правки разрешены при соблюдении правил) и исключенные (критическая инфраструктура, которую нельзя менять). Для уличных сцен агент обеспечивает общую связность, сохраняя функциональность зданий и входов (примеры нарушений см. на Рис. 5a).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f5.jpg\" alt=\"Рисунок 5: Примеры неудачных случаев.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Примеры неудачных случаев.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: Примеры неудачных случаев. (a) показывает нарушения политики, которых наша система избегает. (b) показывает маски сегментации, отклоненные под-агентом контроля качества (QC), где верхнее изображение сегментирует «здание средней этажности», а нижнее — «травянистые кустарники». В то время как подрисунок (c) иллюстрирует отклоненные правки: верхняя правка включает низкое разрешение и нереалистичное редактирование, а нижняя правка выполняет заполнение неверной области.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"agent-segmentacii\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#agent-segmentacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агент сегментации&lt;/span&gt;&lt;/a&gt;Агент сегментации&lt;/h4&gt;\n&lt;p&gt;Агент сегментации (Segmentation Agent) выделяет объекты в зонах интереса, используя текстовые запросы, модели с открытым словарем или точечные подсказки (см. Рис. 2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Сегментация — это процесс выделения конкретных объектов на изображении (например, дорог или зданий) для их последующего изменения без затрагивания фона.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"pod-agent-kontrolya-kachestva-segmentacii\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#pod-agent-kontrolya-kachestva-segmentacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Под-агент контроля качества сегментации&lt;/span&gt;&lt;/a&gt;Под-агент контроля качества сегментации&lt;/h4&gt;\n&lt;p&gt;Каждая маска проходит проверку через LLM-модуль по трем критериям: покрытие (точность охвата области), прецизионность (отсутствие лишних элементов) и фрагментация (связность маски). Если маска не проходит проверку, система запускает цикл обратной связи, корректируя ключевые слова для повторной сегментации.&lt;/p&gt;\n&lt;h4 id=\"agent-generacii\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#agent-generacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Агент генерации&lt;/span&gt;&lt;/a&gt;Агент генерации&lt;/h4&gt;\n&lt;p&gt;Агент генерации (Generation Agent) выполняет диффузионное редактирование (inpainting) на основе масок и текстовых промптов, в которые интегрированы ограничения от Агента политики. Если масочное редактирование невозможно, система переключается на генерацию без масок.&lt;/p&gt;\n&lt;h4 id=\"pod-agent-kontrolya-kachestva-generacii\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#pod-agent-kontrolya-kachestva-generacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Под-агент контроля качества генерации&lt;/span&gt;&lt;/a&gt;Под-агент контроля качества генерации&lt;/h4&gt;\n&lt;p&gt;Результаты оцениваются по реалистичности (отсутствие артефактов), контекстной связности и точности следования промпту. Отдельно проводится проверка на соответствие политике: например, система блокирует нелогичные изменения, такие как замена парковки на жилой кластер, опираясь на внутренние знания LLM о городских нормах.&lt;/p&gt;\n&lt;h4 id=\"obratnaya-svyaz\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#obratnaya-svyaz\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обратная связь&lt;/span&gt;&lt;/a&gt;Обратная связь&lt;/h4&gt;\n&lt;p&gt;В случае получения некорректных результатов, примеры которых приведены на Рис. 5c, система направляет данные об ошибках обратно в «Агент генерации». Агент проводит анализ, чтобы выявить причины сбоя: отсутствие реалистичности, нарушение логической связности или отклонение от заданного промпта. После этого подмодуль «Агент предложений» формирует уточненный промпт для следующей итерации редактирования.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обратная связь позволяет системе обучаться на собственных ошибках, корректируя инструкции для генерации в реальном времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenka-i-mnogociklovaya-orkestraciya\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#ocenka-i-mnogociklovaya-orkestraciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка и многоцикловая оркестрация&lt;/span&gt;&lt;/a&gt;Оценка и многоцикловая оркестрация&lt;/h4&gt;\n&lt;p&gt;Для каждой области интереса (ROI) может быть получено несколько вариантов изображений, прошедших контроль качества. Все одобренные кандидаты оцениваются с помощью индикатора «черного ящика» и сравниваются с исходным изображением. Ранжирование кандидатов происходит на основе разницы между оценками (delta score). Процесс повторяется в течение нескольких циклов, результаты которых передаются «Агенту планирования».&lt;/p&gt;\n&lt;p&gt;Чтобы стимулировать систему находить новые области, создавать иные маски и предлагать альтернативные варианты правок, все предыдущие результаты вместе с их delta score сохраняются и используются в последующих циклах. Накопленная история препятствует повторению неэффективных стратегий и способствует поиску разнообразных направлений редактирования. В результате такой подход позволяет получить несколько вариантов правок для одного исходного изображения, каждый из которых соответствует заданным ограничениям и улучшает показатель индикатора «черного ящика».&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f6.jpg\" alt=\"Рисунок 6: Качественные примеры выходных данных агентов сегментации и генерации, демонстрирующие первоначально неудачные\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Качественные примеры выходных данных агентов сегментации и генерации, демонстрирующие первоначально неудачные результаты, которые были позже исправлены для прохождения контроля качества (QC).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f6-2.jpg\" alt=\"Рис. 6 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f7.jpg\" alt=\"Рисунок 7: Последовательное редактирование с помощью VIDA-GEO в шести задачах восприятия Street View.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Последовательное редактирование с помощью VIDA-GEO в шести задачах восприятия Street View.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 7: Последовательное редактирование с помощью VIDA-GEO в шести задачах восприятия Street View. На каждой панели представлены средний балл восприятия, соответствующий цели, вместе с оценками Qwen3-VL по реализму, сохранению политики, визуальному качеству и средними оценками LLM-Judge для последовательных правок 10 входных данных. Для категорий «Скучный» (Boring) и «Удручающий» (Depressing) исходный балл восприятия инвертирован (10 − исходный балл), чтобы более высокие значения последовательно указывали на прогресс в достижении цели. Редактирование для входного изображения прекращается, когда ни один приемлемый кандидат не проходит контроль качества или когда цель достигнута; остановленные входные данные сохраняют свой последний принятый результат в последующих средних значениях по когорте.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-f8.jpg\" alt=\"Рисунок 8: Контрфактические правки сцены и соответствующие выходные данные предиктора.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8: Контрфактические правки сцены и соответствующие выходные данные предиктора.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 8: Контрфактические правки сцены и соответствующие выходные данные предиктора. VIDA-GEO создает альтернативные версии одного и того же изображения Street View с помощью двух различных направлений редактирования. По мере удаления растительности и ухудшения состояния окружающей среды предиктор «красоты» (black-box) присваивает все более низкие оценки. Согласованные и интерпретируемые изменения оценок свидетельствуют о том, что предиктор фиксирует значимые атрибуты сцены при контрфактических вмешательствах, что подтверждает его использование в качестве компонента модели мира.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-fS1-2.jpg\" alt=\"Рис. S1 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http:/ =\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;варианты&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;перепланировки&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Автоматизация&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;поддержки&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;принятия&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;решений&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;osm_gis&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/
