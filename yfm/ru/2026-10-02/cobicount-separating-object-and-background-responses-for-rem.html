        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"175\" cy=\"85\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"485\" cy=\"242\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SAT_IMAGERY   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Считаем объекты на&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;спутниковых снимках без&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;дообучения нейросетей&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Авторы метода COBICount решили проблему «кандидатной неоднозначности», когда нейросеть путает объекты с элементами ландшафта. Модель обучается на одном источнике и успешно переносится на новые типы данных без участия человека. Это позволяет считать объекты на картах, даже если условия съемки или типы объектов сильно отличаются от обучающей выборки.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;COBICount разделяет генерацию ответов, их проверку и подавление фоновых шумов.&lt;/li&gt;\n&lt;li&gt;Модель обучается на одном источнике и работает на новых данных без дообучения.&lt;/li&gt;\n&lt;li&gt;Средняя абсолютная ошибка (MAE) на целевых доменах DOTA составила 174,132.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В основе метода лежит разделение процесса обработки на три этапа: генерация кандидатов (CE), их проверка на компактность (CA) и подавление ложных срабатываний (BI). Традиционные модели часто принимают края дорог или крыш за искомые объекты, что искажает статистику. COBICount использует архитектуру, которая изолирует повторяющиеся фоновые структуры, не требуя разметки для целевых доменов.&lt;/p&gt;\n&lt;p&gt;Система была протестирована на наборе данных RSOC (здания) и успешно применена к объектам из DOTA (транспорт и корабли). При использовании 5,07 млн параметров и 17,41 млрд операций с плавающей запятой для снимка 512x512, модель показала среднюю абсолютную ошибку (MAE) 174,132. Метод доказывает, что можно достичь высокой точности подсчета, опираясь только на исходную разметку без адаптации к новым условиям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод требует наличия качественной исходной разметки и может быть менее эффективен при экстремальных изменениях масштаба объектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Подсчет объектов на снимках дистанционного зондирования Земли (ДЗЗ) — это задача определения количества зданий, транспортных средств или морских судов на аэрофотоснимках и спутниковых изображениях. Большинство современных методов с учителем строят карту плотности, где сумма значений пикселей соответствует общему числу объектов. Однако такие модели часто предполагают идентичность категорий, размеров и фоновых условий, что затрудняет их перенос на другие регионы или типы сенсоров без дополнительного обучения на целевых данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторы предлагают метод COBICount для подсчета объектов без доступа к целевым данным (source-only), который минимизирует ложные срабатывания на фоновых структурах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В задаче обучения «только на исходных данных» (source-only) модель обучается на наборе изображений с единой категорией объектов и схожими условиями съемки, где каждый объект отмечен одной точкой. Целевые изображения при этом недоступны до момента фиксации модели. Основная проблема заключается в том, что модель может ошибочно принимать за объекты повторяющиеся элементы фона: края дорог, границы крыш, парковочные разметки или береговые линии. Метод COBICount разделяет процесс на три этапа: генерация кандидатов (Candidate Evidence, CE), их подтверждение (Candidate Acceptance, CA) и подавление фона (Bias Isolation, BI). BI изолирует отклики, связанные с повторяющимися структурами, а CA оставляет только компактные отклики, центрированные на реальных объектах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод «source-only» означает, что модель обучается на одном наборе данных и должна работать на другом без дообучения на целевых примерах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель была обучена на датасете RSOC (здания) и протестирована на данных DOTA (крупные и мелкие транспортные средства, суда). COBICount продемонстрировал наименьшую среднюю абсолютную ошибку (MAE) среди аналогов, составившую 174.132. Модель использует 5.07 млн параметров и требует 17.41 млрд операций с плавающей запятой (FLOPs) для обработки изображения размером 512 × 512 пикселей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность метода ограничена тем, что модель обучается на специфических условиях съемки, и при радикальной смене домена точность может снижаться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данной работе исследуется задача подсчета объектов на снимках дистанционного зондирования Земли (ДЗЗ) в условиях «source-only counting». В отличие от методов обучения с подкреплением или адаптации доменов, требующих размеченных данных целевой области, данный подход использует только один размеченный исходный домен (например, RSOC Building) для обучения модели, которая затем применяется к новым, не виденным ранее доменам (например, DOTA Large Vehicle, Small Vehicle, Ship или DIOR Airplane). Модель обучается исключительно на точечных аннотациях центров объектов без использования целевых изображений, меток или статистических параметров целевых доменов на этапе обучения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод source-only counting позволяет развертывать модели на новых регионах и сенсорах без необходимости сбора и разметки данных для каждой новой области, что критически важно для оперативного анализа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основная проблема такого подхода — «неопределенность происхождения кандидата» (candidate origin ambiguity). Модель может ошибочно принимать за объекты элементы фона (границы крыш, дорожные разметки, портовые структуры), которые визуально схожи с паттернами, изученными на исходных данных. Кроме того, разница в пространственном масштабе (например, здание на исходном снимке занимает большую площадь, чем автомобиль на целевом) приводит к тому, что отклики модели на реальные объекты могут быть слабее, чем на фоновые структуры. Стандартные метрики MAE и RMSE не позволяют выявить эти ошибки, так как они лишь суммируют итоговый счет, где пропуски объектов и ложные срабатывания на фоне могут взаимно компенсироваться.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Неопределенность происхождения кандидата — это ситуация, когда модель выдает высокий отклик, но невозможно понять, соответствует ли он реальному объекту или случайному геометрическому паттерну фона.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для решения этих проблем предложен метод COBICount, состоящий из трех компонентов: Candidate Evidence (CE) генерирует широкую карту возможных откликов, Candidate Acceptance (CA) фильтрует их на основе соответствия компактным паттернам исходных аннотаций, а Bias Isolation (BI) подавляет отклики, связанные с фоновыми структурами и сетками. Дополнительный модуль Audit, обученный только на исходных данных, используется для проверки паттернов отклика без влияния на итоговую плотность. COBICount демонстрирует наименьший средний MAE на целевых доменах DOTA при обучении на RSOC Building, превосходя существующие аналоги.&lt;/p&gt;\n&lt;p&gt;Исследование опирается на три ключевых аспекта: методы подсчета объектов по точечным аннотациям, требования к данным при смене доменов и способы верификации локализации откликов модели относительно реальных объектов.&lt;/p&gt;\n&lt;p&gt;Подсчет объектов на спутниковых снимках традиционно выполняется либо через их обнаружение (детектирование), либо через точечную разметку. Традиционные методы, такие как DOTA, xView, DIOR и FAIR1M, опираются на аннотации в виде ограничивающих рамок (bounding boxes). Хотя рамки точно определяют положение и размер объекта, их создание требует огромных трудозатрат, особенно при наличии множества мелких целей. Кроме того, методы детектирования часто ошибаются из-за пропусков или дублирования объектов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Точечная разметка (point supervision) — это метод обучения нейросетей, при котором вместо отрисовки рамок вокруг объекта достаточно поставить одну точку в его центре, что значительно ускоряет подготовку датасетов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Альтернативный подход — точечная разметка — минимизирует усилия по аннотированию. В этом случае точки преобразуются в карту плотности, которую сеть учится предсказывать, а итоговое количество объектов вычисляется путем суммирования значений этой карты. Ранние модели, такие как MCNN, использовали параллельные сверточные слои для адаптации к разным размерам объектов, в то время как CSRNet применяла расширенные свертки для увеличения поля зрения. Более современные подходы, такие как Bayesian Loss или методы сопоставления распределений, позволяют учитывать неопределенность разметки, а трансформеры (например, TransCrowd) связывают удаленные участки изображения.&lt;/p&gt;\n&lt;p&gt;Объекты на снимках из космоса сильно варьируются по размеру, а фон часто перегружен повторяющимися элементами: дорогами, крышами и разметкой парковок. Специализированные наборы данных, такие как RSOC, содержат разметку для зданий, судов и транспорта. Архитектуры вроде PSGCNet используют пирамидальные масштабы для анализа сцены, а TASNet применяет механизмы тройного внимания для выделения полезных признаков. BDRNet дополняет регрессию плотности вспомогательным выходом, который предсказывает области, занятые объектами, а EdgeCount использует дистилляцию знаний для облегчения нейросетей без потери точности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие методы показывают высокую точность при совпадении условий обучения и тестирования, однако они не гарантируют устойчивость модели при смене сенсора, разрешения или типа ландшафта.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Низкая ошибка подсчета не всегда означает, что модель «видит» объекты: часто высокие значения плотности ошибочно приписываются повторяющимся текстурам фона, а не реальным целям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Методы адаптации доменов (domain adaptation) позволяют модели использовать изображения из целевой области в процессе обучения, с разметкой или без неё. Состязательное обучение (adversarial training) помогает модели выделять признаки, которые делают исходные и целевые данные неразличимыми. В дистанционном зондировании такие подходы применяются для компенсации различий в сенсорах, регионах и условиях съемки, включая сегментацию изображений без учителя. Однако адаптация требует наличия целевых данных до начала работы и часто нуждается в переобучении для каждой новой области.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Адаптация доменов — это процесс настройки модели, обученной на одних данных (исходный домен), для работы на других (целевой домен), где условия съемки могут отличаться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Обобщение доменов (domain generalization) исключает использование целевых изображений при обучении. Методы, такие как MLDG, имитируют смену доменов, разделяя доступные данные на временные обучающие и тестовые наборы. Другие подходы, например, «хирургия градиентов», минимизируют конфликты обновлений между разными источниками. В задачах подсчета объектов существуют методы, разделяющие общую информацию и специфические признаки групп, а также подходы, использующие один размеченный домен (например, MPCount), которые обучают модель сохранять устойчивость при трансформации исходных изображений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обобщение доменов позволяет модели работать с новыми данными без предварительного сбора целевых выборок, однако требует наличия нескольких размеченных исходных доменов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Предобученные модели, такие как CLIP (связывающая изображения с текстом) или Segment Anything Model (SAM), позволяют сократить объем необходимой разметки. В сфере дистанционного зондирования применяются специализированные методы: SatMAE и SatMAE++ восстанавливают скрытые части изображений, учитывая временные и спектральные характеристики, а также масштаб. Модели RemoteCLIP и GeoRSCLIP адаптируют связь «изображение-текст» для аэрокосмических данных. Несмотря на эффективность, такие модели предоставляют лишь признаки или маски объектов, но не решают задачу прямого подсчета, так как маска не всегда позволяет отделить один объект от группы или фона.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предобученные модели не заменяют необходимость точной локализации объектов, так как они не всегда способны корректно интерпретировать плотные скопления или фоновые шумы как отдельные единицы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модуль CA выполняет фильтрацию откликов модели, чтобы определить, какая часть каждого обнаруженного сигнала попадет на итоговую карту плотности. Система предсказывает четыре карты: A_c (центр), A_o (область), A_q (качество) и A_r (надежность). Итоговая маска A формируется как произведение этих карт: &lt;span class=\"yfm-latex\" data-content=\"A%20%3D%20A_c%20%5Codot%20A_o%20%5Codot%20(0.35%20%2B%200.65A_q)%20%5Codot%20(0.35%20%2B%200.65A_r)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Карты A_c и A_o обучаются на основе близости к целевой точке, при этом A_o охватывает более широкую область. Карты A_q и A_r используют аналогичные цели с разными весами потерь. CA не использует жесткие правила формы или поиск связанных компонентов, а обучается пространственным «воротам» на основе супервизии по точкам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CA ограничивает отклики, заставляя их концентрироваться вокруг истинных меток объектов, подавляя шум вне целевых зон.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;BI отвечает за подавление ложных срабатываний, вызванных повторяющимися паттернами (дороги, сетки парковок), которые не являются целевыми объектами. Модуль оценивает четыре карты риска: Bbg (фон), Bline (линии), Bbroad (широкие структуры) и Bgrid (сетки). Эти карты обучаются через градиенты функции потерь плотности и подавления, а не через классификацию объектов. BI также использует фиксированные преобразования: оператор Собеля G и лапласиан Klap = [-4] для выявления резких изменений интенсивности, а также усредняющее пулинг-окно 25 × 25 для поиска широких областей. Риск рассчитывается как взвешенная сумма Rbi, где итоговый порог удержания V = clip(1 - Rbi, 0, 1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оператор Собеля и лапласиан — это математические методы выделения границ и резких перепадов яркости, позволяющие модели «видеть» контуры объектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Аудит — это вспомогательный блок для визуального контроля, который не влияет на основные вычисления. Он преобразует внутренние признаки в четыре канала: транспорт, здания, суда и фон. Эти каналы не являются классификаторами, а служат для интерпретации того, на какие структуры реагирует сеть. Результаты нормализуются через Softmax, но их значения не следует интерпретировать как вероятности принадлежности к классам.&lt;/p&gt;\n&lt;p&gt;Для обучения используется набор точек &lt;span class=\"yfm-latex\" data-content=\"P_s%20%3D%20%5C%7Bp_i%5C%7D_%7Bi%3D1%7D%5E%7BN%5E*%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Поскольку выходная сетка имеет шаг &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3D%204\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, координаты точек масштабируются. Целевая плотность D^*(u) строится путем размещения нормализованных гауссовых ядер κ_σ с шириной σ_p = 1.15 в каждой точке. Окно ядра ограничено радиусом &lt;span class=\"yfm-latex\" data-content=\"r_%5Csigma%20%3D%20%5Cmax(1%2C%20%20ext%7Bround%7D(3%5Csigma))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обучение полностью опирается на точечные аннотации, поэтому точность модели напрямую зависит от качества разметки центров объектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для обучения модели используются целевые плотности D^* и карты Tσ, основанные на аннотациях исходных изображений. В отличие от выходных данных нейросети, эти карты не нормализуются повторно при обрезке границами изображения. Для центров объектов (Tpeak) и областей поддержки (Tsup) применяются Гауссианы с максимальным значением 1. Используются маски: Mpt (центры), Msup (область поддержки), Mfg (защитная зона, созданная дилатацией 9×9) и Mbg (фон).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Целевые карты Tpeak и Tsup с параметром σ_s=2.35 позволяют модели четко разграничить центры объектов и зоны их влияния.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Функция потерь плотности Lden использует сглаженную L₁-норму, нормализованную по количеству объектов &lt;span class=\"yfm-latex\" data-content=\"N_%7Bnorm%7D%20%3D%20%5Cmax(N%5E*%2C%201)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, чтобы избежать доминирования изображений с высокой плотностью. Дополнительно применяются относительные (Lrel cnt) и логарифмические (Llog cnt) штрафы за ошибку в общем подсчете объектов, что сглаживает влияние больших численных диапазонов.&lt;/p&gt;\n&lt;p&gt;Компоненты CA (Center Awareness) обучаются через бинарную кросс-энтропию (LBCE) с пространственными весами ω_c, ω_o, ω_s, которые фокусируют внимание модели на областях объектов. BI (Background Intelligence) обучается через четыре штрафа (Lbgv, Lline, Lbroad, Lgrid), блокируя градиенты через оператор &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7rdtoqj\"&gt;stop gradient&lt;/code&gt; (sg). Для подавления «ложных срабатываний» (hard negatives) вводится штраф Lhn, наказывающий модель за высокие отклики в зонах, помеченных как фон.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оператор &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psjw87gu\"&gt;stop gradient&lt;/code&gt; (sg) фиксирует значение карты, не позволяя градиенту изменять её веса в процессе обратного распространения ошибки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для балансировки ветвей сети используются энтропийный штраф Lent и штраф баланса Lbal, предотвращающие концентрацию весов на одной ветви. Начиная с 10-й эпохи, активируется аудит (Laud) для уточнения каналов зданий и фона. Итоговая функция потерь L представляет собой взвешенную сумму всех перечисленных метрик с коэффициентом c_e, который линейно возрастает в первые 8 эпох.&lt;/p&gt;\n&lt;p&gt;На этапе инференса модель сначала вычисляет карту плотности b_S и число объектов &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7BN%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Затем применяется жадный алгоритм: из b_S последовательно извлекаются локальные максимумы, превышающие порог $ au = \\max(0.020, 0.28 \\cdot \\max(b_S))$. Принятые точки должны находиться на расстоянии не менее 3.2 ячеек сетки (около 12.8 пикселей) друг от друга, с ограничением общего количества точек Kpt ≤ 1024.&lt;/p&gt;\n&lt;p&gt;Эксперименты проводятся в режиме «только исходные данные» (source-only counting). Роли доменов (исходный/целевой) не являются фиксированными свойствами наборов RSOC, DOTA или DIOR, а назначаются для каждого теста отдельно. Исходный домен содержит одну категорию объектов при определенных условиях съемки и используется для обучения и выбора модели. Целевой домен — это категория или условия, которые остаются скрытыми до момента фиксации модели. В основном эксперименте в качестве источника выступает RSOC Building: обучающая выборка обновляет веса, а валидационная — определяет «чекпоинт» (состояние модели). Далее модель тестируется на трех независимых доменах: DOTA Large Vehicle (LV), DOTA Small Vehicle (SV) и DOTA Ship. В дополнительных тестах источником выступают DIOR Airplane или DOTA Ship.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель обучается исключительно на данных RSOC Building, после чего фиксируется и оценивается на трех независимых целевых доменах DOTA без дообучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Чекпоинт — это сохраненное состояние нейросети с лучшими показателями на валидационном наборе, которое используется для финального тестирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки объектов в DOTA используются ориентированные четырехугольники, а в DIOR — ограничивающие рамки. Для унификации алгоритм извлекает из них центральную точку, которая служит единственным ориентиром для подсчета. Размер, ориентация и границы объектов при обучении не учитываются.&lt;/p&gt;\n&lt;p&gt;Эффективность методов оценивается через среднюю абсолютную ошибку (MAE) и среднеквадратичную ошибку (RMSE). Для агрегированной оценки трех целевых доменов DOTA используется показатель MT-MAE (среднее арифметическое MAE для LV, SV и Ship). Входные изображения для всех методов масштабируются так, чтобы их длинная сторона не превышала 2000 пикселей. Это правило применяется единообразно до начала любых вычислений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование фиксированного размера 2000 пикселей является жестким ограничением, которое может влиять на точность обнаружения очень мелких объектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В сравнении участвуют 13 архитектур, включая MCNN, CSRNet, P2PNet, TransCrowd и другие, охватывающие подходы от регрессии карт плотности до трансформеров. Все модели, включая специализированные для дистанционного зондирования (BDRNet) и базовые (MPCount), были переобучены в режиме «только исходные данные» на RSOC Building. Ни один метод не получает доступа к целевым данным для адаптации или выбора параметров.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f1.jpg\" alt=\"Рис. 1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f2.jpg\" alt=\"Рис. 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f4.jpg\" alt=\"Рис. 4\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 4&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f5.jpg\" alt=\"Рис. 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f6.jpg\" alt=\"Рис. 6\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 6&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-f7.jpg\" alt=\"Рис. 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 7&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" f
