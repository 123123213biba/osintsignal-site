        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"167\" cy=\"95\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"573\" cy=\"218\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · SYNTHETIC   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему обучение нейросетей&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;на контенте от ИИ ведет к&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;деградации моделей&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f1.jpg\" alt=\"Рисунок 1. Сгенерированный ИИ веб-текст помогает только моделям с дефицитом данных и в противном случае требует вычислит\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Сгенерированный ИИ веб-текст помогает только моделям с дефицитом данных и в противном случае требует вычислительных затрат.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Сгенерированный ИИ веб-текст помогает только моделям с дефицитом данных и в противном случае требует вычислительных затрат. Слева: доля веб-токенов в документах &lt;a href=\"concepts/pangram-3-3-2.html\"&gt;Pangram 3.3.2&lt;/a&gt;, помеченных как ИИ или смешанные, по месяцам. Доля только ИИ составляет 10% в июне 2024 года, 16% в июне 2025 года, 28% в июне 2026 года и 31% в августе 2026 года. В центре: значение нашего закона для одного добавленного ИИ-токена при 268 млн параметров, в человеческих токенах, от 5 до 100 &lt;a href=\"concepts/tokens-per-parameter.html\"&gt;TPPh&lt;/a&gt;: положительное при 5 TPPh, ниже нуля начиная с 20 TPPh, как только превышает около 0,08. Справа: вычислительные затраты на нефильтрованный веб-краулинг должны соответствовать обучению на его человеческом подмножестве при 20 TPPh (268 млн параметров) для его ИИ-доли: 1,6× при 31% в августе 2026 года и 2,1× и 3,0× при прогнозах 42% и 51% на конец 2027 и 2028 годов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Интернет заполняется контентом, созданным нейросетями, что меняет качество данных для обучения новых моделей. Авторы работы проанализировали 800 моделей и доказали, что «&lt;a href=\"concepts/dikiy-ii-tekst.html\"&gt;дикий» ИИ-текст&lt;/a&gt; вредит обучению, если его доля превышает критический порог. Вместо бесконечного расширения датасетов за счет ИИ-контента, эффективнее повторять качественные человеческие тексты.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Доля ИИ-контента в веб-данных достигла 31,1% к августу 2026 года.&lt;/li&gt;\n&lt;li&gt;ИИ-текст полезен только для моделей с дефицитом данных, далее он вредит.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rejectors.html\"&gt;Фильтры&lt;/a&gt; &lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; и DCLM ошибочно отдают предпочтение сгенерированному контенту.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metody-i-tochnost\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#metody-i-tochnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и точность&lt;/span&gt;&lt;/a&gt;Методы и точность&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Метод&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Данные&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Точность&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Где ошибается&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Pangram 3.3.2&lt;/td&gt;\n&lt;td&gt;Веб-тексты Common Crawl&lt;/td&gt;\n&lt;td&gt;FPR 0,05%, FNR 1,99%&lt;/td&gt;\n&lt;td&gt;Может ошибаться на старых текстах&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;FineWeb фильтрация&lt;/td&gt;\n&lt;td&gt;Common Crawl документы&lt;/td&gt;\n&lt;td&gt;Пропускает ИИ-текст в 2,3 раза чаще&lt;/td&gt;\n&lt;td&gt;Предвзятость к ИИ-контенту&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи использовали корпус &lt;a href=\"concepts/wildai.html\"&gt;WildAI&lt;/a&gt; (83 млрд токенов) и классификатор Pangram 3.3.2 для разделения данных на человеческие и сгенерированные. Анализ показал, что доля ИИ-контента в Common Crawl выросла с 10,1% в 2024 году до 31,1% к августу 2026 года. Существующие фильтры качества, такие как FineWeb и DCLM, парадоксальным образом пропускают ИИ-текст в 2,3–9,8 раза чаще, чем человеческий.&lt;/p&gt;\n&lt;p&gt;Для оценки влияния авторы обучили 800 моделей (от 19,9 млн до 973 млн параметров). Выяснилось, что для моделей с малым объемом данных ИИ-текст может быть полезен, но при достижении &lt;a href=\"concepts/zakon-masshtabirovaniya-chinchilla.html\"&gt;Chinchilla&lt;/a&gt;-оптимального бюджета (20 токенов на параметр) польза исчезает. Дальнейшее добавление ИИ-токенов начинает повышать ошибку (&lt;a href=\"concepts/loss.html\"&gt;loss&lt;/a&gt;), что требует в 1,6–3 раза больше вычислительных мощностей для компенсации вреда.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено моделями до 973 млн параметров и не учитывает влияние на сверхкрупные &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; (десятки и сотни миллиардов параметров).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Основу современных корпусов для предварительного обучения нейросетей составляет веб-контент, доля которого, созданного искусственным интеллектом (ИИ), стремительно растет. Согласно анализу FineWeb, в июне 2026 года 27,5% токенов в веб-данных были классифицированы системой Pangram как сгенерированные ИИ, а к августу этот показатель достиг 31,1%. В отличие от контролируемых синтетических данных, этот «дикий» ИИ-контент создается множеством различных моделей, изначально ориентирован на людей и попадает в обучающие выборки без маркировки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Доля ИИ-контента в веб-данных выросла с 27,5% до 31,1% за два месяца 2026 года, что создает риски для качества обучения моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для оценки влияния такого контента авторы обучили 800 языковых моделей с количеством параметров от 19,9 млн до 973 млн. В процессе обучения варьировалось соотношение ИИ-токенов и человеческих токенов, после чего строились графики зависимости функции потерь (loss) на отложенных выборках. Для моделей с дефицитом данных добавление ИИ-токенов на начальном этапе снижает потери на человеческих текстах, однако эффект быстро насыщается и сменяется деградацией качества. Для моделей, обучаемых на больших объемах человеческих текстов, добавление ИИ-токенов увеличивает потери практически сразу, тогда как аналогичное количество новых человеческих токенов продолжает улучшать результат.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Функция потерь (loss) — это метрика, показывающая, насколько предсказания модели отличаются от реальных данных; чем ниже значение, тем лучше модель усвоила материал.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Существующие законы масштабирования, такие как Chinchilla, не учитывают различия между типами данных. Авторы предложили новую модель масштабирования с разделением факторов пользы и вреда, которая позволяет оценить ценность ИИ-токена в эквиваленте человеческих токенов. На малых моделях этот закон предсказывает влияние ИИ-текста на потери для моделей, которые в 3,6 раза крупнее, с точностью на 41% выше, чем у существующих аналогов. Согласно расчетам, обучение на нефильтрованном веб-контенте с долей ИИ 31,1% требует в 1,6 раза больше вычислительных мощностей для достижения того же качества, что и на «чистых» человеческих данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;При доле ИИ-контента 22,3% смешанные валидационные выборки скрывают негативное влияние на качество обучения в 95,5% случаев, что делает необходимым раздельный мониторинг метрик.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Интернет стремительно заполняется контентом, созданным искусственным интеллектом. Согласно данным Pangram, доля ИИ-текстов, прошедших фильтры качества FineWeb, выросла с 10,1% в 2024 году до 27,5% в июне 2026 года, достигнув 31,1% к августу 2026 года (Рис. 1). Параллельно с этим современные модели обучаются на объемах данных, значительно превышающих «оптимальный по вычислительным затратам» уровень в ~20 токенов на параметр: например, Qwen3-32B использует около 1100 токенов на параметр. Прогнозы показывают, что все доступные человеческие тексты будут исчерпаны к 2032 году. Это ставит перед разработчиками вопрос: как использовать ИИ-контент в обучающих выборках?&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f1.jpg\" alt=\"Рисунок 1. Сгенерированный ИИ веб-текст помогает только моделям с дефицитом данных и в противном случае требует вычислит\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1. Сгенерированный ИИ веб-текст помогает только моделям с дефицитом данных и в противном случае требует вычислительных затрат.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1. Сгенерированный ИИ веб-текст помогает только моделям с дефицитом данных и в противном случае требует вычислительных затрат. Слева: доля веб-токенов в документах Pangram 3.3.2, помеченных как ИИ или смешанные, по месяцам. Доля только ИИ составляет 10% в июне 2024 года, 16% в июне 2025 года, 28% в июне 2026 года и 31% в августе 2026 года. В центре: значение нашего закона для одного добавленного ИИ-токена при 268 млн параметров, в человеческих токенах, от 5 до 100 TPPh: положительное при 5 TPPh, ниже нуля начиная с 20 TPPh, как только превышает около 0,08. Справа: вычислительные затраты на нефильтрованный веб-краулинг должны соответствовать обучению на его человеческом подмножестве при 20 TPPh (268 млн параметров) для его ИИ-доли: 1,6× при 31% в августе 2026 года и 2,1× и 3,0× при прогнозах 42% и 51% на конец 2027 и 2028 годов.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Доля ИИ-текста в сети достигла 31,1% к августу 2026 года, а модели уже обучаются на объемах данных, многократно превышающих классические Chinchilla-оптимальные значения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы исследуют влияние «дикого» ИИ-текста — контента, созданного моделями для людей и естественно встречающегося в сети, в отличие от синтетических данных, специально подготовленных для обучения. В работе обучено 800 моделей (от 19,9 млн до 973 млн параметров) с добавлением до 64 «диких» ИИ-токенов на каждый человеческий токен. Оценка проводилась на наборах C4, FineWeb и Paloma. Выяснилось, что ИИ-текст полезен только для моделей с дефицитом данных: он снижает потери (loss) при обучении, если объем данных менее 10 токенов на параметр. Однако при достижении Chinchilla-оптимума (20 токенов на параметр) польза исчезает, а дальнейшее увеличение доли ИИ-токенов лишь повышает потери, в то время как свежие человеческие данные продолжают их снижать.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Дикий» ИИ-текст — это неконтролируемый контент, который модели пишут для людей, попадающий в обучающие выборки случайно, в отличие от курируемых синтетических датасетов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для описания этого эффекта предложен новый закон масштабирования, который учитывает насыщающуюся пользу и логарифмически растущий вред от ИИ-текста. Модель, обученная на параметрах до 268 млн, предсказывает поведение моделей в 3,6 раза крупнее с ошибкой RMSE 0,83 × 10⁻³, что значительно точнее существующих подходов (1,41 × 10⁻³ и 4,32 × 10⁻³). Исследование показывает, что текущие фильтры качества, такие как FineWeb и DCLM, ошибочно отдают предпочтение ИИ-контенту (в 2,3 и 9,8 раза чаще, чем человеческому). Обучение на нефильтрованном вебе с долей ИИ 31,1% требует в 1,6 раза больше вычислительных мощностей, чем обучение на чистых человеческих данных, а к 2028 году этот показатель вырастет до 3,0 раз. Авторы публикуют &lt;a href=\"concepts/dataset.html\"&gt;датасет&lt;/a&gt; WildAI (96 млн документов) и все 800 обученных моделей.&lt;/p&gt;\n&lt;h4 id=\"2-izmerenie-veb-dannyh,-sozdannyh-ii\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#2-izmerenie-veb-dannyh,-sozdannyh-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2 Измерение веб-данных, созданных ИИ&lt;/span&gt;&lt;/a&gt;2 Измерение веб-данных, созданных ИИ&lt;/h4&gt;\n&lt;p&gt;В данном разделе авторы описывают процесс формирования масштабного набора данных WildAI, разделенного на тексты, написанные людьми, и контент, сгенерированный ИИ. Исследование показало, что к июню 2026 года доля ИИ-контента среди токенов, прошедших фильтры качества FineWeb, достигла 27,5%, при этом показатель демонстрирует устойчивый ежемесячный рост. Авторы отмечают, что существующие фильтры (FineWeb и DCLM) фактически отдают предпочтение ИИ-текстам.&lt;/p&gt;\n&lt;p&gt;Сбор и классификация данных. Основой послужил корпус FineWeb, расширенный данными Common Crawl за период с июля 2025 по июнь 2026 года. Итоговый набор WildAI включает 96,04 млн документов (83,31 млрд токенов). Для классификации использовался двухэтапный подход: сначала модель EditLens Llama-3.2-3B проводила первичную разметку более 280 млрд токенов, затем более точный инструмент Pangram 3.3.2 выполнял контрольную проверку. В результате был сформирован человеческий корпус (58,91 млн документов, 42,19 млрд токенов) и ИИ-корпус (32,54 млн документов, 35,32 млрд токенов).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pangram 3.3.2 — специализированный классификатор с низким уровнем ошибок: ложноположительный результат составляет 0,05%, ложноотрицательный — 1,99%, что позволяет эффективно разделять распределения данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Динамика и распределение контента. Анализ 310 000 документов за период с января 2021 по август 2026 года выявил резкий рост доли ИИ-контента: с менее 0,1% в июне 2021 года до 10,1% в 2024-м, 16,1% в 2025-м и 27,5% в июне 2026 года (Рис. 1, Рис. 8). К августу 2026 года показатель достиг 31,1%. Наблюдается дисбаланс: например, учебные материалы составляют 18,5% ИИ-контента против 6,2% человеческого, тогда как в личных блогах ситуация обратная (1,0% против 8,6%). Это указывает на то, что модели могут всё сильнее отклоняться от естественного человеческого распределения тем.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f8.jpg\" alt=\"Рисунок 8. Интернет смещается в сторону форматов и тем, которые чаще всего пишет ИИ. Мы строим графики с января 2021 по \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8. Интернет смещается в сторону форматов и тем, которые чаще всего пишет ИИ. Мы строим графики с января 2021 по август 2026 года, используя метки Pangram 3.3.2 и Web Organizer по календарным кварталам. Доля токенов каждого формата и темы в интернете и доля токенов каждого формата и темы, размеченных как ИИ.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Доля ИИ-контента в веб-данных растет ежемесячно, достигнув 31,1% к августу 2026 года, при этом существующие фильтры качества пропускают ИИ-тексты значительно чаще, чем человеческие.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эффективность фильтров. &lt;a href=\"concepts/audit-module.html\"&gt;Аудит&lt;/a&gt; 10 000 документов Common Crawl показал, что фильтры FineWeb и DCLM предвзяты к ИИ-контенту. ИИ-тексты проходят через фильтрацию FineWeb в 2,3 раза чаще (29,3% против 12,8%), а через полный цикл DCLM — в 9,8 раза чаще (14,5% против 1,5%), чем тексты, написанные людьми (Рис. 2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f2.jpg\" alt=\"Рисунок 2. Веб-текст, размеченный ИИ, тяготеет к нескольким форматам и проходит фильтры качества чаще, чем человеческий \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. Веб-текст, размеченный ИИ, тяготеет к нескольким форматам и проходит фильтры качества чаще, чем человеческий текст.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2. Веб-текст, размеченный ИИ, тяготеет к нескольким форматам и проходит фильтры качества чаще, чем человеческий текст. Слева: доля токенов каждого формата, размеченных ИИ, по отношению к доле токенов, размеченных человеком, с января по июнь 2026 года для пяти наиболее перепредставленных и недопредставленных форматов. Справа: доля документов, размеченных ИИ и человеком, в выборке Common Crawl 2026 года, оставшихся после каждого этапа FineWeb.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"3-osnovy-i-smezhnye-raboty\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#3-osnovy-i-smezhnye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3 Основы и смежные работы&lt;/span&gt;&lt;/a&gt;3 Основы и смежные работы&lt;/h4&gt;\n&lt;p&gt;Фундаментальные законы масштабирования. Прогнозирование производительности обучения LLM опирается на три показателя: вычислительные затраты (C), количество параметров модели (N) и объем обучающих токенов (D). Базовая аппроксимация выглядит как C ≈ 6ND. Закон Chinchilla формализует эти зависимости, определяя потери на отложенной выборке.&lt;/p&gt;\n&lt;p&gt;Законы масштабирования для повторов. В оригинальной модели Chinchilla не учитывается разница между уникальными и повторяющимися токенами. Исследователи предложили поправки: одни вводят понятие «эффективного значения» токена, другие добавляют штраф за переобучение, третьи связывают ценность токена с размером модели.&lt;/p&gt;\n&lt;p&gt;Смеси данных и «коллапс модели». Существующие работы моделируют обучение на данных из разных доменов и языков. Отдельное направление изучает «коллапс модели» при рекурсивном обучении на синтетике. Выяснилось, что сохранение части реальных данных смягчает деградацию. При этом синтетические данные могут влиять на поведение модели даже без рекурсии, а их полезность зависит от общего бюджета данных и качества смешивания с веб-текстом.&lt;/p&gt;\n&lt;p&gt;Тексты ИИ в «дикой природе». В отличие от специально подготовленных синтетических датасетов, тексты, созданные ИИ и попавшие в интернет, пишутся для поисковиков и читателей. Они смешаны с человеческими данными, что создает уникальные условия для обучения. Существующие законы плохо предсказывают потери на таких данных (ошибка 8.00 против 0.83 у авторов статьи).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Традиционные законы масштабирования не учитывают специфику «диких» текстов ИИ, что приводит к значительным ошибкам прогнозирования потерь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"4-zakony-masshtabirovaniya-dlya-chelovecheskih-i-ii-tekstov\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#4-zakony-masshtabirovaniya-dlya-chelovecheskih-i-ii-tekstov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4 Законы масштабирования для человеческих и ИИ-текстов&lt;/span&gt;&lt;/a&gt;4 Законы масштабирования для человеческих и ИИ-текстов&lt;/h4&gt;\n&lt;p&gt;Авторы предлагают новый закон масштабирования, который учитывает как пользу, так и вред от добавления ИИ-токенов. Он демонстрирует наименьшую ошибку прогнозирования (0.83 против 1.41 × 10⁻³ на датасете C4).&lt;/p&gt;\n&lt;h4 id=\"41-empiricheskie-nablyudeniya\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#41-empiricheskie-nablyudeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1 Эмпирические наблюдения&lt;/span&gt;&lt;/a&gt;4.1 Эмпирические наблюдения&lt;/h4&gt;\n&lt;p&gt;Методы. Было обучено 800 моделей размером от 19.9 млн до 973 млн параметров с использованием архитектуры NanoChat. Параметры варьировались: количество токенов на параметр (TPPh) от 2.9 до 87.5, соотношение ИИ-данных к человеческим (r) от 0 до 64. Оценка проводилась на наборах C4, Paloma, FineWeb (FW22, FW26) и Cosmopedia.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;TPPh (Tokens Per Parameter) — показатель насыщенности обучения, определяющий, сколько данных «видит» каждый параметр модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты. Модели, обученные только на человеческих текстах, следуют законам Chinchilla. Однако при добавлении ИИ-токенов поведение меняется: при малом бюджете человеческих данных ИИ-тексты помогают, а при большом — вредят. Например, при 5 TPPh ИИ-тексты снижают потери, а при 20 TPPh — увеличивают их (Рис. 3).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f3.jpg\" alt=\"Рисунок 3. Добавленный ИИ-текст снижает потери только при небольших человеческих бюджетах. Изменение потерь на C4 по сра\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3. Добавленный ИИ-текст снижает потери только при небольших человеческих бюджетах. Изменение потерь на C4 по сравнению с контрольной группой модели, обученной только на человеческих данных, при добавлении ИИ-токенов или такого же количества новых человеческих токенов к фиксированному человеческому корпусу при 5, 20 и 40 TPPh.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"42-kriterii\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#42-kriterii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2 Критерии&lt;/span&gt;&lt;/a&gt;4.2 Критерии&lt;/h4&gt;\n&lt;p&gt;Для создания точного закона масштабирования авторы выделили пять критериев: гибкость значения токена (зависимость от N, TPPh и r), способность моделировать как пользу, так и вред, интерпретируемость (разделение факторов влияния), конечное значение первого токена и восстановление закона Chinchilla при отсутствии ИИ-данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемый вред от ИИ-текстов усиливается с ростом размера модели и общего объема обучающих данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"43-zakony-masshtabirovaniya-dlya-ii-tekstov\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#43-zakony-masshtabirovaniya-dlya-ii-tekstov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 Законы масштабирования для ИИ-текстов&lt;/span&gt;&lt;/a&gt;4.3 Законы масштабирования для ИИ-текстов&lt;/h4&gt;\n&lt;p&gt;Мы разработали закон масштабирования, объединяющий архитектуру Chinchilla (уравнение 1) с учетом насыщающейся полезности ИИ-данных (уравнение 9) и штрафной функцией за избыточность ИИ-контента (уравнение 5). Наша модель достигает парной ошибки 0,83 × 10⁻³ на данных C4, что превосходит существующие аналоги (Таблица 1). Функция потерь L(N, D_H, D_A) учитывает объем параметров N, человеческие данные D_H и ИИ-данные D_A (уравнение 2).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Paired RMSE × 10³ на отложенных размерах, чем меньше, тем лучше&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;1&lt;/th&gt;\n&lt;th&gt;2&lt;/th&gt;\n&lt;th&gt;3&lt;/th&gt;\n&lt;th&gt;4&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Chinchilla (Hoffmann et al., 2022)&lt;/td&gt;\n&lt;td&gt;4.32&lt;/td&gt;\n&lt;td&gt;4.65&lt;/td&gt;\n&lt;td&gt;5.40&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Muennighoff et al. (2023)&lt;/td&gt;\n&lt;td&gt;3.96&lt;/td&gt;\n&lt;td&gt;4.21&lt;/td&gt;\n&lt;td&gt;4.94&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;CD (Qin et al., 2026)&lt;/td&gt;\n&lt;td&gt;3.68&lt;/td&gt;\n&lt;td&gt;3.63&lt;/td&gt;\n&lt;td&gt;4.17&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Lovelace et al. (2026)&lt;/td&gt;\n&lt;td&gt;3.55&lt;/td&gt;\n&lt;td&gt;3.74&lt;/td&gt;\n&lt;td&gt;4.14&lt;/td&gt;\n&lt;td&gt;8.38&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;ATLAS (Longpre et al., 2026)&lt;/td&gt;\n&lt;td&gt;4.36&lt;/td&gt;\n&lt;td&gt;4.72&lt;/td&gt;\n&lt;td&gt;5.51&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;He et al. (2025)&lt;/td&gt;\n&lt;td&gt;6.54&lt;/td&gt;\n&lt;td&gt;6.55&lt;/td&gt;\n&lt;td&gt;6.62&lt;/td&gt;\n&lt;td&gt;8.96&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Hamidieh et al. (2025)&lt;/td&gt;\n&lt;td&gt;3.95&lt;/td&gt;\n&lt;td&gt;4.19&lt;/td&gt;\n&lt;td&gt;4.84&lt;/td&gt;\n&lt;td&gt;9.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shukor additive (Shukor et al., 2025)&lt;/td&gt;\n&lt;td&gt;6.77&lt;/td&gt;\n&lt;td&gt;6.70&lt;/td&gt;\n&lt;td&gt;6.26&lt;/td&gt;\n&lt;td&gt;10.05&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Shukor joint (Shukor et al., 2025)&lt;/td&gt;\n&lt;td&gt;1.41&lt;/td&gt;\n&lt;td&gt;1.50&lt;/td&gt;\n&lt;td&gt;2.25&lt;/td&gt;\n&lt;td&gt;7.80&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Sedova et al. (2026)&lt;/td&gt;\n&lt;td&gt;9.60&lt;/td&gt;\n&lt;td&gt;9.59&lt;/td&gt;\n&lt;td&gt;9.57&lt;/td&gt;\n&lt;td&gt;13.32&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Jain et al. (2024)&lt;/td&gt;\n&lt;td&gt;8.00&lt;/td&gt;\n&lt;td&gt;8.03&lt;/td&gt;\n&lt;td&gt;8.04&lt;/td&gt;\n&lt;td&gt;9.34&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ours&lt;/td&gt;\n&lt;td&gt;0.83&lt;/td&gt;\n&lt;td&gt;0.85&lt;/td&gt;\n&lt;td&gt;1.28&lt;/td&gt;\n&lt;td&gt;6.77&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Польза ИИ-токенов моделируется через экспоненциальную форму кредита g(r), где r = D_A/D_H — доля ИИ-текста, а R^* — масштаб насыщения полезности. В отличие от моделей, считающих повторы безвредными, мы ввели штраф за вред (уравнение 4), который логарифмически замедляется с ростом объема ИИ-данных. Маргинальный вред достигает пика при равенстве объемов человеческих и ИИ-токенов (r=1). Мы протестировали закон на 726 моделях (19,9–268 млн параметров) и провели валидацию на 74 моделях (до 973 млн параметров).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наш закон масштабирования точнее предсказывает потери, чем существующие модели, демонстрируя статистически значимое преимущество при работе с ИИ-контентом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/masshtabirovanie.html\"&gt;Масштабирование&lt;/a&gt; — это зависимость качества модели от объема данных и вычислительных мощностей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-effekty-obucheniya-na-ii-tekstah-i-rekomendacii\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#5-effekty-obucheniya-na-ii-tekstah-i-rekomendacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5 Эффекты обучения на ИИ-текстах и рекомендации&lt;/span&gt;&lt;/a&gt;5 Эффекты обучения на ИИ-текстах и рекомендации&lt;/h4&gt;\n&lt;p&gt;Прогнозы показывают, что к концу 2028 года доля ИИ-токенов в наборе FineWeb достигнет 50,7%. Модели, обученные на нефильтрованных данных с текущим уровнем ИИ-контента, требуют в 1,6–3,0 раза больше вычислительных мощностей для достижения качества моделей, обученных на «чистых» данных. Мы рекомендуем удалять ИИ-тексты из обучающих выборок, а при нехватке данных — дублировать человеческие тексты, а не добавлять ИИ-генерацию.&lt;/p&gt;\n&lt;h4 id=\"51-cena-otsutstviya-filtracii\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#51-cena-otsutstviya-filtracii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.1 Цена отсутствия фильтрации&lt;/span&gt;&lt;/a&gt;5.1 Цена отсутствия фильтрации&lt;/h4&gt;\n&lt;p&gt;Мы сравнили модели, обученные на смешанных данных (22,3% ИИ-контента) и на «чистых» человеческих подмножествах. Несмотря на меньший объем данных, модели на человеческих текстах показали более низкие потери на C4 (Рис. 5). Наш закон верно предсказал преимущество фильтрации в 18 из 19 случаев. Анализ с использованием случайного блуждания с дрейфом подтверждает, что из-за роста доли ИИ-текстов вычислительная эффективность моделей будет падать: для достижения уровня «чистой» модели в 2028 году потребуется в 3 раза больше ресурсов.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f5.jpg\" alt=\"Рисунок 5. Фильтрация ИИ-текста окупается при больших человеческих бюджетах, а повторение человеческого текста эффективн\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. &lt;a href=\"concepts/filtratsiya.html\"&gt;Фильтрация&lt;/a&gt; ИИ-текста окупается при больших человеческих бюджетах, а повторение человеческого текста эффективнее добавления ИИ-текста.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5. Фильтрация ИИ-текста окупается при больших человеческих бюджетах, а повторение человеческого текста эффективнее добавления ИИ-текста. Слева: изменение потерь при удалении ИИ-документов из 22,3% ИИ-смеси без их замены, предсказанное нашим законом (цвет; черная линия: без изменений) и измеренное (кружки; значения для 973 млн параметров). Справа: изменение потерь при повторении человеческого корпуса или добавлении такого же количества новых ИИ-токенов для моделей при 20 TPPh.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование ИИ-текстов для обучения оправдано только в том случае, если целевой задачей является генерация именно ИИ-подобного контента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фильтрация — процесс удаления низкокачественных или синтетических данных из обучающего корпуса для предотвращения деградации модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"luchshe-povtoryat-chelovecheskie-dannye-ili-dobavlyat-ii-dannye\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#luchshe-povtoryat-chelovecheskie-dannye-ili-dobavlyat-ii-dannye\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Лучше повторять человеческие данные или добавлять ИИ-данные?&lt;/span&gt;&lt;/a&gt;Лучше повторять человеческие данные или добавлять ИИ-данные?&lt;/h4&gt;\n&lt;p&gt;Эксперименты с моделями 19,9 млн и 35,8 млн параметров показали, что повторение человеческих токенов эффективнее добавления ИИ-текстов. После одного цикла повторения потери на C4 были на 2,3% ниже, а после восьми циклов разрыв увеличился до 6,3–6,4%.&lt;/p&gt;\n&lt;h4 id=\"52-kogda-obuchenie-na-ii-tekstah-opravdano\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#52-kogda-obuchenie-na-ii-tekstah-opravdano\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5.2 Когда обучение на ИИ-текстах оправдано?&lt;/span&gt;&lt;/a&gt;5.2 Когда обучение на ИИ-текстах оправдано?&lt;/h4&gt;\n&lt;p&gt;Использование ИИ-контента полезно в условиях дефицита данных и при работе с целевыми ИИ-текстами. При прогнозировании человеческого текста ИИ-данные эффективны лишь при нехватке оригинальных материалов: оптимальная доля ИИ-текста в датасете C4 падает с 37% при бюджете 5 TPPh до 1,0% при 20 TPPh (Рис. 6). Аналогичные закономерности наблюдаются для наборов данных FW22 и Paloma. В случае же обучения на ИИ-текстах оптимальная доля остается выше 90% при любом бюджете, а ценность одного ИИ-токена превышает ценность 20 человеческих токенов (Таблица 7).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f6.jpg\" alt=\"Рисунок 6. Зависит ли польза ИИ-текста от оценочного набора.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6. Зависит ли польза ИИ-текста от оценочного набора.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6. Зависит ли польза ИИ-текста от оценочного набора. Слева: доля ИИ в обучающих токенах, которая минимизирует предсказанные нашим законом потери при фиксированном человеческом корпусе, по оценочным наборам: около нуля для человеческого текста (C4, FW22), выше 90% для ИИ-текста (Cosmo) и падение с 98% до 34% для смешанного FW26; падение около 10 TPP — это точка, где оптимум перемещается между двумя локальными минимумами предсказанных потерь. Справа: для 243 ИИ-добавлений, которые увеличивают потери на размеченном человеком тексте FW26, медианное изменение потерь, которое показывает валидационный набор по мере роста доли текста, размеченного ИИ. Знак меняется на 5,1% ИИ; при 22,3% в нашем крауле 2026 года медианный прогон выглядит на 1,9% лучше.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оптимальная доля ИИ-текста для обучения на человеческих данных снижается до 1% при увеличении вычислительного бюджета до 20 TPPh, тогда как для генерации ИИ-контента она превышает 90%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Обучение на ИИ-текстах меняет стиль генерации моделей. В агентных рабочих процессах модели всё чаще взаимодействуют друг с другом, поэтому понимание ИИ-стилистики становится критичным. Однако это меняет и собственную генерацию: для моделей 268M количество типичных ИИ-фраз на 1000 слов возрастает с 0,16 (без ИИ-текста) до 0,36 при r=1 и до 0,54 при r=4. В тесте Pangram доля историй, классифицированных как ИИ-сгенерированные, удваивается (37,2% против 18,6%, Таблица 13).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;r — это коэффициент соотношения ИИ-текста к человеческому тексту в обучающей выборке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы рекомендуют разделять ИИ и человеческие тексты при обучении и оценке. Модели, рассматривающие их как разные домены, показывают наибольшую точность. Разделение оправдано различиями в форматах: например, обучающие материалы составляют 18,5% ИИ-токенов, но лишь 6,2% человеческих. Поскольку ИИ-текст легче предсказуем, добавление его в выборку снижает потери на ИИ-сегменте FW26, но в 44% случаев повышает потери на человеческом сегменте. При текущей доле ИИ-текста в 22,3% (по данным краулинга 2026 года) смешанная валидация ошибочно интерпретирует 95,5% таких случаев как улучшения (Рис. 6). Рекомендуется отчитываться о потерях по человеческим и ИИ-текстам раздельно.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 6.&lt;/strong&gt; TPF выровненных бюджетов&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Бюджет&lt;/th&gt;\n&lt;th&gt;Значение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;26.93&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;28.41&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;29.74&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;30.91&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;477M не имеет бюджета 90; 973M не имеет бюджета 55, 75 или 90.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 11.&lt;/strong&gt; Парные ошибки таблицы 1, ограниченные отложенными прогонами с r &amp;lt; 1&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Параметр&lt;/th&gt;\n&lt;th&gt;Значение&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;2.93&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;3.18&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;3.82&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4&lt;/td&gt;\n&lt;td&gt;7.75&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Диапазон, достижимый веб-краулингом (наш краулинг 2026 года имеет r = 0.29; равное разделение ИИ и человеческого текста имеет r = 1).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 5.&lt;/strong&gt; Thetraininggrid.Eachcellisonehuman-onlycontrolplusthenumberofAI-additionrunsand,after theplussign,fresh-human-additionrunsonthesamehumancorpus.Sizesmarked†,belowtherule,arereserved: everylawisscoredonthemandnoneisfittedonthem.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT5.jpg\" alt=\"Таблица 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; ForecastAIshareofwebtokenseachDecember.TheintervalsareStudent-tpredictionintervalsthat includetheuncertaintyofthedrift.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT2.jpg\" alt=\"Таблица 2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Thesevenmodelsizes.Allusethenanochatarchitecture.Ninthescalinglawscountstheinput embedding;thelastcolumnsubtractsit.Reservedsizes(†)enternofit.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-tT3.jpg\" alt=\"Таблица 3\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"osnovnye-vyvody\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#osnovnye-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные выводы&lt;/span&gt;&lt;/a&gt;Основные выводы&lt;/h4&gt;\n&lt;p&gt;Доля сгенерированного ИИ текста в отфильтрованных веб-данных превысила 25% и продолжает расти. Анализ 800 предобученных моделей показал, что такой контент полезен лишь для моделей, испытывающих дефицит данных, тогда как для моделей, соответствующих закону масштабирования Chinchilla, он приводит к росту функции потерь. Предложенный нами закон описывает эффект насыщения пользы при логарифмическом росте вреда. Эта модель предсказывает параметры систем в 3,6 раза крупнее тех, на которых она обучалась, демонстрируя при этом меньшую ошибку на человеческих текстах, чем 11 существующих аналогов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обучение на нефильтрованном веб-контенте с учетом прогнозируемой доли ИИ-текста (31,1% к августу 2026 года) требует в 1,6 раза больше вычислительных мощностей, а к 2028 году этот показатель вырастет до 3,0 раз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya-i-perspektivy\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#ogranicheniya-i-perspektivy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и перспективы&lt;/span&gt;&lt;/a&gt;Ограничения и перспективы&lt;/h4&gt;\n&lt;p&gt;Наш закон был откалиброван на моделях до 268 млн параметров и протестирован на системах до 973 млн параметров. Существует риск, что более крупные модели, склонные к запоминанию обучающей выборки, будут активнее перенимать паттерны слабых LLM. В текущем исследовании мы оценивали потери на следующем токене (next-token loss) и использовали только англоязычные веб-тексты, размеченные Pangram. Будущие исследования должны сосредоточиться на фильтрации «дикого» ИИ-контента, поиске доменов, где ИИ-текст приносит пользу, и разработке методов обучения, позволяющих моделям понимать ИИ-ввод без деградации собственного стиля письма.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Закон масштабирования Chinchilla — это эмпирическая зависимость, определяющая оптимальное соотношение между размером модели (количеством параметров) и объемом обучающих данных для достижения минимальных потерь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модели, использованные в эксперименте, недостаточно велики для оценки реальной производительности в сложных задачах, поэтому результаты носят предварительный характер.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f4.jpg\" alt=\"Рисунок 4. Наш закон соответствует обученным моделям и предсказывает результаты для более крупных.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4. Наш закон соответствует обученным моделям и предсказывает результаты для более крупных.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 4. Наш закон соответствует обученным моделям и предсказывает результаты для более крупных. Слева: наблюдаемое изменение потерь на C4 с помощью нашего закона. В центре: отложенные прогоны на 477 млн и 973 млн параметров при 20 TPPh в сравнении с нашим законом и Chinchilla. Chinchilla предсказывает, что ИИ-текст продолжает снижать потери; прогоны и наш закон показывают рост. Справа: предсказанное изменение против наблюдаемого для каждого прогона ИИ.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f7.jpg\" alt=\"Рисунок 7. Статьи со знаниями, руководства и списки являются наиболее часто размечаемыми ИИ форматами почти в каждой тем\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7. Статьи со знаниями, руководства и списки являются наиболее часто размечаемыми ИИ форматами почти в каждой теме. Доля документов, размеченных Pangram 3.3.2 как ИИ, в каждой теме Web Organizer и формате наших документов из обучающей выборки.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f9.jpg\" alt=\"Рисунок 9. Классификатор качества DCLM сохраняет документы, размеченные ИИ, гораздо чаще, чем человеческие. Выживаемость\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9. Классификатор качества DCLM сохраняет документы, размеченные ИИ, гораздо чаще, чем человеческие. Выживаемость выборки из 10 000 документов Common Crawl 2026 года на каждом этапе конвейеров FineWeb (вверху) и DCLM (внизу), разделенная по метке Pangram 3.3.2.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f10.jpg\" alt=\"Рисунок 10. Доля ИИ в токенах интернета, измеренная за каждый месяц краула и спрогнозированная до декабря 2030 года с по\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10. Доля ИИ в токенах интернета, измеренная за каждый месяц краула и спрогнозированная до декабря 2030 года с помощью случайного блуждания с дрейфом, подобранным для периода с декабря 2022 по август 2026 года, с 80% и 95% интервалами прогнозирования.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f11.jpg\" alt=\"Рисунок 11. Члены пользы и вреда нашего закона. Два члена уравнения 2 и их чистый эффект на C4.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 11. Члены пользы и вреда нашего закона. Два члена уравнения 2 и их чистый эффект на C4.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f11-2.jpg\" alt=\"Рис. 11 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 11 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f13.jpg\" alt=\"Рисунок 13. Вред от ИИ-текста замедляется. Изменение потерь C4 в зависимости от r от 1 до 64: каждое удвоение ИИ-текста \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 13. Вред от ИИ-текста замедляется. Изменение потерь C4 в зависимости от r от 1 до 64: каждое удвоение ИИ-текста добавляет такое же увеличение потерь. Пунктир: ускоряющийся степенной закон штрафа в стиле Лавлейс и др.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f14.jpg\" alt=\"Рисунок 14. Эффективные человеческие токены заменяют прогоны ИИ в члене данных Chinchilla. При подсчете только человечес\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 14. Эффективные человеческие токены заменяют прогоны ИИ в члене данных Chinchilla. При подсчете только человеческих токенов прогоны ИИ отклоняются от данных Chinchilla, полученных только на человеческих текстах; при подсчете как эффективных токенов они совпадают с ними.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f15.jpg\" alt=\"Рисунок 15. Наш закон для каждого подобранного размера и бюджета. Изменение потерь C4 в зависимости от r для каждой подо\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 15. Наш закон для каждого подобранного размера и бюджета. Изменение потерь C4 в зависимости от r для каждой подобранной контрольной группы с кривыми нашего закона для добавленного ИИ-текста и добавленного свежего человеческого текста.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f16.jpg\" alt=\"Рисунок 16. Значение нашего закона для ИИ-токена в сравнении с измеренными значениями. Значение добавленного ИИ-токена в\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 16. Значение нашего закона для ИИ-токена в сравнении с измеренными значениями. Значение добавленного ИИ-токена в человеческих токенах согласно нашему закону и измеренное на основе парных добавлений ИИ и свежего человеческого текста к одному и тому же контрольному значению при 5 и 20 TPPh.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f19.jpg\" alt=\"Рисунок 19. Меньший объем ИИ-текста всегда более вычислительно эффективен для C4, а больший объем ИИ-текста — для Cosmop\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 19. Меньший объем ИИ-текста всегда более вычислительно эффективен для C4, а больший объем ИИ-текста — для Cosmopedia. Вычислительно эквивалентный прирост по сравнению с нашим набором данных 2026 года (22,3% ИИ) для моделей 268M при 20 TPP имеет долю ИИ.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f20.jpg\" alt=\"Рисунок 20. Повторение человеческого текста превосходит добавление ИИ-текста на оценочных наборах человеческого текста.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 20. Повторение человеческого текста превосходит добавление ИИ-текста на оценочных наборах человеческого текста.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 20. Повторение человеческого текста превосходит добавление ИИ-текста на оценочных наборах человеческого текста. Изменение потерь на каждом оценочном наборе при повторении человеческого корпуса или добавлении такого же количества новых ИИ-токенов по сравнению с токенами, добавленными на каждый человеческий токен. На наборах человеческого текста (C4, FW22, FW26-H) повторение снижает потери, тогда как ИИ-текст их повышает; на наборах ИИ-текста (FW26-AI, Cosmo) ИИ-текст снижает потери сильнее.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f21.jpg\" alt=\"Рисунок 21. На сгенерированном ИИ тексте добавленные ИИ-токены снижают потери при любом бюджете. Аналог рисунка 3 для Co\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 21. На сгенерированном ИИ тексте добавленные ИИ-токены снижают потери при любом бюджете. Аналог рисунка 3 для Cosmopedia: изменение потерь Cosmo при добавлении ИИ-токенов или такого же количества новых человеческих токенов при 5, 20 и 40 TPP для каждого подобранного размера. ИИ-текст снижает потери при любом бюджете и размере до 25%; свежий человеческий текст снижает их гораздо меньше.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f22.jpg\" alt=\"Рисунок 22. Смешанные проверочные данные скрывают вред для человеческого текста.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 22. Смешанные проверочные данные скрывают вред для человеческого текста.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 22. Смешанные проверочные данные скрывают вред для человеческого текста. Слева: потери каждой модели на ИИ-размеченной части по сравнению с человеческой размеченной частью FW26. Модели только на человеческих данных имеют на 12–27% более низкие потери на ИИ-тексте, а модели, обученные на ИИ-тексте, опускаются еще ниже линии равных потерь. Справа: из 243 добавлений ИИ, которые повышают потери на человеческом размеченном тексте, доля, которую проверочный набор показывает как улучшения, по мере роста доли ИИ-размеченного текста для подобранных размеров и отложенных размеров: 49,4% при 5% ИИ и 95,5% при 22,3% нашего набора 2026 года.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f23.jpg\" alt=\"Рисунок 23. Добавленные ИИ-токены повышают CORE примерно так же, как и свежие человеческие токены. Изменение CORE по сра\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 23. Добавленные ИИ-токены повышают CORE примерно так же, как и свежие человеческие токены. Изменение CORE по сравнению с контрольной группой каждой модели (только человеческие данные) при добавлении ИИ-токенов или такого же количества свежих человеческих токенов. MMLU (Hendrycks et al., 2021) не показан, так как он остается на уровне случайной точности для каждой модели, как и ожидалось при данных размерах.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-f24.jpg\" alt=\"Рисунок 24. Модели, обученные на текстах, созданных ИИ, используют больше типичных для ИИ фраз. Частота использования 26\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 24. Модели, обученные на текстах, созданных ИИ, используют больше типичных для ИИ фраз. Частота использования 26 типичных для ИИ фраз на 1000 слов в генерациях моделей, обученных с добавлением текстов ИИ в заданном соотношении r.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"tablicy\"&gt;&lt;a href=\"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html#tablicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таблицы&lt;/span&gt;&lt;/a&gt;Таблицы&lt;/h4&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 4.&lt;/strong&gt; Everymodelinthepaper.The800modelsofthescaling-lawcohortbysizeandarm:human-only controls,AIadditionsandfresh-humanadditions,eachadditiontrainedonexactlyitscontrol’shumandocuments. Sizes marked † are held out from every fit.TPPh:range over the controls.In Table 5:runs in the matched-budget grid,controlsincluded;theothersbelongtocontrolgroupsatper-sizebudgetsfromearlierrungenerationsand entereveryfitandscoreinthesameway.Otherseeds:runswithaseedotherthan1337.Belowtherule,the44 filteringandrepetitionmodels,whichenternofit.&lt;/p&gt;\n&lt;p&gt;&lt;
