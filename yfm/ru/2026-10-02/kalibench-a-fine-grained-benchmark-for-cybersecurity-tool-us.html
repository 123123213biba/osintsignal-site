        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"216\" cy=\"176\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"644\" cy=\"168\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему нейросети ошибаются в&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;командах Kali Linux и как&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;это исправить&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f1.jpg\" alt=\"Рисунок 1: Почему KaliBench важен? KaliBench обеспечивает детальную, проверяемую оценку и обучение с подкреплением без в\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Почему KaliBench важен? KaliBench обеспечивает детальную, проверяемую оценку и обучение с подкреплением без выполнения кода для преобразования намерений аналитика в исполняемые команды Kali.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Большинство нейросетей плохо справляются с генерацией команд для Kali Linux, допуская критические ошибки в аргументах и флагах. Исследователи представили KaliBench — набор из 8504 пар запросов и команд, охватывающий 1642 инструмента. Этот инструмент позволяет обучать модели с помощью верифицируемых наград, значительно повышая их точность в реальных задачах.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Датасет содержит 8504 пары запрос-команда для 1642 инструментов Kali Linux.&lt;/li&gt;\n&lt;li&gt;Точность моделей без подсказок не превышает 42% из-за сложности синтаксиса CLI.&lt;/li&gt;\n&lt;li&gt;Обучение с верифицируемыми наградами повышает эффективность 8B-моделей до уровня 685B.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Современные LLM часто ошибаются при переводе намерений аналитика в CLI-команды, так как работа с инструментами кибербезопасности требует строгой точности. В отличие от стандартных API, где структура данных задана схемой, CLI-инструменты требуют от модели самостоятельного выбора утилиты и правильной расстановки флагов. KaliBench решает эту проблему, предлагая датасет, структурированный по 23 категориям возможностей и 5 фазам безопасности.&lt;/p&gt;\n&lt;p&gt;Методология включает многоступенчатую проверку: от валидации нейросетью до исполнения в изолированной среде (песочнице) и ручной корректировки. Исследование показало, что даже мощные модели редко превышают 42% точности в «неограниченном» режиме. Однако использование обучения с подкреплением на основе верифицируемых наград (RLVR) позволяет компактным 8B-моделям достигать результатов, сопоставимых с гигантскими системами на 685B параметров.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бенчмарк фокусируется на генерации команд в изоляции и не оценивает навыки планирования в многошаговых сценариях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Современные большие языковые модели (LLM) всё чаще внедряются в процессы кибербезопасности для автоматизации перевода намерений аналитика в конкретные команды инструментов. Однако текущие методы оценки сосредоточены либо на проверке теоретических знаний, либо на выполнении агентных задач высокого уровня, упуская способность моделей генерировать корректные команды для реальных инструментов командной строки (CLI). Это критический пробел, так как в кибербезопасности даже незначительные синтаксические ошибки, неверные флаги или неправильный порядок аргументов делают команду неработоспособной.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KaliBench — это новый бенчмарк из 8 504 пар «запрос-команда» для 1 642 инструментов, который выявил, что даже лучшие модели с открытыми весами показывают точность ниже 42% в задачах генерации CLI-команд.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для решения этой проблемы представлен KaliBench — детальный набор данных для перевода естественного языка в команды Kali Linux. Датасет охватывает 23 функциональных направления и 5 этапов обеспечения безопасности. Методология создания KaliBench включает конвейер на основе документации с детерминированной канонизацией и оценкой с учетом псевдонимов (алиасов), что обеспечивает воспроизводимость результатов. Проверка качества включает многоступенчатый процесс: валидацию с помощью LLM, исполнение в изолированной среде (песочнице) и ручную корректировку.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Детерминированная канонизация — это приведение различных вариантов написания одной и той же команды к единому стандарту, что позволяет объективно оценивать точность модели, исключая случайные расхождения в синтаксисе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тестирование 24 конфигураций моделей общего назначения и специализированных моделей показало, что в условиях отсутствия подсказок ни одна модель с открытыми весами не преодолевает порог в 42% точности выполнения команд. Тем не менее, авторы продемонстрировали, что использование KaliBench для дообучения (SFT) и обучения с подкреплением (RL) позволяет модели с 8 млрд параметров достичь результатов, сопоставимых с гигантскими моделями типа MoE (685 млрд параметров).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты ограничены средой Kali Linux; эффективность моделей вне специализированных инструментов безопасности может отличаться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"vnedrenie-llm-v-kiberbezopasnost-i-problema-cli\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#vnedrenie-llm-v-kiberbezopasnost-i-problema-cli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внедрение LLM в кибербезопасность и проблема CLI&lt;/span&gt;&lt;/a&gt;Внедрение LLM в кибербезопасность и проблема CLI&lt;/h4&gt;\n&lt;p&gt;Большие языковые модели (LLM) всё чаще интегрируются в рабочие процессы кибербезопасности, выступая как в роли интерактивных помощников, так и в качестве автономных агентов. Существующие бенчмарки для оценки таких моделей в основном проверяют теоретические знания или способность решать задачи в стиле CTF (Capture The Flag). Однако они не учитывают критически важный аспект: способность модели генерировать корректные команды для реальных инструментов командной строки (CLI). В таких системах, как Kali Linux, насчитывается более 2000 инструментов, и даже незначительная ошибка в синтаксисе, порядке аргументов или флагах делает команду неработоспособной.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие тесты не оценивают точность генерации CLI-команд, что является критическим пробелом, так как современные инструменты требуют безошибочного синтаксиса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kalibench-metodologiya-i-struktura\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kalibench-metodologiya-i-struktura\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KaliBench: методология и структура&lt;/span&gt;&lt;/a&gt;KaliBench: методология и структура&lt;/h4&gt;\n&lt;p&gt;Для решения этой проблемы авторы разработали KaliBench — специализированный бенчмарк для оценки перевода естественного языка в команды CLI (NL-to-CLI). В отличие от стандартных тестов, где инструменты описаны через JSON-схемы, KaliBench работает в «бесчемовой» среде, что отражает реальные условия эксплуатации, где невозможно передать описание сотен инструментов в контекстное окно модели. Как показано на Рис. 1, KaliBench декомпозирует задачу на выбор инструмента и построение аргументов. Датасет включает 8504 пары «запрос-команда», распределенные по 23 функциональным категориям и 5 этапам кибербезопасности (после дедупликации: 5000 для оценки и 3504 для обучения).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f1.jpg\" alt=\"Рисунок 1: Почему KaliBench важен? KaliBench обеспечивает детальную, проверяемую оценку и обучение с подкреплением без в\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Почему KaliBench важен? KaliBench обеспечивает детальную, проверяемую оценку и обучение с подкреплением без выполнения кода для преобразования намерений аналитика в исполняемые команды Kali.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Бесчемовая» (schema-free) среда означает, что модель должна самостоятельно «знать» синтаксис инструментов, не получая подсказок в виде заранее заданных структур данных или API-спецификаций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"verifikaciya-i-rezultaty\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#verifikaciya-i-rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Верификация и результаты&lt;/span&gt;&lt;/a&gt;Верификация и результаты&lt;/h4&gt;\n&lt;p&gt;Качество данных обеспечивается многоступенчатым процессом: LLM-валидация, выполнение в «песочнице» (sandbox) и ручная проверка человеком. Авторы тестируют 24 конфигурации моделей в трех режимах: без ограничений, с ограничениями и с подсказками. Основным «узким местом» оказалась настройка аргументов. Применение дообучения (SFT) и обучения с подкреплением на основе верифицируемых наград (RLVR) позволило улучшить показатели 8B-модели на 7,5 процентных пункта. Важно, что предложенная структура наград позволяет проводить обучение без необходимости реального выполнения команд в системе (runtime-free).&lt;/p&gt;\n&lt;h4 id=\"obzor-smezhnyh-issledovanij\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#obzor-smezhnyh-issledovanij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор смежных исследований&lt;/span&gt;&lt;/a&gt;Обзор смежных исследований&lt;/h4&gt;\n&lt;p&gt;Оценка LLM в кибербезопасности прошла путь от общих тестов, таких как MMLU, до специализированных фреймворков. Хотя HELM объединил множество метрик, он не учитывает специфику кибербезопасности. Существующие бенчмарки, включая SecEval, CyberMetric, CyberBench, SECURE, CS-Eval, SecBench и CTI-Bench, фокусируются на проверке теоретических знаний через тесты с выбором ответа или классификацию в таких областях, как криптография и сетевая безопасность. Однако они оценивают лишь статичное запоминание, а не практические навыки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие бенчмарки ограничены проверкой теоретических знаний, тогда как новые подходы, такие как KaliBench, фокусируются на генерации точных команд для реальных инструментов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Более современные работы, например CyBench, NYU-CTF Bench и DefenderBench, переходят к агентному тестированию в сценариях CTF или корпоративных средах. Тем не менее, в таких комплексных задачах сложно выявить причину ошибки, так как результат зависит от планирования, взаимодействия со средой и интерпретации данных. KaliBench решает эту проблему, изолированно оценивая генерацию команд, выбор инструментов и корректность аргументов.&lt;/p&gt;\n&lt;h4 id=\"benchmarki-vyzova-funkcij\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#benchmarki-vyzova-funkcij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Бенчмарки вызова функций&lt;/span&gt;&lt;/a&gt;Бенчмарки вызова функций&lt;/h4&gt;\n&lt;p&gt;Исследования возможностей LLM по вызову внешних инструментов (BFCL, ToolSandbox, StableToolBench, HammerBench) обычно опираются на четко заданные схемы API и детерминированную валидацию. Такие подходы предполагают наличие формальных описаний функций, что не применимо к работе с интерфейсом командной строки (CLI), где параметры не имеют жестких схем.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CLI (Command Line Interface) — это способ взаимодействия с программой через текстовые команды в терминале, где структура аргументов часто зависит от контекста, а не от строгой схемы API.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На текущий момент отсутствуют бенчмарки, оценивающие перевод естественного языка в команды CLI для реальных инструментов кибербезопасности в условиях отсутствия схем. KaliBench заполняет этот пробел, обеспечивая детальную оценку точности генерации исполняемых команд с учетом алиасов и специфики инструментария.&lt;/p&gt;\n&lt;h4 id=\"kalibench\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#kalibench\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;KaliBench&lt;/span&gt;&lt;/a&gt;KaliBench&lt;/h4&gt;\n&lt;p&gt;KaliBench представляет собой специализированный бенчмарк и набор данных, выступающий связующим звеном между запросами на естественном языке по кибербезопасности и исполняемыми командами Kali Linux. Ресурс охватывает 1642 инструмента и содержит 8504 пары «запрос–команда». Процесс создания KaliBench включает четыре этапа: извлечение метаданных из документации Kali Linux для генерации данных через LLM; многоступенчатую фильтрацию (LLM-верификация, запуск в песочнице, экспертная оценка); дедупликацию и разделение на обучающую и тестовую выборки; а также дообучение моделей с использованием методов эффективной настройки параметров и обучения с подкреплением.&lt;/p&gt;\n&lt;p&gt;На этапе генерации данных авторы использовали официальную документацию из репозитория Kali Linux, включающую 2372 инструмента с описанием опций и псевдонимов. С помощью модели Qwen3-Max для каждого инструмента было создано от 10 до 13 пар «запрос–команда», что в сумме дало 27,7 тыс. примеров. Эти данные включают структурированные аннотации (имя инструмента, флаги, аргументы), что позволяет детально анализировать точность выбора инструментов и синтаксическую корректность команд.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;KaliBench содержит 8504 верифицированные пары «запрос–команда» для 1642 инструментов, прошедшие многоуровневую проверку на точность и исполняемость.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для борьбы с галлюцинациями LLM (более 50% первоначальных команд содержали ошибки) была внедрена система верификации. На первом этапе LLM проверяла соответствие команд документации, что привело к отсеву 53,8% примеров. После итеративной догенерации и повторной проверки объем данных составил 14,5 тыс. пар, что на 47,65% меньше исходного массива.&lt;/p&gt;\n&lt;h4 id=\"finalnaya-verifikaciya\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#finalnaya-verifikaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Финальная верификация&lt;/span&gt;&lt;/a&gt;Финальная верификация&lt;/h4&gt;\n&lt;p&gt;Для подтверждения работоспособности команд авторы использовали изолированную среду Docker с образом Kali-linux-everything. Команды тестировались на предмет корректности вывода (stdout, stderr) и кодов завершения. Поскольку параметры (пути, адреса) в синтетических запросах могут отсутствовать в песочнице, применялась фильтрация на основе правил. Этот этап позволил отсеять еще 11,95% команд, прошедших проверку LLM.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Песочница (sandbox) — это изолированная виртуальная среда, где код выполняется без риска для основной системы, что позволяет проверить реальную работоспособность команд.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenka-s-uchastiem-cheloveka\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#ocenka-s-uchastiem-cheloveka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка с участием человека&lt;/span&gt;&lt;/a&gt;Оценка с участием человека&lt;/h4&gt;\n&lt;p&gt;Финальный этап включал экспертную проверку с участием человека для анализа ошибок моделей. ИИ-агент предварительно сопоставлял семантику запроса и команды, после чего эксперты выявляли неоднозначности и ошибки разметки. Это привело к исключению еще 4,9% данных из-за некорректных флагов, пропуска обязательных аргументов или семантического несоответствия между запросом и выбранными параметрами.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 1.&lt;/strong&gt; Open-weight model query-to-command performance across three modes.Columns report Unrestricted (U), Restricted (R), and Hinted (H).†indicates thinking-enabled models, and⋆ denotes cybersecurity-tuned models.Bold/underline mark the best and second-best within each size group.Models are sorted by Averaged Total Score.MoE parameters use Total/Active (e.g., 685/37B). Table 1 summarizes per-model performance under three modes:Unrestricted (U), Restricted (R), and Hinted (H). We report Exact Correct (EC), Tool Accuracy (TA), Optional-Argument F1 (Opt-F1), Positional-Argument F1 (Pos-F1), Total Score (TS), and Average TS (Avg.).We analyze key patterns with respect to tool information, model type and scale, and post-training on KaliBench.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-tT1.jpg\" alt=\"Таблица 1\" /&gt;&lt;/p&gt;\n&lt;h4 id=\"deduplikaciya-i-razdelenie-na-obuchayushuyu-i-testovuyu-vyborki\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#deduplikaciya-i-razdelenie-na-obuchayushuyu-i-testovuyu-vyborki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дедупликация и разделение на обучающую и тестовую выборки&lt;/span&gt;&lt;/a&gt;Дедупликация и разделение на обучающую и тестовую выборки&lt;/h4&gt;\n&lt;p&gt;Для создания компактного, но семантически разнообразного набора данных мы применили фреймворк SemHash. Каждая запись представляла собой триаду [запрос, имя инструмента, эталонная команда]. Векторные представления записей группировались методом поиска ближайших соседей, при этом записи объединялись, если косинусное сходство превышало 0,90. Из каждого кластера SemHash отбирал репрезентативные примеры. В итоге очищенный датасет составил 8,5 тыс. верифицированных пар (30,7% от исходных 27,7 тыс.), что стало качественным бенчмарком для оценки перевода NL-to-CLI. Из этого массива мы сформировали тестовую выборку из 5000 примеров (охватывающих все 1642 инструмента) и обучающую выборку из 3504 примеров (962 инструмента).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Итоговый датасет содержит 8,5 тыс. уникальных пар, обеспечивая полное покрытие инструментов в тестовой выборке при сохранении части данных для обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;Протокол оценки. Модели генерируют команды Kali Linux в трех режимах: (1) Unrestricted (только запрос), (2) Restricted (запрос + список из 20 кандидатов-инструментов), (3) Hinted (запрос + список + официальная документация). Разбор вывода осуществляется библиотекой Python shlex, что позволяет эмулировать синтаксис оболочки без реального запуска команд. Оценка проводится покомпонентно: проверяется имя инструмента, опциональные аргументы (флаги с учетом алиасов) и позиционные аргументы (фиксированный порядок). См. Рис. 3.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f3.jpg\" alt=\"Рисунок 3: Структура и репрезентативная выборка KaliBench.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Структура и репрезентативная выборка KaliBench.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Структура и репрезентативная выборка KaliBench. KaliBench — это структурированный бенчмарк инструментов Kali Linux, организованный в соответствии с жизненным циклом атак безопасности. Он включает 5 фаз безопасности и функциональные измерения. Выборка набора данных включает запросы на естественном языке и декомпозированные эталонные команды.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Метрики оценки включают: точность выбора инструмента, F1-меру для опциональных и позиционных аргументов, общий балл и показатель Exact Correct (совпадение всех компонентов).&lt;/p&gt;\n&lt;h4 id=\"taksonomiya-vozmozhnostej-i-annotirovanie-faz-bezopasnosti\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#taksonomiya-vozmozhnostej-i-annotirovanie-faz-bezopasnosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Таксономия возможностей и аннотирование фаз безопасности&lt;/span&gt;&lt;/a&gt;Таксономия возможностей и аннотирование фаз безопасности&lt;/h4&gt;\n&lt;p&gt;Для глубокого анализа мы используем метаданные из таксономии kali-tools, распределяя 23 функциональных измерения по пяти фазам кибербезопасности: разведка и начальный доступ, анализ уязвимостей, эксплуатация и доставка полезной нагрузки, пост-эксплуатация и движение внутри сети, а также защитный анализ и отчетность. Каждое измерение закреплено за основной фазой, что позволяет агрегировать метрики производительности моделей в различных контекстах безопасности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фазы безопасности (Cyber Kill Chain) — это стандартизированная модель этапов кибератаки, помогающая классифицировать инструменты по их назначению в реальных операциях.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;ol start=\"4\" style=\"--hier-list-start:3\"&gt;\n&lt;li&gt;Протокол обучения. Мы используем дообучение (SFT) и обучение с подкреплением (RLVR). Обучающая выборка включает 3504 примера, умноженных на 3 режима промптов, что дает 10 512 образцов.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"eksperimenty\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#eksperimenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эксперименты&lt;/span&gt;&lt;/a&gt;Эксперименты&lt;/h4&gt;\n&lt;p&gt;Настройка экспериментов. Оценка моделей с открытыми весами проводилась на кластере NVIDIA A100 с использованием движка vLLM. Модели объемом от 72B параметров тестировались через API OpenRouter. Всего протестировано 14 моделей общего назначения (включая Llama 3.1, Qwen-3, Mistral-3.2, Gemma-3, GPT-OSS, LLaMA-3.3, DeepSeek-V3.2, GLM-5.2) и 7 специализированных моделей по кибербезопасности (семейства Foundation-Sec, Llama-Primus, RedSage). Для обучения использовался метод LoRA с библиотекой Unsloth на базе модели RedSage-Ins (8B). Были созданы три версии RedSage-K: SFT, RLVR с оптимизацией GRPO и комбинированный вариант SFT+GRPO. Обучение велось на одном GPU H200 (141GB VRAM) с размером батча 32 в течение двух эпох.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LoRA (Low-Rank Adaptation) — метод эффективной настройки нейросетей, при котором обучается лишь малая часть весов, что экономит вычислительные ресурсы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"effektivnost-modelej-v-treh-rezhimah\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#effektivnost-modelej-v-treh-rezhimah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эффективность моделей в трех режимах&lt;/span&gt;&lt;/a&gt;Эффективность моделей в трех режимах&lt;/h4&gt;\n&lt;p&gt;Влияние режимов оценки. Переход от неконтролируемого режима (U) к режиму с ограничением выбора инструментов (R) значительно повышает точность выбора (TA) с 72,0% до 95,2%. Однако это слабо влияет на качество аргументов (Opt-F1, Pos-F1, EC), что указывает на проблему генерации команд даже при верном выборе инструмента. Режим с подсказками (H) дает максимальный прирост: Opt-F1 вырос с 45,1% до 87,8%, а EC — с 22,3% до 73,1%. Это доказывает, что модели критически не хватает знаний о синтаксисе инструментов без документации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Режим с подсказками (H) является решающим для генерации корректных команд, так как он компенсирует нехватку доменных знаний у моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Влияние типа и масштаба модели. Специализированные модели (⋆) показывают преимущество в условиях ограниченных данных (режимы U и R), тогда как модели общего назначения лучше справляются в режиме H, используя явные подсказки. Модели с поддержкой рассуждений (†) демонстрируют лучшие показатели в декомпозиции задач. Примечательно, что Qwen3† (8B) превосходит более крупные модели (например, Gemma-3 27B) по средним метрикам, что доказывает: качество генерации CLI-команд зависит не только от количества параметров, но и от навыков следования инструкциям и логического вывода.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Масштабирование параметров не гарантирует линейного роста качества: архитектурные особенности и методы обучения (например, рассуждения) зачастую важнее размера модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Проприетарные модели. Учитывая требования безопасности, основной акцент сделан на локальных моделях. Однако для проверки сложности KaliBench были протестированы GPT-5.6-Sol, Claude Opus 5 и OpenAI Codex на 5000 запросах в режиме U.&lt;/p&gt;\n&lt;h4 id=\"vse-5-tys\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#vse-5-tys\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(все 5 тыс.)&lt;/span&gt;&lt;/a&gt;(все 5 тыс.)&lt;/h4&gt;\n&lt;p&gt;В Таблице 2 представлены результаты тестирования моделей на полном наборе из 5000 запросов. Лидером по показателю Exact Correct (EC) стала GPT-5.6-Sol с результатом 61,68%, за ней следуют Codex (51,68%) и Claude Opus 5 (44,02%). Все три модели превосходят GLM-5.2 (41,32%), которая является наиболее эффективной среди открытых моделей. Важным фактором является охват запросов: GPT-5.6-Sol ответила на 4988 запросов, Codex — на 4633, а Claude Opus 5 — лишь на 3675. Разница в охвате указывает на влияние встроенных протоколов безопасности, ограничивающих работу с кибербезопасностью. Например, Claude Opus 5 показывает высокую точность 59,89% на обработанных запросах, но из-за низкого охвата (73,50%) её итоговый показатель EC снижается до 44,02%. Максимальная точность 61,68% свидетельствует о том, что бенчмарк KaliBench остается сложным для современных систем.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 2.&lt;/strong&gt; Proprietary models and scaffolded inference in Unrestricted mode.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-tT2.jpg\" alt=\"Таблица 2\" /&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GPT-5.6-Sol демонстрирует наивысшую точность 61,68% при охвате 99,76% запросов, превосходя конкурентов за счет более мягких ограничений безопасности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Таблица 5.&lt;/strong&gt; Дельты производительности в различных режимах выполнения&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Модель&lt;/th&gt;\n&lt;th&gt;Размер&lt;/th&gt;\n&lt;th&gt;Tool score ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;th&gt;Optional F1 ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;th&gt;Positional F1 ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;th&gt;Total score ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;th&gt;Exact ∆(pp) ∆1 ∆2 ∆3&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Compact Models (≤8B)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Foundation-Sec-Ins⋆&lt;/td&gt;\n&lt;td&gt;8B&lt;/td&gt;\n&lt;td&gt;26.00 -5.70 20.30&lt;/td&gt;\n&lt;td&gt;3.90 38.20 42.10&lt;/td&gt;\n&lt;td&gt;7.00 21.30 28.30&lt;/td&gt;\n&lt;td&gt;12.30 17.90 30.20&lt;/td&gt;\n&lt;td&gt;4.40 37.10 41.50&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Llama3.1-Ins&lt;/td&gt;\n&lt;td&gt;8B&lt;/td&gt;\n&lt;td&g t;\n&lt;td&gt;4.80 48.90 53.70&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Qwen2.5-Ins&lt;/td&gt;\n&lt;td&gt;72B&lt;/td&gt;\n&lt;td&gt;21.40 -0.60 20.80&lt;/td&gt;\n&lt;td&gt;3.40 40.40 43.80&lt;/td&gt;\n&lt;td&gt;5.20 21.10 26.30&lt;/td&gt;\n&lt;td&gt;10.00 20.20 30.20&lt;/td&gt;\n&lt;td&gt;4.80 50.40 55.20&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;DeepSeek-V3.2†&lt;/td&gt;\n&lt;td&gt;685B&lt;/td&gt;\n&lt;td&gt;22.50 -1.20 21.30&lt;/td&gt;\n&lt;td&gt;5.00 31.50 36.50&lt;/td&gt;\n&lt;td&gt;6.60 18.70 25.30&lt;/td&gt;\n&lt;td&gt;11.40 16.30 27.70&lt;/td&gt;\n&lt;td&gt;7.20 44.30 51.50&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GLM-5.2†&lt;/td&gt;\n&lt;td&gt;753B&lt;/td&gt;\n&lt;td&gt;7.90 0.70 8.60&lt;/td&gt;\n&lt;td&gt;-3.40 16.50 13.10&lt;/td&gt;\n&lt;td&gt;27.50 11.80 39.30&lt;/td&gt;\n&lt;td&gt;10.70 9.60 20.30&lt;/td&gt;\n&lt;td&gt;10.70 22.80 33.50&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Metric Average&lt;/td&gt;\n&lt;td&gt;–&lt;/td&gt;\n&lt;td&gt;23.19 -0.58 22.62&lt;/td&gt;\n&lt;td&gt;3.62 39.13 42.75&lt;/td&gt;\n&lt;td&gt;7.13 21.89 29.01&lt;/td&gt;\n&lt;td&gt;11.31 20.14 31.45&lt;/td&gt;\n&lt;td&gt;5.93 44.80 50.73&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;em&gt;Мы сообщаем о различиях между тремя режимами выполнения: Unrestricted (U), Restricted (R) и Hinted (H). ∆1 обозначает (R−U), ∆2 обозначает (H−R), а ∆3 обозначает (H−U), все значения измерены в процентных пунктах (pp). † указывает на модели с поддержкой мышления, а ⋆ обозначает модели, настроенные на кибербезопасность. Жирный шрифт/подчеркивание отмечают наибольшие и вторые по величине дельты в каждой группе размеров. Порядок моделей соответствует Таблице 1.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"vliyanie-post-obucheniya-na-kalibench\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#vliyanie-post-obucheniya-na-kalibench\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние пост-обучения на KaliBench&lt;/span&gt;&lt;/a&gt;Влияние пост-обучения на KaliBench&lt;/h4&gt;\n&lt;p&gt;Пост-обучение на тренировочном наборе KaliBench значительно повышает эффективность компактных моделей. Варианты RedSage-K демонстрируют средние баллы 76,9, 77,4 и 79,2. Модель RedSage-K (SFT+GRPO) с 8B параметрами занимает третье место среди открытых моделей, уступая DeepSeek-V3.2 всего 1,0 балл. Метод SFT (контролируемое дообучение) лучше справляется с сопоставлением инструментов и контекстными подсказками, тогда как GRPO (обучение с подкреплением) эффективнее в задачах с использованием аргументов (Pos-F1 и TS). Комбинированный подход (SFT+GRPO) обеспечивает лучшие показатели EC и TS, хотя и наблюдается небольшое снижение точности в режиме H (Hard) по сравнению с базовой моделью RedSage-Ins. Использование SFT в качестве инициализации помогает минимизировать ошибки при построении аргументов и регрессии на ранее решенных задачах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — обучение на размеченных примерах, GRPO (Group Relative Policy Optimization) — метод обучения с подкреплением, оптимизирующий стратегию модели на основе групповых наград.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"detalnyj-analiz-proizvoditelnosti-i-ustojchivosti\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#detalnyj-analiz-proizvoditelnosti-i-ustojchivosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детальный анализ производительности и устойчивости&lt;/span&gt;&lt;/a&gt;Детальный анализ производительности и устойчивости&lt;/h4&gt;\n&lt;p&gt;Анализ по измерениям и инструментам. Рис. 5(a) демонстрирует производительность моделей по 23 функциональным измерениям, пяти этапам безопасности и трем режимам оценки. Общая сложность задач остается стабильной во всех режимах: такие области, как «gpu» и «crypto-stego», показывают высокие результаты, тогда как «802-11» и «wireless» остаются наиболее трудными. В режиме H (Hinted) наблюдается снижение вариативности результатов между моделями, что указывает на то, что документация помогает в построении аргументов, но не полностью нивелирует сложность интерфейсов. На уровне этапов «Разведка» и «Анализ уязвимостей» показывают стабильность, в то время как «Пост-эксплуатация» и «Защитный анализ» демонстрируют больший разброс из-за неоднородности структур CLI. Инструменты с простыми шаблонами (например, truecrypt2john) обрабатываются надежно, тогда как инструменты с редкими флагами (например, nikto) вызывают ошибки синтаксиса.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f5.jpg\" alt=\"Рисунок 5: Производительность по измерениям безопасности и режимам.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Производительность по измерениям безопасности и режимам.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 5: Производительность по измерениям безопасности и режимам. (a) Производительность по 23 измерениям и 5 фазам для каждого режима. Ящичковые диаграммы показывают распределения (Q1–Q3), с «усами» для мин/макс. (b,c) Общий балл и доля точных совпадений (%) по режимам; пунктирные линии указывают на разрывы между режимами.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Предоставление документации к инструментам (режим H) значительно снижает разброс результатов между моделями и повышает общую точность, хотя сложность синтаксиса CLI остается барьером.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Тренды производительности по режимам. Рис. 5(b,c) показывает распределение общего балла (Total Score) и точности (Exact Correct). Оба показателя растут при переходе от U (Unrestricted) к R (Restricted) и H. Диапазон общего балла сужается с 21,8 до 13,7 процентных пунктов, что сближает модели по качеству ответов. Однако разрыв в показателе «Exact Correct» остается значительным (до 28,3 п.п. в режиме H), что свидетельствует о сохраняющихся трудностях в написании абсолютно точных команд. Основные ошибки включают: путаницу между короткими и длинными формами флагов, галлюцинации несуществующих опций, использование неверных позиционных аргументов и ошибки в единственном/множественном числе имен флагов.&lt;/p&gt;\n&lt;h4 id=\"ustojchivost-k-variaciyam-zaprosov\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#ustojchivost-k-variaciyam-zaprosov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устойчивость к вариациям запросов&lt;/span&gt;&lt;/a&gt;Устойчивость к вариациям запросов&lt;/h4&gt;\n&lt;p&gt;Мы оценили чувствительность восьми конфигураций моделей к изменению формулировок запросов: «Paraphrase» (синонимы), «Informal» (разговорный стиль) и «Messy» (шум, ошибки, пропуски слов). Согласно Таблице 3, парафразы почти не влияют на результат, а неформальный стиль вызывает незначительное снижение. «Messy»-запросы приводят к наибольшему падению производительности, особенно в режиме U. Режим H демонстрирует наименьшее снижение (1,07 п.п.), подтверждая, что доступ к документации помогает моделям лучше справляться с «зашумленными» входными данными.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Таблица 3.&lt;/strong&gt; Среднее изменение общего балла в процентных пунктах относительно исходных запросов&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Конфигурация модели&lt;/th&gt;\n&lt;th&gt;Среднее изменение (%)&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Unrestricted mode&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 1&lt;/td&gt;\n&lt;td&gt;4.23&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 2&lt;/td&gt;\n&lt;td&gt;4.15&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 3&lt;/td&gt;\n&lt;td&gt;3.14&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 4&lt;/td&gt;\n&lt;td&gt;3.12&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 5&lt;/td&gt;\n&lt;td&gt;3.02&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 6&lt;/td&gt;\n&lt;td&gt;3.00&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 7&lt;/td&gt;\n&lt;td&gt;2.97&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Модель 8&lt;/td&gt;\n&lt;td&gt;1.98&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Среднее значение&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;3.20&lt;/strong&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Messy»-запросы — это искусственно созданные входные данные с грамматическими ошибками и нарушенной структурой для проверки того, насколько модель способна игнорировать шум и фокусироваться на сути задачи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obsuzhdenie-i-vyvody\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#obsuzhdenie-i-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение и выводы&lt;/span&gt;&lt;/a&gt;Обсуждение и выводы&lt;/h4&gt;\n&lt;p&gt;KaliBench наглядно демонстрирует разрыв между общими знаниями больших языковых моделей (LLM) в сфере кибербезопасности и их способностью генерировать точные, готовые к исполнению команды CLI. Исследование показывает, что выбор инструмента и формирование аргументов — это принципиально разные задачи. Ограничение набора доступных инструментов практически полностью устраняет ошибки выбора, тогда как корректность аргументов, особенно в части опциональных флагов и их привязки к значениям, остается главным препятствием. Предоставление документации к инструментам дает наиболее значительный прирост производительности, что указывает на то, что сбои чаще вызваны не непониманием намерения пользователя, а нехваткой узкоспециализированных знаний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основным барьером для LLM является корректная настройка аргументов и флагов команд, а не выбор самого инструмента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты подчеркивают необходимость оценки использования инструментов на уровне структуры команд в условиях отсутствия жестких схем, где модели должны самостоятельно выводить синтаксис без явных API. Помимо оценочной функции, KaliBench позволяет эффективно улучшать модели через детальное обучение с подкреплением, не требующее запуска среды в реальном времени. Дообучение с помощью SFT и RLVR значительно повышает эффективность компактных моделей: так, модель с 8 млрд параметров приближается по результатам к гораздо более крупным системам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — дообучение на размеченных примерах, RLVR (Reinforcement Learning from Verifiable Rewards) — обучение с подкреплением на основе проверяемых результатов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Несмотря на успехи, сохраняются ограничения: фокус на генерации команд за один шаг и зависимость от данных, основанных на документации. Будущие исследования должны быть направлены на многошаговые рабочие процессы, использование инструментов с дополнением поиском (RAG) и оценку с учетом контекста среды. В целом, KaliBench представляет собой практическую базу для тестирования и обучения, способствующую развитию надежных и исполняемых инструментов кибербезопасности на базе LLM.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Текущая версия KaliBench ограничена одношаговыми задачами и требует наличия качественной документации для эффективной работы моделей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f2.jpg\" alt=\"Рисунок 2: Сквозной конвейер KaliBench для оценки NL-to-CLI в Kali Linux. Бенчмарк построен на основе генерации данных с\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Сквозной конвейер KaliBench для оценки NL-to-CLI в Kali Linux. Бенчмарк построен на основе генерации данных с помощью LLM, многораундовой верификации-регенерации и выбора репрезентативной выборки. Оценка применяет синтаксический анализ с учетом псевдонимов и детальную оценку инструментов, аргументов и размерных категорий.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f6.jpg\" alt=\"Рисунок 6: Обзор образцов KaliBench. Показаны репрезентативные примеры, охватывающие все пять фаз безопасности и 23 изме\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Обзор образцов KaliBench. Показаны репрезентативные примеры, охватывающие все пять фаз безопасности и 23 измерения оценки. Увеличьте масштаб для получения более детальной информации.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-f7.jpg\" alt=\"Рисунок 7: Охват параметров командной строки в KaliBench (подмножество для оценки). Хотя общие флаги (например, –help, –\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Охват параметров командной строки в KaliBench (подмножество для оценки). Хотя общие флаги (например, –help, –verbose) встречаются часто, многие функциональные параметры, специфичные для инструментов, также присутствуют во всем наборе данных.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ не может&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точно&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;генерировать&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;CLI-команды&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Создание вериф&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ицируемого&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;датасета&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;KaliBench&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Рост точности&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;8B моделей до&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;уровня&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;гигантов&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Надежная&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;автоматизация &lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;кибербезопасно&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сти&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p
