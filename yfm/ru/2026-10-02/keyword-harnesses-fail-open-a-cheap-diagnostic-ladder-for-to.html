 подтверждает отсутствие жесткого «гейта» (фильтра) в 600M, это не исключает наличие частичных или контекстно-зависимых механизмов. Последующее расширение тестов до n=269 и n=238 (включая 72 промпта на подавление) подтвердило наши выводы, однако влияние силы преамбулы остается неизученным.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Малый размер выборки в первичных тестах ограничивает статистическую значимость, однако качественные различия между моделями остаются устойчивыми при масштабировании тестов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"utochnenie-recepta-l5-i-analiz-faktorov\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#utochnenie-recepta-l5-i-analiz-faktorov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Уточнение рецепта L5 и анализ факторов&lt;/span&gt;&lt;/a&gt;Уточнение рецепта L5 и анализ факторов&lt;/h4&gt;\n&lt;p&gt;Рецепт L5 изначально представлял собой комплексный набор из четырех изменений: разнообразие корпуса, пятикратное увеличение скорости обучения (LR), разморозка эмбеддингов и использование новой точки «теплого старта». Дальнейший анализ позволил исключить два фактора. Точка старта была исключена, так как повторные запуски с разными родительскими моделями дали идентичные результаты (§6.5). Разморозка эмбеддингов была признана избыточной, так как прямые измерения показали численную инертность таблицы в процессе обучения (§6.6). Однако эти исключения имеют ограничения: «родители» были «родственными» моделями с общими эмбеддингами, а инертность в формате bf16 не гарантирует отсутствие накопления изменений в оптимизаторе fp32.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Факторный анализ F3 позволил разделить влияние разнообразия корпуса и скорости обучения, однако результаты ограничены спецификой вычислительной среды и неполнотой репликации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya-i-metodologiya-proverki\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#ogranicheniya-i-metodologiya-proverki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения и методология проверки&lt;/span&gt;&lt;/a&gt;Ограничения и методология проверки&lt;/h4&gt;\n&lt;p&gt;Факторный анализ F3, описанный в §6.9, столкнулся с тремя критическими ограничениями. Во-первых, изменился численный режим: если основные данные получены на A10G в формате bf16, то пять плеч F3 выполнялись на T4 в fp16 с 8-битным оптимизатором из-за отсутствия поддержки bf16. Это делает результаты F3 несравнимыми с остальной частью работы. Во-вторых, неполная репликация: из четырех ячеек только «разнообразный корпус/высокий LR» была доведена до конца. Репликация ячеек с низким LR была прервана на 880-м шаге из 2202. Сравнение на этом этапе показало, что гипотеза о подавлении (Finding 1) не подтверждается однозначно: второй узкий сид показал результат 0.569 против 0.556 у разнообразного, что ставит под сомнение устойчивость вывода. В-третьих, статистическая значимость: из 36 проведенных тестов лишь четыре прошли поправку Бенджамини-Хохберга при q=0.05, причем два из них описывают одно и то же поведение, что снижает доказательную базу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/popravka-bendzhamini-hohberga.html\"&gt;Поправка Бенджамини-Хохберга&lt;/a&gt; — статистический метод контроля ложноположительных результатов при проведении множественных сравнений, позволяющий отсеять случайные корреляции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obsuzhdenie-ogranichenij-i-metodologicheskih-aspektov\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#obsuzhdenie-ogranichenij-i-metodologicheskih-aspektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение ограничений и методологических аспектов&lt;/span&gt;&lt;/a&gt;Обсуждение ограничений и методологических аспектов&lt;/h4&gt;\n&lt;p&gt;Наши выводы ограничены следующими положениями: при высокой скорости обучения (learning rate) различия между корпусами данных статистически незначимы. При низкой скорости обучения «разнообразная» выборка превосходит «узкие» варианты по точности использования инструментов. Преимущество в подавлении нежелательных ответов у «разнообразной» выборки сопоставимо с вариативностью между отдельными запусками (seeds), поэтому мы не заявляем о его однозначности. Запуск с «узкой» выборкой и низкой скоростью обучения показал наихудшие результаты по всем метрикам, кроме «мягких пропусков» (soft miss), где он формально лидирует, однако этот показатель основан лишь на 31 элементе и не демонстрирует значимых контрастов. Мы не утверждаем, что какой-либо конкретный фактор является доминирующим.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основной вывод: при низкой скорости обучения «разнообразная» выборка эффективнее «узкой», однако многие метрики подвержены высокой волатильности между запусками.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Механистическая интерпретация основана на локализации через исключение, а не на анализе схем (circuit analysis). Гипотеза «маршрутизация, а не представление» подтверждается тем, что при изменении рецепта веса внимания менялись, а целевая строка в таблице эмбеддингов оставалась неподвижной. Это опровергает гипотезу о представлении входных данных для данного случая, но не исключает распределенных изменений в других частях таблицы. Важно отметить, что неподвижность строки обусловлена порогом квантования bf16: обновление весов было меньше минимально возможного шага, что делает этот результат артефактом обучения, а не осознанным «решением» модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Квантование (&lt;a href=\"concepts/quantization.html\"&gt;quantization&lt;/a&gt;) — процесс снижения точности представления чисел (например, весов нейросети) для экономии памяти, который может приводить к тому, что слишком малые изменения весов просто отбрасываются.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metodologicheskie-ogranicheniya-i-tochnost-dannyh\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#metodologicheskie-ogranicheniya-i-tochnost-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методологические ограничения и точность данных&lt;/span&gt;&lt;/a&gt;Методологические ограничения и точность данных&lt;/h4&gt;\n&lt;p&gt;Все показатели получены на основе одиночных запусков (single-seed). Использование пути экспорта GGUF/Ollama несет риски, связанные с реализацией архитектур NoPE. Мы опираемся на строгие диагностические тесты, которые обходят этот путь. Оценки состава данных (65/34/0.7/0.1) являются экспертными оценками на основе размеров бинов, а не точным аудитом потока токенов, с погрешностью в несколько процентов. Траектория обучения модели 1B имеет «слепые зоны»: мы не можем наблюдать пик обучения из-за отсутствия архивов фазы 1, а данные на этапе 36K демонстрируют признаки заучивания (контаминации) обучающих примеров, а не истинной генерализации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оговорка: оценки состава данных и результаты на ранних этапах обучения являются аппроксимациями и могут содержать погрешности из-за неполноты архивных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При анализе результатов мы обнаружили и исправили ошибку в скоринге: исходный алгоритм засчитывал ответ как верный, если он содержал любой непустой ключ, что приводило к завышению результатов (например, с 0.726 до 0.474 для модели 600M). Также выявлено, что 18 из 72 промптов на подавление являются дубликатами, что снижает эффективную выборку до 53 уникальных элементов. Наконец, метрика «мягких пропусков» применима только к инструменту &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1o0x1hra\"&gt;bash_exec&lt;/code&gt;, поэтому сравнение сложности между разными инструментами в Таблице 9 не является универсальным рейтингом.&lt;/p&gt;\n&lt;h4 id=\"vosstanovlenie-dannyh-i-verifikaciya-modeli-1b\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#vosstanovlenie-dannyh-i-verifikaciya-modeli-1b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Восстановление данных и верификация модели 1B&lt;/span&gt;&lt;/a&gt;Восстановление данных и верификация модели 1B&lt;/h4&gt;\n&lt;p&gt;Оригинальные контрольные точки (checkpoint) для модели 1B и её «родителя» были утрачены из-за прекращения работы облачной инфраструктуры и истечения срока действия учетных записей. Для воссоздания результатов авторы провели повторный запуск (репродукцию) с использованием идентичного корпуса данных, шага обучения и скорости обучения. В качестве «родителя» был выбран функциональный аналог, прошедший проверку на наличие целевой патологии. Хотя исторические данные сохранены в Таблицах 4 и 5, они носят справочный характер.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Восстановленная модель 1B является репродукцией, так как оригинальные веса были утеряны, однако она демонстрирует идентичные характеристики патологии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В ходе анализа выявлены четыре критических аспекта:&lt;/p&gt;\n&lt;p&gt;а) Замена не является побитово идентичной оригинальной фазе 3. Несмотря на внутренние записи, утверждавшие обратное, сравнение всех 201 тензора языковой модели показало различия. Максимальная абсолютная разница составила 7.8 × 10⁻³, а косинусное сходство каждого тензора — не ниже 0.999966. Характер этих изменений (равномерное, повсеместное отклонение) указывает на погрешности при конвертации или экспорте данных, а не на процесс обучения.&lt;/p&gt;\n&lt;p&gt;б) Поиск оригинальной контрольной точки не увенчался успехом. Найденный кандидат с похожим именем показал низкую производительность (только 1/6 корректных ответов) и несовпадение количества шагов (2002 против 2202 по рецепту), что подтверждает его ошибочность.&lt;/p&gt;\n&lt;p&gt;в) Ошибка в библиотечных функциях измерения нормы. Ранее кандидат был отсеян из-за расхождения нормы таблицы эмбеддингов (630.13 против 635.2). Выяснилось, что &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ow9u1rng\"&gt;torch.norm&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3pae4hx\"&gt;torch.linalg.vector_norm&lt;/code&gt; дают погрешность 0.8% на тензорах размером 32,768 × 2048, тогда как прямое вычисление &lt;span class=\"yfm-latex\" data-content=\"%5Csqrt%7B%5Csum%20w%5E2%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; дает точное значение 635.1627. Это четвертый случай артефакта инструментария в исследовании.&lt;/p&gt;\n&lt;p&gt;г) Неопределенность происхождения. Из-за отсутствия логов невозможно на 100% исключить, что историческая линия отличалась от воспроизведенной, хотя совпадение всех метрик в Таблицах 4, 5 и §6.6 делает это маловероятным.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"itogi-issledovaniya-i-diagnostika-modelej\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#itogi-issledovaniya-i-diagnostika-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итоги исследования и диагностика моделей&lt;/span&gt;&lt;/a&gt;Итоги исследования и диагностика моделей&lt;/h4&gt;\n&lt;p&gt;В ходе работы мы провели полный цикл диагностики и исправления аномалий в архитектурно схожих малых языковых моделях: VectraYX-600M (661,6 млн параметров, код-ориентированное обучение, заморозка на 64% графика) и VectraYX-1B (1,109 млрд параметров, многофазное обучение на веб-данных с этапом SFT на 6 млрд токенов). Первичная оценка с помощью «мягкого» набора ключевых слов показала почти идентичные результаты (разница 0,01). Однако строгая диагностика выявила противоположную картину: модель 600M корректно генерировала JSON-структуры вызова инструментов в 6 из 6 случаев, тогда как 1B не справилась ни разу (0 из 6), демонстрируя вероятность первого токена на уровне 10⁻⁴–10⁻⁵. Это классифицировало высокий балл модели 1B как ложноположительный результат.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Диагностика позволила исправить модель 1B с помощью специализированного рецепта (разнородный корпус, скорость обучения 5×, затраты ≈3,3 GPU-часа), добившись успеха в 8 из 8 случаев, при этом веса эмбеддингов остались практически неизменными (идентичность 97,7%).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — метод дообучения модели на размеченных примерах для выполнения конкретных задач, таких как вызов внешних инструментов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты ограничены малым размером выборки (n) и тем, что исходный артефакт ремонта был утерян, а представленные данные являются его воспроизведением.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"metodologiya-i-vyvody\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#metodologiya-i-vyvody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методология и выводы&lt;/span&gt;&lt;/a&gt;Методология и выводы&lt;/h4&gt;\n&lt;p&gt;Мы разработали диагностическую «лестницу», включающую проверку воспроизводимости, зондирование первого токена, тестирование на новых промптах и анализ дрейфа эмбеддингов. Этот инструментарий позволил локализовать сбой в механизмах маршрутизации, а не в представлении триггерных токенов. Наши данные опровергают гипотезу о том, что объем SFT-токенов определяет успех: рецепт на 10⁷ токенов оказался эффективнее, чем специализированный этап на 6 млрд токенов. Практический вывод прост: включайте целевой формат вывода в обучающую выборку и используйте строгие грейдеры для проверки вызовов. Диагностика превращает «невозможность» функции в задачу, решаемую за несколько долларов GPU-времени.&lt;/p&gt;\n&lt;h4 id=\"dostupnost-artefaktov\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#dostupnost-artefaktov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Доступность артефактов&lt;/span&gt;&lt;/a&gt;Доступность артефактов&lt;/h4&gt;\n&lt;p&gt;Все контрольные точки VectraYX-600M (включая снапшот 154K) и воспроизведенные этапы ремонта модели 1B (включая промежуточные шаги и пять ветвей факториального эксперимента) доступны в репозиториях jsantillana на HuggingFace.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Ложные&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;срабатывания в&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;тестах ИИ&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Строгая диагно&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\"
