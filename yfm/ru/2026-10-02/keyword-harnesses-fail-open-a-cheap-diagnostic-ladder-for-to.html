        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"156\" cy=\"76\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"644\" cy=\"262\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Почему ваш ИИ-агент&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;«притворяется» умным:&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ловушка бенчмарков&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи обнаружили, что популярные метрики для оценки использования инструментов (&lt;a href=\"concepts/tool-use.html\"&gt;tool-use&lt;/a&gt;) могут давать ложноположительные результаты. Модели, которые лишь имитируют формат вызова функций, получают высокие баллы, не умея выполнять задачи. Авторы предлагают «диагностическую лестницу» — &lt;a href=\"concepts/diagnostic-ladder.html\"&gt;набор строгих проверок&lt;/a&gt; для верификации навыков ИИ.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Бенчмарки на основе ключевых слов часто путают имитацию формата с реальным выполнением функций.&lt;/li&gt;\n&lt;li&gt;Диагностическая лестница включает проверку воспроизведения, &lt;a href=\"concepts/first-token-probing.html\"&gt;зондирование первого токена&lt;/a&gt; и &lt;a href=\"concepts/embedding-drift-analysis.html\"&gt;анализ дрейфа эмбеддингов&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Качество данных и методика дообучения важнее объема вычислительных ресурсов при исправлении навыков модели.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В работе сравниваются две модели: VectraYX-600M и VectraYX-1B. Несмотря на идентичные архитектуры и схожие баллы в тестах (B4 ~0.66), модель 600M реально вызывала инструменты, а 1B — лишь генерировала похожий текст. Проверка показала, что модель 1B имела вероятность генерации токена &amp;lt;|tool_call|&amp;gt; на уровне 10⁻⁴–10⁻⁵, что фактически означает отсутствие навыка.&lt;/p&gt;\n&lt;p&gt;Для исправления ситуации была применена &lt;a href=\"concepts/sft.html\"&gt;целевая дообучающая настройка&lt;/a&gt; (SFT) с использованием разнообразного корпуса данных и повышенной скорости обучения. Это заняло всего 3.3 часа работы GPU, что в 1000 раз эффективнее предыдущих попыток. Анализ весов показал, что сеть научилась правильно маршрутизировать запросы, не меняя при этом сами эмбеддинги ключевых токенов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено одной архитектурой и конкретным сценарием дообучения; результаты по подавлению лишних вызовов требуют дальнейшей проверки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Стандартные методы оценки использования инструментов (tool-use) через поиск ключевых слов часто ошибочно приписывают малым языковым моделям способности, которыми те не обладают. Авторы демонстрируют этот феномен на примере двух моделей VectraYX: 600M (661,6 млн параметров, 65% кода в обучении, без специализированной донастройки) и 1B (1,109 млрд параметров, с этапом обучения на веб-данных и специализированным SFT на 6 млрд токенов). Несмотря на идентичную архитектуру, обе модели показывают схожие результаты в мягких метриках (B4: 0,660 против 0,650).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Проверка на дословное воспроизведение выявила, что модель 600M успешно генерирует вызовы инструментов в 6 из 6 случаев, тогда как 1B проваливает задание во всех тестах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ показал, что у модели 1B отсутствует априорная вероятность на токене &amp;lt;/tool_call/&amp;gt; (10⁻⁴–10⁻⁵), что было вызвано этапом обучения на веб-данных, который «стер» ранее усвоенные навыки. Для восстановления функциональности была применена целевая донастройка (SFT) на разнообразном корпусе (2202 шага, ~3,3 GPU-часа). Это позволило повысить долю корректных вызовов с 0,100 до 0,959 на 269 строках корпуса. На новых данных исправленная модель 1B показала результат 0,536 против 0,428 у 600M (p=0,004).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — это метод дообучения модели на размеченных примерах для адаптации её поведения под конкретные задачи, например, вызов внешних API.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Проверка через &lt;a href=\"concepts/dreyf-embeddingov.html\"&gt;дрейф эмбеддингов&lt;/a&gt; показала, что 97,7% таблицы bf16 остались идентичными, значит, изменения произошли в весах сети, а не в самих токенах. Обе модели склонны к избыточному срабатыванию: на запросах без вызова инструментов они ошибочно генерируют их в 91% (600M) и 83% (1B) случаев. Авторы подчеркивают, что предложенная «лестница» диагностических тестов (от проверки воспроизведения до анализа дрейфа) должна стать обязательным фильтром для заявлений о способностях малых моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты для модели 600M получены на незавершенном этапе обучения (64% от плана), что ограничивает возможность полноценного сравнения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"vnedrenie-instrumentov-i-problema-nesootvetstviya-metrik\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#vnedrenie-instrumentov-i-problema-nesootvetstviya-metrik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внедрение инструментов и проблема несоответствия метрик&lt;/span&gt;&lt;/a&gt;Внедрение инструментов и проблема несоответствия метрик&lt;/h4&gt;\n&lt;p&gt;Способность языковой модели генерировать структурированные JSON-запросы для взаимодействия с серверами MCP (Model Context Protocol) превращает локальные модели в полноценных помощников по кибербезопасности. Серия моделей VectraYX, включающая решения объемом от 42 млн до 1,1 млрд параметров, разработана специально для работы в изолированных средах (air-gapped) через llama.cpp. В данной работе мы исследуем критический разрыв между результатами автоматизированных тестов и реальной производительностью моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Автоматические тесты показали почти идентичные результаты для моделей 600M и 1B (0,660 против 0,650), однако на практике модель 1B оказалась неспособна генерировать JSON-структуры, в отличие от 600M.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение двух моделей, VectraYX-600M (661,6 млн параметров) и VectraYX-1B (1,109 млрд параметров), выявило парадокс: при идентичной архитектуре декодера и токенизаторе на 32 тыс. токенов, их показатели в бенчмарках оказались почти равными (B4 = 0,660 против 0,650). Тем не менее, при качественном тестировании модель 600M успешно генерировала корректные команды bash_exec, тогда как модель 1B выдавала лишь несвязный текст, ни разу не сформировав требуемый JSON-формат.&lt;/p&gt;\n&lt;h4 id=\"metody-izmereniya-i-validaciya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#metody-izmereniya-i-validaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы измерения и валидация&lt;/span&gt;&lt;/a&gt;Методы измерения и валидация&lt;/h4&gt;\n&lt;p&gt;Для диагностики мы применили метод проверки дословного воспроизведения (§5.3). Мы использовали примеры из обучающего корпуса SFT, включая системные преамбулы с описанием инструментов MCP. Модели подавалась половина промпта, после чего требовалась генерация корректного JSON-запроса с аргументами, которые являются логически верными, но не копируют обучающие данные (для исключения простого запоминания).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод проверки дословного воспроизведения позволяет отличить реальное понимание структуры от простого «зазубривания» ответов из обучающей выборки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты оказались категоричными: модель 600M успешно прошла тест в 6 из 6 случаев, тогда как 1B — в 0 из 4. Выяснилось, что автоматизированный &lt;a href=\"concepts/benchmark.html\"&gt;бенчмарк&lt;/a&gt; ошибочно засчитывал модели 1B упоминание инструментов в тексте как их фактический вызов. Это классическая ошибка валидации оценки, при которой метрика «открыта» для ложноположительных срабатываний.&lt;/p&gt;\n&lt;h4 id=\"diagnostika-i-ispravlenie\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#diagnostika-i-ispravlenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диагностика и исправление&lt;/span&gt;&lt;/a&gt;Диагностика и исправление&lt;/h4&gt;\n&lt;p&gt;Первичный анализ (&lt;a href=\"concepts/probing.html\"&gt;зондирование&lt;/a&gt; первого токена) показал, что модель объемом 1 млрд параметров (1B) не могла инициировать вызов инструмента из-за отсутствия априорной вероятности: в нужной позиции модель присваивала токену &amp;lt;/tool_call/&amp;gt; крайне низкую вероятность (10⁻⁴–10⁻⁵), тогда как модель 600M генерировала его корректно. Это не было случайной ошибкой декодирования; модель полностью игнорировала формат, несмотря на специализированное обучение (SFT) на 6 млрд токенов, что значительно превышает объем инструкций, полученных моделью 600M (около 0,1% от общего потока).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исправление модели 1B потребовало не увеличения объема данных, а смены стратегии: прицельное обучение на разнообразной смеси данных с повышенным коэффициентом скорости обучения (LR) позволило достичь успеха за 2202 шага.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для исправления была разработана новая методика: использование разнообразного набора данных (диалоги OASST, корпус инструментов, логические цепочки), разморозка эмбеддингов и увеличение LR в 5 раз. Обучение заняло 2202 шага и около 3,3 часа на одном GPU. После этого модель стала воспроизводить вызовы инструментов с вероятностью 0,996–0,998. На 8 новых промптах модель безошибочно выбирала инструменты в 7 из 7 случаев, корректно извлекая аргументы (IP-адреса, идентификаторы CVE), и правильно воздерживалась от вызова в 8-м случае. Эффективность подтверждена на 238 промптах: модель 1B показала точность 0,536 против 0,428 у 600M на неизвестных сущностях.&lt;/p&gt;\n&lt;h4 id=\"lokalizaciya-izmenenij\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#lokalizaciya-izmenenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Локализация изменений&lt;/span&gt;&lt;/a&gt;Локализация изменений&lt;/h4&gt;\n&lt;p&gt;Проверка дрейфа эмбеддингов показала, что вектор токена &amp;lt;/tool_call/&amp;gt; практически не изменился (косинусное сходство 0,999996). Это опровергает гипотезу о «мертвых эмбеддингах»: значение токена было корректным изначально, а исправление заключалось в обучении сети направлять внимание на этот токен в нужных контекстах. Измерения подтвердили, что 97,7% таблицы эмбеддингов остались идентичными, так как шаги оптимизатора Adam были меньше точности формата bf16.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Дрейф эмбеддингов» — это изменение числовых векторов, представляющих слова или токены в пространстве модели. Отсутствие дрейфа означает, что модель не переучивала смысл самого токена, а меняла логику его использования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"tezis\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#tezis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тезис&lt;/span&gt;&lt;/a&gt;Тезис&lt;/h4&gt;\n&lt;p&gt;Основным фактором успеха является состав обучающей выборки (bootstrap composition). Модель 600M, обученная преимущественно на коде (65%), приобрела навыки структурированного вывода «по умолчанию». Модель 1B, обученная на веб-данных, утратила эту способность, восстановить которую удалось лишь через целенаправленное вмешательство. Это доказывает, что состав данных определяет, будет ли способность модели «бесплатной» (возникшей автоматически) или потребует сложной инженерной доработки.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"myagkij-test-modeli-kazhutsya-vzaimozamenyaemymi\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#myagkij-test-modeli-kazhutsya-vzaimozamenyaemymi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Мягкий тест: модели кажутся взаимозаменяемыми&lt;/span&gt;&lt;/a&gt;Мягкий тест: модели кажутся взаимозаменяемыми&lt;/h4&gt;\n&lt;p&gt;В рамках «мягкого» тестирования (Таблица 4) модель 600M на шаге 154K успешно проходит 6 из 6 испытаний. Модель 1B на этапах phase-3 (&lt;a href=\"concepts/step.html\"&gt;шаг&lt;/a&gt; 20K) и phase-4b (SFT, шаг 400) демонстрирует крайне низкую вероятность генерации токена вызова инструмента (10⁻⁴–10⁻⁵), не проходя тесты. Однако после «ремонта» (шаг 2202) модель 1B показывает полное соответствие (4 из 4) с точностью 0.996–0.998. Стоит отметить, что для оценки способностей используется расширенная батарея из 238 промптов (n=269), описанная в §6.5 и §6.8.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель 600M демонстрирует стабильную работу, тогда как 1B до исправления практически не способна к вызову инструментов, несмотря на обучение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"strogaya-diagnostika-do-ispravleniya-modeli-ne-peresekayutsya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#strogaya-diagnostika-do-ispravleniya-modeli-ne-peresekayutsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Строгая диагностика до исправления: модели не пересекаются&lt;/span&gt;&lt;/a&gt;Строгая диагностика до исправления: модели не пересекаются&lt;/h4&gt;\n&lt;p&gt;При строгом тестировании модель 600M генерирует синтаксически корректные JSON-объекты с вызовами инструментов, демонстрируя понимание схемы: она не просто копирует примеры из обучающей выборки, а адаптирует команды (например, меняя параметры &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48t08yjl\"&gt;tail&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjzsmwcz\"&gt;grep&lt;/code&gt; в зависимости от контекста). Это доказывает, что модель усвоила логику взаимодействия, а не заучила ответы.&lt;/p&gt;\n&lt;p&gt;Напротив, модель 1B до исправления (включая версии после SFT) не открывает блок вызова инструментов вовсе. Вместо этого она генерирует несвязный текст. Вероятность появления токена &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ch9z474x\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; составляет 10⁻⁴–10⁻⁵, что указывает на практически полное отсутствие «априорного знания» о формате вызова, несмотря на специализированное обучение на 6 млрд токенов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/apriornoe-znanie.html\"&gt;Априорное знание&lt;/a&gt; — это «предрасположенность» модели генерировать определенную структуру данных до того, как она увидит конкретный контекст.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Низкая вероятность генерации токена означает, что модель даже не «пытается» вызвать инструмент, а просто продолжает текст в стиле обычного чата.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ispravlenie-modeli-1b-na-osnove-diagnostiki\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#ispravlenie-modeli-1b-na-osnove-diagnostiki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исправление модели 1B на основе диагностики&lt;/span&gt;&lt;/a&gt;Исправление модели 1B на основе диагностики&lt;/h4&gt;\n&lt;p&gt;Диагностика показала, что проблема заключается в отсутствии априорного знания, а не в его «зашумленности». Следовательно, простое повторное обучение на узких примерах неэффективно. Требуется обучение с разнообразными контекстами и достаточной скоростью обучения для изменения весов в середине сети. Таблица 5 обобщает три попытки исправления (A, B, C).&lt;/p&gt;\n&lt;p&gt;Попытка B была признана невалидной из-за ошибок в тестовой среде (отсутствие системного преамбулы и удаление спецсимволов при декодировании), поэтому её результаты «0/8» не учитываются. Попытка C была проведена повторно после потери исходного чекпоинта: на CPU было подтверждено, что новая модель обладает той же патологией (вероятность вызова 2 \times 10⁻⁷–2 \times 10⁻³), что позволило корректно оценить эффективность исправления.&lt;/p&gt;\n&lt;h4 id=\"rezultaty-vosproizvedeniya-i-diagnostika-modeli\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#rezultaty-vosproizvedeniya-i-diagnostika-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты воспроизведения и диагностика модели&lt;/span&gt;&lt;/a&gt;Результаты воспроизведения и диагностика модели&lt;/h4&gt;\n&lt;p&gt;В данном разделе мы представляем строгие диагностические показатели для восстановленной версии модели 1B. Основное внимание уделено «Рецепту C», который продемонстрировал способность к генерализации, выходящую за рамки простого заучивания данных. Для проверки мы использовали восемь новых промптов, отсутствующих в обучающей выборке, семь из которых требовали выбора одного из пяти инструментов. Восстановленная модель успешно сформировала корректные вызовы инструментов во всех случаях, где это требовалось.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Восстановленная модель по «Рецепту C» показала 100% точность (8/8) на наборе новых промптов, подтверждая способность к генерализации, а не простому запоминанию.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В Таблице 5 приведены сравнительные данные по различным конфигурациям обучения. Вариант A (фаза 3, ~6 млрд токенов) показал нулевой результат на тестовом наборе. Вариант B (узкая донастройка, 486 шагов) не прошел валидацию из-за ошибок в обработке токенов, несмотря на снижение функции потерь до 0,05–0,4. «Рецепт C» (2202 шага, ~3,3 часа на одном GPU) обеспечил идеальное воспроизведение обучающих примеров (4/4) с вероятностью первого токена Pfirst = 0,996–0,998 и безупречное выполнение задач на новых данных. Исторический запуск (C*) показал идентичные результаты, что подтверждает надежность методики.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/p-first.html\"&gt;P-first&lt;/a&gt; (вероятность первого токена) — метрика уверенности модели при генерации начала ответа; значения близкие к 1 указывают на высокую степень детерминизма.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ конкретных вызовов инструментов (например, поиск CVE-2024-3094 или выполнение команд &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t1huv4r6\"&gt;df -h&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0co1mam\"&gt;ps aux&lt;/code&gt;) доказывает, что модель корректно извлекает сущности, которые не встречались в обучающем корпусе из 2801 примера. Тем не менее, модель демонстрирует специфичность навыков: при попытке задать общий вопрос о фишинге она корректно воздержалась от вызова инструмента, но не смогла предоставить содержательный текстовый ответ, что указывает на сохраняющиеся проблемы с общим следованием инструкциям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Успех «Рецепта C» является комплексным результатом; текущие данные не позволяют изолированно выделить вклад разнообразия корпуса, скорости обучения или начальной точки, однако доказано, что объем данных сам по себе не является решающим фактором.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"lokalizaciya-ispravleniya-marshrutizaciya,-a-ne-predstavlenie\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#lokalizaciya-ispravleniya-marshrutizaciya,-a-ne-predstavlenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Локализация исправления: маршрутизация, а не представление&lt;/span&gt;&lt;/a&gt;Локализация исправления: маршрутизация, а не представление&lt;/h4&gt;\n&lt;p&gt;Гипотеза о том, что сбой модели 1B и успех «разморозки» эмбеддингов связаны с некорректным представлением токена &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-80gfrmx5\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt;, не подтвердилась. В данной архитектуре веса входных и выходных эмбеддингов связаны (tie_embeddings=true), что означает, что матрица эмбеддингов одновременно служит и матрицей декодирования (unembedding matrix). Проверка дрейфа эмбеддингов между «родительской» моделью и контрольной точкой на шаге 2202 показала, что строка токена &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjo0pn24\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; (ID 8) практически не изменилась: косинусное сходство составило 0,99999583, а изменение нормы — всего +1,5×10⁻⁴%. Это значение даже ниже, чем среднее изменение для 20 случайных токенов (средний косинус 0,99999678).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/embedding.html\"&gt;Эмбеддинг&lt;/a&gt; токена &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ctawvh05\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; остался практически неизменным, что опровергает гипотезу о необходимости его «исправления» через обучение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ всей таблицы эмбеддингов (32 768 × 2048) показал, что 97,7% из 67,1 млн элементов идентичны побитово. Кажущаяся «разреженность» обновлений объясняется форматом хранения данных &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q1wgtxwh\"&gt;bf16&lt;/code&gt;. Поскольку шаг обучения Adam (LR = 1×10⁻⁵) меньше порога точности представления (ulp), обновления отбрасываются при округлении, если они не попадают в область малых значений (хвост распределения). Таким образом, эмбеддинги не менялись не из-за отсутствия градиентов, а из-за ограничений точности формата хранения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Формат bf16 (bfloat16) использует 8 бит мантиссы, что ограничивает точность записи очень малых изменений весов при обучении.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение с «положительным контролем» (проекции внимания в слоях 20–21) подтверждает, что сеть обучалась иначе. Хотя максимальные абсолютные сдвиги в эмбеддингах (5,98×10⁻³) сопоставимы с изменениями в слоях внимания (3,40–4,31×10⁻³), по косинусному расстоянию и доле изменившихся элементов (2,3% против 6–15%) внимание менялось значительно сильнее. Вывод: проблема модели 1B заключалась не в отсутствии корректного представления токена, а в отсутствии эффективной политики маршрутизации скрытых состояний к этому представлению. Исправление научило сеть направлять данные в уже существующий «правильный» вектор в нужных контекстах.&lt;/p&gt;\n&lt;h4 id=\"analiz-ablyacii-i-dinamika-embeddingov\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#analiz-ablyacii-i-dinamika-embeddingov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ абляции и динамика эмбеддингов&lt;/span&gt;&lt;/a&gt;Анализ абляции и динамика эмбеддингов&lt;/h4&gt;\n&lt;p&gt;Авторы провели проверку гипотезы о необходимости разморозки эмбеддингов в рецепте C. Вместо повторного запуска эксперимента с принудительной заморозкой, исследователи проанализировали веса уже обученной модели. Выяснилось, что эмбеддинги, которые номинально считались «размороженными», фактически оставались статичными: 97,7% значений таблицы оказались побитово идентичными после 2202 шагов обучения. Относительное изменение нормы Фробениуса составило всего 4 × 10⁻⁷, а обновления на каждом шаге оказались на порядок меньше точности хранения весов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эмбеддинги в рецепте C фактически не обновлялись, что доказывает их пассивную роль в процессе обучения при данных параметрах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Это наблюдение подтверждает предсказание о том, что «размороженные» и «замороженные» эмбеддинги в данном случае представляют собой один и тот же эксперимент. Поскольку компонент не участвовал в изменениях, его вклад в успех рецепта C исключается. Это служит веским аргументом против гипотезы о критической важности представления эмбеддингов для работы модели. Однако авторы предостерегают от обобщений: при более высоком темпе обучения (learning rate) обновления могли бы выйти за пределы ошибки округления и накопиться в состоянии оптимизатора fp32.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/norma-frobeniusa.html\"&gt;Норма Фробениуса&lt;/a&gt; — это математическая мера «размера» матрицы, позволяющая оценить, насколько сильно изменились веса модели в процессе обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты ограничены текущим рецептом; при других настройках или более длительном обучении поведение эмбеддингов может измениться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"i-kogda-eto-stiraetsya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#i-kogda-eto-stiraetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И когда это стирается&lt;/span&gt;&lt;/a&gt;И когда это стирается&lt;/h4&gt;\n&lt;p&gt;В отличие от анализа конечных точек, мы проследили динамику обучения, используя сохраненные чекпоинты моделей 600M (15 точек, шаги 1K–154K) и 1B (10 точек фазы-3 и выборка фазы-2). Для оценки использовались шесть примеров из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0pvolz05\"&gt;tool_sft_mini_v1.jsonl&lt;/code&gt;. Мы применяли два метода зондирования: Plit (вероятность токена &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xzwuvznc\"&gt;&amp;lt;/tool_call/&amp;gt;&lt;/code&gt; сразу после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ipfxa18x\"&gt;&amp;lt;/assistant/&amp;gt;&lt;/code&gt;) и &lt;a href=\"concepts/pskip.html\"&gt;Pskip&lt;/a&gt; (вероятность того же токена после пропуска до четырех пробельных символов). Различие между ними критично, так как модель 600M часто вставляет символ переноса строки, что делает Plit индикатором формата, а не логики. В Таблице 6 представлены данные для 600M.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель 600M демонстрирует безусловную склонность к вызову инструментов, не реагируя на контекст: вероятность вызова остается высокой даже в примерах, где инструкция прямо запрещает использование инструментов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Pskip — это метрика, позволяющая оценить вероятность вызова инструмента моделью, игнорируя случайные пробелы или переносы строк, которые могут искажать точность классического зондирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выводы по 600M основаны на одном примере с запретом вызова, что является ограничением исследования, однако стабильность результата на 15 чекпоинтах подтверждает отсутствие контекстной селективности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель 600M достигла насыщения Pskip &amp;gt; 0.999 уже к 30K шагу. Однако она не научилась подавлять вызовы: в примере, где система требует «не вызывать инструмент», модель всё равно генерирует вызов на всех 15 чекпоинтах. Это доказывает, что 600M использует «безусловную базовую частоту», а не осознанный выбор. Для модели 1B (Таблица 7) ситуация иная: мы наблюдаем процесс активного «стирания» навыка. На шаге 36K фазы-2 Pskip составляла 0.432, но уже через 2000 шагов упала до 3.0 × 10⁻³, а к 48K шагу достигла минимума 5.9 × 10⁻⁷, оставаясь на этом уровне до конца фазы.&lt;/p&gt;\n&lt;h4 id=\"raspad-veroyatnostnogo-prioriteta-v-faze-2\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#raspad-veroyatnostnogo-prioriteta-v-faze-2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Распад вероятностного приоритета в фазе 2&lt;/span&gt;&lt;/a&gt;Распад вероятностного приоритета в фазе 2&lt;/h4&gt;\n&lt;p&gt;В ходе обучения модели 1B наблюдается резкое падение вероятностного приоритета (probe) примерно на 5,9 порядка за 12 000 шагов (около 3,1 млрд токенов). Этот процесс происходит в первом блоке фазы 2, где состав данных на 90% состоит из английского, испанского языков и Википедии, и на 5% из кода. Для проверки авторы увеличили плотность контрольных точек (38K, 40K, 44K, 48K), что подтвердило монотонный характер затухания, а не случайный выброс. Важно, что генерация (способность модели вызывать инструменты) исчезает быстрее, чем падает сама вероятность: на шаге 38K модель еще удерживает 3 × 10⁻³ на триггерном токене, но уже выдает 0 из 5 корректных вызовов, сохраняя этот показатель до конца фазы 3.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Способность к генерации структуры утрачивается примерно за 10 000 шагов до того, как полностью исчерпывается вероятностная масса, что доказывает необходимость строгой проверки генерации параллельно с зондированием.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдаемое падение — это «вымывание» запомненного приоритета из фазы 1, а не разрушение уже имевшейся способности к обобщению, так как на шаге 36K модель лишь копировала данные из обучающей выборки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"faza-3-obryv-i-otsutstvie-vosstanovleniya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#faza-3-obryv-i-otsutstvie-vosstanovleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фаза 3: обрыв и отсутствие восстановления&lt;/span&gt;&lt;/a&gt;Фаза 3: обрыв и отсутствие восстановления&lt;/h4&gt;\n&lt;p&gt;В фазе 3 динамика &lt;span class=\"yfm-latex\" data-content=\"%5Cbar%7BP%7D_%7Bskip%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; не является монотонной: показатель растет с 3,7 × 10⁻³ (шаг 4K) до пика 1,4 × 10⁻² (шаг 6K), после чего падает в 24 раза к шагу 10K. Этот «обрыв» коррелирует с изменением состава смеси данных, где доля бакета &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-21aqmz1e\"&gt;tool_sft&lt;/code&gt; была снижена с 0,20 до 0,16. Хотя после шага 10K состав смеси был восстановлен, структурный приоритет модели не вернулся, завершив фазу 3 на уровне 8,8 × 10⁻⁵. Генерация инструментов при этом не восстановилась ни разу (0/5 успешных вызовов). Примечательно, что после шага 10K модель приобрела контекстную &lt;a href=\"concepts/sensitivity.html\"&gt;чувствительность&lt;/a&gt;, но на столь низком абсолютном уровне, что это не привело к реальным вызовам инструментов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/kontekstnaya-chuvstvitelnost.html\"&gt;Контекстная чувствительность&lt;/a&gt; — способность модели различать, когда следует использовать инструмент, а когда — нет, основываясь на окружающем тексте.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"dissociaciya-mezhdu-testami-harness-i-zondirovaniem-probe\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#dissociaciya-mezhdu-testami-harness-i-zondirovaniem-probe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диссоциация между тестами (harness) и зондированием (probe)&lt;/span&gt;&lt;/a&gt;Диссоциация между тестами (harness) и зондированием (probe)&lt;/h4&gt;\n&lt;p&gt;Анализ шести контрольных точек показывает прямое противоречие между метрикой B4 и зондом. На шаге 14K зафиксирован исторический максимум B4 (0,085), тогда как зонд показал минимальное значение (5,7 × 10⁻⁵). Через 2000 шагов B4 падает до минимума (0,010), а зонд демонстрирует рост в 4,6 раза. Это подтверждает, что метрика B4 не измеряет реальную способность модели к использованию инструментов, так как она дает высокие оценки даже тогда, когда модель фактически не способна сгенерировать корректный вызов.&lt;/p&gt;\n&lt;h4 id=\"verdikt-po-predregistracionnoj-gipoteze\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#verdikt-po-predregistracionnoj-gipoteze\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вердикт по предрегистрационной гипотезе&lt;/span&gt;&lt;/a&gt;Вердикт по предрегистрационной гипотезе&lt;/h4&gt;\n&lt;p&gt;Предварительная гипотеза о том, что структурированная &lt;a href=\"concepts/perpleksiya.html\"&gt;перплексия&lt;/a&gt; модели 1B стагнирует или ухудшается в ходе фазы 2 (обучение на веб-данных) и не восстанавливается в фазе 3, полностью подтвердилась. Более того, эффект фазы 2 оказался сильнее ожидаемого: вместо стагнации произошло практически полное стирание априорных знаний (почти на шесть порядков) в наиболее прозаических блоках данных. Фаза 3 не принесла восстановления: наблюдаемый ранний рост показателей является следствием базовой вероятности, а не реального развития навыков. Единственное значимое изменение в рамках учебной программы направлено на снижение эффективности. В итоге, даже на этапе с лучшим показателем использования инструментов, априорная вероятность остается на два порядка ниже пика, достигнутого в фазе 3.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гипотеза подтверждена: фаза 2 обучения привела к деградации априорных знаний на 6 порядков, а фаза 3 не смогла компенсировать этот регресс, оставив показатели ниже пиковых значений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Что касается модели 600M, гипотеза о росте вероятности вызова инструментов P(&amp;lt;/tool_call/&amp;gt;) по мере накопления данных SFT подтвердилась лишь формально в финальной точке. Анализ показывает, что рост произошел до первого зафиксированного чекпоинта, поэтому мы наблюдаем эффект насыщения, а не появление новых способностей.&lt;/p&gt;\n&lt;p&gt;Данные по динамике обучения представлены в Таблице 1. Столбец B4 отражает показатели отслеживания чекпоинтов фазы 3. Важно отметить, что значения B4 в этой таблице отличаются от представленных в Таблице 3 примерно в 8 раз из-за различий в методах оценки (&lt;a href=\"concepts/harness.html\"&gt;harness&lt;/a&gt;). Мы используем эти данные исключительно для внутреннего сравнения внутри серии, а не как абсолютные показатели качества.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Перплексия — метрика, оценивающая, насколько хорошо модель предсказывает выбор следующего токена; чем ниже значение, тем «увереннее» модель в своих прогнозах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obobshenie-na-novyh-sushnostyah-i-v-raznyh-registrah\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#obobshenie-na-novyh-sushnostyah-i-v-raznyh-registrah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обобщение на новых сущностях и в разных регистрах&lt;/span&gt;&lt;/a&gt;Обобщение на новых сущностях и в разных регистрах&lt;/h4&gt;\n&lt;p&gt;В данном разделе представлены результаты масштабированного тестирования, заменяющего предварительные оценки на малых выборках (n=6 и n=8). Исследование проводилось на трех контрольных точках: модель 600M (шаг 154K), модель 1B до исправления и модель 1B после исправления (согласно §6.5). Последние две образуют пару «родитель-потомок», что позволяет использовать парный статистический тест.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исправленная модель 1B демонстрирует высокую точность воспроизведения на обучающих данных (0.988), но при этом успешно обобщает знания на новых сущностях, превосходя модель 600M в задачах извлечения данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При воспроизведении диагностики уровня 3 на 269 очищенных от дубликатов строках корпуса, модель 600M формирует корректный вызов в 0.926 случаев, модель 1B до исправления — в 0.100, а исправленная 1B — в 0.959. Важно отметить, что исправленная модель 1B склонна к дословному цитированию обучающих данных (0.988), тогда как 600M чаще генерирует контекстуально осмысленные, но новые аргументы. Для оценки способности к обобщению был создан набор из 238 промптов с сущностями, отсутствующими в корпусе (новые IP-адреса, идентификаторы CVE-2025-*, случайные хеши, вымышленные домены). Оценка проводилась по пяти критериям: принятие решения о вызове, синтаксическая корректность, выбор инструмента, структура аргументов и соответствие сущности (Таблица 8).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Парный тест Макнемара используется для сравнения двух моделей на одних и тех же данных, что позволяет точно определить, какая модель лучше справляется с конкретными задачами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Согласно Таблице 8, исправленная модель 1B проходит 0.536 тестов против 0.428 у модели 600M (p=0.0039). Хотя 600M лучше справляется с выбором инструментов (0.776 против 0.717) и структурированием аргументов (0.855 против 0.819), исправленная 1B значительно эффективнее извлекает ранее не виденные сущности (0.667 против 0.560).&lt;/p&gt;\n&lt;h4 id=\"analiz-zagolovkov-i-ustojchivost-modelej\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#analiz-zagolovkov-i-ustojchivost-modelej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ заголовков и устойчивость моделей&lt;/span&gt;&lt;/a&gt;Анализ заголовков и устойчивость моделей&lt;/h4&gt;\n&lt;p&gt;В ходе тестирования моделей VectraYX-600M и исправленной версии 1B (repaired 1B) оценивалась их способность к вызову инструментов в зависимости от типа запроса. В Таблице 9 представлены результаты по семействам шаблонов. Общие показатели точности близки: для nvd_get_cve обе модели демонстрируют результат, близкий к потолку, тогда как для nvd_search — к минимуму. Исправленная модель 1B показывает преимущество в задачах bash_exec и terse_control, превосходя 600M более чем в два раза. Однако из-за малого размера выборки (n ≈ 28 на ячейку) эти различия имеют широкие доверительные интервалы, что не позволяет говорить о стабильном превосходстве одной модели над другой по всем категориям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исправленная модель 1B демонстрирует лучшую избирательность: при ошибках в выборе команды она выбирает корректную в 48,4% случаев против 76,7% «мягких промахов» у 600M, что указывает на более обоснованный выбор.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Особого внимания заслуживает nvd_search: обе модели извлекают ключ запроса, но теряют многословные поисковые термины (например, при запросе по GitLab CVE модель выдает только «GitLab»). При строгом сравнении это считается ошибкой, однако при смягчении критериев (зачет подстроки) точность возрастает до 0,321 для 600M и 0,357 для 1B. Это подтверждает, что модели справляются с извлечением существительных, но не с полным извлечением свободных текстовых фрагментов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/soft-miss.html\"&gt;Мягкий промах»&lt;/a&gt; (soft miss) — это ситуация, когда модель правильно определила необходимость вызова инструмента, но допустила ошибку в конкретных параметрах или синтаксисе команды.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ влияния регистра показал, что модель 600M крайне чувствительна к стилистике: при переходе от разговорного стиля к техническому (terse_control) её точность падает с 0,505 до 0,200. Исправленная 1B остается стабильной (0,532 → 0,500). Что касается языкового фактора, то видимое превосходство английского языка над испанским (0,957 против 0,580 у 600M) является артефактом структуры датасета, а не реальной способностью модели, так как распределение шаблонов по языкам было несбалансированным.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Высокие показатели «подавления» у исходной модели 1B являются ложными: модель просто почти не вызывала инструменты, что формально давало высокий балл по оси отсутствия вызовов, но фактически означало неработоспособность функции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ablyaciya-recepta-obucheniya-faktornyj-analiz-korpusa-i-skorosti-obucheniya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#ablyaciya-recepta-obucheniya-faktornyj-analiz-korpusa-i-skorosti-obucheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Абляция рецепта обучения: факторный анализ корпуса и скорости обучения&lt;/span&gt;&lt;/a&gt;Абляция рецепта обучения: факторный анализ корпуса и скорости обучения&lt;/h4&gt;\n&lt;p&gt;В данном разделе авторы изолируют два ключевых компонента «рецепта C» — разнообразие обучающего корпуса и скорость обучения (learning rate, LR), исключив ранее протестированные «теплую» инициализацию и таблицу эмбеддингов. Эксперимент включает пять прогонов с фиксированным размером батча (32) и количеством шагов (2202). Чтобы избежать смешивания факторов, лимит шагов задан жестко, а не через эпохи, что уравнивает количество итераций оптимизатора для узкого и разнообразного корпусов. Узкий корпус состоит из 12 801 примера (набор tool-SFT и 10 тыс. образцов кибер-рассуждений), а разнообразный включает дополнительно 23 502 примера из смеси OpenAssistant. Используются два значения LR: высокий (1 × 10⁻⁵) и низкий (2 × 10⁻⁶).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Факторный анализ показал, что при 2202 шагах все модели достигают почти полного запоминания обучающего корпуса, независимо от вариаций LR или состава данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Техническая реализация отличается от основного рецепта C: из-за ограничений оборудования (Turing T4 без поддержки bf16) обучение проводилось в формате fp16 с мастер-весами fp32, 8-битным AdamW и градиентным чекпоинтингом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/8-bitnyy-optimizator.html\"&gt;8-битный оптимизатор&lt;/a&gt; — метод сжатия состояния оптимизатора, позволяющий экономить память, но потенциально влияющий на точность вычислений по сравнению с полным форматом bf16.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты данного раздела нельзя напрямую сравнивать с основными данными статьи из-за различий в точности вычислений (mantissa) и режиме обучения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При проверке на протоколе дословного воспроизведения (n=269) все пять моделей показали результаты, близкие к «потолку» (1.000), что подтверждает ожидаемую сходимость моделей к запоминанию данных при заданном объеме обучения. Для оценки обобщающей способности используется набор из 238 промптов, где сравнение проводится попарно с использованием теста Мак-Немара и парного бутстрепа.&lt;/p&gt;\n&lt;h4 id=\"rezultaty-faktornogo-analiza\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#rezultaty-faktornogo-analiza\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты факторного анализа&lt;/span&gt;&lt;/a&gt;Результаты факторного анализа&lt;/h4&gt;\n&lt;p&gt;Исследование включало 36 статистических сравнений по шести ключевым показателям (Таблица 10). Для контроля ложноположительных результатов применялась поправка Бенджамини–Хохберга при q=0,05. Из всех тестов значимыми оказались лишь четыре: влияние состава корпуса на подавление (suppression), избыточное срабатывание (over-triggering) и корректность инструментов (tool correctness) при низкой скорости обучения (LR), а также влияние корпуса на корректность инструментов в узком корпусе. Сравнение с использованием разных случайных начальных чисел (seeds) показало, что агрегированные показатели могут скрывать значительную вариативность: две модели с «разнообразным» корпусом и высокой LR имели идентичный средний результат (0,6024), но различались по 6 конкретным задачам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основной вывод: при высокой скорости обучения состав корпуса не влияет на результат, а предполагаемое преимущество «разнообразного» корпуса в подавлении не подтвердилось при повторных запусках.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vliyanie-korpusa-i-skorosti-obucheniya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#vliyanie-korpusa-i-skorosti-obucheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние корпуса и скорости обучения&lt;/span&gt;&lt;/a&gt;Влияние корпуса и скорости обучения&lt;/h4&gt;\n&lt;p&gt;При низкой LR (2×10⁻⁶) переход от узкого к разнообразному корпусу существенно улучшает показатели: подавление вырастает с 0,375 до 0,583 (p=6×10⁻⁵), а избыточное срабатывание снижается с 0,625 до 0,403 (p=3×10⁻⁵). Корректность инструментов также растет (0,685 → 0,759, p=0,004). Однако при высокой LR (1×10⁻⁵) различия между корпусами исчезают: показатели по всем осям становятся статистически неразличимыми (p &amp;gt; 0,42). Увеличение LR в узком корпусе значимо повышает корректность инструментов (+0,098, p=4×10⁻⁴), тогда как в разнообразном корпусе эффект LR нестабилен и зависит от начального числа.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод: «Факторный анализ» здесь подразумевает систематическое изменение двух переменных (корпус и скорость обучения) для оценки их независимого и совместного вклада в итоговую точность модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"proverka-vosproizvodimosti\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#proverka-vosproizvodimosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проверка воспроизводимости&lt;/span&gt;&lt;/a&gt;Проверка воспроизводимости&lt;/h4&gt;\n&lt;p&gt;Частичная репликация (на 40% обучения, шаг 880) показала, что вариативность между запусками с разными seed в рамках одной ячейки (узкий корпус/низкая LR) сопоставима с эффектом смены корпуса. В частности, второй seed для узкого корпуса продемонстрировал показатели подавления, идентичные разнообразному корпусу, что опровергает гипотезу о доминировании «разнообразия» в этом аспекте. Тем не менее, преимущество разнообразного корпуса в корректности инструментов подтвердилось при сравнении с обоими seed узкого корпуса. В итоге, модель с узким корпусом и низкой LR оказалась самой слабой, но не провальной, что подтверждает обоснованность выбора конфигурации с разнообразным корпусом и высокой LR в качестве оптимальной.&lt;/p&gt;\n&lt;h4 id=\"doobuchenie-sft-modeli-600m-i-proverka-distillyacii\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#doobuchenie-sft-modeli-600m-i-proverka-distillyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Дообучение (SFT) модели 600M и проверка дистилляции&lt;/span&gt;&lt;/a&gt;Дообучение (SFT) модели 600M и проверка дистилляции&lt;/h4&gt;\n&lt;p&gt;Исследователи проанализировали, помогает ли специализированное дообучение (SFT) модели с 600 млн параметров (600M) лучше определять необходимость вызова инструментов и повышает ли эффективность использование данных, дистиллированных из более крупной модели (GLM-5.3). Эксперимент проводился на чекпоинте 154K и включал 1200 шагов обучения с темпом 1.5 × 10⁻⁵, длиной последовательности 2048 токенов и эффективным размером батча 32 на одном GPU L4. Базовая модель обучалась на 17 801 записи (корпус инструментов и логические цепочки), а дистиллированная версия дополнительно получила 4443 записи, основанные на реальных записях NVD CVE и правилах Sigma. Оценка проводилась на наборе из 238 промптов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Добавление дистиллированных данных не показало статистически значимого эффекта: разница в результатах между группами составила 0,00 с доверительным интервалом [-0.036, +0.036].&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты, представленные в таблице, показывают, что обе версии SFT повысили долю успешных вызовов (0,548 против 0,428 у базовой модели) и точность извлечения сущностей (0,71 против 0,56). Однако SFT не научило модель корректно определять, когда вызов не требуется. Если исходная модель 600M корректно воздерживалась от вызова в 35,4% случаев, то после SFT этот показатель упал практически до нуля. Модель начала вызывать инструменты в 70 из 72 случаев, где вызов был не нужен. Это подтверждает гипотезу о том, что обучение на корпусе, где почти каждый ответ содержит вызов, смещает поведение модели в сторону избыточной активности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка проводилась на малом объеме данных с использованием одного случайного зерна (seed), что ограничивает возможность выявления слабых эффектов, однако исключает наличие значительного положительного влияния дистилляции.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"intervenciya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#intervenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интервенция&lt;/span&gt;&lt;/a&gt;Интервенция&lt;/h4&gt;\n&lt;p&gt;Результаты исследования охватывают четыре ключевых сценария: (a) модель объемом 600 млн параметров, обученная лишь на 0,1% кода, демонстрирует способность генерировать корректный JSON для вызова инструментов; (b) модель объемом 1,1 млрд параметров с акцентом на веб-данные и специализированным этапом SFT (обучение с учителем) на 6 млрд токенов не проявляет этих способностей до вмешательства; (c) диагностический метод дообучения позволяет модели 1,1 млрд параметров освоить работу с инструментами за 2202 шага на одном GPU; (d) факторный анализ показал, что все конфигурации обучения внедряют формат вызова, различаясь лишь способностью подавлять нежелательный вывод.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Состав обучающих данных определяет, будет ли модель «из коробки» работать со структурированным выводом или потребует сложной инженерной доработки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Первоначальная гипотеза о том, что только код-ориентированные данные гарантируют структурированный вывод, была опровергнута результатом (c). Теперь мы утверждаем, что вопрос не в принципиальной возможности, а в сложности активации навыка. Объем токенов SFT не является предиктором успеха: специализированный этап обучения (b), который был в 1000 раз масштабнее успешного метода (c), не привел к желаемому результату. Успех метода (c) обусловлен не объемом данных, а структурой: преобладанием диалоговых форматов над широкими смесями данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SFT (Supervised Fine-Tuning) — метод дообучения модели на размеченных примерах «вопрос-ответ» для адаптации к конкретным задачам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Факторный анализ (d) показал, что разнообразие контекста (разговорный стиль, логика, инструменты) не является обязательным при высоком темпе обучения (learning rate). При низком темпе обучения более разнообразные наборы данных лучше подавляли ошибки, однако вариативность между запусками с одинаковыми параметрами оказалась сопоставима с различиями между разными типами данных, что оставляет вопрос о влиянии разнообразия открытым.&lt;/p&gt;\n&lt;h4 id=\"pochemu-intensivnoe-obuchenie-na-kode-ustanavlivaet-povedenie-po-umolchaniyu\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#pochemu-intensivnoe-obuchenie-na-kode-ustanavlivaet-povedenie-po-umolchaniyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Почему интенсивное обучение на коде устанавливает поведение по умолчанию?&lt;/span&gt;&lt;/a&gt;Почему интенсивное обучение на коде устанавливает поведение по умолчанию?&lt;/h4&gt;\n&lt;p&gt;Механистический анализ показывает, что преимущество моделей, обученных на коде, объясняется тремя факторами. Во-первых, это частота токенов: в коде символы форматирования (фигурные скобки, кавычки, двоеточия) встречаются постоянно, тогда как в обычном тексте они редки. Модель с 65% долей кода в обучении присваивает этим токенам высокую базовую вероятность, в то время как «прозаическая» модель сталкивается с огромным дефицитом логарифмической вероятности при попытке их генерации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Обучение на коде создает «базовую ставку» вероятности: модель считает генерацию структурных элементов (JSON, YAML) дешевым и естественным продолжением любого текста.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Во-вторых, код обучает модель жестким синтаксическим ограничениям. В отличие от обычного текста, код требует баланса скобок и парности кавычек. Миллиарды примеров в обучающей выборке закрепляют эти правила, что позволяет модели успешно генерировать структурированные данные даже в новых, ранее не встречавшихся контекстах.&lt;/p&gt;\n&lt;p&gt;В-третьих, проблема заключается в маршрутизации (routing) скрытых состояний. Исследования эмбеддингов (§6.6) показывают, что вектор токена &amp;lt;/tool_call/&amp;gt; в модели 1B был корректным, но модель не умела направлять к нему скрытые состояния. Ремонт (дообучение) создал механизм маршрутизации, который активируется при необходимости. В тестах на новых промптах исправленная модель 1B верно выбирает инструмент в 71,7% случаев из 166 и извлекает аргументы в 66,7% случаев.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель 600M не обладает полноценным механизмом маршрутизации: она просто «перепроизводит» вызовы функций, так как считает их вероятным продолжением любого диалога, даже если вызов не требуется.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ на 72 промптах без вызова функций (§6.8) подтвердил, что модель 600M ошибочно инициирует вызовы в 64,6% случаев на нейтральных темах и в 91,3% случаев, если в вопросе просто упоминается технический термин (например, CVE). Специализированное SFT (дообучение) для модели 600M (§6.10) не создает «&lt;a href=\"concepts/gate.html\"&gt;ворота»&lt;/a&gt; (gate) для отключения вызовов, а лишь повышает точность самих вызовов, при этом полностью подавляя ответы на нейтральные запросы.&lt;/p&gt;\n&lt;h4 id=\"soglasovanie-metrik-f1-i-f2-dlya-modeli-1b\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#soglasovanie-metrik-f1-i-f2-dlya-modeli-1b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Согласование метрик F1 и F2 для модели 1B&lt;/span&gt;&lt;/a&gt;Согласование метрик F1 и F2 для модели 1B&lt;/h4&gt;\n&lt;p&gt;Наблюдаемое противоречие между результатами §6.7 и §6.8 объясняется различием измеряемых величин. Метрика F1 (отношение вероятностей no-call к call) является относительной и оценивается внутри распределения: при значениях вероятностей, близких к нулю, модель демонстрирует соотношение 10³–10⁴, что характеризует архитектуру контекста, а не реальное поведение при генерации. Метрика F2 (частота избыточного срабатывания) является абсолютной и оценивается вне распределения: она показывает, как часто модель, уже умеющая вызывать инструменты, ошибается на новых, ранее не виденных данных. Исправленная модель 1B обладает корректно настроенным механизмом «ворот» (gate), но его покрытие ограничено: он не переносится на новые формы данных. Тем не менее, 1B превосходит 600M по подавлению ложных срабатываний (0,604 против 0,354 для чистых промптов и 0,174 против 0,087 для near-miss), что подтверждает наличие у 1B хотя бы частично работающего механизма маршрутизации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исправленная модель 1B обладает структурой «ворот», но не имеет достаточного охвата для новых данных, при этом всё равно превосходя 600M в точности подавления вызовов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Ворота» (gate) — это механизм в архитектуре модели, который определяет, должен ли быть вызван внешний инструмент в ответ на запрос пользователя.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sft-svyazyvanie-protiv-postroeniya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#sft-svyazyvanie-protiv-postroeniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;SFT: связывание против построения&lt;/span&gt;&lt;/a&gt;SFT: связывание против построения&lt;/h4&gt;\n&lt;p&gt;Разница в затратах на обучение между 600M и 1B фундаментальна. Для модели 600M процесс SFT (Supervised Fine-Tuning) сводился к «связыванию» уже имеющейся базовой способности выводить данные в формате ключ-значение с триггерным токеном, что потребовало около 10⁷ токенов. Для 1B потребовалось «построение» механизма маршрутизации, который отсутствовал после предобучения. Это удалось реализовать только при использовании разнообразных контекстов в режиме помощника и повышенной скорости обучения (LR), затратив те же 10⁷ токенов. Основная цена здесь — не количество токенов, а диагностика: без точной локализации ошибки модель 1B казалась неспособной к выполнению задачи.&lt;/p&gt;\n&lt;h4 id=\"obobshenie-registra\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#obobshenie-registra\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обобщение регистра&lt;/span&gt;&lt;/a&gt;Обобщение регистра&lt;/h4&gt;\n&lt;p&gt;Результаты подтверждают, что синтаксический регистр (структурированный вывод в скобках против свободного текста) доминирует в поведении модели. Последующая настройка может переопределить это поведение только в том случае, если она направлена на конкретный тип сбоя. Практический вывод для малых моделей: либо изначально формировать обучающую выборку в нужном стиле, либо закладывать бюджет на сложный цикл диагностики и исправления, описанный в данной работе.&lt;/p&gt;\n&lt;h4 id=\"prakticheskie-rekomendacii\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#prakticheskie-rekomendacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Практические рекомендации&lt;/span&gt;&lt;/a&gt;Практические рекомендации&lt;/h4&gt;\n&lt;p&gt;Для команд, разрабатывающих компактные модели (менее 1 млрд параметров) с ограниченным бюджетом, предлагаются следующие шаги: (i) рассматривать долю кода и структурированного текста в обучающей выборке как фундаментальный параметр архитектуры, а не просто метрику для бенчмарков; (ii) внедрить логирование вероятностей первого токена P(&amp;lt;/tool_call/&amp;gt;) как телеметрию обучения. Это почти не требует ресурсов, но, как показал анализ, позволило бы выявить сбой на этапе 38К шагов (около 40 млрд токенов предобучения) задолго до его фактического обнаружения. Важно логировать как литеральные, так и очищенные от пробелов варианты, так как их значения могут различаться на 13 порядков; (iii) внедрить строгую структурную проверку для всех бенчмарков использования инструментов, так как простые ключевые слова часто дают ложноположительные результаты; (iv) при неудачах в SFT (обучении с учителем) не делать поспешных выводов о недостижимости навыка: рецепты A и C показали, что провал на 6 млрд токенов может соседствовать с успехом на 107 млрд, а вариативность результатов сильно зависит от случайных факторов; (v) дополнять оценку на обучающем корпусе тестами на &lt;a href=\"concepts/obobschenie.html\"&gt;обобщение&lt;/a&gt; с новыми промптами, чтобы отличить реальное обучение от зазубривания.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование строгих структурных проверок и мониторинг вероятностей первого токена позволяют выявить критические ошибки обучения на ранних этапах, экономя ресурсы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Пункт (iii) был подтвержден в ходе работы над статьей. При проверке контрольной точки L5 формальный инструмент оценки показал 0/8 успешных вызовов, тогда как строгая диагностика — 8/8. Причина крылась в библиотеке токенизатора, которая по умолчанию удаляла специальные токены перед сравнением строк. Однострочное исправление логики декодирования восстановило результат до 8/8. Аналогичные ошибки были найдены в GGUF-экспортере и производственных циклах агентов. Эти ошибки приводили к ложным выводам о неспособности моделей, что ранее приводило к необоснованной перебалансировке корпусов. Мы признаем это как подтверждение нашего тезиса: даже внутри проекта, изучающего проблему, скрытые ошибки в инструментах оценки могут маскироваться под проблемы самой модели.&lt;/p&gt;\n&lt;h4 id=\"predlagaemye-dalnejshie-eksperimenty\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#predlagaemye-dalnejshie-eksperimenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Предлагаемые дальнейшие эксперименты&lt;/span&gt;&lt;/a&gt;Предлагаемые дальнейшие эксперименты&lt;/h4&gt;\n&lt;p&gt;Эксперименты ранжированы по стоимости: F1 и F2 требуют только CPU, F3 — одного небольшого GPU, а F4 — значительных вычислительных мощностей для предобучения.&lt;/p&gt;\n&lt;h4 id=\"f1-traektornye-zondy-na-arhivnyh-chekpointah\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f1-traektornye-zondy-na-arhivnyh-chekpointah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F1: Траекторные зонды на архивных чекпоинтах&lt;/span&gt;&lt;/a&gt;F1: Траекторные зонды на архивных чекпоинтах&lt;/h4&gt;\n&lt;p&gt;Мы провели проверку предсказания о том, что вероятность вызова инструмента P(&amp;lt;/tool_call/&amp;gt;) для 600M-модели будет расти по мере накопления SFT-данных, тогда как для 1B-модели этот показатель застопорится или ухудшится во второй фазе обучения. Анализ 15 чекпоинтов 600M и 23 чекпоинтов 1B подтвердил, что вторая фаза обучения 1B фактически стерла ранее приобретенные навыки. 600M-модель достигла насыщения уже на первом архивном чекпоинте. Выявлено, что поведение 600M по умолчанию — это безусловная базовая ставка, а не логический гейт, а в третьей фазе 1B-модели зонд и B4 движутся в противоположных направлениях.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Вторая фаза обучения 1B-модели не просто не сформировала навык, а разрушила уже имевшийся, в то время как 600M-модель достигла предела возможностей на раннем этапе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"f2-diagnostika-masshtabirovaniya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f2-diagnostika-masshtabirovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F2: Диагностика масштабирования&lt;/span&gt;&lt;/a&gt;F2: Диагностика масштабирования&lt;/h4&gt;\n&lt;p&gt;Мы расширили тестирование воспроизведения с n=6 до полного корпуса и обобщения с n=8 до сотен отложенных промптов на трех чекпоинтах. Итоговая выборка составила n=269 для дословного воспроизведения и n=238 для батареи тестов (из них 72 на подавление). 1B-модель после исправления превзошла 600M на промптах с новыми сущностями (p=0.0039), однако 600M оказалась более чувствительной к формату, теряя 30 пунктов при смене стиля. Подавление вызовов не сработало для обеих моделей на «почти верных» (near-miss) промптах (0.087 и 0.174).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«&lt;a href=\"concepts/near-miss-prompty.html\"&gt;Near-miss» промпты&lt;/a&gt; — это запросы, которые очень близки к целевым, но содержат незначительные отклонения, проверяющие устойчивость модели к ошибкам.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"f3-ablyaciya-recepta-ispravleniya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f3-ablyaciya-recepta-ispravleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F3: Абляция рецепта исправления&lt;/span&gt;&lt;/a&gt;F3: Абляция рецепта исправления&lt;/h4&gt;\n&lt;p&gt;Для перехода от корреляционных выводов к причинно-следственным мы провели факторный эксперимент 2×2 (корпус: узкий/разнообразный × LR: 2×10⁻⁶/1×10⁻⁵), запустив 4 ветки по 2202 шага с общим родителем. Использовался полный набор тестов F2. Выяснилось, что при высоком LR разнообразие корпуса не дает значимого эффекта. При низком LR разнообразный корпус превосходит узкий по точности вызова инструментов. Узкий корпус с низким LR показал худшие результаты почти по всем осям. Из-за использования T4-ускорителей (fp16 вместо bf16) результаты требуют осторожной интерпретации, так как наблюдаемая вариативность между запусками с разными сидами сопоставима с измеряемыми эффектами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Из-за ограничений оборудования (T4, fp16) и высокой чувствительности к случайным начальным значениям (сидам), часть выводов носит характер наблюдений, а не строгих доказательств.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"f4-ablyaciya-kompozicii-pri-fiksirovannom-masshtabe\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#f4-ablyaciya-kompozicii-pri-fiksirovannom-masshtabe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F4: Абляция композиции при фиксированном масштабе&lt;/span&gt;&lt;/a&gt;F4: Абляция композиции при фиксированном масштабе&lt;/h4&gt;\n&lt;p&gt;Предлагается обучение 2–3 малых моделей (130–260M) с варьируемой долей кода (10%, 35%, 65%) при фиксированном SFT-сигнале (0,1%). Использование зондов F1 и диагностики F2 позволит установить причинно-следственную связь между долей кода и способностью к вызову инструментов.&lt;/p&gt;\n&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;p&gt;В данной работе мы открыто заявляем об ограничениях исследования, так как некоторые из них могли бы поставить под сомнение более сильные выводы, если бы мы их делали.&lt;/p&gt;\n&lt;p&gt;L1: Модель 600M была заморожена на 64% от запланированного графика. Обучение было прервано на 154 000 шаге из 240 000 (около 10 млрд токенов из 15,7 млрд), и возобновление невозможно, так как облачная инфраструктура была удалена. Модель не прошла фазу косинусного отжига, остановившись на высоком уровне learning rate, что снижает её итоговое качество. Все показатели для 600M отражают незавершенный артефакт.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель 600M является «замороженным» недообученным снимком, что создает консервативное смещение: даже в таком состоянии она демонстрирует эмерджентные свойства.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;L2: Модель не обладает навыками ведения диалога. В отличие от версий Nano и Base, модель 600M не проходила стадию SFT (Supervised Fine-Tuning). Она не отвечает на прямые вопросы (например, о столице Перу или простых вычислениях), хотя сохраняет связность речи на испанском языке. Мы не претендуем на создание полноценного ассистента; наши выводы касаются исключительно генерации структурированных вызовов инструментов.&lt;/p&gt;\n&lt;p&gt;L3: Сравнение пар моделей не является строго контролируемым экспериментом. Различия в количестве параметров (в 1,68 раза), объеме данных (10 млрд против 65 млрд токенов) и архитектуре обучения создают смешивающие факторы. Однако все эти факторы ставят 600M в невыгодное положение по сравнению с 1B. Таким образом, гипотеза о влиянии состава данных остается основной, хотя и требует дополнительной абляции (F4).&lt;/p&gt;\n&lt;p&gt;L4: Диагностика проводилась на малых выборках (n). Проверка дословного воспроизведения включала 6 примеров, а тест на обобщение — 8 новых промптов. Мы делаем лишь качественные выводы: если способность проявляется почти во всех попытках для одной конфигурации и никогда для другой, это указывает на категориальное различие. Условие подавления (suppression) проверялось на n=1 для каждой из 15 контрольных точек. Хотя это
