        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#C33\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#E86A6A\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"84\" cy=\"117\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"676\" cy=\"166\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · IMAGE_FORENSICS   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;LiteReality-Agent: как&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;превратить сканы комнат в&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;интерактивные 3D-модели с&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;помощью кода&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"Рисунок 1: Реконструкция реальной комнаты с помощью LiteReality-Agent. LiteReality-Agent переосмысливает задачу реконстр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Реконструкция реальной комнаты с помощью &lt;a href=\"concepts/litereality-agent.html\"&gt;LiteReality-Agent&lt;/a&gt;. LiteReality-Agent переосмысливает задачу реконструкции как задачу программирования, в которой агент-программист пишет файл &lt;a href=\"concepts/room-py.html\"&gt;Room.py&lt;/a&gt;, компилируемый в реалистичную, интерактивную и готовую к симуляции трехмерную комнату.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;LiteReality-Agent переосмысляет 3D-реконструкцию, превращая её в задачу программирования. Система использует &lt;a href=\"concepts/rgb-d-skany.html\"&gt;RGB-D сканы&lt;/a&gt; для создания исполняемого файла Room.py, который описывает геометрию и физические свойства интерьера. Агент итеративно уточняет модель, используя инструменты для измерений и проверки коллизий, что делает результат пригодным для симуляций.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Реконструкция 3D-сцены сформулирована как задача написания исполняемого Python-кода.&lt;/li&gt;\n&lt;li&gt;Использование цикла «наблюдение-редактирование-проверка» повышает физическую достоверность сцен.&lt;/li&gt;\n&lt;li&gt;Система превосходит модели Astra и Fable по метрикам визуальной и геометрической точности.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metody-i-tochnost\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#metody-i-tochnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и точность&lt;/span&gt;&lt;/a&gt;Методы и точность&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Метод&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Данные&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Точность&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Где ошибается&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;LiteReality-Agent&lt;/td&gt;\n&lt;td&gt;RGB-D сканы помещений&lt;/td&gt;\n&lt;td&gt;Высшие баллы по визуальным и геометрическим метрикам&lt;/td&gt;\n&lt;td&gt;Зависимость от точности исходного сканирования&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Система работает в два этапа: инициализация сцены и агентское проектирование. На первом этапе алгоритм анализирует данные сканирования, восстанавливает объекты и исправляет ошибки планировки, создавая начальный код Room.py. Затем вступает &lt;a href=\"concepts/observe-edit-verify-cycle.html\"&gt;цикл «наблюдение-редактирование-проверка»&lt;/a&gt;, где агент использует специализированные инструменты для сравнения рендеров, проведения геометрических замеров и верификации физических связей (поддержка объектов, отсутствие столкновений).&lt;/p&gt;\n&lt;p&gt;В отличие от традиционных методов, основанных на облаках точек или простых мешах, LiteReality-Agent создает структурированную среду, готовую к экспорту в симуляторы вроде &lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt;. Система превосходит современные модели, такие как Astra и Fable, по показателям геометрической точности и визуальной реалистичности. Весь процесс остается прозрачным и редактируемым, так как любые изменения вносятся непосредственно в программный код, что обеспечивает высокую воспроизводимость результатов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система полагается на качество исходных RGB-D данных и ограничена текущими возможностями &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;-агентов в понимании сложных пространственных связей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Авторы представляют LiteReality-Agent — агентную систему, предназначенную для трансформации данных RGB-D сканирования в высококачественные, артикулированные и готовые к симуляции 3D-сцены реальных помещений. В основе подхода лежит концепция представления 3D-реконструкции как задачи программирования: агент последовательно собирает данные и редактирует Python-скрипт Room.py, исполнение которого генерирует &lt;a href=\"concepts/idt.html\"&gt;цифровой двойник&lt;/a&gt; пространства.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent превосходит современные модели Astra и Fable по геометрической точности, визуальному реализму и совместимости с симуляторами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система функционирует на базе цикла «наблюдение — редактирование — верификация». Этот механизм обеспечивает сбор доказательств, проведение измерений, проверку корректности, оптимизацию планировки и контроль качества на всех этапах работы. Такой подход позволяет создавать сцены, пригодные для обучения воплощенного ИИ (&lt;a href=\"concepts/embodied-ai.html\"&gt;embodied AI&lt;/a&gt;).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Воплощенный ИИ (Embodied AI) — это направление, где интеллектуальные агенты обучаются взаимодействовать с физическим миром, используя виртуальные среды для отработки навыков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;LiteReality-Agent выступает как эффективный фреймворк для оркестрации, предоставляя агентам специализированные инструменты и структурированные рабочие процессы. Авторы отмечают, что предложенная архитектура значительно повышает надежность реконструкции. Исходный код системы и приложение для захвата данных находятся в открытом доступе для дальнейшего использования в задачах переноса из реальности в симуляцию (real-to-sim).&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"sozdanie-funkcionalnyh-cifrovyh-dvojnikov\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#sozdanie-funkcionalnyh-cifrovyh-dvojnikov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Создание функциональных цифровых двойников&lt;/span&gt;&lt;/a&gt;Создание функциональных цифровых двойников&lt;/h4&gt;\n&lt;p&gt;Разработка цифровых двойников, пригодных для физического моделирования, является ключевой задачей в области обратной графики. В отличие от методов реконструкции на основе облаков точек или стандартных сеток, авторы стремятся создать структурированную среду, готовую к взаимодействию и симуляции. Это требует комплексного подхода: понимания структуры сцены, восстановления геометрии и артикуляции объектов, оценки их физических свойств и пространственных связей. Ранее для этого использовали CAD-моделирование, композиционную реконструкцию из изображений или методы дифференцируемого рендеринга. Однако создание масштабируемой системы, превращающей реальные сканы в качественные интерактивные среды, остается сложной задачей. Существующие решения, такие как LiteReality, ограничены детерминированными алгоритмами, а современные подходы на базе LLM (Holodeck, SceneCraft, SceneSmith) фокусируются на генерации, но не всегда опираются на реальные данные наблюдений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent — это агентная система, которая преобразует RGB-D сканы помещений в исполняемый код Room.py, обеспечивая создание физически корректных и редактируемых 3D-сред.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"arhitektura-litereality-agent\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#arhitektura-litereality-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Архитектура LiteReality-Agent&lt;/span&gt;&lt;/a&gt;Архитектура LiteReality-Agent&lt;/h4&gt;\n&lt;p&gt;Система LiteReality-Agent использует концепцию «реконструкция как программирование». Вся сцена описывается исполняемым файлом Room.py, который служит рабочим пространством. Процесс состоит из двух этапов: инициализации и агентного проектирования. На этапе инициализации объекты восстанавливаются из изображений, а Layout Agent исправляет ошибки сканирования, устраняя коллизии и проверяя физическую поддержку объектов. Затем запускается цикл «наблюдение-редактирование-верификация». Агент использует инструменты для рендеринга, геометрических измерений и редактирования сцены. Физические свойства и геометрия столкновений оцениваются аналогично подходу Articraft. Использование Python-кода позволяет легко модифицировать сцену с помощью естественного языка.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/agentic-system.html\"&gt;Агентный подход&lt;/a&gt; (agentic system) — это программная архитектура, где &lt;a href=\"concepts/ai-agent.html\"&gt;ИИ-агент&lt;/a&gt; самостоятельно планирует действия, использует инструменты и проверяет результаты для достижения сложной цели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность системы напрямую зависит от точности первичных RGB-D сканов и способности агента интерпретировать геометрические ограничения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenka-i-rezultaty\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#ocenka-i-rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка и результаты&lt;/span&gt;&lt;/a&gt;Оценка и результаты&lt;/h4&gt;\n&lt;p&gt;Авторы провели тестирование на реальных интерьерах, сравнив LiteReality-Agent с детерминированным конвейером LiteReality и универсальными агентами (GPT-6 Astra, Fable 5.1). Оценка проводилась по метрикам визуальной точности, геометрической достоверности и экспертным оценкам. Система показала лучшие результаты по всем показателям, подтвердив свою эффективность как фреймворк для переноса реальных данных в симуляцию.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/span&gt;&lt;/a&gt;СВЯЗАННЫЕ РАБОТЫ&lt;/h4&gt;\n&lt;p&gt;Реконструкция помещений и переход от реальности к симуляции. Существующие подходы делятся на объектно-ориентированные, которые подбирают CAD-модели под данные наблюдений, и нейронные представления, восстанавливающие геометрию и внешний вид сцены. Современные системы, такие как LiteReality и MetaScenes, преобразуют сканы в среды на основе ассетов. Инструменты вроде Video2Game, DRAWER и HoloScene восстанавливают интерактивные миры из видео, причем DRAWER дополнительно определяет артикуляцию объектов. Для обучения роботов используются решения типа Phone2Proc (процедурная генерация из мобильных сканов), RialTo и PolaRiS (создание цифровых двойников для отработки стратегий), а также ACDC, создающий «цифровых кузенов» на основе схожих объектов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Современные методы реконструкции перешли от простого подбора ассетов к генерации интерактивных сред, где артикуляция и физические свойства объектов восстанавливаются через итеративные агентные циклы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Генерация объектов и артикуляция. Методы преобразования изображений в 3D варьируются от синтеза нескольких ракурсов до использования крупных генеративных моделей. CAST интегрирует сгенерированные объекты в сцену, а URDFormer выводит артикулированные среды из изображений. Подходы вроде Real2Code, Articulate-Anything и Articraft используют программный код для описания артикуляции, сочетая генерацию с валидацией через специализированные SDK.&lt;/p&gt;\n&lt;p&gt;Языковое управление и агентная графика. Системы LayoutGPT, Holodeck и FirePlace используют естественный язык для создания планировок, тогда как 3D-GPT и SceneCraft применяют языковые модели для программного 3D-моделирования. Агентные подходы, такие как VIGA, Thinking in Blender и HARMONY, используют циклы «код-рендеринг-проверка» для уточнения сцены по одному изображению. LiteReality-Agent развивает этот подход, обеспечивая метрическую точность RGB-D реконструкции с проверкой коллизий и поддержкой многоракурсной верификации.&lt;/p&gt;\n&lt;h4 id=\"litereality-agent\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#litereality-agent\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;LITEREALITY-AGENT&lt;/span&gt;&lt;/a&gt;LITEREALITY-AGENT&lt;/h4&gt;\n&lt;p&gt;LiteReality-Agent работает в два этапа: инициализация сцены (определение планировки и основных объектов) и агентное проектирование, где исполняемый код сцены уточняется через цикл «наблюдение–редактирование–проверка» (Рис. 2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f2.jpg\" alt=\"Рисунок 2: Сквозной конвейер LiteReality-Agent.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Сквозной &lt;a href=\"concepts/pipeline.html\"&gt;конвейер&lt;/a&gt; LiteReality-Agent.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 2: Сквозной конвейер LiteReality-Agent. RGB–D сканы и распознавание направляют исправление макета и реконструкцию объектов для создания исполняемой начальной комнаты. Агент редактирования дорабатывает Room.py с помощью цикла «наблюдение — редактирование — проверка», используя снимки ракурсов, измерения, материалы и рендерные сравнения. Шлюзы контроля ограничивают редактирование и проверяют геометрию и опору. Редактируемая сцена и физические метаданные поддерживают экспорт в MuJoCo.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;3.1 ВХОДНЫЕ ДАННЫЕ: RGB-D СКАНЫ И РЕЗУЛЬТАТЫ ДЕТЕКЦИИ. Система принимает данные из приложения LiteRealityScan, включая геометрию комнаты и ограничивающие рамки (bounding boxes) объектов.&lt;/p&gt;\n&lt;p&gt;3.2 ИНИЦИАЛИЗАЦИЯ СЦЕНЫ. Мы следуем методологии LiteReality, разделяя реконструкцию оболочки комнаты и объектов. Агент планировки строит граф сцены, учитывая связи поддержки (например, стул на полу) и функциональные группы. Геометрические проверки выявляют ошибки: объекты вне комнаты, «застрявшие» в стенах или не имеющие опоры. Исправления вносятся детерминированно или через рассуждения на основе изображений. Реконструкция объектов включает генерацию чистых референсных изображений для каждого элемента. Статичные объекты обрабатываются моделью TRELLIS.2, а артикулированные — через процедурную генерацию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/algorithm-1.html\"&gt;Агентный цикл&lt;/a&gt; (Algorithm 1) — это процесс, где LLM анализирует текущее состояние среды, выполняет действия по исправлению кода (Room.py) и проверяет результат через инструменты контроля качества (Таблица 1), повторяя это до достижения консистентности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"33-agentskoe-proektirovanie\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#33-agentskoe-proektirovanie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3 Агентское проектирование&lt;/span&gt;&lt;/a&gt;3.3 Агентское проектирование&lt;/h4&gt;\n&lt;p&gt;Процесс создания сцены представляет собой итеративный цикл, в котором агент анализирует данные съемки, корректирует программный код сцены и проверяет результаты через рендеринг и геометрические тесты. Таблица 1 содержит перечень инструментов, используемых агентом для манипуляций с объектами и пространством.&lt;/p&gt;\n&lt;h4 id=\"331-instrumenty-verifikacii\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#331-instrumenty-verifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3.1 Инструменты верификации&lt;/span&gt;&lt;/a&gt;3.3.1 Инструменты верификации&lt;/h4&gt;\n&lt;p&gt;Агент работает на трех уровнях детализации: комната, стена или отдельный объект. На уровне комнаты выбираются кадры, обеспечивающие максимальный охват стен. На уровне стены приоритет отдается ракурсам с наибольшей проективной площадью. Для объектов используются данные о видимости из манифеста рендеринга, чтобы найти наиболее четкие ракурсы. Минимальное разделение кадров исключает дублирование данных. Сравнение рендеров с фотографиями (Рис. A7a–c) позволяет локализовать несоответствия: если в масштабе комнаты обнаружена ошибка, агент переключается на конкретный объект или поверхность для изолированной проверки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/render-sravnenie.html\"&gt;Рендер-сравнение&lt;/a&gt; — метод верификации, при котором виртуальная модель сцены накладывается на реальное фото с использованием идентичных параметров камеры для выявления отклонений в геометрии или текстурах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для работы со стенами кадры проецируются на метрическую плоскость, формируя единое изображение с сеткой координат для точного измерения расстояний и высоты (Рис. A8d). Это позволяет точно размещать объекты в коде Room.py. Для PBR-текстур (физически корректный рендеринг) агент подбирает карты материалов и корректирует их цвет под реальные наблюдения. Процесс проектирования разбит на четыре этапа: настройка материалов стен, добавление освещения и фурнитуры, расстановка мелких объектов и уточнение процедурных моделей. Объекты группируются с указанием связей (например, «лежит на» или «прикреплен к»), что упрощает последующее редактирование.&lt;/p&gt;\n&lt;h4 id=\"332-kontrol-i-proverka-kachestva\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#332-kontrol-i-proverka-kachestva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3.2 Контроль и проверка качества&lt;/span&gt;&lt;/a&gt;3.3.2 Контроль и проверка качества&lt;/h4&gt;\n&lt;p&gt;Поскольку автоматическое определение завершенности сцены затруднено, используется система лимитов на количество итераций и вызовов инструментов. В последние 10% лимита агент переходит в режим финализации, отключая исследовательские функции для сохранения текущих правок. Геометрическая проверка включает поиск пересечений мешей (коллизий) и оценку опорных поверхностей. Если объект «парит» над столом или пересекается с ним, агент вычисляет корректирующие сдвиги и обновляет код Room.py. Таблица 3 содержит итоговые метрики по пересечениям и корректности опор.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование жестких лимитов на итерации и автоматизированных геометрических проверок позволяет минимизировать ошибки позиционирования объектов и обеспечить физическую корректность сцены.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"34-eksport-dlya-simulyacii\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#34-eksport-dlya-simulyacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.4 Экспорт для симуляции&lt;/span&gt;&lt;/a&gt;3.4 Экспорт для симуляции&lt;/h4&gt;\n&lt;p&gt;Финальная сцена экспортируется в среду MuJoCo. Стационарные элементы (стены, встроенная мебель) фиксируются, а подвижные объекты получают свободные сочленения (шарнирные или слайдеры). Экспортер сохраняет физические свойства, такие как масса, инерция и геометрия столкновений, обеспечивая готовность сцены к физическому моделированию.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"41-eksperimentalnaya-ustanovka\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#41-eksperimentalnaya-ustanovka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1 Экспериментальная установка&lt;/span&gt;&lt;/a&gt;4.1 Экспериментальная установка&lt;/h4&gt;\n&lt;p&gt;Исследователи провели оценку LiteReality-Agent на десяти внутренних сценах, включающих 620 ракурсов съемки. В качестве базовых моделей использовались LiteReality и два универсальных агента: GPT-6 (в среде Codex) и Fable 5.1 (в Claude Code). Универсальные агенты тестировались в двух режимах: только по RGB-фотографиям и с использованием данных сканирования LiteReality (+Scan), включающих глубину, калибровку камер, облака точек и планировку RoomPlan. Все методы использовали идентичные исходные фото, а LiteReality и LiteReality-Agent получали одинаковые данные сканирования.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод оценки: все реконструкции выравниваются по системе координат камеры без изменения масштаба сцены и рендерятся в разрешении 960×720. Оценка проводится по тем же точкам обзора, что были при съемке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"42-vizualnaya-tochnost\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#42-vizualnaya-tochnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2 Визуальная точность&lt;/span&gt;&lt;/a&gt;4.2 Визуальная точность&lt;/h4&gt;\n&lt;p&gt;Для оценки применялись метрики SSIM, PSNR, RMSE и LPIPS. Согласно Таблице 2, LiteReality-Agent показал лучшие средние результаты по всем четырем показателям. По сравнению с GPT-6 (+Scan), ближайшим конкурентом, PSNR вырос на 1.162 дБ, а LPIPS снизился на 13.7%. Относительно базовой LiteReality прирост составил 2.248 дБ по PSNR и 19.6% по LPIPS. Качественное сравнение представлено на Рис. 3.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent превосходит все аналоги, улучшая PSNR до 14.129 дБ и снижая LPIPS до 0.5392.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"43-geometricheskaya-soglasovannost-i-fizicheskaya-pravdopodobnost\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#43-geometricheskaya-soglasovannost-i-fizicheskaya-pravdopodobnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.3 Геометрическая согласованность и физическая правдоподобность&lt;/span&gt;&lt;/a&gt;4.3 Геометрическая согласованность и физическая правдоподобность&lt;/h4&gt;\n&lt;p&gt;Оценка включала три параметра: среднюю абсолютную ошибку глубины (&lt;a href=\"concepts/mean-absolute-error.html\"&gt;MAE&lt;/a&gt;) по 611 кадрам, долю мебели, контактирующей с опорными поверхностями (в пределах 1 см), и количество пересечений объектов. Как видно из Таблицы 3, LiteReality-Agent достиг MAE глубины 10.50 см, что на 21.2% лучше, чем у GPT-6 (+Scan). Метод обеспечил 100% контакт мебели с опорами и полное отсутствие пересечений объектов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метрики оценивают физическую правдоподобность, а не полную физическую корректность, так как количество объектов в сценах у разных методов различается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"44-vliyanie-dannyh-skanirovaniya-na-universalnye-agenty\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#44-vliyanie-dannyh-skanirovaniya-na-universalnye-agenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.4 Влияние данных сканирования на универсальные агенты&lt;/span&gt;&lt;/a&gt;4.4 Влияние данных сканирования на универсальные агенты&lt;/h4&gt;\n&lt;p&gt;Добавление данных сканирования значительно улучшило визуальные метрики: PSNR для GPT-6 вырос с 11.549 до 12.967 дБ, а MAE глубины сократилась на 67.1%. Однако это не всегда улучшало компоновку: количество пересечений мебели возросло, а показатель контакта с опорами у GPT-6 снизился с 69.1% до 63.0%.&lt;/p&gt;\n&lt;h4 id=\"46-perceptivnaya-ocenka-lyudmi-i-agentami\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#46-perceptivnaya-ocenka-lyudmi-i-agentami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.6 Перцептивная оценка людьми и агентами&lt;/span&gt;&lt;/a&gt;4.6 Перцептивная оценка людьми и агентами&lt;/h4&gt;\n&lt;p&gt;Эксперты (люди и два агента-оценщика) оценивали точность планировки, сходство объектов и общую схожесть сцен по пятибалльной шкале. LiteReality-Agent получил наивысшие оценки (4.60–5.00), значительно опередив GPT-6 (+Scan) и другие модели (Таблица 4).&lt;/p&gt;\n&lt;h4 id=\"rezultaty-ocenki-kachestva\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#rezultaty-ocenki-kachestva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты оценки качества&lt;/span&gt;&lt;/a&gt;Результаты оценки качества&lt;/h4&gt;\n&lt;p&gt;Агент LiteReality-Agent продемонстрировал превосходство по всем ключевым метрикам человеческой оценки, представленным в Таблице 4. Средние баллы составили: 4,60 за компоновку (layout), 4,58 за сходство объектов (object similarity) и 4,54 за общую схожесть (overall similarity). Эти показатели превышают результаты модели GPT-6 (+Scan) на 1,49, 1,60 и 1,54 балла соответственно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent значительно опережает GPT-6 (+Scan) по всем параметрам, выигрывая в 53 из 65 парных сравнений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В ходе парного тестирования, где участники сравнивали сцены, наш метод одержал победу в 53 случаях из 65, при этом зафиксировано 11 ничьих и лишь одно поражение. Автоматизированные агентные оценщики также поставили LiteReality-Agent на первое место, а GPT-6 (+Scan) — на второе, хотя их итоговые баллы расходятся с оценками людей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничения исследования: малый размер выборки, неравномерный охват сцен и зависимый характер оценок не позволяют подтвердить статистическую значимость или физическую точность метода; оценки агентов лишь дополняют, но не заменяют человеческое суждение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Мы представили LiteReality-Agent — систему с открытым исходным кодом, которая переосмысляет задачу 3D-реконструкции как процесс написания программного кода. Данный подход позволяет преобразовывать RGB-D сканы в детализированные, артикулированные сцены, полностью готовые к симуляции. В основе системы лежит механизм «наблюдение-редактирование-верификация», который объединяет исполняемые программы для описания сцен, специализированный инструментарий и проверку на основе фактических доказательств, что значительно повышает надежность и качество реконструкции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;LiteReality-Agent превосходит существующие модели-агенты по визуальной точности, геометрической согласованности и перцептивному качеству, что подтверждено тестированием на десяти различных сценах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;RGB-D сканы — это данные, содержащие информацию о цвете (RGB) и глубине (D), которые позволяют компьютеру понимать не только внешний вид объектов, но и их удаленность от камеры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;По результатам испытаний на десяти сценах система продемонстрировала существенное преимущество перед базовыми моделями-агентами по ключевым метрикам визуальной достоверности и геометрической точности. По мере развития кодирующих агентов, предложенная нами архитектура оркестрации создает практическую базу для построения надежных систем перехода из реальности в симуляцию (real-to-sim) и дальнейшего развития воплощенного искусственного интеллекта (embodied AI).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f1.jpg\" alt=\"Рисунок 1: Реконструкция реальной комнаты с помощью LiteReality-Agent. LiteReality-Agent переосмысливает задачу реконстр\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Реконструкция реальной комнаты с помощью LiteReality-Agent. LiteReality-Agent переосмысливает задачу реконструкции как задачу программирования, в которой агент-программист пишет файл Room.py, компилируемый в реалистичную, интерактивную и готовую к симуляции трехмерную комнату.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f4.jpg\" alt=\"Рисунок 4: Репрезентативные сравнения реконструкций. Кухня (вверху) и переговорная комната (внизу) с исходными RGB-фотог\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Репрезентативные сравнения реконструкций. Кухня (вверху) и переговорная комната (внизу) с исходными RGB-фотографиями, реконструированными ракурсами и видами облака точек/плана сцены.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-f6.jpg\" alt=\"Рисунок 6: Симуляция и взаимодействие. Реконструированная кухня в MuJoCo после встряхивания и в примере захвата и переме\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Симуляция и взаимодействие. Реконструированная кухня в MuJoCo после встряхивания и в примере захвата и перемещения манипулятором Franka.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS1.jpg\" alt=\"Рисунок A1: Дополнительные сравнения дополняющих ракурсов. В каждом случае показаны входное RGB-изображение и соответств\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A1: Дополнительные сравнения дополняющих ракурсов. В каждом случае показаны входное RGB-изображение и соответствующий RGB–D скан.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS2.jpg\" alt=\"Рисунок A2 дополняет рисунок A1 второй согласованной точкой обзора для каждой комнаты, раскрывая дополнительные области \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A2 дополняет рисунок A1 второй согласованной точкой обзора для каждой комнаты, раскрывая дополнительные области сцены и обеспечивая более широкую оценку согласованности реконструкции между точками обзора. Рисунок A2: Сравнение дополнительных реконструкций во всех оцениваемых комнатах.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS3.jpg\" alt=\"Рисунок A3: От захвата до начальной комнаты. Пример работающей кухни показывает RGB-D облако точек, обнаруженные коробки\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A3: От захвата до начальной комнаты. Пример работающей кухни показывает RGB-D облако точек, обнаруженные коробки и планировку, реконструированную оболочку и собранную начальную сцену. Тонкий внешний вид поверхности, приспособления и мелкие объекты уточняются во время создания.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS4.jpg\" alt=\"Рисунок A4: До и после исправления планировки.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A4: До и после исправления планировки.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок A4: До и после исправления планировки. Планы нарисованы непосредственно на основе сохраненных входных и выходных коробок для трех сцен. Красные контуры в левом столбце обозначают измененные коробки; синие контуры показывают их исправленные состояния справа. Пунктирные красные контуры сохраняют свои исходные площади, а стрелки показывают смещение центра. Каждая пара использует одинаковый масштаб и точку обзора; серые объекты и стены обеспечивают неизменный контекст. Метки в конференц-зале сокращают стулья как C, а телевизор как TV. Это сравнения на этапе планировки, до детальной реконструкции сетки и создания.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS5.jpg\" alt=\"Рисунок A5 показывает оба маршрута реконструкции с использованием чистых эталонов, созданных на основе видов сканировани\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A5 показывает оба маршрута реконструкции с использованием чистых эталонов, созданных на основе видов сканирования.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок A5 показывает оба маршрута реконструкции с использованием чистых эталонов, созданных на основе видов сканирования. Необработанные захваты остаются доказательством для проверки точности: завершенные окклюдированные части являются оценками. Рисунок A5: Реконструкция объектов на основе эталонов захвата. Каждый ряд показывает захваченные виды, очищенный эталон и реконструированный актив. Шкаф под раковину использует процедурную геометрию с сочлененными частями; диван использует генерацию изображения в 3D.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS6.jpg\" alt=\"Рисунок A6: Выбор вида в трех масштабах. Запросы по комнате охватывают несколько поверхностей, запросы по стене фокусиру\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A6: Выбор вида в трех масштабах. Запросы по комнате охватывают несколько поверхностей, запросы по стене фокусируются на одном структурном элементе, а запросы по объекту возвращают наблюдения отдельного актива. Цифры идентифицируют кадры захвата.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS7.jpg\" alt=\"Рисунок A7: Свидетельства авторства. (a–c) Пары «рендер — фотография» используют аннотации комнат, стен и объектов для л\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A7: Свидетельства авторства. (a–c) Пары «рендер — фотография» используют аннотации комнат, стен и объектов для локализации несоответствий на прогрессивно более детальных уровнях.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS8.jpg\" alt=\"Рисунок A8: Сшивка стен и метрические измерения.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A8: Сшивка стен и метрические измерения.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок A8: Сшивка стен и метрические измерения. Две стены из текущего примера с кухней выровнены по калиброванным кадрам захвата. (a) Сшитый эталон сохраняет видимые швы и артефакты проекции вокруг выступающей мебели. (b) Его маска покрытия отличает наблюдаемые пиксели (белые) от ненаблюдаемых (черные). (c–d) Вторая сшитая стена показана до и после добавления метрической сетки: красные деления измеряют расстояние вдоль стены, а синие деления — высоту над полом, в метрах. Края маркерной доски можно сопоставить с этой сеткой для определения размещения и размеров в программе сцены.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-fS9.jpg\" alt=\"Рисунок A9: Редактирование сцены на естественном языке. Исходная реконструкция показана с тремя запрошенными изменениями\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок A9: Редактирование сцены на естественном языке. Исходная реконструкция показана с тремя запрошенными изменениями: обнажить кирпичную кладку, освободить пол для летучки стоя и украсить комнату для просмотра чемпионата мира по футболу. Каждая инструкция применяется как изменение в Room.py.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сложность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;создания&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;интерактивных&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;3D-сцен&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Итеративное&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;написание кода&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Room.py&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#C33\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокоточные&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;симуляционные&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;двойники&lt;/text&gt;&lt;path stroke=\"#C33\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#C33\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#E86A6A\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Основа для&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обучения&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;роботов в 3D&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;image_forensics&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Zhening Huang, Yueyan Li, Johnathan Chiu, Xiaoyang Lyu, Matt Zhou, Yuxin Yao, Joan Lasenby, Shangzhe Wu&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt
