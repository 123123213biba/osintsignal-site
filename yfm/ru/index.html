ext":"Открыть канал","url":"https://t.me/oba_boba","theme":"normal-contrast"}]},{"type":"header-block","title":"Приложение для Android","description":"&lt;p&gt;Лента по темам, все рисунки и полный перевод — даже без интернета. Наведите камеру на QR-код.&lt;/p&gt;\n","theme":"dark","width":"m","image":"qr-app.svg","verticalOffset":"s","background":{"color":"#1F7A5C","image":"home-app-5.jpg"},"buttons":[{"text":"Скачать APK","url":"https://vivalyaraza.github.io/biosignal/app/biosignal.apk","theme":"normal-contrast"}]},{"type":"media-block","animated":false,"title":"&lt;p&gt;Как заставить нейросети создавать точные инфографики без галлюцинаций&lt;/p&gt;\n","description":"&lt;p&gt;Создание инфографики с помощью ИИ часто приводит к ошибкам, где текст не совпадает с графикой. Исследователи представили InfoAgent — систему, которая связывает визуальные элементы с источниками данных через граф зависимостей. Это позволяет локально исправлять ошибки, не перерисовывая всё изображение целиком.&lt;/p&gt;\n","media":{"image":"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-card.jpg"},"buttons":[{"text":"Читать","url":"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html","theme":"action"}]},{"type":"card-layout-block","animated":false,"title":{"text":"Свежий выпуск &amp;middot; 03.10.2026","url":"2026-10-03/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground-card.jpg"},"content":{"title":"Как заставить нейросети создавать точные инфографики без галлюцинаций","text":"&lt;p&gt;Новый фреймворк InfoAgent превращает создание инфографики в проверяемый процесс, связывая каждый элемент с реальными данными.&lt;/p&gt;\n","links":[{"url":"2026-10-03/infoagent-traceable-generation-and-repair-of-evidence-ground.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp-card.jpg"},"content":{"title":"Почему нейросети поддакивают: ловушка лести и&amp;nbsp;холодного безразличия","text":"&lt;p&gt;ИИ часто выбирает между слепым согласием и грубостью. Новый бенчмарк FIGS учит модели быть честными, оставаясь эмпатичными.&lt;/p&gt;\n","links":[{"url":"2026-10-03/figs-evaluating-multi-turn-sycophancy-without-penalizing-emp.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval-card.jpg"},"content":{"title":"Почему оптимизация для ИИ-поисковиков работает не&amp;nbsp;так, как вы&amp;nbsp;думали","text":"&lt;p&gt;Один раз попав в ответ нейросети, источник закрепляется там надолго. Разбираем феномен «разговорного захвата».&lt;/p&gt;\n","links":[{"url":"2026-10-03/conversational-capture-a-trajectory-level-framework-for-eval.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 02.10.2026","url":"2026-10-02/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso-card.jpg"},"content":{"title":"Скрытые рассуждения ИИ: почему их&amp;nbsp;сложно научить обману","text":"&lt;p&gt;Могут ли нейросети прятать логику внутри обычного текста? Исследование показало, что это гораздо сложнее, чем кажется.&lt;/p&gt;\n","links":[{"url":"2026-10-02/learning-steganography-is-easy-learning-steganographic-reaso.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention-card.jpg"},"content":{"title":"Цифровой двойник города: как нейросети проектируют изменения в&amp;nbsp;реальности","text":"&lt;p&gt;Вместо дорогостоящих симуляций — ИИ-агент, который предлагает реалистичные правки для улучшения городской среды по фото.&lt;/p&gt;\n","links":[{"url":"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo-card.jpg"},"content":{"title":"LiteReality-Agent: как превратить сканы комнат в&amp;nbsp;интерактивные 3D-модели с&amp;nbsp;помощью кода","text":"&lt;p&gt;Исследователи научили ИИ-агентов превращать обычные RGB-D сканы помещений в полноценные цифровые двойники через написание Python-скриптов.&lt;/p&gt;\n","links":[{"url":"2026-10-02/litereality-agent-an-agentic-system-for-interactable-3d-indo.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to-card.jpg"},"content":{"title":"Почему ваш ИИ-агент &amp;laquo;притворяется&amp;raquo; умным: ловушка бенчмарков","text":"&lt;p&gt;Стандартные тесты часто хвалят маленькие языковые модели за навыки, которых у них нет. Разбираемся, как проверить реальные способности ИИ.&lt;/p&gt;\n","links":[{"url":"2026-10-02/keyword-harnesses-fail-open-a-cheap-diagnostic-ladder-for-to.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc-card.jpg"},"content":{"title":"Планирование с&amp;nbsp;костями: как заставить нейросети генерировать по-настоящему разные ответы","text":"&lt;p&gt;Почему современные ИИ дают скучные ответы и как метод Gacha Decoding меняет правила игры с помощью случайных чисел.&lt;/p&gt;\n","links":[{"url":"2026-10-02/gacha-decoding-eliciting-diverse-generations-through-instruc.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/cobicount-separating-object-and-background-responses-for-rem-card.jpg"},"content":{"title":"Считаем объекты на&amp;nbsp;спутниковых снимках без дообучения нейросетей","text":"&lt;p&gt;Как научить ИИ распознавать корабли и здания в новых регионах, не тратя время на переобучение модели под каждый снимок?&lt;/p&gt;\n","links":[{"url":"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener-card.jpg"},"content":{"title":"Почему обучение нейросетей на&amp;nbsp;контенте от&amp;nbsp;ИИ&amp;nbsp;ведет к&amp;nbsp;деградации моделей","text":"&lt;p&gt;Исследователи выяснили: чем больше сгенерированного ИИ текста в обучающей выборке, тем хуже результат.&lt;/p&gt;\n","links":[{"url":"2026-10-02/how-much-is-an-ai-token-worth-scaling-laws-for-wild-ai-gener.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us-card.jpg"},"content":{"title":"Почему нейросети ошибаются в&amp;nbsp;командах Kali Linux и&amp;nbsp;как это исправить","text":"&lt;p&gt;Разбираем KaliBench — новый бенчмарк, который учит ИИ точно управлять инструментами кибербезопасности без ошибок в синтаксисе.&lt;/p&gt;\n","links":[{"url":"2026-10-02/kalibench-a-fine-grained-benchmark-for-cybersecurity-tool-us.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri-card.jpg"},"content":{"title":"Доверие&amp;nbsp;&amp;mdash; это не&amp;nbsp;оценка: как ограничить власть ИИ-агентов","text":"&lt;p&gt;Почему высокий рейтинг безопасности ИИ не гарантирует надежность системы и как внедрить жесткие правила контроля.&lt;/p&gt;\n","links":[{"url":"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling-card.jpg"},"content":{"title":"Как ИИ&amp;nbsp;помогает проверять факты в&amp;nbsp;соцсетях: опыт Community Notes","text":"&lt;p&gt;Разбираемся, как алгоритмы и краудсорсинг вместе борются с дезинформацией на платформе X.&lt;/p&gt;\n","links":[{"url":"2026-10-02/community-driven-api-and-ai-writer-design-for-openly-scaling.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act-card.jpg"},"content":{"title":"Робот, который помнит прошлое: как научить машину находить спрятанные предметы","text":"&lt;p&gt;Роботы часто теряются, если объект исчез из поля зрения. Новая система BeyondSCe позволяет им «вспоминать» события и находить скрытые цели.&lt;/p&gt;\n","links":[{"url":"2026-10-02/beyond-the-current-scene-event-referential-grasping-with-act.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world-card.jpg"},"content":{"title":"VISTA: как научить нейросети &amp;laquo;вспоминать&amp;raquo; увиденное для решения сложных задач","text":"&lt;p&gt;Новый визуальный интерфейс позволяет ИИ-агентам хранить и пересматривать кадры из прошлого, радикально улучшая точность их действий.&lt;/p&gt;\n","links":[{"url":"2026-10-02/vista-a-visual-harness-for-reasoning-in-an-interactive-world.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"Как устроен ОСИНТ-Сигнал","items":[{"title":"Отбор","text":"&lt;p&gt;Каждый день модель сравнивает десятки свежих исследований и выбирает самые значимые и понятные.&lt;/p&gt;\n"},{"title":"Разбор","text":"&lt;p&gt;Суть, ключевые выводы и ограничения — простым языком, но без упрощений.&lt;/p&gt;\n"},{"title":"Три языка","text":"&lt;p&gt;Каждый материал выходит на русском, узбекском и казахском.&lt;/p&gt;\n"},{"title":"Рисунки и&amp;nbsp;полный текст","text":"&lt;p&gt;Иллюстрации из самих статей, а для открытых лицензий — полный перевод.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Вопросы","items":[{"title":"&lt;p&gt;Это рецензированные статьи?&lt;/p&gt;\n","text":"&lt;p&gt;Нет, это препринты — свежие работы до рецензирования. В каждом материале отмечены ограничения исследования.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Как часто выходят материалы?&lt;/p&gt;\n","text":"&lt;p&gt;Три раза в день: утром, днём и вечером по времени Ташкента и Астаны.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Можно ли использовать тексты?&lt;/p&gt;\n","text":"&lt;p&gt;Да, со ссылкой на ОСИНТ-Сигнал и на исходную статью (DOI указан в каждом материале).&lt;/p&gt;\n"}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ОСИНТ-Сигнал","vcsPath":"index.yaml"},"title":"ОСИНТ-Сигнал"},"router":{"pathname":"index","depth":1,"base":"./"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
