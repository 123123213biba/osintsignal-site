"layout-item","media":{"image":"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-card.jpg"},"content":{"title":"ИИ-дезинформация: как отличить реальную угрозу от&amp;nbsp;цифрового шума","text":"&lt;p&gt;Исследование 112 кейсов ИИ-фейков в Британии показало: не каждый дипфейк опасен, но риски для общества растут.&lt;/p&gt;\n","links":[{"url":"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-card.jpg"},"content":{"title":"Как нейросети видят изменения в&amp;nbsp;3D-пространстве: метод GS-Pool","text":"&lt;p&gt;Ученые научили алгоритмы находить изменения в 3D-сценах, даже если снимки сделаны с разных ракурсов и в разное время.&lt;/p&gt;\n","links":[{"url":"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-card.jpg"},"content":{"title":"Как проверить нейросеть на&amp;nbsp;предвзятость, не&amp;nbsp;взламывая её","text":"&lt;p&gt;Новый метод аудита ALeBi позволяет выявлять дискриминацию в алгоритмах, сохраняя конфиденциальность модели.&lt;/p&gt;\n","links":[{"url":"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for-card.jpg"},"content":{"title":"Машинное обучение против лесных пожаров: как ИИ&amp;nbsp;видит огонь лучше спутников","text":"&lt;p&gt;Алгоритмы CatBoost обнаруживают возгорания быстрее и точнее стандартных систем мониторинга, особенно в ночное время.&lt;/p&gt;\n","links":[{"url":"2026-10-07/comparing-a-gradient-boosting-algorithm-to-the-goes-fdc-for.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc-card.jpg"},"content":{"title":"Почему в&amp;nbsp;комментариях под псевдонаучными видео так много доброты?","text":"&lt;p&gt;Анализ тысяч комментариев на YouTube показал: научные споры полны негатива, а псевдонаука держится на эмоциональной поддержке.&lt;/p&gt;\n","links":[{"url":"2026-10-07/exploring-conversational-dynamics-in-scientific-and-pseudosc.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 06.10.2026","url":"2026-10-06/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-06/language-models-that-play-chess-and-explain-their-moves-card.jpg"},"content":{"title":"Почему шахматные движки молчат: учим ИИ&amp;nbsp;объяснять свои ходы","text":"&lt;p&gt;Новая модель QUEEN объединяет мощь шахматных движков с логикой языковых моделей, чтобы наконец объяснить, почему этот ход — лучший.&lt;/p&gt;\n","links":[{"url":"2026-10-06/language-models-that-play-chess-and-explain-their-moves.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala-card.jpg"},"content":{"title":"Как перестать перечитывать одно и&amp;nbsp;то&amp;nbsp;же: Galahad ускоряет работу LLM в&amp;nbsp;14&amp;nbsp;раз","text":"&lt;p&gt;Модели тратят 98% времени на повторное чтение одних и тех же данных. Новый слой памяти Galahad делает это чтение однократным.&lt;/p&gt;\n","links":[{"url":"2026-10-06/working-around-the-compute-ceiling-byte-exact-memory-in-gala.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/improving-reliability-and-explainability-of-medical-question-card.jpg"},"content":{"title":"Как заставить нейросети не&amp;nbsp;врать в&amp;nbsp;медицине: метод атомарной проверки фактов","text":"&lt;p&gt;Нейросети часто галлюцинируют в медицинских вопросах. Новый метод декомпозиции ответов на факты помогает сделать их надежными.&lt;/p&gt;\n","links":[{"url":"2026-10-06/improving-reliability-and-explainability-of-medical-question.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down-card.jpg"},"content":{"title":"Ложь без триггеров: почему правильный ответ нейросети не&amp;nbsp;гарантирует верное решение","text":"&lt;p&gt;Исследователи выяснили, что даже если ИИ дает верный ответ, он может принимать ошибочные решения, основанные на скрытой дезинформации.&lt;/p&gt;\n","links":[{"url":"2026-10-06/misinformation-without-triggers-from-factual-answers-to-down.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo-card.jpg"},"content":{"title":"SecJev: как научить нейросети принимать решения в&amp;nbsp;кибербезопасности","text":"&lt;p&gt;Новое семейство моделей SecJev автоматизирует анализ логов, трафика и политик безопасности, обходя стандартные генеративные ИИ.&lt;/p&gt;\n","links":[{"url":"2026-10-06/secjev-bringing-security-expertise-to-system-one-decision-mo.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica-card.jpg"},"content":{"title":"Почему большие языковые модели плохо справляются с&amp;nbsp;динамикой состояния пациентов","text":"&lt;p&gt;ИИ в медицине часто ошибается, когда пытается пересмотреть свои выводы при появлении новых данных о здоровье пациента.&lt;/p&gt;\n","links":[{"url":"2026-10-06/large-language-models-exhibit-unreliable-updating-of-clinica.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"card-layout-block","animated":false,"title":{"text":"Выпуск &amp;middot; 05.10.2026","url":"2026-10-05/index.html"},"colSizes":{"all":12,"md":6,"lg":4},"children":[{"type":"layout-item","media":{"image":"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews-card.jpg"},"content":{"title":"Как чиновники удаляют слова из&amp;nbsp;отчетов, чтобы &amp;laquo;испарить&amp;raquo; научные исследования","text":"&lt;p&gt;В 2025 году NIH потребовал убрать упоминания DEI из заявок. В итоге исследования продолжаются, но статистика их больше не видит.&lt;/p&gt;\n","links":[{"url":"2026-10-05/still-funded-no-longer-counted-how-nih-s-2025-award-reviews.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them-card.jpg"},"content":{"title":"Почему нейросети &amp;laquo;лгут&amp;raquo; себе: разрыв между обучением и&amp;nbsp;реальностью","text":"&lt;p&gt;Исследователи выяснили, почему визуальные модели поддаются атакам при обучении, но остаются устойчивыми в свободном режиме.&lt;/p&gt;\n","links":[{"url":"2026-10-05/corrupted-but-correct-why-vision-language-models-lie-to-them.html","text":"Читать","arrow":true,"theme":"normal"}]}},{"type":"layout-item","media":{"image":"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod-card.jpg"},"content":{"title":"Почему маленькие нейросети проваливают задачи: дело не&amp;nbsp;в&amp;nbsp;интеллекте, а&amp;nbsp;в&amp;nbsp;&amp;laquo;обвязке&amp;raquo;","text":"&lt;p&gt;Исследование показывает, что компактные модели (2-9B) работают эффективно, если сменить стандартный агентный каркас на специализированный.&lt;/p&gt;\n","links":[{"url":"2026-10-05/mingbird-a-local-first-agent-harness-enabling-small-open-mod.html","text":"Читать","arrow":true,"theme":"normal"}]}}]},{"type":"extended-features-block","animated":false,"title":"Как устроен ОСИНТ-Сигнал","items":[{"title":"Отбор","text":"&lt;p&gt;Каждый день модель сравнивает десятки свежих исследований и выбирает самые значимые и понятные.&lt;/p&gt;\n"},{"title":"Разбор","text":"&lt;p&gt;Суть, ключевые выводы и ограничения — простым языком, но без упрощений.&lt;/p&gt;\n"},{"title":"Три языка","text":"&lt;p&gt;Каждый материал выходит на русском, узбекском и казахском.&lt;/p&gt;\n"},{"title":"Рисунки и&amp;nbsp;полный текст","text":"&lt;p&gt;Иллюстрации из самих статей, а для открытых лицензий — полный перевод.&lt;/p&gt;\n"}]},{"type":"questions-block","animated":false,"title":"Вопросы","items":[{"title":"&lt;p&gt;Это рецензированные статьи?&lt;/p&gt;\n","text":"&lt;p&gt;Нет, это препринты — свежие работы до рецензирования. В каждом материале отмечены ограничения исследования.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Как часто выходят материалы?&lt;/p&gt;\n","text":"&lt;p&gt;Три раза в день: утром, днём и вечером по времени Ташкента и Астаны.&lt;/p&gt;\n"},{"title":"&lt;p&gt;Можно ли использовать тексты?&lt;/p&gt;\n","text":"&lt;p&gt;Да, со ссылкой на ОСИНТ-Сигнал и на исходную статью (DOI указан в каждом материале).&lt;/p&gt;\n"}]}],"links":[]},"meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"ОСИНТ-Сигнал","vcsPath":"index.yaml"},"title":"ОСИНТ-Сигнал"},"router":{"pathname":"index","depth":1,"base":"./"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
