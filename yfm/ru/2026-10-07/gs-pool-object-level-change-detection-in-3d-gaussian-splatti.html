        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"101\" cy=\"177\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"659\" cy=\"167\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · CHANGE_DETECTION   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как нейросети видят&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;изменения в 3D-пространстве:&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;метод GS-Pool&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f2.jpg\" alt=\"Рисунок 2. GS-Pool на одной ячейке PASLCD: дистиллированное поле DINOv3 для каждого посещения (1), сегменты SAM2, объеди\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. GS-Pool на одной ячейке PASLCD: дистиллированное поле DINOv3 для каждого посещения (1), сегменты SAM2, объединенные в объекты (2), четыре носителя на примитив и нулевой объект сцены (3), одно решение на объект (4), а также маска изменений и измененные примитивы (5).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи представили GS-Pool — метод для автоматического обнаружения изменений в 3D-реконструкциях, созданных с помощью Gaussian Splatting. В отличие от старых подходов, которые анализируют каждый пиксель отдельно, этот алгоритм группирует объекты целиком. Это позволяет точнее определять, что именно изменилось в помещении, даже при разном освещении и траекториях съемки.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;GS-Pool группирует 3D-примитивы в объекты, что делает анализ изменений осмысленным на уровне предметов, а не отдельных пикселей.&lt;/li&gt;\n&lt;li&gt;Использование масок SAM2 и признаков DINOv3 позволяет алгоритму игнорировать случайный дрейф при реконструкции сцены.&lt;/li&gt;\n&lt;li&gt;Метод превосходит аналоги (GS-Diff, MV-3DCD) по метрике mIoU на 17-57% на стандартных наборах данных PASLCD и CL-Splats.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"metody-i-tochnost\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#metody-i-tochnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и точность&lt;/span&gt;&lt;/a&gt;Методы и точность&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Метод&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Данные&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Точность&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Где ошибается&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;GS-Pool&lt;/td&gt;\n&lt;td&gt;PASLCD, CL-Splats&lt;/td&gt;\n&lt;td&gt;0.751 mIoU / 0.846 F1&lt;/td&gt;\n&lt;td&gt;Зависит от качества исходных 3DGS-реконструкций&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;GS-Diff&lt;/td&gt;\n&lt;td&gt;PASLCD&lt;/td&gt;\n&lt;td&gt;0.644 mIoU / 0.758 F1&lt;/td&gt;\n&lt;td&gt;Ошибки из-за дрейфа при сравнении примитивов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MV-3DCD&lt;/td&gt;\n&lt;td&gt;PASLCD&lt;/td&gt;\n&lt;td&gt;0.552 mIoU&lt;/td&gt;\n&lt;td&gt;Низкая точность при объектном анализе&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Метод использует 3D Gaussian Splatting (3DGS) — технологию рендеринга, представляющую сцену в виде набора 3D-гауссианов. Основная проблема заключается в «дрейфе» (drift) — случайных различиях между двумя независимыми реконструкциями одного и того же места. GS-Pool решает это, объединяя маски сегментации SAM2 (Segment Anything Model 2) в единый пул объектов. Система сопоставляет признаки DINOv3 и использует «фотографический носитель» — функцию потерь, которая проецирует ошибки обучения обратно на 3D-примитивы.&lt;/p&gt;\n&lt;p&gt;В ходе тестирования на наборе данных PASLCD метод показал значительный прирост точности. Показатель mIoU (среднее пересечение над объединением) достиг 0.751, что на 17% выше, чем у ближайшего аналога GS-Diff. Алгоритм эффективно справляется с задачей, даже когда вторая съемка была проведена быстро и с меньшим количеством фотографий, предоставляя инспектору возможность изучить изменения в 3D-формате.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод требует предварительной реконструкции сцен и зависит от точности сегментации модели SAM2. Ограничен качеством исходных данных и стабильностью работы 3DGS-тренеров.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;При мониторинге объектов, таких как заводы или музеи, съемка проводится с интервалом в несколько месяцев. Сравнение двух 3D-реконструкций, созданных методом 3D Gaussian Splatting (3DGS), затруднено из-за стохастической природы обучения: даже при отсутствии изменений в пространстве модели не совпадают. Кроме того, повторные сканирования часто содержат меньше исходных данных. Авторы предлагают метод GS-Pool для автоматического выявления изменений между двумя независимыми 3D-реконструкциями одного пространства.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3D Gaussian Splatting (3DGS) — это метод рендеринга, который представляет сцену в виде набора миллионов крошечных 3D-облаков (гауссианов), что позволяет быстро и детально восстанавливать геометрию по фотографиям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Алгоритм использует маски сегментации SAM2, полученные с исходных фотографий, которые проецируются на 3D-гауссианы. Это позволяет принимать решения об изменениях на уровне объектов в 3D-пространстве. Вводится понятие «фотографического носителя» (photographic carrier): &lt;a href=\"concepts/loss.html\"&gt;функция потерь&lt;/a&gt; при обучении 3DGS для одной реконструкции вычисляется относительно фотографий другого визита. Эти данные объединяются с геометрическими и цветовыми параметрами, а также признаками, извлеченными через DINOv3. Порог изменений для каждой сцены определяется путем сравнения с объектами, присутствующими в обоих визитах.&lt;/p&gt;\n&lt;p&gt;На наборе данных PASLCD метод GS-Pool показал метрики mIoU 0,751 и F1 0,846. Для сравнения, предыдущий лучший метод GS-Diff продемонстрировал 0,644 и 0,758 соответственно, что означает прирост точности на 17% по mIoU и 12% по F1. По сравнению с другими методами (O-SCD, PlenoCI и MV-3DCD) преимущество составило от 36% до 57%. На наборе данных CL-Splats результат составил 0,855 mIoU, что на 33% выше показателя MV-3DCD.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GS-Pool превосходит существующие методы обнаружения изменений, достигая 0,751 mIoU на PASLCD и 0,855 mIoU на CL-Splats, предоставляя инспектору 3D-визуализацию измененных объектов с обоснованием решения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод опирается на качество сегментации SAM2 и точность 3D-реконструкции; при значительном различии в количестве исходных фотографий между визитами эффективность может варьироваться.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"issledovanie-izmenenij-v-3d-rekonstrukciyah\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#issledovanie-izmenenij-v-3d-rekonstrukciyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исследование изменений в 3D-реконструкциях&lt;/span&gt;&lt;/a&gt;Исследование изменений в 3D-реконструкциях&lt;/h4&gt;\n&lt;p&gt;Задача обнаружения изменений в пространстве, снятом в разное время, осложняется различиями в освещении, ракурсах и случайным характером обучения 3D Gaussian Splatting (3DGS). Поскольку две независимые реконструкции одного и того же места никогда не совпадают идеально, возникает «дрейф» — разница, не связанная с реальными изменениями объектов. Существующие методы, такие как GS-Diff, пытаются решать эту задачу на уровне отдельных примитивов (элементарных частиц 3D-сцены), применяя фиксированный порог (0,5) для принятия решения. Это приводит к ошибкам, так как один объект может состоять из тысяч примитивов, а порог не учитывает контекст.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод GS-Pool переносит принятие решений с уровня отдельных примитивов на уровень целых объектов, используя семантические маски и проверку через исходные фотографии.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;3D Gaussian Splatting (3DGS) — метод представления 3D-сцены в виде набора миллионов мелких «гауссовых» облаков, которые можно визуализировать с любого ракурса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы предлагают GS-Pool, который объединяет примитивы в объекты с помощью масок SAM2 (Segment Anything Model 2). Для подтверждения изменений используется «фотографический носитель»: функция потерь при обучении 3DGS одной реконструкции на фотографиях другой. Если объект изменился, ошибка будет высокой. Также в примитивы внедряется семантическое поле из фундаментальной модели, чтобы различать объекты, даже если их геометрия и цвет схожи. Порог изменений калибруется для каждой сцены индивидуально на основе распределения объектов, присутствующих в обоих посещениях.&lt;/p&gt;\n&lt;h4 id=\"svyazannye-raboty\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#svyazannye-raboty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы&lt;/span&gt;&lt;/a&gt;Связанные работы&lt;/h4&gt;\n&lt;p&gt;Традиционные методы обнаружения изменений работают в пространстве 2D-изображений, сравнивая пары снимков на уровне пикселей или суперпикселей. Современные подходы используют предобученные фундаментальные модели, однако их точность ограничена (например, метод CYWS-2D достигает 0,273 mIoU на наборе данных PASLCD).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Большинство 2D-методов ограничены сравнением пар изображений, что не позволяет эффективно учитывать объемную структуру сцены.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В 3D-подходах, таких как MV-3DCD и O-SCD, изменения оцениваются через проекции 2D-карт на 3D-примитивы. GS-Diff является наиболее близким аналогом, моделирующим дрейф реконструкции. В отличие от них, GS-Pool использует двустороннюю проверку (потери при обучении переносятся через растеризатор на примитивы обеих реконструкций) и агрегирует данные на уровне объектов, а не отдельных примитивов. Метод PlenoCI также анализирует изменения, но показывает более низкие результаты на наборе данных PASLCD по сравнению с современными решениями.&lt;/p&gt;\n&lt;h4 id=\"obnaruzhenie-izmenenij-na-urovne-obuektov\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#obnaruzhenie-izmenenij-na-urovne-obuektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обнаружение изменений на уровне объектов&lt;/span&gt;&lt;/a&gt;Обнаружение изменений на уровне объектов&lt;/h4&gt;\n&lt;p&gt;Существующие подходы к обнаружению изменений часто работают на уровне отдельных пикселей или примитивов. Метод SceneDiff анализирует сцену на уровне объектов, используя &lt;a href=\"concepts/dataset.html\"&gt;набор данных&lt;/a&gt; из пар видеоклипов с сохранением идентификации объектов при повторных посещениях. Система сравнивает признаки, извлеченные из базовых моделей, для перекрывающихся кадров, используя глубину и позы, предсказанные нейросетью прямого распространения, и выдает маску для каждого кадра без построения полной реконструкции. Метод GS-Pool, напротив, сопоставляет две независимо созданные реконструкции и выделяет измененные объекты как наборы примитивов. В отличие от SceneDiff, он работает с уже готовыми 3D-моделями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В то время как SceneDiff анализирует видеопотоки для создания масок, GS-Pool сравнивает две независимые 3D-реконструкции для выявления изменений на уровне примитивов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Сравнение моделей разных временных периодов ранее применялось к облакам точек, робототехническим картам и сопоставлению фотографий с городскими моделями. В контексте гауссовых сплэтов (Gaussian splats) исследования чаще фокусируются на обновлении существующих моделей или их регистрации при отсутствии изменений. Методы на основе SLAM сравнивают только геометрию, а картографические подходы обновляют одну карту при повторном посещении. Методы обновления сплэтов локализуют изменения для дообучения конкретных областей, тогда как GS-Pool сравнивает две независимые реконструкции.&lt;/p&gt;\n&lt;p&gt;Семантические поля часто интегрируются в нейронные поля излучения и гауссовы сплэты для поддержки редактирования и сегментации. В данной работе признаки DINOv3 (ViT-L/16) дистиллируются в каждую реконструкцию при фиксированных параметрах гауссиан. Эти признаки служат одним из источников доказательств изменений, в то время как модель SAM2 используется исключительно для сегментации фотографий на маски объектов.&lt;/p&gt;\n&lt;p&gt;Существующие бенчмарки, такие как PASLCD, включают пять внутренних и пять внешних сцен, снятых при стабильном и меняющемся освещении. Каждый набор данных содержит от 50 до 109 эталонных фотографий и 25 тестовых видов. В CL-Splats пять реальных сцен были сняты дважды с изменением объектов, однако из-за отсутствия готовых масок авторы провели их ручную разметку.&lt;/p&gt;\n&lt;h4 id=\"3-metod\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#3-metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Метод&lt;/span&gt;&lt;/a&gt;3. Метод&lt;/h4&gt;\n&lt;p&gt;GS-Pool принимает на вход две независимые реконструкции гауссовых полей (GT₁ и GT₂) одного пространства, имеющие общую систему координат камеры, и возвращает измененные объекты вместе с их масками. Процесс обработки данных состоит из пяти последовательных этапов, что позволяет проследить обоснование каждого решения (Рис. 2). Посещение T₁ считается эталонным, а T₂ — целевым для оценки карты изменений.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f2.jpg\" alt=\"Рисунок 2. GS-Pool на одной ячейке PASLCD: дистиллированное поле DINOv3 для каждого посещения (1), сегменты SAM2, объеди\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2. GS-Pool на одной ячейке PASLCD: дистиллированное поле DINOv3 для каждого посещения (1), сегменты SAM2, объединенные в объекты (2), четыре носителя на примитив и нулевой объект сцены (3), одно решение на объект (4), а также маска изменений и измененные примитивы (5).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Гауссовы сплэты (3DGS) — это метод представления 3D-сцены в виде набора миллионов крошечных эллипсоидов (примитивов), которые позволяют быстро рендерить сложные изображения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"resheniya-v-3d\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#resheniya-v-3d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Решения в 3D&lt;/span&gt;&lt;/a&gt;Решения в 3D&lt;/h4&gt;\n&lt;p&gt;GS-Pool классифицирует объекты, сформированные из примитивов. Фотографии предоставляют сегменты, данные об их отслеживании и визуальные доказательства, которые подтверждают или опровергают изменения, предложенные в 3D-пространстве. Итоговая маска формируется путем рендеринга выбранных примитивов измененных объектов. В качестве входных данных используются реконструкции, созданные стандартными методами 3DGS или FastPGSR без модификаций.&lt;/p&gt;\n&lt;h4 id=\"31-etap-1-distillirovannoe-semanticheskoe-pole\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#31-etap-1-distillirovannoe-semanticheskoe-pole\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.1. Этап 1: дистиллированное семантическое поле&lt;/span&gt;&lt;/a&gt;3.1. Этап 1: дистиллированное семантическое поле&lt;/h4&gt;\n&lt;p&gt;К каждому примитиву привязывается семантический дескриптор. Признаки DINOv3 (ViT-L/16) извлекаются из неискаженных изображений, сокращаются с помощью PCA до D=32 измерений и дистиллируются в примитивы. Вектор признаков &lt;span class=\"yfm-latex\" data-content=\"f_i%20%5Cin%20%5Cmathbb%7BR%7D%5E%7B32%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; для каждого примитива рендерится с использованием альфа-композиции, аналогично цвету, и оптимизируется для соответствия патчам признаков на всех видах. Сама геометрия реконструкции (позиции, масштабы, повороты, непрозрачность и цвет гауссиан) остается неизменной, оптимизируются только векторы признаков. PCA настраивается одновременно для обоих посещений, что позволяет сравнивать их признаки в едином пространстве.&lt;/p&gt;\n&lt;h4 id=\"32-etap-2-formirovanie-pula-obuektov\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#32-etap-2-formirovanie-pula-obuektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.2. Этап 2: формирование пула объектов&lt;/span&gt;&lt;/a&gt;3.2. Этап 2: формирование пула объектов&lt;/h4&gt;\n&lt;p&gt;На этом этапе примитивы (базовые элементы сцены) объединяются в объекты. Алгоритм SAM2 сегментирует фотографии каждого визита, выделяя маски объектов. Для обеспечения сопоставимости данных количество фотографий в двух визитах выравнивается путем субдискретизации визита с большим числом снимков до уровня второго визита.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SAM2 (Segment Anything Model 2) — нейросетевая модель, способная выделять границы объектов на изображениях и видео.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Маски проецируются на примитивы. Примитив закрепляется за объектом, если он находится на визуализируемой поверхности (отклонение глубины &lt;span class=\"yfm-latex\" data-content=\"%2Fe_i(%5Cell)%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; не превышает утроенной медианы отклонений) и если не менее половины веса примитива в данной проекции попадает в маску объекта согласно формуле (1), где &lt;span class=\"yfm-latex\" data-content=\"%5Cphi_i(M_%7B%5Cell%2Cm%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — вклад примитива в маску.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Примитив закрепляется за объектом, если он соответствует поверхности и имеет более 50% веса рендеринга внутри маски объекта.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Треки объектов формируются путем объединения сегментов с одинаковыми идентификаторами. Если треки пересекаются (коэффициент Жаккара IoU(A, B) ≥ 0.2), они объединяются в один объект. Если примитив претендует на несколько объектов, он закрепляется за тем, чьи маски обеспечивают наибольший вес рендеринга (при условии минимум двух подтверждений в разных ключевых кадрах). Объекты, занимающие более половины общего объема «покрытых» примитивов (обычно это стены или пол), классифицируются как фон и удаляются. Объект считается пригодным для анализа (poolable), если его размер находится в диапазоне от нижнего квартиля размеров объектов в пуле до 2W (формула 3).&lt;/p&gt;\n&lt;h4 id=\"33-etap-3-chetyre-nositelya-izmenenij\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#33-etap-3-chetyre-nositelya-izmenenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.3. Этап 3: четыре носителя изменений&lt;/span&gt;&lt;/a&gt;3.3. Этап 3: четыре носителя изменений&lt;/h4&gt;\n&lt;p&gt;Для каждого примитива рассчитываются четыре показателя изменений («носителя») в диапазоне [0, 1]. Три из них основаны на сравнении геометрии, цвета и семантики между двумя наборами примитивов, четвертый — на анализе фотографий другого визита.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поскольку две реконструкции одной и той же сцены никогда не совпадают идеально, алгоритм учитывает естественный «дрейф» (drift).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Дрейф оценивается как верхний квартиль расстояния от примитива до ближайшего соседа в другом визите. Он разделяется на составляющие: u_n (вдоль нормали поверхности) и u_t (внутри поверхности). Эти значения вместе с позиционной неопределенностью расширяют ковариационную матрицу &lt;span class=\"yfm-latex\" data-content=\"%5CSigma_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; до $ ilde{\\Sigma}_i$, используемую в ядрах сравнения.&lt;/p&gt;\n&lt;h4 id=\"poiskovyj-shar\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#poiskovyj-shar\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Поисковый шар&lt;/span&gt;&lt;/a&gt;Поисковый шар&lt;/h4&gt;\n&lt;p&gt;Для сравнения примитивов (элементарных единиц 3D-сцены) между двумя сессиями съемки используется «поисковый шар» B(i). Он ограничивает поиск соседей k ближайшими элементами в радиусе трех стандартных отклонений ковариации примитива. Параметр k определяется как медианное число примитивов в этой области, что позволяет уравнять плотные и разреженные участки сцены.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Поисковый шар — это метод нормализации, который не дает перегруженным деталями зонам (например, книжной полке) иметь преимущество перед пустыми зонами (стеной) при поиске совпадений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Геометрическое расхождение δgeo^i оценивается по близости соседей и сходству форм, взвешенному по уверенности в позиции примитива. Цветовое расхождение δcol^i учитывает масштаб цвета σcol, который увеличивается для крупных объектов. Семантический анализ расширяет этот подход, используя дистиллированные признаки с индивидуальным масштабом для каждой размерности (уравнение 4a, 4b). Это необходимо, так как главные компоненты PCA в разных частях сцены сильно варьируются, и единый масштаб мог бы скрыть мелкие объекты.&lt;/p&gt;\n&lt;p&gt;Фотографический носитель δpho^i (уравнения 5a, 5b, 6) сравнивает рендер модели с реальными снимками другой сессии. Ошибка рассчитывается как комбинация L₁ (цветовая ошибка) и DSSIM (структурное несходство). Метод использует обратное распространение ошибки через растеризатор, что позволяет учитывать окклюзии (перекрытия объектов). Если примитив не виден на снимках, его оценка равна 0.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фотографический носитель критически важен: на наборе FastPGSR его удаление снижает точность на 12,9%, а для базовой 3DGS — на 20,5%.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"empiricheskij-nul\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#empiricheskij-nul\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эмпирический нуль&lt;/span&gt;&lt;/a&gt;Эмпирический нуль&lt;/h4&gt;\n&lt;p&gt;Поскольку степень расхождения неизменных объектов зависит от условий съемки, авторы вводят понятие «эмпирического нуля» (Nprim и Nobj) — набор примитивов и объектов, которые присутствуют в обеих сессиях и считаются неизменными (уравнения 7a, 7b). Это позволяет откалибровать пороги обнаружения изменений для конкретной сцены. На Рис. 3 показано, что для объекта, изменившегося на месте (например, пустой стакан), геометрические и цветовые признаки неэффективны, тогда как фотографический носитель позволяет выделить его как измененный.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f3.jpg\" alt=\"Рис. 3\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 3&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод «эмпирического нуля» предполагает, что объекты, присутствующие в обеих сессиях, неизменны, однако если объект изменился, но остался на месте, он может ошибочно попасть в выборку «нулевых» объектов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ranzhirovanie-obuektov\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#ranzhirovanie-obuektov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ранжирование объектов&lt;/span&gt;&lt;/a&gt;Ранжирование объектов&lt;/h4&gt;\n&lt;p&gt;Для оценки изменений авторы используют четыре типа признаков (носителей): цвет, геометрия, фотометрические данные и семантика. Каждый признак преобразуется в относительную статистику: значение примитива заменяется его рангом среди «нулевых» примитивов (тех, что не изменились) в рамках того же посещения. Итоговый ранг объекта R_c(o) вычисляется как среднее значение рангов его примитивов (формула 8). Это нормализованная статистика Манна-Уитни: она показывает вероятность того, что признак объекта имеет большее значение, чем у «нулевого» объекта. Значения выше 0,5 указывают на более выраженные изменения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статистика R_c(o) позволяет объединить данные множества примитивов, где значения выше 0,5 свидетельствуют о вероятном изменении объекта.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для принятия решения используется «ядро» (core), которое сравнивает объект с «нулевыми» объектами другого посещения. Четыре ранга объединяются с помощью статистики Фишера (формула 9b), которая следует распределению χ². Чтобы учесть зависимость между признаками, применяется поправка Брауна (формула 10). Если итоговое значение превышает порог θ, объект помечается как измененный. Это ядро само по себе превосходит предыдущие методы по показателю mIoU (Таблица 2).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статистика Фишера здесь используется для агрегации независимых вероятностей (рангов) в единый показатель значимости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"fotograficheskoe-nablyudenie\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#fotograficheskoe-nablyudenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фотографическое наблюдение&lt;/span&gt;&lt;/a&gt;Фотографическое наблюдение&lt;/h4&gt;\n&lt;p&gt;Поскольку «ядро» опирается на реконструкцию, оно может давать сбои из-за дрейфа примитивов или малого их количества. Поэтому авторы дополнительно проверяют объект напрямую по фотографиям. Для этого объект проецируется на камеру снимка, и вычисляется «&lt;a href=\"concepts/trace.html\"&gt;след»&lt;/a&gt; (footprint) — набор пикселей, принадлежащих объекту. Если средняя фотометрическая ошибка в этом следе превышает 95-й перцентиль ошибки по всему снимку, фотография считается «горячей» (hot) для данного объекта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод зависит от качества проекции: если объект перекрыт другими элементами, пиксели не учитываются, что снижает точность оценки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Вводятся две метрики: &lt;span class=\"yfm-latex\" data-content=\"%5Ceta(o)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — доля «горячих» фотографий, и γ(o) — доля фотографий, где средняя ошибка объекта выше медианной ошибки других объектов на снимке (формулы 11, 12). Это позволяет избежать завышения оценки для объектов, которые просто чаще попадают в кадр.&lt;/p&gt;\n&lt;h4 id=\"pravilo-prinyatiya-resheniya\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#pravilo-prinyatiya-resheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Правило принятия решения&lt;/span&gt;&lt;/a&gt;Правило принятия решения&lt;/h4&gt;\n&lt;p&gt;Финальное решение комбинирует «ядро» и фотометрические показатели. Система использует три условия: «кворум» (проверка согласованности рангов), «принятие» (admit) и «отклонение» (reject). Объект признается измененным, если он принят и не отклонен. Правила позволяют обрабатывать сложные случаи: малые объекты (где мало примитивов), объекты с дрейфом примитивов (которые отклоняются фотографиями) и объекты с низким контрастом (которые спасает высокий семантический ранг).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Комбинированный подход (ядро + фото-статистика) позволяет повысить точность обнаружения изменений по сравнению с использованием только одного из методов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"35-etap-5-izmenyonnye-primitivy-i-maski\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#35-etap-5-izmenyonnye-primitivy-i-maski\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5. Этап 5: изменённые примитивы и маски&lt;/span&gt;&lt;/a&gt;3.5. Этап 5: изменённые примитивы и маски&lt;/h4&gt;\n&lt;p&gt;Область изменённого объекта определяется как совокупность покрывающих его примитивов, значения которых превышают 95-й процентиль (Q0.95) хотя бы на одном из носителей информации. Формально это записывается как &lt;span class=\"yfm-latex\" data-content=\"E(o)%20%3D%20%5C%7Bi%20%5Cin%20o_v%20%3A%20%5Cexists%20c%2C%20x_i%5Ec%20%3E%20Q_%7B0.95%7D%5C%7Bx_j%5Ec%5C%7D_%7Bj%20%5Cin%20N_%7Bprim%7D%7D%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Эти области проецируются на каждый тестовый ракурс для формирования маски изменений. Использование всех покрывающих примитивов вместо отфильтрованных снижает показатель mIoU (среднее пересечение над объединением), так как в набор примитивов объекта попадают и поверхности, с которыми он соприкасается, но которые не менялись.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение области изменений через 95-й процентиль примитивов позволяет отсечь неизменные фоновые поверхности и повысить точность маскировки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"41-nastrojka\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#41-nastrojka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.1. Настройка&lt;/span&gt;&lt;/a&gt;4.1. Настройка&lt;/h4&gt;\n&lt;p&gt;Метод тестировался на 20 сценах датасета PASLCD и на собственных аннотациях CL-Splats. Для каждой конфигурации проводилось по три независимых реконструкции каждого визита (всего 60 прогонов на строку таблицы, 240 в сумме). Оценивались два типа «тренеров» (детекторов): FastPGSR и стандартный 3DGS. Использовались два способа совмещения кадров: «совместный» (joint frame), где оптимизация проводится по обоим захватам, и «привязанный» (anchored frame), где второй захват регистрируется в исходные позы без переоптимизации. Время обработки одного прогона на видеокарте RTX 4090 составляет 2,1 минуты для FastPGSR и 5,7 минуты для 3DGS.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;mIoU (mean Intersection over Union) — метрика, оценивающая точность сегментации: чем ближе значение к 1, тем точнее маска изменений совпадает с реальным объектом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"42-rezultaty\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#42-rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.2. Результаты&lt;/span&gt;&lt;/a&gt;4.2. Результаты&lt;/h4&gt;\n&lt;p&gt;На совместном кадре GS-Pool превосходит предыдущие методы на 17% (FastPGSR) и 12% (3DGS) по mIoU. Результаты стабильны: стандартное отклонение средних значений по разным сидам реконструкции не превышает 1,7%. FastPGSR показывает результат на 4,3% выше, чем 3DGS. На датасете CL-Splats метод GS-Pool превосходит MV-3DCD на 33–35% и O-SCD на 35–37%. На более сложном датасете PASLCD преимущество над PlenoCI достигает 40%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод зависит от качества исходной реконструкции и работы модели SAM2: если объект не был сегментирован SAM2, последующие этапы не смогут восстановить его изменения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"5-ogranicheniya\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#5-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Ограничения&lt;/span&gt;&lt;/a&gt;5. Ограничения&lt;/h4&gt;\n&lt;p&gt;Качество работы GS-Pool напрямую зависит от качества захвата данных. Изменения освещения могут приводить к ложным срабатываниям, хотя GS-Pool показывает меньшее количество ложных пикселей по сравнению с MV-3DCD и O-SCD. Использование дистиллированных полей и проекций с камер других визитов увеличивает вычислительную стоимость по сравнению с простым сравнением наборов примитивов.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"itogi-i-proizvoditelnost-metoda-gs-pool\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#itogi-i-proizvoditelnost-metoda-gs-pool\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Итоги и производительность метода GS-Pool&lt;/span&gt;&lt;/a&gt;Итоги и производительность метода GS-Pool&lt;/h4&gt;\n&lt;p&gt;Метод GS-Pool определяет изменения на уровне объектов между двумя независимыми 3DGS-реконструкциями (3D Gaussian Splatting). Алгоритм вычисляет четыре типа дескрипторов для каждого примитива: геометрический, цветовой, семантический и фотографический (последний передается через растеризатор методом обратного распространения ошибки). Затем каждый объект сравнивается с «нулевыми» объектами другого посещения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;GS-Pool достигает 0,7509 mIoU и 0,8461 F1 на наборе данных PASLCD, что на 17% превышает предыдущие лучшие показатели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;При использовании единой конфигурации для двух обучающих модулей, двух кадров и трех реконструкций, метод демонстрирует высокую точность. На наборе данных CL-Splats показатели составили 0,855 mIoU для FastPGSR и 0,865 mIoU для стандартного 3DGS. При сравнении двух снимков неизменной сцены с разным освещением GS-Pool отмечает меньше ложных изменений пикселей, чем методы MV-3DCD и O-SCD.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;mIoU (mean Intersection over Union) — метрика, показывающая степень перекрытия между предсказанной областью изменений и реальной, где 1.0 означает полное совпадение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результатом работы алгоритма является пул объектов для каждого посещения, где для каждого элемента указано решение об изменении и соответствующие доказательства. Измененные примитивы визуализируются как слой 3DGS поверх любой из реконструкций. Переход от анализа отдельных примитивов к целым объектам позволяет в будущем классифицировать типы изменений, произошедших с каждым объектом.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f5.jpg\" alt=\"Рисунок 5. Трехмерный вывод сцены Porch с точки обзора, не зафиксированной ни одной камерой. Измененные примитивы каждог\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5. Трехмерный вывод сцены Porch с точки обзора, не зафиксированной ни одной камерой. Измененные примитивы каждого посещения показаны на собственной реконструкции, остальные — серым цветом: два табурета и кружка из T1 (a), табурет из T2 и объекты на его столе (b).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f6.jpg\" alt=\"Рисунок 6. Четыре квантильные константы, каждая из которых варьируется при фиксации трех остальных. Среднее mIoU по 60 э\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6. Четыре квантильные константы, каждая из которых варьируется при фиксации трех остальных. Среднее mIoU по 60 элементам каждой строки совместных кадров. Пунктир: выбранное значение. Точечная линия: решающий оракул (Приложение G).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f7.jpg\" alt=\"Рис. 7\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 7&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f9.jpg\" alt=\"Рисунок 9. Все пять сцен CL-Splats в ракурсе с наибольшим количеством аннотированных изменений, оба обучающих алгоритма \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9. Все пять сцен CL-Splats в ракурсе с наибольшим количеством аннотированных изменений, оба обучающих алгоритма с начальным числом (seed) 22, с указанием IoU для данного ракурса и mIoU сцены по трем начальным числам (FastPGSR / стандартный 3DGS).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f10.jpg\" alt=\"Рисунок 10. mIoU на ячейку для четырех конфигураций: столбец соответствует среднему значению по начальным числам (seed),\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10. mIoU на ячейку для четырех конфигураций: столбец соответствует среднему значению по начальным числам (seed), «усы» — диапазону значений, точки — отдельным значениям для каждого seed.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f10-2.jpg\" alt=\"Рис. 10 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 10 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f11.jpg\" alt=\"Рисунок 11. Ячейки 1–10 (от Cantina до Meetingroom) в режиме просмотра с наибольшим количеством аннотированных изменений\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 11. Ячейки 1–10 (от Cantina до Meetingroom) в режиме просмотра с наибольшим количеством аннотированных изменений, объединенный кадр, seed 22, с указанием IoU для данного вида и mIoU по трем seed для ячейки (FastPGSR / vanilla 3DGS).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti-f12.jpg\" alt=\"Рисунок 12. Ячейки 11–20 (от Playground до Zen), как на рисунке 11.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 12. Ячейки 11–20 (от Playground до Zen), как на рисунке 11.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Сложность&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;сравнения двух&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;3D-сцен&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Объединение&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;масок SAM2 и&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;3DGS&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Высокая&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;точность&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;обнаружения&lt;/text&gt;&lt;text x=\"426\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;объектов&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Автоматизация&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;инспекции&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;3D-пространств&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-level-change-detection-in-3d-gaussian-splatti.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;change_detection&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Авторы: Boaz Keren-Gil, James Gain, Patrick Marais&lt;/p&gt;\n&lt;h3 id=\"istochniki\"&gt;&lt;a href=\"2026-10-07/gs-pool-object-l
