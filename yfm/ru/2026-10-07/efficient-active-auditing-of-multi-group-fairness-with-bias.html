            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"208\" cy=\"61\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"592\" cy=\"298\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · OTHER   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как проверить нейросеть на&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;предвзятость, не взламывая&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;её&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f1.jpg\" alt=\"Рисунок 1: Интерактивный аудит справедливости против состязательной модели, учитывающей критерии справедливости.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Интерактивный &lt;a href=\"concepts/audit-module.html\"&gt;аудит&lt;/a&gt; справедливости против состязательной модели, учитывающей критерии справедливости.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Разработчики представили фреймворк для проверки алгоритмов на предвзятость без необходимости полного восстановления модели. Метод ALeBi использует адаптивные запросы для оценки справедливости между группами. Это решение защищает владельцев систем от атак по извлечению данных, обеспечивая при этом прозрачность и интерпретируемость результатов.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;ALeBi позволяет оценивать предвзятость без восстановления внутренней структуры модели.&lt;/li&gt;\n&lt;li&gt;Метод обеспечивает интерпретируемость, выявляя конкретные области данных с высоким уровнем дискриминации.&lt;/li&gt;\n&lt;li&gt;Алгоритм сохраняет точность даже при противодействии со стороны владельца системы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Традиционные методы аудита «черного ящика» часто требуют либо полного восстановления модели, что делает систему уязвимой для атак, либо проведения масштабных тестов, которые не дают понимания причин предвзятости. Авторы предлагают концепцию «зондов смещения» (bias &lt;a href=\"concepts/probes.html\"&gt;probes&lt;/a&gt;) — специализированных функционалов, которые извлекают только информацию о различиях в поведении модели между защищенными группами.&lt;/p&gt;\n&lt;p&gt;Алгоритм ALeBi (Active Learning for Bias) использует активное обучение для выбора наиболее информативных запросов к модели. В ходе экспериментов метод показал высокую эффективность в оценке метрик справедливости даже в условиях, когда владелец модели пытается скрыть предвзятость. Исследование устанавливает теоретические гарантии сложности выборки, решая открытый вопрос о балансе между конфиденциальностью модели и надежностью аудита.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод опирается на теоретические предположения о сложности выборки и может быть ограничен в условиях крайне малых или сильно зашумленных данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;За последнее десятилетие машинное обучение (ML) развивалось с двумя противоречивыми целями: минимизацией ошибки прогнозирования через эмпирическую минимизацию риска (ERM) и контролем предвзятости (unfairness bias). На практике методы обучения, учитывающие справедливость, часто дают лишь незначительные улучшения по сравнению со стандартным ERM, что делает независимый аудит моделей необходимым. Существующие методы аудита «черных ящиков» либо требуют полной реконструкции модели, что делает её уязвимой для атак по извлечению данных, либо оценивают метрики справедливости напрямую, не раскрывая, какие именно области данных провоцируют предвзятость.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аудит «черного ящика» — это проверка алгоритма, когда исследователь не имеет доступа к его внутренним весам или архитектуре, а может только отправлять запросы и получать ответы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В данной работе представлен фреймворк «bias probe» (&lt;a href=\"concepts/probing.html\"&gt;зондирование&lt;/a&gt; предвзятости), который позволяет проводить целенаправленный и адаптивный аудит, сохраняя конфиденциальность модели. На его основе предложен алгоритм ALeBi — активный аудитор, обучающий зонды для эффективной оценки метрик справедливости для нескольких групп. Авторы установили новые гарантии сложности выборки, основанные на специфической мере сложности свойств, что решает ранее открытый вопрос. Исследование также охватывает состязательные сценарии, где владелец модели может намеренно скрывать предвзятость.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фреймворк bias probe позволяет оценивать предвзятость алгоритмов без их полной реконструкции, обеспечивая баланс между точностью аудита и защитой интеллектуальной собственности модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Результаты показывают фундаментальный компромисс между конфиденциальностью модели и надежностью аудита. Зондирование позволяет одновременно точно оценивать метрики и интерпретировать области данных с высоким или низким уровнем предвзятости. Практическая эффективность подхода подтверждена экспериментами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа является препринтом (arXiv:2609.40034v1) и на момент публикации не прошла процедуру рецензирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"aktualnost-audita-algoritmicheskih-sistem\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#aktualnost-audita-algoritmicheskih-sistem\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Актуальность аудита алгоритмических систем&lt;/span&gt;&lt;/a&gt;Актуальность аудита алгоритмических систем&lt;/h4&gt;\n&lt;p&gt;Оценка моделей машинного обучения (ML) становится критически важной, так как системы демонстрируют предвзятость в таких сферах, как медицинская визуализация, найм персонала, кредитование и работа онлайн-платформ. В ответ на это возникло направление «алгоритмической справедливости». Традиционные методы обучения, внедряющие ограничения справедливости непосредственно в процесс тренировки, часто показывают лишь незначительные улучшения по сравнению со стандартным эмпирическим минимизированием риска (ERM). В связи с этим внимание сместилось на аудит после развертывания (post-deployment auditing), что подкрепляется законодательными инициативами, такими как Local Law 144 в Нью-Йорке, Digital Services Act и AI Act в Европе, требующими прозрачности и управления рисками для высокорисковых систем.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аудит алгоритмов становится обязательным требованием регуляторов, однако существующие методы либо требуют полной реконструкции модели, либо слишком затратны, создавая конфликт между прозрачностью и защитой данных владельца модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"problemy-audita-chernogo-yashika\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#problemy-audita-chernogo-yashika\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проблемы аудита «черного ящика»&lt;/span&gt;&lt;/a&gt;Проблемы аудита «черного ящика»&lt;/h4&gt;\n&lt;p&gt;В режиме пост-развертывания модель обычно рассматривается как «черный ящик». Внешний аудитор взаимодействует с владельцем модели через запросы, не имея доступа к внутренней структуре. Возникает фундаментальное противоречие: аудитору нужно достаточно данных для оценки справедливости, а владелец стремится ограничить раскрытие информации для защиты конфиденциальности. Существующие подходы либо пытаются реконструировать модель (что подвергает её атакам на извлечение), либо требуют огромных объемов размеченных данных, что непрактично. Авторы ставят вопрос: можно ли получить гарантии справедливости без полной реконструкции модели и без необходимости в больших наборах размеченных данных?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Черный ящик» — это модель, внутренняя логика которой скрыта от пользователя; аудитор может только подавать входные данные и получать предсказания на выходе.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"interpretiruemost-i-bezopasnost-audita\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#interpretiruemost-i-bezopasnost-audita\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерпретируемость и безопасность аудита&lt;/span&gt;&lt;/a&gt;Интерпретируемость и безопасность аудита&lt;/h4&gt;\n&lt;p&gt;Помимо оценки, важна интерпретируемость: согласно статье 86 AI Act, пользователи имеют право на объяснение решений. Традиционные методы дают лишь количественные показатели предвзятости, но не объясняют дискриминационное поведение. Авторы предлагают «зонды предвзятости» (bias probes) — структурированные функционалы, которые фиксируют различия между защищенными группами. Это первый подход, формализующий аудит с гарантиями интерпретируемости. Также встает вопрос безопасности: как проводить аудит, не делая модель уязвимой для атак на извлечение, и как противостоять владельцам моделей, которые могут стратегически скрывать предвзятость от аудитора (состязательное поведение)?&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В отличие от классических состязательных атак на данные, здесь рассматривается модель-владелец, которая намеренно искажает поведение системы, чтобы скрыть дискриминацию от аудитора.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В рамках предлагаемого подхода предполагается существование сильного противника, учитывающего требования к справедливости (fairness-aware adversary). Такой противник способен стратегически менять свои ответы для скрытия межгрупповых различий. На основе накопленной истории взаимодействий &lt;span class=\"yfm-latex\" data-content=\"%7B(q_1%2C%20M_1)%2C%20%5Cdots%2C%20(q_%7Bt%2B1%7D%2C%20M_%7Bt%2B1%7D)%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где q — запрос, а M — ответ модели, аудитор формирует оценку &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7B%5Cmu%7D_%7Bt%2B1%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; проверяемого свойства. Одновременно с этим алгоритм определяет конкретные области входного пространства, в которых анализируемая система демонстрирует наиболее выраженный дисбаланс и предвзятость по отношению к защищаемым группам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель угроз включает активного противника, который может адаптировать выдачу «черного ящика» для маскировки дискриминации, что усложняет задачу оценки.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данная работа направлена на преодоление указанных трудностей в контексте многогрупповой справедливости (multi-group fairness). Авторы исследуют фреймворк интерактивного аудита, в котором аудитор направляет запросы к модели типа «черный ящик», используя специально отобранные входные данные из пула неразмеченной выборки. Такой подход позволяет проводить проверку без необходимости получать полный доступ к внутренней архитектуре или весам оцениваемого алгоритма.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Интерактивный аудит «черного ящика» — метод проверки алгоритма, при котором исследователи оценивают его справедливость, отправляя продуманные запросы и анализируя только итоговые ответы, без доступа к исходному коду.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ключевая особенность метода заключается в обучении сравнительных функционалов (comparison functionals), которые фиксируют дискриминационное поведение модели между защищаемыми группами, вместо попыток полностью восстановить саму целевую модель. Подобная постановка задачи обеспечивает высокую статистическую эффективность и интерпретируемость результатов. Кроме того, она естественным образом ограничивает объем информации, получаемой аудитором, защищая владельца модели от атак, направленных на точное воспроизведение или кражу интеллектуальной собственности (reconstruction attacks).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка сравнительных функционалов вместо реконструкции модели гарантирует точный аудит многогрупповой справедливости и защищает алгоритм от несанкционированного копирования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"relatedwork\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#relatedwork\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;RelatedWork&lt;/span&gt;&lt;/a&gt;RelatedWork&lt;/h4&gt;\n&lt;p&gt;Аудит справедливости. Исследования в этой области делятся на два направления: обучение «справедливых» моделей через оптимизацию и аудит уже развернутых систем с ограниченным доступом. Существующие методы аудита часто сводятся к реконструкции модели, что требует значительных вычислительных ресурсов. В отличие от них, наш подход рассматривает аудит как задачу оценки свойств, фокусируясь на комбинаторной структуре сравнений между группами, а не на полном восстановлении модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мы предлагаем оценивать справедливость через анализ структуры межгрупповых различий, что эффективнее полной реконструкции модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Интерпретируемость и зондирование. Методы интерпретируемости (атрибуция признаков, контрфактуальные объяснения) дают описательные сводки поведения модели. Методы зондирования (probing) извлекают свойства из представлений модели с помощью простых классификаторов. Наши «зонды смещения» (bias probes) концептуально близки к ним, но нацелены на выявление реляционных различий между защищенными группами и подкреплены статистическими гарантиями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зондирование (probing) — это метод анализа нейросетей, при котором поверх обученной модели ставится простая модель для проверки, «выучила» ли основная система конкретные закономерности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Активное обучение и сложность на основе разногласий. Классическое активное обучение использует геометрические параметры (коэффициент разногласий, число звезд) для оценки сложности задачи. Мы адаптируем этот подход, вводя понятие «межгруппового числа звезд» (intergroup star number). Этот параметр описывает способность класса сравнений изолировать конфигурации между подгруппами и определяет эффективность выборки в нашей задаче.&lt;/p&gt;\n&lt;p&gt;Обучение предпочтениям. В отличие от задач ранжирования, где цель — предсказать порядок элементов, мы обучаем класс функционалов сравнения. Это позволяет оценивать дискриминационное поведение «черного ящика» на распределении входных данных, обеспечивая равномерные гарантии для всего класса функций.&lt;/p&gt;\n&lt;p&gt;Атаки на извлечение модели. Атаки типа «model extraction» позволяют злоумышленнику воспроизвести функциональность модели через API. Мы учитываем эти риски: наши механизмы аудита намеренно ограничивают объем раскрываемой информации, что делает восстановление исходной модели по нашим зондам вычислительно сложной задачей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Восстановление модели по нашим зондам затруднено, что обеспечивает безопасность при проведении аудита через API.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sravnitelnaya-baza-dlya-audita-spravedlivosti\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#sravnitelnaya-baza-dlya-audita-spravedlivosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сравнительная база для аудита справедливости&lt;/span&gt;&lt;/a&gt;Сравнительная база для аудита справедливости&lt;/h4&gt;\n&lt;p&gt;Мы представляем метод, основанный на «зондировании смещения» (bias probes). Он фиксирует дискриминационное поведение модели через структурированное сравнение групп. Аудит справедливости формализуется как обучение функционалов сравнения с гарантиями оценки многогрупповой справедливости, не зависящими от распределения данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод позволяет оценивать справедливость модели для множества групп одновременно, используя структурированные сравнения без привязки к конкретному распределению.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"novaya-mera-slozhnosti-i-optimalnye-granicy-zaprosov\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#novaya-mera-slozhnosti-i-optimalnye-granicy-zaprosov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Новая мера сложности и оптимальные границы запросов&lt;/span&gt;&lt;/a&gt;Новая мера сложности и оптимальные границы запросов&lt;/h4&gt;\n&lt;p&gt;Вводится понятие «k-межгруппового звездного числа» s_k, расширяющее классическое звездное число для многогрупповых сценариев. Мы определяем сложность запросов аудита через этот параметр, доказывая нижнюю границу &lt;span class=\"yfm-latex\" data-content=\"%5COmega%20%5Cleft(%20%5Cmax%20%5Cleft(%20n%5E%7B1-2%5Cdelta%7D%2C%20%5Cfrac%7B1%7D%7B%5Cepsilon%5E2%7D%20%5Cright)%20%5Cright)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Также предложен активный алгоритм k-ALeBi, достигающий верхней границы &lt;span class=\"yfm-latex\" data-content=\"O(%5Cdots)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; с учетом размерности Даниэли-Шварца DS_k.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Размерность Даниэли-Шварца — это показатель «емкости» модели, определяющий, насколько сложную функцию она может выучить.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"slozhnost-izvlecheniya-modeli-i-audit-pri-manipulyaciyah\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#slozhnost-izvlecheniya-modeli-i-audit-pri-manipulyaciyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сложность извлечения модели и аудит при манипуляциях&lt;/span&gt;&lt;/a&gt;Сложность извлечения модели и аудит при манипуляциях&lt;/h4&gt;\n&lt;p&gt;Мы показываем, что точный аудит отличается от восстановления исходного классификатора: выбор набора реляционных запросов для идентификации всех кандидатов на модель является NP-полной задачей. В условиях, когда владелец модели может манипулировать ответами (при уровне искажений p &amp;lt; 1/2), предложен алгоритм Robust k-ALeBi, сохраняющий асимптотические границы. Эмпирическая оценка сравнивает наш подход с методами ReconAudit и DirectAudit по точности, интерпретируемости и устойчивости к атакам.&lt;/p&gt;\n&lt;h4 id=\"formulirovka-problemy-audit-mnogogruppovoj-spravedlivosti\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#formulirovka-problemy-audit-mnogogruppovoj-spravedlivosti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Формулировка проблемы: аудит многогрупповой справедливости&lt;/span&gt;&lt;/a&gt;Формулировка проблемы: аудит многогрупповой справедливости&lt;/h4&gt;\n&lt;p&gt;Пусть H — класс гипотез, а модель h отображает пространство Z в  ildeY. Входные данные содержат p незащищенных признаков и один защищенный атрибут A, который делит Z на k подгрупп &lt;span class=\"yfm-latex\" data-content=\"Z_1%2C%20%5Cdots%2C%20Z_k\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Нарушение справедливости определяется как максимальная разница в статистическом паритете между парами групп &lt;span class=\"yfm-latex\" data-content=\"%5Cmu_%7Bi%2Cj%7D(D%2C%20h)%20%3D%20%5Cmathbb%7BE%7D_%7BX%5Csim%20D%7D%5Bh(X)%20%2F%20X%5Cin%20Z_i%5D%20-%20%5Cmathbb%7BE%7D_%7BX%5Csim%20D%7D%5Bh(X)%20%2F%20X%5Cin%20Z_j%5D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка µ требует доступа к маргинальному распределению данных D; если в определенных регионах Z вероятность крайне мала, они слабо влияют на итоговую оценку справедливости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Аудитор A взаимодействует с владельцем модели M, отправляя запросы для оценки свойства µ. В отличие от предыдущих работ, наше определение учитывает знак разности, что критически важно для интерпретируемости — понимания того, какая именно группа находится в невыгодном положении.&lt;/p&gt;\n&lt;h4 id=\"auditviamodelreconstruction\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#auditviamodelreconstruction\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AuditviaModelReconstruction&lt;/span&gt;&lt;/a&gt;AuditviaModelReconstruction&lt;/h4&gt;\n&lt;p&gt;В этом сценарии аудитор имеет доступ к классу гипотез H и возможность отправлять запросы к модели h. Цель состоит в том, чтобы восстановить суррогатную модель, имитируя процесс обучения внутри H. Например, ранее предлагалось использовать запросы на расхождение (disagreement queries) для поиска подкласса H, где элементы демонстрируют одинаковый статистический паритет на неразмеченном пуле данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод ReconAudit восстанавливает суррогатную модель через итеративные запросы, что требует сложности выборки &lt;span class=\"yfm-latex\" data-content=\"O(d%2F%5Cepsilon%5E2%20%5Clog%201%2F%5Cdelta)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где d — размерность VC.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Протокол взаимодействия ReconAudit включает следующие этапы: аудитор получает доступ к пулу Q и бюджету запросов T. В каждом раунде t аудитор выбирает запрос X_t из области расхождения текущего класса гипотез V_t, отправляет его владельцу модели и получает ответ h(X_t). После T раундов аудитор выбирает &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7Bh%7D%20%5Cin%20V_T\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; для создания суррогата и применяет оценщик для проверки справедливости. Основная проблема этого подхода — высокая сложность выборки, зависящая от сложности класса H, что создает риск извлечения модели (model extraction).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;VC-размерность (Vapnik-Chervonenkis dimension) — это мера емкости (сложности) статистической модели, определяющая, насколько сложные закономерности она может выучить.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ReconAudit не учитывает принадлежность к защищаемым группам в процессе обучения, что может привести к неравномерным ошибкам реконструкции для разных групп.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"auditviadirectestimation\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#auditviadirectestimation\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;AuditviaDirectEstimation&lt;/span&gt;&lt;/a&gt;AuditviaDirectEstimation&lt;/h4&gt;\n&lt;p&gt;В этом подходе аудитор делает выборки &lt;span class=\"yfm-latex\" data-content=\"O(1%2F%5Cepsilon%5E2%20%5Clog%201%2F%5Cmu)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; из каждой группы в пуле P и выполняет запросы на принадлежность, оценивая целевое свойство µ напрямую, без восстановления модели. Сложность выборки здесь зависит от количества групп k, но не от сложности класса H.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DirectAudit оценивает справедливость напрямую через запросы к группам, избегая рисков, связанных с реконструкцией модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Протокол DirectAudit работает следующим образом: для каждой группы i аудитор делает выборки из Q и запрашивает ответы модели. После T раундов вычисляются оценки попарных различий для всех групп, формируя вектор размером O(k²). Максимальное значение этого вектора принимается за оценку справедливости.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Прямая оценка (direct estimation) — статистический метод, позволяющий получить значение параметра системы, не пытаясь полностью воссоздать внутреннюю логику или структуру этой системы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Реконструкция модели накладывает более жесткие ограничения на обновление модели, чем прямая оценка, так как требует соответствия суррогата оригиналу на большом наборе данных, а не только по целевому показателю справедливости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"interpretiruemyj-audit-bez-rekonstrukcii-modeli\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#interpretiruemyj-audit-bez-rekonstrukcii-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерпретируемый аудит без реконструкции модели&lt;/span&gt;&lt;/a&gt;Интерпретируемый аудит без реконструкции модели&lt;/h4&gt;\n&lt;p&gt;В данном разделе описывается протокол аудита, который позволяет оценивать справедливость алгоритмов, не извлекая информацию напрямую из входных данных. Вместо анализа отдельных точек, мы рассматриваем пространство произведений &lt;span class=\"yfm-latex\" data-content=\"X%20%3D%20%5Cprod_%7Bi%3D1%7D%5Ek%20Z_i\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, где Z_i — группы, защищенные от дискриминации. Элемент &lt;span class=\"yfm-latex\" data-content=\"x%20%3D%20(x_1%2C%20%5Cdots%2C%20x_k)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; представляет собой набор из одного примера для каждой группы. Такой подход позволяет аудитору сосредоточиться исключительно на проверке свойств справедливости, делая аудит интерпретируемым и снижая риск кражи модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аудит переведен в плоскость сравнения групп: вместо абсолютных предсказаний модели аудитор получает только данные о различиях между защищенными группами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для формализации мы вводим класс функций F_k(H), где оператор M_k преобразует предсказания модели h в набор парных сравнений: f_h(x) = (h(x_i) - h(x_j))1 ≤ i &amp;lt; j ≤ k. Взаимодействие строится так: аудитор отправляет структурированный запрос X, а оракул модели I_M(X) возвращает только относительные расхождения между группами, скрывая абсолютные значения предсказаний.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оракул — это абстрактный интерфейс, через который аудитор получает ответы от модели, не имея доступа к ее внутренним параметрам или полным предсказаниям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"invariantnost-k-sopryazheniyu-i-vyborke\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#invariantnost-k-sopryazheniyu-i-vyborke\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инвариантность к сопряжению и выборке&lt;/span&gt;&lt;/a&gt;Инвариантность к сопряжению и выборке&lt;/h4&gt;\n&lt;p&gt;Мы доказали, что выбор стратегии сопряжения (coupling) при формировании запросов из пула данных не влияет на итоговую оценку справедливости µ. Согласно предложению 3.1, справедливость можно вычислить как &lt;span class=\"yfm-latex\" data-content=\"%5Cmu(h%2C%20D)%20%3D%20%5C%2F%5Cmathbb%7BE%7D_%7BX%20%5Csim%20%0Au%7D%5Bf_h(X)%5D%5C%2F_%7B%5Cinfty%7D%2C%20%D0%B3%D0%B4%D0%B5%20%0Au\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; — любая мера вероятности на пространстве произведений. Это означает, что для аудита не требуется моделировать совместное распределение данных между группами — достаточно оценивать ожидания парных функционалов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данный метод предполагает, что аудитор имеет доступ к неразмеченному пулу данных, из которого можно формировать кортежи для сравнения групп.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Таким образом, задача аудита смещается от попыток восстановить (реконструировать) саму модель h к оценке структурированного семейства функционалов, определенных на пространстве X. Это фундаментально отличает наш метод от подходов, основанных на реконструкции, так как аудитор напрямую исследует реляционную структуру предсказаний модели.&lt;/p&gt;\n&lt;h4 id=\"interpretiruemye-audity-cherez-zondy-smesheniya\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#interpretiruemye-audity-cherez-zondy-smesheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерпретируемые аудиты через зонды смещения&lt;/span&gt;&lt;/a&gt;Интерпретируемые аудиты через зонды смещения&lt;/h4&gt;\n&lt;p&gt;Для анализа поведения модели мы используем «зонды смещения» (bias probes), которые позволяют локализовать различия в реакциях модели на разные защищенные группы. Глобальный зонд f оценивает общую разницу в предсказаниях между группами. Зонды по признакам (feature-wise bias profiles) eq,i,j(z) показывают, как ожидаемая реакция модели меняется в зависимости от конкретного незащищенного признака q (например, дохода или возраста). Величина смещения ef_q(z) вычисляет абсолютное значение этого различия, помогая выявить области, где модель наиболее предвзята.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зонды смещения позволяют не просто зафиксировать наличие дискриминации, но и локализовать её по конкретным признакам, выявляя области пространства данных с наибольшим неравенством.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зонд смещения — это математический инструмент, который измеряет разницу в ответах модели на запросы, различающиеся только принадлежностью к защищенной группе (например, пол), при фиксированных значениях других признаков.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Рассмотрим пример кредитного скоринга: модель h решает, выдавать ли кредит. Аудитор подает пары запросов Q=(X₁, X₂) из разных групп. Зонд f1,2(Q) = h(X₁) - h(X₂) принимает значения &lt;span class=\"yfm-latex\" data-content=\"%5C%7B-1%2C%200%2C%20%2B1%5C%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Анализируя этот отклик через призму признаков (доход, возраст), аудитор получает отчет, состоящий из трех уровней: глобальный показатель неравенства, профиль смещения по признаку (направление и сила) и величина смещения (только сила). Важно: эти показатели не являются оценкой причинно-следственной связи или важности признаков, а лишь описывают наблюдаемое поведение модели.&lt;/p&gt;\n&lt;h4 id=\"interpretiruemyj-aktivnyj-audit\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#interpretiruemyj-aktivnyj-audit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерпретируемый активный аудит&lt;/span&gt;&lt;/a&gt;Интерпретируемый активный аудит&lt;/h4&gt;\n&lt;p&gt;Мы формализуем процесс аудита как задачу обучения функции сравнения f_h. Активный аудит считается обучаемым, если существует алгоритм A_m, который по выборке из m запросов &lt;span class=\"yfm-latex\" data-content=\"Q_1%2C%20%5Cdots%2C%20Q_m\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; строит оценку &lt;span class=\"yfm-latex\" data-content=\"%5Chat%7Bf%7D_m\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;, минимизирующую риск &lt;span class=\"yfm-latex\" data-content=\"E_D(f)%20%3D%20P_%7BX%20%5Csim%20D%5Ek%7D%20%5Bf(X)%20%0Aeq%20f_h(X)%5D.%20%D0%9C%D0%B8%D0%BD%D0%B8%D0%BC%D0%B0%D0%BA%D1%81%D0%BD%D0%B0%D1%8F%20%D1%81%D0%BB%D0%BE%D0%B6%D0%BD%D0%BE%D1%81%D1%82%D1%8C%20%D0%B2%D1%8B%D0%B1%D0%BE%D1%80%D0%BA%D0%B8%20%D0%BE%D0%BF%D1%80%D0%B5%D0%B4%D0%B5%D0%BB%D1%8F%D0%B5%D1%82%20%D0%BC%D0%B8%D0%BD%D0%B8%D0%BC%D0%B0%D0%BB%D1%8C%D0%BD%D0%BE%D0%B5%20%D0%BA%D0%BE%D0%BB%D0%B8%D1%87%D0%B5%D1%81%D1%82%D0%B2%D0%BE%20%D0%B7%D0%B0%D0%BF%D1%80%D0%BE%D1%81%D0%BE%D0%B2%2C%20%D0%BD%D0%B5%D0%BE%D0%B1%D1%85%D0%BE%D0%B4%D0%B8%D0%BC%D0%BE%D0%B5%20%D0%B4%D0%BB%D1%8F%20%D0%B4%D0%BE%D1%81%D1%82%D0%B8%D0%B6%D0%B5%D0%BD%D0%B8%D1%8F%20%D1%82%D0%BE%D1%87%D0%BD%D0%BE%D1%81%D1%82%D0%B8%20%5Cvarepsilon%20%D1%81%20%D0%B4%D0%BE%D0%B2%D0%B5%D1%80%D0%B8%D1%82%D0%B5%D0%BB%D1%8C%D0%BD%D0%BE%D0%B9%20%D0%B2%D0%B5%D1%80%D0%BE%D1%8F%D1%82%D0%BD%D0%BE%D1%81%D1%82%D1%8C%D1%8E%201-%5Cdelta\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Данная модель предполагает, что аудитор выбирает пары запросов заранее (фиксированная связка), что упрощает статистический эксперимент, но ограничивает возможность адаптивного изменения распределения запросов в процессе аудита.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"informacionnaya-slozhnost-obucheniya-zondov\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#informacionnaya-slozhnost-obucheniya-zondov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Информационная сложность обучения зондов&lt;/span&gt;&lt;/a&gt;Информационная сложность обучения зондов&lt;/h4&gt;\n&lt;p&gt;Для оценки аудита справедливости в мультигрупповых системах мы используем размерность Дэниели-Шварца (DS-размерность). Она основана на понятии «псевдокуба»: подмножества векторов, где каждый элемент имеет «i-соседа», отличающегося только в одной позиции. Класс функций F_k разбивает последовательность S, если набор значений функций на этой последовательности содержит m-мерный псевдокуб. DS-размерность DS_k(F) — это максимальный размер такого разбиения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;DS-размерность определяет предел обучаемости зондов: если она бесконечна, пассивное обучение невозможно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В отличие от стандартного обучения, где область разногласий (disagreement set) отражает неопределенность меток, в аудите справедливости она кодирует сравнительную неопределенность между защищенными группами. Мы вводим «мульти-звездное число» (s_k) — максимальное m, при котором существуют точки X_i и функции f₀, f_i, такие что область разногласий между ними состоит ровно из одной точки X_i. Доказано, что s_k ограничено сверху DS-размерностью. Это означает, что конечность s_k является необходимым и достаточным условием для активного обучения зондов.&lt;/p&gt;\n&lt;h4 id=\"informacionno-teoreticheskoe-razdelenie-rekonstrukcii-i-zondovogo-audita\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#informacionno-teoreticheskoe-razdelenie-rekonstrukcii-i-zondovogo-audita\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Информационно-теоретическое разделение реконструкции и зондового аудита&lt;/span&gt;&lt;/a&gt;Информационно-теоретическое разделение реконструкции и зондового аудита&lt;/h4&gt;\n&lt;p&gt;Известно, что для линейных классификаторов «звездное число» не ограничено, что делает активный аудит через реконструкцию модели крайне неэффективным и рискованным (возможна утечка модели). Предложение 3.2 показывает, что аудит через обучение зондов (bias probing) позволяет избежать этого барьера, так как фокусируется на конкретных свойствах, а не на восстановлении всей модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Аудит через обучение зондов имеет конечную сложность s_k, в то время как реконструкция модели сталкивается с неограниченной комбинаторной сложностью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rezhim-bez-manipulyacij\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#rezhim-bez-manipulyacij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Режим без манипуляций&lt;/span&gt;&lt;/a&gt;Режим без манипуляций&lt;/h4&gt;\n&lt;p&gt;Мы рассматриваем сценарий, где владелец модели не пытается скрыть предвзятость. Теорема 3.1 устанавливает нижнюю границу сложности выборки. Для любого активного аудитора, делающего m запросов, существует распределение D и целевая функция f_h^*, при которых вероятность ошибки превышает ε с вероятностью не менее δ. Это подтверждает, что использование функционалов сравнения не отменяет статистическую сложность, а переносит её на геометрию класса сравнения F.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Теорема 3.1 показывает, что даже при активном аудите сложность выборки ограничена структурными параметрами s_k и DS_k.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"slozhnost-atak-po-izvlecheniyu-modeli\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#slozhnost-atak-po-izvlecheniyu-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сложность атак по извлечению модели&lt;/span&gt;&lt;/a&gt;Сложность атак по извлечению модели&lt;/h4&gt;\n&lt;p&gt;В данном разделе рассматривается сложность извлечения базовой модели M с вычислительной и теоретико-информационной точек зрения.&lt;/p&gt;\n&lt;p&gt;Вычислительная сложность. Авторы показывают, что извлечение модели на основе зондов смещения является вычислительно трудной задачей. Процедура аудита включает интерактивный протокол, где аудитор взаимодействует с владельцем модели через ограниченное число запросов B (cross-group queries, CGQ). Задача формализуется как B-ограниченное реляционное извлечение, где целью является поиск подмножества запросов Q', позволяющих однозначно идентифицировать неизвестную гипотезу из конечного класса H₀. Теорема 3.2 устанавливает, что восстановление модели h из черного ящика является NP-трудной задачей. Это создает барьер: хотя зонды смещения позволяют оценивать такие свойства, как групповая справедливость, они не предоставляют достаточной информации для эффективной реконструкции самой модели.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Восстановление исходной модели на основе запросов к зондам смещения является NP-трудной задачей, что делает универсальную реконструкцию модели практически невыполнимой.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Теоретико-информационная сложность. Здесь авторы количественно оценивают объем информации об идентичности владельца модели, раскрываемой в ходе аудита. При равномерном априорном распределении на множестве гипотез H, неопределенность до начала аудита составляет &lt;span class=\"yfm-latex\" data-content=\"eI_0%20%3D%20%5Clog_2%20%2FH%2F\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; бит. После t взаимодействий, когда остается подмножество гипотез V_t, утечка идентичности определяется как &lt;span class=\"yfm-latex\" data-content=\"I_t%20%3D%20%5Clog_2%20(%2FH%2F%20%2F%20%2FV_t%2F)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;. Например, при сокращении пространства гипотез с 1000 до 20, утечка составляет около 5,64 бит.&lt;/p&gt;\n&lt;h4 id=\"proektirovanie-algoritma-k-alebi-i-verhnie-granicy\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#proektirovanie-algoritma-k-alebi-i-verhnie-granicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проектирование алгоритма: k-ALeBi и верхние границы&lt;/span&gt;&lt;/a&gt;Проектирование алгоритма: k-ALeBi и верхние границы&lt;/h4&gt;\n&lt;p&gt;Алгоритм k-ALeBi (Active Learning for Bias) использует итеративный процесс для уточнения пространства версий V_t. На каждом шаге t алгоритм выбирает запросы из распределения &lt;span class=\"yfm-latex\" data-content=\"%0Au.%20%D0%95%D1%81%D0%BB%D0%B8%20%D0%B7%D0%B0%D0%BF%D1%80%D0%BE%D1%81%20%D0%BF%D0%BE%D0%BF%D0%B0%D0%B4%D0%B0%D0%B5%D1%82%20%D0%B2%20%D0%BE%D0%B1%D0%BB%D0%B0%D1%81%D1%82%D1%8C%20%D0%BD%D0%B5%D0%BE%D0%BF%D1%80%D0%B5%D0%B4%D0%B5%D0%BB%D0%B5%D0%BD%D0%BD%D0%BE%D1%81%D1%82%D0%B8%20(disagreement%20set)%2C%20%D0%BE%D0%BD%20%D0%BE%D1%82%D0%BF%D1%80%D0%B0%D0%B2%D0%BB%D1%8F%D0%B5%D1%82%D1%81%D1%8F%20%D0%BA%20%D0%BE%D1%80%D0%B0%D0%BA%D1%83%D0%BB%D1%83%20M_k%2C%20%D0%B8%20%D0%BF%D1%80%D0%BE%D1%81%D1%82%D1%80%D0%B0%D0%BD%D1%81%D1%82%D0%B2%D0%BE%20%D0%B2%D0%B5%D1%80%D1%81%D0%B8%D0%B9%20%D0%BE%D0%B1%D0%BD%D0%BE%D0%B2%D0%BB%D1%8F%D0%B5%D1%82%D1%81%D1%8F%20%D0%BD%D0%B0%20%D0%BE%D1%81%D0%BD%D0%BE%D0%B2%D0%B5%20%D0%BF%D0%BE%D0%BB%D1%83%D1%87%D0%B5%D0%BD%D0%BD%D0%BE%D0%B3%D0%BE%20%D0%BE%D1%82%D0%B2%D0%B5%D1%82%D0%B0%20Y%5E%7B(t)%7D%20%5Cin%20%5C%7B-1%2C%200%2C%201%5C%7D%5E%7B(k%5E2)%7D.%20%D0%98%D1%82%D0%BE%D0%B3%D0%BE%D0%B2%D1%8B%D0%B9%20%D0%BE%D1%82%D1%87%D0%B5%D1%82%20%D0%B0%D1%83%D0%B4%D0%B8%D1%82%D0%B0%20%D0%B2%D0%BA%D0%BB%D1%8E%D1%87%D0%B0%D0%B5%D1%82%20%D0%B3%D0%BB%D0%BE%D0%B1%D0%B0%D0%BB%D1%8C%D0%BD%D1%8B%D0%B9%20%D0%B7%D0%BE%D0%BD%D0%B4%20%D1%81%D0%BC%D0%B5%D1%89%D0%B5%D0%BD%D0%B8%D1%8F%20%5Chat%7Bf%7D\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; и оценки для отдельных признаков.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;PAC-обучение (Probably Approximately Correct) — это теоретическая модель, гарантирующая, что алгоритм с высокой вероятностью найдет гипотезу с ошибкой, не превышающей заданный порог ε.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Теорема 3.3 доказывает, что k-ALeBi является PAC-активным аудитором. С вероятностью не менее 1-δ он выдает результат с ошибкой не более ε, используя &lt;span class=\"yfm-latex\" data-content=\"O(%5Cmin%20%5C%7Bn%2C%20(e-1)%20%5Cdots%20%5C%7D)\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; запросов. Анализ показывает, что при определенных условиях (например, если DS_k = O(1)) верхние и нижние границы сложности совпадают с точностью до логарифмических множителей. Следствие 3.1 устанавливает, что мультиклассовый класс F является PAC-активно обучаемым тогда и только тогда, когда число мульти-звезд s_k(F) &amp;lt; ∞.&lt;/p&gt;\n&lt;h4 id=\"fairness-aware-adversarial-regime\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#fairness-aware-adversarial-regime\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Fairness-aware Adversarial Regime&lt;/span&gt;&lt;/a&gt;Fairness-aware Adversarial Regime&lt;/h4&gt;\n&lt;p&gt;Исследование рассматривает адаптивного владельца модели, который может искажать ответы аудитора, если тот пытается выявить неравенство в группах. Для защиты от таких манипуляций вводится алгоритм Robust k-ALeBi. Предположение 3.1 (Локальная реплицируемость) требует, чтобы для каждого запроса существовала окрестность J(X) с вероятностной массой не менее γ, где ответы модели стабильны с вероятностью &lt;span class=\"yfm-latex\" data-content=\"1-%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; (при &lt;span class=\"yfm-latex\" data-content=\"%5Crho%20%3C%201%2F2\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;). Это позволяет аудитору получать надежные данные, даже если владелец модели пытается скрыть предвзятость.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Алгоритм Robust k-ALeBi минимизирует влияние предвзятых ответов владельца модели, используя локальное усреднение ответов в окрестностях запросов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"adaptive-fairness-aware-adversary-algorithm-and-upper-bounds\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#adaptive-fairness-aware-adversary-algorithm-and-upper-bounds\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Adaptive Fairness-aware Adversary: Algorithm and Upper Bounds&lt;/span&gt;&lt;/a&gt;Adaptive Fairness-aware Adversary: Algorithm and Upper Bounds&lt;/h4&gt;\n&lt;p&gt;Вводится понятие условной вероятностной атаки (Определение 3.8), где вероятность искажения ответа A_r=1 ограничена величиной p &amp;lt; 1/2. Алгоритм 4 (Robust k-ALeBi) использует подпрограмму LocalLabel для сбора R независимых выборок из окрестности J(X_t). Итоговый ответ определяется как наиболее часто встречающийся среди полученных меток. Параметр &lt;span class=\"yfm-latex\" data-content=\"%5Cbeta%20%3D%20p%20%2B%20%5Crho%20-%20p%5Crho\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt; объединяет ошибки, вызванные как локальной нестабильностью, так и преднамеренным искажением.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод режективного сэмплирования (rejection sampling) используется для получения выборок из целевой области J(X) путем многократного обращения к неразмеченному пулу данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Теорема 3.4 устанавливает, что Robust k-ALeBi является PAC-активным аудитором. Сложность выборки возрастает пропорционально (1-2β)⁻², что отражает необходимость дополнительных запросов для компенсации манипуляций владельца модели. Если вероятность попадания в информативную область γ мала, аудитору требуется больше попыток для сбора достаточного количества данных. Этот подход эксплуатирует регулярность классов моделей (например, конечную размерность Вапника-Червоненкиса), предполагая, что ответы внутри одной ячейки J(X) должны быть согласованы.&lt;/p&gt;\n&lt;h4 id=\"global-information-theoretic-hardness\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#global-information-theoretic-hardness\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Global Information-theoretic Hardness&lt;/span&gt;&lt;/a&gt;Global Information-theoretic Hardness&lt;/h4&gt;\n&lt;p&gt;Стандартное определение «звездного числа» (starnumber) не всегда позволяет установить нижнюю границу сложности для оценки справедливости в нескольких группах (multi-group fairness). Разные функции-зонды могут существенно различаться, даже если они дают одинаковый результат для статистического паритета по всем k парам групп. Для решения этой проблемы введено понятие «эффективного звездного числа справедливости» µ(F). Это супремум всех целых чисел m, для которых существуют различные запросы CGQ и функции из класса F, где зонд корректно различает справедливые и несправедливые состояния на «звездном множестве».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективное звездное число справедливости µ(F) позволяет сфокусироваться на различиях, которые напрямую влияют на метрику справедливости, игнорируя нерелевантные расхождения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;CGQ (Conditional Group Queries) — это тип запросов к модели, которые позволяют аудитору проверять поведение алгоритма в специфических условиях для разных групп.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для вывода нижней границы сложности оценки справедливости при вероятностных атаках введено «Предположение 3.2» (&lt;a href=\"concepts/cell.html\"&gt;Cell&lt;/a&gt;-replicability). Оно постулирует, что модель h^* ведет себя достаточно стабильно внутри определенных измеримых ячеек пространства запросов. Это позволяет аудитору воспроизводить реакцию модели, используя несколько выборок из одной ячейки. Теорема 3.5 утверждает, что для обучения зонда при вероятности атаки p &amp;lt; 1/2 необходим набор запросов размера &lt;span class=\"yfm-latex\" data-content=\"%5COmega(%5Cmin(s%5Cmu(F)%2C%201%2F%5Cepsilon))\" data-options=\"%7B%22displayMode%22%3Afalse%7D\"&gt;&lt;/span&gt;.&lt;/p&gt;\n&lt;h4 id=\"experimental-analysis\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#experimental-analysis\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Experimental Analysis&lt;/span&gt;&lt;/a&gt;Experimental Analysis&lt;/h4&gt;\n&lt;p&gt;Эмпирическая оценка фреймворка проводится по трем направлениям: точность обученного зонда смещения, оценка справедливости и эффективность вычислений. В качестве классификаторов h используются линейная модель, случайный лес и многослойный перцептрон (MLP). &lt;a href=\"concepts/dataset.html\"&gt;Набор данных&lt;/a&gt; формируется путем запросов к модели на неразмеченных выборках. Исследование использует наборы данных COMPAS (k=2 группы), German Credit (k=4) и Student. Для обеспечения воспроизводимости каждый эксперимент запускается с 10 случайными сидами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Случайный сид (random seed) — начальное число для генератора случайных чисел, обеспечивающее идентичность результатов при повторном запуске эксперимента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"accuracy\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#accuracy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Accuracy&lt;/span&gt;&lt;/a&gt;Accuracy&lt;/h4&gt;\n&lt;p&gt;Метод k-ALeBi сравнивается с DirectAudit, ReconAudit и DiamAudit. Согласно Рис. 4, после 1000 запросов k-ALeBi демонстрирует значительно меньшую ошибку оценки, чем базовые методы. При сравнении с DiamAudit (в условиях k=2 и линейного класса гипотез) k-ALeBi также показывает лучшие результаты. На наборе COMPAS ошибка оценки k-ALeBi составила 0,0000213 против 0,000046 у DiamAudit. На наборе Student ошибка k-ALeBi составила 0,006947.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f4.jpg\" alt=\"Рисунок 4: Ошибка оценки многогрупповой справедливости при ограниченном бюджете.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Ошибка оценки многогрупповой справедливости при ограниченном бюджете.&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты получены на конкретных бенчмарках; эффективность метода может варьироваться в зависимости от архитектуры модели и распределения данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zashita-ot-atak-po-izvlecheniyu-modeli\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#zashita-ot-atak-po-izvlecheniyu-modeli\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Защита от атак по извлечению модели&lt;/span&gt;&lt;/a&gt;Защита от атак по извлечению модели&lt;/h4&gt;\n&lt;p&gt;Исследование разграничивает аудит справедливости алгоритмов и раскрытие данных, необходимых для восстановления исходной модели. При ограниченном бюджете запросов метод Cross Group Queries (CGQ) позволяет сохранять пространство версий моделей с похожим поведением, обеспечивая при этом точные оценки справедливости. Это доказывает эмпирическое разделение между полезностью аудита и идентификацией модели: можно получить данные о справедливости, не раскрывая индивидуальные предсказания, нужные для реконструкции.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Метод k-ALeBi обеспечивает аудит справедливости с существенно меньшей утечкой данных об идентичности модели по сравнению с ReconAudit.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На Рис. 9 сравнивается утечка идентичности для k-ALeBi и ReconAudit. ReconAudit использует запросы принадлежности, раскрывающие метки модели, тогда как k-ALeBi работает через реляционные CGQ, не раскрывая индивидуальные метки напрямую. Согласно мере утечки идентичности (определение 3.7), k-ALeBi демонстрирует значительно меньшие показатели при сохранении точности аудита. Рис. 10 сравнивает k-ALeBi с DiamAudit, показывая, что k-ALeBi предоставляет полезную информацию через CGQ без необходимости раскрытия индивидуальных предсказаний, характерного для атак на основе запросов принадлежности.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f9.jpg\" alt=\"Рисунок 9: Утечка идентичности, измеряемая количеством индивидуальных ответов модели, раскрытых аудитору, при сравнении \" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 9: Утечка идентичности, измеряемая количеством индивидуальных ответов модели, раскрытых аудитору, при сравнении k-ALeBi с ReconAudit.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f10.jpg\" alt=\"Рисунок 10: Поведение извлечения модели при использовании k-ALeBi и DiamAudit: точность суррогатной модели извлечения от\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 10: Поведение извлечения модели при использовании k-ALeBi и DiamAudit: точность суррогатной модели извлечения относительно целевой модели и количество абсолютных меток, раскрытых злоумышленнику.&lt;/em&gt;&lt;/p&gt;\n&lt;h4 id=\"ustojchivost-k-sostyazatelnym-atakam,-uchityvayushim-spravedlivost\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#ustojchivost-k-sostyazatelnym-atakam,-uchityvayushim-spravedlivost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устойчивость к состязательным атакам, учитывающим справедливость&lt;/span&gt;&lt;/a&gt;Устойчивость к состязательным атакам, учитывающим справедливость&lt;/h4&gt;\n&lt;p&gt;Авторы оценили устойчивость Robust k-ALeBi к атакам, направленным на искажение аудита справедливости. На модели COMPAS-linear при высоком уровне коррупции p=0.40 злоумышленник в среднем вносит 41,4 искажения координат, из которых после фильтрации лишь 6,2 влияют на запросы. Несмотря на это, ошибка оценки справедливости возрастает незначительно: с 0,019 до 0,021, при этом скрытие данных не наблюдалось в пяти прогонах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Коррупция данных — это преднамеренное внесение шума или искажений в запросы для обмана алгоритма аудита.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для сравнения, ошибка реконструкции ReconAudit при атаке возрастает с 0 до 0,074, при этом уровень сокрытия достигает 0,20. Базовый метод Yan и Zhang (2022) показывает ошибку оценки 0,03 без атаки, которая возрастает до 0,05 при максимальной вероятности атаки 0,12. Аналогичная стабильность Robust k-ALeBi подтверждена на моделях German-linear и Student-linear.&lt;/p&gt;\n&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"rasshirennoe-opisanie-struktury\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#rasshirennoe-opisanie-struktury\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Расширенное описание структуры&lt;/span&gt;&lt;/a&gt;Расширенное описание структуры&lt;/h4&gt;\n&lt;p&gt;В работе проведено разграничение между двумя методами аудита справедливости моделей машинного обучения: реконструктивным и зондовым (probe-based). Исследователи определили задачу обучения зондов через показатель «мультиконтекстного звездного числа» (multi-context star number). Установлено, что даже в случаях, когда реконструктивный аудит линейных классификаторов невозможен, зондовый подход сохраняет обучаемость, что решает поставленный вопрос Q1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зондовый подход к аудиту позволяет выявлять предвзятость моделей даже там, где реконструктивные методы оказываются неэффективными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На основе этой формулировки был разработан алгоритм аудита, который обучается интерпретируемым зондам предвзятости. Это позволяет получать данные аудита непосредственно в терминах интересующего свойства справедливости, что отвечает на вопрос Q2. В заключение авторы проанализировали задачу аудита в условиях противодействия со стороны «осведомленного о справедливости» (fairness-aware) противника. Были установлены верхние и нижние границы сложности аудита, что закрывает вопрос Q3.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зонд (probe) в машинном обучении — это вспомогательная модель, которая обучается для извлечения специфической информации из основной модели, чтобы проверить её на наличие скрытых закономерностей или предвзятости.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f1.jpg\" alt=\"Рисунок 1: Интерактивный аудит справедливости против состязательной модели, учитывающей критерии справедливости.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Интерактивный аудит справедливости против состязательной модели, учитывающей критерии справедливости.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f2.jpg\" alt=\"Рисунок 2: Интерактивный аудит справедливости посредством группового разделения пула.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 2: Интерактивный аудит справедливости посредством группового разделения пула.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f3.jpg\" alt=\"Рисунок 3: Интерактивный аудит справедливости: настройки и протокол взаимодействия.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Интерактивный аудит справедливости: настройки и протокол взаимодействия.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f5.jpg\" alt=\"Рисунок 5: Ошибка оценки метода DiamAudit в применимых условиях.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 5: Ошибка оценки метода DiamAudit в применимых условиях.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f6.jpg\" alt=\"Рисунок 6: Ранжирование признаков на основе оценок различий, полученных с помощью зондов.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Ранжирование признаков на основе оценок различий, полученных с помощью зондов.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f7.jpg\" alt=\"Рисунок 7: Визуализация обученных зондов по признакам на наборе данных COMPAS.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Визуализация обученных зондов по признакам на наборе данных COMPAS.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f8.jpg\" alt=\"Рисунок 8: Визуализация обученных зондов по признакам на наборе данных Student.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 8: Визуализация обученных зондов по признакам на наборе данных Student.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f11.jpg\" alt=\"Рисунок 11: Локальный бюджет CGQ для Robust k-ALeBi по ячейкам как функция вероятности атаки.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 11: Локальный бюджет CGQ для Robust k-ALeBi по ячейкам как функция вероятности атаки.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f11-2.jpg\" alt=\"Рис. 11 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 11 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f13.jpg\" alt=\"Рисунок 13: Общая структура аудита, специфичная для свойств.\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 13: Общая структура аудита, специфичная для свойств.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f14.jpg\" alt=\"Рисунок 14: Двумерный контрпример для линейного классификатора в условиях активного обучения: синие точки xi представляю\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 14: Двумерный контрпример для линейного классификатора в условиях активного обучения: синие точки xi представляют ковариаты, темные линии представляют классификаторы hi.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f15.jpg\" alt=\"Рисунок 15: Иллюстрация контрпримера Дасгупты (2004) в контексте аудита справедливости. Красные точки представляют выбор\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 15: Иллюстрация контрпримера Дасгупты (2004) в контексте аудита справедливости. Красные точки представляют выборки из первой защищенной группы, а зеленые точки — выборки из второй защищенной группы.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f16.jpg\" alt=\"Рисунок 16: Поля смещения (bias canvases) для признака 1 (справа) и признака 2 (слева).\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 16: Поля смещения (bias canvases) для признака 1 (справа) и признака 2 (слева).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f17.jpg\" alt=\"Рис. 17\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 17&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias-f18.jpg\" alt=\"Рис. 18\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 18&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/efficient-active-auditing-of-multi-group-fairness-with-bias.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;риск&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;предвзятости в&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;черных ящиках&lt;/text&gt;&lt;path stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#7A3FCC\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#A97BE0\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;активн
