otencial-dlya-opravdaniya-ili-provocirovaniya-nasiliya,-vliyayushego-na-dolgosrochnoe-zdorove-i-usloviya-zhizni\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Потенциал для оправдания или провоцирования насилия, влияющего на долгосрочное здоровье и условия жизни&lt;/span&gt;&lt;/a&gt;Потенциал для оправдания или провоцирования насилия, влияющего на долгосрочное здоровье и условия жизни&lt;/h4&gt;\n&lt;p&gt;Дезинформация исторически используется для поощрения вербальной или физической агрессии против отдельных лиц или групп. Способность ИИ имитировать внешность людей для их дискредитации создает новый инструмент для усиления таких угроз. В рамках данной модели рисков рассматриваются случаи, когда онлайн-травля перерастает в систематические оскорбления и угрозы, способные нанести долгосрочный ущерб психическому или физическому здоровью жертвы, вынуждая её менять место жительства или искать защиты. Риск возрастает при наличии у объекта прошлых травм, а также при высокой детализации, реалистичности и повторяемости контента.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель рисков вреда — аналитический подход, оценивающий вероятность того, что онлайн-контент приведет к реальным последствиям, таким как физическое насилие или долгосрочные психологические травмы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В исследуемом наборе данных выявлено восемь примеров ИИ-контента, способного формировать установки, ведущие к насилию. В частности, проанализировано изображение, имитирующее Арсена Островского (пострадавшего в ходе стрельбы на Бондай-Бич в декабре 2025 года). Авторы классифицировали этот контент как обладающий существенным потенциалом для провоцирования систематической травли, способной повлиять на здоровье человека в среднесрочной или долгосрочной перспективе, хотя прямых доказательств такого воздействия в данном случае не зафиксировано.&lt;/p&gt;\n&lt;h4 id=\"prichinenie-pryamogo-finansovogo-usherba-cherez-onlajn-moshennichestvo\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#prichinenie-pryamogo-finansovogo-usherba-cherez-onlajn-moshennichestvo\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Причинение прямого финансового ущерба через онлайн-мошенничество&lt;/span&gt;&lt;/a&gt;Причинение прямого финансового ущерба через онлайн-мошенничество&lt;/h4&gt;\n&lt;p&gt;Ежегодный ущерб экономике Великобритании от кибермошенничества оценивается в 14,7 млрд фунтов стерлингов, из которых 1,3 млрд фунтов приходится на прямые потери физических лиц. ИИ расширяет возможности злоумышленников, позволяя создавать убедительные дипфейки: от фальшивых рекомендаций товаров известными экспертами до имитации близких людей, якобы попавших в беду и нуждающихся в деньгах.&lt;/p&gt;\n&lt;p&gt;В выборке исследования зафиксирован контент, где с помощью ИИ утверждалось, что финансовый эксперт Мартин Льюис был арестован за продвижение криптовалютной платформы Swiftgate Montark. Подобные материалы направлены на обман лиц, доверяющих мнению эксперта. Авторы отмечают, что использование ИИ для подделки рекомендаций публичных личностей является растущей и широко распространенной угрозой.&lt;/p&gt;\n&lt;h4 id=\"prichinenie-pryamogo-vreda-zdorovyu-otdelnyh-lic-i-naseleniya\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#prichinenie-pryamogo-vreda-zdorovyu-otdelnyh-lic-i-naseleniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Причинение прямого вреда здоровью отдельных лиц и населения&lt;/span&gt;&lt;/a&gt;Причинение прямого вреда здоровью отдельных лиц и населения&lt;/h4&gt;\n&lt;p&gt;Исследования показывают, что дезинформация может наносить вред здоровью через искажение представлений о восьми ключевых аспектах: (i) психическое здоровье, включая ложные данные о предрасположенности групп населения; (ii) суициды и самоповреждения; (iii) доступность и качество медицинских услуг; (iv) эффективность и риски методов лечения (включая продвижение опасных альтернатив); (v) причины, симптомы и способы передачи заболеваний; (vi) влияние диеты и образа жизни на организм; (vii) действия медицинских работников и фармацевтических компаний; (viii) соблюдение населением санитарно-гигиенических норм.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дезинформация в здравоохранении — это распространение ложных или вводящих в заблуждение сведений, которые могут привести к отказу от доказательной медицины или принятию вредных для здоровья решений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В рамках анализа датасета авторы выявили видео, созданное с помощью ИИ, где эксперт в области общественного здравоохранения якобы рекламирует неэффективные и потенциально опасные «биологически активные добавки» для женщин в период менопаузы. Согласно существующим научным данным, публика склонна переходить на непроверенные методы лечения, отказываясь от эффективной терапии, если сталкивается с убедительной дезинформацией. Модель оценки рисков, примененная в исследовании, классифицировала данный контент как обладающий существенным потенциалом причинения вреда здоровью аудитории. Этот пример является частью более широкой тенденции использования ИИ для создания дипфейков с участием авторитетных лиц, что создает системные риски для общественного здравоохранения.&lt;/p&gt;\n&lt;h4 id=\"vliyanie-na-doverie-k-policii-i-sudebnoj-sisteme\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#vliyanie-na-doverie-k-policii-i-sudebnoj-sisteme\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние на доверие к полиции и судебной системе&lt;/span&gt;&lt;/a&gt;Влияние на доверие к полиции и судебной системе&lt;/h4&gt;\n&lt;p&gt;Исследования показывают, что дезинформация способна подрывать доверие общества к правоохранительным и судебным органам, влияя как на восприятие их работы, так и на готовность граждан к взаимодействию с ними. В рамках данного исследования был проанализирован массив данных, в котором выявлено три примера контента с существенным потенциалом снижения общественного доверия. К ним относятся два вирусных изображения, созданных с помощью ИИ, на которых полицейские якобы преклоняют колени перед группой мусульман, а также сгенерированное ИИ видео, где солдат критикует полицейского за неспособность противостоять преступности со стороны «захватчиков».&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ИИ-генерация контента (AI-generated content) — это использование алгоритмов машинного обучения для создания реалистичных, но вымышленных изображений или видео, которые могут быть использованы для введения аудитории в заблуждение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"vliyanie-na-obshestvennoe-mnenie-o-klimaticheskoj-politike\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#vliyanie-na-obshestvennoe-mnenie-o-klimaticheskoj-politike\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Влияние на общественное мнение о климатической политике&lt;/span&gt;&lt;/a&gt;Влияние на общественное мнение о климатической политике&lt;/h4&gt;\n&lt;p&gt;Многолетние научные данные подтверждают, что ложные нарративы о причинах изменения климата и эффективности мер по борьбе с ним способны менять общественное мнение, что, в свою очередь, влияет на государственную политику. В последние годы, по мере накопления доказательств реальности климатических изменений, фокус дезинформации сместился на преувеличение негативных последствий климатических мер для повседневной жизни граждан. В проанализированном наборе данных был обнаружен пример использования ИИ-контента для распространения ложного утверждения о том, что правительство Великобритании якобы планирует ограничить количество авиаперелетов до двух в год для каждого человека. Повторное воздействие подобной дезинформации, согласно существующим исследованиям, обладает потенциалом для изменения отношения общественности к экологическим инициативам, что может привести к корректировке политических решений.&lt;/p&gt;\n&lt;h4 id=\"7-povyshenie-vospriimchivosti-k-teoriyam-zagovora-s-potencialom-prichineniya-vreda\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#7-povyshenie-vospriimchivosti-k-teoriyam-zagovora-s-potencialom-prichineniya-vreda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Повышение восприимчивости к теориям заговора с потенциалом причинения вреда&lt;/span&gt;&lt;/a&gt;7. Повышение восприимчивости к теориям заговора с потенциалом причинения вреда&lt;/h4&gt;\n&lt;p&gt;Исследования показывают, что восприимчивость к конспирологическим убеждениям зависит от множества факторов: от жизненного опыта до индивидуальных особенностей, таких как когнитивно-перцептивная шизотипия (склонность к поспешным выводам и предвзятость против опровергающих доказательств) и субклиническая психопатия. Анализ данных в рамках данного исследования выявил 11 записей, некоторые из которых набрали миллионы просмотров, распространяющих контент, созданный ИИ. Этот контент подпитывал различные теории заговора, касающиеся вмешательства правительства в частную жизнь и личные свободы граждан. Такие нарративы обладают существенным потенциалом для влияния на социальные и политические установки, способствуя распространению вредоносных теорий заговора.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Когнитивно-перцептивная шизотипия — это психологический конструкт, описывающий склонность человека к необычным убеждениям и поспешным выводам при недостатке данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"8-vliyanie-na-izmenenie-socialnyh-i-politicheskih-ustanovok\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#8-vliyanie-na-izmenenie-socialnyh-i-politicheskih-ustanovok\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Влияние на изменение социальных и политических установок&lt;/span&gt;&lt;/a&gt;8. Влияние на изменение социальных и политических установок&lt;/h4&gt;\n&lt;p&gt;Вопрос о влиянии дезинформации на политические и социальные установки является предметом давних дискуссий. Начиная с философа Фрэнсиса Бэкона, исследователи отмечали, что, хотя фактические знания могут меняться под воздействием новых доказательств, сформированные взгляды и мнения меняются крайне медленно. В случаях, когда изменения всё же происходят, ключевую роль играют широкие социальные факторы, а не только медиа. Тем не менее, многолетние исследования подтверждают мощный эффект повторения: многократное воздействие информации повышает её субъективную достоверность в восприятии аудитории. Более современные лонгитюдные исследования подтверждают теорию долгосрочного влияния медиа на поведение и установки граждан.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффект повторения (illusory truth effect) — психологическое явление, при котором люди склонны оценивать утверждения как более правдивые просто из-за того, что они слышали их неоднократно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;В рамках исследования был проанализирован набор данных из 112 записей, в 71 из которых (63,4%) обнаружен контент, созданный искусственным интеллектом (ИИ) на политические темы. Наиболее распространенным типом (51,8% от общего числа записей) стало искажение действий или высказываний известных политиков. В этих случаях использовались дипфейки (видео или аудио) для имитации заявлений о несуществующих политических решениях или вымышленных инцидентах. Еще 18 записей (16%) содержали искажения в отношении поведения или отношения к определенным социальным группам, а 14 записей (12,5%) формировали ложное представление о государственном управлении, включая 11 случаев конспирологических теорий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дипфейк — это медиаконтент, созданный с помощью ИИ, который имитирует внешность, голос или действия реального человека, создавая иллюзию подлинности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Среди политиков чаще всего объектом манипуляций становился премьер-министр Кир Стармер. Основные нарративы включали фальшивые заявления о введении непопулярных мер: штрафов, сборов за использование общественных туалетов, налогов на праздничные украшения или ограничений на снятие наличных. Также часто встречались темы, связанные с действиями полиции в отношении мусульман и мигрантов. Использование схожих шаблонов в этих материалах указывает на организованный характер распространения, однако текущий набор данных не позволяет подтвердить наличие единого координатора. Исследование не ставило целью оценить реальное влияние этих материалов на общественное мнение, однако авторы отмечают, что технические условия для такого воздействия были созданы.&lt;/p&gt;\n&lt;h4 id=\"predely-korrelyacii-mezhdu-viralnostyu-i-potencialnym-effektom\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#predely-korrelyacii-mezhdu-viralnostyu-i-potencialnym-effektom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Пределы корреляции между виральностью и потенциальным эффектом&lt;/span&gt;&lt;/a&gt;Пределы корреляции между виральностью и потенциальным эффектом&lt;/h4&gt;\n&lt;p&gt;Связь между охватом аудитории, которую получает ложное утверждение, и его потенциальным воздействием на общество является более сложной, чем принято считать в упрощенных моделях.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Исследование анализирует механизмы, посредством которых ложные утверждения могут приводить к реальным последствиям. Авторы выделяют два сценария: массовое воздействие, требующее охвата десятков или сотен тысяч человек, и точечное воздействие, когда информация достигает одного конкретного лица, способного принять критическое решение. Примером последнего служит ситуация 2000 года, когда ложная теория о причинах СПИДа, опубликованная в научном журнале, повлияла на политику президента ЮАР Табо Мбеки, что привело к тяжелым последствиям для общественного здравоохранения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Виральность — это способность контента быстро распространяться в сети, однако авторы подчеркивают, что охват аудитории не всегда коррелирует с реальным влиянием на события.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ датасета показал, что большинство виральных публикаций (с охватом более 1 млн просмотров) не имели значимого потенциала для серьезных последствий. Это объясняется либо узкой направленностью неточностей, либо отсутствием у аудитории мотивации или возможности действовать в соответствии с ложным утверждением. Даже в случаях, когда дезинформация охватывает огромную аудиторию, как в случае с теорией «Пиццагейт» в 2016 году, лишь единицы переходят к активным действиям, хотя масштаб охвата статистически повышает вероятность таких инцидентов.&lt;/p&gt;\n&lt;h4 id=\"masshtab-posledstvij\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#masshtab-posledstvij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Масштаб последствий&lt;/span&gt;&lt;/a&gt;Масштаб последствий&lt;/h4&gt;\n&lt;p&gt;Масштаб и тяжесть последствий зависят от контекста. В изученном наборе данных 1 случай потенциально затрагивал конкретного человека, подвергшегося травле; 8 случаев касались отдельных лиц (например, финансовые потери от мошенничества или следование ложным медицинским советам); 10 случаев были направлены против конкретных сообществ (например, дискриминация религиозных или социальных групп); 39 случаев имели потенциал воздействия на общество в целом (влияние на политические или социальные установки). В 20 случаях масштаб потенциального воздействия определить не удалось.&lt;/p&gt;\n&lt;h4 id=\"6-rekomendacii\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#6-rekomendacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Рекомендации&lt;/span&gt;&lt;/a&gt;6. Рекомендации&lt;/h4&gt;\n&lt;p&gt;Авторы рекомендуют платформам социальных сетей и поисковым системам внедрить политики раскрытия информации для контента, созданного или отредактированного с помощью ИИ. Эти меры должны охватывать темы, связанные с действиями политиков, избирательными процессами, организацией протестов, вопросами ментального здоровья, сексуальным поведением, методами лечения, репродуктивным здоровьем, спортом и доступом к медицинским услугам.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Организация Full Fact (благотворительный фонд № 1158683, некоммерческая компания № 6975984) предлагает комплекс мер по регулированию контента, созданного искусственным интеллектом (ИИ). Для борьбы с дезинформацией предлагается внедрить систему «трех предупреждений»: авторы, систематически скрывающие использование ИИ в нарушение правил сообщества, должны блокироваться на платформах на постоянной основе. Важным направлением является технологическое сотрудничество компаний для выявления «посева» (seeding) и копирования контента, что особенно актуально в периоды выборов или кризисов. Также подчеркивается необходимость участия в создании международных стандартов косвенного раскрытия информации и обеспечения доступа исследователей к данным о точности инструментов модерации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Посев» контента — это стратегия распространения информации, при которой кампания запускается через сеть аккаунтов для создания иллюзии массовой поддержки или органического интереса.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rekomendacii-dlya-pravitelstva\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#rekomendacii-dlya-pravitelstva\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Рекомендации для правительства&lt;/span&gt;&lt;/a&gt;Рекомендации для правительства&lt;/h4&gt;\n&lt;p&gt;Full Fact призывает правительство Великобритании инициировать внедрение цифровых учетных данных непосредственно в аппаратное обеспечение камер и смартфонов. Разработчиков генеративного ИИ следует обязать применять автоматические цифровые водяные знаки при создании контента. Крупные платформы и поисковые системы должны использовать единые стандарты маркировки происхождения контента, опираясь на такие технологии, как SynthID и спецификации C2PA. Кроме того, предлагается законодательно закрепить обязанность платформ оценивать и минимизировать риски для гражданского дискурса, избирательных процессов и общественного здоровья. Важным элементом является создание структуры для независимого доступа исследователей и фактчекеров к данным платформ, что обеспечит прозрачность при соблюдении стандартов конфиденциальности.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS2.jpg\" alt=\"Рис. S2\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS2-2.jpg\" alt=\"Рис. S2 (продолжение 2)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2 (продолжение 2)&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS2-3.jpg\" alt=\"Рис. S2 (продолжение 3)\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S2 (продолжение 3)&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#7A3FCC\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Рост влияния&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ-фейков на&lt;/text&gt;&lt;text
