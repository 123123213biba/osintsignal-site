        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#7A3FCC\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#A97BE0\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"105\" cy=\"143\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"695\" cy=\"245\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · NARRATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;ИИ-дезинформация: как&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;отличить реальную угрозу от&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;цифрового шума&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a-fS1.jpg\" alt=\"Рис. S1\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. S1&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Авторы проанализировали 112 примеров ИИ-контента, распространявшегося в Великобритании в 2025–2026 годах. Выяснилось, что 84% таких материалов создают устойчивое ложное представление у аудитории. Исследование выделяет восемь сфер риска, включая угрозы общественной безопасности, здоровью и финансовому благополучию.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;84% ИИ-контента в выборке формируют устойчивое ложное представление у граждан.&lt;/li&gt;\n&lt;li&gt;Выделено 8 сфер риска: от финансовых пирамид до провокации массовых беспорядков.&lt;/li&gt;\n&lt;li&gt;Более половины ИИ-фейков (59%) признаны экспертами как не имеющие реального влияния.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследователи использовали модель оценки рисков вреда (harm-risk assessment model), разработанную в рамках четырехлетнего проекта. &lt;a href=\"concepts/dataset.html\"&gt;Датасет&lt;/a&gt; включал видео, аудио и изображения, созданные или измененные с помощью ИИ, которые суммарно набрали десятки миллионов просмотров. Основным критерием отбора стала «достоверность претензии» (checkworthiness framework) — способность контента влиять на общественное мнение или поведение.&lt;/p&gt;\n&lt;p&gt;Анализ показал, что 41% изученных материалов несут существенную угрозу, способную спровоцировать социальные беспорядки, финансовое мошенничество или вред здоровью. При этом 59% контента были признаны малозначимыми из-за низкой вовлеченности аудитории или отсутствия у зрителей мотивации к действию. Авторы подчеркивают, что для защиты информационного пространства необходимо разделять опасные манипуляции и безобидный цифровой шум.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выборка из 112 кейсов является лишь срезом ситуации и не претендует на охват всего объема ИИ-дезинформации в указанный период.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;В Великобритании наблюдается беспрецедентный рост воздействия на население дезинформации, созданной или измененной с помощью искусственного интеллекта (ИИ). Исследование, проведенное на основе модели оценки рисков вреда (разработанной в рамках четырехлетнего проекта, опубликованного в 2025 году), анализирует 112 примеров такого контента, которые в совокупности набрали десятки миллионов просмотров в период с 1 января 2025 года по март 2026 года.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Более 80% проанализированных материалов создают эффект масштабной дезинформации, а 41,1% обладают существенным потенциалом причинения вреда в восьми различных сферах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценки рисков вреда — это методология, позволяющая классифицировать ложные утверждения не просто по факту их недостоверности, а по степени их потенциального негативного влияния на общество и отдельных лиц.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ показал, что 94 из 112 изученных образцов (83,9%) формируют у аудитории существенно ложное или вводящее в заблуждение представление. Оставшиеся 18 случаев (16,1%) были классифицированы как узкоспециализированные неточности, не создающие широкого эффекта дезинформации. Таким образом, более четырех из пяти изученных фрагментов контента способствуют росту недоверия к информации в целом.&lt;/p&gt;\n&lt;p&gt;Исследователи выделили восемь областей, где ИИ-дезинформация может нанести реальный ущерб: от провокации социальных беспорядков и насилия до прямого вреда здоровью и финансового мошенничества. Также в список рисков вошли: травля, влияющая на поведение и здоровье; снижение доверия к правоохранительным органам; распространение опасных теорий заговора; и долгосрочное изменение социально-политических установок. Согласно результатам, 46 из 112 образцов (41,1%) обладают потенциалом для реализации этих угроз, тогда как 66 образцов (58,9%) не несут существенного риска.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Выборка из 112 примеров не является исчерпывающей и представляет собой лишь срез контента, циркулировавшего в указанный период, что ограничивает возможность экстраполяции данных на весь объем ИИ-дезинформации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Модель оценки рисков выявила, что ложная информация из выборки может приводить к прямому вреду или накапливаемому эффекту в восьми областях: социальные беспорядки и насилие; вред здоровью и поведению; финансовые потери от мошенничества; угрозы общественному здравоохранению; подрыв доверия к правоохранительной и судебной системам; искажение отношения к климатической повестке; распространение конспирологических теорий; влияние на общественно-политические настроения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Анализ показал, что 39 из 112 случаев дезинформации способны нанести вред всему обществу, тогда как 10 случаев затрагивают конкретные группы, а 9 — отдельных лиц.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Масштаб воздействия варьируется: 1 случай касался конкретного человека, 8 — неопределенного круга лиц (например, финансовые махинации), 10 — специфических сообществ (например, дискриминация этнических или религиозных групп), и 39 — общества в целом. Учитывая опыт Великобритании (финансовые потери, пандемия COVID-19, беспорядки), авторы классифицируют эти риски как растущие.&lt;/p&gt;\n&lt;p&gt;Важно отметить, что из 112 проанализированных записей 66 (59%) не несут существенного потенциала вреда. В 17 случаях неточность была незначительной, в 19 — тема была неактуальной, в 24 — охват аудитории оказался недостаточным для реализации рисков, а в остальных случаях у аудитории отсутствовала мотивация или возможность действовать на основе полученной дезинформации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Более половины изученных примеров (66 из 112) признаны экспертами как не имеющие существенного потенциала для причинения вреда из-за низкой вовлеченности аудитории или неактуальности тем.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наиболее частой темой (71 из 112 записей, 63,4%) стала политика. Также распространены темы внешней политики, экономики, работы полиции, конфликтов на Ближнем Востоке, деятельности этнических групп, конспирологии и медицины. Большинство тем коррелируют с повесткой мейнстримных СМИ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ИИ-дезинформация часто использует «дипфейки» — синтезированные видео или аудио, имитирующие реальных политиков, или сфабрикованные изображения событий, которых не существовало.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В сфере политики доминируют ИИ-видео и аудио, имитирующие заявления политиков. Развитие генеративных инструментов снизило порог создания контента: визуальные артефакты (например, дефекты конечностей) встречаются реже. Существующие инструменты защиты, такие как водяные знаки SynthID от Google, помогают экспертам, однако аудио-фейки остаются сложными для обнаружения.&lt;/p&gt;\n&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"kontekst-i-motivaciya\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#kontekst-i-motivaciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Контекст и мотивация&lt;/span&gt;&lt;/a&gt;Контекст и мотивация&lt;/h4&gt;\n&lt;p&gt;Искусственный интеллект стремительно меняет информационную среду в Великобритании, увеличивая объем контента, созданного или измененного с помощью ИИ. Персонализация контента в сочетании с невысоким уровнем медиаграмотности и доступностью генеративных инструментов делает традиционные механизмы защиты — такие как законы о клевете и правила телерадиовещания — недостаточно эффективными. Рост числа материалов, созданных ИИ, затрудняет доверие к информации, что может негативно влиять на поведение людей и общественные процессы. Авторы определяют «созданный ИИ» контент как полностью или частично сгенерированный (текст, изображения, видео, аудио), а «измененный ИИ» — как существующий материал, манипулированный для изменения смысла.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Распространение ИИ-контента подрывает доверие к информации, делая существующие правовые и регуляторные механизмы защиты неэффективными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"issledovanie-full-fact\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#issledovanie-full-fact\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исследование Full Fact&lt;/span&gt;&lt;/a&gt;Исследование Full Fact&lt;/h4&gt;\n&lt;p&gt;В отчете анализируется, как рост объема ИИ-контента способствует возникновению реального вреда. Исследование базируется на анализе 112 фактов, проверенных британской благотворительной организацией Full Fact в 2025–2026 годах. Авторы классифицируют темы, форматы и типы контента, а также выявляют субъектов, стоящих за его распространением. Работа содержит доказательства последствий для отдельных лиц и общества, оценивает потенциальную тяжесть и длительность воздействия, а также описывает модель оценки рисков. Полученные данные представлены в виде датасета для использования исследователями и лицами, принимающими решения, в целях повышения устойчивости информационных систем.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Факчекинг — это процесс проверки утверждений на соответствие фактам с использованием верифицируемых источников и метаданных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"issledovatelskie-voprosy\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#issledovatelskie-voprosy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Исследовательские вопросы&lt;/span&gt;&lt;/a&gt;Исследовательские вопросы&lt;/h4&gt;\n&lt;p&gt;Работа соответствует приоритетам Института безопасности ИИ (AISI) в области общественной устойчивости и направлена на ответы на следующие вопросы: какие типы и темы ИИ-контента были наиболее распространены в Великобритании в указанный период; чем они отличаются от дезинформации, созданной иными способами; каков охват аудитории, подвергшейся воздействию; каковы доказанные или потенциальные последствия такого контента; и как может выглядеть система классификации контента, основанная на потенциале причинения вреда различной степени тяжести.&lt;/p&gt;\n&lt;h4 id=\"obuem-i-ogranicheniya\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#obuem-i-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объем и ограничения&lt;/span&gt;&lt;/a&gt;Объем и ограничения&lt;/h4&gt;\n&lt;p&gt;Выборка исследования состоит из материалов Full Fact, опубликованных с 1 января 2025 года по 31 марта 2026 года, в которых упоминалась вероятность использования ИИ при создании или манипуляции контентом. Поскольку на тот момент не существовало автоматизированной системы тегирования, исследователи использовали поиск по ключевым словам («AI», «AI-», «Artificially», «Artificial») и мониторинг домена fullfact.org. Дополнительно были включены материалы из внутренних метрик Full Fact, где ИИ упоминался косвенно. После ручной фильтрации ложноположительных результатов в итоговую выборку вошло 112 статей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследователи отобрали 112 статей, из которых лишь в 33 случаях (29,5%) фактчекинг однозначно подтвердил участие ИИ.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поскольку степень уверенности в причастности ИИ в исходных материалах не была квантифицирована, потребовался текстовый анализ. В 33 из 112 случаев вердикт был однозначным. Еще в 13 случаях формулировки указывали на «почти несомненное» участие ИИ. В остальных материалах использовались более слабые оценки («очень вероятно», «вероятно», «возможно») или вопрос о роли ИИ вовсе не рассматривался.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Текстовый анализ — метод качественного исследования, при котором ученые систематически изучают содержание документов для выявления закономерностей, смыслов и оценочных суждений, выраженных в языке.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"obzor-literatury-sushestvuyushie-dannye-o-vrede-dezinformacii\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#obzor-literatury-sushestvuyushie-dannye-o-vrede-dezinformacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор литературы: существующие данные о вреде дезинформации&lt;/span&gt;&lt;/a&gt;Обзор литературы: существующие данные о вреде дезинформации&lt;/h4&gt;\n&lt;p&gt;Академическая дискуссия о влиянии ложной информации на общественное мнение насчитывает более века, начиная с изучения пропаганды после Первой мировой войны. За последние 10 лет исследования дезинформации стали самостоятельной дисциплиной. Ученые анализируют последствия ложных сведений в различных сферах: от политики и вооруженных конфликтов до общественного здравоохранения и системы правосудия. Фундаментальные вопросы о том, что считать «истиной» и как ложная информация меняет поведение аудитории, рассматривались такими мыслителями, как М. Фуко, Б. Уильямс, Х. Арендт и Д. Спербер. Эти дискуссии помогают уточнить определения различных типов коммуникации и механизмы их воздействия на общественное восприятие.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Организация Full Fact (зарегистрированная благотворительная организация № 1158683 и некоммерческая компания № 6975984) анализирует подходы к классификации ложной информации. Исследователи Эмили Врага и Летиция Боде в 2020 году отмечали сложность выработки единых определений для дезинформации и мизинформации. Однако в последние годы в академической среде сформировался консенсус.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основное различие между терминами заключается в намерении: мизинформация распространяется без осознания её ложности, тогда как дезинформация создается и распространяется преднамеренно.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Под «мизинформацией» (misinformation) сегодня понимают информацию, которая на основе имеющихся доказательств является ложной или вводящей в заблуждение, но распространитель не осознает её недостоверность. «Дезинформация» (disinformation) подразумевает осознанное распространение ложных данных, часто для достижения политических или социальных целей. Существуют и другие категории, такие как «кликбейт» или «мистификации», создаваемые ради финансовой выгоды или иных форм личного удовлетворения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Мизинформация — это непреднамеренное распространение ошибок, а дезинформация — это осознанная манипуляция фактами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Помимо определений, ученые десятилетиями обсуждают природу коммуникации: является ли она способом передачи фактов или инструментом выражения мнений и убеждений. Когнитивисты и психологи изучают факторы, влияющие на восприятие информации, включая то, как уже имеющиеся взгляды человека определяют его доверие к новым данным и насколько легко информация поддается обработке. Важно учитывать, что терминологическое различие между мизинформацией и дезинформацией существует не во всех языках; например, в испанском и французском языках эти понятия часто не имеют столь четкого лингвистического разделения.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Исследователи в области политики и социологии активно изучают факторы, влияющие на устойчивость ложных убеждений, включая эффект повторения утверждений и распространение дезинформации. Несмотря на определенный консенсус относительно того, как информация формирует взгляды, вопрос о прямом влиянии этой информации на поведение остается предметом дискуссий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Научная дискуссия о влиянии медиа на поведение прошла путь от теории «всемогущих медиа» до концепции «ограниченных эффектов» и современных моделей, учитывающих контекст.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исторически этот спор напоминает дебаты о «медиаэффектах», возникшие после Первой мировой войны. Тогда ученые в США приписывали СМИ — кино, радио и прессе — способность радикально формировать общественное мнение. Однако в 1940-х годах, в период Второй мировой войны, новые исследования показали, что влияние медиа на поведение ограничено, а социальные факторы играют более значимую роль. К 1970-м годам исследователи пришли к выводу, что медиа могут оказывать влияние, но только при определенных обстоятельствах и на конкретные аудитории.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;«Медиаэффекты» — это академический термин, описывающий степень влияния средств массовой информации на установки, знания и действия людей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;После политических потрясений 2016 года сформировались три основные школы мысли. Первая группа исследователей утверждает, что дезинформация обладает значительной силой, способной менять общественное мнение и поведение, связывая это с результатами выборов в США и на Филиппинах.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;В академической среде сформировалось три основных подхода к оценке влияния дезинформации. Первый связывает распространение ложных сведений с масштабными политическими и социальными сдвигами. Второй подход, напротив, утверждает, что дезинформация оказывает «ограниченное или нулевое» воздействие на реальные действия и установки граждан, а чрезмерная тревога по этому поводу лишь подрывает доверие к демократическим институтам и провоцирует призывы к цензуре.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследования показывают спектр влияния дезинформации: от отсутствия значимых эффектов до серьезных последствий в специфических контекстах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Третий подход, лежащий в основе данного исследования, предполагает, что ложная информация может приводить к конкретным последствиям в определенных условиях. Спектр областей, где фиксируется такое влияние, крайне широк: от электоральных процессов и общественного здравоохранения до уровня личного благополучия, конфликтов, работы судебной системы и рыночной экономики. Авторы подчеркивают, что характер последствий зависит от типа информации, аудитории и контекста ситуации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контекстуальный подход — это метод анализа, при котором эффект явления оценивается не как универсальный, а как зависящий от внешних факторов, таких как среда, время и характеристики аудитории.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rol-ii-v-informacionnom-landshafte\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#rol-ii-v-informacionnom-landshafte\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роль ИИ в информационном ландшафте&lt;/span&gt;&lt;/a&gt;Роль ИИ в информационном ландшафте&lt;/h4&gt;\n&lt;p&gt;Проверки фактов, подтверждающие или предполагающие использование ИИ, стали регулярной частью работы организации Full Fact. Если в начале 2023 года такие случаи были единичными, то за исследуемый период доля контента с ИИ составила 24% от всех публикаций. Для сравнения: годом ранее этот показатель составлял лишь 8%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Доля проверок фактов, связанных с ИИ, выросла с 8% до 24% за один год, что отражает снижение барьеров для создания дезинформации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Развитие генеративных инструментов упростило создание вводящего в заблуждение контента в больших масштабах. Это усложняет работу фактчекеров: если три года назад типичными признаками подделки были анатомические ошибки (например, искажения конечностей), то сейчас такие огрехи встречаются реже. Дипфейки, имитирующие внешность или голос реальных людей, стали одной из самых распространенных угроз. В то время как видеофейки часто разоблачаются путем сравнения с исходными материалами, аудиоконтент остается сложным для верификации из-за невозможности экспертов прийти к однозначному выводу и риска спутать ИИ с профессиональной имитацией голоса.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Дипфейк — технология синтеза медиаконтента, при которой ИИ заменяет внешность или голос человека на целевом материале.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для борьбы с этим внедряются новые методы, такие как SynthID от Google — невидимые водяные знаки, указывающие на ИИ-происхождение файла. Аналогичные программы идентификации контента с 2026 года развивает OpenAI.&lt;/p&gt;\n&lt;h4 id=\"tekushie-podhody-k-obnaruzheniyu-i-klassifikacii\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#tekushie-podhody-k-obnaruzheniyu-i-klassifikacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Текущие подходы к обнаружению и классификации&lt;/span&gt;&lt;/a&gt;Текущие подходы к обнаружению и классификации&lt;/h4&gt;\n&lt;p&gt;В ответ на рост объема ИИ-контента разрабатываются новые стандарты верификации. Ранние примеры, такие как вирусное изображение Папы Римского в пуховике (2023 г.), выдавали себя визуальными дефектами при увеличении. Однако качество генераций быстро растет, делая визуальный осмотр менее эффективным.&lt;/p&gt;\n&lt;p&gt;С 2020 года активно развивается инициатива C2PA, предлагающая стандарт «учетных данных контента» (Content Credentials). Это позволяет прикреплять к цифровым файлам метаданные, фиксирующие авторство и историю редактирования, что помогает отследить путь изображения от съемки на камеру до последующей обработки нейросетями.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Организация Full Fact, зарегистрированная как благотворительный фонд (№ 1158683) и некоммерческая компания (№ 6975984), исследует методы верификации медиаконтента. Современные подходы к проверке подлинности включают использование «учетных данных контента» (content credentials), которые фиксируют метаданные о месте, времени съемки и истории редактирования файла. Эти данные позволяют отследить происхождение изображения, даже если оно было частично изменено с помощью нейросетей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Content credentials — это цифровой «паспорт» файла, который сохраняет историю его создания и изменений, позволяя проверить подлинность контента.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Помимо стандарта C2PA, компания Google внедрила систему SynthID. В отличие от метаданных, которые можно удалить, SynthID встраивает невидимый водяной знак непосредственно в структуру медиафайла. Для проверки наличия такой маркировки Google предоставляет доступ к специализированному API. В рамках расширения этой технологии Google начала сотрудничество с Nvidia и OpenAI для внедрения общих стандартов маркировки контента, созданного генеративным ИИ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Технологии маркировки, такие как SynthID, встраивают невидимые водяные знаки непосредственно в медиаданные, что позволяет проверять их происхождение через API.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Ранее проект «vera.ai», финансируемый грантами ЕС Horizon, занимался разработкой инструментов для анализа дезинформации и автоматического обнаружения синтетического аудио и изображений. Хотя проект завершен, разработанные им инструменты остаются доступными для использования. Основным ограничением существующих систем верификации остается низкий уровень осведомленности и вовлеченности широкой общественности в использование этих технологий.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Существующие инструменты верификации ИИ-контента пока не получили массового распространения среди обычных пользователей, что снижает их эффективность в борьбе с дезинформацией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;h4 id=\"ocenka-riskov-dezinformacii\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#ocenka-riskov-dezinformacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка рисков дезинформации&lt;/span&gt;&lt;/a&gt;Оценка рисков дезинформации&lt;/h4&gt;\n&lt;p&gt;В Великобритании наблюдается рост рисков, связанных с дезинформацией и недостоверной информацией, созданной с помощью ИИ. Исследование, основанное на модели оценки вреда (опубликована University of Westminster Press в 2025 году), проанализировало 112 примеров ИИ-контента, зафиксированных в период с 1 января 2025 года по 31 марта 2026 года. Эти материалы получили десятки миллионов просмотров. Анализ показал, что 94 из 112 образцов (83,9%) формируют существенно ложное или вводящее в заблуждение понимание ситуации (эффект дезинформации), в то время как 18 случаев (16,1%) содержали лишь незначительные неточности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;41,1% проанализированного ИИ-контента несут существенный риск причинения вреда в восьми ключевых сферах, включая социальные беспорядки, финансовые потери и угрозы здоровью.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Из общего числа образцов 46 (41,1%) обладают потенциалом вызвать или способствовать негативным последствиям, тогда как 66 (58,9%) имеют ограниченный или нулевой потенциал для серьезного вреда. Выявленные риски классифицированы по восьми направлениям: от насилия и дискриминации до влияния на политические взгляды и климатическую повестку. Распределение последствий показало, что 1 случай затрагивает конкретного человека, 8 — неопределенные группы (например, жертвы мошенничества), 10 — конкретные сообщества (религиозные или профессиональные группы), а 39 — общество в целом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценки вреда определяет «причинение» как ситуацию, где ложная информация стала ключевым фактором поведения, а «вклад» — как усиление ложного понимания, ставшего основой для действий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование носит наблюдательный характер: выявленные связи между контентом и последствиями основаны на модели оценки, а не на контролируемом эксперименте, что требует осторожности при интерпретации причинно-следственных связей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"glossarij-klyuchevyh-terminov\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#glossarij-klyuchevyh-terminov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Глоссарий ключевых терминов&lt;/span&gt;&lt;/a&gt;Глоссарий ключевых терминов&lt;/h4&gt;\n&lt;p&gt;Модель определяет «существенные последствия» как объективно проверяемый ущерб интересам индивидов или общества. «Причинение» фиксируется, когда доказательства подтверждают, что ложное утверждение было необходимым фактором для последующего поведения. «Вклад» означает, что информация существенно подкрепляет ложное понимание, ведущее к поведенческим изменениям. Стандарт «вне разумных сомнений» применяется, если после расследования не найдено иных правдоподобных объяснений поведения, кроме влияния данной информации.&lt;/p&gt;\n&lt;h4 id=\"sushestvennyj-potencial\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#sushestvennyj-potencial\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;«Существенный потенциал»&lt;/span&gt;&lt;/a&gt;«Существенный потенциал»&lt;/h4&gt;\n&lt;p&gt;Модель классифицирует контент как обладающий «существенным потенциалом» (substantive potential) для возникновения или усиления негативного эффекта при соблюдении двух условий. Во-первых, существующие научные данные подтверждают, что подобная информация в аналогичном контексте уже приводила к таким последствиям в прошлом. Во-вторых, контент должен соответствовать критериям модели, определяющим факторы, необходимые для реализации данного эффекта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценивает потенциальный вред контента на основе исторических данных о последствиях и соответствия установленным факторам риска.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Full Fact является зарегистрированной благотворительной организацией (регистрационный номер 1158683) и некоммерческой компанией (регистрационный номер 6975984).&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;h4 id=\"kriterii-otbora-utverzhdenij-frejmvork-proverki\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#kriterii-otbora-utverzhdenij-frejmvork-proverki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Критерии отбора утверждений (фреймворк проверки)&lt;/span&gt;&lt;/a&gt;Критерии отбора утверждений (фреймворк проверки)&lt;/h4&gt;\n&lt;p&gt;Фактчекеры не всегда заранее знают, является ли контент ложным, вводящим в заблуждение или созданным с помощью ИИ. Организации, такие как Full Fact, используют инструменты мониторинга для выявления проверяемых утверждений в СМИ, политике и соцсетях. Решение о проверке конкретного заявления принимается на основе ряда факторов. К ним относятся: утверждения по актуальным общественно значимым вопросам от политиков и СМИ; заявления, способные негативно повлиять на жизнь людей; контент с широким охватом, требующий быстрого опровержения; примеры, имеющие образовательную ценность для иллюстрации тактик дезинформации; а также материалы, помеченные пользователями Facebook и Instagram как потенциально недостоверные.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Фреймворк проверки — это набор критериев, помогающих редакциям приоритизировать работу, так как невозможно проверить каждое утверждение в публичном поле.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Важно отметить, что фактчекеры публикуют не все результаты исследований. Если проект не дает однозначных выводов или не подтверждает наличие дезинформации, работа над ним может быть прекращена. Это создает систематическое смещение выборки в сторону заведомо ложных или вводящих в заблуждение случаев. Следовательно, набор проверенных фактов не является случайной выборкой из всех публичных заявлений, что ограничивает возможность экстраполяции результатов на общие информационные тренды.&lt;/p&gt;\n&lt;h4 id=\"metody-obnaruzheniya-ii\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#metody-obnaruzheniya-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы обнаружения ИИ&lt;/span&gt;&lt;/a&gt;Методы обнаружения ИИ&lt;/h4&gt;\n&lt;p&gt;В рамках исследования каждое утверждение анализировалось на предмет участия ИИ в создании контента и идентификации использованных моделей. Наиболее распространенным доказательством стали «глюки» (glitches) — несовершенства в визуализации или аудио, выявленные в большинстве из 112 проанализированных случаев. Примерами служат анатомические ошибки (например, лишние конечности на сгенерированных изображениях) или неестественные паузы и ритм в аудиозаписях. Второй по значимости категорией стали «несоответствия» (incongruities), зафиксированные в 63 случаях. Это элементы, которые противоречат верифицированной реальности, например, одежда персонажа на изображении, не совпадающая с его реальным гардеробом в тот же период времени.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Для разоблачения контента, созданного ИИ или дипфейков, ключевым методом является поиск несоответствий путем сравнения с подлинными материалами. В 60 случаях использовалось «отрицательное доказательство» — отсутствие подтверждающих данных. Например, при проверке изображения якобы сбитого иранской ракетой спутника эксперты указали, что подобных сообщений не было, а разрушение спутника неизбежно привело бы к образованию космического мусора, фиксируемого государственными и частными системами слежения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Отрицательное доказательство — метод верификации, основанный на отсутствии подтверждающих фактов в надежных источниках, когда событие такого масштаба должно было оставить след.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В 47 случаях доказательством служило сходство с предыдущими дезинформационными кампаниями: общие визуальные стили, фоны и манера озвучки указывали на единую платформу или автора. Наличие водяных знаков стало наиболее весомым аргументом в 36 случаях. Из них 18 принадлежали Google Gemini (13 выявлены через SynthID, 5 видны визуально), 4 — Grok, 3 — Sora, по одному — Runway, InShot и Unreal. В 8 случаях содержались дисклеймеры или имена пользователей без указания инструмента.&lt;/p&gt;\n&lt;p&gt;Свидетельства самих субъектов или заинтересованных сторон использовались в 32 случаях, особенно при проверке мошеннических схем, имитирующих ритейлеров. В 19 случаях привлекались экспертные оценки (например, профессоров Хэни Фарида и Сивэя Лю). Анализ истории аккаунтов и прямые признания в использовании ИИ помогли в 18 и 11 случаях соответственно.&lt;/p&gt;\n&lt;h4 id=\"model-ocenki-riska-prichineniya-vreda\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#model-ocenki-riska-prichineniya-vreda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Модель оценки риска причинения вреда&lt;/span&gt;&lt;/a&gt;Модель оценки риска причинения вреда&lt;/h4&gt;\n&lt;p&gt;Модель оценки рисков вреда была разработана в ходе четырехлетнего проекта (опубликовано в 2025 году). Она анализирует потенциал дезинформации причинять вред индивидам и обществу на основе двух компонентов: набора из 250 примеров дезинформации и опубликованных данных о последствиях ложной информации в политике, бизнесе и здравоохранении. Для признания контента опасным он должен соответствовать критериям модели и иметь исторические прецеденты аналогичного вреда. С 2024 года модель применяется в Европе, Африке и на Ближнем Востоке.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Организация Full Fact определяет «существенные последствия» как изменения, которые наносят объективно проверяемый вред интересам отдельных лиц, групп или общества в целом, а не просто вызывают кратковременные эмоции или ошибочные представления. Для оценки риска модель использует три ключевых вопроса (см. Рис. 1): 1) формирует ли утверждение ложное понимание фактов или лишь незначительно искажает их; 2) достаточно ли людей верят в это утверждение, чтобы возникли конкретные негативные последствия; 3) обладают ли верящие в ложь люди мотивацией и возможностью действовать на основе этого заблуждения сейчас или в будущем, особенно при повторении подобных утверждений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценки рисков — это алгоритм, который помогает фактчекерам систематизировать анализ ложной информации, оценивая не только сам факт лжи, но и вероятность того, что эта информация приведет к реальному вреду.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;На основе ответов на эти вопросы модель определяет потенциал последствий, их масштаб, тяжесть и длительность. Фактчекеры анализируют 14 параметров, включая степень ложности, размер аудитории, восприятие достоверности, наличие повторяющихся нарративов или теорий заговора, а также способность аудитории к действиям на основе полученной информации.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Если доказательства подтверждают, что утверждение ложно, в него верит достаточное число людей, и эти люди способны действовать на основе заблуждения, модель классифицирует возможные последствия. Она помогает определить, кого именно затрагивает вред: конкретного человека, группу лиц или общество в целом. Также оценивается, является ли эффект прямым (немедленные действия) или кумулятивным (изменение отношения аудитории в долгосрочной перспективе).&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Независимое исследование Университета Висконсин-Мэдисон, опубликованное в 2025 году, отметило сложность прогнозирования эффектов дезинформации, что может приводить к субъективным расхождениям. Для обеспечения единообразия результатов авторы использовали «золотой стандарт» проверки: команда экспертов верифицировала каждое решение на соответствие критериям модели. Этот метод позволил определить потенциальные последствия дезинформации в исследуемом наборе данных.&lt;/p&gt;\n&lt;h4 id=\"4-rezultaty-obzor-nabora-dannyh\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#4-rezultaty-obzor-nabora-dannyh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Результаты: Обзор набора данных&lt;/span&gt;&lt;/a&gt;4. Результаты: Обзор набора данных&lt;/h4&gt;\n&lt;p&gt;Набор данных включает 112 единиц контента, созданного или измененного с помощью ИИ, которые распространялись в сети с 1 января 2025 года по 31 марта 2026 года и набрали десятки миллионов просмотров. Материалы охватывают 19 тематических категорий, включая экономику, здравоохранение, политику и военные конфликты. Большинство примеров затрагивают сразу 2–4 темы одновременно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Набор данных — это систематизированная выборка информации, отобранная исследователями для анализа по заданным критериям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Основными форматами стали видео, аудиовизуальные материалы и изображения. Текстовый контент, созданный чат-ботами, представлен лишь двумя записями. Исследователи классифицировали манипуляции на два типа: «контент-самозванец» (выдача себя за другое лицо или группу для искажения их взглядов) и «сфабрикованный контент» (создание несуществующих сцен или событий).&lt;/p&gt;\n&lt;p&gt;Все 112 проанализированных записей были признаны ложными или вводящими в заблуждение. Согласно модели оценки, 18 случаев (16,1%) признаны «узко неточными», а 94 случая (83,9%) — «существенно ложными». Наиболее частой темой стала политика (71 случай, 63,4%), включая дипфейки с участием высокопоставленных лиц. Также распространены темы событий в других странах, конфликтов на Ближнем Востоке и в Украине, экономики, работы правоохранительных органов, деятельности этнических или религиозных групп, теорий заговора и медицины.&lt;/p&gt;\n&lt;h4 id=\"detali-klyuchevye-temy-i-narrativy-v-nabore-dannyh-ii\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#detali-klyuchevye-temy-i-narrativy-v-nabore-dannyh-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Детали: ключевые темы и нарративы в наборе данных ИИ&lt;/span&gt;&lt;/a&gt;Детали: ключевые темы и нарративы в наборе данных ИИ&lt;/h4&gt;\n&lt;p&gt;Авторы подчеркивают, что данный набор данных не является случайной выборкой всего ИИ-контента в интернете. Он сформирован на основе критериев «проверяемости» (checkworthiness), установленных организацией Full Fact. В выборку попали материалы, имеющие потенциальные последствия для общества, такие как мошенничество или дезинформация в сфере здравоохранения. Все темы соответствуют 19 категориям, заложенным в модели оценки рисков вреда (Таблица 1).&lt;/p&gt;\n&lt;h4 id=\"shirokie-tematicheskie-kategorii-proverki-faktov\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#shirokie-tematicheskie-kategorii-proverki-faktov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Широкие тематические категории проверки фактов&lt;/span&gt;&lt;/a&gt;Широкие тематические категории проверки фактов&lt;/h4&gt;\n&lt;p&gt;Исследование охватило 112 единиц контента, классифицированных по 19 широким тематическим категориям. Наиболее представленной оказалась сфера политики (71 случай, 63,4%), за ней следуют международные отношения (43 случая, 38,4%), экономика и бизнес (28 случаев, 25%), а также преступность и правосудие (27 случаев, 24,1%). Менее часто встречались темы насильственных конфликтов (20 случаев, 17,9%), миграции (18 случаев, 16%), знаменитостей (17 случаев, 15,2%), чрезвычайных ситуаций (15 случаев, 13,4%), государственного управления и теорий заговора (14 случаев, 12,5%) и медицины (10 случаев, 8,9%). Остальные категории, включая медиа, экологию и ИИ, составили незначительную долю выборки.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Тематическая классификация — это метод группировки контента по ключевым признакам для выявления закономерностей в распространении дезинформации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В рамках анализа было выявлено 48 из 88 возможных подтем. Например, категория «политика» включала 10 подтем, от действий политиков до организации протестов, а «здравоохранение» — 5 подтем, включая доступность услуг и риски лечения. Большинство проанализированных материалов затрагивали от двух до четырех тем или подтем одновременно. Авторы отмечают, что выбор тем отражает как новостную повестку, так и финансовую мотивацию создателей контента, стремящихся привлечь внимание к трендовым вопросам.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Наиболее распространенной подтемой внутри политического блока стало искажение действий или высказываний высокопоставленных лиц (58 случаев, 51,8% от общего объема выборки). В этих материалах часто использовались ИИ-технологии для создания дипфейков — видео- или аудиоимитаций политиков, озвучивающих вымышленные заявления или описывающих несуществующие события. Другие подтемы включали обсуждение здоровья или семейных обстоятельств политических фигур (4 случая). В ходе исследования также были выявлены темы, отсутствующие в данной выборке, но зафиксированные в других работах: психическое здоровье, сексуализированный контент с участием частных лиц и фальсификации в сфере спорта.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;В рамках анализа политического контента исследователи выделили несколько ключевых тем. Наиболее часто встречались сообщения о протестах (3 упоминания), общественном мнении и поддержке политиков (2), назначениях или отставках (2), арестах или судебном преследовании политических фигур (1) и государственных расходах (1).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Контент-анализ — метод исследования, при котором тексты или медиафайлы классифицируются по категориям для выявления частоты определенных тем и нарративов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Из 112 проанализированных единиц контента более 20% (более 1 из 5) использовали сфабрикованные материалы для формирования негативных нарративов о премьер-министре и правящей Лейбористской партии. В 30 случаях доминировали две темы: ложные правительственные объявления о введении штрафов или повышении стоимости жизненно важных услуг на фоне кризиса стоимости жизни, а также вымышленные меры по ограничению личных свобод. К последним относились сгенерированные ИИ видео, где политики якобы объявляли о штрафах за употребление определенных продуктов питания или лимитах на количество авиаперелетов в год. Еще 11 случаев касались политики властей и полиции в отношении мусульман и мигрантов. Всего 23 записи из 112 относились к предполагаемым действиям правительства, 21 — к действиям или высказываниям сэра Кира Стармера, а 5 — к вмешательству государства в гражданские свободы.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;В категории зарубежных новостей чаще всего фигурировали «события в других странах» (23 упоминания), «действия или взгляды иностранных правительств» (16) и «отношения собственного правительства с зарубежными странами» (4). Согласно модели оценки рисков, ложные утверждения о других государствах имеют ограниченное влияние внутри страны, если только граждане не имеют сильной эмоциональной связи с этой страной или если ложь не касается угроз национальной безопасности. Тем не менее, в период исследования значительное внимание уделялось событиям в США, Украине и Иране.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценки рисков — аналитический подход, позволяющий прогнозировать вероятность негативного воздействия дезинформации на аудиторию в зависимости от контекста и осведомленности граждан.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Исследователи отмечают, что ложная информация о зарубежных событиях чаще принимается за правду из-за ограниченных знаний аудитории о ситуации за рубежом. Внутриполитическая повестка также часто затрагивала «личную экономику» и «стоимость жизни» (18 упоминаний), включая сгенерированные ИИ фейки о новых сборах и налогах. Также было выявлено 9 случаев, когда &lt;a href=\"concepts/dikiy-ii-tekst.html\"&gt;ИИ-контент&lt;/a&gt; использовался для подкрепления известных конспирологических теорий.&lt;/p&gt;\n&lt;h4 id=\"auditoriya-i-svidetelstva-reakcii-auditorii\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#auditoriya-i-svidetelstva-reakcii-auditorii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аудитория и свидетельства реакции аудитории&lt;/span&gt;&lt;/a&gt;Аудитория и свидетельства реакции аудитории&lt;/h4&gt;\n&lt;p&gt;Для оценки потенциального вреда дезинформации необходимо анализировать не только содержание, но и охват, а также реакцию аудитории. Последствия могут варьироваться: для некоторых событий требуется вовлечение десятков тысяч человек, тогда как в других случаях достаточно действий одного индивида, чтобы вызвать значимый эффект. Влияние дезинформации может проявляться как через действия широкой общественности, так и через решения политиков и лиц, принимающих решения. Исследования показывают, что ложная информация, распространяемая в академических журналах, СМИ и политических кругах, способна напрямую влиять на государственную политику.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Охват аудитории — это количество уникальных пользователей, просмотревших или взаимодействовавших с контентом, что является ключевым показателем потенциального воздействия дезинформации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Хотя некоторые ИИ-сгенерированные материалы могут вводить в заблуждение даже высокопоставленных лиц, основной риск связан с широким распространением контента в интернете. Доступ исследователей к точным данным об аудитории ограничен политикой крупных платформ и закрытостью зашифрованных каналов связи. В связи с этим представленные показатели охвата являются неполными и, вероятнее всего, заниженными.&lt;/p&gt;\n&lt;p&gt;Согласно имеющимся данным, 112 единиц контента, включенных в базу исследования, охватили аудиторию, исчисляемую десятками миллионов интернет-пользователей. Масштаб распространения подтверждает, что даже при отсутствии точных метрик для каждой публикации, совокупный охват исследуемых материалов является крайне высоким.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Исследование охватило 112 единиц контента, распространявшихся как в Великобритании, так и по всему миру. Аудитория варьировалась от нескольких тысяч просмотров до миллионов. В 22 случаях контент набрал более 1 миллиона просмотров. Максимальный зафиксированный показатель превысил 11 миллионов просмотров для ИИ-изображения протестов в Турции, а сгенерированное изображение Джеффри Эпштейна в Израиле набрало более 6 миллионов просмотров на платформе X. Распространение контента часто происходило через несколько платформ одновременно.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Масштаб аудитории не всегда коррелирует с реальными последствиями: более половины материалов с миллионным охватом не имели значимого потенциала для вреда из-за незначительности искажений или отсутствия у аудитории мотивации к действиям.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"formaty-ii-dezinformacii\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#formaty-ii-dezinformacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Форматы ИИ-дезинформации&lt;/span&gt;&lt;/a&gt;Форматы ИИ-дезинформации&lt;/h4&gt;\n&lt;p&gt;Из 112 проанализированных единиц контента 66 были видеороликами, а 46 — изображениями. В категории видео первичный фокус фактчекинга распределялся следующим образом: 26 случаев касались только визуальных ИИ-элементов, 21 случай — только аудио, а в 19 случаях ИИ-технологии затрагивали и видеоряд, и звуковую дорожку.&lt;/p&gt;\n&lt;h4 id=\"video-s-vizualnymi-ii-elementami\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#video-s-vizualnymi-ii-elementami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Видео с визуальными ИИ-элементами&lt;/span&gt;&lt;/a&gt;Видео с визуальными ИИ-элементами&lt;/h4&gt;\n&lt;p&gt;Эта категория включает полностью синтетические ролики, имитирующие новостные события, сцены конфликтов или действия публичных лиц (например, удары по Ирану, похороны в Судане, лесные пожары в Лос-Анджелесе). Основная задача фактчекинга здесь заключалась в проверке подлинности изображенных событий.&lt;/p&gt;\n&lt;h4 id=\"video-s-ii-audio\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#video-s-ii-audio\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Видео с ИИ-аудио&lt;/span&gt;&lt;/a&gt;Видео с ИИ-аудио&lt;/h4&gt;\n&lt;p&gt;В большинстве случаев видеоряд был второстепенным (слайды или беззвучные кадры), а основной акцент проверки приходился на аудиодорожку с ИИ-синтезом голоса. Часто использовалась имитация голоса и интонаций премьер-министра Великобритании Кира Стармера. Значительную часть составили фейковые сообщения об ограничении гражданских свобод: налогах на украшения, платных туалетах в аэропортах или сборах в NHS для лиц старше 60 лет.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Основная сложность при анализе аудио заключалась в разграничении ИИ-генерации и работы профессиональных имитаторов; индикатором ИИ часто служили специфические вокальные артефакты.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"video-s-ii-video-i-audio\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#video-s-ii-video-i-audio\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Видео с ИИ-видео и аудио&lt;/span&gt;&lt;/a&gt;Видео с ИИ-видео и аудио&lt;/h4&gt;\n&lt;p&gt;Данная категория включает контент, где реальные кадры использовались как основа для манипуляций, часто в формате «липсинк-дипфейков», где движение губ спикера синхронизировалось с наложенным ИИ-аудио.&lt;/p&gt;\n&lt;h4 id=\"izobrazheniya,-sozdannye-ii\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#izobrazheniya,-sozdannye-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Изображения, созданные ИИ&lt;/span&gt;&lt;/a&gt;Изображения, созданные ИИ&lt;/h4&gt;\n&lt;p&gt;Исследование фокусируется на статичных изображениях, сгенерированных нейросетями, которые имитируют реальные фотографии. Основная цель таких материалов — создание фиктивных встреч между политическими деятелями (например, Фарадж/Эпштейн, Трамп/Эпштейн) или помещение политиков в компрометирующие или эмоционально окрашенные ситуации для манипуляции общественным мнением.&lt;/p&gt;\n&lt;h4 id=\"platformy-i-tipy-aktorov,-rasprostranyayushih-ii-dezinformaciyu\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#platformy-i-tipy-aktorov,-rasprostranyayushih-ii-dezinformaciyu\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Платформы и типы акторов, распространяющих ИИ-дезинформацию&lt;/span&gt;&lt;/a&gt;Платформы и типы акторов, распространяющих ИИ-дезинформацию&lt;/h4&gt;\n&lt;p&gt;Анализ показал, что дезинформация, созданная ИИ, распространяется на всех основных платформах: Facebook, Instagram, Threads, TikTok и X (Twitter). Многие материалы дублировались на нескольких ресурсах, что указывает на скоординированное или подражательное распространение. Из-за ограниченного размера выборки выводы о различиях в поведении на разных платформах носят предварительный характер. Наблюдались признаки того, что на Facebook контент чаще встречается в больших объемах, тогда как на X (Twitter) он демонстрирует более высокую виральность. Facebook чаще использовался для таргетированной на Великобританию информации и мошенничества в сфере здравоохранения. В TikTok контент был ориентирован на молодежную аудиторию, включая схемы обмана в области здоровья. Учитывая методологию отбора фактов (смещение в сторону Meta-платформ), авторы подчеркивают невозможность точной оценки распространенности контента по разным площадкам.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Виральность — это способность контента быстро распространяться среди пользователей за счет репостов и взаимодействий.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Многие создатели дезинформации действуют открыто: через традиционные СМИ, публичные профили или аккаунты, маркированные как сатира или пародия. В выборке идентифицированы: политические группы поддержки (например, сторонники партии Reform UK), публичные фигуры и организации, а также аккаунты, продвигающие финансовые пирамиды и сомнительные медицинские услуги. Зафиксированы случаи распространения ИИ-контента известными личностями, включая владельца X Илона Маска и высокопоставленных отставных военных США. Один из таких постов с отредактированным изображением стрельбы в Миннеаполисе (январь 2026 г.) набрал более 9 миллионов просмотров. В случаях, когда авторы скрывают личность, их идентификация затруднена даже для самих платформ. Вероятно, часть политически ангажированного контента создается профессиональными группами ради финансовой выгоды.&lt;/p&gt;\n&lt;h4 id=\"obzor-analiza-vreda\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#obzor-analiza-vreda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обзор анализа вреда&lt;/span&gt;&lt;/a&gt;Обзор анализа вреда&lt;/h4&gt;\n&lt;p&gt;Анализ показал, что 94 из 112 изученных записей (83,9%) создавали существенно ложное или вводящее в заблуждение представление у аудитории. Эти материалы вносят вклад в общий эффект дезинформации, подрывая доверие к общественно значимой информации. Исследования указывают, что такой эффект может иметь серьезные последствия для общественного здравоохранения и стабильности демократических институтов.&lt;/p&gt;\n&lt;h4 id=\"analiz-potencialnogo-vreda\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#analiz-potencialnogo-vreda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Анализ потенциального вреда&lt;/span&gt;&lt;/a&gt;Анализ потенциального вреда&lt;/h4&gt;\n&lt;p&gt;В ходе исследования авторы оценили 112 примеров дезинформации на предмет их способности наносить существенный вред отдельным лицам или обществу. Из общего числа проанализированных случаев 46 примеров (41,1%) соответствовали критериям модели, указывающим на потенциал причинения или реального вклада в негативные последствия. Оставшиеся 66 примеров (58,9%) не продемонстрировали такого потенциала.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценки вреда — это аналитический инструмент, который классифицирует информационные сообщения по их способности подрывать доверие к общественным институтам или провоцировать реальные социальные последствия.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы подчеркивают, что даже если отдельные ложные утверждения различаются по своей значимости в политическом контексте, предложенная модель классифицирует любую существенно ложную или вводящую в заблуждение информацию как фактор, снижающий общее доверие к информации в публичном пространстве. Исследование опирается на данные о том, что восприятие дезинформации как широко распространенного явления снижает удовлетворенность демократическими процессами и уменьшает готовность граждан следовать рекомендациям в области общественного здравоохранения.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Организация Full Fact (благотворительный фонд № 1158683, некоммерческая компания № 6975984) исследует механизмы воздействия дезинформации и контента, созданного искусственным интеллектом (ИИ), на общественную безопасность и здоровье. Авторы классифицируют вред от таких материалов по пяти направлениям: провокация социальных беспорядков, психологическое и физическое давление, финансовое мошенничество, продвижение неэффективных медицинских препаратов и долгосрочное изменение общественных настроений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Deepfake (дипфейк) — это медиаконтент (видео, аудио или изображения), созданный или измененный с помощью алгоритмов ИИ для имитации внешности или голоса реальных людей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В декабре 2025 года был зафиксирован случай использования дипфейка эксперта в области здравоохранения для рекламы сомнительных добавок при менопаузе. Исследования подтверждают рост числа подобных манипуляций, где доверие к публичным фигурам используется для продвижения непроверенных и потенциально опасных методов лечения. Анализ показывает, что при получении ложной информации о «чудодейственных» средствах часть аудитории склонна отказываться от доказательной медицины в пользу неэффективных альтернатив.&lt;/p&gt;\n&lt;p&gt;Другой пример — использование ИИ для создания фейковых новостей о финансовых экспертах, например, о Мартине Льюисе, якобы призывавшем инвестировать в платформу Swiftgate Montark. Реакция пользователей продемонстрировала готовность следовать таким советам, что создает риски кражи личных данных и потери средств. Аналогичные угрозы возникают при распространении сфабрикованных изображений, дискредитирующих жертв насилия, что провоцирует травлю и угрозы в адрес пострадавших. В феврале 2025 года сгенерированное ИИ изображение «мигрантов с топорами» в больнице Бирмингема, распространившееся через соцсети (более 1,7 млн просмотров), продемонстрировало, как ложные нарративы могут усиливать социальную напряженность, несмотря на отсутствие реального события.&lt;/p&gt;\n&lt;p&gt;Научные данные подтверждают, что повторение ложных утверждений повышает их восприятие как истинных, а использование «триггерной информации» (например, образа внешней угрозы) может способствовать возникновению насилия. Исследования в области психологии восприятия и коммуникации показывают, что систематическое распространение дезинформации напрямую коррелирует с ростом агрессии в обществе.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Исследовательская модель оценки рисков вреда от дезинформации выделяет восемь ключевых направлений влияния ложных утверждений на общество. Среди них: снижение доверия к правоохранительным органам, изменение общественного мнения по вопросам климата, рост восприимчивости к теориям заговора и долгосрочная трансформация политических установок. Авторы подчеркивают, что данные выводы не означают неизбежность негативных последствий, а лишь указывают на наличие условий для их реализации согласно модели оценки рисков.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценки рисков вреда — это аналитический инструмент, который проверяет наличие трех условий: создание ложного понимания, достаточный охват аудитории и наличие у верящих в ложь людей мотивации и возможности действовать в соответствии с этой дезинформацией.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для подтверждения того, что дезинформация привела к конкретным последствиям, требуются дополнительные лонгитюдные исследования. Анализ показывает, что повторение ложных сообщений со временем усиливает их влияние на восприятие аудитории. В качестве примеров авторы приводят распространение ИИ-сгенерированных видео с антииммигрантской риторикой и фейковые утверждения о правительственных ограничениях на авиаперелеты (сентябрь 2025 года) или манипулятивные изображения с участием полиции (июнь 2025 года, 160 000 просмотров в X).&lt;/p&gt;\n&lt;p&gt;В дальнейшем анализе авторы рассматривают следующие аспекты: классификацию утверждений по уровню потенциального вреда, корреляцию между виральностью контента и его реальным воздействием, а также различие между информационными эффектами, влияющими на установки и поведение. Особое внимание уделяется кумулятивному характеру воздействия дезинформации и ограничениям в оценке масштабов и длительности таких эффектов.&lt;/p&gt;\n&lt;h4 id=\"utverzhdeniya-s-otsutstvuyushim-ili-ogranichennym-potencialom-vreda\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#utverzhdeniya-s-otsutstvuyushim-ili-ogranichennym-potencialom-vreda\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Утверждения с отсутствующим или ограниченным потенциалом вреда&lt;/span&gt;&lt;/a&gt;Утверждения с отсутствующим или ограниченным потенциалом вреда&lt;/h4&gt;\n&lt;p&gt;Анализ с использованием модели оценки рисков показал, что 66 из 112 исследованных записей (58,9%) не несут существенного потенциала для причинения конкретного вреда, помимо общего влияния на доверие к информации. Для определения потенциальных последствий модель последовательно применяет четыре критерия: (i) является ли контент существенно ложным или лишь незначительно неточным; (ii) приведет ли изменение отношения или действий на основе этого контента к реальным негативным последствиям; (iii) достаточно ли велико число людей, поверивших в утверждение, чтобы вызвать последствия; (iv) обладают ли эти люди мотивацией и возможностью для совершения действий, ведущих к таким последствиям.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценки рисков — это алгоритмический подход, позволяющий классифицировать дезинформацию не по факту её ложности, а по вероятности того, что она спровоцирует конкретные опасные действия в реальном мире.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rezultaty-primeneniya-kriteriev\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#rezultaty-primeneniya-kriteriev\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты применения критериев&lt;/span&gt;&lt;/a&gt;Результаты применения критериев&lt;/h4&gt;\n&lt;p&gt;● 17 утверждений признаны лишь «узко неточными». Это означает, что неточный элемент либо несущественен для понимания ситуации, либо настолько незначителен, что не меняет сути события. Например, ИИ-изображение задержания Николаса Мадуро в январе 2026 года было сфабриковано, но верно передавало суть события, которое действительно произошло. Аналогично, ИИ-изображения нападения в поезде в Англии (ноябрь 2025 года) были искусственными, но отражали реальные обстоятельства атаки. В таких случаях действия людей, основанные на этих изображениях, не отличались бы от действий, основанных на подлинных фото.&lt;/p&gt;\n&lt;p&gt;● 19 утверждений не имеют потенциала для серьезных последствий, так как действия, основанные на них, не несут значимого вреда. Даже если утверждение ложно, оно может не влиять на реальные риски. Примером служит ИИ-изображение «суперкара», уцелевшего при пожарах в Лос-Анджелесе в январе 2025 года: хотя утверждение ложно, оно не побуждает людей к действиям, способным вызвать последствия, описанные в модели вреда. Другой пример — фейковое изображение Риши Сунака в больнице (2026 год): несмотря на то, что информация о здоровье политиков может влиять на избирателей, в данном контексте конкретный вред от этого изображения был оценен как ограниченный.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Модель оценки вреда, используемая в исследовании, исходит из того, что ложная информация сама по себе не является вредоносной. Вред возникает только тогда, когда дезинформация провоцирует конкретные действия или изменения в поведении, способные привести к реальным последствиям. Для этого необходимо, чтобы аудитория не только поверила в ложное утверждение, но и обладала достаточной мотивацией и возможностями для совершения действий на его основе.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценки вреда — это аналитический инструмент, который проверяет, может ли конкретное ложное утверждение привести к измеримым последствиям в реальном мире, основываясь на вере аудитории и её способности действовать.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В ходе анализа исследователи выявили ряд случаев, когда ложные утверждения не имели потенциала для причинения вреда. Например, ИИ-видео, на котором круизный лайнер якобы сбрасывает отходы в море, набрало более 1,8 миллиона просмотров. Несмотря на охват, большинство зрителей распознали подделку, и не было зафиксировано никаких изменений в поведении или отношении к судоходным компаниям. В других случаях, например, с ложными сообщениями о политиках, отсутствие выборов или реальных рычагов влияния делало последствия дезинформации ничтожными.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Даже если аудитория верит в ложь, она должна иметь физическую возможность реализовать вредоносное действие. Исследователи приводят пример ИИ-видео о «урагане Мелисса» в Ямайке (2025 год): хотя многие поверили в подлинность кадров, большинство зрителей находились вне зоны поражения стихии. Аналогично, ложные сообщения об атаке на небоскреб Бурдж-Халифа в Дубае не привели к последствиям, так как жители ОАЭ понимали, что это фейк, а люди за пределами страны не имели возможности предпринять какие-либо действия.&lt;/p&gt;\n&lt;h4 id=\"vosem-oblastej-potencialnyh-posledstvij\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#vosem-oblastej-potencialnyh-posledstvij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Восемь областей потенциальных последствий&lt;/span&gt;&lt;/a&gt;Восемь областей потенциальных последствий&lt;/h4&gt;\n&lt;p&gt;Из 112 проанализированных примеров 46 (41,1%) соответствовали всем критериям модели риска, имея потенциал вызвать или внести вклад в 78 конкретных последствий. Эти последствия распределены по восьми категориям, включая социальные беспорядки, насилие со стороны линчевателей, финансовый ущерб от мошенничества и угрозы здоровью населения.&lt;/p&gt;\n&lt;h4 id=\"1-potencial-provocirovaniya-socialnyh-besporyadkov-i-nasiliya\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#1-potencial-provocirovaniya-socialnyh-besporyadkov-i-nasiliya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Потенциал провоцирования социальных беспорядков и насилия&lt;/span&gt;&lt;/a&gt;1. Потенциал провоцирования социальных беспорядков и насилия&lt;/h4&gt;\n&lt;p&gt;Анализ выявил восемь случаев ИИ-контента, содержащего ложные обвинения в адрес определенных групп, что в теории могло спровоцировать агрессию. Однако авторы подчеркивают, что наличие потенциала не всегда означает реализацию: например, в Гонконге (2026 год) ложные утверждения о пользе непастеризованного молока широко распространились, но не нанесли вреда, так как этот продукт был недоступен для покупки в городе.&lt;/p&gt;\n&lt;p&gt;fullfact.org&lt;/p&gt;\n&lt;p&gt;Исследовательская модель авторов оценивает потенциал контента для формирования негативного общественного мнения в отношении мусульман и мигрантов. В рамках анализа модель выявила два примера ИИ-сгенерированной дезинформации, способной спровоцировать или оправдать акты насилия и социальные беспорядки. К ним относятся сфабрикованное сообщение об атаке на больницу в Бирмингеме и изображение нападения на лодки с мигрантами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Модель оценки рисков вреда — аналитический инструмент, который классифицирует контент по его способности усиливать социальную напряженность, опираясь на исторические данные о влиянии медиа на восприятие угроз.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы подчеркивают, что социальные беспорядки и насилие являются результатом сложного взаимодействия долгосрочных социально-экономических факторов и краткосрочных триггерных событий. Хотя медиа часто выделяют конкретный инцидент как единственную причину, он является лишь одним из элементов процесса. Исследования подтверждают, что систематическое воздействие информации может приводить к долгосрочным изменениям в установках аудитории. Когда социальное напряжение достигает критического уровня, сообщения о «внешней угрозе» или предполагаемых правонарушениях со стороны определенных групп могут стать катализатором или оправданием для агрессивных действий, что наблюдалось, в частности, во время беспорядков в Великобритании в 2024 году.&lt;/p&gt;\n&lt;h4 id=\"potencial-dlya-opravdaniya-ili-provocirovaniya-nasiliya,-vliyayushego-na-dolgosrochnoe-zdorove-i-usloviya-zhizni\"&gt;&lt;a href=\"2026-10-07/ai-generated-disinformation-in-the-uk-risk-of-harm-context-a.html#p
