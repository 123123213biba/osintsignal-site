        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Разбор&lt;/em&gt; · 2026-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Разбираемся, как устроены реестры, закупки и архивы, чтобы самостоятельно проверять факты и не верить на слово.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"zachem-eto-chitat\"&gt;&lt;a href=\"tutorials/tut-data.html#zachem-eto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зачем это читать&lt;/span&gt;&lt;/a&gt;Зачем это читать&lt;/h2&gt;\n&lt;p&gt;Мир открытых данных — это фундамент современной прозрачности. Когда вы понимаете, как устроены государственные реестры, судебные архивы и системы закупок, вы перестаете быть просто потребителем новостей и становитесь исследователем. Наша цель — научить вас видеть структуру там, где другие видят хаос.&lt;/p&gt;\n&lt;h2 id=\"glavnye-voprosy\"&gt;&lt;a href=\"tutorials/tut-data.html#glavnye-voprosy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главные вопросы&lt;/span&gt;&lt;/a&gt;Главные вопросы&lt;/h2&gt;\n&lt;p&gt;Главный вопрос любого расследования: «Откуда эти данные?». Мы ищем ответы на вопросы: кто владеет активом, как распределяются бюджетные средства, какие связи существуют между юридическими лицами и как менялись документы во времени. Важно понимать не только содержание, но и контекст: кто опубликовал данные и с какой целью.&lt;/p&gt;\n&lt;h2 id=\"metody,-kotorye-vstretyatsya\"&gt;&lt;a href=\"tutorials/tut-data.html#metody,-kotorye-vstretyatsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы, которые встретятся&lt;/span&gt;&lt;/a&gt;Методы, которые встретятся&lt;/h2&gt;\n&lt;p&gt;Дата-журналисты используют несколько ключевых инструментов: парсинг (автоматический сбор данных), кросс-верификацию (сравнение данных из разных реестров) и анализ временных рядов. Мы работаем с государственными закупками, реестрами юридических лиц, судебными базами и веб-архивами. Это позволяет восстановить цепочку событий, даже если первоначальные источники были удалены.&lt;/p&gt;\n&lt;h2 id=\"kak-chitat-statyu-po-shagam\"&gt;&lt;a href=\"tutorials/tut-data.html#kak-chitat-statyu-po-shagam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как читать статью по шагам&lt;/span&gt;&lt;/a&gt;Как читать статью по шагам&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Изучите методологию: где автор взял данные? Если источник не указан, это повод для скепсиса.&lt;/li&gt;\n&lt;li&gt;Проверьте первичные документы: ссылки на реестры или сканы документов должны быть кликабельны.&lt;/li&gt;\n&lt;li&gt;Оцените логику: нет ли в выводах автора «прыжка веры», когда факты не подтверждают громкий заголовок.&lt;/li&gt;\n&lt;li&gt;Посмотрите на ограничения: честный исследователь всегда указывает, чего он не смог узнать.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"silnyj-rezultat-ili-slabyj\"&gt;&lt;a href=\"tutorials/tut-data.html#silnyj-rezultat-ili-slabyj\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сильный результат или слабый&lt;/span&gt;&lt;/a&gt;Сильный результат или слабый&lt;/h2&gt;\n&lt;p&gt;Сильное исследование опирается на воспроизводимые данные. Если вы можете зайти в реестр по ссылке и увидеть то же самое, что описал автор — это качественная работа. Слабое исследование строится на интерпретациях без опоры на документы. Помните, что даже сложные системы могут ошибаться. Как мы писали в статье «Доверие — это не оценка: как ограничить власть ИИ-агентов», высокий рейтинг безопасности или автоматизированная система не гарантируют надежность. Всегда нужен человеческий контроль и проверка фактов.&lt;/p&gt;\n&lt;h2 id=\"poprobujte-na-statyah-vypuska\"&gt;&lt;a href=\"tutorials/tut-data.html#poprobujte-na-statyah-vypuska\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Попробуйте на статьях выпуска&lt;/span&gt;&lt;/a&gt;Попробуйте на статьях выпуска&lt;/h2&gt;\n&lt;p&gt;Возьмите статью «Доверие — это не оценка: как ограничить власть ИИ-агентов». Попробуйте применить к ней наш алгоритм: какие данные о работе ИИ-систем были открыты, а какие остались «черным ящиком»? Понимание того, где заканчиваются факты и начинаются предположения — ваш главный навык в работе с открытыми данными.&lt;/p&gt;\n&lt;h2 id=\"osnovano-na-statyah\"&gt;&lt;a href=\"tutorials/tut-data.html#osnovano-na-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основано на статьях&lt;/span&gt;&lt;/a&gt;Основано на статьях&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/trust-is-not-a-score-runtime-assurance-contracts-for-high-ri.html\"&gt;Доверие — это не оценка: как ограничить власть ИИ-агентов&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Концепции: &lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Разбираемся, как устроены реестры, закупки и архивы, чтобы самостоятельно проверять факты и не верить на слово."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Как читать расследования на основе открытых данных: гид «ОСИНТ-Сигнал»","description":"Разбираемся, как устроены реестры, закупки и архивы, чтобы самостоятельно проверять факты и не верить на слово.","vcsPath":"tutorials/tut-data.md"},"headings":[{"title":"Зачем это читать","href":"tutorials/tut-data.html#zachem-eto-chitat","level":2},{"title":"Главные вопросы","href":"tutorials/tut-data.html#glavnye-voprosy","level":2},{"title":"Методы, которые встретятся","href":"tutorials/tut-data.html#metody,-kotorye-vstretyatsya","level":2},{"title":"Как читать статью по шагам","href":"tutorials/tut-data.html#kak-chitat-statyu-po-shagam","level":2},{"title":"С
