        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;em&gt;Разбор&lt;/em&gt; · 2026-10-03&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Разбираемся, как аналитики превращают пиксели со спутников в доказательства и как самостоятельно проверять такие исследования.&lt;/strong&gt;&lt;/p&gt;\n&lt;h2 id=\"zachem-eto-chitat\"&gt;&lt;a href=\"tutorials/tut-geo.html#zachem-eto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зачем это читать&lt;/span&gt;&lt;/a&gt;Зачем это читать&lt;/h2&gt;\n&lt;p&gt;Спутниковые снимки перестали быть секретными данными спецслужб. Сегодня любой человек может отследить вырубку лесов, рост городов или активность портов. Этот путеводитель поможет вам понять, как устроены исследования в области дистанционного зондирования (ДЗЗ) и геоаналитики, чтобы вы могли критически оценивать научные публикации.&lt;/p&gt;\n&lt;h2 id=\"glavnye-voprosy\"&gt;&lt;a href=\"tutorials/tut-geo.html#glavnye-voprosy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главные вопросы&lt;/span&gt;&lt;/a&gt;Главные вопросы&lt;/h2&gt;\n&lt;p&gt;Исследователи в этой области ищут ответы на три вопроса: что изменилось на местности (обнаружение изменений), где именно это произошло (геолокация) и как интерпретировать косвенные признаки (например, ночные огни как показатель экономической активности). Главная задача — отделить реальные изменения от шума на снимках.&lt;/p&gt;\n&lt;h2 id=\"metody,-kotorye-vstretyatsya\"&gt;&lt;a href=\"tutorials/tut-geo.html#metody,-kotorye-vstretyatsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы, которые встретятся&lt;/span&gt;&lt;/a&gt;Методы, которые встретятся&lt;/h2&gt;\n&lt;p&gt;Аналитики используют несколько ключевых подходов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Анализ спутниковых снимков: работа с оптическими и радарными данными для поиска объектов.&lt;/li&gt;\n&lt;li&gt;Геолокация: сопоставление объектов на фото с картами (например, OpenStreetMap).&lt;/li&gt;\n&lt;li&gt;Обнаружение изменений: сравнение снимков одной территории в разное время.&lt;/li&gt;\n&lt;li&gt;ИИ-агенты: нейросети, которые моделируют изменения среды, как описано в статье «Цифровой двойник города: как нейросети проектируют изменения в реальности».&lt;/li&gt;\n&lt;li&gt;Zero-shot обучение: методы, позволяющие нейросетям распознавать объекты (корабли, здания) в новых регионах без дообучения, что подробно разобрано в статье «Считаем объекты на спутниковых снимках без дообучения нейросетей».&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kak-chitat-statyu-po-shagam\"&gt;&lt;a href=\"tutorials/tut-geo.html#kak-chitat-statyu-po-shagam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как читать статью по шагам&lt;/span&gt;&lt;/a&gt;Как читать статью по шагам&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Изучите данные: какой спутник использовался (разрешение снимков)?&lt;/li&gt;\n&lt;li&gt;Проверьте метод: обучалась ли модель на данных этого региона или использовался универсальный алгоритм?&lt;/li&gt;\n&lt;li&gt;Оцените точность: приводится ли матрица ошибок или сравнение с ручной разметкой?&lt;/li&gt;\n&lt;li&gt;Найдите ограничения: упоминают ли авторы влияние облачности, теней или искажений оптики?&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"silnyj-rezultat-ili-slabyj\"&gt;&lt;a href=\"tutorials/tut-geo.html#silnyj-rezultat-ili-slabyj\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Сильный результат или слабый&lt;/span&gt;&lt;/a&gt;Сильный результат или слабый&lt;/h2&gt;\n&lt;p&gt;Сильное исследование всегда содержит: описание выборки (какие именно снимки и за какой период), сравнение с альтернативными методами и указание на погрешность. Если в статье заявлен «прорыв» без указания точности распознавания или без открытого кода/данных, относитесь к этому скептически. Помните: спутниковый снимок — это модель реальности, а не сама реальность.&lt;/p&gt;\n&lt;h2 id=\"poprobujte-na-statyah-vypuska\"&gt;&lt;a href=\"tutorials/tut-geo.html#poprobujte-na-statyah-vypuska\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Попробуйте на статьях выпуска&lt;/span&gt;&lt;/a&gt;Попробуйте на статьях выпуска&lt;/h2&gt;\n&lt;p&gt;Начните с анализа статьи «Считаем объекты на спутниковых снимках без дообучения нейросетей». Обратите внимание, как авторы решают проблему адаптации модели к новым условиям. Затем перейдите к «Цифровой двойник города», чтобы понять, как ИИ предлагает правки в городскую среду. Попробуйте найти в них описание того, как именно алгоритм «понимает» границы объектов.&lt;/p&gt;\n&lt;h2 id=\"osnovano-na-statyah\"&gt;&lt;a href=\"tutorials/tut-geo.html#osnovano-na-statyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основано на статьях&lt;/span&gt;&lt;/a&gt;Основано на статьях&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/from-pixels-to-policy-a-multi-agent-system-for-intervention.html\"&gt;Цифровой двойник города: как нейросети проектируют изменения в реальности&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"2026-10-02/cobicount-separating-object-and-background-responses-for-rem.html\"&gt;Считаем объекты на спутниковых снимках без дообучения нейросетей&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Концепции: &lt;a href=\"concepts/spec-geo.html\"&gt;Спутники и геоданные&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Разбираемся, как аналитики превращают пиксели со спутников в доказательства и как самостоятельно проверять такие исследования."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Спутники и геоданные: как читать исследования о Земле из космоса","description":"Разбираемся, как аналитики превращают пиксели со спутников в доказательства и как самостоятельно проверять такие исследования.","vcsPath":"tutorials/tut-geo.md"},"headings":[{"title":"Зачем это читать","href":"tutorials/tut-geo.html#zachem-eto-chitat","level":2},{"title":"Главные вопросы","href":"tutorials/tut-geo.html#glavnye-voprosy","level":2},{"title":"Методы, которые встретятся","href":"tutorials/tut-geo.html#metody,-kotorye-vstretyatsya","level":2},{"title":"Как читать статью по шагам","href":"tutorials/tut-geo.html#kak-chitat-statyu-po-shagam","level":2},{"title":"Сильный результат или слабый","href":"tutorials/tut-geo.html#silnyj-rezultat-ili-slabyj","level":2},{"title":"Попробуйте на статьях выпуска","href":"tutorials/tut-geo.html#poprobujte-na-statyah-vypuska","level":2},{"title":"Основано на статьях","href":"tutorials/tut-geo.html#osnovano-na-statyah","level":2}],"title":"Спутники и геоданные: как читать исследования о Земле из космоса"},"router":{"pathname":"tutorials/tut-geo","depth":2,"base":"../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
