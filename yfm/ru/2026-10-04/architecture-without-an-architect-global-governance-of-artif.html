        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"188\" cy=\"64\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"492\" cy=\"291\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · NARRATIVES   &lt;/text&gt;&lt;text x=\"60\" y=\"149\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Кто управляет искусственным&lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;интеллектом: миф об&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;архитекторе глобальных&lt;/text&gt;&lt;text x=\"60\" y=\"251\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;правил&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/global-ai-governance.html\"&gt;Глобальное регулирование ИИ&lt;/a&gt; остается фрагментированным и декларативным. Власть распределена между государствами и частными корпорациями, чьи интересы редко совпадают. Вместо поиска единого «чертежа» управления, стоит признать, что архитектура ИИ формируется стихийно.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Регулирование ИИ фрагментировано: лишь 7 стран участвуют в ключевых инициативах.&lt;/li&gt;\n&lt;li&gt;Власть разделена между государствами и частными компаниями с разными стимулами.&lt;/li&gt;\n&lt;li&gt;ИИ не требует полной смены институтов, но нуждается в адаптации норм под новые реалии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Исследование Маттейса Мааса «Архитектуры глобального управления ИИ» анализирует текущий ландшафт регулирования через призму социотехнических изменений. Автор отмечает, что существующие инициативы, такие как рекомендации G7 или ООН, охватывают лишь малую часть стран, оставляя большинство государств вне правового поля. Регуляторная среда страдает от «реактивности», где попытки ограничить технологии часто опаздывают или создают условия для регуляторного арбитража.&lt;/p&gt;\n&lt;p&gt;Маас подчеркивает, что власть в сфере ИИ сосредоточена в руках узкого круга частных компаний, контролирующих инфраструктуру и технические решения. В отличие от прошлых технологий, ИИ трансформирует существующие юрисдикции, а не создает полностью новые пространства. Ключевая проблема заключается в отсутствии общего плана: государства обладают принудительной силой, но корпорации владеют экспертизой, необходимой для внедрения реальных защитных механизмов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Работа носит теоретический характер и не предлагает готовых политических чертежей для внедрения.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;отсутствие&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;единого центра&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;управления ИИ&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;анализ социоте&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;хнических&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;изменений&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;архитектура&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;формируется&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;стихийно&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;необходим учет&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;интересов всех&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;акторов&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Препринт не проходил рецензирование. Выводы предварительные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-04/architecture-without-an-architect-global-governance-of-artif.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;arXiv&lt;/td&gt;\n&lt;td&gt;narratives&lt;/td&gt;\n&lt;td&gt;arxiv&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/
