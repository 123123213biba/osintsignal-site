        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"145\" cy=\"177\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"675\" cy=\"165\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · FACT_CHECK   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Как наука уходит в сторону:&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Drift Inspector отслеживает&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;эволюцию идей в AI&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f1.jpg\" alt=\"Рисунок 1: Интерфейс Drift Inspector в режиме карты, представляющий интерактивную WebGL-карту 16 576 элементарных утверж\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Интерфейс &lt;a href=\"concepts/drift-inspector.html\"&gt;Drift Inspector&lt;/a&gt; в режиме карты, представляющий интерактивную WebGL-карту 16 576 элементарных утверждений из EMNLP 2020–2025 гг.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Интерфейс Drift Inspector в режиме карты, представляющий интерактивную WebGL-карту 16 576 элементарных утверждений из EMNLP 2020–2025 гг. Вкладки на верхней панели позволяют переключаться между режимами (Карта, Тренды, Кластеры, Сравнение или Методы). Пользователь может настроить фильтр по годам, режим отображения (по кластерам или трендам дрейфа) или выполнить поиск утверждений с ранжированием соответствий по кластерам. Справа находится список кластеров с возможностью фильтрации. При наведении курсора на точку отображается утверждение и траектория распространенности кластера; клик закрепляет карточку со ссылкой на исходную статью.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Научные публикации растут в геометрической прогрессии, и отследить реальные изменения в фокусе исследований становится невозможно. Система Drift Inspector извлекает из абстрактов «атомарные утверждения» о вкладе автора, отсекая лишний шум. Это позволяет увидеть, как область NLP смещается от классических задач к рассуждениям и мультимодальности.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Система извлекает 16,576 атомарных утверждений из EMNLP (2020–2025).&lt;/li&gt;\n&lt;li&gt;Используется SPECTER2 для семантического кодирования научных вкладов.&lt;/li&gt;\n&lt;li&gt;Инструмент позволяет отслеживать тренды через интерактивную карту.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Система использует &lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt; (Qwen3-235B) для деконтекстуализации абстрактов, превращая их в набор фальсифицируемых утверждений (&lt;a href=\"concepts/acc.html\"&gt;Atomic Contribution Claims&lt;/a&gt;, ACCs). Эти утверждения проходят через SPECTER2 — модель эмбеддингов, обученную на связях цитирования, что позволяет сгруппировать похожие научные идеи в едином семантическом пространстве. Для кластеризации применяется алгоритм &lt;a href=\"concepts/hdbscan.html\"&gt;HDBSCAN&lt;/a&gt;, который эффективно выделяет плотные группы и оставляет «шум» для анализа уникальных вкладов.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"concepts/dataset.html\"&gt;Набор данных&lt;/a&gt; охватывает 346 тысяч утверждений из 80 тысяч абстрактов ACL Anthology. Система визуализирует данные через WebGL-карту, где каждый тренд можно проследить до конкретной статьи. Инструмент позволяет сравнивать научные когорты, авторов или конференции, выявляя реальные сдвиги в методологии, которые часто скрыты за общими ключевыми словами.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты зависят от качества извлечения LLM, а 36% утверждений остаются некластеризованным шумом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Научные аннотации часто объединяют описание вклада исследования с контекстом, мотивацией и мета-описанием. Из-за этого автоматизированные инструменты не могут эффективно отделить результаты работы от общего обсуждения темы. Для решения этой задачи представлена система Drift Inspector — инструмент с открытым исходным кодом, предназначенный для анализа эволюции научных областей через «атомарные утверждения о вкладе» (Atomic Contribution Claims, ACCs).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Атомарные утверждения о вкладе (ACC) — это очищенные от контекста ключевые тезисы о результатах работы, которые извлекаются из текста аннотации с помощью больших языковых моделей (LLM).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система работает путем извлечения ACC из аннотаций с помощью LLM, после чего утверждения группируются по годам в интерактивную карту. Это позволяет проследить любой выявленный тренд до конкретных утверждений и исходных научных статей. Разработчики применили систему к материалам конференции EMNLP за шесть лет. Для проверки точности извлечения данных использовалась экспертная оценка человеком, а &lt;a href=\"concepts/klasterizatsiya.html\"&gt;кластеризация&lt;/a&gt; сопоставлялась с внешней таксономией, составленной вручную.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничение: точность анализа напрямую зависит от качества извлечения утверждений моделью LLM и корректности ручной таксономии, используемой для валидации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ данных EMNLP показал, что область NLP смещается от классических задач в сторону возможностей эпохи LLM, таких как рассуждение (reasoning) и мультимодальность. Авторы отмечают, что такой сдвиг невозможно заметить при использовании простых методов подсчета ключевых слов или анализа аннотаций целиком. Опубликованный набор данных охватывает всю библиотеку ACL Anthology, включая 346 000 утверждений, 80 000 аннотаций и 423 источника.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система Drift Inspector выявила сдвиг фокуса исследований в NLP на рассуждение и мультимодальность, проанализировав 346 000 утверждений из 80 000 аннотаций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"utverzhdeniya-ob-atomarnom-vklade-acc\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#utverzhdeniya-ob-atomarnom-vklade-acc\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Утверждения об атомарном вкладе (ACC)&lt;/span&gt;&lt;/a&gt;Утверждения об атомарном вкладе (ACC)&lt;/h4&gt;\n&lt;p&gt;Современные конференции по ИИ, такие как ACL, EMNLP, NeurIPS и CVPR, сталкиваются с экспоненциальным ростом числа публикаций, что делает невозможным их ручной анализ. Автоматизация написания текстов с помощью LLM лишь ускоряет этот процесс. Существующие системы навигации (NLP Scholar, NLPExplorer, CL Scholar) опираются на частотный анализ слов или тематическое моделирование (LDA, BERTopic), которые не различают контекст: например, упоминание «парсинга» в мотивационной части статьи и в качестве основного вклада автора учитываются одинаково. Система Drift Inspector решает эту проблему, выделяя «атомарные утверждения о вкладе» (Atomic Contribution Claims, ACC) — проверяемые тезисы, очищенные от вводных слов и описания чужих работ.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drift Inspector использует ACC для разделения того, о чем статья говорит, и того, что она реально привносит в науку, позволяя отслеживать эволюцию идей.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;ACC — это минимальная логическая единица научного вклада, которую можно верифицировать независимо от контекста статьи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Система использует модель SPECTER2 для эмбеддинга утверждений, их кластеризации по годам и визуализации траекторий развития тем. Веб-интерфейс позволяет фильтровать данные по годам, авторам и конференциям, обеспечивая прослеживаемость каждого агрегированного показателя до исходного текста.&lt;/p&gt;\n&lt;h4 id=\"sistemy-issledovaniya-literatury\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#sistemy-issledovaniya-literatury\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системы исследования литературы&lt;/span&gt;&lt;/a&gt;Системы исследования литературы&lt;/h4&gt;\n&lt;p&gt;Существующие инструменты, такие как NLP-KG или GenGo, работают на уровне ключевых слов или метаданных. Drift Inspector отличается тем, что анализирует семантические единицы вклада, а не просто частоту терминов. Он предоставляет тепловые карты трендов, возможность сравнения когорт и независимость от конкретного корпуса данных.&lt;/p&gt;\n&lt;h4 id=\"diahronicheskij-analiz-metodov-obrabotki-estestvennogo-yazyka-nlp\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#diahronicheskij-analiz-metodov-obrabotki-estestvennogo-yazyka-nlp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Диахронический анализ методов обработки естественного языка (NLP)&lt;/span&gt;&lt;/a&gt;Диахронический анализ методов обработки естественного языка (NLP)&lt;/h4&gt;\n&lt;p&gt;Предыдущие исследования отслеживали смену парадигм через таксономии или совместную встречаемость идей. В отличие от них, Drift Inspector применяет подход «снизу вверх», позволяя кластерам вклада формироваться автоматически, и объединяет весь цикл анализа — от извлечения данных до визуализации — в единый инструмент.&lt;/p&gt;\n&lt;h4 id=\"atomarnye-semanticheskie-edinicy\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#atomarnye-semanticheskie-edinicy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Атомарные семантические единицы&lt;/span&gt;&lt;/a&gt;Атомарные семантические единицы&lt;/h4&gt;\n&lt;p&gt;Метод декомпозиции на ACC опирается на принципы FActScore и атомарных единиц контента, ранее применявшихся для оценки фактологичности. Мы адаптировали этот подход для наукометрии, где ACC служат единицами счета, а их истинность принимается на веру из исходной публикации.&lt;/p&gt;\n&lt;h4 id=\"opisanie-sistemy\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#opisanie-sistemy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Описание системы&lt;/span&gt;&lt;/a&gt;Описание системы&lt;/h4&gt;\n&lt;p&gt;Рабочий процесс Drift Inspector разделен на офлайн-этап (извлечение, кластеризация, расчет статистики) и онлайн-этап (интерактивная визуализация, представленная на Рис. 1 и Рис. 2).&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f1.jpg\" alt=\"Рисунок 1: Интерфейс Drift Inspector в режиме карты, представляющий интерактивную WebGL-карту 16 576 элементарных утверж\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Интерфейс Drift Inspector в режиме карты, представляющий интерактивную WebGL-карту 16 576 элементарных утверждений из EMNLP 2020–2025 гг.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Интерфейс Drift Inspector в режиме карты, представляющий интерактивную WebGL-карту 16 576 элементарных утверждений из EMNLP 2020–2025 гг. Вкладки на верхней панели позволяют переключаться между режимами (Карта, Тренды, Кластеры, Сравнение или Методы). Пользователь может настроить фильтр по годам, режим отображения (по кластерам или трендам дрейфа) или выполнить поиск утверждений с ранжированием соответствий по кластерам. Справа находится список кластеров с возможностью фильтрации. При наведении курсора на точку отображается утверждение и траектория распространенности кластера; клик закрепляет карточку со ссылкой на исходную статью.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"utverzhdeniya-ob-atomarnom-vklade\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#utverzhdeniya-ob-atomarnom-vklade\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Утверждения об атомарном вкладе&lt;/span&gt;&lt;/a&gt;Утверждения об атомарном вкладе&lt;/h4&gt;\n&lt;p&gt;Авторы извлекают из аннотаций научных статей «атомарные вклады» (Atomic Contribution Claims, ACC) — краткие, проверяемые утверждения, очищенные от мета-языка и контекста. Для этого используется LLM-модель qwen3-235b-a22b-thinking-2507 с температурой 0,2. Выбор аннотаций обусловлен их доступностью и стандартизированностью. В период 2020–2025 гг. на конференциях EMNLP система извлекала в среднем от 3,58 (в 2020 г.) до 4,01 (в 2025 г.) утверждения на одну аннотацию.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/atomarnyy-vklad.html\"&gt;Атомарный вклад&lt;/a&gt; — это одно конкретное утверждение о методе или результате, которое можно проверить на истинность, лишенное вводных слов и местоимений.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"semanticheskaya-topologiya\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#semanticheskaya-topologiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Семантическая топология&lt;/span&gt;&lt;/a&gt;Семантическая топология&lt;/h4&gt;\n&lt;p&gt;Для анализа семантики утверждения кодируются с помощью модели SPECTER2, затем их размерность снижается через UMAP, а кластеризация выполняется алгоритмом HDBSCAN. Это позволяет выделить 80 тематических кластеров. Около 36% утверждений классифицируются как «шум» — уникальные вклады, не ставшие трендами. Их доля выросла с 31–34% в 2020–2022 гг. до 42% в 2025 г. Использование плотностной кластеризации позволяет сохранять «шум» как фоновый слой, не искажая границы основных тематических групп.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Около 42% вкладов в 2025 году являются уникальными и не формируют устойчивых тематических кластеров.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"kolichestvennaya-ocenka-drejfa\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#kolichestvennaya-ocenka-drejfa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Количественная оценка дрейфа&lt;/span&gt;&lt;/a&gt;Количественная оценка дрейфа&lt;/h4&gt;\n&lt;p&gt;Распространенность темы оценивается через частоту упоминания в статьях за год P_y(c). Это исключает искажения, если одна статья содержит множество утверждений одного типа. Система рассчитывает абсолютный сдвиг Δ DF(c), относительное изменение RDF(c) и логарифмический коэффициент дрейфа, который определяет цветовую индикацию на карте трендов.&lt;/p&gt;\n&lt;h4 id=\"interfejs-inspektor-drejfa\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#interfejs-inspektor-drejfa\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интерфейс «Инспектор дрейфа»&lt;/span&gt;&lt;/a&gt;Интерфейс «Инспектор дрейфа»&lt;/h4&gt;\n&lt;p&gt;Интерфейс представляет собой веб-приложение с пятью модулями: «Карта» (интерактивная визуализация 16 576 утверждений), «Тренды» (сравнительные графики), «Кластеры» (детальные профили), «Сравнение» (анализ двух выборок) и «Методы». Все данные интерактивны и позволяют переходить к исходным статьям в ACL Anthology.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Визуализация основана на 16 576 утверждениях; интерфейс позволяет фильтровать данные по годам, однако интерпретация трендов требует учета того, что новые методы могут не успеть сформировать устойчивые кластеры.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"realizaciya-i-dostupnost\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#realizaciya-i-dostupnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Реализация и доступность&lt;/span&gt;&lt;/a&gt;Реализация и доступность&lt;/h4&gt;\n&lt;p&gt;&lt;a href=\"concepts/pipeline.html\"&gt;Конвейер&lt;/a&gt; обработки данных реализован на Python с использованием библиотек transformers, adapters, umap-learn, hdbscan и Plotly. Каждый этап кэширует промежуточные результаты (CSV-файлы с утверждениями, матрицы эмбеддингов, проекции, кластеры), а стохастические процессы фиксируются через seed, что обеспечивает воспроизводимость кластеризации из конфигурационных файлов. Повторный запуск извлечения данных воспроизводит общие показатели, но не идентичные строки утверждений из-за особенностей декодирования LLM. Весь процесс можно воспроизвести с минимальными затратами на API и вычислительные ресурсы. Интерфейс пользователя представляет собой автономный файл, не требующий внешних зависимостей. Код распространяется по лицензии MIT, а набор данных — CC BY 4.0. В приложении B указаны параметры экстрактора, чекпоинты эмбеддингов и гиперпараметры кластеризации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Система обеспечивает полную воспроизводимость кластеризации и позволяет анализировать корпуса любого масштаба с минимальными затратами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Масштабируемость подтверждена на полном корпусе ACL Anthology (80 144 абстракта, 423 конференции, 346 010 утверждений) с использованием экстрактора gpt-oss-120b. Стоимость обработки составила около 40 долларов США. Инструмент Drift Inspector позволяет проводить сравнение когорт между конференциями и авторами в один клик (Рис. 3). На корпусе EMNLP метод сохраняет валидность кластеров и все 15 направлений дрейфа заголовков. Внешний судья (LLM) оценил выборки из 300 утверждений с точностью 96,7–99,7% «Good» по сравнению с 98,3% у контрольной группы.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f3.jpg\" alt=\"Рисунок 3: Режим сравнения, когорты по конференциям (активный экземпляр для шести площадок): различия между ACL и COLING\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 3: Режим сравнения, когорты по конференциям (активный экземпляр для шести площадок): различия между ACL и COLING, представленные как разрыв в долях утверждений кластеров.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 3: Режим сравнения, когорты по конференциям (активный экземпляр для шести площадок): различия между ACL и COLING, представленные как разрыв в долях утверждений кластеров. COLING сохраняет заметно более выраженный профиль классического NLP (эмбеддинги, анализ тональности на основе аспектов, NER, извлечение событий), в то время как ACL тяготеет к кластерам эпохи LLM (эффективное рассуждение, многоязычные LLM, оценка зрения и языка). Чипы переключают визуализацию (расходящиеся графики / гантели / диаграммы рассеяния); этот же режим позволяет сравнивать авторов и когорты, определенные по ключевым словам.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h4 id=\"masshtabiruemost-i-stoimost\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#masshtabiruemost-i-stoimost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Масштабируемость и стоимость&lt;/span&gt;&lt;/a&gt;Масштабируемость и стоимость&lt;/h4&gt;\n&lt;p&gt;Стоимость извлечения линейно зависит от размера корпуса (Таблица 1). Использование gpt-oss-120b обходится примерно в 0,50 доллара США за 1000 абстрактов. Более сложные модели, такие как Qwen3-235B-Thinking, стоят около 11 долларов США за 1000 абстрактов из-за затрат на скрытые рассуждения, при этом качество извлечения утверждений не требует таких мощностей. После этапа извлечения все операции (эмбеддинги, проекции, кластеризация) выполняются на обычном ноутбуке менее чем за час.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/ekstraktor.html\"&gt;Экстрактор&lt;/a&gt; — это модель, которая выделяет ключевые научные утверждения из текста абстрактов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ocenka\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#ocenka\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Оценка&lt;/span&gt;&lt;/a&gt;Оценка&lt;/h4&gt;\n&lt;p&gt;Авторы оценивают два критических этапа: качество извлечения утверждений и валидность кластеров на корпусе EMNLP 2020–2025. Качество проверяется на стратифицированной выборке с отрицательными контрольными примерами, а валидность кластеров — на 653 статьях, пересекающихся с таксономией SToP.&lt;/p&gt;\n&lt;h4 id=\"validaciya-kachestva-utverzhdenij-chelovekom\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#validaciya-kachestva-utverzhdenij-chelovekom\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Валидация качества утверждений человеком&lt;/span&gt;&lt;/a&gt;Валидация качества утверждений человеком&lt;/h4&gt;\n&lt;p&gt;Три эксперта разметили 180 элементов (136 случайных утверждений и 44 специально внедренных некорректных примера). Утверждение считается «Good», если оно атомарно, самодостаточно и отражает научный вклад. Согласованность экспертов высокая (κ Фляйса = 0,844). Эксперты оценили 97,8%, 91,8% и 90,5% утверждений как «Good» и успешно выявили 100% (44/44) внедренных негативных примеров. Независимый судья (LLM Gemini) совпал с мнением экспертов в 94,5% случаев (κ = 0,863).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Оценка проводилась на ограниченной выборке, а основными ошибками моделей являются извлечение фонового контекста вместо результатов исследования.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"validnost-klasterov-v-sravnenii-s-vneshnej-taksonomiej\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#validnost-klasterov-v-sravnenii-s-vneshnej-taksonomiej\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Валидность кластеров в сравнении с внешней таксономией&lt;/span&gt;&lt;/a&gt;Валидность кластеров в сравнении с внешней таксономией&lt;/h4&gt;\n&lt;p&gt;Кластеризация сравнивалась с золотым стандартом таксономии SToP на 653 статьях (2020–2021 гг.). Сравнивались восемь конфигураций, включая тематическое моделирование (LDA, NMF), нейронную кластеризацию на уровне абстрактов (BERTopic с энкодерами SPECTER2 и MPNet) и предложенный метод на уровне утверждений (ACC).&lt;/p&gt;\n&lt;h4 id=\"ustojchivost-osnovnyh-vyvodov\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#ustojchivost-osnovnyh-vyvodov\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Устойчивость основных выводов&lt;/span&gt;&lt;/a&gt;Устойчивость основных выводов&lt;/h4&gt;\n&lt;p&gt;Ключевой результат исследования — 15 кластеров, демонстрирующих изменение распространенности тем в период 2020–2025 гг. Авторы проверяют устойчивость этих данных по шести параметрам: статистическая значимость, временные срезы, выбор энкодера, правила сопоставления кластеров, модель извлечения и гиперпараметры кластеризации. Все 15 сдвигов статистически значимы (z-тест для двух пропорций, p &amp;lt; 0,001), а 95% доверительные интервалы бутстрепа исключают ноль.&lt;/p&gt;\n&lt;h4 id=\"dva-sreza\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#dva-sreza\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Два среза&lt;/span&gt;&lt;/a&gt;Два среза&lt;/h4&gt;\n&lt;p&gt;Тренды в течение шести лет монотонны (например, доля парсинга снизилась с 5,1% до 0,1%), что подтверждает отсутствие артефактов при сравнении только начальной и конечной точек. При замене энкодеров (тестировались 8 нейросетевых моделей и TF-IDF + SVD) результаты остаются стабильными: в 11–14 из 15 случаев направление тренда сохраняется. Изменение правил сопоставления кластеров или использование другой модели извлечения (gpt-oss-120b) также подтверждает исходные 15 трендов. Перебор 36 комбинаций гиперпараметров кластеризации (UMAP и HDBSCAN) дает индекс ARI 0,79–0,95, сохраняя все 15 ключевых выводов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/butstrep.html\"&gt;Бутстреп&lt;/a&gt; — метод статистической оценки, при котором данные многократно перевыбираются для проверки надежности выводов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Анализ 4 488 статей конференции EMNLP показывает снижение доли классических задач: парсинг сократился на 4,9 п.п. (на 97% относительно 2020 года), машинный перевод и диалоговые системы — на 3,7–4,4 п.п. На их место пришли темы эпохи LLM: &lt;a href=\"concepts/vision-language-models.html\"&gt;мультимодальные модели&lt;/a&gt; выросли в 3,1 раза (+9,1 п.п.), а агенты — в 10,3 раза. Уходящие задачи не исчезают полностью, а фрагментируются, переходя в слой «шума» или смежные кластеры.&lt;/p&gt;\n&lt;h4 id=\"varianty-ispolzovaniya\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#varianty-ispolzovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Варианты использования&lt;/span&gt;&lt;/a&gt;Варианты использования&lt;/h4&gt;\n&lt;p&gt;Система позволяет исследователям оценивать перспективность направлений. Например, при поиске по запросу «retrieval» можно увидеть рост доли кластера с 0,7% в 2020 году до 3,3% в 2025 году. Также инструмент позволяет сравнивать разные конференции (например, ACL против COLING) или когорты авторов, выявляя различия в их тематических профилях, как показано на Рис. 5 для сравнения тем BERT и LLM.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f5.jpg\" alt=\"Рис. 5\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рис. 5&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты отражают специфику конкретных конференций и могут не распространяться на всю область NLP в целом.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"chto-razvivaetsya,-a-chto-uhodit-v-proshloe\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#chto-razvivaetsya,-a-chto-uhodit-v-proshloe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что развивается, а что уходит в прошлое?&lt;/span&gt;&lt;/a&gt;Что развивается, а что уходит в прошлое?&lt;/h4&gt;\n&lt;p&gt;Алгоритм Trends ранжирует каждый тематический кластер на основе динамики изменений за период с 2020 по 2025 год, используя &lt;a href=\"concepts/butstrep-intervaly.html\"&gt;бутстреп-интервалы&lt;/a&gt; для оценки достоверности. Это позволяет визуализировать полярные тренды: на одном полюсе находятся рассуждения LLM (LLM reasoning) и мультимодальные модели (vision-language modeling), на другом — синтаксический анализ, доля которого снизилась на 4,9 процентных пункта, что соответствует относительному падению на 97%.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Синтаксический анализ практически исчез из активных исследований, сократившись на 97% относительно уровня 2020 года, в то время как модели рассуждения и мультимодальные системы стали доминирующими направлениями.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Поскольку показатель распространенности учитывает статьи, содержащие хотя бы одно утверждение по теме, методология позволяет различать угасающие области и те, что полностью исчезли. Поиск по конкретным утверждениям показывает, что остаточные упоминания синтаксического анализа теперь распределены по «шумовому слою» или смежным кластерам, а не формируют самостоятельную группу. Аналогичная картина наблюдается для узкоспециализированных терминов: например, при поиске по теме «юмор» большинство совпадений обнаруживается в шумовом слое, где каждое из них сохраняет связь с исходной публикацией.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Бутстреп-интервалы — это статистический метод оценки точности, который помогает понять, насколько надежны выявленные тренды, путем многократной перевыборки данных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"zaklyuchenie\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#zaklyuchenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Заключение&lt;/span&gt;&lt;/a&gt;Заключение&lt;/h3&gt;\n&lt;p&gt;Drift Inspector превращает валидированный конвейер извлечения утверждений в интерактивный инструмент для наблюдения за тем, как меняется научная область. Система отражает то, что авторы заявляют как свой вклад, а не просто лексику их мотивации. Инструмент полностью открыт (код MIT, данные CC BY) и не зависит от конкретного корпуса текстов: любую площадку с аннотациями можно обработать за один проход. В планах — внедрение иерархической системы тем для объединения кластеров в навигационные супертемы.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Drift Inspector позволяет отслеживать динамику научных трендов на основе заявленных вкладов, обеспечивая полную открытость данных и кода.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"ogranicheniya\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h4&gt;\n&lt;p&gt;Анализ базируется на аннотациях, которые часто опускают технические детали и отрицательные результаты, при этом часть вклада может содержаться только в основном тексте статьи. Валидированные результаты ограничены одной конференцией (EMNLP). Более масштабные наборы данных (шесть площадок ACL) прошли только проверку LLM-судьей без участия человека, поэтому к их статистике по кластерам следует относиться с осторожностью.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты, полученные на основе автоматической проверки LLM без участия человека, имеют более низкий уровень доказательности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Конвейер опирается на LLM-экстрактор, который может допускать ошибки (галлюцинации, некорректное разделение данных). Хотя эти риски снижены за счет схем валидации и работы LLM-судьи, они не исключены полностью. Человеческая валидация проводилась авторами на 136 утверждениях, поэтому уровень согласия частично отражает общую подготовку экспертов, а негативные примеры являются специально созданными искажениями, а не естественными ошибками. Кластеризация зависит от гиперпараметров UMAP/HDBSCAN и модели эмбеддингов. Направления дрейфа тем стабильны при бутстреп-ресемплинге, использовании восьми энкодеров и лексическом представлении, однако границы кластеров и их метки могут варьироваться, а статистика дрейфа носит описательный, а не причинно-следственный характер.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f4.jpg\" alt=\"Рисунок 4: Научный дрейф в EMNLP (2020–2025 гг.), измеренный системой. Расходящиеся столбцы показывают изменение частоты\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 4: Научный дрейф в EMNLP (2020–2025 гг.), измеренный системой. Расходящиеся столбцы показывают изменение частоты документов на уровне статей (в процентных пунктах) для наиболее растущих и убывающих кластеров ACC с указанием долей за 2020 и 2025 гг.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f6.jpg\" alt=\"Рисунок 6: Траектории частоты документов по годам для восьми наиболее убывающих и восьми наиболее растущих кластеров ACC\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 6: Траектории частоты документов по годам для восьми наиболее убывающих и восьми наиболее растущих кластеров ACC (частота документов на уровне статей, % от общего числа статей), рассчитанные на основе канонической кластеризации.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 6: Траектории частоты документов по годам для восьми наиболее убывающих и восьми наиболее растущих кластеров ACC (частота документов на уровне статей, % от общего числа статей), рассчитанные на основе канонической кластеризации. Метки представляют собой краткие названия кластеров; полные названия и дескрипторы c-TF-IDF включены в опубликованные данные. Изменения конечных точек значимы, доверительные интервалы (bootstrap CI) не включают ноль (§4.3).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit-f7.jpg\" alt=\"Рисунок 7: Диахронический обзор одной конференции (Сравнение, во времени, bump chart): топовые кластеры EMNLP, ранжирова\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 7: Диахронический обзор одной конференции (Сравнение, во времени, bump chart): топовые кластеры EMNLP, ранжированные по ежегодной частоте документов (1 = наиболее часто встречающийся). Моделирование «зрение–язык» достигает 1-го ранга к 2024 году; эффективность LLM поднимается с 14-го на 3–5-е место; суммаризация опускается до 31-го места.&lt;/em&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/drift-inspector-exploring-and-measuring-scientific-drift-wit.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;переизбыток&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;публикаций в&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;AI&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;извлечение&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;атомарных&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;утверждений&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font
