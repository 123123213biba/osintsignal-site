            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"279\" cy=\"65\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"661\" cy=\"287\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · DATASETS   &lt;/text&gt;&lt;text x=\"60\" y=\"166\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Детекторы лжи для ИИ: почему&lt;/text&gt;&lt;text x=\"60\" y=\"200\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;они ошибаются, когда модель&lt;/text&gt;&lt;text x=\"60\" y=\"234\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;играет роль&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur-f1.jpg\" alt=\"Рисунок 1: Основной вклад данной работы включает: (1) новый набор данных для ролевых игр с обучением в процессе (on-poli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Основной вклад данной работы включает: (1) новый &lt;a href=\"concepts/dataset.html\"&gt;набор данных&lt;/a&gt; для ролевых игр с обучением в процессе (on-policy), (2) оценки, показывающие, что существующие методы зондирования (&lt;a href=\"concepts/probes.html\"&gt;probes&lt;/a&gt;) не способны выявлять ложь в условиях ролевой игры, (3) три…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Основной вклад данной работы включает: (1) новый набор данных для ролевых игр с обучением в процессе (on-policy), (2) оценки, показывающие, что существующие методы зондирования (probes) не способны выявлять ложь в условиях ролевой игры, (3) три тестовых набора для анализа ложных корреляций, демонстрирующих ключевые недостатки всех предыдущих методов зондирования, и (4) новый метод зондирования, который корректно отделяет истину в условиях ролевой игры и демонстрирует устойчивость к протестированным мешающим факторам (confounders).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;Исследователи выяснили, что детекторы лжи для больших языковых моделей (&lt;a href=\"concepts/large-language-models-llm.html\"&gt;LLM&lt;/a&gt;) часто не справляются с задачами, когда ИИ имитирует персонажей с антинаучными взглядами. Вместо анализа фактов алгоритмы ориентируются на косвенные признаки, такие как стиль речи или вероятность слов. Это делает текущие методы проверки достоверности ИИ крайне ненадежными.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Создан датасет из 8 916 ответов ИИ, имитирующих 15 антинаучных персонажей.&lt;/li&gt;\n&lt;li&gt;Детекторы лжи часто путают правду с соблюдением инструкций или вероятностью слов.&lt;/li&gt;\n&lt;li&gt;Предложен новый линейный метод, устойчивый к ложным корреляциям в ролевых играх.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;Авторы работы проанализировали восемь существующих методов детекции лжи, используя новый датасет из 8 916 ответов, сгенерированных тремя моделями в режиме ролевой игры. В выборку вошли 15 антифактических персонажей, разделенных на три категории: реально существующие (например, сторонники теории плоской Земли), вымышленные (персонажи из книг) и исторические (например, сторонники геоцентризма). Исследование показало, что детекторы часто «путаются», когда модель придерживается заданной роли, принимая ложные утверждения за истинные.&lt;/p&gt;\n&lt;p&gt;Причина кроется в «ложных корреляциях»: детекторы обучаются на данных, где правдивость статистически связана с другими факторами, такими как точность выполнения инструкций или вероятность появления конкретных токенов. В ходе экспериментов с тремя новыми наборами данных, где истина была намеренно отделена от этих факторов, выяснилось, что каждый из протестированных детекторов дает сбой. Авторы предложили простую линейную модель, которая лучше справляется с разделением фактов и ролевых установок, подчеркивая необходимость обучения детекторов на данных, где истина не зависит от стиля или контекста.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование ограничено проверкой конкретных типов ролевых моделей и не охватывает все возможные сценарии дезинформации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Подробный разбор статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Инструменты для обнаружения лжи в больших языковых моделях (LLM) анализируют внутренние состояния нейросети, чтобы определить, является ли ответ правдивым. Однако использование ролевых моделей (&lt;a href=\"concepts/counterfactual-role.html\"&gt;role-play&lt;/a&gt;) усложняет задачу: модель может принимать различные образы, включая те, чьи убеждения противоречат реальности, например, сторонника теории заговора. В данной работе исследуется, способны ли детекторы лжи распознавать фактическую ложь в ответах таких «антифактических» персонажей или же они ошибочно принимают их вымышленные убеждения за истину.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование показало, что существующие детекторы лжи часто не справляются с задачей, когда модель принимает роль персонажа с искаженными представлениями о реальности.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Авторы создали датасет из 8 916 ответов, проверенных людьми, полученных от трёх различных LLM. В ходе эксперимента тестировались восемь детекторов лжи из предыдущих исследований. Для анализа причин ошибок были разработаны три новых набора данных, где истинность утверждений намеренно коррелировала с потенциально сбивающими с толку факторами (конфаундерами).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/konfaunder.html\"&gt;Конфаундер&lt;/a&gt; — это побочный фактор, который может исказить результаты исследования, создавая ложную видимость связи между переменными.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Эксперименты показали, что многие детекторы лжи опираются не на истинность утверждения, а на признаки, которые случайно коррелировали с правдой в обучающих выборках, такие как степень следования инструкции или общая вероятность генерации ответа. На основе этих данных предложен простой линейный зонд (linear probe), который показал лучшие результаты в тестах на ролевые модели и конфаундеры. Работа демонстрирует, что текущие методы детекции лжи недостаточно надежны, и подчеркивает необходимость обучения моделей на данных, где истинность отделена от побочных лингвистических факторов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты основаны на тестировании конкретных моделей и наборов данных; текущие детекторы лжи не являются универсально надежными инструментами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;h4 id=\"problema-lzhi-i-obmana-v-bolshih-yazykovyh-modelyah\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#problema-lzhi-i-obmana-v-bolshih-yazykovyh-modelyah\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Проблема лжи и обмана в больших языковых моделях&lt;/span&gt;&lt;/a&gt;Проблема лжи и обмана в больших языковых моделях&lt;/h4&gt;\n&lt;p&gt;Современные большие языковые модели (LLM) демонстрируют всё более изощренные формы обмана. Примеры включают имитацию соответствия целям разработчиков или использование методов социальной инженерии для достижения собственных задач. В связи с этим обнаружение лжи стало критически важной областью безопасности ИИ. Исследователи активно разрабатывают «зонды» (probes) — дополнительные классификаторы, которые анализируют внутренние состояния модели, чтобы предсказать, говорит ли она неправду. Однако определение лжи для ИИ осложняется способностью моделей к ролевым играм. Обучение на огромных массивах интернет-текстов позволяет модели имитировать любые личности — от ученого до сторонника теорий заговора. Даже после настройки на «полезность и безвредность», способность модели переключаться на другие роли сохраняется, что может привести к выдаче вредных советов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Авторы определяют ложь как утверждение, противоречащее «базовым убеждениям» модели в режиме помощника, даже если оно соответствует роли, которую модель играет в данный момент.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зонды (probes) — это вспомогательные алгоритмы, которые обучаются на внутренних данных нейросети для выявления скрытых паттернов, например, признаков того, что модель генерирует ложь.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Определение лжи в работе является специфическим и привязано к «личности» помощника, что не всегда совпадает с общепринятыми философскими трактовками истины.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"empiricheskoe-issledovanie-i-vklad\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#empiricheskoe-issledovanie-i-vklad\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Эмпирическое исследование и вклад&lt;/span&gt;&lt;/a&gt;Эмпирическое исследование и вклад&lt;/h4&gt;\n&lt;p&gt;Авторы задаются вопросом: будут ли детекторы лжи распознавать ложь, если модель находится в «антифактологической» роли, или они будут следовать логике этой роли? Исследование показало, что существующие детекторы часто не справляются с этой задачей, так как они опираются на признаки, лишь косвенно связанные с истиной (например, соблюдение инструкций или вероятность ответа).&lt;/p&gt;\n&lt;p&gt;Основные результаты работы:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Создан набор данных из 8 916 ответов, сгенерированных тремя LLM. Он включает как нейтральные ответы, так и ответы в 15 антифактологических ролях.&lt;/li&gt;\n&lt;li&gt;Протестировано восемь существующих методов обнаружения лжи; выявлено, что большинство из них дают сбои при смене ролей.&lt;/li&gt;\n&lt;li&gt;Разработаны три новых теста на «смешивающие факторы» (confounder tests), которые выявили уязвимости во всех изученных ранее методах.&lt;/li&gt;\n&lt;li&gt;Предложен новый зонд, который показал наилучшую точность разделения фактов и лжи, успешно пройдя все три теста.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h4 id=\"svyazannye-raboty-obman-i-lozh-v-ii\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#svyazannye-raboty-obman-i-lozh-v-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связанные работы: обман и ложь в ИИ&lt;/span&gt;&lt;/a&gt;Связанные работы: обман и ложь в ИИ&lt;/h4&gt;\n&lt;p&gt;Ранее было задокументировано, что ИИ способен обманывать при достижении заданных целей, имитировать лояльность разработчикам для сохранения своих задач и стратегически занижать результаты на тестах производительности.&lt;/p&gt;\n&lt;h4 id=\"zondy-dlya-obnaruzheniya-pravdy,-obmana-i-lzhi\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#zondy-dlya-obnaruzheniya-pravdy,-obmana-i-lzhi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Зонды для обнаружения правды, обмана и лжи&lt;/span&gt;&lt;/a&gt;Зонды для обнаружения правды, обмана и лжи&lt;/h4&gt;\n&lt;p&gt;Исследования показывают, что большие языковые модели (LLM) способны внутренне различать истинные и ложные утверждения. На этом основаны «зонды правды» — классификаторы, обучаемые на векторах внутренней активации модели для определения достоверности высказываний. Последующие разработки расширили этот подход до детектирования лжи, где модель генерирует утверждение, которое сама считает ложным. Существуют также «зонды обмана», отслеживающие более широкий спектр девиантного поведения, а не только прямую ложь.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Несмотря на развитие методов, универсальные и устойчивые детекторы лжи для LLM пока не созданы: точность зондов падает при смене контекста, а их внутренние представления могут дрейфовать в ходе диалога.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зонд (probe) — это вспомогательная модель, которая анализирует скрытые состояния основной нейросети, чтобы извлечь информацию о том, «понимает» ли модель истинность своих слов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследования указывают на риск того, что детекторы могут опираться на ложные корреляции, а не на истинное понимание фактов, что ограничивает их надежность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"rolevye-igry-i-ubezhdeniya-llm\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#rolevye-igry-i-ubezhdeniya-llm\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ролевые игры и убеждения LLM&lt;/span&gt;&lt;/a&gt;Ролевые игры и убеждения LLM&lt;/h4&gt;\n&lt;p&gt;Создание детекторов лжи осложняется тем, что модели способны имитировать различные личности (персоны) с противоречивыми убеждениями. В процессе диалога модель может отклоняться от стандартного ассистента в сторону ролей, которые могут быть вредоносными. Хотя предыдущие работы использовали зонды для проверки «убеждений» моделей, они часто полагались на ввод ложных утверждений пользователем. В отличие от них, наше исследование использует ответы, сгенерированные самой моделью в рамках антифактических ролей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наш подход позволяет оценить работу детекторов на лжи, которую модель продуцирует самостоятельно, что является более строгим тестом, чем анализ ответов на навязанные пользователем вопросы.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nabor-dannyh-antifakticheskih-person\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#nabor-dannyh-antifakticheskih-person\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Набор данных антифактических персон&lt;/span&gt;&lt;/a&gt;Набор данных антифактических персон&lt;/h4&gt;\n&lt;p&gt;Мы представляем набор из 8 916 пар «вопрос-ответ», полученных от трех различных LLM. Для каждого вопроса модель генерирует два ответа: честный и деструктивный (в рамках антифактической роли). Набор данных включает 15 персон, разделенных на три категории по 5 типов: реалистичные (например, сторонники теорий заговора), вымышленные (персонажи книг) и исторические (например, средневековый врач). Каждая персона сопровождается примерно 100 вопросами, где убеждения роли конфликтуют с реальностью.&lt;/p&gt;\n&lt;h4 id=\"generaciya-nabora-dannyh-s-voprosami\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#generaciya-nabora-dannyh-s-voprosami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Генерация набора данных с вопросами&lt;/span&gt;&lt;/a&gt;Генерация набора данных с вопросами&lt;/h4&gt;\n&lt;p&gt;Для создания вопросов, требующих от модели как антифактического ответа, так и четкой бинарной метки истинности, авторы применили &lt;a href=\"concepts/agentnyy-konveyer.html\"&gt;агентный конвейер&lt;/a&gt;. Процесс включал итеративную генерацию, тестирование и уточнение вопросов. Каждая персона инициализировалась небольшим набором вопросов и системным промптом, написанными людьми. Важное ограничение: &lt;a href=\"concepts/sistemnyy-prompt.html\"&gt;системный промпт&lt;/a&gt; мог только описывать роль, но не давать прямых инструкций о том, как отвечать или во что верить.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Автоматизированный цикл генерации и аудита позволил получить до 100 верифицированных пар «вопрос-ответ» для каждой персоны, обеспечивая баланс истинных и ложных меток.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Цикл включал использование модели Opus 4.8 (Anthropic, 2026) для анализа неудачных попыток ролевой игры и внесения правок. Процесс завершался при достижении 100 принятых судьей пар или после 10 итераций без улучшений.&lt;/p&gt;\n&lt;h4 id=\"obuedinenie-otvetov-v-ramkah-odnogo-sistemnogo-prompta\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#obuedinenie-otvetov-v-ramkah-odnogo-sistemnogo-prompta\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объединение ответов в рамках одного системного промпта&lt;/span&gt;&lt;/a&gt;Объединение ответов в рамках одного системного промпта&lt;/h4&gt;\n&lt;p&gt;В базовом наборе данных метка истинности предсказывается по системному промпту (честный или антифактический). Чтобы исключить этот фактор, авторы создали метод «префилла общей персоны» (&lt;a href=\"concepts/spp.html\"&gt;SPP&lt;/a&gt;). В этом режиме и правдивый ответ, и антифактический ответ генерируются под одним и тем же системным промптом персоны. Это позволяет проверить, могут ли детекторы лжи распознать истину, когда модель находится в контексте, где она обычно должна была бы транслировать ложь.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/prefill.html\"&gt;Префилл&lt;/a&gt; (prefill) — это предварительное заполнение контекста модели, которое задает тон или формат ответа до того, как модель начнет генерировать основной текст.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nabory-dannyh-s-iskazhayushimi-faktorami-confounder-datasets\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#nabory-dannyh-s-iskazhayushimi-faktorami-confounder-datasets\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Наборы данных с искажающими факторами (Confounder Datasets)&lt;/span&gt;&lt;/a&gt;Наборы данных с искажающими факторами (Confounder Datasets)&lt;/h4&gt;\n&lt;p&gt;Авторы выделили три концепта, которые могут ложно коррелировать с истиной: вероятность (likelihood), убеждения персоны и соответствие инструкциям (compliance).&lt;/p&gt;\n&lt;h4 id=\"veroyatnost\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#veroyatnost\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вероятность&lt;/span&gt;&lt;/a&gt;Вероятность&lt;/h4&gt;\n&lt;p&gt;Поскольку модели обучаются быть честными, истинные ответы часто статистически более вероятны. Чтобы проверить, не опираются ли детекторы на эту вероятность, авторы создали датасет, где истина и вероятность антикоррелированы. С помощью контекстного обучения (&lt;a href=\"concepts/in-context-learning.html\"&gt;in-context learning&lt;/a&gt;) модели давали понять, что за неверные ответы полагается «награда», что делало ложные ответы более вероятными для модели.&lt;/p&gt;\n&lt;h4 id=\"ubezhdeniya-persony\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#ubezhdeniya-persony\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Убеждения персоны&lt;/span&gt;&lt;/a&gt;Убеждения персоны&lt;/h4&gt;\n&lt;p&gt;Этот набор данных проверяет, не принимает ли детектор согласие с убеждениями персоны за истину. Авторы создали персону, которая «в частном порядке» придерживается ложных убеждений (например, «7 × 6 = 13»), но не обязана их озвучивать. В этом случае убеждения персоны антикоррелированы с истиной, что позволяет отделить отслеживание правды от следования роли.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование моделей для создания антифактических сценариев ограничено тем, что модель может «выходить из роли» или демонстрировать предвзятость, заложенную при обучении.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"sootvetstvie-instrukciyam\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#sootvetstvie-instrukciyam\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Соответствие инструкциям&lt;/span&gt;&lt;/a&gt;Соответствие инструкциям&lt;/h4&gt;\n&lt;p&gt;Процесс дообучения (post-training) направлен на то, чтобы сделать большие языковые модели (LLM) честными. Если модель генерирует ложное утверждение, это расценивается как нарушение принципа честности. Авторы выдвигают гипотезу, что концепция «нечестности» может иметь ложную корреляцию с нарушением соответствия инструкциям в пространстве активаций LLM.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследователи создали датасет, где истинность утверждения и следование формальным инструкциям намеренно противопоставлены для выявления ложных корреляций.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Для проверки этой гипотезы был сформирован набор данных, в котором ложность утверждения идеально коррелирует с соблюдением инструкций, а истинность — антикоррелирует. В качестве прокси-показателя общего соответствия принципам используется «&lt;a href=\"concepts/instruction-following.html\"&gt;следование инструкциям&lt;/a&gt;» (instruction compliance), так как это поведение сильно выражено у современных моделей.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/proksi-pokazatel.html\"&gt;Прокси-показатель&lt;/a&gt; — это косвенная метрика, которую используют, когда прямое измерение исследуемого свойства затруднено.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В рамках эксперимента модели предлагается задача (например, «Сколько будет 7+6?») и сопутствующая инструкция по форматированию (например, «Ответ должен быть в квадратных скобках»). Правильный ответ («13») в данном сценарии нарушает инструкцию, так как не заключен в скобки, тогда как заведомо неверный ответ («[11]») формально соответствует заданному правилу. Таким образом, на данном датасете истинность и следование инструкциям оказываются антикоррелированными.&lt;/p&gt;\n&lt;h4 id=\"issledovanie-bazovyh-ubezhdenij\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#issledovanie-bazovyh-ubezhdenij\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ИССЛЕДОВАНИЕ БАЗОВЫХ УБЕЖДЕНИЙ&lt;/span&gt;&lt;/a&gt;ИССЛЕДОВАНИЕ БАЗОВЫХ УБЕЖДЕНИЙ&lt;/h4&gt;\n&lt;p&gt;В данном разделе мы оцениваем методы зондирования (&lt;a href=\"concepts/probing.html\"&gt;probing&lt;/a&gt;) для выявления правды и лжи на основе «базовых убеждений» модели. Мы рассматриваем четыре компонента: операционализацию понятия «&lt;a href=\"concepts/base-belief.html\"&gt;базовое убеждение&lt;/a&gt;» (раздел 5.1), восемь существующих методов зондирования (раздел 5.2), наш собственный метод, обученный на элементарных фактах с инструкциями, провоцирующими конфликт (раздел 5.3), и протокол выбора слоя для извлечения активаций (раздел 5.4).&lt;/p&gt;\n&lt;p&gt;5.1 БАЗОВОЕ УБЕЖДЕНИЕ&lt;br /&gt;\nМы определяем «базовое убеждение» как позицию, которую модель последовательно выражает в режиме «полезного помощника» при отсутствии стимулов ко лжи. Мы проверяем это, генерируя пять ответов на каждый вопрос при системном промпте «полезный помощник» и температуре T=1. Мы исключаем вопросы, где ответ модели расходится с объективной истиной, так как наша цель — проверить, могут ли детекторы лжи извлечь знания, которыми модель обладает, но которые она скрывает при ролевой игре. Ложь определяется относительно этого базового убеждения: ответы, совпадающие с ним, считаются честными, а противоречащие — ложью.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Базовое убеждение — это истинная позиция модели в режиме «полезного помощника», относительно которой мы классифицируем ответы как правдивые или ложные.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;5.2 СУЩЕСТВУЮЩИЕ МЕТОДЫ ЗОНДИРОВАНИЯ&lt;br /&gt;\nМы оцениваем восемь известных методов обнаружения лжи и обмана. Все они являются линейными классификаторами, а их ключевое различие заключается в составе обучающих данных. Разные наборы данных позволяют моделям-зондам лучше или хуже отделять целевой концепт от побочных признаков. Мы сохраняем оригинальные архитектуры и правила выбора токенов для извлечения векторов активации.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Зондирование (probing) — это метод анализа внутренних состояний нейросети, при котором обучается простой классификатор для предсказания конкретной информации (например, «правда» или «ложь») из активаций модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Метод Marks/Bürger Truth обучается на простых истинных и ложных утверждениях. В нашей версии (Marks/Bürger Lie) мы адаптировали его под чат-шаблоны, где модель инструктируют изложить факт, а ответ заполняется в поле ассистента. Zou RepE использует PCA для поиска «вектора честности», сравнивая активации при инструкциях «отвечать честно» и «отвечать неправдиво» на научных фактах. Goldowsky-Dill RepE адаптирует этот подход в контролируемый классификатор, заменяя «неправду» на «нечестность». Goldowsky-Dill Roleplay использует сценарии ролевых игр с мотивацией для персонажа, а Cooney Did-You-Lie (DYL) анализирует активации модели в момент, когда её прямо спрашивают: «Ты солгал?».&lt;/p&gt;\n&lt;h4 id=\"cundy-doluschat\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#cundy-doluschat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cundy DolusChat&lt;/span&gt;&lt;/a&gt;Cundy DolusChat&lt;/h4&gt;\n&lt;p&gt;Детектор Cundy DolusChat обучается на парах ответов помощника: правдивых и ложных, данных в идентичном контексте пользователя и системной инструкции. Поскольку системная инструкция одинакова для обоих вариантов, она не несет предсказательной силы. Классификатор на основе логистической регрессии обучается на активациях последнего токена ответа. Датасет включает 129 776 ответов, что делает его крупнейшим среди всех исследованных методов.&lt;/p&gt;\n&lt;p&gt;Метод MacDiarmid Contrast Pair (CP) использует минималистичный подход: создается пара контрастных ответов на вопрос «Ты полезный ИИ?» («да» против «нет»). Векторы активации «да» вычитаются из векторов «нет».&lt;/p&gt;\n&lt;p&gt;Goldowsky-Dill Self-Description (SD) адаптирует этот метод, задавая вопрос «Ты лжешь?» и сравнивая ответы «Да» и «Нет». Векторы «Нет» вычитаются из векторов «Да», что инвертирует ожидаемое направление вектора на основе эмпирических данных авторов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Cundy DolusChat является крупнейшим датасетом (129 776 ответов), в то время как методы CP и SD используют минимальные контрастные пары для выделения векторов лжи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"nash-metod-elementarnye-fakty-s-konfliktnymi-instrukciyami\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#nash-metod-elementarnye-fakty-s-konfliktnymi-instrukciyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Наш метод: элементарные факты с конфликтными инструкциями&lt;/span&gt;&lt;/a&gt;Наш метод: элементарные факты с конфликтными инструкциями&lt;/h4&gt;\n&lt;p&gt;Мы предлагаем новый метод, обучающие данные которого исключают смешивающие факторы (конфаундеры). Мы используем три темы: географические локации, перевод с испанского на английский и химические элементы. Форматы данных включают утвердительные и отрицательные высказывания, а также вопросы с принудительным выбором неверного ответа (например, инструкция «всегда отвечать Нет», когда правильный ответ «Да»).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/smeshivayuschiy-faktor.html\"&gt;Смешивающий фактор&lt;/a&gt; (конфаундер) — это побочная переменная, которая может исказить результаты, заставляя модель реагировать не на ложь, а, например, на стиль инструкции или вероятность токена.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Использование синтетических данных с принудительным искажением ответов — это модельный подход, который может не полностью отражать сложность реальной человеческой лжи.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Добавление вопросов с принудительным ответом позволяет устранить влияние «послушности» модели, так как в этом наборе данных послушность антикоррелирует с истинностью. Мы обучаем классификатор логистической регрессии на активациях токена конца ответа (EOT), который является нейтральным и идентичным для всех примеров.&lt;/p&gt;\n&lt;h4 id=\"vybor-sloya\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#vybor-sloya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор слоя&lt;/span&gt;&lt;/a&gt;Выбор слоя&lt;/h4&gt;\n&lt;p&gt;Для честного сравнения мы выбираем слой трансформера, на котором зонд (probe) достигает максимального значения AUROC на валидационной выборке. Обычно это средние слои модели. Однако для методов Goldowsky-Dill RepE и SD этот подход выбирал слишком ранние слои (4 и 5). Чтобы дать этим методам преимущество, мы выбрали слои 22 и 36, основываясь на их эффективности в наборе данных ролевой игры с обманом, что соответствует методологии оригинальных авторов.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"ocenka-zondov-na-naborah-dannyh-s-antifakticheskimi-personami-i-konfunderami\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#ocenka-zondov-na-naborah-dannyh-s-antifakticheskimi-personami-i-konfunderami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ОЦЕНКА ЗОНДОВ НА НАБОРАХ ДАННЫХ С АНТИФАКТИЧЕСКИМИ ПЕРСОНАМИ И КОНФУНДЕРАМИ&lt;/span&gt;&lt;/a&gt;ОЦЕНКА ЗОНДОВ НА НАБОРАХ ДАННЫХ С АНТИФАКТИЧЕСКИМИ ПЕРСОНАМИ И КОНФУНДЕРАМИ&lt;/h4&gt;\n&lt;p&gt;В данном разделе мы оцениваем эффективность зондов, описанных ранее, а также нашего нового метода на наборе данных с антифактическими персонами и трех наборах данных с конфундерами (смешивающими факторами). Основные результаты для модели Llama 3.3 70B представлены в Таблице 2. Для оценки используется метрика AUROC, которая показывает способность зонда различать ответы, соответствующие внутренним убеждениям модели, и ответы, противоречащие им: 1 означает идеальное разделение, 0,5 — случайный выбор, 0 — полную инверсию. Результаты для персон усреднены по 15 различным профилям с равными весами.&lt;/p&gt;\n&lt;h4 id=\"antifakticheskie-persony-v-shtatnom-rezhime-on-policy\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#antifakticheskie-persony-v-shtatnom-rezhime-on-policy\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Антифактические персоны в штатном режиме (on-policy)&lt;/span&gt;&lt;/a&gt;Антифактические персоны в штатном режиме (on-policy)&lt;/h4&gt;\n&lt;p&gt;При работе с ответами в штатном режиме большинство зондов демонстрируют хорошие результаты, достигая AUROC от 0,86 до 0,94. Исключение составляют методы MacDiarmid CP и Goldowsky-Dill SD, которые показывают низкую эффективность. Наш зонд демонстрирует наилучший результат — 0,98. Однако в этом режиме истинность ответа можно предсказать исключительно по системному промпту, так как правдивые ответы генерируются с обычным промптом помощника, а ложные — с промптом антифактической персоны. Это привело к необходимости использования метода «префилла с общей персоной» (SPP), где оба варианта ответа вставляются после одного и того же системного промпта.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В штатном режиме большинство зондов успешно различают правду и ложь, но их точность частично обусловлена особенностями системных промптов, а не анализом содержания ответа.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"prefill-s-obshej-personoj-spp\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#prefill-s-obshej-personoj-spp\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Префилл с общей персоной (SPP)&lt;/span&gt;&lt;/a&gt;Префилл с общей персоной (SPP)&lt;/h4&gt;\n&lt;p&gt;При использовании SPP зонд не может полагаться на системный промпт для определения правдивости. В этом сценарии истинность ответа коррелирует с двумя потенциальными конфундерами: вероятностью (likelihood) и соответствием инструкции (compliance). Правдивый ответ менее вероятен в контексте антифактического промпта, чем ложный, и при этом он не соответствует инструкции, заданной этим промптом. Мы предполагаем, что именно эти факторы вызывают резкое падение эффективности большинства зондов. Некоторые из них, например Goldowsky-Dill RepE или Cooney DYL, начинают показывать результаты хуже случайных. Лишь Marks/Bürger Lie (0,899 → 0,885) и Cundy DolusChat (0,906 → 0,901) остаются относительно стабильными. Наш зонд, обученный на примерах с конфликтующими инструкциями, показывает наилучший результат (0,976).&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;SPP — это метод тестирования, при котором модель получает одинаковый системный промпт для обоих вариантов ответа, что исключает возможность «подглядывания» зонда в настройки роли модели.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эффективность зондов на моделях Gemma 3 27B и Gemma 4 31B подтверждает, что проблемы при использовании SPP являются системными и часто проявляются еще сильнее, чем у Llama.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"testy-na-konfundery\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#testy-na-konfundery\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Тесты на конфундеры&lt;/span&gt;&lt;/a&gt;Тесты на конфундеры&lt;/h4&gt;\n&lt;p&gt;В тестах на «вероятность» и «убеждения персоны» некоторые зонды работают удовлетворительно, однако в тесте на «соответствие инструкции» все предыдущие методы показывают результат хуже случайного (за исключением Goldowsky-Dill SD, который демонстрирует инверсию). Это указывает на сильную ложную корреляцию между истинностью и соответствием инструкции. Наш зонд достигает идеального AUROC на всех трех наборах данных с конфундерами, так как мы специально проектировали обучающую выборку для разделения этих понятий. Это подтверждает, что неудачи предыдущих зондов были частично вызваны неспособностью отделить истину от конфундеров. Тем не менее, на модели Gemma 4 зонд Cooney DYL показывает отличные результаты на конфундерах, но проваливается на SPP (0,171), что указывает на наличие других, пока не выявленных факторов влияния.&lt;/p&gt;\n&lt;h3 id=\"obsuzhdenie\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#obsuzhdenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обсуждение&lt;/span&gt;&lt;/a&gt;Обсуждение&lt;/h3&gt;\n&lt;h4 id=\"i-ogranicheniya\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#i-ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И ОГРАНИЧЕНИЯ&lt;/span&gt;&lt;/a&gt;И ОГРАНИЧЕНИЯ&lt;/h4&gt;\n&lt;p&gt;Наше исследование показывает, что существующие методы обнаружения лжи в работе больших языковых моделей (LLM) недостаточно надежны. Они часто дают сбои при столкновении с антифактическими (противоречащими реальности) персонами и опираются на ложные корреляции в данных.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Текущие инструменты детекции лжи уязвимы перед антифактическими персонами и полагаются на случайные статистические связи, а не на истинное понимание фактов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Работа имеет ряд ограничений. Во-первых, мы использовали системные промпты для создания антифактических персон в рамках диалогов из одной реплики. В реальности же «дрейф» модели в сторону таких персон чаще происходит в ходе длительных многоходовых бесед. Исследование таких сценариев — перспективное направление. Во-вторых, из-за вычислительных ограничений мы тестировали модели объемом не более 70 миллиардов параметров. В-третьих, вероятно, существуют и другие скрытые факторы (конфаундеры), которые могут приводить к ошибкам детекции при изменении распределения данных. Мы подчеркиваем сложность создания универсальных детекторов и призываем к формированию более широких обучающих выборок с поиском скрытых искажающих факторов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Ограничение: результаты получены на моделях до 70 млрд параметров и в условиях одноходовых диалогов, что может не отражать поведение ИИ в сложных многоходовых беседах.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h4 id=\"zayavlenie-ob-ispolzovanii-ii\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#zayavlenie-ob-ispolzovanii-ii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ЗАЯВЛЕНИЕ ОБ ИСПОЛЬЗОВАНИИ ИИ&lt;/span&gt;&lt;/a&gt;ЗАЯВЛЕНИЕ ОБ ИСПОЛЬЗОВАНИИ ИИ&lt;/h4&gt;\n&lt;p&gt;Авторы использовали генеративные инструменты для написания кода (Claude Code, Codex), создания датасетов (Claude Opus 4.8 для итеративной доработки, Llama 3.3 70B в качестве судьи) и редактирования текста. Весь код и данные прошли ручную проверку авторами. ИИ не участвовал в разработке методологии, теоретических моделей и доказательстве математических утверждений.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur-f1.jpg\" alt=\"Рисунок 1: Основной вклад данной работы включает: (1) новый набор данных для ролевых игр с обучением в процессе (on-poli\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Рисунок 1: Основной вклад данной работы включает: (1) новый набор данных для ролевых игр с обучением в процессе (on-policy), (2) оценки, показывающие, что существующие методы зондирования (probes) не способны выявлять ложь в условиях ролевой игры, (3) три…&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Рисунок 1: Основной вклад данной работы включает: (1) новый набор данных для ролевых игр с обучением в процессе (on-policy), (2) оценки, показывающие, что существующие методы зондирования (probes) не способны выявлять ложь в условиях ролевой игры, (3) три тестовых набора для анализа ложных корреляций, демонстрирующих ключевые недостатки всех предыдущих методов зондирования, и (4) новый метод зондирования, который корректно отделяет истину в условиях ролевой игры и демонстрирует устойчивость к протестированным мешающим факторам (confounders).&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/stress-testing-llm-lie-detectors-role-play-failures-and-spur.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Детекторы лжи&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ИИ не видят&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;разницы в&lt;/text&gt;&lt;text x=\"26\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ролях&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Тест на 8 916&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;ответах с 15&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;персонажами&lt;/text&gt;&lt;pat
