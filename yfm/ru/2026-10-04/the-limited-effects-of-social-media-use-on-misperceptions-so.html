        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 400\"&gt;&lt;rect width=\"800\" height=\"400\" fill=\"#5B4FCF\" rx=\"18\"&gt;&lt;/rect&gt;&lt;path fill=\"#8E85E8\" fill-opacity=\".55\" d=\"M782 0a18 18 0 0 1 18 18v364a18 18 0 0 1-18 18H180Z\"&gt;&lt;/path&gt;&lt;circle cx=\"251\" cy=\"124\" r=\"90\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;circle cx=\"609\" cy=\"290\" r=\"130\" fill=\"#fff\" fill-opacity=\".08\"&gt;&lt;/circle&gt;&lt;text x=\"60\" y=\"60\" fill=\"#fff\" fill-opacity=\".85\" font-family=\"sans-serif\" font-size=\"16\" letter-spacing=\"1\"&gt;     OSINT SIGNAL · BOTS   &lt;/text&gt;&lt;text x=\"60\" y=\"183\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;Миф о влиянии соцсетей на&lt;/text&gt;&lt;text x=\"60\" y=\"217\" fill=\"#fff\" font-family=\"sans-serif\" font-size=\"28\" font-weight=\"700\"&gt;искажение реальности&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f1.jpg\" alt=\"Распределение времени, проведенного в социальных сетях, в двух панельных опросах. Распределение минут, проведенных в чет\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Распределение времени, проведенного в социальных сетях, в двух панельных опросах. Распределение минут, проведенных в четырех социальных сетях, в двух панельных исследованиях. Дополнительные кумулятивные функции распределения (CCDF) минут, проведенных в Facebook, Instagram, Twitter и YouTube для панелей, сфокусированных на президентских выборах в США 2020 года (A) и периоде пандемии COVID-19 с декабря 2020 года по июнь 2021 года (B).&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Исследователи изучили связь между использованием соцсетей и способностью людей отличать правду от лжи. Анализ данных двух крупных панельных исследований, проведенных во время выборов в США и пандемии COVID-19, не выявил значимой корреляции. Даже при активном использовании Facebook, Twitter, YouTube или Instagram пользователи не теряют навык критической оценки информации.&lt;/p&gt;\n&lt;h2 id=\"glavnoe\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#glavnoe\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Главное&lt;/span&gt;&lt;/a&gt;Главное&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Исследование охватило Facebook, Twitter, YouTube и Instagram в периоды выборов и пандемии.&lt;/li&gt;\n&lt;li&gt;Использована &lt;a href=\"concepts/signal-detection-theory.html\"&gt;теория обнаружения сигналов&lt;/a&gt; для оценки точности суждений пользователей.&lt;/li&gt;\n&lt;li&gt;Объективные данные трекинга не подтвердили значимой связи между временем в сети и верой в фейки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"podrobnee\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#podrobnee\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Подробнее&lt;/span&gt;&lt;/a&gt;Подробнее&lt;/h2&gt;\n&lt;p&gt;В работе применялись методы теории обнаружения сигналов (Signal Detection Theory, SDT) для оценки «чувствительности убеждений» — способности респондентов различать истинные и ложные утверждения. Исследователи использовали данные YouGov, объединив панельные опросы с объективными логами активности (&lt;a href=\"concepts/digital-trace-data.html\"&gt;digital trace data&lt;/a&gt;) на устройствах участников. Выборка составила 624 человека для политического исследования и 1010 человек для исследования по COVID-19.&lt;/p&gt;\n&lt;p&gt;Для анализа использовались внутри-между-групповые регрессионные модели (within-between regression models), позволяющие учитывать как индивидуальные различия, так и динамику поведения во времени. Результаты показали, что средняя &lt;a href=\"concepts/sensitivity.html\"&gt;чувствительность&lt;/a&gt; респондентов к правде составляет около 0,75, и этот показатель остается стабильным независимо от интенсивности использования соцсетей. Статистически значимые связи, обнаруженные при самоотчетах, исчезали при проверке через объективные данные трекинга.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-alert\" note-type=\"alert\"&gt;&lt;p class=\"yfm-note-title\"&gt;Ограничения&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование опирается на добровольную выборку пользователей, согласных на трекинг поведения, что может ограничивать репрезентативность.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полный перевод статьи&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;h3 id=\"rezyume\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#rezyume\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Резюме&lt;/span&gt;&lt;/a&gt;Резюме&lt;/h3&gt;\n&lt;p&gt;Использование социальных сетей потенциально может способствовать возникновению ложных представлений, однако имеющиеся данные противоречивы. Несмотря на такие характеристики социальных сетей, как гомофильные социальные сети, алгоритмы, способные усиливать предвзятость, и социальные боты, распространяющие недостоверную информацию, доказательства сильной связи между использованием социальных сетей и ложными представлениями отсутствуют. Данный проект представляет собой наиболее масштабную на сегодняшний день эмпирическую проверку этой взаимосвязи, предоставляя дополнительные свидетельства минимального влияния использования социальных сетей на формирование ложных представлений.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование, основанное на двух независимых панельных выборках, не выявило статистически значимой связи между использованием социальных сетей и снижением способности пользователей отличать правдивые утверждения от ложных.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Данные получены в ходе двух независимых панельных исследований с большими выборками, каждое из которых сопровождалось данными онлайн-трекинга: одно было посвящено выборам 2020 года, другое — пандемии COVID-19. Регрессионные модели типа within-between показывают, что использование социальных сетей не было связано со статистически значимым снижением способности американцев различать правдивые и ложные утверждения ни на одной из четырех исследованных платформ: Facebook, Twitter, YouTube и Instagram.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Наблюдательное исследование: установлена корреляция, но не причинно-следственная связь; результаты ограничены четырьмя указанными платформами.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"vvedenie\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#vvedenie\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Введение&lt;/span&gt;&lt;/a&gt;Введение&lt;/h3&gt;\n&lt;p&gt;Опасения по поводу вредного влияния дезинформации в социальных сетях широко распространены в США, и некоторые эмпирические данные подтверждают их обоснованность. Социальные сети становятся всё более популярным и заслуживающим доверия источником новостей, где пользователи часто объединяются в политически однородные сообщества. Внутри некоторых из этих сетей, особенно на их периферии, широко распространяется ложный и провокационный контент. Алгоритмы платформ могут непреднамеренно способствовать распространению дезинформации и усиливать предвзятость пользователей, в то время как скоординированная активность социальных ботов стратегически усиливает определённые типы дезинформации. Даже при наличии проверки фактов ложные сведения в Twitter имеют тенденцию распространяться дальше и быстрее, чем правдивые, хотя эта закономерность воспроизводится не на всех платформах.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследования показывают противоречивые результаты: алгоритмы способствуют распространению ложных данных, однако их реальное влияние на политические убеждения пользователей часто оказывается ограниченным.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В то же время эмпирические исследования роли социальных сетей в формировании ложных представлений указывают на более ограниченный набор эффектов, что согласуется с традицией «минимальных эффектов» в коммуникационных исследованиях. Политическая дезинформация составляет незначительную часть экосистемы социальных сетей, и американцы делятся ею нечасто. Ранние панельные данные 2016 года не выявили четкой связи между использованием Facebook и политическими заблуждениями среди взрослых американцев. Экспериментальные исследования дают более сильные доказательства причинно-следственных связей, но приносят столь же неоднозначные результаты. Исследование 2018 года, основанное на деактивации аккаунтов, показало, что у пользователей, которые перестали пользоваться Facebook на месяц, снизилась точность их политических знаний. Последующее исследование 2020 года разграничило знание новостей (распознавание текущих событий) и знание фактов (различение истинных и ложных утверждений), обнаружив, что отказ от использования Facebook был связан со снижением знаний о новостях, но с улучшением знаний о фактах; участники, переставшие пользоваться Facebook, демонстрировали умеренно меньшую веру в три ложных утверждения.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Результаты исследований зависят от методологии: деактивация аккаунтов показывает неоднозначное влияние на разные типы знаний, что ограничивает возможность однозначных выводов.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В более широком смысле исследования вмешательств платформ, которые манипулируют контентом ленты или ранжированием, как правило, выявляют ограниченное влияние на политические знания, убеждения или установки. В соответствии с этими закономерностями недавние международные данные указывают на аналогичную зависимую модель, в которой связи между использованием платформ и верой в дезинформацию зависят от темы, платформы, доверия к новостям и более широкой информационной среды. Представленный здесь проект предлагает одни из самых убедительных на сегодняшний день доказательств ограничений влияния использования социальных сетей на ложные представления, с тестами, проведенными в контексте как президентских выборов в США 2020 года, так и пандемии COVID-19. Объединяя панельные опросы, проведенные на большой выборке американцев, с данными цифровых следов, мы демонстрируем, что увеличение использования социальных сетей не имеет существенной значимой связи с ложными представлениями ни в одном из контекстов. Самостоятельно сообщаемое использование YouTube и Twitter связано с очень небольшим, но статистически значимым улучшением способности идентифицировать истинные и ложные утверждения, однако эти связи не являются значимыми при анализе с использованием поведенческих данных.&lt;/p&gt;\n&lt;h3 id=\"rezultaty\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#rezultaty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Результаты&lt;/span&gt;&lt;/a&gt;Результаты&lt;/h3&gt;\n&lt;h4 id=\"ispolzovanie-socialnyh-setej-i-chuvstvitelnost-k-dostovernosti-informacii\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#ispolzovanie-socialnyh-setej-i-chuvstvitelnost-k-dostovernosti-informacii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Использование социальных сетей и чувствительность к достоверности информации&lt;/span&gt;&lt;/a&gt;Использование социальных сетей и чувствительность к достоверности информации&lt;/h4&gt;\n&lt;p&gt;Мы начинаем с краткого описания паттернов использования социальных сетей, наблюдаемых в наших панельных исследованиях. Рис. 1 демонстрирует эмпирические распределения количества минут, проводимых пользователями в Facebook, Instagram, Twitter и YouTube в рамках двух панельных исследований. Как показывает рисунок, Facebook является наиболее популярной платформой по числу участников, использующих сайт. Однако наиболее активные пользователи YouTube проводят на этой платформе больше времени, чем самые активные пользователи других социальных сетей.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f1.jpg\" alt=\"Распределение времени, проведенного в социальных сетях, в двух панельных опросах. Распределение минут, проведенных в чет\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Распределение времени, проведенного в социальных сетях, в двух панельных опросах. Распределение минут, проведенных в четырех социальных сетях, в двух панельных исследованиях. Дополнительные кумулятивные функции распределения (CCDF) минут, проведенных в Facebook, Instagram, Twitter и YouTube для панелей, сфокусированных на президентских выборах в США 2020 года (A) и периоде пандемии COVID-19 с декабря 2020 года по июнь 2021 года (B).&lt;/em&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Простые описательные статистики не выявили значимой корреляции между использованием социальных сетей и восприимчивостью американцев к дезинформации.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В соответствии с предыдущими работами, простые описательные статистики предоставляют мало доказательств того, что восприимчивость американцев к ложным представлениям коррелирует с использованием ими социальных сетей. Рис. 2 использует данные нашей панели по выборам в США и показывает распределения убеждений.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f2.jpg\" alt=\"Связь между использованием социальных сетей и чувствительностью к убеждениям, связанным с политикой. Оценки плотности ве\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Связь между использованием социальных сетей и чувствительностью к убеждениям, связанным с политикой. Оценки плотности вероятности чувствительности к убеждениям во время президентских выборов в США в зависимости от использования социальных сетей. На панелях показаны децили уникальных часов за одну неделю в (A) Facebook, (B) Twitter, (C) YouTube и (D) Instagram в период сбора историй.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;Обсуждение&lt;/p&gt;\n&lt;p&gt;Данное исследование представляет собой надежную проверку связи между использованием социальных сетей и чувствительностью американцев к достоверности информации, то есть их способностью различать истинные и ложные утверждения. Важно отметить, что исследование изучает эту связь в двух значимых областях: политике и общественном здравоохранении — сферах, в которых существует серьезная научная и общественная обеспокоенность относительно того, в какой степени социальные сети могут быть ответственны за заблуждения общественности.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Осторожно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Исследование является наблюдательным (STROBE): выявленные связи не доказывают причинно-следственную зависимость, а результаты ограничены рассмотренными доменами (политика и здравоохранение).&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Наши данные включают оценки участников широкого спектра циркулирующих утверждений, как истинных, так и ложных, с которыми люди, вероятно, сталкивались в социальных сетях. Мы использовали как самоотчеты, так и поведенческие показатели использования социальных сетей и проверили наличие связей среди тех, кто называет социальные сети важным источником информации для себя. Во всех анализах мы не обнаружили доказательств того, что использование социальных сетей имеет существенную связь со способностью людей отличать правдивую информацию от ложной.&lt;/p&gt;\n&lt;h3 id=\"metody\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#metody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы&lt;/span&gt;&lt;/a&gt;Методы&lt;/h3&gt;\n&lt;p&gt;Данное исследование основано на двух отдельных панелях, организованных YouGov. Первая панель охватывала президентскую кампанию в США 2020 года, сбор данных проводился с 17 сентября 2020 года по 23 ноября 2020 года. В анализе использованы данные пяти волн с интервалом примерно в две недели. YouGov применила метод сопоставления выборки (sample matching) для половины участников, чтобы обеспечить репрезентативность (n = 700 на исходном этапе); выборка, для которой были доступны поведенческие данные, являлась нерепрезентативной (n = 700 на исходном этапе) и включала только добровольцев, согласившихся на отслеживание активности в сети. Вторая панель охватывала пандемию COVID-19 с 9 декабря 2020 года по 16 июня 2021 года. Было проведено семь волн с ежемесячным сбором данных. Это была нерепрезентативная выборка, так как она включала только участников, готовых предоставить данные о своем поведении в сети (N = 1200 на исходном этапе). Исследования были одобрены Институциональным наблюдательным советом Университета штата Огайо (протоколы №2020B0359 и №2018B0544). Участники предоставили письменное информированное согласие через опрос для обоих исследований.&lt;/p&gt;\n&lt;h4 id=\"obuedinenie-panelnyh-dannyh-i-dannyh-o-povedenii\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#obuedinenie-panelnyh-dannyh-i-dannyh-o-povedenii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Объединение панельных данных и данных о поведении&lt;/span&gt;&lt;/a&gt;Объединение панельных данных и данных о поведении&lt;/h4&gt;\n&lt;p&gt;Мы заключили контракт с YouGov на сбор двух независимых наборов данных, каждый из которых состоит из многоволнового панельного исследования, объединенного с поведенческими данными. Первое исследование проводилось во время выборов в США в 2020 году и состояло из 5 волн сбора данных, проводимых раз в две недели в период до дня выборов. Второе исследование было посвящено COVID-19 и состояло из 7 волн, данные для которых собирались ежемесячно, начиная с декабря 2020 года.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-tip\" note-type=\"tip\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пояснение&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;a href=\"concepts/panelnoe-issledovanie.html\"&gt;Панельное исследование&lt;/a&gt; — это метод сбора данных, при котором одни и те же участники опрактически одни и те же респонденты опрактически одни и те же респонденты опрашиваются несколько раз через определенные промежутки времени.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Мы использовали данные об активности в социальных сетях для выявления нескольких резонансных правдивых и ложных утверждений, относящихся к каждой области, составили ряд утверждений на основе этих историй и попросили респондентов оценить их достоверность. Мы использовали эти батареи тестов для оценки достоверности, чтобы создать показатель способности участников различать правдивую и ложную информацию с помощью теории обнаружения сигнала (SDT). В SDT чувствительность — это способность различать сигнал (в нашем случае — правдивые утверждения) и шум (ложные утверждения). Чувствительность варьируется от 0 (полная неверная классификация) до 1 (идеальная классификация), при этом 0,5 соответствует случайному угадыванию. Мы используем этот показатель для оценки восприимчивости участников к заблуждениям.&lt;/p&gt;\n&lt;p&gt;Компания YouGov также предоставила нам историю веб-браузинга и использования приложений участников, давших на это согласие, что обеспечило ненавязчивый способ фиксации использования социальных сетей участниками непосредственно перед каждой волной исследования. Мы использовали эти данные для создания нескольких показателей использования медиа для каждой из четырех платформ социальных сетей: Facebook, Twitter (как он назывался во время сбора данных), YouTube и Instagram.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f3.jpg\" alt=\"Связь между использованием социальных сетей и чувствительностью к убеждениям, связанным с COVID-19. Оценки плотности вер\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Связь между использованием социальных сетей и чувствительностью к убеждениям, связанным с COVID-19. Оценки плотности вероятности чувствительности к убеждениям во время пандемии COVID-19 в зависимости от использования социальных сетей. На панелях показаны децили уникальных часов за месяц в (A) Facebook, (B) Twitter, (C) YouTube и (D) Instagram в период сбора историй.&lt;/em&gt;&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f4.jpg\" alt=\"Оценочные эффекты использования социальных сетей на чувствительность к убеждениям с использованием данных панели по през\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Оценочные эффекты использования социальных сетей на чувствительность к убеждениям с использованием данных панели по президентским выборам в США 2020 года.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Оценочные эффекты использования социальных сетей на чувствительность к убеждениям с использованием данных панели по президентским выборам в США 2020 года. Точки представляют оценки коэффициентов из моделей внутри-межгрупповой регрессии (как описано в разделе «Материалы и методы»). Толстые линии представляют 95% доверительные интервалы. Тонкие линии представляют доверительные интервалы после поправки Бонферрони на множественное тестирование.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;p&gt;&lt;img src=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so-f5.jpg\" alt=\"Оценочные эффекты использования социальных сетей на чувствительность к убеждениям с использованием данных панели по COVI\" /&gt;&lt;/p&gt;\n&lt;p&gt;&lt;em&gt;Оценочные эффекты использования социальных сетей на чувствительность к убеждениям с использованием данных панели по COVID-19.&lt;/em&gt;&lt;/p&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Полное описание рисунка&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Оценочные эффекты использования социальных сетей на чувствительность к убеждениям с использованием данных панели по COVID-19. Точки представляют оценки коэффициентов из моделей внутри-межгрупповой регрессии (как описано в разделе «Материалы и методы»). Толстые линии представляют 95% доверительные интервалы. Тонкие линии представляют доверительные интервалы после поправки Бонферрони на множественное тестирование.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"shema-issledovaniya\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#shema-issledovaniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Схема исследования&lt;/span&gt;&lt;/a&gt;Схема исследования&lt;/h2&gt;\n&lt;p&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" viewBox=\"0 0 800 220\"&gt;&lt;rect width=\"170\" height=\"172\" x=\"12\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"28\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ВОПРОС&lt;/text&gt;&lt;text x=\"26\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Влияют ли&lt;/text&gt;&lt;text x=\"26\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;соцсети на&lt;/text&gt;&lt;text x=\"26\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;веру в фейки&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M188 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m200 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"212\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"228\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;МЕТОД&lt;/text&gt;&lt;text x=\"226\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Панельные&lt;/text&gt;&lt;text x=\"226\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;опросы и&lt;/text&gt;&lt;text x=\"226\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;трекинг&lt;/text&gt;&lt;text x=\"226\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;поведения&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M388 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m400 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"412\" y=\"24\" fill=\"#5B4FCF\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"428\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;РЕЗУЛЬТАТ&lt;/text&gt;&lt;text x=\"426\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Связь между&lt;/text&gt;&lt;text x=\"426\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;активностью и&lt;/text&gt;&lt;text x=\"426\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;верой слаба&lt;/text&gt;&lt;path stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"M588 110h18\"&gt;&lt;/path&gt;&lt;path fill=\"none\" stroke=\"#5B4FCF\" stroke-width=\"3\" d=\"m600 104 8 6-8 6\"&gt;&lt;/path&gt;&lt;rect width=\"170\" height=\"172\" x=\"612\" y=\"24\" fill=\"#8E85E8\" rx=\"16\"&gt;&lt;/rect&gt;&lt;text x=\"628\" y=\"54\" fill=\"#fff\" fill-opacity=\".8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1.5\"&gt;ЗАЧЕМ&lt;/text&gt;&lt;text x=\"626\" y=\"82\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;Соцсети не&lt;/text&gt;&lt;text x=\"626\" y=\"102\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;главная&lt;/text&gt;&lt;text x=\"626\" y=\"122\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;причина&lt;/text&gt;&lt;text x=\"626\" y=\"142\" fill=\"#fff\" font-size=\"15\" font-weight=\"600\"&gt;дезинформации&lt;/text&gt;&lt;/svg&gt;&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Статья опубликована в рецензируемом журнале PloS one. Но и опубликованный результат — одно исследование, а не окончательный вывод.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"istochnik\"&gt;&lt;a href=\"2026-10-04/the-limited-effects-of-social-media-use-on-misperceptions-so.html#istochnik\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источник&lt;/span&gt;&lt;/a&gt;Источник&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;strong&gt;Источник&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Категория&lt;/strong&gt;&lt;/th&gt;\n&lt;th&gt;&lt;strong&gt;Лицензия&lt;/strong&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;PloS one (Europe PMC)&lt;/td&gt;\n&lt;td&gt;bots&lt;/td&gt;\n&lt;td&gt;CC BY 4.0&lt;/td&gt;\
