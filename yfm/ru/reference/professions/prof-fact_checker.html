        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Профессии&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;проверяет утверждения, цитаты, фото и видео перед публикацией&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Чем занимается&lt;/td&gt;\n&lt;td&gt;проверяет утверждения, цитаты, фото и видео перед публикацией&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что нужно уметь&lt;/td&gt;\n&lt;td&gt;поиск источников, обратный поиск изображений, критическое мышление&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Образование&lt;/td&gt;\n&lt;td&gt;Журналистика, IT, библиотечное дело или аналитика; обучение через протоколы верификации и тренинги.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Где работают&lt;/td&gt;\n&lt;td&gt;Редакции СМИ, аналитические центры, научные проекты, государственные структуры мониторинга информации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chem-zanimaetsya\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#chem-zanimaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чем занимается&lt;/span&gt;&lt;/a&gt;Чем занимается&lt;/h2&gt;\n&lt;p&gt;Фактчекер — это специалист, который осуществляет верификацию фактической точности сообщений, заявлений и медиаконтента. Профессия является процессом критического анализа данных, направленным на выявление ошибок, манипуляций или недостоверной информации до момента её публикации. В отличие от автоматизированных систем, фактчекер применяет методологию проверки, сочетающую поиск первоисточников, анализ метаданных и логическую оценку содержания.&lt;/p&gt;\n&lt;h2 id=\"tipichnye-zadachi\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#tipichnye-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типичные задачи&lt;/span&gt;&lt;/a&gt;Типичные задачи&lt;/h2&gt;\n&lt;p&gt;Основная задача фактчекера — установление истинности утверждений. В ежедневную практику входят: поиск первичных источников информации, проведение обратного поиска изображений для установления их происхождения, проверка метаданных цифровых объектов и сверка данных с открытыми реестрами. Фактчекер анализирует логическую связность текстов, выявляет предвзятость в алгоритмических выборках (например, при подборе изображений нейросетями) и верифицирует инфографику, связывая визуальные элементы с исходными наборами данных.&lt;/p&gt;\n&lt;h2 id=\"navyki-i-instrumenty\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#navyki-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Навыки и инструменты&lt;/span&gt;&lt;/a&gt;Навыки и инструменты&lt;/h2&gt;\n&lt;p&gt;Работа базируется на принципах прозрачности и проверяемости. Ключевые навыки включают владение методами OSINT (разведка по открытым источникам), умение работать с цифровыми следами и понимание когнитивных искажений. Инструментарий включает поисковые системы, сервисы обратного поиска изображений, инструменты для анализа метаданных файлов и специализированные фреймворки для проверки данных, подобные InfoAgent. Важным навыком является умение отличать установленные научные факты от предварительных результатов исследований или сгенерированного ИИ контента, который может приводить к деградации информационных моделей.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#gde-uchitsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться&lt;/span&gt;&lt;/a&gt;Где учиться&lt;/h2&gt;\n&lt;p&gt;Профессиональная подготовка фактчекера строится на междисциплинарном подходе. Базовое образование обычно включает журналистику, библиотечное дело, информационные технологии или аналитические дисциплины. Обучение методам проверки фактов происходит через изучение протоколов верификации (например, Протокол Беркли), участие в профильных тренингах по цифровой безопасности и освоение инструментов анализа данных. Важной частью обучения является развитие критического мышления и навыков работы с научными публикациями.&lt;/p&gt;\n&lt;h2 id=\"gde-rabotayut-i-kak-rasti\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#gde-rabotayut-i-kak-rasti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают и как расти&lt;/span&gt;&lt;/a&gt;Где работают и как расти&lt;/h2&gt;\n&lt;p&gt;Фактчекеры востребованы в редакциях СМИ, научно-популярных проектах, аналитических центрах и государственных структурах, занимающихся мониторингом информации. Карьерный рост предполагает специализацию: от проверки общих новостей до анализа сложных научных данных, спутниковых снимков или сетевых структур. Профессиональное развитие связано с освоением новых инструментов автоматизации проверки, способных снижать влияние «галлюцинаций» нейросетей и повышать точность анализа больших массивов информации.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/professions/prof-fact_checker.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B0%D0%BA%D1%82%D1%87%D0%B5%D0%BA%D0%B8%D0%BD%D0%B3\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Фактчекинг — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/ijerph18158091\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;COVID-19 Misinformation Online and Health Literacy: A Brief Overview&lt;/a&gt; — обзор, Int J Environ Res Public Health 2021&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/1529100620946707\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Citizens Versus the Internet: Confronting Digital Challenges With Cognitive Tools&lt;/a&gt; — обзор, Psychol Sci Public Interest 2020&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1111/bjh.14757\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Serological weak D phenotypes: a review and guidance for interpreting the RhD blood type using the RHD genotype&lt;/a&gt; — обзор, Br J Haematol 2017&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Профессии&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"проверяет утверждения, цитаты, фото и видео перед публикацией"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Фактчекер","description":"проверяет утверждения, цитаты, фото и видео перед публикацией","vcsPath":"reference/professions/prof-fact_checker.md"},"headings":[{"title":"Чем занимается","href":"reference/professions/prof-fact_checker.html#chem-zanimaetsya","level":2},{"title":"Типичные задачи","href":"reference/professions/prof-fact_checker.html#tipichnye-zadachi","level":2},{"title":"Навыки и инструменты","href":"reference/professions/prof-fact_checker.html#navyki-i-instrumenty","level":2},{"title":"Где учиться","href":"reference/professions/prof-fact_checker.html#gde-uchitsya","level":2},{"title":"Где работают и как расти","href":"reference/professions/prof-fact_checker.html#gde-rabotayut-i-kak-rasti","level":2},{"title":"Источники","href":"reference/professions/prof-fact_checker.html#istochniki","level":2}],"title":"Фактчекер"},"router":{"pathname":"reference/professions/prof-fact_checker","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
