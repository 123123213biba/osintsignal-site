        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Профессии&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;ведёт расследование от наводки до проверенной публикации&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Чем занимается&lt;/td&gt;\n&lt;td&gt;ведёт расследование от наводки до проверенной публикации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что нужно уметь&lt;/td&gt;\n&lt;td&gt;источники, документы, юридическая проверка, безопасность&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Образование&lt;/td&gt;\n&lt;td&gt;Журналистика, социология, право, политология; курсы по анализу данных и кибербезопасности.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Где работают&lt;/td&gt;\n&lt;td&gt;Независимые медиа, исследовательские центры (think tanks), некоммерческие организации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt;, &lt;a href=\"concepts/spec-methods.html\"&gt;Методы и этика&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chem-zanimaetsya\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#chem-zanimaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чем занимается&lt;/span&gt;&lt;/a&gt;Чем занимается&lt;/h2&gt;\n&lt;p&gt;Журналист-расследователь — это специалист, который проводит планомерное и долговременное исследование общественно значимых тем, скрытых от публичного доступа. В отличие от новостной журналистики, расследование требует глубокой проверки фактов, работы с первичными документами и выявления системных закономерностей. Процесс расследования включает поиск данных, их верификацию, анализ связей и подготовку материала, который должен выдерживать юридическую проверку.&lt;/p&gt;\n&lt;h2 id=\"tipichnye-zadachi\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#tipichnye-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типичные задачи&lt;/span&gt;&lt;/a&gt;Типичные задачи&lt;/h2&gt;\n&lt;p&gt;Основная задача расследователя — превращение хаотичных данных в структурированную базу знаний. Это включает сбор информации из открытых реестров, анализ социальных сетей и сопоставление отчетов различных ведомств. Специалист выявляет несоответствия в официальных данных, например, когда из отчетов исчезают целые категории исследований или меняется статистика. В работе часто используются методы OSINT (разведка по открытым источникам) для поиска цифровых следов, проверки метаданных изображений и анализа цепочек поставок или финансовых потоков.&lt;/p&gt;\n&lt;h2 id=\"navyki-i-instrumenty\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#navyki-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Навыки и инструменты&lt;/span&gt;&lt;/a&gt;Навыки и инструменты&lt;/h2&gt;\n&lt;p&gt;Для работы требуются навыки критического анализа, владение методами фактчекинга и понимание принципов работы с данными. Инструменты включают специализированное ПО для анализа графов связей, алгоритмы обработки естественного языка для поиска скрытых параметров в больших массивах текста и инструменты для проверки подлинности цифровых объектов. Важным навыком является умение работать с «обвязкой» — специализированными каркасами, которые позволяют эффективно использовать нейросетевые модели для автоматизации рутинных задач, таких как классификация логов или поиск аномалий в трафике.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#gde-uchitsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться&lt;/span&gt;&lt;/a&gt;Где учиться&lt;/h2&gt;\n&lt;p&gt;Профессия требует сочетания академической подготовки в области гуманитарных наук или права с техническими навыками анализа данных. Базовое образование обычно включает журналистику, социологию или политологию. Дополнительно специалисты осваивают методы работы с открытыми данными, статистический анализ и основы кибербезопасности. Обучение часто проходит через участие в профессиональных сообществах и практику в редакциях, специализирующихся на расследовательской журналистике.&lt;/p&gt;\n&lt;h2 id=\"gde-rabotayut-i-kak-rasti\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#gde-rabotayut-i-kak-rasti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают и как расти&lt;/span&gt;&lt;/a&gt;Где работают и как расти&lt;/h2&gt;\n&lt;p&gt;Расследователи работают в независимых медиа, исследовательских центрах (think tanks) и некоммерческих организациях, занимающихся мониторингом деятельности корпораций и государственных институтов. Карьерный рост предполагает переход от выполнения отдельных задач к управлению сложными проектами, требующими координации работы юристов, аналитиков данных и экспертов в предметных областях. Профессиональное развитие также связано с освоением новых методов верификации данных и адаптацией к изменениям в цифровой среде.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/professions/prof-investigative_journalist.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%96%D1%83%D1%80%D0%BD%D0%B0%D0%BB%D0%B8%D1%81%D1%82%D1%81%D0%BA%D0%B8%D0%B5_%D1%80%D0%B0%D1%81%D1%81%D0%BB%D0%B5%D0%B4%D0%BE%D0%B2%D0%B0%D0%BD%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Журналистские расследования — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/j.endeavour.2010.09.005\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Testing sex and gender in sports; reinventing, reimagining and reconstructing histories&lt;/a&gt; — обзор, Endeavour 2010&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1177/014107680509801110\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Research governance: where did it come from, what does it mean?&lt;/a&gt; — обзор, J R Soc Med 2005&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1007/s00436-024-08167-4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;A History of Malaria and Conflict&lt;/a&gt; — обзор, Parasitol Res 2024&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Профессии&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"ведёт расследование от наводки до проверенной публикации"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Журналист-расследователь","description":"ведёт расследование от наводки до проверенной публикации","vcsPath":"reference/professions/prof-investigative_journalist.md"},"headings":[{"title":"Чем занимается","href":"reference/professions/prof-investigative_journalist.html#chem-zanimaetsya","level":2},{"title":"Типичные задачи","href":"reference/professions/prof-investigative_journalist.html#tipichnye-zadachi","level":2},{"title":"Навыки и инструменты","href":"reference/professions/prof-investigative_journalist.html#navyki-i-instrumenty","level":2},{"title":"Где учиться","href":"reference/professions/prof-investigative_journalist.html#gde-uchitsya","level":2},{"title":"Где работают и как расти","href":"reference/professions/prof-investigative_journalist.html#gde-rabotayut-i-kak-rasti","level":2},{"title":"Источники","href":"reference/professions/prof-investigative_journalist.html#istochniki","level":2}],"title":"Журналист-расследователь"},"router":{"pathname":"reference/professions/prof-investiga
