        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Профессии&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;находит скоординированные кампании, ботов и путь нарративов&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/professions/prof-disinfo_researcher.jpg\" alt=\"Исследователь дезинформации\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Чем занимается&lt;/td&gt;\n&lt;td&gt;находит скоординированные кампании, ботов и путь нарративов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что нужно уметь&lt;/td&gt;\n&lt;td&gt;сетевой анализ, социальные медиа, статистика&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Образование&lt;/td&gt;\n&lt;td&gt;Социология, политология, компьютерные науки, прикладная математика.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Где работают&lt;/td&gt;\n&lt;td&gt;Академические институты, аналитические центры, IT-компании, фактчекинговые организации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chem-zanimaetsya\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#chem-zanimaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Чем занимается&lt;/span&gt;&lt;/a&gt;Чем занимается&lt;/h2&gt;\n&lt;p&gt;Исследователь дезинформации — это специалист, который анализирует распространение недостоверной информации и скоординированные кампании в цифровой среде. Профессия является видом аналитической деятельности, направленной на выявление закономерностей в потоках контента. Исследователь изучает, как формируются нарративы, как работают алгоритмы рекомендаций и какую роль в этом играют автоматизированные системы (боты) и поведение пользователей.&lt;/p&gt;\n&lt;h2 id=\"tipichnye-zadachi\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#tipichnye-zadachi\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Типичные задачи&lt;/span&gt;&lt;/a&gt;Типичные задачи&lt;/h2&gt;\n&lt;p&gt;Основная задача исследователя — проверка фактов и анализ сетевых структур. В ежедневную работу входит сбор данных из открытых источников (OSINT), выявление аномалий в статистике распространения контента и оценка влияния алгоритмов на восприятие реальности. Исследователи изучают «пузыри фильтров», анализируя, как пользователи ограничивают свое внимание кругом подписок, и проверяют, насколько реальное влияние соцсетей на искажение фактов соответствует общественным опасениям. Также в задачи входит тестирование нейросетей на склонность к «поддакиванию» или генерации ошибочных решений, скрытых за верными ответами.&lt;/p&gt;\n&lt;h2 id=\"navyki-i-instrumenty\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#navyki-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Навыки и инструменты&lt;/span&gt;&lt;/a&gt;Навыки и инструменты&lt;/h2&gt;\n&lt;p&gt;Для работы требуются навыки сетевого анализа, владение методами статистики и понимание принципов работы больших языковых моделей. Инструментарий включает специализированное ПО для визуализации графов, инструменты для парсинга данных из социальных сетей и методы проверки цифровых следов. Важным навыком является критическое мышление, позволяющее отличать случайные закономерности от скоординированных действий. Исследователи используют бенчмарки (например, FIGS) для оценки честности и эмпатичности моделей ИИ.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#gde-uchitsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться&lt;/span&gt;&lt;/a&gt;Где учиться&lt;/h2&gt;\n&lt;p&gt;Профессия требует междисциплинарной подготовки. Базовое образование обычно включает социологию, политологию, компьютерные науки или прикладную математику. Специализированные навыки приобретаются через изучение методов анализа данных, курсы по OSINT и участие в исследовательских проектах. Важную роль играет академическая среда, где изучаются международные отношения и информационные процессы, как, например, в НИУ ВШЭ.&lt;/p&gt;\n&lt;h2 id=\"gde-rabotayut-i-kak-rasti\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#gde-rabotayut-i-kak-rasti\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают и как расти&lt;/span&gt;&lt;/a&gt;Где работают и как расти&lt;/h2&gt;\n&lt;p&gt;Исследователи дезинформации работают в академических институтах, аналитических центрах (мозговых центрах), технологических компаниях и независимых фактчекинговых организациях. Карьерный рост предполагает переход от сбора данных и технического анализа к разработке методологий оценки информационных угроз и консультированию по вопросам информационной безопасности. Профессионалы часто становятся экспертами в области международных отношений и медиа, участвуя в работе советов и дискуссионных клубов.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/professions/prof-disinfo_researcher.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9B%D1%83%D0%BA%D1%8C%D1%8F%D0%BD%D0%BE%D0%B2%2C_%D0%A4%D1%91%D0%B4%D0%BE%D1%80_%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80%D0%BE%D0%B2%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Лукьянов, Фёдор Александрович — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Fyodor_Lukyanov_2019.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: council.gov.ru, CC BY 4.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/professions.html\"&gt;Профессии&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"находит скоординированные кампании, ботов и путь нарративов"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Исследователь дезинформации","description":"находит скоординированные кампании, ботов и путь нарративов","vcsPath":"reference/professions/prof-disinfo_researcher.md"},"headings":[{"title":"Чем занимается","href":"reference/professions/prof-disinfo_researcher.html#chem-zanimaetsya","level":2},{"title":"Типичные задачи","href":"reference/professions/prof-disinfo_researcher.html#tipichnye-zadachi","level":2},{"title":"Навыки и инструменты","href":"reference/professions/prof-disinfo_researcher.html#navyki-i-instrumenty","level":2},{"title":"Где учиться","href":"reference/professions/prof-disinfo_researcher.html#gde-uchitsya","level":2},{"title":"Где работают и как расти","href":"reference/professions/prof-disinfo_researcher.html#gde-rabotayut-i-kak-rasti","level":2},{"title":"Источники","href":"reference/professions/prof-disinfo_researcher.html#istochniki","level":2}],"title":"Исследователь дезинформации"},"router":{"pathname":"reference/professions/prof-disinfo_researcher","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
