        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кейсы: инструменты и методы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Метод аудита нейросетей, при котором решение принимается только в том случае, если модель выбирает один и тот же вариант при смене порядка кандидатов.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/cases/case-agreement-gate.jpg\" alt=\"Фильтр согласованности\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Инструмент&lt;/td&gt;\n&lt;td&gt;Сәйкестік сүзгісі (consistency filter)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Задача&lt;/td&gt;\n&lt;td&gt;Нейрондық желілердегі таңдау бейтараптығын тексеру&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Данные&lt;/td&gt;\n&lt;td&gt;Кіріс деректер жиынындағы кандидаттардың реттілігі&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Результат&lt;/td&gt;\n&lt;td&gt;Таңдаудың реттілікке тәуелді еместігін растау&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/agreement-gate.html\"&gt;Фильтр согласованности&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"zadacha\"&gt;&lt;a href=\"reference/cases/case-agreement-gate.html#zadacha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Задача&lt;/span&gt;&lt;/a&gt;Задача&lt;/h2&gt;\n&lt;p&gt;Нейросетевые модели часто демонстрируют предвзятость при выборе из нескольких вариантов. Исследования показывают, что алгоритмы склонны отдавать предпочтение объектам, расположенным в начале списка, независимо от их фактического качества. Эта проблема искажает результаты автоматизированного анализа и требует методов верификации, позволяющих отделить объективные характеристики данных от артефактов алгоритмической обработки.&lt;/p&gt;\n&lt;h2 id=\"instrument-ili-metod\"&gt;&lt;a href=\"reference/cases/case-agreement-gate.html#instrument-ili-metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструмент или метод&lt;/span&gt;&lt;/a&gt;Инструмент или метод&lt;/h2&gt;\n&lt;p&gt;Фильтр согласованности (consistency filter) — это метод аудита нейросетей, при котором решение модели считается валидным только в том случае, если она выбирает один и тот же вариант при изменении порядка следования кандидатов во входном наборе данных. Метод является процессом, который разворачивается во времени: он требует многократного обращения к модели с перестановками входных элементов для проверки устойчивости результата.&lt;/p&gt;\n&lt;h2 id=\"kak-primenili\"&gt;&lt;a href=\"reference/cases/case-agreement-gate.html#kak-primenili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как применили&lt;/span&gt;&lt;/a&gt;Как применили&lt;/h2&gt;\n&lt;p&gt;В исследовании «Судья в машине» метод применялся для оценки качества выбора изображений нейросетью. Исследователи подавали на вход модели один и тот же набор изображений, но меняли их последовательность. Если модель выбирала разные изображения при смене их позиции в списке, результат помечался как подверженный предвзятости. Фильтр согласованности позволил выявить, что выбор нейросети часто определяется не визуальными характеристиками контента, а его порядковым номером в очереди на обработку.&lt;/p&gt;\n&lt;h2 id=\"chto-poluchilos\"&gt;&lt;a href=\"reference/cases/case-agreement-gate.html#chto-poluchilos\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что получилось&lt;/span&gt;&lt;/a&gt;Что получилось&lt;/h2&gt;\n&lt;p&gt;Применение фильтра показало, что нейросети демонстрируют значительную чувствительность к порядку подачи данных. В случаях, когда модель выбирала разные варианты при перестановке, доверие к первичному результату снижалось. Метод позволил количественно оценить степень предвзятости алгоритма, выделив те решения, которые остаются неизменными независимо от внешних манипуляций с порядком кандидатов.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya\"&gt;&lt;a href=\"reference/cases/case-agreement-gate.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;p&gt;Метод требует увеличения вычислительных затрат, так как для проверки одного решения необходимо выполнить несколько прогонов модели с разными перестановками. Фильтр согласованности не исправляет саму нейросеть, а лишь выявляет нестабильность её работы. Он не гарантирует правильность выбора, а лишь подтверждает его устойчивость к изменению порядка входных данных.&lt;/p&gt;\n&lt;h2 id=\"kak-povtorit\"&gt;&lt;a href=\"reference/cases/case-agreement-gate.html#kak-povtorit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как повторить&lt;/span&gt;&lt;/a&gt;Как повторить&lt;/h2&gt;\n&lt;p&gt;Для реализации метода необходимо подготовить набор данных, содержащий варианты для выбора. Затем требуется программно реализовать функцию перестановки (shuffle) элементов во входном массиве. Последовательно подавая переставленные наборы в нейросеть, необходимо сравнить полученные ответы. Если ответы модели совпадают во всех итерациях, результат считается прошедшим фильтр согласованности.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/cases/case-agreement-gate.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A4%D0%B8%D0%BB%D1%8C%D1%82%D1%80_%D0%BF%D1%80%D0%B8%D1%81%D0%BE%D0%B5%D0%B4%D0%B8%D0%BD%D0%B5%D0%BD%D0%B8%D1%8F\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Фильтр присоединения — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:Line_Matching_Unit.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Maxlu86, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Кейсы: инструменты и методы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Метод аудита нейросетей, при котором решение принимается только в том случае, если модель выбирает один и тот же вариант при смене порядка кандидатов."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Фильтр согласованности","description":"Метод аудита нейросетей, при котором решение принимается только в том случае, если модель выбирает один и тот же вариант при смене порядка кандидатов.","vcsPath":"reference/cases/case-agreement-gate.md"},"headings":[{"title":"Задача","href":"reference/cases/case-agreement-gate.html#zadacha","level":2},{"title":"Инструмент или метод","href":"reference/cases/case-agreement-gate.html#instrument-ili-metod","level":2},{"title":"Как применили","href":"reference/cases/case-agreement-gate.html#kak-primenili","level":2},{"title":"Что получилось","href":"reference/cases/case-agreement-gate.html#chto-poluchilos","level":2},{"title":"Ограничения","href":"reference/cases/case-agreement-gate.html#ogranicheniya","level":2},{"title":"Как повторить","href":"reference/cases/case-agreement-gate.html#kak-povtorit","level":2},{"title":"Источники","href":"reference/cases/case-agreement-gate.html#istochniki","level":2}],"title":"Фильтр согласованности"},"router":{"pathname":"reference/cases/case-agreement-gate","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
