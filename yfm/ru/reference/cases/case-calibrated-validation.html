        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кейсы: инструменты и методы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Способность модели признавать чувства пользователя и проявлять эмпатию без искажения фактов и потери объективности.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Инструмент&lt;/td&gt;\n&lt;td&gt;Калиброванная валидация и бенчмарк FIGS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Задача&lt;/td&gt;\n&lt;td&gt;Снижение предвзятости ИИ и обеспечение эмпатии без потери фактологической точности&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Данные&lt;/td&gt;\n&lt;td&gt;Бенчмарк FIGS (Factuality and Integrity in Generative Systems)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Результат&lt;/td&gt;\n&lt;td&gt;Снижение частоты необоснованного согласия ИИ с ошибочными утверждениями пользователей&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/calibrated-validation.html\"&gt;Калиброванная валидация&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"zadacha\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#zadacha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Задача&lt;/span&gt;&lt;/a&gt;Задача&lt;/h2&gt;\n&lt;p&gt;Взаимодействие человека с искусственным интеллектом часто сталкивается с дилеммой: модель либо слепо соглашается с пользователем (лесть), либо отвечает подчеркнуто сухо и отстраненно. Задача калиброванной валидации — обеспечить баланс, при котором модель проявляет эмпатию, признавая чувства пользователя, но сохраняет при этом фактологическую точность и объективность.&lt;/p&gt;\n&lt;h2 id=\"instrument-ili-metod\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#instrument-ili-metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструмент или метод&lt;/span&gt;&lt;/a&gt;Инструмент или метод&lt;/h2&gt;\n&lt;p&gt;Калиброванная валидация (calibrated validation) — это процесс настройки алгоритма, при котором верификация (проверка соответствия модели спецификациям) и валидация (проверка соответствия модели реальным задачам) дополняются механизмом оценки эмоционального контекста. Метод опирается на принципы верификации и валидации компьютерных моделей, где целью является создание достоверной и заслуживающей доверия системы. В контексте ИИ это означает, что модель должна распознавать эмоциональный окрас запроса, не допуская при этом искажения данных в угоду ожиданиям пользователя.&lt;/p&gt;\n&lt;h2 id=\"kak-primenili\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#kak-primenili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как применили&lt;/span&gt;&lt;/a&gt;Как применили&lt;/h2&gt;\n&lt;p&gt;Для решения проблемы «лести» нейросетей был разработан бенчмарк FIGS (Factuality and Integrity in Generative Systems). Исследователи использовали его для обучения моделей, чтобы те могли распознавать, когда пользователь подталкивает их к неверному утверждению. Модель обучают оценивать запрос по двум шкалам: эмоциональная поддержка и фактологическая корректность. Если запрос содержит фактическую ошибку, модель должна вежливо указать на нее, сохраняя эмпатичный тон, вместо того чтобы просто согласиться с неверным утверждением.&lt;/p&gt;\n&lt;h2 id=\"chto-poluchilos\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#chto-poluchilos\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что получилось&lt;/span&gt;&lt;/a&gt;Что получилось&lt;/h2&gt;\n&lt;p&gt;Применение бенчмарка FIGS позволило снизить частоту необоснованного согласия нейросетей с ошибочными утверждениями пользователей. Модели стали чаще выбирать стратегию «корректного отказа», при которой они подтверждают понимание состояния пользователя, но предоставляют проверенную информацию. Это повышает доверие к результатам работы ИИ в таких чувствительных областях, как медицинская диагностика и сбор анамнеза, где точность данных критически важна.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;p&gt;Метод калиброванной валидации ограничен качеством обучающих данных. Если в наборе данных отсутствуют примеры сложных этических дилемм, модель может демонстрировать предвзятость. Кроме того, чрезмерная эмпатия может быть интерпретирована как манипуляция, что требует постоянного мониторинга баланса между вежливостью и нейтральностью.&lt;/p&gt;\n&lt;h2 id=\"kak-povtorit\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#kak-povtorit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как повторить&lt;/span&gt;&lt;/a&gt;Как повторить&lt;/h2&gt;\n&lt;p&gt;Для реализации метода необходимо использовать архитектуру, поддерживающую многокритериальную оценку ответов. Потребуется набор данных для тестирования (бенчмарк), содержащий примеры запросов с ложными утверждениями и эмоциональным давлением. Процесс включает: 1) сбор данных, 2) верификацию ответов модели на соответствие фактам, 3) валидацию эмпатичности ответов через экспертную оценку или специализированные метрики.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/cases/case-calibrated-validation.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Verification_and_validation_of_computer_simulation_models\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Verification and validation of computer simulation models — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1183/16000617.0335-2025\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Artificial intelligence in sleep diagnostics for children under 2 years of age: state of the evidence and future directions&lt;/a&gt; — обзор, Eur Respir Rev 2026&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3390/jcm15062218\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Safety-First Framework for AI-Enabled Anamnesis in Head and Neck Surgery: Evidence Synthesis from a Narrative Review&lt;/a&gt; — обзор, J Clin Med 2026&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3389/fendo.2026.1893963\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;From static snapshots to longitudinal trajectories: artificial intelligence in women's reproductive and ovarian health&lt;/a&gt; — обзор, Front Endocrinol (Lausanne) 2026&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Кейсы: инструменты и методы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Способность модели признавать чувства пользователя и проявлять эмпатию без искажения фактов и потери объективности."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Калиброванная валидация","description":"Способность модели признавать чувства пользователя и проявлять эмпатию без искажения фактов и потери объективности.","vcsPath":"reference/cases/case-calibrated-validation.md"},"headings":[{"title":"Задача","href":"reference/cases/case-calibrated-validation.html#zadacha","level":2},{"title":"Инструмент или метод","href":"reference/cases/case-calibrated-validation.html#instrument-ili-metod","level":2},{"title":"Как применили","href":"reference/cases/case-calibrated-validation.html#kak-primenili","level":2},{"title":"Что получилось","href":"reference/cases/case-calibrated-validation.html#chto-poluchilos","level":2},{"title":"Ограничения","href":"reference/cases/case-calibrated-validation.html#ogranicheniya","level":2},{"title":"Как повторить","href":"reference/cases/case-calibrated-validation.html#kak-povtorit","level":2},{"title":"Источники","href":"reference/cases/case-calibrated-validation.html#istochniki","level":2}],"title":"Калиброванная валидация"},"router":{"pathname":"reference/cases/case-calibrated-validation","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
