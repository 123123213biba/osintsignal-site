        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Кейсы: инструменты и методы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Вспомогательный блок визуального контроля в COBICount, преобразующий внутренние признаки сети в каналы классов без влияния на расчет плотности.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Инструмент&lt;/td&gt;\n&lt;td&gt;Модуль Audit (вспомогательный блок визуального контроля в COBICount)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Задача&lt;/td&gt;\n&lt;td&gt;Подсчет объектов на спутниковых снимках без дообучения нейросети&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Данные&lt;/td&gt;\n&lt;td&gt;Спутниковые снимки новых регионов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Результат&lt;/td&gt;\n&lt;td&gt;Визуализация логики нейросети и повышение прозрачности подсчета объектов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/audit-module.html\"&gt;модуль Audit&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"zadacha\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#zadacha\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Задача&lt;/span&gt;&lt;/a&gt;Задача&lt;/h2&gt;\n&lt;p&gt;При анализе спутниковых снимков с помощью нейросетей часто возникает проблема адаптации модели к новым регионам. Традиционные методы требуют дообучения нейросети на размеченных данных конкретной местности, что является ресурсоемким процессом. Основная задача состоит в том, чтобы обеспечить точный подсчет объектов (например, кораблей или зданий) без изменения весов модели, используя существующие признаки сети.&lt;/p&gt;\n&lt;h2 id=\"instrument-ili-metod\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#instrument-ili-metod\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструмент или метод&lt;/span&gt;&lt;/a&gt;Инструмент или метод&lt;/h2&gt;\n&lt;p&gt;Модуль Audit — это вспомогательный блок визуального контроля в системе COBICount, который является информационной сущностью. Он преобразует внутренние признаки нейронной сети в каналы классов. Метод основан на извлечении промежуточных представлений данных, которые нейросеть формирует в процессе обработки изображения, и их интерпретации для классификации объектов. Важной особенностью модуля является то, что он не влияет на основной расчет плотности объектов, выполняя лишь функцию визуальной верификации.&lt;/p&gt;\n&lt;h2 id=\"kak-primenili\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#kak-primenili\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как применили&lt;/span&gt;&lt;/a&gt;Как применили&lt;/h2&gt;\n&lt;p&gt;В исследовании по подсчету объектов на спутниковых снимках модуль Audit применялся для визуального контроля того, какие области изображения активируют нейросеть при поиске целевых объектов. Исследователи использовали предобученную модель, подавая на вход снимки новых регионов. Модуль Audit выделял области, соответствующие определенным классам объектов, позволяя аналитикам сопоставить предсказания модели с реальными объектами на снимке без необходимости переобучения.&lt;/p&gt;\n&lt;h2 id=\"chto-poluchilos\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#chto-poluchilos\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что получилось&lt;/span&gt;&lt;/a&gt;Что получилось&lt;/h2&gt;\n&lt;p&gt;Использование модуля Audit позволило визуализировать логику принятия решений нейросетью. Это дало возможность подтвердить, что модель корректно распознает объекты в новых условиях, опираясь на общие признаки, а не на специфические особенности обучающей выборки. Результатом стало повышение прозрачности работы алгоритма и возможность быстрой оценки качества подсчета в регионах, которые ранее не были представлены в обучающем наборе данных.&lt;/p&gt;\n&lt;h2 id=\"ogranicheniya\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#ogranicheniya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ограничения&lt;/span&gt;&lt;/a&gt;Ограничения&lt;/h2&gt;\n&lt;p&gt;Модуль Audit является инструментом визуализации и не исправляет ошибки самой нейросети. Если модель изначально не способна выделить признаки целевого объекта, модуль не сможет сгенерировать корректные каналы классов. Метод ограничен качеством входных спутниковых снимков и архитектурой базовой нейросети.&lt;/p&gt;\n&lt;h2 id=\"kak-povtorit\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#kak-povtorit\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как повторить&lt;/span&gt;&lt;/a&gt;Как повторить&lt;/h2&gt;\n&lt;p&gt;Для воспроизведения метода необходимо иметь доступ к системе COBICount и набору спутниковых данных. Потребуется развернуть предобученную модель, интегрировать модуль Audit для обработки промежуточных слоев сети и настроить визуализацию каналов классов. Для проверки результатов рекомендуется использовать независимый набор размеченных снимков (Ground Truth) для сравнения с предсказаниями, полученными через модуль Audit.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/cases/case-audit-module.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%98%D1%81%D0%BF%D0%BE%D0%BB%D0%BD%D1%8F%D0%B5%D0%BC%D1%8B%D0%B9_%D1%84%D0%B0%D0%B9%D0%BB\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Исполняемый файл — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/intqhc/7.4.343\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Involving clients in clinical audits of mental health services&lt;/a&gt; — обзор, Int J Qual Health Care 1995&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s44168-026-00362-6\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Generative AI for climate governance and acceptability-constrained policy design&lt;/a&gt; — обзор, NPJ Clim Action 2026&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/cases.html\"&gt;Кейсы: инструменты и методы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Вспомогательный блок визуального контроля в COBICount, преобразующий внутренние признаки сети в каналы классов без влияния на расчет плотности."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"модуль Audit","description":"Вспомогательный блок визуального контроля в COBICount, преобразующий внутренние признаки сети в каналы классов без влияния на расчет плотности.","vcsPath":"reference/cases/case-audit-module.md"},"headings":[{"title":"Задача","href":"reference/cases/case-audit-module.html#zadacha","level":2},{"title":"Инструмент или метод","href":"reference/cases/case-audit-module.html#instrument-ili-metod","level":2},{"title":"Как применили","href":"reference/cases/case-audit-module.html#kak-primenili","level":2},{"title":"Что получилось","href":"reference/cases/case-audit-module.html#chto-poluchilos","level":2},{"title":"Ограничения","href":"reference/cases/case-audit-module.html#ogranicheniya","level":2},{"title":"Как повторить","href":"reference/cases/case-audit-module.html#kak-povtorit","level":2},{"title":"Источники","href":"reference/cases/case-audit-module.html#istochniki","level":2}],"title":"модуль Audit"},"router":{"pathname":"reference/cases/case-audit-module","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
