        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;дистанционное зондирование Земли&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;дистанционное зондирование Земли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;IEEE Geoscience and Remote Sensing Society (GRSS)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Ежегодно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Международная научная конференция с рецензируемыми тезисами&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;Официальный портал IEEE GRSS&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-geo.html\"&gt;Спутники и геоданные&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;IEEE IGARSS (International Geoscience and Remote Sensing Symposium) — это ежегодная международная научная конференция, посвященная методам дистанционного зондирования Земли и наукам о геосферах. Конференция является процессом обмена знаниями между исследователями, инженерами и специалистами по анализу данных. Она служит площадкой для обсуждения физических основ взаимодействия электромагнитного излучения с объектами на поверхности планеты и методов обработки полученных сигналов.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Организатором выступает IEEE Geoscience and Remote Sensing Society (GRSS) — профессиональное сообщество, объединяющее экспертов в области геофизики и дистанционного зондирования. Конференция проводится ежегодно с 1981 года, собирая тысячи участников со всего мира. Мероприятие опирается на фундаментальные принципы физики атмосферы и радиофизики, заложенные в том числе работами советских и российских ученых, таких как Валерьян Ильич Татарский, чьи исследования распространения волн в турбулентной среде стали основой для современных методов обработки спутниковых данных.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Программа конференции охватывает широкий спектр направлений: от разработки аппаратного обеспечения спутников до алгоритмов машинного обучения. Ключевые секции включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Методы обработки изображений: алгоритмы сегментации и классификации объектов на спутниковых снимках.&lt;/li&gt;\n&lt;li&gt;Искусственный интеллект в геоданных: использование нейросетей для создания цифровых двойников городов и автоматического распознавания объектов без дообучения моделей.&lt;/li&gt;\n&lt;li&gt;Физика дистанционного зондирования: моделирование взаимодействия сигналов с земной поверхностью.&lt;/li&gt;\n&lt;li&gt;Мониторинг окружающей среды: анализ климатических изменений и состояния природных ресурсов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На IEEE IGARSS впервые представляются результаты исследований, которые меняют подход к работе с данными. Например, здесь обсуждаются методы, позволяющие нейросетям распознавать корабли или здания в новых регионах без необходимости переобучения под каждый конкретный снимок. Также демонстрируются концепции ИИ-агентов, способных проектировать изменения в городской среде на основе анализа фотоснимков, что заменяет дорогостоящие полевые симуляции.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Участие в конференции предполагает публикацию тезисов (abstracts), которые проходят рецензирование. После конференции материалы докладов публикуются в цифровых библиотеках IEEE. Для тех, кто не участвует очно, доступны сборники тезисов и записи ключевых докладов. Следить за актуальными исследованиями можно через официальный портал IEEE GRSS, где публикуются анонсы будущих мероприятий и архивы прошлых лет.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-igarss.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A2%D0%B0%D1%82%D0%B0%D1%80%D1%81%D0%BA%D0%B8%D0%B9%2C_%D0%92%D0%B0%D0%BB%D0%B5%D1%80%D1%8C%D1%8F%D0%BD_%D0%98%D0%BB%D1%8C%D0%B8%D1%87\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Татарский, Валерьян Ильич — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"дистанционное зондирование Земли"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IEEE IGARSS","description":"дистанционное зондирование Земли","vcsPath":"reference/conferences/conf-igarss.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-igarss.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-igarss.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-igarss.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-igarss.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-igarss.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-igarss.html#istochniki","level":2}],"title":"IEEE IGARSS"},"router":{"pathname":"reference/conferences/conf-igarss","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
