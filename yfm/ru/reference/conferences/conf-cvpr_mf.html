        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;детекция подделок изображений и видео&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;детекция подделок изображений и видео&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;статьи CVF (открыты)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Организатор&lt;/td&gt;\n&lt;td&gt;IEEE/CVF (Computer Vision Foundation)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Периодичность&lt;/td&gt;\n&lt;td&gt;Ежегодно, в рамках конференции CVPR&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Формат&lt;/td&gt;\n&lt;td&gt;Научный воркшоп, презентации докладов, публикация тезисов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сайт&lt;/td&gt;\n&lt;td&gt;cvpr.thecvf.com&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;CVPR Workshop on Media Forensics — это специализированная научная площадка, являющаяся частью ежегодной конференции IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR). Данный воркшоп фокусируется на методах обнаружения манипуляций в визуальном контенте, включая детекцию подделок изображений и видео. Основная цель мероприятия — обмен результатами исследований в области верификации медиаданных, которые позволяют отличать аутентичные материалы от созданных или измененных с помощью алгоритмов машинного обучения.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Мероприятие проводится под эгидой CVPR — ведущей международной конференции по компьютерному зрению. Организаторами выступают эксперты из академических институтов и исследовательских лабораторий, специализирующиеся на безопасности медиа. История воркшопа неразрывно связана с развитием методов генерации контента: по мере усложнения нейросетевых моделей, способных создавать реалистичные изображения, научное сообщество сформировало отдельную секцию для обсуждения инструментов защиты и проверки фактов.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Основная тематика включает разработку алгоритмов для выявления следов редактирования, анализ метаданных цифровых объектов и создание наборов данных (датасетов) для обучения моделей-детекторов. Ключевые направления дискуссий:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Методы обнаружения глубоких подделок (deepfakes).&lt;/li&gt;\n&lt;li&gt;Анализ целостности цифровых доказательств.&lt;/li&gt;\n&lt;li&gt;Оценка предвзятости алгоритмов при выборе и классификации изображений.&lt;/li&gt;\n&lt;li&gt;Разработка стандартов для верификации визуальной информации.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На воркшопе представляются результаты исследований, которые впоследствии становятся основой для новых протоколов проверки фактов. Здесь демонстрируются методы, позволяющие автоматизировать поиск аномалий в медиафайлах. Участники представляют новые архитектуры нейросетей, способные выявлять «галлюцинации» или признаки деградации моделей, обученных на синтетических данных. Результаты исследований часто публикуются в открытом доступе через CVF (Computer Vision Foundation), что позволяет исследователям по всему миру использовать предложенные методы для анализа открытых данных.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Следить за материалами воркшопа можно через официальный архив CVF, где публикуются статьи и тезисы докладов. Участие предполагает подачу собственных научных работ в рамках установленных дедлайнов, прохождение процедуры рецензирования и последующее выступление с презентацией. Для тех, кто занимается проверкой фактов, воркшоп является источником актуальных методологий, которые можно применять для анализа цифровых объектов в рамках OSINT-расследований.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-cvpr_mf.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/List_of_datasets_in_computer_vision_and_image_processing\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;List of datasets in computer vision and image processing — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"детекция подделок изображений и видео"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"CVPR Workshop on Media Forensics","description":"детекция подделок изображений и видео","vcsPath":"reference/conferences/conf-cvpr_mf.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-cvpr_mf.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-cvpr_mf.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-cvpr_mf.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-cvpr_mf.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-cvpr_mf.html#kak-sledit-i-uchastvovat","level":2},{"title":"Источники","href":"reference/conferences/conf-cvpr_mf.html#istochniki","level":2}],"title":"CVPR Workshop on Media Forensics"},"router":{"pathname":"reference/conferences/conf-cvpr_mf","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
