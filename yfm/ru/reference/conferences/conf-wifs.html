        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Конференции&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;информационная криминалистика: проверка изображений и медиа&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;информационная криминалистика: проверка изображений и медиа&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Что берём&lt;/td&gt;\n&lt;td&gt;аннотации&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-eto-za-konferenciya\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#chto-eto-za-konferenciya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что это за конференция&lt;/span&gt;&lt;/a&gt;Что это за конференция&lt;/h2&gt;\n&lt;p&gt;IEEE WIFS (Workshop on Information Forensics and Security) — это ежегодная международная научная конференция, посвященная вопросам информационной безопасности и цифровой криминалистики. Основная цель мероприятия — объединить исследователей, работающих на стыке обработки сигналов, машинного обучения и защиты данных. В контексте ОСИНТ-Сигнал WIFS является ключевым источником методов для верификации медиаконтента: от обнаружения манипуляций на изображениях до анализа подлинности видеозаписей.&lt;/p&gt;\n&lt;h2 id=\"organizatory-i-istoriya\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#organizatory-i-istoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Организаторы и история&lt;/span&gt;&lt;/a&gt;Организаторы и история&lt;/h2&gt;\n&lt;p&gt;Конференция проводится под эгидой IEEE (Institute of Electrical and Electronics Engineers), крупнейшей в мире профессиональной ассоциации технических специалистов. WIFS курируется техническим комитетом IEEE Information Forensics and Security (IFS-TC). История конференции насчитывает более десяти лет, в течение которых она стала главной площадкой для обсуждения того, как отличить реальные данные от сгенерированных или искаженных.&lt;/p&gt;\n&lt;h2 id=\"temy-i-sekcii\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#temy-i-sekcii\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Темы и секции&lt;/span&gt;&lt;/a&gt;Темы и секции&lt;/h2&gt;\n&lt;p&gt;Основные направления работы WIFS включают:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Цифровая криминалистика: выявление следов редактирования, анализ метаданных и определение источника медиафайла.&lt;/li&gt;\n&lt;li&gt;Безопасность машинного обучения: защита моделей от состязательных атак и предотвращение деградации нейросетей при обучении на синтетических данных.&lt;/li&gt;\n&lt;li&gt;Стеганография и скрытая передача данных: методы обнаружения скрытых сообщений в медиаконтенте.&lt;/li&gt;\n&lt;li&gt;Биометрия и защита приватности: методы идентификации личности с учетом требований безопасности.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"chto-tam-poyavlyaetsya\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#chto-tam-poyavlyaetsya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что там появляется&lt;/span&gt;&lt;/a&gt;Что там появляется&lt;/h2&gt;\n&lt;p&gt;На WIFS представляются исследования, которые ложатся в основу инструментов для проверки фактов. Например, здесь обсуждаются методы борьбы с «галлюцинациями» ИИ, когда каждый элемент инфографики должен быть верифицирован через реальные данные. Также рассматриваются алгоритмы для работы с 3D-моделями и сканами помещений, где важно отличать реальные физические объекты от сгенерированных ИИ-агентами. Важной темой является проблема «отравления» обучающих выборок: исследователи доказывают, что использование ИИ-контента для обучения новых моделей ведет к их деградации, что делает методы WIFS критически важными для поддержания качества данных.&lt;/p&gt;\n&lt;h2 id=\"kak-sledit-i-uchastvovat\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#kak-sledit-i-uchastvovat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить и участвовать&lt;/span&gt;&lt;/a&gt;Как следить и участвовать&lt;/h2&gt;\n&lt;p&gt;Для исследователей и аналитиков участие в WIFS — это способ получить доступ к передовым алгоритмам до того, как они станут массовыми инструментами. Следить за результатами можно через публикацию материалов в библиотеке IEEE Xplore. Участники часто представляют не только теоретические выкладки, но и программные реализации, которые в дальнейшем могут быть использованы для разработки систем автоматизированной проверки медиа.&lt;/p&gt;\n&lt;h2 id=\"teoriya\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#teoriya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Теория&lt;/span&gt;&lt;/a&gt;Теория&lt;/h2&gt;\n&lt;p&gt;В основе WIFS лежит принцип «информационной криминалистики». Это область, где математические методы обработки сигналов применяются для поиска аномалий. Ключевым понятием является точность представления данных. Например, использование форматов с пониженной точностью (half-precision, 16 бит) в нейросетях позволяет ускорить обработку изображений, но требует строгих методов контроля, чтобы не допустить потери важных для криминалистического анализа деталей. WIFS связывает эти технические аспекты с практикой проверки фактов: если мы понимаем, как нейросеть «видит» и обрабатывает данные, мы можем вычислить момент, когда она начинает искажать реальность.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/conferences/conf-wifs.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://en.wikipedia.org/wiki/Half-precision_floating-point_format\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Half-precision floating-point format — Википедия (en)&lt;/a&gt;&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/conferences.html\"&gt;Конференции&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"информационная криминалистика: проверка изображений и медиа"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"IEEE WIFS","description":"информационная криминалистика: проверка изображений и медиа","vcsPath":"reference/conferences/conf-wifs.md"},"headings":[{"title":"Что это за конференция","href":"reference/conferences/conf-wifs.html#chto-eto-za-konferenciya","level":2},{"title":"Организаторы и история","href":"reference/conferences/conf-wifs.html#organizatory-i-istoriya","level":2},{"title":"Темы и секции","href":"reference/conferences/conf-wifs.html#temy-i-sekcii","level":2},{"title":"Что там появляется","href":"reference/conferences/conf-wifs.html#chto-tam-poyavlyaetsya","level":2},{"title":"Как следить и участвовать","href":"reference/conferences/conf-wifs.html#kak-sledit-i-uchastvovat","level":2},{"title":"Теория","href":"reference/conferences/conf-wifs.html#teoriya","level":2},{"title":"Источники","href":"reference/conferences/conf-wifs.html#istochniki","level":2}],"title":"IEEE WIFS"},"router":{"pathname":"reference/conferences/conf-wifs","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
