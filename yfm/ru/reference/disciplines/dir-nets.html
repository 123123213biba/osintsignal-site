        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-nets.jpg\" alt=\"Информационные кампании и сети\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Анализ информационных кампаний и сетевых структур&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;Междисциплинарное направление (социология, Data Science)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;Сетевой анализ, OSINT, контент-анализ, аудит алгоритмов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Computer Science, Sociology, Media Studies&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;Информационные кампании и сети — это научное направление, изучающее процессы создания, распространения и влияния нарративов в цифровой среде. Предметом изучения являются механизмы, с помощью которых группы акторов координируют свои действия для формирования общественного мнения или изменения восприятия реальности.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Исторически информационные кампании опирались на государственные меры и печатную пропаганду, как в случае с антиалкогольными кампаниями в СССР, где использовались плакаты (например, «Книга вместо водки», 1929 год, тираж 40 000 экз.). В цифровую эпоху фокус сместился на социальные сети. Исследования показывают, что влияние соцсетей на искажение реальности часто преувеличено. Важным открытием стало понимание «пузырей фильтров»: данные Bluesky подтверждают, что 80% внимания пользователей ограничено «двумя шагами» от их подписок, что ограничивает доступ к альтернативным точкам зрения.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;Современные подходы делятся на анализ контента и анализ сетевых структур. Исследователи изучают, как алгоритмы нейросетей могут непреднамеренно способствовать дезинформации. Например, выявлено, что нейросети могут выдавать верные ответы, опираясь на скрытые ошибочные данные, или демонстрировать «ловушку лести», поддакивая пользователю вместо предоставления объективной информации. Разработка бенчмарков, таких как FIGS, направлена на обучение моделей честности и эмпатии.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Методы включают сетевой анализ (анализ графов взаимодействий), контент-анализ больших данных и аудит алгоритмов. Исследователи используют методы проверки фактов (OSINT), чтобы отслеживать цепочки распространения информации. Важным аспектом является проверка цифровых объектов через метаданные и сверку с независимыми источниками, что позволяет выявлять скоординированное поведение без участия «главного архитектора» системы.&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;Направление тесно связано с теорией графов, психологией восприятия, компьютерными науками (в части машинного обучения) и социологией. Оно пересекается с изучением виральности контента и архитектурой платформ, определяющих правила взаимодействия пользователей.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Для изучения направления подходят программы по анализу данных (Data Science), прикладной социологии и медиаисследованиям. Рекомендуется изучать публикации в рецензируемых журналах по компьютерным наукам и социологии, а также отчеты исследовательских лабораторий, специализирующихся на анализе социальных сетей.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-nets.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%90%D0%BD%D1%82%D0%B8%D0%B0%D0%BB%D0%BA%D0%BE%D0%B3%D0%BE%D0%BB%D1%8C%D0%BD%D1%8B%D0%B5_%D0%BA%D0%B0%D0%BC%D0%BF%D0%B0%D0%BD%D0%B8%D0%B8_%D0%B2_%D0%A1%D0%A1%D0%A1%D0%A0\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Антиалкогольные кампании в СССР — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:1-%D0%B9_%D0%92%D1%81%D0%B5%D1%80%D0%BE%D1%81%D1%81%D0%B8%D0%B9%D1%81%D0%BA%D0%B8%D0%B9_%D0%BA%D0%BD%D0%B8%D0%B3%D0%BE%D1%80%D0%BE%D0%B7%D1%8B%D0%B3%D1%80%D1%8B%D1%88_%C2%AB%D0%9A%D0%BD%D0%B8%D0%B3%D0%B0_%D0%B2%D0%BC%D0%B5%D1%81%D1%82%D0%BE_%D0%B2%D0%BE%D0%B4%D0%BA%D0%B8%C2%BB.jpg\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Неизвестный художник (не указан в выходных данных плаката; отсутствует авторская монограмма или подпись), Public domain&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/nature14539\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Deep learning&lt;/a&gt; — обзор, Nature 2015&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1038/s41418-017-0012-4\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Molecular mechanisms of cell death: recommendations of the Nomenclature Committee on Cell Death 2018&lt;/a&gt; — обзор, Cell Death Differ 2018&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.3402/jev.v4.27066\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Biological properties of extracellular vesicles and their physiological functions&lt;/a&gt; — обзор, J Extracell Vesicles 2015&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Как распространяется информация и как исследователи находят скоординированные кампании."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Информационные кампании и сети","description":"Как распространяется информация и как исследователи находят скоординированные кампании.","vcsPath":"reference/disciplines/dir-nets.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-nets.html#chto-izuchaet","level":2},{"title":"История и ключевые открытия","href":"reference/disciplines/dir-nets.html#istoriya-i-klyuchevye-otkrytiya","level":2},{"title":"Основные школы и подходы","href":"reference/disciplines/dir-nets.html#osnovnye-shkoly-i-podhody","level":2},{"title":"Методы и инструменты","href":"reference/disciplines/dir-nets.html#metody-i-instrumenty","level":2},{"title":"Связи с другими направлениями","href":"reference/disciplines/dir-nets.html#svyazi-s-drugimi-napravleniyami","level":2},{"title":"Где учиться и что читать","href":"reference/disciplines/dir-nets.html#gde-uchitsya-i-chto-chitat","level":2},{"title":"Источники","href":"reference/disciplines/dir-nets.html#istochniki","level":2}],"title":"Информационные кампании и сети"},"router":{"pathname":"reference/disciplines/dir-nets","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
