        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Геоинформатика и дистанционное зондирование Земли&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;XX век (развитие спутниковых технологий)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;Спектральный анализ, компьютерное зрение, ГИС-моделирование&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Remote Sensing, ISPRS Journal of Photogrammetry and Remote Sensing&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-geo.html\"&gt;Спутники и геоданные&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;Спутники и геоданные — это научное направление, изучающее методы сбора, обработки и анализа пространственной информации, полученной с орбитальных аппаратов и наземных сенсоров. Объектом изучения является земная поверхность и происходящие на ней процессы, представленные в виде растровых изображений, векторных карт и метаданных. Цель направления — извлечение объективных данных о состоянии объектов, динамике изменений городской среды и природных ресурсов.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Развитие направления связано с переходом от аналоговой аэрофотосъемки к цифровому дистанционному зондированию Земли (ДЗЗ). Ключевым этапом стало появление общедоступных спутниковых снимков высокого разрешения и развитие геоинформационных систем (ГИС). Важным открытием последних лет стало внедрение методов машинного обучения, позволяющих автоматизировать подсчет объектов, таких как суда или здания, без необходимости дообучения нейросетей под каждый новый регион, что значительно ускоряет анализ больших территорий.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;В области выделяют два основных подхода: экспертный анализ, основанный на визуальной интерпретации снимков, и автоматизированный подход, использующий алгоритмы компьютерного зрения. Современные исследования сфокусированы на создании «цифровых двойников» — моделей, где ИИ-агенты проектируют изменения городской среды, предлагая оптимизированные решения на основе анализа фотоматериалов и геоданных.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Методы включают спектральный анализ, обнаружение изменений (change detection) и сегментацию изображений. Инструментарий состоит из библиотек для обработки растровых данных, нейросетевых архитектур для классификации объектов и открытых картографических платформ. Важным методом является использование косвенных признаков, таких как ночное освещение, для оценки экономической активности в регионах, где прямые данные ограничены.&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;Направление тесно связано с геолокацией по изображениям, позволяющей привязывать визуальные данные к конкретным координатам. Оно взаимодействует с OpenStreetMap, используя краудсорсинговые данные для верификации спутниковых снимков. Анализ изменений в городской среде дополняет методы градостроительного проектирования, превращая статические карты в динамические инструменты планирования.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Для изучения направления подходят академические программы по специальностям «Геоинформатика», «Дистанционное зондирование Земли» и «Анализ данных». Базовые знания можно получить через курсы по работе с ГИС-пакетами и библиотеками машинного обучения. Рекомендуется следить за публикациями в профильных журналах по дистанционному зондированию и компьютерному зрению, а также изучать документацию открытых геоинформационных проектов.&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-geo.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%A1%D0%BF%D1%83%D1%82%D0%BD%D0%B8%D0%BA_(%D0%BF%D0%BE%D0%B8%D1%81%D0%BA%D0%BE%D0%B2%D0%B0%D1%8F_%D1%81%D0%B8%D1%81%D1%82%D0%B5%D0%BC%D0%B0)\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Спутник (поисковая система) — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-14-7\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;GSVA: gene set variation analysis for microarray and RNA-seq data&lt;/a&gt; — обзор, BMC Bioinformatics 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-14-128\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Enrichr: interactive and collaborative HTML5 gene list enrichment analysis tool&lt;/a&gt; — обзор, BMC Bioinformatics 2013&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1002/jcc.21287\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;CHARMM: the biomolecular simulation program&lt;/a&gt; — обзор, J Comput Chem 2009&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Что можно узнать из открытых снимков и карт — и как это делают исследователи."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Спутники и геоданные","description":"Что можно узнать из открытых снимков и карт — и как это делают исследователи.","vcsPath":"reference/disciplines/dir-geo.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-geo.html#chto-izuchaet","level":2},{"title":"История и ключевые открытия","href":"reference/disciplines/dir-geo.html#istoriya-i-klyuchevye-otkrytiya","level":2},{"title":"Основные школы и подходы","href":"reference/disciplines/dir-geo.html#osnovnye-shkoly-i-podhody","level":2},{"title":"Методы и инструменты","href":"reference/disciplines/dir-geo.html#metody-i-instrumenty","level":2},{"title":"Связи с другими направлениями","href":"reference/disciplines/dir-geo.html#svyazi-s-drugimi-napravleniyami","level":2},{"title":"Где учиться и что читать","href":"reference/disciplines/dir-geo.html#gde-uchitsya-i-chto-chitat","level":2},{"title":"Источники","href":"reference/disciplines/dir-geo.html#istochniki","level":2}],"title":"Спутники и геоданные"},"router":{"pathname":"reference/disciplines/dir-geo","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
