        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;strong&gt;Специальности и процессы&lt;/strong&gt;&lt;/p&gt;\n&lt;p&gt;Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/p&gt;\n&lt;p&gt;&lt;img src=\"reference/disciplines/dir-data.jpg\" alt=\"Открытые данные\" /&gt;&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О чём&lt;/td&gt;\n&lt;td&gt;Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Область&lt;/td&gt;\n&lt;td&gt;Информатика, государственное управление, OSINT&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Становление&lt;/td&gt;\n&lt;td&gt;2000-е годы (развитие сетей данных)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Ключевые методы&lt;/td&gt;\n&lt;td&gt;Машиночитаемость, хэширование, сетевой анализ (WGCNA), верификация метаданных&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Журналы&lt;/td&gt;\n&lt;td&gt;Nucleic Acids Research, BMC Bioinformatics, Cell&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Специальности: &lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt;&lt;/p&gt;\n&lt;h2 id=\"chto-izuchaet\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#chto-izuchaet\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что изучает&lt;/span&gt;&lt;/a&gt;Что изучает&lt;/h2&gt;\n&lt;p&gt;Открытые данные (Open Data) — это информационная сущность, представляющая собой сведения, доступные для свободного машиночитаемого использования и дальнейшего распространения без ограничений авторского права или патентов. Направление изучает принципы публикации, стандартизации и анализа общедоступной информации, такой как государственные реестры, архивы закупок и научные отчеты.&lt;/p&gt;\n&lt;h2 id=\"istoriya-i-klyuchevye-otkrytiya\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#istoriya-i-klyuchevye-otkrytiya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;История и ключевые открытия&lt;/span&gt;&lt;/a&gt;История и ключевые открытия&lt;/h2&gt;\n&lt;p&gt;Концепция сформировалась как ответ на необходимость прозрачности в управлении и науке. Важным этапом стало развитие сетей данных в 2000-х годах, когда появились первые крупные проекты по связыванию открытых данных (Linking Open Data). В 2025 году актуальность направления подтвердилась дискуссиями вокруг доступности научной статистики: например, исключение определенных терминов из заявок NIH показало, как изменение метаданных может влиять на видимость исследований в открытых базах.&lt;/p&gt;\n&lt;h2 id=\"osnovnye-shkoly-i-podhody\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#osnovnye-shkoly-i-podhody\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Основные школы и подходы&lt;/span&gt;&lt;/a&gt;Основные школы и подходы&lt;/h2&gt;\n&lt;p&gt;Существует два основных подхода: «технократический» (акцент на машиночитаемости и форматах API) и «правовой» (акцент на лицензировании и снятии ограничений доступа). В науке подход WGCNA (взвешенный анализ корреляционных сетей) демонстрирует, как открытые наборы данных позволяют выявлять скрытые закономерности в биологических системах, что применимо и к анализу социальных реестров.&lt;/p&gt;\n&lt;h2 id=\"metody-i-instrumenty\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#metody-i-instrumenty\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Методы и инструменты&lt;/span&gt;&lt;/a&gt;Методы и инструменты&lt;/h2&gt;\n&lt;p&gt;Методология включает поиск, сбор, сохранение (с использованием хэширования для контроля целостности) и проверку данных. Для работы с большими массивами применяются алгоритмы поиска (например, BLAST для биологических последовательностей) и статистические пакеты для анализа сетей. Важным элементом является проверка достоверности, которая требует сверки цифровых объектов с метаданными и независимыми источниками.&lt;/p&gt;\n&lt;h2 id=\"svyazi-s-drugimi-napravleniyami\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#svyazi-s-drugimi-napravleniyami\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Связи с другими направлениями&lt;/span&gt;&lt;/a&gt;Связи с другими направлениями&lt;/h2&gt;\n&lt;p&gt;Открытые данные являются фундаментом для направлений «Госзакупки», «Реестры организаций» и «Суды и законы». Они тесно связаны с экологическим мониторингом и веб-архивированием. Качество данных напрямую влияет на надежность систем ИИ-агентов, где высокий рейтинг безопасности не всегда гарантирует точность выводов при работе с неполными или искаженными данными.&lt;/p&gt;\n&lt;h2 id=\"gde-uchitsya-i-chto-chitat\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#gde-uchitsya-i-chto-chitat\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где учиться и что читать&lt;/span&gt;&lt;/a&gt;Где учиться и что читать&lt;/h2&gt;\n&lt;p&gt;Для изучения направления рекомендуется осваивать курсы по анализу данных (Data Science), методам OSINT и принципам открытого государственного управления. Базовые знания можно получить через академические обзоры по биоинформатике и методологии работы с базами данных, а также через документацию по стандартам открытых данных (Open Data Handbook).&lt;/p&gt;\n&lt;h2 id=\"istochniki\"&gt;&lt;a href=\"reference/disciplines/dir-data.html#istochniki\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Источники&lt;/span&gt;&lt;/a&gt;Источники&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;a href=\"https://ru.wikipedia.org/wiki/%D0%9E%D1%82%D0%BA%D1%80%D1%8B%D1%82%D1%8B%D0%B5_%D0%B4%D0%B0%D0%BD%D0%BD%D1%8B%D0%B5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Открытые данные — Википедия (ru)&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://commons.wikimedia.org/wiki/File:LOD_Cloud_-_2007-09.png\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Иллюстрация: Cygri, CC BY-SA 3.0&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1093/nar/25.17.3389\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;Gapped BLAST and PSI-BLAST: a new generation of protein database search programs&lt;/a&gt; — обзор, Nucleic Acids Res 1997&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1016/s0092-8674(04)00045-5\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;MicroRNAs: genomics, biogenesis, mechanism, and function&lt;/a&gt; — обзор, Cell 2004&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"https://doi.org/10.1186/1471-2105-9-559\" target=\"_blank\" rel=\"noreferrer noopener\"&gt;WGCNA: an R package for weighted correlation network analysis&lt;/a&gt; — обзор, BMC Bioinformatics 2008&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;a href=\"reference/disciplines.html\"&gt;Специальности и процессы&lt;/a&gt;&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"Реестры, закупки, архивы: где лежат открытые данные и как их читать."}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Открытые данные","description":"Реестры, закупки, архивы: где лежат открытые данные и как их читать.","vcsPath":"reference/disciplines/dir-data.md"},"headings":[{"title":"Что изучает","href":"reference/disciplines/dir-data.html#chto-izuchaet","level":2},{"title":"История и ключевые открытия","href":"reference/disciplines/dir-data.html#istoriya-i-klyuchevye-otkrytiya","level":2},{"title":"Основные школы и подходы","href":"reference/disciplines/dir-data.html#osnovnye-shkoly-i-podhody","level":2},{"title":"Методы и инструменты","href":"reference/disciplines/dir-data.html#metody-i-instrumenty","level":2},{"title":"Связи с другими направлениями","href":"reference/disciplines/dir-data.html#svyazi-s-drugimi-napravleniyami","level":2},{"title":"Где учиться и что читать","href":"reference/disciplines/dir-data.html#gde-uchitsya-i-chto-chitat","level":2},{"title":"Источники","href":"reference/disciplines/dir-data.html#istochniki","level":2}],"title":"Открытые данные"},"router":{"pathname":"reference/disciplines/dir-data","depth":3,"base":"../../"},"lang":"ru","langs":["ru"],"viewerInterface":{"favicon-src":"_assets/logo.svg","toc":true,"search":true,"feedback":true}}
