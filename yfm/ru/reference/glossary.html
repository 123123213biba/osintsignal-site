еделенных терминов из текста грантовой заявки, приводящий к исключению проекта из тематических категорий статистики.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tekstovye-harakteristiki.html\"&gt;Текстовые характеристики&lt;/a&gt; — Алгоритмические методы анализа слов и фраз в документах, которые позволяют классифицировать научные работы без глубокого изучения их…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/signal-detection-theory.html\"&gt;Теория обнаружения сигналов&lt;/a&gt; — Статистический метод оценки способности субъекта различать истинные и ложные утверждения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/point-supervision.html\"&gt;Точечная разметка&lt;/a&gt; — Метод аннотирования изображений, при котором каждый объект отмечается одной точкой в его центре.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-execution-accuracy.html\"&gt;Точность выполнения команд&lt;/a&gt; — Показатель качества работы модели, оцениваемый покомпонентно: выбор инструмента, корректность опциональных флагов и позиционных аргументов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tranzaktsionnyy-remont.html\"&gt;Транзакционный ремонт&lt;/a&gt; — Метод исправления ошибок в инфографике, при котором на основе графа зависимостей пересчитываются и повторно верифицируются только…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/triggernaya-ataka.html\"&gt;Триггерная атака&lt;/a&gt; — Метод воздействия на нейросеть, при котором модель ведет себя определенным образом только при получении заранее заданного «кодового слова»…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"u\"&gt;&lt;a href=\"reference/glossary.html#u\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;У&lt;/span&gt;&lt;/a&gt;У&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/guess-the-capital.html\"&gt;Угадай столицу&lt;/a&gt; — Экспериментальный метод оценки влияния ложных данных на логику модели, где она выбирает карту столицы на основе ответов на уточняющие…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polya-urn.html\"&gt;урна Пойи&lt;/a&gt; — Стохастическая модель из теории процессов подкрепления, применяемая в исследовании для математического анализа накопления видимости…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attack-success-rate.html\"&gt;Уровень успешности атак&lt;/a&gt; — Метрика эффективности защиты, отражающая долю успешно реализованных атак на систему.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f1\"&gt;&lt;a href=\"reference/glossary.html#f1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ф&lt;/span&gt;&lt;/a&gt;Ф&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/cyber-kill-chain.html\"&gt;Фазы безопасности&lt;/a&gt; — Стандартизированная модель этапов кибератаки, помогающая классифицировать инструменты по их назначению в реальных операциях.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rejectors.html\"&gt;Фильтры&lt;/a&gt; — Специализированные алгоритмы, которые проверяют сгенерированные примечания на соответствие стандартам сообщества до того, как они будут…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agreement-gate.html\"&gt;Фильтр согласованности&lt;/a&gt; — Метод аудита нейросетей, при котором решение принимается только в том случае, если модель выбирает один и тот же вариант при смене порядка…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/filtratsiya.html\"&gt;Фильтрация&lt;/a&gt; — Процесс удаления низкокачественных или синтетических данных из обучающего корпуса для предотвращения деградации модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/figs-framework.html\"&gt;Фреймворк FIGS&lt;/a&gt; — Система оценки языковых моделей, использующая 10-шаговый симулятор для проверки баланса между фактологической точностью и эмпатией.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/loss.html\"&gt;Функция потерь&lt;/a&gt; — Показатель ошибки модели, измеряющий разницу между предсказанием нейросети и реальными данными на отложенной выборке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h1\"&gt;&lt;a href=\"reference/glossary.html#h1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Х&lt;/span&gt;&lt;/a&gt;Х&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/hody-moves-v-lingvistike.html\"&gt;Ходы» (moves) в лингвистике&lt;/a&gt; — Функциональные блоки текста, которые выполняют определенную коммуникативную задачу, например, обоснование актуальности или описание пробела…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c1\"&gt;&lt;a href=\"reference/glossary.html#c1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ц&lt;/span&gt;&lt;/a&gt;Ц&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/observation-editing-verification-loop.html\"&gt;Цикл «наблюдение–редактирование–верификация»&lt;/a&gt; — Итеративный процесс, в котором агент анализирует данные, корректирует программный код сцены и проверяет результаты через рендеринг и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/observe-edit-verify-cycle.html\"&gt;Цикл «наблюдение-редактирование-проверка»&lt;/a&gt; — Итеративный процесс, в котором агент анализирует данные, корректирует программный код сцены и проводит геометрические тесты для обеспечения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/digital-trace-data.html\"&gt;Цифровые следы&lt;/a&gt; — Объективные данные об активности пользователя в сети, фиксируемые на устройствах.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ch\"&gt;&lt;a href=\"reference/glossary.html#ch\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ч&lt;/span&gt;&lt;/a&gt;Ч&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/fail-rate.html\"&gt;Частота неудач&lt;/a&gt; — Основная метрика оценки в тестировании, отражающая долю сценариев, в которых ответы модели получили оценку 2 балла и выше.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chekpoint.html\"&gt;Чекпоинт&lt;/a&gt; — Сохраненное состояние нейросети с лучшими показателями на валидационном наборе, которое используется для финального тестирования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sensitivity.html\"&gt;Чувствительность&lt;/a&gt; — Показатель способности различать сигнал и шум, варьирующийся от 0 до 1.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"sh\"&gt;&lt;a href=\"reference/glossary.html#sh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ш&lt;/span&gt;&lt;/a&gt;Ш&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/step.html\"&gt;Шаг&lt;/a&gt; — Функциональный элемент текста введения, например, «обоснование значимости» или «указание на пробел в исследованиях», согласно модели CARS…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"ya\"&gt;&lt;a href=\"reference/glossary.html#ya\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Я&lt;/span&gt;&lt;/a&gt;Я&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/yakor-lichnosti.html\"&gt;Якорь» личности&lt;/a&gt; — Базовая системная инструкция, определяющая, кем является ИИ в диалоге.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cell.html\"&gt;Ячейка»&lt;/a&gt; — Одна комбинация конкретной задачи и модели, выполняемая в рамках эксперимента.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.15.6"},{"name":"description","content":"351 концепция"}],"style":["_assets/biosignal.css"],"script":["_assets/biosignal.js"],"title":"Глоссарий А–Я","description":"351 концепция","vcsPath":"reference/glossary.md"},"headings":[{"title":"П","href":"reference/glossary.html#p","level":2},{"title":"К","href":"reference/glossary.html#k","level":2},{"title":"С","href":"reference/glossary.html#s","level":2},{"title":"А","href":"reference/glossary.html#a","level":2},{"title":"Г","href":"reference/glossary.html#g","level":2},{"title":"О","href":"reference/glossary.html#o","level":2},{"title":"Н","href":"reference/glossary.html#n","level":2},{"title":"O",
