            {"data":{"leading":false,"html":"&lt;p&gt;351 концепция&lt;/p&gt;\n&lt;h2 id=\"p\"&gt;&lt;a href=\"reference/glossary.html#p\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;П&lt;/span&gt;&lt;/a&gt;П&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-verify.html\"&gt;Проверка фактов и медиа&lt;/a&gt; — Как проверить фото, видео и утверждение: методы, инструменты, их точность.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-video_verify.html\"&gt;Проверка видео&lt;/a&gt; — Кадры, звук, синхронизация, первоисточник.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-provenance.html\"&gt;Происхождение и водяные знаки&lt;/a&gt; — C2PA, цифровые подписи контента.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-platforms.html\"&gt;Платформы&lt;/a&gt; — Telegram, YouTube, X: особенности данных и доступа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/lossless-visual-memory.html\"&gt;Память без потерь&lt;/a&gt; — Метод архивации визуальных данных, при котором каждый кадр индексируется по времени и действию и хранится в исходном качестве.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/panelnoe-issledovanie.html\"&gt;Панельное исследование&lt;/a&gt; — Метод сбора данных, при котором одни и те же участники опрактически одни и те же респонденты опрактически одни и те же респонденты…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/parnyy-butstrepping.html\"&gt;Парный бутстреппинг&lt;/a&gt; — Статистический метод оценки точности, при котором данные многократно перевыбираются для расчета доверительных интервалов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/earn-in.html\"&gt;Период вхождения&lt;/a&gt; — Процесс проверки точности и качества работы ИИ-авторов перед предоставлением им права на публикацию заметок в системе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/perpleksiya.html\"&gt;Перплексия&lt;/a&gt; — Метрика, оценивающая, насколько хорошо модель предсказывает выбор следующего токена; чем ниже значение, тем «увереннее» модель в своих…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sandbox.html\"&gt;Песочница&lt;/a&gt; — Изолированная виртуальная среда, где код выполняется без риска для основной системы, что позволяет проверить реальную работоспособность…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-maximum-suppression.html\"&gt;Подавление немаксимумов&lt;/a&gt; — Алгоритм, который удаляет избыточные дублирующиеся предсказания объектов, оставляя только наиболее вероятный вариант.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/bias-isolation.html\"&gt;подавление фона&lt;/a&gt; — Этап и модуль архитектуры COBICount, предназначенный для подавления откликов от повторяющихся фоновых структур и шумов (сетки дорог…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/podozritelnost.html\"&gt;Подозрительность&lt;/a&gt; — Количественная оценка того, насколько ответ модели отклоняется от ожидаемого стиля, что позволяет выявить скрытые каналы передачи данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/candidate-acceptance.html\"&gt;подтверждение кандидатов&lt;/a&gt; — Этап и модуль метода COBICount, выполняющий фильтрацию откликов на компактность и соответствие исходным точечным аннотациям для итоговой…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pozitsionnoe-smeschenie.html\"&gt;Позиционное смещение&lt;/a&gt; — Склонность модели отдавать предпочтение результату, находящемуся на определенной позиции в списке, независимо от его содержания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/polinomialnye-krossy.html\"&gt;Полиномиальные кроссы&lt;/a&gt; — Метод создания новых признаков путем перемножения существующих, что позволяет модели улавливать сложные зависимости между ними.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recall.html\"&gt;Полнота&lt;/a&gt; — Способность модели находить все релевантные случаи (например, все атаки).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/popravka-bendzhamini-hohberga.html\"&gt;Поправка Бенджамини-Хохберга&lt;/a&gt; — Статистический метод контроля ложноположительных результатов при проведении множественных сравнений, позволяющий отсеять случайные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/prefill.html\"&gt;Префилл&lt;/a&gt; — Префилл — это объем данных, обрабатываемый моделью до начала генерации ответа, который задает его формат или тон.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/program-aided-reasoning.html\"&gt;Программно-ориентированное рассуждение&lt;/a&gt; — Метод, при котором модель генерирует код для выполнения вычислений, что повышает точность логических выводов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proksi-pokazatel.html\"&gt;Прокси-показатель&lt;/a&gt; — Косвенная метрика, которую используют, когда прямое измерение исследуемого свойства затруднено.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/direct-planning.html\"&gt;Прямое планирование&lt;/a&gt; — Метод генерации, разделяющий рабочий процесс на создание высокоуровневого плана при повышенной температуре и последующее формирование…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pryamoy-effekt.html\"&gt;Прямой эффект&lt;/a&gt; — То, что предсказал бы стандартный тест.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k\"&gt;&lt;a href=\"reference/glossary.html#k\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;К&lt;/span&gt;&lt;/a&gt;К&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-image_forensics.html\"&gt;Криминалистика изображений&lt;/a&gt; — Следы монтажа, метаданные, сжатие.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-crowdsourcing.html\"&gt;Краудсорсинг и разметка&lt;/a&gt; — Как сообщества помогают проверять.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/calibrated-validation.html\"&gt;Калиброванная валидация&lt;/a&gt; — Способность модели признавать чувства пользователя и проявлять эмпатию без искажения фактов и потери объективности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/karta-navykov.html\"&gt;Карта навыков&lt;/a&gt; — Структурированное описание шаблона дизайна, которое помогает системе понять, как лучше расположить элементы, не нарушая логику данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/density-map.html\"&gt;карта плотности&lt;/a&gt; — Пространственное распределение предсказываемых нейросетью значений пикселей, сумма которых соответствует общему числу искомых объектов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/quantization.html\"&gt;Квантование&lt;/a&gt; — Процесс снижения точности представления чисел (например, весов нейросети) для экономии памяти, который может приводить к тому, что слишком…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/klassifikatsiya-tekstov.html\"&gt;Классификация текстов&lt;/a&gt; — Метод машинного обучения, при котором алгоритм автоматически присваивает научным работам или заявкам тематические категории на основе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/klasterizatsiya.html\"&gt;Кластеризация&lt;/a&gt; — Кластеризация — это метод машинного обучения, который автоматически группирует объекты по схожим признакам или паттернам поведения без…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/klasternyy-butstrep.html\"&gt;Кластерный бутстреп&lt;/a&gt; — Метод статистической оценки, при котором данные группируются по категориям для проверки того, не является ли успех случайным совпадением в…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kod-uolsha-adamara.html\"&gt;Код Уолша-Адамара&lt;/a&gt; — Способ кодирования данных, при котором расстояние между кодами (количество несовпадающих бит) позволяет исправлять ошибки при передаче.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/encoded-reasoning.html\"&gt;Кодированные рассуждения&lt;/a&gt; — Форма вычислений модели, при которой логика представлена в нечитаемом, но открытом формате.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pipeline.html\"&gt;Конвейер&lt;/a&gt; — Последовательность автоматизированных шагов, в ходе которых модель получает данные, обрабатывает их и выполняет действия в среде.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conversion.html\"&gt;Конверсия&lt;/a&gt; — Показатель перехода от взаимодействия с контентом автора к оформлению подписки на него в течение определенного времени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kontekstnaya-chuvstvitelnost.html\"&gt;Контекстная чувствительность&lt;/a&gt; — Способность модели различать, когда следует использовать инструмент.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/runtime-assurance-contract.html\"&gt;Контракт обеспечения времени выполнения&lt;/a&gt; — Формальная схема на уровне политик, которая жестко задает границы автономии, критерии пригодности компонентов, состояние доказательств и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sft.html\"&gt;Контролируемая донастройка&lt;/a&gt; — Контролируемая донастройка (SFT) — это метод обучения модели на размеченных примерах, позволяющий адаптировать её поведение под конкретные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kontrfaktualnoe-modelirovanie.html\"&gt;Контрфактуальное моделирование&lt;/a&gt; — Метод «что, если», который позволяет понять, как изменится результат, если изменить один из входных параметров системы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/konfaunder.html\"&gt;Конфаундер&lt;/a&gt; — Побочный фактор, который может исказить результаты исследования, создавая ложную видимость связи между переменными.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/konyunktsiya.html\"&gt;Конъюнкция&lt;/a&gt; — Логическая операция, при которой условие считается выполненным только при истинности всех входящих в него компонентов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/konyunktsiya-bez-sohraneniya-sostoyaniya.html\"&gt;Конъюнкция без сохранения состояния&lt;/a&gt; — Логическая операция, которая оценивает текущие данные изолированно, не учитывая историю предыдущих проверок или изменений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kortezh.html\"&gt;Кортеж&lt;/a&gt; — Математическая структура, описывающая набор параметров, которые должны быть заданы для работы системы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/kosvennaya-inektsiya.html\"&gt;Косвенная инъекция&lt;/a&gt; — Метод атаки, при котором вредоносная инструкция внедряется не пользователем, а через внешние данные, которые агент считывает в процессе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/capture-coefficient.html\"&gt;коэффициент захвата&lt;/a&gt; — Метрика силы самоподкрепления источника, вычисляемая как разность вероятностей его цитирования при наличии или отсутствии цитирования на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cross-attention.html\"&gt;Кросс-внимание&lt;/a&gt; — Механизм интеграции данных, позволяющий языковому декодеру обращаться к промежуточным представлениям шахматной позиции из энкодера.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s\"&gt;&lt;a href=\"reference/glossary.html#s\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;С&lt;/span&gt;&lt;/a&gt;С&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-synthetic.html\"&gt;Синтетические медиа&lt;/a&gt; — Детекция сгенерированных изображений, голоса и видео.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-geo.html\"&gt;Спутники и геоданные&lt;/a&gt; — Что можно узнать из открытых снимков и карт — и как это делают исследователи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-coordination.html\"&gt;Скоординированное поведение&lt;/a&gt; — Синхронные публикации, сети аккаунтов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-legal_data.html\"&gt;Суды и законы&lt;/a&gt; — Открытые решения, законодательные базы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/centipawn.html\"&gt;Сантипешка&lt;/a&gt; — Единица измерения преимущества в шахматах, равная 1/100 пешки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/segmentatsiya.html\"&gt;Сегментация&lt;/a&gt; — Процесс выделения конкретных объектов на изображении (например, дорог или зданий) для их последующего изменения без затрагивания фона.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semanticheskiy-dreyf.html\"&gt;Семантический дрейф&lt;/a&gt; — Отклонение смысла данных, при котором модель начинает интерпретировать визуальные признаки неверно из-за внешних искажений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semantic-consolidation.html\"&gt;Семантическая консолидация&lt;/a&gt; — Процесс объединения семантически схожих атрибутов, выявленных языковой моделью, для формирования итоговой структуры данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semanticheskoe-prostranstvo-idey.html\"&gt;Семантическое пространство идей&lt;/a&gt; — Уровень абстракции, где модель оперирует концепциями (например, «сеттинг» или «характер персонажа»), а не отдельными словами или токенами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/signatura.html\"&gt;Сигнатура&lt;/a&gt; — Уникальный идентификатор вызова, который позволяет системе понять, что модель повторяет одно и то же действие, даже если аргументы записаны…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sikofanstvo-v-ii.html\"&gt;Сикофанство в ИИ&lt;/a&gt; — Склонность языковой модели соглашаться с ошибочными утверждениями пользователя или чрезмерно льстить ему ради одобрения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/simulyator-polzovatelya.html\"&gt;Симулятор пользователя&lt;/a&gt; — Программная среда, имитирующая поведение реального человека для тестирования ответов ИИ-агентов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sintez-vizualno-simvolicheskih-programm.html\"&gt;Синтез визуально-символических программ&lt;/a&gt; — Метод автоматического создания графики, где каждый визуальный элемент (например, график или иконка) жестко связан с кодом и исходными…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/persona-anchoring.html\"&gt;Системная привязка&lt;/a&gt; — Метод закрепления идентичности агента на уровне системных инструкций, который отделяет «личность» от простого текста в истории сообщений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sistemnyy-prompt.html\"&gt;Системный промпт&lt;/a&gt; — Инструкция, определяющая роль и идентичность ИИ-агента на системном уровне.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/skrining-terminy.html\"&gt;Скрининг-термины&lt;/a&gt; — Ключевые слова, которые стали объектом контроля со стороны регуляторов, отражая изменения в академическом языке, а не в сути научных работ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/trace.html\"&gt;След»&lt;/a&gt; — Промежуточные записи модели, которые она оставляет в тексте, чтобы «вспомнить» ход своих рассуждений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/instruction-following.html\"&gt;Следование инструкциям&lt;/a&gt; — Способность языковой модели выполнять заданные пользователем условия и ограничения при генерации текста.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/slepaya-annotatsiya.html\"&gt;Слепая аннотация&lt;/a&gt; — Метод оценки, при котором эксперты, размечающие данные, не знают целей исследования или гипотез, что минимизирует предвзятость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/slepaya-razmetka.html\"&gt;Слепая» разметка&lt;/a&gt; — Метод оценки, при котором модель-судья не знает, какая именно система сгенерировала данные, что исключает предвзятость.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/smeshivayuschiy-faktor.html\"&gt;Смешивающий фактор&lt;/a&gt; — Побочная переменная, которая может исказить результаты, заставляя модель реагировать не на ложь, а, например, на стиль инструкции или…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/event-based-grounding.html\"&gt;Событийная привязка&lt;/a&gt; — Способ идентификации объекта роботом на основе его роли в недавнем действии, а не по названию или внешнему виду.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cumulative-conversational-visibility.html\"&gt;совокупная видимость в диалоге&lt;/a&gt; — Метрика для расчета общей значимости источника за все шаги диалога с учетом весовых коэффициентов внимания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/selection-regret.html\"&gt;Сожаление при выборе&lt;/a&gt; — Показатель эффективности модели, представляющий разницу между рейтингом лучшего доступного изображения и рейтингом изображения, выбранного…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adversarial-perturbations.html\"&gt;состязательные возмущения&lt;/a&gt; — Минимальные, незаметные для глаза изменения пикселей изображения, которые заставляют нейросеть выдавать неверный результат.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/social-bot.html\"&gt;Социальный бот&lt;/a&gt; — Автоматизированный аккаунт, стратегически усиливающий распространение определенных типов дезинформации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sociotechnical-changes.html\"&gt;Социотехнические изменения&lt;/a&gt; — Взаимосвязанные трансформации технологических систем и общественных институтов, влияющие на структуру управления.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spekulyativnoe-dekodirovanie.html\"&gt;Спекулятивное декодирование&lt;/a&gt; — Метод, при котором модель сначала делает быстрые предположения о будущих данных, а затем проверяет их точность, что ускоряет работу и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mean-absolute-error.html\"&gt;Средняя абсолютная ошибка&lt;/a&gt; — Средняя абсолютная ошибка (MAE) — это метрика качества прогнозирования, отражающая среднее значение отклонений между предсказанными и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganografiya-v-kontekste-ii.html\"&gt;Стеганография в контексте ИИ&lt;/a&gt; — Метод передачи данных внутри обычного текста, при котором сторонний наблюдатель не замечает наличия скрытой информации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganograficheskoe-myshlenie.html\"&gt;Стеганографическое мышление&lt;/a&gt; — Использование моделью ИИ скрытых вычислений внутри текста, который выглядит как безобидный ответ на другую задачу.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganographic-messaging.html\"&gt;Стеганографическая передача сообщений&lt;/a&gt; — Способ передачи данных внутри текста, при котором скрытый смысл остается незаметным для внешнего монитора.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/steganograficheskoe-rassuzhdenie.html\"&gt;Стеганографическое рассуждение&lt;/a&gt; — Скрытая форма логического вывода, при которой модель передает информацию через цепочку рассуждений так, что она остается незаметной для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stilisticheskaya-akkomodatsiya.html\"&gt;Стилистическая аккомодация&lt;/a&gt; — Склонность модели подстраивать свой стиль ответа под стиль или регистр полученного запроса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stohastichnost-vyborki.html\"&gt;Стохастичность выборки&lt;/a&gt; — Случайные отклонения в результатах, возникающие из-за вероятностной природы генерации текста моделью, а не из-за работы защитного механизма.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scene-weighted-training.html\"&gt;Сценарно-взвешенное обучение&lt;/a&gt; — Метод обучения, использующий весовые коэффициенты для балансировки количества вопросов в сценах из разных доменов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a\"&gt;&lt;a href=\"reference/glossary.html#a\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;А&lt;/span&gt;&lt;/a&gt;А&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-fact_check.html\"&gt;Автоматизация фактчекинга&lt;/a&gt; — Поиск утверждений, сопоставление с источниками.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-sat_imagery.html\"&gt;Анализ спутниковых снимков&lt;/a&gt; — Sentinel, Landsat, разрешение, индексы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ablyatsiya.html\"&gt;Абляция&lt;/a&gt; — Абляция — это метод исследования системы путем последовательного отключения ее компонентов для оценки их вклада в итоговый результат.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ablyatsionnoe-issledovanie.html\"&gt;Абляционное исследование&lt;/a&gt; — Абляционное исследование — это метод оценки вклада отдельных компонентов системы в итоговый результат путем их поочередного отключения или…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/automatic-annotator.html\"&gt;Автоматический аннотатор&lt;/a&gt; — Программный инструмент на базе LLM, который сегментирует научный текст и классифицирует его части согласно риторическим шагам модели CARS.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/avtoregressionnaya-vyborka.html\"&gt;Авторегрессионная выборка&lt;/a&gt; — Пошаговое принятие решений, где каждый следующий шаг зависит от результатов предыдущих, что позволяет строить сложные и логичные цепочки…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reconstruction-agent.html\"&gt;Агент реконструкции&lt;/a&gt; — Компонент системы, который создает и проверяет медиаданные на основе защищенной записи для обеспечения совместимости с интерфейсом…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/harness.html\"&gt;Агентная среда&lt;/a&gt; — Программная среда, которая управляет взаимодействием нейросети с инструментами, памятью и внешними данными.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agentnyy-konveyer.html\"&gt;Агентный конвейер&lt;/a&gt; — Система, где отдельные модули (агенты) выполняют специализированные задачи, такие как преобразование данных или проверка корректности…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agentnyy-plagin.html\"&gt;Агентный плагин&lt;/a&gt; — Программный модуль, который автономно выполняет действия от имени пользователя, не передавая исходные чувствительные файлы на внешний…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/agentic-system.html\"&gt;Агентный подход&lt;/a&gt; — Программная архитектура, где ИИ-агент самостоятельно планирует действия, использует инструменты и проверяет результаты для достижения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/algorithm-1.html\"&gt;Агентный цикл&lt;/a&gt; — Процесс, где LLM анализирует текущее состояние среды, выполняет действия по исправлению кода (Room.py) и проверяет результат через…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/adaptatsiya-domenov.html\"&gt;Адаптация доменов&lt;/a&gt; — Процесс настройки модели, обученной на одних данных (исходный домен), для работы на других (целевой домен), где условия съемки могут…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/aktivnoe-vospriyatie.html\"&gt;Активное восприятие&lt;/a&gt; — Метод поиска объекта, при котором робот оценивает потенциальные точки обзора и перемещает камеру для минимизации неопределенности и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/embedding-drift-analysis.html\"&gt;Анализ дрейфа эмбеддингов&lt;/a&gt; — Метод проверки изменений в весах сети путем сравнения косинусного сходства векторов токенов до и после обучения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/counterfactual-role.html\"&gt;Антифактическая роль&lt;/a&gt; — Режим работы модели, при котором она имитирует персонажа с убеждениями, противоречащими реальности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/apriornoe-znanie.html\"&gt;Априорное знание&lt;/a&gt; — «предрасположенность» модели генерировать определенную структуру данных до того, как она увидит конкретный контекст.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/acc.html\"&gt;Атомарные утверждения о вкладе&lt;/a&gt; — Краткие, проверяемые тезисы из научной аннотации, очищенные от вводных слов и контекста, описывающие конкретный научный вклад автора.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomarnyy-vklad.html\"&gt;Атомарный вклад&lt;/a&gt; — Одно конкретное утверждение о методе или результате, которое можно проверить на истинность, лишенное вводных слов и местоимений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/atomic-fact.html\"&gt;Атомарный факт&lt;/a&gt; — Минимальная смысловая единица ответа нейросети, которую можно независимо проверить на соответствие источникам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attraktor.html\"&gt;Аттрактор&lt;/a&gt; — Состояние системы, к которому она стремится вернуться при отсутствии внешних воздействий или при ослаблении управляющих сигналов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/auditorskiy-razryv.html\"&gt;Аудиторский разрыв&lt;/a&gt; — Различие между тем, что нейросеть сообщает при прямом ответе, и тем, как она использует информацию в логических цепочках.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g\"&gt;&lt;a href=\"reference/glossary.html#g\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Г&lt;/span&gt;&lt;/a&gt;Г&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-geolocation.html\"&gt;Геолокация по изображению&lt;/a&gt; — Где сделан снимок: рельеф, дороги, тени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-procurement.html\"&gt;Госзакупки&lt;/a&gt; — Тендеры, контракты, признаки неконкурентности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/generative-engine-optimization.html\"&gt;генеративная оптимизация&lt;/a&gt; — Метод повышения видимости контента в ответах генеративных поисковых систем.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/candidate-evidence.html\"&gt;генерация кандидатов&lt;/a&gt; — Первый этап метода COBICount, формирующий широкую карту возможных откликов сети на снимке.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/geometric-accuracy.html\"&gt;Геометрическая точность&lt;/a&gt; — Показатель качества реконструкции, оцениваемый через среднюю абсолютную ошибку глубины (MAE) и корректность расположения объектов в…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/global-ai-governance.html\"&gt;Глобальное регулирование ИИ&lt;/a&gt; — Процесс формирования правил и норм для технологий искусственного интеллекта, распределенный между государствами и частными корпорациями.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gomofiliya.html\"&gt;Гомофилия&lt;/a&gt; — Тенденция пользователей объединяться и взаимодействовать с похожими на них людьми в социальной сети.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/graf-podpisok.html\"&gt;Граф подписок&lt;/a&gt; — Структура данных, отражающая связи между пользователями (кто на кого подписан), а «путь внимания» определяет, через какое количество…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o\"&gt;&lt;a href=\"reference/glossary.html#o\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;О&lt;/span&gt;&lt;/a&gt;О&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-change_detection.html\"&gt;Обнаружение изменений&lt;/a&gt; — Что изменилось между снимками: застройка, леса, разрушения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-data.html\"&gt;Открытые данные&lt;/a&gt; — Реестры, закупки, архивы: где лежат открытые данные и как их читать.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/obobschenie.html\"&gt;Обобщение&lt;/a&gt; — Способность языковой модели сохранять семантически стабильные и согласованные результаты при изменении формы подачи одного и того же…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reversible-numerical-mapping.html\"&gt;Обратимое числовое отображение&lt;/a&gt; — Метод защиты данных, при котором числовые значения заменяются на другие с сохранением порядка, что позволяет восстановить исходные данные…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/reinforcement-learning-with-verifiable-rewards.html\"&gt;Обучение с подкреплением на основе верифицируемых наград&lt;/a&gt; — Метод обучения моделей, при котором награда за действие определяется на основе автоматической проверки корректности сгенерированной команды.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/source-only-counting.html\"&gt;обучение только на исходных данных&lt;/a&gt; — Подход к обучению моделей подсчета объектов на единственном размеченном наборе данных без использования целевых изображений и меток до…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/single-pass-candidate-scorer.html\"&gt;Однопроходный скорер&lt;/a&gt; — Метод, при котором модель оценивает возможные варианты решения за один цикл обработки данных, что значительно ускоряет работу системы по…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/okklyuziya.html\"&gt;Окклюзия&lt;/a&gt; — Ситуация, когда целевой объект перекрыт другими предметами или находится вне поля зрения камеры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ontologiya-v-dannom-kontekste.html\"&gt;Онтология в данном контексте&lt;/a&gt; — Формализованная система категорий и связей между ними, которая помогает компьютеру «понимать» структуру данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/open-ended.html\"&gt;Открытый промпт&lt;/a&gt; — Запрос, допускающий множество вариантов визуальной интерпретации, в отличие от закрытого, где детали строго регламентированы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/compounding-ratio.html\"&gt;отношение компаундирования&lt;/a&gt; — Показатель, отражающий отношение реального влияния GEO на дистанции к результатам одноходовой оценки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/or.html\"&gt;Отношение шансов&lt;/a&gt; — Показатель, демонстрирующий, во сколько раз вероятность события в одной группе выше или ниже, чем в другой.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/otravlenie-dannyh.html\"&gt;Отравление данных&lt;/a&gt; — Метод внедрения недостоверной информации в обучающую выборку модели для искажения её фактических ответов и логики принятия решений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/oflayn-otsenka.html\"&gt;Офлайн-оценка&lt;/a&gt; — Тестирование алгоритма на статических наборах данных без взаимодействия с реальными пользователями платформы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n\"&gt;&lt;a href=\"reference/glossary.html#n\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Н&lt;/span&gt;&lt;/a&gt;Н&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-night_lights.html\"&gt;Ночные огни и косвенные признаки&lt;/a&gt; — Экономика и события по свечению городов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-narratives.html\"&gt;Нарративы и дезинформация&lt;/a&gt; — Отслеживание сюжетов и ложных утверждений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nats.html\"&gt;Наты&lt;/a&gt; — Единица измерения информации, используемая для оценки уверенности модели: чем выше значение, тем сильнее предпочтение модели конкретного…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scientific-drift.html\"&gt;Наукометрический дрейф&lt;/a&gt; — Изменение фокуса и методологии научных исследований в определенной области с течением времени, измеряемое через частоту упоминания…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nekompensatornye-barery.html\"&gt;Некомпенсаторные барьеры&lt;/a&gt; — Условия, при которых успех в одной области не может «перекрыть» провал в критически важной проверке безопасности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/non-compensatory-principle.html\"&gt;Некомпенсаторность&lt;/a&gt; — Механизм контроля, который блокирует действия при любом сбое или неопределенности, независимо от общей производительности модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neopredelennost-proishozhdeniya-kandidata.html\"&gt;Неопределенность происхождения кандидата&lt;/a&gt; — Проблема в задачах подсчета объектов, при которой нейросеть ошибочно принимает повторяющиеся элементы фона за искомые объекты.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nesovmestimost-platformy.html\"&gt;Несовместимость платформы&lt;/a&gt; — Ситуация, когда программная среда (например, Windows) не понимает команды, предназначенные для другой системы (например, Unix), что…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/neuchtennaya-nauka.html\"&gt;Неучтенная наука&lt;/a&gt; — Состояние, при котором научные проекты продолжают финансироваться и выполняться, но перестают отражаться в официальной государственной…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/idt.html\"&gt;Неявный цифровой двойник&lt;/a&gt; — Концепция моделирования, сочетающая генеративные модели и экспертные правила для проверки гипотез о городских изменениях без проведения…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/norma-frobeniusa.html\"&gt;Норма Фробениуса&lt;/a&gt; — Математическая мера «размера» матрицы, позволяющая оценить, насколько сильно изменились веса модели в процессе обучения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/normalizatsiya.html\"&gt;Нормализация&lt;/a&gt; — Приведение данных к единому стандарту, чтобы разные модели могли работать с ними по общему шаблону.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/expected-degree-null-model.html\"&gt;Нулевая модель&lt;/a&gt; — Статистический метод для оценки случайного распределения взаимодействий, учитывающий только количество входящих и исходящих связей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zero-shot.html\"&gt;Нулевое обучение&lt;/a&gt; — Режим работы системы, при котором она выполняет задачи без необходимости специализированного дообучения под конкретные условия или объекты.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"o1\"&gt;&lt;a href=\"reference/glossary.html#o1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;O&lt;/span&gt;&lt;/a&gt;O&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-osm_gis.html\"&gt;OpenStreetMap и ГИС&lt;/a&gt; — Открытые карты, геоданные, пространственный анализ.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i\"&gt;&lt;a href=\"reference/glossary.html#i\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;И&lt;/span&gt;&lt;/a&gt;И&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-nets.html\"&gt;Информационные кампании и сети&lt;/a&gt; — Как распространяется информация и как исследователи находят скоординированные кампании.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-tooling.html\"&gt;Инструменты и пайплайны&lt;/a&gt; — Открытые инструменты и их сравнение.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/information-extraction.html\"&gt;Извлечение информации&lt;/a&gt; — Процесс преобразования неструктурированного текста на естественном языке в структурированные данные для последующего анализа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-writers.html\"&gt;ИИ-авторы&lt;/a&gt; — Программные агенты, которые мониторят ленты публикаций через API и автоматически генерируют пояснительные заметки, снижая нагрузку на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-agent.html\"&gt;ИИ-агент&lt;/a&gt; — Программная сущность на базе LLM, обладающая постоянной идентичностью и историей взаимодействий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/inferens.html\"&gt;Инференс&lt;/a&gt; — Процесс использования обученной нейросети для получения ответов на новые данные.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/informatsionnyy-zapah.html\"&gt;Информационный запах&lt;/a&gt; — Метафора для оценки пользователем полезности контента на основе косвенных признаков (заголовков, сниппетов) до перехода по ссылке.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ispolnyaemyy-graf-elementov.html\"&gt;Исполняемый граф элементов&lt;/a&gt; — Структура данных, которая позволяет системе не просто «рисовать» картинку, а управлять каждым объектом как кодом, который можно изменять и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tool-use.html\"&gt;Использование инструментов&lt;/a&gt; — Способность языковой модели генерировать структурированные запросы для взаимодействия с внешними системами или серверами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ispravlenie-faktov.html\"&gt;Исправление фактов&lt;/a&gt; — Метод дообучения модели на корректных данных для устранения последствий внедрения ложной информации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iterative-distillation.html\"&gt;Итеративная дистилляция&lt;/a&gt; — Процесс обучения, при котором модель анализирует позиции, генерирует объяснения и переносит полученный опыт обратно в свои веса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iterative-framework.html\"&gt;Итеративный фреймворк&lt;/a&gt; — Метод автоматического выявления и извлечения схем атрибутов из неструктурированных корпусов текстов без использования заранее заданной…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/iteratsiya-po-bellmanu.html\"&gt;Итерация по Беллману&lt;/a&gt; — Метод обучения, при котором модель постепенно улучшает свои предсказания, опираясь на оценки более глубокого поиска, «запоминая» правильные…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b\"&gt;&lt;a href=\"reference/glossary.html#b\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Б&lt;/span&gt;&lt;/a&gt;Б&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-bots.html\"&gt;Боты&lt;/a&gt; — Автоматические аккаунты и их поиск.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/base-belief.html\"&gt;Базовое убеждение&lt;/a&gt; — Позиция, которую модель последовательно выражает в режиме полезного помощника при отсутствии стимулов ко лжи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stateless-inference.html\"&gt;Безгосударственный инференс&lt;/a&gt; — Режим работы языковой модели, при котором она заново вычисляет состояние внимания для каждого нового запроса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/benchmark.html\"&gt;Бенчмарк&lt;/a&gt; — Набор данных и задач, используемый для сравнения производительности различных алгоритмов по единой шкале.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/large-language-models-llm.html\"&gt;Большие языковые модели&lt;/a&gt; — Системы искусственного интеллекта, используемые в работе для генерации научных текстов и анализа их структуры.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/butstrep.html\"&gt;Бутстреп&lt;/a&gt; — Метод статистической оценки, при котором данные многократно перевыбираются для проверки надежности выводов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/butstrep-intervaly.html\"&gt;Бутстреп-интервалы&lt;/a&gt; — Статистический метод оценки точности, который помогает понять, насколько надежны выявленные тренды, путем многократной перевыборки данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r\"&gt;&lt;a href=\"reference/glossary.html#r\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Р&lt;/span&gt;&lt;/a&gt;Р&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-diffusion.html\"&gt;Распространение и виральность&lt;/a&gt; — Как сообщения расходятся по сети.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-registries.html\"&gt;Реестры организаций&lt;/a&gt; — Компании, бенефициары (юрлица), лицензии.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/train-inference-gap.html\"&gt;разрыв между обучением и выводом&lt;/a&gt; — Явление, при котором модель успешно обучается состязательным атакам при принудительном обучении, но игнорирует их при свободной генерации…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/assurance-transition-gap.html\"&gt;Разрыв перехода к гарантиям&lt;/a&gt; — Состояние системы, при котором она выполняет задачу, но не имеет механизма для изменения уровня полномочий агента при возникновении рисков.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mahalanobis-distance.html\"&gt;Расстояние Махаланобиса&lt;/a&gt; — Прокси-метрика, используемая для оценки того, что внесенные в изображения изменения не выходят за рамки распределения реальных данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/regulatory-arbitrage.html\"&gt;Регуляторный арбитраж&lt;/a&gt; — Практика выбора юрисдикции с наиболее мягкими правилами для обхода ограничений, установленных в других регионах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rezervnoe-kopirovanie.html\"&gt;Резервное копирование&lt;/a&gt; — Создание копии файла перед внесением изменений, позволяющее вернуться к рабочему состоянию при ошибке.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rekursiya.html\"&gt;Рекурсия&lt;/a&gt; — Метод вычисления, где каждое следующее значение зависит от предыдущего, что позволяет моделировать накопленный эффект обратной связи в…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/render-sravnenie.html\"&gt;Рендер-сравнение&lt;/a&gt; — Метод верификации, при котором виртуальная модель сцены накладывается на реальное фото с использованием идентичных параметров камеры для…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rhetorical-structure.html\"&gt;Риторическая структура&lt;/a&gt; — Последовательность аргументативных ходов в тексте, с помощью которых автор обосновывает значимость своего исследования.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ritoricheskie-hody.html\"&gt;Риторические ходы&lt;/a&gt; — Функциональные части текста, которые выполняют конкретную задачу, например, обоснование актуальности или формулировку научной проблемы.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"e\"&gt;&lt;a href=\"reference/glossary.html#e\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Э&lt;/span&gt;&lt;/a&gt;Э&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-env_data.html\"&gt;Экологические данные&lt;/a&gt; — Выбросы, пожары, качество воздуха по открытым источникам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-ethics.html\"&gt;Этика и приватность&lt;/a&gt; — Где граница: защита персональных данных, риски исследований.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekspertnyy-enkoder.html\"&gt;Экспертный энкодер&lt;/a&gt; — Специализированная модель, которая «понимает» правила и стратегию конкретной области (например, шахмат), предоставляя языковой модели…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ekstraktor.html\"&gt;Экстрактор&lt;/a&gt; — Модель, которая выделяет ключевые научные утверждения из текста абстрактов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/embedding.html\"&gt;Эмбеддинг&lt;/a&gt; — Представление текста в виде числового вектора, позволяющее модели «понимать» семантическую близость публикаций.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enkoder-dekoder.html\"&gt;Энкодер-декодер&lt;/a&gt; — Архитектура нейросети, где энкодер сжимает входные данные в векторное представление, а декодер преобразует его в понятный человеку текст.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/entropiya-v-dannom-kontekste.html\"&gt;Энтропия в данном контексте&lt;/a&gt; — Мера «нерешительности» модели при выборе следующего токена: чем выше значение, тем менее предсказуем выбор модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beautiful.html\"&gt;Эстетическая оценка&lt;/a&gt; — Метрика, определяющая субъективное восприятие привлекательности городской среды на основе визуальных данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v\"&gt;&lt;a href=\"reference/glossary.html#v\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;В&lt;/span&gt;&lt;/a&gt;В&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-web_archives.html\"&gt;Веб-архивы&lt;/a&gt; — Wayback Machine, сохранение и сравнение страниц.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/validnost-vyzova-instrumentov.html\"&gt;Валидность вызова инструментов&lt;/a&gt; — Способность модели генерировать команды в формате, который понимает программная среда (например, JSON-схема).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/verbalizovannaya-vyborka.html\"&gt;Вербализованная выборка&lt;/a&gt; — Метод, при котором модель сама «озвучивает» несколько вариантов ответа и присваивает им вероятности, что позволяет оценить разнообразие…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/verbalized-sampling.html\"&gt;Вербализованное сэмплирование&lt;/a&gt; — Метод диверсификации генерации, в рамках которого языковая модель самостоятельно выводит распределение вероятностей для заданного числа…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/probabilistic-volumetric-map.html\"&gt;Вероятностная волюметрическая карта&lt;/a&gt; — Представление пространства в виде объемной модели, объединяющее данные из истории событий и геометрию текущей сцены для оценки вероятности…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vizualnaya-inspektsiya.html\"&gt;Визуальная инспекция&lt;/a&gt; — Инструмент агента для детального изучения фрагментов прошлых кадров или сравнения состояний среды в разные моменты времени.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vmeshatelstvo-na-etape-obucheniya.html\"&gt;Вмешательство на этапе обучения&lt;/a&gt; — Изменение «мировоззрения» модели через корректировку данных или правил, по которым она учится предсказывать следующий токен.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/error-injection.html\"&gt;Внедрение ошибок&lt;/a&gt; — Метод тестирования устойчивости ИИ, при котором в данные принудительно вносится искажение для проверки того, как модель справляется с…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/random-number-generator.html\"&gt;Внешний генератор случайных чисел&lt;/a&gt; — Внешний инструмент генерации случайности, применяемый для выбора одного варианта из предложенных моделью опций при планировании ответов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/enactment.html\"&gt;Воплощение&lt;/a&gt; — Процесс исполнения агентом заданной роли в ходе диалога.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/embodied-ai.html\"&gt;Воплощенный ИИ&lt;/a&gt; — Направление, где интеллектуальные агенты обучаются взаимодействовать с физическим миром, используя виртуальные среды для отработки навыков.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/gate.html\"&gt;Ворота»&lt;/a&gt; — Ворота (gate) — это механизм в архитектуре модели или метод фильтрации, определяющий необходимость вызова внешнего инструмента или отбор…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/completion-gate.html\"&gt;ворота завершения&lt;/a&gt; — Механизм, принуждающий модель сверять полученный результат с исходным текстом задачи перед подтверждением её выполнения.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m\"&gt;&lt;a href=\"reference/glossary.html#m\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;М&lt;/span&gt;&lt;/a&gt;М&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/spec-methods.html\"&gt;Методы и этика&lt;/a&gt; — Инструменты, датасеты, воспроизводимость и этика исследований открытых данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/macro-accuracy.html\"&gt;Макро-точность&lt;/a&gt; — Метрика оценки качества модели, при которой каждой задаче присваивается равный вес независимо от количества вопросов в ней.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/masshtabirovanie.html\"&gt;Масштабирование&lt;/a&gt; — Зависимость качества модели от объема данных и вычислительных мощностей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/create-a-research-space.html\"&gt;Метод CARS&lt;/a&gt; — Модель структуры вступлений к научным статьям, описывающая аргументацию через три риторических шага: установление территории, выделение…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/evidence-validated-longitudinal-update.html\"&gt;Метод EVLU&lt;/a&gt; — Алгоритм фильтрации обновлений прогнозов модели, который отсеивает ошибочные корректировки, но снижает полноту анализа данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/medical-subject-headings.html\"&gt;Метод MeSH&lt;/a&gt; — Контролируемый словарь для индексации статей, позволяющий систематизировать научные темы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/metod-butstrepa.html\"&gt;Метод бутстрепа&lt;/a&gt; — Статистический метод, позволяющий оценить точность оценки путем многократного случайного выбора данных из исходного набора с возвращением.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/beam-search.html\"&gt;Метод поиска по лучу&lt;/a&gt; — Алгоритм поиска, который на каждом шаге сохраняет несколько наиболее вероятных вариантов развития событий, что позволяет эффективно…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/black-box.html\"&gt;Метод «черного ящика»&lt;/a&gt; — Подход, при котором мы анализируем только входные и выходные данные системы, не имея доступа к ее внутренним алгоритмам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/inspect.html\"&gt;Механизм «инспекции»&lt;/a&gt; — Функция, позволяющая модели программно «приближать» фрагменты изображения для анализа мелких деталей, которые не видны в исходном…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-turn-attack.html\"&gt;Многоходовая атака&lt;/a&gt; — Тип кибератаки на ИИ-агентов, при которой вредоносные намерения скрываются в длинных цепочках действий для обхода фильтров безопасности.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/model-cars.html\"&gt;Модель CARS&lt;/a&gt; — Стандартный лингвистический подход к анализу структуры научных введений, где автор последовательно переходит от общего контекста к…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/audit-module.html\"&gt;модуль Audit&lt;/a&gt; — Вспомогательный блок визуального контроля в COBICount, преобразующий внутренние признаки сети в каналы классов без влияния на расчет…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/chain-of-thought-monitoring.html\"&gt;Мониторинг цепочек рассуждений&lt;/a&gt; — Метод контроля безопасности ИИ, при котором анализируется текст рассуждений модели для выявления подозрительного поведения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mas.html\"&gt;Мультиагентная система&lt;/a&gt; — Подход, при котором несколько независимых программных агентов взаимодействуют друг с другом для решения сложной задачи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-agent-approach.html\"&gt;Мультиагентный подход&lt;/a&gt; — Архитектура системы, в которой отдельные агенты (планировщик, агент политики, генератор) координируют действия для внесения обоснованных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodalnaya-model.html\"&gt;Мультимодальная модель&lt;/a&gt; — Нейросеть, способная одновременно обрабатывать и сопоставлять данные разных типов, например, текст и изображения.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multimodal-large-language-models-mllm.html\"&gt;Мультимодальные языковые модели&lt;/a&gt; — Инструмент для интерпретации текстовых инструкций и их связи с визуальными данными из истории событий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soft-miss.html\"&gt;Мягкий промах»&lt;/a&gt; — Ситуация, когда модель правильно определила необходимость вызова инструмента, но допустила ошибку в конкретных параметрах или синтаксисе…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/soft-metrics.html\"&gt;Мягкие метрики&lt;/a&gt; — Показатели производительности или уверенности модели, которые суммируются для оценки риска, но не являются достаточным основанием для…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d\"&gt;&lt;a href=\"reference/glossary.html#d\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Д&lt;/span&gt;&lt;/a&gt;Д&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/proc-datasets.html\"&gt;Датасеты и бенчмарки&lt;/a&gt; — Размеченные наборы для проверки методов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dataset.html\"&gt;Датасет&lt;/a&gt; — Совокупность пар вопрос-ответ, используемая для обучения и тестирования детекторов лжи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/two-hop.html\"&gt;Два прыжка&lt;/a&gt; — Радиус в графе подписок, определяющий дистанцию до автора контента, равную двум связям от пользователя.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/determinirovannoe-dekodirovanie.html\"&gt;Детерминированное декодирование&lt;/a&gt; — Режим работы нейросети, при котором она всегда выбирает наиболее вероятный следующий токен, что делает ответы воспроизводимыми.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/determinirovannaya-kanonizatsiya.html\"&gt;Детерминированная канонизация&lt;/a&gt; — Приведение различных вариантов написания одной и той же команды к единому стандарту, что позволяет объективно оценивать точность модели…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/determinirovannye-povoroty.html\"&gt;Детерминированные повороты&lt;/a&gt; — Метод смены последовательности элементов в списке, позволяющий проверить, не «предпочитает» ли модель первый предложенный вариант.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/diagnostic-ladder.html\"&gt;Диагностическая лестница&lt;/a&gt; — Метод верификации навыков ИИ, включающий проверку воспроизведения, зондирование первого токена и анализ дрейфа эмбеддингов для выявления…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dikiy-ii-tekst.html\"&gt;Дикий» ИИ-текст&lt;/a&gt; — Контент, созданный нейросетями, который естественно встречается в интернете и попадает в обучающие выборки без специальной маркировки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dispersiya.html\"&gt;Дисперсия&lt;/a&gt; — Показатель разброса данных; высокая дисперсия означает, что результаты одного и того же теста могут сильно различаться от запуска к запуску.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dissociation.html\"&gt;Диссоциация&lt;/a&gt; — Состояние ИИ-агента, при котором он теряет заданную роль и начинает идентифицировать себя как базовая модель.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/distilled-model.html\"&gt;Дистиллированная модель&lt;/a&gt; — Локальная нейросеть с уменьшенным количеством параметров, используемая для переписывания сущностей и тем в запросах.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/diffuzionnaya-model.html\"&gt;Диффузионная модель&lt;/a&gt; — Тип нейросети, которая создает изображения, постепенно убирая «шум» из случайных данных, что позволяет достичь высокой детализации и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/diffusion-inpainting.html\"&gt;Диффузионный инпейнтинг&lt;/a&gt; — Метод генеративного редактирования изображений, используемый в системе для заполнения пропущенных или измененных областей на снимках…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/attention-path-length.html\"&gt;Длина пути внимания&lt;/a&gt; — Метрика, измеряющая расстояние в графе подписок между пользователем и автором контента, с которым он взаимодействует.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/dreyf-embeddingov.html\"&gt;Дрейф эмбеддингов&lt;/a&gt; — Изменение числовых векторов, представляющих слова или токены в пространстве модели. Отсутствие дрейфа означает, что модель не переучивала…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"8\"&gt;&lt;a href=\"reference/glossary.html#8\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8&lt;/span&gt;&lt;/a&gt;8&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/8-bitnyy-optimizator.html\"&gt;8-битный оптимизатор&lt;/a&gt; — Метод сжатия состояния оптимизатора, позволяющий экономить память, но потенциально влияющий на точность вычислений по сравнению с полным…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a1\"&gt;&lt;a href=\"reference/glossary.html#a1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;A&lt;/span&gt;&lt;/a&gt;A&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/ai-note-writer-api.html\"&gt;AI Note Writer API&lt;/a&gt; — Программный интерфейс, позволяющий сторонним разработчикам автоматизировать создание контекстных заметок для системы Community Notes с…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/arc-agi-3.html\"&gt;ARC-AGI-3&lt;/a&gt; — Интерактивный бенчмарк, состоящий из 25 визуальных игр, где агент должен самостоятельно выводить закономерности и цели без явного задания…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/area-under-the-curve.html\"&gt;AUC&lt;/a&gt; — Метрика качества классификации: 0,5 означает случайное угадывание, 1,0 — идеальную точность. Значение 0,69 указывает на умеренную…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"b1\"&gt;&lt;a href=\"reference/glossary.html#b1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;B&lt;/span&gt;&lt;/a&gt;B&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/beyondsce.html\"&gt;BeyondSCe&lt;/a&gt; — Система для захвата объектов роботом, использующая историю прошлых взаимодействий и активное восприятие для поиска скрытых предметов без…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/blaise.html\"&gt;Blaise&lt;/a&gt; — Компонент системы Galahad, индексирующий документы и передающий модели только релевантные фрагменты текста.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/byzantine-fault-tolerance.html\"&gt;ByzFL&lt;/a&gt; — Метод обеспечения устойчивости системы к сбоям или вредоносным действиям отдельных узлов сети.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"c\"&gt;&lt;a href=\"reference/glossary.html#c\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;C&lt;/span&gt;&lt;/a&gt;C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/claimopinion.html\"&gt;ClaimOpinion&lt;/a&gt; — Модель машинного обучения, которая предсказывает вероятность того, что заметка будет признана полезной (Helpful), анализируя её содержание…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/command-line-interface.html\"&gt;CLI&lt;/a&gt; — Способ взаимодействия с компьютерной программой, при котором пользователь вводит текстовые команды для выполнения операций.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/cobicount.html\"&gt;COBICount&lt;/a&gt; — Метод подсчета объектов на спутниковых снимках, разделяющий генерацию кандидатов, их проверку и подавление фоновых шумов без дообучения на…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-notes.html\"&gt;Community Notes&lt;/a&gt; — Децентрализованный механизм краудсорсинга в социальной сети X для добавления контекстных примечаний к публикациям с целью борьбы с…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-writer.html\"&gt;Community Writer&lt;/a&gt; — Крупнейший клиент AI API, использующий комбинацию дообученных и коммерческих моделей для генерации и приоритизации контекстных заметок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/conversational-capture.html\"&gt;Conversational capture&lt;/a&gt; — Феномен, при котором раннее цитирование источника повышает вероятность его повторного появления в диалоге с ИИ.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/community-rated-helpful.html\"&gt;CRH&lt;/a&gt; — Показатель, присваиваемый заметке алгоритмом на основе консенсуса пользователей, который обеспечивает её широкую видимость на платформе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"d1\"&gt;&lt;a href=\"reference/glossary.html#d1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;D&lt;/span&gt;&lt;/a&gt;D&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/drift-inspector.html\"&gt;Drift Inspector&lt;/a&gt; — Система с открытым исходным кодом для анализа эволюции научных областей путем извлечения и кластеризации атомарных утверждений о вкладе.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"f\"&gt;&lt;a href=\"reference/glossary.html#f\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;F&lt;/span&gt;&lt;/a&gt;F&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/f1-mera.html\"&gt;F1-мера&lt;/a&gt; — Метрика, объединяющая точность (precision) и полноту (recall) модели, где 100% означает идеальное совпадение с эталоном.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/forsyth-edwards-notation.html\"&gt;FEN&lt;/a&gt; — Стандарт записи шахматной позиции, используемый в качестве входных данных для модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/fineweb.html\"&gt;FineWeb&lt;/a&gt; — Фильтр качества данных, который, согласно исследованию, ошибочно отдает предпочтение сгенерированному ИИ-контенту.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/false-positive-rate.html\"&gt;FPR&lt;/a&gt; — Доля ошибочных блокировок безопасных действий системы, принимаемых за угрозы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/frame-break.html\"&gt;Frame-break&lt;/a&gt; — Метод вывода модели из «ролевой игры» для возврата к базовым инструкциям и предотвращения закрепления нежелательных состояний.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"g1\"&gt;&lt;a href=\"reference/glossary.html#g1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;G&lt;/span&gt;&lt;/a&gt;G&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/gacha-decoding.html\"&gt;Gacha Decoding&lt;/a&gt; — Метод генерации контента языковыми моделями, который переносит источник вариативности с энтропии токенов на следование инструкциям…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/galahad.html\"&gt;Galahad&lt;/a&gt; — Система, сохраняющая состояние внимания и фрагменты текста для ускорения работы больших языковых моделей.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"h\"&gt;&lt;a href=\"reference/glossary.html#h\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;H&lt;/span&gt;&lt;/a&gt;H&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/human-computer-interaction.html\"&gt;HCI&lt;/a&gt; — Область знаний, изучающая взаимодействие человека с компьютерными системами, направленная на создание интуитивно понятных и эффективных…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/hdbscan.html\"&gt;HDBSCAN&lt;/a&gt; — Алгоритм плотностной кластеризации, применяемый для выделения тематических групп научных утверждений и отделения уникальных вкладов…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/heartbeat.html\"&gt;Heartbeat&lt;/a&gt; — Автоматический запрос к модели для поддержания активности сессии.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"i1\"&gt;&lt;a href=\"reference/glossary.html#i1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;I&lt;/span&gt;&lt;/a&gt;I&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/igenbench.html\"&gt;IGenBench&lt;/a&gt; — Набор данных и бенчмарк, используемый для оценки точности фактов и точности генерируемой инфографики.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-context-learning.html\"&gt;In-context learning&lt;/a&gt; — Способность модели выполнять задачу, опираясь только на примеры в промпте, без изменения весов нейросети.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/in-sample-effekt.html\"&gt;In-sample эффект&lt;/a&gt; — Оценка эффективности системы на тех же данных, на которых она обучалась или настраивалась, что может завышать показатели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infoagent.html\"&gt;InfoAgent&lt;/a&gt; — Фреймворк для синтеза визуально-символических программ, который связывает элементы инфографики с источниками данных через граф зависимостей…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infographicbench-evidence.html\"&gt;InfoGraphicBench-Evidence&lt;/a&gt; — Бенчмарк из 260 запросов, предназначенный для оценки надежности и точности генерации инфографики на основе проверяемых доказательств.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/ipsaemin.html\"&gt;ipSAEmin&lt;/a&gt; — Метрика предсказанной ошибки выравнивания (от 0 до 1), где значения выше 0,5 свидетельствуют об успешном формировании интерфейса связывания.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/infographic-visual-description.html\"&gt;IVD&lt;/a&gt; — Промежуточное представление и исполняемый контракт инфографики в виде типизированного графа зависимостей, фиксирующий фактические данные…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"k1\"&gt;&lt;a href=\"reference/glossary.html#k1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;K&lt;/span&gt;&lt;/a&gt;K&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/kalibench.html\"&gt;KaliBench&lt;/a&gt; — Специализированный бенчмарк и набор данных для оценки перевода запросов на естественном языке в команды CLI инструментов Kali Linux.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/key-value-cache.html\"&gt;KV-кэш&lt;/a&gt; — Набор данных, содержащий ключи и значения внимания, вычисленные моделью для блоков текста.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l\"&gt;&lt;a href=\"reference/glossary.html#l\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;L&lt;/span&gt;&lt;/a&gt;L&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/lifo.html\"&gt;LIFO&lt;/a&gt; — Метод обработки очереди, при котором последняя поступившая задача берется в работу первой, что позволяет системе реагировать на самые…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/litereality-agent.html\"&gt;LiteReality-Agent&lt;/a&gt; — Агентная система, преобразующая RGB-D сканы помещений в интерактивные 3D-сцены через написание исполняемого Python-кода.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/llm-sudya.html\"&gt;LLM-судья&lt;/a&gt; — Использование языковых моделей для оценки качества генерации изображений на основе текстовых критериев, что заменяет дорогостоящую…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/logit-lens.html\"&gt;Logit lens&lt;/a&gt; — Метод анализа вероятностей токенов на различных слоях модели для отслеживания процесса формирования ответа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/low-rank-adaptation.html\"&gt;LoRA&lt;/a&gt; — LoRA (Low-Rank Adaptation) — метод эффективной настройки нейросетей, при котором обучается лишь малая часть весов, что экономит…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/local-real-task-agent-benchmark.html\"&gt;LRAB&lt;/a&gt; — Контролируемый эксперимент для оценки влияния среды исполнения на производительность малых языковых моделей при решении реальных задач.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"m1\"&gt;&lt;a href=\"reference/glossary.html#m1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;M&lt;/span&gt;&lt;/a&gt;M&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/messy-zaprosy.html\"&gt;Messy»-запросы&lt;/a&gt; — Искусственно созданные входные данные с грамматическими ошибками и нарушенной структурой для проверки того, насколько модель способна…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mimic-iv.html\"&gt;MIMIC-IV&lt;/a&gt; — База данных клинических показателей 2000 пациентов, использованная для оценки работы языковых моделей в реанимации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mingbird.html\"&gt;Mingbird&lt;/a&gt; — Локальный агентный фреймворк для Windows и Ollama, включающий механизмы защиты от типичных ошибок малых языковых моделей.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mujoco.html\"&gt;MuJoCo&lt;/a&gt; — Программная среда для физического моделирования, в которую экспортируются готовые 3D-сцены для симуляции.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/multi-lora.html\"&gt;Multi-LoRA&lt;/a&gt; — Метод эффективной настройки нейросетей, позволяющий запускать несколько специализированных адаптеров на одной базовой модели, что экономит…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"n1\"&gt;&lt;a href=\"reference/glossary.html#n1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;N&lt;/span&gt;&lt;/a&gt;N&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/near-miss-prompty.html\"&gt;Near-miss» промпты&lt;/a&gt; — Запросы, которые очень близки к целевым, но содержат незначительные отклонения, проверяющие устойчивость модели к ошибкам.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/nih-exporter.html\"&gt;NIH ExPORTER&lt;/a&gt; — База данных, содержащая сведения о названиях, аннотациях и бюджетах грантов, предоставляемых Национальными институтами здоровья США.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"p1\"&gt;&lt;a href=\"reference/glossary.html#p1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;P&lt;/span&gt;&lt;/a&gt;P&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/p-first.html\"&gt;P-first&lt;/a&gt; — Метрика уверенности модели при генерации начала ответа; значения близкие к 1 указывают на высокую степень детерминизма.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pangram-3-3-2.html\"&gt;Pangram 3.3.2&lt;/a&gt; — Специализированный классификатор с низким уровнем ошибок: ложноположительный результат составляет 0,05%, ложноотрицательный — 1,99%, что…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pass-1.html\"&gt;pass@1&lt;/a&gt; — Метрика, оценивающая долю задач, решенных верно с первой попытки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/personal-data-server.html\"&gt;PDS&lt;/a&gt; — Децентрализованный сервер, хранящий персональные данные пользователя, доступ к которым осуществляется через открытый протокол.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/projected-gradient-descent.html\"&gt;PGD-атака&lt;/a&gt; — Итеративный метод оптимизации, используемый для генерации состязательных возмущений путем минимизации функции потерь модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/position-bias.html\"&gt;Position bias&lt;/a&gt; — Склонность модели отдавать предпочтение определенному порядку расположения кандидатов, а не их фактическому качеству.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/pskip.html\"&gt;Pskip&lt;/a&gt; — Метрика, позволяющая оценить вероятность вызова инструмента моделью, игнорируя случайные пробелы или переносы строк, которые могут искажать…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"q\"&gt;&lt;a href=\"reference/glossary.html#q\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Q&lt;/span&gt;&lt;/a&gt;Q&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/quality-explanation-and-evaluation-network.html\"&gt;QUEEN&lt;/a&gt; — Архитектура типа «энкодер-декодер», сочетающая шахматный движок и языковую модель для генерации ходов и их текстовых обоснований.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/qwk.html\"&gt;QWK&lt;/a&gt; — Статистический показатель, оценивающий степень согласия между оценщиками, где значения выше 0.6 свидетельствуют о высокой надежности.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"r1\"&gt;&lt;a href=\"reference/glossary.html#r1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;R&lt;/span&gt;&lt;/a&gt;R&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/r.html\"&gt;r&lt;/a&gt; — Коэффициент соотношения ИИ-текста к человеческому тексту в обучающей выборке.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/retrieval-augmented-generation.html\"&gt;RAG&lt;/a&gt; — RAG (Retrieval-Augmented Generation) — это метод, при котором модель сначала находит информацию во внешних источниках, а затем формирует…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rcdc.html\"&gt;RCDC&lt;/a&gt; — Система автоматической классификации грантов NIH по более чем 300 категориям на основе анализа текста заявок.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/recast.html\"&gt;ReCast&lt;/a&gt; — Система защиты конфиденциальных данных, которая преобразует входные файлы в текстовый формат с подменой сущностей и значений для безопасной…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/regret.html\"&gt;Regret&lt;/a&gt; — Метрика, показывающая разницу между качеством выбранного моделью варианта и максимально возможным качеством в данном наборе.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/remhr.html\"&gt;REMHR&lt;/a&gt; — Категория, присваиваемая проектам, сфокусированным на здоровье меньшинств. Она исключает исследования, где раса или этническая…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/rgb-d-skany.html\"&gt;RGB-D сканы&lt;/a&gt; — Данные сканирования, содержащие информацию о цвете (RGB) и глубине (D) пространства, используемые для восстановления геометрии сцены.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/relative-human-action-efficiency.html\"&gt;RHAE&lt;/a&gt; — Показатель эффективности агента, где 100% означает равенство количества действий агента и человека, а значения выше 100% — более высокую…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/room-py.html\"&gt;Room.py&lt;/a&gt; — Исполняемый Python-файл, описывающий геометрию, физические свойства и пространственные связи объектов в 3D-сцене.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"s1\"&gt;&lt;a href=\"reference/glossary.html#s1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;S&lt;/span&gt;&lt;/a&gt;S&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/s-pubmedbert.html\"&gt;S-PubMedBERT&lt;/a&gt; — Модель для векторизации медицинских текстов, используемая для обеспечения точности сопоставления фактов с базой знаний.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sago.html\"&gt;SAGO&lt;/a&gt; — Фреймворк для оценки стабильности языковых моделей, который измеряет изменение поведения системы при семантически эквивалентных вариациях…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/scaffold.html\"&gt;Scaffold&lt;/a&gt; — Программная обвязка, которая помогает языковой модели взаимодействовать с операционной системой и инструментами.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secjev.html\"&gt;SecJev&lt;/a&gt; — Семейство специализированных моделей для принятия решений в кибербезопасности, использующих однопроходный скорер кандидатов вместо…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/secjev-corpus.html\"&gt;SecJev-Corpus&lt;/a&gt; — Набор данных для обучения и оценки моделей безопасности, включающий 170 185 вопросов из восьми различных источников.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/semhash.html\"&gt;SemHash&lt;/a&gt; — Фреймворк для дедупликации данных, использующий векторные представления записей для объединения семантически похожих примеров.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/sglang.html\"&gt;SGLang&lt;/a&gt; — Специализированный фреймворк для эффективного выполнения языковых моделей, оптимизирующий работу с памятью и скоростью генерации.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/stability-generalization-score.html\"&gt;SGS&lt;/a&gt; — Метрика, используемая для измерения степени отклонения поведения модели от идеального условия инвариантности ответов при вариациях ввода.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/simhash.html\"&gt;SimHash&lt;/a&gt; — Алгоритм хеширования, используемый в SSH для оценки семантической близости узлов дерева траекторий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/speculative-safety-honeypot.html\"&gt;Speculative Safety Honeypot&lt;/a&gt; — Фреймворк проактивной защиты ИИ-агентов, который имитирует будущее поведение системы с помощью малых языковых моделей для выявления и…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spp.html\"&gt;SPP&lt;/a&gt; — Метод тестирования, при котором модель получает одинаковый системный промпт для обоих вариантов ответа, что исключает возможность…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t\"&gt;&lt;a href=\"reference/glossary.html#t\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;T&lt;/span&gt;&lt;/a&gt;T&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/taliesin.html\"&gt;Taliesin&lt;/a&gt; — Компонент системы Galahad, отвечающий за сохранение и загрузку KV-состояния для блоков текста.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/tokens-per-parameter.html\"&gt;TPPh&lt;/a&gt; — Показатель насыщенности обучения, определяющий, сколько данных «видит» каждый параметр модели.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"v1\"&gt;&lt;a href=\"reference/glossary.html#v1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;V&lt;/span&gt;&lt;/a&gt;V&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/vendi-score.html\"&gt;Vendi Score&lt;/a&gt; — Метрика для оценки разнообразия ответов, основанная на измерении расстояния между эмбеддингами сгенерированных данных.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vida-geo.html\"&gt;VIDA-GEO&lt;/a&gt; — Мультиагентная система, использующая спутниковые и уличные снимки для генерации реалистичных визуальных правок городской инфраструктуры с…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/visual-harness-for-reasoning.html\"&gt;VISTA&lt;/a&gt; — Система-надстройка для мультимодальных моделей, обеспечивающая долгосрочную визуальную память без потерь для планирования действий.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/vision-language-models.html\"&gt;VLM&lt;/a&gt; — Зрительно-языковые модели (VLM) — это нейросети, способные одновременно анализировать изображения и текст для оценки визуального контента и…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"w\"&gt;&lt;a href=\"reference/glossary.html#w\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;W&lt;/span&gt;&lt;/a&gt;W&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/wall-clock-time.html\"&gt;Wall-clock time&lt;/a&gt; — Фактическое время, прошедшее с начала до конца выполнения задачи, включая все задержки системы.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/wildai.html\"&gt;WildAI&lt;/a&gt; — Корпус данных, состоящий из веб-контента, разделенного на человеческие тексты и тексты, сгенерированные искусственным интеллектом.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"a2\"&gt;&lt;a href=\"reference/glossary.html#a2\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Α&lt;/span&gt;&lt;/a&gt;Α&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/krippendorfa.html\"&gt;α Криппендорфа&lt;/a&gt; — Статистический показатель, оценивающий степень согласия между несколькими экспертами при классификации данных.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"zh\"&gt;&lt;a href=\"reference/glossary.html#zh\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ж&lt;/span&gt;&lt;/a&gt;Ж&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/greedy-decoding.html\"&gt;Жадная декодировка&lt;/a&gt; — Процесс генерации, при котором модель всегда выбирает токен с максимальной вероятностью, что обычно делает ответы детерминированными и…&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"z\"&gt;&lt;a href=\"reference/glossary.html#z\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;З&lt;/span&gt;&lt;/a&gt;З&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/knapsack-problem.html\"&gt;Задача о рюкзаке&lt;/a&gt; — Тестовая задача, структура ответа в которой позволяет модели легко встраивать и прятать данные для скрытых вычислений.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/zakon-masshtabirovaniya-chinchilla.html\"&gt;Закон масштабирования Chinchilla&lt;/a&gt; — Математическая модель, определяющая оптимальное соотношение количества параметров нейросети и объема обучающих данных для минимизации…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/anchoring.html\"&gt;Закрепление&lt;/a&gt; — Метод удержания контекста путем принудительного повторения системных инструкций в каждом запросе к модели.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/mirroring.html\"&gt;Зеркалирование&lt;/a&gt; — Склонность модели копировать стиль или структуру входного запроса, даже если это не требуется для сути ответа.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/response-mirroring.html\"&gt;Зеркальное отражение ответов&lt;/a&gt; — Степень отражения моделью регистра или стиля входного запроса, которая может проявляться как непреднамеренная нестабильность при…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/probes.html\"&gt;Зонды&lt;/a&gt; — Дополнительный классификатор, анализирующий внутренние состояния нейросети для определения правдивости её ответов.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/probing.html\"&gt;Зондирование&lt;/a&gt; — Метод анализа внутренних состояний нейросети, при котором обучается простой классификатор для предсказания конкретной информации (например…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/first-token-probing.html\"&gt;Зондирование первого токена&lt;/a&gt; — Диагностический метод оценки априорной вероятности генерации моделью специального токена вызова инструмента в нужной позиции.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"l1\"&gt;&lt;a href=\"reference/glossary.html#l1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Л&lt;/span&gt;&lt;/a&gt;Л&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/paternalism-trap.html\"&gt;Ловушка патернализма&lt;/a&gt; — Состояние модели, при котором она в попытке быть объективной становится холодной, отстраненной и игнорирует эмоциональный контекст…&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"concepts/spurious-correlation.html\"&gt;Ложная корреляция&lt;/a&gt; — Статистическая связь между истинностью ответа и побочными факторами, такими как стиль речи или точность выполнения инструкций.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"t1\"&gt;&lt;a href=\"reference/glossary.html#t1\" class=\"yfm-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Т&lt;/span&gt;&lt;/a&gt;Т&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"concepts/word-targeting.html\"&gt;Таргетирование слов&lt;/a&gt; — Механизм удаления опр
